 wg_rbq_dragon_allow_triggers.b:0 "Здоровье Юкикадзэ не должно быть низким"
 wg_rbq_dragon_army:0 "Вельветовый шарик"
 wg_rbq_dragon_army_desc:0 "Спускать дракона безнаказанно крушить землю — плохая идея…"
