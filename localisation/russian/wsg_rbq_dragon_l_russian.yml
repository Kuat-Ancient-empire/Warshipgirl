 wg_yukikaze_recover_cd:0 "Юкикадзэ восстанавливается"
 wg_yukikaze_recover_cd_desc:0 "До возвращения этого вельветового шарика трепаться в чате — КД ("
 already_has_wg_yukikaze_diplo:0 "Окно связи с Юкикадзэ уже открыто"
 wg_yukikaze_to_warship:0 "Помогите нашему флоту"
 wg_yukikaze_to_army:0 "Помогите нашим войскам"
 talk_to_wg_yukikaze:0 "Поболтать с Юкикадзэ"
 marry_wg_yukikaze:0 "Выходи за меня, Юкикадзэ!"
 wg_yukikaze.1.title:0 "Модификация завершена"
 wg_yukikaze.1.desc:0 "Операция дракона Юкикадзэ прошла успешно — теперь она одна из [root.GetSpeciesNamePlural]!\n\n§HКнопка связи с Юкикадзэ — в указе «Комплексное меню WG», справа (иконка водопроводного крана)§!"
 wg_yukikaze.100.desc:0 "Ради вас и всех — Юкикадзэ будет меняться. С той секунды, как я вошла в этот Порт… Юкикадзэ… так думала. Пришло время поднять голову и встретить это."
 wg_yukikaze.101.desc:0 "Адмирал… вы так устали…"
 wg_yukikaze.200.desc:0 "— Ради прекрасного будущего — вперёд!"
 wg_yukikaze.201.desc:0 "Какую тренировку развернём теперь?"
 wg_yukikaze.202.desc:0 "Не волнуйтесь: задание выполнено без сучка и задоринки."
 wg_yukikaze.203.desc:0 "Сопровождать всех — это Юкикадзэ по силам! На… верное…………"
 wg_yukikaze.300.desc:0 "Юкикадзэ всех защитит."
 wg_yukikaze.301.desc:0 "Быть может, эта сила ещё невелика — но я сделаю всё, чтобы стать опорой для всех. Иной раз… может и не хватать сил — но я не сдамся. Я больше никогда не отступлю."
 wg_yukikaze.302.desc:0 "Держимся, все! Я всех защищу."
 wg_yukikaze.303.desc:0 "Всегда сопровождавшая меня «удача», кажется, исчезла. Скорее — освободилась… Она всегда берегла меня; теперь моя очередь беречь всех — вот путь, по которому мне суждено идти."
 wg_yukikaze.1001.desc:0 "Мм… если освою это — точно смогу помочь всем… А, ад… адмирал, почему вы так поздно… То… может, попробуете? Это… рем… ремонтный инструмент…………"
 wg_yukikaze.1002.desc:0 "Давненько я так не глядела на звёзды………… Люди так малы — будто песчинка, которую вот-вот сдует. Но пока мы вместе — нас не победить. Почему вы смеётесь? Я сказала что-то странное?"
 wg_yukikaze.1003.desc:0 "Если бы я могла разделить свою удачу с адмиралом… тогда — точно — я была бы вам полезна."
 wg_yukikaze.1011.desc:0 "Ад… адмирал, если не против — вот печенье, которое я сделала… По… пожалуйста, возьмите!"
 wg_yukikaze.1012.desc:0 "Ночью… каждая яркая звезда — неповторимый пейзаж. Желания, загаданные звёздам, будто вот-вот сбудутся… Ради этого Порта под звёздами Юкикадзэ… Юкикадзэ станет сильнее — оберегать вас и всех…………‌"
 wg_yukikaze.1013.desc:0 "Если бы Юкикадзэ могла разделить свою удачу с адмиралом и всеми… этот Порт стал бы ещё прекраснее. Юкикадзэ… будет всегда рядом — и мы вместе превратим мечты друг друга в явь…………"
 wg_yukikaze.1021.desc:0 "Иногда мне всё ещё страшно………… Но стоит вспомнить вас, вспомнить всех — и тревога тает. Я не одна: с вашей поддержкой и поддержкой всех — я не боюсь ничего."
 wg_yukikaze.1022.desc:0 "Мне приснился сон………… во сне я не вернулась………… так страшно, когда нет вас и всех………… я снова стану, как прежде………… Да. Это был лишь сон. Здесь — реальность: место, где я по-настоящему дома."
 wg_yukikaze.1023.desc:0 "Э? Юки… Юкикадзэ не бравирует! Убеждение, что долго жило в сердце… это вы, адмирал, дали мне смелость сказать его вслух."
 wg_yukikaze.401.desc:0 "Не… не подходите!"
 wg_yukikaze.402.desc:0 "Аварийный ремонт………… сейчас готово!"
 wg_yukikaze.501.desc:0 "А, здравствуйте. Да — я вернулась."
 wg_yukikaze.501.tooltip:0 "Юкикадзэ восстановилась и готова к вылету."
 wg_yukikaze.601.desc:0 "С Юкикадзэ… всё будет хорошо…………"
 wg_yukikaze.601.tooltip:0 "Юкикадзэ тяжело повреждена — нужно время"
 wg_yukikaze.999.desc:0 "Пусть я буду звездой, а вы — луной: ночь за ночью светясь, друг друга озаряем."
 return_wg_yukikaze_interface:0 "Назад"
 wg_yukikaze_exit:0 "Ничего"
 wg_yukikaze_recover_cd:0 "Юкикадзэ восстанавливается"
