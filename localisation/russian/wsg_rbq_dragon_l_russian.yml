 wg_yukikaze_affection_lv5_desc:0 "$affection_lv5$\nТекущий эффект: $immune_negative_trait$"
 wsg_rbqdragon_desc:0 "Сэмпай — 24, и Снежная — 24; Сэмпай громко кричит, когда его нюхают, — и Снежная громко кричит; Сэмпай живёт в Симокитакаве — сразу слышно, что там много воды, — и Снежная живёт в системе с очень большой водой; дальше забыла. Тезис «Снежная — дикий сэмпай» считаю доказанным (большой свист)"
 wg_yukikaze.10001.name:0 "Затопленные ресурсы"
 wg_yukikaze.10001.desc:0 "По докладу терраформеров на §Y[from.GetName]§!, на дне её океана найдены словно бы залитые водой ресурсы. Отправим людей обследовать — вдруг найдём что-то ещё."
 wg_yukikaze.10001.b:0 "Нам недосуг заниматься мелочами"
 explore_waterb_planet:0 "Обследование затопленных ресурсов"
 explore_waterb_planet_DESC:0 "На дне этой планеты, похоже, есть залитые водой ресурсы. Отправим людей обследовать — вдруг найдём что-то ещё."
 wg_yukikaze.10002.name:0 "Затопленная газовая скважина"
 wg_yukikaze.10002.desc:0 "По аномальным данным терраформеров учёные мигом нашли затопленную газовую скважину. Её пробурила местная цивилизация, но внезапные ливни залили её, а давление перемололо в щебень — остался лишь памятник выработки. Наши инженеры выжмут из неё что-нибудь полезное."
 wg_yukikaze.10003.name:0 "Затопленный пороховой рудник"
 wg_yukikaze.10003.desc:0 "По аномальным данным терраформеров учёные мигом нашли затопленный рудник взрывного пороха. Его прорыла местная цивилизация, но внезапные ливни залили его, а давление перемололо в щебень — остался лишь памятник выработки. Инженеры добудут пороха."
 wg_yukikaze.10004.name:0 "Затопленные здания"
 wg_yukikaze.10004.desc:0 "По аномальным данным терраформеров учёные мигом нашли подводный город. Ясно: планета растила разумных и выстроила цивилизацию — теперь всё под водой, остались лишь кое-как развалившиеся дома. Дальше — дело археологов."
 wg_yukikaze.10005.name:0 "Склад Судного дня"
 wg_yukikaze.10005.desc:0 "По аномальным данным терраформеров учёные нашли склад с горой ресурсов. Он вырублен в горе и запрятан — теперь, правда, залит. Похоже, туземцы готовили его на случай внезапной беды. Увы, воспользоваться им так и не довелось."
 wg_yukikaze.10005.a:0 "Отлично — теперь сокровища наши."
 wg_yukikaze.10005.b:0 "Пусть лежит там и дальше"
