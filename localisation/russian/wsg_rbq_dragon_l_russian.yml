 leader_trait_admiral_wg_rbq_dragon:0 "Вельветовый шарик Юкикадзэ"
 leader_trait_admiral_wg_rbq_dragon_desc:0 "Хм-хм-хм — (данные удалены)"
 leader_trait_admiral_wg_yukikaze_affection:0 "Привязанность"
 leader_trait_admiral_wg_yukikaze_affection_desc:0 "Привязанность растёт, если§Y Юкикадзэ сражается§!. Каждая§Y победа в бою§! — высокий шанс роста. (Полив планет водой тоже вроде добавляет?)"
