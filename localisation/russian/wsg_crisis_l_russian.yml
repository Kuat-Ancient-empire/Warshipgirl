 leader_trait_admiral_resistant_fleet:0 "Старшина Сопротивления"
 leader_trait_admiral_resistant_fleet_desc:0 "Эти многообещающие новички выпустились из военной академии уже довольно давно и вполне справляются с обычной войсковой командной работой"
 leader_trait_admiral_resistant_fleet2:0 "Командир армии Сопротивления"
 leader_trait_admiral_resistant_fleet2_desc:0 "Командиры армии Сопротивления — элита, выделившаяся в сотнях больших и малых сражений: они умеют уцелеть под чудовищным натиском Объединённого флота и в итоге одержать верх."
 leader_trait_admiral_resistant_fleet3:0 "Командующая Сопротивления"
 leader_trait_admiral_resistant_fleet3_desc:0 "Командующие — опора Сопротивления, без которой ему не выстоять: перед ними были десятки безнадёжных ситуаций, и ни в одной они не дрогнули. Само их присутствие — сердце и дух армии Сопротивления."
 leader_trait_admiral_resistant_fleet4:0 "Герой Сопротивления"
 leader_trait_admiral_resistant_fleet4_desc:0 "За долгие годы существования Сопротивления она прошла несчётные бои не на жизнь, а на смерть и вырвалась живой из десятков мясорубок. Она — командующая, которой восторгается вся армия; во всём Сопротивлении никто не знает сильные и слабые стороны Объединённого флота лучше неё — потому её тактики против Объединения вошли в наставления как учебный материал."
 wg_crisis.23332.name:0 "Кредит Палпатина"
 wg_crisis.23332.desc:0 "Наш союзник из иного мира, император Палпатин, недавно впал в финансовый кризис: построенная им в кредит «Звезда Смерти» была взорвана раньше, чем он успел погасить за неё заём. Теперь он готов подарить нам один «Палач», чтобы поправить свои дела, — нам остаётся лишь платить за его обслуживание."
 wg_crisis.23332.a:0 "Да-да-да, этот корабль мы берём"
 wg_crisis.23332.b:0 "Такое обслуживание…… нам тоже не по карману!"
 wg_crisis.23333.name:0 "Прибытие «Палача»"
 wg_crisis.23333.desc:0 "Суперзвёздный разрушитель класса «Палач» прибыл к нашей столице. В знак искренности император Палпатин даже снял с другого «Палача» отклоняющие щиты, усиливавшие защиту мостика, и перенёс их на этот.\n\nБез всяких сомнений, такой суперкорабль станет одной из наших главных сил — если только мы потянем его запредельное обслуживание."
 wg_crisis.23333.a:0 "Гляньте на мостик — большой да круглый……"
 wg_crisis.23335.name:0 "Буря покрупнее"
 wg_crisis.23335.desc:0 "Расцвет и упадок империй неизбежны — но у сил, что считают галактику своей игровой площадкой, возможности, похоже, далеко превосходят наше воображение. Их союз навеки будет парить над всем сущим."
 wg_crisis.23335.a:0 "Об этой вселенной мы знаем всё ещё слишком мало"
 wg_crisis.23335.a.tooltip:0 "§HОбъединённый флот§Y союзится с§R Вечным кризисом§Y!"
 wg_crisis.23335.b:0 "Какая чушь"
 wg_crisis.23335.b.tooltip:0 "§HОбъединённый флот§Y не будет союзником§R Вечного кризиса§Y!"
 wg_crisis.82.name:0 "§RСистема уничтожена! §!"
 wg_crisis.82.desc:0 "Сегодня пришло, возможно, самое скорбное известие со времён вторжения Объединённого флота…… Наша колония в системе §H[uf_destroyed_system.GetName]§! — §H[uf_destroyed_planet.GetName]§! — полностью стёрта противозвёздным оружием Объединённого флота…… От системы §H[uf_destroyed_system.GetName]§! осталась лишь одинокая чёрная дыра. $wg_crisis.82.desc_explain$"
 wg_crisis.82.desc.b:0 "Только что наша колония в системе §H[uf_destroyed_system.GetName]§! — §H[uf_destroyed_planet.GetName]§! — была сметена объединённым звездорушителем вместе со всей системой! Мы должны как можно скорее уничтожить это ужасное оружие — иначе оно сотрёт ещё много систем!"
 wg_crisis.83.desc:0 "$wg_crisis.83.desc.b$$wg_crisis.82.desc_explain$"
 wg_crisis.83.desc.b:0 "Недавно из системы §H[uf_destroyed_system.GetName]§! пришёл мощный энергетический сигнал: похоже, систему §H[uf_destroyed_system.GetName]§! взорвал объединённый звездорушитель."
 wg_crisis.82.desc_explain:0 "\n\nПо нашим наблюдениям, противозвёздное оружие Объединения использует гравитационный манипулятор, вызывающий вспышку сверхновой: звезда обращается в чёрную дыру, а всё содержимое системы стирается — при этом эскорт и сама платформа оружия остаются невредимы.\nНаши военные эксперты указывают: §Rлюбая попытка помешать объединённому звездорушителю в момент залпа крайне опасна§! — лучший момент уничтожить его — на переходе.\n\nСледует как можно скорее уничтожить все существующие объединённые звездорушители, устранив эти тяжёлые скрытые угрозы."
 wg_crisis.83.a:0 "Уже знаю — больше можно не сообщать."
 uf_colossus_chain_title:0 "Объединённый звездорушитель"
 uf_colossus_chain_desc:0 "Среди вторгшегося Объединённого флота появились платформы, несущие оружие, способное взрывать звёзды. Это противозвёздное оружие, похоже, использует гравитационный манипулятор, вызывающий вспышку сверхновой: звезда обращается в чёрную дыру, а всё содержимое системы стирается — при этом эскорт и сама платформа остаются невредимы.\n\nСледует как можно скорее уничтожить все существующие объединённые звездорушители, устранив эти тяжёлые скрытые угрозы."
 exists_uf_colossus:0 "Действующие объединённые звездорушители"
 uf_colossus_destroys_stars:0 "Системы, уничтоженные объединёнными звездорушителями"
 wg_crisis.88.name:0 "Объединённый звездорушитель уничтожен"
 wg_crisis.88.desc:0 "В недавнем бою наш доблестный флот уничтожил объединённый звездорушитель — теперь это ужасное оружие больше не выстрелит. Но пока не разрушены все порталы Объединения, сюда будут прибывать всё новые звездорушители — а значит, гибнуть всё новые живые существа! Нам следует окончательно отбросить Объединённый флот и разрушить их порталы!"
 wg_crisis.88.desc.b:0 "Недавно §H[uf_colossus_destroyer.GetName]§! доложила, что уничтожила объединённый звездорушитель — теперь это ужасное оружие больше не будет творить зло."
 wg_crisis.89.name:0 "Объединённый звездорушитель стирает наши системы!"
 wg_crisis.89.desc:0 "Зонды в системе §H[uf_colossus_arrived_system.GetName]§! зафиксировали энергетическую сигнатуру подготовки объединённого звездорушителя к залпу противозвёздным оружием — и того хуже: в этой системе есть наша колония!\n§RМы обязаны как можно скорее уничтожить этот объединённый звездорушитель — иначе система и колония погибнут вместе со звездой! §!"
 wg_crisis.10010.name:0 "§HКонтроллер метасюжета§!"
 wg_hidden_window:0 "§BOVO OVO OVO OVO OVO OVO OVO OVO\nOVO§! Вы, кажется, открыли окно, которое открывать не следовало§B OVO\nOVO OVO OVO OVO OVO OVO OVO OVO§!"
 wg_crisis.10010.a:0 "(Старая) регулировка сложности"
