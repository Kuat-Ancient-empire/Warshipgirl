 enable_join_cts:0 "§GВключить§! автоматическую ассимиляцию населения"
 enable_join_cts_tooltip:0 "С включённой опцией население, отвечающее условиям ниже, будет автоматически превращаться в население основной расы вашей державы:\n · не корабли-девы и не Глубинные\n · не GALO\n · без черты $trait_wg_sunflower$\n · без черт звёздных дев"
 enable_join_cts_tooltip2:0 "Ради вашего CPU: после включения §Hпереработка ограничена 1 населением в день§!, а проверка выполняется раз в месяц.\nПосле включения в этом меню можно выбрать §Hавтоматически ассимилировать всё население§! — разовую переработку всех.\nВключив функцию, вы также найдёте на планетах решение «§HСтать монстродевой§!» для ассимиляции населения"
 join_cts_all:0 "Автоматически ассимилировать всё население"
 join_cts_all_tooltip:0 "§RПредупреждение для CPU§!: эта функция может вызвать жуткие лаги!\nНажмите, чтобы разом превратить всё не-корабли-девское население в население кораблей-дев"
 disable_join_cts:0 "§RОтключить§! автоматическую ассимиляцию населения"
 decision_planet_join_cts:0 "Стать монстродевой"
 decision_planet_join_cts_desc:0 "Едой и уговорами зазываем пришельцев в монстродевы — достаточно простого, хоть и слегка болезненного преобразования тела."
 decision_planet_join_cts_desc2:0 "Эффект:\nПревращает население, отвечающее условиям ниже, в население основной расы вашей державы:\n · не корабли-девы и не Глубинные\n · не GALO\n · без черты $trait_wg_sunflower$\n · без черт звёздных дев"
 uf_cheat_station:0 "Призвать особые корабли мода"
 uf_cheat_station_tooltip:0 "§YПостройте на столице особый пункт доступа — через него можно призвать любые корабли из мода, включая скрытые§!"
 wg_uf_cheat_station_modifier:0 "Сверхмерная мощь, явись!"
 wg_uf_cheat_station_modifier_desc:0 "Чит успешно включён: сверхмерная мощь игрока немедленно взметнулась, вздулась и взорвалась! Убивать-убивать-убивать! Нынешний боевой дух игрока в пятьдесят раз превыше любого былого! Невиданный кураж! Невиданное неистовство!.. Перед столь дивным демоном — что ещё устоит в этом мире? ТМД! Да что вообще способно устоять в этом мире?!"
 sc_uf_end:0 "Сверхмерное светило"
 pc_uf_end_star:0 "Сверхмерное светило"
 pc_uf_end_star_desc:0 "Небесное тело, которое Объединённый флот оставляет после стирания вселенной этого плана: оно испускает страшное сверхмерное поле, уничтожающее всё в радиусе действия и навеки лишающее этот край шанса возрождения.\nОно же служит Объединённому флоту наблюдательным постом, засекающим любые аномалии."
 pc_uf_end_planet:0 "Сверхмерное светило"
 pc_uf_end_planet_desc:0 "Прежние планеты стёрты подчистую — остались лишь эти малые сверхмерные светила."
 sc_uf_hm:0 "Сверхмерная новая"
 pc_uf_hm:0 "Сверхмерная новая"
 pc_uf_hm_desc:0 "Море сверхмерного вещества было собрано Мечом Объединения и обрушено сюда, уничтожив всё в системе; из оставшихся сгустков сверхмерного вещества и возник этот аномальный объект."
