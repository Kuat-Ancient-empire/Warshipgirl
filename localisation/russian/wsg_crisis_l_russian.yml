 wg_crisis.24.a:0 "Оплатим всё разом — новые корабли на вас."
 wg_crisis.24.a.response:0 "Хорошо, мы управимся с постройкой за четыре месяца — удачи на фронтах!"
 wg_crisis.24.b:0 "Можно оплатить в рассрочку?"
 wg_crisis.24.c:0 "Увы, у нас туго с ресурсами — как-нибудь в следующий раз."
 build_cost_wg:0 "Чтобы построить флот, способный противостоять объединённым кораблям-девам, изготовление обойдётся минимум в… мм, в память о соотечественницах сделаем скидочку: [root.ra_fleet_alloys_cost] £alloys£ сплавов и [root.ra_fleet_energy_cost] £energy£ энергокредитов, а ещё [root.ra_fleet_sr_pantsu_cost] штук.. £sr_pantsu£ панталончиков! Мы принимаем и оплату в рассрочку, но это удлинит сроки поставки — подойдёт ли вам это?"
 wg_crisis.24.desc.b.easy:0 "$build_cost_wg$"
