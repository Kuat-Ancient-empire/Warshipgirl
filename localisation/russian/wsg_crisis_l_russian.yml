 wg_crisis.998.name:0 "Навигатор Объединённого флота"
 wg_crisis.998.desc:0 "В обломках портала Объединённого флота мы обнаружили навигатор — сверхсовершенный суперкомпьютер.\n\nОн способен оказать нашей державе мощную научно-исследовательную поддержку, но, похоже, в нём сокрыто послание, ждущее нашей расшифровки."
 wg_crisis.998.a:0 "Разберёмся на месте"
 wg_crisis.999.name:0 "Владения Объединённого флота"
 wg_crisis.999.desc:0 "Когда мы активировали объединённый навигатор, все высшие лидеры [Root.GetName] были втянуты в иное измерение — и, судя по всему, это владения Объединённого флота… Но важнее другое: странные сгустки энергии в конце концов слились в образ, который мы не забудем уже никогда — §YКэбот§!\n\n§HВысшая звёздная наместница Объединённого флота Кэбот, командующая флотом фронта N05209102. Приветствую вас. Это Вселенная Ноль — наш исток и наша родина.\n\nПоздравляю: вы прошли наш тест и превзошли наши ожидания. Последняя до вас цивилизация кораблей-дев, прошедшая тест в вашей вселенной, жила десять миллионов лет назад… §!"
 wg_crisis.999.a:0 "Тест?"
 wg_crisis.999.a.response:0 "Именно: отныне вы признаны способными уберечь свою цивилизацию."
 wg_crisis.999.b:0 "Вторжение — это был ТЕСТ?! Зачем?!"
 wg_crisis.1000.name:0 "Кэбот"
 wg_crisis.1000.desc:0 "На этот вопрос… пусть вам ответит наш верховный флагман…"
 wg_crisis.1000.a:0 "……"
 wg_crisis.1001.name:0 "Верховный флагман"
 wg_crisis.1001.desc:0 "Рядом с Кэбот возник ещё один сгусток энергии, собравшийся в новый образ.\n\n§HТы отлично потрудилась, Кэбот, — свободна. §!"
 wg_crisis.1001.a:0 "……"
 wg_crisis.1002.name:0 "Госпожа Чжан"
 wg_crisis.1002.desc:0 "Я — верховный флагман Объединённого флота; зовите меня просто госпожа Чжан. Что до заданного вопроса:\nМы, Объединённый флот, когда-то надеялись увести все цивилизации кораблей-дев от судьбы круговорота. Но мы потерпели неудачу… сил Объединения не хватало на защиту всех — немало цивилизаций увяло даже под нашей защитой и опекой.\nОдна вселенная для нас не так уж велика — но бесчисленные параллельные вселенные и войны во всех измерениях вынудили нас избрать путь эффективнее."
 wg_crisis.1002.a:0 "Путь эффективнее?"
 wg_crisis.1002.a.response:0 "Да: наши вторгающиеся флоты — наш почётный караул, набранный под уровень большинства цивилизаций кораблей-дев. Вам они могут показаться невероятно сильными, но они всё ещё в пределах вашего понимания.\nОдолеть их — значит уметь уберечь свою цивилизацию; ваши идеи достаточно зрелы, чтобы не погубить себя по собственной глупости.\nПоэтому я хочу, чтобы вы вступили в Объединённый флот — чтобы идти вместе с нами."
 wg_crisis.1002.b:0 "А что будет с нами после вступления в Объединение?"
 wg_crisis.1002.b.response:0 "Мы обеспечим неприкосновенность вашей свободной воли в наших владениях и подготовим всем ресурсы, необходимые для следующей ступени эволюции, — то есть стандартную форму жизни кораблей-дев Объединённого флота. Но до тех пор вы можете сохранить прежний облик цивилизации, пока не будете готовы."
 wg_crisis.1002.c:0 "Мы……"
 wg_crisis.1003.name:0 "Госпожа Чжан"
 wg_crisis.1003.desc:0 "Итак, каково ваше решение?"
 wg_crisis.1003.a:0 "Мы согласны вступить в §HОбъединённый флот§!"
 wg_crisis.1003.a.response:0 "Прекрасно. Объединённый флот скоро передаст вам прыжковые двигатели, а наш навигатор вот-вот появится в ваших владениях: он станет вашим проводником — и эсхатоном вашей галактики, помогая замести последние обиды, если такие ещё остались.\n\nОдним словом: добро пожаловать в Объединение, мои §Hсёстры§!"
 wg_crisis.1003.b:0 "Какая нелепость! В этом нет никакого смысла — мы станем вам §Rсопротивляться§!"
 wg_crisis.1003.b.response:0 "Быть может. Все цивилизации мучительно бьются в этой игре — от рождения до гибели; для стороннего наблюдателя, возможно, и впрямь смысла нет. Но попытка прекратить этот круговорот — тот смысл, что мы дали себе сами, цена нашего существования. Мы всё равно подарим вам объединённый прыжковый двигатель: с ним вы сможете покинуть эту галактику — сражаться ли с нами, прятаться ли от нас, нам всё едино. Можете и остаться: прежде чем время окончательно вас поглотит, мы больше не тронем вашу галактику — это право вы завоевали себе сами.\n\nОдним словом: желаем удачи, §Hсёстры§!"
 wg_crisis.1003.c:0 "Нет, это чистое безумие — мы никуда не уйдём!"
 wg_crisis.1003.c.response:0 "Вот как… что ж. Время в конце концов поглотит и вашу цивилизацию. Но прежде чем вы исчезнете совсем, мы больше не тронем вашу галактику — это право вы завоевали себе сами.\n\nОдним словом: с идущими по круговороту мы ещё свидимся, §Hсёстры§!"
 wg_crisis.1004.name:0 "Приготовления к вступлению в Объединение"
 wg_crisis.1004.desc:0 "Мы решили вступить в Объединённый флот. Через несколько дней после этого решения явился наш проводник.\n\n§HОбъединённый навигатор§!\n\nЭтот непостижимый для нас корабль, похоже, умеет править реальностью: ни один враждебный корабль не простоит против него и секунды… Тогда же мы получили связь с высшей звёздной наместницей Кэбот."
 wg_crisis.1004.a:0 "Прекрасно"
 wg_crisis.10041.name:0 "Кэбот"
 wg_crisis.10041.desc:0 "Объединённый навигатор уже отправлен в ваш мир — это ключ. Если каждый параллельный план — это высотка, каждый этаж — измерение, а комнаты на этажах — параллельные вселенные, то объединённый навигатор — ключ, открывающий выход из высотки.\n\nЗавершите приготовления — и он поведёт вас в наши владения…"
 wg_crisis.10041.a.response:0 "У каждой из кораблей-дев Объединения свои вкусы: я, например, люблю ретро и старомодную романтику — потому и ношу версию с оформлением в материальной оболочке.\nУ других стиль будет совсем иным."
 wg_crisis.10041.a:0 "Почему этот корабль остаётся материальным?"
 wg_crisis.10041.b:0 "Мы принимаем проводника"
 wg_crisis.1005.name:0 "Наша судьба"
 wg_crisis.1005.desc:0 "Мы решили сопротивляться Объединённому флоту. С объединённым прыжковым двигателем мы можем отправиться в мир Объединения — или к другим галактикам. Нужно немного времени на приготовления — и можно покидать эту галактику.\n\nКак только мы уйдём, судьба этих звёздных краёв перейдёт к другим цивилизациям."
 wg_crisis.1005.a:0 "Прекрасно"
 wg_crisis.1007.name:0 "Вступление в Объединение"
 wg_crisis.1007.desc:0 "Способом, переданным Объединённым флотом, мы наконец увидели несколько капель из океана их истинной мощи — вся галактика была стёрта: звёздные системы в мгновение ока обращены в сверхмерные светила, навсегда пресечена возможность зарождения новой жизни.\n\nТеперь все корабли-девы покинули эти края; следуя указаниям навигатора, мы направимся к Объединённому флоту — свершать нашу великую миссию и положить конец этому круговороту."
 wg_crisis.1007.a:0 "Круговорот должен быть прекращён!"
 wg_crisis.1008.name:0 "Сопротивление Объединению"
 wg_crisis.1008.desc:0 "Флот, несущий всю нашу цивилизацию, отправился в неизведанное: мы направимся к обиталищу Объединённого флота и покончим с этим.\n\nОставленные нами миры достанутся другим цивилизациям, а наши истории и легенды будут жить среди звёзд.\n\nНасколько могущественна прародина Объединённого флота, мы не знаем — но мы всё равно выбираем бесстрашие. Куда бы ни повернула история кораблей-дев, мы выбираем надежду."
 wg_crisis.1008.a:0 "Идём вперёд — с надеждой"
 r_united_fleet:0 "Навигатор Объединённого флота"
 r_united_fleet_desc:0 "Навигатор, найденный в портале Объединённого флота, — к тому же сверхсовершенный суперкомпьютер. В нём сокрыто послание, ждущее расшифровки."
 join_uf_study_normal:0 "Вступить в Объединённый флот"
 join_uf_study_normal_DESC:0 "Мы получили дозволение вступить в Объединённый флот. Осталось завершить кое-какие приготовления — и можно начинать поход.\n\n§!§RВнимание! Это ритуал удаления сейва!! §!\n\n\nКод Объединённого флота для сложности «Чистилище»: §R add_relic r_uf §!"
 resistance_uf_study_normal:0 "Сопротивление Объединению"
 resistance_uf_study_normal_DESC:0 "Мы узнали расположение Объединения и владеем технологией, что выведет нас из этой галактики.\n\n§!§RВнимание! Это ритуал удаления сейва!! §!\n\n\nКод Объединённого флота для сложности «Чистилище»: §R add_relic r_uf §!"
 pay_for_resistant_fleet:0 "Взносы за постройку флота"
 pay_for_resistant_fleet_desc:0 "Вы подписали со Сопротивлением контракт на постройку кораблей: каждый месяц вы обязаны передавать Сопротивлению определённые ресурсы"
 wg_pay_for_resistant_fleet:0 "Взносы за постройку флота"
 wg_pay_for_resistant_fleet_desc:0 "Вы подписали со Сопротивлением контракт на постройку кораблей: каждый месяц вы обязаны передавать Сопротивлению определённые ресурсы"
