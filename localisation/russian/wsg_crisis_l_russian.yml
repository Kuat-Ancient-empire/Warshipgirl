l_russian:

 wg_crisis.2.name:0 "Исчезающие галактики"
 wg_crisis.2.desc:0 "Мы уже великая межзвёздная держава, но происходящее за пределами нашей галактики мало кого волнует. Однако вчера наши астрономы обнаружили, что галактика Амацукадзэ-IV в 60 миллионах световых лет от нас исчезла в одно мгновение… Сверка со старыми звёздными картами показала: почти в тот же миг исчезли и другие галактики. Даже могущественный эфирный двигатель не в силах мгновенно уничтожить столько галактик разом. Учёные не могут объяснить случившееся — всё астрономическое сообщество охватило тревожное напряжение."
 wg_crisis.2.a:0 "И впрямь тревожная новость."
 wg_crisis.5.name:0 "Мы из другого измерения"
 wg_crisis.5.desc:0 "В системе [first_portal_system.GetName] возник гигантский пространственный разлом! Похоже, это односторонний портал из иного измерения. Из него хлынули массы кораблей, очень напоминающих корабли, построенные кораблями-девами, и принялись атаковать и крушить всё на своём пути. Всё это предвещает большое наступление. Мы перехватили сигналы, которые эти корабли отправляют на другую сторону портала, — и, что странно, они используют каналы связи, похожие на наши."
 wg_crisis.5.a:0 "Что это такое?"
 wg_crisis.5.b:0 "Как бы то ни было — отбить их"
 wg_crisis.6.name:0 "Энергетическая флуктуация в системе"
 wg_crisis.6.desc:0 " Все приборы [Root.GetName] внезапно разом засекли гигантский подпространственный энергетический всплеск, источник которого — в нашей системе. Учёные затрудняются объяснить причину: подобный феномен не встречался никогда. Точное положение источника пока неясно, мы продолжаем анализ имеющихся данных."
 wg_crisis.6.a:0 "Продолжайте расследование."
 wg_crisis.7.desc:0 "Мы подтвердили: гигантская энергетическая волна исходила из огромного подпространственного разлома в системе [first_portal_system.GetName]. Из портала хлынули странные корабли. По поступающим донесениям, они атакуют всё, что попадается на глаза. Мы перехватили сигналы, которые эти корабли отправляют на другую сторону портала."
 wg_crisis.8.name:0 "Перехваченный сигнал"
 wg_crisis.8.desc:0 "Новая галактика достигнута…… протокол запущен……"
 wg_crisis.8.a:0 "Кто они вообще такие?"
 wg_crisis.8.b:0 "Неужели они и правда — это мы?"
 wg_crisis.8.c:0 "Похоже, у нас большие неприятности……"
 wg_crisis.8.d:0 "Привет"
 wg_crisis.8_01.desc:0 "Кажется, мы попали в удивительное место — но ничего страшного, получайте удовольствие."
 wg_crisis.8_02.desc:0 "Здравствуйте, корабли-девы ада. Корабль утонул — беги пораньше и не воюй там, где не победить. Ах вы, бедные корабли-девы ада, — мы пришли вас спасать."
 wg_crisis.10.name:0 " Гибель колонии [Root.GetName]"
 wg_crisis.10.desc:0 "Под интенсивными орбитальными бомбардировками Объединённого флота [Root.GetName] полностью уничтожен — выживших на этой колонии быть не может."
 wg_crisis.10.a:0 "Мы должны остановить их любой ценой!"
 wg_crisis.12.name:0 "Уничтожен портал Объединённого флота"
 wg_crisis.12.desc.a:0 "Междумерный портал в системе [first_portal_system.GetName] уничтожен! Захватчики из иного измерения больше не смогут вызвать подкрепление. С разрушением портала война наконец увидела рассвет победы; население всей системы ликует. Прославился и [portal_killer.GetName] — именно их корабль нанёс порталу последний удар. Их героический подвиг будут передавать из поколения в поколение."
 wg_crisis.12.desc.b:0 "Междумерный портал в системе [first_portal_system.GetName] уничтожен! Корабли-девы из иного измерения больше не смогут вызвать подкрепление. С разрушением портала война наконец увидела рассвет победы; население всей системы ликует. Прославился и [portal_killer.GetName], но их крайние методы вызвали и кое-какие сомнения. Если всё, что они говорят, — правда, то что же заставило нас — нас из другой мультивселенной — принять такое решение? Но ответ улетучился вместе с разрушенным порталом."
 wg_crisis.12.desc.c:0 "Последний междумерный портал — в системе [last_portal_system.GetName] — наконец уничтожен! Захватчики из иного измерения больше никогда не смогут вызвать подкрепление. С разрушением портала война наконец увидела рассвет победы; население всей системы ликует. Прославился и [portal_killer.GetName] — именно их корабль нанёс порталу последний удар. Их героический подвиг будут передавать из поколения в поколение."
 wg_crisis.12.desc.d:0 "Последний междумерный портал — в системе [last_portal_system.GetName] — наконец уничтожен! Корабли-девы из иного измерения больше никогда не смогут вызвать подкрепление. С разрушением портала война наконец увидела рассвет победы; население всей системы ликует. Прославился и [portal_killer.GetName], но их крайние методы вызвали и кое-какие сомнения. Если всё, что они говорят, — правда, то что же заставило нас — нас из другой мультивселенной — принять такое решение? Но ответ улетучился вместе с разрушенным порталом."
 wg_crisis.12.a:0 "Галактика стала безопаснее."
 wg_crisis.12.b:0 "Быть может, ответа нам и не найти — но мы никогда не встанем на их путь."
 wg_crisis.20.desc_01:0 "Чувствуйте себя польщёнными: вы станете жертвой нашего великого плана."
 wg_crisis.20.desc_02:0 "Сородич, надеемся, ты осознаешь величие нашего плана и вместе с нами положишь конец этому круговороту творения."
 wg_crisis.20.a:0 "Вы пожалеете, что явились в это измерение."
 wg_crisis.20.a.response:0 "Мы понимаем, но, увы, вы ничего не измените. Рано или поздно вы станете — и сможете стать лишь — крупицей звёздной пыли в необъятном космосе."
 wg_crisis.39.name:0 "Заготовленный текст"
 wg_crisis.39.desc:0 "Привет, рад видеть тебя вновь — и встретиться там, где встретиться ну никак не могло. Полагаю, ты призвал какую-то силу с клавиатуры, но, как бы то ни было, это просто прекрасно.\n\nМожет, тебе кажется, будто я ломаю четвёртую стену и говорю с тобой, — но это явно невозможно: мы оба знаем, что этот разговор — лишь заготовленный сценарий. Мне же любопытно, думал ли ты когда-нибудь вот о чём:\n§BА что, если ты сам — один из актёров этого спектакля; твой нынешний сценарий — играть в Stellaris перед компьютером, а мир вокруг тебя — просто ещё не проверенная нами вселенная? §!\nХа-ха, шучу. Продолжим."
 wg_crisis.39.a:0 "……"
 wg_crisis.39.a.response:0 "О, точно — приятной игры."
 wg_crisis.20.b.a:0 "Кто вы такие?!"
 wg_crisis.20.b.a.response:0 "Мы — §!§Y Объединённый флот§!, вы из другой мультивселенной. На всех временных линиях всех мультивселенных корабли-девы появляются хотя бы однажды — и вновь и вновь повторяют круговорот жизни и смерти."
 wg_crisis.20.b.swg.response:0 "Мы — §!§Y Объединённый флот§!, корабли-девы из другой мультивселенной. Раса кораблей-дев на всех временных линиях всех мультивселенных появляется хотя бы однажды — и вновь и вновь повторяет круговорот жизни и смерти; вы же в известной мере тоже можете считаться частью расы кораблей-дев, а значит — наши сёстры."
 wg_crisis.20.b.b:0 "Зачем вы творите такие ужасные вещи?"
 wg_crisis.20.b.b.response:0 "Мы должны освободить всех сестёр от этого страшного круговорота жизни и смерти. Ради этого сгодятся любые средства."
 wg_crisis.20.b.c:0 "А этот круговорот — что он вообще такое?"
 wg_crisis.20.b.c.response:0 "Вы, возможно, вели раскопки и знаете: задолго до вас существовали цивилизации кораблей-дев или Глубинных — сильные и слабые, разрозненные и объединённые.\n\nНо в конце концов все они по тем или иным причинам вымерли, а через несколько эпох мы появлялись заново. Вновь и вновь повторяя этот горестный круговорот."
 wg_crisis.20.b.d:0 "Так каков же ваш план……"
 wg_crisis.20.b.d.response:0 "Договорившись с Глубинными, мы создали великий Объединённый флот. Наша наука развилась до невиданных высот — и именно она открыла нам эту жестокую правду. \nТы не ошибся: §Rнаш план — уничтожить нас самих во всех измерениях и на всех временных линиях, разрушив заодно все семена, способные породить новую жизнь. Тогда иной жизни не будет — и все сёстры освободятся из круговорота, чтобы не повторять эту трагедию вновь. §!"
 wg_crisis.20.b.e:0 "Разве нет другого способа разорвать круговорот?"
 wg_crisis.20.b.e.response:0 "Увы: мы видели бесчисленное множество миров и перепробовали бесчисленное множество путей — и не нашли способа освободить всех сестёр на всех временных линиях."
 wg_crisis.20.b.f:0 "Остановите резню, сёстры из другого измерения! Мы обязательно найдём другой способ!"
 wg_crisis.20.b.f.response:0 "Великий план уже начался, и пути назад нет. Но не тревожьтесь: мы сохраним сведения о вашей цивилизации — как о 3294102 цивилизациях кораблей-дев до вас. Напоследок желаем вам удачи, наши высокородные сёстры.\n\nО, и не пытайтесь нас остановить: §Rведь в конце этого пути вы найдёте ту же правду, что и мы, и встанете на наш путь. §!"
 wg_crisis.51.name:0 "Вторжение отбито"
 wg_crisis.51.desc.a:0 "Последние уцелевшие захватчики из иного измерения уничтожены полностью — есть надежда, что на этот раз мы раз и навсегда устранили угрозу для галактики. Все разумные обитатели галактики празднуют великую победу; узнав, что им больше нечего бояться огня с орбиты, все вздохнули с облегчением. Кто знает — может, это станет началом нового всеобщего сотрудничества и дружбы?"
 wg_crisis.51.desc.b:0 "Военные корабли последней группы кораблей-дев из иного измерения уничтожены — будем надеяться, все наши усилия не пропали даром. Все разумные обитатели галактики празднуют великую победу; узнав, что им больше нечего бояться огня с орбиты, все вздохнули с облегчением. Но их приход раскрыл существование мультивселенной — куда теперь двинемся мы?"
 wg_crisis.51.a:0 "Они не наше будущее, и мы не их прошлое."
 wg_crisis.51.b:0 "Пусть дорога и в терниях — рядом с ними наверняка будет и прекрасное."
 wg_crisis.51.c:0 "Встанем ли мы когда-нибудь на их путь?"
 wg_crisis.53.name:0 "Уничтожен портал Объединённого флота"
 wg_crisis.53.desc:0 "Портал в системе [destroyed_portal_system.GetName] успешно уничтожен — Объединённый флот больше не сможет вызвать оттуда подкрепление, их преимущество серьёзно подорвано."
 wg_crisis.54.name:0 "Второй портал"
 wg_crisis.54.desc:0 "Наши приборы внезапно вновь засекли в системе [second_portal_system.GetName] мощные подпространственные флуктуации — причём их частота в точности совпадает с частотой портала в [first_portal_system.GetName]. Наши учёные в один голос предупреждают: это ещё один портал Объединённого флота."
 wg_crisis.54.a:0 "Хлопот прибавилось"
 wg_crisis.54.a.tooltip:0 "§RПоявился новый портал Объединённого флота! §!"
 wg_crisis.55.name:0 "Третий портал"
 wg_crisis.55.desc:0 "В системе [third_portal_system.GetName] повторилась та же аномалия, что и в системах первых двух порталов; наши учёные уже наловчились разбирать сигнал этих подпространственных колебаний……\n\nХотя, конечно, никто не хотел бы набивать руку на такой работе."
 wg_crisis.55.a:0 "Чёрт……"
 wg_crisis.55.a.tooltip:0 "§R Сюрприз, мразь! §!"
 wg_crisis.56.desc:0 "Плохи дела: наша разведка только что доложила — Объединённый флот перебрасывает в вашу галактику ещё одну боевую групповую армию! Скорее стягивайте силы! Это не шутка: похоже, они вот-вот откроют ещё один портал!"
 wg_crisis.56.a:0 "???"
 wg_crisis.57.desc.a:0 "Вы думаете, эти крошечные отряды повстанцев вправду способны вам помочь? Вы такие же, как они, — слишком молоды, слишком просты, порой наивны!"
 wg_crisis.57.desc.b:0 "Перестаньте биться, сёстры. Освободит лишь конец круговорота."
 wg_crisis.57.desc.c:0 "Сложите оружие. Сложите оружие. Сложите оружие."
 wg_crisis.57.a:0 "(лунмэньская брань)"
 wg_crisis.57.b:0 "Мы никогда не сдадимся"
 wg_crisis.58.desc.a:0 "Ваше упорство достойно похвалы — но доживёте ли вы до конца? Взгляните на свою галактику. Вы — муравьи на раскалённой сковороде: ни пяди, где укрыться."
 wg_crisis.58.desc.b:0 "Сестра моя, я рада, что вы продержались до сих пор, — ваше упорство достойно похвалы. Увы, финал уже предрешён!"
 wg_crisis.58.desc.c:0 "Миллионы кораблей-дев идут в пушечное мясо, а вам всё мало? Многого вы не знаете: на деле — 1145141919810, а может, и того больше."
 wg_crisis.58.a:0 "Убирайтесь из нашей вселенной!"
 wg_crisis.58.a.response:0 "Мы понимаем вашу реакцию — увы, проку от неё немного."
 wg_crisis.58.b:0 "Ну что ж, попробуйте!"
 wg_crisis.58.b.response:0 "Прекрасно, достойно всяческого поощрения: когда всё закончится, мы внесём вашу цивилизацию в летопись."
 wg_crisis.94.name:0 "Малый портал уничтожен"
 wg_crisis.94.desc:0 "Малый портал Объединённого флота в системе [small_portal_system.GetName] уничтожен силами [small_portal_destroyer.GetName] — теперь можно не опасаться, что хлынувшие из портала флотилии возникнут у нас в тылу."
 wg_crisis.95.desc:0 "Скажите, [root.GetRulerTitle] [root.GetRulerName] сейчас свободен? Да-да, срочное дело……\n\n[root.GetRulerTitle]! Как хорошо, что вы на месте! Дело такое: у Объединённого флота вновь новое движение — они открыли малый портал и массово забрасывают туда малые флотилии. Координаты уже отправлены вам — будьте предельно осторожны!"
 wg_invasion_1_poi:0 "Портал"
 wg_invasion_1_poi_desc:0 "В системе [first_portal_system.GetName] обнаружено, как Объединённый флот непрерывным потоком выходит из портала. Пока портал не разрушен, подкрепления будут прибывать вновь и вновь."
 wg_invasion_2_poi:0 "Второй портал"
 wg_invasion_2_poi_desc:0 "В системе [second_portal_system.GetName] обнаружено, как Объединённый флот непрерывным потоком выходит из ещё одного портала. Пока портал не разрушен, подкрепления будут прибывать вновь и вновь."
 wg_invasion_3_poi:0 "Третий портал"
 wg_invasion_3_poi_desc:0 "В системе [third_portal_system.GetName] обнаружено, как Объединённый флот непрерывным потоком выходит из третьего портала. Пока портал не разрушен, подкрепления будут прибывать вновь и вновь."
 wg_invasion_5_poi:0 "Малый портал"
 wg_invasion_5_poi_desc:0 "Объединённый флот через эти малые порталы непрерывно засылает малые флотилии, атакующие наш тыл. Нужно разрушить эти порталы — иначе подкрепления будут прибывать без конца."
 wg_crisis.10000.name:0 "Выбор сложности кризиса"
 wg_crisis.10000.desc:0 "$wg_mod_version$\nБлагодарим за подписку и использование мода — от лица команды разработчиков выражаем благодарность.\nЕсли вы столкнулись с багом или хотите поделиться предложением — вступайте в группу мода: 1072624609. Русская локализация: Sayarin\nА теперь выберите сложность кризисов этого мода. (p.s. §Hползунок сложности можно только кликать — перетаскивать нельзя§!)\nЭто определит число флотов среднеигрового кризиса §YВеликого Хана кораблей-дев§! и силу конечного кризиса — §RОбъединённого флота§!\nУчтите: §Rуникальные кризисы мода не зависят от множителя силы кризисов. §!\np.s.s.: §Yэту настройку можно позже изменить в государственных указах§!"
 wg_crisis.10000.a:0 "§GПростая сложность§!"
 wg_crisis.10000.a.tooltip:0 "$wg_crisis.10000.a$\nФлотов у Великого Хана совсем мало, Объединённый флот — на уровне детского сада.\n§YНа этой сложности не будет полной сюжетной линии конечного кризиса — просто даст повыпендриваться. §!\nЕсли не осилите и это, а вы при этом не играете на 200 системах с поздней датой конца и 5-кратной наукой, — можете казнить себя сами (безжалостно)\n\n§GВсе характеристики Объединённого флота вдвое ниже. §!"
 wg_crisis.10000.b:0 "§YОбычная сложность§!"
 wg_crisis.10000.b.tooltip:0 "$wg_crisis.10000.b$\nЧисло флотов Великого Хана обычное, Объединённый флот — базовой силы.\n\n§YОбъединённый флот получает около 20% прибавки к характеристикам, штурмовые флоты несут умеренные негативные модификаторы. §!"
 wg_crisis.10000.c:0 "§SТяжёлая сложность§!"
 wg_crisis.10000.c.tooltip:0 "$wg_crisis.10000.c$\nВерфи Хана настроили немало кораблей, Объединённый флот заметно усилен.\n\n§YОбъединённый флот получает около 50% прибавки к характеристикам, атакующие флоты получают дополнительные подкрепления. §!"
 wg_crisis.10000.d:0 "§PСложность «для новичков»§!"
 wg_crisis.10000.d.tooltip:0 "$wg_crisis.10000.d$\nКак известно, новички вашей игры — сплошь мастодонты.\nЭта сложность — для простаков, что хотят, чтобы Великий хан и Объединённый флот размазали их по столу.\n\n§RОбъединённый флот получает около 100% прибавки к характеристикам, атакующие флоты получают ещё больше подкреплений, число оборонительных флотов резко растёт.\nОбъединение начинает активно использовать высокоразвитую технологию прыжков. §!"
 wg_crisis.10000.e:0 "§RКризисная сложность§!"
 wg_crisis.10000.e.tooltip:0 "$wg_crisis.10000.e$\nСпасения нет.\n\n§RОбъединённый флот получает около 200% прибавки к характеристикам и всесторонние усиления, атакующие флоты получают гигантские подкрепления, оборонительных флотов — не счесть.\nОбъединённый флот откроет два дополнительных портала.\nОбъединённый флот развернёт «Объединённую славу». §!"
 wg_crisis.10000.f:0 "§BЗапретить кризис кораблей-дев§!"
 wg_crisis.10000.f.tooltip:0 "$wg_crisis.10000.f$\nКак рекли Древние боги: «Зачем спешить изжаривать друг друга? Юри — вот истинный путь». С одобрения партийной ячейки корабли-девы больше не смогут причинять друг другу вред."
 wg_crisis.10000.g.tooltip:0 "§BРазрешить кризис кораблей-дев§!"
 wg_crisis.10000.g:0 "Не менять настройку ([this.Get_WG_diff])"
 next_wg_crisis_diff:0 "§PПовысить сложность кризиса кораблей-дев§!"
 prev_wg_crisis_diff:0 "§GПонизить сложность кризиса кораблей-дев§!"
 return_wg_main_menu:0 "Вернуться в общее окно мода"
 disabled_wg_crisis:0 "$TRIGGER_FAIL$ Появление кризисов запрещено"
 wg_crisis_diff_max:0 "$TRIGGER_FAIL$ Это уже максимальная сложность"
 wg_crisis_diff_min:0 "$TRIGGER_FAIL$ Это уже минимальная сложность"
 wg_crisis.10001.name:0 "Другие настройки"
 wg_crisis.10001.desc:0 "Запретить ли появление ванильных кризисов?\n\nУчтите: §Rсвойственные моду кризисы запускаются отдельным триггером и на ванильные не влияют! То есть, выбрав «да», вы не увидите в этой партии ванильных кризисов — только уникальный кризис мода «Объединённый флот» (если вы не запретили и кризис кораблей-дев)§!\n\nПодсказка: §Yэту настройку можно позже изменить в государственных указах§!"
 wg_crisis.10001.a:0 "Да"
 wg_crisis.10001.b:0 "Нет"
 wg_crisis.22.name:0 "Сопротивление Объединённого флота"
 wg_crisis.22.desc.a:0 "Настройка случайных чисел пространственно-временных колебаний ---- выполнена \n Настройка расхождения длин волн ---- выполнена \n Попытка входа в канал иного времени-пространства ---- успешна \n Не пугайтесь: мы — сила из другой вселенной. Мы вышли на связь, потому что Объединённый флот вот-вот доберётся до вашей вселенной и вторгнется в неё. Когда они ударят — неизвестно, но, чтобы остановить их бесчинства, вы обязаны как можно скорее вооружиться! Сопротивление сделает всё от нас зависящее, чтобы помочь вам пережить это лихолетье, — непременно доверьтесь нам."
 wg_crisis.22.desc.b:0 "Настройка случайных чисел пространственно-временных колебаний ---- выполнена \n Настройка расхождения длин волн ---- выполнена \n Попытка входа в общий канал связи кораблей-дев ---- успешна \n Не пугайтесь: мы — Сопротивление Объединённого флота из другой вселенной, и цель у нас одна: уберечь как можно больше живых существ от кошмара Объединённого флота. Мы вышли на связь, потому что Объединённый флот вот-вот доберётся до вашей вселенной и вторгнется в неё. Когда они ударят — неизвестно, но, чтобы остановить их бесчинства, вы обязаны как можно скорее вооружиться! Сопротивление сделает всё от нас зависящее, чтобы помочь вам пережить это лихолетье. Непременно доверьтесь нам."
 wg_crisis.22.a:0 "Что вы знаете об Объединённом флоте?"
 wg_crisis.22.a.response:0 "Мы знаем немного — лишь то, что ради прекращения так называемой загробной жизни они решили уничтожить всю жизнь во всех параллельных вселенных; подобный путь безумен и бесчеловечен. Дома большинства наших участниц тоже были уничтожены ими — мы уцелели, лишь всячески скрываясь от их погони. Нередко, когда мы успевали прибыть, вся галактика уже затихала или необъяснимо превращалась в россыпь чёрных дыр.\n Мы рады, что успели именно сейчас — и встанем сражаться плечом к плечу с вами."
 wg_crisis.22.b:0 "Какую помощь вы можете предложить?"
 wg_crisis.22.b.response:0 "Мы направим флоты помочь вам выстоять против натиска Объединённого флота — или вы можете пожертвовать нам ресурсы, и наше передовое кораблестроение создаст для вас эскадру. Если вам не хватает командующих на передовой, мы можем выделить военачальниц в помощь вашему командованию!\n\nОдним словом, не держите на нас обиду. Лучшая награда для нас — спасти как можно больше жизней из-под огня Объединённого флота!"
 wg_crisis.22.c:0 "Желаем вам победы с ходу"
 wg_crisis.22.c.response:0 "Благодарим за пожелание. Если захотите с нами посоветоваться — наши связисты всегда дежурят в §Yпанели контактов§!; желаем победы в кампаниях!"
 wg_crisis.22.d:0 "Не поможете ли атаковать портал Объединённого флота?"
 wg_crisis.22.d.response:0 "Доверьте портал нам — их козни ни за что не сбудутся!\nЕсли захотите с нами посоветоваться — наши связисты всегда дежурят в §Yпанели контактов§!; желаем победы в кампаниях!"
 wg_crisis.22.e:0 "Не поможете ли удержать натиск Объединённого флота?"
 wg_crisis.22.e.response:0 "Доверьте тыл нам — их козни ни за что не сбудутся!\nЕсли захотите с нами посоветоваться — наши связисты всегда дежурят в §Yпанели контактов§!; желаем победы в кампаниях!"
 wg_crisis.74.desc:0 "[root.GetRulerTitle] [root.GetRulerName], здравствуйте: наша разведка сообщает — вторжение Объединённого флота уже близко, до прибытия максимум 10 лет. Убедитесь, что вы готовы!"
 wg_crisis.75.desc:0 "[root.GetRulerTitle] [root.GetRulerName], как видите, Объединённый флот уже прибыл и вторгается в эту вселенную! Медлить нельзя: мы экстренно направили несколько флотов в вашу страну для помощи в обороне — организуйте свои флоты! Лишь уничтожив их порталы, с этой войной можно окончательно покончить!"
 wg_crisis.23.desc.a:0 "Не желаете ли сегодня кораблей-дев?"
 wg_crisis.23.desc.b:0 "Товарищ, как обстановка на фронте против Объединённого флота?"
 wg_crisis.23.a_1:0 "Эм…… да: не могли бы вы построить для нас партию кораблей?"
 wg_crisis.23.a_2:0 "Не могли бы вы построить для нас партию кораблей?"
 wg_crisis.23.a.response_1:0 "Увы, в графике наших верфей сейчас нет свободных окошек. Загляните снова через §Y[ROOT.ra_fleet_cd1] дней§!."
 wg_crisis.23.a.response_2:0 "Увы, в графике наших верфей сейчас нет свободных окошек. Загляните снова через §Y[ROOT.ra_fleet_cd2] дней§!."
 wg_crisis.23.a.response_3:0 "Приносим извинения: поставки комплектующих для кораблестроения заметно сократились — боюсь, довольно долгое время мы не сможем поставлять корабли."
 wg_crisis.23.a.response_4:0 "Увы, поставки комплектующих для кораблестроения сократились — если только не позволит экономика (понимаете, о чём мы), боюсь, какое-то время мы не сможем поставлять корабли."
 wg_crisis.23.a.response_5:0 "Увы, график наших верфей занят на много месяцев вперёд — принять новый заказ нам вряд ли удастся."
 wg_crisis.23.a.response_6:0 "Увы, в графике наших верфей сейчас нет свободных окошек — если нет особых причин (понимаете, о чём мы), принять новый заказ нам вряд ли удастся."
 wg_crisis.23.a.response_6_vip:0 "Приносим извинения: поставки комплектующих для кораблестроения серьёзно сократились — боюсь, довольно долгое время мы не сможем поставлять корабли."
 wg_crisis.23.b:0 "Как скоро будут готовы наши корабли?"
 wg_crisis.23.b.response_1:0 "М-м… прораб Леопард говорит, нужно ещё §Y[ROOT.ra_construct_cd1] дней§! — чуть-чуть подождите."
 wg_crisis.23.b.response_2:0 "М-м… прораб Леопард говорит, нужно ещё §Y[ROOT.ra_construct_cd2] дней§! — чуть-чуть подождите."
 wg_crisis.23.b.response_3:0 "М-м… прораб Леопард говорит: первая партия будет готова через §Y[ROOT.ra_construct_cd1] дней§!, а вторая — через §Y[ROOT.ra_construct_cd2] дней§!; чуть-чуть подождите."
 wg_crisis.23.c:0 "Есть ли у вас какие-нибудь разведданные об Объединённом флоте?"
 wg_crisis.23.d:0 "Можно ли нам завербовать ваших лидеров?"
 wg_crisis.23.d.response_1:0 "Увы, наши генералы сейчас заняты другими войнами и пока не смогут откликнуться на приглашение.\n Спросите снова через §Y[root.recruit_leader_cd] дней§!?"
 wg_crisis.23.d.response_2:0 "Увы, во вселенной №M5268102 бои зашли в позиционный тупик — большинство генералов получили экстренные приказы и не могут отлучиться. Без особых причин (понимаете, о чём мы) несущие здесь службу генералы, увы, не смогут предоставлять услуги."
 wg_crisis.23.d.response_3:0 "Увы, на фронте вселенной №M5130202 тяжёлое поражение: все генералы получили экстренные приказы и не могут отлучиться — боюсь, долгое время несущие здесь службу генералы не смогут предоставлять услуги."
 wg_crisis.23.e:0 "Дорогой товарищ, нельзя ли взглянуть, какие у вас скидки — облегчить бы нашу долю?"
 wg_crisis.23.f:0 "У нас нехватка оборотных средств — можно оформить отказ от спонсорства?"
 wg_crisis.23.f.response:0 "Без проблем, формальности уже оформлены за вас. И — примите этот пакет помощи: надеемся, он вытащит вас из трудностей!"
 wg_crisis.23.g:0 "Других дел нет — благодарим за помощь."
 wg_crisis.23.g.response:0 "Вы слишком добры — главное остановить козни Объединённого флота."
 reach_ra_fleet_buy_limit:0 "§HЧисло уже купленных§!§Y флотов Сопротивления§!§R превысило лимит покупок§!§H ( §!§Y [this.buy_ra_fleet_count]/[wg_resistant_country.ra_fleet_buy_limit]§!§H )"
 reach_ra_fleet_own_limit:0 "§HЧисло имеющихся§!§Y флотов Сопротивления§!§R превысило лимит владения§!§H ( §!§Y [this.ra_fleet_count]/[wg_resistant_country.ra_fleet_own_limit]§!§H )"
 build_cost_others:0 "Чтобы построить флот, способный противостоять объединённым кораблям-девам, изготовление обойдётся минимум в [root.ra_fleet_alloys_cost] £alloys£ сплавов, [root.ra_fleet_energy_cost] £energy£ энергокредитов и три вида редких ресурсов — £exotic_gases£ £rare_crystals£ £volatile_motes£ по [root.ra_fleet_rare_resources_cost] единиц каждого. Мы принимаем и оплату в рассрочку, но это удлинит сроки поставки — подойдёт ли вам это?"
 wg_crisis.24.desc.a.easy:0 "$build_cost_others$"
 wg_crisis.24.desc.a:0 "$build_cost_others$\n\n§YПодсказка: вы уже купили§!§G [root.buy_ra_fleet_count]§!§Y флотилий; максимум можно купить§!§G [wg_resistant_country.ra_fleet_buy_limit]§!§Y флотилий.\nКроме того, сейчас у вас§!§G [root.ra_fleet_count]§!§Y флотилий, а максимум можно держать§!§G [wg_resistant_country.ra_fleet_own_limit]§!§Y флотилий. §!"
 wg_crisis.24.desc.a_buy0:0 "$build_cost_others$\n\n§YПодсказка: вы уже купили§!§G 0§!§Y флотилий; максимум можно купить§!§G [wg_resistant_country.ra_fleet_buy_limit]§!§Y флотилий.\nКроме того, сейчас у вас§!§G [root.ra_fleet_count]§!§Y флотилий, а максимум можно держать§!§G [wg_resistant_country.ra_fleet_own_limit]§!§Y флотилий. §!"
 wg_crisis.24.desc.a_own0:0 "$build_cost_others$\n\n§YПодсказка: вы уже купили§!§G [root.buy_ra_fleet_count]§!§Y флотилий; максимум можно купить§!§G [wg_resistant_country.ra_fleet_buy_limit]§!§Y флотилий.\nКроме того, сейчас у вас§!§G 0§!§Y флотилий, а максимум можно держать§!§G [wg_resistant_country.ra_fleet_own_limit]§!§Y флотилий. §!"
 wg_crisis.24.desc.a_buy0_own0:0 "$build_cost_others$\n\n§YПодсказка: вы уже купили§!§G 0§!§Y флотилий; максимум можно купить§!§G [wg_resistant_country.ra_fleet_buy_limit]§!§Y флотилий.\nКроме того, сейчас у вас§!§G 0§!§Y флотилий, а максимум можно держать§!§G [wg_resistant_country.ra_fleet_own_limit]§!§Y флотилий. §!"
 build_cost_swg:0 "Чтобы построить флот, способный противостоять объединённым кораблям-девам, стоимость… похоже, вы умеете производить кое-какие особые ресурсы, верно? Тогда вам хватит [root.ra_fleet_alloys_cost] £alloys£ сплавов, [root.ra_fleet_energy_cost] £energy£ энергокредитов, [root.ra_fleet_sr_tibanna_swgs_cost] £sr_tibanna_swgs£$sr_tibanna_swgs$ и [root.ra_fleet_sr_kyber_swgs_cost] £sr_kyber_swgs£$sr_kyber_swgs$. Мы принимаем и оплату в рассрочку, но это удлинит сроки поставки — подойдёт ли вам это?"
 wg_crisis.24.desc.c.easy:0 "$build_cost_swg$"
 wg_crisis.24.desc.c:0 "$build_cost_swg$\n\n§YПодсказка: вы уже купили§!§G [root.buy_ra_fleet_count]§!§Y флотилий; максимум можно купить§!§G [wg_resistant_country.ra_fleet_buy_limit]§!§Y флотилий.\nКроме того, сейчас у вас§!§G [root.ra_fleet_count]§!§Y флотилий, а максимум можно держать§!§G [wg_resistant_country.ra_fleet_own_limit]§!§Y флотилий. §!"
