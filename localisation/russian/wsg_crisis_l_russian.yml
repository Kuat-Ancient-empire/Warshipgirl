 wg_crisis.67.desc:0 "Учтите: адмирал исходного флота отстранена — при необходимости назначьте командующую заново."
 wg_crisis.68.name:0 "Слияние флотов не удалось"
 wg_crisis.68.desc:0 "Перепроверьте объединяемые флоты"
 wg_invasion_chain_title:0 "Объединённый флот"
 wg_invasion_chain_desc:0 "В нашей галактике появились гигантские пространственные разломы — вероятно, пути в иные измерения. Странно то, что хлынувшие из них корабли очень похожи на корабли, спроектированные кораблями-девами. Они истребят всё живое в галактике и все пригодные для заселения миры, способные породить новых, — пока вся вселенная не вернётся в ничто."
 wg_invastor_kills_us:0 "§GОбъединённый флот уничтожен нами§!"
 wg_invastor_kills_others:0 "§GОбъединённый флот уничтожен другой державой§!"
