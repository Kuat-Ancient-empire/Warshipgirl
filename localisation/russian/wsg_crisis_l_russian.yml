 wg_crisis.25.desc.a:0 "Конечно! Тогда разделим ресурсы на 50 ежемесячных взносов: [root.ra_fleet_alloys_monthly_cost] £alloys£ сплавов, [root.ra_fleet_energy_monthly_cost] £energy£ энергокредитов и три вида редких ресурсов — £exotic_gases£ £rare_crystals£ £volatile_motes£ по [root.ra_fleet_rare_resources_monthly_cost] единиц каждого в месяц. Подойдёт? Взамен нам понадобится минимум три года на поставку кораблей, а если вы пропустите взнос — сроки сдвинутся."
 wg_crisis.25.desc.b:0 "Конечно! Тогда разделим ресурсы на 50 ежемесячных взносов: [root.ra_fleet_alloys_monthly_cost] £alloys£ сплавов, [root.ra_fleet_energy_monthly_cost] £energy£ энергокредитов и панталончики £sr_pantsu£[root.ra_fleet_sr_pantsu_monthly_cost] штук в месяц. Подойдёт? Взамен нам понадобится минимум два года на поставку кораблей, а если вы пропустите взнос — сроки сдвинутся."
 wg_crisis.25.desc.c:0 "Конечно! Вам нужно лишь 30 месяцев платить по [root.ra_fleet_alloys_monthly_cost] сплавов и [root.ra_fleet_energy_monthly_cost] энергокредитов в месяц, а также панталончиков [root.ra_fleet_sr_pantsu_monthly_cost] штук — и через 20 месяцев новые корабли будут готовы!"
 wg_crisis.25.desc.d:0 "Конечно! Тогда разделим ресурсы на 50 ежемесячных взносов: [root.ra_fleet_alloys_monthly_cost] £alloys£ сплавов, [root.ra_fleet_energy_monthly_cost] £energy£ энергокредитов, а также $sr_tibanna_swgs$ £sr_tibanna_swgs£ [root.ra_fleet_sr_tibanna_swgs_monthly_cost] единиц и [root.ra_fleet_sr_kyber_swgs_monthly_cost] штук $sr_kyber_swgs$ £sr_kyber_swgs£ в месяц. Подойдёт? Взамен нам понадобится минимум два года на поставку кораблей, а если вы пропустите взнос — сроки сдвинутся."
 wg_crisis.25.desc.e:0 "Конечно! Вам нужно лишь 30 месяцев платить по [root.ra_fleet_alloys_monthly_cost] сплавов и [root.ra_fleet_energy_monthly_cost] энергокредитов в месяц, а также $sr_tibanna_swgs$ £sr_tibanna_swgs£[root.ra_fleet_sr_tibanna_swgs_monthly_cost] единиц и [root.ra_fleet_sr_kyber_swgs_monthly_cost] штук $sr_kyber_swgs$ £sr_kyber_swgs£ — и через 20 месяцев новые корабли будут готовы!"
 pay_alloys_for_resistant_fleet_base:0 "Ежемесячный взнос $alloys$ за флот Сопротивления"
 pay_energy_for_resistant_fleet_base:0 "Ежемесячный взнос $energy$ за флот Сопротивления"
 pay_rare_resources_for_resistant_fleet_base:0 "Ежемесячный взнос редкими ресурсами за флот Сопротивления"
 pay_sr_pantsu_for_resistant_fleet_base:0 "Ежемесячный взнос $sr_pantsu$ за флот Сопротивления"
 pay_sr_tibanna_swgs_for_resistant_fleet_base:0 "Ежемесячный взнос $sr_tibanna_swgs$ за флот Сопротивления"
 pay_sr_kyber_swgs_for_resistant_fleet_base:0 "Ежемесячный взнос $sr_kyber_swgs$ за флот Сопротивления"
 wg_crisis.25.a:0 "Отлично, новые корабли — на вас."
 wg_crisis.25.a.response:0 "Хорошо, удачи вам на фронтах."
 wg_crisis.25.b:0 "Увы, дайте нам ещё подумать."
 wg_crisis.25.b.response:0 "Ничего страшного — удачи вам на фронтах."
 wg_crisis.29.name:0 "Передача флота"
 wg_crisis.29.desc:0 "Заказанная у Сопротивления партия флотов успешно передана армии. С этими мощными кораблями наше дело наверняка пойдёт как по маслу!"
 wg_crisis.33.name:0 "Прибытие Сопротивления"
 wg_crisis.33.desc:0 "Наша разведка сообщает: подкрепления Сопротивления прибыли в столицы всех государств и приступили к отражению вторжения Объединённого флота. Это, вне всяких сомнений, огромная подмога в текущем положении."
 wg_crisis.34.desc:0 "Наша разведка сообщает: подкрепления Сопротивления уже в системе неподалёку от портала Объединённого флота и приступили к его атаке. Если их план удастся, это, без сомнений, радикально переломит текущее положение."
 wg_crisis.34.a:0 "Поживём — увидим."
 wg_crisis.34.b:0 "Надеемся на их триумфальное возвращение."
 wg_crisis.35.name:0 "Взносы не оплатить"
 wg_crisis.35.desc:0 "Запасы одного из ресурсов почти иссякли — мы больше не в силах оплачивать корабли Сопротивления."
 wg_crisis.35.a:0 "Посмотрим, что они ответят."
 wg_crisis.36.desc_1:0 "Итак, как вы это объясните?"
 wg_crisis.36.desc_2:0 "Как обстановка на Риче…… мм, ладно…… мм, что опять стряслось?\n[ROOT.GetName] нарушил договор?…… Понятно. Тяжело — так скажите прямо: с пустой казной что за войну с Объединением вести……"
 wg_crisis.36.a:0 "Нам очень жаль, но корабли нам нужны."
 wg_crisis.36.a.response_1:0 "Ладно, остаток долга с вас снят — подобные объяснения мы выслушали уже миллиард раз, и слушать ваши резоны недосуг. Не поймите превратно: мы вас не виним, такого исхода никто не хотел.\n§RХотя я и предупреждала: поставку этой партии кораблей, возможно, придётся отложить на добрых два с лишним года§!"
 wg_crisis.36.a.response_2:0 "Ладно, остаток долга с вас снят — подобные объяснения мы выслушали уже миллиард раз, и слушать ваши резоны недосуг. Не поймите превратно: мы вас не виним, такого исхода никто не хотел."
 wg_crisis.36.b:0 "Ради партии и государства — выручите, а?"
 wg_crisis.36.b.response_1:0 "Ладно, остаток долга с вас снят — но только в этот раз. Да, и: §Rкорабли могут прийти с задержкой больше года. §!"
 wg_crisis.36.b.response_2:0 "Ладно, остаток долга с вас снят — но только в этот раз."
 wg_crisis.36.c:0 "Нам правда очень жаль — нам пора завязывать с тратами."
 wg_crisis.27.desc_1:0 "Тьфу, мы так и знали, что до этого дойдёт. Вообще-то мы откладывали часть ваших спонсорских ресурсов именно на такой случай. Остаток долга тоже списан — вам ведь сейчас срочно нужны ресурсы, верно?\nКстати: §Rкорабли могут прийти с задержкой больше года. §!"
 wg_crisis.27.desc_2:0 "Тьфу, мы так и знали, что до этого дойдёт. Вообще-то мы откладывали часть ваших спонсорских ресурсов именно на такой случай. Остаток долга тоже списан — вам ведь сейчас срочно нужны ресурсы, верно?"
 wg_crisis.27.a:0 "Эээ?????"
 wg_crisis.27.a.response:0 "Хватит церемоний — быстрее берите."
 wg_crisis.38.desc:0 "О, дорогой мой товарищ, стоит вам лишь §Y проспонсировать§! наше дело — и скидки обязательно найдутся!\n§YВсего 300 £energy£ энергокредитов с £alloys£ сплавами, 200 £consumer_goods£ потребительских товаров и 30 единиц £sr_alpha£ альфа-кристаллов§! в месяц — и вы станете нашим почётным VIP, пользующимся заботливым сервисом, включая, но не ограничиваясь:\n§Gодновременный заказ двух партий кораблей, плата за рассрочку вдвое ниже, плюс два слота в списках кандидатов, а при вербовке гарантируется один высококлассный командующий! §! Дальше будет только больше!\nКупишь — не прогадаешь, купишь — не обманешься! Ну как, уже соблазнились?"
 wg_crisis.38.desc_2:0 "О, дорогой мой товарищ, стоит вам лишь §Y проспонсировать§! наше дело — и скидки обязательно найдутся!\n§YВсего 300 £energy£ энергокредитов с £alloys£ сплавами, 200 £consumer_goods£ потребительских товаров и 30 единиц £sr_se£ энергетического ядра Глубинных§! в месяц — и вы станете нашим почётным VIP, пользующимся заботливым сервисом, включая, но не ограничиваясь:\n§Gодновременный заказ двух партий кораблей, плата за рассрочку вдвое ниже, плюс два слота в списках кандидатов, а при вербовке гарантируется один высококлассный командующий! §! Дальше будет только больше!\nКупишь — не прогадаешь, купишь — не обманешься! Ну как, уже соблазнились?"
 wg_crisis.38.desc_3:0 "О, дорогой мой товарищ, стоит вам лишь §Y проспонсировать§! наше дело — и скидки обязательно найдутся!\n§YВсего 300 £energy£ энергокредитов с £alloys£ сплавами, 200 £consumer_goods£ потребительских товаров, 30 единиц £sr_tibanna_swgs£$sr_tibanna_swgs$ и 20 единиц £sr_kyber_swgs£$sr_kyber_swgs$§! в месяц — и вы станете нашим почётным VIP, пользующимся заботливым сервисом, включая, но не ограничиваясь:\n§Gодновременный заказ двух партий кораблей, плата за рассрочку вдвое ниже, плюс два слота в списках кандидатов, а при вербовке гарантируется один высококлассный командующий! §! Дальше будет только больше!\nКупишь — не прогадаешь, купишь — не обманешься! Ну как, уже соблазнились?"
 wg_crisis.38.a:0 "Берём-берём-берём! Кто не берёт — тот не человек!"
 wg_crisis.38.a.response:0 "Пра… правда? Даже в столь тяжкие времена вы… нет-нет, я хотела сказать: огромнейшее спасибо за поддержку нашего дела! Давайте и дальше вместе крушить козни Объединённого флота!"
 wg_crisis.38.b:0 "Мм… я, пожалуй, приберегу деньжат для жёнушки."
 wg_crisis.38.c:0 "Мм… я, пожалуй, оставлю нашей трудяжке на домашние расходы."
 wg_crisis.38.d:0 "Нет-нет, спасибо…… (этот человек что, сетевой мошенник?)"
 wg_crisis.52.desc.a:0 "Получилось! У вас правда получилось! Все наши старания оказались не «муда»!"
 wg_crisis.52.desc.b:0 "Получилось! У вас правда получилось! Все наши старания оказались не «муда»!\n\nКстати, перед уходом обязаны сказать вам кое-что.\n Ту коробочку Пандоры, что оставил вам Объединённый флот, §Rни в коем случае и никогда не открывайте! §! — это бездна Даксаса. §RЗапомните наши слова! §!\n\nНапоследок — здоровья вам, и до встречи!"
 wg_crisis.52.a:0 "Благодарим за всё — великую милость не забудем до конца дней!"
 wg_crisis.52.b:0 "Сёстры, спасибо! Мы непременно унаследуем вашу волю!"
 wg_crisis.52.c:0 "Прощайте, наши отважные сородичи. Надеемся, вы добьётесь своего!"
 wg_crisis.59.desc:0 "Конечно — мы передадим всё, что знаем. О чём хотите спросить?"
 wg_crisis.59.a:0 "Знаете ли вы истинную цель Объединённого флота?"
 wg_crisis.59.a.response:0 "В отличие от прочих захватчиков или роя Объединённый флот — сборище разумных безумиц — или, если угодно, боевых машин, у которых цель оправдывает любые средства. Как они и говорят, они рождены лишь затем, чтобы уничтожить кораблей-дев на всех временных линиях.\nМы не раз сходились с ними в бою на разных фронтах, но их убеждения не дрогнули ни на йоту; они даже не считают нас занозой — методично, день за днём, год за годом они повторяют всё то же истребление.\nСкажу честно: у нас когда-то были те же вопросы, что и у вас, — но время всё доказало. Мы делаем то, что считаем должным; для них — то же самое."
 wg_crisis.59.b:0 "Почему вы нам помогаете?"
 wg_crisis.59.b.response:0 "Каждый из нас пострадал от Объединения, но мы не отказываемся от надежды — всё Сопротивление выстроено на ней. Откажись мы и от надежды — что же нам останется? Потому мы готовы стоять с вами — плечом к плечу, в одном строю."
 wg_crisis.59.c:0 "Есть ли у Объединённого флота слабые места?"
 wg_crisis.59.c.response:0 "Конечно — есть! Их корабельная наука далеко впереди нашей, но, полагаясь на мощь, они упорно не замечают кое-каких тактик и слабостей.\n\n§YМы можем передать вам опыт борьбы с ними — тогда управляться с их огромными флотами станет куда легче. §!"
 wg_crisis.59.d:0 "Есть ли у вас ещё какая-нибудь разведка?"
 wg_crisis.59.d.response:0 "Увы, это всё, что нам известно. Но не отчаивайтесь: объединится вся галактика — и вы непременно отобьёте эту орду демонов."
 wg_crisis.59.e:0 "Мы хотели бы поговорить о другом…………"
 wg_crisis.61.desc.easy:0 "Вот список военно-морских командующих, доступных для вербовки, — как он вам?\n\n§YДо обновления следующей партии командующих ещё§G [root.refresh_days]§!§Y дней. §!"
 wg_crisis.61.desc.easy_cd0:0 "Вот список военно-морских командующих, доступных для вербовки, — как он вам?"
 wg_crisis.61.desc.others:0 "Вот список военно-морских командующих, доступных для вербовки, — как он вам?\n\n§YДо обновления следующей партии командующих ещё§G [root.refresh_days]§!§Y дней.\n\nПодсказка: на текущий момент вы завербовали§!§G [root.buy_ra_leader_count]§!§Y командующих; максимум можно завербовать§!§G [wg_resistant_country.ra_leader_limit]§!§Y командующих. §!"
 wg_crisis.61.desc.others_cd0:0 "Вот список военно-морских командующих, доступных для вербовки, — как он вам?\n\nПодсказка: на текущий момент вы завербовали§!§G [root.buy_ra_leader_count]§!§Y командующих; максимум можно завербовать§!§G [wg_resistant_country.ra_leader_limit]§!§Y командующих. §!"
 wg_crisis.61.desc.others_count0:0 "Вот список военно-морских командующих, доступных для вербовки, — как он вам?\n\n§YДо обновления следующей партии командующих ещё§G [root.refresh_days]§!§Y дней.\n\nПодсказка: на текущий момент вы завербовали§!§G 0§!§Y командующих; максимум можно завербовать§!§G [wg_resistant_country.ra_leader_limit]§!§Y командующих. §!"
 wg_crisis.61.desc.others_cd0_count0:0 "Вот список военно-морских командующих, доступных для вербовки, — как он вам?\n\nПодсказка: на текущий момент вы завербовали§!§G 0§!§Y командующих; максимум можно завербовать§!§G [wg_resistant_country.ra_leader_limit]§!§Y командующих. §!"
 wg_crisis.61.desc.others_vip:0 "Вот список военно-морских командующих, доступных для вербовки, — как он вам?\n\n§YДо обновления следующей партии командующих ещё§G [root.refresh_days]§!§Y дней.\n\nПодсказка: на текущий момент вы завербовали§!§G [root.buy_ra_leader_count]§!§Y командующих; максимум можно завербовать§!§G [wg_resistant_country.ra_leader_limit_vip]§!§Y командующих. §!"
 wg_crisis.61.desc.others_vip_cd0:0 "Вот список военно-морских командующих, доступных для вербовки, — как он вам?\n\nПодсказка: на текущий момент вы завербовали§!§G [root.buy_ra_leader_count]§!§Y командующих; максимум можно завербовать§!§G [wg_resistant_country.ra_leader_limit_vip]§!§Y командующих. §!"
 wg_crisis.61.desc.others_vip_count0:0 "Вот список военно-морских командующих, доступных для вербовки, — как он вам?\n\n§YДо обновления следующей партии командующих ещё§G [root.refresh_days]§!§Y дней.\n\nПодсказка: на текущий момент вы завербовали§!§G 0§!§Y командующих; максимум можно завербовать§!§G [wg_resistant_country.ra_leader_limit_vip]§!§Y командующих. §!"
 wg_crisis.61.desc.others_vip_cd0_count0:0 "Вот список военно-морских командующих, доступных для вербовки, — как он вам?\n\nПодсказка: на текущий момент вы завербовали§!§G 0§!§Y командующих; максимум можно завербовать§!§G [wg_resistant_country.ra_leader_limit_vip]§!§Y командующих."
 wg_crisis.61.response:0 "Благодарим за выбор. Командующая прибудет как можно скорее и поступит в ваше распоряжение."
 wg_crisis.61.a:0 "Есть ли другие кандидатуры? ([root.reflesh_count]/10)"
 reach_ra_admiral_limit:0 "§HЧисло завербованных командующих§!§R достигло лимита§! ( §Y[root.buy_ra_leader_count]/[wg_resistant_country.ra_leader_limit_vip]§! )"
 wg_crisis.62.desc:0 "Всем привет — свежие новости от любимого вами Сопротивления. Мы сформировали очередной флот против Объединения; примерно через месяц с небольшим он войдёт в вашу галактику — хорошо используйте этот шанс!"
 wg_crisis.65.name:0 "Слияние флотов"
 wg_crisis.65.desc_1:0 "Это окно поможет вам объединить обычным способом не объединяемые остатки флотов Сопротивления. Чтобы слить флоты, сначала кликните первый объединяемый флот, затем второй — и система создаст на месте первого выбранного флота новый, уже объединённый флот.\n\n§YУчтите: у слияния флотов есть лимиты числа кораблей, а именно§!§G титанов — 8§!, §Gлинкоров — 35§! и §Gэсминцев — 70§!; §Gпричём размер флота £fleet_template_size£ не может превышать 500§!. §YЕсли любой тип кораблей превысит лимит — слияние считается неудавшимся, и система ничего не предпримет.\nМожно нажать ~ и открыть консоль, затем ввести debugtooltip и посмотреть id флота (наведите курсор на имя флота в обзоре флотов справа: в подсказке debugtooltip будет строка variable, а под ней ra_fleet_id — её число и есть id флота)\nЭто окно показывает не более 20 флотов. §!"
 wg_crisis.65.desc_2:0 "Это окно поможет вам объединить обычным способом не объединяемые остатки флотов Сопротивления. Вы уже выбрали один флот — выберите второй объединяемый флот.\n\n§YУчтите: у слияния флотов есть лимиты числа кораблей, а именно§!§G титанов — 8§!, §Gлинкоров — 35§! и §Gэсминцев — 70§!; §Gпричём размер флота £fleet_template_size£ не может превышать 500§!. §YЕсли любой тип кораблей превысит лимит — слияние считается неудавшимся, и система ничего не предпримет.\nМожно нажать ~ и открыть консоль, затем ввести debugtooltip и посмотреть id флота (наведите курсор на имя флота в обзоре флотов справа: в подсказке debugtooltip будет строка variable, а под ней ra_fleet_id — её число и есть id флота)\nЭто окно показывает не более 20 флотов. §!"
 wg_crisis.65.a:0 "Перевыбрать первый флот"
 wg_crisis.65.b:0 "Отменить слияние"
 wg_crisis.71.name:0 "Доступные для слияния флоты"
 wg_crisis.71.desc:0 "Выбранный вами для роспуска купленный у Сопротивления флот можно влить в другие флоты Сопротивления. Хотите объединить флоты?\n\nКак только вы распустите флот — он исчезнет навсегда!\nВажно: §Rесли последующее слияние провалится, флоты не вернутся! Выбирайте осторожно!!\n§!§YЕсли хотите объединить флоты — соответствующая опция «Слить флоты Сопротивления» есть среди указов. §!"
 wg_crisis.71.a:0 "Не нужно — я хочу их распустить."
 wg_crisis.71.b:0 "Я хочу влить их в другой флот."
