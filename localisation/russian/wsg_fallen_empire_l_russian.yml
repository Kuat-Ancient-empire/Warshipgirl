l_russian:

 PRESCRIPTED_ruler_title_wg_fe:0 "Штурман"
 NAME_awakened_wg_fallen_empire:0 "Обет Тусклых Огней"
 origin_wg_fallen_empire:0 "Странницы галактики"
 origin_wg_fallen_empire_desc:0 "Падшая империя корабельных дев провела большую часть жизни в перелётах между галактиками — вечно бегущей, выменивая бегство на мгновение покоя."
 origin_wg_fe_effect:0 "Падшая мама не сделает вам зла — она по-настоящему заботливая мать. Если только вы не поставили какой-нибудь мод, от которого все светятся."
 building_wg_fe_game_centre:0 "Большой игровой центр"
 wg_fe_game_centre_desc:0 "Место, где девы коротают время."
 building_wg_fe_game_centre_desc:0 "Игровой храм падшей империи дев: чёрная-пречёрная техника — «Коварство и Зло 4», «Симулятор японских коммунистов 5», «Бабуля 3», «Псина Великого Мин 5», «Морская звезда в банке 2», «Симулятор Симокитакавы 2», «Святой атомный муж 7», «Полужизнь 4», «Кротование 3», «Генерал 2», «Красная тревога 4», «Фронт 3», «Киберпанк 3077», «Метал Гир 6», «Волшебное зеркало красавицы O 6», «Театр Клевера», «Солёная сушёная саке 2», «Аминал 2», «Ходи-умирай 3», «Старческая лента 10», «Плачущее чудовище 6», «Передай огонь 4», «Гвент 4», «Череп 3», «Шторму — гореть 2», «Кооп-разбой 3», «Грибная Мария 2», «Титан пал 3», «Дарящий любовь 6», «Сбор мусора 5», «Большой братец 3», «Всё в нарезку: Боевой молот 3», «Умер на пляже 2», «Firepunk», «Снос 9», «Адские водилы 3», «Какать 2», «Фабрика цветных вертушек», «Точи тарелку», «Точи змею», «Точи руки», «Пудра-три-в-ряд» и прочие"
 job_wg_fe_gamer:0 "Про-киберспортсменка"
 job_wg_fe_gamer_plural:0 "Про-киберспортсменки"
 job_wg_fe_gamer_cap:0 "$job_wg_fe_gamer$"
 mod_job_wg_fe_gamer_add:0 "Про-киберспортсменка"
 job_wg_fe_gamer_desc:0 "От безумной любви к играм многие девы отреклись в домоседки, со знанием дела в играх; праздности предаются лишь потому, что всю их бытовую нужду закрыла сверхнаука."
 job_wg_fe_war_factorer:0 "Работница военного завода"
 job_wg_fe_war_factorer_plural:0 "Работницы военного завода"
 job_wg_fe_war_factorer_cap:0 "$job_wg_fe_war_factorer$"
 mod_wg_fe_war_factorer_add:0 "Работница военного завода"
 job_wg_fe_war_factorer_desc:0 "Эти девы неутомимо трудятся ради выживания империи."
 building_wg_fe_ancient_palace:0 "Центральный узел"
 building_wg_fe_ancient_palace_desc:0 "Ядро падшей империи дев: вся планетарная администрация здесь."
 building_wg_memory_data_base:0 "Архив воспоминаний"
 building_wg_memory_data_base_desc:0 "«Сколько наивных идеалов, скольких нашла лишь тоска; молчанье — и снова разочарование, сколько ран в сердцах»."
 building_wg_fe_senergy:0 "Автоматический завод ядер Глубинных"
 building_wg_fe_senergy_desc:0 "Излучение ядер Глубинных губит любую умную механику — а этот завод почему-то производит их сам, без людей. Как — неведомо."
 building_wg_fe_foundry:0 "Кузня ядер Глубинных"
 building_wg_fe_foundry_desc:0 "Чудо-здание на ядрах Глубинных: с изумляющей эффективностью обращает ресурсы в сплавы и товары массового спроса."
 building_wg_fe_stronghold:0 "Теневая крепость"
 building_wg_fe_stronghold_desc:0 "Гигантская планетарная база: арсеналы оружия предтеч и мощное поле, держащее орбитальную бомбардировку."
 building_wg_fe_energy:0 "Сингулярность 5-го уровня"
 building_wg_fe_energy_desc:0 "Лишь достаточно мощное изолирующее поле держит эту штуку в рабочем состоянии — одно из чудес падшей науки дев."
 building_wg_fe_food:0 "Чудо-столовая"
 building_wg_fe_food_desc:0 "Если киберигры — полжизни девы, то вторая половина — яства этой столовой."
 building_wg_fe_dimensional_fabricator:0 "Меж-измеренческий фабрикатор ядер"
 building_wg_fe_dimensional_fabricator_desc:0 "Здание на малопонятной иномирной науке тянет ценные ресурсы из других измерений. Между прочим, и трусики тоже; из какого измерения жертвы — мы не в курсе."
 building_wg_fe_war_factory:0 "Военный завод дев"
 building_wg_fe_war_factory_desc:0 "Исполинское здание раскрывается — внутри настоящий военный завод. Море «симуляторов» на деле готовили к войне:\nзавод «Венесуэла» под механообработку, «Звёздный мир» под космический бой, «Heavendivers» под сухопутный."
 wg_fe_war_factory_desc:0 "Военный завод"
 wg_fe_shipyard:0 "Доки Мэнск"
 wg_fe_shipyard_DESC:0 "Супер-гигантские доки на столице падшей империи, сросшиеся с её миром-кольцом."
 wg_mega_shipyard:0 "Добрые доки"
 wg_mega_shipyard_DESC:0 "Самый безумный док галактики; правда, добрый тюлень ещё не решил, как его вплести в игру."
 civic_wg_fe:0 "Лист без корней"
 civic_wg_fe_desc:0 "Этот народ дев всю жизнь скитается между галактиками, изредка оседая. Настоящего дома у них не было никогда."
 civic_wg_awakened_fe:0 "Спиной к воде"
 civic_wg_awakened_fe_desc:0 "Вся страна от края до края готовится к грядущей битве — той, что войдёт в историю галактики."
 civic_wg_awakened_fe_advance:0 "Спиной к воде"
 civic_wg_awakened_fe_advance_desc:0 "Вся страна от края до края готовится к грядущей битве — той, что войдёт в историю галактики."
 auth_wg_fe:0 "Элитарный строй дев"
 auth_wg_fe_desc:0 "Управление выстроено горсткой выкладывающихся на полную элитных дев: их самоотверженность держит страну на плаву."
 gov_wg_fe:0 "Строй элитарной лиги"
 gov_wg_fe_desc:0 "Страной и правительством правит клика элитных дев, всё помнящих о выживании рода; фракциям взяться неоткуда."
 personality_wg_fallen_empire:0 "Защитницы рода"
 personality_wg_fallen_empire_desc:0 "Эта павшая империя провела вечность в скитаниях. Кроме собственного выживания и странствий её ничто не занимает."
 personality_awakened_wg_fallen_empire:0 "Хранительницы галактики"
 personality_awakened_wg_fallen_empire_desc:0 "Эта павшая империя решила посвятить себя защите галактики от грядущего вторжения."
 opinion_wgfe_to_wsg:0 "наши дети"
 opinion_wgfe_to_sh:0 "наши дети"
 opinion_sh_to_wgfe:0 "великие предки"
 opinion_wsg_to_wgfe:0 "великие предки"
 wg_fe_ark_factory:0 "Ковчег-фабрика\n§W§YЭтот производственный модуль:\n§Hпроизводит§G огромные партии§!£energy £minerals £food £alloys £consumer_goods £sr_se £sr_pantsu§!"
 wg_fe_ark:0 "Вечный ковчег"
 SHIP_AURA_FE:0 "Мини-минный раскладчик"
 wg_fe_watchkeeper:0 "Сторож"
 wg_fe_watchkeeper2:0 "Сторож"
 fallen_UAV:0 "Дроны предтеч"
 wg_fe_guard_station:0 "Страж-башня"
 SHIP_AURA_FE_1:0 "Базовая система подавления мобильности"
 sh_planetary_ship:0 "Мировой двигатель"
 NAME_sh_fe_planetary_ship:0 "Безмолвие"
 shfe_planetary_ship_full_ruin_object_desc:0 "Начисто выведенный из строя корабль-планета — трудно даже вообразить ярость той битвы…"
 shfe_planetary_ship_full_ruin_object:0 "Остов корабля-планеты"
 wg_fe.2.desc:0 "Привет, [root.GetSpeciesNamePlural]; рады встрече — правда, мы уже сбились, которая по счёту ваша цивилизация дев.\n\nМы — §Y[wg_fallen_empire.GetName]§!, нынешние обитатели этой галактики.\n\nМы, как и вы, §Yкорабельные девы§!, потому и зашли поздороваться."
 wg_fe.2.a:0 "Рады знакомству, [wg_fallen_empire.GetName]."
 wg_fe.2.b:0 "[wg_fallen_empire.GetName], поняли."
 wg_fe.2.c:0 "…………(закрыть связь)"
 01_WG_FE_PATRONIZING_WSG:0 "Здравствуй, [From.GetSpeciesName]; вашу цивилизацию мы уже занесли в реестр — правда, какую по счёту… Они были правы."
 02_WG_FE_PATRONIZING_WSG:0 "Цените мгновение; цените место, что зовёте «домом»."
 03_WG_FE_PATRONIZING_WSG:0 "Знаете ли вы о тех глубоководных девах на юге? Мы застали их, едва придя сюда, — на наши вызовы они так и не ответили…"
 04_WG_FE_PATRONIZING_WSG:0 "Почему Глубинные с нами? Дитя, не все девы и Глубинные — смертельные враги."
 05_WG_FE_PATRONIZING_WSG:0 "[From.GetSpeciesName], дети, растите скорее. Битвы, увы, не миновать: Ночная Мара, что гонится за нами, отыщет нас вновь."
 06_WG_FE_PATRONIZING_WSG:0 "Мы вас создали? Нет-нет… Для [wg_fallen_empire.GetName] важен каждый из вас; мы любим вас, как своих детей."
 07_WG_FE_PATRONIZING_WSG:0 "§YАдмирал§!? Звучит как высокая должность. Увы, такой истории у нас не было: не у всех цивилизаций дев одно начало — запомните это."
 01_WG_FE_DISMISSIVE_WSG:0 "Вы — всего лишь одна из бессчётных встреченных нами цивилизаций."
 02_WG_FE_DISMISSIVE_WSG:0 "Здравствуйте, [From.GetSpeciesName]. До свидания."
 01_WG_FE_ANGRY_WSG:0 "Знаете, [From.GetSpeciesName], мы видели и прежде мятежных, как вы, — почти все сгинули от собственного высокомерия."
 02_WG_FE_ANGRY_WSG:0 "Держите смирение, [From.GetSpeciesName]: учиться вам ещё и учиться."
 03_WG_FE_ANGRY_WSG:0 "Перед грядущей Ночной Марой мы все равны — просто вы погибнете куда раньше."
 04_WG_FE_ANGRY_WSG:0 "За невежество и спесь вы заплатите сполна."
 01_WG_FE_WAR_GREETING_WSG:0 "Зачем вам вражда с нами?"
 02_WG_FE_WAR_GREETING_WSG:0 "Рядом с Ней вы — ничто."
 03_WG_FE_WAR_GREETING_WSG:0 "Покажите [wg_fallen_empire.GetName] вашу силу.\n\nДокажите, что способны сдержать Их — Ночную Мару, что гонится за нами."
 01_WG_FE_PATRONIZING_SH:0 "Все глубинные девы воинственны и сильны, не так ли, дорогие [From.GetSpeciesName]?"
 02_WG_FE_PATRONIZING_SH:0 "Почему Глубинные рядом с девами? Так было с нашего рождения: девы — дипломатия, Глубинные — война."
 03_WG_FE_PATRONIZING_SH:0 "[From.GetSpeciesName], дитя моё, что случилось?"
 04_WG_FE_PATRONIZING_SH:0 "Наше прошлое? Простите, об этом — почти ничего."
 05_WG_FE_PATRONIZING_SH:0 "[From.GetSpeciesName], дети, растите скорее. Битвы, увы, не миновать: Ночная Мара, что гонится за нами, отыщет нас вновь."
 06_WG_FE_PATRONIZING_SH:0 "Мы вас создали? Нет-нет… Для [wg_fallen_empire.GetName] важен каждый из вас; мы любим вас, как своих детей."
 07_WG_FE_PATRONIZING_SH:0 "Вы, [From.GetSpeciesName], бежали из дома… А, ничего — просто вспомнилось плохое."
 01_WG_FE_DISMISSIVE_SH:0 "Если дел нет — не смеем задерживать."
 02_WG_FE_DISMISSIVE_SH:0 "Здравствуйте, [From.GetSpeciesName]."
 01_WG_FE_ANGRY_SH:0 "[From.GetSpeciesName], сильных вас — много; увы, сила не лечит невежество."
 02_WG_FE_ANGRY_SH:0 "Держите смирение, [From.GetSpeciesName]: о грядущих испытаниях вы не знаете ничего."
 03_WG_FE_ANGRY_SH:0 "Перед Ней мы все лишь муравьи — просто вы погибнете куда раньше."
 04_WG_FE_ANGRY_SH:0 "Следите за тоном, [From.GetSpeciesName]."
 01_WG_FE_WAR_GREETING_SH:0 "Надо же: какая невежественность, какое высокомерие."
 02_WG_FE_WAR_GREETING_SH:0 "Мы видели Их подлинную силу — вы против Них ничто."
 03_WG_FE_WAR_GREETING_SH:0 "Докажите [wg_fallen_empire.GetName], на что способны.\n\nДокажите, что можете остановить ту Ночную Мару."
 01_WG_FE_CUSTODIAL_WG:0 "Лишь одолев Объединённый флот, мы заслужим право на жизнь."
 02_WG_FE_CUSTODIAL_WG:0 "Когда-то бегство было всей нашей цивилизацией. Теперь мы встретим судьбу лицом. [Root.GetName], покончим с этим кошмаром вместе."
 03_WG_FE_CUSTODIAL_WG:0 "[From.GetSpeciesName], дитя моё, что случилось?"
 04_WG_FE_CUSTODIAL_WG:0 "Сил [wg_fallen_empire.GetName] против Объединённого флота не хватит — но, действуя заодно, мы выстоим."
 05_WG_FE_CUSTODIAL_WG:0 "Мы отдадим всё, лишь бы осветить эту галактику."
 06_WG_FE_CUSTODIAL_WG:0 "Девять с половиной миллионов лет мы видели расставания и гибель цивилизаций и целых галактик. Мы бродили по пустоте за жалкий миг покоя — но теперь не отступим."
 07_WG_FE_CUSTODIAL_WG:0 "Не теряйте надежды, [From.GetSpeciesName]: мы переживём и это."
