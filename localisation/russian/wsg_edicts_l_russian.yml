l_russian:

 edict_wsg_nobodyzk:0 "Указ «Никто не в вакууме»"
 edict_wsg_nobodyzk_desc:0 "Этот указ обеспечивает всех корабельных дев силовыми трусиками: рабочая сила растёт, а о неловких оголениях можно забыть."
 edict_wsg_pantsureplace:0 "Программа замены товаров массового спроса"
 edict_wsg_pantsureplace_desc:0 "Тёплые трусики или холодные потребительские товары — любой в здравом уме выберет первое."
 edict_wsg_sillystudy:0 "Мистический метод учёбы"
 edict_wsg_sillystudy_desc:0 "Научно доказано: надетые на голову трусики повышают эффективность науки на 31.23451250313313515151%. — доктор Юбари"
 edict_wsg_energy:0 "Трусики-комплектующие"
 edict_wsg_energy_desc:0 "Эксперименты показали: трусики годятся как деталь высокого класса для замены энергоёмких узлов — и экономят электричество."
 edict_wsg_pantsuarmor:0 "Трусиковая броня"
 edict_wsg_pantsuarmor_desc:0 "После спецобработки трусики удивительно пластичны и прочны — идеальны как навесная броня и заделка боевых повреждений."
 edict_wsg_dj:0 "[Мероприятие Порта] Программа великой стройки"
 edict_wsg_dj_desc:0 "Грамотное применение трусиков ускоряет постройку кораблей, а девы в трусиках охотнее занимаются продолжением рода."
 edict_wsg_Ptuitu:0 "[Мероприятие Порта] Оборона армии"
 edict_wsg_Ptuitu_desc:0 "Трусики как награда эффективно поднимают боевой дух армейских дев. Сильная армия удержит наши планеты — а лучшая защита, как известно, нападение."
 edict_wsg_Stuitu:0 "[Мероприятие Порта] Объёмный штурм"
 edict_wsg_Stuitu_desc:0 "Трусики как награда эффективно поднимают боевые качества флота. Только сильный флот оградит интересы Порта."
 edict_wsg_remove_pantsu:0 "[Метод чистки] Снятие чужих трусиков"
 edict_wsg_remove_pantsu_desc:0 "Снять с еретиков трусики на публике — и 95% еретиков на месте сгорят от стыда; остальных 5% придётся довершить вручную."
 edict_wsg_folding_chair:0 "[Оптимизация жилья] Раскладные стулья"
 edict_wsg_folding_chair_desc:0 "Складные стулья радикально экономят место на складе запасных стульев."
 edict_wsg_colony:0 "[Колониальный угар] Уплотнение фей-экипажей"
 edict_wsg_colony_desc:0 "Разбирая и сжимая жилые модули фей на колониальных кораблях, мы размещаем больше корабельных дев. Ради быстрого роста колоний верим: феи поймут."
 edict_sh_remove_pantsu:0 "[Метод чистки] Снятие чужих трусиков"
 edict_sh_remove_pantsu_desc:0 "Умертвить еретиков стыдом, сняв с них трусики, — на такое изуверство способна, пожалуй, только глубинная корабельная дева."
 edict_sh_double_pantsu:0 "[Производство трусиков] Двойной протокол"
 edict_sh_double_pantsu_desc:0 "Теперь глубинные девы носят по две пары трусиков — ради роста производства."
 edict_sh_energy:0 "[Производство трусиков] Трусики-комплектующие"
 edict_sh_energy_desc:0 "Эксперименты показали: трусики годятся как деталь высокого класса для замены энергоёмких узлов — и экономят электричество."
 edict_sh_pantsuarmor:0 "[Флот Глубинных] Ремонтная броня"
 edict_sh_pantsuarmor_desc:0 "После спецобработки трусики удивительно пластичны и прочны — идеальны как навесная броня и заделка боевых повреждений."
 edict_sh_pantsubattle:0 "[Флот Глубинных] Трусиковое усиление"
 edict_sh_pantsubattle_desc:0 "Усиленный флотский вариант трусиков дарит глубинным девам комфорт, а встроенный голографический ассистент эффективно поднимает их боевые качества."
 edict_sh_senergyproduce:0 "[Производство Глубинных] Революция в горном деле"
 edict_sh_senergyproduce_desc:0 "Мощные энергетические ядра обеспечат горнодобыче неисчерпаемую энергию."
 edict_sh_senergyresearch:0 "[Производство Глубинных] Научный протокол"
 edict_sh_senergyresearch_desc:0 "Энергетические ядра дали научным установкам энергию, о которой оставалось только мечтать."
 edict_sh_alloys:0 "[Производство Глубинных] Ковка сплавов"
 edict_sh_alloys_desc:0 "Сверхэнергия ядер ускоряет ковку сплавов."
 edict_sh_dj:0 "[Флот Глубинных] Флотская программа"
 edict_sh_dj_desc:0 "Все доки насыщены энергией — впереди судостроительный бум."
 edict_sh_pantsuartisan:0 "[Производство трусиков] Трусиковые товары массового спроса"
 edict_sh_pantsuartisan_desc:0 "Просто смять трусики в комок — и вот вам лучший потребительский товар на свете."
 edict_wg_readjust_crisis:0 "Настройка сложности кризиса"
 edict_wg_readjust_crisis_desc:0 "Позволяет до начала особого кризиса корабельных дев заново настроить его сложность (не ванильный множитель) и запретить ванильные кризисы."
 edict_wg_struggle_edicts:0 "Экстренное постановление"
 edict_wg_struggle_edicts_desc:0 "Перед лицом вторжения Объединённого флота ресурсы обязаны пойти в ВПК."
 edict_wg_merge_ra_fleets:0 "Слияние флотов Сопротивления"
 edict_wg_merge_ra_fleets_desc:0 "Объединяет уцелевшие после боя флоты, купленные у Сопротивления."
 edict_wg_dominant_species:0 "Натурализация основного вида"
 edict_wg_dominant_species_desc:0 "Население слишком велико: проверка натурализации включается только этим указом, позволяя планетарным решением сливать основной вид из разных групп черт."
 edict_wg_sr_se_trait_enable:0 "£sr_se£ §Y$sr_se$§! усиление населения"
 edict_wg_sr_se_trait_enable_desc:0 "Снабжает население империи £sr_se£ §Y$sr_se$§!: за содержание в £sr_se£ §Y$sr_se$§! усиливает эффекты связанных черт."
 edict_wg_cross_assemble:0 "Перекрёстная сборка Глубинных/дев"
 edict_wg_cross_assemble_desc:0 "Глубинные и корабельные девы так похожи, что мы можем собирать ригинги друг друга — но сборочным заводам придётся потесниться под новую линию, и сборка чуть замедлится."
 edict_wsg_auto_buffing:0 "Авто-решения планет"
 edict_wsg_auto_buffing_desc:0 "§RПредупреждение для кошелька: §! в ранней игре используйте осторожно — ресурсы могут уйти в никуда\n\nВключив, все колонии без перечисленных баффов будут пытаться их получить (неисполнимые решения пропускаются), списывая ресурсы:\n§HПланетарное обручение (-648 £consumer_goods£ $consumer_goods$)§!\n§HПротокол без обувности (-1000 £energy£ $energy$)§!\n§HСборка на полную (-1500 £energy£ $energy$/4800 £time£ дней)§!\n§HМалый портал Лазурного мира (-300 £unity£ $unity$ -500 £sr_neo£ $sr_neo$)§!\n\nДалее проверка и списание — раз в год; новые колонии баффаются автоматически."
 edict_sh_auto_buffing:0 "Авто-решения планет"
 edict_sh_auto_buffing_desc:0 "§RПредупреждение для кошелька: §! в ранней игре используйте осторожно — ресурсы могут уйти в никуда\n\nВключив, все колонии без перечисленных баффов будут пытаться их получить (неисполнимые решения пропускаются), списывая ресурсы:\n§HЗарядка сборочных заводов (-1000 £energy£ $energy$/4800 £time£ дней)§!\n\nДалее проверка и списание — раз в год; новые колонии баффаются автоматически."
 edict_wg_main_menu:0 "Комплексное меню WG"
 edict_wg_main_menu_desc:0 "Меню собирает функции §Hрасового мода Warship Girls§!: открой и пользуйся всем сразу."
