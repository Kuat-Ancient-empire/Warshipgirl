l_russian:

 councilor_wg_ella:0 "Портовый консул"
 councilor_wg_ella_female:0 "Портовый консул"
 councilor_wg_ella_desc:0 "$TITLE$ Портовый консул ведает всеми делами Порта, обеспечивая безотказную работу империи."
 councilor_wg_victoria:0 "Военный командующий Порта"
 councilor_wg_victoria_female:0 "Генерал-интендант Порта"
 councilor_wg_victoria_desc:0 "$TITLE$ Этот лидер отвечает за подготовку и снабжение флотов Порта."
 councilor_wg_aurora:0 "Портовая первопроходица"
 councilor_wg_aurora_female:0 "Портовая первопроходица"
 councilor_wg_aurora_desc:0 "$TITLE$ Исследовательский дух этого лидера вдохновляет несчётных учёных бросать вызов неизвестному и копать всё глубже тайны вселенной."
 councilor_wg_elves:0 "Министр строительства Порта"
 councilor_wg_elves_female:0 "Министр строительства Порта"
 councilor_wg_elves_desc:0 "$TITLE$ Министр знает строительную отрасль назубок и всеми силами оптимизирует процессы — в основном обходя бессмысленную бюрократию."
 councilor_wg_sunflower:0 "Верховный жрец Подсолнухов"
 councilor_wg_sunflower_female:0 "Верховный жрец Подсолнухов"
 councilor_wg_sunflower_desc:0 "$TITLE$ Бывалый жрец умеет провести безупречную проповедь и любыми способами умиротворить рабочих — так, что те радостно жертвуют собой."
 councilor_wg_knight:0 "Верховная святая рыцарь"
 councilor_wg_knight_female:0 "Верховная святая рыцарь"
 councilor_wg_knight_desc:0 "$TITLE$ Этот лидер — святая рыцарь превыше всех: все члены орденов обязаны подчиняться её слову."
 councilor_wsg_super_harbor:0 "Герой войны"
 councilor_wsg_super_harbor_female:0 "Героиня войны"
 councilor_wsg_super_harbor_desc:0 "$TITLE$ В Супер-Порту армия — кратчайший путь наверх. Этот герой войны и её положение — лучший пример для всех граждан."
 councilor_sh_yamato:0 "Носительница духа трудового подвига"
 councilor_sh_yamato_female:0 "Носительница духа трудового подвига"
 councilor_sh_yamato_desc:0 "$TITLE$ Этот лидер прониклась трудовым духом Ямато и поклялась нести его вечно."
 councilor_sh_yaosai:0 "Министр флота Глубинных"
 councilor_sh_yaosai_female:0 "Министр флота Глубинных"
 councilor_sh_yaosai_desc:0 "$TITLE$ Министр отвечает за подготовку личного состава флота и армии."
 councilor_sh_eat_and_drink:0 "Министр пропаганды флота Глубинных"
 councilor_sh_eat_and_drink_female:0 "Министр пропаганды флота Глубинных"
 councilor_sh_eat_and_drink_desc:0 "$TITLE$ Отвечает за пропаганду флота Глубинных."
 councilor_sh_BOSSAP:0 "Министр логистики Глубинных"
 councilor_sh_BOSSAP_female:0 "Министр логистики Глубинных"
 councilor_sh_BOSSAP_desc:0 "$TITLE$ Министр управляет логистикой флота Глубинных, выжимая из ресурсов максимум."
 councilor_sh_CM:0 "Министр войны"
 councilor_sh_CM_female:0 "Министр войны"
 councilor_sh_CM_desc:0 "$TITLE$ Министр войны Флота Аннигиляции умеет обеспечить войну всем необходимым."
 councilor_sh_criminal_syndicate:0 "Министр подрывных операций"
 councilor_sh_criminal_syndicate_female:0 "Министр подрывных операций"
 councilor_sh_criminal_syndicate_desc:0 "$TITLE$ Преступный синдикат «Ниспровергателей», свергая чужие режимы, приносит флоту Глубинных выгоду; задача министра — выбивать больше фондов и расширять влияние."
 councilor_sh_AP_NET:0 "Генеральный управляющий сети снабжения"
 councilor_sh_AP_NET_female:0 "Генеральный управляющий сети снабжения"
 councilor_sh_AP_NET_desc:0 "$TITLE$ Управляющий ведает всей сетью кораблей снабжения страны: повышает уровень жизни глубинных дев, снижает потери и экономит ресурсы."
 councilor_uf_1:0 "Министр мегаструктур Объединения"
 councilor_uf_1_female:0 "Министр мегаструктур Объединения"
 councilor_uf_1_desc:0 "$TITLE$ Министр курирует великие стройки."
 councilor_uf_2:0 "Министр иностранных дел Объединения"
 councilor_uf_2_female:0 "Министр иностранных дел Объединения"
 councilor_uf_2_desc:0 "$TITLE$ Самое обаятельное существо галактики: никто не устоит перед её дипломатическими предложениями."
 councilor_uf_3:0 "Главный администратор Объединения"
 councilor_uf_3_female:0 "Главный администратор Объединения"
 councilor_uf_3_desc:0 "$TITLE$ Выдающийся политик: её приказы исполняются с точностью до знака."
 councilor_uf_4:0 "Министр милосердия Объединения"
 councilor_uf_4_female:0 "Министр милосердия Объединения"
 councilor_uf_4_desc:0 "$TITLE$ Министр умеет утихомирить народ и гарантировать стабильность."
 councilor_uf_5:0 "Начальник военных академий Объединения"
 councilor_uf_5_female:0 "Начальник военных академий Объединения"
 councilor_uf_5_desc:0 "$TITLE$ Министр отвечает за вербовку и подготовку лучших офицеров империи."
