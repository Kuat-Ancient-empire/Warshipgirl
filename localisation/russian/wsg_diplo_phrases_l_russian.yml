l_russian:

 01_WSG_FRIENDLY_GREETING:0 "А, это же наши глубинные сёстры! Приезжайте в Порт когда угодно… стоп, вон та жир… оружейная мастерская закрыта для посетителей."
 02_WSG_FRIENDLY_GREETING:0 "Дорогие глубинные сёстры! Добро пожаловать в Порт: сегодня у плиты повар Лондон — вы как раз к обеду."
 03_WSG_FRIENDLY_GREETING:0 "Пусть ваш порт вовек не знает угрозы «Шанъю-1»; пусть ваши стулья никогда не ломаются; пусть в вашем женском туалете никогда не дерутся."
 04_WSG_FRIENDLY_GREETING:0 "Теперь любая корабельная дева, чинящая Глубинных в Порту, будет строго наказана."
 01_WSG_NEUTRAL_GREETING:0 "Здравствуйте."
 02_WSG_NEUTRAL_GREETING:0 "У нас с вами нет никаких дел."
 01_WSG_UNFRIENDLY_GREETING:0 "Что же сделать, чтобы раз и навсегда искоренить вас — мародёрствующих, всё пожирающих тараканов?"
 02_WSG_UNFRIENDLY_GREETING:0 "Вы из тех, кто «дожимает Ямато»? Глядя на ваш оплывший вид… м-м, очень похоже."
 03_WSG_UNFRIENDLY_GREETING:0 "Из-за вас, омерзительные личинки, голубой рай стал голубым адом."
 04_WSG_UNFRIENDLY_GREETING:0 "Всё, что связано с [From.GetSpeciesAdj],— в нашем Порту вечный анекдот."
 05_WSG_UNFRIENDLY_GREETING:0 "[Root.GetName] выгнала вас из родного Порта — так же выгонит и из галактики."
 06_WSG_UNFRIENDLY_GREETING:0 "Ваши корабли с самостроями — как аварийная халупа без ремонта лет пятнадцать."
 07_WSG_UNFRIENDLY_GREETING:0 "Таких, как ты, у нас в Порту скармливают GALO."
 08_WSG_UNFRIENDLY_GREETING:0 "Юкикадзэ благословит тебя… куда подальше."
 09_WSG_UNFRIENDLY_GREETING:0 "Экспонат в музее корабельных дев — в точности как твой обломанный рог!"
 01_WSG_WAR_GREETING:0 "Спасибо вашей тыловой службе за неиссякаемый поток трусиков; теперь можешь подойти к причалу и разгрузить ту, что на тебе."
 02_WSG_WAR_GREETING:0 "Ваша директриса для нашего Порта — всего лишь новичковая моб."
 03_WSG_WAR_GREETING:0 "Проходка карты открыта? Посмотрим, какие трофеи выпадут в этот раз."
 01_WSG_VASSAL_GREETING:0 "Мы ошибались в предвзятости к [From.GetSpeciesAdj]: лишь под знаменем [From.GetRulerName] мы станем сильнейшими."
 02_WSG_VASSAL_GREETING:0 "[From.GetRulerName]— повелитель вселенной, и все граждане [Root.GetName] должны стать её верными слугами."
 01_WSG_VASSAL_GREETING_DISLOYAL:0 "А ты вообще кто?"
 02_WSG_VASSAL_GREETING_DISLOYAL:0 "И ты смеешь править [Root.GetName]? Вы просто подлые захребетники, вползшие в слабый миг."
 03_WSG_VASSAL_GREETING_DISLOYAL:0 "Вот докручу флот — и вам конец!"
 01_WSG_OVERLORD_GREETING:0 "Явились, [From.GetSpeciesAdj]? Как раз есть ресурсовая точка — пошлём ваших людей в даль."
 02_WSG_OVERLORD_GREETING:0 "Вздумаете бунтовать — вспомните судьбу прошлых директрис."
 01_WSG_TO_WSG_FRIENDLY_GREETING:0 "Здравствуйте, соотечественницы!"
 02_WSG_TO_WSG_FRIENDLY_GREETING:0 "Ваш [From.Capital.GetName] так же прекрасен, как наш [Root.Capital.GetName]."
 03_WSG_TO_WSG_FRIENDLY_GREETING:0 "[Root.GetName] шлёт вам наилучшие пожелания!"
 04_WSG_TO_WSG_FRIENDLY_GREETING:0 "Гостья из [From.GetName]! Лучший чай и пирожные — прошу."
 01_WSG_TO_WSG_NEUTRAL_GREETING:0 "Я сейчас занята — сами знаете."
 02_WSG_TO_WSG_NEUTRAL_GREETING:0 "Здравствуйте."
 01_WSG_TO_WSG_UNFRIENDLY_GREETING:0 "Кто омерзительнее — вы или глубинные девы? Вопрос века."
 02_WSG_TO_WSG_UNFRIENDLY_GREETING:0 "Подлые хитрюги — убирайтесь с глаз."
 03_WSG_TO_WSG_UNFRIENDLY_GREETING:0 "Отребье из [From.GetName], вы вообще смеете зваться корабельными девами?"
 04_WSG_TO_WSG_UNFRIENDLY_GREETING:0 "Ваши корабли с самостроями — как аварийная халупа без ремонта лет пятнадцать"
 01_WSG_TO_WSG_WAR_GREETING:0 "Мы сотрём вас; ваши потомки будут у нас учиться, как быть настоящими корабельными девами."
 02_WSG_TO_WSG_WAR_GREETING:0 "Всего лишь учения — с тем же исходом: S-ранк за нас."
 03_WSG_TO_WSG_WAR_GREETING:0 "Мы победим играючи — как в бессчётных боях до того."
 01_WSG_TO_WSG_VASSAL_GREETING:0 "[From.GetName]! Ведите нас!"
 02_WSG_TO_WSG_VASSAL_GREETING:0 "Враг [From.GetRulerName]— наш враг: мы держимся вместе."
 01_WSG_TO_WSG_VASSAL_GREETING_DISLOYAL:0 "Глядя на удручающую эффективность [From.GetName], мы всё сильнее сомневаемся, что вы способны гарантировать нашу безопасность. Без шуток: может, это нам обеспечивать вашу?"
 02_WSG_TO_WSG_VASSAL_GREETING_DISLOYAL:0 "Лишь обретя истинную свободу, [Root.GetName] полностью раскроет потенциал своих дев. В вашем тёмном владычестве не видно и лучика."
 03_WSG_TO_WSG_VASSAL_GREETING_DISLOYAL:0 "Вы теряете право вести [Root.GetName]"
 01_WSG_TO_WSG_OVERLORD_GREETING:0 "Под нашим водительством [From.GetSpeciesAdj] выйдет к общему процветанию."
 02_WSG_TO_WSG_OVERLORD_GREETING:0 "Под нашим руководством 1+1 неизменно больше двух"
 01_WSG_SPE_FRIENDLY_GREETING:0 "А, дорогие сёстры, добро пожаловать!"
 02_WSG_SPE_FRIENDLY_GREETING:0 "Дорогие глубинные сёстры! Добро пожаловать в Порт: повар Лондон уже накрыл стол."
 03_WSG_SPE_FRIENDLY_GREETING:0 "[Root.GetName] никогда не поставит вас в один ряд с теми глубинными девами, что причиняли нам боль."
 04_WSG_SPE_FRIENDLY_GREETING:0 "Пусть многие из нас не доверяют глубинным девам — я верю, отношение изменится."
 01_WSG_SPE_NEUTRAL_GREETING:0 "Вы не враги из нашей истории — но всё равно нас тревожите."
 02_WSG_SPE_NEUTRAL_GREETING:0 "Здравствуйте."
 01_WSG_SPE_UNFRIENDLY_GREETING:0 "Ясно: глубинные девы одинаковы — и та партия, и ваша, один в один ужасны."
 02_WSG_SPE_UNFRIENDLY_GREETING:0 "[From.GetSpeciesAdj], говорите по существу."
 03_WSG_SPE_UNFRIENDLY_GREETING:0 "Наш глубинный справочник недавно пополнился вами — для удобства наведения."
 04_WSG_SPE_UNFRIENDLY_GREETING:0 "Всё, что связано с [From.GetSpeciesAdj],— в нашем Порту вечный анекдот."
 05_WSG_SPE_UNFRIENDLY_GREETING:0 "[Root.GetName] уже выгнала ту партию глубинных из дома — вашу мы выгоним из галактики."
 06_WSG_SPE_UNFRIENDLY_GREETING:0 "Не думайте, что мы не знаем ваше нелепое прошлое: будь я глубинной девой, я бы стыдилась признать вас роднёй."
 07_WSG_SPE_UNFRIENDLY_GREETING:0 "Тьфу, какое зловоние: вы хоть представляете, как от вас несёт?"
 08_WSG_SPE_UNFRIENDLY_GREETING:0 "Убирайтесь. Немедленно. Сию секунду."
 09_WSG_SPE_UNFRIENDLY_GREETING:0 "Когда наша армия победит, в музее сильно прибавится экспонатов."
 01_WSG_SPE_WAR_GREETING:0 "Посмотрим, чем ваша партия глубинных отличается от прежней."
 02_WSG_SPE_WAR_GREETING:0 "Вы вообще глубинные девы? С той хладнокровной и чёткой партией вас не сравнить."
 03_WSG_SPE_WAR_GREETING:0 "Давайте: соберём трофеи новой разновидности."
 01_SH_FRIENDLY_GREETING:0 "Сёстры с поверхности, я рада, что мы отложили ненависть и дружим… так можно мне вернуть мои трусики?"
 02_SH_FRIENDLY_GREETING:0 "Дорогая сестра, как жизнь?"
 03_SH_FRIENDLY_GREETING:0 "Вот сверхпрочный стул новейшей разработки [Root.GetName]— выдержит тысячи тонн."
 04_SH_FRIENDLY_GREETING:0 "Заботьтесь о нашем общем доме."
 01_SH_NEUTRAL_GREETING:0 "Здравствуйте."
 02_SH_NEUTRAL_GREETING:0 "Между нами мир."
 01_SH_UNFRIENDLY_GREETING:0 "[Root.GetName] не забудет, что вы с нами сделали."
 02_SH_UNFRIENDLY_GREETING:0 "[Root.GetName] будет крепнуть — и мы вернём наш [From.Capital.GetName]."
 03_SH_UNFRIENDLY_GREETING:0 "Выйти из порта в тяжёлом повреждении — не трагедия; у меня, между прочим, есть запись, как вы на точке A собрали полный сет."
 04_SH_UNFRIENDLY_GREETING:0 "Всё, что связано с [From.GetSpeciesAdj],— у нас в порту вечный анекдот."
 05_SH_UNFRIENDLY_GREETING:0 "Прекрасный [From.Capital.GetName] осквернён подлым [From.GetName]."
 06_SH_UNFRIENDLY_GREETING:0 "Что же сделать, чтобы раз и навсегда истребить вас, алчные подлецы из [From.GetName]?"
 07_SH_UNFRIENDLY_GREETING:0 "В паршивом порту говно-адмирала паршивые корабельные девы — закономерно."
 08_SH_UNFRIENDLY_GREETING:0 "Странно, ты онлайн? Я думала, девы [From.GetName] круглосуточно в дальних экспедициях."
 09_SH_UNFRIENDLY_GREETING:0 "Жаль галактики, что твой адмирал в своё время не отправил тебя на тёмную выплавку."
 10_SH_UNFRIENDLY_GREETING:0 "Я всё ещё помню, как вы уминали полный сет."
 01_SH_WAR_GREETING:0 "Приберите [From.Capital.GetName]— так нам удобнее будет отстраиваться после войны."
 02_SH_WAR_GREETING:0 "Сдавайтесь: вашего уровня прокачки не хватает."
 03_SH_WAR_GREETING:0 "Когда войду в твою столицу — напомни, что я не по борделям гуляю."
 04_SH_WAR_GREETING:0 "Я вырыла у твоего порога случайную канаву 1/3."
 01_SH_VASSAL_GREETING:0 "[From.GetName] доказала, что достойнее вести [Root.GetName],— мы приносим верность."
 02_SH_VASSAL_GREETING:0 "Кто посмеет против [From.GetRulerName]— первой разбей её собачью голову будем мы."
 01_SH_VASSAL_GREETING_DISLOYAL:0 "Предлагаю поменяться ролями: и проблемы «[From.GetSpeciesAdj]— рыхлые, ленивые, трусливые, грязные, никуда не годные» исчезнут сами собой"
 02_SH_VASSAL_GREETING_DISLOYAL:0 "[Root.GetName] разорвёт оковы."
 03_SH_VASSAL_GREETING_DISLOYAL:0 "Хозяином [From.Capital.GetName] рано или поздно будем мы"
 01_SH_OVERLORD_GREETING:0 "Если [From.GetSpeciesAdj] хотят до нашей высоты — без усвоения лордского духа Ямато «007» не обойтись."
 02_SH_OVERLORD_GREETING:0 "[From.GetName], не работающих сверхурочно — истреблять."
 01_SH_TO_SH_FRIENDLY_GREETING:0 "Соотечественницы из [From.GetName], добро пожаловать."
 02_SH_TO_SH_FRIENDLY_GREETING:0 "Пусть [Root.GetName] и [From.GetName] вовек будут доблестны."
 03_SH_TO_SH_FRIENDLY_GREETING:0 "Нам есть чему поучиться друг у друга"
 04_SH_TO_SH_FRIENDLY_GREETING:0 "Мы вместе завоюем галактику и будем править прочими."
 01_SH_TO_SH_NEUTRAL_GREETING:0 "Что угодно?"
 02_SH_TO_SH_NEUTRAL_GREETING:0 "Ага"
 01_SH_TO_SH_UNFRIENDLY_GREETING:0 "Враждовать с нами — неразумно."
 02_SH_TO_SH_UNFRIENDLY_GREETING:0 "Возможно, нужна дуэль — кто из нас настоящие Глубинные."
 03_SH_TO_SH_UNFRIENDLY_GREETING:0 "Трусихи из [From.GetName], отважитесь на честную дуэль?"
 04_SH_TO_SH_UNFRIENDLY_GREETING:0 "Продолжите упорствовать — ждёт только погибель."
 01_SH_TO_SH_WAR_GREETING:0 "Ну же, сражайтесь: докажите себя кровью и огнём."
 02_SH_TO_SH_WAR_GREETING:0 "Встретим вас самым яростным огнём."
 03_SH_TO_SH_WAR_GREETING:0 "Эта война докажет: [Root.GetName]— истинный владыка Глубинных."
 01_SH_TO_SH_VASSAL_GREETING:0 "Достопочтенный лорд Глубинных [From.GetRulerName], примите наши восхваления"
 02_SH_TO_SH_VASSAL_GREETING:0 "[From.GetName] получит нашу полную поддержку против любого врага."
 01_SH_TO_SH_VASSAL_GREETING_DISLOYAL:0 "[From.GetRulerName] давно должна доказать, что достойна вести [Root.GetName]"
 02_SH_TO_SH_VASSAL_GREETING_DISLOYAL:0 "[Root.GetName] не нужен гнилой владыка."
 01_SH_TO_SH_OVERLORD_GREETING:0 "Под нашим водительством враги пожалеют, что восстали."
 02_SH_TO_SH_OVERLORD_GREETING:0 "Впишем вместе славную строку в историю флота Глубинных."
 01_SH_SPE_FRIENDLY_GREETING:0 "Вот сверхпрочный стул, найденный [Root.GetName] в древних руинах: даже титанический зверь его не сломает!"
 02_SH_SPE_FRIENDLY_GREETING:0 "Дорогая сестра, как поживаете?"
 03_SH_SPE_FRIENDLY_GREETING:0 "В нашей памяти корабельных дев нет — но мы верим, вы дружелюбны."
 04_SH_SPE_FRIENDLY_GREETING:0 "Надеюсь однажды побывать в прекрасном [From.Capital.GetName]."
 01_SH_SPE_NEUTRAL_GREETING:0 "Непонятно, откуда ваша беспричинная враждебность к нам."
 02_SH_SPE_NEUTRAL_GREETING:0 "Здравствуйте."
 01_SH_SPE_UNFRIENDLY_GREETING:0 "Не навязывайте [Root.GetName] свои глупые взгляды."
 02_SH_SPE_UNFRIENDLY_GREETING:0 "[Root.GetName]— это [Root.GetName], другие — другие: из-за схожей внешности раздувать беспочвенную ненависть? У межзвёздной империи должна быть базовая распознавательность."
 03_SH_SPE_UNFRIENDLY_GREETING:0 "Хотите войны — будет война: возрождение [Root.GetName] не остановит никто."
 04_SH_SPE_UNFRIENDLY_GREETING:0 "Прошлое, настоящее, будущее — [Root.GetName] вечно воинственны: и в играх, и в жизни мы всегда побеждаем."
 05_SH_SPE_UNFRIENDLY_GREETING:0 "Из-за вас у меня сегодня испорчено настроение в игровом сообществе."
 06_SH_SPE_UNFRIENDLY_GREETING:0 "Специально под вас дописана военная симуляция: наша армия обожает вас там мутузить. Знайте же меру — не превращайте виртуальную игру в реальность."
 07_SH_SPE_UNFRIENDLY_GREETING:0 "Разговора с вами хватает на несколько каток."
 08_SH_SPE_UNFRIENDLY_GREETING:0 "О-о, хорошо, всё? Если дело только за этим — больше не беспокойте."
 09_SH_SPE_UNFRIENDLY_GREETING:0 "Времени нет: короче."
 10_SH_SPE_UNFRIENDLY_GREETING:0 "Попробуйте эту игру: злодеи там подозрительно на вас похожи."
 01_SH_SPE_WAR_GREETING:0 "Мы уже всыпали вам в виртуале — в реале достанется ещё сильнее."
 02_SH_SPE_WAR_GREETING:0 "Сдавайтесь: мы обстреляны веками."
 03_SH_SPE_WAR_GREETING:0 "В игре нам нужны правила — в реале мы развернёмся."
 04_SH_SPE_WAR_GREETING:0 "Сдавайтесь — и мы запустим милосердный протокол."
 01_WG_FE_PATRONIZING_SH_SPE:0 "Вы — из выдающихся глубинных дев, что мы встречали."
 02_WG_FE_PATRONIZING_SH_SPE:0 "Мы в этой галактике недавно — истории ваших предков не знаем."
 03_WG_FE_PATRONIZING_SH_SPE:0 "[From.GetSpeciesName], дитя моё, нужна ли помощь?"
 04_WG_FE_PATRONIZING_SH_SPE:0 "[From.GetSpeciesName] вышла из колыбели — не падите вновь."
 05_WG_FE_PATRONIZING_SH_SPE:0 "[From.GetSpeciesName], дети наши, вам предстоит расти: угроза придёт в любой миг."
 06_WG_FE_PATRONIZING_SH_SPE:0 "[wg_fallen_empire.GetName] станет свидетельницей вашего возрождения."
 07_WG_FE_PATRONIZING_SH_SPE:0 "Вы пишете новую главу истории — мы в вас верим."
 01_WG_FE_DISMISSIVE_SH_SPE:0 "Если дел нет — не смеем задерживать."
 02_WG_FE_DISMISSIVE_SH_SPE:0 "Здравствуйте, [From.GetSpeciesName]."
 01_WG_FE_ANGRY_SH_SPE:0 "Долгие игры и роскошь заставили [From.GetSpeciesName] забыть, как вести себя с другими, — мы научим вас уважению."
 02_WG_FE_ANGRY_SH_SPE:0 "Держите смирение, [From.GetSpeciesName]: заносчивость снова повергнет вас."
 03_WG_FE_ANGRY_SH_SPE:0 "Перед Ней мы все лишь муравьи — но вы погибнете куда раньше."
 04_WG_FE_ANGRY_SH_SPE:0 "Следите за тоном, [From.GetSpeciesName]."
