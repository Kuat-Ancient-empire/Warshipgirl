l_russian:

 WGS_army:0 "Тяжёлый легион корабельных дев"
 WGS_army_desc:0 "С прогрессом науки корабельные девы вырвались из океана: в ригингах они сражаются в любой среде."
 381_cannon_army:0 "Автономная парящая батарея 381 мм"
 381_cannon_army_desc:0 "Автономная парящая башня чётко исполняет приказы и стоит копейки; единственный минус — выливает на цель чересчур много огня."
 WGS_kodiak:0 "«Кадьяк»"
 WGS_kodiak_desc:0 "Исполинский корабль вертикальной посадки, способный летать у орбиты: размеры и мощь сделают его кошмаром врага."
 WGS_helldivers:0 "Адские корабельные девы"
 WGS_helldivers_desc:0 "Невзрачные на вид, преисполненные гуманизма, обычно четвёрками, в чёрных плащах — эти спецкоманды безупречно выполняют заведомо невыполнимые задачи.\nЭто и есть суперсолдаты — адские корабельные девы. Из чувства высокого благородства они принимают только специализированные транспортные корабли и отвергают корабли планетарного подавления."
 WGS_galodam:0 "GaloDam"
 WGS_galodam_desc:0 "С новейшей генной наукой GaloDam стал боевой махиной высотой в тысячи метров."
 SH_army:0 "Армия Глубинных"
 SH_army_desc:0 "Юниты Глубинных не ведают страха; могучие орудия на ригингах — их лучший аргумент."
 SH_BOSS:0 "Директриса Глубинных"
 SH_BOSS_desc:0 "Сильнейшая директриса Глубинных сама выходит на поле, разнося смерть в каждый его уголок."
 YAMATO_executioner:0 "Палач Ямато"
 YAMATO_executioner_desc:0 "Боевой мех высотой в десятки тысяч метров — ни одна армия её не удержит."
