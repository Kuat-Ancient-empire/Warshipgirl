 monolith_crisis.10000.g.tooltip:0 "Включить кризис теневого вторжения.\nПосле завершения Меча Объединения кризис запустится через время, заданное справа.\n§RЕсли Меч Объединения уже построен — нажатие запустит кризис немедленно! §!"
