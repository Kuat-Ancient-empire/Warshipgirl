 coming_monolith_crisis_poi_2_poi:0 "Точка контакта"
 coming_monolith_crisis_poi_2_poi_desc:0 "По расчёту курса цели чёрные монолиты прибудут в эту систему"
 coming_monolith_crisis_poi_3_poi:0 "Точка контакта"
 coming_monolith_crisis_poi_3_poi_desc:0 "По расчёту курса цели чёрные монолиты прибудут в эту систему"
 coming_monolith_crisis_poi_4_poi:0 "Точка контакта"
