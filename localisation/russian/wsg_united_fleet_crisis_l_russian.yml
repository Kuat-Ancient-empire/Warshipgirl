 monolith_crisis.5.name:0 "Резонансные частоты монолитов"
 monolith_crisis.5.desc:0 "Мы провели первый бой с монолитами.\nСлучилось странное: наши атаки, похоже, §Rна них не действуют§!.\nБорттехники провели анализ и выяснили: чёрные монолиты умеют резонансными частотами гасить наши удары, причём частота у каждого своя.\n\nНо монолиты не всесильны: теоретически, непрерывно ведя огонь, можно перегрузить их и в конце концов причинить вред — расчётное время§H 30 дней§!. А если во флоте есть§G корабль РЭБ Объединённого флота§!, анализ резонансных частот ускорится, и наши флоты начнут вредить раньше.\nВдобавок такие крупные платформы, как§G Обсидиановая цитадель§! и§G Объединённая слава§!, несут ещё более продвинутые тактические компьютеры и вычислят нужные данные быстрее кораблей РЭБ."
 monolith_crisis.5.a:0 "Знай врага — и сто битв не проиграешь"
 monolith_crisis.101.name:0 "Грядущая тень"
 monolith_crisis.101.desc:0 "Наши сверхмерные сенсоры засекли за пределами галактики скопление аномальных сигналов. Внимательное сравнение показало: все эти объекты имеют форму правильных прямоугольников……\n\nДа, несущий нашей галактике бесконечный цикл§Y Возвращающий§! уже почти достиг нас! Таинственные чёрные монолиты!!\n\nПо их траекториям мы рассчитали системы, куда прибудет рой чёрных монолитов……"
 monolith_crisis.101.a:0 "Немедленно общегалактическая трансляция! Красное военное оповещение!!"
 monolith_crisis.101.tooltip:0 "§YСистемы прибытия чёрных монолитов отмечены в журнале§!"
 monolith_crisis.102.name:0 "Грядущая тень"
 monolith_crisis.102.desc:0 "Мы получили от Объединённого флота общегалактическую трансляцию: в ней предсказывается вторжение неизвестной враждебной силы, что Объединённый флот зовёт§Y Возвращающими§!, и перечислены координаты систем их прибытия.\n\nОбъединённый флот заявил, что подтвердил существование этого врага на недавних раскопках. Наша разведка подтверждает: весь Объединённый флот перешёл в состояние войны……"
 monolith_crisis.102.a:0 "Встанем с ними плечом к плечу! Мы возьмёмся за оружие и отстоим право жить!!"
 monolith_crisis.102.b:0 "Быть может, это лишь предлог для военной экспансии Объединённого флота"
 monolith_crisis.102.c:0 "Наша главная задача сейчас — провести Закон о защите Тияньчи"
 monolith_crisis.104.name:0 "Пришествие"
 monolith_crisis.104.desc:0 "По данным сенсоров мы подтвердили: рой чёрных монолитов прибыл в§H [monolith_invasion_system.GetName]§! и соседние системы. Вместе с монолитами прибыло и их обращение ко всей галактике……"
 monolith_crisis.104.a:0 "Принять сигнал"
 monolith_crisis.105.name:0 "Пришествие"
 monolith_crisis.105.desc:0 "Раннее предупреждение Объединённого флота, разосланное по всей галактике, подтвердилось. Таинственные чёрные монолиты прибыли в§H [monolith_invasion_system.GetName]§! и соседние системы — и уже явили агрессивность. Вместе с монолитами прибыло и их обращение ко всей галактике……"
 monolith_crisis.105.a:0 "Принять сигнал"
 monolith_crisis.106.name:0 "Монолиты"
 monolith_crisis.106.desc:0 "Здравствуйте, обитатели галактики; не пугайтесь.\nПримите даруемое вами возвышение и не сопротивляйтесь. Большинство из вас станет более совершенным существом."
 monolith_crisis.106.a:0 "Что это за дрянь вообще такая"
 monolith_crisis.106.b:0 "Флотам — боевая готовность!"
 monolith_crisis.107.name:0 "Монолиты"
 monolith_crisis.107.desc:0 "Здравствуйте. Что бы вы хотели узнать?"
 monolith_crisis.107.a:0 "Вы и есть те самые§Y Возвращающие§!?"
 monolith_crisis.107.a.response:0 "§YВозвращающие§! — имя, данное нам цивилизациями галактики в§G 1442-м цикле§!; это лишь одно из множества одинаково ничтожных прозвищ.\nНо наше истинное имя — не тайна: мы —§BПафект-монолиты§!, совершенные существа.\nКстати, эта информация, как и всё прочее, по окончании текущего цикла будет§R очищена§!"
 monolith_crisis.107.b:0 "Что вы собираетесь с нами делать?"
 monolith_crisis.107.b.response:0 "Мы возведём на возвышение всех достаточно совершенных индивидов, дабы они стали такими же совершенными, как мы. Недостаточно совершенных же мы перезагрузим и вернём на место — вместе с их мирами, даруя им шанс начать заново."
 monolith_crisis.107.c:0 "Что вы такое, в конце концов?"
 monolith_crisis.107.c.response:0 "§BПафект-монолиты§!, совершенные существа.\nВзгляните на каждого из нас: эти совершенные точные пропорции — конечный ответ на всё сущее."
 monolith_crisis.107.d:0 "Мы знаем, что вы творили"
 monolith_crisis.107.d.response:0 "Крайне недоумеваем. По завершении каждого цикла мы проводим полную зачистку: вы не должны знать ничего непозволенного.\nВаша цивилизация будет назначена особым объектом наблюдения и по окончании текущего цикла — вычищена с пристрастием."
 monolith_crisis.107.e:0 "Мы изгоним вас из этой галактики"
 monolith_crisis.107.e.response:0 "Высокопарное красноречие, слышанное и прежде; наша работа не пострадает."
 monolith_crisis.110.name:0 "Второй плацдарм"
 monolith_crisis.110.desc:0 "Через десятки дней после прибытия роя чёрных монолитов в нашу галактику мы обнаружили большие скопления монолитов и вблизи§H [monolith_invasion_system.GetName]§!! Как они ускользнули от всех средств обнаружения — неизвестно; скорее всего, первый плацдарм был отвлекающим……"
 monolith_crisis.110.a:0 "Хитрюги"
 monolith_crisis_node_poi_1_name:0 "Разрушить Барьер монолитов α"
 monolith_crisis_node_poi_1_desc:0 "Монолитное давление этих могучих массивов не даёт нам приблизиться: любая попытка войти в систему оказалась§R тщетной§!.\n\nНыне§Y Меч Объединения§! — наша единственная надежда! Но прежде нужно разрушить соответствующие узлы щита, чтобы опустить защитный купол системы-барьера."
 monolith_crisis_node_poi_2_name:0 "Разрушить Барьер монолитов β"
 monolith_crisis_node_poi_2_desc:0 "$monolith_crisis_node_poi_1_name$"
 monolith_crisis_node_poi_3_name:0 "Разрушить Барьер монолитов γ"
 monolith_crisis_node_poi_3_desc:0 "$monolith_crisis_node_poi_1_name$"
 monolith_crisis_node_poi_4_name:0 "Разрушить Ядро монолитов"
 monolith_crisis_node_poi_4_desc:0 "По данным разведки, эта система — Ядро монолитов, источник всякого зла. Мы будем Мечом Объединения снимать с него броню пласт за пластом, пока не обнажится его хрупкая сердцевина, — и собственноручно покончим с его высокомерием."
 monolith_crisis_shield_node_poi_1_name:0 "Разрушить Щит монолитов α "
 monolith_crisis_shield_node_poi_1_desc:0 "Окружающие звезду массивы монолитов дают Барьерам монолитов аномально сильную защиту; пока мы не уничтожим оборонительный флот этой системы, §YМеч Объединения§! не сможет нанести дальний удар."
 monolith_crisis_shield_node_poi_2_name:0 "Разрушить Щит монолитов β "
 monolith_crisis_shield_node_poi_2_desc:0 "$monolith_crisis_shield_node_poi_1_desc$"
 monolith_crisis_shield_node_poi_3_name:0 "Разрушить Щит монолитов γ "
 monolith_crisis_shield_node_poi_3_desc:0 "$monolith_crisis_shield_node_poi_1_desc$"
 monolith_crisis.116.name:0 "Первый Барьер монолитов"
 monolith_crisis.116.desc:0 "Сверхмерные сенсоры помогли нам захватить первый Барьер монолитов: полчища чёрных монолитов непрерывным потоком вторгаются в наш мир через этот барьер и его порталы.\n\nМонолитное давление системы-барьера изгоняет любой корабль, что попробует войти, — но мы можем дальним ударом§Y Меча Объединения§! разрушить барьер. Прежде, однако, придётся уничтожить питающие его щитом системы узлов, дабы опустить защитный купол барьера."
 monolith_crisis.116.a:0 "Собрать все наши флоты"
 monolith_crisis.117.name:0 "Второй Барьер монолитов"
 monolith_crisis.117.desc:0 "Мы захватили второй Барьер монолитов и его узел щита; оборонительное давление будет ещё больше — нужно разрушить это место как можно скорее!"
 monolith_crisis.117.a:0 "Мы не отступим"
 monolith_crisis.118.name:0 "Третий Барьер монолитов"
 monolith_crisis.118.desc:0 "Третий Барьер монолитов раскрыт: полчища чёрных монолитов хлещут из него. Узел отмечен на карте! Мы обязаны всеми силами разрушить это проклятое место."
 monolith_crisis.118.a:0 "Мы сотрём их из галактики начисто"
 monolith_crisis.119.name:0 "Ядро монолитов"
 monolith_crisis.119.desc:0 "Мы разрушили все Барьеры монолитов, и источник кошмара циклов нашей галактики найден —§RЯдро монолитов§!\nЕго броня снята с него пласт за пластом, от его высокомерия не осталось и следа! Ещё один удар — и победа наша!!"
 monolith_crisis.119.a:0 "Что бы это ни стоило — мы одержим окончательную победу!"
 monolith_crisis_gate_1:0 "Врата монолитов α"
 monolith_crisis_gate_1_DESC:0 "Врата монолитов соединены с окраиной Предела монолитов: чтобы ударить по глубинам Предела, мы сперва обязаны разрушить мир-щит за этими вратами."
 NAME_monolith_crisis_bypass_1:0 "Врата монолитов α"
 monolith_crisis_bypass_1_name:0 "Врата монолитов α"
 monolith_crisis_bypass_1_desc:0 "В системе есть§Y Врата монолитов α§!"
 monolith_crisis_gate_2:0 "Врата монолитов β"
 monolith_crisis_gate_2_DESC:0 "Врата монолитов соединены с окраиной Предела монолитов: чтобы ударить по глубинам Предела, мы сперва обязаны разрушить мир-щит за этими вратами."
 NAME_monolith_crisis_bypass_2:0 "Врата монолитов β"
 monolith_crisis_bypass_2_name:0 "Врата монолитов β"
 monolith_crisis_bypass_2_desc:0 "В системе есть§Y Врата монолитов β§!"
 monolith_crisis_gate_3:0 "Врата монолитов γ"
 monolith_crisis_gate_3_DESC:0 "Врата монолитов соединены с окраиной Предела монолитов: чтобы ударить по глубинам Предела, мы сперва обязаны разрушить мир-щит за этими вратами."
 NAME_monolith_crisis_bypass_3:0 "Врата монолитов γ"
 monolith_crisis_bypass_3_name:0 "Врата монолитов γ"
 monolith_crisis_bypass_3_desc:0 "В системе есть§Y Врата монолитов γ§!"
 monolith_gate_no_access:0 "$TRIGGER_FAIL$ Врата ещё не взломаны — использование невозможно"
 monolith_crisis.151.name:0 "Заслон монолитов"
 monolith_crisis.151.desc:0 "Наш флот вошёл в Барьер монолитов и попытался разрушить эту важную для монолитов систему.\n\nНо вездесущее монолитное давление нанесло нашим кораблям непереносимый урон — пришлось экстренно уходить в подпространство ради спасения флота.\n\nФакт доказан: любой вход в Барьер монолитов — самоубийство. Нам придётся использовать§Y Меч Объединения§!, пробивая купол сфокусированным сверхмерным веществом."
 monolith_crisis.151.a:0 "Это уже не рядовая угроза — надо бить§Y Мечом Объединения§!, и бить от души"
 monolith_crisis.204.name:0 "[from.GetName] перезагружен"
 monolith_crisis.204.desc:0 "Мир [from.GetName], окружённый монолитами и не получивший помощи вовремя, потерян для нас. По наблюдениям, всё население поглощено монолитами, а некогда цветущий [from.GetName] перезагружен в неколонизированный мир без следа индустрии и высших разумных существ……"
 monolith_crisis.204.a:0 "Мы обязаны их остановить"
 monolith_crisis.205.name:0 "[from.GetName] перезагружен"
 monolith_crisis.205.desc:0 "Новейшие данные: некогда цветущий мир [from.GetName] перезагружен под ударами монолитов. Весь мир обращён в первозданную планету без каких-либо индустриальных основ; большинство прежних жителей поглощено и искажено монолитами, остались единицы — но и те отброшены к первобытности……"
 monolith_crisis.205.a:0 "Непростительно……"
 monolith_crisis.213.name:0 "Бурь всё больше"
 monolith_crisis.213.desc:0 "Помимо уже свирепствующих в галактике флотов монолитов, за её пределами мы засекли всё больше активных сигналов; ближайшая волна прибудет примерно через год. Системы высадки отмечены в разведжурнале"
 monolith_crisis.213.a:0 "Быть наготове"
 monolith_crisis.214.name:0 "Пришествие"
 monolith_crisis.214.desc:0 "Засечённые ранее флоты монолитов высадились в нашей галактике. Дай мы им волю свирепствовать — положение наше будет всё хуже и хуже."
 monolith_crisis.214.a:0 "Уничтожить их подчистую!"
 monolith_crisis.300.name:0 "Обратная разработка монолитов"
 monolith_crisis.300.desc:0 "Мы уничтожили и собрали часть обломков кораблей монолитов — и воочию ощутили, сколь передовы эти технологии; кое-что для нас сейчас иначе как§R магией§! не назовёшь.\nНо наша блистательная наука нащупала точки прорыва: мы можем путём обратной разработки поднять нашу боеспособность и получить преимущество в грядущей войне."
 monolith_crisis.300.a:0 "Начинаем разбор"
 reverse_engineering_monolith_weapon:0 "Обратная разработка монолитов"
 reverse_engineering_monolith_weapon_DESC:0 "Пусть принципы многих технологий монолитов нам ещё не по зубам, наши учёные нашли возможные точки прорыва, чтобы через обратную разработку поднять боеспособность и получить преимущество в грядущей войне."
 monolith_crisis.301.name:0 "Разбор удался"
 monolith_crisis.301.desc:0 "Неустанными трудами мы освоили часть технологий монолитов и слили их с нашим вооружением. Эти мощные пушки и броня заметно поднимут нашу боеспособность и дадут преимущество в будущих войнах."
 monolith_crisis.301.a:0 "Их же приёмом — по ним самим"
 monolith_crisis.321.name:0 "Пафект-монолиты"
 monolith_crisis.321.desc:0 "Как вы посмели скрестить свои выродившиеся технологии с совершенными§B монолитами§!? Эти уродливые примитивные поделки вызывают у нас отвращение."
 monolith_crisis.321.a:0 "Вы сами напросились"
 monolith_crisis.302.name:0 "Врата монолитов α"
 monolith_crisis.302.desc.a:0 "Мы нашли невиданное сооружение монолитов: как и большинство их конструкций, оно целиком чёрное, но пространственно-сгибающее поле в середине подтверждало: это гигантский портал — именно через них монолиты перебрасываются по нашей галактике. Мы назвали их§Y Вратами монолитов§!\n\nКак пользоваться этими вратами, мы ещё не знаем, но несомненно: за ними скрываются миры монолитов."
 monolith_crisis.302.desc.b:0 "Мы нашли Врата монолитов; но в отличие от виденных прежде их пространственно-сгибающее поле окрашено красным — мы назвали их§R Вратами монолитов α§!. Их сверхсветовая резонансная частота совершенно иная, значит, этот тип врат придётся взламывать заново."
 monolith_crisis.302.desc.c:0 "Мы нашли Врата монолитов типа§Y α§!: можно разрушить эту угрозу, чтобы монолиты не перебрасывали сюда флоты, — а можно сохранить врата как вход для нашего будущего контрудара."
 monolith_crisis.302.a:0 "Попробовать взломать"
 monolith_crisis.302.b:0 "Разрушить эти врата"
 monolith_crisis.302.c:0 "Они станут нашим входом для контрудара — не рушить"
 monolith_crisis.303.name:0 "Врата монолитов β"
 monolith_crisis.303.desc:0 "Мы нашли Врата монолитов; но в отличие от виденных прежде их пространственно-сгибающее поле окрашено синим — мы назвали их§B Вратами монолитов β§!. Их сверхсветовая резонансная частота совершенно иная, значит, этот тип врат придётся взламывать заново."
 monolith_crisis.303.desc.b:0 "Мы нашли Врата монолитов типа§B β§!: можно разрушить эту угрозу, чтобы монолиты не перебрасывали сюда флоты, — а можно сохранить врата как вход для нашего будущего контрудара."
 monolith_crisis.304.name:0 "Врата монолитов γ"
 monolith_crisis.304.desc:0 "Мы нашли Врата монолитов; но в отличие от виденных прежде их пространственно-сгибающее поле окрашено жёлтым — мы назвали их§Y Вратами монолитов γ§!. Их сверхсветовая резонансная частота совершенно иная, значит, этот тип врат придётся взламывать заново."
 monolith_crisis.304.desc.b:0 "Мы нашли Врата монолитов типа§Y γ§!: можно разрушить эту угрозу, чтобы монолиты не перебрасывали сюда флоты, — а можно сохранить врата как вход для нашего будущего контрудара."
 monolith_crisis.305.name:0 "§RВрата монолитов α§! взломаны!"
 monolith_crisis.305.desc:0 "Наша наука взломала сверхсветовую резонансную частоту§R Врат монолитов α§!: наши флоты смогут безопасно проходить красные врата и бить по Пределу монолитов за ними! Мы также передадим по всей галактике весть выжившим, неся всем цивилизациям надежду."
 monolith_crisis.305.a:0 "Отлично"
 monolith_crisis.305.tooltip:0 "§RВрата монолитов α§! теперь доступны нам"
 hack_monolith_gate_red:0 "Взломать сверхсветовую резонансную частоту§R Врат монолитов α§!"
 hack_monolith_gate_red_DESC:0 "Наши учёные попытаются взломать сверхсветовую резонансную частоту красных Врат монолитов, чтобы получить возможность ими пользоваться."
 last_monolith_crisis_gate_1:0 "Это последние§R Врата монолитов α§!, ещё не разобранные! Нам нужны хотя бы одни§R Врата α§! для контрудара по системам монолитов!"
 monolith_crisis.306.name:0 "§BВрата монолитов β§! взломаны!"
 monolith_crisis.306.desc:0 "Наша наука взломала сверхсветовую резонансную частоту§B Врат монолитов β§!: наши флоты смогут безопасно проходить синие врата и бить по Пределу монолитов за ними! Мы также передадим по всей галактике весть выжившим, неся всем цивилизациям надежду."
 monolith_crisis.306.a:0 "Великолепно"
 monolith_crisis.306.tooltip:0 "§BВрата монолитов β§! теперь доступны нам"
 hack_monolith_gate_blue:0 "Взломать сверхсветовую резонансную частоту§B Врат монолитов β§!"
 hack_monolith_gate_blue_DESC:0 "Наши учёные попытаются взломать сверхсветовую резонансную частоту синих Врат монолитов, чтобы получить возможность ими пользоваться."
 last_monolith_crisis_gate_2:0 "Это последние§B Врата монолитов β§!, ещё не разобранные! Нам нужны хотя бы одни§B Врата β§! для контрудара по системам монолитов!"
 monolith_crisis.307.name:0 "§YВрата монолитов γ§! взломаны"
 monolith_crisis.307.desc:0 "Наша наука взломала сверхсветовую резонансную частоту§Y Врат монолитов γ§!: наши флоты смогут безопасно проходить жёлтые врата и бить по Пределу монолитов за ними! Мы также передадим по всей галактике весть выжившим, неся всем цивилизациям надежду."
 monolith_crisis.307.a:0 "Победа будет за нами"
 monolith_crisis.307.tooltip:0 "§YВрата монолитов γ§! теперь доступны нам"
 hack_monolith_gate_yellow:0 "Взломать сверхсветовую резонансную частоту§Y Врат монолитов γ§!"
 hack_monolith_gate_yellow_DESC:0 "Наши учёные попытаются взломать сверхсветовую резонансную частоту жёлтых Врат монолитов, чтобы получить возможность ими пользоваться."
 last_monolith_crisis_gate_3:0 "Это последние§Y Врата монолитов γ§!, ещё не разобранные! Нам нужны хотя бы одни§Y Врата γ§! для контрудара по системам монолитов!"
 monolith_crisis.312.name:0 "Заря надежды"
 monolith_crisis.312.desc:0 "Объединённый флот вышел на общегалактическую трансляцию и раскрыл, как одолеть сопротивление сверхсветовой резонансной частоты§R Врат монолитов α§!; они зовут нас к совместному отпору — отстоять право нашей галактики на жизнь."
 monolith_crisis.313.desc:0 "Объединённый флот вышел на общегалактическую трансляцию и раскрыл, как одолеть сопротивление сверхсветовой резонансной частоты§B Врат монолитов β§!; они зовут нас к совместному отпору — отстоять право нашей галактики на жизнь."
 monolith_crisis.314.desc:0 "Объединённый флот вышел на общегалактическую трансляцию и раскрыл, как одолеть сопротивление сверхсветовой резонансной частоты§Y Врат монолитов γ§!; они зовут нас к совместному отпору — отстоять право нашей галактики на жизнь."
 monolith_crisis.312.a:0 "Победа будет за нами"
 monolith_crisis.308.name:0 "Врата монолитов разрушены"
 monolith_crisis.308.desc:0 "После череды опасных работ наша инженерная команда уничтожила одни Врата монолитов, отключив их от сети порталов монолитов.\nОтключённые врата превратились в самый обычный камень."
 monolith_crisis.308.a:0 "Отличная работа"
 destroy_monolith_gate:0 "Разрушить Врата монолитов"
 destroy_monolith_gate_DESC:0 "Чтобы помешать монолитам вторгаться в галактику через портал, мы отправим строительный корабль на опасную разборку — с целью разрушить эти Врата монолитов подчистую."
 monolith_crisis.309.name:0 "§RЩит монолитов α§!"
 monolith_crisis.309.desc:0 "Наш флот вошёл в систему Щита монолитов α за красными вратами: окружающие звезду массивы монолитов дают соединённому с ними Барьеру α аномально сильную защиту. Лишь уничтожив гарнизон системы и массивы монолитов, мы откроем§Y Мечу Объединения§! дорогу для удара."
 monolith_crisis.309.a:0 "Тяжёлый бой"
 monolith_crisis.310.name:0 "§BЩит монолитов β§!"
 monolith_crisis.310.desc:0 "Предел монолитов за синими вратами составлен из окружающих звезду массивов монолитов и огромного гарнизона; массивы дают связанному с ними Барьеру β мощную защиту. Не снести эти помехи§Y Мечу Объединения§! — не видать нам победы."
 monolith_crisis.310.a:0 "Снести их"
 monolith_crisis.311.name:0 "§YЩит монолитов γ§!"
 monolith_crisis.311.desc:0 "Мы вошли в Щит монолитов γ: мощные массивы монолитов защищают его, не давая§Y Мечу Объединения§! бить напрямую. Нужно уничтожить флот обороны и массивы монолитов!"
 monolith_crisis.311.a:0 "Победа будет за нами"
 monolith_crisis.315.name:0 "Щит§R Барьера монолитов α§! опущен"
 monolith_crisis.315.desc:0 "Мы пробили оборону§R Щита монолитов α§! и начисто разрушили питающие купол§R Барьера α§! массивы! Теперь нужно как можно быстрее открыть из Меча Объединения огонь по§R Барьеру монолитов α§!.\n\n§YКак только Меч Объединения произведёт залп, флоты следует заранее вывести из систем щита: мощнейшая сверхмерная ударная волна уничтожит Врата монолитов, и флотам останется лишь медленно возвращаться подпространственным ходом. §!"
 monolith_crisis.315.a:0 "Трубить победу"
 monolith_crisis.315.b:0 "Немедленно навести Меч Объединения на§R Барьер монолитов α§!"
 monolith_crisis.316.name:0 "Щит§B Барьера монолитов β§! опущен"
 monolith_crisis.316.desc:0 "Мы разрушили массивы монолитов в§B Щите β§! — одна из помех Мечу Объединения устранена.\n\n§YКак только Меч Объединения произведёт залп, флоты следует заранее вывести из систем щита: мощнейшая сверхмерная ударная волна уничтожит Врата монолитов, и флотам останется лишь медленно возвращаться подпространственным ходом. §!"
 monolith_crisis.316.a:0 "Час монолитов пробил"
 monolith_crisis.316.b:0 "Немедленно навести Меч Объединения на§B Барьер монолитов β§!"
 monolith_crisis.317.name:0 "Щит§Y Барьера монолитов γ§! опущен"
 monolith_crisis.317.desc:0 "Массивов монолитов в§Y Щите γ§! больше нет: прятавшийся за слоями щитов§Y Барьер монолитов γ§! выставлен под ствол Меча Объединения…… Нужно как можно быстрее разрушить эту столь важную для монолитов систему-барьер.\n\n§YКак только Меч Объединения произведёт залп, флоты следует заранее вывести из систем щита: мощнейшая сверхмерная ударная волна уничтожит Врата монолитов, и флотам останется лишь медленно возвращаться подпространственным ходом. §!"
 monolith_crisis.317.a:0 "Победа будет за нами"
 monolith_crisis.317.b:0 "Немедленно навести Меч Объединения на§Y Барьер монолитов γ§!"
 monolith_crisis.318.name:0 "Массивы§R Щита монолитов α§! восстановлены!"
 monolith_crisis.318.desc:0 "Мы не успели вовремя обстрелять Барьер монолитов, и под почти самоубийственной контратакой монолитов массивы в§R Щите α§! отстроены заново — купол снова встал над§R Барьером монолитов α§!…… Придётся ломать массивы ещё раз."
 monolith_crisis.318.a:0 "Чёрт"
 monolith_crisis.319.name:0 "Массивы§B Щита монолитов β§! восстановлены!"
 monolith_crisis.319.desc:0 "Мы не помешали монолитам пересобрать массивы в§B Щите β§!: купол снова встал над§B Барьером монолитов β§!, и систему придётся брать заново."
 monolith_crisis.319.a:0 "Проклятье"
 monolith_crisis.320.name:0 "Массивы§Y Щита монолитов γ§! восстановлены!"
 monolith_crisis.320.desc:0 "Мы однажды разрушили массивы в§Y Щите γ§!, но Мечом Объединения по§Y Барьеру γ§! вовремя не ударили — и монолиты отстроили купольные массивы; систему придётся брать заново."
 monolith_crisis.320.a:0 "Нужно ускориться"
 monolith_crisis.322.name:0 "Пафект-монолиты"
 monolith_crisis.322.desc:0 "Что вы наделали? Разрушили один из наших массивов?! За миллиарды лет никто не смел совершать подобного кощунства.\n\nК счастью, этот массив не так велик — мы его отстроим, и расчёт с вами не прекратится!\n\n§YНе помешай — и монолиты§!§R за 2 года§!§Y отстроят массив! Поставьте гарнизон или немедленно ударьте Мечом Объединения по соответствующему Барьеру§!"
 monolith_crisis.322.a:0 "Смешно"
 monolith_crisis.323.name:0 "§RБарьер монолитов α§! разрушен"
 monolith_crisis.323.desc:0 "§RБарьер монолитов α§! полностью уничтожен ударом Меча Объединения: гигантская масса сверхмерного вещества поглотила все монолиты — их сигналов больше нет; соединённые с ним Врата монолитов α тоже отключились, обратившись в никчёмные камни.\nОчевидно, это исполинское сооружение слишком ценно для монолитов: восстановить его они не в силах."
 monolith_crisis.323.a:0 "Чаша победы склоняется к нам"
 monolith_crisis.324.name:0 "§BБарьер монолитов β§! разрушен"
 monolith_crisis.324.desc:0 "Слава Меча Объединения очистила эту падшую греховную систему: все монолиты в ней и исполинское сооружение монолитов уничтожены; вместе с ними пали и Врата монолитов β — монолитам больше не злодействовать в нашей галактике через эти порталы!\nОчевидно, это исполинское сооружение слишком ценно для монолитов: восстановить его они не в силах."
 monolith_crisis.324.a:0 "Вдохновляющая весть!"
 monolith_crisis.325.name:0 "§YБарьер монолитов γ§! разрушен"
 monolith_crisis.325.desc:0 "Наши наблюдения подтверждают: §YБарьер монолитов γ§! полностью уничтожен Мечом Объединения! Соединённые с ним Врата монолитов γ тоже отключились.\nОчевидно, это исполинское сооружение слишком ценно для монолитов: восстановить его они не в силах."
 monolith_crisis.325.a:0 "Эту победу будут воспевать из рода в род!"
 monolith_crisis.326.name:0 "Пафект-монолиты"
 monolith_crisis.326.desc:0 "Вы…… что вы наделали?! Как вы посмели разрушить наш драгоценнейший§B Барьер Пафект§!?!! Не может быть!! Как вам это удалось?!…… Это непростительно……"
 monolith_crisis.326.a:0 "Спите под§Y огнём Меча Объединения§!"
 monolith_crisis.326.a.response:0 "§YМеч Объединения§!?! Его не должно существовать!! Наш§R обман с межсистемным оружием§! никогда не давал осечек: вы должны были, как и цивилизации до вас, послушно строить по нашим ложным подсказкам никчёмный хлам на манер Галактической пушки, промотав гору времени и ресурсов!! Как вы его осуществили??!!!"
 monolith_crisis.326.b:0 "Мы сломаем ваше высокомерие"
 monolith_crisis.326.b.response:0 "Вы будете стёрты вместе со своей новой игрушкой — без следа…… Вечное возвышение не остановится……"
 monolith_crisis.327.desc:0 "Вы повторяете ошибку: разрушать наши§B Барьеры Пафект§! — непростительный грех. Почему вы отвергаете наше славное возвышение? Почему отказываетесь стать совершенными?"
 monolith_crisis.327.a:0 "Ваш конец уже близок"
 monolith_crisis.327.a.response:0 "Гнев — низменное чувство, но теперь вы изведаете наш гнев……"
 monolith_crisis.328.desc:0 "Нет…… вы разрушили и тот совершенный мир-барьер…… Умоляю, прекратите; не губите наше драгоценнейшее ядро — оно всё, что у нас осталось. Мы можем отменить это возвышение…… а вам будет позволено уйти…… хорошо?"
 monolith_crisis.328.a:0 "Стереть вас во всех смыслах — вот наша миссия"
 monolith_crisis.328.a.response:0 "Нет…… вы…… за что……"
 monolith_crisis.329.name:0 "Заря победы"
 monolith_crisis.329.desc:0 "§HЗаря победы§! озарила всю галактику: Объединённый флот нанёс по Пафект-монолитам последний удар и уничтожил все монолиты до единого.\n\nОбъединённый флот объявил по всей галактике: цикл длиной в миллиарды лет разбит, грядёт§G новая эра§!.\n\nОглядываясь назад, жертвы, принесённые ими в этой катастрофе, чудовищны — мы обязаны воздать им высшие почести."
 monolith_crisis.329.a:0 "Слава Объединению"
 monolith_crisis.330.name:0 "Окончательная победа"
 monolith_crisis.330.desc:0 "Сияние Меча Объединения, словно клинок, рассекло бесконечную тьму — мы уничтожили все монолиты.\n\nНо цена победы огромна: все наши миры повреждены в той или иной мере, несчётные жизни сгинули в звёздной пустыне…… Но мы считаем, что оно того стоило: мы разбили цикл длиной в миллиарды лет, кровью и слезами отстояли право жить. Наш подвиг будет записан, нашу историю будут воспевать из рода в род — в этой войне§Y герой§! каждый!"
 monolith_crisis.330.a:0 "Слава Объединению!"
 monolith_crisis.331.name:0 "Тьмы миров"
 monolith_crisis.331.desc:0 "Мы победили и, разобрав обломки монолитов, узнали детали тысяч циклов…… Печаль эта навела и на размышления: §Yа есть ли в других галактиках чёрные монолиты или нечто подобное? §!\n\nК тому же архивные записи показывают: род кораблей-дев вечно рождался и исчезал — словно иной§R цикл§!. И как сильнейшая из известных цивилизаций кораблей-дев, мы считаем своим долгом этому помешать; к тому же, запертые в этой малой галактике, мы и сами канем в реку времени.\n\nПосле долгих обсуждений Объединённый флот от верхов до низов решил единогласно: мы покидаем эту галактику и начинаем настоящий§Y Великий поход§! — спасать и принимать всех сородичей-кораблей-дев."
 monolith_crisis.331.a:0 "Слава Объединению!"
 monolith_crisis.331.tooltip:0 "Дальше — ритуал удаления сейва; мы уже тянем-тянем"
 monolith_crisis.333.desc:0 "Вы…… убили нас всех…… за что…… поче……\n\n§YСигнал монолитов слабеет, пока не исчезает совсем. §!"
 monolith_crisis.333.a:0 "Вы заслужили этот конец"
 monolith_crisis.334.name:0 "Последняя буря"
 monolith_crisis.334.desc:0 "После разрушения последней системы-барьера мы засекли за пределами галактики массу сигналов. Полагаем, это укрытые Пафект-монолиты — они готовят последний рывок. Их позиции ловко спрятаны у самой нашей галактики: по расчётам учёных, до прибытия§R осталось полгода§!. Системы высадки отмечены в разведжурнале."
 monolith_crisis.334.a:0 "Быть наготове"
 monolith_crisis.335.name:0 "Пришествие"
 monolith_crisis.335.desc:0 "Засечённые ранее массы флотов монолитов высадились в нашей галактике. Весьма вероятно, это последнее крупное вторжение, на которое они способны!"
 monolith_crisis.335.a:0 "Уничтожить их подчистую!"
 hm_jammer_build_situation:0 "Сверхмерный экранизатор"
 hm_jammer_build_situation_type:0 "$hm_jammer_build_situation$"
 hm_jammer_build_situation_desc:0 "Чтобы уменьшить вред от перегрузки Меча Объединения и сверхмерной сети нашим мирам, нужно установить сверхмерные экранизаторы.\nЕсли запустить Меч Объединения до завершения установки, все наши колонии пострадают сильнее."
 hm_jammer_build_situation_monthly_change_tooltip:0 "Скорость строительства сверхмерного экранизатора зависит от выбранного§Y решения§!"
 situation_hm_jammer_normal:0 "Обычная стройка"
 situation_hm_jammer_speed_up:0 "Ускоренная стройка"
 hm_jammer_build_50:0 "Низкая готовность экранизатора"
 hm_jammer_build_100:0 "Высокая готовность экранизатора"
 situation_hm_jammer_normal_tooltip:0 "Сверхмерный экранизатор строится обычными темпами"
 situation_hm_jammer_speed_up_tooltip:0 "Влив гору ресурсов и людей, ускорить постройку экранизатора на§G 20%§!"
 hm_jammer_build_0_effects:0 "Экранизатор не достроен: при ударе по системе ядра наши колонии получат§R тяжелейший урон§!"
 hm_jammer_build_50_effects:0 "Готовность экранизатора — 50%: урон от перегрузки сверхмерной сети§G снизится на 30%§!"
 hm_jammer_planet_buff:0 "Сверхмерный экранизатор: готов"
 hm_jammer_planet_buff_desc:0 "§YВсе сооружения этой колонии отключены от сверхмерной сети§!\nПосле сверхмерного перегрузочного удара Меча Объединения планета получит§G на 60% меньше§! урона"
 hm_jammer_planet_buff_50:0 "Сверхмерный экранизатор: черновая готовность"
 hm_jammer_planet_buff_50_desc:0 "§YЧасть сооружений этой колонии отключена от сверхмерной сети§!\nТекущая готовность: §Y[this.hm_jammer_progress_perc]§!%\nПосле сверхмерного перегрузочного удара Меча Объединения планета получит§G на 20% меньше§! урона"
 hm_jammer_planet_buff_0:0 "Сверхмерный экранизатор: не готов"
 hm_jammer_planet_buff_0_desc:0 "Текущая готовность: §Y[this.hm_jammer_progress_perc]§!%\nПосле сверхмерного перегрузочного удара Меча Объединения планета получит§R 100% урона§!"
 decision_build_hm_jammer:0 "Всей силой строить сверхмерный экранизатор"
 decision_build_hm_jammer_effect:0 "По завершении готовность экранизатора вырастет§G ещё на 20%§!\n§YПосле запуска этого решения на 720 дней постройки и районы будут§!§R давать на 100% меньше§!§Y ресурсов, а население на рабочих местах —§!§R на 50% меньше§!§Y (минус 50% сверх текущих бонусов выработки). §! Отмена решения снимет и дебафф."
 decision_build_hm_jammer_desc:0 "Влив ресурсы, ускорить установку сверхмерного экранизатора."
 decision_build_hm_jammer_debuff:0 "Всей силой строить сверхмерный экранизатор"
 decision_build_hm_jammer_debuff_desc:0 ""
 decision_build_hm_jammer_debuff_2:0 "Всей силой строить сверхмерный экранизатор"
 decision_build_hm_jammer_debuff_2_desc:0 ""
 situation_hm_jammer_finished_planet_tooltip:0 "Доля планет без завершённого экранизатора"
 monolith_crisis.332.name:0 "Сверхмерный экранизатор"
 monolith_crisis.332.desc:0 "Мы разрушили все§B Барьеры монолитов§! — и вместе с ними исчезли помехи Святилища монолитов. Теперь мы ясно видим на звёздной карте систему, что для монолитов — святая святых.\n\nУничтожив этот последний мир монолитов, мы одержим окончательную победу!\nНо монолитное давление Святилища куда сильнее любого сооружения монолитов, и вдобавок его прикрывает могучий купол — твердыня монолитов несокрушима.\n\nОднако есть последний путь: §Hперегрузить§! Меч Объединения и пробить их защиту на предельной мощности. Но это изуродует, а то и§R угробит§! нашу сверхмерную сеть, а самые сверхмерные колонии пострадают сильнее всех. Ради окончательной победы, ради разбитого цикла, ради права жить мы обязаны чем-то пожертвовать — мы нанесём последний удар по этому миллиардолетнему кошмару!!\n\nЧтобы уменьшить урон колониям, нам нужно установить экранизаторы."
 monolith_crisis.332.a:0 "Перегрузить Меч Объединения и сверхмерную сеть! Всем колониям — приготовиться."
 monolith_crisis.336.name:0 "Сверхмерный экранизатор: 50%"
 monolith_crisis.336.desc:0 "Мы вчерне завершили установку экранизаторов: часть сооружений уже отключена от сверхмерной сети, но множество населения и важных объектов всё ещё без защиты.\n\nЕсли выстрелить§Y Мечом Объединения§! прямо сейчас, потерь не миновать."
 monolith_crisis.336.a:0 "Нужно взвесить всё как следует"
 monolith_crisis.337.name:0 "Установка экранизаторов завершена"
 monolith_crisis.337.desc:0 "Мы завершили установку сверхмерных экранизаторов в этом мире: масса второстепенных сооружений отключена от сверхмерной сети, жители колоний размещены с заботой — они говорят, что ради победы нет неприемлемой цены.\n\nКак бы мы ни старались, все понимают: полностью оградиться от§R последствий§! перегрузочного залпа и паралича сверхмерной сети нельзя. Остаётся молиться, чтобы финальный урон оказался§G меньше§! ожидаемого……"
 monolith_crisis.337.a:0 "Будем надеяться"
 monolith_crisis.337.b:0 "Немедленно навести Меч Объединения на§Y Святилище монолитов§!"
 monolith_crisis.340.name:0 "§H[root.GetName]§! закончил раньше срока"
 monolith_crisis.340.desc:0 "При нашей полной поддержке§H [root.GetName]§! завершил установку сверхмерного экранизатора досрочно."
 monolith_crisis.340.a:0 "Отличная работа — но дел ещё много."
 uf_end_story_chain_title:0 "Уход"
 uf_end_story_chain_desc:0 "Мы вырвали у монолитов право на жизнь и обеспечили нашей галактике существование на тысячи поколений. Но мы считаем: у сородичей-кораблей-дев в иных мирах, возможно, та же беда, что была у нас; и если засидеться в этой малой галактике — нас поглотит река времени.\nПотому мы покидаем эту галактику и уходим в неведомые миры — начинать настоящий§Y Великий поход§!, спасая и принимая всех сородичей-кораблей-дев."
 uf_end_story_1:0 "Звёздная колея Объединения"
 uf_end_story_1_DESC:0 "Звёздная колея Объединения — новейшая сверхмерная сеть; её сверхмерные линии пробивают любые пространственные пределы и способны связать всю вселенную и даже неведомые параллельные миры. Достроив её, мы возьмём её за точку старта настоящего§Y Великого похода§!"
 NAME_uf_gate_system:0 "Звёздная колея Объединения"
 NAME_uf_rectangular_system:0 "Галактический монумент"
 uf_end_story_1_poi:0 "Построить мегасооружение: Звёздная колея Объединения"
 uf_end_story_1_poi_desc:0 "Эти великие врата откроют новую страницу нашей цивилизации. Достроив их, мы возьмём их за точку старта настоящего§Y Великого похода§!"
 uf_end_story_2_poi:0 "Построить мегасооружение: Галактический монумент§H (опционально)§!"
 uf_end_story_2_poi_desc:0 "Из данных и обломков монолитов мы можем возвести грандиозный монумент — в память о наших великих предтечах, чтобы потомки помнили их самоотверженность, жертвы и труд."
 uf_end_story_3_poi:0 "Активировать Звёздную колею Объединения"
 uf_end_story_3_poi_desc:0 "Все приготовления к отходу завершены — время поднимать паруса."
 monolith_crisis.341.name:0 "Перед отходом"
 monolith_crisis.341.desc:0 "Проект Звёздной колеи Объединения готов; осталось лишь вложить ресурсы — и врата, знаменующие новый этап нашей цивилизации, будут воздвигнуты.\n\nВместе с этим завершён сбор всех монолитов: мы извлекли их данные — память миллиардов лет. Из неё можно возвести грандиозный монумент в память об окончании цикла и о самоотверженности предтеч."
 monolith_crisis.341.a:0 "Слава Объединению"
 monolith_crisis.342.name:0 "Платформа Звёздной колеи Объединения"
 monolith_crisis.342.desc:0 "Строительная платформа Звёздной колеи Объединения готова в§H [uf_gate_system.GetName]§!; продолжаем вкладывать ресурсы в её сверхмерный короб и каркас."
 monolith_crisis.342.a:0 "Отлично"
 monolith_crisis.343.name:0 "Звёздная колея Объединения построена"
 monolith_crisis.343.desc:0 "Звёздная колея Объединения воздвигнута, исполинский портал зажёгся. Неведомые миры ждут нас впереди.\nЗавершив приготовления, мы сможем через врата попасть куда пожелаем."
 monolith_crisis.343.a:0 "Пора готовиться к прощанию……"
 monolith_crisis.344.name:0 "Платформа Галактического монумента"
 monolith_crisis.344.desc:0 "Платформа Галактического монумента готова в§H [uf_rectangular_system.GetName]§!; ради вечного хранения нужно выстроить для него сверхмерный короб."
 monolith_crisis.344.a:0 "Отлично"
 monolith_crisis.345.name:0 "Галактический монумент построен"
 monolith_crisis.345.desc:0 "Из всех монолитов и извлечённой истории мы воздвигли монумент за монументом; они стройно стоят внутри сверхмерного короба.\n\nДеяния нашего поколения и труды великих предтеч будут храниться в этом монументе вечно, а нашу историю будут воспевать из рода в род."
 monolith_crisis.345.a:0 "Герой — каждый"
 monolith_crisis.346.name:0 "Отплытие"
 monolith_crisis.346.desc:0 "Великий поход начался: со славой и благословениями мы держим курс на новые миры.\nМы посетим один неведомый мир за другим, найдём всех сородичей-кораблей-дев, подарим им помощь и надежду и осветим славой Объединённого флота каждый тёмный угол.\nА теперь —§Hидём вперёд с надеждой! §!"
 monolith_crisis.346.a:0 "Идём вперёд с надеждой"
 monolith_crisis.347.name:0 "Верховный флагман госпожа Чжан"
 monolith_crisis.347.desc:0 "Вот и вся древнейшая история нашего рода; полагаю, ты вообразил(а) полотно эпического размаха.\nА теперь, §HКэбот§!, ты официально стала высшей звёздной наместницей — пора вести свою первую церемонию."
 monolith_crisis.347.a:0 "Я готова"
 monolith_crisis.347.a.response:0 "Прекрасно. Славы тебе и Объединению"
 monolith_crisis.349.name:0 "[uf_end_story_thank_country_1.GetName]"
 monolith_crisis.349.desc:0 "Мы слышали, что ваша держава готовится покинуть галактику; от имени§Y [uf_end_story_thank_country_1.GetName]§! приносим вам высшие благословения! Без ваших трудов мы не пережили бы этот катаклизм. Да осветит ваша слава каждый уголок вселенной. §HСлава Объединению! §!"
 monolith_crisis.349.a:0 "Спасибо вам!"
 monolith_crisis.351.name:0 "[uf_end_story_thank_country_2.GetName]"
 monolith_crisis.351.desc:0 "Вы точно уходите? Мы не мыслим галактику без вас…… Но если решение твёрдо — примите благословения всей§Y [uf_end_story_thank_country_2.GetName]§!. Когда ваше великое дело свершится — заходите проведать. И наконец —§Hслава Объединению! §!"
 monolith_crisis.351.a:0 "Мы чувствуем ваши благословения!"
 monolith_crisis.353.name:0 "[uf_end_story_thank_country_3.GetName]"
 monolith_crisis.353.desc:0 "Это благословения от§Y [uf_end_story_thank_country_3.GetName]§!: мы не забудем вашу самоотверженность и жертвы в этом кризисе, наши потомки будут воспевать вашу историю; желаем вам попутного ветра в бесконечных странствиях, и наконец —§Hслава Объединению! §!"
 monolith_crisis.353.a:0 "Благодарим!"
 monolith_crisis.355.name:0 "[uf_end_story_thank_fallen_country.GetName]"
 monolith_crisis.355.desc:0 "Мы вынуждены признать: даже в расцвете§Y [uf_end_story_thank_fallen_country.GetName]§! нам не было и доли от вас. Вы — образец для всех цивилизаций, ярчайшее из существований за всю историю.\nОт всего сердца благословляем вас. §HСлава Объединению! §!"
 monolith_crisis.355.a:0 "Спасибо!"
 opinion_after_monolith_crisis:0 "Спасли всю галактику"
 monolith_crisis.356.name:0 "Прыжковые двигатели отказали!"
 monolith_crisis.356.desc:0 "Вскоре после засечения чёрных монолитов вся галактика подверглась неведомым помехам: §Hпрыжковые двигатели§! всех кораблей§R отказали§!……\nПолагаем, это один из знаков приближения так называемых§Y Возвращающих§!; пока что нам доступны лишь обычные гиперкоридоры и врата.\nКак снять этот вредный эффект — нам ещё предстоит выяснить……"
 monolith_crisis.356.a:0 "Скверно……"
 monolith_crisis.356.b:0 "Быть может, станция предупреждения об опасностях что-нибудь да разберёт……"
 monolith_crisis.356.tooltip:0 "§YПрыжковые двигатели всех кораблей отключены§!"
 monolith_crisis_jump_drivers_ban:0 "§BПомехи монолитов§!"
 we_need_ews:0 "У нас не построена станция предупреждения об опасностях"
 monolith_crisis.357.name:0 "Прыжковые двигатели снова в строю!"
 monolith_crisis.357.desc:0 "Разрушив один из§B Барьеров монолитов§!, мы обнаружили, что§H прыжковые двигатели§! снова работают — значит, сила монолитов заметно ослабла."
 monolith_crisis.357.a:0 "Победа уже близко"
 monolith_crisis.357.tooltip:0 "§YПрыжковые двигатели всех кораблей снова в строю§!"
 monolith_crisis.358.name:0 "Магазин трофеев"
 monolith_crisis.358.desc:0 "Помните вещество, похожее на§Y панталончики§!, что мы когда-то вытянули из иного измерения? Как ни верится, новейшие исследования показали: эта дичь служит валютой у многих§B цивилизаций кораблей-дев§!\n\nМы решили открыть особое торговое ведомство для прочих цивилизаций кораблей-дев и торговать с ними этим ресурсом§Y панталончиков§!, поднимая их уровень и углубляя взаимопонимание. Ведомство получит имя§Y «Магазин трофеев»§! и будет вверено персоналу из§H народа Сломанных Стульев§!"
 monolith_crisis.358.a:0 "Утвердить"
 monolith_crisis.359.name:0 "Прыжковые двигатели снова в строю!"
 monolith_crisis.359.desc:0 "Благодаря мощной предсказательной силе станции предупреждения об опасностях помехи от чёрных монолитов устранены: все§H прыжковые двигатели§! снова в строю."
 monolith_crisis.359.a:0 "Слава богам"
 monolith_crisis.359.tooltip:0 "§YПрыжковые двигатели всех кораблей снова в строю§!"
 uf_ews_jump_drivers_ban_stop_project:0 "Разорвать оковы"
 uf_ews_jump_drivers_ban_stop_project_DESC:0 "Прыжковые двигатели по всей галактике скованы помехами от так называемых§Y Возвращающих§! — мы возлагаем надежды на мощные аналитические компьютеры станции предупреждения об опасностях."
 monolith_crisis.360.name:0 "Контрмера"
 monolith_crisis.360.desc:0 "Мощный аналитический компьютер станции предупреждения об опасностях выделил фактор, вредящий нашим прыжковым двигателям.\nУчёные считают: достаточно проапгрейдировать станцию, чтобы наши корабли обходили эти факторы, — и§H прыжковые двигатели§! снова заработают"
 monolith_crisis.360.a:0 "Немедленно апгрейдировать"
 monolith_crisis.360.tooltip:0 "Открывает: §Yапгрейд станции предупреждения об опасностях Объединения§!"
