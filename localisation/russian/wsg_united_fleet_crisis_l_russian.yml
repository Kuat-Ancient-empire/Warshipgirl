 monolith_crisis.10000.desc:0 "В этом меню настраивается время запуска кризиса «Пафект», свойственного происхождению Объединённого флота. Кризис «Пафект» начнёт отсчёт после завершения вами мегасооружения§Y Меч Объединения§!"
