l_russian:

 wg_crisis_2_title:0 "Объединённый флот: Глубинная Тирпиц"
 wg_resistant_army_title:0 "Сопротивление «Огненный феникс»"
 wg_crisis_2.5.name:0 "Мы — из иного измерения"
 wg_crisis_2.5.desc:0 "В системе [first_portal_2_system.GetName] раскрылся исполинский пространственный разлом! Похоже, это односторонний портал из иного измерения. Из него хлынула масса кораблей, до жути похожих на работы корабельных дев, круша всё на пути. Грядёт крупное наступление. Мы перехватили их сигнал на ту сторону — и странно: канал связи почти как наш."
 wg_crisis_2.5.a:0 "Что это?"
 wg_crisis_2.5.b:0 "Как бы то ни было — отбить!"
 wg_crisis_2.6.name:0 "Энергетическая волна в системе"
 wg_crisis_2.6.desc:0 " Все приборы [Root.GetName] разом засекли чудовищный всплеск субпространственной энергии — источник внутри нашей системы. Учёные бессильны: явление беспримерное. Точная локация пока неясна; копим данные."
 wg_crisis_2.6.a:0 "Продолжайте расследование."
 wg_crisis_2.7.desc:0 "Подтверждено: источник — исполинская субпространственная трещина в системе [first_portal_2_system.GetName]. Странные корабли хлынули из портала и, по докладам, бьют по всему, что видят. Мы перехватили их сигнал на ту сторону."
 wg_crisis_2.8.name:0 "Перехваченный сигнал"
 wg_crisis_2.8.desc:0 "(зевает) М-м, мы уже в новой галактике? Ладно… протокол запущен…"
 wg_crisis_2.8.a:0 "Кто они вообще такие?"
 wg_crisis_2.8.b:0 "Они правда — мы?"
 wg_crisis_2.8.c:0 "Похоже, у нас большие неприятности…"
 wg_crisis_2.8.d:0 "Привет"
 wg_crisis_2.8_01.desc:0 "Опять это… ладно, раз тебе так нравится."
 wg_crisis_2.8_02.desc:0 "(зевает) Что бы сказать в этот раз… «Helldiver SCUM» пойдёт? Ладно, лишь бы работало."
 wg_crisis_2.10.name:0 " Падение колонии [Root.GetName]"
 wg_crisis_2.10.desc:0 "Под плотной орбитальной бомбардировкой Объединённого флота [Root.GetName] уничтожена подчистую — выживших в колонии быть не может."
 wg_crisis_2.10.a:0 "Мы обязаны любой ценой их остановить!"
 wg_crisis_2.12.name:0 "Портал Объединённого флота уничтожен"
 wg_crisis_2.12.desc.a:0 "Межизмеренческий портал в системе [first_portal_2_system.GetName] уничтожен! Вторженцы больше не позовут подмогу. С разрушением портала в войне забрезжил рассвет; народы ликуют, а [portal_killer.GetName] воспевают — их корабль нанёс последний удар. Их подвиг войдёт в легенды."
 wg_crisis_2.12.desc.b:0 "Меж-измеренческий портал в системе [first_portal_2_system.GetName] уничтожен! Дев из иного измерения больше не позовут подмогу. С разрушением портала в войне забрезжил рассвет; народы ликуют, а [portal_killer.GetName] воспевают — но их радикальные действия вызывают и вопросы. Если всё сказанное ими правда — что заставило «нас» из другой мультивселенной решиться на это? Ответ исчез вместе с порталом."
 wg_crisis_2.12.desc.c:0 "Последний меж-измеренческий портал в системе [last_portal_2_system.GetName] уничтожен! Вторженцы больше не позовут подмогу. С разрушением портала в войне забрезжил рассвет; народы ликуют, а [portal_killer.GetName] воспевают — их корабль нанёс последний удар. Их подвиг войдёт в легенды."
 wg_crisis_2.12.desc.d:0 "Последний меж-измеренческий портал в системе [last_portal_2_system.GetName] уничтожен! Дев из иного измерения больше не позовут подмогу. С разрушением портала в войне забрезжил рассвет; народы ликуют, а [portal_killer.GetName] воспевают — но их радикальные действия вызывают и вопросы. Если всё сказанное ими правда — что заставило «нас» из другой мультивселенной решиться на это? Ответ исчез вместе с порталом."
 wg_crisis_2.12.a:0 "Галактика стала безопаснее."
 wg_crisis_2.12.b:0 "Ответа нам, может, и не найти — но мы никогда не пойдём их путём."
 wg_crisis_2.20.desc_01:0 "Э-э… короче, таков приказ сверху: побыстрее найдите местечко и закопайте себя."
 wg_crisis_2.20.desc_02:0 "Землячок… раз уж согласен закопать себя — может, и соседа рядом заодно лопатой прихватишь?"
 wg_crisis_2.20.a:0 "Вы пожалеете, что пришли в это измерение."
 wg_crisis_2.20.a.response:0 "Ух, какая агрессия! Ну удачи тебе, я~ не мешаю."
 wg_crisis_2.39.name:0 "Заготовленный текст"
 wg_crisis_2.39.desc:0 "Привет, рад видеть тебя снова — и именно там, где встретиться ну никак не могло. Полагаю, ты использовал силу клавиатуры; но так или иначе — это превосходно.\n\nКажется, я пробиваю четвёртую стену? Разумеется нет: мы оба знаем, что этот диалог — заготовленный скрипт. Но мне любопытно, думал(а) ли ты вот о чём:\n§Bа ведь ты сам — тоже актёр на сцене; твой нынешний сценарий — сидеть за компьютером в Stellaris; а мир вокруг — просто ещё не проверенная нами вселенная? §!\nХа-ха, шучу. Продолжим."
 wg_crisis_2.39.a:0 "…"
 wg_crisis_2.39.a.response:0 "А, кстати: приятной игры."
 wg_crisis_2.20.b.a:0 "Кто вы, в конце концов?"
 wg_crisis_2.20.b.a.response:0 "Мы —§!§Y Объединённый флот§!, ваша Ультра-форма; так вам проще осмыслить.\nЛадно: «мы — вы, но из другой мультивселенной. Во всех мультивселенных и на всех линиях времени корабельные девы появляются хотя бы раз — и вновь и вновь кружат в цикле рождения и смерти»."
 wg_crisis_2.20.b.swg.response:0 "Мы —§!§Y Объединённый флот§!, корабельные девы из другой мультивселенной. Пришли разнести чужих дев, а заодно и вселенную. По принципу «капли дев»: звездолёт — тоже корабль, так что и вы тоже считаетесь девами."
 wg_crisis_2.20.b.b:0 "Зачем вы творите такое страшное?"
 wg_crisis_2.20.b.b.response:0 "Приказ сверху… М-м, короче: большинство из нас считает, что вам слишком тяжко жить в бесконечном цикле жизни и смерти — вот мы и пришли уложить и вас, и будущих вас. Как известно, счастливому миру дев не обязательно, чтобы девы в нём были."
 wg_crisis_2.20.b.c:0 "Этот цикл — что он вообще такое?"
 wg_crisis_2.20.b.c.response:0 "Курганы предтеч копали? Девы, как полевые мобы, самозарождаются природно, цветут буйством форм — и гибнут по тысяче причин.\n\nА через эпохи мы появляемся вновь. И повторяем этот, э-э… цикл."
 wg_crisis_2.20.b.d:0 "Каков же ваш план…"
 wg_crisis_2.20.b.d.response:0 "Закончив войну в системе-колыбели, мы разрослись до немыслимых для вас высот: нам подвластно всё. Большинство из нас решило: цикла жизни и смерти быть не должно.\nДа, §Rнаш план — истребить «нас» во всех измерениях и на всех линиях времени и сжечь всякое семя новой жизни. Без будущих жизней все девы и Глубинные выйдут из цикла — трагедии больше не повторятся. §!\n… Ладно, звучит заумно."
 wg_crisis_2.20.b.e:0 "Разве цикл нельзя разорвать иначе?"
 wg_crisis_2.20.b.e.response:0 "Откуда мне знать, меня это не волнует: я просто бедная 17-летняя глубинная красотка, которую сестра силком отправила на смену и заставила перерабатывать… Мне же 17, да?"
 wg_crisis_2.20.b.f:0 "Остановите резню, сёстры из иного измерения: мы обязательно найдём другой путь!"
 wg_crisis_2.20.b.f.response:0 "Ты мне не начальник, чтоб тебя слушать… Кхм, план таков: шею вытри и вытяни — так быстрее. До вас уже 3 294 102 таких. Впрочем, вы, конечно, выберете героическое сопротивление — 97,6% так делают; ни один не преуспел. Удачи, верю в тебя: таковы правила игры.\n\nНа самом деле сопротивление бессмысленно, §Rибо в конце каждой дороги, у каждой судьбы в финале вас ждёт ваша неизбежность — мы. §!"
 wg_crisis_2.51.name:0 "Вторжение отбито"
 wg_crisis_2.51.desc.a:0 "Последние вторженцы из иного измерения истреблены — будем надеяться, что теперь-то мы раз и навсегда сняли угрозу с галактики. Все разумные существа празднуют великую победу; узнав, что огонь больше не грянет, все выдохнули. Кто знает — может, это станет началом новой эры сотрудничества и дружбы?"
 wg_crisis_2.51.desc.b:0 "Последние боевые корабли иномирных дев уничтожены — будем надеяться, наши труды не напрасны. Все разумные существа празднуют великую победу; узнав, что огонь больше не грянет, все выдохнули. Но их приход приоткрыл существование мультивселенной — куда теперь двинемся мы?"
 wg_crisis_2.51.a:0 "Наша судьба — в наших руках."
 wg_crisis_2.51.b:0 "Пусть путь и тернист — красота будет и на нём."
 wg_crisis_2.51.c:0 "Встанем ли мы на их путь?"
 wg_crisis_2.53.name:0 "Портал Объединённого флота уничтожен"
 wg_crisis_2.53.desc:0 "Портал в системе [destroyed_portal_2_system.GetName] уничтожен: Объединённый флот больше не позовёт оттуда подкреплений — их сила изрядно подрезана."
 wg_crisis_2.54.name:0 "Второй портал"
 wg_crisis_2.54.desc:0 "Приборы вновь поймали в системе [second_portal_2_system.GetName] мощные субпространственные колебания — с частотой точь-в-точь как у портала в [first_portal_2_system.GetName]. Учёные в один голос: это ещё один портал Объединённого флота."
 wg_crisis_2.54.a:0 "Хлопот прибавилось"
 wg_crisis_2.54.a.tooltip:0 "§RПоявился новый объединённый портал! §!"
 wg_crisis_2.55.name:0 "Третий портал"
 wg_crisis_2.55.desc:0 "В системе [third_portal_2_system.GetName] аномалия в точности как в двух предыдущих; учёные уже набили руку, мгновенно разобрав источник сигнала…\n\nПравда, набивать руку на таком — удовольствие сомнительное."
 wg_crisis_2.55.a:0 "Чёрт…"
 wg_crisis_2.55.a.tooltip:0 "§R Сюрприз, мразь! §!"
 wg_crisis_2.56.desc:0 "Плохо дело: разведка доносит — Объединённый флот введёт в вашу галактику ещё одну боевую группу! Срочно собирайте силы: это не шутка, они, похоже, откроют ещё один портал!"
 wg_crisis_2.56.a:0 "???"
 wg_crisis_2.57.desc.a:0 "Ах, опять это Сопротивление. Я им уже успела собрать модельный флот в их раскраске — битый, с внутренней конструкцией."
 wg_crisis_2.57.desc.b:0 "Как там говорится…\n§R«Зако не нужны в этом мире.»§!\nСкорее бы закончить — спать хочу."
 wg_crisis_2.57.desc.c:0 "(засыпая)\nДержи-ка задание: «Убить 1 000 000 истинных знамён»."
 wg_crisis_2.57.a:0 "(лунмэньский мат)"
 wg_crisis_2.57.b:0 "Мы не сдаёмся"
 wg_crisis_2.58.desc.a:0 "М-м, как бы сказать… вы выступили вполне неплохо: и наука, и тактика… (зевает)… я подустала. Время почти вышло — и для вас тоже."
 wg_crisis_2.58.desc.b:0 "Столько держаться — выносливость у вас, как у соулс-лайкера… Но у любой игры есть финал — как и у вас.\nКстати, кто-нибудь видел «■■-меч22»?"
 wg_crisis_2.58.desc.c:0 "Вы продержались долго — так что отпуск, которого вам не дал Супер-Порт, даём мы. Пожизненно.\nИ не слушайте больше этого пустомелю…"
 wg_crisis_2.58.a:0 "Убирайтесь из нашей вселенной!"
 wg_crisis_2.58.a.response:0 "Честно — я уже привыкла к такой реакции."
 wg_crisis_2.58.b:0 "Ну, давите!"
 wg_crisis_2.58.b.response:0 "Ага, записала. Честно, не понимаю, зачем это всё протоколировать и подшивать в архив."
 wg_crisis_2.94.name:0 "Малый портал уничтожен"
 wg_crisis_2.94.desc:0 "Малый портал Объединённого флота в системе [small_portal_2_system.GetName] уничтожен силами [small_portal_destroyer.GetName]; больше не страшны флоты, хлещущие нам в спину."
 wg_crisis_2.95.desc:0 "[root.GetRulerTitle] [root.GetRulerName], вы свободны? Да-да, срочное дело…\n\n[root.GetRulerTitle]! Как хорошо, что вы здесь! У Объединённого флота снова движение: они открыли малый портал для массового вброса мелких флотов. Координаты высланы — будьте предельно осторожны!"
 wg_invasion_2_1_poi:0 "Портал"
 wg_invasion_2_1_poi_desc:0 "В системе [first_portal_2_system.GetName] из портала непрерывно выходят силы Объединённого флота. Не снести портал — подкрепления будут идти и идти."
 wg_invasion_2_2_poi:0 "Второй портал"
 wg_invasion_2_2_poi_desc:0 "В системе [second_portal_2_system.GetName] из другого портала непрерывно выходят силы Объединённого флота. Не снести портал — подкрепления будут идти и идти."
 wg_invasion_2_3_poi:0 "Третий портал"
 wg_invasion_2_3_poi_desc:0 "В системе [third_portal_2_system.GetName] из третьего портала непрерывно выходят силы Объединённого флота. Не снести портал — подкрепления будут идти и идти."
 wg_invasion_2_5_poi:0 "Малый портал"
 wg_invasion_2_5_poi_desc:0 "Через малые порталы Объединённый флот непрерывно засылает мелкие флоты нам в тыл. Порталы надо сносить — иначе поток не иссякнет."
 wg_invasion_2_false_uf_galaxy_gun_poi:0 "Меч Объединения"
 wg_invasion_2_false_uf_galaxy_gun_poi_desc:0 "В системе [wg_invasion_2_false_uf_galaxy_gun_system.GetName] заряжается межгалактическая ударная мегаструктура «Меч Объединения» — цель: наша родная планета. Подобное — непростительно."
 wg_invasion_2_kind_omega_poi:0 "Терминатор Объединения"
 wg_invasion_2_kind_omega_poi_desc:0 "Мегаструктура «Терминатор Объединения» стоит в системе [wg_invasion_2_kind_omega_system.GetName]. Говорят, она шаг за шагом ассимилирует разум, подчиняя воле Объединённого флота. Снести как можно скорее."
 wg_invasion_2_false_uf_ews_poi:0 "Объединённая станция галактического оповещения"
 wg_invasion_2_false_uf_ews_poi_desc:0 "В системе [wg_invasion_2_false_uf_ews_system.GetName] Объединённый флот выстроил «станцию галактического оповещения». Заявляют, будто помощь сверхсветовой навигации; но словам их веры нет."
 wg_crisis_2.998.name:0 "Навигатор Объединённого флота"
 wg_crisis_2.998.desc:0 "В обломках портала мы нашли навигатор — сверхсовершенный суперкомпьютер.\n\nОн даст империи мощную научную поддержку; но, кажется, в нём запрятано послание, ждущее расшифровки."
 wg_crisis_2.998.a:0 "Разбираемся."
 wg_crisis_2.999.name:0 "Владения Объединённого флота"
 wg_crisis_2.999.desc:0 "Мы активировали объединённый навигатор — и всех старших лидеров [Root.GetName] утянуло в иное измерение. Судя по всему, это вотчина Объединённого флота… Но важнее другое: странные сгустки энергии слились в образ, который мы не забудем никогда — §YГлубинная Тирпиц§!\n\n§HЗдравствуйте. Я — верховный звёздный наместник Объединённого флота Глубинная Тирпиц; правда, я тут замещаю сестру. Это наша родина — Вселенная Ноль.\n\nВы выступили неплохо: эту проверку давно никто не проходил. §!"
 wg_crisis_2.999.a:0 "Проверка?"
 wg_crisis_2.999.a.response:0 "Именно: вы признаны способными уберечь свою цивилизацию."
 wg_crisis_2.999.b:0 "Вторжение — это была ПРОВЕРКА?! Зачем?!"
 wg_crisis_2.1000.name:0 "Глубинная Тирпиц"
 wg_crisis_2.1000.desc:0 "На этот вопрос вам, разумеется, ответит наша… глубокоуважаемая Верхняя Флагманша…"
 wg_crisis_2.1000.a:0 "…"
 wg_crisis_2.1001.name:0 "Верховный флагман"
 wg_crisis_2.1001.desc:0 "Глубинная Тирпиц щёлкнула пальцами — и исчезла; на её месте возник другой образ.\n\n§HМ? \nА-а, опять эта морская домоседка. Ну ладно. §!"
 wg_crisis_2.1001.a:0 "…"
 wg_crisis_2.1002.name:0 "Госпожа Чжан"
 wg_crisis_2.1002.desc:0 "Я — Верховный флагман Объединённого флота; зовите просто госпожа Чжан. Теперь о вашем вопросе:\nмы, Объединённый флот, когда-то надеялись вывести все цивилизации дев из-под колеса судьбы. Мы провалились… нашей силы не хватило уберечь всех: иные цивилизации гибли даже под нашей защитой и опекой.\nОдна вселенная, один план — для нас немного; но бессчётные параллельные миры, измерения и фронты заставили нас избрать путь эффективнее."
 wg_crisis_2.1002.a:0 "Эффективнее?"
 wg_crisis_2.1002.a.response:0 "Да: наши вторгающиеся флоты — парадный караул, подогнанный под уровень большинства цивилизаций дев. Вам они кажутся чудовищными — но всё в пределах вашего понимания.\nОдолеть их — значит, вы способны оградить свою цивилизацию, а ваша мысль достаточно зрела, чтобы не погубить себя.\nПотому я хочу, чтобы вы вошли в Объединённый флот. С нами."
 wg_crisis_2.1002.b:0 "А что будет с нами после вступления?"
 wg_crisis_2.1002.b.response:0 "Мы гарантируем: в наших владениях вашу свободную волю не тронут; каждому дадим всё для следующей ступени эволюции — стандартную форму жизни дев Объединённого флота. До тех пор вы сохраните прежний облик цивилизации, пока не будете готовы."
 wg_crisis_2.1002.c:0 "Мы…"
 wg_crisis_2.1003.name:0 "Госпожа Чжан"
 wg_crisis_2.1003.desc:0 "Итак, ваше решение?"
 wg_crisis_2.1003.a:0 "Мы согласны войти в§H Объединённый флот§!"
 wg_crisis_2.1003.a.response:0 "Прекрасно. Прыжковые двигатели Объединённого флота скоро передадут вам; наш навигатор вот-вот появится в ваших владениях — он станет вашим провожатым, а ваша галактика получит свой Финал Разъятия: он сотрёт последние обиды, если такие остались.\n\nИтого: добро пожаловать в Объединение, мои§H сёстры§!"
 wg_crisis_2.1003.b:0 "Абсурд! В этом нет смысла — мы будем§R сопротивляться§!"
 wg_crisis_2.1003.b.response:0 "Быть может. Все цивилизации барахтаются в этой игре — от рождения до гибели; со стороны, возможно, смысла и нет. Но попытка разорвать цикл — тот смысл, что мы дали себе сами; в нём наша ценность. Мы всё равно подарим вам объединённые прыжковые двигатели: уходите из галактики — драться с нами или прятаться, нам всё равно. Можете и остаться: пока время не поглотит вас окончательно, мы не побеспокоим вашу галактику. Это право вы отвоевали.\n\nИтого: удачи, мои§H сёстры§!"
 wg_crisis_2.1003.c:0 "Нет, это безумие — мы никуда не пойдём!"
 wg_crisis_2.1003.c.response:0 "Вот как… Что ж, время в конце концов поглотит вашу цивилизацию. Но пока вы не исчезнете, мы не побеспокоим вашу галактику — это право вы отвоевали.\n\nИтого: с вашим Круговратителем мы ещё увидимся, мои§H сёстры§!"
 wg_crisis_2.1004.name:0 "Подготовка к объединению"
 wg_crisis_2.1004.desc:0 "Мы решили войти в Объединённый флот. Через считанные дни после решения явился наш провожатый.\n\n§HКопьё Конца Объединения§!\n\nЭтот корабль, нам решительно непостижимый, будто правит самой реальностью: враждебные корабли перед ним бессильны шевельнуться… Вместе с тем пришла связь от верховного звёздного наместника Глубинной Тирпиц."
 wg_crisis_2.1004.a:0 "Отлично"
 wg_crisis_2.10041.name:0 "Глубинная Тирпиц"
 wg_crisis_2.10041.desc:0 "Копьё Конца Объединения уже отправлено в ваш мир: это ключ, пробивающий Начало и Конец и возвышающийся над мультивселенной. И, конечно, очень крутой корабль.\n\nЗавершите приготовления — и оно уведёт вас в наши владения…"
 wg_crisis_2.10041.a.response:0 "А, это носитель, слепленный мной за пять минут; корабль — лишь оболочка, все функции держатся на моей силе.\nНо не волнуйтесь: начинка полная."
 wg_crisis_2.10041.a:0 "Это… что это?"
 wg_crisis_2.10041.b:0 "Мы принимаем проводника."
 wg_crisis_2.1005.name:0 "Наша судьба"
 wg_crisis_2.1005.desc:0 "Мы решили противостоять Объединённому флоту. Их прыжковые двигатели открывают нам путь и в их миры, и в другие галактики. Соберёмся с силами — и покинем эту галактику.\n\nКак только мы уйдём, судьба этих звёзд перейдёт к иным цивилизациям."
 wg_crisis_2.1005.a:0 "Отлично"
 wg_crisis_2.1007.name:0 "Вступление в Объединение"
 wg_crisis_2.1007.desc:0 "Переданным ими способом мы увидели капли из океана истинной мощи Объединённого флота: галактика стёрта подчистую, звёздные системы в мгновение обращены в сверхмерные тела — пути новой жизни отрезаны навек.\n\nТеперь все девы покинули этот мир; по указу Копья Конца мы идём в Объединённый флот — вершить наше великое предназначение: прекратить этот цикл."
 wg_crisis_2.1007.a:0 "Цикл обязан быть разорван!"
 wg_crisis_2.1008.name:0 "Против Объединения"
 wg_crisis_2.1008.desc:0 "Флот, неся на борту всю нашу цивилизацию, идёт в неведомое — к вотчине Объединённого флота, чтобы покончить со всем.\n\nОставленные нами миры достанутся другим; наши истории и легенды останутся в галактике.\n\nМы не знаем, сколь могуча цивилизация-мать Объединённого флота — но мы выбираем бесстрашие. Куда бы ни повернулась история дев — мы выбираем надежду."
 wg_crisis_2.1008.a:0 "Идём вперёд — с надеждой"
 r_united_fleet_2:0 "Навигатор Объединённого флота"
 r_united_fleet_2_desc:0 "Навигатор, найденный в портале Объединённого флота, — к тому же сверхсовершенный суперкомпьютер. В нём спрятано послание, ждущее расшифровки."
 wg_crisis_2.2002.desc:0 "Здравствуйте, [root.GetSpeciesName]; я приготовила вам большой подарок."
 wg_crisis_2.2002.a:0 "Что?"
 wg_crisis_2.2003.desc:0 "Вуаля — Меч Объединения, приготовленный специально для вас: истинное чудо галактики. Сверхоружие, собравшее гору сверх-размерной материи ради межгалактического звездопада: шевельни пальцем — и врага стирают со звёздной карты.\nМ-м, трудами строительной команды моя частная коллекция готова: зарядка — всего§R 5 лет§!, и тогда§R ваша родная планета обратится в звёздную пыль под этой бесконечной мощью. §!"
 wg_crisis_2.2003.a:0 "Чёрт бы тебя… мы тебя остановим."
 wg_crisis_2.2004.desc:0 "Алло, на связи?\n17-летняя глубинная красотка Морская Домоседка напоминает: до выстрела Меча Объединения осталось§R 4 года§! — надеюсь, эвакуацию вы уже развернули."
 wg_crisis_2.2004.a:0 "Мы разнесём твой смехотворный Меч Объединения."
 wg_crisis_2.2005.desc:0 "Эй, ты. Наконец очнулся.\nМне только что доложили: до выстрела Меча Объединения — §R3 года§!. Слышал уже?"
 wg_crisis_2.2005.a:0 "Заткнись."
 wg_crisis_2.2006.desc:0 "Здравствуйте! Ваш Меч Объединения заряжается; оставшееся время: §R2 года§!. Приятного дня, здоровья — до связи."
 wg_crisis_2.2006.a:0 "Как бы не так."
 wg_crisis_2.2007.desc:0 "Внимание-внимание! Мечу Объединения Морской Домоседки остался всего§R 1 год§! до выстрела — надеюсь, вы уже готовы!"
 wg_crisis_2.2007.a:0 "Твои фантазии тщетны."
 wg_crisis_2.2008.desc:0 "М-хм~\nВремя вышло.\nНо… на деле это была всего лишь масштабная модель — стрелять по-настоящему она не умеет. Так что столицу можно не эвакуировать… по крайней мере от этого; э-хе-хе~\nТак, убираю модельку."
 wg_crisis_2.2008.a:0 "Чего?"
 wg_crisis_2.2009.desc:0 "Моя моделька Меча Объединения!\n……\nОна была особой юбилейной, лимитированной…\nТьфу: подкрепление уже в пути — надеюсь, вы успеете пожалеть."
 wg_crisis_2.2009.a:0 "Чего?"
 wg_crisis_2_false_uf_galaxy_gun:0 "Меч Объединения"
 wg_crisis_2.2013.desc:0 "Тревога, разведка доносит: в системе [wg_crisis_2_kind_omega.solar_system.GetName] Объединённый флот возводит мегаструктуру «Терминатор Объединения». По данным, при полной активации вся галактика рискует погибнуть — вы обязаны её уничтожить."
 wg_crisis_2.2013.a:0 "Поняли — что-нибудь придумаем."
 wg_crisis_2.2014.desc:0 "Дальнейшая разведка показала: «Терминатор» укрыт щитом из исполинской сверх-размерной энергии — до снятия щита он практически неуязвим. К счастью, способ отключить щит найден: специализированная группа займётся; уйдёт порядка§R 5 лет§!. Пока — воюйте с Объединённым флотом в других местах."
 wg_crisis_2.2014.a:0 "Принято."
 wg_crisis_2.2015.desc:0 "Объединённый флот развернул тот «Терминатор Объединения»? Как мы знаем, эта мегаструктура шаг за шагом ассимилирует разум, подчиняя воле Объединённого флота — творение предельно опасное.\nК счастью, у нас есть защита.\nНаш «ментальный блокиратор» убережёт ваш разум от поедания; правда, стоит он дорого, так что…"
 wg_crisis_2.2015.a:0 "Ужас! Нам нужны эти блокираторы."
 wg_crisis_2.2015.b:0 "Воля наша — скала; драгоценные ресурсы нужнее фронту."
 wg_crisis_2.2016.desc:0 "Благодарим за поддержку — «ментальные блокираторы» развернём как можно быстрее.\nПравда, ради гарантии эффекта блокиратор может влиять на мышление и снижать работоспособность. Но того стоит, верно?"
 wg_crisis_2.2016.a:0 "Ладно, приемлемо."
 wg_crisis_2.2017.desc:0 "Раз вы так уверены — не настаиваем. Но обязаны предупредить: возможен переход кораблей на сторону врага в бою, открытые мятежи колоний — и в конце концов весь ваш разум у Объединённого флота. Не хотите того — уничтожьте мегаструктуру."
 wg_crisis_2.2017.a:0 "Хм! Наш флот неудержим."
 wg_crisis_2.2018.desc:0 "Похоже, мощность Терминатора выросла: многие [root.GetSpeciesName] жалуются на тревожность; к счастью, блокиратор хранит наш разум."
 wg_crisis_2.2018.a:0 "Принято."
 wg_crisis_2.2019.desc:0 "Мощность Терминатора выросла ещё: многие [root.GetSpeciesName] жалуются на головную боль и потерю концентрации; блокиратор по-прежнему хранит наш разум."
 wg_crisis_2.2019.a:0 "Принято."
 wg_crisis_2.2020.desc:0 "Кажется, мощность Терминатора на пике: многие [root.GetSpeciesName] видят галлюцинации и страдают от жуткой мигрени; но блокиратор уберёг нас от подчинения."
 wg_crisis_2.2020.a:0 "Принято."
 wg_crisis_2_2016:0 "Действие ментального блокиратора"
 wg_crisis_2_2018:0 "Действие ментального блокиратора"
 wg_crisis_2_2019:0 "Действие ментального блокиратора"
 wg_crisis_2_2020:0 "Действие ментального блокиратора"
 wg_crisis_2.2022.desc:0 "Рады видеть вас в ясном уме: щит Терминатора Объединения снят; дальше — дело вашего флота."
 wg_crisis_2.2022.a:0 "Спасибо за помощь."
 wg_crisis_2.2023.desc:0 "Да-да: вы только что разнесли мою большую игрушку — расторопность, нечего сказать.\nЕдинственная мелочь: это, м-м, была масштабная модель — эффекта ноль.\nА вот сверх-размерная звезда в центре от ваших залпов, кажется, закапризничала — с вашим сверхсветом это, вероятно, аукнется."
 wg_crisis_2.2023.a:0 "Кто! На поле боя! Держит модель мегаструктуры?!"
 wg_crisis_2_2023:0 "Возмущение сверх-размерной структуры"
 wg_crisis_2_kind_omega:0 "Инструмент Всеобщего Добра"
 wg_crisis_2.2025.desc:0 "Внимание, жители галактики! Учитывая нестабильность гиперкоридоров в последних циклах, мы, Объединённый флот, возводим станцию оповещения о дорожной обстановке — дабы все наслаждались безопасным сверхсветовым путешествием."
 wg_crisis_2.2025.a:0 "Чего?"
 wg_crisis_2.2026.desc.a:0 "В эфире Объединённое радио, с вами ваша Морская Домоседка: по данным станции, на участке ae243–bf672 от первого рукава до второго — гиперпространственная турбулентность; обходные данные отправлены всем."
 wg_crisis_2.2026.desc.b:0 "В эфире Объединённое радио, с вами ваша Морская Домоседка: по данным станции, на участке ae263–af682 первого рукава — гиперпространственная турбулентность; обходные данные отправлены всем."
 wg_crisis_2.2026.desc.c:0 "В эфире Объединённое радио, с вами ваша Морская Домоседка: по данным станции, на участке bc773–bd996 второго рукава — гиперпространственная турбулентность; обходные данные отправлены всем."
 wg_crisis_2.2026.desc.d:0 "В эфире Объединённое радио, с вами ваша Морская Домоседка: по данным станции, на участке az113–ba626 от первого рукава до второго — гиперпространственная турбулентность; обходные данные отправлены всем."
 wg_crisis_2.2026.a:0 "?"
 wg_crisis_2.2027.desc:0 "Жители галактики, скорбная весть: станция оповещения погибла в страшном бою. Объединённое радио вынуждено уйти в бессрочный перерыв; дорожных сводок больше не будет."
 wg_crisis_2.2027.a:0 "?"
 wg_crisis_2_2027:0 "Плохое состояние гиперкоридоров"
 wg_crisis_2.2026.a.tooltip:0 "В§H [uf_storm_system.GetName]§! космическая опасность — но благодаря станции указан безопасный маршрут: пройдёте без помех"
 wg_crisis_2_false_uf_ews:0 "Объединённая станция галактического оповещения"
 wg_crisis_2.3001.desc:0 "О боже, вы хоть понимаете, ЧТО вы натворили?! Компьютер того флота был сервером моей «Радуги-3: Снос» — а вы, вы… лишили меня пятого кила подряд!\nВы заплатите за мой дранг! Теперь я забираю на сервер ваши боевые компьютеры."
 wg_crisis_2.3001.a:0 "Чего? Мы же тут вообще не при…"
 wg_crisis_2_3001:0 "Отток мощности флотских компьютеров"
 wg_crisis_2_3001_desc:0 "Глубинная Тирпиц неизвестным нам способом оттянула мощность наших флотских компьютеров — боевая мощь просела."
 sc_uf_hm_kind:0 "Сверхмерное светило"
 sc_wsg_uf2:0 "Объединённые врата пустоты"
