 wg_fm_gateway_01:0 "Монтажная платформа Врат Измерений"
 wg_fm_gateway_01_MEGASTRUCTURE_DETAILS:0 "Эта мегаструктура — наш первый шаг к откачке энергии Занебесья и открытию пути в иные измерения вселенной"
 wg_fm_gateway_01_DESC:0 "Основание для строительства Сверхъякоря Измерений: при наличии достаточных ресурсов можно приступать."
 wg_fm_gateway_02:0 "Каркас экстрактора энергии Занебесья"
 wg_fm_gateway_02_DESC:0 "Экстрактор энергии Занебесья построен, но ещё не запущен. Для запуска нужно сжать звезду в чёрную дыру, чтобы пробить измерения реальности и подключиться к Занебесью. Перед запуском также потребуются тщательные настройки — на кону всё."
 wg_fm_gateway_03:0 "Экстрактор энергии Занебесья"
 wg_fm_gateway_03_DESC:0 "Частично работающий экстрактор энергии Занебесья уже выдаёт немало энергии и минералов. Но до нашего главного плана ещё далеко.\nНа этом этапе в наш мир хлынет множество субстанций Занебесья — нужно как можно скорее достроить его до Якоря Измерений, чтобы остановить вторжение существ из Занебесья."
 wg_fm_gateway_04:0 "Якорь Измерений"
 wg_fm_gateway_04_DESC:0 "Якорь Измерений накрепко приковал Занебесье: ни одно его существо больше не пройдёт через наши врата, а существа, уже оказавшиеся в реальности, лишившись связи с Занебесьем, сильно ослабнут.\nДля поддержания Якоря Измерений отбор энергии экстрактора будет уменьшен."
 wg_fm_gateway_05:0 "Врата Измерений"
 wg_fm_gateway_05_DESC:0 "Мы успешно создали собственное измерение из энергии Занебесья — и эти врата знаменуют наше превращение в многомерную цивилизацию."
 requires_only_one_fm_gateway:0 "Можно построить только один Якорь Измерений"
 r_wg_fm:0 "Размерный перфоратор"
 r_wg_fm_desc:0 "С помощью размерного перфоратора наше высшее пространство может переписывать реальность нашего трёхмерного космоса в известных пределах: при активации он даст нашему флоту решающее преимущество.\nКроме того, он обеспечит нашим кораблям безопасную навигацию, значительно увеличив дальность прыжковых двигателей."
