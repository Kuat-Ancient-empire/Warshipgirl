 policy_wsg_war_doctrine:0 "Военная доктрина WG"
 policy_wsg_war_doctrine_desc:0 "Мы воинственный народ. Можете называть нас воинственными, но я предпочитаю называть нас нацией войны.\n"
 tech_wg_trade_policy:0 "Новая торговая политика"
 tech_wg_trade_policy_desc:0 "Раньше торговые маршруты обслуживали простую перевозку ресурсов гражданскими грузовиками. С ростом потребностей империи нам нужно открыть новую эру торговли."
 wg_trade_edicts:0 "§HОткрыта политика: §! Новая торговая политика"
 wg_trade_edicts_desc:0 "Раньше торговые маршруты обслуживали простую перевозку ресурсов гражданскими грузовиками. С ростом потребностей империи нам нужно открыть новую эру торговли."
 policy_wsg_war_doctrine:0 "Военная доктрина WG"
 policy_wsg_war_doctrine_desc:0 "Мы воинственный народ. Можете называть нас воинственными, но я предпочитаю называть нас нацией войны.\n"
 policy_wg_trade_policy:0 "Новая торговая политика WG"
 policy_wg_trade_policy_desc:0 "Раньше торговые маршруты обслуживали простую перевозку ресурсов гражданскими грузовиками. С ростом потребностей империи нам нужно открыть новую эру торговли.\n"
 trade_policy_more_energy:0 "Торговля богатством"
 trade_conversion_more_energy_name:0 "$trade_policy_more_energy$"
 trade_policy_more_energy_desc:0 "Новая торговая политика принесёт больше торговых возможностей.\n\n§EКаждая £trade_value£ §Yторговая стоимость§! даст £energy£ §Y0.5§!§!\n§HСочетается с обычными торговыми политиками§!"
 trade_policy_pantsu:0 "Трусиковая торговля"
 trade_conversion_pantsu_name:0 "$trade_policy_pantsu$"
 trade_policy_pantsu_desc:0 "Если мы не можем обеспечить трусиками каждую из наших дев, то зачем мы вообще существуем?\n\n§EКаждая £trade_value£ §Yторговая стоимость§! даст £sr_pantsu£ §Y0.02§!§!\n§HСочетается с обычными торговыми политиками§!"
 trade_policy_alloys:0 "Торговля сплавами"
 trade_conversion_alloys_name:0 "$trade_policy_alloys$"
 trade_policy_alloys_desc:0 "Всегда находятся сплавы, забытые на складах по тем или иным причинам. Новые торговые маршруты доставят их туда, где они нужны.\n\n§EКаждая £trade_value£ §Yторговая стоимость§! даст £alloys£ §Y0.05§!§!\n§HСочетается с обычными торговыми политиками§!"
 trade_policy_scarce_resource:0 "Торговля редкими ресурсами"
 trade_conversion_scarce_resource_name:0 "$trade_policy_scarce_resource$"
 trade_policy_scarce_resource_desc:0 "Редкие ресурсы нелегко хранить и возить на дальние расстояния, но прогресс технологий позволяет даже самым простым транспортникам безопасно перевозить их.\n\n§EКаждая £trade_value£ §Yторговая стоимость§! даст £exotic_gases£ §Y0.02§! £volatile_motes£ §Y0.02§! £rare_crystals£ §Y0.02§!\n§HСочетается с обычными торговыми политиками§!"
 wg_psi_dyson_sphere:0 "Псионическая сфера Дайсона"
 wg_psi_dyson_sphere_DESC:0 "Сфера Дайсона странной конструкции, принцип неизвестен: часть энергии звезды, похоже, переносится в Занебесье, где превращается в минералы и возвращается в материальный мир."
 wg_psi_dyson_sphere_MEGASTRUCTURE_DETAILS:0 "Сфера Дайсона странной конструкции, принцип неизвестен: часть энергии звезды, похоже, переносится в Занебесье, где превращается в минералы и возвращается в материальный мир."
 tech_wg_psi_dyson_sphere:0 "Псионическая сфера Дайсона"
 tech_wg_psi_dyson_sphere_desc:0 "Изучив архивы Святого Страж-Порта, мы узнали: псионическая сфера Дайсона, судя по всему, захватывает построенные другими галактическими цивилизациями сферы Дайсона и псионически преобразует их, делая пересадочным пунктом между Занебесьем и реальностью, перекачивая часть энергии звезды в Занебесье и возвращая её в материальный мир в виде минералов."
 unlock_tech_wg_psi_dyson_sphere:0 "§HОткрыта мегаструктура: §! Псионическая сфера Дайсона"
 unlock_tech_wg_psi_dyson_sphere_desc:0 "§HОткрыта мегаструктура: §! Псионическая сфера Дайсона"
 requires_no_existing_psi_dyson_sphere:0 "$TRIGGER_FAIL$ Мы уже построили псионическую сферу Дайсона"
 wsg.30251.name:0 "Призывной круг псионической сферы Дайсона"
 wsg.30251.desc:0 "Призывной круг псионической сферы Дайсона готов, сила псионики гудит в системе. Мы успешно заперли §Hсферу Дайсона§! из другой галактики — как только будут готовы ресурсы, можно начинать захват."
 wsg.30251.a:0 "Отлично"
 wsg.30252.name:0 "Псионическая сфера Дайсона построена!"
 wsg.30252.desc:0 "Пси-волны постепенно стабилизировались, и перед нами возникла огромная полупрозрачная сфера Дайсона — мы успешно захватили §Hсферу Дайсона§! у цивилизации другой галактики.\nТеперь энергия звезды будет перекачиваться в Занебесье, превращаться в минералы и возвращаться в материальный мир."
 wsg.30252.a:0 "Будем надеяться, они не в обиде"
 WG_PSIONIC_WORMHOLE:0 "Псионическая червоточина"
 wg_psionic_wormhole:0 "Псионическая червоточина"
 WG_PSIONIC_WORMHOLE_DESC:0 "Бездна, ведущая в Занебесье"
 wg_psionic_wormhole_DESC:0 "Бездна, ведущая в Занебесье"
 Need_to_research_psionic_wormhole:0 "Нужно изучить способ открыть псионическую червоточину"
 BYPASS_DESC_INACTIVE_WG_PSIONIC_WORMHOLE_BYPASS:0 "Червоточина не активирована"
 wg_psi_dyson_sphere_base:0 "Призывной круг псионической сферы Дайсона"
 wg_psi_dyson_sphere_base_DESC:0 "Скорее не построить, а захватить. Псионическая сфера Дайсона, судя по всему, захватывает построенные другими цивилизациями сферы и псионически преобразует их, делая пересадочным пунктом между Занебесьем и реальностью, перекачивая часть энергии звезды в Занебесье и возвращая её в материальный мир в виде минералов."
 wg_psi_dyson_sphere_base_MEGASTRUCTURE_DETAILS:0 "Скорее не построить, а захватить. Псионическая сфера Дайсона, судя по всему, захватывает построенные другими цивилизациями сферы и псионически преобразует их, делая пересадочным пунктом между Занебесьем и реальностью, перекачивая часть энергии звезды в Занебесье и возвращая её в материальный мир в виде минералов."
 wsg_colony_development:0 "Ракетная колонизация"
 wsg_colony_development_desc:0 "Населённая ракета, свалившаяся с небес, бомбардировала и колонизировала эту планету — нужно время на восстановление."
 wsg_colonizer:0 "Колонизационная ракета"
 tech_colonization_wsg:0 "Ракетная колонизация"
 tech_colonization_wsg_desc:0 "Колонисты и необходимые грузы упаковываются в специальную ракету для быстрого межзвёздного перелёта и колонизации. Единственный минус — новой колонии понадобится три года, чтобы расчистить экологические последствия такой высадки."
 artifact_wg_precursor_clue:0 "Выследить след предтеч-корабельных дев"
 artifact_wg_precursor_clue_desc:0 "С этими драгоценными реликвиями мы сможем сложить воедино улики о других предтечах-корабельных девах и выследить их местонахождение."
 artifact_wg_precursor_clue_effect:0 "Немедленно создаёт §Hаномалию предтеч-корабельных дев§! на любой планете в наших границах. Перезарядка: 1800 £time£ дней"
 artifact_wg_precursor_insight_cooldown:0 "Перезарядка $artifact_wg_precursor_clue$"
 ration_dyson_ring_faster2:0 "Быстровращающееся кольцо Дайсона"
 ration_dyson_ring_faster2_DESC:0 "После нажатия кнопки ускорения кольцо Дайсона несётся — ни одно существо не выдержит такой центробежной силы… но если понадобится, оно может крутиться ещё быстрее!!!"
 wsg.2115.name:0 "Закрутилось!"
 wsg.2115.desc:0 "Мы нажали ту самую §Rбольшую красную кнопку§! ускорения, и кольцо Дайсона на наших глазах набирает обороты — все ликовали.\n\nНо чем быстрее вращение, тем сильнее всё выходит из-под контроля: чудовищная скорость разрывает всё в клочья.\nОбороты дошли до теоретического максимума, а изначальный дом перестал существовать…\n\n\n§YНо кого это волнует?! Теперь это кольцо действительно КРУУУУУТО!! §!"
 wsg.2115.a:0 "§YКРУУУУУТО!! §!"
 ration_dyson_ring_low2:0 "Обитаемое кольцо Дайсона"
 ration_dyson_ring_low2_DESC:0 "Обитаемое кольцо Дайсона, оставленное нам предками. Осталось решить — нажимать ли ту самую §Rбольшую красную кнопку§! ускорения!"
 ration_dyson_ring_faster:0 "Кольцо Дайсона с превышенной скоростью"
 ration_dyson_ring_faster_DESC:0 "Это кольцо должно было быть обитаемым миром, но почему-то раскрутилось до предела — ни одно существо не выдержит такой центробежной силы. Причина — похоже, в переразряде неполной сферы Дайсона, но причудливая конструкция дарит нам уникальную возможность для наблюдений."
 ration_dyson_ring_low:0 "Обитаемое кольцо Дайсона"
 ration_dyson_ring_low_DESC:0 "Сняв часть сегментов сферы Дайсона и уменьшив подачу энергии, мы наконец можем пользоваться этим удивительным миром-кольцом."
 ration_dyson_ring_super_faster:0 "Сверхскоростное кольцо Дайсона"
 ration_dyson_ring_super_faster_DESC:0 "Вся энергия уходит на поддержание сверхскоростного вращения кольца. Обитаемости и продукции как не бывало, зато сейчас оно действительно КРУУУУУУТО."
 ration_dyson_ring_super_super_faster:0 "Сверхскоростное кольцо Дайсона, версия 2"
 ration_dyson_ring_super_super_faster_DESC:0 "Кольцо Дайсона с дополнительным вращающимся кольцом. Практической пользы никакой, но зато действительно КРУУУТО, и это ещё не предел."
 ration_dyson_ring_super_super_super_faster:0 "Истинное·сверхскоростное кольцо Дайсона"
