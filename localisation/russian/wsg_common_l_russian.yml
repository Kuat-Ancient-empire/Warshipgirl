 sm_srse_industory:0 "Модуль производства энергетических ядер Глубинных"
 sm_srse_industory_desc:0 "Чтобы уберечь планету от чудовищного излучения производства энергетических ядер, разумно вынести его на звёздную базу."
 sm_neo_industory:0 "Модуль производства NEO"
 sm_neo_industory_desc:0 "Производство NEO на звёздной базе — отличный способ поднять выпуск."
 sm_wsg_bungee_jumping:0 "Модуль звёздного банджи"
 sm_wsg_bungee_jumping_desc:0 "Несколько люков на звёздной базе позволят туристам испытать острые ощущения прыжков банджи прямо в звезду. Прочность конструкции от этого страдает, но прибыль, как всегда, важнее."
 wg_information_age:0 "Информационная эпоха"
 wg_information_age_desc:0 "Аборигены этой планеты уже искусно кипятят воду всеми способами, кроме управляемого термоядерного синтеза, и построили глобальную индустрию информационных технологий, многократно облегчившую поездки и общение жителей всех регионов."
