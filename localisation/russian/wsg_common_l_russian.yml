 edict_wg_developer:0 "Указ разработчиков WG"
 edict_wg_developer_desc:0 "Привилегия бета-сервера"
 wg_mod_version:0 "Версия мода: v9.4"
 wsg_hidden_capital:0 "Скрытая столица корабельных дев"
 wsg_hidden_capital_DESC:0 "Теперь наша высшая администрация может отдавать приказы со скрытой астероидной базы, не опасаясь угрозы со стороны «Шанъю-1»."
 wsg_hidden_capital_MEGASTRUCTURE_DETAILS:0 "Чтобы избежать угрозы «Шанъю-1», мы втайне перестроили астероид в скрытую столицу. Огромное количество сплавов обеспечивает прочность конструкции, а несколько аварийных маяков исключают любые непредвиденные ситуации."
 requires_only_one_wsg_hidden_capital:0 "$TRIGGER_FAIL$ У нас уже есть скрытая столица"
 mod_shipsize_wg_battleship_hull_add:0 "Прочность корпуса доброго линкора"
 sr_se_deficit_tooltip:0 "У всех £pop£ жителей, использующих £sr_se£§Y$sr_se$§! (корабельных дев, завершивших вознесение Project-S, и глубинных корабельных дев): §R £mod_pop_bonus_workforce_mult£ $MOD_POP_BONUS_WORKFORCE_MULT$ -30%§!, §Hа эффекты всех потребляющих§! £sr_se£§Y$sr_se$§!§H черт (кроме черт вознесения)§! §Rперестают действовать§!"
 councilor_ruler_warshipgirls:0 "Флагман"
 councilor_ruler_warshipgirls_desc:0 "Правительница этой цивилизации корабельных дев"
 councilor_ruler_warshipgirls_male:0 "Флагман"
 councilor_ruler_warshipgirls_female:0 "Флагман"
 UnitedFleet_3:0 "Плывущая против течения тёмная звезда — дифракционная гамма струн (песня глубинной Лексингтон)"
 wg_kebab_center_02:0 "Межзвёздный кебаб-центр"
 wg_kebab_center_02_DESC:0 "Гигантская конструкция для жарки мяса, использующая жар расплавленной планеты: огромное кольцо опоясывает её экватор, а внутренняя сторона кольца создаёт идеальные условия для гриля.\nРецепт и традиционный способ приготовления не менялись с §G1453§! года §Gпо сей день§!"
 wg_kebab_center_01:0 "Строительная площадка межзвёздного кебаб-центра"
 wg_kebab_center_01_DESC:0 "Громадное количество гриль-оборудования уже готово…"
 wg_kebab_center_01_MEGASTRUCTURE_DETAILS:0 "Гигантская конструкция для жарки мяса, использующая жар расплавленной планеты: огромное кольцо опоясывает её экватор, а внутренняя сторона кольца создаёт идеальные условия для гриля."
 kebab_center_effects:0 "Лоли-римские очки §G+100%§!"
 requires_only_one_kebab_center:0 "$TRIGGER_FAIL$ У нас уже есть кебаб-центр"
 requires_molten:0 "$TRIGGER_FAIL$ Планета должна быть расплавленной"
 wsg.2112.name:0 "Межзвёздный кебаб-центр"
 wsg.2112.desc:0 "Проект гриль-оборудования и кольца готов. Теперь достаточно вложить ещё немного ресурсов и еды, чтобы, используя жар этой расплавленной планеты, построить самый большой кебаб-центр галактики."
 wsg.2112.a:0 "Бесконечный гриль ждёт нас впереди"
 wsg.2113.name:0 "Межзвёздный кебаб-центр достроен!"
 wsg.2113.desc:0 "Когда изошла первая партия жареного мяса, дегустаторы не сдержали трогательных слёз. Сочное жареное мясо — это не просто пиршество, это воспоминание об истории."
 wsg.2113.a:0 "Жарим!"
 wsg.2114.name:0 "Тюлень, крадущий кебаб"
 wsg.2114.desc:0 "Трудно поверить, но каким-то неизвестным образом тюлень пробрался в наш кебаб-центр и безостановочно ворует мясо. Мы устроили сплошные прочёсывания, но так и не нашли этого противного тюленя.\n\nУ нас есть два пути.\nПервый — позволить тюленю воровать, но тогда мы навсегда будем недополучать часть еды.\nВторой — поднять температуру во всём кебаб-центре до такой, что еда превращается в уголь, и сжечь большого тюленя, но это остановит производство на несколько месяцев."
 wsg.2114.a:0 "Ладно, пусть ворует"
 wsg.2114.a.tooltip:0 "Производство еды межзвёздного кебаб-центра временно §R-10§!"
 wsg.2114.b:0 "Сжечь тюленя!"
 wsg.2114.b.tooltip:0 "Производство еды межзвёздного кебаб-центра остановится на несколько месяцев"
 mega_wg_polymer_matrix:0 "«Мегаструктура» Полимерная производственная матрица"
 tech_wg_polymer_matrix:0 "Полимерная производственная матрица"
 tech_wg_polymer_matrix_desc:0 "Технология мегаструктуры из Лавки Трофеев, использующая продвинутые принципы, которые нам не постичь.\nЭта мегаструктура — опоясывающая планету полимерная производственная матрица: она синтезирует энергию и сплавы из вещества планеты, попутно добывая ценные минералы. Её эффективность далеко превосходит §Yрой Дайсона и шахтную станцию§!."
 wg_polymer_matrix_edicts:0 "§HОткрыта мегаструктура: §! Полимерная производственная матрица"
 wg_polymer_matrix:0 "Полимерная производственная матрица"
 wg_polymer_matrix_DESC:0 "Лавка Трофеев уверяет, что §YLOGO§! на этой мегаструктуре — ключ к её запуску, но никто не знает, откуда он и что значит. Известно лишь одно: любое изменение §YLOGO§! приводит к тому, что мегаструктура перестаёт работать."
 wg_polymer_matrix_MEGASTRUCTURE_DETAILS:0 "Опоясывающая планету полимерная производственная матрица: синтезирует энергию и сплавы из вещества планеты, попутно добывая ценные минералы."
 requires_of_wg_polymer_matrix:0 "Полимерная производственная матрица может добывать только на исследованных бесплодных, токсичных, замёрзших и расплавленных планетах."
 dyson_yamato:0 "Рой Дайсона корабельных дев"
 dyson_yamato_DESC:0 "Рой Дайсона из бесчисленных маленьких солнечных панелей вокруг звезды. Возможно, он не так продуктивен, как сфера Дайсона, зато дёшев и строится где угодно. А главное — он не перекрывает свет звезды полностью и сохраняет необходимое освещение для обитаемых планет."
 dyson_yamato_MEGASTRUCTURE_DETAILS:0 "Сотни миллионов маленьких солнечных панелей образуют рой Дайсона вокруг нашей звезды: хоть это и не сфера Дайсона, электричества он даёт предостаточно"
 requires_only_one_yamato_in_system:0 "$TRIGGER_FAIL$ В системе можно построить только один рой Дайсона"
 requires_only_one_yamato_in_planet:0 "$TRIGGER_FAIL$ Здесь уже есть рой Дайсона"
 wg_drg_station:0 "Станция корпорации «Глубинная Скала»"
 wg_drg_station_DESC:0 "Корпорация «Глубинная Скала» — крупнейшая компания государства в области глубокого космического горнодобывающего промысла. Она нанимает низкорослых эсминцев-корабельных дев с §Gзависимостью от кофе/пива/напитков§! и отправляет их добывать породу на планеты.\nИх лозунг: §YGold and mushroom!§!"
 wg_drg_station_MEGASTRUCTURE_DETAILS:0 "Станцию корпорации можно развернуть на большинстве планет; нанятые эсминцы-корабельные девы курсируют между планетой и станцией в десантных капсулах, добывая породу"
 mist_neo_alpha_core_0:0 "Лазурная агрегационная матрица"
 mist_neo_alpha_core_0_DESC:0 "С помощью наших союзников из иного измерения мы смогли построить эту специализированную установку для производства кристаллов NEO и ALPHA."
 mist_neo_alpha_core_0_MEGASTRUCTURE_DETAILS:0 "С помощью наших союзников из иного измерения мы смогли построить эту специализированную установку для производства кристаллов NEO и ALPHA."
 mist_neo_alpha_core_1:0 "Каркас лазурной агрегационной матрицы"
 mist_neo_alpha_core_1_DESC:0 "Пока не активированный каркас агрегационной матрицы"
 mist_neo_alpha_core_2:0 "Лазурная агрегационная матрица — NEO"
 mist_neo_alpha_core_2_DESC:0 "Агрегационная матрица, используемая для производства NEO"
 mist_neo_alpha_core_3:0 "Лазурная агрегационная матрица — ALPAH"
 mist_neo_alpha_core_3_DESC:0 "Агрегационная матрица, используемая для производства кристаллов ALPAH"
 requires_no_mist_alpha_core_under_construction:0 "$TRIGGER_FAIL$ Есть недостроенная до конца лазурная агрегационная матрица"
 mist_neo_alpha_core:0 "§HОткрыта мегаструктура: §! Лазурная агрегационная матрица"
 tech_mist_neo_alpha_core:0 "Лазурная агрегационная матрица"
 tech_mist_neo_alpha_core_desc:0 "Гигантская структура для производства кристаллов NEO и ALPHA."
 wsg_mining_station:0 "Большая шахтная станция корабельных дев"
 wsg_mining_station_DESC:0 "Большая шахтная станция для добычи минералов со всего астероидного пояса — она непрерывно снабжает нас качественной рудой."
 wsg_mining_station_MEGASTRUCTURE_DETAILS:0 "Большая шахтная станция для добычи минералов со всего астероидного пояса — она непрерывно снабжает нас качественной рудой."
 requires_only_one_wsg_mining_station_in_system:0 "В системе можно построить только одну гигантскую шахтную станцию"
 requires_asteroid:0 "$TRIGGER_FAIL$ Нужно находиться в астероидном поясе"
 requires_only_one_mining_station_in_planet:0 "$TRIGGER_FAIL$ Здесь уже есть большая шахтная станция"
 wsg_station:0 "Гигантская орбитальная станция корабельных дев"
 wsg_station_DESC:0 "Огромная синхронно-орбитальная станция — важная военная и промышленная база."
 wsg_station_MEGASTRUCTURE_DETAILS:0 "Огромная синхронно-орбитальная станция — важная военная и промышленная база, пригодная и для постройки кораблей."
 sm_wsgshipyard:0 "Стыковочный модуль орбитальных доков"
 sm_wsgshipyard_desc:0 "Устройство для стыковки с орбитальной станцией: после постройки можно использовать её доки для производства кораблей."
 requires_only_one_in_system:0 "$TRIGGER_FAIL$ В системе можно построить только одну гигантскую орбитальную станцию"
 requires_colonizeable_planet:0 "$TRIGGER_FAIL$ Планета должна быть колонизирована"
 requires_maximum_eight:0 "$TRIGGER_FAIL$ Максимум 8 гигантских орбитальных станций"
 wg_space_mine_0:0 "Строительная площадка Центра обороны метрополии"
 wg_space_mine_0_DESC:0 "Гигантский Центр обороны метрополии: после полного завершения он значительно усилит оборонительные операции нашей империи на родных территориях.\n\n§YНаши флоты получают 10% общей циклической прибыли как дополнительный бонус§!."
 wg_space_mine_1:0 "Центр обороны метрополии"
 wg_space_mine_1_DESC:0 "Гигантский Центр обороны метрополии: после полного завершения он значительно усилит оборонительные операции нашей империи на родных территориях.\n\n§YНаши флоты получают 10% общей циклической прибыли как дополнительный бонус§!."
 wg_space_mine_0_MEGASTRUCTURE_DETAILS:0 "Гигантский Центр обороны метрополии: после полного завершения он значительно усилит оборонительные операции нашей империи на родных территориях.\n\n§YНаши флоты получают 10% общей циклической прибыли как дополнительный бонус§!."
 requires_only_one_in_system:0 "$TRIGGER_FAIL$ В системе можно построить только одну гигантскую орбитальную станцию"
 requires_colonizeable_planet:0 "$TRIGGER_FAIL$ Планета должна быть колонизирована"
 wg_space_farm:0 "Большая орбитальная ферма"
 wg_space_farm_DESC:0 "Большая орбитальная ферма, обеспечивающая наши миры бесконечным потоком качественной еды."
 wg_space_farm_MEGASTRUCTURE_DETAILS:0 "Большая орбитальная ферма над планетой, обеспечивающая наши миры бесконечным потоком качественной еды."
 requires_only_one_wg_space_farm:0 "$TRIGGER_FAIL$ В системе можно построить только одну большую орбитальную ферму"
 wg_star_city:0 "Космический город развлечений корабельных дев"
 wg_star_city_DESC:0 "Гигантский космический город развлечений: здесь есть всё, что только можно вообразить."
 wg_star_city_MEGASTRUCTURE_DETAILS:0 "Гигантский космический город развлечений: здесь есть всё, что только можно вообразить."
 requires_maximum_five:0 "$TRIGGER_FAIL$ Мы можем построить только 5 космических городов развлечений"
 wg_mega_store:0 "Строительная площадка гигантского космического склада корабельных дев"
 wg_mega_store_DESC:0 "Площадка космического склада: при наличии ресурсов можно продолжать строительство."
 wg_mega_store_1:0 "Гигантский космический склад корабельных дев"
 wg_mega_store_1_DESC:0 "Это грандиозное космическое сооружение — гордость и чудо инженерной мысли корабельных дев. Оно хранит огромные объёмы ресурсов, а как логистический центр способствует росту торговли в системе."
 wg_mega_store_2:0 "Гигантский космический склад корабельных дев — ультра-эволюция"
 wg_mega_store_2_DESC:0 "Благодаря загадочной и продвинутой технологии тёмной материи склад резко нарастил вместимость.\nХотя никто не объяснил, зачем для хранения грузов в космосе нужна тёмная материя."
 wg_mega_store_MEGASTRUCTURE_DETAILS:0 "Гигантский космический склад на планетарной орбите, созданный специально для корабельных дев, обожающих всё копить."
 wg_mega_store_edicts:0 "§HОткрыта мегаструктура: §! Гигантский космический склад корабельных дев"
 tech_wg_mega_store:0 "Гигантский космический склад корабельных дев"
 tech_wg_mega_store_desc:0 "Гигантский космический склад на планетарной орбите, созданный для корабельных дев, обожающих всё копить. Он эффективно решает проблему §Yпереполнения складов§!, а как логистический центр §Yспособствует росту торговли в системе§!"
 wg_mega_store_modifier:0 "Перевалочный узел космического склада корабельных дев"
 wg_mega_store_modifier_desc:0 "Большой склад корабельных дев в этой системе служит перевалочным пунктом для грузов этой планеты, способствуя развитию местной торговли."
 wg_mega_store_effects:0 "\nВместимость склада: §G+50000§!\nТорговая стоимость планет системы с £trade_value£ §Yторговой стоимостью§!: §G+25%§!"
 wg_mega_store_2_effects:0 "\nВместимость склада: §G+500000§!\nТорговая стоимость планет системы с £trade_value£ §Yторговой стоимостью§!: §G+25%§!"
 uf_mega_store_effects:0 "\nВместимость склада: §G+250000§!\nТорговая стоимость планет системы с £trade_value£ §Yторговой стоимостью§!: §G+25%§!"
 shenhai_energy_core_1:0 "Строительная площадка гигантского завода энергетических ядер Глубинных"
 shenhai_energy_core_1_DESC:0 "Чтобы уменьшить мощнейшее излучение заводов энергетических ядер, можно построить в космосе гигантскую структуру, специализирующуюся на производстве этого ресурса."
 shenhai_energy_core_1_MEGASTRUCTURE_DETAILS:0 "Чтобы уменьшить мощнейшее излучение заводов энергетических ядер, можно построить в космосе гигантскую структуру, специализирующуюся на производстве этого ресурса."
 shenhai_energy_core_2:0 "Ядро гигантского завода энергетических ядер Глубинных"
 shenhai_energy_core_2_DESC:0 "Ядро завода на месте; энергетические ядра Глубинных уже производятся непрерывным потоком. Дополнительное гравитационное кольцо поднимет производительность ещё выше, но сначала придётся установить улучшенный рассеиватель излучения."
 shenhai_energy_core_3:0 "Рассеиватель излучения гигантского завода энергетических ядер Глубинных"
 shenhai_energy_core_3_DESC:0 "Завод с установленным рассеивателем излучения и выросшей производительностью — теперь мы готовы к монтажу гравитационного кольца."
 shenhai_energy_core_4:0 "Гигантский завод энергетических ядер Глубинных"
 shenhai_energy_core_4_DESC:0 "Завод энергетических ядер Глубинных в полной комплектации: его колоссальная производительность удовлетворит наш всё растущий спрос."
 requires_only_one_shenhai_energy_core:0 "$TRIGGER_FAIL$ Мы уже построили гигантский завод энергетических ядер Глубинных"
 job_wsg_senergy_sr_pantsu_upkeep_decrease:0 "Содержание работы §Y$job_wsg_senergy$§! уменьшено на §G0.2 £sr_pantsu£ $sr_pantsu$§!"
 wsg.3083.name:0 "Площадка завода энергетических ядер достроена"
 wsg.3083.desc:0 "Огромный завод энергетических ядер Глубинных, прямо открытый космосу, начал строиться. После завершения он сможет производить огромное количество энергетических ядер и полностью закрыть наши растущие потребности.\nОбратите внимание: после ввода в эксплуатацию фабрика будет источать губительное для среды излучение — §Rвся система будет окончательно заражена§!. Именно поэтому её нельзя строить в системах с обитаемыми планетами."
 wsg.3084.name:0 "Ядро завода энергетических ядер Глубинных на месте"
 wsg.3084.desc:0 "Специальная большая центрифуга энергетических ядер Глубинных построена: завод уже в состоянии начать производство энергетических ядер."
 wsg.3085.name:0 "Рассеиватель излучения завода энергетических ядер Глубинных готов"
 wsg.3085.desc:0 "Рассеиватель, отводящий огромное излучение, возникающее при производстве энергетических ядер, готов. Теперь рабочие завода могут спокойно выпускать нужные объёмы."
 wsg.3086.name:0 "Гигантский завод энергетических ядер Глубинных достроен"
 wsg.3086.desc:0 "Помимо ключевого оборудования и рассеивателя, заводу требовалось огромное количество вспомогательной автоматики — теперь всё на месте, и фабрика может на полную мощность производить энергетические ядра, снимая все наши заботы."
