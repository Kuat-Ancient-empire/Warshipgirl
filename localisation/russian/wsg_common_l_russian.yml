 tech_uav:0 "Разведывательный дрон"
 tech_uav_desc:0 "Мы добавили базовое вооружение к нескольким беспилотным зондам — теперь они могут служить сверхбыстрыми разведчиками и лёгкими боевыми кораблями.\n§YДрон несёт дополнительно§!§G 1§!§Y радиус обнаружения§!"
 tech_uav2:0 "Боевой дрон"
 tech_uav2_desc:0 "Защита урезана, зато установлено более крупное вооружение."
 tech_uav3:0 "Тяжёлый боевой дрон"
 tech_uav3_desc:0 "Установлено орудие абсурдного для дрона калибра, защита при этом снижена до минимума, а из-за размеров невозможно поставить самые продвинутые реакторы и двигатели."
 tech_uav4:0 "Спинальный супердрон"
 tech_uav4_desc:0 "Лишь полностью пожертвовав защитой, удалось оснастить дрон спинальным орудием линкорного класса. Часть оружейников считает, что достаточно одного залпа до их уничтожения, чтобы кардинально переломить ход войны."
 tech_sh_senergy_uav:0 "Миниатюризация компонентов дронов"
 tech_sh_senergy_uav_desc:0 "Благодаря новейшим технологиям реакторы на энергетических ядрах Глубинных удалось миниатюризировать — а значит, появились и более мощные вооружения для кораблей-дронов."
 tech_wsg_alpha_uav:0 "Миниатюризация компонентов дронов"
 tech_wsg_alpha_uav_desc:0 "Благодаря новейшим технологиям реакторы на кристаллах Альфа удалось миниатюризировать — а значит, появились и более мощные вооружения для кораблей-дронов."
 SHIP_AURA_UAV_NAVIGATOR_1:0 "Навигационный дрон-модуль\n\n§YЭффект не суммируется с более продвинутым навигационным модулем§!"
 SHIP_AURA_UAV_NAVIGATOR_2:0 "Продвинутый навигационный дрон-модуль\n\n§YЭффект не суммируется с менее продвинутым навигационным модулем§!"
 tech_uav_aura_navigator:0 "Навигационный дрон-модуль"
 tech_uav_aura_navigator_desc:0 "Установка продвинутого навигационного модуля в дроны обеспечит флоту сканирование в реальном времени и расчёт кратчайших путей, повышая досветовую скорость.\n§YЭффект не суммируется с более продвинутым навигационным модулем§!"
 tech_uav_aura_navigator_2:0 "Продвинутый навигационный дрон-модуль"
 tech_uav_aura_navigator_2_desc:0 "Ещё более продвинутая система навигации дронов — она значительно повысит скорость флота.\n§YЭффект не суммируется с менее продвинутым навигационным модулем§!"
