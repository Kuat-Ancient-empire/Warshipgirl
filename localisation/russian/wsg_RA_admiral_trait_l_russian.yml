l_russian:

 leader_trait_admiral_ra_Junyo:0 "Вижу врага — атакую"
 leader_trait_admiral_ra_Junyo_desc:0 "До вступления в ряды Сопротивления эта дева была известной профессиональной спортсменкой, поэтому после призыва она реагирует быстрее прочих солдат."
 leader_trait_admiral_ra_Chongqing:0 "ПВО-камуфляж"
 leader_trait_admiral_ra_Chongqing_desc:0 "Эта корабельная дева раньше занималась исследованием вооружений. Она знает, как на поле боя противостоять палубной авиации и осколочно-фугасному вооружению врага.\n\n§RПалубная авиация, дроны и осколочно-фугасное вооружение врага: урон -80%, двойное пробитие -10%§!\n§YЭффекты навыков не суммируются§!"
 leader_trait_admiral_ra_DM:0 "Восьмидюймовый пулемёт"
 leader_trait_admiral_ra_DM_desc:0 "Выдающееся командование этой девы и её выдающиеся формы вдохновляют каждого солдата рядом."
 leader_trait_admiral_ra_Fantasque:0 "Высокоманевренность"
 leader_trait_admiral_ra_Fantasque_desc:0 "Флот этого генерала славится стремительностью.\n\n§GВ бою малый шанс на ['concept_wg_super_protect'] случайного малого корабля на несколько дней§!"
 leader_trait_admiral_ra_Essex:0 "Охота на индюшек"
 leader_trait_admiral_ra_Essex_desc:0 "Эта дева-генерал знает каждую слабость палубной авиации и использует это знание для смертельных ударов.\n\n§RПалубная авиация, дроны и осколочно-фугасное вооружение врага: скорость и урон -15%, выпуск дронов с вражеских дронаносцев урезан вдвое§!\n§YЭффекты навыков не суммируются§!"
 leader_trait_admiral_ra_Nevada:0 "Всё или ничего"
 leader_trait_admiral_ra_Nevada_desc:0 "Броня флота этой девы аномально толста и держит яростный огонь.\n\n§RДвойное пробитие врага: урон -30%§!\n§YЭффекты навыков не суммируются§!"
 leader_trait_admiral_ra_AD:0 "Счастливая звезда"
 leader_trait_admiral_ra_AD_desc:0 "У этой девы-генерала всегда отличная удача — и она полагается на неё в погоне за победой.\n\n§GВ начале боя случайно +5~50% к урону и уклонению§!"
 leader_trait_admiral_ra_Ranger:0 "Боепитание"
 leader_trait_admiral_ra_Ranger_desc:0 "Эта дева-генерал сильна в тыловой логистике и знает ей цену — хотя иногда из-за этого упускает момент."
 leader_trait_admiral_ra_Sirius:0 "Крейсер на все руки"
 leader_trait_admiral_ra_Sirius_desc:0 "Эта дева-генерал умеет выжать из флота максимум через крейсера.\n\n§HВ бою средний шанс мгновенно уничтожить один вражеский эсминец§!"
 leader_trait_admiral_ra_Gearing:0 "Авангард Холодной войны"
 leader_trait_admiral_ra_Gearing_desc:0 "Эта дева-генерал умеет вооружаться разведданными и получать на их основе преимущество в бою."
 leader_trait_admiral_Vanguard:0 "Королевский лайнер"
 leader_trait_admiral_Vanguard_desc:0 "Мощнейший тактический анализ этого генерала позволяет её флоту крепнуть с каждым днём.\n\n§GКаждые полмесяца боя: броня флота +2%, урон и скорость ПВО +10%, точность +3, урон +2%, уклонение +3; до 5 срабатываний. §!"
 leader_trait_admiral_ra_Ninghai:0 "Флотская муштра"
 leader_trait_admiral_ra_Ninghai_desc:0 "Кредо этого генерала: каждый солдат должен пройти строгую и полную подготовку до выхода на поле боя.\n\n§GПосле найма все новые корабли получают +50 опыта§!§Y Эффекты навыков не суммируются§!"
 leader_trait_admiral_ra_Tashkent:0 "Скоростное уклонение"
 leader_trait_admiral_ra_Tashkent_desc:0 "Флот этого генерала использует скорость для сложных манёвров и успевает за её опережающими замыслами.\n\n§GВ бою малый шанс на ['concept_wg_super_protect'] случайного эсминца на 5 дней§!"
 leader_trait_admiral_ra_Kitayama:0 "Истощающие торпеды"
 leader_trait_admiral_ra_Kitayama_desc:0 "Эта дева-генерал — мастер торпедного боя.\n\n§YВ начале боя выпускается волна вступительной торпедной атаки. §!\n"
 leader_trait_admiral_ra_Sukhbaatar:0 "Рыбалка"
 leader_trait_admiral_ra_Sukhbaatar_desc:0 "§YПосле победы в бою получает несколько случайных кораблей§!"
 leader_trait_admiral_ra_Eugen:0 "Оборона рубежа"
 leader_trait_admiral_ra_Eugen_desc:0 "Поле-усиливающий ригинг этого генерала отлично защищает её флот и ведёт его в контратаку к победе.\n\n§YВ бою средний шанс на ['concept_wg_super_protect'] случайного корабля на 3 дня§!"
 leader_trait_admiral_ra_Helena:0 "Анализ разведданных"
 leader_trait_admiral_ra_Helena_desc:0 "У этого генерала прозвище «дева, питающаяся разведданными» — ясно, что никакое движение на поле боя не ускользнёт от её глаз.\n\n§GВ начале боя обнаружение всех союзных флотов (включая свой) +30%, точность +15§!, §Gв бою средний шанс +50% урона случайному эсминцу или крейсеру флота§!\n§YЭффекты навыков не суммируются§!"
 leader_trait_admiral_ra_Renown:0 "Последняя слава"
 leader_trait_admiral_ra_Renown_desc:0 "Эта дева черпает силы во всём, что несёт на своих плечах.\n\n§GКаждые полмесяца боя: броня флота +5%, урон ПВО +10%, точность +5, урон +5%, уклонение +5; до 5 срабатываний. §!"
 leader_trait_admiral_ra_Renown2:0 "Нельсон на 29 узлах"
 leader_trait_admiral_ra_Renown2_desc:0 "Эта дева умеет маскировать свой флот и бить точно в сердце врага. Такая тактика приносит впечатляющие плоды.\n\n§HВ начале боя мгновенно уничтожается один вражеский крупный корабль; в бою также есть малый шанс мгновенно уничтожить ещё один. §!"
 leader_trait_admiral_ra_Yamato:0 "Контрудар"
 leader_trait_admiral_ra_Yamato_desc:0 "Даже в тяжелейшем положении эта директриса всегда ловит шанс и наносит противнику глубокие раны.\n\n§GУрон всех крупных кораблей флота +30%, скорость стрельбы +15%§!, §Hпри каждой потере своего корабля есть малый шанс мгновенно уничтожить случайный вражеский корабль§!\n§RПотеря дрона срабатывает реже, чем потеря обычного корабля! §!"
 leader_trait_admiral_ra_Changchun:0 "Четыре небесных короля"
 leader_trait_admiral_ra_Changchun_desc:0 "Эта дева обожает ракеты — даже когда они летят по законам броуновского движения…\n\n§YВ начале боя выпускается волна вступительного ракетного залпа. §!"
 leader_trait_admiral_ra_Johnston:0 "Боец Самара"
 leader_trait_admiral_ra_Johnston_desc:0 "Даже против врага, в разы превосходящего силой, эта дева-генерал держит изумительную волю и стойкость.\n\n§GЕсли в начале боя своих кораблей меньше, чем у врага: уклонение флота +80%, точность +50%.§!"
 leader_trait_admiral_ra_Richelieu:0 "Кирасир"
 leader_trait_admiral_ra_Richelieu_desc:0 "На веку этой девы взлётов и падений больше, чем у большинства людей, — это лишь укрепило её боевую волю.\n\n§GЕсли в начале боя своих кораблей меньше: урон +30%, малый шанс ещё +30% двойного пробития. §!"
 leader_trait_admiral_ra_Royal_Ark:0 "Точный удар"
 leader_trait_admiral_ra_Royal_Ark_desc:0 "Этот генерал знает всё о корабельной обороне и вложила это знание в своё вооружение — убойность потрясающая.\n\n§RУклонение, броня и щиты врага -30%§!\n§YЭффекты навыков не суммируются§!"
 leader_trait_admiral_ra_U47:0 "Волчья стая"
 leader_trait_admiral_ra_U47_desc:0 "Координация огромных флотов — извечная головная боль, но для этого гениального генерала — не проблема.\n\n§BВ начале боя точность всех союзных флотов (включая свой) +10, скорость и урон осколочно-фугасных +30%§!, и §Rв бою малый шанс мгновенно уничтожить любой вражеский корвет§!\n§YЭффекты навыков не суммируются§!"
 leader_trait_admiral_ra_Hutton:0 "Германская школа"
 leader_trait_admiral_ra_Hutton_desc:0 "Флот этого генерала несёт новую конструкцию брони: короткими всплесками он получает превосходную защиту. Минус — негибкая оборона против малых кораблей.\n\n§YВ бою средний шанс на ['concept_wg_super_protect'] корабля флота на 3 дня. Не чаще одного раза за бой. §!\n§RДроны и корветы не получают эффект ['concept_wg_super_protect']§!"
 leader_trait_admiral_ra_Enterprise:0 "Единственное древо"
 leader_trait_admiral_ra_Enterprise_desc:0 "Энтерпрайз осыпана боевыми лаврами — героиня, овеянная легендами.\nВступление в бой: §Rурон и броня противника -20%§!\n§YЭффекты навыков не суммируются§!"
 leader_trait_admiral_ra_Enterprise2:0 "Большая Э"
 leader_trait_admiral_ra_Enterprise2_desc:0 "Даже в самой безнадёжной ситуации Энтерпрайз не знает уныния и всегда приводит войско к победе.\n\nВступление в бой: §Hмгновенно уничтожает один титан или дредноут§! (иначе — линкор или авианосец; если нет ни тех, ни других — не срабатывает), §Gвысокий шанс полного восстановления кораблей флота при тяжёлом повреждении (раз на корабль)§!"
 leader_trait_admiral_ra_VV:0 "Итальянская школа"
 leader_trait_admiral_ra_VV_desc:0 "Новый ригинг Венето позволяет её флоту выходить из-под любого огня без единой царапины.\n\n§YВ течение 7 дней после вступления флота в бой — ['concept_wg_super_protect']§!\n§RДроны и корветы не получают эффект ['concept_wg_super_protect']§!"
 leader_trait_admiral_ra_Hood:0 "Слава Королевского флота"
 leader_trait_admiral_ra_Hood_desc:0 "Командование этого генерала великолепно: она легко согласует корабли даже чужих флотов. Правда, удачи иногда не хватает.\n\n§BВ начале боя бонус получают все союзные флоты (включая свой)§!, §Rпосле вступления в бой малый шанс: у нас внезапно гибнет 1 корабль, у врага — 3§!\n§YЭффекты навыков не суммируются§!"
 leader_trait_admiral_Rodney_ra:0 "Большая семёрка"
 leader_trait_admiral_Rodney_ra_desc:0 "Одержимая огневой мощью Родни бойцы Сопротивления единодушно причислили к семи сильнейшим адмиралам Порта — «Большой семёрке».\n\n§BВ бою малый шанс мгновенно уничтожить два вражеских корабля, ничтожный шанс — с захватом линкора§!"
 leader_trait_admiral_ra_Yukikaze:0 "Благословенная невезением"
 leader_trait_admiral_ra_Yukikaze_desc:0 "Восточная таинственная сила Снежной принцессы всякий раз обращает беду в благо — что до остальных, это уже другой вопрос.\n\n§RВ начале боя есть ничтожнейший шанс, что случится нечто по-настоящему ужасное§!"
 leader_trait_admiral_ra_Lexington:0 "Пионер авиатактики"
 leader_trait_admiral_ra_Lexington_desc:0 "Авиатактическая теория Лексингтона открыла Сопротивлению целое направление и заполнила немало пробелов — по праву один из краеугольных камней армии. Сама Лексингтон стала центральной фигурой Сопротивления.\n\n§BВ начале боя бонус получают все союзные флоты (включая свой). §!\n§YЭффекты навыков не суммируются§!"
 leader_trait_admiral_ra_Lexington2:0 "Леди Лекс"
 leader_trait_admiral_ra_Lexington2_desc:0 "Я считаю, что Лексингтон — повелительница мира, и все должны стать её верными слугами.jpg\n\n§YПосле начала боя призывает группу поддержки — фанатов Лексингтона. §!"
 leader_trait_admiral_ra_Missouri:0 "Воин решающей победы"
 leader_trait_admiral_ra_Missouri_desc:0 "Адмирал Миссури — редкий тактический гений и героиня Сопротивления. Она бесчисленно раз выводила его из отчаяния, не ведала страха даже в одиночку и вписала дух сопротивления в кости каждого. Легендарный полководец.\n\n§HВ бою средний шанс мгновенно уничтожить крупный корабль, КД 10 дней§!"
 leader_trait_admiral_ra_Taiho_sh:0 "Безоблачное небо"
 leader_trait_admiral_ra_Taiho_sh_desc:0 "Разработанная адмиралом Тайхо система РЭБ на короткое время обездвиживает вражеские дроны, открывая дорогу к господству в воздухе. Кроме того, Тайхо бережёт собственный флот, чтобы не потерять эту драгоценную систему.\n\n§YВ начале боя враг не выпускает первую волну дронов (со второй и далее — как обычно); §!§B бонус получают все союзные флоты (включая свой); §!§R палубная авиация и дроны всех вражеских флотов: урон -100%, двойное пробитие -30%;§!\n§YЭффекты навыков не суммируются§!"
 leader_trait_admiral_ra_Cabot:0 "Голубой призрак"
 leader_trait_admiral_ra_Cabot_desc:0 "Велика, как море; неуловима, как призрак. Пусть нечисть идёт со мной рядом — моё сердце и мой путь чисты, как зеркало. Я и есть Голубой призрак.\n\n§GВ начале боя корабли флота получают: после тяжёлого повреждения — ['concept_wg_super_protect'] на 3 дня, затем на 20 дней урон и скорострельность +100%. Через 3 дня здоровье восстанавливается до 50%.§!§B Все союзные корабли: уклонение +30%, после среднего повреждения на 20 дней урон и скорострельность +100%§!\n§YЭффекты навыков не суммируются§!\n§RДроны и корветы не получают эффект ['concept_wg_super_protect']§!"
 raa_skill.2051.title:0 "Восточная таинственная сила"
 raa_skill.2051.desc:0 "Донесение: в недавнем сражении под командованием Юкикадзэ экипажи обеих сторон вдруг покрылись молоком и принялись безумно всё крушить. Большинство кораблей уцелело, но часть из-за этого сама взорвалась. Итог сражения до сих пор неизвестен…………"
 raa_skill.2051.a:0 "С Т Р А Ш Н О"
 raa_skill.150.name:0 "Траление"
 raa_skill.150.desc:0 "После победы в недавнем сражении генерал Сухэ-Батор собрала обломки и пополнила ими свой флот!"
 raa_skill.150.a:0 "Понял. Больше можно не сообщать."
 raa_skill.9999.name:0 "Изменение навыков системы ['concept_wg_super_protect']"
 raa_skill.9999.desc:0 "Только что завербованный вами генерал обладает ограниченными по времени командными навыками системы ['concept_wg_super_protect'] — в связи с изменениями навыков открыто это окно. Чтобы не докучать, сообщение показывается лишь раз.\n\nОбратите внимание: §Rкомандные навыки системы ['concept_wg_super_protect'] не действуют на§!§B дроны и корветы§!§R!!! §!\n"
 raa_skill.9999.a:0 "Я не корейский прогеймер. Подтверждаю."
 ninghai_buff:0 "Флотская муштра"
 ninghai_buff_desc:0 "Эффективная методика генерала Нинхай помогает нашим бойцам быстрее освоить боевое ремесло."
 OPENING_MISSILE_DAMAGE_01:0 "Урон вступительного ракетного залпа"
 opening_missile_damage_01:0 "Урон вступительного ракетного залпа"
 OPENING_TORPEDO_DAMAGE_01:0 "Урон вступительной торпедной атаки"
 opening_torpedo_damage_01:0 "Урон вступительной торпедной атаки"
 effects_damage_aura:0 "Вступительный урон"
 damage_aura:0 "Вступительный урон"
