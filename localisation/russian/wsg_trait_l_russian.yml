 sh_modifier_knowledgeable:0 "$sh_trait_knowledgeable$"
 sh_modifier_knowledgeable2:0 "$sh_trait_knowledgeable2$"
 sh_trait_silent:0 "Сохранять тишину"
 sh_trait_silent_desc:0 "Не лишая разума — переделать прочие организмы в такие же тихие и эффективные, как мы, Глубинные."
 sh_trait_silent1:0 "Сохранять тишину"
 sh_trait_silent1_desc:0 "Не лишая разума — переделать прочие организмы в такие же тихие и эффективные, как мы, Глубинные."
 sh_trait_ring:0 "Кольцо"
 sh_trait_ring_desc:0 "Эта черта ничего не делает, но даже Глубинные должны стать моими жёнами."
