l_russian:

 wsg_trait_satellite:0 "Разогрев ажиотажа"
 wsg_trait_satellite_desc:0 "До рождения новой корабельной девы наши пропагандисты выпускают умопомрачительно красивые голографические постеры, накаляя ожидания. Этот процесс называется «запуск спутников»."
 wsg_trait_coffee:0 "Кофеиновая зависимость"
 wsg_trait_coffee_desc:0 "Мы подсели на напиток под названием «кофе», из-за чего повально низкорослы — это сильно вредит сухопутным боям."
 wsg_trait_0v0:0 "Овоизация"
 wsg_trait_0v0_desc:0 "Однажды случилась глобальная химическая утечка, и нас сильно «овоизировало» — развивать личные рабочие навыки нам теперь очень тяжело."
 wsg_trait_overtime:0 "Переработки"
 wsg_trait_overtime_desc:0 "Переработки приносят мне радость. — некая Хэ."
 wsg_trait_overtime_2:0 "Двойные переработки"
 wsg_trait_overtime_2_desc:0 "С этой недели рабочее время удваивается: работаем 2 дня в неделю по 3 часа в день."
 wsg_trait_diving:0 "Симулянтки"
 wsg_trait_diving_desc:0 "Маршируем мы бодро, как на параде, но то и дело падаем «по-футбольному» — небоевые потери огромны."
 wsg_trait_tasty_food:0 "Охота за вкусом"
 wsg_trait_tasty_food_desc:0 "Наше стремление приготовить лучшую в галактике еду поистине не знает границ."
 wsg_trait_mind_control:0 "Промывка мозгов"
 wsg_trait_mind_control_desc:0 "Передовая технология, разработанная ещё в атомную эпоху, — для сплочения всех членов общества."
 wsg_trait_mind_control_2:0 "Усиленная промывка мозгов"
 wsg_trait_mind_control_2_desc:0 "Ещё более продвинутая и стабильная технология: нестабильные элементы отсеиваются куда эффективнее."
 wsg_trait_money:0 "Кошелёк Лейпцига"
 wsg_trait_money_desc:0 "Мы обожаем деньги, но довольствуемся малым."
 wsg_trait_game:0 "Северная домоседка-императрица"
 wsg_trait_game_desc:0 "Мы так увязли в виртуальных играх, что вытащить нас из дома труднее, чем в космос отправить."
 wsg_trait_surrender:0 "Слишком много идей"
 wsg_trait_surrender_desc:0 "У наших корабельных дев всегда полным-полно странных идей — диспетчеризировать это всё очень непросто."
 wsg_trait_missile:0 "Шанъю-1"
 wsg_trait_missile_desc:0 "Контроль над вооружением у нас из рук вон плох: незарегистрированные ракеты то и дело носятся над жилыми кварталами."
 wsg_trait_block:0 "Утопленные черновики"
 wsg_trait_block_desc:0 "Новая корабельная дева уже готова родиться, но некая таинственная сила препятствует её появлению на свет."
 wsg_trait_GALO:0 "Талисман GALO"
 wsg_trait_GALO_desc:0 "Работать, обнимая GALO, — одно удовольствие."
 wsg_trait_gugu:0 "Ку-ку-ку"
 wsg_trait_gugu_desc:0 "Дурная повадка неизвестного происхождения распространилась по всему виду и сильно бьёт по эффективности."
 wsg_trait_knowledgeable:0 "Смышлёные"
 wsg_trait_knowledgeable_desc:0 "У нас развитые мозги: стремительный научный прогресс мы усваиваем с лёгкостью."
 wsg_trait_Vodka:0 "Водка"
 wsg_trait_Vodka_desc:0 "Со сфокусированной электродуговой водкой в руке галактический трон этой ночью — мой дом."
 wsg_trait_Vodka_2:0 "Двойная водка"
 wsg_trait_Vodka_2_desc:0 "Умирая — пью водку, шучу и смеюсь, и так ещё год."
 wsg_trait_Nelson:0 "Всюду дом"
 wsg_trait_Nelson_desc:0 "Корабельные девы прекрасно приспосабливаются к любой среде — теперь нам открыт каждый мир."
 wsg_trait_flowermaid:0 "Горничная цветов Шропшир"
 wsg_trait_flowermaid_desc:0 "Обожающая цветы Шропшир украсила нашу планету так, что все вокруг безмерно счастливы."
 wsg_trait_Epolicy:0 "Торговая жилка"
 wsg_trait_Epolicy_desc:0 "Мы прирождённые созидатели богатства."
 wsg_trait_Dbed:0 "Двухъярусные кровати"
 wsg_trait_Dbed_desc:0 "Несомненно, двухъярусные кровати в общежитиях резко поднимают вместимость наших боевых корабельных дев. Хотя это и негуманно."
 wsg_trait_Tbed:0 "Трёхъярусные кровати"
 wsg_trait_Tbed_desc:0 "Если двух ярусов мало — добавим ещё один."
 wg_modifier_Tbed:0 "Трёхъярусные кровати"
 wsg_trait_chair:0 "Стулья Эллы"
 wsg_trait_chair_desc:0 "Нам нужно больше места для запасных стульев."
 wsg_trait_125:0 "Массовая постройка"
 wsg_trait_125_desc:0 "К чёрту снайперские формулы — задавим количеством."
 wsg_trait_615:0 "Снайперская постройка"
 wsg_trait_615_desc:0 "Ресурсы должны расходоваться разумно: снайперские формулы резко поднимают шанс выпадения, но формулы придётся долго вычислять."
 wsg_trait_no_pantsu:0 "Без трусиков"
 wsg_trait_no_pantsu_desc:0 "Большинство корабельных дев не носит трусиков — так удобнее проводить ритуалы размножения, но и выпуск трусиков просел."
 wsg_trait_ring:0 "Кольцо"
 wsg_trait_ring_desc:0 "Эта черта ничего не делает, но она провозглашает: все корабельные девы Порта — мои жёны."
 wsg_trait_warshipgirls:0 "Корабельные девы"
 wsg_trait_warshipgirls_desc:0 "§BИсходная черта§!\n\n\n\n£wg_trait_pic_1£\n\n\n\nСталь вместо юбки, железо вместо лент: корабельные девы прекрасны и могучи, и бросают вызов звёздам во всеоружии."
 wsg_trait_warshipgirls_tooltip:0 "$MOD_BONUS_POP_GROWTH_MULT$: §G+20%§!"
 wsg_trait_warshipgirls1:0 "Корабельные девы R"
 wsg_trait_warshipgirls1_desc:0 "§BЧерта первого вознесения§!\n\n\n\n£wg_trait_pic_2£\n\n\n\nНовое поколение ригингов и генная инженерия избавили былых дев от недостатков: теперь они эффективнее и лучше приспособлены."
 wsg_trait_muno:0 "Muon"
 wsg_trait_muno_desc:0 "Muon — топливо повседневной жизни нового поколения корабельных дев. По сравнению с былыми нефтью и снарядами новая энергия куда мощнее."
 wsg_trait_neo:0 "NEO"
 wsg_trait_neo_desc:0 "Вещество NEO сильно ускоряет рождение новых корабельных дев."
 wsg_trait_neo_tooltip:0 "$MOD_BONUS_POP_GROWTH_MULT$: §G+25%§!"
 wsg_trait_np:0 "NP"
 wsg_trait_np_desc:0 "NP — необходимый материал новому поколению корабельных дев для обслуживания и усиления ригингов. По сравнению с былой сталью и алюминием NP эффективнее и занимает меньше места на складе."
 wsg_trait_alpha:0 "Кристалл Альфа"
 wsg_trait_alpha_desc:0 "Завораживающие кристаллы Альфа таят множество неизвестных свойств; их изучение дало нашей науке огромный рывок."
 wsg_trait_mist:0 "Лазурная дева"
 wsg_trait_mist_desc:0 "§EЧерта второго вознесения§!\n\n\n\n£wg_trait_pic_3£\n\n\n\nТехнологии Лазурного мира в сочетании с веществом NEO: долой традиционные нефть, снаряды, сталь и алюминий — теперь всё движется на NP и Muon, а ригинг и тело корабельной девы слились воедино."
 wsg_trait_agrarian:0 "Земледелие"
 wsg_trait_agrarian_desc:0 "Мы испытываем необъяснимую страсть к агрономии и попытаемся что-нибудь посадить везде, где только можно вообразить."
 wsg_trait_ingenious:0 "Мастера выработки"
 wsg_trait_ingenious_desc:0 "Ещё до космической эры мы умели производить энергию с минимумом потерь — эту славную традицию мы сохраняем до сих пор."
 wsg_trait_industrious:0 "Дальняя добыча"
 wsg_trait_industrious_desc:0 "Раньше часть корабельных дев отправляли в дальние экспедиции за редкой рудой — теперь мы возвели эту традицию в абсолют."
 wsg_trait_vulgar:0 "Проще и грубее"
 wsg_trait_vulgar_desc:0 "Культурные произведения, требующие времени и терпения, даются нам слишком тяжело — наш выбор: просто и в лоб."
 wsg_trait_africa_star:0 "Бог войны"
 wsg_trait_africa_star_desc:0 "Под покровительством этого могучего божества мы непобедимы."
 TRAIT_WSG_AFRICA_STAR_EFFECT:0 "§YНажми — и получишь одно очень мощное оружие§!"
 sh_trait_africa_star:0 "$wsg_trait_africa_star$"
 sh_trait_africa_star_desc:0 "$wsg_trait_africa_star_desc$"
 wsg_trait_migrate:0 "Облегчённый ригинг"
 wsg_trait_migrate_desc:0 "Долой громоздкие ригинги старого образца: с новой лёгкой моделью миграция стала плёвым делом."
 wsg_trait_alloys_2:0 "Сплавовая грязь — турбонасадка"
 wsg_trait_alloys_2_desc:0 "Турбонаддувный душ смывает грязь с корабельных дев куда эффективнее — сплавов выходит больше."
 TRAIT_WSG_ALLOYS_EFFECT_2:0 "Каждые 100 корабельных дев производят 0.2 £alloys£ §Y$alloys$§! в месяц."
 wg_modifier_Nelson:0 "$wsg_trait_Nelson$"
 wg_modifier_Dbed:0 "Двухъярусные кровати"
 wg_modifier_knowledgeable:0 "Смышлёные"
 wg_modifier_Epolicy:0 "$wsg_trait_Epolicy$"
 wg_modifier_Vodka:0 "$wsg_trait_Vodka$"
 wg_modifier_125:0 "Массовая постройка"
 wg_modifier_615:0 "Снайперская постройка"
 wg_modifier_alpha:0 "Кристалл Альфа"
 wsg_trait_alloys:0 "Сплавовая грязь"
 wg_modifier_surrender:0 "Слишком много идей"
 wsg_trait_alloys_desc:0 "Грязь, смытая с корабельных дев в бане, легко рафинируется в добротные сплавы."
 TRAIT_WSG_ALLOYS_EFFECT:0 "Каждые 100 корабельных дев производят 0.1 £alloys£ §Y$alloys$§! в месяц."
 wsg_trait_consumer_goods:0 "Конфискация поделок"
 wsg_trait_consumer_goods_desc:0 "По данным разведки, часть корабельных дев втихую вырезает изумительные рукодельные поделки. Теперь мы регулярно конфискуем их все и перепродаём другим девам — потребительских товаров заметно прибавится."
 TRAIT_WSG_GOODS_EFFECT:0 "Каждые 100 корабельных дев производят 0.2 £consumer_goods£ §Y$consumer_goods$§! в месяц."
 trait_intelligent_galo:0 "Умные GALO"
 trait_intelligent_galo_desc:0 "Эти разумные GALO, похоже, появились случайно, в лабораторном инциденте, но они уже продемонстрировали преданность и высокую эффективность. §!§R -Совершенно секретно: они вкусные-§!"
 wsg_modifier_warshipgirls:0 "Протокол ИИ-сборки корабельных дев"
 wg_modifier_buff:0 "Гигантский тюлень"
 leader_trait_warshipgirls:0 "Корабельная дева"
 leader_trait_warshipgirls_desc:0 "$wsg_trait_warshipgirls1_desc$"
 leader_trait_scientist_warshipgirls:0 "Корабельная дева"
 leader_trait_scientist_warshipgirls_desc:0 "Научный ригинг справится с исследованием любого профиля."
 leader_trait_mist:0 "Лазурная дева"
 leader_trait_mist_desc:0 "$wsg_trait_mist_desc$"
 leader_trait_scientist_mist:0 "Лазурная дева"
 leader_trait_scientist_mist_desc:0 "Новый ригинг ещё лучше справляется с исследованиями любого профиля"
 wsg_trait_warshipgirls2:0 "Корабельные девы S"
 wsg_trait_warshipgirls2_desc:0 "§YЧерта второго вознесения§!\n\n\n\n£wg_trait_pic_4£\n\n\n\nПосле безопасной имплантации энергетических ядер Глубинных весь потенциал наших корабельных дев будет освобождён."
 wsg_trait_warshipgirls2_tooltip:0 "$MOD_BONUS_POP_GROWTH_MULT$: §G+30%§!"
 leader_trait_warshipgirls2:0 "Корабельная дева S"
 leader_trait_warshipgirls2_desc:0 "$wsg_trait_warshipgirls2_desc$"
 leader_trait_scientist_warshipgirls2:0 "$wsg_trait_warshipgirls2$"
 leader_trait_scientist_warshipgirls2_desc:0 "Имплантат энергетического ядра Глубинных раскрыл потенциал мозга корабельных дев: слияние с ригингом далеко превзошло всё прежнее. В сочетании с научным ригингом нового поколения наука дев выходит на новый уровень."
 TRAIT_WSG_2_EFFECT:0 "$MOD_POP_ENVIRONMENT_TOLERANCE$: §G+200%§!\n£mod_pop_bonus_workforce_mult£ $MOD_POP_BONUS_WORKFORCE_MULT$: §G+15%§!\n$MOD_BONUS_POP_GROWTH_MULT$: §G+30%§!"
 leader_need_councilor_research:0 "$TRIGGER_FAIL$ §RЭта черта действует только в должности главного учёного§!"
 wsg_trait_mass_assembly:0 "Экстремальная сборка"
 wsg_trait_mass_assembly_desc:0 "Производство ригингов для корабельных дев — ремесло сложнейшее, но с мощью энергетических ядер Глубинных многие былые условия и ограничения перестали быть проблемой."
 TRAIT_WSG_ASSEMBLY_EFFECT:0 "$MOD_BONUS_POP_GROWTH_MULT$: §G+50%§!\nКаждый сборочный завод корабельных дев дополнительно потребляет 5 £sr_se£ §Y$sr_se$§! в месяц"
 wsg_trait_extreme_efficient:0 "Эффективное производство"
 wsg_trait_extreme_efficient_desc:0 "Энергия энергетических ядер Глубинных питает ригинги как никакая прежняя технология — производительность растёт в геометрической прогрессии."
 TRAIT_WSG_EXEFFICIENT_EFFECT:0 "Базовый эффект:\n£mod_pop_bonus_workforce_mult£ $MOD_POP_BONUS_WORKFORCE_MULT$: §G+5%§!\n\nДополнительный эффект от указа $edict_wg_sr_se_trait_enable$:\n£mod_pop_bonus_workforce_mult£ $MOD_POP_BONUS_WORKFORCE_MULT$: §G+30%§!\nКаждые 100 корабельных дев потребляют 0.3 £sr_se£ §Y$sr_se$§! в месяц"
 wsg_trait_galatic_engineer:0 "Галактический трейдер"
 wsg_trait_galatic_engineer_desc:0 "С энергетическими ядрами Глубинных мы вычисляем биржевые тренды со сверхскоростью — и всегда впереди рынка."
 TRAIT_WSG_ENGINEER_EFFECT:0 "Базовый эффект:\n$trader_jobs_bonus_workforce_mult$: §G+10%§!\n\nДополнительный эффект от указа $edict_wg_sr_se_trait_enable$:\n$triggered_pop_group_modifier$: §G+70%§!\nКаждые 100 корабельных дев потребляют 0.2 £sr_se£ §Y$sr_se$§! в месяц"
 wsg_trait_galatic_engineer_buff:0 "$wsg_trait_galatic_engineer$"
 wsg_trait_knowledgeable2:0 "Эрудиция"
 wsg_trait_knowledgeable2_desc:0 "Энергетическое ядро Глубинных держит мозг корабельной девы включённым на все 100% круглосуточно, раскрывая весь его потенциал. Выучить любую дисциплину для неё больше не проблема."
 wg_modifier_knowledgeable2:0 "$wsg_trait_knowledgeable2$"
 TRAIT_WSG_KNOWLEDGEABLE_EFFECT:0 "Базовый эффект:\n£mod_pop_bonus_workforce_mult£ $specialist_and_complex_drone_cat_bonus_workforce_mult$: §G+5%§!\n\nДополнительный эффект от указа $edict_wg_sr_se_trait_enable$:\n£mod_pop_bonus_workforce_mult£ $specialist_and_complex_drone_cat_bonus_workforce_mult$: §G+30%§!\n§H$job_wsg_researcher$§! выработка исследований: §G+2§!\n§H$job_wsg_researcher$§! содержание: §R+1§! £consumer_goods£ §Y$consumer_goods$§!\nСкорость получения опыта лидерами: §G+50%§!\nКаждые 100 корабельных дев потребляют 0.3 £sr_se£ §Y$sr_se$§! в месяц"
 WSGR:0 "Корабельные девы"
 wsg_trait_senergy_producer:0 "Создатели энергетических ядер Глубинных"
 wsg_trait_senergy_producer_desc:0 "Ригинги этих корабельных дев специально кастомизированы, чтобы максимально помогать производству энергетических ядер Глубинных."
 sh_trait_senergy_producer:0 "$wsg_trait_senergy_producer$"
 sh_trait_senergy_producer_desc:0 "Настройка радиационной стойкости биоригингов позволяет нашим глубинным сёстрам куда эффективнее вести опасное производство энергетических ядер."
 sh_trait_senergy_producer2:0 "$wsg_trait_senergy_producer$"
 sh_trait_senergy_producer2_desc:0 "Слив биоригинга со скафандром позволит даже глубинным юнитам в высокорадиоактивной среде отчасти сопротивляться облучению и работать дольше."
 TRAIT_WSG_SENERGY_PRODUCER_EFFECT:0 "Вся выработка £sr_se£ §Y$sr_se$§! с рабочих мест: §G+0.5§!"
 TRAIT_SH_SENERGY_PRODUCER2_EFFECT:0 "Вся выработка £sr_se£ §Y$sr_se$§! с рабочих мест: §G+0.75§!"
 wsg_trait_self_assembly:0 "Самосборка"
 wsg_trait_self_assembly_desc:0 "Даже без профессионального сборочного завода корабельные девы, подпитываемые энергетическим ядром Глубинных, соберут себе ригинг подручным инструментом."
 TRAIT_WSG_SELF_ASSEMBLY_EFFECT:0 "Каждые $pop_group_unit$ £pop£§Yнаселения§! (рабы или выше) производят 0.05 £mod_logistic_growth_mult£§Y$MOD_BONUS_POP_GROWTH$§! в месяц.\n\nЭффект суммируется с другими источниками $MOD_BONUS_POP_GROWTH$, например £building£§Y$building_clone_vats$§! или £job_spawning_drone£§Y$job_spawning_drone_plural$§!\n\nКаждые 100 корабельных дев потребляют 0.2 £sr_se£ §Y$sr_se$§! в месяц"
 wg_modifier_trait_self_assembly:0 "$wsg_trait_self_assembly$"
 wg_modifier_trait_self_desc:0 "$wsg_trait_self_assembly_desc$"
 wsg_trait_pantsu_experts:0 "Владыка тысячи подделок"
 wsg_trait_pantsu_experts_desc:0 "«Психопат! Тебе что, трусики ВСЕХ девочек нужны?!» — транспортный корабль, пожелавший остаться неназванным."
 wsg_trait_advance_producer:0 "Тюленье производство"
 wsg_trait_advance_producer_desc:0 "Обрабатывая горы тюленей, мы выяснили: стоит представить объект производства тюленем — и в сердце доброй девы просыпается потенциал разделки тюленя, резко поднимая эффективность. Минус метода: работает лишь на простейшем производстве — еда, минералы, энергия и тому подобное."
 leader_trait_admiral_Rodney:0 "Командующая флотом Родни"
 leader_trait_admiral_Rodney_desc:0 "§BОбразцовая корабельная дева§!\n\n\n\n£wg_trait_pic_Rodney£\n\n\n\nКомандующая Родни понимает в эффективном распределении ресурсов флота и точности корабельной артиллерии больше любого человека."
 leader_trait_admiral_Rodney2:0 "Письмо Нельсона"
 leader_trait_admiral_Rodney2_desc:0 "Бумажное письмо от Нельсона. Родни бережно хранит его и черпает в нём силы для движения вперёд."
 Ella:0 "Элла"
 CHAIRMAN:0 "Народ Сломанных Стульев"
 leader_trait_official_Ella:0 "Потомок народа Сломанных Стульев"
 leader_trait_official_Ella_desc:0 "Когда Паньгу отделил небо от земли, он нашёл стул, чтобы присесть и отдохнуть, — и сломал его! Тот стул успел обзавестись духом раньше основания государства — так и возник могучий народ Сломанных Стульев."
 AXEMAN:0 "Любительница вишнёвых деревьев"
 leader_trait_general_washington_axe:0 "Сакурная боевая секира"
 leader_trait_general_washington_axe_desc:0 "§BОбразцовая корабельная дева§!\n\n\n\n£wg_trait_pic_washington£\n\n\n\nБлижнее оружие Вашингтон: этой секирой она в одиночку одолела титана GALO — и победила."
 CAPITALISMMAN:0 "Капиталистка"
 leader_trait_official_santee:0 "Фонарный столб"
 leader_trait_official_santee_desc:0 "§BКорабельная дева-капиталистка§!\n\n\n\n£wg_trait_pic_santee£\n\n\n\nВ каждом секторе, куда Санти прибывает губернатором, она демонтирует все фонарные столбы до единого."
 leader_trait_official_badseals:0 "Трудолюбивый тюлень"
 leader_trait_official_badseals_desc:0 "Сегодняшняя работа — … отдохнуть!"
 leader_trait_official_badseals_righteous:0 "Готэмский проектировщик"
 leader_trait_official_badseals_righteous_desc:0 "Наш тюлень-товарищ придерживается особых взглядов на то, как сделать нравы планеты столь же простыми, как в Готэме."
 leader_trait_admiral_wsg_cannoneer:0 "Дальний канонир"
 leader_trait_admiral_wsg_cannoneer_desc:0 "Эта командующая открывает огонь на сверхдальних дистанциях: дальность флота резко выросла, но и общий процент попаданий просел."
 leader_trait_admiral_wsg_sniper:0 "Снайпер"
 leader_trait_admiral_wsg_sniper_desc:0 "Эта командующая мастерски бьёт по целям на большой дистанции, но для наведения ей нужно больше времени."
 leader_trait_admiral_wsg_overspeed:0 "Превышение скорости"
 leader_trait_admiral_wsg_overspeed_desc:0 "Для этой командующей главное — скорость флота. Иногда флот не успевает затормозить и с разгона влетает в снаряд — зрелище то ещё."
 leader_trait_admiral_wsg_careful:0 "Осторожность"
 leader_trait_admiral_wsg_careful_desc:0 "Эта командующая знает каждый корабль своего флота назубок и выведет его из боя даже в самом плачевном состоянии. Она заранее разведывает маршрут, но из-за чрезмерной разведки общий ход флота замедляется."
 leader_trait_scientist_wsg_curiosity:0 "Любопытство"
 leader_trait_scientist_wsg_curiosity_desc:0 "Этот лидер сгорает от любопытства к любой аномалии — ни одна не ускользнёт от её взгляда. Обратная сторона: уйма времени уходит на их поиски."
 leader_trait_scientist_wsg_ovo:0 "Мистическая наука"
 leader_trait_scientist_wsg_ovo_desc:0 "Перед сложной проблемой эта учёная применяет технику «а мне кажыца» — и, как ни странно, это работает. Вот только извлечь урок из успеха или провала она не в состоянии."
 leader_trait_scientist_wsg_shipyard:0 "Простейший док-модуль"
 leader_trait_scientist_wsg_shipyard_desc:0 "Этот губернатор оснастил каждую звёздную базу простейшими док-модулями. До профессиональных доков они не дотягивают, а стоимость слегка растёт."
 leader_trait_scientist_wsg_intelligent:0 "Приоритет — науке"
 leader_trait_scientist_wsg_intelligent_desc:0 "Этот губернатор придаёт науке особое значение и готов вложить в исследования своего сектора дополнительные средства."
 leader_trait_scientist_wsg_experienced:0 "Бывалая"
 leader_trait_scientist_wsg_experienced_desc:0 "Этот генерал — живая легенда армии: её войска непобедимы и неудержимы."
 leader_trait_ruler_lexington:0 "Вечно семнадцать"
 leader_trait_ruler_lexington_desc:0 "Этот лидер навеки останется в момент своего семнадцатилетия"
 leader_trait_ruler_lexington2:0 "Избранница богов"
 leader_trait_ruler_lexington2_desc:0 "Какая же муда-сила!"
 wsg_trait_ocean:0 "Дочь моря"
 wsg_trait_ocean_desc:0 "Корабельные девы родом с океанического мира: для морских работ был создан специализированный ригинг под океанические миры."
 wsg_trait_ocean_tooltip:0 "Использование жилья на §Yокеанических§! мирах: §G-5%§!\n£mod_pop_bonus_workforce_mult£ $MOD_POP_BONUS_WORKFORCE_MULT$ на §Yокеанических§! мирах: §G+5%§!\n$mod_planet_pops_consumer_goods_upkeep_mult$ на §Yокеанических§! мирах: §G-10%§!\n£mod_pop_bonus_workforce_mult£ $MOD_POP_BONUS_WORKFORCE_MULT$ на §Yглубинных§! планетах: §G+10%§!\n£mod_pop_bonus_workforce_mult£ $MOD_POP_BONUS_WORKFORCE_MULT$ на §Yгорячих источниках§! и §Yмирах-кольцах горячих источников§!: §G+10%§!\n$mod_planet_pops_consumer_goods_upkeep_mult$ на §Yгорячих источниках§! и §Yмирах-кольцах горячих источников§!: §G-10%§!\n£mod_pop_bonus_workforce_mult£ $MOD_POP_BONUS_WORKFORCE_MULT$ на §Y$pc_wsg_port$§! и §Y$pc_ringworld_habitable_wsg$§!: §G+2%§!"
 sh_trait_shenhai:0 "Флот Глубинных"
 sh_trait_shenhai_desc:0 "§PИсходная черта§!\n\n\n\n£sh_trait_pic_1£\n\n\n\nЧлены флота Глубинных держат верность промывкой мозгов и живут в железной иерархии. Они бесстрашны и готовы отдать флоту всё — но собственной воли у них нет."
 sh_trait_shenhai1:0 "Флот Глубинных"
 sh_trait_shenhai1_desc:0 "§PЧерта первого вознесения§!\n\n\n\n£sh_trait_pic_2£\n\n\n\nМодернизированные глубинные корабельные девы куда адаптивнее; вопрос о собственной воле пока вынесен на дальнейшее обсуждение."
 sh_trait_shenhai2:0 "Молчаливые Глубинные"
 sh_trait_shenhai2_desc:0 "§YЧерта второго вознесения§!\n\n\n\n£sh_trait_pic_3£\n\n\n\nОтбросив лишние чувства, мы станем сильнее прежнего."
 sh_trait_shenhai3:0 "Вскрывшие лёд"
 sh_trait_shenhai3_desc:0 "§YЧерта второго вознесения§!\n\n\n\n£sh_trait_pic_4£\n\n\n\nТеперь мы вновь приняли чувства — это новая глава истории."
 sh_trait_ocean:0 "Из глубин"
 sh_trait_ocean_desc:0 "Тёмная и глухая глубина океана ничуть не страшит глубинных корабельных дев: они используют морское дно на полную, расчищая себе пространство для развития."
 sh_trait_ocean_tooltip:0 "Использование жилья на §Yокеанических§! мирах: §G-5%§!\nВыработка еды, энергокредитов и минералов на §Yокеанических§! мирах: §G+10%§!\n£mod_pop_bonus_workforce_mult£ $MOD_POP_BONUS_WORKFORCE_MULT$ на §Yглубинных§! планетах: §G+10%§!\n£mod_pop_bonus_workforce_mult£ $MOD_POP_BONUS_WORKFORCE_MULT$ на §Yгорячих источниках§! и §Yмирах-кольцах горячих источников§!: §G+10%§!\n£mod_pop_bonus_workforce_mult£ $MOD_POP_BONUS_WORKFORCE_MULT$ на §Y$pc_wsg_port$§! и §Y$pc_ringworld_habitable_wsg$§!: §G+2%§!"
 sh_trait_building:0 "Эффективная стройка"
 sh_trait_building_desc:0 "В обществе Глубинных всё делается быстро и чётко."
 sh_trait_building_tooltip:0 "$MOD_BONUS_POP_GROWTH_MULT$: §G+15%§!"
 sh_trait_gear:0 "Все — шестерёнки"
 sh_trait_gear_desc:0 "Каждая глубинная корабельная дева — шестерёнка единого механизма флота Глубинных."
 sh_trait_gear_2:0 "Все — шестерёнки II"
 sh_trait_gear_2_desc:0 "Каждой глубинной корабельной деве находят подходящее место — чтобы механизм флота Глубинных работал на максимуме."
 sh_trait_simple:0 "Простая жизнь"
 sh_trait_simple_desc:0 "В обществе Глубинных расточительство — тягчайший грех."
 sh_trait_boxes:0 "Коробочное жильё"
 sh_trait_boxes_desc:0 "Рядовые юниты Глубинных живут в тесных коробках с залитой внутрь ремонтной жидкостью Глубинных — она смягчает вред от тесноты. Так мы экономим уйму места под вещи поважнее."
 sh_trait_eye:0 "Высокая адаптация"
 sh_trait_eye_desc:0 "Глубинные корабельные девы быстро привыкают к любой экстремальной среде."
 sh_trait_repair:0 "Ремонтная жидкость Глубинных"
 sh_trait_repair_desc:0 "Никому не дано усомниться в свойствах ремонтной жидкости Глубинных."
 sh_trait_untrusted:0 "Питательная поддержка"
 sh_trait_untrusted_desc:0 "Юнитам Глубинных нужно больше питания для повседневных нужд."
 sh_trait_unattractive:0 "Дефект кода"
 sh_trait_unattractive_desc:0 "В перепрошивке мозгов юнитов Глубинных есть изъян: иногда случается сбой, и производительность падает."
 sh_trait_upkeep:0 "Частое обслуживание"
 sh_trait_upkeep_desc:0 "Чтобы юниты Глубинных были в норме, нам приходится часто промывать им мозги — содержание населения дорожает."
 sh_trait_migrate:0 "Тяжёлый ригинг"
 sh_trait_migrate_desc:0 "Ряд ригингов заточен под бой, а не под дальнюю миграцию — за перевозку таких дев приходится доплачивать."
 sh_trait_fleet:0 "Послушание"
 sh_trait_fleet_desc:0 "Высокая покорность глубинных корабельных дев — основа эффективной работы общества Глубинных."
 sh_trait_fleet_2:0 "Послушание II"
 sh_trait_fleet_2_desc:0 "Дальнейший рост покорности ещё больше упрощает управление юнитами Глубинных."
 sh_trait_together:0 "Единство"
 sh_trait_together_desc:0 "Граждане Глубинных сплочены и бьют в одну точку."
 sh_trait_fool40k:0 "Фанатизм ближнего боя"
 sh_trait_fool40k_desc:0 "Мы вполне способны уничтожить врага за горизонтом, но наши солдаты всё равно рвутся врубаться цепными мечами. Бессмысленные потери колоссальны."
 sh_trait_building2:0 "Молниеносная сборка"
 sh_trait_building2_desc:0 "Невероятной скоростью сборки мы докажем своё превосходство."
 sh_trait_building2_tooltip:0 "$MOD_BONUS_POP_GROWTH_MULT$: §G+15%§!"
 sh_trait_building2E:0 "[Энергетическое ядро Глубинных] Молниеносная сборка"
 sh_trait_building2E_desc:0 "Сборка населения идёт ещё быстрее, но сборочные заводы потребляют дополнительные энергетические ядра Глубинных."
 sh_trait_gear2:0 "Экстремальное общество"
 sh_trait_gear2_desc:0 "Генетический скрининг и питание от энергетических ядер Глубинных: каждому члену общества — идеальное место."
 sh_trait_gear2E:0 "[Энергетическое ядро Глубинных] Экстремальное общество"
 sh_trait_gear2E_desc:0 "Генетический скрининг и имплантация энергетических ядер Глубинных: каждому члену общества — идеальное место."
 sh_trait_engm:0 "Продвинутые лидеры"
 sh_trait_engm_desc:0 "Отбросив суетные мысли, наши лидеры растут в эффективности."
 sh_trait_building22:0 "Молниеносная сборка"
 sh_trait_building22_desc:0 "Невероятной скоростью сборки мы докажем своё превосходство."
 sh_trait_building22_tooltip:0 "$MOD_BONUS_POP_GROWTH_MULT$: §G+10%§!"
 sh_trait_building22E:0 "[Энергетическое ядро Глубинных] Молниеносная сборка"
 sh_trait_building22E_desc:0 "Сборка населения идёт ещё быстрее, но сборочные заводы потребляют дополнительные энергетические ядра Глубинных."
 TRAIT_SH_BUILDING_EFFECT:0 "$MOD_BONUS_POP_GROWTH_MULT$: §G+40%§!\nСодержание сборочных заводов Глубинных £sr_se£§Y$sr_se$§!+5"
