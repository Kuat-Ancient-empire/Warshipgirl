 leader_trait_scientist_warshipgirls_materialist:0 "Фанатичный материализм"
 leader_trait_scientist_warshipgirls_materialist_desc:0 "Бесконечные открытия и исследования — дело жизни учёных-экстремальных материалистов."
 leader_trait_scientist_shenhai_materialist:0 "Фанатичный материализм"
 leader_trait_scientist_shenhai_materialist_desc:0 "Бесконечные открытия и исследования — дело жизни учёных-экстремальных материалистов."
 tech_wsg_fw_trait:0 "Ригинг-протезы"
 tech_wsg_fw_trait_desc:0 "Ригинг — и есть протезы корабельных дев!"
 tech_wsg_fw_trait_edicts:0 "§HОткрыты черты корабельных дев: §! ригинг-протезы"
 TRAIT_WSG_FW_PRODUCER_EFFECT:0 "£mod_pop_bonus_workforce_mult£ $MOD_POP_BONUS_WORKFORCE_MULT$: §G+10%§!\nСодержание $r_energy$ повышается на §R+0.5§!"
 wsg_trait_fw_producer:0 "Сенсорный процессор ригинга"
 wsg_trait_fw_producer_desc:0 "Сенсорный процессор ригинга напрямую связывается с мыслями корабельной девы и управляет снаряжением эффективнее."
 TRAIT_WSG_FW_MULTIFUNCTIONAL_EFFECT:0 "$mod_planet_jobs_minerals_produces_mult$: §G+5%§!\n$mod_planet_jobs_energy_produces_mult$: §G+5%§!\n$mod_planet_jobs_food_produces_mult$: §G+5%§!\nСодержание $r_energy$ повышается на §R+0.3§!"
 wsg_trait_fw_multifunctional:0 "Многофункциональный манипулятор"
 wsg_trait_fw_multifunctional_desc:0 "Манипулятор с кучей функций помогает корабельным девам эффективнее справляться с простой работой."
 wsg_trait_fw_cannon:0 "Возвращение орудий"
 wsg_trait_fw_cannon_desc:0 "Могучие корабельные орудия возвращаются в ригинг каждой корабельной девы. Дополнительных ресурсов не нужно — девы просто возвращаются к своей сути."
 TRAIT_WSG_FW_FACTORY_EFFECT:0 "$mod_planet_jobs_alloys_produces_mult$: §G+10%§!\n$mod_planet_jobs_consumer_goods_produces_mult$: §G+10%§!\nСодержание $r_energy$ повышается на §R+0.3§!"
 wsg_trait_fw_factory:0 "Передвижная фабрика"
 wsg_trait_fw_factory_desc:0 "В ригинг встроен промышленный вспомогательный комплекс, эффективно помогающий производству."
 TRAIT_WSG_FW_BODY_EFFECT:0 "$MOD_POP_AMENITIES_USAGE_MULT$: §G-15%§!\n$MOD_POP_HAPPINESS$: §G+30%§!\nСодержание $r_energy$ повышается на §R+0.2§!"
 wsg_trait_fw_body:0 "Биомиметические протезы"
 wsg_trait_fw_body_desc:0 "Изъяны тела исправляются кастомными биомиметическими протезами — например, биомиметической грудью, заметно улучшающей образ корабельной девы.\n§RПродукт действует на подавляющее большинство дев, кроме одной белоснежной§!"
 tech_wsg_gm_trait:0 "Эволюция плоти"
 tech_wsg_gm_trait_desc:0 "Даже без всяких усилителей тело корабельной девы сильнее человеческого — эта технология расширяет разрыв."
 tech_wsg_gm_trait_edicts:0 "§HОткрыты черты корабельных дев: §! генное усиление"
 wsg_trait_gm_producer:0 "Полная модернизация"
 wsg_trait_gm_producer_desc:0 "От рождения до взросления каждая корабельная дева проходит 19 генно-инженерных операций ради полного усиления.\n§HЭтап 1 — Второе сердце\nЭтап 2 — Кости из живого металла\nЭтап 3 — Мышечный усилитель\nЭтап 4 — Усиленное кроветворение\nЭтап 5 — Орган Деламейна\nЭтап 6 — Нейрорегулятор\nЭтап 7 — Стальной желудок\nЭтап 8 — Гене-следящие нервы\nЭтап 9 — Мультиорганы: почки-печень-лёгкие\nЭтап 10 — Зрительные нервы\nЭтап 11 — Чуткий слух\nЭтап 12 — Мозговая оболочка Am-oungus\nЭтап 13 — Контроллер пигмента\nЭтап 14 — Детоксикационный орган\nЭтап 15 — Нерв контроля вкуса\nЭтап 16 — Орган потовых желёз\nЭтап 17 — Кислотная слюна\nЭтап 18 — Генное хранилище\nЭтап 19 — Интерфейс ригинга"
 wsg_trait_gm_producer2:0 "Примарис-корабельные девы"
 wsg_trait_gm_producer2_desc:0 "От рождения до взросления каждая корабельная дева проходит 22 генно-инженерные операции ради полного усиления.\n§HЭтап 1 — Второе сердце\nЭтап 2 — Кости из живого металла\nЭтап 3 — Мышечный усилитель\nЭтап 4 — Усиленное кроветворение\nЭтап 5 — Орган Деламейна\nЭтап 6 — Нейрорегулятор\nЭтап 7 — Стальной желудок\nЭтап 8 — Гене-следящие нервы\nЭтап 9 — Мультиорганы: почки-печень-лёгкие\nЭтап 10 — Зрительные нервы\nЭтап 11 — Чуткий слух\nЭтап 12 — Мозговая оболочка Am-oungus\nЭтап 13 — Контроллер пигмента\nЭтап 14 — Детоксикационный орган\nЭтап 15 — Нерв контроля вкуса\nЭтап 16 — Орган потовых желёз\nЭтап 17 — Кислотная слюна\nЭтап 18 — Генное хранилище\nЭтап 19 — Интерфейс ригинга\nЭтап 20 — Стальные рёбра\nЭтап 21 — Гимн доброты\nЭтап 22 — Регенератор§!"
 wsg_trait_gm_growth:0 "Быстрый рост"
 wsg_trait_gm_growth_desc:0 "Генная модификация радикально сократила период взросления корабельных дев."
 wsg_trait_gm_skin:0 "Пуленепробиваемая кожа"
 wsg_trait_gm_skin_desc:0 "Кожа корабельных дев держит удар лёгких орудий (до 406-мм снаряда включительно) — одного этого хватает, чтобы враг ужаснулся."
 wsg_trait_gm_not_delicious:0 "Невкусные"
 wsg_trait_gm_not_delicious_desc:0 "Кожу корабельных дев не прожевать, а на вкус — дизельное топливо: в пищу они решительно непригодны."
 tech_sh_fw_trait:0 "Ригинг-протезы"
 tech_sh_fw_trait_desc:0 "Способность носить могучий ригинг — то, чем глубинные корабельные девы превосходят прочие виды."
 tech_sh_fw_trait_edicts:0 "§HОткрыты черты глубинных корабельных дев: §! ригинг-протезы"
 sh_trait_fw_producer:0 "Продвинутый ЦП"
 sh_trait_fw_producer_desc:0 "Этот высокопроизводительный процессор связывается с сознанием глубинной корабельной девы и управляет снаряжением эффективнее."
 sh_trait_fw_engineering:0 "Инженерный манипулятор"
 sh_trait_fw_engineering_desc:0 "Специализированное инженерное устройство заметно усиливает исследования глубинных дев в инженерии."
 TRAIT_SH_FW_ENGINEERING_EFFECT:0 "$mod_planet_jobs_engineering_research_produces_mult$: §G+30%§!\nСодержание $r_energy$ повышается на §R+0.3§!"
 sh_trait_fw_Ebrain:0 "Электронный мозг"
 sh_trait_fw_Ebrain_desc:0 "Встроенный в мозг микроквантовый компьютер заметно усиливает способность глубинных дев к обучению."
 TRAIT_SH_FW_EBRAIN_EFFECT:0 "$MOD_LEADER_SPECIES_EXP_GAIN$: §G+25%§!\nСодержание $r_energy$ повышается на §R+0.3§!"
 sh_trait_fw_warmachine:0 "Машина войны"
 sh_trait_fw_warmachine_desc:0 "Дальнейшее усиление оружейных систем ригинга поднимает боеспособность глубинных дев."
 TRAIT_SH_FW_WARMACHINE_EFFECT:0 "$MOD_ARMY_HEALTH$: §G+35%§!\n$MOD_ARMY_DAMAGE_MULT$: §G+35%§!\nСодержание $r_energy$ повышается на §R+0.2§!"
 tech_sh_gm_trait:0 "Эволюция плоти"
 tech_sh_gm_trait_desc:0 "Дальнейшее усиление тел глубинных дев необходимо для сохранения преимущества флота Глубинных."
 tech_sh_gm_trait_edicts:0 "§HОткрыты черты глубинных корабельных дев: §! генное усиление"
 sh_trait_gm_producer:0 "Идеальный план"
 sh_trait_gm_producer_desc:0 "Каждый параметр глубинных дев доводится до предела — конечная цель: идеальный организм…"
 sh_trait_gm_producer2:0 "Примарис-Глубинные"
 sh_trait_gm_producer2_desc:0 "От рождения до взросления каждая глубинная дева проходит 22 генно-инженерные операции ради полного усиления.\n§HЭтап 1 — Второе сердце\nЭтап 2 — Кости из живого металла\nЭтап 3 — Мышечный усилитель\nЭтап 4 — Усиленное кроветворение\nЭтап 5 — Орган Деламейна\nЭтап 6 — Нейрорегулятор\nЭтап 7 — Стальной желудок\nЭтап 8 — Гене-следящие нервы\nЭтап 9 — Мультиорганы: почки-печень-лёгкие\nЭтап 10 — Зрительные нервы\nЭтап 11 — Чуткий слух\nЭтап 12 — Мозговая оболочка Am-oungus\nЭтап 13 — Контроллер пигмента\nЭтап 14 — Детоксикационный орган\nЭтап 15 — Нерв контроля вкуса\nЭтап 16 — Орган потовых желёз\nЭтап 17 — Кислотная слюна\nЭтап 18 — Генное хранилище\nЭтап 19 — Интерфейс ригинга\nЭтап 20 — Стальные рёбра\nЭтап 21 — Гимн доброты\nЭтап 22 — Регенератор§!"
 sh_trait_gm_assembly:0 "Рециркуляция геносемени"
 sh_trait_gm_assembly_desc:0 "От павших по тем или иным причинам глубинных дев достаточно вовремя изъять геносемя — и новую можно собрать быстро. В каком-то смысле это ускоряет производство населения."
 sh_trait_gm_dormancy:0 "Само-анабиоз"
 sh_trait_gm_dormancy_desc:0 "Свободные юниты Глубинных впадают в длительный малозатратный сон — так экономятся расходы на управление."
 sh_trait_gm_pantsu:0 "Производитель трусиков"
 sh_trait_gm_pantsu_desc:0 "Непостижимая генная модификация позволяет глубинным девам производить трусики быстрее."
 sh_trait_gm_obey:0 "Модификация послушания"
 sh_trait_gm_obey_desc:0 "Нейромодификация помогает юнитам Глубинных исполнять любые приказы — общая стабильность растёт."
 leader_trait_wsg_fleet_guardian:0 "Хранительница флота"
 leader_trait_wsg_fleet_guardian_desc:0 "Этот лидер ставит сохранность флота превыше всего и старается вернуть домой всех."
 leader_trait_wsg_fleet_guardian_sep:0 "Хранительница флота"
 leader_trait_wsg_fleet_guardian_sep_desc:0 "Благодаря энергетическим ядрам Глубинных этот лидер ещё лучше следит за состоянием флота в реальном времени, обеспечивая его безопасность."
 leader_trait_wsg_mega_fleet:0 "Адептка большого флота"
 leader_trait_wsg_mega_fleet_desc:0 "Этот лидер — мастер командования: она виртуозно разворачивает огромные флоты, демонстрируя выдающееся лидерство."
 leader_trait_wsg_mega_fleet_sep:0 "Адептка большого флота"
 leader_trait_wsg_mega_fleet_sep_desc:0 "Этот лидер — мастер командования: она виртуозно разворачивает огромные флоты, демонстрируя выдающееся лидерство."
 leader_trait_wsg_heavy_weapon:0 "Любительница тяжёлых орудий"
 leader_trait_wsg_heavy_weapon_desc:0 "Этот лидер охотнее всего пользуется крупной корабельной артиллерией, игнорируя прочие типы вооружения."
 leader_trait_wsg_heavy_weapon_sep:0 "Любительница тяжёлых орудий"
 leader_trait_wsg_heavy_weapon_sep_desc:0 "Этот лидер охотнее всего пользуется крупной корабельной артиллерией, игнорируя прочие типы вооружения."
 leader_trait_wsg_penetration:0 "Специалист по пробитию"
 leader_trait_wsg_penetration_desc:0 "Этот лидер знает толк в пробивающем вооружении и умеет занять идеальную позицию для залпа."
 leader_trait_wsg_penetration_sep:0 "Специалист по пробитию"
 leader_trait_wsg_penetration_sep_desc:0 "Этот лидер знает толк в пробивающем вооружении и умеет занять идеальную позицию для залпа."
 leader_trait_wsg_dancing_with_death:0 "Танцующая со смертью"
 leader_trait_wsg_dancing_with_death_desc:0 "Этот лидер — безумный боец, готовая уничтожить противника любой ценой."
 leader_trait_wsg_dancing_with_death_sep:0 "Танцующая со смертью"
 leader_trait_wsg_dancing_with_death_sep_desc:0 "Этот лидер — безумный боец, готовая уничтожить противника любой ценой."
 leader_trait_wsg_naval_recruiters:0 "Военно-морская вербовщица"
 leader_trait_wsg_naval_recruiters_desc:0 "Этот лидер — обаятельный морской офицер: многие поступают на флот под её влиянием и берут её в пример."
 leader_trait_wsg_naval_recruiters_sep:0 "Военно-морская вербовщица"
 leader_trait_wsg_naval_recruiters_sep_desc:0 "Этот лидер — обаятельный морской офицер: многие поступают на флот под её влиянием и берут её в пример."
 leader_trait_sh_extreme_shooter:0 "Экстремальный стрелок"
 leader_trait_sh_extreme_shooter_desc:0 "Этот лидер стремится к уничтожению на сверхдальних дистанциях и готов тратить лишнее время на дальние точные удары."
 leader_trait_sh_jump_tactics:0 "Прыжковая тактика"
 leader_trait_sh_jump_tactics_desc:0 "Этот лидер привык к стремительным манёврам на прыжковых двигателях."
 leader_trait_sh_weapon_master:0 "Эксперт корабельного вооружения"
 leader_trait_sh_weapon_master_desc:0 "Этот выдающийся лидер владеет множеством корабельных систем вооружения и легко справляется с любой сложностью."
 leader_trait_sh_penetration:0 "Специалист по пробитию"
 leader_trait_sh_penetration_desc:0 "Этот лидер знает толк в пробивающем вооружении и умеет занять идеальную позицию для залпа."
 leader_trait_sh_assassins:0 "Ассасин"
 leader_trait_sh_assassins_desc:0 "Флот этого лидера мастерски скрывается и бьёт быстро, виртуозно владея малым и средним вооружением. Её флот носится по полю боя, как ассасин."
 leader_trait_sh_fleet_resident:0 "Жительница флота"
 leader_trait_sh_fleet_resident_desc:0 "Этот лидер провёл на кораблях почти всю жизнь: флот для неё — дом, и она знает в нём каждый угол."
 leader_trait_sh_naval_builder:0 "Военно-морской конструктор"
 leader_trait_sh_naval_builder_desc:0 "Этот лидер не жалеет сил на строительство флота."
 leader_trait_wsg_mass_construction:0 "Мастер Святой Стройки"
 leader_trait_wsg_mass_construction_desc:0 "В каждый Святой День Стройки этот лидер молниеносно собирает полный флот-гегемонию."
 leader_trait_wsg_mass_construction_sep:0 "Мастер Святой Стройки"
 leader_trait_wsg_mass_construction_sep_desc:0 "В каждый Святой День Стройки этот лидер молниеносно собирает полный флот-гегемонию."
 leader_trait_wsg_harbor_designer:0 "Проектировщица Порта"
 leader_trait_wsg_harbor_designer_desc:0 "Этот лидер знает, как эффективно планировать и застраивать планеты: пустырь в её руках мгновенно превращается в город-миллионник."
 leader_trait_wsg_harbor_designer_sep:0 "Проектировщица Порта"
 leader_trait_wsg_harbor_designer_sep_desc:0 "Этот лидер знает, как эффективно планировать и застраивать планеты: пустырь в её руках мгновенно превращается в город-миллионник."
 leader_trait_wsg_operations_manager:0 "Мастер оптимизации"
 leader_trait_wsg_operations_manager_desc:0 "Пройдя «Цивилизацию 1453», «Скайлайн идеального города» и другие игры, этот лидер стал оптимизатором первой руки."
 leader_trait_wsg_operations_manager_sep:0 "Мастер оптимизации"
 leader_trait_wsg_operations_manager_sep_desc:0 "В эпоху тайлов Stellaris этот лидер управляет без единой лишней мышки: на каждое здание — идеальные жители, в партии — минимум 30 шаблонов населения. Держать её на одной планете — стрелять из пушки по воробьям."
 leader_trait_wsg_resource_producer:0 "Производитель ресурсов Лазури"
 leader_trait_wsg_resource_producer_desc:0 "Этот лидер прекрасно понимает, как важны для нашей цивилизации редкие ресурсы из Лазурного мира."
 leader_trait_wsg_resource_producer_sep:0 "Производитель энергетических ядер Глубинных"
 leader_trait_wsg_resource_producer_sep_desc:0 "Этот лидер прекрасно понимает: применение энергетических ядер Глубинных — главный мотор развития нашей цивилизации."
 leader_trait_wsg_megastructure:0 "Инженер мегаструктур"
 leader_trait_wsg_megastructure_desc:0 "Этот лидер — опытнейший инженер мегаструктур и знает, как оптимизировать процессы ради строительства этих галактических чудес."
 leader_trait_wsg_megastructure_sep:0 "Инженер мегаструктур"
 leader_trait_wsg_megastructure_sep_desc:0 "Этот лидер — опытнейший инженер мегаструктур и знает, как оптимизировать процессы ради строительства этих галактических чудес."
 leader_trait_sh_mass_construction:0 "Авангард Глубинных"
 leader_trait_sh_mass_construction_desc:0 "Как авангард флота Глубинных, этот лидер расчищает ему жизненное пространство."
 leader_trait_sh_shepherd:0 "Пастушка"
 leader_trait_sh_shepherd_desc:0 "Этот лидер умеет обеспечить внутреннюю стабильность и поднять выработку флота."
 leader_trait_sh_megastructure:0 "Инженер мегаструктур"
 leader_trait_sh_megastructure_desc:0 "Этот лидер — опытнейший инженер мегаструктур и знает, как оптимизировать процессы ради строительства этих галактических чудес."
