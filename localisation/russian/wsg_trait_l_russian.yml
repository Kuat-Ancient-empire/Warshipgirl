 sh_modifier_engm2:0 "$sh_trait_engm2$"
 sh_modifier_book:0 "Великий план Глубинных"
 leader_trait_shenhai:0 "Флот Глубинных"
 leader_trait_shenhai_desc:0 "Новые ригинги вдохнули в государство новую жизнь"
 leader_trait_shenhai1:0 "Молчаливые Глубинные"
 leader_trait_shenhai1_desc:0 "Отбросив лишние чувства — и никакой враг не страшен."
 leader_trait_shenhai2:0 "Вскрывшие лёд"
 leader_trait_shenhai2_desc:0 "Теперь мы вновь приняли чувства — это новая глава истории."
 leader_trait_scientist_shenhai:0 "Флот Глубинных"
 leader_trait_scientist_shenhai_desc:0 "Научный ригинг справится с исследованием любого профиля."
 leader_trait_scientist_shenhai1:0 "Молчаливые Глубинные"
 leader_trait_scientist_shenhai1_desc:0 "Теперь нас не связывает никакая мораль."
 leader_trait_scientist_shenhai2:0 "Флот Глубинных"
 leader_trait_scientist_shenhai2_desc:0 "Обретя свободную волю, учёные находят новые точки прорыва и ускоряют науку."
 leader_trait_official_yamatoman:0 "Ямато-человек"
 leader_trait_official_yamatoman_desc:0 "§YОбразцовая Глубинная§!\n\n\n\n£sh_trait_pic_yamato£\n\n\n\nЯмато XXIII свято блюдет семейную традицию — служение людям."
 leader_trait_official_neversleep:0 "Не спящая"
 leader_trait_official_neversleep_desc:0 "Никто не знает, как Ямато XXIII живёт без сна. Ходят слухи, что она — могущественный псионик."
 leader_trait_admiral_sh_weapon_master:0 "Мастер вооружения"
 leader_trait_admiral_sh_weapon_master_desc:0 "У этой командующей есть особый способ повысить пробитие щитов и брони — ценой повышенного содержания."
 leader_trait_admiral_sh_sniper:0 "Снайпер"
 leader_trait_admiral_sh_sniper_desc:0 "Эта командующая мастерски бьёт по целям на большой дистанции, но для наведения ей нужно больше времени."
 leader_trait_admiral_sh_armor:0 "Тяжёлая кавалерия"
 leader_trait_admiral_sh_armor_desc:0 "Эта командующая считает щиты менее надёжными, чем осязаемые корпус и броня."
 leader_trait_scientist_sh_ignore:0 "Опущение деталей"
 leader_trait_scientist_sh_ignore_desc:0 "Чтобы поскорее обследовать систему, этот лидер пропускает детали — и порой упускает возможности."
 leader_trait_scientist_sh_selfless:0 "Самоотверженность"
 leader_trait_scientist_sh_selfless_desc:0 "Высшим членам общества Глубинных положена высокая автономия, но этот лидер всё равно выбрал самоотверженность и отказался от лишнего обслуживания ради экономии.\n§YВ должности главного учёного даёт +10% к скорости исследований§!"
 TRAIT_WSG_FW_PRODUCER_EFFECT:0 "£mod_pop_bonus_workforce_mult£ $MOD_POP_BONUS_WORKFORCE_MULT$: §G+10%§!\nСодержание $r_energy$ повышается на §R+0.5§!"
 leader_trait_scientist_sh_defender:0 "Защитница"
 leader_trait_scientist_sh_defender_desc:0 "Этот губернатор силён в обороне и эффективно усиливает защитные сооружения звёздных баз своего сектора."
 leader_trait_scientist_sh_nursing:0 "Эффективный уход"
 leader_trait_scientist_sh_nursing_desc:0 "Этот губернатор применяет более рациональное управление для роста удобств — ценой увеличенного содержания."
 leader_trait_scientist_sh_experienced:0 "Бывалая"
 leader_trait_scientist_sh_experienced_desc:0 "Этот генерал — живая легенда армии: её войска непобедимы и неудержимы."
