 TRAIT_SH_GEAR2_EFFECT:0 "Базовый эффект:\n£mod_pop_bonus_workforce_mult£ $MOD_POP_BONUS_WORKFORCE_MULT$: §G+5%§!\n\nДополнительный эффект от указа $edict_wg_sr_se_trait_enable$:\n£mod_pop_bonus_workforce_mult£ $MOD_POP_BONUS_WORKFORCE_MULT$: §G+25%§!\nКаждые 100 глубинных корабельных дев потребляют 0.2 £sr_se£ §Y$sr_se$§! в месяц"
 sh_trait_gear22:0 "Экстремальное общество"
 sh_trait_gear22_desc:0 "Генетический скрининг: каждому члену общества — идеальное место."
 sh_trait_gear22E:0 "[Энергетическое ядро Глубинных] Экстремальное общество"
 sh_trait_gear22E_desc:0 "Генетический скрининг и имплантация энергетических ядер Глубинных: каждому члену общества — идеальное место."
 sh_trait_engm2:0 "Мастер торговли"
 sh_trait_engm2_desc:0 "Даже глубинные корабельные девы с передовыми алгоритмами и технологиями осилят код богатства."
 sh_trait_worker:0 "Первичники"
 sh_trait_worker_desc:0 "Механическая рутина первичного сектора — не проблема для базовых юнитов Глубинных."
 sh_trait_worker_2:0 "Первичники II"
 sh_trait_worker_2_desc:0 "Ещё больше усиливаем производительность базовых юнитов Глубинных."
 sh_trait_talent:0 "Исследовательские субюниты"
 sh_trait_talent_desc:0 "Бóльшая самостоятельность исследовательским юнитам Глубинных заметно усиливает научные проекты."
 sh_trait_pantsu:0 "Трусиковый протокол"
 sh_trait_pantsu_desc:0 "Каждая глубинная корабельная дева обязана производить трусики у себя в жилище."
 TRAIT_SH_PANTSU_EFFECT:0 "Каждые 100 жителей Глубинных производят 0.1 £sr_pantsu£ §Y$sr_pantsu$§! в месяц."
 sh_trait_knowledgeable:0 "[Энергетическое ядро Глубинных] Имплант-наука"
 sh_trait_knowledgeable_desc:0 "Интеллект мозга повышается имплантацией энергетического ядра Глубинных."
 sh_trait_knowledgeable2:0 "[Энергетическое ядро Глубинных] Эрудиция"
 sh_trait_knowledgeable2_desc:0 "Интеллект мозга повышается имплантацией энергетического ядра Глубинных."
 TRAIT_SH_KNOWLEDGEABLE_EFFECT:0 "Базовый эффект:\n£mod_pop_bonus_workforce_mult£ $specialist_and_complex_drone_cat_bonus_workforce_mult$: §G+5%§!\n\nДополнительный эффект от указа $edict_wg_sr_se_trait_enable$:\n£mod_pop_bonus_workforce_mult£ $specialist_and_complex_drone_cat_bonus_workforce_mult$: §G+25%§!\nСкорость получения опыта лидерами: §G+50%§!\nКаждые 100 глубинных корабельных дев потребляют 0.2 £sr_se£ §Y$sr_se$§! в месяц"
