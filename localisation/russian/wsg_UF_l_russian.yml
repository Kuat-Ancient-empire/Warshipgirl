 leader_trait_admiral_united_fleet:0 "Командующий Объединённого флота"
 leader_trait_admiral_united_fleet_desc:0 "Обычный командующий Объединённого флота."
 leader_trait_admiral_united_fleet2:0 "Старший командующий Объединённого флота"
 leader_trait_admiral_united_fleet2_desc:0 "Командующие Объединённого флота рангом выше, с куда более богатым боевым опытом."
 leader_trait_admiral_united_fleet3:0 "Легендарный командующий Объединённого флота"
 leader_trait_admiral_united_fleet3_desc:0 "Уважаемая всеми легендарная военачальница Объединённого флота — число уничтоженных ею цивилизаций не счесть."
 leader_trait_admiral_united_fleet4:0 "Чудо Объединённого флота"
 leader_trait_admiral_united_fleet4_desc:0 "Их появление как минимум показало нам: нет ничего невозможного, и не всякий тупик — конец пути; пока мы не остановимся, дорога впереди обязательно найдётся."
 leader_trait_admiral_uf_s1:0 "Размыкатель контура Объединения"
 leader_trait_admiral_uf_s1_desc:0 "Эта лидер Объединения установила на своём флагмане устройство управления временем-пространством: в малом радиусе оно замораживает время-пространство любого флота, на короткое время отнимая 90% урона и скорострельности оружия. Активируется в бою против нескольких флотов; перезарядка 30.00 £time£."
 leader_trait_admiral_uf_s2:0 "Генератор зеркальных сущностей Объединения"
 leader_trait_admiral_uf_s2_desc:0 "Эта лидер Объединения установила на своём флагмане устройство управления измерениями: оно копирует её саму из других параллельных вселенных в это измерение для участия в бою. Но из-за перехода сквозь измерения и время боевая мощь и её собственного флота, и зеркальных флотов сильно падает; зеркальные флоты держатся до конца боя; перезарядка 30.00 £time£."
 leader_trait_admiral_uf_mirrored_fleet:0 "Зеркальный флот Объединения"
 leader_trait_admiral_uf_mirrored_fleet_desc:0 "Этот флот — зеркальная копия, воспроизведённая из другой параллельной вселенной, потому его боевая мощь куда ниже оригинала."
 leader_trait_admiral_uf_n1:0 "Ветер, лес, огонь и гора"
 leader_trait_admiral_uf_n1_desc:0 "Эта лидер Объединения считает скорость ключом к победе — и переводит энергию щитов на двигатели ради большей крейсерской скорости."
 leader_trait_admiral_uf_n2:0 "Боезапас Ван Флита"
 leader_trait_admiral_uf_n2_desc:0 "Чтобы вылить по врагу максимум огня в кратчайший срок, эта лидер Объединения ценой прочности корпуса подняла скорострельность корабельной артиллерии на целый уровень."
 leader_trait_admiral_uf_n3:0 "Доктрина большого корабля и большого орудия"
 leader_trait_admiral_uf_n3_desc:0 "Эта лидер Объединения — фанатичная приверженца доктрины большого корабля и большого орудия: ничто не выдержит единого залпа её флота. Но чудовищная мощь сделала её корабли конструктивно неустойчивыми."
 leader_trait_admiral_uf_n4:0 "Челночные бомбардировки"
 leader_trait_admiral_uf_n4_desc:0 "Благодаря блестящему командованию этой лидер Объединения её авианосцы за короткое время поднимают в воздух больше корветов для борьбы за господство."
 r_uf:0 "£sr_huaji£ Объединённый флот: «Чистилище» £sr_huaji£"
 r_uf_desc:0 "После появления Объединённого флота на кризисной сложности нажмите эту реликвию — и откроется сложность «Чистилище» для Объединённого флота."
 requires_uf_hidden_actived:0 "§!§R Сложность «Чистилище» уже включена§!"
 r_uf_active:0 "Включить «Чистилище» Объединённого флота"
 requires_uf_insane:0 "§!§R Требуется, чтобы Объединённый флот уже появился и его сложность — кризисная§!"
 tech_UNITEDFLEET2:0 "Прыжковый двигатель Объединения"
 tech_UNITEDFLEET2_desc:0 "Подаренная Объединённым флотом технология: прыжковый двигатель, приспосабливающийся к любой реальности и способный легко увести нас из этой галактики."
