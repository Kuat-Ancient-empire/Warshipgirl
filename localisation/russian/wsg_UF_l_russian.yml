 uf_key:0 "§!§W Если каждый параллельный план — это высотка, каждый этаж — измерение, а комнаты на этажах — параллельные вселенные, то объединённый навигатор — ключ от выхода из высотки: он приведёт нас во владения Объединения§!"
 PLANET_KILLER_SK_UF:0 "Объединённый солнцетряс"
 PLANET_KILLER_SK_UF_DESC:0 "Оружие звёздного уничтожения на борту объединённого навигатора: за несколько дней обращает звёздную систему в чёрную дыру."
 PLANET_KILLER_SK_UF_ACTION:0 "Погасить звезду"
 PLANET_KILLER_SK_UF_ACTION_DESC:0 "Оружие звёздного уничтожения на борту объединённого навигатора: за несколько дней обращает звёздную систему в чёрную дыру."
 PLANET_KILLER_SK_UF2:0 "$PLANET_KILLER_SK_UF$"
 PLANET_KILLER_SK_UF2_DESC:0 "Применяемое объединённым звездорушителем оружие разрушения звёзд: за короткое время оно выводит из равновесия гравитацию звезды, вызывая вспышку сверхновой, уничтожающую всё в системе — кроме материи Объединённого флота"
 PLANET_KILLER_SK_UF2_ACTION:0 "$PLANET_KILLER_SK_UF_ACTION$"
 MESSAGE_DESC_FOR_PLANET_KILLER_SK_UF:0 "обращена в чёрную дыру; исполнитель —"
 FLEETORDER_DESTROY_PLANET_WITH_PLANET_KILLER_SK_UF:0 "Подготовка к погашению звезды $PLANET|Y$"
