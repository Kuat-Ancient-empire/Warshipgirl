 tech_warshipgirl_senergy_assembly_plantF:0 "Портовый сборщик с ядрами Глубинных"
 tech_warshipgirl_senergy_assembly_plantF_desc:0 "При строгом соблюдении процесса новое энергетическое ядро Глубинных безвредно покрывает аппетиты сборщика нового поколения и сильно упрощает операцию по имплантации ядер."
 building_wsg_senergy_1:0 "Завод энергетических ядер Глубинных"
 building_wsg_senergy_1_desc:0 "Исполинский завод, построенный после расшифровки способа приготовления энергетических ядер.\nХотя процесс излучает, толстая защита не пускает радиацию наружу."
 building_wsg_senergy_2:0 "Продвинутый завод энергетических ядер Глубинных"
 building_wsg_senergy_2_desc:0 "Завод расширен и пересобран на более лёгких, но столь же защитных материалах — рабочих мест стало больше."
 building_wsg_senergy_3:0 "Передовой завод энергетических ядер Глубинных"
 building_wsg_senergy_3_desc:0 "На базе защиты второго поколения перестроено всё пространство и линии — оптимизированы и выработка, и условия труда."
 building_wsg_senergy_distributor:0 "Чудо Порта: микроволновый регулятор ядер Глубинных"
 building_wsg_senergy_distributor_desc:0 "Эта гигантская микроволновая установка подпитывает по воздуху энергетические ядра каждой корабельной девы — расход ядер резко падает."
 building_wsg_senergy_distributor_tooltip:0 "Каждые 100 корабельных дев: расход §G-0.3§! £sr_se£ §Y$sr_se$§! в месяц"
 tech_building_wsg_distributor:0 "Микроволновое регулирование ядер Глубинных"
 tech_building_wsg_distributor_desc:0 "Глубоко изучив энергию Глубинных, мы выяснили: она передаётся лучами. Значит, девам с имплантами не надо жечь ядра — хватит большой вещательной станции."
