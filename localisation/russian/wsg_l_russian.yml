 r_wg_god:0 "Понерфить кораблей-дев одним кликом"
 r_wg_god_desc:0 "Анналы Тюленя Чжана\n\nТюлень же есть литейщик форм, а фамилия его — Чжан. Лета его неведомы, перси превелики. И кто гнездится в Тюлене, неведомо — даже художник неопределим. Стал Тюлень флотоводцем: сердце — великана, вырез — V-образный; войско его прозвали в народе Объединённым.\nВ чатах Тюлень обещал обновления — да не поспевал, и пошёл на спад. Обещал коллаборацию — и опять забил; народ возроптал. Молвил Тюлень: «Мощь Объединённого флота — не страшна. Глубинные воинственны — за то урежу; корабли-девы праздны — за то урежу; Флот Аннигиляции одинок, но Ма-Шао его любит — и того урежу!» Народ взъярился, но, страшась, что Тюлень урежет и жён их, промолчал. Тюлень же молвил: «А ваш EDDY — добр ли?» — и вовсе взъярились.\nБыл и аплоадер, сложивший оду: нечестивым путём разбил он Объединённый флот, — Тюлень узрил и урезал. Ныне Сопротивление немощно, Объединение крепнет день ото дня: в том заслуга Тюленя, но и нечестивый аплоадер виновен.\nХоть Чжан и одинок, идущих в Объединение — тьма-тьмущая; на вопрос отвечают: «Облик Тюленя нам по сердцу!» VV же тщедушен, народной воли не соберёт, а Чжан её стяжал. Удалство Чжана с Де-Мойн сравнимо, секретаршу за пояс заткнёт: трижды качнётся его шпилька — и слава летит во все концы. Войско Чжана выйдет из портала — и крепости падают; сквозь оборону пройдёт — и флоты рушатся, и остановить его нельзя. Грозит силой, соблазняет красою — оттого Объединение всё крепнет, а Сопротивление всё чахнет."
