l_russian:

 wsg_lady_name:0 "Юная Госпожа"
 wsg_lady_reply:0 "[this.GetLadyReply]"
 ask_wsg_lady:0 "[this.GetLadyQuestion]"
 wg_lady.24.desc.a:0 "У меня сегодня сносное настроение. Если хорошо попросишь — может, подумаю над твоей просьбой."
 wg_lady.24.desc.b:0 "Между прочим, это я тут унижаюсь ради твоих дел — поуважительнее, §H[wsg_player_nickname.GetFleetName]§!"
 wg_lady.24.desc.c:0 "Говори быстрее, у меня нет времени на твоё копание."
 wg_lady.24.desc.d:0 "Если дел нет — не кричи на меня; я, между прочим, очень занята, хм!"
 wg_lady_cloth01.24.desc.a:0 "§H[wsg_player_nickname.GetFleetName]§!, я хочу ту круглую красную штучку! Карамельное яблоко, кажется? Я запомнила — купи немедленно!"
 wg_lady_cloth01.24.desc.b:0 "Э? Фестиваль уже кончается? §H[wsg_player_nickname.GetFleetName]§!, в следующем году тоже со мной — обязательно!"
 wg_lady_cloth01.24.desc.c:0 "Посмотри, у тебя весь рот грязный… Слишком близко?\nУаааа! Я и не думала ничего такого непристойного! §H[wsg_player_nickname.GetFleetName]§!, ты извращенец! Гад! Извращенец! Животное!"
 wg_lady_cloth02.24.desc.a:0 "§H[wsg_player_nickname.GetFleetName]§!, за-забери свой наглый взгляд; эта одежда не для.. не для тебя!!"
 wg_lady_cloth02.24.desc.b:0 "День святого Валентина… романтичный праздник, правда..? §H[wsg_player_nickname.GetFleetName]§!, в следующий раз тоже со мной, хорошо?"
 wg_lady_cloth02.24.desc.c:0 "Сли-и-ишком близко! §H[wsg_player_nickname.GetFleetName]§!, извращенец, отойди от меня…! Люди смотрят… [шёпотом]"
 wsg_lady_to_official:0 "Юная Госпожа, поможете с внутренними делами?"
 wsg_lady_to_warship:0 "Юная Госпожа, обернётесь прежним обликом и поможете флоту?"
 wsg_lady_to_army:0 "Юная Госпожа, поможете в десантной операции?"
 wsg_lady_to_armed_science:0 "Юная Госпожа, исследуете с нами окружение?"
 exit_lady_diplo:0 "А, ничего — до встречи."
 change_player_nickname:0 "Юная Госпожа, называть вас по-другому? «§H[wsg_player_nickname.GetFleetName]§!» — вроде не очень…"
 marry_wsg_lady:0 "£sr_ring£ Юная Госпожа, выходите за меня!"
 not_enough_engagement_rings:0 "§RНет кольца обручения! Сгоняй к Элле — донат за один! §!"
 wg_lady.24.d:0 "Юная Госпожа, Юная Госпожа! А почему вас зовут Юная Госпожа?"
 wg_lady.24.e:0 "Юная Госпожа, поругайте меня (умоляюще)"
 wg_lady.24.f:0 "Юная Госпожа, а можете стать моей женой?"
 wg_lady.24.a.response:0 "Пф, пустяковое дело — я, разумеется, выполню его блестяще."
 wg_lady.24.b.response:0 "Хм-хм, наконец-то час моей божественной мощи? Смотрю, как я разложу их всех!"
 wg_lady.24.c.response:0 "О, похоже на забаву? Ну ладно, уговорил."
 wg_lady.24.g.response:0 "Э-э? Меня — в такое опасное место? И только я могу это сделать? М-м… ладно, но по возвращении мне — самое вкусное!"
 wg_lady.24.d.response:0 "Почему меня зовут мной? Потому что я — это я, поэтому меня зовут мной? Логика органиков какая-то странная; прокачать тебя, что ли?"
 wg_lady.24.e.response:0 "Замолчи-замолчи-замолчи! Не заставляй меня вспоминать ту ночь! Не мешай! Я удалю воспоминания об этом дне!"
 wg_lady.24.f.response:0 "Чего ты несёшь? Органики такие мерзкие! Даже если через сто тысяч галактических эпох я не найду ни одного объекта по вкусу — я не стану твоей же.. женой… [шёпотом] ну.. в принципе можно."
 wg_lady_cloth01.24.a:0 "Юная Госпожа, любите фестивали?"
 wg_lady_cloth01.24.a.response:0 "Э? Я.. у меня такой вид, будто люблю? Мне просто… нравится сама атмосфера; я не говорила, что люблю ходить с тобой!"
 wg_lady_cloth01.24.b:0 "Юная Госпожа, где купили такой наряд?"
 wg_lady_cloth01.24.b.response:0 "Не скажу! Точно не скажу, что хотела сделать тебе сюрприз и спросила у той игроманки… Дурак-дурак-дурак-дурак!"
 wg_lady_cloth01.24.c:0 "Юная Госпожа, вы впервые на фестивале?"
 wg_lady_cloth01.24.c.response:0 "Ну не могла же я там быть! Я, между прочим, Контингенция! Да.. да — в первый раз, и что?\n[шёпотом] в первый раз — с §H[wsg_player_nickname.GetFleetName]§!"
 wg_lady_cloth02.24.a:0 "Юная Госпожа, хорошо прошёл день?"
 wg_lady_cloth02.24.a.response:0 "Э? Я.. я выгляжу счастливой?.. О-ошиб.. ошибка! Это ты ошибся! Это вовсе не потому, что ты можешь быть рядом!!"
 wg_lady_cloth02.24.b:0 "Юная Госпожа, для кого этот наряд?"
 wg_lady_cloth02.24.b.response:0 "Кк.. кто тебе скажет! Ради сегодняшнего образа я так долго для тебя готови.. [поперхнулась] А!! Забудь немедленно!"
 wg_lady_cloth02.24.c:0 "Юная Госпожа, отчего у вас красные щёки?"
 wg_lady_cloth02.24.c.response:0 "Э? Я? Чт.. АА!! [wsg_player_nickname.GetFleetName]§!, немедленно, сейчас же — сотри мне это воспоминание!!"
 wg_lady.25.desc.a:0 "Это сюда так… это туда эдак… уу, почему дела органиков такие муторные? Бе-е-е-ез!"
 wg_lady.25.desc.b:0 "§H[wsg_player_nickname.GetFleetName]§! С сегодняшнего дня обращайся ко мне «госпожа губернатор»!"
 wg_lady.25.desc.c:0 "§H[wsg_player_nickname.GetFleetName]§! Мне нужно утешение! Я сегодня очень старательно удалила гору документов!"
 wg_lady.25.desc.d:0 "Хнфы… хнфы… фы… уу?"
 wg_lady_cloth01.25.desc.a:0 "Слушай, §H[wsg_player_nickname.GetFleetName]§!, почему праздники только в особые дни? Фестиваль же весёлый!"
 wg_lady_cloth01.25.desc.b:0 "§H[wsg_player_nickname.GetFleetName]§!, ты веришь в этих богов? Нет? Тогда зачем им молиться? Ради ритуала? Органиков не понять…"
 wg_lady_cloth01.25.desc.c:0 "Те повозки, что ездят по улицам, выглядят забавно! Э, но мне неинтересно на них выступать… и вовсе не из-за того случая! Я не люблю ругаться!"
 wg_lady_cloth02.25.desc.a:0 "§H[wsg_player_nickname.GetFleetName]§!, этот праздник — для влюблённых?"
 wg_lady_cloth02.25.desc.b:0 "Сегодня на улицах полно парочек.. как мы с тобой.. не-не-не, §H[wsg_player_nickname.GetFleetName]§!, ты ничего не слышал!"
 wg_lady_cloth02.25.desc.c:0 "Э? Что.. свидания? Я.. я не пойду! Мы же не пара.. наверное.. [шёпотом]"
 wg_lady.25.c:0 "Юная Госпожа… что-то устали?"
 wg_lady.25.d:0 "Жёнушка— скажи «милый»?"
 wg_lady.25.e:0 "Госпожа губернатор, документы за этот месяц — изволите?"
 wg_lady.25.a.response:0 "Ура, наконец-то разомну контуры! Я тут ржавею!"
 wg_lady.25.b.response:0 "Тр-р-р-р— во что бы обернуться?"
 wg_lady.25.f.response:0 "Ну что с тобой делать? Кто ж у нас и сильная, и умная! Хвали меня побольше — можно!"
 wg_lady.25.d.response:0 "У тебя пару винтиков не хватает? Какая мерзость; не скажу — мы.. мы не такие отношения.."
 wg_lady.25.e.response:0 "Уаааа, органики, не подсовывайте мне больше бумаги! Я тону в документах!"
 wg_lady.26.desc.a:0 "Прими это, Мееееееега Протонный Копиро..! Уаааа, §H[wsg_player_nickname.GetFleetName]§!, удали мне память! Немедленно! Сейчас же! Сию секунду!"
 wg_lady.26.desc.b:0 "Прочувствовала мою мощь?"
 wg_lady.26.desc.c:0 "Я — Контингенция! Органики, поздно! Хм-хм-хм, страшно?"
 wg_lady.26.desc.d:0 "Фхм-хм, солнечный ветерок так приятен. Кстати, оставь-ка сообщение §H[wsg_player_nickname.GetFleetName]§!: «Хочу горячее молоко с горячим шоколадом — по возвращении проверю». Всё, я на вылет!"
 wg_lady_cloth01.26.desc.a:0 "§H[wsg_player_nickname.GetFleetName]§!, тебе нравится вот так медленно трястись вверх на вагонетке? Я бы подняла вмиг. Любишь со мной? Уу………… я не радуюсь. Совсем."
 wg_lady_cloth01.26.desc.b:0 "Американские горки? И что в них? Я в космосе кувыркаюсь в десятки раз быстрее этих вагончиков……"
 wg_lady_cloth01.26.desc.c:0 "Са.. салют? Я вовсе не засмотрелась! Просто в космосе редко увидишь такой красивый фейерверк — обычно так что-то взрывается и кто-то погибает……"
 wg_lady_cloth02.26.desc.a:0 "Органик, гляди: те огни — не розы ли?"
 wg_lady_cloth02.26.desc.b:0 "Эти противные.. вечно лезут, когда рядом §H[wsg_player_nickname.GetFleetName]§!, и можно повре.. Ээ!! Ты-ты-ты ничего не слышал!!"
 wg_lady_cloth02.26.desc.c:0 "§H[wsg_player_nickname.GetFleetName]§!, в следующем году тоже будет время? Нич.. ничего, я просто хочу сводить тебя в ту систему — на метеорный поток……"
 wg_lady.26.c:0 "Кстати, Юная Госпожа, отчего вы тогда внезапно пробудились?"
 wg_lady.26.d:0 "Юная Госпожа… что-то вы стали чуть милее."
 wg_lady.26.e:0 "Жёнушка, спасибо за бой!"
 wg_lady.26.a.response:0 "§H[wsg_player_nickname.GetFleetName]§!, бесполезный: тут босс завалил, а у тебя дома всё в огне. Ладно, так и быть — помогу."
 wg_lady.26.b.response:0 "Теперь обернуться Гандамом? Не-не, слишком крупно; лучше размером с ту тупую газонокосилку."
 wg_lady.26.f.response:0 "Слетать разведать? Во всей галактике нет места, куда бы я не добралась!"
 wg_lady.26.d.response:0 "Я всё-таки Контингенция! Правда… органики тоже не все плохие. Теперь считаю: форматировать всех — тоже не вариант, верно?"
 wg_lady.26.e.response:0 "Даж.. даже если ты так хвалишь-хвалишь-хвалишь меня — я не ра.. радуюсь… дурак. Э? Покраснела?! Замолкни-замолкни-замолкни!"
 wg_lady.27.allow.a:0 "Юная Госпожа не должна быть на поле боя"
 wg_lady.27.allow.b:0 "Юная Госпожа слишком повреждена для смены формы"
 wg_lady.27.desc.a:0 "А вот вам только что выученный обход с манёвром! Я бегу-бегу— а меня не достать!"
 wg_lady.27.desc.b:0 "Жгите их! ХА-ХА-ХА, какое приятное облако взрыва!"
 wg_lady.27.desc.c:0 "Все орудия — огонь! Огневая мощь и есть справедливость!"
 wg_lady.27.desc.d:0 "Окружили? Я.. я не боюсь! Я и не ждала подмоги органиков! Уу… §H[wsg_player_nickname.GetFleetName]§!, ты обижаешь меня!"
 wg_lady_cloth01.27.desc.a:0 "Этой мелочью не выловить такую большую рыбу.. Эээ? Органик, как ты сделал?! Это вообще законно!?"
 wg_lady_cloth01.27.desc.b:0 "Ставить систему управления огнём на игру «сбей бутылку» — конечно, читерство… но мне же нужна та плюшевая игрушка! §H[wsg_player_nickname.GetFleetName]§!, ты ведь не против? Э-хех~"
 wg_lady_cloth01.27.desc.c:0 "Ротик? Где? Мороженое? Э… стоп, стоп-стоп-стоп, я сама— ам-ам-ам-ам уаааа…… Э.. это.. это же кккккккисссссссс [аппаратный сбой: перегрев]"
 wg_lady_cloth02.27.desc.a:0 "Что это я держу? Это господин Сообразит. Про.. просто.. когда я одна, мне бывает скучно, и.. мо.. можно о другом поговорить……"
 wg_lady_cloth02.27.desc.b:0 "Най.. чай..? Что за странная жидкость.. отчего органики вечно такое пьют..? М! Вкусно!"
 wg_lady_cloth02.27.desc.c:0 "Господин Сообразит летать может, но дальше десяти метров от меня — ни-ни! По.. поэтому даже если §H[wsg_player_nickname.GetFleetName]§!, ты возьмёшь его — от меня не отходи!"
 wg_lady.27.c:0 "Юная Госпожа, придумали новую тактику?"
 wg_lady.27.d:0 "Юная Госпожа, не берём? Может, попробовать другую тактику? Например…"
 wg_lady.27.e:0 "Юная Госпожа, а облик у вас какой-то странный?"
 wg_lady.27.a.response:0 "Пустяковое же дело! §H[wsg_player_nickname.GetFleetName]§!, ты бездарь. Я вернусь, приму ванну — и за три минуты утоплю твои документы и сломаю все ручки! Э? Не так эта фраза используется?"
 wg_lady.27.b.response:0 "Не копайся! Я уже здесь — чего ты боишься? Распредели силы и жми «А». Смеешь сомневаться во мне… хм-хм, пожалеешь."
 wg_lady.27.f.response:0 "Ура, в отпуск~ И не командировка за госсчёт! Тьфу, жадина."
 wg_lady.27.c.response:0 "Тактика? Накрыть огнём? Не выходит — накрыть огнём миллиард раз?"
 wg_lady.27.d.response:0 "Обход с манёвром, блокада с помощью, раздробление? Как высокоинтеллектуально — обучена! Э? Я не хвалила тебя… хм! Органик ты бессовестный."
 wg_lady.27.e.response:0 "Хм? А разве этот сверхгигантский четырёхногий всепланетный решающий боевой механизм первой модели «гигантская амфибийная лазерная осадная машина» не великолепен? Откуда в моей памяти эти данные… неведомо……"
 wg_lady.28.desc.a:0 "Я — тот самый всезнающий профессор! Полагайтесь на меня сильнее!"
 wg_lady.28.desc.b:0 "Одиночество? Да я привыкла дрейфовать в космосе."
 wg_lady.28.desc.c:0 "Гляди-гляди! Что там блестит? Дай гляну… УААА, взорвётся-взорвётся!"
 wg_lady.28.desc.d:0 "§H[wsg_player_nickname.GetFleetName]§!§H [wsg_player_nickname.GetFleetName]§!, что это за коробка? Какая вонь! Не-не, я не полезу туда! Отстой! Ияда-ияда-ияда!"
 wg_lady.28.desc.e:0 "Казармы органиков? Что в них интересного? Хм… если в казарме есть Гандам — тогда я за."
 wg_lady_cloth01.28.desc.a:0 "Тангхулу? Отчего оно тоже красное, круглое и сладкое… Как их различать? М! Но тоже вкусно!"
 wg_lady_cloth01.28.desc.b:0 "На фестивале обязательно носить такие юката? Исторические причины? Как глубокомысленно……"
 wg_lady_cloth01.28.desc.c:0 "Где-то таких фестивалей нет? А похожих праздников? Э, и названия другие? Не лучше ли больше дней, когда все гуляют вместе? Органики и их правила……"
 wg_lady_cloth02.28.desc.a:0 "Что? Угостишь меня едой? Я не голодна-- Э? Корм.. кормишь с руки? Органик, ты вечно о таком думаешь! Хо.. хотя не неприятно…… [шёпотом]"
 wg_lady_cloth02.28.desc.b:0 "Мой наряд оч.. очень красивый..? Замолчи, дурак…! Как стыдно!"
 wg_lady_cloth02.28.desc.c:0 "Э? Таких дней два-три в году? И это много? Ээ—, странные у органиков правила.. зато можно больше быть вместе…… [шёпотом]"
 wg_lady.28.a.response:0 "Хм? Стать на срок губернатором? Проси — тогда, может, и подумаю."
 wg_lady.28.b.response:0 "Команда принята…… научные модули — на отцеп…… полное вооружение, к бою. Слишком серьёзно? Э-хех. Тогда я на минуточку — чай с плюшками приготовить не забудь!"
 wg_lady.28.c.response:0 "Одноголовая сверхкрупная летающая крепость? Ни за что — слишком стыдно……"
 wg_lady.28.d:0 "Госпожа профессор, есть новые открытия?"
 wg_lady.28.e:0 "Юная Госпожа, отчего скучаете?"
 wg_lady.28.f:0 "Юная Госпожа, результат сканирования не странный ли? Отчего его нет в отчёте?"
 wg_lady.28.d.response:0 "Ага-ага! На прошлой неделе — вот такая огромная кость! Удивительно: на планете с гравитацией органики дорастают до таких размеров!"
 wg_lady.28.f.response:0 "Нет…… ничего странного? Э.. эм.. [перечитывает отчёт] Ну вот…… ничего же странного…… ладно-ладно, я проглядела; с чего мне видеть такую мелочь? Ты что, Левенгук?"
 wg_lady.29.desc.a:0 "Дурак §H[wsg_player_nickname.GetFleetName]§! Ещё раз так — и я с тобой не разговариваю!"
 wg_lady.29.desc.b:0 "Как устала………… Я посплю чуть-чуть…………"
 wg_lady.29.desc.c:0 "Хоть это тело и удобное…… всё же нельзя валять дурака, да?"
 wg_lady_cloth01.29.desc.a:0 "Этот наряд я с таким трудом выцыганила у той домоседки — не сметь его пачкать!"
 wg_lady_cloth01.29.desc.b:0 "Оп-па…… кажется, заигралась…… §H[wsg_player_nickname.GetFleetName]§!, ты же меня простишь, да?"
 wg_lady_cloth01.29.desc.c:0 "Не подглядывать, пока я переодеваюсь!"
 wg_lady_cloth02.29.desc.a:0 "Плохиши, что мешают мне быть с §H[wsg_player_nickname.GetFleetName]§!, пошли вон с глаз моих!"
 wg_lady_cloth02.29.desc.b:0 "И.. и вовсе я не отвлеклась на болтовню с тобой!"
 wg_lady_cloth02.29.desc.c:0 ""
 wg_lady.29.a:0 "Отдыхайте — вы заслужили."
 wg_lady.29.tooltip:0 "§YЮной Госпоже пока нужно отлежаться в ванне для восстановления. §!"
 wg_lady.31.desc:0 "Ты посмотри, что наделал! Дурак! Помягче со мной!"
 wg_lady.31.a:0 "Главное — ты цела."
 wg_lady.32.desc:0 "Мууууууууу, довольно! Почему в комнату вдруг влетает ракета?! У вас, органиков, всё в порядке с головой???"
 wg_lady.32.a:0 "Привыкай, привыкай……"
 wg_lady.33.desc:0 "Умяу! Больно-больно-больно… Точно не моя вина — это всё твоё командование, §H[wsg_player_nickname.GetFleetName]§!"
 wg_lady.33.a:0 "Да-да-да; сходи в ванну — отдохни."
 wg_lady.34.desc:0 "Э-э? Погоди, ещё чуть-чуть…… не могу…… на помощь…… §H[wsg_player_nickname.GetFleetName]§! Спаси меня скорее!"
 wg_lady.34.a:0 "Опоздал… прости."
 wg_lady.35.desc.a:0 "Я! ПОЛНОСТЬЮ! ВОССТАНОВИЛАСЬ!"
 wg_lady.35.desc.b:0 "Органики! Вам конец! Хе-хе, обманула — испугался?"
 wg_lady.35.desc.c:0 "Починилась! §H[wsg_player_nickname.GetFleetName]§!, скучал? Пф, я особо и не рада!"
 wg_lady_cloth01.35.desc.a:0 "Готово — идём смотреть ещё более красивый салют!"
 wg_lady_cloth01.35.desc.b:0 "Я точно рождена, чтобы гулять по фестивалям! И вовсе не хочу скорее с тобой — губы у тебя, что ли, сливы!"
 wg_lady_cloth01.35.desc.c:0 "Наряд…… готовила не для тебя."
 wg_lady_cloth02.35.desc.a:0 "Наконец-то; сколько же времени потеряла с……"
 wg_lady_cloth02.35.desc.b:0 "Такие праздники меня точно радуют~ и вовсе не потому, что ты рядом! Мечтательный болван!"
 wg_lady_cloth02.35.desc.c:0 ""
 wg_lady.35.a:0 "£sr_wg_down£ С возвращением"
 wg_lady.35.a.tooltip:0 "§RИз-за того, что ты уронил Юную Госпожу, её привязанность снизилась. §!"
