 LADY_SPECIES:0 "Наномашинная особь"
 lady_army_desc:0 "Армия из наномашинной Юной Госпожи: она принимает форму любого боевого юнита по обстановке и наносит противнику смертельные удары — на поле боя это ужасающая единица."
