 wsg_lady_recover_cd:0 "Юная Госпожа тяжело повреждена"
 wsg_lady_recover_cd_desc:0 "Юная Госпожа нежится в ванне……"
 leader_trait_official_wsg_lady:0 "Наномодуль управления"
 leader_trait_official_wsg_lady_desc:0 "Падшая империя дев установила в Юную Госпожу мощнейший управляющий модуль — она справится с любой работой; правда, сама работа ей не по нраву……"
 leader_trait_official_wsg_lady_weaken:0 "Наномодуль управления (ослаблен)"
 leader_trait_official_wsg_lady_weaken_desc:0 "Падшая империя дев установила в Юную Госпожу мощнейший управляющий модуль — она справится с любой работой; но она пока не привыкла к новому телу и не выжимает всего."
 leader_trait_admiral_wsg_lady:0 "Боевой модуль Юной Госпожи"
 leader_trait_admiral_wsg_lady_desc:0 "Падшая мама глубоко прокачала боевые способности и оснащение Юной Госпожи: она достойна нескольких флотов — и даже левиафанов в десятки раз её крупнее."
 leader_trait_admiral_wsg_lady_weaken:0 "Боевой модуль (ослаблен)"
 leader_trait_admiral_wsg_lady_weaken_desc:0 "Падшая мама глубоко прокачала боевые способности и оснащение Юной Госпожи; но она пока не привыкла к новому телу и не выжимает всего."
 leader_trait_scientist_wsg_lady_science_ship:0 "Научный модуль Юной Госпожи"
 leader_trait_scientist_wsg_lady_science_ship_desc:0 "Юная Госпожа, похоже, подключена к базам падшей империи дев — ей по плечу любая проблема. Правда, оттого она бывает невнимательна……"
 leader_trait_scientist_wsg_lady_science_ship_weaken:0 "Научный модуль Юной Госпожи"
 leader_trait_scientist_wsg_lady_science_ship_weaken_desc:0 "Юная Госпожа, похоже, подключена к базам падшей империи дев для чтения данных; но она пока не привыкла к новому телу и не выжимает всего."
 tech_disignable_wsg_lady:0 "Управление макро-наномашинами"
 tech_disignable_wsg_lady_desc:0 "Изучив тело Юной Госпожи и её наномашины, мы постигли их устройство и применение; как строить подвижные нано-механизмы — по-прежнему загадка."
 wsg_lady_REACTOR:0 "Ядро энергии Юной Госпожи"
 wsg_lady_REACTOR_DESC:0 "Мощь удара: одна секция тянет как десять"
 wsg_lady_SHIP_THRUSTER:0 "Ядро-двигатель Юной Госпожи"
 wsg_lady_SHIP_THRUSTER_DESC:0 "Красная, с рогом, втрое быстрее — полный набор"
 LADY_weapen_X:0 "Достоинство (круговое)"
 LADY_weapen_X_DESC:0 "Круговая X-батарея Юной Госпожи: карает наглецов с любого направления."
 LADY_weapen_T:0 "Элегантность (круговое)"
 LADY_weapen_T_DESC:0 "Круговая T-батарея Юной Госпожи: карает наглецов с любого направления."
 AI_BEHAVIOUR_EMPTY:0 "Пустой компонент"
 C_SHIP_CREW_EMPTY:0 "Пустой компонент"
 SPECIAL_SHIP_SLOT_EMPTY:0 "Пустой компонент"
 wg_lady_cloth01.24.c.response:0 "Ну не могла же я там быть! Я, между прочим, Контингенция! Да.. да — в первый раз, и что?\n[шёпотом] в первый раз — с §H[wsg_player_nickname.GetFleetName]§!"
 wg_lady.25.c.response:0 " [wsg_player_nickname.GetFleetName]! Живо растирай мне плечи! Хм… неведомо отчего у меня усталость, но [wsg_player_nickname.GetFleetName], твои услуги в этом неплохи, э-хех."
 wg_lady.26.c.response:0 "Кто ж знает? А разве не §H [wsg_player_nickname.GetFleetName] §! меня разбудил? Нет?"
 wg_lady.28.e.response:0 "Только что я…… нашла, это, корабль; внутри органики без снабжения…… [wsg_player_nickname.GetFleetName], не смей покидать меня! Обещал!"
 WG_LADY_CHANGE_COLOSSUS_WEAPON:0 "Смена колоссального орудия Юной Госпожи"
 WG_LADY_CHANGE_COLOSSUS_WEAPON_DESC:0 "Столичная база расчистила стык для замены её звёздного орудия; осталось лишь поставить её."
 wg_lady.26.a:0 "Юная Госпожа, сменим колоссальное орудие."
 wg_lady.62.desc:0 "Орудие? А.. какое выберешь?"
 wg_lady.62.response:0 "Ладно…… но не смей шарить в моих деталях! Договорились!"
 wsg_lady_official_desc:0 "Цундэрэ-Юная Госпожа сегодня снова не в настроении — лежебродство ей куда больше к лицу."
 wsg_lady_warship_desc:0 "Одна (1) Юная Госпожа Контингенции, оригинальная цундэрэ. Просим не фапать в этом разделе."
 wsg_lady_science_desc:0 "Очкастая Юная Госпожа: выглядит более застенчивой, но и более взрывной."
