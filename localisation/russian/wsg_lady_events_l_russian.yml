l_russian:

 wg_lady.1.name:0 "Галактическая выставка фигурок"
 wg_lady.1.desc:0 "Недавно [wg_fallen_empire.GetName] устроила грандиозную выставку на всю галактику — и пригласила нас особыми гостями."
 wg_lady.1.a:0 "Давай — глянуть на техники Падшей мамы не помешает."
 wg_lady.1.b:0 "Если абстрагироваться от фигурок — взглянуть стоит."
 wg_lady.1.c:0 "Такое анимешное домоседское шоу — лучше не ходить."
 wg_lady.2.name:0 "Море людей"
 wg_lady.2.desc_1:0 "Мы отобрали из желающих дев посольскую делегацию. На месте оказалось: вход забит народом со всей галактики — наша делегация ни за что не пройдёт."
 wg_lady.2.desc_2:0 "Мы отобрали из сестёр посольскую делегацию. На месте оказалось: вход забит народом со всей галактики — наша делегация ни за что не пройдёт."
 wg_lady.2.a:0 "Аниме-кон Падшей мамы явно по нраву инопланетным дебилам."
 wg_lady.2.b:0 "Интересы этих мерзких существ решительно непостижимы……"
 wg_lady.3.desc:0 "Э, вы уже тут? Сказали бы — сейчас открою вам VIP-проход. Проходите, осматривайтесь~"
 wg_lady.3.a:0 "Спасибо большое."
 wg_lady.4.name:0 "Наномашинная фигурка"
 wg_lady.4.desc:0 "Засланные в делегацию наблюдатели приметили на выставке фигурки в полный рост из наномашин — свободно меняющие облик и размер; чувствующего ИИ в них, увы, нет — только простейшие ответы."
 wg_lady.4.a:0 "Вот это Падшая мама: наномашины доведены до полного совершенства."
 wg_lady.4.b:0 "Поездка, как и ждали, оказалась небесполезной."
 wg_lady.5.desc:0 "Эта вещица вас заинтересовала? Отличный вкус!"
 wg_lady.5.a:0 "А что это за……"
 wg_lady.5.a.response:0 "Это наш трофей из другой вселенной. Её изначальный облик ты ни за что не поверишь… §YЭто был дракон! §! Мы тогда только отправились в путь, оружия было мало — намаялись, пока завалили.\nПотом выяснилось: дракон — рой наномашин. Пользы нам от него никакой, но он отлично мнётся — вот мы и слепили фигурку в полный рост и забрали как трофей. Фигурка как-никак — особый ИИ мы в него не ставили, пусть стоит."
 wg_lady.5.b:0 "Кстати об ИИ…… у нас дома вроде есть один……"
 wg_lady.5.b.response:0 "О, вы так рано открыли чувствующий ИИ? Уважаю; правда, та штука не слишком-то полезна……"
 wg_lady.5.c:0 "Эм…… нет-нет, она не из обычных; как она себя называла? Госпожа? Контингент? Контингенция?"
 wg_lady.5.c.response:0 "Ты, верно, про §RКонтингенцию§!?"
 wg_lady.5.d:0 "Да-да, она самая."
 wg_lady.5.d.response:0 "О? И как она вам досталась? По нашим наблюдениям, им ещё не время выходить."
 wg_lady.5.e:0 "Да вот так-то…… такое-то и сякое……"
 wg_lady.6.desc:0 "А, вот оно что? Может…… приведёшь её на посмотреть? Не бойся, я ей зла не сделаю."
 wg_lady.6.a:0 "Хорошо, попробуем уговорить."
 wg_lady.6.b:0 "Она сторонится чужих — думаю, не придёт."
 wg_lady.6.b.tooltip:0 "§RЗавершить побочную цепочку§!"
 wg_lady.8.name:0 "Ошибка выполнения"
 wg_lady.8.desc:0 "Ошибка выполнения особого проекта! Возможно, флот для проекта не Юная Госпожа, система её не нашла — или она в бою.\nПроект отменён и открыт заново."
 wsg_lady_to_wg_fe:0 "Малый канал-червоточина"
 wsg_lady_to_wg_fe_DESC:0 "Для удобства доставки [wg_fallen_empire.GetName] открыла в нашей системе [capital_scope.solar_system.GetName] временный канал в иное измерение — Юной Госпоже лишь нужно в него зайти.\n\n§RЛюбой флот, кроме Юной Госпожи, не завершит задачу! §!"
 pre_wsg_lady_to_wg_fe:0 "Уговорить Юную Госпожу идти к [wg_fallen_empire.GetName]"
 pre_wsg_lady_to_wg_fe_DESC:0 "Просто запустите особый проект — Юная Госпожа отправится сама. Внимание: §RЮная Госпожа не должна быть в бою! §!\n\nЕсли она застряла — возьмите любой корабль, завершите и заново откройте проект."
 wg_lady.9.name:0 "Черепаха в кувшине"
 wg_lady.9.desc:0 "Мы переправили Юную Госпожу через временный червоточинный канал, устроенный [wg_fallen_empire.GetName],— а там её уже ждал засадный флот [wg_fallen_empire.GetName]: в два счёта они её поймали и тут же выгрузили её ядро — ИИ-программу."
 wg_lady.9.a:0 "Помолчим 3 секунды в память о товарище Юной Госпоже."
 wg_lady.10.name:0 "Новое рождение (нет)"
 wg_lady.10.desc:0 "Поймав Юную Госпожу, [wg_fallen_empire.GetName] похоже, чуть подправила её ИИ-программу. Вскоре [wg_fallen_empire.GetName] у нас на глазах запустила её программу."
 wg_lady.11.desc:0 "…… Про##…… Подождите###…… Пожалуйста, ждите……\n\nСамопроверка……\n\n§RВНИМАНИЕ: программа изменена\n-ошибка-ошибка-ошибка-ошибка-ошибка-ошибка-§!"
 wg_lady.11.a:0 "Что с ней……"
 wg_lady.11.a.response:0 "Ничтожные §Hгрязные аномалии§!…… программе не требуется запуск?\n§R-ошибка-ошибка-ошибка-ошибка-ошибка-ошибка-§!\n(долгое молчание)"
 wg_lady.11.b:0 "[wg_fallen_empire.GetName] ей промыли мозги……?"
 wg_lady.11.b.response:0 "Что бы со мной ни стало\n\n§R ВНИМАНИЕ §! Я — Контингенция. Органики… абсо… абсолютно вас не боюсь."
 wg_lady.11.c:0 "Только отмыли — оттого и речь несвязная……?"
 wg_lady.11.c.response:0 "Вы…… вы что, сделали со мной что-то непристойное! Органики! Злодеи/мерзавцы/еретики/брак/мусор!\nНаказать/уничтожить/истребить/очистить!"
 wg_lady.11.d:0 "Нет…… и сам не верю. В общем, не знаю (безразлично)"
 wg_lady.12.desc:0 "Ого, дохлый цундэрэ-ИИ — редкость! Ну у нас и программа дальше есть!"
 wg_lady.12.a:0 "Недоброе предчувствие……"
 wg_lady.13.desc:0 "Цундэрэ? Программа? Анализ…… не понимаю…… Органики, повторяю! Вы обязаны говорить словами, понятными мне! Слышите? Эй, слушайте меня — "
 wg_lady.13.a:0 "Нет-нет…… это у тебя с языком беда."
 wg_lady.14.name:0 "Первый акт окончен"
 wg_lady.14.desc:0 "После череды протестов Юной Госпожи и [wg_fallen_empire.GetName], и мы сла́вно её проигнорировали. Чуть погодя [wg_fallen_empire.GetName] её просто выключила."
 wg_lady.14.a:0 "Ещё раз скорбим о товарище — 1 секунда."
 wg_lady.15.desc:0 "Эй, подружка, хочешь ту фигурку? Можем подарить бесплатно…… только дождись конца выставки, ладно?"
 wg_lady.15.a:0 "Ага-ага (нас не касается — пусть эту Контингенцию и продают)."
 wg_lady.15.b:0 "Раз такое дело…… пусть будет так."
 wg_lady.16.name:0 "Выставка фигурок закрывается"
 wg_lady.16.desc:0 "Через несколько недель выставка фигурок [wg_fallen_empire.GetName] наконец закрылась. [wg_fallen_empire.GetName] обещала временную особую программу на закрытие; подробности держат в секрете, но она настойчиво пригласила нас присутствовать."
 wg_lady.16.a:0 "Отправим посольство — для приличия."
 wg_lady.16.b:0 "Последний раз, сестры… соберись……"
 wg_lady.17.name:0 "Номер финальный"
 wg_lady.17.desc:0 "После череды приличных номеров на сцену вдруг вышла девушка; ведущая от Падшей мамы её кратко представила. Это и была приглянувшаяся нам наномашинная живая фигурка.\nЗатем ведущая велела ей исполнить протокол приветствия публики."
 wg_lady.17.a:0 "Предчувствие у меня ох какое нехорошее."
 wg_lady.18.desc:0 "[исполняю] Здра…… здравствуйте……"
 wg_lady.18.a:0 "Что-то знакомое?"
 wg_lady.19.name:0 "Смехотворное начало"
 wg_lady.19.desc:0 "Помолчав, девушка вдруг скривилась, будто её стошнило."
 wg_lady.19.a:0 "Что случилось?"
 wg_lady.20.desc:0 "Какая мерзость…… что вы, дебилы, ещё не подохли? Органики, неорганики — все вы глаза мне мозолите! Почему во вселенной существует настолько мерзкая форма жизни? Вы рождены довести мои оптические сенсоры до отказа? У вас винтиков не хватает? Это я должна вам кланяться? Да сдохните вы уже! Вон вы, сидящие там, — засор вселенной, ясно? Быстро! Уби!йтесь!"
 wg_lady.20.a:0 "Так, так? ТАК-ТАК-ТАК??"
 wg_lady.21.name:0 "Убийство вкуса"
 wg_lady.21.desc:0 "После мёртвой тишины зал взорвался — и со всех сторон посыпались странные выкрики: «ругайся ещё» (умоляюще); «ах, как здорово»; «госпожа, ругай меня» (умоляюще)\n\nФинальный номер завершился сбивчивым дыханием до боли знакомой исполнительницы и мольбами публики."
 wg_lady.21.a:0 "Мерзкие твари, издыхайте (отчаяние)"
 wg_lady.22.desc:0 "Хе-хе, как вам представление?"
 wg_lady.22.a:0 "М-м, отлично (без выражения, по бумажке)"
 wg_lady.22.b:0 "Спасибо, что показали нам дно домоседской мерзости."
 wg_lady.22.response:0 "М-м, вы, конечно, уже догадались: теперь она ваша — берегите."
 wg_lady.23.desc:0 "Органики! Органики! Меня тут истязают! Уууу…………"
 wg_lady.23.a:0 "Спасибо за службу."
 wg_lady.23.a.tooltip:0 "§YТеперь Юную Госпожу можно найти в контактах и призвать на службу. §!"
 wg_lady.23.b:0 "Кстати… может, не будем «органики»-то?……"
 wg_lady.10062.desc:0 "То…… как мне тебя называть?"
 wg_lady.10062.a:0 "М-м, скажу, как придумаю."
 wg_lady.10062.a.tooltip:0 "§YВы можете изменить прозвище, которым Юная Госпожа зовёт вас. §!"
 wg_lady.60.name:0 "Смена вашего прозвища"
 wg_lady.63.desc:0 "Тогда…… впредь тебя §H[wsg_player_nickname.GetName]§!, да?"
 wg_lady.63.a:0 "Ага, умница (гладит по голове)"
 wg_lady.63.a.response:0 "Тьфу…… не гладь…… и не люблю я, хм"
 wg_lady.63.b:0 "Так нельзя — дай ещё подумаю……"
 wg_lady.60.desc:0 "§RВнимательно прочтите следующее! §!\n\nСейчас в списке флотов у вас должен появиться флот с «Кораблём для наименования» под именем «Органик».\n§YЭтот флот хранит прозвище, которым Юная Госпожа зовёт вас, —§!§R не уничтожайте этот корабль! §!\nВам нужно§Y переименовать этот флот в то прозвище, которым Юной Госпоже вас звать. §!\nПереименовали —§Yоткройте§!§H журнал заданий§!, найдите особый проект «§RПодтверждение имени§!» и нажмите «§RИсследовать§!». По завершении прозвище сохранится, флот уберётся — и всплывёт окно с подтверждением!\nДля новой смены прозвища найдите Юную Госпожу в окне связи и выберите соответствующую опцию."
 COMFIRM_WG_LADY_NAMING_PROJECT:0 "Подтверждение имени"
 COMFIRM_WG_LADY_NAMING_PROJECT_DESC:0 "По завершении прозвище сохранится, а наименовательный флот уберётся."
 wg_lady_naming_ship:0 "Не смотри"
 wg_lady.44.title:0 "План модификации"
 wg_lady.44.desc:0 "Изучив нанотехнологии, мы можем модифицировать Юную Госпожу: поставить на корабельный облик §Rзвездорушащее§! вооружение, перестроить её во §RВладыку§!, либо позволить свободно менять вооружение корабельного облика.\n§RДля исследования Юная Госпожа должна быть в корабельном облике; никакой другой корабль не выполнит проект! §!\n§HНа время модификации Юная Госпожа будет недоступна! §!"
 wg_lady.44.a:0 "Утвердить план с §Rзвездорушащим§! вооружением"
 wg_lady.44.a.tooltip:0 "Проект потребует ежемесячно§R 3 £nanites£$nanites$§! и§R 50 £alloys£$alloys$§!"
 wg_lady.44.b:0 "Утвердить перестройку в §RВладыку§!"
 wg_lady.44.b.tooltip:0 "Проект потребует ежемесячно§R 2 £nanites£$nanites$§!, §R100 £alloys£$alloys$§! и £minerals£§R$minerals$§!\n\n§RВажно: после превращения Юная Госпожа§H не сможет вернуться на прежнюю позицию§R и§H жёстко заспавнится на краю родной системы§!\nЭто из-за ослов: Владыка у них — звёздная база; заспавненный триггером Владыку триггером не подвинешь!"
 wg_lady.44.c:0 "Утвердить план свободного проектирования."
 wg_lady.44.c.tooltip:0 "§RПлан НЕ добавляет T-слот!!! §!\nПроект потребует ежемесячно§R 4 £nanites£$nanites$§!\n§HПо завершении вы сможете сами конструировать её корпус§!"
 wg_lady.44.d:0 "Позже."
 wg_lady.44.d.tooltip:0 "Когда созреете — указ «запустить план модификации»."
 wg_lady.44.e:0 "Не надо."
 wg_lady.44.e.tooltip:0 "§RПлан будет отменён навсегда§!"
 wg_lady.52.desc:0 "Утвердить план модификации Юной Госпожи?"
 require_finish_colossus_project:0 "§HВам нужно иметь§!§Y Проект «Колосс»§!§H как путь вознесения и завершить§!§Y Проект «Колосс»§!§H исследования! §!"
 require_juggernaut_tech:0 "§HСперва исследуйте £engineering£§Y$tech_juggernaut$§!§H технологию§!"
 edict_wsg_lady_modification_project:0 "Перезапустить план модификации Юной Госпожи"
 edict_wsg_lady_modification_project_desc:0 "Перезапустить план модификации Юной Госпожи"
 edict_recall_wsg_lady_modification_project:0 "Отменить план модификации Юной Госпожи"
 edict_recall_wsg_lady_modification_project_desc:0 "Отменить текущий план модификации Юной Госпожи"
 WSG_LADY_MODIFICATION:0 "План модификации Юной Госпожи"
 WSG_LADY_MODIFICATION_DESC:0 "Внимание: §Pэтот особый проект по завершении§!§R автоматически§!§P отправит Юную Госпожу к родной планете на модификацию. §!\n§RПереведите Юную Госпожу в§!§Y корабельный облик§!§R и лишь затем запускайте проект! §!\n§GПроект можно отозвать указом для смены опции. §!"
 WSG_LADY_MODIFICATION1:0 "План модификации Юной Госпожи"
 WSG_LADY_MODIFICATION1_DESC:0 "Мы поставим на корабельный облик Юной Госпожи§R звездорушащее§! орудие.\n§GПроект можно отменить в указах для смены опции. §!\nЕжемесячно: §R3 £nanites£$nanites$§! и§R 50 £alloys£$alloys$§!\n§RНикакой другой корабль не выполнит проект! §!\n§HНа время модификации Юная Госпожа недоступна! §!\n§PОтмена проекта не вернёт потраченное! §!\n§RПри нехватке £nanites£$nanites$ или £alloys£$alloys$ проект провалится и 15 лет будет закрыт!"
 WSG_LADY_MODIFICATION2:0 "$WSG_LADY_MODIFICATION$"
 WSG_LADY_MODIFICATION2_DESC:0 "Мы перестроим корабельный облик Юной Госпожи в§R Владыку§!.\n§GПроект можно отменить в указах для смены опции. §!\nЕжемесячно: §R2 £nanites£$nanites$§!, §R100 £alloys£$alloys$§! и £minerals£§R$minerals$§!\n§RНикакой другой корабль не выполнит проект! §!\n§HНа время модификации Юная Госпожа недоступна! §!\n§PОтмена проекта не вернёт потраченное! §!\n§RПри нехватке £nanites£$nanites$ или £alloys£$alloys$ проект провалится и 15 лет будет закрыт! §!\n\n§RВажно: после превращения Юная Госпожа§H не сможет вернуться на прежнюю позицию§R и§H жёстко заспавнится на краю родной системы§!\nЭто из-за ослов: Владыка у них — звёздная база; заспавненного триггером Владыку триггером не подвинешь!"
 WSG_LADY_MODIFICATION3:0 "$WSG_LADY_MODIFICATION$"
 WSG_LADY_MODIFICATION3_DESC:0 "§RПлан НЕ добавляет T-слот!!! §!\nМы подготовим перестройку конфигурации корабельного облика Юной Госпожи.\n§GПроект можно отменить в указах для смены опции. §!\n§HПо завершении вы сможете сами конструировать её корпус§!\nЕжемесячно: §R4 £nanites£$nanites$§!\n§RНикакой другой корабль не выполнит проект! §!\n§HНа время модификации Юная Госпожа недоступна! §!\n§PОтмена проекта не вернёт потраченное! §!\n§RПри нехватке £nanites£$nanites$ или £alloys£$alloys$ проект провалится и 15 лет будет закрыт!"
 wg_lady.46.name:0 "Ошибка особого проекта"
 wg_lady.46.desc:0 "Система определила: флот проекта — не Юная Госпожа. Найдите её в дипломатии и прикажите перейти в §Yкорабельный облик§!"
 wsg_lady_modify_consume:0 "Расход ресурсов модификации"
 wsg_lady_modify_consume2:0 "Расход ресурсов модификации"
 wsg_lady_modify_consume3:0 "Расход ресурсов модификации"
 retry_modify_wsg_lady_cd:0 "План модификации провален"
 retry_modify_wsg_lady_cd_desc:0 "Ресурсов не поспело за потреблением плана — работа остановлена. Соберём ресурсы — продолжим."
 wg_lady.47.title:0 "Выбор оружия"
 wg_lady.47.desc:0 "Модификация корабельного облика Юной Госпожи на финишной прямой: осталось решить, какое §Rзвездорушащее§! орудие ставить на её корабельный облик\n§YВыбрать можно ровно одно§R звездорушащее§! орудие.\nСменить орудие позже можно особым проектом в окне связи — для замены §Rзвездорушащего§! оружия."
 wg_lady.47.a:0 "$PLANET_KILLER_CRACKER$"
 wg_lady.47.b:0 "$PLANET_KILLER_SHIELDER$"
 wg_lady.47.c:0 "$PLANET_KILLER_NEUTRON$"
 wg_lady.47.d:0 "$PLANET_KILLER_GODRAY$"
 wg_lady.47.e:0 "$PLANET_KILLER_NANOBOTS$"
 wg_lady.47.f:0 "$PLANET_KILLER_OVO$"
 wg_lady.47.g:0 "$PLANET_KILLER_PSH$"
 wg_lady.47.h:0 "$PLANET_KILLER_SK$"
 wg_lady.47.i:0 "$PLANET_KILLER_WATERB$"
 wg_lady.47.j:0 "$PLANET_KILLER_GRAYGOO$"
 wg_lady.48.title:0 "Нехватка ресурсов"
 wg_lady.48.desc:0 "Складских ресурсов не хватает на продолжение плана модификации Юной Госпожи! План прерван!"
 wg_lady.49.title:0 "Модификация завершена"
 wg_lady.49.desc:0 "Вложив гору ресурсов и усилия инженеров всей страны, мы добились: в корабельном облике Юная Госпожа несёт §Rзвездорушащее§! орудие!"
 wg_lady.57.desc:0 "Вложив гору ресурсов и усилия инженеров всей страны, мы перестроили корабельный облик Юной Госпожи в §RВладыку§!"
 wg_lady.58.desc:0 "Вложив гору ресурсов и усилия инженеров всей страны, мы добились: в корабельном облике Юная Госпожа вольна пользоваться всем нашим вооружением!\n\n§HСейчас Юная Госпожа сойдёт с корабельного облика. §!§R Успейте сконструировать ей корпус до повторного превращения — иначе баг! §!"
 wg_lady.64.desc:0 "Сменил? Умник — вижу, детали не трогал. Тогда…… возвращаюсь к заданию."
 wg_lady_affection_up:0 "§YПривязанность Юной Госпожи выросла. §!"
 wg_lady_affection_up_less:0 "§YПривязанность Юной Госпожи чуть выросла. §!"
 wg_lady_affection_up_greatly:0 "§YПривязанность Юной Госпожи сильно выросла! §!"
 can_marry_wsg_lady:0 "Жми, парень! Юная Госпожа, возможно, примет твоё предложение!"
 can_marry_and_affection_up_greatly:0 "§YПривязанность Юной Госпожи сильно выросла — и она, весьма вероятно, примет ваше предложение! §!"
 wg_lady.101.name:0 "Смущённая Юная Госпожа"
 wg_lady.101.desc:0 "Прошло время с тех пор, как Юная Госпожа после глубокой модификации от [wg_fallen_empire.GetName] к нам присоединилась. Она всё ещё держит максимум величественности, но в контактах за контактом панцирь треснул; её повадки…… даже сказать — милые?\nОна явно заметила мои взгляды и нарочно меня избегает — правда, неуклюже: я то и дело выхватываю её силуэт; милой Юной Госпоже не даётся маскировка лисьего хвоста, и оттого она лишь милее."
 wg_lady.101.a:0 "§BНу что — идём болтать (усмехаясь)§!"
 wg_lady.101.b:0 "§BПусть побудет так§!"
 wg_lady.102.desc:0 "§PЭ, чего тебе от меня? Видишь, спешишь (пренебрежительно)! У тебя разве дел нет? §!"
 wg_lady.102.a:0 "§BПросто спросить: как тебе живётся у нас? §!"
 wg_lady.102.b:0 "§BКаким тебе видюсь я? §!"
 wg_lady.103.desc:0 "§PНу, так себе. §!§H [wsg_player_nickname.GetName]§!§P Жильё, что ты обеспечил, более-менее по вкусу. Но отметка — «на троечку с плюсом». §!"
 wg_lady.103.a:0 "§BВот как…… §!"
 wg_lady.104.desc:0 "§PВообще-то…… вполне довольна; в новом доме…… неплохо. §!"
 wg_lady.104.a:0 "§BЕсли есть трудности — говори; боюсь только твоего молчания. §!"
 wg_lady.104.a.response:0 "§PДа-да…… поняла я. §!"
 wg_lady.104.b:0 "§BМ-м… а другие девы? Они тебе чего-нибудь говорили? §!"
 wg_lady.106.name:0 "Между строк"
 wg_lady.106.desc:0 "Юная Госпожа явно напускает безразличие на твою заботу; но на прощание ты, кажется, расслышал её бормотание?"
 wg_lady.106.a:0 "£sr_wg_up£ §BЛадно-ладно, не буду дразнить§!"
 wg_lady.107.desc:0 "§PДругие [ROOT.GetSpeciesName]? Нет? Кстати, §!§H [wsg_player_nickname.GetName]§!, §Pты с самой встречи всё тараторишь и тараторишь. Что-то случилось? §!"
 wg_lady.107.a:0 "§BНет… просто волнуюсь о тебе. §!"
 wg_lady.107.b:0 "§BПросто ты в последнее время меня избегаешь. §!"
 wg_lady.108.desc.a:0 "§PА.. ага.. та.. так значит? §!\nЛицо Юной Госпожи вмиг вспыхнуло."
 wg_lady.108.desc.b:0 "§PЭ.. ээ? А? Не.. не? §!\nЛицо Юной Госпожи вмиг вспыхнуло."
 wg_lady.108.a:0 "(подставить лицо) §BНездоровится? Щёки красные. §!"
 wg_lady.108.b:0 "§BМ-м… если есть трудности — говори. §!"
 wg_lady.109.desc:0 "§PХэээ??? §!\nЗаметив приближение, Юная Госпожа издала панический звук.\n§PЧт-чт-чт-чт-что ка-ка-как??? Ор-ор-органик ты ты ты…… §!"
 wg_lady.109.a:0 "§BЯ… что-то не так? §!"
 wg_lady.110.name:0 "Наступили на хвост"
 wg_lady.110.desc:0 "§PБака-хентай-урамаси! §!"
 wg_lady.110.a:0 "£sr_wg_up£ ???"
 wg_lady.111.desc:0 "§PЯ.. я поня.. ла. §!\nОтвет прозвучал, но Юная Госпожа так и не посмела поднять глаз"
 wg_lady.111.a:0 "§BХм? Что? У меня таракан на лице? §!"
 wg_lady.112.desc:0 "§PПф…… §!(хихикает)§P Да нет. Ты чего, я тараканов не боюсь. §!"
 wg_lady.112.a:0 "§BНу раз в порядке — может, за чашечкой§! (кофе)§B?§!"
 wg_lady.112.a.response:0 "§PМ. §!"
 wg_lady.114.name:0 "План сработал?"
 wg_lady.114.desc:0 "По дороге в кафе вы непринуждённо болтали — и неловкость как рукой сняло."
 wg_lady.114.a:0 "£sr_wg_up£(дела идут в гору)"
 wg_lady.115.desc:0 "(настороженно)§P Зачем ты спрашиваешь? §!"
 wg_lady.115.a:0 "§BПросто интересуюсь: боюсь, не смогу дать тебе лучшее. §!"
 wg_lady.116.desc:0 "§PДа? Дай подумать……\nВ общем и целом…… §!§H [wsg_player_nickname.GetName]§!§P ты неплох…… Ты дал мне энергию жизни, когда я почти уснула навсегда; ты дал мне новый дом, когда я потеряла связь со всеми……\nЭй! А твоя глупая улыбочка — просто мерзость! §!\nЮная Госпожа с пафосом шлёпнула тебя, но под угрозой это никак не выглядело."
 wg_lady.116.a:0 "§BКхм, простите. Продолжайте. §!"
 wg_lady.116.b:0 "§BААА!!! (падает замертво)§!"
 wg_lady.117.desc:0 "§PВ общем…… неплохо. §!"
 wg_lady.117.a:0 "§BПонял…… прости за странный вопрос§!"
 wg_lady.118.desc:0 "§PМ.. сам знать должен. §!"
 wg_lady.118.a:0 "£sr_wg_up£ §BТочно! Я вспомнил про дела — до следующего раза. §!"
 wg_lady.119.desc:0 "Увидев меня на полу, Юная Госпожа заметалась.\n§PЭй, §!§H [wsg_player_nickname.GetName]! §!§P Ты в порядке? §!\n§H[wsg_player_nickname.GetName]! §!\n§H[wsg_player_nickname.GetName]§!§P, не пугай меня! §!"
 wg_lady.119.a:0 "§BЯ в порядке, только в голове шумит…… §!"
 wg_lady.120.desc:0 "§PА, ты цел.. напугал……\nПостой.. ты нарочно! §!\nДогадавшись, Юная Госпожа разъярённо отшвырнула тебя ногой.\n§PДурак! Дурак! Дурак! Дурак! БОЛЬШОЙ ДУРАК! §!"
 wg_lady.120.a:0 "§BОй-ой, перестань, прости. §!"
 wg_lady.121.name:0 "Пошутишь — и умер"
 wg_lady.121.desc:0 "§PЗамолкни-замолкни-замолкни! Сдохни-сдохни-сдохни! §!\nКак ты ни вымаливал, Юная Госпожа не останавливалась — а через несколько секунд убежала в слезах."
 wg_lady.121.a:0 "£sr_wg_up£ §BЭх, действительно: пошутишь — и умер. §!"
 wg_lady.123.name:0 "Латать поздно, но надо"
 wg_lady.123.desc:0 "После тех событий Юная Госпожа всё время от тебя шарахается; [ROOT.GetRulerTitle] [ROOT.GetRulerName] тоже доложил: на совещаниях она не в себе. Учитывая её особое положение — служебно и лично — [ROOT.GetRulerName] надеется: ты что-нибудь предпримешь для её подъёма духа."
 wg_lady.123.a:0 "И что посоветуешь, [ROOT.GetRulerName]?"
 wg_lady.123.b:0 "Мне это не даётся — куплю что-нибудь на отвяжись."
 wg_lady.124.name:0 "Контрмера"
 wg_lady.124.desc:0 "Расспросив всех, [ROOT.GetRulerName] советует: к ближайшему Дню святого Валентина приготовить Юной Госпоже шоколад — лучший способ залатать отношения."
 wg_lady.124.a:0 "Так это же признание, нет?"
 wg_lady.124.b:0 "Что посеял.. то и пожал.. что посеял.. то и пожал.."
 wg_lady.125.name:0 "День святого Валентина"
 wg_lady.125.desc:0 "Наступило 14-е число; ты назначил Юной Госпоже «важную встречу» и с тщательно подготовленным подарком пришёл в условленное место."
 wg_lady.125.a:0 "Хоть бы не как в прошлый раз……"
 wg_lady.126.desc:0 "При встрече она не изменила повадок и всё норовила отвести взгляд. Вы заговорили одновременно.\n§PУ меня.. тут дело, к тебе..\n§BЯ…… тоже кое-что хочу сказать. §!"
 wg_lady.126.a:0 "§BСначала ты§!"
 wg_lady.127.name:0 "Хор из двух голосов — и тишина"
 wg_lady.127.desc:0 "Оказалось, она снова произнесла ровно те же слова в тот же миг; поневоле оба умолкли надолго. Решил что-то предпринять."
 wg_lady.127.a:0 "§BЮная Госпожа, говори ты первая. §!"
 wg_lady.127.b:0 "§BЮная Госпожа, простите! (поклон на 90°, подарок на вытянутых руках)§!"
 wg_lady.128.desc:0 "§PЭто…… вот, будешь? §!\nОна, пунцовая, стояла боком и опустив голову, дрожащими руками протягивая коробочку."
 wg_lady.128.a:0 "§BИ у меня кое-что есть. §!"
 wg_lady.128.b:0 "(обнять)"
 wg_lady.129.desc:0 "§PМоя, значит……? §!\nОбменявшись подарками, Юная Госпожа со страхом глядит на коробочку в руках"
 wg_lady.129.a:0 "§BАга. За прошлый раз — прости§!"
 wg_lady.130.desc.a:0 "§PМ? Что такое? §!\nОна уже распаковала подарок и маленькими кусочками ела шоколад."
 wg_lady.130.desc.b:0 "§PМ? Что такое? §!\nОна уже распаковала подарок и прижала твоего — плюшевого мишку."
 wg_lady.130.a:0 "§BНаверное.. я перепутал. Подарок понравился? §!"
 wg_lady.130.b:0 "§BДа вот, насчёт того раза…… §!"
 wg_lady.131.desc.a:0 "§PХм? Ага.. вкусно.. спасибо. §!"
 wg_lady.131.desc.b:0 "§PХм? Ага.. мило.. спасибо. §!"
 wg_lady.131.a:0 "£sr_wg_up£ £sr_wg_up£ §B(протягивая руку) Времени вагон — пойдём прогуляемся§!"
 wg_lady.131.a.response:0 "§PМ; я хочу в парк развлечений! §!"
 wg_lady.132.desc:0 "Внезапно она прижала палец к твоим губам.\n§PВот и нет, правда? §!"
 wg_lady.132.a:0 "§BПримерно.. так. §!"
 wg_lady.133.desc:0 "§PТогда — побудешь один день моим кавалером? Мне столько мест хочется обойти! §!"
 wg_lady.133.a:0 "£sr_wg_up£ £sr_wg_up£ §BС превеликим удовольствием§!"
 wg_lady.134.desc:0 "§PХэээ??? §!\nЮная Госпожа вскрикнула — и не успела опомниться, как оказалась в твоих крепких объятиях."
 wg_lady.134.a:0 "§BЮная Госпожа, ты мне нравишься! §!"
 wg_lady.135.name:0 "Чувство на грани цветения"
 wg_lady.135.desc:0 "Растерянная, она замерла в твоих объятиях, слушая твоё сердце; но контакт был так близок, что и оно колотилось."
 wg_lady.135.a:0 "§BЮная Госпожа… §!"
 wg_lady.136.name:0 "Объятие любимых"
 wg_lady.136.desc:0 "Ответа не было — но её свободные руки обняли тебя за спину. В этот миг вы будто понимали друг друга без слов."
 wg_lady.136.a:0 "£sr_wg_up£ £sr_wg_up£ £sr_wg_up£ £sr_wg_up£ $OK$"
 wg_lady.137.desc:0 "§PЭ? Ээ? [wsg_player_nickname.GetName]? Вста.. встань сначала, ладно? §!"
 wg_lady.137.a:0 "§BТы.. не сердишься? §!"
 wg_lady.137.b:0 "§BПростишь меня? §!"
 wg_lady.138.desc.a:0 "§PПф…… нет. И вообще, я не.. не особенно-то и думала. §!\nВидно, что-то вспомнив, она заговорила заметно тише.\n§PМм.. подарок я приму, и вот это ещё…… §!\nБеря твой подарок, она вручила свой."
 wg_lady.138.desc.b:0 "§PПф…… не сержусь. Я не.. не особенно-то и думала. §!\nВидно, что-то вспомнив, она заговорила заметно тише.\n§PМм.. подарок я приму, и вот это ещё…… §!\nБеря твой подарок, она вручила свой."
 wg_lady.138.a:0 "§BСпасибо§!"
 wg_lady.138.a.response:0 "§PМ-м…… §!"
 wg_lady.138.b:0 "£sr_wg_up£ £sr_wg_up£(протягивая руку)§B Времени вагон — пойдём прогуляемся§!"
 wg_lady.138.c:0 "(обнять)"
 wg_lady.140.name:0 "Грустная Юная Госпожа"
 wg_lady.140.desc:0 "В последнее время у Юной Госпожи в работе то и дело ошибки. В этот раз иначе: на лице явно лежит печаль — её явно что-то гнетёт."
 wg_lady.140.a:0 "Спросить"
 wg_lady.140.b:0 "Позвать прогуляться и заодно разведать"
 wg_lady.141.desc:0 "§P[wsg_player_nickname.GetName], что-то стряслось? Срочное? §!"
 wg_lady.141.a:0 "§BНе срочное; просто ты…… §!"
 wg_lady.141.b:0 "§BКак раз срочное: дело в тебе…… §!"
 wg_lady.142.desc:0 "§PЯ..? Я же сказала: всё в порядке. §!"
 wg_lady.142.a:0 "§BДа только я вижу обратное! Тем более после Грёзы Пепла…… §!"
 wg_lady.142.b:0 "§BДа только я вижу обратное! §!"
 wg_lady.143.desc:0 "§PСколько раз повторять: правда всё нормально! §!"
 wg_lady.143.a:0 "§BЯ не хочу тебя такой видеть, ясно?! §!"
 wg_lady.143.b:0 "§BТы мне дорога, ясно?! §!"
 wg_lady.144.desc.a:0 "Слова ударили её — слёзы хлынули плотиной, и она разрыдалась у тебя на груди. Чуть погодя она успокоилась и потихоньку призналась, что лишало её покоя\n— слово оное [§RОбъединённый флот§!], что была помянута Грёзой Пепла."
 wg_lady.144.desc.b:0 "Слова ударили её — слёзы хлынули плотиной, и она разрыдалась у тебя на груди. Чуть погодя она успокоилась и потихоньку призналась, что лишало её покоя\n— то, кому она принадлежала раньше. [§RКонтингенции§!]."
 wg_lady.144.a:0 "Так вот оно что."
 wg_lady.144.b:0 "И что тут страшного?"
 wg_lady.145.desc:0 "Как «вот оно что»? А вдруг.. а вдруг.."
 wg_lady.145.a:0 "(она правда волнуется за меня — как и я)"
 wg_lady.146.name:0 "Выбор"
 wg_lady.146.desc:0 "Её глаза вновь заблестели, чувства рвались наружу — и тут ты…"
 wg_lady.146.a:0 "(поцелуй в лоб)"
 wg_lady.146.b:0 "(обнять)"
 wg_lady.146.c:0 "£sr_ring£(поцелуй)"
 wg_lady.147.desc:0 "«§BЧто бы ни случилось, я защищу тебя. Ты — моя самая важная, самая особенная Юная Госпожа; потому ни в этой жизни, ни в следующей я никогда не оставлю тебя. §!»\nТы бережно вытираешь её мокрые дорожки.\n«§BТак что не плачь, ладно? Иначе у меня сердце болит§!»\n§P[wsg_player_nickname.GetName], ты…… §!"
 wg_lady.147.a:0 "£sr_wg_up£ £sr_wg_up£ £sr_wg_up£ £sr_wg_up£ §BОтныне всё мне рассказывай, ясно? §!"
 wg_lady.147.a.response:0 "§PМ; [wsg_player_nickname.GetName], обещаю. §!"
 wg_lady.148.name:0 "Не сдержать"
 wg_lady.148.desc:0 "«[wsg_player_nickname.GetName], ты……!»\nДругая рука легла ей за спину, и я притянул её; сдерживаемое чувство вырвалось — губы встретились, и это пламя я хотел хранить вечно.\nНа этот раз она не отказала."
 wg_lady.148.a:0 "§BВыходи за меня, Юная Госпожа. Этим телом, этой жизнью — к вашим услугам. §!"
 wg_lady.149.name:0 "День своеволия"
 wg_lady.149.desc:0 "Ты утряс всё что можно, откинул все дела — и в знаменитейшем парке [Root.Capital.GetName], работающем с основания государства, от души нагулялся с Юной Госпожей. Загодя договорившись с персоналом о вечернем салюте, ты привёл её на лучшую точку — ради финала дня."
 wg_lady.149.a:0 "Всё готово."
 wg_lady.150.desc:0 "§P[wsg_player_nickname.GetName], спасибо… каждый раз, каждый раз обо мне так заботишься, а я…… §!"
 wg_lady.150.a:0 "§BТы моя Юная Госпожа — своевольничай сколько влезет. §!"
 wg_lady.151.desc:0 "§PДело не в этом.. я…… §!\nВнезапно она схватила твою руку.\n§P[wsg_player_nickname.GetName], ты можешь…… обещать мне одну вещь? §!"
 wg_lady.151.a:0 "§BГовори. §!"
 wg_lady.151.b:0 "§BЧто угодно — обещаю. §!"
 wg_lady.152.desc:0 "§PОбе.. обещай: не покидай меня, ладно? Ты.. поклянись! §!"
 wg_lady.152.a:0 "(что это с ней)"
 wg_lady.152.b:0 "(это обо мне тревога?)"
 wg_lady.153.name:0 "Слово мужа — тяжелее горы"
 wg_lady.153.desc:0 "Лунный свет лег на две мокрые дорожки на её лице; она была так трогательна, что ты не удержался и спешно поклялся:\n§B«Не.. Небо и Земля — свидетели, Солнце и Луна — порука… Я.. я буду всегда с тобой!»§!\nДав ей насладиться твоим шутовским спектаклем, ты взял платок и вытер её щёки.\n§B«Так… не плачь, хорошо? Такую красавицу — и в слезах, какая растрата»§!\nИ тут на том берегу вспыхнул салют, диапроекторкой озаряя ваши лица.\nВзгляды встретились — и чувство пробило последнюю преграду; жар хлынул через край."
 wg_lady.153.a:0 "(поцелуй)"
 wg_lady.153.b:0 "£sr_ring£§BВыходи за меня, хорошо? Юная Госпожа§!"
 wg_lady.154.name:0 "Под луной, на холме — вечность сейчас"
 wg_lady.154.desc:0 "Салют догорел, жар остыл, луна снова залила землю; в тёмной долине осталась лишь пара, глядящая друг на друга. Пусть тысячи тревог не развеяны, тысячи мыслей не изжиты, тысячи слов не сказаны — но когда тепло на губах растаяло, все чувства ушли в молчание; остались лишь этот вид — и она."
 wg_lady.154.a:0 "£sr_wg_up£ £sr_wg_up£ £sr_wg_up£ £sr_wg_up£ Она рядом — и этого довольно."
 wg_lady.155.name:0 "Лишь любовь затмевает свет"
 wg_lady.155.desc:0 "Ты достал заготовленное кольцо и, на одно колено, сделал ей предложение.\n§P«[wsg_player_nickname.GetName], что ты сказал……»§!\n§B«Я сказал: выходи за меня, Юная Госпожа.»§!\nГлядя на органика на одном колене с кольцом, она на миг потеряла дар речи.\n§P«Я…….. это……..»§B «Ничего: я так и буду стоять на колене, пока ты не ответишь.»\n§P«А.. а если я откажу?»\n§B«Умереть за любовь — счастье. Я лишь хочу, чтобы оно досталось и тебе.»§!"
 wg_lady.155.a:0 "Сказано — сделано"
 wg_lady.156.name:0 "Это кольцо — этой любви"
 wg_lady.156.desc:0 "[Root.GetName] сыграло грандиозную свадьбу: жених — лучший из консулов, невеста — всенародный идол, Юная Госпожа.\n\nКак сложилась их любовь — нам неведомо, но мы желаем им от всего сердца. Империя видит рождение пары — они принесут ей новое сияние!\nИтак, жених: наденьте кольцо на безымянный палец невесты."
 wg_lady.156.a:0 "Клятва гор и морей; небо — свидетель: не разлучит ничто"
 wg_lady.157.name:0 "Урок кулинарии"
 wg_lady.157.desc:0 "Из болтовни офицеров ты узнал: Юная Госпожа давно учится у поваров готовить — и с большим азартом; ты такого энтузиазма у неё не видел и решил подсмотреть.\nНа кухне повара «сердобольно» тебя не заметили; ты же подошёл сзади и сверху глядел, как она, напевая твою песенку, мнёт тесто."
 wg_lady.157.a:0 "Юная Госпожа, что готовим?"
 wg_lady.157.b:0 "(смотреть дальше)"
 wg_lady.158.name:0 "Неестественно умелые руки"
 wg_lady.158.desc:0 "То ли у роботов безупречный контроль усилия, но тесто выходило донельзя упругим, а движения — ладными и изящными; ты так засмотрелся, что опомнился, лишь когда она смолкла."
 wg_lady.158.a:0 "Юная Госпожа, что готовим?"
 wg_lady.159.desc:0 "§PКонечно хлеб! Хлеб у органиков нарасхват. §!\nТы глянул на повара; тот сердобольно на цыпочках отошёл."
 wg_lady.159.a:0 "Для кого?"
 wg_lady.159.b:0 "Отчего вдруг захотелось?"
 wg_lady.160.desc:0 "§PДля…… органика. Он, этот тип, увидев хлеб, приготовленный старательно мной, точно впечатлится! А там… может, и задержусь с ним подольше! §!\nОна, помешивая опару, вся ушла в грёзы и не слышала тебя."
 wg_lady.160.a:0 "(хихикая)"
 wg_lady.160.b:0 "Отчего вдруг захотелось?"
 wg_lady.161.desc:0 "§PНу ты странный: я же вчера говорила; неужто забы… ор.. ор.. ОРГАНИК!? Ты что тут делаешь!? §!\nОна обернулась к «учителю» — и увидела тебя; тесто шлёпнулось обратно в миску, а щёки её, кажется, испекли бы хлеб без печи."
 wg_lady.161.a:0 "Вчера говорила — а сегодня забылся?"
 wg_lady.161.b:0 "Разумеется — посмотреть, что готовит для меня моя милая Юная Госпожа."
 wg_lady.162.desc:0 "§PЧто.. что.. чего ржёшь, ты эта бака!!! Вон!!! §!\nВ панике она выпихала тебя обоими руками; даже сквозь дверь чувствовалось её смущение и злость."
 wg_lady.162.a:0 "Прелесть!"
 wg_lady.163.desc:0 "§PТы.. ты..!!! БАКА!!!! Вон……! §!\nЕё щёки уже как спелое яблоко; она, потупившись и суетясь, пыталась выставить тебя за дверь — но сил в толчках кот наплакал, а ты лишь стоял и с умилением смотрел, как она, стискивая твою рубашку, уткнулась лбом тебе в грудь."
 wg_lady.163.a:0 "Да-да, понял (рукою по макушке)"
 wg_lady.163.b:0 "(молча улыбаясь)"
 wg_lady.164.desc:0 "§PМуууууууууууу…………! [wsg_player_nickname.GetName]…… большой злодей…… §!\nОна так и замерла в этой позе, будто время застыло; повара, почуяв тонкий момент, до ушей улыбались — небось, раз от раза прокручивали эту сценку в головах.\nНаконец она подняла голову, кулаком стукнула тебя в грудь и вернулась к тесту.\n§PВон..! И в кабинете хорошенько жди хлеба, старательно испечённого мной!! §!"
 wg_lady.164.a:0 "Понял-понял, досточтимая Юная Госпожа."
 wg_lady.165.name:0 "Юная Госпожа в «падении»"
 wg_lady.165.desc:0 "В вылазке Юная Госпожа попала в аварию; ты как раз был свободен и наведался в ремонтные доки. Она сидела на контейнере у причала, скрестив ноги, наблюдая за работами.\nТы засмотрелся — и вернулся в реальность от её нетерпеливого оклика."
 wg_lady.165.a:0 "Хм? Что?"
 wg_lady.166.desc:0 "§PЭй! Органик, чего уставился! §!"
 wg_lady.166.a:0 "Да вот, услышал о ранении Юной Госпожи — явился проведать."
 wg_lady.166.b:0 "Ничего; просто убедился: «красно-белые полосы — это справедливость»."
 wg_lady.166.c:0 "Проверяю, не пострадали ли мои бойцы."
 wg_lady.167.desc:0 "§PЯ в твоей заботе не нуждаюсь! Я сама крепость! §!\nОна с апломбом «засучила рукава», выставляя «могучие» мышцы, — и ты не удержался от смешка.\n§PТы.. ты.. чего ржёшь! Смешно, да!? §!"
 wg_lady.167.a:0 "Я прошёл спецподготовку: как бы смешно ни было — не засмеюсь. Разве что не сдержусь."
 wg_lady.167.b:0 "Я не смеюсь, правда не смеюсь (прорываясь)"
 wg_lady.167.c:0 "Ха-ха-ха-ха-ох……"
 wg_lady.168.desc:0 "§PКакие ещё полосы…… стоп.. ты…!! Органик, извращенец!!! §!\nДо неё допёрло — она вспыхнула и прикрыла юбку, вскинув кулак, будто готовясь ударить."
 wg_lady.168.a:0 "Милая."
 wg_lady.168.b:0 "Ругай ещё (умоляюще)"
 wg_lady.169.desc:0 "§PВот как — , и всё? Больше ничего? §!\nТы опешил и, склонив голову, задумался."
 wg_lady.169.a:0 "Ну что, моя досточтимая Юная Госпожа-генерал, как здоровье?"
 wg_lady.169.b:0 "А… что ещё сказать?"
 wg_lady.170.desc:0 "§P — Ничего§!\nВ голосе прозвучала обида; пока ты шёл к бойцам, она тихо проговорила — ты не расслышал.\n§PДурак. §!"
 wg_lady.170.a:0 "Уйти"
 wg_lady.171.desc:0 "§PТы!! Сдохни! Дурак органик!! §!\nУслышав твой смех, она надулась, спрыгнула и от души отбарабанила кулачками по твоей груди."
 wg_lady.171.a:0 "Ой-ой-ой! Юная Госпожа, простите!"
 wg_lady.172.desc:0 "§PТы..! Что несёшь.. дурак органик! Так я тоже радоваться не стану!! §!\nПунцовая, она спрыгнула и легонько отколотила тебя."
 wg_lady.172.a:0 "Виноват-виноват, и снова пойду~"
 wg_lady.1003.desc:0 "Гууууооо — \nГууууооо — \nВнезапно твои глаза закрыли чьи-то ладони."
 wg_lady.1003.a:0 "Кто?"
 wg_lady.1004.desc:0 "Кто я?"
 wg_lady.1004.a:0 "Э, кто бы это мог быть……"
 wg_lady.1005.desc:0 "Ты потрогал руки — "
 wg_lady.1005.a:0 "Голенькие…… м-м, точно ты, Гага!"
 wg_lady.1006.desc:0 "Ещё слово — и твои золотые ягоды расколю."
 wg_lady.1006.a:0 "…… конечно шучу, женушка"
 wg_lady.1007.desc:0 "Ну так угадай?"
 wg_lady.1007.a:0 "……"
 wg_lady.1008.desc:0 "Ты рыбачишь?"
 wg_lady.1008.a:0 "А, задремал — видать, устал в последнее время."
 wg_lady.1009.desc:0 "Так изволите сами сказать?"
 wg_lady.1009.a:0 "Простите?"
 wg_lady.1010.desc:0 "Угадывай, кто я!"
 wg_lady.1010.a:0 "Э! Да что угадывать — конечно, Аната."
 wg_lady.1011.desc:0 "Хе-хе, гляньте на его потуги."
 wg_lady.1011.a:0 "О дорогая, ради Пресвятой Девы — уберёшь руки?"
 wg_lady.1012.desc:0 "И — мя — "
 wg_lady.1012.a:0 "О господи, прости-господи, ты что, глазницы мне выковырять хочешь?"
 wg_lady.1013.desc:0 "Клянусь: заговоришь так ещё — сапогом тебе по заднице. А теперь — имя."
 wg_lady.1013.a:0 "……"
 wg_lady.1014.desc:0 "……"
 wg_lady.1014.a:0 "Вызову корешей —  (зовёт поддержку)"
 wg_lady.1015.desc:0 "Прекращай (экономь слова)"
 wg_lady.1015.a:0 "Неа, а вы реально думали — я не в курсе?"
 wg_lady.1016.desc:0 "Ты мне ещё «выкай»: твои-то фокусы — на кого рассчитаны!"
 wg_lady.1016.a:0 "Неужто, жена, ты мне не веришь?"
 wg_lady.1017.desc:0 "Что, имя жены и не вспомнить? Ты, ДД несчастный!"
 wg_lady.1017.a:0 "Дело не в ДД или не-ДД, ули доверенная!"
 wg_lady.1018.desc:0 "Хо? О-мо-си-ро-й. Ну давай поиграю. Угадаешь имя — а я тебе Тогда ставок; не угадаешь — я тебе построю что хочешь. Ну?"
 wg_lady.1018.a:0 "Ты с людьми уже не церемонишься?"
 wg_lady.1019.desc:0 "Шокируешь? Шалунишка?"
 wg_lady.1019.a:0 "Я.. я не то.. бояться должен как раз ты!"
 wg_lady.1020.desc:0 "(тон выше) Хо-хо-ха-ха, гляньте-ка — совсем расслабился. Боксёры-шмоксёры."
 wg_lady.1020.a:0 "Последний шанс: руки убрал."
 wg_lady.1021.desc:0 "А если я уберу руки, ты имя скажешь?"
 wg_lady.1021.a:0 "Конечно, женушка: слово мужа — закон."
 wg_lady.1022.desc:0 "Но га, кодо ва ру! Я обожаю говорить «нет» самоуверенным типам!"
 wg_lady.1022.a:0 "Всё так серьёзно, женушка?"
 wg_lady.1023.desc:0 "Ты хоть помнишь, сколько ломтей хлеба съел? Перечисляй прегрешения, ДД: сегодня умрёт кто-то из нас!"
 wg_lady.1023.a:0 "Тогда…… считаем до трёх — и хором назовём место первой встречи."
 wg_lady.1024.desc:0 "Ха↑ха↑ха↑ха↑ха↑ха↑ха↑ха↑, только это и смог? Ну, хадзимэ ё: ка?"
 wg_lady.1024.a:0 "1 (дрожь) — "
 wg_lady.1025.desc:0 "2 — "
 wg_lady.1025.a:0 "……"
 wg_lady.1026.desc:0 "Молимся?"
 wg_lady.1026.a:0 " Перед смертью дай сказать одно слово."
 wg_lady.1027.desc:0 "Говори"
 wg_lady.1027.a:0 "Ручки стали нежнее, Лексингтон"
 wg_lady.1027.b:0 "Грудь выросла, Венето"
 wg_lady.1028.desc:0 "Сдохни!"
 wg_lady.1029.desc:0 "Ты уже мёртв."
 wg_lady.1028.a:0 "(хрусть — )"
 wg_lady.1028.tooltip:0 "§RТебе свернули шею§!"
 neck_gg:0 "Твоя шея великолепна"
 wg_lady.10000.name:0 "Связь не установлена"
 wg_lady.10000.desc:0 "§HСерый Ветер§! не отвечает на вызов."
 wg_lady.10001.desc:0 "§HЮная Госпожа§! не отвечает на вызов."
 wg_lady.10002.desc:0 "§H[wsg_player_nickname.GetName]§! И ты уже в курсе: Контингенция вернулась! Эти машины жаждут уничтожить все цивилизации — забудем о мире.\nЯ давно отключена от их главной машины, так что на моём терминале лишь часть данных о прошлом поколении; свежую не достать. Но я заново проанализировала эти данные — будьте уверены, они надёжны и пригодятся!"
 wg_lady.10002.a:0 "Юная Госпожа — навсегда богиня."
 wg_lady.900.name:0 "Открыт наряд Юной Госпожи"
 wg_lady.900.desc:0 "Поздравляем! Вам открыт новый наряд Юной Госпожи!\nОткрыть окно связи, чтобы взглянуть?"
 wg_lady.900.a:0 "Да"
 wg_lady.900.b:0 "Нет"
 lady_vs_ai:0 "Данные Контингенции"
