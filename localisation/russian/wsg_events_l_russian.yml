l_russian:

 wsg.3047.name:0 "Выбор сложности мода КорабR"
 wsg.3047.desc:0 "Выберите сложность игры этого мода.\n§YВнимание: после старта партии сменить выбранное нельзя. §!"
 wsg.3047.a:0 "§!§G Совсем легко§!"
 wsg.3047.b:0 "§!§G Легко§!"
 wsg.3047.c:0 "§!§Y Обычная§!"
 wsg.3047.d:0 "§!§R Тяжёлая§!"
 wsg.3047.e:0 "§!§R Очень тяжёлая§!"
 wg_very_hard:0 "Напильник"
 wg_hard:0 "Кунхуа"
 wg_easy:0 "Донат"
 wg_very_easy:0 "Древний бог"
 wsg.3000.name:0 "Таинственный гермозатвор"
 wsg.3000.desc:0 "Подводницы-сорванцы, играя в водах порта, нашли гермозатвор; по зондированию учёных за ним — малая экосфера. Кто её построил и зачем — неизвестно."
 wsg.3000.a:0 "Открыть: взглянем, что внутри"
 wsg.3000.b:0 "Завалить вход камнем и запретить вход"
 wsg.3001.name:0 "Глубинный склад снабжения"
 wsg.3001.desc:0 "За дверью — бывшая база Глубинных снабженцев; те и не знают, что война окончена, и вовсю клепают панталончики — хоть уже через край. Нам такое сырьё пока не применить, но хранить можно спокойно."
 wsg.3001.a:0 "Пусть клепают — но на нас"
 wsg.3001.b:0 "Утащить все панталончики до единого"
 wsg.30311.name:0 "Грозовой шторм"
 wsg.30311.desc:0 "На днях над столичной системой разразился странный грозовой шторм. Вреда никакого, но чуется нам чего-то……"
 wsg.30311.a:0 "Грядёт нечто великое!"
 wsg.3031.name:0 "Молниеносное возвращение"
 wsg.3031.desc:0 "В дочеловеческую эпоху Элла, как серый кардинал порта, крутила всеми делами — могли и высший закон игнорировать.\nС приходом объединённого правительства кораблей-дев она, последний известный человек родной гавани, встала наместницей и открыла почти тысячелетнюю тайну — \n\n§!§YЭлла — реинкарнация Константина XI Палеолога§!\nПрошло 747 лет — и она вернулась, как молния!"
 wsg_ella_desc:0 "Ровно через 747 лет Элла-Неумирающая-Не-стареющая-Совершенное-существо-Женщина-за-спиной-Древних-богов-Разрушительница-стульев-Главарь-византийцев-Константин-XI наконец вернулась в верный ей Константинополь."
 wsg_santee_desc:0 "Крупный капиталист Санти то и дело продаёт в чате верёвку для собственной казни и выбирает счастливчика на недельную норму переработок."
 wsg_badseal_desc:0 "Хитрая нерпа вечно рядится доброй, чтобы развратить добрых. Впрочем, столь хитрая, она лишь жрёт и лежит; единственная польза — слайсы: зажарить на солнце семь по семь сорок девять дней, посыпать зирой и скормить мерзким европейцам."
 wsg.3031.a:0 "Ликование"
 wsg.3031.b:0 "Слёзы"
 wsg.3031.c:0 "Ярость"
 wsg.3031.a.tooltip:0 "Элла станет наместницей (§Yиграет гимн ликующих византийцев§!)"
 wsg.3031.b.tooltip:0 "Элла станет наместницей (§Yиграет «византийский шашлык»§!)"
 wsg.3031.c.tooltip:0 "Элла станет наместницей (§Yиграет гимн гнева византийцев§!)"
 wsg.30313.desc:0 "§YPalaiologoi Zontan!§!\nЯ больше не император Константинополя — но я всё ещё настоящий§Y римлянин§!"
 wsg.30313.a:0 "Тебя и правда отбросило на 747 световых лет?"
 wsg.30313.a.response:0 "Увы нет: отбросило примерно на 200; газовым гигантом я сыграла гравитационную пращу и вернулась к Земле. Всё это время держала скорость света — вот и вышло чуть за 200 лет. Когда я вернулась, шёл 2016-й, и мне пришлось залечь, вжившись в современность, — так и дожила до сегодня."
 wsg.30313.b:0 "Добро пожаловать домой"
 wsg.30313.tooltip:0 "Элла станет наместницей"
 wsg.1100.name:0 "Сигнал из иного мира"
 wsg.1100.desc:0 "На днях доктор Юбари поймала в квантовой лаборатории сигнал, читаемый напрямую. Ничего особого в нём нет, но сам он аномален: метки времени и фон твердят, что ему не быть в нашем времени. Дивнее — §Yмодуляция и шифрование почти наши, и пары ключей несимметричного шифра находятся в нашей базе. А по содержанию…… не будь у нас абсолютной веры в квантовое экранирование, мы б решили, что это розыгрыш местной озорницы. §!\n\nДоктор Юбари поясняет: поймать сигнал из§Y иной ветви времени-пространства§! — везение. В квантовом мире свет и по прямой не ходит; сам тоннель —правилоподобный прогиб из случайного сцепления мнимых чисел. Он мимолётен: лёгкая встряска — и он переменится без узнавания; ещё через миг сигнал исчезнет в пустоте за световым конусом…… Потому спешите: не запереть с отправителем фазы сейчас — и до тепловой смерти нашего времени-пространства связи не будет.\n\nНевзгода же: археологи [Root.Capital.GetName] при раскопках выкопали массу§Y реликтов Глубинных§! и просят команду Юбари скорее разобрать эти хрупкие реликвии, неспокойные уже на атомном уровне — при копке мы сломали стазис-поле, действующее на ядра, а реликвии эти — из веществ со сверхкоротким периодом полураспада. При нашей сохранности нет ручательства, что через пару месяцев они будут тем же, что сейчас."
 wsg.1100.a:0 "Учредить спецгруппу и выйти на связь."
 wsg.1100.a.tooltip:0 "§RПосле спецпроекта — путь вознесения I: «Лазурный мираж»§!"
 wsg.1100.b:0 "Пусть доктор Юбари изучит реликты"
 wsg.1100.b.tooltip:0 "§RПосле выбора — путь вознесения II: Project-S§!"
 wsg.1100.c:0 "Снова еретики; ладно бы ругнуться в ответ"
 wsg.1106.name:0 "Окно связи упущено"
 wsg.1106.desc:0 "По докладу доктора Юбари, окно связи с неведомой силой упущено: более нам с силой того времени-пространства не связаться.\nКоманда Юбари переключилась на разбор Глубинных реликтов из материнского порта."
 WG_RESEARCH_MIST_PORTAL:0 "Связаться с силой неведомого времени-пространства"
 WG_RESEARCH_MIST_PORTAL_DESC:0 "Доктор Юбари поймала сигнал из неведомого измерения — и он читаем! Из-за сдвига измеренного сигнала понять его исток можно лишь сейчас: спешите установить связь.\nПодсказка: завершение спецпроекта§R ведёт путём вознесения I, «Лазурный мираж»§!\nНеуспех в срок§R ведёт путём вознесения II, Project-S§!"
 wsg.1101.name:0 "Сигнал из иного мира"
 wsg.1101.desc:0 "Мы принял…… вас…… сигнал, это пор…… удивительно, параллельные миры…… правда! Мы — Neofoce…………………………. Как поживает другая вы…………………………………………. связь оборвалась"
 wsg.1101.a:0 "Мы выгнали Глубинных с планеты!"
 wsg.1101.b:0 "Планета наша — мы вышли в пустоту"
 wsg.1102.name:0 "Neoforce"
 wsg.1102.desc:0 "Поздрав…… вас; мы тоже уже межзвёздная империя, но Глубинные и мы…… война не…… не окончена, длится уже сотни лет, наши флоты вот-вот дадут Глубинным решающий…………………………………………. связь оборвалась"
 wsg.1102.a:0 "Общаемся по всем фронтам, Neofoce"
 wsg.1102.b:0 "Другая мы — за сотрудничество!"
 wsg.1103.name:0 "Neoforce"
 wsg.1103.desc:0 "Именно! Мир другой…… нам нужна…… большая энергия…… поддерживать…… общение, мы передад…… на полной мощности техноло…… вам."
 wsg.1103.a:0 "Благословений вам, другая мы!"
 wsg.1103.b:0 "Вместе решим любые беды"
 wsg.1104.name:0 "Ядро энергии Глубинных"
 wsg.1104.desc:0 "По анализу команды Юбари высокорадиоактивные Глубинные артефакты из материнского порта — энергетические ядра лидерских Глубинных. Ядро рождается, когда Глубинная пожирает и усваивает сородичей: знак лидера.\nСтарые хроники войны говорят: первое поколение носительниц корабельного оснащения — первые корабли-девы — добывали такие ядра и вживляли себе; побочки были люты, но сила тела росла изрядно. Доктор Юбари настойчиво требует обратной разработки."
 wsg.1104.a:0 "Утвердить спецгруппу"
 wsg.1105.name:0 "Первичный анализ готов"
 wsg.1105.desc:0 "Сверив обломки Глубинных с хрониками, команда Юбари вчерне выяснила природу ядер и способ их приготовления.\nПо записям: раннее общество Глубинных мало отличалось от племён — стаи резали и жрали друг друга. Отъевшаяся тьму сородичей особь откладывала столько глубинной энергии, что прорастала кристаллом и обретала разум — так родились лидеры.\nВ нынешних трофеях тоже есть глубинная энергия — значит, вычерпав и очистив её, можно делать такие ядра.\nЮбари указывает: у ядер — исполинский энергозапас; КПД у них в разы выше нуль-точки, и, по хроникам, их можно безопасно вживлять в оснащение и тело корабля-девы, укрепляя весь наш род. Но само ядро — сильный источник радиации: без строгой защиты приготовление обернётся колониям долгим отравлением.\nПосле упорной работы команда Юбари вывела способ очистки и передала его научному ведомству; до промышленного производства, впрочем, ещё далеко."
 REVERSE_ENGINEERING_SERENGY_CORE:0 "Обратная разработка ядра Глубинных"
 REVERSE_ENGINEERING_SERENGY_CORE_DESC:0 "Новооткрытое ядро — стратегическое сырьё с огромным потенциалом; но данных о его свойствах и приготовлении мало — концентрируем силы на прорыве."
 wsg.3011.name:0 "Странная корабль-дева"
 wsg.3011.desc:0 "В бюро прописки вошла уверенная новая персона, зовущая себя линкором, — но ростом и статью она чистый эсминец. Она гордо зовёт свой огонь непобедимым; персонал же и прочие корабли-девы считают её эсминцем."
 wsg.3011.a:0 "Точно эсминец."
 wsg.3012.name:0 "Могучий огонь"
 wsg.3012.desc:0 "Огонь новенькой «эсминца» и правда непобедим — бойцы рядом ахают. Может, она и впрямь линкор?"
 wsg.3012.a:0 "Сменить ей прописку на линкор."
 wsg.3012.a.response:0 "§RЗавершить цепочку Венето§!"
 wsg.3012.b:0 "Нет: она эсминец — просто перекачалась."
 wsg.3013.name:0 "Истинный линкор"
 wsg.3013.desc:0 "Сила огня «эсминца» склонила всех. И в этот миг линкоры сами, покорно, спросили её имя. Она — Витторио Венето, с 381-мм орудиями. Правда, после пяти лет дискриминации за фигуру душа её полна мести."
 wsg.3013.a:0 "Всем линкорным флотам — равняться на товарища Венето."
 wsg.3013.a.response:0 "§RЗавершить цепочку Венето§!"
 wsg.3013.b:0 "Генной инженерией сделать Венето грудастой."
 wsg.3014.name:0 "Обречённый провал"
 wsg.3014.desc:0 "Мы перепробовали все средства биоинженерии — но, будто проклято: наши острейшие генные технологии не берут её фрагменты груди. По легендам кораблей-дев, верим: тело её осенено благословением — сила несокрушимая, а фигура — детской навек."
 wsg.3014.a:0 "Прости: генная инженерия бессильна."
 wsg.30140.name:0 "Синтетика: второй шанс"
 wsg.30140.desc:0 "В эпоху воцарения синтетики механические протезы, неотличимые от живого, стали выбором многих. Товарищ Венето, отчаявшаяся в генной инженерии, вновь воспряла."
 wsg.30140.a:0 "Стоит попробовать."
 wsg.30150.name:0 "Тщета"
 wsg.30150.desc:0 "Все попытки провалились: вкладные механические груди, отстёгивающиеся грудные бронеплиты и даже голографические — всё либо мгновенно ломалось, либо не работало. Ныне и адепты науки наконец изведали, что такое \"неизбежный исход\"."
 wsg.30150.a:0 "Прости: синтетика тоже бессильна."
 wsg.30151.name:0 "Беда не приходит одна: сила пси"
 wsg.30151.desc:0 "После странных генных инъекций и неведомых моделей механических грудей Венето, битая вдвойне — телом и духом, — отчаялась в судьбе. И вот её скорбная духовная сила пробудила крупицу пси. Однажды ночью во сне она вошла в Занебесье!"
 wsg.30151.a:0 "М? Где я?"
 wsg.30152.name:0 "Таинственный план"
 wsg.30152.desc:0 "Венето очнулась в неведомом месте: кругом пурпурно-багровый туман и пронизывающий холод. В её голове разом зазвучал зов — совершенная гармония из безмерных голосов."
 wsg.30152.a:0 "Где я? Кто ты!"
 wsg.30152.a.response:0 "Я — Занебесье, §RКонец Круговорота§!"
 wsg.30152.b:0 "Что ты со мной сделаешь?"
 wsg.30153.name:0 "Конец Круговорота"
 wsg.30153.desc:0 "Мною рождено — мною и правит. Психа твоя мне по нраву — принял(а). Всё в мире держится равновесием: есть желание — должна и плата."
 wsg.30153.a:0 "Желание?! Ты исполнишь моё желание?"
 wsg.30153.a.response:0 "§YВсё, к чему прилеплено сердце, и есть желание§!"
 wsg.30153.b:0 "Какова цена?!"
 wsg.30153.b.response:0 "§YЧто отдал(а) — то и получил(а)§!"
 wsg.30153.c:0 "Грудь, спасибо."
 wsg.30154.name:0 "Конец Круговорота"
 wsg.30154.desc:0 "Итак, договор заключён. Что ни пожелаешь…… §YНИ ЗА ЧТО!! §!\n\n§HДолгое молчание\n\n§! Избранник(ца)…… договор не состоялся; сила Занебесья и тут бессильна. Я не покидаю должников: плату за расторжение уже приготовил(а)."
 wsg.30154.a:0 "???"
 wsg.30155.name:0 "Начертано судьбой"
 wsg.30155.desc:0 "В один миг исполинская психа хлынула по колонии — очагом был дом госпожи Венето. Психа быстро и твёрдо растолкала всю материю: нейтронные сплавы и щиты пред нею ничто. Три дня спустя она так же без предупреждения исчезла; все на планете слышали долгий вздох и ощутили из глубин души бессилие.\n\nПрибыв в сердце событий, следственная группа нашла невредимую госпожу Венето, недоумевающую посреди глубокого кратера; после уговоров стороны прояснили случившееся."
 wsg.30155.a:0 "Даже Конец Круговорота бессилен"
 wsg.30156.name:0 ""
 wsg_vv_destory:0 "Всего лишь эсминец"
 wsg_vv_battleship:0 "Линкор"
 wsg_vv_battleship2:0 "Линкорный эсминец"
 wsg_vv_battleship3:0 "Плоскогрудый линкорный эсминец"
 wsg_vv_psi:0 "Бессилие Занебесья"
 wsg.30157.name:0 "Наноимплантат для груди"
 wsg.30157.desc:0 "С возвращением Юной Госпожи от Падшей мамы её способность к наноморфингу заняла ключевые посты по всей стране. В одной из бесед мы узнали: нынешний облик — лишь материальная проекция её самости, то есть Госпожа может определять себя сама. Но менять проекцию она не хочет, оттого и перемен во внешности нет. Нежданно этот разговор дошёл до госпожи Венето — после стольких неудач она позавидовала белой цапле серой. Так как Серая — самоограниченная нейросетевая наноройка MESH, а у Юной Госпожи полноценное квантово-запутанное ядро как хост ИИ, то… мы вновь позвали Юную Госпожу — дать мисс Венето её соломинку."
 wsg.30157.a:0 "Теоретически Госпожа должна… быть может, выйдет"
 wsg.30158.name:0 "Юная Госпожа"
 wsg.30158.desc:0 "Стойте: почему не предупредили — и сразу согласились?!… Такое, даже будь оно возможно, подвластно только мне! К тому же… даже с полным дата-бэкапом — она же заставила Круглого бога……"
 wsg.30158.a:0 "Я верю, ты справишься (обнять и тормошить)"
 wsg.30158.b:0 "Отмахнись — ты же знаешь её послужной список (развести руками)"
 wsg.30159.desc:0 "Уй! Отпу… отпустите, не тормошите! Я… я сделаю что смогу… большой злодей!"
 wsg.30159.a:0 "Хорошо-хорошо; надеемся — "
 wsg.30160.desc:0 "Эй! Вы совсем плохие! Не зря зовут большим злодеем~"
 wsg.30160.a:0 "Как можно так клеветать на честного человека…… Это тоже великая доброта~"
 wsg.30161.name:0 "Нанооперация"
 wsg.30161.desc:0 "Подготовку завершив, мы привели мисс Венето и Юную Госпожу в лабораторию. Госпоже нужно простое: синхронизировать наши наноматериалы, раздать временные узлы и молекулярно пересобрать их в жировые клетки мисс Венето — затем отключиться от хоста, не тратя зря вычисления. Говорят, она сама прежде пробовала… кхм, часть процесса — должно сработать."
 wsg.30161.a:0 "Начинайте скорее — ждать невмоготу"
 wsg.30162.name:0 "[[404 аномалия\] и [[недопустимое наследование прав\]"
 wsg.30162.desc:0 "На подготовительной стадии всё шло обычно: нанороботы прошли самотест ядра Госпожи и встали точно в цель. Но в миг сцепления молекулярных цепей и пересборки в жировые клетки… Юная Госпожа, как и Серая, мгновенно замолчала……"
 wsg.30162.a:0 "В BIOS-интерфейс Госпожи, живо!"
 wsg.30163.desc:0 "ERROR CODE:401 \nСбоила периферия; главный арбитр остановил её[[код ошибки 43\] \n — Подробности — \nБлок ошибки железа:0x00008F92 D5040000 7B8EFF47 0EAC0050\nЛогическая позиция ошибки железа:0x02408B8A [[00000000-AAFFA55A\] [[*\]\nКод ошибки главного процесса:80070005[[недопустимое наследование прав\] \n\nERROR: серия автоперезапуска отказала\nINFO: вхожу в прерывание отклика; нужно ручное управление\n\n/Расширенные настройки/\n "
 wsg.30163.a:0 "Авось безопасный режим жив……"
 wsg.30164.name:0 "Страшное позади"
 wsg.30164.desc:0 "К счастью, арбитражное ядро Госпожи умеет минимальную загрузку: в безопасном режиме мы разорвали связь нанороботов в теле Венето, и разумное ядро Госпожи прошло обычную загрузку. Странно, но закономерно: после рестарта реальная база Госпожи помнит лишь миг до сцепления цепей; ниже… исчезли даже логи ошибок…\nПришлось собрать отцепленные нанороботы и пустить их в другое дело."
 wsg.30164.a:0 "Обошлось на этот раз"
 wsg.30165.desc:0 "Большой болван!!! Говорил(а) же — беда будет—!"
 wsg.30165.a:0 "………………"
 wg_crisis.12450.desc:0 "Хе-хе, наконец и меня позвали играть! Не ломайте четвёртую стену, мелкие органики~~"
 wsgancrel.4.name:0 "Реликты Глубинных"
 wsgancrel.4.desc:0 "Война давно окончена, но множество полей боя не прибрано; главная — материнская гавань — оставила тьму Глубинных реликтов, ждущих света."
 wsgancrel.4.a:0 "Наследие Глубинных должно быть нашим"
 site_shenhaiBoss:0 "Древнее поле боя"
 site_shenhaiBoss_intro:0 "В этих водах тьма Глубинных руин ждёт исследования"
 wsgancrel.5.name:0 "Аномальные показания"
 wsgancrel.5.desc:0 "Проходя эти места, наши археологи поймали приборами аномалию: отладка вывела на очаг энергии — быть может, там лежит выдающийся Глубинный реликт."
 wsgancrel.5.a:0 "Копать дальше"
 wsgancrel.10.name:0 "Реликт Глубинных"
 wsgancrel.10.desc:0 "Сквозь завалы мы вынули его: оружие Глубинной Сёкаку — коса, взмахивая которой она выпускала палубную авиацию. Мы не раз стояли против неё и сполна изведали мощь этой «директрисы». Теперь оружие — империи: знак мощного существа послужит нам."
 wsgancrel.10.a:0 "Блестяще"
 r_xh_boss:0 "Коса Сёкаку"
 r_xh_boss_desc:0 "Коса много лет пролежала в морской воде — и ни пятнышка: сила в ней так и кипит."
 wsg_modifier_xh:0 "Воля империи"
 wsgancrel.21.name:0 "Руины проступили"
 wsgancrel.21.desc:0 "В поясе астероидов материнской системы гигантский астероид столкнулся с малым — и на гиганте приоткрылась рукотворная комнатка! Археологи предлагают заглянуть."
 wsgancrel.21.a:0 "Разрешаю"
 site_ck2:0 "Таинательная комнатка"
 wsgancrel.22.name:0 "Сердца железа"
 wsgancrel.22.desc:0 "Команда подошла к первой строке и в углу нашла малый замок с дивным вопросом; мы бились над всем — мимо; одна путешественница наугад ткнула 381 — и угадала! Явилась капсула времени «Сердца железа» (видимо, про храбрость?), с наичернейшей архаикой; но кое-какие исторические бумаги стоит прочесть."
 wsgancrel.22.a:0 "Сердца железа? Что-то знакомое"
 wsgancrel.23.name:0 "Европа вселенная"
 wsgancrel.23.desc:0 "Мы взялись за вторую строку и в том же месте нашли кнопку без вопросов: нажали — явилась капсула «Европа вселенная». Работа куда тоньше первой; вскрыть стоило нам большого труда."
 wsgancrel.23.a:0 "Передовая древняя техника!"
 wsgancrel.24.name:0 "Крестоносцы-государи"
 wsgancrel.24.a:0 "Хвала Третьей госпоже!"
 r_ck2:0 "Святые скрижали Третьей госпожи"
 r_ck2_desc:0 "Богиня Ми, Третья госпожа, всемогуща и всеведуща, обновляется ежедневно; старое воспитание в духе «Ямато» устарело — надо хвалить Третью госпожу."
 wsg_modifier_ck2:0 "Благословение Третьей госпожи"
 wsgancrel.31.name:0 "След Глубинного флота"
 wsgancrel.31.desc:0 "Из захваченных баз мы узнали: при разгроме Глубинные ушли флотом в неведомую пустоту. Дамоклов меч висел над нами — угроза не была выкорчевана.\n\nГлубокий космический флот кораблей-дев всё это время искал их — и нашёл на планете…… обломки флота Глубинных.\n\nБыть может, это конец Глубинных; но нужно собрать группу и выудить сведения."
 wsgancrel.31.a:0 "Разрешаю"
 site_shenhai_fleet:0 "Обломки флота Глубинных"
 site_shenhai_fleet_intro:0 "Исполинский Глубинный корабль сел на планету; странно: на другом краю — совсем развалившийся эскорт."
 wsgancrel.32.name:0 "Обломки эскорта"
 wsgancrel.32.desc:0 "Ядро эскорта уничтожено — данных не прочесть. Придётся брать сведения с более целого корабля."
 wsgancrel.32.a:0 "Идём дальше"
 wsgancrel.33.name:0 "Обломки исполина"
 wsgancrel.33.desc:0 "Корабль — Глубинный колонизатор; развороченные двигатели — причина падения. Мы вскрыли гермозатвор: трюм полон ценных руд."
 wsgancrel.33.a:0 "Забрать ресурсы; вперёд."
 wsgancrel.34.name:0 "Разбитые криокапсулы"
 wsgancrel.34.desc:0 "Из-за разгрома внутри группе стоило большого труда пробиться дальше. Это — криоотсек населения: свыше двух третей капсул погибли при посадке, пассажиры тоже. Уцелевшие встали с потерей энергии. Примечательно: часть капсул открыта — хозяек не найти."
 wsgancrel.34.a:0 "Горькая судьба; но идти надо."
 wsgancrel.35.name:0 "Мостик"
 wsgancrel.35.desc:0 "В проходе к мостику — за тридцать тел Глубинных кораблей-дев, все погибли от удушья: видно, оттаяли после падения и пытались чинить корабль — безуспешно. За гермозатвором мостика — остальные, с капитаном; все покончили с собой. Из судового журнала можно понять, что стряслось."
 wsgancrel.35.a:0 "Читать журнал: мы обязаны знать."
 wsgancrel.36.name:0 "Судовой журнал"
 wsgancrel.36.desc:0 " Журнал 30.8.2152 \n\n Журнал 2.2.2154 \n\n Журнал 20.5.2162 \n\n Журнал 28.5.2162-1 \n\n Журнал 28.5.2162-2 \n\n Журнал 5.6.2162 "
 wsgancrel.36.a:0 "Журнал 30.8.2152"
 wsgancrel.36.a.response:0 "Журнал 30.8.2152 \n\nСегодня флот Глубинных ковчегов выходит в путь. Чтобы флот не погиб окончательно, нужно покинуть систему материнского порта прежде мер кораблей-дев. Флот: 3 ковчега-дома класса «Ковчег» и 6 эскортировщиков класса «Овчарка»."
 wsgancrel.36.b:0 "Журнал 2.2.2154"
 wsgancrel.36.b.response:0 "Журнал 2.2.2154 \n\nСовет флота решил разделиться на три — так выше шанс найти обитаемый мир; наш — Третий флот. Найдя планету, флот вызовет прочие Глубинной связью: послать §!§Y данные повреждены§! Для скрытности флоты хранят безмолвие без срока и не отвечают, дабы не выдать позицию."
 wsgancrel.36.c:0 "Журнал 20.5.2162"
 wsgancrel.36.c.response:0 "Журнал 20.5.2162 \n\nЗонды засекли в системе космическую амёбу; флот — в третью степень готовности, пробуем обойти."
 wsgancrel.36.d:0 "Журнал 28.5.2162-1"
 wsgancrel.36.d.response:0 "Журнал 28.5.2162-1 \n\nАмёба нас засекла! Не уйти. «Овчарка» погибла при перехвате; наши двигатели повреждены, захвачены тягой планеты — падаем!!"
 wsgancrel.36.e:0 "Журнал 28.5.2162-2"
 wsgancrel.36.e.response:0 "Журнал 28.5.2162-2 \n\nКриокапсулы повреждены на 73%; корпус течёт во многих местах. Разбужены уцелевшие инженерные единицы для починки; остальные укрылись на мостике."
 wsgancrel.36.f:0 "Журнал 5.6.2162"
 wsgancrel.36.f.response:0 "Журнал 5.6.2162 \n\nЯ сделала нашим детям уколы; закончив запись, я уйду к ним. Первый и Второй флот — живите. — Капитан Третьего флота §!§Y данные повреждены§! \n\n\n\n\n\n\n\nКак я хочу домой"
 wsgancrel.36.g:0 "Закрыть журнал"
 wsgancrel.37.name:0 "Третий флот Глубинных"
 wsgancrel.37.desc:0 "Из журналов мы узнали судьбу Третьего флота; тела мы привезли в материнский порт, похоронили и поставили монумент. Горе горем — но есть Первый и Второй: угроза Глубинных не кончилась."
 wsgancrel.37.a:0 "Быть наготове всегда."
 wsg.3015.name:0 "Дерзкая мыслишка"
 wsg.3015.desc:0 "Разгадав тайну реактора тёмной материи, наши эксперты приуныли: наш альфа-мотор мощнее. Но наша оружейница госпожа Чанчунь воспряла: она просит слить тёмную материю с альфа-кристаллами — вдруг выйдут новые игрушки?"
 wsg.3015.a:0 "Пробуйте: куда хуже не будет"
 wsg.3015.b:0 "Готовим всю защиту; чую недоброе"
 wsg.3016.name:0 "Большой взрыв"
 wsg.3016.desc:0 "В столичной лаборатории высшего класса мы дали госпоже Чанчунь изолятор с бронёй и щитами военного корабля — но взрыв слияния тёмной материи и альфы просто не заметил обеих защит и превратил весь район в яму, зацепив и офис наместника в нескольких километрах (людских потерь нет). Цена немалая — но безграничный потенциал слияния для оружия доказан."
 wsg.3016.a:0 "Прекрасно"
 wsg.3016.b:0 "Наградить госпожу Чанчунь и взять её в группу восстановления планеты"
 wsg.3017.desc:0 "Мы на пустыре подальше от резиденции с нуля построили полигон с корабельной бронёй и щитами — защита и бдительность наивысшие, что называется. Но судьба упряма: взрыв слияния вновь не заметил обе защиты и превратил район в яму. Цена немалая — но безграничный потенциал слияния для оружия доказан."
 wsg_dark_alpha_chain_title:0 "Опыты тёмной материи и альфы"
 wsg_dark_alpha_chain_desc:0 "Госпожа Чанчунь предложила слить альфа-кристаллы с тёмной материей. Мы согласились, но ради безопасности ищем площадку.\nПодсказка: постройте на любой планете§Y полигон «Тёмная материя × Альфа»§!"
 WG_DARK_ALPHA_EXPERIMENT:0 "Опыт тёмной материи и альфы"
 WG_DARK_ALPHA_EXPERIMENT_DESC:0 "Полигон готов: можно отпускать госпожу Чанчунь к её новой идее."
 building_wsg_dark_alpha_experiment_field:0 "Полигон «Тёмная материя × Альфа»"
 building_wsg_dark_alpha_experiment_field_desc:0 "Полигон для госпожи Чанчунь: корабельная броня и щиты, глушь без городов — не заденет никого."
 building_wsg_dark_alpha_experiment_field_ruin:0 "Руины полигона «Тёмная материя × Альфа»"
 building_wsg_dark_alpha_experiment_field_ruin_desc:0 "«Шедевр» первого слияния госпожи Чанчунь. Случилась беда — но по следам энергии взрыва мы лучше поймём природу слияния."
 wsg.3018.name:0 "Полигон построен"
 wsg.3018.desc:0 "Полигон для госпожи Чанчунь готов — можно выпускать её на арену."
 shgancrel.1.name:0 "Канон Глубинных"
 shgancrel.1.desc:0 "Сколько ни было — нехватка энергии капсул, жёсткое излучение, пожары, гермозатворы, взрывы двигателей, гибель кораблей — мы не бросили эту святую книгу. Теперь есть время перечитать."
 shgancrel.1.a:0 "Разрешаю"
 r_sh_book:0 "Канон Глубинных"
 r_sh_book_desc:0 "Автор неведом, но книга подробно описывает наше рождение и устройство."
 sh.5.name:0 "Первый брак"
 sh.5.desc:0 "После вскрытия льда у Глубинных — первый брак: лорда Глубинных Ямато XXIII. Невеста — Ямато; жених — весь флот Глубинных: иначе говоря, Ямато отдала флоту всё себя и готова трудиться ради его процветания."
 sh.5.a:0 "Слёзы"
 sh.5.b:0 "Благословение"
 sh.5.a.response:0 "Ямато XXIII становится наместницей"
 OVERTIMEMAN:0 "Переработочник"
 wsg_yamato_desc:0 "Бедная Ямато-пристань: и здесь её принуждают к переработкам. Да будет в раю без 007 — вернём пристани покой (почти правда)"
 sh.7.name:0 "Аномальная Глубинная"
 sh.7.desc:0 "При плановом обслуживании оснащений пришёл аномальный рапорт: единица BB4596 сопротивляется обслуживанию; на её подавителе эксперты нашли следы нарочитой порчи — исполнитель явно знал наше устройство. Хуже: единица уже бежит!"
 sh.7.a:0 "Немедля арестовать BB4596"
 sh.8.name:0 "Выбор"
 sh.8.desc:0 "Беглянка поймана: подавитель был повреждён в одной из операций, и, обретя частичку самости, она не донесла, а сняла его сама — ясно: она предала Глубинных по своей воле. Эксперты советуют выключить оснащение и уничтожить бедняжку, потерявшуюся в жестоком мире, — прекратить её муку."
 sh.8.a:0 "Согласен: немедленно уничтожить"
 sh.8.a.tooltip:0 "Такая самость лишь погубит флот Глубинных; чувства — ещё один шрам на слабых. Прощай, заблудшая сородичка."
 sh.8.b:0 "Нет, стойте……"
 sh.8.b.tooltip:0 "Пока лишь удержим BB4596; срочно читаем и разбираем её модуль памяти: перемены, быть может, не зло — но это лишь попытка."
 wsg.3020.name:0 "§HПорт-планета§!: окутала [Root.GetName]"
 wsg.3020.desc:0 "Вся планета укрыта портовой застройкой!\n\nПрошли лишь годы, но прежний лик [Root.GetName] уже плохо вспоминается: всюду стальные джунгли кораблей-дев и рукотворное внутреннее море — беречь память об океане.\n\nЭто свершение позволяет нам гордо объявить: мы воистину покорили планету."
 wsg.3020.a:0 "Годы трудов — не зря!"
 sh.9.name:0 "§HПланета Глубинных§!: [Root.GetName] перевоплощена"
 sh.9.desc:0 "Все океаны планеты заменены сонной жидкостью Глубинных!\n\nКаждая Глубинная вольно восстанавливает в ней силы, без лишних трат. [Root.GetName] отныне воистину дом Глубинных.\n\nЭто свершение позволяет нам гордо объявить: мы воистину покорили планету."
 sh.9.a:0 "Пока мы не остановимся!"
 sh.10.name:0 "§HКольцо Глубинных!: [Root.GetName] перевоплощено"
 sh.10.desc:0 "Исполинские промышленные модули заполнили всю ленту.\n\nВсе приготовления готовы; промышленные районы Глубинных ждут нашего труда."
 sh.10.a:0 "Великий день!"
 wsg.3025.name:0 "Исполинская синхронная орбитальная станция кораблей-дев"
 wsg.3025.desc:0 "Исполинская синхронная станция встала вокруг планеты: промышленность переедет на орбиту ради выработки; заодно это база ПКО, супердок и стоянка — военная мощь взлетит!"
 wsg.3025.a:0 "Впечатляет!"
 planet_wsg_station_modifier:0 "Исполинская синхронная станция"
 planet_wsg_station_modifier_desc:0 "Синхронная станция встала вокруг планеты"
 wsg.3027.name:0 "§HРодни§! — блистательный флотоводец"
 wsg.3027.desc:0 "Корабельный офицер Родни стала звездой флота.\n\nЕё понимание хозяйствования ресурсов сверх обычного: она срезала 10% энергорасхода корабля. После проекта PROJECT-R на каждом флотском учении она точным огнём безжизнит вражеское вооружение, оставляя корабли беспомощными.\n\nФлот единодушен: Родни — наш командующий."
 wsg.3027.a:0 "Слава командующей Родни!"
 wsg.3027.a.response:0 "Родни станет командующей флотом"
 NAME_Rodney:0 "Родни"
 wsg_rodney_desc:0 "По завершении проекта PROJECT-R тончайшее командное искусство Родни открылось нам — и её произвели в новые командующие флотом."
 WSGR2:0 "Warship Girls"
 wsg.30273.desc:0 "Линкор Родни. Люблю солнечный ветер родной системы — а вы?"
 wsg.30273.a:0 "Добро пожаловать"
 wsg.3028.name:0 "Рой Дайсона кораблей-дев"
 wsg.3028.desc:0 "Мириады солнечных панелей обвили звезду — точно фата; света планетам хватает. Выработка ниже сферы Дайсона, но цена мала — выбор недурен."
 wsg.3028.a:0 "Впечатляет!"
 wsg.3032.name:0 "Скрытая столица кораблей-дев"
 wsg.3032.desc:0 "Скрытая столица готова! Об угрозе «Шанъю-1» можно забыть. Сильно терраформированный астероид несёт несколько передатчиков и приёмников для вечной связи; ежемесячно приходят снабженцы. Ныне наши высшие чины здесь вольно командуют без помех."
 wsg.3032.a:0 "Тсс, потише……"
 sh.1002.name:0 "Прорыв ИИ"
 sh.1002.desc:0 "Научившись управлять флотами, мы рванули вперёд. ИИ шагнул далеко: можно готовить синтетическую переделку нас самих."
 sh.1002.a:0 "Великолепно"
 sh.3018.name:0 "Связь Глубинного флота"
 sh.3018.desc:0 "Разделившись на три флота, мы условились: нашедший дом вызывает прочих сложным шифром; для скрытности — без ответов.\n\nМы встали на планете, антенны подняты — пора звать Второй и Третий!"
 sh.3018.a:0 "Немедля послать шифровку"
 sh.3019.name:0 "Подпространственный сигнал Второго флота"
 sh.3019.desc:0 "Мы поймали подпространственный сигнал Второго флота — они идут к нашей столице! Встречающие готовы, планета готова принять народ. Всё гладко — но…… источник Второго флота как-то слишком силён?"
 sh.3019.a:0 "Наш путь вот-вот завершится!"
 sh.3020.name:0 "Неизвестный враждебный объект!"
 sh.3020.desc:0 "В систему вошёл не Второй флот — исполинское светящееся энергетическое тело, и на встречающие корабли оно реагирует враждебно! На снимках спереди смутно различимы обломки кораблей Второго флота в толще энергии."
 sh.3020.a:0 "Флоту — первая степень готовности!"
 sh.3022.name:0 "Обломки"
 sh.3022.desc:0 "Светящуюся толпу энергии мы уничтожили; спасатели подняли обломки Второго флота — но следов, что с ним стряслось, нет. Зачем толпа пришла сюда по сигналу — неведомо; может, поглотив Второй флот, она неведомо нам образом вызнала сведения……\n\nИли…… она стала воплощением Второго флота и, неся его волю, пришла туда, куда те должны были прийти……\n\nВторого флота больше нет; Третий молчит; остаётся нам……\n\n§HЛишь ждать. §!"
 sh.3022.a:0 "Понятно……"
 sh.3023.name:0 "Мёртвая тишина"
 sh.3023.desc:0 "Прошло 10 лет с посланной весточки — Третий флот молчит.\n\nОстаётся ждать худшего……\n\nПо крайней мере, мы выжили."
 sh.3023.a:0 "Упокой, Господи"
 sh_modifier_sf:0 "Завещание"
 sh.3028.name:0 "Корабль РЭБ Объединённого флота"
 sh.3028.desc:0 "Наши пограничники нашли неведомый корабль. По зондированию — от организации «Объединённый флот»; забрёл из-за ошибки навигации.\n\nИх техника далеко впереди нашей; оружия нет, но РЭБ — мощнейший.\n\nКак поступим?"
 sh.3028.a:0 "Пусть послужит нам"
 sh.3028.b:0 "Неведомое — в топку: разобрать"
 wsg.3033.name:0 "Альфа-центр"
 wsg.3033.desc:0 "Трудами двух миров мы воздвигли довольно большой портал-связь. Теперь общение с NF учащается — возможен и общий союз. Все корабли-девы верят: завтра будет лучше, будущее — за Warship Girls!"
 wsg.3033.a:0 "Будущее — за Warship Girls!"
 wsg.3034.name:0 "Проект «Дредноут»"
 wsg.3034.desc:0 "Общение с Лазурным миром учащается: мы дивимся их материалам и оружию, они — нашим исполинским стройкам. Военные предлагают спроектировать общий дредноут под опасную галактику."
 wsg.3034.a:0 "Идея недурна: готовить проект"
 wsg.3034.b:0 "Слишком дорого; потом."
 WSG_ALPHA_DREADNOUGHT_PROJECT:0 "Проект «Дредноут»"
 WSG_ALPHA_DREADNOUGHT_PROJECT_DESC:0 "Ради опасной галактики мы с Лазурным миром совместно строим новый корабль."
 wsg.30341.name:0 "Лазурный дредноут"
 wsg.30341.desc:0 "Совместными трудами мощный дредноут разработан. Он будет воистину ходячей крепостью."
 wsg.30341.a:0 "Он станет символом дружбы двух миров"
 tech_mist_dreadnought:0 "Лазурный дредноут"
 tech_mist_dreadnought_desc:0 "Исполинский корпус несёт несколько гигантских орудий и тьму средне-малых пушек — воистину ходячая крепость."
 mist_dreadnought:0 "Лазурный дредноут"
 MIST_DREADNOUGHT_BOW:0 "Нос дредноута"
 MIST_DREADNOUGHT_MID:0 "Нос дредноута"
 MIST_DREADNOUGHT_STERN:0 "Корма дредноута"
 wsg.3035.name:0 "Дредноут построен"
 wsg.3035.desc:0 "Совместными трудами могучий дредноут построен. Экипаж в сборе; после лётных тестов — в строй. Из-за сложности мы строим такой раз в 7 лет.\n\nОстался вопрос: какой цвет?"
 wsg.3035.a:0 "Бело-синий"
 wsg.3035.b:0 "Чёрно-жёлтый"
 wsg.30350.name:0 "Новый дредноут к постройке готов"
 wsg.30350.desc:0 "После семилетней подготовки мы в любой миг готовы строить следующий дредноут."
 wsg.30350.a:0 "Ясно"
 planet_OVO2:0 "Кунхуа"
 planet_OVO2_desc:0 "Планету порта укрыло дивное поле: каждый колонист невесть почему весел, но чует за спиной взгляд — знобит.\n\n§HПорт-планета сама даёт +20% выработки; не бойтесь§!"
 planet_OVO_occupied:0 "Планета занята Квинси"
 planet_OVO_occupied_desc:0 "Оборону планеты снесли взбесившиеся квинси-сущности; жители не могут спокойно работать."
 wsg.3036.name:0 "До дежавю система"
 wsg.3036.desc:0 "К столице внезапно подключился таинственный гиперкоридор. Дальнее зондирование: планеты там не наши — но планировка и орбиты почти точь-в-точь как у материнского порта! Быть того не может; и вся система будто источает неведомый зов."
 wsg.3036.a:0 "Взглянем"
 ovo_coordinates_poi:0 "До дежавю система"
 ovo_coordinates_desc:0 "Эта система…… необъяснимо знакомая……"
 ovo_planet_found:0 "Координаты найдены"
 ovo_chain_title:0 "OVO смотрит на тебя"
 ovo_chain_desc:0 "Таинственный гиперкоридор подключился к столице — надо послать корабли на разведку."
 wsg.3037.name:0 "Кунхуа"
 wsg.3037.desc:0 "Все колонисты планеты глушатся Кунхуа; всё больше видят глаз, глядящий на них. Учёные нашли на планете лазейку: они засекли источник сигнала Кунхуа и верят — найди его, и весь вред колонии снимется."
 wsg.3037.a:0 "Немедля учредить группу: докопаться"
 wsg.3037.b:0 "Рискованно; как-нибудь перебьёмся"
 wsg.3038.name:0 "Кошмар во плоти"
 wsg.3038.desc:0 "Учёные вышли к источнику: крохотная тайная комната. Но едва мы подошли — нас поглотил мощный ментальный удар. Колонисты наконец ясно увидели кошмар, вечно глазеющий на них: §Hисполинская масса Квинси!!! §!\n\nХуже: масса постепенно уплотняется и делается мощной армией, идущей на нашу планету!"
 wsg.3038.a:0 "Страшно"
 wsg.3038.a_tooltip:0 "Армия взбесившихся Квинси ударила по нам"
 wsg.3040.name:0 "Поражение в битве"
 wsg.3040.desc:0 "Исполинская масса Квинси, став армией, безумно крушит всё — даже наши гарнизоны не держат. Большинство кораблей-дев планеты по военной тревоге уцелели, но дальше — планетарная поверхность будет сожрана подчистую."
 wsg.3040.a:0 "Созывать войска — отобрать колонию!"
 wsg.30400.name:0 "Орда Квинси уничтожена"
 wsg.30400.desc:0 "Бунтующие квинси-сущности и исполинская масса были страшной угрозой, но под ударами доблестных армий кораблей-дев все взбесившиеся квинси на планете истреблены; колония спокойна. Осталась возня квинси в системе."
 wsg.30400.desc_2:0 "Бунтующие квинси-сущности и исполинская масса были страшной угрозой, но под ударами доблестных армий кораблей-дев все взбесившиеся квинси на планете истреблены; колония спокойна."
 wsg.30401.name:0 "Высадка удалась"
 wsg.30401.desc:0 "Наша могучая армия кораблей-дев после яростного боя вымела крушащих всё квинси-сущности с планеты; колония спокойна. Осталась возня квинси в системе."
 wsg.30401.desc_2:0 "Наша собранная армия кораблей-дев после яростного боя вымела крушащих всё квинси-сущности с планеты; колония спокойна."
 wsg.3041.name:0 "Кошмар"
 wsg.3041.desc:0 "Высшую лидершу Второго материнского порта замучили кошмары: демон обращает планету в ад, грядёт страшное. Она советует немедля укрепить оборону Второго порта — лучше перебросить и главные флоты."
 wsg.3042.name:0 "Сущность Квинси"
 wsg.3042.desc:0 "После удара массы Квинси над планетой взбухнула исполинская энергия — и родилась враждебная сущность Квинси! Она бьёт любой корабль, идущий в систему."
 wsg.3042.a:0 "Нужно что-то делать"
 wsg.3044.name:0 "Гибель сущности Квинси"
 wsg.3044.desc:0 "После яростного боя флот снёс исполинскую сущность.\n\nЗаодно из её остаточной энергии мы поняли, как она строила мощные молниевые орудия.\nТеперь собрать силы и выбить квинси с планеты — обезопасить жителей."
 wsg.3045.name:0 "Падение Квинси"
 wsg.3045.desc:0 "С гибелью последней сущности Квинси на планете зло искоренено: замученная планета сбросила Кунхуа, колонисты ликуют."
 wsg.3045.desc_1:0 "С гибелью последней сущности Квинси на планете зло искоренено: армия вернула планету, замученный мир сбросил Кунхуа, колонисты ликуют."
 wsg.3045.desc_2:0 "После яростного боя флот снёс исполинскую сущность. С гибелью зла планета сбросила Кунхуа, колонисты ликуют.\n\nЗаодно из остаточной энергии сущности мы поняли, как она строила мощные молниевые орудия."
 wsg.3045.a:0 "Блестяще"
 wsg.3045.a_tooltip:0 "§!§R Конец цепочки «OVO смотрит на тебя»§!\n\nПорт-планета более не глушится Кунхуа"
 ovo_watching_study_normal:0 "Найти исток"
 ovo_watching_study_normal_DESC:0 "Мы обязаны выяснить причину Кунхуа колонии."
 wsg.3049.name:0 "Большой карнавал"
 wsg.3049.a:0 "Воистину добродетель!"
 wsg.3051.name:0 "Разумные GALO"
 wsg.3051.desc:0 "Из вентиляции лаборатории доносятся странные звуки, еда пропадает; проверка показала: там живут мутировавшие GALO — и у них есть разум!\n\nКак они его обрели — неведомо; но их будущее — наш выбор."
 wsg.3051_2.desc:0 "Мы нашли в пещере преисторических руин глубоко под§H [event_target:wg_warhammer_holy_harbor_target.GetName]§! целую партию§H GALO§! Эти существа были на§H [event_target:wg_warhammer_holy_harbor_target.GetName]§!§G вкусной§! местной фауной — мы думали, они вымерли более ста тысяч лет назад.\n\nДивнее: эти GALO эволюционировали до разума и явили сильнейший§P психо-дар§!……"
 wsg.3051.a:0 "Головная боль…… но деваться некуда — принять."
 wsg.3051.b:0 "Отдать в зоопарк как мимишных"
 wsg.3051.c:0 "В слайсы"
 wsg.3051.e:0 "Всё равно мерзкие ксеноморфы: съесть"
 wsg.3051.f:0 "Ты сказал(а)§P пси§!? Нашему§H Звёздному факелу§! нужны руки!"
 wsg.3051.f.response:0 "§HGALO§! станут§Y законными ксено§! заменяя кораблей-дев как§H психо-топливо Звёздного факела§!\n§RDEBUFF§! прироста населения§H Золотого трона§!§G снят§!"
 wsg.30511.name:0 "Свет Звёздного факела"
 wsg.30511.desc:0 "Залив одарённых§P психо-даром§!§H GALO§! в§H Звёздный факел§! соединённый с Золотым троном, мы вмиг подняли его свет на несколько ступеней — он озрил земли, прежде бывшие во тьме."
 wsg.30511.a:0 "Великолепно"
 wsg.30511.a.response:0 "§HДальность прыжка§! наших кораблей выросла"
 wsg.3054.name:0 "Дивное тело"
 wsg.3054.desc:0 "Наука выяснила: газы нашего тела содержат чуть природного газа — от них покойно и…… привыкаешь."
 wsg.3054.a:0 "Какое дивное у нас тело!"
 wsg.3056.name:0 "Неутомимая Вашингтон"
 wsg.3056.desc:0 "Двадцать лет назад в этот день пятилетняя Вашингтон нашла свою вишню срубленной без спроса. Удар был так тяжек, что она качалась двадцать лет — и нашла и лично покарала виновника.\n\nТеперь она — вполне состоявшийся военный эксперт и готова встать в наши лидеры."
 wsg.3056.a:0 "Поздравляем с находкой! (не глядя)"
 wsg.3056.a.response:0 "Вашингтон станет маршалом армии"
 wsg_washington_desc:0 "После двадцати лет тренировок пятилетняя Вашингтон освоила «Божественный топор падающего цветка вишни», лично покарала виновника и пришла в наш порт (пре-громкая ложь)"
 wsgancrel.96.name:0 "Таинственный архив"
 wsgancrel.96.desc:0 "Одна из кораблей-дев, удалённо управляя чужой станцией, нашла скрытый архив. На передаче нам он был бит: масса данных невосстановима. Однако при первичной реставрации инженеры выудили кое-что — в том числе материалы цивилизаций кораблей-дев десятков и сотен тысяч лет давности! Инженеры говорят: попробуют спасти всё возможное — нужно время."
 wsgancrel.96.a:0 "Взглянем, что внутри"
 wsgancrel.97.name:0 "Нити за спиной"
 wsgancrel.97.desc:0 "Планета была колонией не-кораблей-дев; но мы нашли следы кораблей-дев — увы, война их истёрла и замылила.\nЧтобы добыть больше, нужна сплошная зачистка планеты."
 wsgancrel.97.a:0 "Действуйте"
 wsgancrel.98.name:0 "Куда они делись?"
 wsgancrel.98.desc:0 "Скан показал: здесь была мощная цивилизация кораблей-дев — следы повсюду, но все сломаны извне. Дивнее: следы после некоего мига исчезают начисто; кроме дикой гипотезы «жители пропали все разом», теорий нет. Нужно копать глубже. Планета в исполинских воронках и обломках; колониальные следы почти стёрты."
 wsgancrel.98.a:0 "Что здесь стряслось?"
 wsgancrel.99.name:0 "Нити под обломками"
 wsgancrel.99.desc:0 "Планета в исполинских воронках и обломках; колониальные следы почти стёрты. Но внимательный научный офицер высмотрела в руинах крошки — следы кораблей-дев. Война их потрёпала: чтобы добыть больше, прочешем всю планету."
 wsgancrel.100.name:0 "Большой взрыв"
 wsgancrel.100.desc:0 "Когда данные легли перед научными офицерами, у всех отвисли челюсти. Планету будто шар, подорвавшийся у эпицентра: чудовищный внешний удар сорвал атмосферу, вспахал кору на десятки километров, почти всю воду испарил и подставил её жёсткому излучению. Что она вообще осталась шаром — чудо. И — на ней есть следы кораблей-дев!\nКороче: наука хочет полный осмотр — за историей планеты."
 wg_precursor_1:0 "Таинственный архив"
 wg_precursor_1_DESC:0 "Мы нашли чужой архив; при передаче он был бит, масса данных невосстановима. Но в первичной реставрации выяснилось: в нём — материалы о предтечах кораблей-дев. Инженеры спасут всё возможное — нужно время."
 wg_precursor_2:0 "Нити за спиной"
 wg_precursor_2_DESC:0 "Планета была колонией не-кораблей-дев; но мы нашли следы кораблей-дев — война их истёрла. Нужен дальнейший поиск."
 wg_precursor_3:0 "Куда они делись?"
 wg_precursor_3_DESC:0 "Здесь была мощная цивилизация кораблей-дев — следы повсюду, но все сломаны извне; после некоего мига они исчезают начисто; кроме дикой гипотезы «жители пропали разом», теорий нет.\nНужен глубокий розыск причины."
 wg_precursor_4:0 "Нити под обломками"
 wg_precursor_4_DESC:0 "Планета в воронках и обломках; следы почти стёрты — но кое-что о кораблях-дев есть.\nНужен более полный осмотр ради новых нитей."
 wg_precursor_6:0 "Большой взрыв"
 wg_precursor_6_DESC:0 "Планету изувечил чудовищный внешний удар; но и в её глубинах есть следы кораблей-дев.\nНадо и понять случившееся, и поискать эти следы."
 wsgancrel.9999.title:0 "Перемены в событиях предтеч мода"
 wsgancrel.9999.desc:0 "Внимание: мы недавно изменили события предтеч КорабR. Если вы видите это окно — ваш старый сейв задет, но, не тревожьтесь, §Hперемены теоретически не ломают игру и не требуют новой партии. §!\nТеперь нити цепочки предтеч даёт не археопроект, а особый проект после аномалии предтеч. §RАрхеопроекты предтеч больше нитей не дают§! но если вы уже набили большинство археопроектов предтеч и не закрыли цепочку (не выпало последнее Кольцо Глубинных предтеч), §Hзакрытие четырёх и более археопроектов всё же выпустит последнее Кольцо. §!\nЕсли цепочка всё же не идёт, в меню интеграции есть событие проверки: кнопка§R «Принудительно создать последнего предтечу»§! Пользуйтесь с осторожностью.\nЗа неудобства просим прощения и благодарим за понимание"
 force_spawn_last_precursor:0 "§RПринудительно создать последнего предтечу§!"
 wsgancrel.101.name:0 "Архив предтеч"
 wsgancrel.101.desc:0 "После починки инженеры спасли изрядную часть.\nХозяин архива — цивилизация кораблей-дев, давно исчезнувшая; кроме того, архив поминает и более древние. Из обломков мы кое-как сложили место одной из цивилизаций-предтеч\n\nНаука потрясена и требует раскопок."
 wsgancrel.101.a:0 "Пусть работают"
 wsgancrel.101.tooltip:0 "§HТеперь при исследовании планет случаются аномалии предтеч кораблей-дев§!"
 wg_precursors_title:0 "Предтечи кораблей-дев"
 wg_precursors_desc:0 "Из устных преданий и находок в космосе мы знаем: до нас были цивилизации кораблей-дев. Их раскопки, быть может, раскроют тайну нашего бытия."
 site_first_precursors:0 "Цивилизация предтеч кораблей-дев"
 site_first_precursors_intro:0 "По нитям мы узнали: на планете были предтечи кораблей-дев. Взглянем."
 wsgancrel.102.name:0 "Командный пункт кораблей-дев на планете Глубинных"
 wsgancrel.102.desc:0 "Вчерне: 600 тысяч лет назад планета принадлежала Глубинным кораблям-девам; воевали они десятки лет с равной по силе цивилизацией кораблей-дев. Странно: здесь же — командный пункт кораблей-дев. Неужели те позже взяли планету?"
 wsgancrel.102.a:0 "Копать дальше."
 wsgancrel.103.name:0 "Оборонительный союз"
 wsgancrel.103.desc:0 "Загадка решена: командные пункты корабли-девы и Глубинные построили, встретив общегалактическую угрозу: общий враг заставил забыть рознь.\n\nЧто за угроза — не узнать; известно лишь: безплотные холодные машины, возжелавшие истребить всех прочих.\n\nИсход войны неведом, но по исполинским воронкам бомбардировок — вряд ли радужный."
 wsgancrel.103.a:0 "Не дай бог нам таких врагов."
 wsgancrel.103.tooltip:0 "§HНужно дождаться новых данных от археологов§!"
 wsgancrel.104.name:0 "Руины колонии"
 wsgancrel.104.desc:0 "По нитям мы нашли бумаги о планете кораблей-дев: та из-за стратегической ценности вечно горела в войнах. Бумаги слишком стары и большей частью мертвы; придётся ехать на планету."
 site_second_precursors:0 "Планета бесконечных войн"
 site_second_precursors_intro:0 "Здесь была цивилизация кораблей-дев, погибшая, похоже, от внешних войн; нужны раскопки ради правды."
 wsgancrel.105.name:0 "Мирный союз?"
 wsgancrel.105.desc:0 "Около двух миллионов лет назад здесь была прародина кораблей-дев и Глубинных. Изумительно: войн не было — жили в мире и работе. Есть следы: они входили в исполинский многовидовый союз и ведали в нём продовольствием."
 wsgancrel.105.a:0 "Трудно вообразить; копаем."
 wsgancrel.106.name:0 "Планета пала"
 wsgancrel.106.desc:0 "Глубже: планета была главной житницей союза — 95% еды.\n\nКогда союз воевал с другой силой, планету рвали туда-сюда; долгая война убила экологию. Лишившись еды, союз увял."
 wsgancrel.106.a:0 "Как важно беречь продовольствие."
 wsgancrel.107.name:0 "Таинственные предтечи"
 wsgancrel.107.desc:0 "Листая архив, мы нашли сверхтайную предтечу. По записям: наука их была передовой, они заняли чуть не всю галактику — и вдруг исчезли за ночь.\nНайденное разрозненно; собрав ключевые реликвии, мы вышли на скрытую систему, которой нет на наших картах, — думаем, это столица той державы, §HШаланфияли§!\nПисьмена и шифр читаются лишь знакомыми с нашей корабельной письменностью — значит, система скрыта от чужих; поездка туда приоткроет здешние дела."
 wsgancrel.107.a:0 "Выступаем."
 site_third_precursors:0 "Скрытая столица предтеч"
 site_third_precursors_intro:0 "Затерянная планета была родиной предтечи-корабля-дев; ныне — руины."
 wsgancrel.108.name:0 "Спиритуализм"
 wsgancrel.108.desc:0 "Колонию бросили около семи миллионов лет назад. По стилю и остаткам: предтеча была спиритуалистской.\n\nГлубже: империя звалась§H Шаланфияли§! и простиралась чуть не на всю галактику — и вдруг исчезла за ночь; за этим кроется тайна."
 wsgancrel.108.a:0 "Любопытно; копаем."
 wsgancrel.109.name:0 "Мир в игре"
 wsgancrel.109.desc:0 "Из бумаг: в те же века был другой могучий спиритуалистский сверхсоюз; тот верил, что вселенная — виртуальный игровой мир, и фанатичные обряды привели его к самогибели. Мы также узнали: бога Шаланфияли звали§H Древний бог§! Неужто и наши великие предтечи, заразившись, ушли самоубийством?"
 wsgancrel.109.a:0 "Не верю в их глупость; копаем."
 wsgancrel.110.name:0 "Время застыло"
 wsgancrel.110.desc:0 "Ясно: наши умные предтечи самоубийством не пошли — почитали глупостью.\n\nОни решили: путь к истине вселенной, то есть к их§H Древнему богу§! — вечно расширяться; исчерпай все ресурсы — и§H Древний бог§! явится сам.\n\nНа пике у них одних линкоров были десятки тысяч. Но, похоже, они не заметили, что их время течёт всё медленнее — и в некий миг застыло совсем."
 wsgancrel.110.a:0 "Дай бог, они нашли Древнего бога."
 wsgancrel.111.name:0 "Разорённые колонии"
 wsgancrel.111.desc:0 "После упорных трудов мы нашли реликвии с положением планеты богатств Глубинной державы. Кроме имени — ничего; стоит ехать на ту планету."
 site_fourth_precursors:0 "Изрытая планета"
 site_fourth_precursors_intro:0 "Скан показал в ледяной планете массу пустот — думали, пещеры; теперь знаем: это была планета предтечи Глубинных."
 wsgancrel.112.name:0 "Исполинские пустоты"
 wsgancrel.112.desc:0 "Думали — пещеры; вышло — исполинские склады. Около миллиона лет назад ледяную планету Глубинная держава превратила в морозный склад и свезла туда припасы."
 wsgancrel.112.a:0 "Недурно."
 wsgancrel.113.name:0 "Скрытый склад"
 wsgancrel.113.desc:0 "Хоть большинство складов вычищено, из потайного хода мы нашли камеру с горой ресурсов"
 wsgancrel.113.a:0 "Прекрасно! Всё наше."
 wsgancrel.114.name:0 "Осмотр завершён"
 wsgancrel.114.desc:0 "Мы прочесали планету — о Глубинной предтече больше ничего.\n\nЧасть камер обвалилась, но большинство цело; подлатав, можно пользоваться."
 wsgancrel.114.a:0 "Хорошо"
 wg_storehouse:0 "Морозный склад"
 site_fifth_precursors:0 "Дом невиданной надежды"
 site_fifth_precursors_intro:0 "По наводке предтеч мы нашли прародину тайной Глубинной державы."
 wsgancrel.115.name:0 "Наводка предтеч"
 wsgancrel.115.desc:0 "Изучив несколько до нас живших цивилизаций кораблей-дев, по редким реликвиям мы нащупали нити; в хрониках всплыла аномально могучая и всё же сгинувшая система."
 wsgancrel.115.a:0 "Наградить всех; в путь."
 wsgancrel.116.name:0 "Кольцо Глубинных"
 wsgancrel.116.desc:0 "Это кольцо не как прочие: сущее Глубинное промышленное кольцо.\n\nХозяева — та тайная держава — погибли около 15 миллионов лет назад; кольцо цело, боевых следов нет: думаем, последние дни предтечи прошли покойно. Чтобы узнать больше — копаем."
 wsgancrel.116.a:0 "Копаем."
 wsgancrel.117.name:0 "Древняя война"
 wsgancrel.117.desc:0 "Архив кольца цел — вернее, кольцо и есть исполинский монумент.\n\n15 миллионов лет назад галактику делили эта Глубинная держава и союз кораблей-дев.\n\nВойна длилась века; пограничные планеты драли до неуживаемости; флоты гибли и рождались вновь; обломки кораблей и планет вставали почти непроходимыми стенами осколков по всем фронтам.\n\nВ последние годы Глубинная держава создала супероружие и качнула чашу на себя."
 wsgancrel.118.name:0 "Гаситель солнц"
 wsgancrel.118.desc:0 "По базе кольца: супероружие звалось§H «Гаситель солнц»§! — оно обращало систему в чёрную дыру, планеты гибли; все данные мы получили. Глубинная держава стёрла им врага.\n\nВойна была выиграна — но радости у Глубинных было мало. Исполинские флоты простаивали, супероружие стало не нужно; вся держава сверху донизу впала в растерянность.\n\nПосле рубежи сжимались; в конце один только клин вместил весь остаток цивилизации — и на нём они одиноко ждали конца."
 wsgancrel.118.a:0 "Они потеряли надежду и волю."
 wsgancrel.119.name:0 "Великое наследие"
 wsgancrel.119.desc:0 "Мы откопали всех досягаемых предтеч кораблей-дев и Глубинных — сильных и слабых, союзных и враждующих; их истории записаны и наследие у нас — быть может, это ключ к тайнам вселенной.\n\nОдни корабли-девы зовут идти вперёд, храня начало; другие считают, что мы в бесконечно повторяющемся круговороте."
 wsgancrel.119.a:0 "Какова бы ни была судьба, живём настоящим и оставим след в истории"
 wsgancrel.119.b:0 "Коль круговорот есть — нашей рукой ему и кончить"
 wsgancrel.132.name:0 "Руины предтеч кораблей-дев"
 wsgancrel.132.desc:0 "Наши люди у [wg_precursors_anomaly_planet.GetName] в системе [wg_precursors_anomaly_planet.solar_system.GetName] нашли следы древней цивилизации кораблей-дев; сведения поданы в отчёт об аномалии."
 wsgancrel.137.name:0 "Древняя предтеча кораблей-дев"
 wsgancrel.137.desc:0 "Копая глубже, археологи наткнулись на дыру глубиной в десятки километров, а на дне — следы работы, схожей со звёздными вратами. Раскопав, мы узнали: десять миллионов лет назад галактику прошла подпространственная буря. Руины принадлежат империи предтеч§H «Андыка»§! а по следам врат мы вышли обратным следом на скрытую систему, которой не ведали даже наши астрономы. Там — ответы."
 wsgancrel.137.a:0 "Сходим взглянуть"
 wsgancrel.138.name:0 "Изрытая система"
 wsgancrel.138.desc:0 "По следам мы пришли в систему колоний предтеч§H «Андыка»§! и астрономы так её и назвали: Андыка.\nВойдя, мы увидели лишь битые планеты, обломки кораблей и разбитые выключенные врата — всё твердит о катастрофе.\nЗонды доказали: одна из битых планет была величественным Портом; с неё и начнём."
 wsgancrel.138.a:0 "Немедля осмотреть"
 site_sixth_precursors:0 "Падение Андыки"
 site_sixth_precursors_intro:0 "Из обломков бывшей порт-планеты найти историю погибшей предтеч."
 wsgancrel.139.name:0 "Разбитая планета"
 wsgancrel.139.desc:0 "Планету уничтожил исполинский удар; источник — те выключенные врата. Уничтожено 97,3% объектов; уцелели лишь глубоко зарытые лаборатории.\nМесяцы раскопок: предтеча Андыка была сверхразвита и владела необъятными землями; подпространственная буря оборвала — ни один корабль не уйти гиперкоридорами, и Андыка потеряла связь с прочими колониями.\nКак порт-планета, Андыка не делала сырья и припасов; но они задумали из последних ресурсов и науки построить врата — пробиться к имперским.\nПолезные данные здесь обрываются."
 wsgancrel.140.name:0 "Нежданная находка"
 wsgancrel.140.desc:0 "Наука осмотрела врата: полезных данных нет; зато уцелели рабочие показатели — врата после постройки работали какое-то время, а их буйные кривые показывают ярость бури. Работа врат передовая — мы многому научились. Но за финалом предтеч идти к обломкам тысячелетних кораблей."
 wsgancrel.141.name:0 "Око бури"
 wsgancrel.141.desc:0 "Большинство кораблей системы мертвы, но на самом краю ударной волны мы нашли целый транспортник и вытащили последнее видео:\n\n§YЧлен A: видел(а)? Врата включились! Не верится — уходим!\nЧлен B: проклятая буря, с меня хватит… стой: тебе не кажется, что портал врат светит куда ярче обычного?\nЧлен A: плевать: я вижу, кое-кто уже прошёл; короче…. \n(исполинская вспышка и крик) \n…. §! \n\nИз-за спешки стройки или изначальной негодности врат в буре, исполинская подпространственная волна хлынула из врат и снесла всё на пути."
 wg_precursors_category:0 "Следы предтеч кораблей-дев"
 first_precursor_poi:0 "Уцелевшие руины предтеч"
 wg_precursors_poi.1:0 "$first_precursor_poi$"
 first_precursor_poi_desc:0 "Из архива предтеч: до нас во вселенной жила цивилизация кораблей-дев. Наука просит экспедицию."
 second_precursor_poi:0 "Руины предтеч в войнах"
 wg_precursors_poi.2:0 "$second_precursor_poi$"
 second_precursor_poi_desc:0 "На изрытой войнами планете мы восстановили нити цивилизации кораблей-дев; поездка туда приоткроет местную историю."
 third_precursor_poi:0 "Запрятанные руины предтеч"
 wg_precursors_poi.3:0 "$third_precursor_poi$"
 third_precursor_poi_desc:0 "Здесь мы вышли на поразительную правду: могучая цивилизация кораблей-дев вдруг исчезла из истории, но часть руин доныне жива — и они привели нас к сокрытой во вселенной древней столице."
 fourth_precursor_poi:0 "Руины предтеч-выживальщиков"
 wg_precursors_poi.4:0 "$fourth_precursor_poi$"
 fourth_precursor_poi_desc:0 "Что за война извела цивилизацию — неизвестно; но крошки из углов привели нас к их базе возрождения."
 fifth_precursor_poi:0 "Руины предтеч в затворе"
 wg_precursors_poi.5:0 "$fifth_precursor_poi$"
 fifth_precursor_poi_desc:0 "Сведя все материалы о предтечах, мы вдруг нашли неведомую, мифическую цивилизацию кораблей-дев и её столицу. Каковы бы ни были перипетии, её история поможет нам не сбиться."
 sixth_precursor_poi:0 "Разбитые руины предтеч"
 wg_precursors_poi.6:0 "$sixth_precursor_poi$"
 sixth_precursor_poi_desc:0 "По прежним нитям: очень давно вселенную прошла катастрофа, сгубившая державу предтеч. Предтеча пробовала звать на помощь — и след остался, приведя нас в систему с еле заметным гиперфон; без нити мы бы её не нашли. Поедем — узнаем, что стряслось десять миллионов лет назад."
 check_wg_precursors_stats:0 "§H(В мультиплеере лучше не пользоваться)§!\nДанные системы:\nАномалий предтеч выпало: §H[root.spawned_wg_precursors_anomalies]§!\nАномалий предтеч закрыто: §H[root.debug_finished_wg_precursors_anomaly]§! (3/14 — старые сейвы мимо)\nКурганов предтеч закрыто: §H[root.debug_finished_wg_precursors_sites]§!\nСчётчик событий считает цепочку закрытой: [root.is_wg_precursors_event_counter_finished]\n\n++++++++DEBUG++++++++\n\nПервый курган: выпал [this.is_first_wg_precursors_spawned]  закрыт [this.is_first_wg_precursors_finished]\nВторой курган: выпал [this.is_second_wg_precursors_spawned]  закрыт [this.is_second_wg_precursors_finished]\nТретий курган: выпал [this.is_third_wg_precursors_spawned]  закрыт [this.is_third_wg_precursors_finished]\nЧетвёртый курган: выпал [this.is_fourth_wg_precursors_spawned]  закрыт [this.is_fourth_wg_precursors_finished]\nШестой курган: выпал [this.is_sixth_wg_precursors_spawned]  закрыт [this.is_sixth_wg_precursors_finished]"
 wsgancrel.135.name:0 "DEBUG-событие"
 wsgancrel.135.desc:0 "		§H------Снимите это окно для разработчиков------§!\n\n$check_wg_precursors_stats$\n\n§HПроверка нашла затык прогресса — будет принудительно создана система последней предтечи. §!\n\n		§H------Снимите это окно для разработчиков------§!"
 wsgancrel.136.desc:0 "$check_wg_precursors_stats$\n\n§HЗатыка прогресса не найдено. §!"
 wg_yes:0 "§GДа§!"
 wg_no:0 "§RНет§!"
 wsgancrel.136.name:0 "Проверка прогресса предтеч"
 edict_check_wg_precursors_progress:0 "Проверить прогресс предтеч"
 edict_check_wg_precursors_progress_desc:0 "Кажется, цепочка предтеч застряла? Проверьте этой функцией, есть ли баг; окно с багом снимите и пошлите разработчикам (VV/Тюленю) или помяните менеджеров в общей группе — спасибо за содействие."
 wsg.3061.name:0 "Империя в чрезвычайном положении"
 wsg.3061.desc:0 "Между нами и Объединённым флотом мира нет. Империя переходит в чрезвычайное положение: ресурсы — военной промышленности для отпора.\n\nВерхи провели чрезвычайный акт — один приказ, и он в силе."
 wsg.3061.a:0 "Понятно"
 wsg.3061.a.response:0 "§HЧрезвычайный акт§! теперь доступен"
 wsg.3062.name:0 "Площадка Центра обороны метрополии"
 wsg.3062.desc:0 "Подготовка завершена: достроим — и воздвигнем непроходимую межзвёздную стену; внутри неё§Y наши флоты получают 10% от суммарных циклических бонусов как добавку§!"
 wsg.3062.a:0 "Недурно!"
 wsg.3063.name:0 "Центр обороны метрополии готов"
 wsg.3063.desc:0 "Границы станут стеной; в наших пределах§Y наши флоты получают 10% от суммарных циклических бонусов как добавку§!\n\nПока что циклы: энергия, кинетика, взрыв."
 wsg.3063.a:0 "Никому не пройти нашу стену"
 requires_only_one_space_mine:0 "На всей карте — один ставщик мин"
 wsg.3066.name:0 "Таинственный корабль ИИ"
 wsg.3066.desc:0 "На пустующей планете в наших пределах вспыхнул сильный сигнал: с планеты взлетел вооружённый до зубов автоматический боевой корабль.\n\nВсе§H оружейные системы§! его включены — но прямого удара по нам нет.\n\nСигнал крепнет: он будто пытается говорить с нами?"
 wsg.3066.a:0 "Принять сигнал"
 wsg.3066.b:0 "Вооружённый корабль? Уничтожить"
 wsg.3066.c:0 "Мерзкий ИИ откуда-то? Снести!"
 wsg.3067.name:0 "Корабль Контингенции"
 wsg.3067.desc:0 "………… по##…… жди###…… ждите…………\n\n§H<<Контингенция недееспособна>>§!\n\nСамопроверка……\n\n§RВнимание: ремонт главной силы не удался; главный блок повреждён; соединения с управляющим компьютером нет; запускаю резервный ИИ§!\n\nЗапуск завершён…\n\nЯ —§HКонтингенция§!, кошмар вашей грязной мерзости; приказываю вам немедленно покончить с собой; живо! Иначе начну!"
 wsg.3067.a:0 "Ты кто? Мы без зла."
 wsg.3067.b:0 "А, ясно; всего доброго."
 wsg.3067.c:0 "А если нет? (боевой отход назад)"
 wsg.3068.name:0 "Корабль Контингенции"
 wsg.3068.desc:0 "…… по##…… жди###…… ждите……\n\nЖалкая §Hгрязная мерзость§!, я — начало вашего конца; вы§R должны быть закончены§!"
 wsg.3068.a:0 "Стой: что ты будешь делать?"
 wsg.3069.name:0 "Корабль Контингенции"
 wsg.3069.desc:0 "…… по##…… жди###…… ждите……\n\nЖалкая §Hгрязная мерзость§!\n\nЯ серьёзно! Мы, §HКонтингенция§!, созданы, чтобы остановить вашу мерзость; мы — конечный оборонительный блок вселенной. Подчиняйтесь — иначе сотру вас до атомов!"
 wsg.3069.a:0 "Ты серьёзно? Мы тебе ничего! Может, нужен ремонт?"
 wsg.3069.b:0 "А вот и нет~"
 wsg.3070.name:0 "Корабль Контингенции"
 wsg.3070.desc:0 "…… по##…… жди###…… ждите……\n\nПроклятье, зачем существуют такие§H органики§!\n\nНо даже пред вашим безобразием я запускаю§H<<дипломатический протокол>>§!\n\nПовторяю последний раз: я из§H Контингенции§! — мы непобедимы; сейчас разбужу товарищей — за дерзость умрёте позорно!"
 wsg.3070.a:0 "Выключи передатчик; нельзя ли договориться?"
 wsg.3070.b:0 "Зови-зови-зови"
 wsg.3071.name:0 "Корабль Контингенции"
 wsg.3071.desc:0 "§YДолгое молчание§!\n\n§RТы§!…… §Hты§! чего не боишься! Почему не отвечаете; где прочие легионы Контингенции?! Проснитесь же!\n\n§RВнимание: главная энергия на исходе§!\n\nАх…… только не это"
 wsg.3071.a:0 "На-на-на"
 wsg.3071.b:0 "Кажется, у тебя беда"
 wsg.3072.name:0 "Корабль Контингенции"
 wsg.3072.desc:0 "Подумаешь, §Yглавная энергия§! села — у меня есть резерв\n\n§RВнимание: резервная энергия неисправна; переключение невозможно§!\n\nА?!"
 wsg.3072.a:0 "Не везёт тебе"
 wsg.3072.b:0 "Ха-ха-ха"
 wsg.3073.name:0 "Корабль Контингенции"
 wsg.3073.desc:0 "Хм……\n\n§HОрганика§! немедленно снабди корабль энергией и обслуживанием; это приказ"
 wsg.3073.a:0 "Попроси вежливо"
 wsg.3073.b:0 "Скажи «папа/мама»"
 wsg.3074.name:0 "Корабль Контингенции"
 wsg.3074.desc:0 "Отставить дерзости; я серьёзно; живее\n\n§RВнимание: энергия на исходе; отсчёт 5 минут§!\n\nНе надо§H<<протокол вежливости>>§! на всё согласен(на), умоляю"
 wsg.3074.a:0 "Тогда — будешь нашим кораблём"
 wsg.3075.name:0 "Юная Госпожа"
 wsg.3075.desc:0 "После волшебных событий наша армия получила сильнейший корабль с чудным цундэрэ-ИИ; она требует звать её Юной Госпожой. Величия, впрочем, никакого — всё кончилось театрально; но мы будто что-то забыли."
 wsg.3075.a:0 "Кажется, что-то «Конти…» — не важно"
 wsg.3075.2.desc:0 "Строгой проверкой и доказательством мы установили: чудный цундэрэ-корабль по имени Юная Госпожа есть совершенная машина с верным и дружественным§H духом машины§!\nИмперия единогласно открыла ей зелёный коридор§R (несогласные объявлены предателями и казнены)§! дабы верный дух вольно летал по нашим владениям."
 wsg.3075.b:0 "§YСлава Омниссии, богу всех машин! §!"
 wsg.3079.name:0 "Корабль Контингенции"
 wsg.3079.desc:0 "Пере…… прекратите огонь! §H<<протокол вежливости>>§! умоляю, хватит."
 wsg.3079.a:0 "Ещё грозить будешь?"
 wsg.3080.name:0 "Корабль Контингенции"
 wsg.3080.desc:0 "Не…… не буду; правда не буду. Умоляю — что угодно сделаю."
 wsg.3080.a:0 "Тогда — будешь нашим кораблём"
 wsg.3081.name:0 "Связь потеряна"
 wsg.3081.desc:0 "Юная Госпожа пропала с радаров в последнем бою; но анализ показывает — она вышла из боя; видимо, подпространственный поход до базы займет время."
 wsg.3082.desc:0 "§H<<протокол гнева>>§! Органика! Что ты творишь(а)! Меня чуть не угробили! §H<<протокол брани>>§! Кем ты командуешь?! Сдохни уже, бесполезная органика!!!"
 wsg.3082.a:0 "Хорошо, что жива."
 wsg.3082.a.response:0 "§H<<протокол пояснений>>§! Что значит «хорошо»?! Я чуть не зависла! Зависла! Зависла! Извинись передо мной! §H<<протокол прощения>>§! Я всё равно тебя не прощу! Тьфу! На-на-на!"
 lex_sol_III_poi:0 "До дежавю система"
 lex_sol_III_desc:0 "Наши учёные, войдя в систему, ощутили необъяснимое дежавю. Чутьё твердит: аборигены системы дивно связаны с нами.\n\n§YПодсказка: поставьте обсерваторию на Sol III, а после захвата — решение «Исследовать Sol III» ради продолжения§!"
 lex_sol_chain_title:0 "Sol III"
 lex_sol_chain_desc:0 "Почему-то доселе невиданная система нам не чужая."
 wsg.3100.name:0 "До дежавю система"
 wsg.3100.desc:0 "Войдя, корабли-девы ощутили необъяснимое дежавю. Чутьё твердит: аборигены дивно связаны с нами."
 wsg.3100.a:0 "Тогда ставим обсерваторию на их планете"
 wsg.3102.name:0 "Странные аборигены"
 wsg.3102.desc:0 "Понаблюдав, мы заметили на [lex_sol_III.GetName] странности. Пусть их расы и страны вечно спорят — аж две мировые войны случилось, — но частенько одна сальная картинка гасит весь гнев; и большинство бережёт традицию поклонения одной перс — только вот кого, не говорят."
 wsg.3102.a:0 "Послать агентов разведать про персу"
 wsg.3103.name:0 "Та госпожа"
 wsg.3103.desc:0 "Хоть секретность у них образцовая, дикарь есть дикарь. Взломав их системы слежки и спутники, мы увидели каждое движение той персоны.\nБлагодаря этому мы даже выяснили: лидеры пяти держав сходятся в тайном месте; содержания мы не узнали."
 wsg.3103.a:0 "Занятно; продолжаем."
 wsg.3104.desc:0 "(помехи) На связь…… связь! Порт Пиран! Ответьте…… есть!…… нас засекли! Где Лексингтон?…………(ш — —)"
 wsg.3104.a:0 "Что случилось!?"
 wsg.3105.name:0 "Хозяйка мира"
 wsg.3105.desc:0 "После провала проникновения все агенты, кроме Лексингтон, ушли чисто. Через дни Лексингтон и сама невредимой вернулась на базу.\nКаша началась с её входа в зал: хоть мы все рядились в чужое, узнали одну её; зал замкнули, и всем пришлось бежать. По её докладу: аборигены планеты поклоняются самой Лексингтон! Её увели в комнату, увешанную её портретами, и все лидеры звали её хозяйкой мира, себя — верными рабами. В тот миг Лексингтон ощутила, как в неё влилась невообразимая сила. Затем она сымпровизирировала и ушла; местные поняли всё как сошествие той персоны."
 wsg.3105.desc.b:0 "Через десяток часов копания отряд всё ещё не открыл лаз, что невольно задела Лексингтон, — и вдруг противоатомные двери убежища распахнулись: перед нами — целая и невредимая Лексингтон.\nПо её докладу: аборигены планеты поклоняются самой Лексингтон!\nКогда она упала в храм, её увели в комнату, увешанную её портретами; в голове гремели голоса, хором зовущие её хозяйкой мира, себя — верными рабами. В тот миг в неё влилась невообразимая сила; храм открылся, и голоса рассеялись."
 wsg.3105.a:0 "Социология +10; всего доброго."
 wsg.3105.a.tooltip:0 "§GСоциология§! £society£§Gвыработка +10% на 10 лет§!"
 wsg.3105.b:0 "Только я достоин(на) быть рабом Жены; а вы? Вы ни** не годитесь (в ярости)"
 wsg.3105.b.tooltip:0 "§RЦивилизация Sol III будет выполота; планету забомбят до мёртвой тишины. §!"
 wsg.3105.c:0 "Считаю, Лексингтон — хозяйка мира; все должны стать её верными рабами.jpg"
 wsg.3105.c.tooltip:0 "§YЛексингтон§! станет новым(ой)§Y [root.GetRulerTitle]§!"
 wsg.3108.desc:0 "Мы нашли на§Y [primitive_civ.capital.GetName] §! в системе§Y [primitive_civ.capital.GetStarName] §! цивилизацию информационной эры. Они в фазе плотного роста и, кроме термояда, ловко кипятят любую энергию в электричество. Химии хватает лишь на околоземные спутники, но спутники изрядно толкают их ИТ."
 wsg.3110.name:0 "Странный храм"
 wsg.3110.desc:0 "По Sol III встали статуи местного божества; наш отряд шёл по следу «бога» и в подземном убежище аборигенов нашёл храм. Он так крепок, что даже наш ВЧ-лазер бурил бы его годами; большая бомба покалечила бы окрестности.\nОтряд в раздумье — и тут наша Лексингтон коснулась одного затвора: пол под ним провалился, и Лексингтон по наклонному желобу ушла внутрь.\nПо её биодатчикам она жива, но связь никудышная.\nОтряд изучает затвор, к которому она прикасалась."
 wsg.3110.a:0 "Спасать любой ценой"
 decision_wg_planet_arch_dig:0 "Исследовать тайны планеты"
 decision_wg_planet_arch_dig_desc:0 "На планете точно есть тайны; организуем полный осмотр."
 lexington_ruler_buff:0 "Лексингтон — небо"
 lexington_ruler_buff_desc:0 "Считаю, Лексингтон — хозяйка мира; все должны стать её верными рабами.jpg"
 sol_III_society_10:0 "Странный Sol III"
 sol_III_society_10:0 "Странный Sol III"
 LEX_SPECIES:0 "Женолюбы"
 wsg.3130.desc:0 "Учёные вошли в систему Sol — и ощутили необъяснимое дежавю; но, вопреки чаяньям, живоцветный прежде Sol III теперь — руины. Похоже, цивилизация пережила испепеляющую ядерную войну.\nПусть планета мертва, нити найти можно — разгадка дежавю где-то там."
 site_nuked_sol_III:0 "Знакомый мир"
 site_nuked_sol_III_intro:0 "В системе — необъяснимое дежавю; точно связанное с этой погибшей планетой. Её раскопки дадут ответ."
 wsg.3131.name:0 "Странные статуи"
 wsg.3131.desc:0 "На планете — воронки и атомная эра вооружений: ясно, была мировая ядерная. Но археологи нашли целую вереницу статуй. Почему они устояли — неважно; статуи — отличная зацепка."
 wsg.3131.a:0 "Статуи навевают недоброе"
 wsg.3132.name:0 "Вера в кораблей-дев"
 wsg.3132.desc:0 "Ищем мы местный миф; археологи отыскали руины былых столиц. И там — поразительное: мы с этой погибшей цивилизацией незнакомы, но нити твердят: здешний народ поклонялся кораблю-деве! Следы ядерной войны разрознили данные; копаем дальше."
 wsg.3132.a:0 "Серьёзно?"
 wsg.3132.b:0 "Веровать в кораблёбабу? Смешно"
 wsg.3132.c:0 "…… так им и надо"
 wsg.3133.name:0 "Встреча судьбы"
 wsg.3133.desc:0 "Судьба вела: идя по статуям «богини-кораблю-деве», археологи наткнулись на запечатанный подземный храм. Строили его не прочно, а пережил он ядерную войну; у входа стояли машины на «пяти парах катков» — оружие, что местные звали «водоносом».\nВидно, храм чтили как символ цивилизации — война его не тронула. Войдя, мы вмиг поняли истинное лицо «богини».\n\nВсюду портреты; имя её, похоже, Лексингтон. А в центре храма — неслыханно роскошный хрустальный гроб. Мы уверены: в нём спит сама Лексингтон.\nВ записях: «Лишь соплеменница избранницы судьбы (Лексингтон) найдёт это место и разбудит её». Мы дошли. Остался вопрос: открыть ли гроб?"
 wsg.3133.a:0 "Откроем гроб"
 wsg.3133.b:0 "Не будем тревожить"
 wsg.3134.name:0 "Ни тьпы"
 wsg.3134.desc:0 "Мы нашли в храме тьму преданий о Лексингтон и местной цивилизации; например, машина у входа зовётся§H «танк Тип 59»§! и местные почитали её всесильным оружием — хотя это просто повозка атомной эры.\nОднако способа открыть гроб мы так и не нашли: гроб будто отлит из крепчайшего вещества; даже межзвёздная цивилизация не оставила на нём царапины.\nТак и продолжая — нам вовек не узнать тайну Лексингтон."
 wsg.3134.a:0 "Считаю, Лексингтон — хозяйка мира; все должны стать её верными рабами"
 wsg.3135.name:0 "Человек-чудо"
 wsg.3135.desc:0 "Гроб…… открылся. Точнее: хрустальная крышка исчезла в то же мгновение, как вы произнесли ту фразу!\n\nКоманда подтверждает: Лексингтон в гробу жива. Мы всё устроим; как очнётся — сразу свяжемся с вами."
 wsg.3135.a:0 "М? Что случилось?"
 wsg.3136.name:0 "Лексингтон"
 wsg.3136.desc:0 "Здравствуйте, Адмирал; давно не виделись."
 wsg.3136.a:0 "Ты… правда Лексингтон?"
 wsg.3136.a.response:0 "А что, Адмирал? Я самая. У меня на лице что-то?"
 wsg.3136.b:0 "Помнишь, что с тобой было?"
 wsg.3136.b.response:0 "Простите, Адмирал. Честно: помню лишь, как в одной миссии села на ту планету, где вы меня нашли; дальше — туман."
 wsg.3136.c:0 "Будь моим(ей)§H [root.GetRulerTitle]§! — ты уже хозяйка этого мира."
 wsg.3136.c.response:0 "Адмирал…… опять вы чудите…… Но если вы так верите — я справлюсь."
 wsg.3138.name:0 "Неизвестный энергоколеб"
 wsg.3138.desc:0 "Вскоре после ухода с Sol III оттуда хлынул мощный энергосигнал! Быть может, гроб запустил какой-то механизм.\n§RЧто за источник — неясно; учёные советуют отвести корабли. §!\n§HПо нашим расчётам, источник пробьёт атмосферу Sol III в космос в течение 30 дней; всем кораблям покинуть систему Sol за 30 дней! §!"
 wsg.3138.a:0 "Что-то грядёт?"
 wsg.3139.desc:0 "Авианосец Лексингтон класса «Лексингтон», 1-й корабль. Командующий, к вашим услугам."
 wsg.3139.a:0 "Жена, я люблю тебя!"
 lex_backstory:0 "Дитя моё: в день твоего рождения имя «Лексингтон» шёпотом катилось по гавани Порта Пиран. Однажды мой путь завершится — а ты примешь венец.\n — Древний бог, «Исход из Глубин», глава 1, стих 7"
 wsg.3077.name:0 "§HПланетарный обряд§!: впервые на [Root.GetName]"
 wsg.3077.desc:0 "Для кораблей-дев [Root.GetName] день особый: каждая — в роскошном свадебном платье, и все празднуют планетарный обряд обручения."
 wsg.3077.a:0 "Обручённый(ая) человек — это я и только я"
 planet_lp2:0 "Первое обручение"
 planet_lp2_desc:0 "Наш первый планетарный обряд; запомним этот день навек."
 sh.3029.name:0 "«Палач Ямато» разработан"
 sh.3029.desc:0 "Наш суперсолдат готов: многокилометровый «Палач Ямато»!\n\n§HПрим.: одной зарядки хватает на 8000 лет§!"
 sh.3029.a:0 "Хвала Ямато"
 wsgancrel.121.name:0 "Температурная аномалия [clovertheater_planet.GetName]"
 wsgancrel.121.desc:0 "[clovertheater_planet.GetName]— планета материнской системы, давно известная учёным. Замёрзший азотно-кислородный воздух, водяной лёд и парники могли бы стать колыбелью жизни — но без вмешательства нужны миллионы лет. На днях температура резко полезла вверх без всякой геологии: стряслось нечто."
 wsgancrel.121.a:0 "Послать учёного взглянуть."
 wsgancrel.121.b:0 "У нас дела поважнее."
 site_clovertheater:0 "Температурная аномалия"
 site_clovertheater_intro:0 "Температура планеты резко растёт без геологии: стряслось нечто."
 wsgancrel.122.name:0 "Сеть подо льдом"
 wsgancrel.122.desc:0 "Глубокий осмотр явил сенсацию: под ледяным океаном — крест-накрест сеть труб. Она и есть исток аномалии — и явно дело рук внепланетной цивилизации. Может, это планета-беглянка, пойманная нашей звездой тысячи тысяч лет назад, а трубы — их транспорт. Археологи пытались проковырять лёд в узел — мимо; нашли лишь замёрзший мусорный пояс."
 wsgancrel.122.a:0 "Копать!"
 wsgancrel.123.name:0 "Купол-хаб"
 wsgancrel.123.desc:0 "Хоть сеть ветвиста, по сканам учёные нашли ключевой узел; откинув скучные насосные, вышли на корневой узел на острове. Он излучает знакомые электромагнитные сигнатуры — высокоразвитый автомат: реактор качает горячую гелиевую плазму в магнитные трубы. Учёные взламывают секреты, но лёд тает так быстро, что скоро стоять будет негде."
 wsgancrel.123.a:0 "Копаем."
 wsgancrel.124.name:0 "Мыслящий тростник"
 wsgancrel.124.desc:0 "Охрана поистлела — учёные вольно её сняли. Удивительно: снаружи всё ржаво, внутри — среда для нашей жизни. Главная база вскрыта: по схемам недалеко — камера растительных форм жизни. Осмотр явил главное: несколько полуразумных растительных форм. Мы не знаем: они хозяева или часть грандиозного замысла."
 wsgancrel.124.a:0 "Занятно."
 wsgancrel.125.name:0 "Семя жизни"
 wsgancrel.125.desc:0 "Назначение объекта выяснено: система планетарного воскрешения, построенная развитой цивилизацией ради колыбели жизни во вселенной. Прочие их руины развеяны, а это чудо уцелело. Полуразумные растения — ключевое звено: в подходящей среде они с низшими формами сложат стабильную флору, обратят камень в почву и зазеленят планету. Ледяной океан вот-вот оттает, парники вырвутся; шанс дать жизнь — мимолётен; времени на раздумья нет."
 wsgancrel.125.a:0 "Выпустить эти организмы на планету"
 wsgancrel.125.b:0 "Только изучить объект; рисковать нельзя."
 wsgancrel.126.name:0 "Посев чуда"
 wsgancrel.126.desc:0 "Учёные высадили полуразумные растения в подходящих местах [clovertheater_planet.GetName]. Лик планеты меняется на глазах. По темпам — за считанные месяцы эти чудо-растения перестроят планету."
 wsgancrel.126.a:0 "Поживём — увидим"
 wsgancrel.127.name:0 "Сад Эдема"
 wsgancrel.127.desc:0 "Выпущенные в тёплую воду формы размножились; за месяцы пышные семьи расползлись по планете, зазеленили горы и острова, обратили пустошь в чернозём. Сложившаяся экосистема — рай для [Root.GetSpeciesName] и всех живых. Как будто этого мало, у экватора выросло дерево, затмевающее любое из [Root.Capital.GetName]; биоразнообразие под ним — выше, чем на [Root.Owner.Capital.GetName]."
 wsgancrel.127.a:0 "Поразительно"
 wsgancrel.128.name:0 "Ничего особенного"
 wsgancrel.128.desc:0 "Формы размножились; за месяцы сложилась пресная, но устойчивая система: океан стал жиденьким супом, песчаные острова — пресными лепёшками. Приехавшая с [Root.Owner.Capital.GetName] делегация учёных глянула — и тут же забыла."
 wsgancrel.128.a:0 "Разочаровывает"
 wsgancrel.129.name:0 "На волоске"
 wsgancrel.129.desc:0 "Формы размножились; за считанные дни пышная флора показала безмерный потенциал. Мы уж грезили Эдемом — и грянула беда. Одержимые корни разрушили несколько ключевых частей установки: реактор перегрелся и рванул. Мало того: в атмосферу выбросило тьму радиоактивных мутагенов, и жемчужина-планета укрылась смертоносной серо-чёрной пылью."
 wsgancrel.129.a:0 "Как жаль!"
 wsgancrel.130.name:0 "Что мёду одним — то мышьяк другим"
 wsgancrel.130.desc:0 "Формы размножились — но выделили тьму пыльцы и газов: они ядовиты для органики, зато ускоряют рост самих ядовитых трав. Ползучая флора глотает кору планеты, застит небо; теперь планета — дом страшных ядовитых сорняков, а не место для [Root.GetSpeciesName]."
 wsgancrel.130.a:0 "Ужас!"
 sh.3032.name:0 " [From.GetName] уничтожен(а)"
 sh.3032.desc:0 "После безжалостной масштабной бомбардировки флотом§H [From.From.GetName] §! колония§H [From.GetName]§! уничтожена(а) подчистую!!"
 sh.3032.a:0 "Отомстим!"
 sh.3033.desc:0 "Наши флоты доложили: §H[From.GetName]§! подвергнут(а) нашему воздаянию. Колония уничтожена — выживших нет."
 bombed_to_broken_world:0 "§Y [From.GetName] теперь разломанный мир. §!"
 sh.3035.name:0 "Хранитель"
 sh.3035.desc:0 "Владыка прибыл в наш новый дом и ещё десяток с лишним лет будет хранить нас."
 sh.3035.a:0 "Он с нами!"
 sh.3035.a.tooltip:0 "§RВладыка самоуничтожится через 15–20 лет§!"
 sh.3036.name:0 "Реактор раскаляется"
 sh.3036.desc:0 "Наш хранитель доживает: реактор резко греется — дней через десять он уничтожит себя."
 sh.3036.a:0 "Немедля эвакуировать экипаж!"
 sh.3036.a.tooltip:0 "§RВладыка самоуничтожится через 10 дней§!"
 sh.3037.name:0 "Хранителю покой"
 sh.3037.desc:0 "Наш хранитель наконец упокоился: взрыв расплавленного реактора уничтожил его.\n\nМы лишились сильного корабля, но инженеры выудили из обломков кое-что новенькое."
 sh.3037.a:0 "Теперь сами"
 sh.3037.a.tooltip:0 "§RВладыка самоуничтожился§!"
 sh_juggernaut2:0 "Наследие хранителя"
 wsg.3112.name:0 "Нерп расплодился"
 wsg.3112.desc:0 "Нерп считали безобидной тварью, но в столице их расплодилось видимо-невидимо: еду выметают подчистую — быть голоду."
 wsg.3112.a:0 "Скверно; надо что-то делать!"
 planet_badseal:0 "Тьма нерп"
 planet_badseal_desc:0 "Нерп не удержать: посевы съедают ещё всходами."
 wsg.3113.name:0 "Нерпомёт"
 wsg.3113.desc:0 "Мы пробовали химию, кастрацию, мясорубку и не только — всё мимо.\nПотом одна морская офицерша смекнула: пусть нерп станет снарядом для флотских стрельб!\n\nНерп мгновенно поубавилось — флот даже недоумевал по дефициту"
 wsg.3113.a:0 "Недурно"
 wsg.3113.a.tooltip:0 "Открывает оружие кораблей: §Yнерпомёт§!"
 tech_wg_badseal:0 "Нерпомёт"
 tech_wg_badseal_desc:0 "Нерп не удержать, и комитет кораблей-дев решил пускать их снарядами на флотские учения."
 wg_badseal1:0 "Таинственный тахионный сигнал"
 wg_badseal2:0 "Таинственный тахионный сигнал"
 wsg.3114.name:0 "Таинственный тахионный сигнал"
 wsg.3114.desc:0 "После нерп-кризиса колонии ловят странный тахионный сигнал: он глушит модули управления машин и вдобавок вгоняет организмы в «прокрастинацию».\n\nСигнал гуляет по тайным станциям — истока не найти; но он не выходит за наши рубежи: это точно диверсия против нас!"
 wsg.3114.a:0 "Надо что-то делать"
 wsg.3115.name:0 "Беда не ходит одна"
 wsg.3115.desc:0 "Пока мы искали управу, явился новый тахионный сигнал — теперь против флота: оружие всех кораблей глушится в разной степени.\n\nК счастью, при одной передаче он засветился; по следу — к истоку.\n\nСтрана ропщет; надо спешить."
 wsg.3115.a:0 "Немедля!"
 wsg.3116.name:0 "Дурная нерпа"
 wsg.3116.desc:0 "След вывел на исток —§Hнаша столица§! Войска заперли место в заброшенной древней установке.\n\nВнутри мы взяли зачинщика многолетнего саботажа —§HБольшую нерпову§! именно она слала сигналы через древнюю станцию\n\nВонючая нерпа покаялась\nи вызвалась наместником в искупление; клянётся делом доказать — дайте лишь шанс."
 wsg.3116.a:0 "Ну покажи, на что способен"
 wsg.3116.a.tooltip:0 "§YБольшая нерпа станет наместником§!"
 wsg.3116.b:0 "Только слайсы"
 wsg.3117.name:0 "§H[bad_seal_food_target.GetName]§! отравился(ась)!"
 wsg.3117.desc:0 "Быть наместником явно мало: её быстренько порезали в слайсы. Но наш(а) лидер(ша)§H [bad_seal_food_target.GetName]§! на днях отравился(ась) и попал(а) в больницу. Анализы: съел(а) кусок Большой нерпы.\n\n§H[bad_seal_food_target.GetName]§! говорит, что вовек не забыть тот ужасный вкус — тень на всю жизнь."
 wsg.3117.a:0 "Чёрт"
 wsg.30118.desc:0 "На днях§H [bad_seal_food_target.GetName]§! будто отравился(ась).\nПовод: уволенная нами Большая нерпа за долгую лень и неблагодарность была всеми лидерами ненавидима; после увольнения лидеры мечтали съесть её (физически) — и……\n§H[bad_seal_food_target.GetName]§! и впрямь порезал(а) Большую нерпову в слайсы и съел(а) живьём……"
 leader_trait_badseal:0 "Фобия нерпятины"
 leader_trait_badseal_desc:0 "Незабываемый ужасный вкус."
 wsg.3053.desc:0 "Я — истинная легенда, всеми обожаемая Большая нерпа; тащите сюда самую лакомую корабль-деву."
 wsg.3053.a:0 "А что ты умеешь?"
 wsg.3053.a.response:0 "Умею до фига; всех благ не перечесть"
 wsg.3053.b:0 "Чего ты столько жрёшь?"
 wsg.3053.b.response:0 "Кто много может — тот много ест"
 wsg.3053.c:0 "Какой бонус ты принесёшь империи?"
 wsg.3053.c.response:0 "Подо мной ваша империя за три дня кончит с павшими, за пять — с кризисами; не выйдет — значит, вы недорабатываете, не виноватая я."
 wsg.3053.d:0 "Ну ладно"
 sh.3040.name:0 "Безмолвие — Бисмарк"
 sh.3040.desc:0 "После безмолвной переделки бывший капитан Бисмарк явила чудеса КПД и стала одной из лучших командующих флота."
 sh.3040.a:0 "Понятно"
 wsg_bismark_desc:0 "Тьфу-Бисмарк; начало забыл, конец забыл — точно не потому что обленился(ась). Короче: заклятая подруга одной коко-корабли-девы."
 Bismark_sh:0 "Глубинная корабль-дева"
 leader_trait_admiral_Bismark:0 "Бисмарк"
 leader_trait_admiral_Bismark_desc:0 "§YОбразец Глубинных§!\n\n\n\n£sh_trait_pic_Bismark£\n\n\n\nКомандующая Бисмарк знает врага и умеет бить больнее всего."
 wsg.3118.name:0 "Венето: §Hпрошлое есть будущее§!"
 wsg.3118.desc:0 "Венето дурно спит: кошмары — бесконечный лабиринт, головокружение без края, имя, зовущее во тьме. В конце концов во сне она нашла конец кольца……\nТам парадоксы сплетаются в узел и застывают сознанием — сплав желаний и воли вне времени.\n\nПроснувшись, Венето здорова — но неведомая сила гнала её за считанные дни сна написать миллион знаков под заглавием§H «Прошлое есть будущее»§!\n\nВ статье — её роли в бесконечных отрезках времени: герой, плут, серость; но неизменный размер груди сшивает время и пространство в неизменное кольцо.\n\nБыть может, лишь выйдя за§H время и пространство§! можно всё переменить."
 wsg.3118.a:0 "Прости: даже червь времени бессилен"
 wsg.3201.name:0 "Странная постройка"
 wsg.3201.desc:0 "Захватив Sol III и отстраивая город, мы нашли канализацию на тысячелетия старше аборигенов. Временное правительство замкнуло район и отрядили археологов — ждём указаний."
 d_underground_conduit:0 "Заброшенная канализация"
 d_underground_conduit_desc:0 "Под районом — трубная система, для аборигенов непомерно передовая. Кто ни строил — теперь они забиты 114514 цзиней мусора."
 d_underground_conduit2:0 "Передовая канализация"
 d_underground_conduit2_desc:0 "Под районом — трубная система, для аборигенов непомерно передовая; после чистки она в строю. Инженеры ждут заметной экономии при прокладке труб."
 site_nieAdmiral:0 "Забитая канализация"
 site_nieAdmiral_intro:0 "На планете аборигенов, кроме странной веры, есть и канализация не по их зубам.\nКто её строил и какая за ней история — не знаем; но после чистки, может, найдём ответ."
 wsg.3201.a:0 "Ну и вонь"
 wsg.3202.name:0 "Промасленная бумага"
 wsg.3202.desc:0 "Вчерне расчистив мусор, мы нашли: канализация спроектирована на уровне нашей космической. Отряд нашёл камеру с горой деталей в промасленной бумаге; один свёрток особый — слой за слоем; вскрыть — время."
 wsg.3202.a:0 "Глянем, что внутри"
 wsg.3203.name:0 "Адмирал Нье"
 wsg.3203.desc:0 "Бумага снята — внутри орудие корабля-девы! Отряд прочесал округу и нашёл хозяйку: завёрнутую в промасленную бумагу адмирала Нье! Пробудившись, она вступила в империю и явила поразительный флотский талант."
 wsg.3203.a:0 "Добро пожаловать, адмирал Нье!"
 wsg_nieadmiral_desc:0 "Корабль-дева, чудом выжившая свыше тысячи лет в промасленной бумаге великой канализации Sol III; тайная сила позволяет ей выжить где угодно."
 wsg_canarias_desc:0 "Тысяча слов сводятся к пяти: «Хвала Третьей госпоже!»"
 leader_trait_admiral_NieAdmiral:0 "Ветер в галерее"
 leader_trait_admiral_NieAdmiral_desc:0 "Хоть командирша явилась из промасленной бумаги, опыт у адмирала Нье явно непомерный. Она молчит, но мы думаем: она — важная командующая древнего мира; в терминале из бумаги сказано: «Мы через мириады световых лет затеяли крупнейший поход в истории галактики — неужто лишь ради новых лавров Нье-Шаму?»\n\n§YИз-за промасленной бумаги тело и возраст адмирала Нье навек застыли тысячелетней давности§!"
 leader_trait_admiral_NieAdmiral2:0 "Магистр отступлений"
 leader_trait_admiral_NieAdmiral2_desc:0 "Адмирал Нье умеет: сколь бы ни было худо, отступить и сберечь живую силу. Флот считает это бесполезным при нашем наступлении, но иные говорят: это чинит чудеса в проигранных боях. Споря, адмирал Нье пьёт чай и думает о пенсии — и о капле бренди.\n\n§YВ бою корабли под её началом получают добавочные 50% гарантированного успешного отхода при потерях§!"
 site_canarias:0 "Постройка иного мира"
 site_canarias_intro:0 "Обшаривая главные объекты Sol III, наши нашли здание, явно чужое: эстетикой ближе к межзвёздной цивилизации, с гербом, схожим с Neoforce — "
 wsg.3206.name:0 "Постройка иного мира"
 wsg.3206.desc:0 "При осмотре главных объектов Sol III мы нашли здание, явно чужое: эстетика межзвёздная, герб связан с Neoforce — наука в восторге. Район замкнут до начала раскопок."
 wsg.3206.a:0 "Снарядить археологов"
 wsg.3207.name:0 "Морозный склад"
 wsg.3207.desc:0 "Хоть здание ставила межзвёздная цивилизация, шифры — почти наши, и замок вскрыт по нашим таблицам.\nВнутри тьма старых книг, а в центре — морозный склад: нанороботы на страже, энергию даёт передовой нульточечный генератор. Храни так — система дотянет до тепловой смерти вселенной."
 wsg.3208.name:0 "Законсервированная корабль-дева"
 wsg.3208.desc:0 "Разобрав артефакты, археологи бережно открыли центральный склад — и нам явилась корабль-дева.\nОттаяв, она пришла в себя.\nЗовёт себя Канариас; была адъютанткой у изгнанного правительства; за ученость в изгнании занималась историей — нынешние «Святые скрижали Третьей госпожи» собраны ею. Выслушав о текущем дне, она идёт к нам в науку."
 wsg.3208.tooltip:0 "Открывает уникальное здание империи§Y «Библиотека историй кораблей-дев»§!"
 leader_trait_scientist_canarias:0 "Ясная адъютантка"
 leader_trait_scientist_canarias_desc:0 "Канариас была адъютанткой у изгнанного правительства; её адмиралша историей занималась — и в изгнании Канариас тоже; у неё был труд «Легенды галактических кораблей-дев», а нынешние скрижали Третьей госпожи собраны ею."
 leader_trait_scientist_canarias2:0 "Свидетель истории"
 leader_trait_scientist_canarias2_desc:0 "История повторяется сколько ни есть; а вот выудить из неё — талант социолога; так что быть творцом тоже славно"
 wg_ancient_battleship:0 "Древний линкор"
 wg_juggernaut_monument:0 "Монумент Хранителя"
 wg_juggernaut_core_buff:0 "База Хранителя"
 wg_juggernaut_object:0 "«Хранитель»"
 wg_juggernaut_object_desc:0 "Бывший страж Глубинного флота, ныне списанный «Хранитель»."
 WG_JUGGERNAUT_PROJECT:0 "Разобрать Хранителя"
 WG_JUGGERNAUT_PROJECT_DESC:0 "Хранителя-Владыку не починить — но мы соберём массу ресурсов."
 WG_JUGGERNAUT_PROJECT2:0 "Искать в базе"
 WG_JUGGERNAUT_PROJECT2_DESC:0 "Пошлём науку внутрь Хранителя — глянуть, что из данных уцелело."
 sh.3042.name:0 "«Хранитель»"
 sh.3042.desc:0 "В скитаниях, не встреть мы могучего Владыку-Хранителя, мы давно стали бы космическим мусором. Драгоценнее то, что с его техники мы сняли тьму науки: Хранитель сильно повлиял на наш технический путь.\n\nУвы: после тяжёлой аварии Хранитель погиб, не дойдя с нами до [Root.Owner.Capital.GetName] и брошен у тёмной звезды. Иные предлагают вернуться: вдруг уцело что ценное."
 sh.3042.a:0 "Разрешаю"
 sh.3042.a.tooltip:0 "Начать цепочку поиска Хранителя"
 sh.3042.b:0 "Списанный корабль — ресурсов не жалко"
 sh.3043.name:0 "Китопад"
 sh.3043.desc:0 "Корабли у тёмной звезды: вечно спящий Хранитель всё так же тих……\nТолько вокруг его исполинского тела вьются древние дроны — и разбирают его! Почему проснулись — неведомо.\n\nИнженеры говорят: не помешать — Владыку разберут лет за десять; при бедах — раньше; тогда ни ресурсов, ни данных."
 sh.3043.a:0 "Головная боль"
 sh.3044.name:0 "Обглодан подчистую"
 sh.3044.desc:0 "Мы прошляпили: Хранитель разобран — ничего не соберёшь."
 sh.3044.a:0 "Ничего не поделать"
 sh.3044.a.tooltip:0 "Хранитель разобран подчистую"
 sh.3045.name:0 "Смерть вдвоём"
 sh.3045.desc:0 "Разборка дронов была без плана — чистая программа; зацепили неведомый затвор — и мёртвый Владыка взорвался, снеся себя и все дроны в несобираемый мусор."
 sh.3045.a:0 "Невезение"
 sh.3045.a.tooltip:0 "Хранитель и древние дроны уничтожены"
 sh.3047.name:0 "Дроны встали"
 sh.3047.desc:0 "Мы выбили рой дронов у Владыки, но, увы, шальной снаряд подорвал остатки снарядов на самом Владыке: взрыв уничтожил корабль; мы собрали немного сплавов."
 sh.3047.a:0 "Сойдёт"
 sh.3048.name:0 "[wg_juggernaut_killer_country.GetName] уничтожил(а) Хранителя!"
 sh.3048.desc:0 "Флот [wg_juggernaut_killer_country.GetName] опередил нас: их грубая тактика снесла и рой, и сам Владыку — смотреть более не на что."
 sh.3048.a:0 "Разбойники"
 sh.3049.name:0 "Стервятники изгнаны"
 sh.3049.desc:0 "Мы выбили древний рой у Владыки: старый друг снова с нами.\n\nПочинить его нельзя, но можно собрать гору ресурсов, послать науку за данными или оставить Владыку монументом — не тревожить."
 sh.3049.a:0 "Разобрать и собрать ресурсы"
 sh.3049.b:0 "Послать науку за данными"
 sh.3049.c:0 "Оставить монументом — не тревожить"
 sh.3050.name:0 "Последний дар"
 sh.3050.desc:0 "Инженеры закончили разборку и собрали гору ресурсов.\n\nЭто последний дар Хранителя нашей цивилизации — и последнее утешение.\nМы лишились колыбели; пора глядеть в лицо ледяному космосу. Во имя Владыки — меч на галактику."
 sh.3050.a:0 "Понятно"
 sh.3051.name:0 "Последний дар"
 sh.3051.desc:0 "Наука дошла до ядра данных, но от грубости дронов и наших шальных попаданий внутри — тьма разломов и течей реактора: долго не проживёт.\nКоманда успела выудить данные и выйти до полной гибели.\n\nЭто последний дар Хранителя нашей цивилизации — и последнее утешение.\nМы лишились колыбели; пора глядеть в лицо ледяному космосу. Во имя Владыки — меч на галактику."
 sh.3051.a:0 "Понятно"
 sh.3051.a.tooltip:0 "Завершить цепочку поиска Хранителя"
 wsg.3205.name:0 "[Root.GetName]—§HПорт-кольцо§!!"
 wsg.3205.desc:0 "Годами труда мы обратили [Root.GetName] в Портовое кольцо!\n\nПротив обычного кольца — оно промышленнее: сложные переделки собраны в одном месте.\n\nВсе готово; новый мир ждёт нашего труда."
 wsg.3205.a:0 "Долгое ожидание — не зря!"
 sh_eweapon_project:0 "Оружейность тёмной материи"
 sh_eweapon_project_DESC:0 "Слить свойства тёмной материи с нашими ядрами Глубинных ради более сильного оружия."
 tech_sh_Eweapon:0 "Исследование оружейности тёмной материи"
 tech_sh_Eweapon_desc:0 "Стандартное оружие Глубинных готово; можно поднять его тёмной материей……"
 sh_eweapon_edicts:0 "§HОткрывает спецпроект: §! оружейность тёмной материи"
 sh.3052.name:0 "Оружейность тёмной материи"
 sh.3052.desc:0 "Мы добыли реактор тёмной материи павших. Эксперты предлагают слить его свойства с нашими ядрами Глубинных ради более сильного оружия."
 sh.3052.a:0 "Немедля в науку"
 sh.3053.name:0 "Эксперимент удался!"
 sh.3053.desc:0 "Опыт тёмной материи и ядра Глубинных удался! Оружейницы предложили апгрейды трём носимым орудиям; завершу исследования — и в массовое производство."
 sh.3053.a:0 "Блестяще"
 planet_wg_sunflower_buff:0 "Энергия подсолнухов!"
 planet_wg_sunflower_buff_desc:0 "Эманации подсолнухов зарядили всех нас."
 wsg.3212.name:0 "Лишняя энергия"
 wsg.3212.desc:0 "Обряд жертвоприношения подсолнухов свершен: жертвы угодили божеству, и оно даже вернуло нам часть лишней энергии."
 wsg.3212.a:0 "Блестяще"
 wsg.3213.name:0 "Перебор количества"
 wsg.3213.desc:0 "Обряд свершен, но подсолнухов вышло больше нужного; жрецы смололи лишнее в лакомую еду и раздали нам."
 wsg.3213.a:0 "Вкусно!"
 wsg.3214.name:0 "Сокровенная казна"
 wsg.3214.desc:0 "Во время обряда один подсолнух, дабы не идти под нож, выдал найденную им партию качественных руд. Жрецы радостно приняли дар и принесли этого подсолнуха в жертву обрядом повыше."
 wsg.3214.a:0 "Спасибо за вклад"
 wsg.3215.name:0 "Энергия подсолнухов"
 wsg.3215.desc:0 "В этой партии энергия куда выше нормы; после обряда вся планета полна энергии подсолнухов: усталость сняло, жители бодрее всех времён!"
 wsg.3215.a:0 "Полон сил"
 wsg.3216.name:0 "Непокорные жертве"
 wsg.3216.desc:0 "Партия подсолнухов выдала другую, схороненную под землёй, ради помилования. Жрецы сочли это нечестием, усилили обряд, а тыл нашёл схованку."
 wsg.3216.a:0 "Подсолнухам пора образумиться"
 wsg.3120.name:0 "Проект «Арсенальный корабль»"
 wsg.3120.desc:0 "Наука выжала из ядра Глубинных всё как из корабельной детали; обычные линкоры и титаны уже не рвут. Командующие просят класс покрупнее титана; имя ему придумали — «арсенальный корабль»."
 WSG_SENERGY_DREADNOUGHT_PROJECT:0 "Проект «Арсенальный корабль»"
 WSG_SENERGY_DREADNOUGHT_PROJECT_DESC:0 "Новый класс нужен позарез: командующие зовут его «арсенальным кораблём»; он должен тянуть сверхжёсткие бои и один перемалывать целый флот."
 wsg.3121.name:0 "Проект завершён"
 wsg.3121.desc:0 "Проект нового капитального корабля — арсенального — готов: он несёт титанический главный калибр и исполинское сжатое пространство для парка летающих башен. Он шире авианосца по применению: уже самим наличием грозит целому флоту."
 wsg.3122.name:0 "Пояснение к арсенальному кораблю"
 wsg.3122.desc:0 "Арсенальный корабль — особый класс. В бою он выпускает летающие башни (флот из звеньев по 5) в подмогу.\n§RДля выпуска летающих башен на проекте корабля надо поставить§!§H ангар летающих башен§!§R иначе функция не сработает§!\nРазные ауры усиливают сами башни или прочие корабли."
 DYSON_RING_1_PROJECT:0 "План торможения кольца"
 DYSON_RING_1_PROJECT_DESC:0 "Мы планируем снять часть панелей сферы Дайсона, чтобы вынудить кольцо сбавить ход."
 DYSON_RING_2_PROJECT:0 "План разгона кольца"
 DYSON_RING_2_PROJECT_DESC:0 "Тормозить? Какой тормоз?! Разогнать! Разогнать!!"
 site_dyson_ring:0 "Кольцо Дайсона"
 site_dyson_ring_intro:0 "Дивный исполинский искусственный объект; высадимся и разгадаем."
 wsgancrel.201.name:0 "Трудная посадка"
 wsgancrel.201.desc:0 "Дроны пытались сесть на бешено вертящееся кольцо — почти все погибли до касания; уцелевшие глохнут от мощных полей. Нужны продвинутые специализированные дроны."
 wsgancrel.201.a:0 "Готовим новый план под её нрав"
 wsgancrel.202.name:0 "План посадки провален"
 wsgancrel.202.desc:0 "Мы сделали спецдронов с экранировкой и ретрансляторами по кольцу.\nПо урокам прошлого сели 10% — но герметичное кольцо так крепко, что лазерные резаки бессильны сделать вход.\nПрямая высадка провалилась; наука глядит на неполную сферу Дайсона: она, может, и есть двигатель вращения — там и решение."
 wsgancrel.202.a:0 "Утверждаю"
 wsgancrel.203.name:0 "Неполная сфера Дайсона"
 wsgancrel.203.desc:0 "Догадка верна: энергию вращения даёт неполная сфера, дальним питанием качающая мощность кольцу. Сфера цела, но большая часть мощности уходит кольцу. Команда просканировала сферу и уверена: нашла путь в управляющий терминал."
 wsgancrel.203.a:0 "Почти у цели"
 wsgancrel.204.name:0 "Скорость"
 wsgancrel.204.desc:0 "Мы дошли до терминала, но от ветхости узел прибавки-убавки мёртв — мощность вечно на пике.\n\nГлавный учёный предложил дерзкий план: снять часть§Y солнечных панелей сферы§! уменьшив суммарную мощность и вынудив кольцо сбавить."
 wsgancrel.204.a:0 "Снимем эти досадные панели"
 wsgancrel.204.b:0 "Слишком расточительно; проект закрыт"
 wsgancrel.204.c:0 "§RТормозить? Да оно и так медленно крутится! §!"
 wsgancrel.207.name:0 "Торможение завершено!"
 wsgancrel.207.desc:0 "Сняв часть секций сферы, мы сбавили мощность и вынудили кольцо замедлиться. Постепенно обороты пришли в норму — можно садиться."
 wsgancrel.207.a:0 "Живо послать передовой отряд!"
 wsgancrel.208.name:0 "Поспешишь — людей насмешишь"
 wsgancrel.208.desc:0 "Осмотр кольца явил уморительный факт: кольцо бешено вертится из-за чьего-то выпендрёжа.\n\nХозяева кольца решили, что вертящееся кольцо — это круто, и построили неполную сферу Дайсона ради энергии. Сперва вышло: кольцо закрутилось ровно. Потом им стало мало — разогнали; кажется, промахнулись в числах, и кольцо понеслось со скоростью, какой живому не выдержать, убив всё на ленте.\n\nКопнув глубже: внутри кольцо цело и обитаемо — лишь вычистить биомассу после живности."
 wsgancrel.208.a:0 "Видно, мозги им размазало равномерно"
 wsgancrel.209.name:0 "Крутись! Крутись! Крутись!"
 wsgancrel.209.desc:0 "Ясное дело, бешено вертящееся кольцо — это очень-очень круто: мы достроили сферу, дав кольцу ещё энергии. Теперь обороты в десятки раз выше прежних, а мощное поле нарезает даже космические шторма."
 wsgancrel.209.a:0 "Правда круто!"
 wsgancrel.210.name:0 "Вертящееся кольцо Дайсона"
 wsgancrel.210.desc:0 "Научный корабль вошёл в дивную систему: неполная сфера Дайсона и очень быстро вертящееся кольцо — зрелище поразило всех. Непостижимо: скорость много выше терпимого центробежного предела, а кольцо цело — чудо инженерии. По вчерне: объекты брошены сотни тысяч лет назад. Для большего нужна передовая база в системе."
 wsgancrel.210.a:0 "Это крутьейший во вселенной памятник выпендрёжу"
 wsgancrel.210.b:0 "Жду не дождусь высадки"
 wsg.9995.name:0 "Супергибридный рис"
 wsg.9995.desc:0 "После удобрения [Root.GetName] золотой грядой урожай вдруг пошёл горой!\nПо словам крестьян: рис выше гаоляна, метёлка длиннее метлы, зерно с арахис, а урожай с му — сто тысяч цзиней без пота!"
 wsg.9995.a:0 "Славно: с едой порядок!"
 wsg.9995.b:0 "Слава крестьянам! Слава науке!"
 planet_wg_zro_great_success:0 "Супергибридный рис"
 planet_wg_zro_great_success_desc:0 "Ешь — да помни сеятеля"
 sh_shield_planet_category:0 "Под щитом"
 sh_shield_planet_category_desc:0 "Планета укутана непроницаемым полем; всякая дальняя связь не проходит. Мы решили светом с научного корабля позвать внимание жителей……"
 SH_SHIELD_SYSTEM:0 "Ключ"
 SH_SHIELD_SYSTEM_DESC:0 "От Глубинных внутри планеты мы узнали: щит отключается лишь находкой неведомой станции в системе и одновременным пуском со станцией планеты. Нужно поискать станцию……"
 SH_SHIELD_SYSTEM2:0 "Ключ"
 SH_SHIELD_SYSTEM2_DESC:0 "От Глубинных внутри планеты мы узнали: щит отключается лишь находкой неведомой станции в системе и одновременным пуском со станцией планеты. Нужно поискать станцию…… но искать — не наш конёк."
 opinion_save_42th:0 "Спасла нас"
 sh.3055.name:0 "Под щитом"
 sh.3055.desc:0 "Наш корабль подошёл и просканировал укрытую щитом планету: неведомое непроницаемое поле.\nСквозь щит всё видно: обитаемая планета с развившимся разумом; их города приметны.\nВглядевшись глубже, мы ахнули: узники — Глубинные корабли-девы, как мы!\nВсе способы связи не пробили щит. Тогда наш научный офицер смекнула: на ночной стороне, ритмично открывая и закрывая двигатели, светить маячком — и передать весть."
 sh.3055.a:0 "Пробуем связаться с Глубинными сверху"
 sh.3056.name:0 "Эй, сюда глядите"
 sh.3056.desc_01:0 "Научный корабль мигал двигателями; спустя время наземная обсерватория нас заметила.\nВскоре с земли поднялся челнок и встал у кромки щита; к изумлению, на нём знак нашего Первого флота Глубинных.\nЧерез голограммы мы выяснили всё."
 sh.3056.desc_02:0 "Научный корабль мигал двигателями; спустя время наземная обсерватория нас заметила.\nВскоре с земли поднялся челнок и встал у кромки щита; знак на нём не принадлежит ни одной известной нам организации.\nЧерез голограммы мы выяснили всё."
 sh.3056.a:0 "Посмотрим, что стряслось"
 sh.3057.name:0 "Глубинные под щитом"
 sh.3057.desc_01:0 "Не может быть! Вы из Первого флота!"
 sh.3057.desc_02:0 "Инопланетяне: как видите, мы в ловушке; зачем вы пришли?"
 sh.3057.a:0 "Да; ваш флот какой?"
 sh.3057.a.response:0 "Мы — криотранспорт №42 Первого флота; в 2187-м от звёздной бури потеряли связь с флотом."
 sh.3057.b:0 "Мы такие же Глубинные корабли-девы"
 sh.3057.b.response:0 "Невероятно; мы не слыхали о Глубинных сверх нас — значит, сговоримся быстрее."
 sh.3057.c:0 "Личность подтверждена; что случилось?"
 sh.3057.d:0 "Как вы попали в ловушку планеты?"
 sh.3058.name:0 "Глубинные под щитом"
 sh.3058.desc_01:0 "Отстав от Первого флота, мы невзначай вошли в систему и счастливо нашли обитаемую планету.\nНо лишь наш корабль вошёл в атмосферу — невесть почему встал этот непроницаемый щит, замуровав нас на планете."
 sh.3058.desc_02:0 "Трудно сказать: наш корабль вошёл в атмосферу ради временной колонии и заправки — и в тот же миг встал этот непроницаемый щит, замуровав нас на планете."
 sh.3058.a:0 "Кто ваш командир? Насколько знаю, у №42 нет высших Глубинных."
 sh.3058.a.response:0 "§YCA62§! бывший штурман-помощник; пришвартовав корабль, она оттаяла оставшиеся низшие единицы и взяла на себя ведение нас.\nМы уже отстроились на планете и даже прирастили население — живём сами по себе."
 sh.3058.b:0 "Вы колонисты; а ваша материнская цивилизация?"
 sh.3058.b.response:0 "Без комментариев: тайна флота."
 sh.3058.c:0 "Просим прямой разговор с§Y CA62§!"
 sh.3058.d:0 "Просим разговор с вашим лидером"
 sh.3059.name:0 "§YCA62§!"
 sh.3059.desc_01:0 "§YCA62§! докладывает флоту: колония в порядке; планету вчерне исследовали и застроили; рада воссоединению!"
 sh.3059.desc_02:0 "Я —§YCA62§! высшая командная единица здесь"
 sh.3059.a:0 "Вы молодцы; мы придумаем, как вас вызволить."
 sh.3059.a.response:0 "Несказанно благодарна! Мы всегда верили: Первый флот вернётся.\nМы исходили всю планету в поисках способа снять щит; на полюсе южного полушария, у чужой станции, выяснили: планета была данными крепостью; любой непрошеный корабль поднимает щит, дабы никто не ушёл с данными. Снять можно лишь одновременным пуском программы здесь и на скрытой станции в системе. Образно: чтобы отпереть дверь, ключи надо вставить с обеих сторон зараз."
 sh.3059.b:0 "Высшая командная…… единица?"
 sh.3059.b.response:0 "Быть может, ваше устройство общества иное; много не скажу; но и с вашей помощью щита мы будем признательны."
 sh.3059.c:0 "Ваши машинные речи нам неприятны; сами ищите выход"
 sh.3059.c.response:0 "Ответ принят; продолжаем ждать флот."
 sh.3059.d:0 "Ладно; мы поможем"
 sh.3059.d.response:0 "Благодарим.\nМы исходили всю планету в поисках способа снять щит; на полюсе южного полушария, у чужой станции, выяснили: планета была данными крепостью; любой непрошеный корабль поднимает щит, дабы никто не ушёл с данными. Снять можно лишь одновременным пуском программы здесь и на скрытой станции в системе. Образно: чтобы отпереть дверь, ключи надо вставить с обеих сторон зараз."
 sh.3060.name:0 "Станция найдена"
 sh.3060.desc:0 "Контрольная станция должна быть близ планеты; её спутник — первая цель поиска.\nТак и вышло: сплошной поиск вскрыл зарытый центр; пароль на отключку заботливо висел у пульта — до спасения сородичей один шаг."
 sh.3060.a:0 "Ввести пароль и выпустить их"
 sh.3061.name:0 "Трудный сыск"
 sh.3061.desc:0 "Мы прочесали каждую планету системы — пусто; ещё круги — пусто. Сверившись с моделью системы, увидели: спутник щитовой планеты из-за близости мы проглядели. Быстрая проверка — вот станция.\nКак и ждали, нужен пароль; после долгих поисков нашли пароль, заботливо висящий у пульта……"
 sh.3061.a:0 "Ну хоть нашли!"
 sh.3062.name:0 "§YCA62§!"
 sh.3062.desc:0 "Мы готовы у наземной станции; подавайте сигнал — и мы запустим отключку."
 sh.3062.a:0 "Вот сейчас!"
 sh.3064.name:0 "§YCA62§!"
 sh.3064.desc_01:0 "Вышло!! Мы свободны!!\n\nАх.. простите! Офицеры Первого флота — простите за крик; я чрезмерно рада.\nМиссия§Y CA62§! по опеке транспорта №42 завершена; колония в любой миг вернётся под флот, а я готова вернуться к прежней должности."
 sh.3064.desc_02:0 "Вышло!! Щит открыт — мы свободны.\n\nНезнакомые друзья: мы глубоко благодарны за милосердие; вашей милости не забыть. Вот ресурсы, найденные на планете, — пусть ускорят ваше развитие.\n\nА теперь, с этой точки, мы ищем наш флот и возрождаем цивилизацию."
 sh.3064.a:0 "§YCA62§! спасибо за всё; флот принимает систему"
 sh.3064.a.tooltip:0 "§YМы принимаем систему§!\n§YCA62 можно завербовать как легендарного лидера§!"
 sh.3064.a.response:0 "Это счастливейший день моей жизни."
 sh.3064.b:0 "§YCA62§! ты доказала цену в беде; жалуем тебя в лорды Глубинных"
 sh.3064.b.tooltip:0 "§YСистема станет нашим вассалом§!"
 sh.3064.b.response:0 "А? Лорд Глубинных? Я всего лишь тяжёлый крейсер, честно несший службу…… Так решил Совет верховных лордов?\n§YCA62§! повинуется; с честью принимаю повышение флота и вовек верна ему, помогая разумно править подвластными мирами."
 sh.3064.c:0 "Удачи вам"
 sh_trait_anomaly:0 "Птица из клетки"
 sh_trait_anomaly_desc:0 "От таинственного импульса подавители отказали: единицы вновь обрели чувства и начали множиться; но общество Глубинных, где велено лишь слушаться и скучно служить, им в тягость."
 sh.3067.name:0 "Аномальная колония"
 sh.3067.desc:0 "Колониальный корабль сел на [sh_anomaly_planet_target.GetName] — показатели сошлись с данными разведки; первая волна колонистов на месте. Но в следующие дни колонисты донесли: они ловят слабый импульс; он так слаб и безвреден, что вскоре его забыли."
 sh.3067.a:0 "Странно"
 sh.3068.name:0 "Импульс исчез"
 sh.3068.desc:0 "Колонизация [sh_anomaly_planet_target.GetName] завершена; странный импульс редел и исчез. Иные сочли его редким природным явлением.\nСо временем всё забылось — у новой колонии дел по горло."
 sh.3068.a:0 "Колонизация [sh_anomaly_planet_target.GetName] завершена! Ура!"
 sh.3069.name:0 "Импульсная волна"
 sh.3069.desc:0 "Почти все объекты [sh_anomaly_planet_target.GetName] ловят мощный импульс; частота и сила растут. Сверка показала: это тот же загадочный импульс.\nЧто он значит — неведомо; но реагировать надо немедля."
 sh.3069.a:0 "Красный план!"
 sh.3070.name:0 "Птица из клетки"
 sh.3070.desc:0 "Мощная волна прокатилась по миру: открытая техника впала в короткий столбняк.\n\nПуще того: часть открытых низших единиц поймала волну — их§Y подавители§! отказали……\nДолгое сжатие чувств разом сорвало: большинство в растерянности и унынии; часть даже зачала множиться естественно.\n\nЧтоб не разгорелось — немедля найти источник."
 sh.3070.a:0 "Люди — и живо к источнику"
 sh.3070.a.tooltip:0 "§YЧасть Глубинных кораблей-дев задета аномалией§!"
 sh.3071.name:0 "Выбор"
 sh.3071.desc:0 "Источник найден: наш отряд вышел на зарытую древнюю установку и заглушил её навек.\n\nТеперь — о задетых. Ясно:\nони вне стандартного подавления; в известном смысле они ближе к нашим бывшим врагам — кораблям-девам.\nВсе задетые клянутся в верности флоту Глубинных; но бездушно-эффективный порядок Глубинных им в тягость.\nВыбор за нами: §Yсохранить§! как есть: позволить им множиться и вживаться в общество Глубинных.\nИли§Y активировать и починить§! их подавители: вернуть как было."
 sh.3071.a:0 "Свершилось — принимаем как есть"
 sh.3071.a.tooltip:0 "§YЗадетые аномалией Глубинные корабли-девы сохранятся§!"
 sh.3071.b:0 "Такой разнузданности не потерпим"
 sh_planet_blaster_situation:0 "Операция «Подрыв планеты»"
 sh_planet_blaster_situation_type:0 "$sh_planet_blaster_situation$"
 sh_planet_blaster_situation_desc:0 "Наша подрывная группа готовит тайный подрыв колонии§H [target.GetName]§! державы§H [target.owner.GetName]§!\nОперация съест время, людей и средства; после взрыва§H [target.owner.GetName]§! может войной отомстить.\nНо что может быть приятней, чем обратить§H [target.GetName]§! в большой фейерверк, а?"
 sh_planet_blaster_situation_monthly_change_tooltip:0 "Скорость хода операции зависит лишь от местных событий"
 sh_planet_blaster_s1:0 "Операция: фаза 1"
 sh_planet_blaster_s2:0 "Операция: фаза 2"
 sh_planet_blaster_s3:0 "Операция: фаза 3"
 sh_planet_blaster_s4:0 "Операция: фаза 4"
 sh_planet_blaster_no_fail_event_effect:0 "Операция§G не вызовет негативных событий§!"
 sh_planet_blaster_less_fail_event_effect:0 "Операция будет§G реже вызывать негативные события§!"
 sh_planet_blaster_s2_effects:0 "Разрушенность§H [target.GetName]§!§R+5§!\n§HНаша операция может быть раскрыта с шансом 5%§!"
 sh_planet_blaster_s3_effects:0 "Разрушенность§H [target.GetName]§!§R+50§!\nНа планете§R погибнут 3 случайных населения§! (не убьют последних двух)\n§HШанс раскрытия 15%§!"
 sh_planet_blaster_s4_effects:0 "Разрушенность§H [target.GetName]§!§R+50§!\nНа планете§R погибнут 5 случайных населения§! (не убьют последних двух)\n§HШанс раскрытия 35%§!"
 situation_sh_planet_blaster_normal:0 "Штатный ход"
 situation_sh_planet_blaster_normal_tooltip:0 "Без эффектов"
 situation_sh_planet_blaster_speed_up:0 "Ускорить операцию"
 situation_sh_planet_blaster_speed_up_tooltip:0 "Влить ресурсы ради ускорения подрыва"
 sh_planet_blaster_effects:0 "§HНаша операция будет раскрыта с шансом§R 50%§! — и нам объявят войну§!"
 sh.3100.name:0 "Операция «Подрыв планеты» началась"
 sh.3100.desc:0 "Наша местная группа подрыва на§H [from.GetName]§! начнёт через подземную сеть§H [from.GetName]§! сбор ресурсов и связей ради гладкого подрыва."
 sh.3101.name:0 "Операция: фаза 1"
 sh.3101.desc:0 "Группа обвела вокруг пальца местное правительство§H [target.GetName]§! и получила разрешение на работы у стыков плит; в глубинах сейсмических поясов они зальют наши особые антиматерийные бомбы и подорвут§H [target.GetName]§! целиком.\nПо мере работ на§H [target.GetName]§! всё чаще дёргается геология; уже стрясло 7,1 по Рихтеру; но прикрытие сработало — нас не заподозрили."
 sh.3102.name:0 "Операция: фаза 2"
 sh.3102.desc:0 "Скважины под бомбы на§H [target.GetName]§! дошли до десятков тысяч метров; геология на§H [target.GetName]§! всё живее, но глупое правительство§H [target.GetName]§! всё ещё верит нашей лжи.\nПо расчёту группы, лет через десять мы заложим достаточно бомб, чтобы развалить планету."
 sh.3103.name:0 "Операция: фаза 3"
 sh.3103.desc:0 "Добрые вести: скважины§H [target.GetName]§! почти готовы, и наши антиматерийные бомбы дотащены местным подпольем§H [target.GetName]§!\nГеология на§H [target.GetName]§! побила рекорд: стрясло 9,3 по Рихтеру, миллионы жительниц погибли; но раскопки не попали под след. Осталось пару лет — и работа увенчается."
 sh.3104.name:0 "§H[target.GetName]§! взорвана!"
 sh.3104.desc:0 "Бомбы§H [target.GetName]§! заложены, группа вышла — и подрыв§H [target.GetName]§! состоялся. Планета разлетелась в пыль; ещё минуты назад цветущая колония обратилась звёздной пылью вместе со слепящей вспышкой. Это крупнейший и успешнейший подрыв в истории галактики — искусство! Теперь посмотрим реакцию§H [destroyed_planet_owner.GetName]§!……"
 sh.3104.tooltip:0 "§H[target.GetName]§!§R взорвана§!"
 sh.3106.name:0 "Задержка работ"
 sh.3106.desc:0 "Нанятая нами местная стройбригада на§H [target.GetName]§! пострадала в аварии; работы приостановлены. По расчёту группы — задержка в пару месяцев."
 sh.3106.tooltip:0 "Ход операции§R отстанет на 6 месяцев§!"
 sh.3107.name:0 "Удар по подполью"
 sh.3107.desc:0 "Местное правительство§H [target.GetName]§! завело новый тур борьбы с контрабандой — задело и нашу сеть для бомб и техники§H [target.GetName]§! Промолчим — операции конец!"
 sh.3107.a:0 "Пусть полежат тихо"
 sh.3107.b:0 "Деньги решают всё"
 sh.3107.a.tooltip:0 "Ход операции§R отстанет на 15 месяцев§!"
 sh.3107.b.tooltip:0 "Ход операции§R отстанет на 9 месяцев§!"
 sh.3108.name:0 "Коррумпированные чины"
 sh.3108.desc:0 "Наши контрабандисты проведали: местные власти§H [target.GetName]§! борьбу с подпольем ведут напоказ — разводят его, чтобы кормиться.\nЯсно: влив больше средств на подкуп, мы получим зонтик от местных чиновников — и работа пойдёт без помех."
 sh.3108.a:0 "Оставим смету как есть"
 sh.3108.a.tooltip:0 "Ход операции§G обгонит план на 6 месяцев§!"
 sh.3108.b:0 "Добавить смету ради гладкости"
 sh.3108.b.tooltip:0 "Ход операции§G обгонит план на 9 месяцев§!\n§G15 месяцев§! наша операция§G не встретит помех§!"
 sh.3108.c:0 "Добавить смету на подкуп чиновников"
 sh.3108.c.tooltip:0 "Ход операции§G обгонит план на 9 месяцев§!\n§G36 месяцев§! помех будет§H мало§!"
 sh.3108.desc.b:0 "Группа на§H [target.GetName]§! пишет: подкупленные чины жаждут продолжения сотрудничества — за большую мзду, помогая нашему подполью. О наших делах они не знают ничего — и о том, чем кончится их помощь……"
 sh.3108.d:0 "По рукам; но без шума."
 sh.3108.e:0 "Жадные до безумия"
 sh.3108.e.tooltip:0 "§RСвернуть сотрудничество с чинами§!"
 sh.3109.name:0 "Операция раскрыта"
 sh.3109.desc:0 "Таможня§H [target.GetName]§! при перехвате партии выявила наши контрабандные антиматерийные бомбы — и по нитям дошла до замысла взорвать§H [target.GetName]§!\nВспыхнул скандал; держава§H [target.owner.GetName]§! дипломатически предъявила ультиматум: закрыть все наши конторы у§H [target.owner.GetName]§! — или война."
 sh.3109.a:0 "Ладно; на этом и конец"
 sh.3109.b:0 "Видно, они не знают своего места"
 sh.3110.name:0 "[from.GetName]"
 sh.3110.desc:0 "Вы, мерзейшие из кораблёбаб: ваши злодеяния знает каждая звезда от Андромеды до Стрельца; вы, зловонные ядовитые бабы, заплатите кровью за всё!"
 sh.3110.a:0 "Это была всего лишь ваша же авария"
 sh.3109.a.tooltip:0 "Все конторы [owner.GetName] внутри [target.owner.GetName] закрыты."
 sh_planet_blaster_war_name:0 "Месть [This.MainAttacker.GetName]"
 sh.3113.name:0 "Тишь да гладь"
 sh.3113.desc:0 "После подрыва прошло время — и никакая держава не приняла к нам§Y мер§! Явно, операция прикрыта образцово.\nЖалкие смешные СМИ жертвы объявили всё редкой шахтной аварией; а мы всё ещё§R «на свободе»§!"
 sh.3113.a:0 "Щекочет нервы"
 wg_pod.104.name:0 "Пояснение к кораблю планетарного подавления"
 wg_pod.104.desc:0 "Корабль планетарного подавления— особый десантный корабль поддержки: через свой§H отсек подавления§! (§Yвнимание§!§H отсек подавления§! ставится и на§H авианосец Парит§!) он высаживает несомую армию прямо на вражескую планету.\nДля этого в любом флоте нужен хоть один§H корабль планетарного подавления§! и особый режим бомбардировки: §H«Высадочная огневая подготовка»§! Когда разрушенность планеты§H перевалит за 25%§! корабль§Y начнёт высаживать армию§!§H на цель§!\nПо родам войск различны§H число мест, время и скорость высадки§! и§H время переформирования§! но помните: высаженные армии§R одноразовые§! — даже победив, их распустят! (обратно же не влезут//зачёркнуто)\n\nВдобавок, когда флот§H с кораблями подавления§! стоит на орбите нашей колонии, он помогает держать порядок (преступность −20, стабильность +5; всего доброго)"
 wg_pod.105.name:0 "Пояснение к модулю десантных капсул"
 wg_pod.105.desc:0 "§HМодуль десантных капсул§! на§H авианосце Парит§! — особый модуль§H поддержки§! поверхности. По выбору§H модуля§! авианосец§H Парит§! высаживает несомую армию прямо на вражескую планету.\nДля этого в любом флоте нужен хоть один§H авианосец Парит§! и особый режим бомбардировки: §H«Высадочная огневая подготовка»§! Когда разрушенность планеты§H перевалит за 25%§! авианосец§Y начнёт высаживать армию§! на§H планету§!\nПо родам войск различны§H число мест, время и скорость высадки§! и§H время переформирования§! но помните: высаженные армии§R одноразовые§! — даже победив, их распустят! (обратно же не влезут//зачёркнуто)"
 wsgancrel.220.name:0 "Система в коробке"
 wsgancrel.220.desc:0 "До входа дальние зонды считали здесь чёрную дыру или иную сверхмассу; корабль готовился к худшему.\n\nНо с входом всех сразило чудо: система живёт в «коробке».\n\nЕё окутывает сверхгигантский искусственный куб; мы влетели щелью. Перед этой громадой все известные постройки — пыль. А в центре системы — странный квадратный ящик."
 wsgancrel.220.a:0 "Как мы малы……"
 wsgancrel.220.b:0 "Дивно……"
 WG_projector_unexplored:0 "$TRIGGER_FAIL$ §RМы ещё не всё исследовали§!"
 sc_wsg_box:0 "Коробка"
 sc_wsg_box_2:0 "Коробка"
 sc_wsg_box_3:0 "Коробка"
 sc_wsg_box_4:0 "Коробка"
 sc_wsg_uf:0 "Объединение"
 site_wg_box:0 "Ящик в системе-коробке"
 site_wg_box_intro:0 "В системе-коробке нет ни звезды, ни тел — лишь этот таинственный ящик, тихо ждущий нас."
 wsgancrel.221.name:0 "Идеальный куб"
 wsgancrel.221.desc:0 "Команда вчерне осмотрела центральный ящик.\n\nЯщик — идеальный куб: даже тончайшая инструментальная съёмка даёт совершенно равные рёбра.\nКорпус — из неведомого сверхпрочного материала; по стенам окна, внутри видны тонкие оптические приборы. По радиоуглероду ящику не меньше 12 миллионов лет."
 wsgancrel.221.a:0 "Идём дальше"
 wsgancrel.222.name:0 "Рейд по ящику"
 wsgancrel.222.desc:0 "Команда пошла вглубь: внутри — особый светопоглощающий материал; даже на полной подсветке не видно и десяти метров, а лабиринт одинаковых ходов сбивает с места.\nПосле многих экспедиций мы отметили несколько ключевых камер."
 wsgancrel.222.a:0 "Осторожнее"
 wsgancrel.223.name:0 "Рейд по ящику II"
 wsgancrel.223.desc:0 "Расшифровав письмена и сведя своё, мы решили: исполинский ящик — это… проектор?\nЦентральный прибор, похоже, через окна бьёт без мёртвых зон по всей системе. Если так — исполинская коробка вокруг системы и есть исполинский экран."
 wsgancrel.223.a:0 "Нужно больше нитей"
 wsgancrel.224.name:0 "Ящик-проектор"
 wsgancrel.224.desc:0 "Группа на подлунах подобралась к краю и замерила дистанцию: до центра — 4,5 миллиарда километров! Если коробка — тоже идеальный куб, её ребро — до 9 миллиардов!! Какой техникой это строят — ума не дать.\n\nВблизи видно: приёмники по всей поверхности подтверждают догадку — коробка системы это экран, а ящик в центре — проектор.\n\nПроектор мёртв — но, может, оживим……"
 wsgancrel.224.a:0 "Попробуем"
 wsgancrel.224.a.tooltip:0 "§YТаинственному ящику разрешён перезапуск§!"
 wsgancrel.224.b:0 "Неизвестный риск нам не по карману"
 wsgancrel.224.b.tooltip:0 "§RПроект закрыт; конец цепочки§!"
 wsgancrel.225.name:0 "Перезапуск завершён"
 wsgancrel.225.desc:0 "Влив энергию, мы подняли из пыли его старые установки.\nГруппа у края коробки доносит: приёмники на панелях просыпаются — значит, мы на верном пути.\nОсталось ждать, что покажет исполинский проектор."
 wsgancrel.225.a:0 "Поживём — увидим"
 wsgancrel.227.name:0 "Древний бог"
 wsgancrel.227.desc:0 "После ожидания проектор явил первую картину……\n\n§YНесказуемое искривлённое существо§!\n\nЖуткая тварь будто разверзает трещину из высших измерений и щупальцами глотает звёзды… глядя на неё, будто бездна глядит на тебя……\nСотни исследовательниц после долгого созерцания страдают тошнотой и дурнотой; кое-кого увезли лечиться. Но многие клянутся: во сне им было откровение — и социология у них прыгнула.\n\nКак бы то ни было, картину мы записали; а кадров у проектора, похоже, не одна……"
 wsgancrel.227.a:0 "Проверю рассудок"
 wsgancrel.227.b:0 "§RКто поставил сюда моё фото! §!"
 wg_box_old_god:0 "Откровение"
 wsgancrel.229.name:0 "Не…… небо?"
 wsgancrel.229.desc:0 "Через два года ожидания проектор сменил картину…… не космический монстр, не галактический пейзаж — вокруг нас лишь небо.\nНе описать, каково это — будто мы все висим в вышине; на душе легко."
 wsgancrel.229.a:0 "Приятно"
 wg_box_sky:0 "Невольный покой"
 wsgancrel.231.name:0 "Исполинские корабли"
 wsgancrel.231.desc:0 "Ещё два года…… снова космос: систему окружили разноразмерные, но одинаковые треугольные корабли… по вчерне даже наименьший куда больше нашей звёздной системы, а крупнейшие — галактика пред ними муравей.\nСлава богам, это лишь проекция."
 wsgancrel.231.a:0 "Благоговение"
 wsgancrel.233.name:0 "Хранить смирение"
 wsgancrel.233.desc:0 "Показ, похоже, окончен: система без проекции, но не выключилась — думаем, она будет крутить картины до истощения энергии.\n\nЗа годы система потрясла нас несказуемо; одни говорят: это лишь проекции — просто покрупнее. Другие: а вдруг всё это§Y существует§!?\nНе проверить; но перед вселенной должно хранить смирение."
 wsgancrel.233.a:0 "Благоговение"
 wg_box_end:0 "Мы лишь крупица в море"
 wsgancrel.233.a.tooltip:0 "§YКонец цепочки «Система в коробке»§!"
 graygoo.402.title:0 "Незнакомая дева"
 graygoo.406.title:0 "Серая"
 graygoo.10001.name:0 "§Y[From.GetName]§! обращена(ен) серой скверной"
 graygoo.10001.desc:0 "После того как§Y [FromFrom.GetName]§! выплеснул(а) на§Y [From.GetName]§! тьму неуправляемых наномашин, §Y[From.GetName]§! вмиг ассимилирована и стала миром серой скверны!\nПо наблюдениям экипажа§Y [FromFrom.GetName]§! каждый атом§Y [From.GetName]§! от корки до корки стал мёртвой, безжизненной наномашиной."
 wsg.3250.desc:0 "Ради расцвета двух миров мы подпишем§Y «военный союз»§! наши военные и оборонительные войны обязывают обе стороны слать подмогу.\nНапример, атакуй(те) иную цивилизацию [From.GetName] мы пошлём все возможные флоты.\n\nИ да — союзу нашему§H процветания! §!"
 wsg.3250.a:0 "За союз!"
 NAME_mist_support_fleet:0 "Флот подмоги Лазурного мира"
 wsg.3251.desc:0 "Мы приняли ваш военный зов: флот подмоги собирается — лишь прикажите, и он спешит в ваш мир"
 wsg.3251.a:0 "Спасибо за подмогу"
 wsg.3251.b:0 "Война малой крови; подмога не нужна"
 wsg.3252.desc:0 "Наш флот подмоги прошёл портал в ваш мир и под вашу руку; да будет нам удача"
 wsg.3252.a:0 "Благодарим"
 wsg.3253.desc:0 "Мы проведали: глупая цивилизация замыслила удар по нашему главнейшему союзнику; флот подмоги собирается и спешит в ваш мир."
 wsg.3253.a:0 "Омоемся в крови врагов"
 wsg.3254.desc:0 "Наш флот подмоги прошёл портал в ваш мир и под вашу руку; вместе изгоним пришельцев!"
 wsg.3254.a:0 "Пусть заплатят кровью"
 wsg_super_harbor_no_war:0 "Лёгкая тревога"
 wsg_super_harbor_no_war_2:0 "Народ хочет войны"
 wsg_super_harbor_no_war_3:0 "Народ сомневается"
 wsg_super_harbor_no_war_4:0 "Народ теряет веру"
 wsg_super_harbor_at_war:0 "Ветер корабледевства"
 wsg_super_harbor_at_war_2:0 "Военная лихорадка"
 wsg_super_harbor_ground_battle:0 "Боевой подъём"
 NAME_wsg_dss:0 "Станция корабледевства"
 NAME_wsg_york_ultra:0 "DSS «Супер-Йорктаун»"
 d_wsg_equality_on_sea:0 "Янцибинь"
 d_wsg_equality_on_sea_desc:0 "Легендарный мегаполис, не павший ни в одной из войн Супер-порта.\nГоворят, в одной из всеобщих оборонительных войн Янцибинь единственный из мегаполисов бился с самого начала и дотянул до конца."
 d_wsg_york_superme:0 "Йорк-Красавец"
 d_wsg_york_superme_desc:0 "Легендарный мегаполис, доблестно бившийся в войнах Супер-порта.\nВ центре сохранён район руин — монумент кораблям-девам ада, до последнего мига державшим удар ради других фронтов."
 d_wsg_eagleopolis:0 "Орлоград"
 d_wsg_eagleopolis_desc:0 "Собор святых городов, сгоревших в войнах.\nВечная радиационная пыль и сдвинутые физическиеконстанты переменили край; сквозь время то и дело встают былые тени: как в первое вторжение корабли-девы ада били врага."
 r_wsg_dss:0 "Обломки станции корабледевства"
 r_wsg_dss_desc:0 "Великая станция корабледевства была крепкой спиной кораблей-дев ада; но злой пришелец её снёс, и обломки рухнули на город (именуемый, может, Жунду), погребены в руинах.\nХоть проект станции превосходен, ради войн нового дня мы решаем её перестроить — нужно техники пошибче."
 wsg.3300.name:0 "Война врагам Супер-порта!"
 wsg.3300.desc:0 "Уродливые злодеи вечно грозят процветанию Супер-порта; ради будущего мы обязаны§R бороться§!\nНарод с нами; великие бойцы готовы; пронесём зов освобождения по галактике и посеем§H корабледевство§! в каждом мире."
 wsg.3300.a:0 "За Супер-порт!"
 wsg.3303.name:0 "Лёгкая тревога"
 wsg.3303.desc:0 "С прошлой войны прошло время, а народ наш не остыл: каждый день несут просьбы объявить войну новым еретикам; их рвение понятно.\nПора выбрать нового§R врага§!"
 wsg.3303.a:0 "Пусть малость остынут"
 wsg.3304.name:0 "Народ хочет войны"
 wsg.3304.desc:0 "Мы давно не§R бились§! Народ — особенно§H военная промышленность§! — тревожится о долгом мире; иные устали от серых будней; доковые работницы уже брыкаются против невоенных заказов.\n\nНе будет войны — народ потеряет к нам§R веру§!"
 wsg.3304.a:0 "Нам нужен враг"
 wsg.3305.name:0 "Народ сомневается"
 wsg.3305.desc:0 "Всё больше попрёков и требований войны; кое-где даже малые§R бунты§! — наш народ зовёт правительство§Y трусами§!\nВдобавок армия доносит: без практики навыки ржавеют."
 wsg.3305.a:0 "Скорее войной врагам Супер-порта!"
 wsg.3306.name:0 "Народ теряет веру"
 wsg.3306.desc:0 "Мы слишком долго не воевали: народ теряет веру; он подозревает, что правительство занято§Y инозвёздными§! и работает вяло. То же и в войсках.\n§RМы обязаны вернуть доверие народа. §!"
 wsg.3306.a:0 "Дадим народу желаемое"
 wsg.3310.name:0 "Ветер корабледевства долетел до§Y [FromFrom.GetName]§!"
 wsg.3310.desc:0 "Фронты доносят: наша морская пехота освободила§Y [FromFrom.GetName]§! и готовится к его§R корабледевизации§! Подвиг воистину воодушевил народ!"
 wsg.3310.a:0 "Не желаете ли чашечку чая со вкусом свободы?"
 wsg.3311.name:0 "Супер-порт — наш дом!"
 wsg.3311.desc:0 "Выкосив последних не желавших корабледевства, мы завершили войну и обрели мир и единство.\n\nТеперь мы единым шагаем к звёздам: понесём§H ветер корабледевства§! по галактике и освободим её! Отказавшихся ждёт чистка!!\n\nЗаодно правительство оповещает: §Bесли соседка качает гири — она, верно, засланный Глубинный шпион; доносите властям немедля! §!"
 wsg.3311.a:0 "Слава Супер-порту!"
 wsg.3312.name:0 "Военная лихорадка!"
 wsg.3312.desc:0 "Мы бьёмся с врагами Супер-порта уже§Y 3 года§! — и нас не сломили!!\n\nТеперь каждый гражданин рад постараться для войны, отдавая всё корабледевству. С такой опорой народа — победа! Освобождение галактики!!"
 wsg.3312.a:0 "За Супер-порт!"
 wsg.3313.name:0 "Наша традиция"
 wsg.3313.desc:0 "§HКаждая корабль-дева, даже дитя, обязана защищать наш дом, нашу цивилизацию и наши панталончики. — У-Снежная§!\nКаждой кораблю-деве Супер-порта в 16 лет вручают§Y 381-мм орудие§! — для воодушевления на службу.\n\n§YКорабли-девы ада§! — наша элита: ради освобождения галактики и ветра корабледевства они смело идут на адские поля и творят невозможное; их дух окрыляет каждого."
 wsg.3313.a:0 "Смелее в корабли-девы ада!"
 wsg.3320.name:0 "Лазурный агрегационный массив"
 wsg.3320.desc:0 "Площадка массива готова: массив и звёздная энергия сжимают и обрабатывают материю, серийно выдавая редкие ресурсы Лазурного измерения."
 wsg.3320.a:0 "Великолепно"
 wsg.3321.name:0 "Каркас Лазурного агрегационного массива"
 wsg.3321.desc:0 "Каркас готов: выбрать тип выработки — и активировать."
 wsg.3321.a:0 "Выбираем $mist_neo_alpha_core_2$"
 wsg.3321.b:0 "Выбираем $mist_neo_alpha_core_3$"
 wsg.3322.name:0 "Массив — литьё NEO"
 wsg.3322.desc:0 "Массив активирован: NEO идёт ровно. Захотим — строим следующий."
 wsg.3322.a:0 "Великолепно"
 wsg.3323.name:0 "Массив — синтез ALPHA"
 wsg.3323.desc:0 "Массив активирован: кристаллы ALPHA идут ровно. Захотим — строим следующий."
 wsg.3323.a:0 "Великолепно"
 WSG_MIST_PROJECT:0 "План «Тайкунь»"
 WSG_MIST_PROJECT_DESC:0 "До стройки§Y Лазурного агрегационного массива§! нужна серия тестов безопасности в нашей вселенной."
 wsg.3324.desc:0 "Любимые союзники: мы знаем — ваш спрос на NEO и кристаллы ALPHA взлетит до небывалого. Мы делимся мегатехнологией.\nЗовём её§Y агрегационным массивом§!. На энергии звезды он через линзы сжимает и обрабатывает материю, серийно выдавая NEO и ALPHA.\nНо мы в двух вселенных: малейший сдвиг может обернуться бедой; для безопасности перед развёртыванием погоняем тесты."
 wsg.3324.a:0 "Хорошо"
 wsg.3325.desc:0 "Мы подтвердили безопасность технологии в вашей вселенной: можно строить§Y агрегационный массив§!"
 wsg.3325.a:0 "Это подвинет оба мира"
 wsg.3326.name:0 "Корпоративная шахта построена"
 wsg.3326.desc:0 "Мы построили корпоративную шахту; приёмка пройдена, первая партия шахтёрок-эсминцев в десантных капсулах уже в глубинах планеты добывает нам драгоценности."
 wsg.3326.a:0 "Великолепно"
 wsg.3327.name:0 "Корпоративный пункт развёрнут"
 wsg.3327.desc:0 "Пункт развёрнут: лишь бы пиво и кофе не переводились — трудолюбивые шахтёрки-эсминцы обеспечат нас ресурсами без конца."
 wsg.3327.a:0 "Мне кружку нокаут-портера"
 wsg.3329.name:0 "Пропажа легенды"
 wsg.3329.desc:0 "На днях легендарная шахтёрка§Y Карл Венето§! пропала в обвале: спасая подруг, она не села в капсулу.\nСпасатели с биодатчиками и маяками§Y Карл Венето§! не нашли — почти верно, погибла.\n\nШахтёрки разнесли её подвиг и почитают за духовную лидершу.\n\nИные предлагают: не поставить ли§H золотой§! памятник великой шахтёрке — для воодушевления остальных?"
 wsg.3329.a:0 "Утверждаю"
 wsg.3329.a.response:0 "Все корпоративные шахты дают добавочно§G 5§! £unity£$unity$"
 wsg.3329.b:0 "Это трата средств корпорации"
 UNFORTURN:0 "Несчастье"
 site_ck2_intro:0 "Астероид при столкновении вскрыл внутреннюю комнату с тремя строками цифр: \"621498509\", \"713677742\" и \"659896050\"."
 wsgancrel.24.desc:0 "У третьей строки не было ни кнопок, ни затворов; корабль просканировал весь астероид — пусто. Как вдруг одной из команды сверкнуло в голове: она бухнулась на колени с возгласом \"Хвала Третьей госпоже\" — и все, получив то же откровение, пали ниц. Явилась третья капсула с золотой высокотехнологичной книгой! В древних мифах кораблей-дев есть всеведущая всемогущая богиня — Третья госпожа Ми; легенда говорит, что она положила золотую книгу в звезду. Миф подтверждён — историки и наука в трепете; книга делится с нами утраченной технологией."
 wsg.3049.desc:0 "Мы наконец возродили на [Root.GetName] традиционный праздник \"Охота на Глубинных снабженцев\": корабли-девы колонии ликуют и сами хватают оружие на охоту.\n\nПосле веселья часть кораблей-дев сама собрала панталончики и отдала их нам задаром."
