 wg_knight_modifier_hospital_desc:0 "Члены ордена рьяно ведут медицинские исследования и спасают жизни — уровень жизни планеты растёт."
 decision_planet_wg_knight_modifier_hospital_effect:0 "Должности £job_wg_knight_lord£ §Y$job_wg_knight_lord$§! и £job_wg_knight£ §Y$job_wg_knight$§! дополнительно дают §G10§! £society£ §Yсоциологии§!, повышают £mod_planet_amenities_add£ §Y$PLANET_AMENITIES_TITLE$§!, а также дают §Y$MOD_LOGISTIC_GROWTH_MULT$§!: §G+1%§!; £job_wg_knight_lord£ §Y$job_wg_knight_lord$§! даёт §Y$MOD_LOGISTIC_GROWTH_MULT$§!: §G+45%§!"
