 planet_bison:0 "Сборочные заводы на полную"
 planet_bison_desc:0 "Все сборочные заводы планеты работают на полную мощность"
 decision_planet_lp:0 "Планетарный обряд обручения"
 decision_planet_lp_desc:0 "Объявляю: каждая корабельная дева этой планеты — моя любимая жена."
 planet_lp:0 "Кольцо обручения"
 planet_lp_desc:0 "Кому обручаться, как не мне."
 decision_planet_noshoes:0 "Порт без обуви"
 decision_planet_noshoes_desc:0 "Кроме меня, кто ещё выдаст им карманные деньги? Так что пусть радуются~~"
 planet_noshoes:0 "Порт без обуви"
 planet_noshoes_desc:0 "Жизнь без обуви — бесконечная радость и комфорт."
 decision_planet_pantsuhd:0 "Трофейная охота"
 decision_planet_pantsuhd_desc:0 "С древности охота на корабли снабжения Глубинных с выгребанием трофеев — любимое развлечение всех возрастов общества корабельных дев. Дикие Глубинные истреблены, но можно выпускать партии для забавы. (§HДобавляет особенность планеты: §! содержание 15 энергокредитов)"
 decision_end_planet_pantsuhd:0 "Завершить трофейную охоту"
 decision_end_planet_pantsuhd_desc:0 "Трусиков мы набрали достаточно — мероприятие закрыто."
 decision_end_planet_pantsuhd_effects_short:0 "Убирает тайл охоты на корабли снабжения."
 planet_pantsuhd:0 "Трофейная охота"
 planet_pantsuhd_desc:0 "Трофейная охота идёт полным ходом"
 decision_planet_Santee:0 "Ау? Взгляни на прибавочную стоимость"
 decision_planet_Santee_desc:0 "Раб умер от переработки — при чём тут мы? Сам не умел чередовать труд и отдых."
 decision_end_planet_Santee:0 "Планетарная служба порядка предупредила: ещё немного переработок рабов — и бунт"
 decision_end_planet_Santee_desc:0 "Чего?! Так можно было ещё гонять рабов?!"
 decision_end_planet_Santee_effects_short:0 "Приостановить эксплуатацию"
 planet_st:0 "Придумать, как загнать этих рабов в график 007"
 planet_st_desc:0 "Не осуждайте меня: в рабы ты пошёл от лени. Если 16 часов в день не хватает на еду — разве ты сам не станешь выходить на 24?"
 planet_mist:0 "Малый портал Лазурного мира"
 planet_mist_desc:0 "Мы ведём активный научный обмен с Лазурным миром."
 decision_planet_mist:0 "Малый портал Лазурного мира"
 decision_planet_mist_desc:0 "Используя NEO, открываем малый портал для связи с Лазурным миром."
 decision_end_planet_mist:0 "Закрыть портал"
 decision_end_planet_mist_desc:0 "По разным причинам нам пришлось прекратить связь с Лазурным миром на этой планете."
 decision_end_planet_mist_effects_short:0 "Убирает тайл расхода NEO."
 planet_NEOB:0 "NEO-стройматериалы"
 planet_NEOB_desc:0 "NEO как отличный материал оптимизирует наши постройки."
 decision_planet_NEOB:0 "NEO-стройматериалы"
 decision_planet_NEOB_desc:0 "NEO даёт большую прочность за меньшие материалы, а обслуживать его — одно удовольствие."
 decision_end_planet_NEOB:0 "Отключить NEO-стройматериалы"
 decision_end_planet_NEOB_desc:0 "По разным причинам мы отказались от NEO как строительного вспомогательного материала."
 decision_end_planet_NEOB_effects_short:0 "Убирает тайл расхода NEO."
 decision_wg_sunflower:0 "Принести подсолнухов в жертву"
 decision_wg_sunflower_desc:0 "Добровольные подсолнухи крепко связывают и отправляют в Храм Подсолнухов, где жрецы проводят торжественный обряд ради благословения божества."
 decision_wg_sunflower_effects_short:0 "100 §Hподсолнухов§! будут принесены в жертву, повышая уровень благословения §G(до 10)§!\nВо время обряда возможны случайные события с бонусами"
 decision_sunflower_pop_requirements:0 "$TRIGGER_FAIL$ Достигнут максимум уровней"
 decision_sunflower_temple_requirements:0 "$TRIGGER_FAIL$ Нужно построить Храм Подсолнухов"
 decision_last_sunflower_pop:0 "$TRIGGER_FAIL$ На колонии нужно население подсолнухов"
 planet_wg_sunflower:0 "Уровень жертвоприношений LV1"
 planet_wg_sunflower_desc:0 "Жертв мало — приносить больше!"
 planet_wg_sunflower2:0 "Уровень жертвоприношений LV2"
 planet_wg_sunflower2_desc:0 "Жертв мало — приносить больше!"
 planet_wg_sunflower3:0 "Уровень жертвоприношений LV3"
 planet_wg_sunflower3_desc:0 "Жертв мало — приносить больше!"
 planet_wg_sunflower4:0 "Уровень жертвоприношений LV4"
 planet_wg_sunflower4_desc:0 "Мы принесли уже изрядно подсолнухов — но можно и ещё!"
 planet_wg_sunflower5:0 "Уровень жертвоприношений LV5"
 planet_wg_sunflower5_desc:0 "Мы принесли уже изрядно подсолнухов — но можно и ещё!"
 planet_wg_sunflower6:0 "Уровень жертвоприношений LV6"
 planet_wg_sunflower6_desc:0 "Мы принесли уже изрядно подсолнухов — но можно и ещё!"
 planet_wg_sunflower7:0 "Уровень жертвоприношений LV7"
 planet_wg_sunflower7_desc:0 "Жертв много — обряд вот-вот завершится!"
 planet_wg_sunflower8:0 "Уровень жертвоприношений LV8"
 planet_wg_sunflower8_desc:0 "Жертв много — обряд вот-вот завершится!"
 planet_wg_sunflower9:0 "Уровень жертвоприношений LV9"
 planet_wg_sunflower9_desc:0 "Жертв много — обряд вот-вот завершится!"
 planet_wg_sunflower10:0 "Уровень жертвоприношений LV10"
 planet_wg_sunflower10_desc:0 "Обряд завершён! Наше божество в восторге!"
 planet_super_harbor:0 "Публичная казнь"
 planet_super_harbor_desc:0 "На этом мире прошла публичная казнь: подвиг истребления еретиков воодушевил жителей и устрашал инакомыслящих, покушавшихся на внутреннюю гармонию Супер-Порта."
 decision_planet_super_harbor:0 "Публичная казнь"
 decision_planet_super_harbor_desc:0 "У нас железобетонные доказательства: эти еретики действовали против власти Супер-Порта. Их казним в прямом эфире — это отлично разжигает энтузиазм верных граждан и показывает нашу волю донести корабледевизм до конца."
 decision_super_harbor_effects_short:0 "100 инопланетного населения будет убито"
 decision_planet_super_harbor_C1PERM:0 "Упрощение процедуры C1-PERM"
 decision_planet_super_harbor_C1PERM_desc:0 "Форма C1-PERM — обязательная для легального рождения каждого гражданина Супер-Порта; обычно её заполнение — адский труд со тысячей граф.\nНо мы решили временно упростить процедуру ради естественного прироста."
 planet_super_harbor_C1PERM:0 "Упрощение процедуры C1-PERM"
 planet_super_harbor_C1PERM_desc:0 "На этой планете заполнять C1-PERM относительно легко."
 decision_port_project:0 "Проект «Планета-Порт»"
 decision_port_project_desc:0 "Мы растворим мир в Порте и построим Порт как мир"
 decision_port_project_effects:0 "Позволяет терраформировать планету в планету Порта"
 decision_port_project_requirements:0 "$TRIGGER_FAIL$ Все районы должны быть городскими"
 decision_dreadnought_project:0 "Проект «Дредноут»"
 decision_dreadnought_project_desc:0 "Мы вместе с NF спроектировали новый дредноут — пора воплотить его в металле."
 decision_dreadnought_project_effects:0 "По завершении — дредноут"
 decision_port_project_relic:0 "Превратить в планету Порта"
 decision_port_project_relic_effects:0 "$decision_port_project_effects$"
 decision_port_project_relic_desc:0 "Эта планета когда-то была живым городским миром. Мы отстроим её как планету Порта."
 decision_port_project_city:0 "Превратить в планету Порта"
 decision_port_project_city_effects:0 "$decision_port_project_effects$"
 decision_port_project_city_desc:0 "Это аркология — чуть-чуть доработать, и будет наша планета Порта."
 decision_planet_kt:0 "Терраформер Глубинных"
 decision_planet_kt_desc:0 "Благодаря обратной разработке древнего терраформера нам хватит нескольких реликвий предтеч, чтобы поднять лимит застройки."
 planet_kt:0 "Терраформировано Глубинными"
 planet_kt_desc:0 "С терраформером наши возможности застройки серьёзно выросли."
 decision_planet_machine_factory:0 "Зарядка сборочных заводов"
 decision_planet_machine_factory_desc:0 "Перегружаем зарядку механики заводов ради скорости сборки."
 planet_machine_factory:0 "Заводы Глубинных заряжены"
 planet_machine_factory_desc:0 "Скорость сборки растёт на глазах."
 decision_planet_sh_clerk:0 "Развёртывание вспомогательных должностей"
 decision_planet_sh_clerk_desc:0 "При избытке населения и нехватке мест Глубинные ставят свободные юниты на подсобные работы. Выработка невелика, но безработицу слегка гасит."
 planet_sh_clerk:0 "Вспомогательные должности Глубинных"
 planet_sh_clerk_desc:0 "Развёрнуто множество вспомогательных должностей Глубинных."
 decision_planet_cancel_sh_clerk:0 "Отозвать вспомогательные должности"
 decision_planet_cancel_sh_clerk_desc:0 "Дополнительные вспомогательные должности снимаются — часть населения сможет занять другие свободные места."
 decision_shenhai_project:0 "Планета Глубинных"
 decision_shenhai_project_desc:0 "Все океаны планеты обращены в анабиозную жидкость Глубинных: население — больше, содержание — ниже"
 decision_shenhai_project_effects:0 "Позволяет терраформировать планету в планету Глубинных"
 decision_shenhai_requirements:0 "Базовые районы планеты больше не зависят от тайлов"
 decision_shenhai1:0 "Планета Глубинных: агроспециализация"
 decision_shenhai1_desc:0 "Эта планета Глубинных будет усилена под аграрию."
 decision_shenhai2:0 "Планета Глубинных: энергоспециализация"
 decision_shenhai2_desc:0 "Эта планета Глубинных будет усилена под генерацию."
 decision_shenhai3:0 "Планета Глубинных: горноспециализация"
 decision_shenhai3_desc:0 "Эта планета Глубинных будет усилена под горное дело."
 planet_shenhai1:0 "Планета Глубинных: агроспециализация"
 planet_shenhai1_desc:0 "Эта планета Глубинных будет усилена под аграрию."
 planet_shenhai2:0 "Планета Глубинных: энергоспециализация"
 planet_shenhai2_desc:0 "Эта планета Глубинных будет усилена под генерацию."
 planet_shenhai3:0 "Планета Глубинных: горноспециализация"
 planet_shenhai3_desc:0 "Эта планета Глубинных будет усилена под горное дело."
 decision_wg_zro:0 "Применить «золотое удобрение»"
 decision_wg_zro_desc:0 "Каждая крупинка этого удобрения — как сингулярная бомба."
 planet_wg_zeo:0 "«Золотое удобрение» применено"
 planet_wg_zeo_desc:0 "Все поля планеты получили новую подкормку — урожай растёт на глазах."
 planet_clovertheater:0 "Надежда будущего"
 planet_clovertheater_desc:0 "Мы выяснили: эта планета со временем способна стать обитаемой. Быть может, в далёком будущем здесь родится новая жизнь."
 decision_planet_sh_to_wsg:0 "Обращение Глубинных"
 decision_planet_sh_to_wsg_desc:0 "Большинство глубинных дев лишились себя лишь из-за искусственного контроля — их можно перепрошить обратно."
 decision_planet_sh_to_wsg_spec:0 "Обращение «Вскрывших лёд»"
 decision_planet_sh_to_wsg_spec_desc:0 "Пока они глубинные девы — они бомба замедленного действия, вскрывшие лёд или нет."
 decision_planet_wsg_to_sh:0 "Оглубинивание дев"
 decision_planet_wsg_to_sh_desc:0 "По сути корабельные девы от Глубинных почти не отличаются — обращение пойдёт легко."
 decision_planet_wsg_to_wsg:0 "Натурализация дев"
 decision_planet_wsg_to_wsg_desc:0 "Корабельные девы из иных миров не отличаются от наших — но кое-какие документы оформить придётся."
 decision_planet_sh_to_sh:0 "Натурализация Глубинных"
 decision_planet_sh_to_sh_desc:0 "Глубинные девы из иных миров, сдав экзамен, могут стать гражданами нашей страны."
 decision_sh_to_sh_effects_short:0 "Приблудная глубинная натурализуется в основного гражданина"
 decision_wsg_to_sh_effects_short:0 "Одна корабельная дева обращается в глубинную"
 decision_sh_to_wsg_effects_short:0 "Одна глубинная дева обращается в корабельную"
 decision_wsg_to_wsg_effects_short:0 "Приблудная корабельная дева натурализуется в основного гражданина"
 decision_num_species_requirements:0 "$TRIGGER_FAIL$ На планете должно быть минимум §R2§! вида"
 decision_wsg_fanatic_xenophile:0 "Культурное взаимопроникновение"
 decision_wsg_fanatic_xenophile_desc:0 "Только многонародное общество неиссякаемо рождает новые культуру и обычаи — и в их сплаве наш мир будет вспыхивать всё новой силой.\n\n§H«Ананас на пицце стал новым трендом — Лондон»§!"
 planet_wsg_fanatic_xenophile:0 "Культурное взаимопроникновение"
 planet_wsg_fanatic_xenophile_desc:0 "Только многонародное общество неиссякаемо рождает новые культуру и обычаи — и в их сплаве наш мир будет вспыхивать всё новой силой.\n\n§H«Мапо-тофу с клубникой стал новым трендом — Аянами»§!"
 wg_knight_home_modifier:0 "§YРодная планета рыцарского ордена§!"
 wg_knight_home_modifier_desc:0 "Этот великий мир — колыбель рыцарского ордена корабельных дев."
 wg_knight_modifier:0 "§YОрденское феодальное владение§!"
 wg_knight_modifier_desc:0 "Этот мир — владение рыцарского ордена: здесь вербуют и тренируют рыцарей."
 decision_planet_wg_knight:0 "§YФеод рыцарского ордена§!"
 decision_planet_wg_knight_desc:0 "Часть этой планеты станет владением рыцарского ордена: здесь будут вербовать и обучать рыцарей."
 decision_planet_wg_knight_effect:0 "Решение позволит строить на планете §Hзамок рыцарского ордена§!\nПозволяет дальнейшее решение §HРыцарский долг§! для усиления выработки рыцарей"
 decision_planet_wg_knight_modifier_effect:0 "Сменить текущий орден на §Yдругой тип§!"
 decision_planet_wg_knight_keyboard:0 "§YРыцарский долг — орден клавиатурных трибунов§!"
 decision_planet_wg_knight_keyboard_desc:0 "Членов этого ордена с детства держали в чатах и на форумах — изучать, как править государством с клавиатуры."
 wg_knight_modifier_keyboard:0 "§YОрден клавиатурных трибунов§!"
 wg_knight_modifier_keyboard_desc:0 "Членов этого ордена с детства держали в чатах и на форумах — изучать, как править государством с клавиатуры."
 decision_planet_wg_knight_modifier_keyboard_effect:0 "Должности £job_wg_knight_lord£ §Y$job_wg_knight_lord$§! и £job_wg_knight£ §Y$job_wg_knight$§! дополнительно дают §G2§! £mod_country_admin_cap_add£ §Y$MOD_COUNTRY_ADMIN_CAP_ADD$§!"
 decision_planet_wg_knight_alloys:0 "§YРыцарский долг — орден стали§!"
 decision_planet_wg_knight_alloys_desc:0 "У членов этого ордена богатый литейный опыт: своё оружие они куют сами."
 wg_knight_modifier_alloys:0 "§YОрден стали§!"
 wg_knight_modifier_alloys_desc:0 "У членов этого ордена богатый литейный опыт: своё оружие они куют сами."
 decision_planet_wg_knight_modifier_alloys_effect:0 "Каждая должность £job_wg_knight_lord£ §Y$job_wg_knight_lord$§! и £job_wg_knight£ §Y$job_wg_knight$§! дополнительно даёт §G4§! £alloys£ §Yсплавов§!, и планета получает $mod_planet_jobs_alloys_produces_mult$: §G+2%§!"
 decision_planet_wg_knight_consumer_goods:0 "§YРыцарский долг — орден шёлка§!"
 decision_planet_wg_knight_consumer_goods_desc:0 "Эти рыцари одеваются роскошно и предъявляют к люксу высочайшие требования."
 wg_knight_modifier_consumer_goods:0 "§YОрден шёлка§!"
 wg_knight_modifier_consumer_goods_desc:0 "Эти рыцари одеваются роскошно и предъявляют к люксу высочайшие требования."
 decision_planet_wg_knight_modifier_consumer_goods_effect:0 "Каждая должность £job_wg_knight_lord£ §Y$job_wg_knight_lord$§! и £job_wg_knight£ §Y$job_wg_knight$§! дополнительно даёт §G4§! £consumer_goods£ §Yтоваров массового спроса§!, и планета получает $mod_planet_jobs_consumer_goods_produces_mult$: §G+2%§!"
 decision_planet_wg_knight_pantsu:0 "§YРыцарский долг — орден трусиков§!"
 decision_planet_wg_knight_pantsu_desc:0 "Эти рыцари идут впереди всех — и трусиков носят на одну пару больше других."
 wg_knight_modifier_pantsu:0 "§YОрден трусиков§!"
 wg_knight_modifier_pantsu_desc:0 "Эти рыцари идут впереди всех — и трусиков носят на одну пару больше других."
 decision_planet_wg_knight_modifier_pantsu_effect:0 "Должности £job_wg_knight_lord£ §Y$job_wg_knight_lord$§! и £job_wg_knight£ §Y$job_wg_knight$§! дополнительно дают §G1§! £sr_pantsu£ §Yтрусиков§!"
 decision_planet_wg_knight_fish:0 "§YРыцарский долг — орден лодырей§!"
 decision_planet_wg_knight_fish_desc:0 "В наслаждениях и дегустации высокого искусства эти благородные рыцари — знатоки."
 wg_knight_modifier_fish:0 "§YОрден лодырей§!"
 wg_knight_modifier_fish_desc:0 "В наслаждениях и дегустации высокого искусства эти благородные рыцари — знатоки."
 decision_planet_wg_knight_modifier_fish_effect:0 "Должности £job_wg_knight_lord£ §Y$job_wg_knight_lord$§! и £job_wg_knight£ §Y$job_wg_knight$§! дополнительно дают §G4§! £unity£, повышая £mod_planet_amenities_add£ §Y$PLANET_AMENITIES_TITLE$§! и £mod_planet_stability_add£ §Y$PLANET_STABILITY_TITLE$§!"
 decision_planet_wg_knight_hospital:0 "§YРыцарский долг — госпитальеры§!"
 decision_planet_wg_knight_hospital_desc:0 "Члены ордена рьяно ведут медицинские исследования и спасают жизни — уровень жизни планеты растёт."
