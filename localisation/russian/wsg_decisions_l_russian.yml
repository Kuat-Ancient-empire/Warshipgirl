 decision_planet_wg_knight_dragon:0 "§RРыцарский долг — орден эфирного дракона§!"
 decision_planet_wg_knight_dragon_desc:0 "Желающий вступить в орден эфирного дракона должен испить вина, очищенного из его крови. Выживший после чаши станет бессмертным воином, несокрушимым стражем мира."
 wg_knight_modifier_dragon:0 "§RОрден эфирного дракона§!"
 wg_knight_modifier_dragon_desc:0 "На этой планете стоят великие воины: они выжили, испив вина из крови эфирного дракона, и обрели великую силу."
 decision_planet_wg_knight_modifier_dragon_effect:0 "Выбрав этот тип ордена, §Rнельзя§! будет сменить его на другой.\nПозволяет вербовать на планете мощную армию: §Yорден эфирного дракона§!"
 wg_dragon_knight:0 "§RОрден эфирного дракона§!"
 wg_dragon_knight_desc:0 "Великий воин, выживший после вина из крови эфирного дракона и обретший великую силу."
