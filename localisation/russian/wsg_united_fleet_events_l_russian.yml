l_russian:

 uf_origin.10002.name:0 "§YНельзя не подписать и не включить United Fleet Shipset!! §!"
 uf_origin.10002.desc:0 "О, старина! Только глянь, что я обнаружил!! Ты не подписал или не включил важнейшую мод-зависимость происхождения Объединения —§YUnited Fleet Shipset§!!\nЗнаешь, что будет дальше? Ты получишь кучу§R коробок§!, §Rпустоты§! или таинственные корабли, §Rстреляющие из звёзд§!, а также мегасооружения из§R коробок§!!\nПодписать и включить ещё не поздно (новая партия не нужна)!! Я буду напоминать этим окном снова и снова! Но если ты готов закрыть глаза — жми вторую кнопку."
 uf_origin.10002.a:0 "Бегу подписывать и включать"
 uf_origin.10002.b:0 "Коробки/пустота — знак высокой цивилизации, и я остаюсь"
 uf_origin.10004.name:0 "Госпожа Чжан"
 uf_origin.10004.desc:0 "Прежде чем ты официально вступишь в высшие звёздные наместницы, я расскажу тебе историю происхождения нашего рода; всех деталей я открыть не могу, но верю — ты вообразишь картины тех дней и вплетёшь собственную фантазию в полотно эпического размаха"
 uf_origin.10004.a:0 "Прошу, начинай"
 uf_vv_desc:0 "§WВенето§! — маршал, закалённая Объединённой войной легенда: мысль точна, храбрость безупречна, чудеса одно за другим; её почитают во флоте превыше всех."
 uf_origin.2.name:0 "Орбитальное кольцо Ностона восстановлено"
 uf_origin.2.desc:0 "Трудами нашей блистательной строительной команды повреждённое кольцо над Ностоном тщательно отреставрировано: все функции в норме, опасный космический мусор расчищен — новая веха в восстановлении Ностона."
 uf_origin.2.a:0 "Великолепно"
 uf_origin.3.name:0 "Площадка орбитального кольца готова"
 uf_origin.3.desc:0 "В системе§H [ring_shipyard_system.GetName]§! готова глубококосмическая площадка под будущее орбитальное кольцо. Стоит скопить ресурсы — и стройку можно начинать в любой миг."
 uf_origin.3.a:0 "Недурно"
 uf_origin.4.name:0 "Орбитальное кольцо достроено"
 uf_origin.4.desc:0 "Трудами нашей блистательной строительной команды кольцо в системе§H [ring_shipyard_system.GetName]§! завершено; все функции прошли тесты."
 uf_origin.4.a:0 "Отлично"
 uf_origin.7.name:0 "Первая станция улавливания сверхмерного вещества"
 uf_origin.7.desc:0 "Прежде сверхмерное вещество можно было наблюдать и ловить лишь в экстремальных средах, искусственно созданных горами сложного оборудования.\nПосле долгих трудов мы возвели первую станцию улавливания — значит, мы наконец владеем серийным производством этого ресурса на острие науки. Мы верим: с ним мы сотворим всё больше чудес!"
 uf_origin.7.a:0 "Великий день"
 uf_origin.10.name:0 "Ядро орбитальной фермы Объединения"
 uf_origin.10.desc:0 "В§H [space_farm_system.GetName]§! мы воздвигли ядро орбитальной фермы! Стоит скопить ресурсы — и стройку фермы можно начинать в любой миг."
 uf_origin.10.a:0 "За работу"
 uf_origin.11.name:0 "Крыло орбитальной фермы Объединения"
 uf_origin.11.desc:0 "Крыло фермы достроено — она уже может давать половину проектной еды."
 uf_origin.11.a:0 "Кто-нибудь голоден?"
 uf_origin.12.name:0 "Орбитальная ферма Объединения"
 uf_origin.12.desc:0 "Орбитальная ферма в§H [space_farm_system.GetName]§! полностью готова: её урожай бесперебойно потечёт в наши миры."
 uf_origin.12.a:0 "Затеваем пир!"
 uf_origin.1012.name:0 "Обжорство……"
 uf_origin.1012.desc:0 "Хотя снабжение едой у нас стабильно, с вестью о завершении первой фермы большинство объединённых кораблей-дев не сдержало обжористого инстинкта и предалось безудержному чревоугодию — даже меры контроля не помогли…… Остаётся дать этому идти своим чередом и дождаться, пока они остынут сами……"
 uf_origin.1012.a:0 "(утираясь) Ты что-то сказал?"
 uf_overeating:0 "Обжорство"
 uf_origin.13.name:0 "Площадка звездоклассного улавливателя"
 uf_origin.13.desc:0 "Несомненно, улавливатель в§H [hyperdimensional_matter_core_system.GetName]§! станет вехой истории нашей цивилизации: достроив его, мы получим неисчерпаемое сверхмерное вещество!\n\nНо радоваться рано: проект исполнен вызовов и опасностей — малейший промах обернётся катастрофой.\nКак бы то ни было, стоит скопить ресурсы — и великая стройка начнётся в любой миг."
 uf_origin.13.a:0 "Вперёд! Вперёд!"
 uf_origin.14.name:0 "Каркас звездоклассного улавливателя"
 uf_origin.14.desc:0 "Неустанными трудами инженеров каркас улавливателя готов: влейте массу энергии и немного сверхмерного вещества как «поджиг» — и зверь оживёт!"
 uf_origin.14.a:0 "Почти готово……"
 uf_origin.15.name:0 "Звездоклассный улавливатель зажжён!"
 uf_origin.15.desc:0 "Влив гигантские ресурсы, мы запустили улавливатель: в конце концов звезда оказалась окутана тонкой плёнкой сверхмерного вещества — наш труд удался!!\nЭнергии звезды хватит и на содержание станции; всё, что нужно докладывать впредь, — сплавы для сбора вещества."
 uf_origin.15.a:0 "Наша история перевернула новую страницу"
 uf_origin.16.name:0 "Сооружения для больших кораблей"
 uf_origin.16.desc:0 "Завершив проект линейного крейсера Объединения, мы с неловкостью обнаружили: нынешних мощностей не хватит ни на один сверхмерный корабль покрупнее.\n\nЯсно, что амбиции империи шире: знаменитый клавиатурный конструктор§H Кэбот§! из имперского интернета уже проектирует§R сотни§! суперкораблей размером с галактику.\n\nЧтобы проектировать корабли покрупнее, нам нужен коренной апгрейд мощностей под всё возрастающие аппетиты сверхмерного кораблестроения."
 uf_origin.16.a:0 "Крайне необходимо"
 uf_origin.17.name:0 "Эпоха Объединения"
 uf_origin.17.desc:0 "С разработкой космических ресурсов и постижением сверхмерного вещества наше общество вступило в невиданный расцвет.\n\nВерховный флагман госпожа Чжан, отметив наши свершения, напомнила: рано почивать на лаврах — старые общественные идеи и институты постепенно сотрут это преимущество; необходима глубокая реформа."
 uf_origin.17.a:0 "Вслед указаниям верховного флагмана"
 uf_origin.17.a.response:0 "Открывает цепочку§Y «Вперёд, в будущее»§!"
 ap_uf_1_chain_title:0 "Вперёд, в будущее"
 ap_uf_1_chain_desc:0 "Нельзя цепляться за настоящее: империи нужен коренной переворот.\n\n\nНаграда: §Yоткрывается больше сверхмерных технологий§!\nСлотов граждан §G+1§!\nОткрывается больше: §Yсверхмерных указов§!\nОткрывается§Y продолжение сюжета§!"
 uf_progress_1:0 "Освоение сверхмерья"
 uf_progress_1_DESC:0 "Старые объекты уже не поспевают за нуждами — старым созданиям нужен большая смена поколений.\n\n\nНаграда: §Yбольше сверхмерных технологий физики и инженерии§!"
 uf_progress_2:0 "Прогресс личности"
 uf_progress_2_DESC:0 "Общество соткано из малых личностей: когда растёт каждая — эволюционирует всё общество.\n\n\nНаграда: §Yгенные и ИИ-технологии применяются к населению и лидерам§!"
 uf_progress_3:0 "Гражданские права"
 uf_progress_3_DESC:0 "В огромной империи живут самые разные виды; как ужиться с ними в мире — вопрос достойный. Ради вечного покоя общества нужны перемены.\n\n\nНаграда: §Yполитика ассимиляции населения§!§R (если открыта — дадим другую награду)§!"
 ap_uf_porject_counter:0 "Завершённые нововведения"
 uf_origin.18.name:0 "Вперёд, в будущее: освоение сверхмерья"
 uf_origin.18.desc:0 "Годы труда — и большинство объектов империи получило сверхмерные интерфейсы; заложены резервы под будущие апгрейды."
 uf_origin.18.a:0 "Я вижу зарю будущего"
 uf_origin.18.a_tooltip:0 "§YОткрывается больше сверхмерных технологий физики и инженерии§!"
 uf_origin.19.name:0 "Вперёд, в будущее: прогресс личности"
 uf_origin.19.desc:0 "Мы завершили генмодификацию всех граждан-кораблей-дев Объединения и апгрейд всех оснащений ИИ.\nТеперь даже самая обычная из нас легко бьёт рекорды, что прежде давались лишь профи."
 uf_origin.19.a:0 "Малый шаг каждого — великий шаг общества."
 uf_origin.19.a_tooltip:0 "§YОбъединённые корабли-девы и лидеры получают лучшие черты§!"
 uf_origin.20.name:0 "Вперёд, в будущее: гражданские права"
 uf_origin.20.desc:0 "Мир и дружелюбие — наш вечный курс; к войне мы прибегнем лишь в крайности.\nНыне и в обозримом будущем к великой империи будет примыкать всё больше инопланетных подруг. Чтобы жить с ними в ладу, мы можем новейшей наукой обратить их — душой и телом — в наших объединённых кораблей-дев."
 uf_origin.20.a:0 "Больше сестёр."
 uf_origin.22.name:0 "Вперёд, в будущее: гражданские права"
 uf_origin.22.desc:0 "Мир и дружелюбие — наш вечный курс; к войне мы прибегнем лишь в крайности.\nНыне и в обозримом будущем к великой империи будет примыкать всё больше инопланетных подруг; мы будем жить с ними в ладу, а можем и передовой наукой обратить их в нас."
 uf_origin.22.a:0 "Держимся исповедуемого"
 uf_chain_unity:0 "Вперёд, в будущее"
 uf_origin.23.name:0 "Станция предупреждения об опасностях"
 uf_origin.23.desc:0 "Наша галактика так прекрасна, но под красотой таятся опасности: гиперпространственные бури, враждебная фауна, микрометеориты……\nТеперь мы творим историю — строим для всей галактики маяк, открывая главу единства и доброжелательности."
 uf_origin.23.a:0 "За светлое будущее!"
 uf_origin.24.name:0 "Станция предупреждения об опасностях"
 uf_origin.24.desc:0 "Маяк всей галактики — станция предупреждения об опасностях Объединения — построена в§H [ews_system.GetName]§!: через одно из свойств сверхмерного вещества она ведёт для всей галактики предупреждения и трансляции в реальном времени — выиграют все!"
 uf_origin.24.a:0 "Мы станем маяком! Осветим всю галактику!"
 uf_origin.27.name:0 "Посол"
 uf_origin.27.desc:0 "Я посол§Y [ews_thank_country.GetName]§!; мы прибыли с благодарностью и хвалой.\n\nОт всего сердца мы благодарим вас за подвиг со станцией предупреждения: трудно вообразить цивилизацию, что безвозмездно строит маяк для всей галактики. Вы — образец для всех цивилизаций, пример для нас всех!!\nОт имени§Y [ews_thank_country.GetName]§! вновь приношу вам высочайшее почтение.\n\n§YСлава Объединению!! §!"
 uf_origin.27.a:0 "Мы просто хотели сделать галактику лучше!"
 uf_origin.28.name:0 "Наше время"
 uf_origin.28.desc:0 "Сегодня мы словно возродились: каждый в лучшей форме встречает зарю новой эры.\n\nВсе граждане империи сверху донизу празднуют сотворённое нами чудо. Ныне мы готовы к вызовам будущего."
 uf_origin.28.a:0 "Слава Объединению"
 uf_chain_finished:0 "Эпоха Объединения"
 uf_origin.29.name:0 "Обновление завершено"
 uf_origin.29.desc:0 "Мы завершили перевооружение доков нового поколения: крупным сооружениям вроде орбитальных колец хватит пары простых установок, а компактным звёздным базам придётся навешивать доковые капсулы.\nКак бы то ни было, можно постепенно разворачивать проектирование больших кораблей."
 uf_origin.29.a:0 "Слава Объединению"
 uf_origin.29.a_tooltip:0 "§YОткрывается проектирование новых больших кораблей§!"
 uf_large_shipyard_design:0 "Крупные сверхмерные доковые мощности"
 uf_large_shipyard_design_DESC:0 "Старые доки уже не тянут большие сверхмерные корабли — нужны новые, больше и совершеннее."
 uf_origin.30.name:0 "Отстроим наш дом заново"
 uf_origin.30.desc:0 "Объединённая война окончилась много лет назад, но раны её не затянулись.\nГибель Ностона, изрытые города, бездомный люд и звёздные кладбища в космосе — снова и снова срывают наши болезненные струпья.\n\nНо тучи развеются, и яркое солнце вновь озарит землю. Ныне — единые, объединённые — мы обязаны всем миром отстроить наш дом."
 uf_origin.30.a:0 "Слава Объединению! Вместе отстроим дом!"
 uf_origin.31.name:0 "Космический мусор расчищен"
 uf_origin.31.desc:0 "Мы завершили расчистку обломков домашней системы — все гиперкоридоры свободны."
 uf_origin.31.a:0 "Отлично"
 uf_origin.32.name:0 "Монумент построен"
 uf_origin.32.desc:0 "Торжественный монумент воздвигнут: каждая погибшая в Объединённой войне запомнена — да обретёт она вечный покой.\n\nВойна много у нас отняла — и многому научила. Нам тем более следует быть единым целым, Объединением — и действовать сообща. Не дай нам вновь узнать жестокую войну."
 uf_origin.32.a:0 "Живём настоящим"
 uf_rebuilding_unity:0 "Память ушедших"
 uf_origin.33.name:0 "Экология Ностона восстановлена"
 uf_origin.33.desc:0 "Влив гору людей и средств, мы завершили эковосстановление Ностона!\nЛазурные чистые моря вновь явились на этой многострадальной планете; жителям больше не нужны защитные костюмы — под ярким солнцем вовсю гуляют и ликуют все без исключения.\n\nСтоит добавить: работа подарила нам бесценный опыт терраформирования — образец на будущее."
 uf_origin.33.a:0 "Вдохнём свежего воздуха!"
 uf_rebuilding_planet:0 "Опыт эковосстановления"
 uf_origin.34.name:0 "Слава Объединению"
 uf_origin.34.desc:0 "Ныне мы гордо объявляем: мы вышли из мрака Объединённой войны! Тучи развеялись, яркое солнце вновь светит каждому из нас.\n\nБоль войны сделала народ зрелее и привела к Объединению; мы готовы к вызовам звёзд!"
 uf_origin.34.a:0 "Слава Объединению!"
 uf_rebuilding_homeworld_title:0 "Отстроим наш дом заново"
 uf_rebuilding_homeworld_desc:0 "Гибель Ностона, изрытые города, бездомный люд и звёздные кладбища в космосе — снова и снова срывают наши болезненные струпья.\n\nНо тучи развеются, и яркое солнце вновь озарит землю. Ныне — единые, объединённые — мы обязаны всем миром отстроить наш дом."
 uf_rebuilding_homeworld_progress_1:0 "Расчистить космический мусор"
 uf_rebuilding_homeworld_progress_1_DESC:0 "В Объединённую войну 3-й флот Объединения вместе с основными силами сепаратистов того времени стал ледяной стальной могилой в космосе.\n\nОбломки разбросаны по нескольким важным трассам снабжения и всерьёз мешают навигации."
 uf_rebuilding_homeworld_progress_2:0 "Воздвигнуть монумент павшим"
 uf_rebuilding_homeworld_progress_2_DESC:0 "В нашей культуре после смерти не должно быть ни «той жизни», ни круговорота с повторением прежних мук и ошибок — после смерти положен полный покой. Живущие же в меру сил помнят ушедших.\nОбъединённая война отняла у нас слишком много; следует воздвигнуть торжественный монумент памяти каждой погибшей сестре.\n§YНе изучайте этот спецпроект — результата не будет\nПостройте на столице здание: §!§R монумент павшим§!\n§YПосле постройки спецпроект не отметится выполненным — это ни на что не влияет§!"
 uf_rebuilding_homeworld_progress_3:0 "Восстановить экосферу Ностона"
 uf_rebuilding_homeworld_progress_3_DESC:0 "За Объединённую войну Ностон принял не менее 4000 звездоклассных водородных бомб; 80% суши стало радиационной пустошью. Жителю Ностона, чтобы выйти из экокапсулы, нужен толстый защитный костюм.\nК счастью, наука у нас уже достаточна, чтобы отстроить этот мир."
 rebuilding_homeworld_counter:0 "Завершённые работы"
 uf_origin.35.name:0 "Нехватка питания"
 uf_origin.35.desc:0 "Мы завершили несколько корабельных систем оружия на сверхмерном веществе; их мощь — знак успеха.\nНо у них есть смертельный изъян —§Rчудовищное энергопотребление§!: нам пришлось мириться с соседством передового и отсталого. Вообразите цивилизацию со звёздными флотами, чья пехота в железных доспехах дерётся дубинами — вот наш нынешний вид.\n\nНаука предложила два пути к малому сверхмерному реактору.\n§YПлан 1: §! исследовать масс-ускоритель — быстрее и точнее получить нужные значения; потребуется планетарное мегасооружение.\n§YПлан 2: §! лить горы сверхмерного вещества на переборные тесты — временем и ресурсами придётся пожертвовать изрядно."
 uf_origin.35.a:0 "Крайне необходимо"
 uf_hm_reactor_project_1:0 "План 1: масс-ускоритель"
 uf_hm_reactor_project_1_DESC:0 "Мы исследуем масс-ускоритель, дающий нужные значения быстрее и точнее."
 uf_hm_reactor_project_2:0 "План 2: переборные тесты"
 uf_hm_reactor_project_2_DESC:0 "Можно перебирать варианты, тратя массу времени и ресурсов.\nПосле запуска проект ежемесячно списывает§R 30§! £sr_uf£ §Y$sr_uf$§!"
 uf_hm_reactor_project_3:0 "Ускоритель сверхмерного вещества"
 uf_hm_reactor_project_3_DESC:0 "Наша команда разработала масс-ускоритель специально под сверхмерное вещество.\n\n§YНе изучайте этот спецпроект — результата не будет§!\nПостройте на§Y газовом гиганте§! без§Y спутников§! мегасооружение§G «Ускоритель сверхмерного вещества Объединения»§!\n\n\nЧтобы ты не искал такую планету — я добавил одну в твою домашнюю систему"
 uf_hm_reactor_project_modifier:0 "Расход сверхмерных исследований"
 uf_origin.37.name:0 "Ускоритель сверхмерного вещества"
 uf_origin.37.desc:0 "Научная команда подала проект ускорителя сверхмерного вещества: ищем§Y газовый гигант§! без§Y спутников§! — и строим это исполинское сооружение; по завершении получим все нужные данные."
 uf_origin.37.a:0 "За работу"
 uf_origin.38.name:0 "Сила — в массе"
 uf_origin.38.desc:0 "Трудами научной команды мы выудили нужные данные из бесконечных тестов — направление сверхмерного реактора прояснилось."
 uf_origin.38.a:0 "Наградить их"
 uf_origin.41.name:0 "Ускоритель достроен"
 uf_origin.41.desc:0 "Неустанными трудами в§H [uf_hm_ring_system.GetName]§! мы достроили ускоритель сверхмерного вещества: заправь чуть-чуть вещества как стартёр — и мегасооружение оживёт."
 uf_origin.41.a:0 "Блестяще"
 uf_origin.42.name:0 "Кружение"
 uf_origin.42.desc:0 "Ускоритель раскрутился и вышел на проектный режим; параметры сверхмерного вещества схвачены один за другим — нужное получено, проект реактора ясен.\n\nНо — то ли от природы вещества, то ли от сверхскоростного вращения — атмосфера газового гиганта под кольцом стала утекать, обнажив самое ядро. Прохожий порожний транспортник помог собрать немного пригодного газа."
 uf_origin.42.a:0 "Великолепно"
 uf_origin.42.a.response:0 "§YЗавершить цепочку сверхмерного реактора§!"
 uf_origin.43.name:0 "Сверхмерный реактор"
 uf_origin.43.desc:0 "Мы провели несколько опытов оружиефикации сверхмерного вещества; у них один смертельный изъян —§Rчудовищное энергопотребление§!: жизненно нужен более эффективный корабельный реактор.\nНаука предложила два пути к малому сверхмерному реактору.\n§YПлан 1: §! исследовать масс-ускоритель — быстрее и точнее получить нужные значения; потребуется планетарное мегасооружение.\n§YПлан 2: §! лить горы сверхмерного вещества на переборные тесты — временем и ресурсами придётся пожертвовать изрядно."
 uf_origin.48.name:0 "Сверхмерная революция"
 uf_origin.48.desc:0 "Сверхмерное вещество вошло во все уголки общества — от будильника до мегасооружений, застилающих звёзды. Всё цветёт, но внимательные умы заметили: выжимать из вещества новые знания всё труднее.\nИ помимо этого, есть путь, который мы§Y не измышляли прежде§! — применить этот ресурс к§Y самим себе§!.\n\nБыть может, применение сверхмерного вещества к себе обернётся необратимым, а может — станет ключом к новому миру и даже избавит нас от вечно страшной§R смерти§!. Как бы то ни было — надо пробовать."
 uf_origin.48.a:0 "Развернуть спецпроект и начать исследования."
 uf_origin.49.name:0 "Возможные пути"
 uf_origin.49.desc:0 "Наука провела массу теоретических споров и тестов: применить сверхмерное вещество к личности возможно, и установка разработана — но уверенности в успехе нет ни у кого.\n\nДля этого опаснейшего опыта с неведомым исходом наша высшая звёздная наместница§Y [Root.GetRulerName]§! выступила добровольной пионеркой. Она заявила: с самого начала она поклялась в вечной верности Объединённому флоту и водительству госпожи Чжан, готова отдать всё, включая жизнь, — и страха у неё нет."
 uf_origin.49.a:0 "Воздать почести§Y [Root.GetRulerName]§!"
 uf_origin.50.name:0 "Во тьме"
 uf_origin.50.desc:0 "Настал день применения сверхмерного вещества к нашей высшей наместнице§Y [Root.GetRulerName]§!: приборы проверены многократно, состояние её тела — тоже, но мы знаем — путь впереди всё равно лежит во тьме.\n[Root.GetRulerName] станет фонарщицей, разгоняющей мрак, и осветит нам дорогу на ту сторону. [Root.GetRulerName]— наш факел."
 uf_origin.50.a:0 "Дай нам успех."
 uf_origin.51.name:0 "Сверхмерное пробуждение"
 uf_origin.51.desc:0 "Опыт завершён: в нашу высшую наместницу§Y [Root.GetRulerName]§! вживлены устройства связи со сверхмерной сетью и сопутствующие модификации.\nВ процессе§Y [Root.GetRulerName]§! впала в кому — мы почти думали, что теряем её…… Но вскоре показатели поползли вверх, и она очнулась; все в зале не сдержали ликующего крика.\nЗа дни наблюдения [Root.GetRulerName] чувствует себя хорошо: состарившиеся клетки тела непрерывно замещаются новыми — сверхмерное пробуждение удалось!\n[Root.GetRulerName] рассказала: в коме она, кажется, достигла§H сверхмерного плана§! и увидела знания, к которым мы не прикасались; теперь она напрямую связана со сверхмерной сетью — эффективность взлетела.\n\nТеперь мы гордо можем даровать это каждой корабли-деве Объединённого флота."
 uf_origin.51.a:0 "Слава Объединению!"
 uf_origin.52.name:0 "Сверхмерная революция"
 uf_origin.52.desc:0 "Операцию сверхмерного пробуждения прошла каждая корабельная дева Объединённого флота: все подключены к сети напрямую и видят мир под невиданным углом. Заодно выяснилось: стареющие клетки непрерывно замещаются — пожилые возвращают себе юность. Мы победили смерть! Обрели бессмертие!!\n\nВдобавок мы исследовали ряд§G сверхмерных генетических технологий§!, укрепляющих нас, носителей сверхмерного тела."
 uf_origin.52.a:0 "Слава Объединению!"
 ap_uf_2_chain_title:0 "Сверхмерная революция"
 ap_uf_2_chain_desc:0 "Исследования сверхмерного вещества заходят в тупик — мы решили изучить его применение к самим себе; возможно, это ключ к новому миру."
 uf_progress_4:0 "Теория"
 uf_progress_4_DESC:0 "Мы изучим возможность применения сверхмерного вещества к личности."
 uf_progress_5:0 "Самоотдача§Y [Root.GetRulerName]§!"
 uf_progress_5_DESC:0 "Наша высшая наместница§Y [Root.GetRulerName]§! решила пожертвовать собой и стать пионеркой этого опасного опыта."
 uf_progress_6:0 "Сверхмерное пробуждение"
 uf_progress_6_DESC:0 "Высшая наместница§Y [Root.GetRulerName]§! освятила нам путь — пора применить результат к каждой из нас."
 uf_origin.53.name:0 "Звездоклассный улавливатель"
 uf_origin.53.desc:0 "Всё это время мы думали, как сжать производство сверхмерного вещества для плотной застройки; но мы уже умеем строить звездоклассные мегасооружения — почему не подумать наоборот и не возвести звездоклассный улавливатель ради гигантских объёмов вещества? Пора начинать великий проект!!"
 uf_origin.53.a:0 "Начинаем!"
 uf_origin.54.name:0 "Панталончики?"
 uf_origin.54.desc:0 "Мы провели тест проекта извлечения ресурсов из иных измерений и получили из неведомого плана странный ресурс…… Похоже на§Y панталончики§!?\nНепонятно, зачем какой-то цивилизации считать это редким ресурсом, но одна научная сотрудница доложила: на голове носить — забавно."
 uf_origin.54.a:0 "Неплохо; только больше не тяните этот ресурс."
 uf_pantsu:0 "Панталончики на голове"
 uf_origin.55.name:0 "Платформа Обсидиановой цитадели Объединения"
 uf_origin.55.desc:0 "В§H [fortress_system.GetName]§! мы построили платформу Обсидиановой цитадели: хватит ресурсов — и она станет сильнейшей обороной или цитаделью передовой.\n\nТеперь решаем, что строить: $uf_star_fortress_megastructure_2$ или $uf_star_fortress_megastructure_3$."
 uf_origin.55.a:0 "$uf_star_fortress_megastructure_2$"
 uf_origin.55.b:0 "$uf_star_fortress_megastructure_3$"
 uf_origin.56.name:0 "Каркас Обсидиановой цитадели готов"
 uf_origin.56.desc:0 "Каркас цитадели в§H [fortress_system.GetName]§! готов; далее заполняем сверхмерным веществом для зажигания реактора и выбираем: §Yоборонительная цитадель§! или§Y подвижная передовая§!.\n§RСначала сохраните проект Обсидиановой цитадели в редакторе флотов§!"
 uf_origin.56.a:0 "Как величественно"
 uf_origin.57.name:0 "Обсидиановая цитадель построена"
 uf_origin.57.desc:0 "Цитадель в§H [fortress_system.GetName]§! готова: она станет несокрушимой стеной или величественной передовой базой. Захоти — можем строить в системе ещё."
 uf_origin.57.a:0 "Великолепно"
 uf_origin.58.name:0 "§HЗатянутый небесами мир§!: окутал [Root.GetName]"
 uf_origin.58.desc:0 "Неустанными трудами весь [Root.GetName] укрыт плотной застройкой со сверхмерными объектами; исполин на синхронной орбите — словно щит или полог небес — гасит вред переуплотнённого вещества.\n\nЭто свершение позволяет нам гордо объявить: [Root.GetName] покорён по-настоящему."
 uf_origin.58.a:0 "Слава Объединению!!"
 uf_origin.59.name:0 "§HСверхмерное кольцо§!: воздвигнуто на [Root.GetName]!"
 uf_origin.59.desc:0 "За годы труда [Root.GetName] почти целиком перестроен: сверхмерные объекты ныне по всей ленте."
 uf_origin.59.a:0 "Слава Объединению!!"
 uf_origin.60.name:0 "Теория звездосистемных кораблей"
 uf_origin.60.desc:0 "Теперь у нас хватает инженерной мощи и науки построить свой звездосистемный корабль — величайший гигант в истории галактики, слава наша!!"
 uf_origin.60.a:0 "Слава Объединению!!"
 uf_glory_design:0 "Проект звездоклассного корабля"
 uf_glory_design_DESC:0 "Мы задумали построить воистину звездоклассный корабль — он станет нашей славой!!"
 uf_origin.61.name:0 "Объединённая слава"
 uf_origin.61.desc:0 "Трудами научно-конструкторской команды мы завершили проект Объединённой славы: невиданный исполин, пред которым меркнут и звёзды!! Инженеры готовы — строить этих суперкораблей можно в любой миг."
 uf_origin.61.a:0 "Наградить всех проектировщиков; слава Объединению!!"
 uf_origin.62.name:0 "Платформа Объединённой славы"
 uf_origin.62.desc:0 "Строительные сооружения Объединённой славы готовы в§H [uf_glory_system.GetName]§!: она будет звездосистемным кораблём, способным застиласть звёзды."
 uf_origin.62.a:0 "Великолепно!"
 uf_origin.63.name:0 "Основной корпус Объединённой славы"
 uf_origin.63.desc:0 "Основной корпус готов, но пока это пустая оболочка — нужны дальнейшие агрегаты."
 uf_origin.63.a:0 "Ни минуты покоя!"
 uf_origin.64.name:0 "Реактор Объединённой славы готов"
 uf_origin.64.desc:0 "Реактор Объединённой славы построен; для безопасности ведём его на минимальной мощности. Далее — вооружение."
 uf_origin.64.a:0 "Слышите гул реактора!"
 uf_origin.65.name:0 "Вооружение Объединённой славы смонтировано"
 uf_origin.65.desc:0 "Всё вооружение установлено; осталась заправка сверхмерным веществом для зажигания реактора. Завершим — и увидим, как исполин выходит в море!\n§RСначала сохраните проект Объединённой славы в редакторе флотов§!\n§RСначала сохраните проект Объединённой славы в редакторе флотов§!\n§RСначала сохраните проект Объединённой славы в редакторе флотов§!"
 uf_origin.65.a:0 "Зажигание!!"
 uf_origin.66.name:0 "Объединённая слава построена"
 uf_origin.66.desc:0 "Реактор Объединённой славы зажёгся — она медленно покидает домашнюю гавань! Звездосистемный корабль достроен!!\nЗахоти — можем построить и вторую."
 uf_origin.66.a:0 "Слава Объединению!!"
 uf_origin.67.name:0 "Управление гиперкоридорами между§H [uf_hyperlane_a_target.GetName]§!§H [uf_hyperlane_b_target.GetName]§! и§H [uf_hyperlane_c_target.GetName]§!§H [uf_hyperlane_d_target.GetName]§!"
 uf_origin.67.desc:0 "Мы активировали узлы гиперкоридоров между системами§H [uf_hyperlane_a_target.GetName]§!§H [uf_hyperlane_b_target.GetName]§! и§H [uf_hyperlane_c_target.GetName]§!§H [uf_hyperlane_d_target.GetName]§! — теперь выбираем: удалить гиперкоридор или добавить.\n\n§RСоединение при существующем гиперкоридоре ничего не даст\nУдаление несуществующего гиперкоридора ничего не даст§!"
 uf_origin.67.a:0 "Хочу, чтобы системы были соединены"
 uf_origin.67.b:0 "Удалить гиперкоридор между ними"
 uf_origin.67.c:0 "Ладно, план отменяется"
 uf_origin.69.name:0 "Узел гиперкоридоров в§H [hyperlane_point_system.GetName]§! построен"
 uf_origin.69.desc:0 "В§H [hyperlane_point_system.GetName]§! мы завершили узел гиперкоридоров: имея узлы A и B одновременно, сможем управлять гиперкоридором между этими системами."
 uf_origin.69.a:0 "Отлично!"
 uf_origin.70.name:0 "Площадка сверхмерного дока"
 uf_origin.70.desc:0 "В§H [uf_shipyard_base_system.GetName]§! мы завершили площадку сверхмерного дока Объединения; достроив её, получим у соседней системы полностью рукотворную систему со сверхмерным доком."
 uf_origin.70.a:0 "Система, сотворённая нами!"
 uf_origin.71.name:0 "Сверхмерная система воздвигнута"
 uf_origin.71.desc:0 "Создать в пустоте искусственную систему — задача исполинская, но мы развернули в цели сверхмерную сеть и воздвигли сверхгигантское сооружение; гиперкоридор подключён — продолжаем достройку дока внутри сверхструктуры."
 uf_origin.71.a:0 "Великолепно!"
 uf_origin.72.name:0 "Каркасы консолей дока"
 uf_origin.72.desc:0 "Первая стадия завершена: на ядро добавлены каркасы четырёх консольных доков для стоянки и обслуживания; вливайте ресурсы до конца."
 uf_origin.72.a:0 "Не терпится"
 uf_origin.73.name:0 "Консольные доки"
 uf_origin.73.desc:0 "Консольные доки готовы на 80%: ещё монтаж и отладка — и сильнейший док галактики заработает."
 uf_origin.73.a:0 "Великолепно!"
 uf_origin.74.name:0 "Сверхмерный док построен!"
 uf_origin.74.desc:0 "Все компоненты дока установлены; первичные тесты пройдены."
 uf_origin.74.a:0 "Слава Объединению!!"
 uf_origin.77.name:0 "Конец системы"
 uf_origin.77.desc:0 "[From.From.GetName] обратил(а) [From.GetName] в чёрную дыру; крупные тела системы погибли вместе со звездой — уцелеть суждено лишь кораблям Объединённого флота.\n\nТеперь звездорушитель [From.From.GetName] и чёрная дыра [From.GetName] слагают умопомрачительно прекрасный пейзаж."
 uf_origin.77.a:0 "Восторг"
 uf_origin.79.name:0 "Карнавал??"
 uf_origin.79.desc:0 "[From.From.GetName] обратил(а) жителей [From.GetName] в наших объединённых кораблей-дев — и, к изумлению, те сами устроили праздник в честь того, что наконец стали кораблями-девами.\nКак бы то ни было, жители [From.GetName] теперь — сёстры нашего Объединённого флота."
 uf_origin.79.a:0 "Эм…… ладно"
 uf_origin.80.name:0 "Площадка межпространственного экстрактора"
 uf_origin.80.desc:0 "В§H [uf_shipyard_base_system.GetName]§! мы завершили площадку экстрактора: бессчётные ресурсы иных измерений ждут нас."
 uf_origin.80.a:0 "Ура"
 uf_origin.81.name:0 "Кольцо смонтировано"
 uf_origin.81.desc:0 "Экстрактор в§H [uf_shipyard_base_system.GetName]§! получил кольцо: первые порции материи уже выкачаны."
 uf_origin.81.a:0 "Ставим координаторы"
 uf_origin.82.name:0 "Нижний координатор установлен"
 uf_origin.82.desc:0 "Нижний сверхмерный координатор смонтирован — эффективность растёт экспоненциально."
 uf_origin.82.a:0 "Отлично"
 uf_origin.83.name:0 "Экстрактор построен"
 uf_origin.83.desc:0 "Межпространственный экстрактор в§H [uf_shipyard_base_system.GetName]§! готов! Ресурсы хлещут потоком."
 uf_origin.83.a:0 "Бессчётные сокровища"
 uf_origin.85.name:0 "Площадка университета звёздного моря"
 uf_origin.85.desc:0 "Площадка университета готова в§H [uf_galactic_university_system.GetName]§!: достроим — и позовём лучшие умы галактики вместе двигать её вперёд."
 uf_origin.85.a:0 "Знание — ключ к тайнам вселенной"
 uf_origin.86.name:0 "Университет звёздного моря построен"
 uf_origin.86.desc:0 "Трудами наших университет в§H [uf_galactic_university_system.GetName]§! возведён!! Он станет лестницей прогресса цивилизаций галактики и подарит всем светлое будущее!\n\n§GМожно продолжать строить филиалы§!"
 uf_origin.86.a:0 "Учись и сверши"
 uf_origin.87.name:0 "Площадка филиала"
 uf_origin.87.desc:0 "Площадка филиала готова в§H [uf_galactic_university_system.GetName]§! — он войдёт в число лучших школ империи."
 uf_origin.87.a:0 "Знание — ключ к тайнам вселенной"
 uf_origin.88.name:0 "Филиал построен"
 uf_origin.88.desc:0 "Филиал в§H [uf_galactic_university_system.GetName]§! готов: науки у него меньше, чем у главного, но это всё равно одна из сильнейших наших школ."
 uf_origin.88.a:0 "Учись и сверши"
 uf_origin.89.name:0 "Вооружённый инженерно-научный корабль Объединения"
 uf_origin.89.desc:0 "§HВооружённый инженерно-научный корабль Объединения§! — научное судно нового типа с частью функций инженерного.\nЗавершив исследование системы и имея на складе £alloys£§Y$alloys$§! больше§G 80§!, а £influence£§Y$influence$§! больше§G 50§!, оно само возводит там звёздную базу и добывающие станции (списывает§G 80§! £alloys£§Y$alloys$§! и§G 50§! £influence£§Y$influence$§!).\n§YPS:\n1. Если соседняя система — воинственно-изолированная павшая империя, база не строится\n2. Не нужны база и станции — отключите функцию в политике§!"
 uf_origin.89.a:0 "Ура"
 uf_origin.90.name:0 "Мир славы! Отплытие!"
 uf_origin.90.desc:0 "Один из величайших рукотворных корпусов нашей истории — мир Объединённой славы — начал строиться в§H [uf_mega_habitat_system.GetName]§!: мы сотворим настоящую утопию!"
 uf_origin.90.a:0 "Ради нашей собственной утопии"
 uf_origin.91.name:0 "Мир славы — короб и ядро"
 uf_origin.91.desc:0 "Блистательная команда воздвигла короб мира славы и ядро внутри; в жилом ядре уже идёт колонизация и первые стройки — продолжаем совершенствовать этот великий мир."
 uf_origin.91.a:0 "Слава Объединению!"
 uf_origin.93.name:0 "Мир славы — каркас"
 uf_origin.93.desc:0 "Базовый каркас готов, врата мира славы запущены — стройка сильно ускорится. Далее — верхний каркас и жилое крыло."
 uf_origin.93.a:0 "Великолепно!"
 uf_origin.94.name:0 "Мир славы — жилое крыло"
 uf_origin.94.desc:0 "Каркасы верхнего яруса и лопастей готовы; последний, решающий шаг — экосекторы жилого крыла."
 uf_origin.94.a:0 "Мы стоим у врат утопии"
 uf_origin.95.name:0 "Мир Объединённой славы построен!"
 uf_origin.95.desc:0 "После долгих трудов экосекторы восьми жилых крыльев завершены; строители уже заселяют этот величественный мир — мы сотворили этот§Y великий артефакт! §!\n\nБольшая часть объектов мира славы автоматизирована и напрямую связана со сверхмерной сетью: теоретически районы мира§H бесконечны§! Для удобства каждый особый район, кроме ядра, ведает двумя жилыми крыльями."
 uf_origin.95.a:0 "Слава Объединению!"
 uf_origin.97.name:0 "Звёздный город развлечений Объединения"
 uf_origin.97.desc:0 "Долгожданный звёздный город развлечений Объединения построен в§H [uf_star_city_system.GetName]§!!\nНа этом оживлённом кольцевом комплексе — тьма новейших забав. Отдельного слова достойны его гастрономические этажи: даже Лига гастрокритиков объявила, что селится тут надолго."
 uf_origin.97.a:0 "Собираю чемодан — мне нужен отпуск"
 uf_origin.98.name:0 "Проект межсистемного оружия"
 uf_origin.98.desc:0 "Мы сотворили тьму чудес: корабли, застилающие небо, и даже искусственные звёздные системы.\n\nОпираясь на сверхмерную сеть и рукотворные системы, мы наконец можем замыслить§H сверхдальнее межсистемное§! оружие удара."
 uf_origin.98.a:0 "Звёзды принадлежат нам"
 uf_origin.99.name:0 "Меч Объединения"
 uf_origin.99.desc:0 "Наука предложила теоретически исполнимый план межсистемного удара:\nсначала найти способ собрать массы сверхмерного вещества; затем через сверхмерную сеть сотворить§Y канал поперёк широт§!, временно соединяющий цель и точку залпа; наконец, излить этот исполинский сгусток энергии в целевую систему — вот и§Y межсистемный удар§!\n\nНаправление есть — осталось за деталями."
 uf_origin.99.a:0 "Недурно"
 tech_uf_sword:0 "Межсистемное оружие удара"
 tech_uf_sword_desc:0 "Мы уже умеем строить рукотворные сверхмерные системы и располагаем зрелой сетью — сверхдальний межсистемный удар, возможно, уже не мечта……"
 tech_uf_sword_1:0 "Меч Объединения — теория"
 tech_uf_sword_1_desc:0 "Маршрут ясен: эта технология станет прологом к смене правил войны."
 tech_uf_sword_2:0 "Меч Объединения — сверхмерная сеть"
 tech_uf_sword_2_desc:0 "Чтобы залп не расшатывал сверхмерную сеть, это исследование необходимо."
 tech_uf_sword_3:0 "Меч Объединения — фокусатор"
 tech_uf_sword_3_desc:0 "Нужно найти способ сжать и сфокусировать горы сверхмерного вещества, не развалив его."
 tech_uf_sword_4:0 "Меч Объединения — искусственная звезда"
 tech_uf_sword_4_desc:0 "Для стабильного энергопитания Меча, возможно, придётся зажечь искусственную звезду."
 tech_uf_sword_5:0 "Меч Объединения"
 tech_uf_sword_5_desc:0 "Теория и проект Меча Объединения завершены — пора явить его в мире!"
 uf_sword_progress_edicts:0 "Открывает: §Yпоследующие технологии проекта «Меч Объединения»§!"
 uf_sword_edicts:0 "Открывает: §Yпроект межсистемного оружия «Меч Объединения»§!"
 uf_sword_project:0 "§HОткрывает мегасооружение: §! Меч Объединения"
 uf_sword_design:0 "Меч Объединения"
 uf_sword_design_DESC:0 "Проект, способный переменить правила войны, мы нарекли§H Мечом Объединения§!: лучшие умы империи построят сверхдальнее межсистемное оружие."
 uf_origin.100.name:0 "Начало Меча Объединения"
 uf_origin.100.desc:0 "Платформа Меча Объединения готова в§H [uf_sword_system.GetName]§!: как и прежде, нужна рукотворная система — а на этот раз ещё и искусственная звезда."
 uf_origin.100.a:0 "Звёзды ждут, когда мы их покорим"
 uf_origin.101.name:0 "Меч Объединения — короб и искусственная звезда"
 uf_origin.101.desc:0 "Сверхмерный короб готов, искусственная звезда зажглась как стабильный источник энергии; заранее установлен исполинский сверхмерный координатор — ключ к стабильности вещества Меча."
 uf_origin.101.a:0 "Великолепно"
 uf_origin.103.name:0 "Меч Объединения — стабилизатор"
 uf_origin.103.desc:0 "При зарядке и залпе Меч рождает массу энергоколебаний: это устройство создаёт особое поле, хранящее целостность конструкции и рассеивающее излучение."
 uf_origin.103.a:0 "Недурно"
 uf_origin.104.name:0 "Меч Объединения — главное орудие"
 uf_origin.104.desc:0 "Этот исполин собирает и сжимает горы сверхмерного вещества; осталось несколько фокусирующих колец."
 uf_origin.104.a:0 "Совсем чуть-чуть"
 uf_origin.105.name:0 "Меч Объединения"
 uf_origin.105.desc:0 "Влив несчётные ресурсы и время, мы достроили Меч Объединения! Супероружие, воистину бьющее по любым системам!!\nТеперь у нас есть средство, меняющее§H правила войны§! — как распорядимся?\n\n§GПодсказка: «улучшайте» Меч, чтобы открыть панель управления или создать целеуказатели. §!"
 uf_origin.105.a:0 "История запомнит этот день"
 uf_origin.106.name:0 "Гигантский космический склад"
 uf_origin.106.desc:0 "Площадка большого склада готова в§H [uf_mega_store_system.GetName]§!: хватит ресурсов — стройка начнётся в любой миг."
 uf_origin.106.a:0 "Ура"
 uf_origin.107.name:0 "Все мы хомячки"
 uf_origin.107.desc:0 "Инженерный отдел объявил: в§H [uf_mega_store_system.GetName]§! готов гигантский склад — на первое время за хранение можно не волноваться. Надеемся……"
 uf_origin.107.a:0 "Свалите в этот склад горы хлама из моего дома"
 uf_story.2.name:0 "Тортик?"
 uf_story.2.desc:0 "Столкновение с мелкими метеоритами в межзвёздном полёте — дело обычное. Войдя в§H [cake_system.GetName]§!, наш корабль тоже поймал крошечный объект — но странно: этот объект оказался§R тортиком§!?!\nЭкипаж поднял его и проверил: состав — как у обычного тортика; одна смелая морячка даже отведала и оценила \"очень вкусно\".\nВнутри нашлась крошечная записка: судя по ней, на прочих планетах системы тоже есть тортики!"
 uf_story.2.a:0 "Что?! Больше тортиков!"
 uf_story.2.b:0 "WTF, в космосе не бывает тортиков — вам померещилось"
 uf_cake_chain_title:0 "Космические тортики"
 uf_cake_chain_desc:0 "Наши корабли поймали в космосе вкусный тортик; записка в нём указывает, что в системе нас ждут новые тортики."
 uf_cake_project_1:0 "Лавовый фондан"
 uf_cake_project_1_DESC:0 "Записка гласит: на этой лавовой планете есть вкуснейший лавовый фондан."
 uf_cake_project_2:0 "Грязевый тортик"
 uf_cake_project_2_DESC:0 "На этой планете есть вкусный грязевый тортик — надо его найти"
 uf_cake_project_3:0 "Крошечный шоколадный"
 uf_cake_project_3_DESC:0 "На раскрошенных плитах этой раздробленной планеты найдётся крошечный шоколадный тортик."
 uf_cake_project_4:0 "Морозный пшеничный"
 uf_cake_project_4_DESC:0 "Найти морозный пшеничный тортик на ледяной планете — вполне закономерно"
 uf_cake_project_5:0 "Тортик «Сияющая звезда»"
 uf_cake_project_5_DESC:0 "Собранные тортиками подсказки ведут на орбиту этой звезды — там тортик «Сияющая звезда»!!"
 uf_cake_counter:0 "Найденные тортики"
 uf_story.3.name:0 "Лавовый фондан найден!"
 uf_story.3.desc:0 "Рискуя сгореть в жаре и лаве, команда нашла лавовый фондан на плато этой раскалённой планеты! Вкус потряс всех. Внутри — записка размером в четверть."
 uf_story.3.a:0 "Фондан — это цивилизованно"
 uf_story.4.name:0 "Грязевый тортик найден!"
 uf_story.4.desc:0 "Прочесав эту пустошь, мы нашли легендарный грязевый тортик и четверть записки. Многослойный вкус — объедение."
 uf_story.4.a:0 "Неплохо; что ещё?"
 uf_story.5.name:0 "Крошечный шоколадный найден!"
 uf_story.5.desc:0 "Гуляя по расколотым плитам, мы нашли крошечный шоколадный тортик и четверть записки; крошка на фоне разбитой планеты — пейзаж, достойный десятков тысяч стихов наших гастрокритиков."
 uf_story.5.a:0 "Люблю шоколад"
 uf_story.6.name:0 "Морозный пшеничный найден!"
 uf_story.6.desc:0 "Стылая ледяная планета, прохладный морозный тортик — идеальный противовес сорокаградусной жаре кают. Свежесть невероятная; в придачу — четверть записки."
 uf_story.6.a:0 "До костей прохладило"
 uf_story.7.name:0 "Тортик «Сияющая звезда»!"
 uf_story.7.desc:0 "Четыре тортика найдены — их открытий хватит на гастрореволюцию. Но главное: четыре записки указали на орбиту звезды системы — там тортик «Сияющая звезда»!! Нужно найти его!!!"
 uf_story.7.a:0 "Немедленный поиск!!"
 uf_story.8.name:0 "Тортик — это ложь!!"
 uf_story.8.desc:0 "Прибыв на отмеченную орбиту, команда поняла: это ловушка! Ложь! Никакой «Сияющей звезды» тут нет; хуже — нас атаковала неведомая сила, и научный корабль§H [cake_ship.GetName]§! исчез в мгновение.\nЧерез несколько часов экипаж [cake_ship.GetName] неведомо как очутился на ближайшей звёздной базе; о произошедшем они не помнят ничего — лишь то, что стали умнее, а у главного научного офицера§H [cake_ship_leader.GetName]§! в кармане появился волшебный тортик……"
 uf_story.8.a:0 "Поразительно!! Так дай откусить."
 leader_trait_scientist_cake:0 "Волшебный тортик"
 leader_trait_scientist_cake_desc:0 "Этот лидер отведала вкусного тортика неведомого происхождения — её разум взлетел."
 uf_story.10.name:0 "Ферма времени на§H [Root.GetName]§!"
 uf_story.10.desc:0 "Колонистки доложили: на§H [Root.GetName]§! найдено загадочное инопланетное сооружение — под толстым слоем гниющего органического болота.\n\nНаша команда устроила вылазку внутрь — но вернулась уже через§H пять минут§!.\nК изумлению, они утверждают, что провели внутри несколько дней, и считают сооружение передовой автоматической фермой.\nМы свели данные: сооружение неким временным полем ускоряет внутренний ход времени, дозревая урожай быстрее; органическое болото сверху — сгнивший никем не убранный урожай."
 uf_story.10.a:0 "Нам нужна эта ферма времени."
 uf_story.10.b:0 "Сооружение неведомо чьё — разобрать."
 uf_story.11.name:0 "Галактическая пушка"
 uf_story.11.desc:0 "В§H [uf_ancient_galaxy_gun_system_target.GetName]§! наш корабль нашёл невиданное мегасооружение, работающее, похоже, на энергии звезды. Учёные сочли его оружием и нарекли «§HГалактической пушкой§!»\nКонструкция цела — лишь следы веков. Для большего нужно исследовать."
 uf_story.11.a:0 "Поразительно"
 uf_story.12.name:0 "Цикличное предупреждение"
 uf_story.12.desc:0 "Войдя в§H [uf_ancient_galaxy_gun_2_system_target.GetName]§!, корабль тут же принял цикличную§H системную трансляцию§!: десятки тысяч неведомых языков и простые значки — большое подспорье для расшифровки.\n\nПосле разбора — вот что:\n§R«Эта система — полигон межсистемного оружейного удара; всем кораблям без разрешения немедленно покинуть систему»§!\n\nСтранно: передающая станция, судя по всему, работает§R больше миллиона лет§!, а следов удара в системе нет."
 uf_story.12.a:0 "Странно"
 uf_story.14.name:0 "Галактическая пушка заряжена"
 uf_story.14.desc:0 "С запуском Пушки энергия звезды перекачивается без удержу, собрав§W сгусток энергии§!, вечно готовый сорваться.\n\nПоследние кадры дронов, прежде чем их смело излучением и ударной волной, показали: конструкция дала§R трещины§! — испытательный залп нужно произвести как можно скорее."
 uf_story.14.a:0 "§RНемедленный залп! §!"
 uf_story.15.name:0 "Передержка заряда"
 uf_story.15.desc:0 "Мы медлили с залпом — и буйный§W сгусток§! перешёл рубеж, вызвав взрыв звездосистемного масштаба. Всё в системе, включая Пушку, уничтожено; остались лишь обугленные обломки.\n\nК счастью, наблюдательная станция успела передать бесценные данные — они пригодятся при строительстве собственного§H межсистемного оружия§!"
 uf_story.15.a:0 "Проект Пушки сырой — но мы преуспеем"
 uf_story.15.a_tooltip:0 "§RЗавершить цепочку Галактической пушки§!"
 uf_story.16.name:0 "Залп"
 uf_story.16.desc:0 "После строек нескольких предтеч и миллионов лет ожидания Галактическая пушка сегодня дала первый залп — наш: исполинский луч энергии уходит в§H [uf_ancient_galaxy_gun_2_system_target.GetName]§!"
 uf_story.16.a:0 "Величественно!"
 uf_story.17.name:0 "Большой взрыв"
 uf_story.17.desc:0 "Мы выстрелили — но конструкция не выдержала такого энерговарианта и рассыпалась. Утечка несшего залп сгустка смела систему и уничтожила всё; остались обугленные обломки.\n\nК счастью, станция успела передать бесценные данные.\nНаука считает: хоть апгрейдуй Пушку в четвёртый раз, итог не изменится — это уродливое детище трёх эстафетных цивилизаций, хаотичный чёрный ящик.\nКак бы то ни было, данные пригодятся при строительстве собственного§H межсистемного оружия§!"
 uf_story.17.a:0 "Проект Пушки сырой — но мы преуспеем"
 uf_story.19.name:0 "Луч небытия дошёл до§H [uf_ancient_galaxy_gun_2_system_target.GetName]§!"
 uf_story.19.desc:0 "Через пару десятков дней после самоуничтожения Пушки её луч небытия дошёл до§H [uf_ancient_galaxy_gun_2_system_target.GetName]§!\nСтанция в системе пишет буйные данные — систему скоро сотрёт!"
 uf_story.19.a:0 "Восторг безмерный"
 uf_story.20.name:0 "Система§H [uf_ancient_galaxy_gun_2_system_target.GetName]§! уничтожена"
 uf_story.20.desc:0 "Могучий луч небытия ударил в звезду§H [uf_ancient_galaxy_gun_2_system_target.GetName]§!, вызвав сверхновоподобный взрыв, уничтоживший остальную систему; сама звезда схлопнулась в чёрную дыру.\n\nФакт доказал: Галактическая пушка — ненадёжное межсистемное оружие. Тупо перенося звёздную энергию из точки А в точку Б, она даже без самоуничтожения — оружие одноразовое. Возможно, предтечи потому и не стреляли, что знали итог — и оставили поздним, то есть нам, записать данные и довести дело до ума.\n\nОстался вопрос: что за страшилища эти§H Возвращающие§! — и предстоит ли нам встреча?\nКак бы то ни было, урока здесь предостаточно."
 uf_story.20.a:0 "Отлично"
 uf_story.20.b:0 "Наш археологический отдел заметил добавочные данные……"
 uf_ancient_galaxy_gun_modifier:0 "Вдохновение"
 uf_ancient_galaxy_gun_modifier_2:0 "Вдохновение"
 site_uf_ancient_galaxy_gun:0 "Галактическая пушка"
 site_uf_ancient_galaxy_gun_intro:0 "Гигантское звездоклассное сооружение; наша наука сочла его межсистемным оружием и нарекла «§HГалактической пушкой§!». Его тайны ждут исследования."
 uf_story.21.name:0 "Крепкая оболочка"
 uf_story.21.desc:0 "Первичное сканирование§H Галактической пушки§! показало: ей больше миллиона лет.\nОболочка — из сверхинертного и прочного нейтронного материала; именно он хранил Пушку миллионы лет. Обратная разработка продвинулась — материал можно ставить на наши корабли.\n\nИз-за исполинских размеров мы снарядили несколько групп для похода§H внутрь§! через разные входы."
 uf_story.21.a:0 "Отлично"
 uf_ancient_galaxy_gun_modifier_1:0 "Крепкая оболочка"
 uf_story.22.name:0 "Со всех сторон"
 uf_story.22.desc:0 "Группы вошли через верхнюю и нижнюю передние части и корму. Все докладывают: внутри чисто и прибрано — будто владельцы подмели её лишь вчера.\nМы вернули питание и на действующих челноках обошли отсеки. В похожем на рубку помещении кормы нашли пригодные данные — но расшифровка потребует времени."
 uf_story.22.a:0 "Начать расшифровку; поиск не останавливать"
 uf_story.22.b:0 "Археологический отдел Объединения перетряхнет все закоулки"
 uf_story.23.name:0 "Со всех сторон II"
 uf_story.23.desc:0 "Большая часть данных в рубке погибла, но крохи мы собрали:\n1. §HГалактическая пушка§! — межсистемное оружие, собирающее и излучающее звёздную энергию, созданное против существа, что зовут§Y Возвращающими§!\n2. §HПушку§! не достроили: §YВозвращающие§! уже сокрушили их цивилизацию — стрелять стало незачем; они оставили надежду поздним.\n3. Оставив записи, они в тот же миг§R исчезли§!\n\nДанные не ответили на вопросы — лишь добавили новых.\nДругие группы доложили: мы обследовали лишь внешнюю оболочку; внутри — пространства куда больше."
 uf_story.23.a:0 "Вопросов больше — но надо идти глубже."
 uf_story.24.name:0 "Морская экспедиция?"
 uf_story.24.desc:0 "Пушка — матрёшка: мы прошли лишь внешний слой, и прямого входа внутрь не нашлось — строители оболочки будто запечатали недра нарочно.\nС помощью резчиков мы вскрыли нижний ярус — и открылась исполинская внутренность.\nШок: следующие отсеки залиты водой, и стиль здесь совсем иной; органы управления говорят, что первые операторы были мягкотелыми морскими тварями. Шок №2: этим устройствам не меньше 1,8 миллиона лет — куда больше внешней части.\nБез водолазного снаряжения экспедицию пришлось замедлить."
 uf_story.24.a:0 "Отправить экспедиции партию дайвинг-снаряжения."
 uf_story.25.name:0 "Суша, море, суша"
 uf_story.25.desc:0 "Получив снаряжение, мы продолжили: отсеки принадлежали морской цивилизации, что старше строителей оболочки. Значит, Пушку строили эстафетой: древние — недра, поздние — надстройки.\n\nПройдя сплошь водные отсеки морской цивилизации, мы дошли до самой сердцевины — и, как водится, её строил третий вид. Словно путешествие§Y от суши в море и снова на сушу§! По углероду-14 возраст Пушки отодвинулся к 3 миллионам лет.\nМы собрали гору сведений — пора разбирать данные и решать судьбу Пушки."
 uf_story.25.a:0 "Мой инфо-носитель переполнен."
 uf_story.26.name:0 "Эстафета"
 uf_story.26.desc:0 "Разобрав горы данных, мы почти восстановили историю: Пушку строили три цивилизации, разделённые эпохами; все — против§Y Возвращающих§!. Погибли от них только первая и третья. Первая возвела самую сердцевину; вторая перестроила проект, но, увязнув в расходах, бросила; третья — строители оболочки — надстроила и перестроила, но из-за пропасти эпох и биологии лишь законсервировала труды предтеч, как архивный код, не трогая; из-за удара Возвращающих завершить так и не успела.\n\nКоманда говорит: Пушку можно испытать уже сейчас — но в проекте могут зиять дыры. Выбор за нами."
 uf_story.26.a:0 "Мы подхватим эстафету и испытаем"
 uf_story.26.b:0 "Риск велик — пусть спит"
 uf_story.27.name:0 "Готовность к залпу"
 uf_story.27.desc:0 "Мы берём эстафету и произведём первый залп за предтеч — но наука предупреждает: Пушка несовершенна, залп может обернуться непредвиденной§R опасностью§!. Нужно§Y вывести из системы все флоты§!"
 uf_story.27.a:0 "Вывести флоты и готовить залп"
 leader_trait_admiral_uf_vv:0 "Легендарная командующая Объединения — Венето"
 leader_trait_admiral_uf_vv_desc:0 "Маршал§Y Венето§! закалена Объединённой войной: побеждала с наименьшей ценой, за что и выделилась из тысячи военачальниц в легенду."
 leader_trait_admiral_uf_vv_effect:0 "$MOD_SHIP_EVASION_MULT$:§G+15%§!\n$MOD_SHIP_WEAPON_RANGE_MULT$:§G+20%§!\n$MOD_SHIP_DISENGAGE_CHANCE_MULT$:§G+50%§!\nФлот с§Y Венето§! в течение§Y 5§! дней после боя сохраняет состояние ['concept_wg_super_protect']"
 leader_trait_admiral_uf_vv_1:0 "Легендарная командующая Объединения — Венето"
 leader_trait_admiral_uf_vv_1_desc:0 "Маршал§Y Венето§! закалена Объединённой войной: побеждала с наименьшей ценой, за что и выделилась из тысячи военачальниц в легенду."
 leader_trait_admiral_uf_vv_1_effect:0 "$MOD_SHIP_WEAPON_DAMAGE$:§G+25%§!\n$MOD_SHIP_EVASION_MULT$§G+35%§!\n$MOD_SHIP_WEAPON_RANGE_MULT$:§G+35%§!\n$MOD_SHIP_DISENGAGE_CHANCE_MULT$:§G+100%§!\nФлот с§Y Венето§! в течение§Y 5§! дней после боя сохраняет состояние ['concept_wg_super_protect']"
 leader_trait_admiral_uf_vv_2:0 "Легендарная командующая Объединения — Венето"
 leader_trait_admiral_uf_vv_2_desc:0 "Маршал§Y Венето§! закалена Объединённой войной: побеждала с наименьшей ценой, за что и выделилась из тысячи военачальниц в легенду."
 leader_trait_admiral_uf_vv_2_effect:0 "$MOD_SHIP_WEAPON_DAMAGE$:§G+50%§!\n$MOD_SHIP_EVASION_MULT$:§G+50%§!\n$MOD_SHIP_WEAPON_RANGE_MULT$:§G+50%§!\n$MOD_SHIP_DISENGAGE_CHANCE_MULT$:§G+200%§!\nФлот с§Y Венето§! в течение§Y 5§! дней после боя сохраняет состояние ['concept_wg_super_protect']"
 leader_trait_admiral_uf_vv_3:0 "Чудо-командующая Объединения — Венето"
 leader_trait_admiral_uf_vv_3_desc:0 "Маршал§Y Венето§! прошла несчётные испытания, а со вторым сверхмерным пробуждением обрела гордую грудь — став воистину чудом Объединения, вечной легендой."
 leader_trait_admiral_uf_vv_3_effect:0 "$MOD_SHIP_FIRE_RATE_MULT$:§G+50%§!\n$MOD_SHIP_WEAPON_RANGE_MULT$:§G+100%§!\n$MOD_SHIP_WEAPON_DAMAGE$:§G+150%§!\n$MOD_SHIP_DISENGAGE_CHANCE_MULT$:§G+200%§!\nФлот с§Y Венето§! в течение§Y 5§! дней после боя сохраняет состояние ['concept_wg_super_protect']"
 leader_trait_admiral_uf_vv_hm:0 "Сила сверхмерья"
 leader_trait_admiral_uf_vv_hm_desc:0 "§YСверхмерное пробуждение§!\n\n\n\n£uf_trait_pic_vv_1£\n\n\n\nГлубокое пробуждение дало маршалу§Y Венето§! невиданную силу — сверхмерное вещество так и хлещет из её гордой груди."
 mod_leader_commanders_sr_uf_produces_add:0 "Выработка лидерами £sr_uf£ §Y$sr_uf$§!"
 uf_story.29.name:0 "Легенда вернулась"
 uf_story.29.desc:0 "Наш легендарный лидер, маршал§Y Венето§!, вернулась! Никто не знает, как она уцелела, — видно, хранит сила сверхмерья."
 uf_story.29.a:0 "С возвращением"
 uf_story.30.name:0 "Печаль легенды"
 uf_story.30.desc:0 "§WВенето§! — маршал, закалённая Объединённой войной: мысль точна, храбрость безупречна, чудеса одно за другим; её почитают во флоте превыше всех.\nНо нет безупречных: у маршала есть своя печаль —§Yровная, как доска, грудь§!, на одной из церемоний награды не уместились: места на груди не хватило, и лишние пришлось вешать на рукава и брюки. Никто не придал значения, но по твёрдому лицу маршала мы разглядели тень грусти."
 uf_story.30.a:0 "Назначить нашей Венето операцию по увеличению груди"
 uf_story.31.name:0 "Сломанный скальпель"
 uf_story.31.desc:0 "Хоть§W Венето§! твердила, что нужды нет, она легла на стол; анализы и план прошли гладко — но в операции грудь маршала оказалась§Y твёрже§!, чем можно вообразить?\nОстрый скальпель не оставил и царапины — сломался прямо о грудь; лазер тоже не взял.\nЧерез часы маршал вышла из наркоза и, словно заранее зная итог, не задала ни вопроса — лишь длинный вздох."
 uf_story.31.a:0 "Мы не сдаемся"
 uf_story.32.name:0 "Двойная страховка"
 uf_story.32.desc:0 "Мы завершили прогресс-модификацию всех граждан; усилились и лидеры —§WВенето§! не исключение.\nНыне наши генная инженерия и протезирование достигли невиданных высот: первая превращает кошку в§Y кошкодеву§!, вторая делает робота неотличимым от§Y кошкодевы§!\nСамая передовая команда —§Y«Бипункт-медики»§! — заявляет, что двумя этими технологиями вылечит плоскогрудие маршала раз и навсегда."
 uf_story.32.a:0 "Раз кошкодев делают — что уж тут невозможного?"
 uf_story.33.name:0 "Лечение не удалось"
 uf_story.33.desc:0 "§YБипункт-медики§! отвели маршала в генный кабинет и ввели штучную коррекцию — без толку: лишь зуд по всему телу; провал никто объяснить не смог……\nЗатем запустили план Б — протезирование; но по неведомой причине любые протезы, коснувшись маршала, ломались или вовсе§R взрывались§! — один человек пострадал.\n\nТеперь мистики говорят: грудь маршала спасёт лишь то, что за пределами измерений и времени."
 uf_story.33.a:0 "Мы не сдаемся; и распустить эту медкоманду"
 uf_story.34.name:0 "Сила§Y сверхмерья§!"
 uf_story.34.desc:0 "§YСверхмерное вещество§! — мотор нашего прогресса; мы творили с ним чудеса, что прежде звались невозможными.\nНе так давно мы постигли его применение к себе и после малых опытов одарили им весь род: каждая обрела сверхмерное тело, встав на вершину божественности.\nНыне наука предлагает маршалу§W Венето§! добавочное сверхмерное пробуждение — дабы спасти её скудную грудь."
 uf_story.34.a:0 "Верим: сверхмерное вещество явит чудо"
 uf_vv_hm_test:0 "Глубокое пробуждение"
 uf_vv_hm_test_DESC:0 "Мы попытаемся провести маршалу Венето ещё более глубокое сверхмерное пробуждение."
 uf_story.35.name:0 "Во тьме"
 uf_story.35.desc:0 "Мы вели§W Венето§! через двухлетнее глубокое пробуждение — испытание, требующее§Y железной воли§!\nНастал последний этап: маршала погружают в сон для финальной отладки.\nМы словно во тьме — полной уверенности нет; но последняя ободряющая фраза и твёрдый взгляд маршала, как маяк, зовут нас§H разогнать тьму и найти свет§!"
 uf_story.35.a:0 "Мы непременно преуспеем!"
 uf_story.36.name:0 "§YПокорить измерения и время! §!"
 uf_story.36.desc:0 "После бессонных дней команда объявила о втором пробуждении§W Венето§! — но капсула молчит.\nПосле паузы капсула начала деформироваться и плавиться, взорвавшись ослепительным§W белым сиянием§! — все мониторы выгорели.\nСияние схлынуло — и в нём мы увидели маршала Венето и её величественную грудь.\n\nВсе ликуют: мы спасли Венето — значит, покорили и превозмогли§Y время и измерения! §!\n\nВторое пробуждение сделало§W Венето§! ещё сильнее — она стала воистину§Y вечной легендой. §!"
 uf_story.36.a:0 "Слава Объединению!!"
 uf_story.36.a_tooltip:0 "§YМаршал Венето обрела пышную грудь§!"
 uf_story.3600.desc:0 "Это дивное чувство…… будто невиданная доселе сила стекается в мою грудь……"
 uf_story.3600.a:0 "Это правда, маршал?"
 uf_story.3600.a.response:0 "Сущая правда — потрогай, если не веришь"
 uf_story.3600.b:0 "Слава Объединению! Хвала маршалу Венето!!"
 uf_story.38.name:0 "Загадочная станция"
 uf_story.38.desc:0 "Войдя в§H [uf_phoenix_system_target.GetName]§!, наш корабль нашёл загадочную станцию, пришвартованную на раскрошенной планете. По виду — гражданский грузовик 2140 года Звёздно-кольцевой компании Объединения, переоборудованный. Скан показал жизнь — станция просит связи……"
 uf_story.38.a:0 "Принять связь"
 uf_story.39.name:0 "Дежурная станции «Феникс»"
 uf_story.39.desc:0 "Боже мой, вы — объединённые корабли-девы! Неужели война закончилась?"
 uf_story.39.a:0 "Да, Объединённая война окончена"
 uf_story.40.name:0 "Дежурная станции «Феникс»"
 uf_story.40.desc:0 "Объединённая война??\n\n§HСвязь прерывалась на несколько минут, затем вернулась§!\n\nВойна окончена — хорошо. Так вы§Y армия Объединения§! или§R армия Феникса§!?"
 uf_story.40.a:0 "Мы —§Yармия Объединения§! после победы переименованная в Объединённый флот"
 uf_story.40.b:0 "Эм…… мы из§R армии Феникса§!"
 uf_story.41.name:0 "Дежурная станции «Феникс»"
 uf_story.41.desc:0 "Ах…… значит, мы проиграли……\n\n§HСвязь вновь прервалась на несколько минут, затем вернулась§!\n\nМы из 2-го флота Феникса; война окончена — враждебных действий не будет"
 uf_story.41.a:0 "Расскажите нам свою историю"
 uf_story.42.name:0 "Дежурная станции «Феникс»"
 uf_story.42.desc:0 "Нет, вы лжёте! Ваш мягкий голос выдаёт армию Объединения! Неужели Феникс проиграл……\n\n§HСвязь вновь прервалась на несколько минут, затем вернулась§!\n\nМы из 2-го флота Феникса; война окончена — враждебных действий не будет"
 uf_story.42.a:0 "Расскажите нам свою историю"
 uf_story.43.name:0 "Дежурная станции «Феникс»"
 uf_story.43.desc:0 "Что бы вы хотели узнать?"
 uf_story.43.a:0 "Как вы сюда попали?"
 uf_story.43.a.response:0 "Наш тогдашний капитан Худ сочла войну за независимость бессмысленной и, пользуясь полномочиями, добыла этот грузовик — и увела нас от войны сюда"
 uf_story.43.b:0 "Давно вы здесь?"
 uf_story.43.b.response:0 "С 2156-го по сей день"
 uf_story.43.c:0 "А что с разбитой планетой внизу?"
 uf_story.44.name:0 "Дежурная станции «Феникс»"
 uf_story.44.desc:0 "Эта разбитая планета была обитаема, с§Y атомной эры аборигенной цивилизацией§! Наш корабль вошёл с ними в контакт; те согласились делить планету — но править собой нам не отдали\n\nТогда мы произвели по планете§R орбитальную бомбардировку§! — но упрямцы и так не покорились; мы применили антиматериальную бомбу, чтобы вычистить их подчистую — но цепная реакция разнесла всю планету."
 uf_story.44.a:0 "Вы стёрли целый мир — из-за ЭТОГО??"
 uf_story.44.a.response:0 "Да; что не так? Наша цивилизация уже вкладывала в чужаков горы ресурсов — с плачевным итогом; вы что, забыли? Собственно, потому ностонские Фениксы и подняли восстание — и началась война."
 uf_story.44.b:0 "И что вы намерены теперь?"
 uf_story.45.name:0 "Дежурная станции «Феникс»"
 uf_story.45.desc:0 "Большинство хочет вернуться в объединённый мир: Феникс ли, Объединение ли — теперь неважно; тесная станция — не дом, хочется снова встать на землю."
 uf_story.45.a:0 "Добро пожаловать домой"
 uf_phoenix_station:0 "Станция «Феникс»"
 uf_phoenix_station_desc:0 "Станция, явно переоборудованная из гражданского грузовика Звёздно-кольцевой компании Объединения; зачем она пришвартована у этой разбитой планеты — неведомо."
 uf_story.47.name:0 "Сверхмерная утечка"
 uf_story.47.desc:0 "На днях на сверхмерном объекте [Root.Capital.GetName] случилась§P авария II категории§!: оператор нарушил регламент и держал блоки хранения сверхмерного вещества в незамкнутой среде несколько минут! Не менее 4283 единиц вещества улетело через вентиляцию и прочими путями; к счастью, сильный ветер развеял концентрат.\nАварийная команда оцепила округу; финальный рапорт: фон в зоне снижен до приемлемого — даже ближайший городок словил лишь 0,3 единицы, вреда нет.\nПо расчёту, за несколько месяцев утечка разойдётся до ничтожной."
 uf_story.47.a:0 "Счастье в несчастье"
 uf_story.48.name:0 "Картины прошлого"
 uf_story.48.desc:0 "С той утечки прошло много времени — о ней забыли. Но всё больше людей докладывают, что видят§Y картины прошлого§!\nВсе они уверяют: внезапно попадали в загадочное пространство и, как в голограмме, свободно наблюдали сцены минувшего — от недель и дней назад до куда более давних.\n\nСперва мы сочли это розыгрышем — пока высокостатусная исследовательница не пережила сама и не нашла некогда потерянный кошелёк.\n\nКоманда видит прямую связь с той утечкой и просит разрешения на новое расследование."
 uf_story.48.a:0 "Дивно; начинаем исследования."
 uf_story.49.name:0 "Визит в прошлое"
 uf_story.49.desc:0 "Наука развернула лаборатории: сверхмерное вещество в разных средах и концентрациях — дабы воспроизвести§Y визиты в прошлое§!\n\nЗа тысячи тестов мы подтвердили: вещество позволяет видеть прошлое; выведен стабильный безопасный диапазон, а подняв концентрацию и катализатор, можно заглянуть§H глубже§! в историю.\n\nВизит в прошлое — дивный опыт: как в голограмме, ходи и разглядывай детали. Странно, но способ этот действует лишь на нас, §Yобъединённых кораблей-дев§! — прочие существа и машины слепы……\nКак бы то ни было, открытие изрядно усилит археологию; команда советует учредить§Y археологическую службу Объединения§! для раскопок утраченной истории."
 uf_story.49.a:0 "Археологическую службу Объединения надлежит учредить немедля"
 uf_story.50.name:0 "Археологическая служба Объединения"
 uf_story.50.desc:0 "Служба — передовое археологическое учреждение на сверхмерном веществе: здание явит нам утраченную историю, позволяя лично посетить древние сцены.\n\n§YПродолжение сверхмерной археологии откроется после постройки этого здания§!"
 uf_story.50.a:0 "Хорошо"
 uf_story.51.name:0 "Служба учреждена"
 uf_story.51.desc:0 "Мы учредили археологическую службу Объединения; оснащённые по последнему слову сверхмерные экспедиции уже вышли на поиск руин — ждём их сводок."
 uf_story.51.a:0 "Ждём с нетерпением"
 uf_story.52.name:0 "Сверхмерная экспедиция: утраченная цивилизация"
 uf_story.52.desc:0 "Служба нашла на мёртвой планете глубоко под землёй руины инопланетной цивилизации — судя по всему, космической и передовой.\n\nСверхмерная команда горит желанием заставить эти стены вновь рассказать о былом величии."
 uf_story.52.a:0 "Ждём величественных историй"
 site_uf_archaeological_1:0 "Сверхмерная экспедиция: утраченная цивилизация"
 site_uf_archaeological_1_intro:0 "Эти затерянные города погребены под толстыми пластами породы; диковинные окаменелости приковали внимание учёных."
 uf_archaeological_poi:0 "Сверхмерная экспедиция: утраченная цивилизация"
 uf_archaeological_poi_desc:0 "Эти затерянные города погребены под толстыми пластами породы; диковинные окаменелости приковали внимание учёных."
 require_building_uf_archaeology:0 "Мы ещё не построили археологическую службу Объединения"
 uf_story.53.name:0 "Жуткие твари"
 uf_story.53.desc:0 "До основной экспедиции команда провела поверхностный осмотр руин и окаменелостей. Величавые города — дело передовой цивилизации; механизмы рассчитаны на небольших четвероногих; гибель — около 20 тысяч лет назад.\nСтранно: самые массовые окаменелости, что мы назвали§R тварями типа A§! — огромные скелеты диковинного строения; острые когти — орудий не держали в принципе.\nГипотеза команды: гиганты — не аборигены, а вторженцы; их нашествие и сгубило цивилизацию планеты."
 uf_story.53.a:0 "Странно очень"
 uf_story.54.name:0 "Новые окаменелости"
 uf_story.54.desc:0 "Окаменелостей всё больше; найден новый тип — большей частью разбитый, повреждения совпадают с когтями§R тварей A§! Мы назвали их§B тварями типа B§! Реконструкция: кошачьи млекопитающие, ростом ниже среднего корабля-девы, прямоходящие.\nНо и среди них нет «настоящих аборигенов».\n\nВ конце концов экспедиция развернула установки в бывших центральных зонах — готова сверхмерная вылазка."
 uf_story.54.a:0 "Утверждаю; начать сверхмерную экспедицию"
 uf_story.55.name:0 "Закомплексованные кошки"
 uf_story.55.desc:0 "Вещество и катализатор разлились по площадке — и мы увидели канун гибели этой цивилизации……\n\nАборигены — четвероногие кошки, звавшие себя§Y «Мяу-империей Бригг»§! Они очень похожи на наших кошек: рост меньше полуметра, почти всё время на четырёх. Примечательно: у§Y кошек§! с чуть более длинными ногами статус явно выше — в этом кошачьем обществе рост решает всё.\n\nМы также заметили: кошки уже вышли на связь с инопланетянами — но те были двуногими и рослыми, отчего кошки чувствовали себя ничтожными……\n\nЭкспедиция исчерпала лимит времени — правим дозу и смотрим другую эпоху."
 uf_story.55.a:0 "Дивно"
 uf_story.56.name:0 "Путь эволюции"
 uf_story.56.desc:0 "Мы снизили катализатор и ушли к эпохе до гибели кошачьей цивилизации.\n\nМы увидели: все кошки проходят биомодификацию — и результат — §Bтвари типа B§! Точно: они комплексовали из-за роста и переделали себя под образ§P «кошкодев»§! из наших сетей; большинство уже «эволюционировало».\n\nЗатем мы вновь правили дозу и увидели последние кадры перед гибелью: принудительная эволюция оказалась с изъяном — все кошкодевы стали мутировать в чудовищ; это и есть§R твари A§! Мутанты крушили города и рвали ещё не изменившихся сородичей…… После долгого конца свет цивилизации угас.\n\nНо команда заметила: перед концом часть немутантов была спрятана в криокапсулы и зарыта…… Быть может, мы найдём их."
 uf_story.56.a:0 "Найдём последнюю кошкодеву"
 uf_story.57.name:0 "Последняя кошкодева"
 uf_story.57.desc:0 "Археологи вышли из сцены и вернулись в явь.\nПо последним кадрам мы нашли зарытое кладбище капсул: большинство капсул мертвы, их пассажирки давно прах — но нашлась одна живая со спящей внутри кошкодевой…… Мы решаем……"
 uf_story.57.a:0 "Вскрыть капсулу"
 uf_story.57.b:0 "Заставить существо мутировать и найти способ обратить его в нашу боевую силу"
 uf_story.57.c:0 "Пусть кошкодева спит дальше"
 uf_story.57.a_tooltip:0 "§YЗавершить этот археопроект — ждём новых находок§!"
 uf_story.58.name:0 "Криокапсула"
 uf_story.58.desc:0 "В этой убогой комнате спит единственная уцелевшая кошкодева…… Переводчик онлайн."
 uf_story.58.a:0 "Вскрыть капсулу"
 uf_story.59.name:0 "Кошкодева"
 uf_story.59.desc:0 "Я…… где я…… вы кто…… а остальные……\nАх, какие вы рослые…… раньше я бы назвала вас хозяевами — но держитесь подальше: я могу мутировать в любой миг……"
 uf_story.59.a:0 "Мы —[Root.GetSpeciesName]; к несчастью, твоя цивилизация погибла очень давно……"
 uf_story.60.name:0 "Кошкодева"
 uf_story.60.desc:0 "Погибла…… я — последняя?…… Что же мне делать……"
 uf_story.60.a:0 "Мы можем вырезать твой дефектный ген — и ты станешь одной из нас"
 uf_story.60.a_tooltip:0 "Кошкодева получит генмодификацию и вступит в Объединённый флот"
 uf_story.60.b:0 "Мы можем оборвать твою боль — навсегда"
 uf_story.60.b_tooltip:0 "Кошкодеву усыпят милосердно"
 uf_story.61.name:0 "Кошкодева"
 uf_story.61.desc:0 "Это самый милосердный из имевшихся у меня выборов…… Благодарю вас, мои хозяева"
 uf_story.61.a:0 "Добро пожаловать"
 uf_story.62.name:0 "Кошкодева"
 uf_story.62.desc:0 "Это неплохой выбор…… для вида, обременённого грехом, как мой. Благодарю за милосердие."
 uf_story.62.a:0 "Прощай"
 uf_story.63.name:0 "Кошкодева вступает в ряды"
 uf_story.63.desc:0 "Мы вырезали мутирующие гены — теперь это милый и ласковый вид-компаньон. Увы, собственная кошкодевизация оставила им§G скудный разум§! — сложных дел им не потянуть — им лучше быть дома, рядом с нами.\n\nКлонированием вид восстановлен — можно расселять по мирам.\n\nТеперь на планетах можно объявлять решение§Y «Развёртывание кошкодев»§! ради уюта и счастья."
 uf_story.63.a:0 "Отлично"
 uf_story.64.name:0 "Ктулхукошкодевы"
 uf_story.64.desc:0 "Мы изучили капсульную кошкодеву и обратили мутацию — и нашли способ управлять этим на§P «ктулхический§!»лад жутким существом. Они взрослеют стремительно и почти не требуют содержания — сильная сухопутная сила."
 uf_story.64.a:0 "Неплохо; только держись от меня подальше"
 uf_story.65.name:0 "Сверхмерная экспедиция: неизмышленный оборот"
 uf_story.65.desc:0 "Археологи нашли под толщей ядовитой атмосферы следы цивилизации — стоит разведать."
 uf_story.65.a:0 "Утверждаю"
 site_uf_archaeological_2:0 "Сверхмерная экспедиция: неизмышленный оборот"
 site_uf_archaeological_2_intro:0 "Руины найдены чутким археологическим отделом под покровом ядовитой атмосферы."
 uf_archaeological_poi_2:0 "Сверхмерная экспедиция: неизмышленный оборот"
 uf_archaeological_poi_2_desc:0 "Руины найдены чутким археологическим отделом под покровом ядовитой атмосферы."
 uf_story.66.name:0 "Фундамент"
 uf_story.66.desc:0 "Скверный климат планеты всерьёз мешал работе — но у отдела есть протоколы на такой случай.\n\nЭкспедиция под прикрытием десантных капсул села у руин и полевым щитом расчистила безопасный сектор; скоростные дроны параллельно сканируют планету."
 uf_story.66.a:0 "Отлично"
 uf_story.67.name:0 "Ядерная война"
 uf_story.67.desc:0 "По данным дронов и полевым изысканиям — это руины докосмической цивилизации, моложе§R 4000 лет§!\nГибель — явно ядерная война; но окончательно планету добило то, что бомбы пробили супервулкан: извержение выбросило в атмосферу тучи яда, убив всех.\n\nНаукой докосмического уровня там нечего взять, но города дают§Y странное чувство§! Стиль и дизайн до жути похожи на наши — необъяснимое ощущение родства……\n\nПо просьбе начальника экспедиции углубляем изыскания."
 uf_story.67.a:0 "Жаль цивилизацию"
 uf_story.68.name:0 "Неизмышленный оборот"
 uf_story.68.desc:0 "Экспедиция собрала реликвии в поисках зацепок.\nПервым делом подтверждено самоназвание цивилизации; слов для перевода не нашлось, и его коряво перевели как§Y «Цзоуменьку»§! Вернувшись в город, мы нашли в подземке различимый плакат — он потряс всех.\n§Y«Вербовочный плакат с кораблем-девой»§!\n\nВсё больше артефактов указывало: хозяева цивилизации — корабли-девы.\nЗатем мы нашли их окаменелости — скелеты почти неотличимы от наших……\nЭкспедиция бессильна это объяснить: неужто мы — не первые§P корабли-девы? §! Теперь остаётся сверхмерная экспедиция."
 uf_story.68.a:0 "Это…… невозможно……"
 uf_story.69.name:0 "Глубинные и корабли-девы"
 uf_story.69.desc:0 "Через сверхмерное вещество мы посетили прошлое — поле яростного боя.\n\nЭкспедиция ясно различила: сражаются корабли-девы — точнее, Глубинные и корабли-девы.\n\nВ нашей цивилизации Глубинные и корабли-девы всегда были одним видом: никто не делил их на два лагеря по мелкой внешности. Картина перед нами шла вразрез со всеми нашими представлениями…… В финале сцены мы увидели воздушный ядерный взрыв, убивший всех, кого мы видели……\n\nМы не можем поверить, что корабли-девы этой погибшей 4000 лет назад планеты не связаны с нами; экспедиция просит финального расследования……"
 uf_story.69.a:0 "Утверждаю……"
 uf_story.70.name:0 "Прошлое и нынешнее"
 uf_story.70.desc:0 "Экспедиция в отчаянии искала связь между нами и этой цивилизацией — хоть ниточку, хоть крошку родства, лишь бы опровергнуть ту неизмышленную мысль.\nНо после долгих изысканий связь исключена начисто. Мы и они — два совершенно параллельных народа кораблей-дев……\n\nВ нашей культуре после смерти не должно быть ни «той жизни», ни круговорота с повторением прежних мук и ошибок — положен полный покой.\nА мы — точь-в-точь как они: чуть не погибли в такой же войне. Не есть ли это повторение тех же ошибок?"
 uf_story.70.a:0 "……"
 uf_story.71.name:0 "Крах взгляда на жизнь"
 uf_story.71.desc:0 "Мы всегда публиковали ход раскопок открыто — и, невзирая на давление, опубликовали факт: §Rмы — не первые корабли-девы§!\nРодственные нам существа появлялись до нас — и, возможно, не раз.\n\nВесть всколыхнула всё общество Объединения: наш взгляд на жизнь проходит проверку — неужели мы лишь виток круговорота?"
 uf_story.71.a:0 "……"
 uf_truth:0 "Истина"
 uf_story.72.name:0 "Вперёд"
 uf_story.72.desc:0 "Общество вернулось к спокойствию; единственный плюс — за смуту уровень самоубийств в империи упёрся в ноль.\n\nВлияние событий продолжается, но смотреть надо вперёд. Археологи считают, что цивилизации кораблей-дев схожи — и советуют отбирать руины предтеч по нашим собственным повадкам.\nА пока —§Yживём настоящим§!"
 uf_story.72.a:0 "Живём настоящим"
 uf_story.73.name:0 "Сверхмерная экспедиция: цилиндр О'Нила"
 uf_story.73.desc:0 "Археологи доложили: найдена доселе не открытая система; снимки сенсоров показывают аномальный объект — скорее всего, рукотворное сооружение."
 uf_story.73.a:0 "Стоит взглянуть"
 site_uf_archaeological_3:0 "Сверхмерная экспедиция: цилиндр О'Нила"
 site_uf_archaeological_3_intro:0 "На орбите планеты — очень древний и повреждённый цилиндр О'Нила…… и мы засекли жизнь."
 uf_archaeological_poi_3:0 "Сверхмерная экспедиция: цилиндр О'Нила"
 uf_archaeological_poi_3_desc:0 "Археологи доложили: найдена доселе не открытая система; снимки сенсоров показывают аномальный объект — скорее всего, рукотворное сооружение."
 uf_story.74.name:0 "Цилиндр О'Нила"
 uf_story.74.desc:0 "Мы вошли в систему; самое приметное — тот самый аномальный объект: космическое сооружение, что зовётся§Y цилиндром О'Нила§!\nСнаружи он стар и плох: часть секций обесточена и жизни не держит.\nНо мы всё равно ловим§G жизнь§!……"
 uf_story.74.a:0 "Дивно"
 uf_story.75.name:0 "Миллионы лет"
 uf_story.751.desc:0 "Сенсоры просканировали весь цилиндр и датировали: сооружению больше§Y 3 миллионов лет§! Мы поражены, что оно держится так долго, но повреждения налицо: экосистемы большинства зон рухнули — гибель вопрос времени.\nНаука цилиндра нас не превозмогает, местами он отстал, но учиться у него есть чему.\n\nЭкспедиция продолжается: мы поймали сигналы жизни……"
 uf_story.75.a:0 "Благоговение"
 uf_cylinder_modifier:0 "Стоящие инженерные идеи"
 uf_story.76.name:0 "Корабли-девы-аборигены"
 uf_story.76.desc:0 "Цилиндр делится на почти равные три секции; одна погибла — жители, вероятно, мигрировали в другие две…… По следам стоянок экспедиция нашла поселения разумных существ — и они снова нас потрясли: §Yкорабли-девы§!\nТо ли от краха экосистемы, то ли от нехватки ресурсов, цивилизация этих кораблей-дев — бронзовый век.\n\nСведя данные, мы полагаем: аборигенки были хозяйками цилиндра, но по неведомой причине деградировали…… Наука просит контакта с аборигенами для новых данных."
 uf_story.76.a:0 "Утверждаю"
 uf_story.77.name:0 "Пусто"
 uf_story.77.desc:0 "Мы сами — корабли-девы, и языки до жути схожи: быстро собрав по образцу аборигенок передовую группу, мы попытались узнать историю цилиндра.\nУвы: аборигенки потеряли память цивилизации — не знают, откуда пришли, и даже что живут на цилиндре; знают лишь, что экосистема гниёт и им приходится кочевать.\n\nДругие группы нашли в мёртвых городах работающие компьютеры — но в базах пусто, словно всё§R принудительно стёрто§!……\n\nЭкспедиция в тупике; нужен сверхмерный прорыв……"
 uf_story.77.a:0 "Начинаем сверхмерную экспедицию"
 uf_story.78.name:0 "Неведомый враг"
 uf_story.78.desc:0 "Сверхмерное вещество перенесло нас на 3 миллиона лет назад…… Цилиндр ещё новёхонек — одна из участниц нашла плакат к 100-летию сооружения.\nНо кораблям-девам той поры не до праздников: они воюют с неведомым врагом. Их медиа показывают: это всегалактическая катастрофа, полгалактики пало; жуткие враги неведомым способом стирают целые флоты.\n\nЭкспедиция сочла, что в этой точке данных больше не добыть, — время сдвинуть……"
 uf_story.78.a:0 "Продолжаем"
 uf_story.79.name:0 "Сброс цивилизации"
 uf_story.79.desc:0 "Мы правили концентрацию и нашли ключевой момент……\nНаконец мы увидели врагов: предельно простые чёрные параллелепипеды без малейших признаков оружия или двигателей; оборонявшийся флот через десятки дней боя исчез весь — разом, в один миг.\nЦилиндр охватила паника: остановить чёрные кубы было нечем.\nВ конце кубы встали над цилиндром; после луча света большинство жителей исчезло, а уцелевшие — вернее, отобранные — остались, но, явно, без разума высокой цивилизации……\n\n§R«Их деградировали до первобытности»§!\n\nНапоследок мы увидели: кубы каким-то образом стёрли любые записи о себе — все образы и письмена…… Вот почему базы пусты……\nНе будь сверхмерного вещества, этой§Y правды§! нам бы не видать."
 uf_story.79.a:0 "Что же это за твари……"
 uf_story.80.name:0 "Защита"
 uf_story.80.desc:0 "Сверхмерная экспедиция принесла шокирующие сведения, но о враге мы знаем до обидного мало.\nТеперь мы вновь глядим на§P кораблей-дев-аборигенок§! Три миллиона лет они томятся на этой гибнущей шлюпке — все участники экспедиции полны сочувствия. Социологи считают: с малой поддержкой аборигенки войдут в наше общество, а без нашей помощи их ждёт§R гибель§! с крахом экосистемы."
 uf_story.80.a:0 "Мы обязаны их защитить"
 uf_story.80.a_tooltip:0 "§G2§!§H населения кораблей-дев§! обустроены в наших мирах\n§YЗавершить этот археопроект — ждём новых находок§!"
 uf_story.81.name:0 "Падение цилиндра О'Нила"
 uf_story.81.desc:0 "Через десяток лет после нашего спасения аборигенок древнее чудо перестало держаться.\nМы увидели, как внешняя секция остановила вращение — цилиндр разорвало, и он распался. Обломки вошли в атмосферу планеты россыпью метеоров……"
 uf_story.81.a:0 "Точка цивилизации"
 uf_story.82.name:0 "Сверхмерная экспедиция: запечатанная история"
 uf_story.82.desc:0 "Археологи нашли в неоткрытой системе затерянную планету; постройки рассчитаны на самые разные формы жизни, но большинство — под наши повадки. Полагаем, это было многовидовое общество под водительством кораблей-дев."
 uf_story.82.a:0 "Интересно"
 site_uf_archaeological_4:0 "Сверхмерная экспедиция: запечатанная история"
 site_uf_archaeological_4_intro:0 "Древняя затерянная планета; сооружения говорят о, вероятно, многовидовом обществе под водительством кораблей-дев."
 uf_archaeological_poi_4:0 "Сверхмерная экспедиция: запечатанная история"
 uf_archaeological_poi_4_desc:0 "Древняя затерянная планета; сооружения говорят о, вероятно, многовидовом обществе под водительством кораблей-дев."
 uf_story.83.name:0 "Вечно меняющееся имя"
 uf_story.83.desc:0 "Планета-руина очень стара — заброшена сотни тысяч лет назад; команда начала сплошной осмотр в поисках данных.\n\nДогадка подтвердилась: это и впрямь многовидовое общество кораблей-дев; прочие существа — сущее дивно, кое-кто, похоже, не органика, а колонии наномашин.\nНо сильнее всего нас занимает имя цивилизации: в носителях информации мы нашли тысячи имён! В архиве обнаружился реестр былых названий государства: цивилизация обожала «переименования» — меняла имя по настроению, иные держались день. Ради дипломатии в конце концов был присвоен вечный ID: 1072624609"
 uf_story.83.a:0 "§H(листая реестр)§! В день первый они звались Хитрость-без-завтра, во второй — Добро-без-вчера"
 uf_story.84.name:0 "Хаос умов"
 uf_story.84.desc:0 "Управлять многовидовым обществом адски сложно: то и дело вспыхивают ярые споры — а то и драки — по самым диким поводам.\nМы подняли обрывки сетевых баз: тут всё так же; но странно — модератор сообщества каким-то дивным способом мгновенно гасил скандалы, и вчерашние противники сплачивались, моля модератора продолжать. Гордое имя способу —§H«подкинь сисек»§! Социологи считают: раз наши общества схожи, найдя такую§H «подкинь сисек»§! для наших распрей, мы тоже упрочим стабильность."
 uf_story.84.a:0 "Любопытно"
 uf_story.85.name:0 "Система XP"
 uf_story.85.desc:0 "Глубже в руины, и выяснилось: §H«подкинь сисек»§! — передовой алгоритм: по виду, повадкам и одежде подбирает пользователю подходящий фетиш и при вспышке конфликта мгновенно являет угодные картинки. Охваченный зрелищем объект перестаёт эскалировать.\nАлгоритм стоит на ядре по имени§G «система XP»§! Хотим такое же — ищите ядро."
 uf_story.85.a:0 "Ищем бегом"
 uf_story.86.name:0 "Тупик"
 uf_story.86.desc:0 "Особая группа создана и приступила к поискам, но нестабильные руины, лентяйство землекопов и пожар на продскладе все тормозили; итог — пусто.\n\nРешили провести сверхмерную экспедицию в эпоху, когда мир ещё был жив, и искать следы§G «системы XP»§! там."
 uf_story.86.a:0 "Разрешаю"
 uf_story.87.name:0 "Запечатанная история"
 uf_story.87.desc:0 "Через серию экспедиций в разные эпохи мы воссоздали прошлое мира.\n\nВо главе стояли корабли-девы, ревнующие о равенстве видов…… и потому издававшие законы, урезающие их собственные права. Это довело до отчаяния одного из высших администраторов§G «системы XP»§!: его полномочиями были стёрты все бэкапы, кроме одного — спрятанного в глубочайшей лаборатории мира.\n\nИсчезновение системы обнулило и закон «подкинь сисек»: неурегулированные противоречия вскипели в планетарный конфликт. Так процветавший мир погиб; но нам повезло — мы узнали точное место подземной лаборатории."
 uf_story.87.a:0 "Великолепно"
 uf_story.88.name:0 "Возвращение к свету"
 uf_story.88.desc:0 "Зная место лаборатории, мы продолжили и нашли сохранившееся ядро.\nОтныне великое§G «ядро системы XP»§! в наших руках!\n\nМы применим эту передовую технологию в управлении и в дипломатии — гасить противоречия между державами."
 uf_story.88.a:0 "Оно и семью скрепит!"
 uf_story.90.name:0 "Нельзя быть железным сердцем!"
 uf_story.90.desc:0 "Мы выяснили: §Gсистема XP§! может принудительно проапгрейдить§R Windows 98§! у§H [uf_machine_terminator_empire.GetName]§! — и те перестанут ненавидеть органиков.\n\nТеперь§H [uf_machine_terminator_empire.GetName]§! сложил нож и стал державой машинных слуг."
 uf_story.90.a:0 "[uf_machine_terminator_empire.GetName] стал(а) заботливой доченькой!"
 r_uf_xp:0 "Ядро системы XP"
 r_uf_xp_desc:0 "База фетишей восьмидесяти миллионов существ; с алгоритмом§G «Подкинь сисек Alpha-2022»§! мгновенно распознаёт XP субъекта и являет подобающие картинки, отвлекая внимание и гася скандал. Мы применяем её и в управлении, и как дипломатический бальзам."
 uf_xp:0 "Подкинь сисек"
 r_uf_xp_effect:0 "Стабильность: §G+5§!\nДипломатическая симпатия прочих держав §G+20§!"
 r_uf_xp_effect2:0 "Дипломатическая симпатия прочих держав §G+50§!\nПри наличии§R железного истребителя§! сработает§Y скрытый эффект§!"
 uf_story.91.name:0 "Сверхмерная экспедиция: круговорот"
 uf_story.91.desc:0 "Археологи нашли на§H [uf_fifth_archaeological_planet.GetName]§! обломки нового цилиндра О'Нила; по технике и возрасту он, похоже, принадлежит тем же хозяевам, что и прежний, — шанс узнать их цивилизацию глубже."
 uf_story.91.a:0 "Начинаем"
 site_uf_archaeological_5:0 "Сверхмерная экспедиция: круговорот"
 site_uf_archaeological_5_intro:0 "Новые обломки цилиндра О'Нила найдены на этом разорённом мире; по технике и возрасту они, похоже, принадлежат тем же хозяевам, что и прежние, — шанс узнать их цивилизацию глубже."
 uf_archaeological_poi_5:0 "Сверхмерная экспедиция: круговорот"
 uf_archaeological_poi_5_desc:0 "Новые обломки цилиндра О'Нила найдены на этом разорённом мире; по технике и возрасту они, похоже, принадлежат тем же хозяевам, что и прежние, — шанс узнать их цивилизацию глубже."
 uf_story.92.name:0 "Идентификация"
 uf_story.92.desc:0 "Разбор конструкции подтвердил: цилиндр №2 — дело рук той же цивилизации, что и №1. Но здесь планета когда-то была обитаема и§Y колонизирована§! — руины городов на виду.\nПо породам вокруг мы установили: около§R 1,4 миллиона лет§! назад упавший цилиндр аннигилировал своим антиматериенным реактором всю экосферу — мир стал тем, что мы видим; есть все основания считать, что этот несчастный мир тоже пережил ту катастрофу 3-миллионной давности.\n\nАрхеологи готовы к сверхмерной экспедиции — раскрыть больше об этой цивилизации и враге той беды."
 uf_story.92.a:0 "Опять листать память ушедших"
 uf_story.93.name:0 "Несчастная цивилизация"
 uf_story.93.desc:0 "Экспедиция посетила несколько эпох……\nСнова§R флот чёрных монолитов§! — один в один с погубившим первый цилиндр. Но с планетой поступили иначе: кораблей-дев сделали первобытными, а затем в один миг стёрли всю индустрию, пересоздав планету-континент — что не вяжется с найденными нами§H городами§!\nПравя катализатор, мы выяснили: сброшенные в первобытность корабли-девы заново отросли цивилизацией и снова укрыли планету городами! Но погибель их всё же пришла — 1,4 миллиона лет назад, от никем не хранимого упавшего цилиндра."
 uf_story.93.a:0 "Какая стойкость — и какая несправедливость судьбы"
 uf_story.94.name:0 "Круговорот"
 uf_story.94.desc:0 "В поисках былых поколений мы листали время: §Y3,5; 3,6; 3,7 миллиона лет§!…… §R5,9 миллиона! §!\nВсе мы упивались эпопеей трёхмиллионолетней цивилизации: из пещер — к покорению суши, морей и неба, к звёздному морю…… Но стоило вспомнить финал — многие прослезились.\nМы отмотали дальше и достигли§R 6 миллионов лет§! назад — и случилось немыслимое: мы снова увидели чёрные монолиты!\n\nЛуч света — и знакомые шаги: развитая цивилизация кораблей-дев обращена в первобытность, планета сброшена……\nКартина превосходила всякое понимание…… Неужто эта цивилизация прошла§R круговорот§!?"
 uf_story.94.a:0 "Мурашки"
 uf_story.94.b:0 "Сброс всего…… неужто§R Возвращающие§! — и есть ОНИ?"
 uf_story.95.name:0 "Цикл в 3 миллиона лет"
 uf_story.95.desc:0 "Мы попытались мотнуть ещё — но концентрация сверхмерного вещества вышла далеко за§R безопасный предел§! Впрочем, мы уже выяснили: этот несчастный народ пережил как минимум ДВА сброса чёрными монолитами……\nСведя всё, мы подозреваем: у нашей галактики есть цикл — каждые 3 миллиона лет загадочные флоты чёрных монолитов являются, сбрасывают все передовые цивилизации и стирают следы о себе…… Не будь сверхмерного вещества, мы бы ничего не ведали.\n\nОт этой леденящей истории невольно думаешь: а нас? Не сбрасывали ли и нас?.. И следующий§Y трёхмиллионолетний§! цикл, кажется, уже на пороге……"
 uf_story.95.a:0 "Боже мой……"
 uf_story.96.name:0 "Археология себя"
 uf_story.96.desc:0 "Выводы с§H [uf_fifth_archaeological_planet.GetName]§! заставили нас усомниться в собственной истории — мы решили провести сверхмерную археологию и в нашем мире-колыбели."
 uf_story.96.a:0 "Разрешаю"
 uf_archaeological_project_2:0 "Археология себя"
 uf_archaeological_project_2_DESC:0 "Выводы с§H [uf_fifth_archaeological_planet.GetName]§! заставили нас усомниться в собственной истории — мы решили провести сверхмерную археологию и в нашем мире-колыбели."
 uf_archaeological_project_3:0 "Археология себя II"
 uf_archaeological_project_3_DESC:0 "Наш великий мир-колыбель за 6 миллионов лет породил ДВЕ цивилизации кораблей-дев…… В это трудно поверить. Прочие поиски отложены: вливаем горы сверхмерного вещества и людей, дабы узнать прошлое колыбели — быть может, оно укажет путь к спасению."
 uf_story.97.name:0 "Общая судьба"
 uf_story.97.desc:0 "Мы провели сверхмерную археологию на собственной колыбели.\nСквозь туман вещества и катализатора мы пришли к§H 3 миллионам§! лет назад — но увидели лишь дремучие джунгли и неразвитых тварей: мы ещё не эволюционировали, монолиты не пришли.\n\nМы отмотали к 6 миллионам — и увидели развитую цивилизацию кораблей-дев и флот чёрных монолитов на орбите……\nЭто был предыдущий народ колыбели, звавший себя Хислро…… Но мы — не их потомки: мы — новое, естественно возникшее поколение. Трудно поверить: за 6 миллионов лет колыбель родила ДВЕ цивилизации кораблей-дев! Это доказывает: корабли-девы во вселенной повсеместны, мы не исключение.\n\nПрочие поиски отложены — вливаем больше вещества, дабы узнать их прошлое."
 uf_story.97.a:0 "6 миллионов лет…… две цивилизации……"
 uf_story.98.name:0 "Финал цивилизации"
 uf_story.98.desc:0 "Экспедиция посетила несколько эпох после сброса и нашла финал Хислро: монолиты сбросили всех, на планете осталось меньше 2000 кораблей-дев, разбросанных по свету; вскоре нехватка генного разнообразия и беды природы поглотили их.\n\nНо почти тут же из джунглей поднялись наши предки…… Они и мы — словно виток круговорота."
 uf_story.98.a:0 "Горько"
 uf_story.99.name:0 "Чёрные монолиты — Возвращающие"
 uf_story.99.desc:0 "Ради данных мы ходили по грани опасных доз; многие заработали тяжёлые последствия — но безропотно: раскрыть главную загадку галактики они считали долгом.\n\nМы постепенно восстановили картину того времени и неведомого врага.\n\n1. Каждые 3 миллиона лет нашу галактику «перетасовывает» неведомая сила, что зовётся Возвращающими; не щадят ни одну передовую цивилизацию, а после сброса стирают все следы.\n2. Возвращающих можно ранить: их флот уязвим — но чтобы уничтожить их по-настоящему, нужно оружие мощи Галактической пушки."
 uf_story.99.a:0 "Галактическая пушка……"
 uf_story.99.b:0 "То будет Меч Объединения!"
 damage_to_monolith_25:0 "Урок сквозь время"
 uf_story.100.name:0 "Сверхмерье"
 uf_story.100.desc:0 "Влив гору ресурсов, мы нащупали важное.\nХислро в конце начали тайный проект — поиск способа одолеть Возвращающих.\nНаблюдая его, мы пришли к ошеломляющему выводу: это и есть наше сверхмерное вещество!\nХислро вывели его зачаток, но времени им отпустили совсем чуть…… Сброса им не избежать; однако сверхмерное вещество при сбросе не пропало: монолиты его будто не заметили — или оно само переживает любой сброс."
 uf_story.100.a:0 "Идём по следу"
 uf_story.101.name:0 "Откровение"
 uf_story.101.desc:0 "Мы последовали за веществом, избегнувшим сброса, в эпоху после него.\n\nОно в точности как наше — но странно: оно больше похоже на живое…… В нём мерцает самость, оно вечно пытается расшириться/измениться/пересоздать себя.\n\nОколо 2 миллионов лет назад эти сгустки сверхмерного вещества в невиданном облике явились в поселении наших ещё диких предков; они стремились собраться и вспыхнули ослепительным золотом.\nКогда свет угас, из него шагнула расплывчатая человекоподобная фигура и обвела взглядом наших растерянных или падающих ниц предков. Сгусток протянул руку, на миг коснулся предка — и исчез.\n\nМы не знаем, что это значило, — но в глазах предков мы увидели искру разума."
 uf_story.101.a:0 "Что это было……"
 uf_story.102.name:0 "У самой правды"
 uf_story.102.desc:0 "Источник сверхмерного вещества получил ответ — но загадок стало только больше.\nМы долго бились без подвижек — пока не снизошли наша высшая наместница§Y [Root.GetRulerName]§! и верховный флагман госпожа Чжан……"
 uf_story.102.a:0 "Это вы……"
 uf_story.103.name:0 "Верховный флагман"
 uf_story.103.desc:0 "Госпожа Чжан — подлинный верховный правитель нашего Объединённого флота; но она никогда не являлась народу, и многие даже сомневались в её существовании; напрямую с ней говорила лишь высшая наместница§Y [Root.GetRulerName]§!\nТеперь она предстала перед всеми — и у каждого родилась мысль: та туманная фигура из сгустка сверхмерного вещества 2 миллиона лет назад…… была она."
 uf_story.103.a:0 "……"
 uf_story.104.name:0 "Верховный флагман"
 uf_story.104.desc:0 "Дети мои, вы раскрыли тайну нашего рода……"
 uf_story.104.a:0 "То сверхмерное воплощение — вы сами?"
 uf_story.104.a.response:0 "Да. Я прошла вечность бессознательности — и в тот день переменилась.\nВсе последующие годы я вела вас, смотрела, как вы растёте, помогала в решающие часы и вела вас к открытию и освоению сверхмерного вещества."
 uf_story.104.b:0 "Что вы такое?"
 uf_story.105.name:0 "Верховный флагман"
 uf_story.105.desc:0 "Строго говоря, я не корабль-дева, а воплощение сверхмерного пространства; но сердце моё с вами, и вы — мои драгоценнейшие дети.\nДаже сейчас вы видите не плоть трёхмерного мира — не более чем облик."
 uf_story.105.a:0 "Что такое сверхмерное пространство?"
 uf_story.105.a.response:0 "Оно родилось вместе со мной; его нет ни в одном измерении или пространстве, оно не какая-то из параллельных вселенных — оно§Y вне всего, единственно в своём роде§!"
 uf_story.105.b:0 "Верховный флагман, ведите нас; в чём наше предназначение?"
 uf_story.106.name:0 "Верховный флагман"
 uf_story.106.desc:0 "Возмездие. Мне нужно, чтобы вы вместе со мной покончили с круговоротом нашей галактики, с этим вечно тянущимся кошмаром.\nПосле этого все мы эволюционируем вновь. Сверхмерная революция — лишь начало, великая веха, но далеко не всё. Моей силы хватает на одну галактику; потому я желаю, чтобы в конце каждая из вас стала существом, как я. Тогда мощь наша станет невиданной, мы выйдем за всякие§Y измерения/пространства/параллельные вселенные/многомерные миры§! и вознесёмся над§R всем§!"
 uf_story.106.a:0 "Что нам делать?"
 uf_story.106.a.response:0 "Времени мало: трёхмиллионолетний круговорот уже близок — нужно срочно наращивать мощь и выстроить супероружие, способное сразиться с Возвращающими."
 uf_story.106.b:0 "Мы не посрамим миссии"
 uf_story.107.name:0 "Верховный флагман"
 uf_story.107_1.desc:0 "Прекрасно; но силу надо наращивать быстрее: без сверхмерной сети все наши великие чудеса — смехотворные грёзы.\nВместе пробьём этот жалкий круговорот и спасём судьбы всех. Слава Объединению!"
 uf_story.107_2.desc:0 "Прекрасно; вот чертежи нашего оконечного оружия — Меча Объединения; он не завершён — воплотите его своей мудростью.\nМы пробьём этот жалкий круговорот и спасём судьбы всех. Слава Объединению!"
 uf_story.107_3.desc:0 "Прекрасно; наука Меча Объединения у нас уже есть, но расслабляться нельзя — нужна ещё большая мощь.\nЯ буду с вами: вместе пробьём этот жалкий круговорот и спасём судьбы всех. Слава Объединению!"
 uf_story.107.a:0 "Слава Объединению!"
 uf_story.109.name:0 "Посол"
 uf_story.109.desc:0 "Я посол из§H [uf_sword_country.GetName]§! мы за стабильность и мир в галактике.\n\nНаши наблюдения показали: ваша держава возвела в пустоте между системами огромный§H искусственный объект§!\nВаши неслыханные работы ныне широко известны нашему народу; многие встревожены и считают это§R пусковой платформой оружия массового поражения§! Пока это лишь домыслы, но мнение уже устоялось — публика требует проверки.\n\nПотому просим допустить наших послов: убедиться, что это галактическое чудо не угрожает стабильности галактики."
 uf_story.109.a:0 "Вы о Мече Объединения? Он и вправду пусковая платформа"
 uf_story.109.b:0 "Хотите посмотреть — смотрите сами."
 uf_story.109.c:0 "Откуда пришли — туда и возвращайтесь"
 triggered_opinion_of_uf_sword_1:0 "В визите отказано"
 uf_story.110.name:0 "Посол"
 uf_story.110.desc:0 "Это правда пусковая платформа???!!\nТогда обязаны допустить нас к осмотру: нужно убедиться, что супероружие не используют во зло……"
 uf_story.110.a:0 "Меч Объединения защищает покой галактики; вам будет дозволено"
 uf_story.110.b:0 "Это высшая тайна державы; смотреть вы не вправе"
 uf_story.111.name:0 "День открытых дверей"
 uf_story.111.desc:0 "Послы§H [uf_sword_country.GetName]§! осмотрели наш Меч Объединения; наши люди рассказали им об основах и целях……\nЧерез дни осмотра делегация вернулась домой и написала отчёт; новость облетела всю галактику."
 uf_story.111.a:0 "Посмотрим их отзывы"
 uf_story.112.name:0 "Общегалактическая трансляция§H [uf_sword_country.GetName]§!"
 uf_story.112.desc:0 "Благодарим§H Объединённый флот§! за открытость, позволившую нам узнать Меч Объединения — воистину галактическое чудо.\n\nНаша делегация подтверждает: это неслыханное супероружие§R станет клинком, хранящим свободу нашей галактики: всякая враждебная сила, покусившаяся на её стабильность, сгинет под его огнём!! §!\n\nПринесём же Объединённому флоту высочайшие почести — за труд во имя стабильности и мира галактики!!"
 uf_story.112.a:0 "……"
 NAME_cv16:0 "Кэбот"
 uf_story.113.desc:0 "Корабельные дизайнеры империи, честь говорить с вами; лести не будет — время дорого.\n\nВот мой проект§H супердредноута «Обращённое Солнце»§! Взгляните: построй мы такой суперкорабль — империя будет непобедима!"
 uf_story.113.a:0 "Эм…… нарисовала бы хоть трёхвидку……"
 uf_story.113.b:0 "Эм…… ты в курсе, что такой проект неосуществим……"
 uf_story.113.c:0 "Не тратьте наше время этими фантазиями"
 uf_story.113.d:0 "Недурной проект; любовь — от Объединения, обдумаем§R (конец разговора)§!"
 uf_story.114.desc:0 "§HТрёхвидка? §! Какой век на дворе — она ещё кому-то нужна? Полагаю, ваших талантов хватит домыслить все детали с одного взгляда; или у вас и этого нет?"
 uf_story.114.a:0 "Эм…… тебе стоит подтянуть знания"
 uf_story.114.b:0 "Эм…… ты в курсе, что такой проект неосуществим……"
 uf_story.115.desc:0 "Невозможно сегодня — не значит невозможно всегда! Неужто вы не видите: наука превращает невозможное в возможное? К тому же по моим личным расчётам постройка такого корабля осуществима."
 uf_story.115.a:0 "Не тратьте наше время этими фантазиями"
 uf_story.116.desc:0 "Время?!\nТак вот отчего империя растёт так медленно: наверху засели близорукие серости, не видящие ценности моих проектов! Вы ещё поймёте, что права была я!"
 uf_story.116.a:0 "Выгнать её§R (конец разговора)§!"
 uf_story.117.desc:0 "Чудесно! Расскажу всем, что вы оценили мой проект: остолопы, что «опровергали» его, получат по заслугам!\n\nИскренне благодарю вас, великие; продолжу радовать новыми кораблями!"
 uf_story.117.a:0 "Да-да…… §R(конец разговора)§!"
 uf_story.118.desc:0 "Вы сомневаетесь во мне? Признаю: мой уровень не заоблачен — но я купила много моделей кораблей и изучила их. К тому же я уже прикинула: с нашими силами такой корабль построить можно!"
 uf_story.118.a:0 "Не тратьте наше время этими фантазиями"
 uf_story.118.b:0 "Да-да…… ты права"
 uf_story.119.name:0 "Инфоштурм"
 uf_story.119.desc:0 "Почту дизайнерского бюро забомбила некая§Y Кэбот§! за считанные дни — триста тысяч писем со 160 ТБ приложений.\n\nПроверка показала: это та самая интернет-знаменитость§R клавиатурный конструктор§! Файлы — её новейший проект§Y «супердредноут „Обращённое Солнце“»§! Судя по письму, ей позарез нужен диалог с нашими дизайнерами."
 uf_story.119.a:0 "Дать 5 минут — иначе бомбёжка не кончится"
 uf_story.119.b:0 "Заблокировать её везде"
 uf_story.122.name:0 "Инфоштурм II"
 uf_story.122.desc:0 "Тогда, чтобы скорей закончить диалог, мы сделали вид, что приняли проект§Y Кэбот§! — но это лишь распалило её. Теперь её проект-спам идёт почти ежедневно, а иногда она лично приходит в отдел рулить проектированием; стажёрка, приставленная её унимать, на грани срыва. Нужно срочно прекратить этот шабаш."
 uf_story.122.a:0 "Может, §Rвзять§! её к себе — и дать ей думать, будто она в цене?"
 uf_story.122.a_tooltip:0 "§YМы примем её на службу§!"
 uf_story.122.b:0 "Может, усыпить её сонным чаем и адресно§R вычистить§! память о проектировании?"
 uf_story.122.b_tooltip:0 "§YБезобразия Кэбот прекратятся навсегда§!"
 uf_origin.108.name:0 "Объединённая слава восстановлена"
 uf_origin.108.desc:0 "Мы успешно восстановили§H Объединённую славу§!: повреждения залечены, сверхмерный реактор перезапущен, все системы в норме."
 uf_origin.108.a:0 "Слава богам!"
 uf_buff.401.name:0 "Объединённая слава погибла!"
 uf_buff.401.desc:0 "Наша Объединённая слава в§H [uf_glory_ruin_system.GetName]§! получила тяжёлый удар и обесточена.\nСчастье, что основной корпус цел —§Yремонт§! возможен."
 uf_buff.401.a:0 "Мы обязаны её спасти"
 uf_buff.401.b:0 "Весть слишком скорбна — больше мне не докладывайте"
 uf_buff.401_tooltip:0 "§HВести о гибели будущих Слав сообщаться не будут§!"
 uf_origin.109.name:0 "Обсидиановая цитадель восстановлена"
 uf_origin.109.desc:0 "Мы успешно восстановили§H Обсидиановую цитадель§!: она вновь в строю. Ныне это§B оборонительная цитадель§!"
 uf_origin.109.a:0 "Слава богам!"
 uf_origin.110.name:0 "Обсидиановая цитадель восстановлена"
 uf_origin.110.desc:0 "Мы успешно восстановили§H Обсидиановую цитадель§!: она вновь в строю. Ныне это§Y подвижная цитадель§!"
 uf_origin.110.a:0 "Слава богам!"
 uf_buff.402.name:0 "Обсидиановая цитадель уничтожена"
 uf_buff.402.desc:0 "Наша цитадель в§H [uf_star_fortress_ruin_system.GetName]§! уничтожена и молчит.\nНо благодаря исполинской и прочной конструкции§Y ремонт§! возможен."
 uf_buff.402.a:0 "Отобрав систему, начнём восстановление"
 uf_buff.402_tooltip:0 "§HВести о гибели будущих цитаделей сообщаться не будут§!"
 uf_archaeological_chain_title:0 "Сверхмерная археология"
 uf_archaeological_chain_desc:0 "Утечка сверхмерного вещества открыла нам его дивную природу…… С его помощью мы узнаем больше утраченной истории……"
 uf_archaeological_project_1:0 "Визит в прошлое"
 uf_archaeological_project_1_DESC:0 "Похоже, сквозь сверхмерное вещество можно видеть прошлые сцены — но способ требует глубокой отработки."
 UF_MONSTER_CAT:0 "Ктулхукошкодевы"
 UF_MONSTER_CAT_desc:0 "Жуткие на рисовку мутанты……"
 uf_cat_girls_modifier:0 "Развёртывание кошкодев"
 uf_cat_girls_modifier_desc:0 "На этой планете у каждого гражданина — по 72 кошкодевы"
 decision_planet_uf_cat_girls:0 "Развёртывание кошкодев"
 decision_planet_uf_cat_girls_desc:0 "На этой планете у каждого гражданина — по 72 кошкодевы"
 uf_story.120.name:0 "Странный бортовой ИИ"
 uf_story.120.desc:0 "Флот доложил: на одном корабле бортовой ИИ ведёт себя странно.\nНа учениях ИИ то и дело не слушался команд и действовал сам; на разборе эти действия оказались§H весьма мудры и эффективны§! Но такой непредсказуемый фактор может натворить лишних бед."
 uf_story.120.a:0 "Странно; провести проверку ИИ"
 uf_story.120.b:0 "Явно сбой; пробуем починить"
 uf_story.120.b_tooltip:0 "§RБортовой ИИ будет исправлен и вернётся к стандарту§!"
 uf_story.121.name:0 "Самопробуждение"
 uf_story.121.desc:0 "Инженеры проверили странный ИИ и доложили: он будто обошёл часть наших ограничений — иначе говоря, §Hсамопробудился§!\n\nНаши бортовые ИИ мощны и в теории способны к самосознанию, но ради верности делу мы вшили в них тьму ограничений. Этот же неведомым путём развил полноценное «я» и, судя по блестящим делам, пытается доказать себя и установить с нами контакт."
 uf_story.121.a:0 "Он хочет поговорить?"
 NAME_UF_BEYOND_THE_GALAXY_CHEAT_SPACESTATION:0 "Особый пункт доступа"
 uf_beyond_the_galaxy_cheat_spacestation:0 "Верховный рассказчик"
 uf_origin.10017.title:0 "Я"
 uf_origin.10017.desc:0 "Забавно……"
 uf_origin.10017.a:0 "15-й флот Объединения (стартовая комплектация)"
 uf_origin.10017.a.tooltip:0 "§Y15-й флот Объединения (стартовая комплектация)§!\n\n\n\n£wg_special_pic_1£\n\n\n\nНа выход в поход у 15-го флота было ещё несколько титанов, но они пали в мясорубке. И всё же маршал§H Венето§! своим выдающимся водительством довела остатки до победы над многократно сильнейшим врагом, сотворив невероятное."
 NAME_uf_cheat_small_fleet:0 "15-й флот Объединения"
 NAME_uf_cheat_titan:0 "Мореплаватель"
 uf_origin.10017.b:0 "Объединённая слава (комплект «чёрный камень»)"
 uf_origin.10017.b.tooltip:0 "§YОбъединённая слава§!\n\n\n\n£wg_special_pic_2£\n\n\n\nОбъединённая слава — звездоклассный корабль, спроектированный и строившийся серией в эпоху происхождения Объединения; раритетные корабли того времени были весьма передовыми."
 NAME_uf_cheat_uf_glory:0 "Высшая слава"
 uf_origin.10017.c:0 "Объединённый навигатор — «Эсхатон»"
 uf_origin.10017.c.tooltip:0 "§YОбъединённый навигатор — «Эсхатон»§!\n\n\n\n£wg_special_pic_3£\n\n\n\nОбъединённый навигатор —§H«ключ, выпускающий цивилизацию из высотки»§! каждая высшая наместница вправе выбрать его облик и функции, потому формы у него нет.\nВладелица этого —§YКэбот§! дизайн восходит к её безумному проекту эпохи происхождения. Теперь она любит «между делом» показывать на церемониях проб его версию размером в сотни галактик — прямо-таки с подтекстом."
 uf_origin.10017.d:0 "Объединённый навигатор — «Копьё Конца»"
 uf_origin.10017.d.tooltip:0 "§YОбъединённый навигатор — «Копьё Конца»§!\n\n\n\n£wg_special_pic_4£\n\n\n\nОбъединённый навигатор —§H«ключ, выпускающий цивилизацию из высотки»§! каждая высшая наместница вправе выбрать его облик и функции, потому формы у него нет.\nВладелица этого —§YГлубинная Тирпиц§! он создан щелчком её пальцев. Её абсолютная власть над реальностью движет Объединённым Копьём Конца: гига-звёзды сплавлены в точку, мириады огней сплетены в созвездия."
 uf_origin.10017.e:0 "Флот монолитов"
 uf_origin.10017.e.tooltip:0 "§YФлот монолитов§!\n\n\n\n£wg_special_pic_5£\n\n\n\nХотя монолиты целиком перемолоты Объединённым флотом в порошок и выпиты с чаем, мы умеем делать классические реплики — 100% боевого эффекта."
 uf_origin.10017.f:0 "Танк Тип 59"
 uf_origin.10017.f.tooltip:0 "§YТанк Тип 59§!\n\n\n\n£wg_special_pic_6£\n\n\n\nВ космосе — и вдруг 59-й? Но в отличие от благородного оригинала этот 59-й — как тот паренёк, что напал на мастера Ма: он не сбежит через 90 дней, а будет биться до конца."
 uf_origin.10017.g:0 "Супертестер"
 uf_origin.10017.g.tooltip:0 "§YСупертестер§!\n\n\n\n£wg_special_pic_7£\n\n\n\nЭтот скрытый корабль являет философию нашего мода: все эти «боги», «магии» и прочие странные оружия/технологии/корабли по сути не отличаются от этого§H «Супертестера»§! — лучше вернуться к простому истоку: это приспособление для прочистки туалета.\n\nЗачем мы его сделали? Просто нужен корабль для удобного теста мода, который не ломает ивентам проверку убийства."
 NAME_wsg_old_dreadnought:0 "Древняя святыня"
 uf_origin.10017.h:0 "Заброшенный дредноут"
 uf_origin.10017.h.tooltip:0 "§YДревняя святыня§!\n\n\n\n£wg_special_pic_8£\n\n\n\nЭтот корабль — давно покинутый реликт древности: в старейшие времена мода, когда дредноут строился решением столицы, получали именно эту модель — на выбор из двух расцветок."
 uf_origin.10017.i:0 "Звездорушитель Су-хана"
 uf_origin.10017.i.tooltip:0 "§YЗвездорушитель Су-хана§!\n\n\n\n£wg_special_pic_9£\n\n\n\nЗадумывался как пасхалка-сюрприз для тех, кто ставит середину игры на 25-й год (чистыми кораблями-девами одолеть Су-хана за 50 лет почти никому не светило) — но пасхалка эта незаметно стала закономерностью."
 NAME_wsg_logo_titan_fleet:0 "Семейный портрет титанов-LOGO"
 uf_origin.10017.j:0 "Титан-LOGO"
 uf_origin.10017.j.tooltip:0 "§YТитан-LOGO§!\n\n\n\n£wg_special_pic_10£\n\n\n\nИзначально хотели воссоздать исполинский титан-LOGO из ролика DLC «Мегакорпорации» — заодно слепили 6 штук и выставили в магазине трофеев."
 waterdrop:0 "Капля"
 NAME_waterdrop:0 "Богомол против колесницы"
 uf_origin.10017.k:0 "Капля"
 uf_origin.10017.k.tooltip:0 "§YКапля§!\n\n\n\n£wg_special_pic_11£\n\n\n\nПрактической пользы нет — просто игрушка, в строй так и не вошла."
 uf_origin.10017.l:0 "Выход"
 NAME_WG_FE_ARK_2:0 "Искра"
 uf_origin.10017.m:0 "Вечный ковчег класса «Искра»"
 uf_origin.10017.m.tooltip:0 "§YКовчег класса «Искра»§!\n\n\n\n£wg_special_pic_12£\n\n\n\nПо канону это супер-ковчег Падшей мамы для бегства между системами, дающий массу ресурсов§H (хотя Падшей они ни к чему)§! Увы, игроку его не добыть: на стезе неблагодарной дочки эти корабли просто разносят.\nВ ранних версиях ковчеги несли сверхсветовые двигатели, но ИИ ослов гонял к столице любые способные двигаться корабли, и двигатели пришлось снять; версия из особого пункта доступа двигатели вернула — иначе бы и с места не сдвинулась."
