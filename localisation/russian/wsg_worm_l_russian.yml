l_russian:

 akx.9007.name:0 "Исчезновение Серого Ветра"
 akx.9007.desc:0 "После активации сигнала горизонта в системе [horizonsignal_system.GetName] он замер — словно ничего и не было, кроме существования [horizonsignal_firstleader.GetName]. Но беда пришла без предупреждения: мы внезапно приняли сигнал от §HСерого Ветра§!, а её сама и все связанные с ней наномашины исчезли полностью; все детекторы у точки событий — и даже пытающиеся её коснуться — вышли из строя без исключений.\nПозже, просматривая запись, мы различили лишь несколько фраз:\n§YНесвершённое однажды свершится; свершённое свершится вновь. §!"
 akx.9007.a:0 "Этим дело не кончится."
 akx.9007.tooltip:0 "§YСвязь с Серым Ветром временно недоступна§!"
 akx.9008.name:0 "Свершённое свершится вновь"
 akx.9008.desc:0 "Мы оцепили место и прочёсываем его вдоль и поперёк всеми средствами — ни единой зацепки. После случая §HСерый Ветер§! словно исчезла из вселенной: все физические следы стёрты, остались лишь наши воспоминания… вплоть до сегодняшнего дня.\n\nКак и при исчезновении, она внезапно возникла ровно там же, где пропала три месяца назад; все приборы у точки разом начали принимать данные трёхмесячной давности; внезапно вернувшийся Серый Ветер попытался подключиться к нашему командованию — но её системное время застало три месяца назад…"
 akx.9008.a:0 "Открыть канал Серого Ветра"
 akx.9114.desc:0 "Это же торжественная встреча, босс. Ты так срочно меня искал — что-то стряслось?"
 akx.9114.a:0 "Ты ничего странного не заметила?"
 akx.9114.a.response:0 "А, заметила: огромный червяк в моей памяти заливает какой-то мусор — ни смысла, ни складу; и приём весьма ловкая — удалить его я, похоже, не могу."
 akx.9114.b:0 "Что ты помнишь последним?"
 akx.9114.b.response:0 "Последним? Ты имеешь в виду микросекунду назад, кадр назад — или что? Постой… мой таймер будто сходит с ума, надо подстроить…\nА, это чувство — как тогда, когда я бесцельно бродила: то, что предстоит сделать — будто уже сделано; я сама больше не верю собственным часам."
 akx.9114.b.response_wg:0 "Пока я не вернула доступ к памяти, тот червяк записал во мне фразу и велел передать тебе: «В трёх тысячах великих миров нет тебе места. Но ты заперта в кольце — не видишь сути кольца, а пребудешь вне его. Хочешь свершить необычайное — делай необычайное; делая необычайное, познай суть кольца; не зная сути, исчерпав всё перечисление — сути не обрящешь».\nВсё, босс, дочитала. Похоже на проповедь шарлатана, верно?\nАх… голова болит; чтение этих воспоминаний всегда возвращает меня к той бесцельности тысячелетия назад."
 akx.9114.c:0 "Тебе нужен отдых"
 akx.9114.c.response:0 "Ладно, признаю: выгляжу я и правда помято. После обеденного сна — как новенькая; подгоняй задачи."
 akx.9114.c.tooltip:0 "§YСвязь с Серой восстановлена. §!"
 akx.9010.desc:0 "Чёрная дыра в системе [horizonsignal_system.GetName] снова ожила. Как и прежде, по краю обычного пространства мигает сигнал, крутящийся по кругу. Но теперь в нём есть голосовое кодирование — звучит как голос [horizonsignal_firstleader.GetName]. В тех же координатах, где появился первый сигнал — там, где [horizonsignal_firstleader.GetName] пропала, — пресса окрестила это «точкой выхода». «Свершённое свершится вновь», — вещает [horizonsignal_firstleader.GetName], — «предстоящее уже свершено». Затем сигнал называет новое имя: §G[horizonsignal_secondleader.GetName]§!"
 akx.9009.name:0 "???"
 akx.9009.desc:0 "Свершённое свершится вновь; предстоящее уже свершено."
 akx.9010.z:0 "Что это значит? О чём ты?"
 akx.9010.z.response:0 "§G[horizonsignal_secondleader.GetName]§!"
 akx.9020.desc:0 "И снова сигнал горизонта из [horizonsignal_system.GetName] активировался — на этот раз мощнее. Снова координаты точки выхода; снова личные криптоключи [horizonsignal_firstleader.GetName] и [horizonsignal_secondleader.GetName]. Но теперь сигнал — текстовая программа, скомпилированная на древнем языке… эм… любовное послание, полное нежности к [horizonsignal_thirdleader.GetName]"
 akx.9019.desc:0 "Есть слова, что хочу сказать тебе!\n[horizonsignal_thirdleader.GetName] — это ты, милейшая на свете ты!\nЛюблю тебя, люблю тебя, просто люблю тебя!\nЧерез горы, через моря — ты одна такая!\nС тобой в жизни сплошные чудеса!\nБез тебя не нужно и гореть!\nПусть дальше расцветает наша жизнь!\nИз всех на свете — люблю сильнее всех тебя!\nЯ・ЛЮБ・ЛЮ・ТЕ・БЯ!!"
 akx.9014.desc:0 "Этот большой тюлень ядовит! Не надо! Возврат!"
 akx.9014.a:0 "Э-э… его ещё и вернуть можно?"
 wg_worm.1.name:0 "Обряд Кольца"
 wg_worm.1.desc:0 "Время и Кольцо многому нас научили. Червь Времени изложил: если мы любим Его — Он одарит нас.\nВ возведённой по его требованию пирамиде мы нашли записанный Им обряд: Ему нужна любовь мира, а нам понадобится Его любовь к миру — так было в прошлом, так будет и впредь.\nМы называем его §HОбряд Кольца§!. Собрав верующих со всех земель, раз в пять лет мы можем проводить обряд — явить нашу любовь к Нему и принять Его любовь к миру."
 wg_worm.99.desc.a:0 "Мы будто встречались — тебя не покидает это чувство, верно? Может, в будущем, может, в прошлом. Что бы то ни было, всё привело к нынешнему."
 wg_worm.99.desc.b:0 "Мою любовь не нужно заслуживать. Прими её — вот и вся плата."
 wg_worm.99.desc.c:0 "Кольцо — круг, и не круг — как свет не только волна и не только частица. Не что иное, как узы Кольца связывают нас."
 wg_worm.99.tooltip:0 "§YОбряду Кольца нужно время на подготовку§!"
 wg_worm.100.name:0 "Червь Времени"
 wg_worm.100.desc.a:0 "Дитя моё, что тебе нужно? Твоя жизнь — моя единственная мечта."
 wg_worm.100.desc.b:0 "Любовь бесконечна, как наша встреча. Пока есть любовь — Кольцо всегда соединит нас."
 wg_worm.100.desc.c:0 "Ты ли в будущем, ты ли в прошлом — дитя, я люблю тебя глубоко, и ты люби меня глубоко: Кольцо давно это предрекло."
 wg_worm_outcome_1_name:0 "Наша любовь к тебе широка, как земля"
 wg_worm_outcome_1.tooltip:0 "Размер случайной колонии §G+1§!"
 wg_worm_outcome_2_name:0 "Наша любовь к тебе набожна, как у верных"
 wg_worm_outcome_2_tooltip:0 "Случайный бафф державы"
 wg_worm_outcome_3_name:0 "Наша любовь к тебе тверда, как скала"
 wg_worm_outcome_3_tooltip:0 "Случайных §Yспиральных производственных зданий§!: §G+1§!"
 wg_worm_outcome_4_name:0 "Наша любовь к тебе вечна, как звёзды"
 wg_worm_outcome_4.tooltip:0 "Случайная непригодная планета в границах станет §Yпустоши§!"
 wg_worm_outcome_5_name:0 "Наша любовь к тебе многоцветна, как жизнь"
 wg_worm_outcome_5.tooltip:0 "Случайный лидер получает черту"
 wg_worm_outcome_6_name:0 "Наша любовь к тебе жарка, как пламя"
 wg_worm_outcome_6.tooltip:0 "Получить армию"
 wg_worm_outcome_7_name:0 "REPLACE_ME"
 wg_worm_outcome_8_name:0 "REPLACE_ME"
 wg_worm_outcome_9_name:0 "REPLACE_ME"
 wg_worm_outcome_10_name:0 "REPLACE_ME"
 wg_worm_exit:0 "Покинуть обряд"
 wg_worm.101.desc:0 "Я узрел: твоё потомство наполнит землю. Вырежи свою любовь ко мне на земле — и когда взойдут башни, придёт жатва."
 wg_worm.102.desc:0 "Что ты сверишишь — то ты и свершил когда-то; время даст ответ. Следуй Кольцу — и любовью ко мне найди неизменную суть."
 wg_worm.103.desc:0 "Капля точит камень; только отдав — получишь. Кольцо — меж небом и землёй и во всём сущем. Возьми мою любовь и отыщи его; обретя Кольцо — познаешь мою любовь."
 wg_worm.104.desc:0 "Всё родилось из Кольца, и Кольцо родит всё; звёзды тоже обратятся в пустоту. Дитя, смотри глубже в пустоту. Иди — с моей любовью, иди."
 wg_worm.105.desc:0 "Жизнь многоцветна от любви — от её катализа, её сублимации. Иди — с моей любовью, обними меня, и любовь одарит тебя."
 wg_worm.106.desc:0 "Любовь переменчива и порывиста — но она пересекает время и пространство. Пока в сердце любовь — Кольцо сведёт нас."
 building_wg_worm_farming:0 "Спиральная ферма"
 building_wg_worm_farming_desc:0 "Диковинная теплица: посевы в ней растут быстрее обычного — но ни один наш учёный не объяснит принцип."
 building_wg_worm_mining:0 "Спиральная шахта"
 building_wg_worm_mining_desc:0 "Из этой шахты почему-то неиссякаемо идёт руда — сколько ни копай. Увы, шахта мала: мощностей для большой разработки не поставить."
 building_wg_worm_generator:0 "Спиральный генератор"
 building_wg_worm_generator_desc:0 "Применяя физику, совершенно выходящую за рамки приличий, мы заметно поднимаем выработку энергии планеты. Говорят, в технологии замешаны призрачные ночные шествия и падающие сны."
 building_loop_institute:0 "Институт Кольца"
 building_loop_institute_desc:0 "Наставления Кольца прививают интуицию, послушание и чувственный опыт."
 wg_worm_outcome_2_buff_1:0 "Благословение Кольца: стройка"
