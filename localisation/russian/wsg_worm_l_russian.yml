 wg_worm_outcome_2_buff_8:0 "Благословение Кольца: познание"
 leader_trait_ruler_wg_the_loop:0 "Суть Кольца"
 leader_trait_ruler_wg_the_loop_desc:0 "Время для этого лидера — нечто иное: он трудится по истине, открытой Кольцом, и потому поступки его зачастую выше обыденного."
