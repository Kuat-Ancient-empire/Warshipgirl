 tr_sh_icebreaking_finish_effect:0 "§YВыработка ресурсов империи§!: §G+5%§!\n§YПри наличии стран корабельных дев — §!§G примирение§!\nПолучен путь вознесения: §G+1§!"
 tr_sh_icebreaking_1:0 "Социальная адаптация"
 tr_sh_icebreaking_1_desc:0 "§Y$MOD_POP_HAPPINESS$§!: §G+10%§!\n§Y$MOD_POP_AMENITIES_USAGE_BASE$§!: §G-20%§!\nОткрывает здание: §YКомитет деторождения Глубинных§!"
 tr_sh_icebreaking_1_delayed:0 "Наше общество должно приспособиться к новой эпохе — будет построена масса общественных объектов.\nНаселение после долгих лет неестественного воспроизводства адаптируется с трудом, поэтому §YКомитет деторождения Глубинных§! поднимет знамя: самыми разными методами преподаёт правильные способы размножения — от личных уроков и видео до чипов с мгновенным выпускным."
 tr_sh_icebreaking_2:0 "Полу-принудительное размножение"
 tr_sh_icebreaking_2_desc:0 "§Y$MOD_BONUS_POP_GROWTH$§!§!: §G+0.5§!"
 tr_sh_icebreaking_2_delayed:0 "Естественное размножение мы разрешили, но желающих всё ещё не хватает — без полу-принудительной программы никак."
 tr_sh_icebreaking_3:0 "Научный прорыв"
 tr_sh_icebreaking_3_desc:0 "§Y$MOD_COUNTRY_ALL_TECH_RESEARCH_SPEED$§!: §G+10%§!"
 tr_sh_icebreaking_3_delayed:0 "С открытием чувств всё больше особей демонстрируют научный талант — их ума хватит на рывок."
 tr_sh_icebreaking_4:0 "Самостоятельные исследования"
 tr_sh_icebreaking_4_desc:0 "§YВыработка старших научных сотрудников Глубинных§!: §G+3§!"
 tr_sh_icebreaking_4_delayed:0 "Старшие научные сотрудники получают больше самостоятельности в выборе направлений"
 tr_sh_icebreaking_5:0 "Оптимизация производства ядер"
 tr_sh_icebreaking_5_desc:0 "§Y$mod_planet_jobs_sr_se_produces_mult$§!: §G+15%§!\n§YВыработка зданий энергетических ядер увеличена§!"
 tr_sh_icebreaking_5_delayed:0 "Чем дальше развивается общество, тем больше ядер ему нужно — надо оптимизировать производство."
