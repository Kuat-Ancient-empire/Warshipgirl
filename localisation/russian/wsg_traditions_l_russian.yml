 tr_wg_projects_5:0 "Трусиковая программа рециклинга"
 tr_wg_projects_5_desc:0 "§Y$mod_planet_buildings_sr_pantsu_upkeep_mult$§!: §G-10%§!\n§Y$mod_planet_jobs_sr_pantsu_upkeep_mult$§!: §G-10%§!"
 tr_wg_projects_5_delayed:0 "Бесконтрольное потребление трусиков рухнет всей цепочкой — вводим программу возврата и срезаем расход до минимума."
 mod_planet_buildings_sr_pantsu_upkeep_mult:0 "Содержание зданий в £sr_pantsu£ §Y$sr_pantsu$§!"
 leader_trait_admiral_projectS_missouri:0 "Воин решающей победы"
 leader_trait_admiral_projectS_missouri_desc:0 "§YОбразцовая корабельная дева§!\n\n\n\n£wg_trait_pic_4£\n\n\n\nМиссури — итоговый продукт проекта Project-S: она умеет за счёт энергетических ядер Глубинных заставить флот выдать 200% мощи — правда, перегрузка вгоняет корабли в жёсткий энергодефицит."
 leader_trait_admiral_projectS_missouri_effect:0 "§YВ бою содержание крупных кораблей флота в £sr_se£ $sr_se$:§R+2.5§!, малых £sr_se£ $sr_se$:§R+1§!§!"
 wsg.2107.name:0 "Супер-корабельная дева"
 wsg.2107.desc:0 "С самого рождения проекта Project-S мы мечтали строить корабельных дев на основе энергетического ядра Глубинных вместо классического ригинг-ядра. Идею забраковали как слишком дорогую, но вершина плана — корабельная дева Миссури — уже готова к службе.\n\nПо данным испытаний, Миссури полностью управляет энерговыдачей энергетических ядер в известном радиусе. Как командующая флотом — сила более чем серьёзная."
 wsg.2107.a:0 "Добро пожаловать, Миссури"
 wsg.2107.tooltip:0 "Получить командующего флотом §YМиссури§!"
 wsg_missouri_desc:0 "Супер-корабельная дева, высшее достижение Project-S: способности Миссури вне сомнений превосходят всех известных корабельных дев прошлых поколений. Но не сваливайте на секретаря всё подряд ("
 wsg.2108.desc:0 "Здравствуй~ Я Миссури, миссурийская Миссури. Докажи, что ты настоящий командующий — и получишь право звать меня Миссу-тян~ Не вини меня в подозрительности: подозрительность — природа миссурийцев."
