l_russian:

 Name_Bubbles:0 "Пузырик"
 just_do_it:0 "Все зовите её Пузыриком! Иначе я не придумаю продолжения истории!"
 wg_bubbles.1.name:0 "Генная инженерия амёбы"
 wg_bubbles.1.desc:0 "Раскрыв тайны генома, мы вполне можем переделать Пузырика сильнее любой амёбы, подарив заодно разум, равный нашему. Более того — по расчётам, она сможет сжиматься до нашего размера под конкретные задачи."
 wg_bubbles.1.a:0 "Звучит заманчиво"
 wg_bubbles.1.b:0 "Эти безумцы зашли слишком далеко"
 wg_bubbles.1.c:0 "Наши передовые технологии — только для наших граждан"
 wg_bubbles.2.name:0 "Генератор морфосознания"
 wg_bubbles.2.desc:0 "Когда Пузырик повзрослеет, мы сможем усилить её нашими технологиями. Более того — проецировать виртуальный образ, управляемый её подсознанием, и говорить с ней напрямую."
 wg_bubbles.2.a:0 "Соблазнительный план"
 wg_bubbles.2.b:0 "У этих безумцев точно крыша поехала"
 wg_bubbles.3.name:0 "Модификация удалась"
 wg_bubbles.3.desc:0 "Мы сделали это! Теперь она не только сильна — на уровне наших линкоров! — но и принимает человеческий облик с разумом, равным нашему: справится с любой бумажной работой!\nМы также регулярно бэкапим память и тело Пузырика: после тяжёлого ранения генная инженерия вернёт её в целости.\n\n§YКнопка связи с Пузыриком — в указе, в§E Комплексном меню WG§!, правая колонка"
 wg_bubbles.3.a:0 "Я просто в экстазе!!!"
 wg_bubbles.3.b:0 "Странная система ценностей +1"
 wg_bubbles.5.desc:0 "Система морфосознания для Пузырика оказалась проще чаянного: при исполинском теле она на удивление застенчива. Команда ещё и наняла лучшего 3D-моделлера страны, чтобы создать ей прекрасную внешность…"
 wg_bubbles.5.a:0 "Скорее бы дебют, не терпится"
 wg_bubbles.5.b:0 "А до такой степени обязательно?.."
 MODIFY_BUBBLES:0 "Генная инженерия амёбы"
 MODIFY_BUBBLES_DESC:0 "Полная переделка Пузырика: сильнее любой амёбы, с разумом, равным нашему; по расчётам — со способностью сжиматься до нашего размера под конкретные задачи."
 MODIFY_BUBBLES2:0 "$MODIFY_BUBBLES$"
 MODIFY_BUBBLES2_DESC:0 "$MODIFY_BUBBLES_DESC$"
 MODIFY_BUBBLES_SECOND:0 "Генератор морфосознания амёбы"
 MODIFY_BUBBLES_SECOND_DESC:0 "После взросления Пузырика можно усилить её тело; после переделки — проецировать виртуальный образ, управляемый её подсознанием, и говорить с ней напрямую."
 MODIFY_BUBBLES_SECOND2:0 "$MODIFY_BUBBLES_SECOND$"
 MODIFY_BUBBLES_SECOND2_DESC:0 "$MODIFY_BUBBLES_SECOND_DESC$"
 Communicate_with_Bubbles:0 "Связь с Пузыриком"
 wg_bubbles.6.desc:0 "§E………… Мм? §!"
 wg_bubbles.6.a:0 "Пузырик, хочешь посмотреть кабинет губернатора?"
 wg_bubbles.6.a.tooltip:0 "§YПузырик станет губернатором§!"
 wg_bubbles.6.a.response:0 "§EМм… да! §!"
 wg_bubbles.6.allow.a:0 "Пузырик не должна быть в бою"
 wg_bubbles.6.allow.b:0 "Пузырик не должна быть сильно повреждена"
 wg_bubbles.6.b:0 "Пузырик, хочешь прогуляться?"
 wg_bubbles.6.b.tooltip:0 "§YПузырик снова станет амёбой§!"
 marry_bubbles:0 "Пузырик, выйдешь за меня? Ты мне нравишься!"
 exit_bubbles:0 "Ничего."
 wg_bubbles.7.desc:0 "Мм? Кружочек?"
 wg_bubbles.7.a:0 "Это наш обычай… наденешь — мы всегда будем вместе"
 wg_bubbles.7.response:0 "Вместе…….. вместе! Мм!( машет рукой с кольцом)"
 leader_trait_official_bubbles:0 "Пузырик"
 leader_trait_official_bubbles_desc:0 "Пузырик немногословна, но как талисман её любит полстраны; о ней написана уйма произведений, и все расходятся."
 leader_trait_admiral_bubbles:0 "Пузырик"
 leader_trait_admiral_bubbles_desc:0 "После биомодификации тело Пузырика заметно окрепло, а повреждённые части быстро восстанавливаются."
 wg_bubbles.8.name:0 "Всему свой срок"
 wg_bubbles.8.desc:0 "Учёная §Y[FROM.GetName]§!, первой нашедшая Пузырика, погибла в аварии. Весть дошла до Пузырика — и всегда молчаливая она, кинув пост, помчалась прочь."
 wg_bubbles.8.a:0 "Готовьте похороны"
 wg_bubbles.9.name:0 "У каждого своя судьба"
 wg_bubbles.9.desc:0 "Пузырик была на похоронах учёной; но на девятый день она без спроса отключила связь и ушла в неведомое."
 wg_bubbles.9.a:0 "Следовать за ней"
 wg_bubbles.9.b:0 "Приглушить шум вокруг истории"
 wg_bubbles.9.c:0 "Её свобода — как хочет"
 wg_bubbles.9.d:0 "Остановить её; при нужде — силой"
 bubbles_become_enemy:0 "§RВНИМАНИЕ! Пузырик станет враждебной! §!"
 wg_bubbles.10.name:0 ""
 wg_bubbles.10.desc:0 "После наших уговоров Пузырик перестала сопротивляться — но с тех пор всё в подавленности, ни с кем не говорит и лишь исполняет приказы."
 wg_bubbles.10.a:0 "Пусть остынет сама"
 wg_bubbles.12.name:0 "Смерть Пузырика"
 wg_bubbles.12.desc:0 "Уговоры не помогли — Пузырик атаковала наши корабли! Итог боя очевиден: целому флоту она не соперник. Её тело до сих пор плавает в системе [bubbles_killed_system.GetName]; экипажи вздыхали, глядя на него."
 wg_bubbles.12.a:0 "Хватит — пусть всё закончится"
 bubbles_missing:0 "Пузырик пропала"
 kill_bubbles:0 "Смерть Пузырика"
 find_bubbles_chain_title:0 "Поиски пропавшей Пузырика"
 find_bubbles_chain_desc:0 "После смерти учёной [save_bubbles_scientist.GetName], спасшей Пузырика, та стала самопроизвольной, отключила связь и ушла из дома. Мы обязаны вернуть Пузырика и собрать картину целиком."
 wg_bubbles.14.name:0 "Где Пузырик"
 wg_bubbles.14.desc:0 "Через месяцы после её ухода приборы поймали её в одной системе — без движения. Служба по делам Пузырика считает: она что-то оплакивает; советуют послать переговорщиков."
 wg_bubbles.14.a:0 "Её дела — наши дела"
 find_bubbles_poi.name:0 "Где Пузырик"
 find_bubbles_poi.desc:0 "Детекторы показывают: в системе [bubbles_mourning_system.GetName] Пузырик остановилась и не двигается. Служба по делам Пузырика советует послать переговорщиков."
 wg_bubbles.15.desc:0 "§E…… чего…… вам…… §!"
 wg_bubbles.15.a:0 "Успокойся: мы лишь хотим помочь."
 wg_bubbles.15.a.response:0 "§EПузырику…… побыть одной…… §!"
 wg_bubbles.15.b:0 "Нам тоже очень жаль её……"
 wg_bubbles.16.desc:0 "§EВы…… вы…… она не смеет умирать! Защищать её! Обещание! §!"
 wg_bubbles.16.a:0 "Пузырик…… можно вопрос. Сколько тебе лет?"
 wg_bubbles.17.desc:0 "§EПузырику всего…… она…… в тот год…… подобрала Пузырика…… возраст…… жизнь — моя…… мало…… §!\nПузырик, ты ведь и сама понимаешь… мы не можем быть рядом вечно\n§Eно…… Пузы…… скучает…… по нему…… §!\nКогда он тебя подобрал, мы были категорически против — но он продавил это вопреки всем… Уверены, и с небес он хочет тебе только хорошего. Если ты вот так — нам не смотреть ему в глаза…\n\n\nСлово угасло; из связи донёсся лишь душераздирающий плач Пузырика."
 wg_bubbles.17.a:0 "Пусть поплачет."
 wg_bubbles.18.name:0 "Примирение"
 wg_bubbles.18.desc:0 "Утешенные флотом, Пузырик пришла в себя и согласилась вновь открыть канал связи. Кажется, она сумела это отпустить"
 wg_bubbles.18.a:0 "Отлично"
 wg_bubbles.18.b:0 "Она повзрослела"
 wg_bubbles.20.desc:0 "§EПузырик…… старалась…… мм…… §!"
 wg_bubbles.20.a:0 "Всё хорошо, Пузырик: ты молодец."
 wg_bubbles.20.a.tooltip:0 "§YНашим учёным нужно около трёх с половиной лет, чтобы вырастить и восстановить тело Пузырика. §!"
 wg_bubbles.21.desc:0 "§EДоб…… доброе утро. Мм? §!"
 wg_bubbles.21.a:0 "С возвращением"
 wg_bubbles.21.a.tooltip:0 "§YПузырик вернулась: её можно снова найти в указах и говорить с ней§!"
 BUBBLES:0 "Амёба"
 edict_change_bubbles_form:0 "Сменить облик Пузырика"
 edict_change_bubbles_form_desc:0 "Через это меню можно говорить с Пузыриком и менять её облик"
 bubbles_recovery_cd:0 "Пузырик тяжело повреждена"
 bubbles_recovery_cd:0 "Пузырик тяжело повреждена"
 leader_trait_official_bubbles_depressed:0 "Подавленность"
 leader_trait_official_bubbles_depressed_desc:0 "После разлуки и утраты Пузырику всё безразлично; бездействие расплодило преступность на подведомственной планете."
 leader_trait_admiral_bubbles_depressed:0 "Подавленность"
 leader_trait_admiral_bubbles_depressed_desc:0 "После разлуки и утраты Пузырику всё безразлично; уныние это привело и к поражениям в бою."
 leader_trait_scientist_bubbles_saver:0 "Страсть к открытиям"
 leader_trait_scientist_bubbles_saver_desc:0 "С находки Пузырика эта учёная одержима космосом и подмечает любую мелочь.\n\n§RНЕ увольняйте этого лидера — случится нечто нехорошее! §!"
 leader_trait_official_wg_bubbles_affection_lv5_tooltip:0 "$MOD_POP_AMENITIES_USAGE_MULT$: §G-30%§!\n$MOD_POP_GROWTH_FROM_IMMIGRATION$: §G+20%§!\n$MOD_POP_HAPPINESS$: §G10%§!\n$MOD_PLANET_DECISION_ENACT_SPEED_MULT$: §G-20%§!\nКаждые 50 £pop£ —§G+1§! £mod_job_entertainer_add££mod_job_artisan_add£\nВыработка £job£ населения во всех развлекательных профессиях(артисты, актёры, вспомогательный персонал Глубинных, лодыри, маджонгистки, банщицы): §G30%§!"
 add_modifier_to_planet_tooltip:0 "§YВсе колонии системы, где Пузырик, получают модификаторы§!:\n"
 modifier_wg_bubbles_affection_lv1_tooltip:0 "$add_modifier_to_planet_tooltip$$PLANET_CRIME_TITLE$ §G-100§!\n$MOD_PLANET_STABILITY_ADD$: §G+5§!\n$mod_pop_ethic_xenophile_attraction_mult$: §G20%§!\nКаждые 10 £pop£ —§G+1§! £mod_job_entertainer_add£ $job_entertainer$ и £mod_job_artisan_add£ $job_artisan$"
 modifier_wg_bubbles_affection_lv2_tooltip:0 "$add_modifier_to_planet_tooltip$$PLANET_CRIME_TITLE$ §G-100§!\n$MOD_PLANET_STABILITY_ADD$: §G+5§!\n$mod_pop_ethic_xenophile_attraction_mult$: §G20%§!\n$MOD_POP_AMENITIES_USAGE_MULT$: §G-20%§!\nКаждые 10 £pop£ —§G+1§! £mod_job_entertainer_add£ $job_entertainer$ и £mod_job_artisan_add£ $job_artisan$"
 modifier_wg_bubbles_affection_lv3_tooltip:0 "$add_modifier_to_planet_tooltip$$PLANET_CRIME_TITLE$ §G-100§!\n$MOD_PLANET_STABILITY_ADD$: §G+15§!\n$mod_pop_ethic_xenophile_attraction_mult$: §G20%§!\n$MOD_POP_AMENITIES_USAGE_MULT$: §G-20%§!\n$MOD_POP_HAPPINESS$: §G20%§!\nКаждые 10 £pop£ —§G+1§! £mod_job_entertainer_add£ $job_entertainer$ и £mod_job_artisan_add£ $job_artisan$"
 modifier_wg_bubbles_affection_lv4_tooltip:0 "$add_modifier_to_planet_tooltip$$PLANET_CRIME_TITLE$ §G-100§!\n$MOD_PLANET_STABILITY_ADD$: §G+15§!\n$mod_pop_ethic_xenophile_attraction_mult$: §G20%§!\n$MOD_POP_AMENITIES_USAGE_MULT$: §G-20%§!\n$MOD_POP_HAPPINESS$: §G20%§!\n$MOD_POP_GROWTH_FROM_IMMIGRATION$: §G100%§!\nКаждые 10 £pop£ —§G+1§! £mod_job_entertainer_add£ $job_entertainer$ и £mod_job_artisan_add£ $job_artisan$"
 modifier_wg_bubbles_affection_lv5_tooltip:0 "$add_modifier_to_planet_tooltip$$planet_modifier_wg_bubbles_affection_lv5_tooltip$"
 planet_modifier_wg_bubbles_affection_lv5_tooltip:0 "$PLANET_CRIME_TITLE$: §G-200§!\n$MOD_PLANET_STABILITY_ADD$: §G+30%§!\n$MOD_POP_AMENITIES_USAGE_MULT$: §G-40%§!\n$mod_pop_ethic_xenophile_attraction_mult$: §G20%§!\n$MOD_POP_HAPPINESS$: §G30%§!\n$MOD_POP_GROWTH_FROM_IMMIGRATION$: §G100%§!\nКаждые 10 £pop£ —§G+1§! £mod_job_entertainer_add£ $job_entertainer$ и £mod_job_artisan_add£ $job_artisan$\nВыработка £job£ населения во всех развлекательных профессиях(артисты, актёры, вспомогательный персонал Глубинных, лодыри, маджонгистки, банщицы): §G50%§!"
 planet_modifier_wg_bubbles_affection_lv1:0 "Талисман Пузырик (ур.1)"
 planet_modifier_wg_bubbles_affection_lv1_desc:0 "Пузырик обитает в системе этой планеты: культурная жизнь расцвела, а преступность придавлена. (Бонус растёт с привязанностью Пузырика)"
 planet_modifier_wg_bubbles_affection_lv2:0 "Талисман Пузырик (ур.2)"
 planet_modifier_wg_bubbles_affection_lv3:0 "Талисман Пузырик (ур.3)"
 planet_modifier_wg_bubbles_affection_lv4:0 "Талисман Пузырик (ур.4)"
 planet_modifier_wg_bubbles_affection_lv5:0 "Талисман Пузырик (ур.5)"
 planet_modifier_wg_bubbles_affection_lv2_desc:0 "$planet_modifier_wg_bubbles_affection_lv1_desc$"
 planet_modifier_wg_bubbles_affection_lv3_desc:0 "$planet_modifier_wg_bubbles_affection_lv1_desc$"
 planet_modifier_wg_bubbles_affection_lv4_desc:0 "$planet_modifier_wg_bubbles_affection_lv1_desc$"
 planet_modifier_wg_bubbles_affection_lv5_desc:0 "$planet_modifier_wg_bubbles_affection_lv1_desc$"
 bubbles_not_available:0 "Пузырик ещё не восстановилась — подождите"
 wsg_bubbles_desc:0 "Пока ты зовёшь её Пузыриком — мы братья, хоть и ни родителем, ни матерью."
