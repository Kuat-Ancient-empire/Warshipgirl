l_russian:

 ap_wg_crisis:0 "Испепеляющий звёздный путь"
 ap_wg_crisis_desc:0 "Это наш собственный великий путь — бессильным и малым не шествовать с нами. Мы собственными руками отсеем всю галактику."
 ap_wg_crisis_effect_tooltip:0 "Откроется новое§H меню испепеления§!\nЗапустится цепочка: §HПуть испепеления§!\n§HПо завершении раскроется предназначенная нам конечная цель! §!"
 only_one_wg_crisis_country:0 "Только одна держава может принять вознесение§H «Испепеляющий звёздный путь»§!"
 requires_wg_complete_ascension_path:0 "$requires_complete_wsg_ascension_path$\nПравлению звёздных кораблей (звёздных кораблей-дев) требуется вознесение§H «Галактическая империя»§!"
 requires_complete_wsg_ascension_path:0 "$TRIGGER_FAIL$ Требуется завершить любую из линий второго вознесения:\nправлению кораблей-дев — вознесение §H$ap_mist$§! или §H$ap_project_s$§!\nправлению Глубинных — вознесение §H$ap_shenhai_silent$§! или §H$ap_shenhai_icebreaking$§!"
 requires_ascension_perks_4:0 "$TRIGGER_FAIL$ Сначала выберите четыре других вознесения."
 must_not_becoming_emperor:0 "$TRIGGER_FAIL$ Нельзя иметь ни одного вознесения, дающего стать Галактическим императором:\nправлению кораблей-дев или Глубинных нельзя иметь §H$ap_wsg_galactic_empire$§!\nправлению звёздных кораблей (звёздных кораблей-дев) нельзя иметь§H «Империю звёздного моря»§!\n"
 ap_wg_crisis.998.name:0 "Предупреждение о стабильности мультиплеера"
 ap_wg_crisis.998.desc:0 "Система обнаружила: у вас стоят§H мод Warship Girls§!, §Hмод звёздных кораблей-дев§!, вы в сетевой игре, и кто-то выбрал вознесение испепеления. Внимательно прочтите:\nПоскольку ослы не довели код императора до ума, приступайте к цепочке испепеления лишь§R после полного завершения§! цепочки Галактического императора или§R убедившись, что императором не стал ни ИИ, ни игрок§! Конфликт с императором вспыхнет со старта стройки мегасооружения§R «Врата измерений»§!\nЕсли цепочка императора уже началась —§Rне стройте Врата измерений§!: повторные объявления войны могут крашнуть игру или убить сейв!\nЗа все неудобства от этого конфликта повините ослов — с благодарностью за понимание ("
 be_goooooood_girl:0 "$TRIGGER_FAIL$ Твоя Падшая мама велела быть послушной девочкой~\n	Пока существует§H «Грёза Пепла»§!, держава с происхождением «мамина дочка» не может принять это вознесение"
 has_our_colony:0 "\n£TRIGGER_FAIL£В системе не должно быть наших колоний"
 ap_wsg_galactic_empire:0 "Звёздная империя"
 ap_wsg_galactic_empire_desc:0 "В союзе пошли трещины — мы укрепим волю: Галактическая империя обязана стоять в галактике. Мы — порядок, безопасность и стабильность, и не позволим сепаратистам, мятежному отребью и кому бы то ни было пошатнуть эту стабильную и безопасную галактику!"
 resolution_custodian_form_empire_wg_tooltip:0 "§YГалактическое сообщество§! превратится в§Y Галактический империум§!\n§RВсе члены выходят из всех федераций. §!\n\n§R§Y[Root.GetName]§! станет§Y ядром империи§! с текущими взглядами и правлением. §!"
 emperor.2.wg.tooltip:0 "$emperor.2.a.tooltip.start$—мы теперь обладаем гражданской моделью §Y$civic_galactic_sovereign$§!\n$emperor.2.a.tooltip.end$"
 utopia.3400.b.wg.tooltip:0 "§YПравления кораблей-дев, Глубинных и Объединения не меняют строй власти и не сдвигают взгляды. §!\n"
 edict_ap_wg_crisis_window:0 "§HМеню испепеления§!"
 edict_ap_wg_crisis_window_desc:0 "Открыть§H меню испепеления§!"
 wg_crisis_window_tutorial_button_tooltip:0 "§YПоказать обучение§!"
 ap_wg_crisis_window_title:0 "Заголовок из семи слов"
 ap_wg_crisis.1.name:0 "[this.GetWGCrisisPointLoc]"
 ap_wg_crisis.1.desc:0 "Подсказка: следующий§H уровень испепеления§! открывается лишь по завершении ВСЕХ§H задач текущего уровня§! Кнопкой сверху переключайте§H список задач уровня§!.\n\nЗа испепеление полагаются очки £sr_wg_crisis_point£\n\nИстребить £pop£ населения\n  —  £sr_wg_crisis_point£§H2§!\nУничтожить планету:\n  —  £sr_wg_crisis_point£§H50§!\nУничтожить звёздную систему:\n  —  £sr_wg_crisis_point£§H150§!\nУничтожить колонию:\n  —  £sr_wg_crisis_point£§H35§!\nУничтожить державу:\n  —  £sr_wg_crisis_point£§H150§!\nСделать державу вассалом:\n  —  £sr_wg_crisis_point£§H100§!\nИметь вассалов (ежегодно):\n  —  £sr_wg_crisis_point£§H10§!\nИстребить флот(*прим.1):\n  —  £sr_wg_crisis_point£§H15§!\nУничтожить большой корабль(*прим.2,4):\n  —  £sr_wg_crisis_point£§H10§!\nУбить левиафана/корабль его класса(*прим.3,4):\n  —  £sr_wg_crisis_point£§H35§!\nУничтожить военную базу/станцию:\n  —  £sr_wg_crisis_point£§H5§!\nУничтожить звёздную базу:\n      уровень§H аванпост§!:\n       —  £sr_wg_crisis_point£§H5§!\n      уровень§H звёздный порт§!:\n       —  £sr_wg_crisis_point£§H8§!\n      прочие уровни:\n       —  £sr_wg_crisis_point£§H15§!\nНарушить галактический закон (ежегодно)\n  —  £sr_wg_crisis_point£§H50§!\n\n\nПримечания:\n(1) Флот: содержит 5+ больших кораблей, либо фауна (кроме пиратов), левиафаны, корабли кризисов и т.п.\n\n(2) Большой корабль: класс линкора и выше, но не левиафан: линкоры, линейные крейсера кризисов и павших, авианосцы, крупные корабли кризисов и т.п.\n\n(3) Левиафан: сам левиафан или равные ему: арсенальные корабли, дредноуты, Владыки, колоссы, Объединённая слава, флагманы и т.п.\n\n(4) Очки за большой корабль/левиафана складываются с очками за флот: левиафан в сумме даёт 50 очков испепеления"
 ap_wg_crisis.1.tooltip:0 "Показать§H задачи открытия уровня испепеления§!"
 ap_wg_crisis.2.tooltip:0 "Показать§H задачи испепеления§!"
 ap_wg_crisis.2.desc:0 "Подсказка: выполняйте§H задачи испепеления§! ради £sr_wg_crisis_point£ очков испепеления. Кнопкой сверху переключайте§H список задач§!.\n\nСледующий уровень открывается по задачам.\nОткрытие уровня 1:\n[ap_wg_crisis_country.WGCrisisLv1_Objective_Passed] Завершить спецпроект§H «Постигнуть нашу судьбу»§!\n\nОткрытие уровня 2:\n[ap_wg_crisis_country.IsWGCrisisPointLv2Passed] Набрать £sr_wg_crisis_point£ очков§H 800§!\n[ap_wg_crisis_country.WGCrisisLv2_Second_Objective_Passed] Иметь технологию §H$tech_wg_fm_hyper_dimensional_theory$§!\n\nОткрытие уровня 3:\n[ap_wg_crisis_country.IsWGCrisisPointLv3Passed] Набрать £sr_wg_crisis_point£ очков§H 1500§!\n[ap_wg_crisis_country.WGCrisisLv3_Second_Objective_Passed] Завершить спецпроект§H «План трамплина»§!\n\nОткрытие уровня 4:\n[ap_wg_crisis_country.IsWGCrisisPointLv4Passed] Набрать £sr_wg_crisis_point£ очков§H 3500§!\n[ap_wg_crisis_country.WGCrisisLv4_Second_Objective_Passed] Иметь технологию§H «Извлечение энергии Занебесья»§!\n\nОткрытие уровня 5:\n[ap_wg_crisis_country.IsWGCrisisPointLv5Passed] Набрать £sr_wg_crisis_point£ очков§H 7000§!\n[ap_wg_crisis_country.WGCrisisLv5_Second_Objective_Passed] Построить мегасооружение§H «Строительная площадка Врат измерений»§!"
 ap_wg_crisis.3.name:0 "Здесь показаны текущие очки испепеления"
 ap_wg_crisis.3.desc:0 "Здесь показан§H список задач открытия уровня§! или§H список задач испепеления§!\n\nКнопкой сверху переключайте списки.\nНаведите курсор на значок очков — всплывёт справка о £sr_wg_crisis_point£ очках испепеления.\n\n§YУказ — меню испепеления§! открывает это меню\n§HКнопкой справа сверху закройте обучение. §!"
 wg_crisis_perks_explaination:0 "Слева —§Hталанты испепеления§! они выдаются с открытием§H уровней испепеления§!\n\nТаланты дают§H кучу\nбаффов§! и открывают§H новые классы кораблей§!\n\nКликните разблокированный талант для активации ради усиленного баффа; учтите: §Rна каждом уровне активен лишь один талант§!"
 ap_wg_crisis.4.name:0 "Подсказка интерфейса талантов"
 ap_wg_crisis.4.desc:0 "Открыт новый интерфейс талантов испепеления — просмотреть обучение?"
 ap_wg_crisis.4.a.tooltip:0 "Открыть обучение интерфейса талантов"
 ap_wg_crisis.4.b.tooltip:0 "Открыть интерфейс талантов"
 perk_levelup_tooltip:0 "Подсказка: в новых талантах можно активировать один для усиленного баффа."
 ap_wg_crisis.5.name:0 "Уровень испепеления повышен"
 ap_wg_crisis.5.desc:0 "Поздравляем: уровень испепеления достиг§H первого§! Открыть интерфейс талантов?\n$perk_levelup_tooltip$"
 ap_wg_crisis.6.desc:0 "Поздравляем: уровень испепеления достиг§H второго§! Открыть интерфейс талантов?\n$perk_levelup_tooltip$"
 ap_wg_crisis.7.desc:0 "Поздравляем: уровень испепеления достиг§H третьего§! Открыть интерфейс талантов?\n$perk_levelup_tooltip$"
 ap_wg_crisis.8.desc:0 "Поздравляем: уровень испепеления достиг§H четвёртого§! Открыть интерфейс талантов?\n$perk_levelup_tooltip$"
 ap_wg_crisis.9.desc:0 "Поздравляем: уровень испепеления достиг§H пятого§! Открыть интерфейс талантов?\n$perk_levelup_tooltip$"
 wg_crisis_points_desc:0 "За задачи испепеления начисляются $wg_crisis_points$ при достижении порога следующего уровня $wg_crisis_points$ и выполнении задач уровня открывается следующий.\nС каждым уровнем выдаются таланты: §Hкуча баффов§! и§H новые классы кораблей§!\nНа каждом уровне можно активировать один талант с усиленным баффом; активен лишь один талант уровня."
 wg_crisis_perk_comfirmation_title:0 "Активировать талант испепеления"
 wg_crisis_perk_comfirmation_desc:0 "Активировать этот талант?\n§RВнимание§!:\nНа каждом уровне активен лишь один талант! Активировав его, вы заблокируете прочие таланты этого уровня!"
