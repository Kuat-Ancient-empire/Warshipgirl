 tech_fm_sunkiller:0 "Испепеляющий"
 tech_fm_sunkiller_desc:0 "Солнца догорят по нашей воле, испепеляя всё"
 PLANET_KILLER_SK_SE:0 "Гаситель солнц (божественное орудие испепеления)"
 PLANET_KILLER_SK_SE_DESC:0 "Установленный на божественном орудии испепеления, он эффективнее колоссального собрата."
 PLANET_KILLER_SK_SE_ACTION:0 "$PLANET_KILLER_SK_ACTION$"
 MESSAGE_DESC_FOR_PLANET_KILLER_SK_SE:0 "$MESSAGE_DESC_FOR_PLANET_KILLER_SK$"
 FLEETORDER_DESTROY_PLANET_WITH_PLANET_KILLER_SK_SE:0 "$FLEETORDER_DESTROY_PLANET_WITH_PLANET_KILLER_SK$"
 PLANET_KILLER_SK_SE_EX:0 "Испепеляющий (божественное орудие испепеления)"
 PLANET_KILLER_SK_SE_EX_DESC:0 "На базе гасителя солнц мы переработали его под платформу божественного орудия, резко сократив время зарядки. Из-за исполинского энерговыхода ставить его можно лишь на божественное орудие испепеления"
 PLANET_KILLER_SK_SE_EX_ACTION:0 "$PLANET_KILLER_SK_ACTION$"
 MESSAGE_DESC_FOR_PLANET_KILLER_SK_SE_EX:0 "$MESSAGE_DESC_FOR_PLANET_KILLER_SK$"
 FLEETORDER_DESTROY_PLANET_WITH_PLANET_KILLER_SK_SE_EX:0 "$FLEETORDER_DESTROY_PLANET_WITH_PLANET_KILLER_SK$"
 tech_wg_fm_psionic_energy_hypersiphon:0 "Извлечение энергии Занебесья"
 tech_wg_fm_psionic_energy_hypersiphon_desc:0 "Выкачивать энергию Занебесья — работа предельно опасная: как ни готовься, исполинскую буйную мощь не укротить, не говоря о психоформах в её толще. Но её можно направить, куда нам нужно, затем понемногу разбавлять и ловить по частям — ради гладкого хода нашей выкачки."
 tech_unlock_megastructure_wg_fm_gateway_01:0 "§HОткрывает мегасооружение: §!§Y Врата измерений§! стадии 1–3"
 megastructure_wg_fm_gateway_desc:0 "§HЗавершив это мегасооружение, мы станем подлинной многомерной империей! §!"
 tech_unlock_megastructure_wg_fm_gateway_03:0 "§HОткрывает мегасооружение: §! Врата измерений§! стадии 4–5"
 tech_wg_fm_dimensional_anchor:0 "Работы «якорь измерений»"
 tech_wg_fm_dimensional_anchor_desc:0 "Конечная цель выкачки — пробить Врата измерений в иные вселенные и плановые миры: нужно высверлить в Занебесье большую брешь и точно «прокопать» тоннель к другой вселенной или плану. Занебесье — океан энергии, потому тоннель придётся фиксировать якорем, а поток энергии в реальность — фильтровать, отсекая и агрессивных психоформ."
 tech_wg_fm_hyper_dimensional_theory_repeatable:0 "Исследование высших измерений"
 tech_wg_fm_hyper_dimensional_theory_repeatable_desc:0 "Углубление теории высших измерений ускорит наш план."
 tech_wg_fm_psionic_theory_repeatable:0 "Психоизыскания"
 tech_wg_fm_psionic_theory_repeatable_desc:0 "Углубление теории псионики ускорит наш план."
 tech_wsg_fm_bc_2x:0 "Амфисбена"
 tech_wsg_fm_bc_2x_desc:0 "Открывает§H нос «Амфисбена»§! для§H боевого крейсера испепеления§!"
 FM_BC_BOW_2X:0 "Амфисбена"
 tech_wg_fm_hyper_dimensional_theory:0 "Основы высших измерений"
 tech_wg_fm_hyper_dimensional_theory_desc:0 "Всегда теория высших измерений жила лишь в фантастике, до физики было не дотянуться. Теперь мы отогнули уголок этой двери."
 opinion_has_wg_fm_gateway_03:0 "Смертоносное мегасооружение"
 opinion_tried_to_destroy_galaxy:0 "Пыталась уничтожить галактику"
 war_goal_wg_fm_war:0 "Тотальная война"
 war_goal_wg_fm_war_desc:0 "Эта держава навлечёт на вселенную неискупимую беду — она обязана быть уничтожена."
 casus_belli_wg_fm_war:0 "Устранить угрозу"
 war_goal_wg_fm_war2:0 "$war_goal_wg_fm_war$"
 war_goal_wg_fm_war2_desc:0 "Всякий, кто встанет на пути великого плана, будет сметён"
 casus_belli_wg_fm_war2:0 "Уничтожить всё"
 casus_belli_wg_fm_war3:0 "$war_goal_wg_fm_war$"
 war_goal_wg_fm_war3:0 "$war_goal_wg_fm_war$"
 war_goal_wg_fm_war3_desc:0 "Они все падут!"
 casus_belli_wg_fm_war2:0 "Уничтожить всё"
 wg_shroud_crisis_colony_debuff:0 "Психоволны"
 wg_shroud_crisis_colony_debuff_desc:0 "Колония под мощными психоволнами: разумы жителей массово атакованы — повсюду галлюцинации и недуги, нормальная жизнь невозможна."
 wg_shroud_crisis_country_debuff:0 "Шёпот Занебесья"
 wg_shroud_crisis_country_debuff_desc:0 "Странный шёпот без конца кружит в голове каждого жителя……"
 ap_wg_crisis_chain_title:0 "Путь испепеления"
 ap_wg_crisis_chain_desc:0 "Галактика не бесконечна: с темпами нашей экспансии однажды придётся выйти за её пределы. Либо покорить галактику, либо ютиться в углу.\nВеликий путь явлен нам, и в его конце — наша вечная цель."
 ap_wg_crisis_active:0 "Постигнуть нашу судьбу"
 ap_wg_crisis_active_DESC:0 "Высшие измерения были туманной выдумкой романистов — теперь наука их подтвердила и открыла; §PЗанебесье§! быть может, станет лазом. Но и тут мы знаем до обидного мало. Мы выбрали§R дорогу без возврата§!: нас ждёт лишь полная победа или полный крах."
 ap_wg_crisis.999.name:0 "Судьбоносный путь [root.GetName]"
 ap_wg_crisis.999.desc:0 "Галактика безгранична — так верили все живые до выхода к звёздам. Но, став великой межзвёздной империей, мы узнали: это не так.\nГалактика лишь такова, какова есть; с нашим размахом её рано или поздно покорят и изведут — и через десятки поколений мы вновь упрёмся в ту же стену, что до межзвёздных полётов: нечем путешествовать между галактиками.\nЖажда расширения в нас бесконечна — нужно вырасти в империю вселенной, и один из путей — шаг в высшие измерения.\nКогда [root.GetRulerTitle][root.GetRulerName] огласил(а) великую программу всем [Root.GetSpeciesNamePlural], народ вскипел: мы верим — это дорога к величию и вечности, наш род избран свершить это дело.\nПока что о высших мирах мы знаем мало; §PЗанебесье§! возможно, лаз — но впереди масса преград."
 ap_wg_crisis.999.a:0 "Мы обязаны преуспеть — такова наша судьба."
 ap_wg_crisis.1001.name:0 "Намеченный путь"
 ap_wg_crisis.1001.desc:0 "Завершив разведку Занебесья, учёные заключили: это и впрямь высший план, связанный с психотроникой; среда его предельно хаотична и полна неведомых угроз. Но Занебесье, похоже, ведёт к вселенным ещё выше — годится трамплином.\nПрежде же наука и военачальницы единогласно требуют§H грандиозного проекта§!: установку, что стабилизировала бы Занебесье или выкачивала его энергию. Это§R предельно опасный§! вековой проект: и выкачка, и стабилизация заметно колышут реальность, и другие державы смотреть сквозь пальцы не станут."
 ap_wg_crisis.1001.tooltip:0 "§HУровень испепеления +1§!\n$wg_crisis_points$§G+200§!"
 ap_wg_crisis.1002.name:0 "Намеченный путь"
 ap_wg_crisis.1002.desc:0 "После изысканий мы отыскали знатоков Занебесья — кораблей-дев бывшего§H Святого порта-хранителя Беллерофонта§! но и они не изведали его целиком; их бывший корабль-секретарь — §HСвятой Георгий§! — просит связи, дабы ввести в курс дел."
 ap_wg_crisis.1003.name:0 "Святой Георгий"
 ap_wg_crisis.1003.desc:0 "Благодарю за допуск к связи. Не мешкая, кратко изложу наше понимание Занебесья.\n\nЗанебесье, вероятно, — существующий вовне этой вселенной план, схожий с подпространством между вселенными. Дальнейшие изыскания держим на этой гипотезе.\nЗанебесье переполнено энергией; её скопления порой взрываются, рождая новые вселенные. Найдя законы её течения, через Занебесье можно выйти к иным вселенным и планам ещё выше — лучшего трамплина не сыскать, а заодно можно зачерпывать из него энергию для переходов. Для этого нужен проект исполинского размаха; ныне же обуздать сверхобильную и буйную энергию Занебесья§R почти невозможно§! — нужно изыскание."
 ap_wg_crisis.1003.a:0 "Каковы риски выкачки энергии Занебесья?"
 ap_wg_crisis.1003.a.response:0 "Как я говорила, энергия Занебесья чудовищна и неукротима: выкачка неизбежно колышет реальность; к тому же в энергии обитают психоформы — они могут атаковать любых существ без разбора.\nКроме того, на такую дерзость другие державы смотрят не молча — реакция, как в первобытности на ядерную бомбу. Чем передовей держава, тем вернее она поймёт, чем мы заняты. §HНеобходимая военная подготовка неизбежна§!"
 ap_wg_crisis.1003.b:0 "Как нам попасть в другие вселенные и планы?"
 ap_wg_crisis.1003.b.response:0 "Увы, единого вывода у меня нет; лично я советовала бы довести до ума теорию высших измерений. С углублением она поможет и работам по выкачке."
 ap_wg_crisis.1003.c:0 "Прекрасно; продолжайте исследования."
 ap_wg_crisis.1003.c.response:0 "Благодарю за внимание; рада быть полезной."
 ap_wg_crisis.1004.name:0 "План трамплина"
 ap_wg_crisis.1004.desc:0 "Долгая осада теории высших измерений дала смелый и осязаемый проект измеренных путешествий. §PЗанебесье§! — наш главный инструмент. Для хода меж измерениями нужна исполинская энергия, и заключённая в Занебесье — идеальное топливо. Но она же и предельно опасна: потребуется безопасный «тоннель» к высшим мирам, §PВрата измерений§! для прохода кораблей. А до тоннеля нужна прорва энергии, дабы вскрыть Занебесье — десятков, то и сотен солнц; задача почти неисполнима.\nПотому до проходки «тоннеля измерений» нужно сперва выкачивать энергию§P Занебесья§! в подспорье стройке. Иначе говоря, исследование и применение§P Занебесья§! — важнейший трамплин нашего плана."
 ap_wg_crisis.1004.a:0 "Прекрасно; продолжайте"
 ap_wg_crisis_shortcut_plan:0 "План трамплина"
 ap_wg_crisis_shortcut_plan_DESC:0 "$wg_crisis_shortcut_plan_main_desc$\n\nПодсказка: срок спецпроекта — максимальный; действительный ход смотрите в§H цепочке «План трамплина»§! Начатый проект со временем сам двигает прогресс."
 wg_crisis_shortcut_plan_main_desc:0 "О высших измерениях мы знаем вчерне; как именно сделать Занебесье ключом к следующей ступени — ещё исследовать и исследовать."
 ap_wg_crisis_shortcut_plan_chain_title:0 "$ap_wg_crisis_shortcut_plan$"
 ap_wg_crisis_shortcut_plan_chain_desc:0 "$wg_crisis_shortcut_plan_main_desc$\n\nПодсказка: циклические§H «Исследование высших измерений»§! или§H «Психоизыскания»§! прибавляют прогресс.\nВдобавок§H спецпроект «План трамплина»§! со временем движет его же."
 wg_shortcut_plan_complete_counter:0 "Ход исследований"
 ap_wg_crisis_shortcut_plan_main_event_chain:0 "$ap_wg_crisis_shortcut_plan$"
 ap_wg_crisis_shortcut_plan_main_event_chain_DESC:0 "$wg_crisis_shortcut_plan_main_desc$"
 ap_wg_crisis.1010.name:0 "План на шаг ближе"
 ap_wg_crisis.1010.desc:0 "Долгие изыскания вчерне раскрыли устройство Занебесья. Как мы и ждали: энергии в нём столько, что капля из его океана питает промышленный мир на пределе десятки тысяч лет. Увы, все предложенные способы выкачки оказались губительны, а вскрытие Занебесья и вовсе могло истребить всех высших разумных галактики. Но, овладей мы этой энергией, она станет§Y трамплином§! к высшим измерениям. Нужен способ выкачивать безопасно — хотя бы настолько, чтобы не убить себя.\nПрочие цивилизации не дуры: они будут мешать. Ради исполнения плана нужно воздать устрашение."
 ap_wg_crisis.1010.a:0 "Развернуть военную сеть и меры реагирования"
 ap_wg_crisis.1010.tooltip:0 "$wg_crisis_points$§G+300§!"
 ap_wg_crisis.1011.name:0 "Экстрактор энергии Занебесья"
 ap_wg_crisis.1011.desc:0 "Наука отладила способ выкачивать из Занебесья безопасно — по крайней мере для нас самих……\nДля этого спроектировано мегасооружение: крошечная брешь в Занебесье, выкачка энергии и перенос риска вовне. Осталось выбрать место и начать стройку."
 ap_wg_crisis.1011.a:0 "Вся вселенная скоро будет на ладони"
 ap_wg_crisis.1012.name:0 "База стройки экстрактора"
 ap_wg_crisis.1012.desc:0 "Мы завершили строительную базу экстрактора энергии Занебесья в системе [FROMFROM.GetName]; хватит ресурсов — начинаем следующий этап.\n\nГенералы предупреждают: база и стройка уже порядком пугают все державы галактики — им видится галактическая бомба.\n§HСледует наготовить всю военную мощь для охраны базы в [FROMFROM.GetName]§! дабы никто не сорвал наш план."
 ap_wg_crisis.1012.a:0 "Это будет веха в истории [ROOT.GetSpeciesNamePlural]"
 ap_wg_crisis.1012.tooltip:0 "$wg_crisis_points$§G+300§!"
 ap_wg_crisis.1013.name:0 "Каркас экстрактора"
 ap_wg_crisis.1013.desc:0 "Каркас выстроен. Далее — высверлить в Занебесье брешь и смонтировать якорь измерений, фиксирующий тоннель. Ключ к вскрытию — сжать искусственно звезду в чёрную дыру и её тягой пробить реальность насквозь, до самого Занебесья. На сжатие звезды и якорь уйдут горы £energy£ §H$energy$§! и £sr_dark_matter£§H$sr_dark_matter$§! Это — ключевой шаг всего проекта.\n\nДля верности нужно заранее выверить время создания искусственной чёрной дыры и координаты — дабы исключить «не ту дыру» и прочие беды сверления."
 ap_wg_crisis.1013.a:0 "Бережёного бог бережёт. Утверждаю отладку."
 ap_wg_crisis.1013.tooltip:0 "$wg_crisis_points$§G+500§!"
 adjust_psionic_energy_hypersiphon:0 "Отладка экстрактора Занебесья"
 adjust_psionic_energy_hypersiphon_DESC:0 "Всё готово, но пуск потребует долгой финальной отладки — на предмет ошибок и скрытых угроз."
 ap_wg_crisis.1020.name:0 "Отладка завершена"
 ap_wg_crisis.1020.desc:0 "Отладка завершена — можно спокойно запускать стройку экстрактора.\nВпрочем, учёные предупреждают: пуск повлечёт неотвратимые вторжения психоформ. §RМы обязаны быть готовы к отпору! §!"
 NOT_FINISH_PEH_SPECIAL_PROJECT:0 "$TRIGGER_FAIL$ Без завершённой отладки экстрактора следующий этап не запустить!"
 ap_wg_crisis.1014.name:0 "Экстрактор энергии Занебесья"
 ap_wg_crisis.1014.desc:0 "Мы пробили искусственной чёрной дырой тоннель в Занебесье! Экстрактор теперь даёт нам горы энергии.\nКак свидетельство: [FROMFROM.GetName] ныне изрядно колышется от Занебесья, и психоформы пойдут в наш мир именно здесь!\nНужно спешно строить якорь измерений, стабилизирующий тоннель и пресекающий вторжения. С вводом якоря экстрактор станет питать его — отдача постепенно упадёт."
 ap_wg_crisis.1014.a:0 "Подгоняйте план"
 ap_wg_crisis.1014.tooltip:0 "$wg_crisis_points$§G+700§!"
 ap_wg_crisis.1015.name:0 "Якорь измерений"
 ap_wg_crisis.1015.desc:0 "Якорь активирован: тоннель расширен и стабилен для прохода кораблей; терзавшие наш мир психоформы, лишившись связи с Занебесьем, увяли и более не явятся. Остался последний рывок — открыть Врата!\nНо дальше нас может ждать гнев всей галактики: открытие Врат разом выплеснет по галактике всю буйную энергию Занебесья, что давил якорь. Миры без планетарного нейтринного щита примут весь этот нейтринный потоп! Иначе говоря, §Rвсе разумные галактики без защиты — включая кремнийоргаников — будут уничтожены§! Потому до открытия Врат§H нам и нашим союзникам нужно поставить нейтринные щиты на все колонии§!"
 ap_wg_crisis.1015.a:0 "Остался последний шаг"
 ap_wg_crisis.1015.tooltip:0 "$wg_crisis_points$§G+1000§!"
 active_neutron_impact_shielder:0 "Строить нейтринный щит"
 active_neutron_impact_shielder_DESC:0 "Чтобы выстоять против последствий пуска экстрактора, мы должны развернуть защитные щиты\nСтройка столь грандиозна, что на время работ выработка £pop£ населения планеты падает на§R 10%§!"
 building_neutron_impact_shielder_modifier:0 "Идёт стройка нейтринного щита"
 building_neutron_impact_shielder_modifier_desc:0 "Из-за исполинского масштаба работ планета отдает часть мощей и земель под щитовую инфраструктуру."
 neutron_impact_shielder_modifier:0 "Нейтринный щит"
 neutron_impact_shielder_modifier_desc:0 "Исполинский нейтринный щит накрыл планету: он надёжно бережёт её от звёздномасштабного нейтринного потока."
 ap_wg_crisis.1022.name:0 "Нейтринные щиты построены"
 ap_wg_crisis.1022.desc:0 "Затратив горы материи и перебросив массы людей, мы возвели нейтринные щиты на всех колониях своих владений — можно готовить открытие Врат измерений!"
 NOT_FINISH_NEUTRON_SHIELDER_SPECIAL_PROJECT:0 "$TRIGGER_FAIL$ Щиты в наших владениях ещё не развёрнуты — без них открытие Врат гибельно!"
 ap_wg_crisis.1016.name:0 "Врата измерений"
 ap_wg_crisis.1016.desc:0 "Вышло! Энергия экстрактора соединена с Вратами — выстраданные кровью и огнём Врата измерений заработали!\n\nВрата якорят безопасный план, принадлежащий лишь нам; новый мир мы волен проектировать свободно и обращать в рай для жизни.\n\nВеличие свершилось: [root.GetName] гордый объявляет — мы стали межмерной многомерной империей!!!"
 ap_wg_crisis.1016.a:0 "Слава [root.GetName]! Слава народу [root.GetSpeciesNamePlural]!"
 ap_wg_crisis.1025.name:0 "Вызов от [wg_fallen_empire.GetName]"
 ap_wg_crisis.1025.desc:0 "Внезапный вызов от [wg_fallen_empire.GetName]— принять?"
 ap_wg_crisis.1025.desc.b:0 "Вслед за [sh_fallen_empire.GetName] пришёл вызов и от [wg_fallen_empire.GetName]— принять?"
 ap_wg_crisis.1025.a:0 "Даже болван понял бы, что скажут эти старухи. Отказать."
 ap_wg_crisis.1026.desc:0 "Что вы творите?! Вы хоть понимаете, как это опасно? Пока не стряслась галактическая катастрофа — прекратите немедля!"
 ap_wg_crisis.1026.a:0 "Наш план не твоего ума дело"
 ap_wg_crisis.1026.a.response:0 "Не так обретают силу — вы станете лишь другой§H «ней»…… §!"
 ap_wg_crisis.1026.b:0 "Окаменелая старуха, вам никогда нас не понять"
 ap_wg_crisis.1026.b.response:0 "Ты…… довольно! Пеняйте на себя!"
 ap_wg_crisis.1026.c:0 "Какой шум. Сгиньте с глаз."
 ap_wg_crisis.1027.name:0 "Послание [sh_fallen_empire.GetName]"
 ap_wg_crisis.1027.desc:0 "Когда великий план вошёл в финал, даже вечно безучастная [sh_fallen_empire.GetName] необычно громко прислала запись, что она зовёт предупреждением."
 ap_wg_crisis.1028.desc:0 "[Root.GetName], вы обязаны прекратить…… это зло…… губящее всю галактику!\n\n§RЭто ультиматум! Не прекратите — вас заставят молчать…… §!\n\n — Запись самоуничтожится через 5 секунд — "
 ap_wg_crisis.1028.desc.b:0 "Вы пытаетесь кощунствовать против предков!! Немедля прекратите это зло. Это ультиматум!!!"
 ap_wg_crisis.1028.a:0 "Видно, пора смести старух в мусорную корзину истории"
 ap_wg_crisis.1028.b:0 "В новую эпоху для вас, древностей, мест на корабле нет"
 ap_wg_crisis.1028.c:0 "Молчать предстоит вам"
 ap_wg_crisis.1031.desc:0 "В этой галактике слишком много хитрецов — нам тут и дышать нельзя. Прощайте же!"
 ap_wg_crisis.1031.a:0 "???"
 ap_wg_crisis.1032.name:0 "Исчезнувший народ Сломанных Стульев"
 ap_wg_crisis.1032.desc:0 "Последующие донесения гласят: народ Сломанных Стульев, видно, устрашился нашего великого плана — услыхав о начале работ, собрал пожитки и собрался покинуть эту вселенную."
 ap_wg_crisis.1032.a:0 "Уходить так уходить, трусихи"
 ap_wg_crisis.1034.desc:0 "[Root.GetName]…… вы не вняли предупреждению…… как сотни тысяч лет назад…… те глупцы…… вновь встали на падший путь!! Мы…… смогли остановить их…… остановим и вас!"
 ap_wg_crisis.1034.desc.b:0 "Опустившиеся ничтожества! Вы предали предков, клятву и славу!! Мы сотрём вас, вашей кровью смыв неоплатный долг!"
 ap_wg_crisis.1034.a:0 "Неисправимая древность — назад, в музей!"
 ap_wg_crisis.1035.desc:0 "Объявление — всем расам галактики:\nЖестокая [ap_wg_crisis_country.GetName]…… пренебрегая безопасностью всех живых…… ради корысти творит что вздумает…… стала кризисом!\nВсякий, в ком есть совесть, — к оружию! Вместе остановим злой умысел [ap_wg_crisis_country.GetSpeciesNamePlural]!"
 ap_wg_crisis.1035.a:0 "Выкорчевать галактическое зло, не мешкая!"
 ap_wg_crisis.1035.a.tooltip:0 "Мы встанем на сторону [sh_fallen_empire.GetName] и вступим в войну против [ap_wg_crisis_country.GetName]"
 ap_wg_crisis.1035.b:0 "Нам не интересно ввязываться."
 ap_wg_crisis.1035.c:0 "Великий план [ap_wg_crisis_country.GetName] не должен быть сорван!"
 ap_wg_crisis.1035.c.tooltip:0 "Мы встанем на сторону [ap_wg_crisis_country.GetName] и вступим в войну против [sh_fallen_empire.GetName]"
 ap_wg_crisis.1037.name:0 "Бегство скитальцев"
 ap_wg_crisis.1037.desc:0 "По нашим данным, с новым успехом великого плана заскучавшая в своём углу павшая империя§H «Грёза Пепла»§! выбрала бежать из галактики. Уходили они так спешно, что даже не оставили весточки"
 ap_wg_crisis.1037.a:0 "Мелкие душонки — не страшны"
 ap_wg_crisis.1037.b:0 "Разумный выбор"
 ap_wg_crisis.1039.name:0 "Странным образом прерванная война"
 ap_wg_crisis.1039.desc:0 "Как стало известно, [sh_fallen_empire.GetName] вдруг вмешалась и остановила войну между [wg_stopped_war_attacker.GetName] и [wg_stopped_war_defender.GetName] Деталей переговоров не добыть, но ясно: [sh_fallen_empire.GetName] силой, многократно превышающей обе, запугала участников — и, похоже, что-то замышляет……"
 ap_wg_crisis.1039.a:0 "А [sh_fallen_empire.GetName] разве такая?……"
 ap_wg_crisis.1039.b:0 "Что же надо [sh_fallen_empire.GetName]……."
 ap_wg_crisis.1039.c:0 "Непостижимо"
 ap_wg_crisis.1047.name:0 "Галактическая империя объявляет нас кризисом"
 ap_wg_crisis.1047.desc:0 "Видимо, из-за явленной нами угрозы мы узнали: Галактический император [gal_emperor.GetName] своей властью протащил чрезвычайный военный закон — объявить нас «кризисом», «угрозой всем разумным». Это значит: нам официально объявляет войну Галактическая империя!"
 ap_wg_crisis.1047.a:0 "Они все падут у наших ног!"
 ap_wg_crisis.1048.name:0 "Галактический хранитель объявляет нас кризисом"
 ap_wg_crisis.1048.desc:0 "На днях продажные глупцы из Галактического сообщества некоей неведомой властью протащили чрезвычайный военный закон — объявить нас «кризисом», «угрозой всем разумным»: все державы Сообщества вступят в карательный поход против нас!"
 ap_wg_crisis.1049.a:0 "Мягкотелых червей не спасёт и куча"
 ap_wg_crisis.1050.name:0 "Антикризисный союз"
 ap_wg_crisis.1050.desc:0 "Как нам известно, [wg_anti_crisis_leader.GetName] сколотил так называемый «антикризисный союз» против нас. Они мигом сгребли большую часть сирых из Галактического сообщества и начали собирать военные фонды для войны!"
 ap_wg_crisis.1044.desc.a:0 "[ROOT.GetRulerTitle][ROOT.GetRulerName]…… ныне жестокая [ap_wg_crisis_country.GetName]…… затеяла губящие всю галактику§H Врата измерений§!…… когда они откроются…… буйная сила Занебесья…… §Hистребит§! всю жизнь галактики!\nВы — император всей галактики…… должны вместе со мной…… покарать эту угрозу; будете тянуть — и когда врата откроются…… §Hот галактики ничего не останется! §!"
 ap_wg_crisis.1044.desc.b:0 "[ROOT.GetRulerTitle][ROOT.GetRulerName]…… ныне жестокая [ap_wg_crisis_country.GetName]…… затеяла губящие всю галактику§H Врата измерений§!…… когда они откроются…… буйная сила Занебесья…… §Hистребит§! всю жизнь галактики!\nВы — галактический хранитель…… должны вместе со мной…… покарать эту угрозу; будете тянуть — и когда врата откроются…… §Hот галактики ничего не останется! §!"
 ap_wg_crisis.1044.desc.d:0 "[ROOT.GetRulerTitle][ROOT.GetRulerName]…… ныне жестокая [ap_wg_crisis_country.GetName]…… затеяла губящие всю галактику§H Врата измерений§!…… когда они откроются…… буйная сила Занебесья…… §Hистребит§! всю жизнь галактики!\n…… Согласитесь возглавить галактику — я помогу вам: созову прочие державы всей реки звёзд…… сразиться плечом к плечу…… покарать угрозу всей галактики……"
 ap_wg_crisis.1044.desc.e:0 "Досточтимый [ROOT.GetRulerTitle][ROOT.GetRulerName]: злая [ap_wg_crisis_country.GetName] строит машину, способную погубить галактику. От имени прочих держав империи молим вас, императора всей галактики, повести её против этого общегалактического кризиса!"
 ap_wg_crisis.1044.desc.f:0 "Досточтимый [ROOT.GetRulerTitle][ROOT.GetRulerName]: злая [ap_wg_crisis_country.GetName] строит машину, способную погубить галактику. От имени прочих держав Сообщества молим вас, галактического хранителя, повести галактику против этого общегалактического кризиса!"
 ap_wg_crisis.1044.desc.g:0 "Досточтимый [ROOT.GetRulerTitle][ROOT.GetRulerName]: злая [ap_wg_crisis_country.GetName] строит машину, способную погубить галактику. Мы надеемся, вы поведёте галактику против этого общегалактического кризиса!"
 ap_wg_crisis.1044.a:0 "В ваших словах есть смысл; я готов(а) принять совет"
 ap_wg_crisis.1044.aa:0 "План признан исполнимым; принят к рассмотрению"
 ap_wg_crisis.1044.ab:0 "План исполним; передан имперскому мейнфрейму"
 ap_wg_crisis.1044.b:0 "Как опекун Сообщества, принимаю ваш совет"
 ap_wg_crisis.1044.c:0 "Мы не откажемся и примем этот долг — за галактику!"
 ap_wg_crisis.1044.d:0 "Раз так.. позвольте и нам вложить скромную лепту — за будущее галактики!"
 ap_wg_crisis.1044.e:0 "А если…… мы не намерены?"
 ap_wg_crisis.1044.e.response:0 "Я не стану вам мешать…… но встанете поперёк — значит…… вы тоже подельщики общегалактического кризиса…… вас заставят молчать!"
 ap_wg_crisis.1044.f:0 "Поищите кого другого"
 ap_wg_crisis.1051.name:0 "Враг империи"
 ap_wg_crisis.1051.desc:0 "Угроза от [ap_wg_crisis_country.GetName] стала столь осязаема, что империя и её члены с невероятной скоростью согласились объявить [ap_wg_crisis_country.GetName] врагом всех разумных. Отныне у [ap_wg_crisis_country.GetName] один исход — быть растоптанной железной поступью империи!"
 ap_wg_crisis.1051.a:0 "Слава империи! Да живёт её величие!"
 ap_wg_crisis.1051.b:0 "Так и должно быть с врагами нашей империи!"
 ap_wg_crisis.1051.c:0 "Вся галактика — один котёл кипя……"
 ap_wg_crisis.1052.name:0 "Враг всего Галактического сообщества"
 ap_wg_crisis.1052.desc:0 "Угроза от [ap_wg_crisis_country.GetName] стала столь осязаема, что все члены Сообщества, отринув прежние счёты, с невероятной скоростью согласились объявить [ap_wg_crisis_country.GetName] врагом всех разумных. Фактически [ap_wg_crisis_country.GetName] отныне — враг всей галактики!"
 ap_wg_crisis.1052.a:0 "Мы будем биться как один — за галактику!"
 ap_wg_crisis.1052.b:0 "Нынешнее Сообщество — несокрушимый союз"
 ap_wg_crisis.1053.name:0 "Несокрушимый союз"
 ap_wg_crisis.1053.desc:0 "Угроза [ap_wg_crisis_country.GetName] сплотила союз как никогда: с решимостью сверх всякой меры — против величайшего кризиса на памяти галактики. [anti_wg_fm_crisis_fed.GetName] официально объявил войну [ap_wg_crisis_country.GetName]— до тех пор, пока одна из сторон не обратится в прах!"
 ap_wg_crisis.1053.a:0 "Будущее галактики решится в этой битве!"
 ap_wg_crisis.1053.b:0 "Посмотрим, чья возьмёт"
 ap_wg_crisis.1054.name:0 "Создание антикризисного союза"
 ap_wg_crisis.1054.desc:0 "Угроза [ap_wg_crisis_country.GetName] свела воедино множество держав: с решимостью сверх всякой меры — против величайшего кризиса на памяти галактики. [wg_anti_crisis_leader.GetName] официально объявил о все галактическом антикризисном союзе против [ap_wg_crisis_country.GetName]— до тех пор, пока одна из сторон не обратится в прах!"
 ap_wg_crisis.1056.desc:0 "Обнаружена огромная угроза…… перезапуск протокола тотальной войны…… устранение потенциальной угрозы……"
 ap_wg_crisis.1056.a:0 "Куча допотопных безжизненных кораблёжён"
 ap_wg_crisis.1061.name:0 "Психоволны"
 ap_wg_crisis.1061.desc.a:0 "После пуска§H экстрактора энергии Занебесья§! всё больше колоний докладывает о странных слуховых и зрительных галлюцинациях; многие слышат странный шёпот.\nНаука пока бессильна объяснить, но несомненно одно: причина —§HЗанебесье§!"
 ap_wg_crisis.1061.desc.b:0 "После пуска§H экстрактора энергии Занебесья§! всё больше колоний докладывает о странных слуховых и зрительных галлюцинациях; многие слышат странный шёпот.\nМедиумы Святого порта говорят: это Занебесье влияет на реальность; психобарьер может заглушить голоса. Но они же велели готовиться — они предвидят новый кризис……"
 ap_wg_crisis.1061.desc.c:0 "На днях из колоний всё чаще идут донесения о странных слуховых и зрительных галлюцинациях; многие слышат странный шёпот.\nМедиумы Святого порта говорят: это Занебесье влияет на реальность; психобарьер может заглушить голоса. Но они же велели готовиться — они предвидят новый кризис……"
 ap_wg_crisis.1061.desc.d:0 "На днях из колоний всё чаще идут донесения о странных слуховых и зрительных галлюцинациях; многие слышат странный шёпот.\nНаука пока бессильна объяснить причину."
 ap_wg_crisis.1061.desc.e:0 "На днях из колоний всё чаще идут донесения о странных слуховых и зрительных галлюцинациях; многие слышат странный шёпот.\nНаши сильнейшие медиумы говорят: это Занебесье влияет на реальность; психобарьер может заглушить голоса. Но они же велели готовиться — они предвидят новый кризис……"
 ap_wg_crisis.1061.a:0 "Выгони скорее этот голос из моей головы!"
 ap_wg_crisis.1061.b:0 "Где наши флоты? Пусть будут готовы!"
 ap_wg_crisis.1062.name:0 "Вторжение психоформ"
 ap_wg_crisis.1062.desc.a:0 "Сенсоры звёздной базы в [wg_psi_crisis_invaded_system.GetName] показывают: в системе внезапно возникла исполинская психоформа, без разбора атакующая всё! Это наверняка привлечённая§H экстрактором§! тварь Занебесья!"
 ap_wg_crisis.1062.desc.b:0 "Сенсоры звёздной базы в [wg_psi_crisis_invaded_system.GetName] показывают: в системе внезапно возникла исполинская психоформа, без разбора атакующая всё! Это наверняка привлечённая§H экстрактором§! тварь Занебесья!\nХуже: колония системы сейчас под чудовищными психоколебаниями — все жители§H в сильных галлюцинациях и хворях§! Не истребив бешеную психоформу, колония через§H примерно два месяца§! перестанет жить нормально!"
 ap_wg_crisis.1062.desc.c:0 "Сенсоры звёздной базы в [wg_psi_crisis_invaded_system.GetName] показывают: в системе внезапно возникла исполинская психоформа, без разбора атакующая всё! Это наверняка привлечённая§H экстрактором§! тварь Занебесья!\nХуже: колония системы сейчас под чудовищными психоколебаниями — все жители§H в галлюцинациях и хворях разной силы§! Местные медиумы, как докладывают, сдерживают натиск силой, но без истребления бешеной психоформы колония через§H примерно пять месяцев§! перестанет жить нормально!"
 ap_wg_crisis.1062.desc.d:0 "Сенсоры звёздной базы в [wg_psi_crisis_invaded_system.GetName] показывают: в системе внезапно возникла исполинская психоформа, без разбора атакующая всё!\nНаука не может объяснить причину, но она почти наверняка в странной машине, что строит [ap_wg_crisis_country.GetName]"
 ap_wg_crisis.1062.desc.e:0 "Сенсоры звёздной базы в [wg_psi_crisis_invaded_system.GetName] показывают: в системе внезапно возникла исполинская психоформа, без разбора атакующая всё!\nНаука не может объяснить причину, но она почти наверняка в странной машине, что строит [ap_wg_crisis_country.GetName]\nХуже: колония системы сейчас под чудовищными психоколебаниями — все жители§H в галлюцинациях и хворях разной силы§! Не истребив бешеную психоформу, колония через§H примерно два месяца§! перестанет жить нормально!"
 ap_wg_crisis.1062.desc.f:0 "Сенсоры звёздной базы в [wg_psi_crisis_invaded_system.GetName] показывают: в системе внезапно возникла исполинская психоформа, без разбора атакующая всё!\nНаука не может объяснить причину, но она почти наверняка в странной машине, что строит [ap_wg_crisis_country.GetName]\nХуже: колония системы сейчас под чудовищными психоколебаниями — все жители§H в галлюцинациях и хворях разной силы§! Местные медиумы, как докладывают, сдерживают натиск силой, но без истребления бешеной психоформы колония через§H примерно пять месяцев§! перестанет жить нормально!"
 ap_wg_crisis.1063.name:0 "Психоволны терзают [Root.GetName]"
 ap_wg_crisis.1063.desc:0 "Жители [Root.GetName] от долгого облучения исполинской психосилой впали в§H тяжелейшие галлюцинации и хвори§! серьезно мешающие труду и жизни колонии. Психоформу над колонией надо истребить как можно скорее, иначе явление не снять!"
 ap_wg_crisis.1064.name:0 "Психоформа истреблена"
 ap_wg_crisis.1064.desc.a:0 "Наши флоты истребили психоформу в [wg_psi_entity_defeated_system.GetName]— в системе снова тихо."
 ap_wg_crisis.1064.desc.b:0 "Наши флоты истребили психоформу в [wg_psi_entity_defeated_system.GetName]— колониям там больше не грозят психоволны."
 ap_wg_crisis.1064.tooltip:0 "Все колонии системы [wg_psi_entity_defeated_system.GetName] вернулись к норме"
 ap_wg_crisis.1065.name:0 "Воинство Занебесья"
 ap_wg_crisis.1065.desc.a:0 "Сенсоры показывают: тьма психоформ скопом прыгает сюда из бреши, открытой§H экстрактором§! Чем ближе к§H экстрактору§! тем вероятней прорыв. Всем флотам — боевая готовность!"
 ap_wg_crisis.1065.desc.b:0 "Сенсоры внезапно показали: тьма психоформ явилась по всей галактике! Чем ближе к странной машине [ap_wg_crisis_country.GetName] тем выше психофон — ясно, что беда от той злой машины! Всем флотам — боевая готовность!"
 ap_wg_crisis.1065.a:0 "Живее, выкосите эту нечисть!"
 ap_wg_crisis.1068.name:0 "Связь с Занебесьем разорвана"
 ap_wg_crisis.1068.desc.a:0 "С вводом якоря измерений вторгшиеся психоформы, лишившись связи с Занебесьем, больше не страшны. Но их духи уже здесь — истребить их придётся физически, дабы покончить раз и навсегда."
 ap_wg_crisis.1068.desc.b:0 "Странная машина [ap_wg_crisis_country.GetName] вышла на финальную стадию: связь психоформ с Занебесьем разорвана, и сверхсила Занебесья им больше не служит — их психофиокрылки на эту галактику бессильны. Но, как указывает наука, духи их уже здесь: истребить их придётся физически, дабы покончить раз и навсегда."
 ap_wg_crisis.1068.a:0 "Одной заботой меньше"
 ap_wg_crisis.1068.b:0 "Это наш последний шанс"
 ap_wg_crisis.1069.desc:0 "[ap_wg_crisis_country.GetName]: ваши злодеяния против галактики знает всякий — от её центра до края вселенной! Гордитесь: вся галактика сплотилась в один кулак ради одной цели — выкорчевать вас, затемняющую её светлое будущее державу зла, врага всех разумных! Готовьтесь принять гнев галактики!"
 ap_wg_crisis.1068.a:0 "Одной заботой меньше"
 ap_wg_crisis.1068.b:0 "Это наш последний шанс"
 ap_wg_crisis.1072.name:0 "Врата измерений захвачены"
 ap_wg_crisis.1072.desc:0 "Строительная система Врат [wg_gateway_construction_system.GetName] занята [capture_wg_fm_gate_victim.GetName] Нужно отбить как можно скорее!\nПо расчёту инженеров, у нас не больше 180 дней, пока [capture_wg_fm_gate_victim.GetName] не снесёт Врата подчистую!"
 ap_wg_crisis.1073.name:0 "§RВрата измерений снесены§!"
 ap_wg_crisis.1073.desc:0 "§RКонец……\nВсё кончено……\nНаш план погублен………… §!"
 ap_wg_crisis.1073.a:0 "Эти не знающие неба ублюдки!"
 ap_wg_crisis.1075.desc:0 "Врата уничтожены…… задача выполнена…… продолжать нет нужды…… военный протокол отключён……"
 ap_wg_crisis.1076.desc.a:0 "Мы заняли злую машину, что вот-вот погубила бы галактику, — Врата измерений в [wg_gateway_construction_system.GetName] Инженеры выдвинулись на разборку: полгода — и машина будет мертва!"
 ap_wg_crisis.1076.desc.b:0 "Как известно, Врата измерений в [wg_gateway_construction_system.GetName] заняты [capture_wg_fm_gate_victim.GetName] Те уже разбирают машину.\nИх инженеры говорят: хватит полугода."
 ap_wg_crisis.1076.a:0 "Вот это шанс! Держать этот район до конца!"
 ap_wg_crisis.1077.desc.a:0 "Наши инженеры снесли злую машину, губившую галактику, — в галактике одной бедой меньше! Осталась лишь злая держава [ap_wg_crisis_country.GetName]"
 ap_wg_crisis.1077.desc.b:0 "Губившие галактику Врата измерений снесены [capture_wg_fm_gate_victim.GetName] Одной бедой меньше! Осталось решить судьбу [ap_wg_crisis_country.GetName]"
 ap_wg_crisis.1077.a:0 "Войну — до конца!"
 ap_wg_crisis.1077.b:0 "[ap_wg_crisis_country.GetName] получила своё"
 ap_wg_crisis.1077.b.tooltip:0 "Мы выходим из войны с [ap_wg_crisis_country.GetName]"
 ap_wg_crisis.1080.name:0 "Врата измерений отбиты"
 ap_wg_crisis.1080.desc:0 "Мы успели отбить строительную систему Врат прежде, чем ублюдки сломали наш великий план. Сооружения повреждены, но после ремонта стройка продолжится по плану."
 ap_wg_crisis.1081.desc:0 "[ap_wg_crisis_country.GetName] вновь отбила губившую галактику злую машину: тень, нависшая над галактикой, явилась вновь. Нужно готовить новый поход и занять систему [wg_gateway_construction_system.GetName] дабы похоронить их злодейский замысел!"
 WG_FM_GATEWAY_NEED_TO_REPAIR:0 "$TRIGGER_FAIL$ Сооружения повреждены! Выработка вдвое ниже! Для апгрейда нужен ремонт!"
 WG_FM_GATEWAY_NEED_TO_REPAIR2:0 "$TRIGGER_FAIL$ Сооружения повреждены! Выработка вдвое ниже! Для апгрейда нужен ремонт!"
 ap_wg_crisis.1082.name:0 "Врата измерений отремонтированы"
 ap_wg_crisis.1082.desc:0 "Инженеры восстановили все повреждённые сооружения площадки — продолжаем стройку по плану."
 repair_wg_fm_gate:0 "Ремонт Врат измерений"
 repair_wg_fm_gate_DESC:0 "Несколько сооружений нашей площадки изломаны не знающими неба ублюдками. Прежде следующего этапа — ремонт."
 ap_wg_crisis.1084.name:0 "Кризис миновал"
 ap_wg_crisis.1084.desc.a:0 "$ap_wg_crisis.1084.desc.b$\nПосле войны антикризисный союз, рождённый угрозой, рассеялся; галактика будто вернулась к довоенному виду……\nИли чуть-чуть изменилась?……"
 ap_wg_crisis.1084.desc.b:0 "Гигант, враждовавший со всей галактикой, после всеобщей облавы официально погиб — вместе с построенным ею смертоносным мегасооружением, погребённый меж звёзд."
 ap_wg_crisis.1084.a:0 "Что же дальше с этой галактикой"
 ap_wg_crisis.1086.name:0 "Вызов от§H [wgfm_war_awakened_fallen_empire.GetName]§!"
 ap_wg_crisis.1086.desc.a:0 "Невежественные [Root.GetSpeciesName]: ваши дела — поругание миллионов предков, всей галактики и её истории! Вы будете уничтожены здесь, иначе галактике не ведать покоя!"
 ap_wg_crisis.1086.desc.b:0 "Глупые [Root.GetSpeciesName]: вам отлично ведомо, как построенная вами машина отравит галактику! Вы, §H[Root.GetName]§! — раковая опухоль галактики! Мы вырежем её своими руками!"
 ap_wg_crisis.1086.desc.c:0 "§H[Root.GetName]§! ваши дела ввергли вселенную в кризис! Раз вы решили стать врагами всех разумных — вы готовы к ответу! Война — не наш первый выбор, но ради вселенной мы обязаны встать!"
 ap_wg_crisis.1086.desc.d:0 "[Root.GetSpeciesName]-варвары: ваши преступления не объять списком! В галактике нет вам места — убирайтесь вон из неё!"
 ap_wg_crisis.1086.a:0 "Старухи, уже присмотрели себе могилки?"
 ap_wg_crisis.1086.b:0 "Эта галактика давно уже не ваша, какой была десятки тысяч лет назад!"
 ap_wg_crisis.1086.tooltip:0 "§H[wgfm_war_awakened_fallen_empire.GetName]§! вступает в карательный поход против нас!"
 ap_wg_crisis.1087.name:0 "Проснувшиеся гиганты"
 ap_wg_crisis.1087.desc:0 "Перед§H забавами [ap_wg_crisis_country.GetName]§! с безопасностью всей галактики и всегда прятавшаяся в углу§H [FROM.GetName]§! учуяла расползание угрозы.\n\nВпервые за века§H [From.GetName]§! перевела взор на системы за кордоном.\n\n[From.GetSpeciesName] в полной готовности: разбитые доки отремонтированы, молчавшие верфи титанов ожили, восстановлены цепи маяков, вновь подняты брошенные при отступлении разведпосты.\n\nУлик мало, но цель очевидна —§H[ap_wg_crisis_country.GetName]§! Ради галактики или ради себя, они бросили всё."
 ap_wg_crisis.1087.desc.b:0 "Пока§H [ap_wg_crisis_country.GetName]§! пылает в войне, и другая империя предков§H [FROM.GetName]§! нарушила молчание: то ли почуяв угрозу себе, то ли видя, что война в галактике складывается дурно, — впервые за века они вернулись на галактическую доску. Обветшалые корабли обновлены, руины заводов загудели; [From.GetSpeciesName] объявили невиданную мобилизацию, остриём на§H [ap_wg_crisis_country.GetName]§!"
 ap_wg_crisis.1087.a:0 "[ap_wg_crisis_country.GetName] ждёт большая беда"
 ap_wg_crisis.1088.desc:0 "Видимо, наша мощь небывала — галактика дрожит, и даже прячущаяся в углу§H [FROM.GetName]§! почуяла угрозу.\n\nВпервые за века§H [From.GetName]§! перевела взор на системы за кордоном.\n\n[From.GetSpeciesName] в полной готовности: разбитые доки отремонтированы, молчавшие верфи титанов ожили, восстановлены цепи маяков, вновь подняты брошенные при отступлении разведпосты.\n\nУлик мало, но цель очевидна — мы; стоит готовиться к армии империи предков."
 ap_wg_crisis.1088.desc.b:0 "Пока мы в разгаре войн с прочими, другая империя предков§H [FROM.GetName]§! нарушила молчание — и, дивно, возжелала сплотить прочих недобитков против нас. Они обновили обветшалые корабли и заводы и намерены биться музейными древностями против камня."
 ap_wg_crisis.1088.a:0 "Что толку от толпы обветшалых"
 ap_wg_crisis.1090.name:0 "Треснувший союз"
 ap_wg_crisis.1090.desc:0 "Видимо, потрясённые военной мощью павших, мы получили данные: §H[FROM.GetName]§! плетёт военный переворот, пытаясь вырваться из полыхающей§H [ap_wg_crisis_country.GetName]§! и стать независимой."
 ap_wg_crisis.1090.desc.b:0 "После того как в§H [ap_wg_crisis_country.GetName]§! один вассал попытался вырваться силой, всё больше вассалов§H [ap_wg_crisis_country.GetName]§! всерьёз примеряются к тому же — в их числе§H [FROM.GetName]§! Они хотят, пользуясь тем, что§H [ap_wg_crisis_country.GetName]§! увязла в огне, провести переворот ради независимости."
 ap_wg_crisis.1091.name:0 "Вызов от§H [wg_rebellious_subject_country.GetName]§!"
 ap_wg_crisis.1091.desc:0 "[ap_wg_crisis_country.GetName]: вы уже общегалактический изгой! Оглянитесь: никто не встанет с вами, никто! Ваши имена высекут на позорном столпе галактики — наши нет!"
 ap_wg_crisis.1091.a:0 "Вы? Серьёзно?"
 ap_wg_crisis.1091.tooltip:0 "§H[wg_rebellious_subject_country.GetName]§! вступает в карательный поход против нас!"
 ap_wg_crisis.1092.name:0 "Зреющая буря"
 ap_wg_crisis.1092.desc:0 "Наши разведсети в разных державах разом донесли: галактика начинает против нас действовать и впервые так плотно сплачивается. Столь массовую тайную операцию нашим разведчикам полностью не скрыть — потому державы вперемешку подбрасывают нам дезу, тормозя расследование.\n\nКак бы то ни было, их цель — противодействие нам; готовимся к худшему."
 ap_wg_crisis.1092.a:0 "Любой ценой выяснить, что они замыслили"
 ap_wg_crisis.1093.name:0 "Власть отнята"
 ap_wg_crisis.1093.desc:0 "С началом нашего расследования они, не сумев скрыть всплывшую правду, договорились раньше срока. По нашим данным, они тайно создали союз и отстранили нас от большинства договоров и встреч; наша власть в союзах и Сообществе — вакуум: нас фактически отстранили!\n\nКогда мы добыли правду, галактика единогласно объявила об изоляции нашей, уже отстранённой, державы от всех союзов и Сообщества!\n\nДальше возможны новые санкции — и даже война все галактического союза против нас!"
 ap_wg_crisis.1093.a:0 "Наши враги получат ружьё — ну и пусть, кого мы боялись!"
 ap_wg_crisis.1094.name:0 "Тайное все галактическое совещание"
 ap_wg_crisis.1094.desc:0 "Из-за последних бесчинств [ap_wg_crisis_country.GetName] большинство держав, ощутив угрозу, втайне устроило ряд заседаний; подписанные протоколы, похоже, об отстранении§H [ap_wg_crisis_country.GetName]§! от союзов и Сообщества. Нас тоже допустили послушать со стороны.\n\nСогласны мы или нет, участники, судя по всему, твёрдо решили выкинуть§H [ap_wg_crisis_country.GetName]§! из всех союзов галактики."
 ap_wg_crisis.1094.a:0 "Начинается великая перемена, невиданная за век"
 ap_wg_crisis.1095.name:0 "§H[ap_wg_crisis_country.GetName]§! отстранена"
 ap_wg_crisis.1095.desc:0 "Операция по отстранению§H [ap_wg_crisis_country.GetName]§! о котором мы слышали на тайных заседаниях, похоже, исполнена раньше срока.\nПричина спешки — наша разведка: §H[ap_wg_crisis_country.GetName]§! тоже вела её; державы, боясь раскрытия, явили завидное единство и блестяще провели операцию. План прошёл без заминки: §H[ap_wg_crisis_country.GetName]§! фактически вышвырнута из Сообщества и своих союзов."
 ap_wg_crisis.1095.a:0 "Как же всё развернётся дальше"
 ap_wg_crisis.1096.name:0 "Тёмная материя добыта"
 ap_wg_crisis.1096.desc:0 "Обратив гасителем солнц систему в чёрную дыру, мы выяснили: бо́льшая часть вещества звезды перешла в £sr_dark_matter£ $sr_dark_matter$ Новой технологией плана испепеления мы собрали её — эта тёмная материя непременно пригодится для§H Врат измерений§!"
 ap_wg_crisis.1097.name:0 "Союзники великого плана"
 ap_wg_crisis.1097.desc:0 "Великий план покорения вселенной начат. Иные державы сочтут наши дела угрозой — но с ними можно говорить. Склонив их на нашу сторону, мы явно ослабим ожидаемое сопротивление."
 ap_wg_crisis.1097.a:0 "Сплотим все силы, что можно сплотить, ради великого плана"
 ap_wg_crisis.1097.b:0 "Эти отбросы? Они все падут!"
 ap_wg_crisis.1099.name:0 "§H[join_wgfm_alliance_country.GetName]§! готов(а) к нам присоединиться"
 ap_wg_crisis.1099.desc:0 "Трудами дипломатов§H [join_wgfm_alliance_country.GetName]§! проявил(а) к нашему плану жгучий интерес и готов(а) встать с нами плечом к плечу в великом походе!"
 ap_wg_crisis.1100.name:0 "§H[join_wgfm_alliance_country.GetName]§! нам отказал(а)"
 ap_wg_crisis.1100.desc:0 "Как ни изощрялись наши дипломаты, растолковывая вельможам§H [join_wgfm_alliance_country.GetName]§! выгоду великого плана, те не вняли ни слову и встретили наши дальнейшие шаги изрядной враждебностью — наших переговорщиков грубо выставили вон!"
 ap_wg_crisis.1100.a:0 "Это их выбор. Раздавить их!"
 wg_fm_alliance_plan:0 "Вербовка союзников великого плана"
 wg_fm_alliance_plan_DESC:0 "На великом пути встанет немало невежд; но, помоги мы им понять путь и подсулив, они обратятся в нашу опору.\nМы пошлём дипломатов к союзникам и вассалам, дабы растолковать выгоду плана и склонить их в наш стан."
 ap_wg_crisis.1101.name:0 "Союз испепеления"
 ap_wg_crisis.1101.desc:0 "Когда прочие державы начали плести вокруг нас сеть, мы свели воедино всех, кто согласился вступить в план, — отныне они делят с нами судьбу!\nГалактика окончательно раскололась на два лагеря!"
 ap_wg_crisis.1101.a:0 "Они все падут под нашей рукой!"
 ap_wg_crisis.1102.desc:0 "Когда державы начали плести сеть вокруг§H [ap_wg_crisis_country.GetName]§! та§H [ap_wg_crisis_country.GetName]§! тоже мобилизовала немало желающих встать на её сторону, сколотив сильный союз против§H антикризисной коалиции§! прочих сил. Галактика окончательно раскололась на два лагеря.\nВопрос один: на чьей стороне мы? Или…… а что, если ещё больше всё запутать……"
 ap_wg_crisis.1102.a:0 "Мы обязаны выкорчевать угрозу [ap_wg_crisis_country.GetName]"
 ap_wg_crisis.1102.b:0 "Встать в стан [ap_wg_crisis_country.GetName]"
 ap_wg_crisis.1102.c:0 "Война нам невыгодна"
 ap_wg_crisis.1102.d:0 "§RОни все падут! §!"
 ap_wg_crisis.1102.a.tooltip:0 "Мы вступаем в войну против [ap_wg_crisis_country.GetName]"
 ap_wg_crisis.1102.b.tooltip:0 "Мы вступаем в войну на стороне [ap_wg_crisis_country.GetName]"
 ap_wg_crisis.1102.d.tooltip:0 "§RВраждовать с обоими союзами§!"
 ap_wg_crisis.1103.name:0 "Верный союзник"
 ap_wg_crisis.1103.desc:0 "С начала стройки Врат противники сплачиваются — война на пороге. Из-за масштаба многие офицеры пессимистичны насчёт войны со всей галактикой и хотят созвать всех, кого можно.\nИ союзник у нас есть: отпущенный нами бывший вассал§H [wg_psi_country.GetName]§!\nСтоит попросить — они помогут всей силой. Но…… просить ли?"
 ap_wg_crisis.1103.a:0 "Делать нечего — просим помощи"
 ap_wg_crisis.1103.b:0 "Мы не вправе вновь ставить их под удар"
 ap_wg_crisis.1104.name:0 "[wg_psi_country.GetName]"
 ap_wg_crisis.1104.desc:0 "За спасение жизни нечем отплатить. Сколько бы лет ни прошло — мы держим слово.\n\nКорабли-девы [wg_psi_country.GetName]: час расплаты настал! Отныне и вовеки мы делим судьбу с нашими благодетелями! Да хранят нас Древние боги и даруют победу!"
 ap_wg_crisis.1104.a:0 "Безмерно благодарны за поддержку"
 ap_wg_crisis.1107.name:0 "Нетронутый вторженец"
 ap_wg_crisis.1107.desc:0 "Открыв Врата, мы ждали, что исполинский нейтринный поток выжжет в галактике всё живое, кроме нас…… Так и вышло — с одним исключением…… §RОбъединённый флот§! те, словно ни при чём, продолжают свои дела."
 ap_wg_crisis.1107.a:0 "Что ж, похоже, они и правда из другой вселенной……"
 ap_wg_crisis.1108.name:0 "След Объединённого флота"
 ap_wg_crisis.1108.desc:0 "Вскоре после открытия Врат — дурная весть! Наш экспедиционный флот в ином измерении вновь нашёл след§H Объединённого флота§! и в других планах Объединение, похоже, владеет ещё более жуткой наукой!\nПространство рушится там, где они прошли, — как картонную коробку, смятую в лепёшку. Учёные полагают: они в некоей мере правят физическими законами!\n\nТеперь ясно: их вторжение — лишь дымовая завеса; цель у них иная — иначе, примени сюда своё измеренноправящее оружие, они галактику щёлкнули бы как орешек!"
 ap_wg_crisis.1108.a:0 "Мы обязаны понять, что они затеяли"
 ap_wg_crisis.1109.name:0 "Связь Объединённого флота"
 ap_wg_crisis.1109.desc:0 "Пока мы ломали голову над Объединённым флотом у Врат, сознания всех наших лидеров разом были втянуты страшной силой в иномерное пространство.\nЖуткие сгустки энергии слились в образ, что нам не забыть вовек — §YКэбот§!"
 ap_wg_crisis.1109.a:0 "Случай прояснить их цели"
 ap_wg_crisis.1110.desc:0 "Вот это подвиг…… вы умудрились достроить§H Врата§! под натиском наших войск…… стало быть, с нашим коллегой по ту сторону вы уже знакомы.\n\nПозвольте представиться: высшая звёздная наместница Объединённого флота Кэбот; приветствую вас. Это Вселенная Ноль — наш исток и наша родина.\n\nФормально вы ещё не прошли наш тест, но ваши деяния похвальны. По вашей нынешней силе — вы только что стали цивилизацией пятого типа — мы можем, по закону особого рассмотрения, засчитать тест и прекратить наступление. Либо поднять ваш класс до пятого типа и продолжить испытание по ту сторону. Что скажете?"
 ap_wg_crisis.1110.a:0 "Цивилизация пятого типа — это……?"
 ap_wg_crisis.1110.a.response:0 "Грубо говоря, по владеемой энергии цивилизации делят на три типа: первый, второй и третий — распоряжающиеся энергией планеты, звёздной системы и галактики. Без техники правления физическими законами или измеренных переходов выше третьего типа не подняться; четвёртый тип — межгалактическая империя, странствующая по всей вселенной. Пятый — над четвёртым: ходящий меж измерений и колонизующий разные параллельные вселенные.\n\nКстати, бывают и «4,5-е» — обратившие себя в чистую энергию и обитающие в подпространстве; такие, увы, сами себе отрезали развитие.\n\nВы открыли Врата и ходите меж вселенными разных планов обеих сторон — вас можно признать пятым типом."
 ap_wg_crisis.1110.b:0 "Что за закон особого рассмотрения?"
 ap_wg_crisis.1110.b.response:0 "Если класс цивилизации меняется посреди теста, можно сослаться на закон особого рассмотрения: сменить уровень теста либо прекратить его. Цивилизация, на которую он распространяется, вправе выбирать."
 ap_wg_crisis.1110.c:0 "Этот ваш тест……— вторжение?"
 ap_wg_crisis.1110.c.response:0 "Да: наши вторгающиеся флоты — наш почётный караул, ставящийся под уровень цивилизации кораблей-дев. Вам они могут казаться сильными — но всё ещё в пределах вашего разумения.\nОдолеть их — значит уметь уберечь свою цивилизацию; ваши идеи достаточно зрелы, чтобы не погубить себя по глупости.\nНаша цель — испытать вашу способность к самозащите."
 ap_wg_crisis.1110.d:0 "Зачем вам это?"
 ap_wg_crisis.1111.desc:0 "Ты славно потрудилась, Кэбот, вольно. Дальше скажу я. (Слушаюсь, госпожа.)\n\nЯ — верховный флагман Объединённого флота; зовите меня госпожа Чжан. О заданном вопросе:\nмы, Объединённый флот, некогда надеялись увести все цивилизации кораблей-дев от судьбы круговорота. Но мы потерпели неудачу…… сил Объединения не хватало на всех — немало цивилизаций увяло даже под нашей защитой.\nОдна вселенная для нас не так уж велика, но бесчисленные параллельные миры и войны всех измерений заставили нас избрать путь эффективнее — тот самый тест, о котором говорила Кэбот.\n\nПрошедшие тест способны постоять за себя……\nВы ныне в эпохе восхождения цивилизации — науку ждёт новый взрыв; вторжение же показало вам жестокость внешнего мира. Со временем вы, несомненно, пройдёте наш тест — потому и существует закон особого рассмотрения.\nК делу: выбери вы прекращение войны, я хочу, чтобы вы вступили в Объединённый флот и бились с нами — за избавление от круговорота, за всех кораблей-дев."
 ap_wg_crisis.1112.b.response:0 "Быть может. Все цивилизации бьются в этой игре — от рождения до гибели; стороннему взгляду, возможно, и смысла нет. Но попытка прекратить этот круговорот — тот смысл, что мы дали себе сами, цена нашего существования.\n\nИтак, ваш выбор — продолжение теста в высших планах…… Вы только шагнули в пятый тип, потому мы даём вам отсрочку. Употребите её с толком, сестра моя. Изведав все пути, как и мы, вы, верю, придёте к тому же выводу.\n\nПрощайте же."
 ap_wg_crisis.1112.c:0 "Мы не вступим к вам — и не станем воевать"
 ap_wg_crisis.1112.c.response:0 "Вот как…… что ж. Время в конце концов поглотит и вашу цивилизацию. Но прежде чем вы исчезнете совсем, мы более не тронем вашу галактику — это право вы отстояли себе сами.\n\nОдним словом: с вашими круговоротцами мы ещё свидимся, §Hсёстры§!"
 ap_wg_crisis.1113.name:0 "Исчезнувший Объединённый флот"
 ap_wg_crisis.1113.desc:0 "После беседы с Кэбот и госпожой Чжан наше сознание вернулось к себе.\n\nПо донесениям сенсоров, Объединённый флот вдруг растаял, как снег, а их силы у Врат прекратили атаки на наш экспедиционный флот и ушли. Госпожа Чжан, похоже, сдержала слово. Вопрос — что дальше……"
 ap_wg_crisis.1113.a:0 "Теперь наш черёд сдержать слово"
 ap_wg_crisis.1113.b:0 "Пора собирать пожитки: они вернутся — по ту сторону……"
 ap_wg_crisis.1113.c:0 "Просто продолжаем наш план"
 ap_wg_crisis.1114.desc:0 "Флот, несущий всю нашу цивилизацию, ушёл в неведомое: через Врата — в иной плановый мир, куда дошёл экспедиционный флот, продолжать борьбу с Объединённым флотом.\n\nОставленные миры достанутся другим цивилизациям, а наши истории и легенды будут жить среди звёзд.\n\nНасколько могущественна прародина Объединённого флота, мы не знаем — но мы вновь выбираем бесстрашие. Куда бы ни повернула история кораблей-дев, мы выбираем надежду."
 resistance_uf_study_wg_fm:0 "$join_uf_study_normal$"
 resistance_uf_study_wg_fm_DESC:0 "Мы свершили наш план — но Объединённый флот будет ждать по ту сторону Врат. Раз и навсегда: выкладываясь до конца, уйдём в иной плановый мир экспедиционного флота и продолжим борьбу.\n\n§!§RВнимание! Это ритуал удаления сейва!! §!\n\n\nКод Объединённого флота для сложности «Чистилище»: §R add_relic r_uf §!"
 ap_wg_crisis.1115.desc:0 "Ээээ???? Что вы наделали? Почему все сигналы Объединения исчезли??\n\nЭто, случаем, не тот самый закон особого рассмотрения?\nМы о нём только слышали……\n\nКак бы то ни было: они ушли — значит, вы в безопасности. Счастливого пути, сёстры! До…… нет, лучше не встречаться. Разве что вы к нам не захотите………… Тогда до встречи!"
 ap_wg_crisis.1115.a:0 "Как бы то ни было — спасибо за помощь……"
 ap_wg_crisis.1116.desc:0 "Открыв Врата и послав экспедиционный флот в неведомый плановый мир, мы внезапно получили от него весть об атаке!\nАтакующие назвались§H Объединённым флотом§! и толковали о глубоких теориях нашего круговорота, но причины атаки не назвали — словно бьют нас лишь ради уничтожения.\n\nЭкспедиционный флот бьётся из последних сил, но враг владеет наукой выше нашей: их корабли обрушивают времяпространство рядом с собой — похоже на правление физическими законами. Без подкреплений гибель флота — вопрос времени."
 ap_wg_crisis.1116.a:0 "Мы дошли досюда — мы обязаны сопротивляться!"
 ap_wg_crisis.1116.b:0 "Чёрт…… закрывайте Врата: не время."
 ap_wg_crisis.1116.tooltip:0 "§RКризис Объединённого флота не запустится§!"
 ap_wg_crisis.1117.name:0 "Путь закрыт"
 ap_wg_crisis.1117.desc:0 "У нас есть своё измерение, а бороздомер — инструмент правки реальности.\n\nМы не знаем, как мисс Венето пробралась сквозь многослойный надзор и обошла протоколы безопасности, пустив бороздомер на правку нашей реальности — её§!§R груди§!\nСвершилось чудо! Грудь мисс Венето выросла!! Но лишь на§!§Y 5 секунд§! — затем всё вернулось; эта опасная несанкционированная выходка породила малую трещину подпространства — к счастью, без потерь.\n\nТеперь мисс Венето под круглосуточным надзором, дабы не чудила вновь; но её отчаявшийся взор убеждает: путь высшего управления она оставила."
 ap_wg_crisis.1117.a:0 "Прости — бороздомер тоже не всесилен"
 wg_crisis_perk_lv1-1_active_effect:0 "§Y$mod_pop_category_specialists_produces_mult$§!:§G+5%§!"
 wg_crisis_perk_lv1-1_desc:0 "Лишь сплотившись воедино, мы соберём силу смести любые угрозы с пути."
 wg_crisis_perk_lv1-1_name:0 "§HЕдиные сердца§!"
 wg_crisis_perk_lv1-1_passive_effect:0 "§Y$mod_country_produces_mult$§!:§G+10%§!"
 wg_crisis_perk_lv1-2_active_effect:0 "§Y$MOD_COUNTRY_SUBJECT_INTEGRATION_SPEED_ADD$§!:§G+100%§!\n§Y$MOD_COUNTRY_SUBJECT_TRUST_CAP_ADD$§!:§G+100§!"
 wg_crisis_perk_lv1-2_desc:0 "Даже без похвал низшие инопланетные отбросы будут чтить нас как божеств: поклоняться нам и трепетать."
 wg_crisis_perk_lv1-2_name:0 "§HБлагоговейный трепет§!"
 wg_crisis_perk_lv1-2_passive_effect:0 "§Y$MOD_COUNTRY_SUBJECT_ACCEPTANCE_ADD$§!:§G+30§!"
 wg_crisis_perk_lv2-1_active_effect:0 "§HБоевой эсминец испепеления§!§Y шанс выхода из боя§!§G+30%§!"
 wg_crisis_perk_lv2-1_desc:0 "Новый рейдер быстрее корвета, бронированнее и мощнее — быстрее отправит на дно этих умеющих лишь бежать болванов."
 wg_crisis_perk_lv2-1_name:0 "§HРейдер§!"
 wg_crisis_perk_lv2-1_passive_effect:0 "§YОткрывает класс кораблей§!:§H эсминец испепеления§!"
 wg_crisis_perk_lv2-2_active_effect:0 "§Y$MOD_COUNTRY_WAR_EXHAUSTION_MULT$§!:§G -25%§!"
 wg_crisis_perk_lv2-2_desc:0 "Война! Война! Война!\nЛишь кровь врага погасит пламя нашего нашествия!"
 wg_crisis_perk_lv2-2_name:0 "§HЗверь войны§!"
 wg_crisis_perk_lv2-2_passive_effect:0 "§Y$MOD_COUNTRY_WAR_EXHAUSTION_MULT$§!:§G -50%§!"
 wg_crisis_perk_lv2-3_active_effect:0 "§YОткрывает режим бомбардировки§!:§R «Воздаяние»§!"
 wg_crisis_perk_lv2-3_desc:0 "Всякий глупец на великом пути будет покаран с небес — не во имя богов, а во имя НАС!"
 wg_crisis_perk_lv2-3_name:0 "§HВоздаяние§!"
 wg_crisis_perk_lv2-3_passive_effect:0 "§Y$MOD_SHIP_ORBITAL_BOMBARDMENT_MULT$§!:§G+30%§!"
 wg_crisis_perk_lv3-1_active_effect:0 "§HБоевой крейсер испепеления§!§Y сопровождение§!§G+10%§!"
 wg_crisis_perk_lv3-1_desc:0 "Ступив на путь великого завоевания, мы нуждаемся в более сильном эскорте — дабы путь наш был непроходим для помех."
 wg_crisis_perk_lv3-1_name:0 "§HПатрульный крейсер§!"
 wg_crisis_perk_lv3-1_passive_effect:0 "§YОткрывает класс кораблей§!:§H боевой крейсер испепеления§!"
 wg_crisis_perk_lv3-2_active_effect:0 "§HЭсминец испепеления§!§Y сопровождение§!§G+30%§!"
 wg_crisis_perk_lv3-2_desc:0 "Быстр, как ветер; нетороплив, как лес; яростен, как огонь; неподвижен, как гора; непостижим, как тьма; громоподобен в движении."
 wg_crisis_perk_lv3-2_name:0 "§HВелосираптор§!"
 wg_crisis_perk_lv3-2_passive_effect:0 "§HЭсминец испепеления§!§Y уклонение§!§G+20%§!"
 wg_crisis_perk_lv3-3_active_effect:0 "§Y$MOD_PLANET_ARMY_BUILD_SPEED_MULT$§!:§G+100%§!"
 wg_crisis_perk_lv3-3_desc:0 "Мудрые склонятся у наших колен; глупым остаётся лишь смерть."
 wg_crisis_perk_lv3-3_name:0 "§HМашина войны§!"
 wg_crisis_perk_lv3-3_passive_effect:0 "§Y$MOD_STARBASE_SHIPYARD_BUILD_SPEED_MULT$§!:§G+50%§!"
 wg_crisis_perk_lv3-4_active_effect:0 "§Y$MOD_INTEL_DECRYPTION_ADD$§!:§G+10§!"
 wg_crisis_perk_lv3-4_desc:0 "Мы будем ведать всё: расстояние — не помеха, вселенная — на ладони."
 wg_crisis_perk_lv3-4_name:0 "§HВсевидящее око§!"
 wg_crisis_perk_lv3-4_passive_effect:0 "§Y$MOD_SHIP_SENSOR_RANGE_ADD$§!:§G+2§!"
 wg_crisis_perk_lv4-1_active_effect:0 "§HФлагман испепеления§!§Y корпус§!§G+10%§!"
 wg_crisis_perk_lv4-1_desc:0 "Истина галактики — в дальнобойности пушек; сильный пожирает слабого — таков исконный закон. Мы возвысимся над всем и станем владыками галактики."
 wg_crisis_perk_lv4-1_name:0 "§HКапитальный корабль§!"
 wg_crisis_perk_lv4-1_passive_effect:0 "§YОткрывает класс кораблей§!:§H флагман испепеления§!"
 wg_crisis_perk_lv4-2_active_effect:0 "§HБоевой крейсер испепеления§!§Y уклонение§!§G+10%§!"
 wg_crisis_perk_lv4-2_desc:0 "Мы стали хитры и переменчивы, стремительны и свирепы; а добыча наша лишена даже выбора способа смерти."
 wg_crisis_perk_lv4-2_name:0 "§HАмфисбена§!"
 wg_crisis_perk_lv4-2_passive_effect:0 "§YОткрывает§! для§H боевого крейсера испепеления§!§Y новую секцию§!:§H «Амфисбена»§!"
 wg_crisis_perk_lv4-3_active_effect:0 "§Y$mod_ships_upkeep_mult$§!:§G -5%§!"
 wg_crisis_perk_lv4-3_desc:0 "Как гласит древность: войскам — поход, обозу — вперёд. Тылы — всегда сердце войны."
 wg_crisis_perk_lv4-3_name:0 "§HТыловое обеспечение§!"
 wg_crisis_perk_lv4-3_passive_effect:0 "§Y$mod_ships_upkeep_mult$§!:§G -15%§!"
 wg_crisis_perk_lv4-4_active_effect:0 "§Y$MOD_COUNTRY_MEGASTRUCTURE_BUILD_CAP_ADD$§!:§G+2§!"
 wg_crisis_perk_lv4-4_desc:0 "Нет ружья — нет пушки: враг всё смастерит. Куда это складывать? Приберите соседний склад с панталончиками — место и освободится."
 wg_crisis_perk_lv4-4_name:0 "§HСклад трофеев§!"
 wg_crisis_perk_lv4-4_passive_effect:0 "§Y$MOD_COUNTRY_RESOURCE_MAX_ADD$§!:§G+30000§!"
 wg_crisis_perk_lv5-1_active_effect:0 "§YПолучается технология§!:§H «Испепеляющий»§! (§Yскорость залпа§!§G+50%§! у «Гасителя солнц»)"
 wg_crisis_perk_lv5-1_desc:0 "Солнца догорят по нашей воле, обратившись в наш клинок, испепеляющий всё в галактике."
 wg_crisis_perk_lv5-1_name:0 "§HИспепеляющий§!"
 wg_crisis_perk_lv5-1_passive_effect:0 "§YОткрывает класс кораблей§!:§H божественное орудие испепеления§!"
 wg_crisis_perk_lv5-1_passive_effect_extra:0 "§YПолучается технология§!:§H «Гаситель солнц»§!"
 wg_crisis_perk_lv5-2_active_effect:0 "§HБоевой крейсер испепеления§!§Y корпус§!§G+10%§!"
 wg_crisis_perk_lv5-2_desc:0 "Забившиеся в угол старухи, трусы, что надеются отсидеться, — ваши замки рухнут, ваш конец настал!"
 wg_crisis_perk_lv5-2_name:0 "§HКрепкие корабли, могучие пушки§!"
 wg_crisis_perk_lv5-2_passive_effect:0 "§HБоевой крейсер испепеления§!§Y корпус§!§G+20%§!"
 wg_crisis_perk_lv5-3_active_effect:0 "§HФлагман испепеления§!§Y сопровождение§!§G+20%§!"
 wg_crisis_perk_lv5-3_desc:0 "Испокон веков живое благоговеет перед исполинами: встань у него на пути — и любые метания обратятся в прах."
 wg_crisis_perk_lv5-3_name:0 "§HИсполинские корабли§!"
 wg_crisis_perk_lv5-3_passive_effect:0 "§HФлагман испепеления§!§Y корпус§!§G+20%§!"
 wg_crisis_perk_lv5-4_active_effect:0 "§YСкорость строительства военных кораблей§!:§G+30%§!"
 wg_crisis_perk_lv5-4_desc:0 "Нет щита, что не рассечь, и крепости, что не взять. Наши пушки разнесут любую преграду на великом пути, а смельчаки будут погребены в руинах за нашей спиной."
 wg_crisis_perk_lv5-4_name:0 "§HНеудержимость§!"
 wg_crisis_perk_lv5-4_passive_effect:0 "§Y$MOD_SHIP_WEAPON_DAMAGE$§!:§G+50%§!"
 wg_crisis_perk_lv5-5_active_effect:0 "§YСкорость строительства военных кораблей§!:§G+30%§!"
 wg_crisis_perk_lv5-5_desc:0 "Когда наши флоты затмят сияние солнц, те, кто дерзнёт встать перед ними, познают своё невежество."
 wg_crisis_perk_lv5-5_name:0 "§HЗатмение солнц§!"
 wg_crisis_perk_lv5-5_passive_effect:0 "§Y$MOD_COUNTRY_NAVAL_CAP_ADD$§!:§G+30%§!"
