 EMPIRE_DESIGN_sh4:0 "Четвёртый флот Глубинных"
 EMPIRE_DESIGN_sh4_desc:0 "Флот Глубинных проиграл войну корабельным девам и был изгнан с родной планеты. После эвакуации главного ковчегного флота уцелевшие Глубинные собрали Четвёртый флот и едва ушли от преследования. В пути они непрерывно перестраивали свои ковчеги — подходящего нового дома они так и не нашли, но готовы к испытаниям звёздного моря."
 START_SCREEN_SH4:0 "Флот Глубинных проиграл войну корабельным девам и был изгнан с родной планеты. После эвакуации главного ковчегного флота уцелевшие Глубинные собрали Четвёртый флот и едва ушли от преследования. В пути они непрерывно перестраивали свои ковчеги — подходящего нового дома они так и не нашли, но готовы к испытаниям звёздного моря."
