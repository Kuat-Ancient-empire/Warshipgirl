 EMPIRE_DESIGN_wg1:0 "Межзвёздная корпорация MoeFantasy"
 EMPIRE_DESIGN_wg1_desc:0 "В войне против Глубинных корабельные девы показали поразительную боевую мощь.\n\nПосле долгих сражений они прорвали последнюю линию обороны Глубинных и полностью изгнали их с родной планеты. Уцелевшие адмиралы и корабельные девы образовали союз и взяли управление планетой в свои руки.\n\nВ конце XXII века корабельные девы, унаследовавшие дело человечества, открыли гиперпространственные маршруты и построили первый гипердвигатель. К 2200 году технология гипердвигателей была доведена до ума и получила широчайшее распространение. Корабельные девы устремили взор к звёздам — навстречу старым врагам, бежавшим в глубины космоса, и вызовам безбрежного неба."
 EMPIRE_DESIGN_wg2:0 "Торговая лига Порта"
 EMPIRE_DESIGN_wg2_desc:0 "После Последней битвы за Порт мы одержали окончательную победу, но родной мир был разрушен до основания.\nК счастью, Лавка Трофеев продала нам шанс: теперь наша цивилизация живёт на орбитальной станции обитания, некогда принадлежавшей Лавке. Но какова цена?"
 NAME_planet_super_harbor:0 "Супер-порт приписки"
 EMPIRE_DESIGN_wg3:0 "Федерация Великого Порта"
 EMPIRE_DESIGN_wg3_desc:0 "Уничтожив последних врагов, не принявших идеологию корабледевизма, мы наконец объединили родной мир и построили идеальное демократическое общество — Великий Порт.\nТеперь мы должны принести ветер корабледевизма в каждый мир и освободить всю галактику!"
 EMPIRE_DESIGN_sh1:0 "Флот Глубинных"
 EMPIRE_DESIGN_sh1_desc:0 "Флот Глубинных проиграл войну корабельным девам и был изгнан с родной планеты. После долгих скитаний они добрались до нового дома — здесь всё начнётся заново."
 NAME_planet_parit:0 "Парит"
 EMPIRE_DESIGN_sh2:0 "Империя Парит"
 EMPIRE_DESIGN_sh2_desc:0 "Столетия назад Парит был райским миром: наши предки беззаботно пользовались бесконечными ресурсами чудесных сооружений, но наши глупые игры погубили всё это.\nПеред лицом ухудшающейся среды нам пришлось вновь объединиться, и лишь труд нескольких поколений повернул вспять нашу судьбу.\nТеперь мы снова устремимся к звёздам — и найдём ответ на вопрос, который задаём себе всегда: кто мы?"
 EMPIRE_DESIGN_sh3:0 "Флот Аннигиляции"
 EMPIRE_DESIGN_sh3_desc:0 "В галактике, полной опасностей, мы не верим никому, кроме флота Глубинных. Лишь уничтожение всех чужаков способно гарантировать его безопасность."
 START_SCREEN_WSG2:0 "После Последней битвы за Порт мы одержали окончательную победу, но родной мир был разрушен до основания.\nК счастью, Лавка Трофеев продала нам шанс: теперь наша цивилизация живёт на орбитальной станции обитания, некогда принадлежавшей Лавке. Но какова цена?"
 START_SCREEN_WSG3:0 "Уничтожив последних врагов, не принявших идеологию корабледевизма, мы наконец объединили родной мир и построили идеальное демократическое общество — Великий Порт.\nТеперь мы должны принести ветер корабледевизма в каждый мир и освободить всю галактику!"
