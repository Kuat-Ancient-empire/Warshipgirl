l_russian:

 civic_wgvictoria:0 "Инструктор «Викториес»"
 civic_wgvictoria_desc:0 "Под наставничеством «Викториес» наша военная мощь выросла многократно.\n\nОткрывает особое здание §HКазармы «Викториес»§!"
 civic_wgella:0 "Исполнительный директор Элла"
 civic_wgella_desc:0 "С Эллой в управлении корпорацией наша администрация, производство и логистика вышли на невиданный уровень.\n\nОткрывает особое здание §HРезиденция губернатора Эллы§!\nЕсли взять как стартовую гражданскую особенность — §HЭлла станет губернатором§!"
 civic_wgaurora:0 "Главный учёный Аврора"
 civic_wgaurora_desc:0 "Под руководством госпожи Авроры эффективность наших научных команд выросла невероятно.\n\nОткрывает особое здание §HУниверситетский городок «Аврора»§!"
 civic_wgelves:0 "Портовые строительные феи"
 civic_wgelves_desc:0 "Строительные феи радикально ускоряют возведение наших зданий.\n\nОткрывает особое здание §HОбщежитие строительных фей§!"
 auth_warshipgirls:0 "Лига корабельных дев"
 auth_warshipgirls_desc:0 "Корабельные девы каждого региона выбирают представителя в союзный совет, а совет выбирает флагмана. Варп-коммуникационные модули в ригингах обеспечивают этой процедуре скорость и чёткость."
 civic_wg_knight:0 "Рыцарский орден корабельных дев"
 civic_wg_knight_desc:0 "Рыцарство — извечная традиция нашей цивилизации: множество корабельных дев видят целью жизни стать рыцарем славы ради. И этот древний обычай, и его дух продолжат сиять и в эпоху звёзд."
 civic_tooltip_wg_knight_effects:0 "На всех планетах добавляются должности £job_knight_commander£§Hгроссмейстер-корабельная дева§!, £job_knight£§Hрыцарь-корабельная дева§! и £job_squire£§Hоруженосец§!\nПозволяет планетарное решение §HРыцарский долг§! для рыцарской специализации\nПозволяет строить орденские здания, добавляющие должности £job_knight£§Hрыцарь-корабельная дева§! и £job_squire£§Hоруженосец§!"
 civic_sunflower:0 "Подсолнуховая церковь"
 civic_sunflower_desc:0 "Подсолнухи занимают в нашей цивилизации особое место: тысячелетиями род подсолнухов живёт с нами в мире и взаимном выигрыше. Ныне жрецы могут сжигать подсолнухов и выжимать из них сок, угождая божеству ради благословения."
 civic_tooltip_sunflower_effects:0 "В начале игры несколько §Hподсолнухов§!\nОткрывает особое здание §HХрам Подсолнухов§!\nПринося подсолнухов в жертву, планета получает бонус §G(до 10 уровней)§!"
 gov_wsg_country:0 "Лига советов"
 gov_wsg_country_desc:0 "Выборы раз в 500 лет; фракций не возникает"
 gov_wsg_country_spiritualist:0 "Священный Порт"
 gov_wsg_country_spiritualist_desc:0 "Вера и сила духа — броня и главное оружие этой цивилизации корабельных дев."
 gov_wsg_country_sunflower:0 "§YПодсолнуховая церковь§!"
 gov_wsg_country_sunflower_desc:0 "Выгодное сотрудничество этой цивилизации корабельных дев с родом подсолнухов длится уже тысячу лет — и этот гармоничный союз продолжит укрепляться."
 gov_wsg_country_militarist:0 "Военный Порт"
 gov_wsg_country_militarist_desc:0 "Полностью милитаризованное правительство корабельных дев: что решается корабельными орудиями — то и не проблема."
 gov_wsg_country_authoritarian:0 "Верховный совет Порта"
 gov_wsg_country_authoritarian_desc:0 "Строй корабельных дев, где выше всего эффективность."
 gov_wsg_country_xenophob:0 "Комитет чистоты Порта"
 gov_wsg_country_xenophob_desc:0 "Чистота вида корабельных дев превыше всего: чужаков они, возможно, и стерпят в своих мирах — но строго под контролем."
 gov_wsg_country_egalitarian:0 "Утопический Порт"
 gov_wsg_country_egalitarian_desc:0 "Порт всеобщего равенства — утопия, идеально сбалансировавшая личную свободу и долг перед обществом. Коррупция практически искоренена."
 gov_wsg_country_xenophile:0 "Галактический маяк"
 gov_wsg_country_xenophile_desc:0 "Правительство корабельных дев с блестящим дипломатическим опытом, готовое выслушать любой голос."
 gov_wsg_country_pacifist:0 "Мирный Порт"
 gov_wsg_country_pacifist_desc:0 "Вместо пламени и грохота эта цивилизация корабельных дев выбирает мир и покой."
 gov_wsg_country_materialist:0 "Порт истины"
 gov_wsg_country_materialist_desc:0 "В погоне за истиной и наукой это материалистическое правительство корабельных дев разгонит все тучи над башней науки."
 gov_wsg_country_communism:0 "§RКоммунистический Порт§!"
 gov_wsg_country_communism_desc:0 "Порт без классов, эксплуатации и угнетения — Порт, добившийся собственного освобождения."
 gov_wsg_country_super_harbor:0 "§BСупер-Порт§!"
 gov_wsg_country_super_harbor_desc:0 "Крайность, держащая внутреннюю стабильность бесконечными войнами: почти все граждане — фанатичные милитаристы."
 gov_wsg_country_knight:0 "§EРыцарский орден корабельных дев§!"
 gov_wsg_country_knight_desc:0 "Общество корабельных дев, где стать рыцарем — высшая честь."
 gov_wsg_country_sunflower_knight:0 "§YПодсолнуховый рыцарский орден§!"
 gov_wsg_country_sunflower_knight_desc:0 "Рыцарство и жертвоприношение подсолнухов — два столпа этого общества корабельных дев"
 civic_wsg_super_harbor_secondary_desc:0 "§BСупер-Порт — наш дом. Процветание, освобождение, корабледевизм — наш путь жизни.\nНо это не данность.\nНет! Наше дело освобождения! НЕТ!!!\n--------------ВТОРЖЕНИЕ------------\nХа-ха, знакомые кадры?\nТакое прямо сейчас происходит по всей галактике — следующим можешь стать ты.\nЕсли только не примешь самое важное решение в своей жизни.\nДокажи всем, что у тебя есть сила и смелость искать свободу, — встань на защиту семьи!\nВступай в адские корабельные девы!\nСтань элитой, хранящей мир во вселенной.\nУзри диковинные новые формы жизни.\nДонеси ветер корабледевизма до всей галактики.\nСтань героем!\nСтань легендой!\nСтань адской корабельной девой§!\n\nСупер-Порту нужны §Rвраги§! для внутренней стабильности; нет врага — §Rсоздадим его! §!"
 civic_wsg_super_harbor_first_desc:0 "§BСупер-Порт — наш дом. Процветание, открытость и корабледевизм — вот наш образ жизни. Но это не данность: молодой и старый обязаны защищать наш дом, нашу цивилизацию — и наши трусики. Прими важнейшее решение своей жизни, встань на защиту семьи, докажи, что у тебя есть мужество и сила добиться освобождения! Вступай в адские корабельные девы! Странствуй по галактике, посещай владения, встречай необыкновенных личностей от имени Порта. Чтобы сохранить наш образ жизни и создать будущее Супер-Порта — иди в походы, разноси ветер корабледевизма по всей галактике. Превзойди себя — стань героем, стань… легендой! §!\n\nСупер-Порту нужны §Rвраги§! для внутренней стабильности; нет врага — §Rсоздадим его! §!"
 civic_wsg_super_harbor:0 "Супер-Порт"
 civic_wsg_super_harbor_desc:0 "$civic_wsg_super_harbor_secondary_desc$"
 civic_tooltip_super_harbor_effects:0 "Войны дают дополнительные §Hбонусы§!, мир — §Rштрафы§!\n§RОтношения инопланетных империй опустятся до нуля§!\nНедоступны вознесения: §R«Лазурный мираж» и «Галактический маяк»§!\nДоступна тотальная война: §Hкорабледевизм§!\nОсобая армия: §Hадские корабельные девы§!\nФлотмейстеры и генералы получают §Hособые черты§!\nПри наличии §Y«модели корабля Объединённого флота»§! в поздней игре открывается особый корабль: §Hсуперэсминец§!"
 casus_belli_wsg_super_harbor:0 "Корабледевизм"
 war_goal_wsg_super_harbor_total_war:0 "Тотальная война"
 war_goal_wsg_super_harbor_total_war_desc:0 "§WМы обязаны освободить всю галактику и разнести ветер корабледевизма по всем мирам. Эти еретики будут считаться врагами Супер-Порта, а повод… §!\n§YПередовые технологии, не разделяемые с Супер-Портом; незаконное владение оружием массового поражения; вид после смерти превращается в нефть… сойдёт любой§!"
 casus_belli_wsg_super_harbor2:0 "Сдерживание угрозы"
 war_goal_wsg_super_harbor_total_war2:0 "Тотальная война"
 war_goal_wsg_super_harbor_total_war2_desc:0 "§WЭтих безумцев войны мы обязаны уничтожить§!"
 leader_trait_admiral_wg_super_harbor:0 "Флотмейстер Супер-Порта"
 leader_trait_admiral_wg_super_harbor_desc:0 "Флотмейстеры Супер-Порта — фанатичные адепты корабледевизма с виртуозной боевой техникой и отточенным мастерством орбитальной бомбардировки."
 leader_trait_general_wg_super_harbor:0 "Генерал Супер-Порта"
 leader_trait_general_wg_super_harbor_desc:0 "Генералы Супер-Порта — фанатичные адепты корабледевизма, поклявшиеся водрузить знамя Супер-Порта на каждом мире."
 civic_wsg_drg:0 "Корпорация «Глубинная Скала»"
 civic_wsg_drg_desc:0 "Корпорация «Глубинная Скала» — крупнейшая компания государства в глубоком космическом промысле. Она нанимает низкорослых эсминцев-корабельных дев с §Gзависимостью от кофе/пива/напитков§! и отправляет их добывать породу на планеты.\nИх лозунг: §YGold and mushroom!§!"
 civic_tooltip_wsg_drg_effects:0 "Мегаструктура §Rшахтная станция на астероиде§! будет §Gзаменена§! на §Yстанцию корпорации «Глубинная Скала»§!, доступную с начала игры\nИзучив технологии £exotic_gases£ $exotic_gases$, £rare_crystals£ $rare_crystals$ и £volatile_motes£ $volatile_motes$, §Yстанция корпорации§! сможет добывать эти редкие ресурсы\nС вознесением $ap_wsg_station$ выработка §Yстанции корпорации§! дополнительно вырастет.\nЕсли стартовая система — §Bпорт приписки§!, в начале игры будет станция §Yкорпорации «Глубинная Скала»§!"
 auth_shenhai:0 "Строй флота Глубинных"
 auth_shenhai_desc:0 "Отбор из старших членов Глубинных: флот всегда под рукой сильнейшей из глубинных корабельных дев."
 gov_sh_country:0 "Лордство Глубинных"
 gov_sh_country_desc:0 "Выборы раз в 5000 лет; фракций не возникает"
 gov_sh2_country:0 "§RРежим Флота Аннигиляции§!"
 gov_sh2_country_desc:0 "Появление Флота Аннигиляции знаменует: этот флот Глубинных окончательно отбросил лишние чувства и войной со смертью ответит еретикам, некогда причинившим им боль."
 civic_yamato:0 "Флагман флота Ямато"
 civic_yamato_desc:0 "Ямато — сильнейший линкор флота Глубинных с богатейшим опытом командования; она трудолюбива и не чурается переработок — все глубинные девы гордятся «яматозацией»."
 civic_yaosai:0 "Принцесса-Крепость"
 civic_yaosai_desc:0 "У Принцессы-Крепости колоссальный опыт возведения звёздных крепостей: она усиливает наши звёздные базы и заодно оптимизирует диспетчеризацию флотов. (§HОткрывает технологию: ингибитор сверхсвета§!)"
 civic_eat_and_drink:0 "Акаги и Кага"
 civic_eat_and_drink_desc:0 "В последней битве с корабельными девами Акаги и Кага шли ко дну снова и снова — и каждый раз упрямо продолжали бой. Их дух мы не забудем никогда."
 mod_planet_physicists_unity_produces_add:0 "£unity£ $unity$ с каждой $pop_group_unit$$job_physicist_plural_with_icon$"
 mod_planet_biologists_unity_produces_add:0 "£unity£ $unity$ с каждой $pop_group_unit$$job_biologist_plural_with_icon$"
 mod_planet_engineers_unity_produces_add:0 "£unity£ $unity$ с каждой $pop_group_unit$$job_engineer_plural_with_icon$"
 civic_BOSSAP:0 "Транспорт снабжения «Большая Боссиха»"
 civic_BOSSAP_desc:0 "В обществе Глубинных, где превыше всего сила, не-боевые корабли, уважаемые всеми, — редкость. «Большая Боссиха» — из таких."
 civic_CM:0 "Флот Аннигиляции"
 civic_CM_desc:0 "За долгие скитания флот Глубинных не раз сталкивался с чужеродными угрозами и едва не погиб. Глубинные поняли: право на жизнь им даст лишь полный распад всех еретиков, способных угрожать флоту."
 civic_sh_criminal_syndicate:0 "Ниспровергатели"
 civic_sh_criminal_syndicate_desc:0 "Этот особый орган флота Глубинных любыми средствами подтачивает врагов изнутри."
 civic_tooltip_sh_criminal_syndicate_effects:0 "Позволяет открывать §Yфилиалы§! на планетах империй, с которыми нет войны или перемирия\nПреступность на планетах с §Yфилиалами§! повышает ценность филиала\nДоступны особые повышающие преступность £building£ §Y$BRANCH_OFFICE_BUILDINGS$§!"
 opinion_sh_criminal_syndicate:0 "Криминальные ниспровергатели"
 civic_tooltip_CM_effects:0 "§YПродвинутый нейронный координатор Глубинных открыт с начала игры§!\n§RОтношения инопланетных империй опустятся до нуля§!\n§RНедоступно вознесение «Вскрывшие лёд»§!\n§HДоступна тотальная война: «Молчание»§!\nПри чистке органического £pop£ населения даёт £sr_pantsu£ §Yтрусики§!\nОсобый корабль: §Hрейдерский линкор§!"
 civic_AP_NET:0 "Передовая сеть снабжения"
 civic_AP_NET_desc:0 "Труд кораблей снабжения соткал исполинскую логистическую сеть: они собирают рассеянные ресурсы из каждого уголка наших миров и перерабатывают их для любой промышленности."
 civic_tooltip_AP_NET_effects:0 "-$job_sh_AP_NET_manager_effect_desc$"
 job_sh_AP_NET_manager:0 "Администратор сети снабжения"
 mod_job_sh_AP_NET_manager_add:0 "Должность: администратор сети снабжения"
 job_sh_AP_NET_manager_plural:0 "Должность: администратор сети снабжения"
 job_sh_AP_NET_manager_cap:0 "$job_sh_AP_NET_manager$"
 job_sh_AP_NET_manager_effect_desc:0 "£job_sh_AP_NET_manager£ $job_sh_AP_NET_manager_plural$ превращают £food£ §Y$food$§! в £consumer_goods£ §Y$consumer_goods$§! и £sr_pantsu£ £exotic_gases£ £volatile_motes£ £rare_crystals£— всевозможные редкие ресурсы."
 job_sh_AP_NET_manager_desc:0 "Администраторы сети снабжения распределяют её дополнительные ресурсы — и угощают этих милашек конфетами."
 mod_job_sh_AP_NET_manager_per_pop:0 "На каждые $VALUE$ населения §G+1§! профессия $job_sh_AP_NET_manager$"
 gov_sh_country_spiritualist:0 "Святой двор Глубинных"
 gov_sh_country_spiritualist_desc:0 "Священная связь соединяет каждую глубинную деву этой страны; ради искоренения еретиков, чуждых идеям флота Глубинных, они не пожалеют ничего."
 gov_sh_country_militarist:0 "Строй военного флота"
 gov_sh_country_militarist_desc:0 "Флот Глубинных рождён для войны и войной завоюет жизненное пространство."
 gov_sh_country_authoritarian:0 "Строй единовластия флота"
 gov_sh_country_authoritarian_desc:0 "Старшие члены этого флота Глубинных властны больше прочих, и с чужаками они обычно обходятся куда жесточе."
 gov_sh_country_xenophob:0 "Кроваво-клинковый строй флота"
 gov_sh_country_xenophob_desc:0 "Крайне ксенофобские Глубинные обычно несут за плечами кровавую историю: она сделала их безжалостными. Для чужаков в их мире смерть, пожалуй, — избавление."
 gov_sh_country_xenophile:0 "Строй флотского братства"
 gov_sh_country_xenophile_desc:0 "Редкое умонастроение для флота Глубинных — но война для них всё ещё вариант."
 gov_sh_country_materialist:0 "Научный совет Глубинных"
 gov_sh_country_materialist_desc:0 "Война двигает науку, наука двигает армию — этот флот Глубинных на обоих этих колёсах и растёт."
 gov_sh_criminal_syndicate_country:0 "Ниспровергатели"
 gov_sh_criminal_syndicate_country_desc:0 "Это государство корабельных дев будет грязными методами подтачивать врагов изнутри."
 gov_sh_country_knight:0 "§EРыцарский орден Глубинных§!"
 gov_sh_country_knight_desc:0 "Стать рыцарем — честь для этого общества глубинных корабельных дев."
