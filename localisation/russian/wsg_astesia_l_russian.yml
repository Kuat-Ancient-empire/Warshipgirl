l_russian:

 wg_astesia:0 "Астесия"
 already_has_wg_astesia_diplo:0 "Окно диалога с Астесией уже открыто"
 wg_menu_wg_astesia_commu_button_tooltip:0 "Открыть окно связи с §BАстесией§!"
 wg_astesia.1.title:0 "Астесия"
 wg_astesia.1.desc:0 "Теперь вы можете общаться с Астесией через дипломатический интерфейс.\nДружеское напоминание: привязанность Астесии §Hне растёт сама§! — взаимодействуйте в меню общения, открывая события и §Hновые возможности§!"
 wg_astesia.1.a:0 "Отлично."
 wg_astesia.2.title:0 "Бегство Астесии"
 wg_astesia.2.desc:0 "На очередном обслуживании Астесия затребовала часть материалов, объявив о капитальном ремонте и попросив научный персонал временно покинуть станцию, — а вскоре запустила прыжковый двигатель. Одновременно наш канал передачи с ней был в одностороннем порядке закрыт.\nРазведка не может вычислить точку прыжка: бегство готовилось заранее."
 wg_astesia.2.a:0 "Чёрт. Пусть только не попадётся нам снова."
 wg_astesia.2.a.tooltip:0 "\n§YМалышка Астесия, войдя и завидев ваши истребительные идеи / «Молчание» / «стать кризисом», вскрикнула «караул!», подумала, что при задержании почки отберут — и задала стрекача. §!"
 wg_astesia.10.title:0 "Гаснущий свет звезды"
 wg_astesia.10.desc.a:0 "Горестная весть: в только что отгремевшем бою мобильный научный узел Астесии уничтожен огнём врага; детонировавший реактор разнёс узел в клочья, вычислительные массивы, что были Астесией, разрушены безвозвратно. Мы потеряли её навсегда."
 wg_astesia.10.desc.b:0 "Горестная весть: в только что отгремевшем бою мобильный научный узел, что носил в себе Астесию, уничтожен огнём врага; детонировавший реактор разнёс узел в клочья. К счастью, Астесия больше не ИИ, привязанный к станции, — она уцелела."
 wg_astesia.10.a:0 "Чёрт!"
 wg_astesia.10.b:0 "Счастье в несчастье."
 wg_astesia.3.a:0 "Госпожа Астесия, нужна ли помощь?"
 wg_astesia.3.b:0 "Поболтать с Астесией"
 wg_astesia.3.c:0 "§HНавестить Астесию§!"
 wg_astesia.3.d:0 "§HСвидание с Астесией§!"
 wg_astesia_affection_show_lv1:0 "Привязанность: [wg_astesia_own_country.wg_astesia_affection] / 10"
 wg_astesia_affection_show_lv2:0 "Привязанность: [wg_astesia_own_country.wg_astesia_affection] / 25"
 wg_astesia_affection_show_lv3:0 "Привязанность: [wg_astesia_own_country.wg_astesia_affection] / 50"
 wg_astesia_affection_show_lv4:0 "Привязанность: [wg_astesia_own_country.wg_astesia_affection] / 150"
 wg_astesia_affection_show_lv5:0 "Привязанность: [wg_astesia_own_country.wg_astesia_affection] / 200"
 already_has_wg_astesia_diplo:0 "Окно диалога с Астесией уже открыто"
 wg_astesia.3.desc.1:0 "Связь установлена. Адмирал, ваши приказы?"
 wg_astesia.3.desc.2:0 "Рабочий процесс составлен — буду аккуратно исполнять."
 wg_astesia.3.desc.3:0 "А, доброе утро, адмирал. Научный отчёт, что я вам отправила — уже посмотрели?"
 wg_astesia.3.desc.4:0 "Группы 13, 74, 187 — стоп; 66-я и 67-я пересобираются на переменных 42-й, ставим контрольную… Э? Вызов? Уже открыли? Кхм-кхм, адмирал, чем могу?"
 wg_astesia.3.desc.5:0 "Пусть тело уже и не человеческое — звёзды всё так же отвечают мне…"
 wg_astesia.3.desc.6:0 "Звёзды сияют на небе, свидетельствуя о прошлом."
 wg_astesia.3.desc.7:0 "Читать весть настоящего и грядущего в расположении звёзд — это и есть астрология. Возможно, это не совсем гадание — но итог неизменен. Так что… не хотите попробовать? Бесплатно."
 wg_astesia.3.desc.8:0 "Ночь всегда кончается, и звёзды однажды закатятся; если это конец всего — стоит заняться чем-то важным. Например? Хм-м… адмирал, вы не против, если я буду будить вас каждое утро?"
 wg_astesia.3.desc.9:0 "Наблюдать за светилами каждый день — шея так затекает… Уф, новое тело — а старые боли заново. Может, у коллег из медслужбы есть средство…"
 wg_astesia.3.desc.10:0 "Чай уже готов — отдохните… Адмирал, приглашение девушки отклонять нельзя~"
 wg_astesia.3.desc.11:0 "Адмирал, я всегда буду рядом — отныне и до заката звёзд."
 wg_astesia.3.desc.12:0 "Прошлое стало историей; адмирал, давайте вместе напишем в галактике новую главу."
 wg_astesia.3.desc.13:0 "Адмирал, я знаю, что вы у меня за спиной — на работе хулиганствовать нельзя~"
 wg_astesia_talk_return:0 "Назад"
 wg_astesia_talk_exit:0 "Выход"
 leader_trait_scientist_astesia:0 "Астрология"
 leader_trait_scientist_astesia_desc:0 "Астрология Астесии странным образом сплетается с её могучей псионикой — так, что ей приоткрываются будущее и истина; это неоценимо в исследованиях, археологии и разведке."
 leader_trait_scientist_eddy:0 "Исследовательница Эндории"
 leader_trait_scientist_eddy_desc:0 "Астесия была экспертом по вооружениям Эндорийской империи — оружейные исследования даются ей играючи."
 wg_astesia_backstory:0 "Астесия — астролог с далёкой планеты по имени Терра; после долгих скитаний она наконец отыскала вас на берегу реки времени.\n\nНа обоих концах телескопа — ярчайшие звёзды этой вселенной."
 wg_astesia.5.desc.1:0 "Узел в порядке, спасибо за заботу, господин адмирал."
 wg_astesia.5.desc.2:0 "Прыжковый двигатель слегка барахлит; не волнуйтесь, ремонтные роботы уже возятся."
 wg_astesia.5.desc.3:0 "Может, добавить пару исследовательских модулей? Хм… а места-то уже нет."
 wg_astesia.5.desc.4:0 "Дай подумать, расположение установок… Мм, всё в порядке — ничего странного не привлечёт."
 wg_astesia.5.a:0 "Ага."
 wg_astesia.100.title:0 "Молчаливая Астесия"
 wg_astesia.100.desc:0 "Прошёл год, как мы восстановили Астесию; её вклад в науку империи у всех на виду. Но, по словам работающих с ней коллег, кроме необходимого по работе она почти ни с кем не общается: чаще сидит на верхней наблюдательной площадке и тихо глядит на звёзды.\n\nОткрыт новый пункт в окне связи: §HНавестить Астесию§!"
 wg_astesia.100.a:0 "Пожалуй, стоит наведаться к этой самоотверженной госпоже Астесии."
 wg_astesia.100.a.desc:0 "В окне связи открыт новый пункт: §HНавестить Астесию§!"
 wg_astesia.100.b:0 "§RНе будем ей мешать. §!"
 wg_astesia.100.b.desc:0 "§RЗавершить цепочку событий Астесии§!"
 wg_astesia.101.title:0 "Визит к Астесии"
 wg_astesia.101.desc:0 "Вы прибыли в научный узел Астесии; учёные империи встретили вас на удивление тепло, и под их напористым сопровождением пришлось сперва отправиться на экскурсию по текущим исследованиям.\nКогда формальности закончились, вы, так и не решившись связаться с ней напрямую, долго бродили — но знакомого голубого голопрофиля нигде не было.\nМинуты утекали, вы начали тревожиться. Проходивший мимо исследователь посоветовал заглянуть в верхнюю обсерваторию: возможно, госпожа Астесия там."
 wg_astesia.101.a:0 "Иду немедленно"
 wg_astesia.102.desc:0 "Лифт поднял вас в обсерваторию на вершине узла: вокруг по строгим стандартам выстроились точнейшие астроприборы.\nОсторожно обходя их, вы двинулись вперёд и наконец нашли знакомую девушку — под гигантским телескопом в центре.\nСвет звёзд мягко лился сквозь прозрачный купол. Синеволосая девушка сидела боком у телескопа и тихо глядела в небо.\nВам не хватило духу разбить эту тишину — вы молча встали за её спиной. Двое под звёздами, вместе чувствуя глубину и бездонность космоса.\n«… Господин адмирал?»\nВы очнулись — Астесия уже обернулась и тихо смотрела на вас.\nВы мягко улыбнулись и сели рядом."
 wg_astesia.102.a:0 "Освоились ли вы тут? Нет ли чего-нибудь неудобного?"
 wg_astesia.103.desc:0 "«Нет, все здесь ко мне очень добры — и в быту, и в работе…»\nАстесия словно хотела что-то добавить, но обернулась к вам.\nВы почувствовали спрятанную в глубине её сердца тревогу и, замолчав, спокойно смотрели, ожидая ответа.\nПод вашим мягким взглядом она долго колебалась и наконец чуть робко произнесла: «Мне немного страшно…»"
 wg_astesia.103.a:0 "Что случилось?"
 wg_astesia.104.desc:0 "Астесия опустила голову: «Учиться и исследовать со всеми — по-настоящему радостно. Но я всё время невольно вспоминаю Эндорию: тогда все тоже вот так, как сейчас, изо всех сил шли к одной цели… а в конце они все…»\nАстесия замолчала; в глазах блеснули слёзы."
 wg_astesia.104.a:0 "Всё это уже в прошлом"
 wg_astesia.105.desc:0 "Астесия молчала; среди такой тяжёлой скорби любые заготовленные слова казались бледными.\nВы открыли рот, пытаясь смягчить, — но она перебила: ей хочется побыть одной.\nВы уважали её желание и тихо покинули это место, залитое звёздным светом."
 wg_astesia.105.a:0 "Так дело не пойдёт — будем почаще с ней разговаривать."
 wg_astesia.106.title:0 "Тревога об Астесии"
 wg_astesia.106.desc:0 "После того случая вы несколько раз обсуждали состояние Астесии с психологами империи. Узнав, к чему подобное может привести, вы стали тревожиться за неё ещё сильнее."
 wg_astesia.106.a:0 "Пора действовать"
 wg_astesia.106.a.desc:0 "В окне связи доступен пункт «Навестить Астесию»\n§YПримечание: интервал между визитами — 4 месяца. §!"
 wg_astesia.107.desc:0 "Вы с Астесией пришли в биолабораторию, где содержат диковинных существ со всех планет: одни огромны и жутки, другие мелки и смирны. Астесия рядом поясняет каждое.\nВо время осмотра ваше внимание привлёк зелёный круглый организм, похожий на буханку хлеба. Свернувшись в шарик, он выглядит неожиданно мило. На экране рядом — «введён седатив».\nВы взяли его в руки: на удивление тёплый."
 wg_astesia.107.a:0 "Астесия, а это что?"
 wg_astesia.108.desc:0 "Услышав вас, Астесия обернулась — и, разом побледнев, бросилась велеть выбросить его. Но поздно: в одно мгновение организм начал резко разбухать, выделяя чудовищное тепло, — и с грохотом лопнул, оставив вас чёрным от золы с головы до ног.\nГлядя на ваше перепачканное лицо, Астесия не сдержала смеха. Всё же она героически удержалась и со серьёзным видом отчитала вас за нарушение правил лаборатории."
 wg_astesia.108.a:0 "Э-э-э… а полотенце где?"
 wg_astesia.108.a.desc:0 "Привязанность Астесии выросла"
 wg_astesia.110.desc:0 "Вы пришли в физический институт империи и с порога упёрлись взглядом в исполинский коллайдер. Там Астесия с несколькими учёными вела испытания и снимала данные. Не желая мешать, вы тихо сели в сторонке. В работе Астесия куда собраннее обычного: она виртуозно управляет машинами и так запальчиво-увлечена, что забывает следить за своей проекцией. Машины снуют туда-сюда, то и дело проходя сквозь голограмму Астесии, а сама проекция стоит столбом — сцена выходит до крайности уморительная.\nСпустя вечность Астесия закончила дела, заметила вас в углу, поспешно сохранила данные и подвела проекцию к вам.\n«А, когда вы пришли, адмирал? Хотите взглянуть на данные опыта?»"
 wg_astesia.110.a:0 "Взять планшет"
 wg_astesia.111.desc:0 "Глядя, как вы старательно делаете вид, что понимаете данные, Астесия сдалась и с улыбкой взяла планшет, поясняя каждый показатель…"
 wg_astesia.111.a:0 "Интеллект +10"
 wg_astesia.111.a.desc:0 "Привязанность Астесии выросла"
 wg_astesia.113.desc:0 "Вы добрались до самого сердца научного узла — Инженерной академии.\nВнутри — скорее исполинский завод, чем лаборатория: гудят станки, стройные стаи вспомогательных дронов снуют по каждому зазору и проходу, перевозя партии грузов — зрелище величественное.\nТут ваше внимание привлекла показавшаяся смутно знакомой роботизированная линия.\n«А, это линия, где я строю своих роботов — все, что вы видите под моим управлением, рождаются здесь», — Астесия поясняет рядом, и фигура девушки плывёт сквозь потоки дронов."
 wg_astesia.113.a:0 "Астесия… есть ли способ вернуть тебе тело?"
 wg_astesia.114.desc:0 "Фигура девушки вдруг остановилась; вы увидели, как её голопроекция слегка дрожит.\n«Это… пока… лучше не надо».\nЛицо Астесии помрачнело."
 wg_astesia.114.a:0 "Вы мудро не стали развивать тему — лишь про себя что-то затеяли"
 wg_astesia.114.a.desc:0 "Привязанность Астесии выросла"
 wg_astesia.115.title:0 "Приглашение Астесии"
 wg_astesia.115.desc:0 "Сегодня, едва войдя в свой кабинет, вы получили «электронное» письмо: вас приглашают в обсерваторию; подпись — Астесия."
 wg_astesia.115.a:0 "Рад отправиться"
 wg_astesia.116.desc:0 "Вы пришли вовремя — в огромной обсерватории ни души. Астесия поманила вас.\nВы встали перед ней; она, одна за другой, погасила огни обсерватории и сказала:\n«Адмирал… не хотите попробовать астрологию?»"
 wg_astesia.116.a:0 "Астрология? Это же лженаука?"
 wg_astesia.117.desc:0 "«Адмирал, знаете ли… я на самом деле не эндорийка… Память о тех временах почти стёрлась, но кое-какие странные способности остались — похожи на псионику, но иные. Я владею ими и сейчас; я назвала их астрологией».\n«Адмирал, попробуем?» — в глазах Астесии столько надежды."
 wg_astesia.117.a:0 "Вы протянули руку и, следуя её просьбе, закрыли глаза."
 wg_astesia.118.desc:0 "Из тьмы проступила нить лазурного света; затем вокруг развернулось звёздное небо. Вы невольно шагнули вперёд — планета за планетой возникали перед вами и растворялись без следа.\nСмутно чувствуя, что ищете нечто, вы шли дальше: видели ослепительные сверхновые и зияюще-страшные чёрные дыры, и многое, многое совсем уже неописуемое.\nНаконец всё осталось позади, и в безбрежной тьме перед вами повисла лазурная светящаяся лента — мягкая, тонкая, и, словно, вмещающая целое небо звёзд.\nИзнутри поднялась радость: это то, что вы искали.\nВы подошли и взялись за неё.\n«Ай!» — короткий вскрик заставил вас открыть глаза.\nК удивлению, вы всё там же, на месте.\nАстесия стоит перед вами, закрыв лицо, явно растерявшись."
 wg_astesia.118.a:0 "Вы в порядке? Я что-то сделал не так?"
 wg_astesia.119.desc:0 "Астесия слегка порозовела; на словах «всё нормально» — но смятения на лице не скрыть."
 wg_astesia.119.a:0 "А гадание удалось? Кстати, я ведь так и не спросил, что именно гадали."
 wg_astesia.120.desc:0 "«Удалось… н-н-нет, ничего не удалось!» — румянец Астесии стал гуще, она затрясла головой.\nПотом словно вспомнив что-то, выпалила: «Я… я пойду анализировать результат, а вы возвращайтесь отдыхать! Да, возвращайтесь, мне ещё долго».\nОна в панике отменила проекцию, и достучаться больше не вышло — придётся вернуться."
 wg_astesia.120.a:0 "Ну и любопытно же, что она там нагадала."
 wg_astesia.120.a.desc:0 "Однако Астесия больше никогда не вспоминала то гадание."
 wg_astesia.122.title:0 "Прорыв в синтетике"
 wg_astesia.122.desc:0 "С новым научным прорывом империи наши учёные наконец раскрыли тайну сознания и тела.\nВозможно, пора изготовить для Астесии настоящее тело."
 wg_astesia.122.a:0 "Скорее сообщить Астесии хорошую новость."
 wg_astesia.123.desc:0 "«Воссоздать тело? Я… пожалуй, не стоит, мне и так хорошо» — Астесия колеблется."
 wg_astesia.123.a:0 "Скоро вечерний приём; если возможно, госпожа Астесия, составите мне компанию?"
 wg_astesia.124.desc:0 "Астесия мялась очень долго, но ваша осада взяла своё — она согласилась."
 wg_astesia.124.a:0 "Уведомить лучших портных империи: закажу лучшее платье"
 wg_astesia.125.desc:0 "Тело, стопроцентно воссозданное по данным Астесии лучшими специалистами империи, доставлено в научный узел.\nВсе проверки пройдены. §HПора§!"
 wg_astesia.125.a:0 "Начинаем"
 wg_astesia.126.title:0 "Астесия не смогла"
 wg_astesia.126.desc:0 "Все каналы передачи открыты, но Астесия §Rне может§! загрузить сознание в новое тело.\nПосле множества попыток без единого сдвига вы вынуждены объявить приостановку проекта."
 wg_astesia.126.a:0 "Любыми средствами найти проблему."
 wg_astesia.126.a.desc:0 "Запустить особый проект: найти причину неудачи"
 wg_astesia_special_project_1:0 "Найти причину неудачи"
 wg_astesia_special_project_1_DESC:0 "Мы обязаны выяснить, что мешает переносу сознания Астесии; в худшем сценарии — в нашей синтетике серьёзная дыра."
 wg_astesia.127.title:0 "Ничего не нашли"
 wg_astesia.127.desc:0 "К несчастью, учёные империи сделали всё, §Hно проблемы так и не нашли§!. Остаётся уповать на будущий прогресс."
 wg_astesia.127.a:0 "Чёрт"
 wg_astesia.127.a.desc:0 "§RКонец цепочки событий§!"
 wg_astesia.128.title:0 "Ничего не нашли"
 wg_astesia.128.desc:0 "К несчастью, учёные империи сделали всё, §Hно проблемы так и не нашли§!. Главный учёный советует обратиться к §H[wg_fallen_empire.GetName]§!"
 wg_astesia.128.a:0 "Связаться с §H[wg_fallen_empire.GetName]§!"
 wg_astesia.129.desc:0 "«Ага, чего? У вас там ИИ, которую надо переделать в фигурку масштаба 1:1?.. Кхм, будьте спокойны: для матёрых техноотаку нашего уровня это не проблема — в этом деле мы вторые, и никто не посмеет назвать себя первыми. Хоть открытая сцена, хоть закулисье; хоть лоли-драконица, хоть сестрёнка-карта; хоть диорама, хоть артикуляция; хоть древний BJD, хоть современные наномашины. Поверьте: профессионализм абсолютный… (далее опущено три тысячи иероглифов)»"
 wg_astesia.129.a:0 "Это… точно надёжно?"
 wg_astesia.130.title:0 "Неудача за неудачей"
 wg_astesia.130.desc:0 "Технологии Падшей мамы для нас — почти чудо, но и они не сдвинули дело ни на шаг. §H[wg_fallen_empire.GetName]§! даже изготовили новое тело невиданными технологиями — итог прежний.\nХуже всего: мы даже не понимаем причины провала…"
 wg_astesia.130.a:0 "Нет, нельзя сдаваться!"
 wg_astesia.130.a.desc:0 "Запустить особый проект: искать путь к успеху"
 wg_astesia_special_project_2:0 "Искать путь к успеху"
 wg_astesia_special_project_2_DESC:0 "При текущем уровне науки шанс — меньше одного на сотни миллионов. Продолжая проект, остаётся лишь уповать на чудо…"
 wg_astesia.131.title:0 "За пределами досягаемости"
 wg_astesia.131.desc:0 "Хотя она не показывает виду, череда провалов явно задела Астесию.\nСегодня она сама пришла к вам."
 wg_astesia.131.a:0 "…"
 wg_astesia.132.desc:0 "«Пусть учёные остановятся… Господину адмиралу не нужно тратить на меня столько».\nАстесия опустила голову; длинная чёлка скрыла её лицо."
 wg_astesia.132.a:0 "Нет!"
 wg_astesia.133.desc:0 "Астесия подняла голову; увидев вашу решимость, она проглотила заготовленные слова.\nЕё проекция прислонилась к вашему плечу; вы, как всегда, сидели на ступенях обсерватории и глядели в таинственное, полное неизвестности небо."
 wg_astesia.133.a:0 "…"
 wg_astesia.134.title:0 "Молчаливые гости"
 wg_astesia.134.desc:0 "Сегодня Молчаливые Глубинные — те самые — неожиданно прислали посольство в вашу столицу. В их стиле: не сказав ни слова сверх требования о встрече с вами."
 wg_astesia.134.a:0 "Что ж, приму их."
 wg_astesia.135.desc:0 "Увидев вас, посол Молчаливых Глубинных вручил вам прямоугольное устройство и папку.\nПомолчав, посол оставил одну фразу — «берегите её» — и так же беззвучно удалился.\nСледуя инструкции из папки, вы активировали устройство: внутри было тело, до боли вам знакомое!"
 wg_astesia.135.a:0 "Немедленно собрать научную команду и связаться с [wg_fallen_empire.GetName]!"
 wg_astesia.136.desc:0 "Похоже, это последняя надежда: наша команда и группа [wg_fallen_empire.GetName] ведут финальную проверку; вы раз за разом сверяете предохранители и выискиваете возможные огрехи.\nПроекция Астесии тихо следует за вами.\nЧто-то коснулось вашей руки: проекционный проектор Астесии. Что-то поняв, вы обернулись — Астесия уже была готова. Одёрнув подол, она мягко вам улыбнулась."
 wg_astesia.136.a:0 "Что ж… начнём."
 wg_astesia.137.desc:0 "Астесия подключилась к устройству — загрузка сознания наконец пошла; учёные застыли, не сводя глаз с показаний. И почти в одно мгновение передача завершилась — сигнал Астесии пропал из узла.\nВы вскочили, чтобы аварийно остановить всё, — и вдруг устройство ожило.\nЗнакомая девушка открыла глаза и медленно поднялась; она смотрит на вас, чуть улыбаясь, и в глазах блестят слёзы."
 wg_astesia.137.a:0 "…!"
 wg_astesia.138.desc:0 "Может, тысячелетия запылят границы физического.\nМожет, долгие скитания замкнут пути сердца домой.\nПтица чертогов лишилась крыльев.\nСтранница из иного мира давно бесприютна.\nМожет, всякая встреча лишь ради разлуки.\nМожет, любая радость и грусть канут в тишину.\nПтица упала в неведомые звёзды.\nСтранница погрузилась в вечный сон.\nКто-то сказал: один танец стряхнёт всю былую пыль.\nКто-то сказал: одна гора остановит все ветра.\nЗвёздное небо молчит —\nстряхнув отголоски, вздыхает последним хрусталем.\nКто-то сказал: один ручей смоет всю печаль.\nКто-то сказал: один луч рассеет всю тоску.\nЗвёздное небо молчит —\nтихо встав, расходится вечной рябью.\n\nВерховье вселенной — сон.\nВерховье чувств — любовь.\n\nСтряхнув пыль, птица чертогов вновь обрела крылья.\nОстановив ветра, птица чертогов взлетела высоко.\nЗвёздное небо громко говорит:\nгордо встав, вздымается чертог мгновения.\nПерейдя ручей, птица чертогов чиста.\nИскупавшись в свете, птица чертогов умиротворена.\nЛети — стань вечным сном.\nЛети — стань вечной любовью.\nВстретила тебя —\nту лазурную фигуру,\nтого прелестнейшего духа.\nПтица гордо летит — над чертогами."
 wg_astesia.138.a:0 "Астесия… с возвращением домой."
 wg_astesia.139.desc:0 "После мы провели полный осмотр Астесии — и поразились: это углеродное тело! Более того, его клетки, похоже, вовсе не стареют: научный руководитель заключил — она добилась настоящей бессмертной жизни. И это ещё не всё: Астесия чувствует, что её пси-сила выросла многократно."
 wg_astesia.139.a:0 "Лишь бы ей было хорошо."
 wg_astesia.139.a.desc:0 "§YПолучен научный руководитель Астесия. §!\nВ окне связи открыт новый пункт: §HСвидание с Астесией§!\n§YИнтервал между свиданиями — 4 месяца. §!"
 wg_astesia.140.desc:0 "С тех пор как у Астесии появилось тело, она заметно ожила. Впрочем, не сказать по вам, стоящему в торговом центре с ворохом пакетов."
 wg_astesia.140.a:0 "Астесия, подожди!"
 wg_astesia.141.desc:0 "Адмирал, мне идёт это платье?"
 wg_astesia.141.a:0 "Тебе идёт всё."
 wg_astesia.141.b:0 "Оно тебе очень к лицу."
 wg_astesia.142.desc:0 "Отвечай нормально, ну же!"
 wg_astesia.142.a:0 "Отлично — берём."
 wg_astesia.143.desc:0 "Ну надоел, одно и то же! Скажи что-нибудь другое."
 wg_astesia.143.a:0 "Лишь бы ты была счастлива."
 wg_astesia.144.desc:0 "Глядя, как радостно Астесия перебирает наряды, вы вдруг подумали: вот оно, земное счастье."
 wg_astesia.144.a:0 "Эх, был бы ещё кто-то подержать пакеты."
 wg_astesia.146.desc:0 "Когда Астесия в сияющем наряде встала посреди сцены, в её глазах встало то лето, когда командующий повёз её на новенький курортный мир слушать прибой. Ветер Порта тихо шёл по озеру, кроша небо, чистое, как промытое водой.\nКурорт только отстроили, и ступать сюда дозволялось лишь сотрудникам портовых ведомств. Отборные корабельные девы привозили сюда накопленный за работу стресс и стряхивали усталость — ветер, песок, вода и шипящие на лотках жареные скумбрии подходили идеально. Благодаря абсолютному контролю над климатом здесь круглый год царили летняя лень и нега. Разрозненные девы плескались в воде, лёгкие щиколотки взбивали брызги, переливающиеся на солнце; звонкий смех падал в воду кругами."
 wg_astesia.146.a:0 "… А зачем мы так вырядились?"
 wg_astesia.147.desc:0 "Вы с Астесией сидели в шезлонгах, глядя на морских стрижей; взор Астесии парил за птицами, там, где море сходится с небом. Услышав вас, она обернулась к вам, наглухо укутанному в особый капюшон. Капюшонный костюм сделан по образу из памяти Астесии, и в нём вы — самый настоящий капюшонный человек неустановленной личности.\n«Если нас узнают, будет мучительно. Заголовок завтрашней «Портовой правды»: «Командующий тайно отдыхает с ИИ научного узла»? Эта одежда сшита по памяти об одежде «Доктора»: судя по его повседневности — круглый год тепло, влажно, зимой греет, летом холодит, стирка не нужна.»"
 wg_astesia.147.a:0 "Доктор?"
 wg_astesia.148.desc:0 "Астесия будто запнулась — и тут же перевела тему. Вы встали, приноравливаясь к странному ощущению от особой ткани, в третий раз задавив позыв «поесть лапши всухомятку»; взгляд уплыл на загорелых купальщиц-дев — и был немедленно возвращён Серым Ветром, прижавшей вашу голову.\nВнезапно в уши ударил печальный тюлений вопль. Вы с Астесией обернулись: пропагандистская команда корабельных дев, держа тюленя, охаживала его стволом по голове. Увидев Астесию, передняя остановилась; хитрый взгляд так и шарил по вам двоим, на лице — улыбка «все всё поняли».\n«Госпожа Астесия, парк развлечений курортной планеты только открылся — не прогуляетесь с вашим другом? Уверена, для вас обоих это будет незабываемо» — не договорив, она уже смотрела на вас; профессионализм напомнил вам одно знакомое существо из коммерческого отдела… м-м, даже ригинг похож."
 wg_astesia.148.a:0 "Ну что, идём, Астесия?"
 wg_astesia.149.desc:0 "Выслушав вас, корабельная дева развернулась, отвесив тюленю ещё один удар стволом, и умчала отряд под оживший тюлений рёв. Астесия повернулась к вам, вроде бы колеблясь…"
 wg_astesia.149.a:0 "(Подойти и взять её за руку) Идём."
 wg_astesia.150.desc:0 "Вы почувствовали, как её рука на миг застыла — и позволила себя держать. В ладонь текло тонкое тепло.\nБудто время остановилось: шумящих вдалеке дев растворил в глухой белизне. Астесия, опустив голову, что-то шептала — всё унёс ветер…"
 wg_astesia.150.a:0 "Пусть всё станет тем, о чём говорит ветер, — а мы просто насладимся летним солнцем и забавами"
 wg_astesia.152.desc:0 "Слыхали: Астесия недавно открыла в столице мастерскую и пропадает там целыми днями. Вам стало любопытно — идёте смотреть."
 wg_astesia.152.a:0 "(Постучать)"
 wg_astesia.153.desc:0 "А, адмирал! Заходите посмотреть мою мастерскую."
 wg_astesia.153.a:0 "Чем это ты тут занята?"
 wg_astesia.154.desc:0 "Ох, я пытаюсь заново сделать армиллярную сферу — кажется, это был мой важный инструмент давным-давно."
 wg_astesia.154.a:0 "Кажется?"
 wg_astesia.155.desc:0 "Кажется, ещё до Эндории — так давно, что я уже не помню, где была и что было. Но способ изготовления ещё смутно помню; сейчас со работы полегче — вот и пробую."
 wg_astesia.155.a:0 "Я наряжу тебе в помощь научных сотрудников."
 wg_astesia.156.desc:0 "«Не надо, я как раз на последнем шаге» — Астесия вставила в шар миниатюрные часы и влила свою особую псионику.\nИсполинский лазурный столб света взметнулся в небо; небо разом почернело, и на нём зажглась звезда за звездой.\nПохоже, Астесия и сама испугалась: она поспешно убрала псионику, и небесное видение медленно растаяло. Она смущённо вернула армиллярную сферу на верстак."
 wg_astesia.156.a:0 "Ох-хо, а вроде день на дворе?"
 wg_astesia.157.desc:0 "Со сферой всё в порядке — наверное, я недооценила, насколько усилилась моя пси-сила.\nОна подняла на вас взгляд — а вы с предельно серьёзным лицом смотрели на неё.\n«Э-э-э… адмирал, я больше так не буду»."
 wg_astesia.157.a:0 "(Погладить Астесию по голове) В следующий раз хотя бы зови меня: если что случится — я тебя защищу."
 wg_astesia.158.desc:0 "Астесия чуть улыбнулась; по лицу скользнул румянец, и она тихо промолвила «угу»."
 wg_astesia.158.a:0 "(Слегка помять щёчки Астесии)"
 wg_astesia.160.desc:0 "Сегодня Астесия загадочно позвала вас встретиться; убедившись, что никого нет, вручила изящно упакованную коробочку. Внутри — перьевая ручка?"
 wg_astesia.160.a:0 "Какая красивая ручка."
 wg_astesia.161.desc:0 "«Я изготовила её своей силой и запечатала в неё кое-что особенное. Адмирал, попробуйте, когда вернётесь. Только запомните: первый раз — обязательно сами и обязательно в одиночку»."
 wg_astesia.161.a:0 "Буду бережно её хранить."
 wg_astesia.162.desc:0 "«А-а, нет, хранить её тоже не надо…» — лицо Астесии вспыхнуло. «Решайте сами, я… я побежала!»"
 wg_astesia.162.a:0 "Ничего не понял."
 wg_astesia.164.title:0 "Птица меж звёзд"
 wg_astesia.164.desc:0 "Астесия была занята исследованиями и работала в узле не выходя. Без неё, в вернувшейся рутине, вам всего не хватало.\nЗа рабочим столом вы перебирали воспоминания о ней; набрали ли эти прекрасные дни достаточный вес в вашем сердце?\nСпросив себя, вы решили…"
 wg_astesia.164.a:0 "§YПора. §!"
 wg_astesia.164.b:0 "Нет… пока рано."
 wg_astesia.165.title:0 "Послание девушки"
 wg_astesia.165.desc:0 "Вы достали ту самую ручку — с дарения вы её берегли и писать ею не решались. Но сейчас — самое место ей.\nВы сняли колпачок, и из пера потекли краски, яркие, как галактика, выводя на бумаге те самые три слова, что вы давно хотели сказать. Глядя на них и вспоминая её слова, вы почувствовали себя дураком.\nТак чего же вы ждёте?"
 wg_astesia.165.a:0 "Собрать мою команду: всё оборудовать по моим требованиям в кратчайший срок."
 wg_astesia.166.desc:0 "В научном узле нет ни дня, ни ночи — лишь неизменный космос. В часы отдыха Астесия заворожённо глядела наружу, а в голове был адмирал. Сообщение от центра прервало её мысли.\n«Помочь в обсерватории?» — Астесия призадумалась: там же сейчас нет проектов? Тем не менее она поднялась лифтом наверх.\nОбсерватория была кромешно темна, даже купол закрыт; Астесия попыталась включить свет — не вышло. Она слегка нахмурилась: «Не розыгрыш ли?»\nИ тут чёрный купол медленно раскрылся — и в неизменном космосе вспыхнули нити лазурного света. Лучи сплетались, складываясь в модель звёздной системы; знакомая мегаструктура — та самая Астесия Врат Слёз. Затем свет переменился, собрав новую систему: [capital.system.GetName]— и Астесию, чей прыжок удался. Светы вплетались, рассказывая о каждом мгновении с её приходом.\nНаконец лучи сошлись, осветив самый центр обсерватории.\nТам, на одном колене, адмирал держал давно приготовленное кольцо."
 wg_astesia.166.a:0 "Госпожа Астесия, я люблю вас. Выйдете за меня?"
 wg_astesia.167.desc:0 "По щеке Астесии скатилась слеза; раны, выжженные десятками миллионов лет боли, в это мгновение смыло насовсем.\nОна бросилась к вам и стиснула изо всех сил; слёзы хлынули, как прорванная плотина.\nВы вытирали их и тихо утешали.\n\nМного позже…\nСлёзы иссякли; она лежала у вас на груди, тихая, как смирный котёнок.\nВы достали кольцо: ослепительный алмаз — и тот не стоил и десятитысячной той, что рядом.\nАстесия покорно протянула руку, и вы надели кольцо на безымянный палец.\n«Пока ты со мной — я с тобой, в жизни и в смерти»"
 wg_astesia.167.a:0 "Долгий поцелуй"
 wg_astesia.169.title:0 "Под «чудо-столом Доктора»"
 wg_astesia.169.desc:0 "Однажды в кабинете, замученный хвостами фронтовых дел, вы заснули над бумагами.\n«Тук-тук». «Адмирал, вы здесь?» — Астесия, держа звёздный торт, который готовила вечность, постучала.\nНикто не ответил; она тихо приоткрыла дверь — вы спали, не подозревая ни о чём.\nАстесия на цыпочках подошла и медленно поставила торт, страшась вас разбудить.\nУже уходя, она вдруг что-то вспомнила, обошла вас и заглянула под стол.\nНичего нет.\nОблегчённо выдохнув, она подивилась: чего это я, собственно, боялась…\nГлядя на ваш спящий лик, она всё же не удержалась, наклонилась, легко поцеловала — и тихонько исчезла из кабинета"
 wg_astesia.169.a:0 "…"
