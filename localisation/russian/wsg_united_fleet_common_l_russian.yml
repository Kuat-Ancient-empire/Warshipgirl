 uf_hm_ring:0 "Ускоритель сверхмерного вещества (не запущен)"
 uf_hm_ring_DESC:0 "Этим исполинским масс-ускорителем вокруг планеты мы испытаем параметры сверхмерного вещества и заложим теорию сверхмерного реактора."
 uf_hm_ring_MEGASTRUCTURE_DETAILS:0 "Ради проверки сверхмерного реактора на жизнеспособность нам придётся возвести этот исполинский масс-ускоритель."
 uf_hm_ring_1:0 "Ускоритель сверхмерного вещества"
