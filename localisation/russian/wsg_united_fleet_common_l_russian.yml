 tech_uf_hyperdimensional_matter_core:0 "Звездоклассный улавливатель сверхмерного вещества"
 tech_uf_hyperdimensional_matter_core_desc:0 "Всё это время мы думали, как уменьшить производство сверхмерного вещества для плотной застройки; а почему бы не подумать наоборот — не возвести звездоклассный улавливатель ради гигантских объёмов сверхмерного вещества?"
 uf_hyperdimensional_matter_core_1:0 "Площадка звездоклассного улавливателя сверхмерного вещества"
