 uf_resource_ring_0:0 "Площадка сверхмерного межпространственного экстрактора Объединения"
 uf_resource_ring_0_DESC:0 "С этой инженерной платформы мы воздвигнем исполинский экстрактор: дайте ресурсы — и великий проект начнётся."
 uf_resource_ring_0_MEGASTRUCTURE_DETAILS:0 "Супермегасооружение у§B класса A§!, §Bкласса B§! или§B класса F§! звезды: выкачивает из иных измерений бессчётные ресурсы."
 uf_resource_ring_1:0 "Сверхмерный межпространственный экстрактор Объединения (кольцо)"
 uf_resource_ring_1_DESC:0 "Кольцо экстрактора смонтировано: ресурсы иных миров хлынули в наш план; далее монтируем координаторы для стабильности."
 uf_resource_ring_2:0 "Сверхмерный межпространственный экстрактор Объединения (нижний координатор)"
 uf_resource_ring_2_DESC:0 "Нижний координатор смонтирован, стабильность выросла; осталось поставить верхний координатор."
 uf_resource_ring_3:0 "Сверхмерный межпространственный экстрактор Объединения"
 uf_resource_ring_3_DESC:0 "Экстрактор в полной форме: сверхмерным веществом мы тянем из других планов любые нужные ресурсы; некоторые нам, может, и не применить, но их чудные свойства стоят изучения."
