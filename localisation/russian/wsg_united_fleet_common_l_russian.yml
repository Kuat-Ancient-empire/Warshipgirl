 requires_only_one_fortress_megastructure_in_system:0 "$TRIGGER_FAIL$ Система тянет лишь одну цитадель — сначала завершите уже начатую"
 uf_star_fortress_edicts:0 "§HОткрывает мегасооружение: §! платформа Обсидиановой цитадели Объединения"
 uf_star_fortress_megastructure_ruin:0 "Повреждённая Обсидиановая цитадель"
 uf_star_fortress_megastructure_ruin_DESC:0 "Благодаря исполинской и прочной конструкции цитадель ещё можно починить"
 uf_star_fortress_megastructure_ruin_2:0 "Починить как оборонительную"
 uf_star_fortress_megastructure_ruin_2_DESC:0 "Отреставрировать цитадель как оборонительную"
 uf_star_fortress_megastructure_ruin_3:0 "Починить как подвижную"
 uf_star_fortress_megastructure_ruin_3_DESC:0 "Отреставрировать цитадель как цитадель передовой с прыжковым двигателем"
 uf_glory_megastructure_0:0 "Платформа Объединённой славы"
 uf_glory_megastructure_0_DESC:0 "Платформа для постройки звездосистемного корабля «Объединённая слава»; из-за исполинских размеров строить его приходится как мегасооружение"
 uf_glory_megastructure_0_MEGASTRUCTURE_DETAILS:0 "Платформа звездоклассного корабля; из-за исполинских размеров строить его приходится как мегасооружение."
 uf_glory_megastructure_1:0 "Основной корпус Объединённой славы"
 uf_glory_megastructure_1_DESC:0 "Основной корпус Объединённой славы готов, но пока это пустая оболочка — нужны дальнейшие агрегаты."
 uf_glory_megastructure_2:0 "Реакторный блок Объединённой славы"
 uf_glory_megastructure_2_DESC:0 "Реактор Объединённой славы построен; далее — вооружение."
 uf_glory_megastructure_3:0 "Вооружение Объединённой славы"
 uf_glory_megastructure_3_DESC:0 "Все базовые блоки готовы; осталась финальная заправка сверхмерным веществом для зажигания реактора.\n§RСначала сохраните проект Объединённой славы в редакторе флотов§!"
 uf_glory_megastructure_4:0 "Зажигание! Отплытие!!"
 uf_glory_megastructure_4_DESC:0 "Великая Объединённая слава построена; захоти — строим вторую."
 requires_no_uf_glory_megastructure:0 "$TRIGGER_FAIL$ Стройка Объединённой славы требует массы людей и технологий — одновременно строится только одна; сперва завершите начатую"
 uf_glory_megastructure_0:0 "Платформа Объединённой славы"
 uf_glory_megastructure_0_DESC:0 "Платформа для постройки звездосистемного корабля «Объединённая слава»; из-за исполинских размеров строить его приходится как мегасооружение"
 uf_glory_megastructure_ruin:0 "Повреждённая Объединённая слава"
 uf_glory_megastructure_ruin_DESC:0 "Эта Объединённая слава тяжело повреждена, но основной корпус цел — ремонт возможен."
 uf_glory_megastructure_ruin_2:0 "Ремонт"
 uf_glory_megastructure_ruin_2_DESC:0 "Влить заново гору ресурсов — и она родится вновь."
 tech_uf_polymer_matrix:0 "Полимерный производственный массив Объединения"
 tech_uf_polymer_matrix_desc:0 "Опоясывающий планету полимерный производственный массив: из вещества планеты синтезирует энергию и сплавы, попутно добывая ценные минералы и редкие ресурсы."
 uf_polymer_matrix_edicts:0 "§HОткрывает мегасооружение: §! полимерный производственный массив Объединения"
 uf_polymer_matrix:0 "Полимерный производственный массив Объединения"
 uf_polymer_matrix_DESC:0 "Опоясывающий планету полимерный производственный массив: из вещества планеты синтезирует энергию и сплавы, попутно добывая ценные минералы и редкие ресурсы."
 uf_polymer_matrix_MEGASTRUCTURE_DETAILS:0 "Опоясывающий планету полимерный производственный массив: из вещества планеты синтезирует энергию и сплавы, попутно добывая ценные минералы и редкие ресурсы."
 requires_no_gas_giant:0 "$TRIGGER_FAIL$ Планета не должна быть газовым гигантом"
 uf_trait_united_fleet:0 "Объединённый флот"
 uf_trait_united_fleet_desc:0 "§YЧерта Объединения§!\n\n\n\n£uf_trait_pic_1£\n\n\n\nКорабль-дева из Объединённого флота. Слава Объединению."
 uf_trait_smart:0 "Накопленный опыт"
 uf_trait_smart_desc:0 "Объединённые корабли-девы мастерицы учиться на ошибках: любая неудача идёт впрок."
 uf_trait_migrate:0 "Лёгкое оснащение"
 uf_trait_migrate_desc:0 "Долой тяжёлые старые корабельные доспехи: с лёгким оснащением нового образца переселение — плёвое дело."
 uf_trait_unity:0 "Единство"
 uf_trait_unity_desc:0 "Боль войны запечатлела в нас важность сплочённости: мы объединимся и вместе построим светлое будущее."
 uf_trait_warlike:0 "Воинственность"
 uf_trait_warlike_desc:0 "Война много у нас отняла — но и много дала; культ воина по-прежнему в мейнстриме."
 uf_trait_knowledgeable:0 "Совместная научная программа Объединения"
 uf_trait_knowledgeable_desc:0 "Корабли-девы и Глубинные дополняют друг друга, вместе разгоняя тучи над башней науки."
 TRAIT_UF_KNOWLEDGEABLE_EFFECT:0 "£mod_pop_bonus_workforce_mult£ $specialist_and_complex_drone_cat_bonus_workforce_mult$:§G+10%§!\n§H$job_uf_researcher$§! выработка науки: §G+5§!"
 uf_trait_industrious:0 "Промышленное оснащение"
 uf_trait_industrious_desc:0 "Специализированное оснащение помогает владелице в промышленных делах."
 uf_trait_alarm:0 "Сверхмерный будильник"
 uf_trait_alarm_desc:0 "Дабы не проспать, все будильники Объединённого флота сделаны из сверхмерного вещества и звонят, пока датчики не подтвердят, что владелица встала по-настоящему. Такому будильнику и антиматериальная бомба нипочём."
 uf_trait_agrarian:0 "Еда — святое"
 uf_trait_agrarian_desc:0 "Врождённая прожорливость объединённых кораблей-дев заставляет нас изощряться ради роста выработки еды."
 uf_trait_no_crime:0 "Дисциплина"
 uf_trait_no_crime_desc:0 "Большинство объединённых кораблей-дев унаследовало от Глубинных железную дисциплину: преступные мысли приходят в голову редко."
 uf_trait_minerals:0 "Горное вспомогательное оборудование"
 uf_trait_minerals_desc:0 "Наше горное оснащение изрядно поднимет эффективность добычи."
 leader_trait_uf_attacker:0 "Ударница Объединения"
 leader_trait_uf_attacker_desc:0 "Этот флотоводец Объединения ставит на атаку: всех врагов империи встречает яростным залпом."
 leader_trait_uf_nurse:0 "Смотрительница флота Объединения"
 leader_trait_uf_nurse_desc:0 "Этот флотоводец печётся о флоте и сберегает матчасть — привычка, что в самый опасный час оставляет ей путь к отступлению."
 leader_trait_uf_instructor:0 "Инструктор морского флота Объединения"
 leader_trait_uf_instructor_desc:0 "Этот флотоводец — блестящий преподаватель: её части неизменно первоклассны, и многие лидеры приезжают учиться к ней ради роста."
 uf_trait_food:0 "Прожорливость"
 uf_trait_food_desc:0 "Объединённые корабли-девы ловки и умелы; будь у них слабость — разве что обжорство."
 uf_trait_uncomfortable:0 "Жажда уюта"
 uf_trait_uncomfortable_desc:0 "Требования к удобствам у нас запредельные: бывает, всю ночь не спишь, не находя удобной позы."
 uf_trait_anxiety:0 "Тревожность"
 uf_trait_anxiety_desc:0 "§YТрижды в день спрашиваю себя: что на завтрак, что на обед, что на ужин. §!\nКаждый день объединённые корабли-девы томятся тревогой: что же съесть на завтрак, обед и ужин."
 uf_trait_bed:0 "Недуг вставания"
 uf_trait_bed_desc:0 "Трудно вообразить: проспать и забить на день работы в обществе Объединения — повсеместно молчаливо дозволено. Ясно, что это режет продуктивность — но кого одолеет власть тёплой постели?"
 uf_trait_teeth:0 "Зубы мудрости"
 uf_trait_teeth_desc:0 "Трудно вообразить: способа излечить зубы мудрости раз и навсегда мы так и не нашли — приходится тратить горы медицины на удаление их у поколений."
 leader_trait_uf:0 "Объединённый флот"
 leader_trait_uf_desc:0 "$uf_trait_united_fleet_desc$"
 leader_trait_uf_1:0 "Объединённый флот"
 leader_trait_uf_1_desc:0 "$uf_trait_united_fleet_1_desc$"
 leader_trait_uf_2:0 "Объединённый флот"
 leader_trait_uf_2_desc:0 "$uf_trait_united_fleet_2_desc$"
 leader_trait_scientist_uf:0 "Главный научный офицер Объединения"
 leader_trait_scientist_uf_desc:0 "У главных научных офицеров Объединения гибкий ум и дух первопроходцев: наука или космические странствия — со всем справятся."
 uf_trait_united_fleet_1:0 "Объединённый флот"
 uf_trait_united_fleet_1_desc:0 "§YЧерта Объединения§!\n\n\n\n£uf_trait_pic_2£\n\n\n\nКорабль-дева из Объединённого флота. Слава Объединению."
 leader_trait_scientist_uf_1:0 "Главный научный офицер Объединения"
 leader_trait_scientist_uf_1_desc:0 "Нейромодификации и новое вспомогательное оснащение помогают научным офицерам Объединения в исследованиях и в поиске мельчайших зацепок."
 uf_trait_knowledgeable_2:0 "Сверхмерная наука Объединения"
 uf_trait_knowledgeable_2_desc:0 "Знания, прежде нам недосягаемые, с сверхмерным веществом — вот они, рукой подать."
 TRAIT_UF_KNOWLEDGEABLE_2_EFFECT:0 "£mod_pop_bonus_workforce_mult£ $specialist_and_complex_drone_cat_bonus_workforce_mult$:§G+20%§!\n§H$job_uf_researcher$§! выработка науки: §G+10§!"
 uf_trait_produces:0 "Экстрапроизводство"
 uf_trait_produces_desc:0 "Сверхмерная сеть и наши сверхмерные интерфейсы извлекают и применяют высокие технологии мгновенно — производительность взлетела."
 uf_trait_hm_produces:0 "Сверхмерная уловительница"
 uf_trait_hm_produces_desc:0 "То, что прежде было трудно даже разглядеть, теперь — со сверхмерным телом — ловится играючи."
 TRAIT_UF_HM_PRODUCES_EFFECT:0 "§H$job_uf_hm$§! выработка: §G+4§! при росте§R содержания§!"
 uf_trait_united_fleet_2:0 "Объединённый флот"
 uf_trait_united_fleet_2_desc:0 "§YЧерта второго вознесения§!\n\n\n\n£uf_trait_pic_3£\n\n\n\nКорабельная дева Объединённого флота, укреплённая сверхмерным веществом. Слава Объединению."
 leader_trait_scientist_uf_2:0 "Сверхмерный главный научный офицер Объединения"
 leader_trait_scientist_uf_2_desc:0 "Сверхмерные интерфейсы помогают нашим научным офицерам вести тончайшие изыскания — ни одна ниточка не скроется от их всевидящей сети."
 leader_trait_admiral_uf_hull_damage:0 "Прицельно в корпус"
 leader_trait_admiral_uf_hull_damage_desc:0 "Этот лидер считает: настоящий урон — лишь тот, что пробил корпус вражеского корабля."
 leader_trait_admiral_uf_cannoneer:0 "Артиллеристка"
 leader_trait_admiral_uf_cannoneer_desc:0 "Этот лидер открывает огонь с предельной дистанции — стремясь сжечь врага вне его ответной досягаемости."
 leader_trait_admiral_uf_speeder:0 "Гонщица"
 leader_trait_admiral_uf_speeder_desc:0 "Этот лидер уверен: чем быстрее флот явится в район боя, тем прочнее инициатива в войне."
 leader_trait_admiral_uf_carrier:0 "Авианосная лоббистка"
 leader_trait_admiral_uf_carrier_desc:0 "Этот лидер уверен: даже с водяными пушками палубная авиация «каплей точит камень» и завалит любого врага."
 leader_trait_admiral_uf_firepower:0 "Боезапас Ван Флита"
 leader_trait_admiral_uf_firepower_desc:0 "Чтобы вылить по врагу максимум огня в кратчайший срок, эта лидер Объединения ценой брони подняла скорострельность корабельной артиллерии на целый уровень."
 leader_trait_admiral_uf_shield_reduction:0 "Танец со смертью"
 leader_trait_admiral_uf_shield_reduction_desc:0 "Эта лидер Объединения скинула щиты вовсе, направив всю энергию в оружие."
 leader_trait_general_uf_disease_control:0 "Мастер карантина"
 leader_trait_general_uf_disease_control_desc:0 "Новые миры несут неведомые вирусы и хвори — этот лидер сосредоточится на их предотвращении, делая колонии лучше."
 leader_trait_general_uf_urban_designer:0 "Городская планировщица"
 leader_trait_general_uf_urban_designer_desc:0 "Этот лидер — знаменитый в прошлом градостроитель: умеет планировать вдолгую и заранее оставлять колониям простор для роста."
 leader_trait_general_uf_intelligent:0 "Уважение к науке"
 leader_trait_general_uf_intelligent_desc:0 "До губернаторства этот лидер ведал наукой — и охотно тратит на неё лишние ресурсы"
 leader_trait_general_uf_great_army:0 "Великая армия"
 leader_trait_general_uf_great_army_desc:0 "Всесторонне усиленная и вымуштрованная, эта лидер станет лучшим из военачальниц."
 leader_trait_scientist_uf_survey:0 "Быстрая съёмка"
 leader_trait_scientist_uf_survey_desc:0 "Этот лидер уверен: чем быстрее обследованы системы, тем больше шансов у экспансии."
 leader_trait_scientist_uf_genius:0 "Гений"
 leader_trait_scientist_uf_genius_desc:0 "Добавлять описания бессмысленно: этот лидер — гений."
 r_uf_hyperdimensional_matter:0 "База исследования сверхмерного вещества"
 r_uf_hyperdimensional_matter_desc:0 "Сверхмерное вещество, обнаруженное на Ностоне: имеет ряд свойств, не подчиняющихся правилам нашей реальности, и таит бездну энергии; добыча его крайне трудна, применяем понемногу. Именно эта субстанция, в известном смысле, и вызвала Объединённую войну.\nИз-за важности объекта в войне его не тронули ни разу, а наработки полностью сохранены под защитой перешедшего к нам главного учёного."
 r_mecha_wreckage:0 "Обломки шагоходов Объединения"
 r_mecha_wreckage_desc:0 "В Объединённую войну, дабы сломать мясорубочный тупик в этом районе, сюда бросили массы шагоходов — победа досталась страшной ценой."
 r_planetary_artillery:0 "Планетарный оборонительный массив «Стоунхендж»"
 r_planetary_artillery_desc:0 "Эти передовые орудия разгоняют снаряды до исполинских скоростей, сбивая всё, что лезет в атмосферу. В Объединённую войну отвлекающим манёвром мы почти без потерь захватили управление массивом."
 r_uf_food:0 "Гастрономический город Объединения"
 r_uf_food_desc:0 "Трудно вообразить: целый город, спроектированный ради еды — здесь купишь любые изыски. А под городом — передовые автоматические агрофермы, снабжающие его свежайшим. §Y(подземные фермы реально дают 100 еды, но 80 съедают)§!"
 building_uf_farmland:0 "Ферма времени"
 building_uf_farmland_desc:0 "Ферма времени неведомой цивилизации: ускорение внутреннего хода времени дозревает урожай быстрее."
 building_uf_energy:0 "Автоматическая сверхмерная электростанция Объединения"
 building_uf_energy_desc:0 "Простейшее применение сверхмерного вещества — электричество. Мы зарезервировали модули под будущие апгрейды."
 building_uf_residence:0 "Экологический город-обитель Объединения"
 building_uf_residence_desc:0 "Изначально — большие обиталища для выживания в зоне жёсткой радиации; ныне эта технология служит нам в любых средах."
 building_uf_residence_s:0 "Экологический город-обитель Ностона"
 building_uf_residence_s_desc:0 "После Объединённой войны 80% Ностона укутано жёстким фоном радиации.\nГорода-обители широко раскинулись и успешно держат радиацию и опасность за толстой защитной плёнкой."
 building_uf_monument:0 "Монумент павшим"
 building_uf_monument_desc:0 "В нашей культуре после смерти не должно быть ни «той жизни», ни круговорота с повторением прежних мук и ошибок — после смерти положен полный покой. Живущие же в меру сил помнят ушедших.\nОбъединённая война отняла у нас слишком много; сей торжественный монумент — памяти каждой сестры, погибшей на той войне."
 building_uf_assembly:0 "Автоматический сборочный завод Объединения"
 building_uf_assembly_desc:0 "Некогда технология Глубинных; после объединения улучшена и доведена до нынешнего заводского вида."
 building_uf_assembly_2:0 "Автоматическая сборочная станция Объединения"
 building_uf_assembly_2_desc:0 "Станция с ещё большей автоматизацией — эффективность сильно выросла."
 tech_uf_assembly_2:0 "Автоматическая сборочная станция Объединения"
 tech_uf_assembly_2_desc:0 "Станция с ещё большей автоматизацией — эффективность сильно выросла."
 building_uf_constructrue:0 "Автоматическая инженерная установка Объединения"
 building_uf_constructrue_desc:0 "Передовая установка: дайте проект и материалы — и она строит сама."
 tech_uf_constructrue:0 "Автоматическая инженерная установка Объединения"
 tech_uf_constructrue_desc:0 "Передовая автономная инженерная установка: проект плюс материалы — и стройка идёт сама, изрядно ускоряя освоение планет и перестройку в квазиэкумнополисы."
 building_uf_research:0 "Сверхмерная НИС Объединения"
 building_uf_research_desc:0 "Неисчерпаемая энергия и чудо-свойства сверхмерного вещества плюс труд лучших умов — и мы берём научную вершину за вершиной."
 building_uf_auto_research:0 "Автоматическая сверхмерная НИС Объединения"
