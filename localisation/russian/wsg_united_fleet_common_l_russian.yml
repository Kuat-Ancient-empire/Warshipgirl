 uf_administrator_modifier:0 "Отбор резервных чиновников Объединения"
 tech_uf_science_center:0 "Управление сверхмерной наукой Объединения"
 tech_uf_science_center_desc:0 "Штаб, планирующий сверхмерную науку планеты — изрядно ускорит наши исследования."
 building_uf_science_center:0 "Управление сверхмерной наукой Объединения"
