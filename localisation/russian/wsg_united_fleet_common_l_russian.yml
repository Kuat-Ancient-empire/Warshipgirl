 tech_uf_start:0 "Технологии Объединения"
 tech_uf_start_desc:0 "Дурёхи-корабли-девы и Глубинные, смотрите и учитесь: это любимая дочка Тюленя."
 tech_repeatable_weapon_type_sr_uf_damage:0 "Сверхмерный цикл"
 tech_repeatable_weapon_type_sr_uf_damage_desc:0 "Обслуживание и залпы сверхмерного оружия не обходятся без сверхмерного тела — изучим, как ещё поднять его урон."
 mod_weapon_type_sr_uf_weapon_damage_mult:0 "Урон сверхмерного оружия"
 mod_weapon_type_sr_uf_weapon_fire_rate_mult:0 "Скорострельность сверхмерного оружия"
 tech_uf_hyperdimensional_matter_application:0 "Глубже в сверхмерье"
 tech_uf_hyperdimensional_matter_application_desc:0 "Мы уже применяем сверхмерное вещество вплоть до больших кораблей, но о его природе и ядре свойств знаем до обидного мало — пора постигать глубже."
 tech_uf_hm_communication:0 "Сверхмерная связь"
 tech_uf_hm_communication_desc:0 "Мы будем пробовать дальнюю связь через свойства сверхмерного вещества — это укрепит контроль над огромными владениями."
 tech_uf_hm_network:0 "Сверхмерная сеть Объединения"
