 tech_uf_archaeology:0 "Археологическая служба Объединения"
 tech_uf_archaeology_desc:0 "Археологическая служба Объединения сама ведёт раскопки, принося империи инопланетные артефакты и утраченные знания.\n\nВнимание: строить в первом районе столицы — это первоочередной район столицы!!"
 building_uf_archaeology:0 "Археологическая служба Объединения"
 building_uf_archaeology_desc:0 "Служба сама ведёт раскопки: через сверхмерное вещество читает истории руин и приносит ценные артефакты.\n\nВнимание: строить в первом районе столицы — это первоочередной район столицы!!"
 job_uf_archaeologist:0 "Сверхмерный археолог Объединения"
