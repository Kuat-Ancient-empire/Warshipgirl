 tech_uf_research_3:0 "Гигантская сверхмерная НИС"
 tech_uf_research_3_desc:0 "Постигнув сверхмерное вещество на новом уровне, мы нуждаемся в ещё больших и передовых комплексах под стремительные перемены."
 job_uf_researcher:0 "Сверхмерный научный сотрудник Объединения"
