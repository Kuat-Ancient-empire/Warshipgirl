 uf_star_fortress_megastructure_0_MEGASTRUCTURE_DETAILS:0 "Несокрушимая исполинская звёздная цитадель из четырёх огневых массивов — в одиночку остановит целый крупный флот. Из-за размеров строить её приходится как мегасооружение."
