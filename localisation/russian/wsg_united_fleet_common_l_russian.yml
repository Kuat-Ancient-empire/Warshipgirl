 tech_uf_fortress:0 "Планетарная оборонительная система"
 tech_uf_fortress_desc:0 "Пусть большинство считает, что наша военная мощь убережёт миры от атак, мы всё равно разработаем и развернём эту систему."
 building_uf_fortress:0 "Военная цитадель Объединения"
 building_uf_fortress_desc:0 "Внутри исполинской цитадели — малый завод: стремительно разворачивает военную базу и выпускает всё нужное; а при желании перестраивается в машину и едет к следующему месту."
