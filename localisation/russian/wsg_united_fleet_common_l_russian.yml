 tech_uf_space_farm:0 "Орбитальная ферма Объединения"
 tech_uf_space_farm_desc:0 "Ради прихотливых вкусов и бездонных желудков объединённых кораблей-дев ответом станет эта исполинская орбитальная ферма."
 uf_space_farm_edicts:0 "§HОткрывает мегасооружение: §! орбитальная ферма Объединения"
 uf_space_farm_core:0 "Ядро орбитальной фермы Объединения"
 uf_space_farm_core_DESC:0 "Эта кроха со временем станет ядром орбитальной фермы: подадим ресурсы — и сразу приступим к следующему этапу."
 uf_space_farm_core_MEGASTRUCTURE_DETAILS:0 "Исполинская орбитальная ферма: накормит качественной едой миллиарды."
 uf_space_farm_half:0 "Крыло орбитальной фермы Объединения"
 uf_space_farm_half_DESC:0 "Ферма готова наполовину — и уже даёт половину проектной еды."
 uf_space_farm_full:0 "Орбитальная ферма Объединения"
 uf_space_farm_full_DESC:0 "Достроенная орбитальная ферма: её урожай бесперебойно потечёт в наши миры."
 tech_uf_ews:0 "Станция предупреждения об опасностях Объединения"
 tech_uf_ews_desc:0 "Станция раннего предупреждения о природных угрозах — космических бурях, враждебной космической фауне и прочих; построив её, выиграет вся галактика."
 uf_ews:0 "Площадка станции предупреждения об опасностях Объединения"
 uf_ews_DESC:0 "Станция раннего предупреждения о природных угрозах — космических бурях, враждебной космической фауне и прочих; построив её, выиграет вся галактика."
 uf_ews_MEGASTRUCTURE_DETAILS:0 "Станция раннего предупреждения о природных угрозах — космических бурях, враждебной фауне и прочих; следит и предупреждает для всей галактики в реальном времени."
 uf_ews_1:0 "Станция предупреждения об опасностях Объединения"
 uf_ews_1_DESC:0 "Сооружение в реальном времени засекает и предупреждает о скрытых космических угрозах для всей галактики — наша галактика станет безопаснее."
