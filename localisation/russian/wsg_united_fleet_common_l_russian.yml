 policy_uf_science_ship:0 "Настройка вооружённого инженерно-научного корабля"
 policy_uf_science_ship_desc:0 "Политика решает, будет ли вооружённый инженерно-научный корабль Объединения после исследования системы возводить звёздную базу и добывающие станции\n"
 uf_science_ship_allowed:0 "Возводить"
 uf_science_ship_allowed_desc:0 "Вооружённый инженерно-научный корабль Объединения после исследования системы сам возводит звёздную базу и добывающие станции"
 uf_science_ship_not_allowed:0 "Запретить"
 uf_science_ship_not_allowed_desc:0 "Вооружённый инженерно-научный корабль Объединения после исследования системы не возводит ничего"
 tech_uf_ring_shipyard_upgrade:0 "План списания орбитального кольца Объединения"
 tech_uf_ring_shipyard_upgrade_desc:0 "Орбитальное кольцо Объединения сослужило империи неоценимую службу, но доком ему быть уже незачем. Колея орбитальным складом и рейдом оно продолжит служить нам.\n"
 uf_ring_shipyard_upgrade_edicts:0 "§YОткрывает указ столичной планеты§!: план списания орбитального кольца Объединения"
 decision_uf_ring_shipyard_upgrade:0 "План списания орбитального кольца Объединения"
 decision_uf_ring_shipyard_upgrade_desc:0 "Орбитальное кольцо Объединения сослужило империи неоценимую службу, но доком ему быть уже незачем. Как орбитальным складом и рейдом оно продолжит служить нам.\n"
 decision_uf_ring_shipyard_upgrade_effects_short:0 "Обратить все орбитальные кольца Объединения в рейдовые кольца Объединения"
 tech_uf_auto_building_decision:0 "Переключатель режима производства"
 tech_uf_auto_building_decision_desc:0 "Этим модулем можно быстро переключать производство между автоматизированным и обычным"
 uf_auto_building_decision_diplo:0 "§YОткрывает планетарный указ§!: неавтоматизированное/автоматизированное производство"
 decision_uf_auto_building:0 "Автоматизированное производство"
 decision_uf_auto_building_desc:0 "Нам нужно перевести эти объекты в автоматизированные.\n"
 decision_uf_auto_building_effects_short:0 "§YСверхмерные лаборатории Объединения, центры сверхмерного извлечения ресурсов Объединения и имперский командный центр Объединения§! будут обращены в автоматизированные версии"
 decision_uf_non_auto_building:0 "Неавтоматизированное производство"
 decision_uf_non_auto_building_desc:0 "Нам нужно перевести эти объекты в неавтоматизированные.\n"
 decision_uf_non_auto_building_effects_short:0 "§YСверхмерные лаборатории Объединения, центры сверхмерного извлечения ресурсов Объединения и имперский командный центр Объединения§! будут обращены в неавтоматизированные версии"
 tech_uf_auto_building_upgrade:0 "Апгрейд автоматизированных объектов"
 tech_uf_auto_building_upgrade_desc:0 "Объявив этот указ, мы апгрейдим автоматизированные объекты ради большей производительности."
 tech_uf_auto_building_upgrade_diplo:0 "§YОткрывает планетарный указ§!: апгрейд автоматизированных объектов"
 decision_planet_auto_building_upgrade:0 "Апгрейд автоматизированных объектов"
 decision_planet_auto_building_upgrade_desc:0 "Мы апгрейдим автоматизированные объекты ради большей производительности — ценой добавочного содержания.\n\n§YУказ можно объявлять многократно\nЦена указа растёт с текущим уровнем автоматизации§!"
 auto_building_upgrade:0 "Уровень планетарной автоматизации"
 col_uf_auto_world_requirements:0 "$TRIGGER_FAIL$ Тип колонии должен быть§Y автоматизированный мир Объединения§! или§Y столица§!"
 decision_auto_building_upgrade_effects:0 "Поднять§G выработку§! большинства автоматизированных построек и районов!"
 ap_uf_1:0 "Эпоха Объединения"
 ap_uf_1_desc:0 "Сверхмерное вещество вознесло наше общество на невиданную высоту, войдя во все его уголки. Но рано почивать на лаврах: старые общественные идеи и институты постепенно сотрут это преимущество — необходима глубокая реформа."
 uf_1_tooltip:0 "§YЭта перемена станет ключом к следующей стадии нашей истории§!"
 requires_tech_uf_hyperdimensional_matter_application:0 "$TRIGGER_FAIL$ Требуется технология £physics£§Y$tech_uf_hyperdimensional_matter_application$§!"
 requires_finish_rebuiding_homeworld_chain:0 "$TRIGGER_FAIL$ Требуется завершить§R начальную цепочку событий: §!§Y «Отстроим наш дом заново»§!"
 ap_uf_2:0 "Сверхмерная революция"
 ap_uf_2_desc:0 "Чем глубже мы постигаем сверхмерное вещество, тем прочнее оно входит во все уголки общества; но применить его к самим себе мы ещё не пробовали — а вдруг это ключ к бессмертию и новым тайнам сверхмерного вещества?"
 requires_finish_ap_uf_1_chain:0 "$TRIGGER_FAIL$ Требуется завершить§R цепочку вознесения: §!§Y «Вперёд, в будущее»§!"
 requires_tech_uf_hm_reactor:0 "$TRIGGER_FAIL$ Требуется технология £physics£§Y$tech_uf_hm_reactor$§!"
 requires_ascension_ap_uf_1:0 "$TRIGGER_FAIL$ Требуется принять вознесение §Y$ap_uf_1$§!"
 requires_tech_uf_hm_network:0 "$TRIGGER_FAIL$ Требуется технология £physics£§Y$tech_uf_hm_network$§!"
 ap_uf_3:0 "Инженерия чудес"
 ap_uf_3_desc:0 "Новейшие технологии воплотятся в великих чудесах. С их помощью нас ждёт новое процветание."
 uf_3_tooltip:0 "Разрешаются§Y флагманские§! корабли Объединения\nРазрешаются§Y чудесные§! мегасооружения Объединения\n§YЗатянутые небесами миры§! и§Y сверхмерные миры-кольца§! получают§Y автоматизированные сверхмерные добывающие районы§!"
 requires_ascension_ap_uf_2:0 "$TRIGGER_FAIL$ Требуется принять вознесение §Y$ap_uf_2$§!"
 requires_ascension_galactic_wonders:0 "$TRIGGER_FAIL$ Требуется принять вознесение §Y$ap_galactic_wonders_utopia$§!"
 ap_uf_4:0 "Проект «Сверхмерные миры»"
 ap_uf_4_desc:0 "Два сверхмерных объекта конфликтуют друг с другом — и нам приходится изощряться, избегая вреда.\nНо решение найдено: орбитальный координатор. Наконец-то можно запускать проект сверхмерных миров!"
 uf_4_tooltip:0 "Позволяет обратить планеты в§Y затянутые небесами миры Объединения§! и§Y автоматизированные затянутые миры Объединения§!\nПозволяет обратить миры-кольца в§Y сверхмерные миры-кольца Объединения§! и§Y автоматизированные сверхмерные миры-кольца Объединения§!"
 requires_tech_uf_hyperdimensional_matter_2:0 "$TRIGGER_FAIL$ Требуется технология £physics£§Y$tech_uf_hyperdimensional_matter_2$§!"
 origin_united_fleet:0 "Объединённый флот"
 origin_united_fleet_desc:0 "Наша цивилизация пережила гражданскую войну невиданного размаха, что потомки назовут Объединённой; бессчётные жизни сгинули в ней.\nЖестокая война научила нас ценить единство: мы наконец отложили распри и вместе пришли к Объединению, обняв звёзды."
 origin_tooltip_uf_effects:0 "Старт за Объединённый флот\n§RЭто происхождение жутко имбовое/одержимое/сломанное§!\n§RОбязателен мод: United fleet Shipset§!\n§RЛучше не ставить NSC и прочие моды с новыми типами кораблей§!\n§RКоварные корабли-девы и Глубинные-ИИ, осиянные добрыми аурами, застыдятся и издохнут сами§!"
 civic_uf_1:0 "Звёздно-кольцевая корпорация Объединения"
 civic_uf_1_desc:0 "Звёздно-кольцевая корпорация построила для нашей прародины орбитальное кольцо, ставшее ключом к победе в Объединённой войне. Теперь корпорация продолжит служить нам, прокладывая империи дорогу вперёд."
 civic_uf_1_effects:0 "Прародина получает мегасооружение§Y орбитальное кольцо Объединения§! на старте"
 civic_uf_2:0 "Дипломатическая команда Объединения"
 civic_uf_2_desc:0 "Наша дипломатическая команда готова к всестороннему общению с цивилизациями галактики: всякий выбор мы делаем лишь после обстоятельного диалога, а война — всегда последний довод"
 civic_uf_3:0 "Эффективная администрация"
 civic_uf_3_desc:0 "Аппарат Объединённого флота сильно оптимизирован: новые решения принимаются и внедряются почти без лишних помех."
 civic_uf_4:0 "Ксенофилоассимиляторы"
 civic_uf_4_desc:0 "Ещё до выхода к звёздам мы владели искусством превращать другие виды в наших сестёр.\nМы верим: наша культура и достижения покорят каждого инопланетного гражданина — и мы позволим им стать нами."
 civic_uf_4_effects:0 "§YОткрывает политику§!: §HВступление в Объединение§!\n§YОткрывает планетарный указ§!: §Hакт помилования ассимиляции§!\nВ§H политике§! можно§G включать и выключать§! ассимиляцию населения; на планете же можно объявить§R акт помилования§!, запретив ассимиляцию её населения"
 civic_uf_5:0 "Выдающиеся лидеры"
 civic_uf_5_desc:0 "Лидеры Объединённого флота — элита, прошедшая строжайший отбор, исполненная духа самоотдачи."
 civic_uf_5_effects:0 "Все§Y лидеры на старте§! получают§G 800§! опыта (до§G 3-го§! уровня)\n§YГлавный учёный§! заменяется на§P доктора Юбари§!\n§RЭта гражданская особенность задаётся только на старте и не меняется§!\n "
 NAME_uf_Yubari:0 "Юбари"
 leader_trait_scientist_uf_Yubari:0 "Доктор Юбари"
 leader_trait_scientist_uf_Yubari_desc:0 "Доктор Юбари — один из лучших главных учёных Объединения, особенно сильна в инженерных науках."
 leader_trait_scientist_uf_Yubari_2:0 "Доктор Юбари"
 leader_trait_scientist_uf_Yubari_2_desc:0 "Доктор Юбари — один из лучших главных учёных Объединения, особенно сильна в инженерных науках."
 leader_trait_scientist_uf_Yubari_3:0 "Доктор Юбари"
 leader_trait_scientist_uf_Yubari_3_desc:0 "Доктор Юбари — один из лучших главных учёных Объединения, особенно сильна в инженерных науках."
 uf_cylinder:0 "Цилиндр О'Нила"
 uf_cylinder_DESC:0 "Космическая обиталище, называемое цилиндром О'Нила; однако потрёпанная обшивка и выходящая из-под контроля экосистема говорят о его медленном умирании."
 uf_mega_store:0 "Площадка глубокого космического склада Объединения"
 uf_mega_store_DESC:0 "Базовая платформа для стройки глубокого космического склада — впрочем, технически это просто склад."
 uf_mega_store_1:0 "Глубокий космический склад Объединения"
 uf_mega_store_1_DESC:0 "Исполинский склад в глубоком космосе для гор ресурсов. Но нам, хомячкам, пожалуй, вечно понадобится ещё один."
 uf_mega_store_MEGASTRUCTURE_DETAILS:0 "Исполинский склад в глубоком космосе для гор ресурсов."
 requires_no_existing_uf_rectangular:0 "$TRIGGER_FAIL$ Мы можем построить только один Галактический монумент"
 uf_rectangular_0:0 "Платформа Галактического монумента"
 uf_rectangular_0_MEGASTRUCTURE_DETAILS:0 "Из собранных обломков монолитов и извлечённых данных мы перекуем великий Галактический монумент"
 uf_rectangular_0_DESC:0 "Ради вечного хранения монумента мы выстроим для него сверхмерный короб."
 uf_rectangular_0_1:0 "Галактический монумент"
 uf_rectangular_0_1_DESC:0 "Эти торжественные монументы хранят память о цивилизациях, собранных монолитами за тысячи циклов на протяжении миллиардов лет; их самоотверженность и жертвы выкупили конец круговорота."
 uf_rectangular:0 "Галактический монумент"
 uf_rectangular_DESC:0 "Эти торжественные монументы хранят память о цивилизациях, собранных монолитами за тысячи циклов на протяжении миллиардов лет; их самоотверженность и жертвы выкупили конец круговорота."
 uf_gate_0:0 "Платформа Звёздной колеи Объединения"
 uf_gate_0_MEGASTRUCTURE_DETAILS:0 "Звёздная колея Объединения — одно из новейших воплощений сверхмерной сети: её сверхмерные линии пробивают любые пространственные пределы и способны связать всю вселенную и даже неведомые параллельные миры. С неё мы начнём настоящий Великий поход."
 uf_gate_0_DESC:0 "Звёздная колея Объединения — одно из новейших воплощений сверхмерной сети: её сверхмерные линии пробивают любые пространственные пределы и способны связать всю вселенную и даже неведомые параллельные миры. С неё мы начнём настоящий Великий поход."
 uf_gate_0_1:0 "Звёздная колея Объединения"
 uf_gate_0_1_DESC:0 "Сверхмерный короб Звёздной колеи Объединения."
 uf_gate_1:0 "Звёздная колея Объединения"
 uf_gate_1_DESC:0 "Звёздная колея Объединения — одно из новейших воплощений сверхмерной сети: её сверхмерные линии пробивают любые пространственные пределы и способны связать всю вселенную и даже неведомые параллельные миры. С неё мы начнём настоящий Великий поход."
 uf_gate_2:0 "Отплытие"
 uf_gate_2_DESC:0 "Мы покинем эту галактику и начнём Великий поход, что вызволит всех сородичей из круговорота.\n§RОднажды запущенное — партия завершится победой§!"
 requires_no_existing_uf_gate:0 "$TRIGGER_FAIL$ Мы можем построить только одну Звёздную колею Объединения"
 uf_star_city:0 "Звёздный город развлечений Объединения"
 uf_star_city_DESC:0 "Исполинский космический город развлечений: любая забава, что вы способны вообразить, найдётся в этом дивном месте."
 uf_star_city_MEGASTRUCTURE_DETAILS:0 "Исполинское кольцо космических развлечений: любая забава, что вы способны вообразить, найдётся здесь. К тому же тут толпятся гастрономические кварталы — даже Лига гастрокритиков пустила здесь корни."
 uf_star_city_effects:0 "£job_uf_food_writer£ $job_uf_food_writer_plural$: выработка £unity£ §Y$unity$§!§G+5§!"
 requires_no_existing_uf_star_city:0 "$TRIGGER_FAIL$ Мы можем построить только один звёздный город развлечений"
 tech_uf_space_city:0 "Звёздный город развлечений Объединения"
 tech_uf_space_city_desc:0 "Исполинский космический город развлечений: любая забава, что вы способны вообразить, найдётся в этом дивном месте."
 tech_uf_space_city_edicts:0 "§HОткрывает мегасооружение: §! звёздный город развлечений Объединения"
 uf_ancient_galaxy_gun:0 "Галактическая пушка"
 uf_ancient_galaxy_gun_DESC:0 "Межсистемное оружие, спроектированное и построенное несколькими неведомыми цивилизациями — по каким-то причинам брошенное."
 uf_ancient_galaxy_gun_1:0 "Галактическая пушка (зарядка)"
 uf_ancient_galaxy_gun_1_DESC:0 "Первый за миллион лет выстрел Галактической пушки."
 uf_ancient_galaxy_gun_2:0 "Галактическая пушка"
 uf_ancient_galaxy_gun_2_DESC:0 "Галактическая пушка в момент залпа."
 uf_ancient_galaxy_gun_destroyed:0 "Обломки Галактической пушки"
 uf_ancient_galaxy_gun_destroyed_DESC:0 "Галактическая пушка уничтожена подчистую, ремонту не подлежит — практика доказала: оружие это ненадёжно."
 uf_ancient_galaxy_gun_effect:0 "Луч небытия"
 uf_ancient_galaxy_gun_effect_DESC:0 "Высокэнергетический луч Галактической пушки уничтожает эту систему."
 uf_ancient_galaxy_gun_unexplored:0 "$TRIGGER_FAIL$ Сперва завершите исследование"
 ancient_galaxy_gun_station:0 "Станция наблюдения"
 ancient_galaxy_gun_station_tooltip:0 "Космическая станция для наблюдения и записи всевозможных данных."
 ancient_galaxy_gun_station_desc:0 "Космическая станция для наблюдения и записи всевозможных данных."
 tech_uf_galactic_university:0 "Звёздно-морской университет Объединения"
 tech_uf_galactic_university_desc:0 "Университет звёздного моря, открытый для всей галактики: мы позовём мудрецов§G порядочных держав§! вместе двигать галактику вперёд."
 uf_galactic_university:0 "Площадка Звёздно-морского университета Объединения"
 uf_galactic_university_DESC:0 "Мы построим университет звёздного моря, открытый для всей галактики; закончив, позовём мудрецов§G порядочных держав§! вместе двигать галактику вперёд."
 uf_galactic_university_MEGASTRUCTURE_DETAILS:0 "Мы построим университет звёздного моря, открытый для всей галактики; закончив, позовём мудрецов§G порядочных держав§! вместе двигать галактику вперёд."
 uf_galactic_university_1:0 "Звёздно-морской университет Объединения"
 uf_galactic_university_1_DESC:0 "Здесь собрались умнейшие головы всей галактики: университет звёздного моря открыт для всех."
 uf_galactic_university_sub:0 "Площадка филиала Звёздно-морского университета"
 uf_galactic_university_sub_DESC:0 "Здесь мы построим филиал университета звёздного моря."
 uf_galactic_university_sub_MEGASTRUCTURE_DETAILS:0 "Филиал университета звёздного моря: до главного кампуса не дотягивает, но всё равно один из сильнейших во всей галактике."
