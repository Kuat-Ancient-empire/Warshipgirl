 tech_uf_hyperdimensional_matter:0 "Станция улавливания сверхмерного вещества"
 tech_uf_hyperdimensional_matter_desc:0 "Глубоко разобрав наработки базы Ностона, мы нашли способ ловить сверхмерное вещество безопаснее и эффективнее."
 tech_uf_hyperdimensional_matter_2:0 "Улучшение станции улавливания"
 tech_uf_hyperdimensional_matter_2_desc:0 "Прежние нормы требовали не менее 230 км между двумя станциями улавливания — иначе они конфликтуют. Теперь мы умеем создавать куда более стабильную среду и можем ставить объекты плотнее."
 building_uf_hyperdimensional_matter:0 "Станция улавливания сверхмерного вещества Объединения"
 building_uf_hyperdimensional_matter_desc:0 "Сверхмерное вещество наблюдаемо лишь в особых условиях и ловится с великим трудом: нужны огромная энергия и особые сплавные контейнеры для длительного хранения."
 building_uf_hyperdimensional_matter_2:0 "Главная станция улавливания сверхмерного вещества Объединения"
 building_uf_hyperdimensional_matter_2_desc:0 "Оснащена более передовыми полевыми установками — среда для извлечения сверхмерного вещества куда стабильнее."
