 uf_mega_habitat_0:0 "Площадка мира Объединённой славы"
 uf_mega_habitat_0_DESC:0 "С этой малой платформы начнётся величайшая конструкция галактики: мы сотворим настоящую утопию."
 uf_mega_habitat_0_MEGASTRUCTURE_DETAILS:0 "Строительная платформа за гравитационной границей системы — передовой лагерь для создания системы мира Объединённой славы."
 uf_mega_habitat_0_1:0 "Мир Объединённой славы — короб"
 uf_mega_habitat_0_1_DESC:0 "Мир славы так огромен, что придётся создать для него искусственную систему."
 uf_mega_habitat_1:0 "Мир Объединённой славы — ядро"
 uf_mega_habitat_1_DESC:0 "Ядро мира славы напрямую связано со сверхмерной сетью; часть зон уже в строю. Функция врат активируется на следующей стадии."
 uf_mega_habitat_2:0 "Мир Объединённой славы — каркас"
 uf_mega_habitat_2_DESC:0 "Базовый каркас готов; далее — верхний каркас и жилое крыло."
 uf_mega_habitat_3:0 "Мир Объединённой славы — жилое крыло"
 uf_mega_habitat_3_DESC:0 "Каркасы верхнего яруса и лопастей готовы; последний, решающий шаг — экосекторы жилого крыла."
