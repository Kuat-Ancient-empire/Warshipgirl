 origin_united_fleet_glory_world_desc:0 "§YЯ знаю, что наше происхождение не таково, но как слушатель я вправе задать, что мы родом из мира славы за пределами галактики, а легендарный 15-й флот Объединения сквозь время и пространство придёт мне на помощь§!"
 origin_tooltip_uf_glory_world_effects:0 "§RЭто происхождение доступно только одному игроку§!\nСтарт за пределами галактики, в мире славы\nНа старте — Объединёнский§H 15-й флот§!\nВ домашней системе появится§H особый пункт доступа§! для призыва§G особых кораблей§! из мода\n§RЭто происхождение ещё более одержимое/имбовое, чем прошлое§!"
