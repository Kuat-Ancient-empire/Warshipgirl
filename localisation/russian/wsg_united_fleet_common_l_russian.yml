 tech_uf_hm_network_2:0 "Командная сеть Объединения"
 tech_uf_hm_network_2_desc:0 "Наш командный состав через сверхмерную сеть управляет флотами в реальном времени с любой дальности."
 tech_uf_hm_network_3:0 "Инженерная командная система Объединения"
 tech_uf_hm_network_3_desc:0 "Дистанционное инженерное руководство через сверхмерную сеть изрядно ускорит стройки."
 tech_uf_mozheng:0 "Извлечение ресурсов иных миров"
 tech_uf_mozheng_desc:0 "Сверхмерным веществом мы тянем нужные ресурсы из других планов; некоторые нам, может, и не применить, но их чудные свойства стоят изучения."
