 sr_uf:0 "Сверхмерное вещество Объединения"
 sr_uf_desc:0 "Сверхмерное вещество, обнаруженное на Ностоне: имеет ряд свойств, не подчиняющихся правилам нашей реальности, и таит бездну энергии."
 UF_army:0 "Боевой корпус Объединения"
 UF_army_desc:0 "Боевая доктрина корпуса Объединения проверена Объединённой войной — они не ведают страха."
 UF_ATAT:0 "Шагоход Объединения"
 UF_ATAT_desc:0 "Большой всетеренный боевой мех: впервые явился в Объединённую войну, взламывая считавшиеся несокрушимыми линии обороны; его передовая конструкция служит и поныне."
 tech_uf_hm_army:0 "Экспериментальная сверхмерная морпехота"
 tech_uf_hm_army_desc:0 "Мы создадим десантный корпус с самым передовым экспериментальным сверхмерным вооружением — им стать становым хребтом поля боя."
 UF_advanced_army_2:0 "Сверхмерная морпехота Объединения"
 UF_advanced_army_2_desc:0 "Десантный корпус с самым передовым экспериментальным сверхмерным вооружением — становой хребет поля боя."
 tech_uf_hm_army_2:0 "Сверхмерное воплощение"
 tech_uf_hm_army_2_desc:0 "Суперсухопутная единица из чистой сверхмерной силы: верно исполнит любой приказ и ни при каких обстоятельствах не выйдет из-под контроля, разнеся целевую планету.\nЕдинственная беда — их укачивает: перевозить приходится в криокапсулах, потому в космических боях они не участвуют"
 UF_advanced_army_3:0 "Сверхмерное воплощение"
 UF_advanced_army_3_desc:0 "Суперсухопутная единица из чистой сверхмерной силы: верно исполнит любой приказ и ни при каких обстоятельствах не выйдет из-под контроля, разнеся целевую планету.\nЕдинственная беда — их укачивает: перевозить приходится в криокапсулах, потому в космических боях они не участвуют."
 mod_planet_pops_energy_upkeep_mult:0 "Содержание населения в энергокредитах"
 mod_planet_districts_physics_research_produces_mult:0 "Ежемесячная физика с районов"
 mod_planet_districts_engineering_research_produces_mult:0 "Ежемесячная инженерия с районов"
 mod_planet_districts_society_research_produces_mult:0 "Ежемесячная социология с районов"
 tech_uf_doom:0 "Протокол орбитальной бомбардировки Объединения"
 tech_uf_doom_desc:0 "Мы сможем особыми сверхмерными бомбами производить мгновенный подрыв целевой планеты — теоретически ни одна нервная система не успеет это почувствовать."
 uf_doom_edicts:0 "§HОткрывает бомбардировку: §! Милосердный протокол Объединения"
 uf_doom_edicts_desc:0 "Особая сверхмерная бомба производит мгновенный подрыв целевой планеты."
 bombardment_uf_doom:0 "Милосердный протокол Объединения"
 bombardment_uf_doom_name:0 "Орбитальная бомбардировка «Милосердный протокол Объединения»"
 bombardment_uf_doom_desc:0 "Бомбардировка $bombardment_uf_doom$ обрушивает на цель сверхмерные бомбы, завершая подрыв максимально быстро — теоретически ни одна нервная система не успеет это почувствовать.\n-§Rнепоправимый§! урон§Y планете§!\n-при§R 100%§! разрушения планета будет§R уничтожена безвозвратно§!"
 uf_origin.10006.name:0 " [From.GetName] уничтожен"
 uf_origin.10006.desc:0 "Флот §H [From.From.GetName] §! обрушил на§H [From.GetName]§! особую бомбу — планета была уничтожена почти мгновенно…… Выживших нет."
 uf_origin.10006.a:0 "Отомстим сполна!"
 uf_origin.10007.desc:0 "Наши флоты доложили: бомбометание по§H [From.GetName]§! завершено — цель уничтожена нашим флотом подчистую."
 uf_origin.10007.a:0 "Принято"
 bombed_to_broken_world:0 "§Y [From.GetName] теперь разломанный мир. §!"
 edict_uf_colony:0 "[[Колониальный азарт]] бесплатные талоны на еду"
 edict_uf_colony_desc:0 "Гражданам, отправляющимся колонизировать новые миры, мы выдадим годовые бесплатные талоны на кебаб."
 edict_uf_building_slot:0 "[[Стальной лес]] резерв слотов под постройки"
 edict_uf_building_slot_desc:0 "Стоит нам раздать тортиков — и граждане стерпят наш обычай резервировать массы пустых площадей: это упростит планирование застройки позже."
 edict_uf_produces:0 "[[Расширяем производство]] гастростимул"
 edict_uf_produces_desc:0 "Отличившимся в этот день мы выдадим изысканный ужин — это изрядно подстегнёт трудовой энтузиазм."
 edict_uf_hm_research:0 "[[Научный прорыв]] сверхмерная наука"
 edict_uf_hm_research_desc:0 "Мы выделим научным учреждениям добавочное сверхмерное вещество, дабы ускорить их работу."
 edict_uf_hm_eyes:0 "[[Стабильность общества]] сверхмерный надзор"
 edict_uf_hm_eyes_desc:0 "Передовая ИИ-распознавалка вкупе с многомерным наблюдением через сверхмерное вещество предупредит преступления заранее."
 edict_uf_hm_dj:0 "[[Великая стройка]] сверхмерная инженерия"
 edict_uf_hm_dj_desc:0 "Мы ускорим стройки сверхмерным веществом."
 edict_uf_hm_weapon:0 "[[Военное строительство\] сверхмерное оружие"
 edict_uf_hm_weapon_desc:0 "Мы укрепим наши корабли и системы вооружения сверхмерным веществом."
 edict_uf_hm_sensor:0 "[[Безопасность полётов]] сверхмерные сенсоры"
 edict_uf_hm_sensor_desc:0 "Сверхмерное вещество даст нашим кораблям куда более дальнее зрение — риски заметим заранее."
 edict_uf_zro:0 "[[Редкие ресурсы]] аромат Зро"
 edict_uf_zro_desc:0 "Аромат из Зро успокаивает, приобщает к психосиле — и разжигает аппетит."
 edict_uf_dark_matter:0 "[[Редкие ресурсы]] наука тёмной материи"
 edict_uf_dark_matter_desc:0 "Тайные знания тёмной материи изрядно подталкивают физику."
 edict_uf_nanite_actuators:0 "[[Редкие ресурсы]] наноматериалы"
 edict_uf_nanite_actuators_desc:0 "Чудо-наномашины ускорят планетарные стройки и сократят содержание."
 edict_uf_only_shipyard:0 "§Y[[Сверхмерный док]] запретить прочим докам строить корабли§!"
 edict_uf_only_shipyard_desc:0 "Ценой закрытия 100 доков — запретить строить корабли мегасооружениям, Владыкам и звёздным базам, где доков меньше 100.\n\n§RДаже сотни доков нет — а туда же, называется доком§!"
 policy_uf_assimilation:0 "Вступление в Объединение"
 policy_uf_assimilation_desc:0 "Ассимиляция прочих видов в объединённых кораблей-дев: каждый год на всех планетах§Y 6–20§! инопланетян обращаются в объединённых кораблей-дев — если планете не объявлен§R акт помилования§!.\n\n§YЯ добровольно вступаю в гражданство Объединённого флота, добровольно разрываю все связи с прежним государством, отказываюсь от его прав и обязанностей и клянусь в верности Объединённому флоту, поддерживаю правительство Объединённого флота, соблюдаю конституцию Объединённого флота, все законы и установления; слава Объединению! §!\n"
 uf_no_assimilation:0 "Запретить ассимиляцию"
 uf_no_assimilation_desc:0 "Хотя инопланетные подруги в наших владениях все как одна стремятся стать объединёнными кораблями-девами, нам стоит беречь разнообразие видов — так что полностью разрешать им становиться нашими сёстрами мы не будем"
 uf_assimilation:0 "Разрешить ассимиляцию"
 uf_assimilation_desc:0 "Инопланетные подруги в наших владениях все без исключения хотят стать частью нашей великой цивилизации и внести в неё свой кирпич. Теперь мы разрешим им биохимическое преображение — чтобы и душой, и телом они стали нашими объединёнными кораблями-девами."
 tech_uf_assimilation:0 "Политика ассимиляции населения"
 tech_uf_assimilation_desc:0 "Инопланетные подруги в наших владениях все без исключения хотят стать частью нашей великой цивилизации и внести в неё свой кирпич. Теперь мы разрешим им биохимическое преображение — чтобы и душой, и телом они стали нашими сёстрами.\nВ§H политике§! можно§G включать и выключать§! ассимиляцию населения; на планете же можно объявить§R акт помилования§!, запретив ассимиляцию её населения"
 uf_assimilation_diplo:0 "§YОткрывает политику§!: §HВступление в Объединение§!\n§YОткрывает планетарный указ§!: §Hакт помилования ассимиляции§!\n\nВ§H политике§! можно§G включать и выключать§! ассимиляцию населения; на планете же можно объявить§R акт помилования§!, запретив ассимиляцию её населения"
 uf_assimilation_diplo_desc:0 "§RStellaris до сих пор не поддерживает новые права населения — ослы из Paradox, прости-господи§!"
 decision_planet_uf_population_control:0 "Указ о контроле населения Объединения"
 decision_planet_uf_population_control_desc:0 "Кошкодевочек — конечное число; чересчур разросшись, население получит куда меньше кошкодевочек на душу. Так что контроль населения на этой планете — вещь необходимая."
 decision_planet_uf_population_control_end:0 "Указ о контроле населения Объединения отменён"
 decision_planet_uf_population_control_end_desc:0 "Мы снова разрешаем населению свободный рост"
 decision_planet_uf_population_control_effects_short:0 "Население планеты больше не растёт свободно"
 planet_uf_population_control:0 "Контроль населения Объединения"
 planet_uf_population_control_desc:0 "Ради кошкодевочек и автоматизации!"
 opinion_join_uf:0 "Ассимилировала в объединённых кораблей-дев"
 opinion_join_uf_our_species:0 "Ассимилировала в объединённых кораблей-дев"
 decision_planet_uf_no_assimilation:0 "Акт помилования"
 decision_planet_uf_no_assimilation_desc:0 "Объявление: §Hпо разным причинам инопланетные граждане этой планеты лишаются права стать объединёнными кораблями-девами; ассимиляция на этой планете вестись не будет. Просим с пониманием. §!"
 decision_end_planet_uf_no_assimilation:0 "Акт помилования отменён"
 decision_end_planet_uf_no_assimilation_desc:0 "Объявление: §Hпланета вновь разрешает инопланетным гражданам стать объединёнными кораблями-девами; станции приёма откроются во всех крупных городах — милости просим! Слава Объединению! §!"
 decision_end_planet_uf_no_assimilation_effects_short:0 "Ассимиляция населения на планете возобновится"
 planet_uf_no_assimilation:0 "Акт помилования"
 planet_uf_no_assimilation_desc:0 "Мы запрещаем инопланетным гражданам планеты становиться объединёнными кораблями-девами; их может это слегка задеть."
 tech_uf_evolver:0 "Сверхмерная эволюция"
 tech_uf_evolver_desc:0 "Пусть мы обрели невиданное сверхмерное тело — учиться и эволюционировать дальше всё равно нужно"
 uf_evolver_diplo:0 "§YОткрывает планетарный указ§!: сверхмерная эволюция"
 uf_evolver_diplo_desc:0 "Этот указ — для борьбы с безработицей"
 decision_planet_uf_evolver:0 "Сверхмерная эволюция"
 decision_planet_uf_evolver_desc:0 "Мы позволим большинству объединённых кораблей-дев пройти сверхмерную эволюцию, дабы они лучше овладели сверхмерным веществом. §YЧем больше сверхмерно эволюционирующих — тем выше выработка места§!"
 decision_end_planet_uf_evolver:0 "Сверхмерная эволюция остановлена"
 decision_end_planet_uf_evolver_desc:0 "Так, обратно на профильную работу."
 planet_uf_evolver:0 "Сверхмерная эволюция"
 planet_uf_evolver_desc:0 "Большинство объединённых кораблей-дев на планете проходит тренировку сверхмерной эволюции. §YЧем больше сверхмерно эволюционирующих — тем выше выработка места§!"
 job_uf_evolver:0 "Сверхмерно эволюционирующая"
 job_uf_evolver_effect_desc:0 "£job_uf_evolver£ $job_uf_evolver_plural$ глубоко осваивает сверхмерное вещество, добывая ресурсы из пустоты. §YЧем больше сверхмерно эволюционирующих — тем выше выработка§!"
 mod_job_uf_evolver_add:0 "Место сверхмерно эволюционирующей"
 mod_job_uf_evolver_per_pop:0 "На каждые §G+1§! место $job_uf_evolver$ на $VALUE$ населения"
 mod_job_uf_evolver_per_pop_short:0 "На каждые §G+1§! место $job_uf_evolver$ на $VALUE$ населения"
 job_uf_evolver_plural:0 "Места сверхмерно эволюционирующих"
 job_uf_evolver_cap:0 "$job_uf_evolver$"
 job_uf_evolver_desc:0 "Пусть мы обрели невиданное сверхмерное тело — учиться и эволюционировать дальше всё равно нужно. §YЧем больше сверхмерно эволюционирующих — тем выше выработка места§!"
