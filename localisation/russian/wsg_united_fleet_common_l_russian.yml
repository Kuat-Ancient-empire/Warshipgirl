 uf_kind_yard:0 "Площадка сверхмерного дока Объединения"
 uf_kind_yard_DESC:0 "Строительная платформа за гравитационной границей системы — передовой лагерь для создания системы сверхмерного дока."
 uf_kind_yard_MEGASTRUCTURE_DETAILS:0 "Строительная платформа за гравитационной границей системы — передовой лагерь для создания системы сверхмерного дока."
 uf_kind_yard_1:0 "Возведение сверхмерного короба"
 uf_kind_yard_1_DESC:0 "Мы развернём в целевой зоне сверхмерную сеть и возведём сверхмерное мегасооружение."
 uf_kind_yard_2:0 "Ядро сверхмерного дока"
 uf_kind_yard_2_DESC:0 "Ядро сверхмерного дока: на его основе мы достроим величайший док галактики."
 uf_kind_yard_3:0 "Каркас консолей сверхмерного дока"
 uf_kind_yard_3_DESC:0 "Первая стадия стройки завершена: на ядро добавлены каркасы четырёх консольных доков для стоянки и обслуживания; продолжаем вливать ресурсы до полного завершения."
 uf_kind_yard_4:0 "Консольные доки сверхмерного дока"
 uf_kind_yard_4_DESC:0 "Консольные доки готовы на 80%: ещё немного монтажа и отладки — и сильнейший док галактики заработает."
 uf_mega_shipyard:0 "§YСверхмерный док Объединения§!"
