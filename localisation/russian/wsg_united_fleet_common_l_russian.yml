 tech_uf_rare_resource:0 "Центр сверхмерного извлечения ресурсов Объединения"
 tech_uf_rare_resource_desc:0 "Одно из чудо-свойств сверхмерного вещества позволяет выискивать в высших планах редчайшие ресурсы — достаточно добавочной энергии, чтобы вытащить их к нам."
