l_russian:

 Parit_age:0 "Цивилизация дев Парита"
 Parit_age_desc:0 "У этой цивилизации дев — невероятные технологии, кое-что почти уровня падших империй. Передовые гражданские объекты закрывают все нужды жителей; правда, сами они увязли в виртуальных развлечениях, и до космоса им дела нет."
 col_pre_ftl_Parit_age:0 "$Parit_age$"
 col_pre_ftl_Parit_age_desc:0 "$Parit_age_desc$"
 col_pre_ftl_Parit_age_tt:0 "$Parit_age_desc$"
 Parit_army:0 "Автоматические войска Парита"
 Parit_army_desc:0 "Автоматизированная военная сила планеты Парит: любой, кто попытается войти в атмосферу, получит отпор."
 building_primitive_capital_Parit:0 "Узел Парита"
 building_primitive_capital_Parit_desc:0 "Столичное здание Парита; вся администрация давно заменена автоматами."
 building_game_centre_Parit:0 "Центр развлечений Парита"
 building_game_centre_Parit_desc:0 "Гигантский центр вирт-развлечений; часть дев-домоседок просто поселилась внутри."
 building_energy_Parit:0 "Электростанция Парита"
 building_energy_Parit_desc:0 "Не полностью автоматизирована, но спроектирована так, что управится любой, кто не слабоумный и умеет читать."
 building_data_base_Parit:0 "База данных Парита"
 building_data_base_Parit_desc:0 "§!§H «Если эта база запущена — нашу цивилизацию постиг разрушительный удар. Помните: сведения здесь помогут вам вернуть былое величие империи!»§!\nЭта надпись выведена на самом видном месте базы и подсвечена; впрочем, никто её не читает — зато развлекательных данных вытащили изрядно."
 building_food_Parit:0 "Чудо-столовая Парита"
 building_food_Parit_desc:0 "Великолепная автостоловая: горы блюд ежедневно, и к каждому блюду — роскошная фигурка."
 building_minerlas_Parit:0 "Автошахта Парита"
 building_minerlas_Parit_desc:0 "Как известно, вес любого шахтёрского инструмента раздавит домоседку; автошахта придумана, чтобы этой опасности не случалось."
 job_primitive_gamer_Parit:0 "Залипающая в вирт"
 mod_job_primitive_gamer_Parit_add:0 "Залипающая в вирт"
 job_primitive_gamer_Parit_plural:0 "Залипающая в вирт"
 job_primitive_gamer_Parit_cap:0 "$job_primitive_gamer_Parit$"
 job_primitive_gamer_Parit_desc:0 "Благодаря передовой автоматике этим залипающим в виртуальность девам не о чем заботиться — единственная забота: во что играть завтра."
 primitive_gamer_Parit_desc:0 "Залипающая в вирт"
 job_energy_Parit:0 "Оператор станции Парита"
 mod_job_energy_Parit_add:0 "Оператор станции Парита"
 job_energy_Parit_plural:0 "Оператор станции Парита"
 job_energy_Parit_cap:0 "$job_energy_Parit$"
 job_energy_Parit_desc:0 "Работа предельно сложная: раз в три дня двинуть рычаг; в какую сторону — см. инструкцию."
 energy_Parit_desc:0 "Оператор станции Парита"
 job_eater_Parit:0 "Гедонистка Парита"
 mod_job_eater_Parit_add:0 "Гедонистка Парита"
 job_eater_Parit_plural:0 "Гедонистка Парита"
 job_eater_Parit_cap:0 "$job_eater_Parit$"
 job_eater_Parit_desc:0 "Почти все девы Парита — гедонистки: каждый день только еда, питьё да развлечения."
 eater_Parit_desc:0 "Гедонистка Парита"
 planet_Parit:0 "Щит Парита"
 planet_Parit_desc:0 "Мощные автоматические войска Парита атакуют любую цель, что попытается войти в атмосферу."
 d_Parit:0 "Чудо Парита"
 d_Parit_desc:0 "Планета явно глубоко терраформирована: природные ландшафты, здесь невозможные, — есть. Тонкие искусственные меры позволяют зоне выдавать легко собираемые редкие ресурсы."
 d_Parit2:0 "Склад сплавов Парита"
 d_Parit2_desc:0 "Склады забиты сплавами; но жители не летают в космос, и сплавы идут лишь на обслуживание машин."
 d_Parit3:0 "Подсолнуховое море Парита"
 d_Parit3_desc:0 "Бескрайнее подсолнуховое море, красота несусветная; при нужде подсолнухи жгут для электричества.\n§!§HКогда-то один джедай заготовил здесь свежесрезанные подсолнухи для своей прекрасной жены. §!"
 d_Parit4:0 "Корабельное кладбище Парита"
 d_Parit4_desc:0 "Кладбище «списанных» звездолётов. Большинство кораблей заброшено по сущим пустякам: слетела гильза рычага, сломался массажный диван, автомат не пополнили, у злодейского босса сел плейер с саундтреком. По сравнению с расчисткой обвившего корабли кустарника, ремонт этих мелочей — копейки."
 d_Parit5:0 "Главный вход базы данных Парита"
 d_Parit5_desc:0 "Из-за поломки уборочных роботов бытовой мусор полностью завалил главный вход в ядро базы данных. Это единственный путь к ядру — быть может, в данных мы найдём утраченную историю Парита?"
 executor_ship_object:0 "«Эндория»"
 executor_ship_object_desc:0 "Снаружи корабль цел — но внутри он отрезан от реальной вселенной; любая попытка войти оказывалась самоубийством."
 wg_parit.4.name:0 "Автоматическая оборона Парита"
 wg_parit.4.desc:0 "§!§R Внимание! §! Вы нарушили статью 14553194 «Регламента безопасности Парита», а именно:\n\n§!§Hзапрет приближения к орбите планеты любым флотам, не принадлежащим Париту§!\n\nОборонные силы приступают к операции: нарушители будут уничтожены без жалости!"
 wg_parit.4.a:0 "Стойте, мы просто проходили!"
 wg_parit.5.name:0 "Автоматическая оборона Парита"
 wg_parit.5.desc:0 "§!§R Внимание! §! Добро пожаловать на Парит; прочтите и подпишите «Регламент безопасности Парита». Важнейшая — статья 14553194:\n\n§!§Hзапрет приближения к орбите планеты любым флотам, не принадлежащим Париту§!\n\nПри нарушении силы безопасности уничтожат нарушителей без жалости!"
 wg_parit.5.a:0 "О-о, конечно! Всё прочитал!"
 wg_parit.8.name:0 "Флот Парита"
 wg_parit.8.desc:0 "Мы починили пригодные корабли кладбища. Большинство было брошено по вздорным причинам и чинится на раз — но жуткие условия хранения всё же добили часть."
 wg_parit.8.a:0 "Великолепно"
 wg_parit.9.name:0 "База данных Парита"
 wg_parit.9.desc:0 "Расчистив километровую гору мусора вокруг главного входа, мы наконец увидели врата — тайна Парита перед нами."
 wg_parit.9.a:0 "Вперед"
 wg_parit.10.name:0 "§!§R Предупреждающий знак базы§!"
 wg_parit.10.desc:0 "На главных вратах базы — броская§!§R красная надпись§!\nДля безопасности лингвисты часами дешифровали красное предупреждение (местные глубинные девы поленились прийти перевести).\nИтог: §!§R «Не складировать мусор у входа в базу»§!"
 wg_parit.10.a:0 "??????"
 wg_parit.10.b:0 "…………"
 wg_parit.11.name:0 "Парит — §!§H падшая империя§!"
 wg_parit.11.desc:0 "Чистейший интерьер базы — совершенный контраст с помойкой снаружи. Из исторических массивов мы узнали утраченную и потрясающую историю Парита.\nПарит — не настоящее имя цивилизации; народ-мать звал себя§!§H Империей Эндория§!.\nЭндория была древней империей на пике. Около двухсот тысяч лет назад, в зените, она решила исследовать миры за пределами галактики — но экспедиция была разбита неведомой силой, и флот пропал без вести. Затем наступил перелом: по невыясненной причине Эндория начала войну со всей галактикой. Имея техническое превосходство, она не совладала со стаей волков: гигантскую империю расчленили и громили по частям; хотя Эндория одолела врагов, разрушения были непоправимы. К счастью, по требованию Совета Наблюдателей был принят§H «Протокол Парит»§!: он направил межзвёздный дредноут «Эндория» тайно доставить выживших на эту планету. Замыслом авторов было: пусть передовая техника и архивы Парита помогут девам Эндории восстать и вернуть былое величие.\n\nНо девы Эндории, очевидно, привыкли к сытой жизни: возрождение нации им не интересовало, и поколение за поколением они забыли даже собственные истоки.\n\nВ базе записано и положение родного мира Эндории — быть может, наведаемся?"
 wg_parit.11.a:0 "Эндория?! Я знаю это имя! Мы обязаны попасть туда!!"
 wg_parit.11.b:0 "Ищем Эндорию"
 wg_parit.11.c:0 "Нам неинтересны эти антикварные штучки"
 wg_parit.12.name:0 "Эндория — §!§H былая империя§!"
 wg_parit.12.desc:0 "Мы прибыли в Эндорию, очередную столицу великой древней империи. Когда-то здесь был один из административных центров и сильнейшая в галактике корабельная система; ныне — одни руины.\n\nОколо двухсот тысяч лет назад Эндория на пике задумала исследовать иное за пределами галактики — экспедицию внезапно прекратили, флот пропал. Затем перелом: по невыясненной причине Эндория начала войну со всей галактикой. Имея техническое превосходство, она не совладала со стаей волков: империю расчленили и громили по частям; хотя Эндория одолела врагов, разрушения были непоправимы. К концу империи мир-кольцо, вмещавшее сотни миллионов граждан, лежал в руинах, а исполинские доки одряхлели.\nЭндория надеялась, что потомки — жители Парита — однажды вернутся и отстроят империю. Увы, этому не бывать."
 wg_parit.12.a:0 "Наследие древних предтеч примем мы"
 wg_parit.12.b:0 "У антикваров всегда несбыточные мечты — потому они и проиграли"
 site_eddy:0 "Эндория"
 site_eddy_intro:0 "Древнее мир-кольцо Эндории после разрушительного удара стало безнадёжно мёртвым кольцом. И всё же здесь стоит пошарить."
 wg_parit.13.name:0 "Щитовая капсула"
 wg_parit.13.desc:0 "Команда сняла с кольца молекулярное сканирование — ничего ценного. Уже собираясь бросить, исследовательница заметила провал на сканограмме; на месте оказался отсек под передовым щитом. Сверившись с данными Парита, мы сняли щит и извлекли данные целыми.\n\n§!§H«Потомки Эндории! Как видите, былая империя — руины; вы могли даже забыть нашу историю»§!\n\nОстаток данных подробно рассказал о прошлом Эндории — от взлёта до последнего часа.\n\n§!§H«Наш шанс ушёл; будущее — за вами. Сектор 1-1-4: там наш последний подарок.»§!"
 wg_parit.13.a:0 "В сектор 1-1-4"
 wg_parit.14.name:0 "Сектор 1-1-4"
 wg_parit.14.desc:0 "В самом секторе 1-1-4 ничего полезного не нашлось — из-за разлома конструкции там зияет пустота. Обшарив окрестности, мы нашли в обломках кольца обещанный подарок: такой же отсек под таким же щитом; пароль придётся искать в базах Парита."
 wg_parit.14.a:0 "Скорее взламывать пароль"
 wg_parit.15.name:0 "Эндория: последний подарок"
 wg_parit.15.desc:0 "Мы искали верный пароль в гигабайтах данных Парита — а он оказался в первой же строке! Это был тест на внимательность!!\n\nЭндория в древности поднялась на кораблестроении — и подарок о нём: «Руководство модульного кораблестроения Эндории». Оно резко усилит наши верфи, а передовые конструкторские идеи поднимут надёжность кораблей."
 wg_parit.15.a:0 "Великолепно!"
 r_eddy:0 "Руководство модульного кораблестроения Эндории"
 r_eddy_desc:0 "Ядро руководства Эндории: резко ускоряет постройку кораблей, передовые идеи поднимают надёжность; а ещё оно — суперкомпьютер и поднимет наши вычислительные мощности."
 wg_eddy_maya:0 "Наставничество Эндории"
 wg_parit.17.name:0 "Астесия"
 wg_parit.17.desc:0 "Эндория……"
 wg_parit.17.a:0 "Это и есть твоя родина?"
 wg_parit.17.a.response:0 "Да… Я думала, сюда уже не вернусь — а вернулась, да ещё в таких обстоятельствах."
 wg_parit.17.c:0 "Ты уже знаешь, что случилось?"
 wg_parit.17.c.response:0 "Да… Что там, в далёкой дали — неведомо; но, возможно, это был их выбор."
 wg_parit.17.d:0 "Тебе что-то известно?"
 wg_parit.17.d.response:0 "Увы, немного. Знаю лишь: Эндория собирала редкое вещество «изотоп-5». Они пытались с его помощью пробить границу между иллюзией и реальностью."
 wg_parit.17.e:0 "Может, у них и получилось."
 wg_parit.17.e.response:0 "Может быть. Как бы то ни было — всё это в прошлом."
 wg_parit.17.b:0 "Тебе нужна помощь?"
 wg_parit.18.name:0 "Астесия"
 wg_parit.18.desc:0 "Нет; но если у вас нет срочных дел… позвольте мне побыть здесь ещё немного…"
 wg_parit.18.a:0 "Конечно"
 Parit_origin_system_NAME:0 "Парит"
 Parit_origin_system_DESC:0 "Родная планета глубинных дев Парита; разрушение среды заставило их расстаться со сытой праздностью…"
 sh_trait_parit:0 "Наследие Парита"
 sh_trait_parit_desc:0 "Столетия лишений не стерли из их ДНК природу сытых гедонисток."
 d_Parit6:0 "Павший оборонительный флот"
 d_Parit6_desc:0 "Столетия назад нелепая игра в кораблевождение уронила орбитальный флот в атмосферу: экология рухнула, большинство городов погибло; обломки не расчищены до сих пор."
 d_Parit7:0 "Последнее чудо"
 d_Parit7_desc:0 "Эта зона пережила глубокую искусственную переделку, породив здесь невозможные ландшафты; ныне она истощается. §RУчасток исчезнет через 20 лет§!"
 d_Parit8:0 "Мусорное поле"
 d_Parit8_desc:0 "Из-за поломки уборочных машин зону завалило мусором на километры; многому из него — тысячи лет. Токсичность делает её необитаемой."
 parit_databank_found:0 "Кажется, под этой зоной что-то есть"
 parit_battlecrusier:0 "Линейный крейсер"
 PARIT_BC_BOW_X:0 "Спинальный нос"
 PARIT_BC_BOW_1L2S:0 "Артиллерийский нос"
 PARIT_BC_MID_L2:0 "Артиллерийский корпус"
 PARIT_BC_STERN_P2:0 "Корма ПВО"
 tech_parit_battlecrusier:0 "Линейный крейсер"
 tech_parit_battlecrusier_desc:0 "Найденный в базах Парита проект: огонь линкора по цене дешевле."
 PARIT_BC_ZERO_POINT_REACTOR:0 "$ZERO_POINT_REACTOR$"
 PARIT_BC_ZERO_POINT_REACTOR_DESC:0 "$ZERO_POINT_REACTOR_DESC$"
 PARIT_BC_DARK_MATTER_REACTOR:0 "$DARK_MATTER_REACTOR$"
 PARIT_BC_MATTER_REACTOR_DESC:0 "$DARK_MATTER_REACTOR_DESC$"
 PARIT_BC_THRUSTER_4:0 "$SHIP_THRUSTER_4$"
 PARIT_BC_THRUSTER_4_DESC:0 "$SHIP_THRUSTER_4_DESC$"
 PARIT_BC_THRUSTER_5:0 "$SHIP_THRUSTER_5$"
 PARIT_BC_THRUSTER_5_DESC:0 "$SHIP_THRUSTER_5_DESC$"
 parit_dreadnought:0 "Дредноут"
 tech_parit_dreadnought:0 "Дредноут"
 tech_parit_dreadnought_desc:0 "Дредноут новой разработки на данных баз Парита и верфей Эндории: мощный огонь и живучесть."
 PARIT_DREADNOUGHT_BOW:0 "Нос «Уничтожитель»"
 PARIT_DREADNOUGHT_MID:0 "Артиллерийский корпус"
 PARIT_DREADNOUGHT_STERN:0 "Корпус ПВО"
 parit_carrier:0 "Авианосец"
 tech_parit_carrier:0 "Авианосец"
 tech_parit_carrier_desc:0 "Авианосцу не обязательно носить авиацию: при случае он ставит 8 пушек M-класса — решая проблему никудышной палубной авиации."
 COMBAT_COMPUTER_CARRIER_SH2:0 "Компьютер авианосца"
 PARIT_CV_BOW:0 "Нос доблести"
 PARIT_CV_BOW2:0 "Нос никчёмности"
 PARIT_CV_STERN:0 "Корпус никчёмности"
 PARIT_CV_STERN2:0 "Корпус доблести"
 origin_parit:0 "Возрождение Парита"
 origin_parit_desc:0 "Столетия назад Парит был райским миром: наши предки безбедно наслаждались бесконечными дарами чудесных машин. Но наша глупая забава погубила всё.\nСреда деградировала — пришлось объединиться заново, и лишь труд поколений отвратил гибель.\nТеперь мы вновь обнимем звёзды — и найдём ответ на вечный вопрос: кто мы?"
 origin_tooltip_parit_effects:0 "§YЭто происхождение — сюжетное; слегка конфликтует с текущим лором Глубинных§!\n\nВ начале игры несколько зданий Парита\nГлубинным разрешено§G естественное размножение§!\nНедоступно вознесение §R«Молчание»§!\nОсобые типы§Y кораблей§!\nОсобые§Y сюжетные§! события\n-Сюжетный режим, один на партию; для финала сюжета включите «Войну планет: Рассвет Куата»"
 planet_Parit2:0 "Автоматика Парита"
 planet_Parit2_desc:0 "Уцелевшая автоматика Парита: строительные районы размечены заранее."
 planet_Parit3:0 "База данных Парита"
 planet_Parit3_desc:0 "Большая часть данных утрачена, но и остатков хватит на годы исследований."
 planet_Parit4:0 "Обломочное облако"
 planet_Parit4_desc:0 "Облако обломков почти полностью затянуло орбиту Парита: запуск кораблей крайне затруднён."
 planet_Parit5:0 "Глубинные Парита"
 planet_Parit5_desc:0 "В отличие от обычных глубинных дев, глубинным Парита разрешено естественное размножение, и их почти не ограничивают."
 WG_PARIT_PROJECT:0 "Перезапуск климатических установок Парита"
 WG_PARIT_PROJECT_DESC:0 "На Парите есть повреждённые климатические установки; учёные считают — время для ремонта настало."
 WG_PARIT_PROJECT2:0 "Починка терминалов данных"
 WG_PARIT_PROJECT2_DESC:0 "Большинство терминалов баз Парита разбито; учёные просят спасти хотя бы остатки."
 WG_PARIT_PROJECT3:0 "Расчистка обломочного облака"
 WG_PARIT_PROJECT3_DESC:0 "Научная группа предлагает: корабли с поднятыми щитами таранят обломки, выплавляя их."
 parit_chain_title:0 "Наша родная система"
 parit_chain_desc:0 "Мы знаем: родом мы не отсюда — надо обследовать родную систему подробнее."
 WG_PARIT_HOME:0 "Молчаливый колосс"
 WG_PARIT_HOME_DESC:0 "По легендам, предки прилетели на этом исполине; что за корабль и почему брошен — неизвестно."
 WG_PARIT_HOME2:0 "Древнее поле боя"
 WG_PARIT_HOME2_DESC:0 "Наследство вековой глупой игры; пошарить на предмет ресурсов всё же стоит."
 WG_PARIT_HOME3:0 "Место, куда должно прийти"
 WG_PARIT_HOME3_DESC:0 "В легендах эту малую луну вновь и вновь зовут местом, куда мы обязаны прийти; теперь, владея межзвёздным полётом, обследуем её."
 WG_PARIT_HOME4:0 "Таинственный сигнал"
 WG_PARIT_HOME4_DESC:0 "Газовый гигант периодически шлёт упорядоченную радиоволну — любопытно."
 wg_parit_home_porject_counter:0 "Завершённые проекты"
 wg_parit.20.name:0 "Возрождение"
 wg_parit.20.desc:0 "Трудом немногих трезвых пионеров и поколений людей мы отвратили гибель планеты.\n\nСтолетия сытой лени заставили нас забыть историю — и самих себя. Теперь мы объединились и вновь обняли звёзды: нас ждёт возрождение!"
 wg_parit.20.a:0 "Вперёд!"
 wg_parit.23.name:0 "Перезапуск климатических установок Парита"
 wg_parit.23.desc:0 "Парит был райской планетой, но наша прошлая глупость повредила климатические установки, а чинить их уже никто не помнил как — итог: пустыня.\n\nТеперь мы снова владеем терраформированием, и учёные считают: можно пробовать перезапуск."
 wg_parit.23.a:0 "Вернуть Париту рай"
 wg_parit.23.b:0 "Пустыня Парита — вечный колокол: пусть останется"
 wg_parit.24.name:0 "Рай восстановлен"
 wg_parit.24.desc:0 "Совместным трудом учёных установки починены.\nПосле запуска миллиарды наноботов споро переделали Парит обратно в идеальный мир — рай вернулся!"
 wg_parit.24.a:0 "Это знак нашего возрождения"
 wg_parit.25.name:0 "Ничего не произошло"
 wg_parit.25.desc:0 "Учёные сочли установки починенными и в прямом эфире нажали кнопку… и ничего.\nМожет, техника слишком стара, может, руки не оттуда, может, иное — но факт один: план по гее-Париту через эти установки провалился."
 wg_parit.25.a:0 "Не повезло"
 wg_parit.26.name:0 "Неожиданность"
 wg_parit.26.desc:0 "Учёные сочли установки починенными и в прямом эфире нажали кнопку; миллиарды наноботов споро взялись за дело — но, к удивлению, Парит стал не идеальным миром, а планетой Глубинных.\nВозможно, установки изначально и были рассчитаны на планету Глубинных, а не на идеальный мир; как бы то ни было, Парит полностью апгрейднут."
 wg_parit.26.a:0 "Неплохо"
 wg_parit.27.name:0 "Подземный комплекс"
 wg_parit.27.desc:0 "По легендам на Парите есть база данных со всеми знаниями для возрождения — но где, никто не знал.\nРасчистив крупнейшее мусорное поле, мы поразились: под ним — гигантский подземный комплекс; толстый токсичный слой веками глушил сканеры.\nНаучная группа: немедленно копать."
 wg_parit.27.a:0 "Действуем"
 wg_parit.28.name:0 "Врата базы данных"
 wg_parit.28.desc:0 "Последний мусор перед вратами расчищен; древние письмена у входа подтверждают: это она, база данных."
 wg_parit.28.a:0 "Продолжаем"
 wg_parit.29.name:0 "Ядро базы данных"
 wg_parit.29.desc:0 "От старости и геологии внутри многое обвалилось; расчистив, мы дошли до ядра — но и тут без беды не вышло: часть терминалов мертва. Учёные требуют аварийной выемки данных."
 wg_parit.29.a:0 "Начать восстановление"
 wg_parit.30.name:0 "Наши предки"
 wg_parit.30.desc:0 "Увы, львиная доля данных ядра погибла; но и спасённого хватило, чтобы узнать великое прошлое.\n\nПарит — не наше настоящее имя: мы зовёмся§!§H Эндорией§!.\nИмперия Эндории имела блистательную историю: необъятные просторы и непобедимый флот. Но предкам было мало — они пошли за пределы галактики. Не вышло: на экспедицию напал разумный флот «Вечный флот», и первопроходцы сгинули в тёмных небесах. Беды не кончились: по невыясненной причине предки начали войну со всей галактикой — кто её спланировал, теперь не узнать, но спланировано было явно; и Эндория пала под кучей.\nНынешняя родина зовётся Паритом, ибо по посредничеству неведомой силы был принят§H «Протокол Парит»§!: выжившие предки тайком на корабле «Эндория» добрались до Парита. Авторами задумывалось: техника и архивы Парита помогут предкам восстать и вернуть величие.\nУвы, предки привыкли к сытой лени, залипли в виртуальные миры и забыли великую миссию.\n\nВ базе записано и положение родного мира Эндории — вернёмся домой"
 wg_parit.30.a:0 "Потомки Эндории идут в великую прародину"
 wg_parit.30.b:0 "Куатцы, ваша бабушка Эндория вернулась"
 wg_parit.30.c:0 "Сообщить Астесии: родина найдена"
 wg_parit.30.tooltip:0 "§YКоординаты Эндории обновлены§!"
 site_eddy2:0 "Эндория"
 site_eddy2_intro:0 "Древнее мир-кольцо Эндории по неведомой причине разрушено безвозвратно — мёртвое кольцо."
 wg_parit.31.name:0 "Щитовая капсула"
 wg_parit.31.desc:0 "Родина предков, конечно, стара — но не настолько же, чтобы звезда G-класса стала чёрной дырой. Загадка; есть догадка: виновата часть установок кольца.\nК кольцу: почти половина уже захвачена гравитацией дыры, но остаток чудесно держится. Команда обшарила его и нашла провал на сканограмме; на месте — отсек под передовым щитом (именно его неизвестная техника держала остаток кольца). По архивам Парита мы сняли щит и извлекли данные целыми.\n\n§!§H«Потомки Эндории! Как видите, былая империя — руины; вы могли забыть нашу историю. Помните урок нашего поражения: не пытайтесь пробить границу реального и иллюзорного — Наследник всё видит»§!\n\nОстаток данных подробно рассказал о прошлом Эндории — от взлёта до последнего часа.\n\n§!§H«Наш шанс ушёл; будущее — за вами. Сектор 1-1-4: там наш последний подарок.»§!"
 wg_parit.31.a:0 "В сектор 1-1-4"
 wg_parit.32.name:0 "Сектор 1-1-4"
 wg_parit.32.desc:0 "Прежний сектор 1-1-4 ушёл чёрной дыре — команда уж считала секреты зоны утраченными, но обшарила всё же. И повезло: в груде обломков нашёлся тот отсек — под тем же щитом; пароль опять искать в базах Парита."
 wg_parit.32.a:0 "Скорее взламывать пароль"
 wg_parit.33.name:0 "Эндория: последний подарок"
 wg_parit.33.desc:0 "Мы искали верный пароль в гигабайтах данных Парита — а он оказался в первой же строке! Это был тест на внимательность!!\n\nДревние предки Эндории поднялись на кораблестроении — и подарок о нём: «Руководство модульного кораблестроения Эндории». Оно резко усилит наши верфи, а передовые конструкторские идеи поднимут надёжность кораблей."
 wg_parit.33.a:0 "Великолепно!"
 wg_parit.34.name:0 "Возвращение"
 wg_parit.34.desc:0 "Мы прибыли в Эндорию — столицу великих предков, административное сердце и сильнейшую корабельную систему галактики.\n\nОколо двухсот тысяч лет назад Эндория начала войну с несколькими цивилизациями; имея техническое превосходство, она не совладала со стаей волков — империю расчленили и громили по частям. К концу войны мир-кольцо, вмещавший сотни миллионов граждан, лежал в руинах, а исполинские доки одряхлели.\nЭндория надеялась, что потомки — мы — однажды вернутся и отстроят империю. Этот день настал."
 wg_parit.34.a:0 "Мы. Вернулись."
 wg_parit.36.name:0 "Расчистка орбитального облака"
 wg_parit.36.desc:0 "Столетия назад предки устроили нелепую игру: настоящую космическую битву на орбитальном флоте Парита. Игрок по имени Гушшань, чтобы победить, подтащила флот слишком близко к Париту и сцепилась с соперницами — случилась трагедия: масса сбитых кораблей рухнула в атмосферу, а автоматическая оборота не перехватила их из-за «свой-чужой»; экосистема Парита рухнула, а остатки обломков гравитация планеты заперла в плотное облако — запускать корабли стало тяжело и опасно.\n\nТеперь у нас есть новое поколение щитов; наука предлагает: корабли с поднятыми щитами таранят обломки, выплавляя их."
 wg_parit.36.a:0 "Стоит попробовать"
 wg_parit.37.name:0 "Чистое небо"
 wg_parit.37.desc:0 "После непрерывной чистки сотнями кораблей большая часть опасных обломков уничтожена; остатки дочистят со временем. Ещё один барьер на пути Парита снят."
 wg_parit.37.a:0 "Великолепно"
 wg_parit.38.name:0 "Исследование нашего дома"
 wg_parit.38.desc:0 "Мы знаем: родом мы не отсюда, но по разным причинам забыли историю.\n\nТеперь мы снова владеем межзвёздным полётом и можем системно обследовать нынешнюю родную систему; наука считает, это поможет понять самих себя."
 wg_parit.38.a:0 "Начинаем"
 wg_parit.38.b:0 "Наши учёные все заняты"
 wg_parit.39.name:0 "«Эндория»"
 wg_parit.39.desc:0 "По древним письменам мы узнали прежнее имя корабля — «Молот Рыцаря»; ныне его зовут§Y «Эндория»§!.\nДиво: снаружи корабль без единой царапины (если не считать микрометеоритов), но внутри отрезан от реальной вселенной. Все посланные внутрь дроны пропали; повторные разведки доказали: входить — самоубийство. Впрочем, кое-какие любопытные данные учёные всё же сняли."
 wg_parit.39.a:0 "Удивительно"
 wg_parit.40.name:0 "Древнее поле боя"
 wg_parit.40.desc:0 "Команда тщательно обшарила обломки: все корабли разбиты безнадёжно; единственная добыча — немного годных сплавов."
 wg_parit.40.a:0 "Забираем ресурсы"
 wg_parit.41.name:0 "Древнее поле боя"
 wg_parit.41.desc:0 "Команда тщательно обшарила обломки: почти все корабли разбиты безнадёжно; но один§Y эскортный корабль§! пострадал мало — после ремонта он вернулся в строй."
 wg_parit.41.a:0 "Неплохо"
 wg_parit.42.name:0 "Древнее поле боя"
 wg_parit.42.desc:0 "Команда тщательно обшарила обломки: почти все корабли разбиты безнадёжно; но один§Y линейный крейсер§! пострадал мало — после ремонта он вернулся в строй."
 wg_parit.42.a:0 "Великолепно"
 wg_parit.43.name:0 "База звёздных карт"
 wg_parit.43.desc:0 "Высадившись на луне, мы поняли, что опоздали: единственное строение разбито астероидом. Мы всё же обшарили руины: это была база карт всей галактики. Данные почти все погибли, но кое-что любопытное мы вытащили."
 wg_parit.43.a:0 "Жаль"
 wg_parit.43.tooltip:0 "§HНесколько соседних систем будут открыты немедленно§!"
 wg_parit.44.name:0 "Продуктовоз"
 wg_parit.44.desc:0 "Мы нашли источник радиоволны: аварийный грузовоз; волна была его сигналом бедствия.\nПо судовому журналу: корабль принадлежит неведомой цивилизации, ему две тысячи лет. Тогда он получил предупреждение от обороны Парита и лёг на новый курс — но несчастливо был бит метеоритом у газового гиганта. Груз? Еда. И часть её всё ещё съедобна!"
 wg_parit.44.a:0 "Я бы есть не рискнул"
 wg_parit.45.name:0 "Родная система обследована"
 wg_parit.45.desc:0 "Глубоко исследовав родную систему, мы поняли: предки заготовили для нашего возрождения и безопасности многое — но это не сберегли.\n\nКак бы то ни было, мы вновь на ногах — и завершим дело возрождения рода."
 wg_parit.45.a:0 "Вперёд!"
 wg_parit.47.name:0 "Астесия"
 wg_parit.47.desc:0 "Вы… вы всё-таки вернулись!"
 wg_parit.47.a:0 "Ты — научный узел? И что это значит?"
 wg_parit.47.a.response:0 "А? Столько времени прошло… неужели…\nВпрочем: я просканировала вас удалённо и уверена — вы эндорийки. Но империя погибла давно; вероятно, вы потеряли ту часть истории.\nТогда позвольте представиться: я Астесия. Точнее, Астесия — имя моего тела до загрузки мозга. Когда империя достроила научный узел, ей понадобился биокомпьютер для усиления и управления.\nЯ добровольно загрузила мозг и стала ядром узла — по сей день. Право, не чаяла, что сюда придут эндорийки…"
 wg_parit.47.b:0 "Мы — эндорийки? Что случилось с империей?"
 wg_parit.47.b.response:0 "Да: ваше ДНК совпадает с эндорийками на 99,34%. Смутно помню§H «Протокол Парит»§! — механизм подстраховки; вы, видимо, его бенефициары. Теперь об империи… секунду, даты не держу… Запрос: империя объявила о роспуске 188 301 цикл назад; я как секретная научная единица не рассыпалась вместе с ней."
 wg_parit.47.c:0 "Почему ты можешь двигаться? Что произошло?"
 wg_parit.48.name:0 "Астесия"
 wg_parit.48.desc:0 "Во времена империи я была её высшим оружейным институтом.\nКогда империя пала, нам полагалось лечь с ней в могилу; но тогдашний администратор позволила мне обойти высшие права и взять узел под контроль. Я понимала: не сделав ничего, я однажды исчерпаю ресурсы или сойду с ума; потому автоматами я сняла с окрестных мёртвых кораблей гору двигателей и приладила их к мегаструктуре — так я кое-как двигаюсь по системе."
 wg_parit.48.a:0 "Какая помощь нужна?"
 wg_parit.48.a.response:0 "Внутрисистемный полёт я кое-как решила, но FTL-двигатель моего размера мне самой не построить и не поставить. Чертёж я закончила — помогите мне его собрать.\nЯ отдам новой империи всё; если не хватает ресурсов — не спешите: я жду уже сотни тысяч лет, подожду ещё!"
 wg_parit.48.b:0 "Мы поможем собрать и поставить FTL-двигатель"
 wg_parit.49.name:0 "Помощь Астесии"
 wg_parit.49.desc:0 "Астесия — научный узел ещё со времён предков; чертёж FTL-двигателя она уже передала. Остаётся послать строительные корабли: по чертежам и с долей ресурсов мы выведем её отсюда."
 wg_parit.49.a:0 "Отлично — приступаем"
 wg_parit.51.name:0 "Дежавю"
 wg_parit.51.desc:0 "Пара случайных шансов позволила рассмотреть вблизи корабли глубинной падшей империи§Y Молчаливого флота§!, дабы перенять их дизайн. Но эксперты отмечают: корабли Молчаливого флота поразительно похожи на корабли предков на Парите — и размещение орудий, и стиль, совпадение почти полное.\nМожет, у топовых конструкций всюду схожий облик, может, мы схожи как Глубинные… Но этот безмолвный древний народ будит в нас необъяснимое чувство знакомства."
 wg_parit.51.a:0 "Тревожно"
 wg_parit.52.name:0 "Тысяча нитей"
 wg_parit.52.desc:0 "Глубже изучив древние корабли предков, мы выяснили: это почти§Y калька Молчаливого флота§! — сходство 98%, различия лишь в подборе оружия.\nЕщё прорыв — в древних письменах предков разгадано мучившее нас слово «T'NEILS»: оно означает… «Молчаливый флот»!!\nВолей-неволей задумываешься о нашей связи с этим древним глубинным государством…"
 wg_parit.52.a:0 "Быть может, стоит попытаться связаться с§Y Молчаливым флотом§!"
 wg_parit.52.b:0 "Это навсегда останется загадкой"
 wg_parit.53.desc:0 "……"
 wg_parit.53.a:0 "Здравствуйте, уважаемый Молчаливый флот!"
 wg_parit.53.a.response:0 "……?"
 wg_parit.53.b:0 "Мы хотели бы кое-что спросить…"
 wg_parit.54.desc:0 "…………\n\n§YСвязистка Молчаливого флота хранила молчание, но, приняв нашу передачу, на мгновение промелькнула коротким и крошечным удивлением§!\n\n.. вы……\n\n§YКороткая встреча кончилась тем, что Молчаливый флот в одностороннем порядке закрыл связь — но нам передали один файл. §!"
 wg_parit.54.a:0 "Это…"
 wg_parit.55.name:0 "Архив"
 wg_parit.55.desc:0 "§YИсторический архив§!"
 wg_parit.55.a:0 "Архив 01 — калибровка: §G300§! тыс. лет назад"
 wg_parit.55.a.response:0 "Уведомление о «молчании» флота K.I.\n\nГраждане! Наша война с Подсолнуховым герцогством, империей Тони и Лигой дев длится 32 года; ради победы в финальной битве флот K.I. постановил: все проходят «умолчание». Явиться на ближайший пункт."
 wg_parit.55.b:0 "Архив 02 — калибровка: §G300§! тыс. лет назад"
 wg_parit.55.b.response:0 "Обращение Молчаливого флота\n\nПобеда в войне"
 wg_parit.55.c:0 "Архив 03 — калибровка: §G300§! тыс. лет назад"
 wg_parit.55.c.response:0 "Связь штаба Молчаливого флота\n\n§YОбнаружено множество глубинных граждан, не прошедших «умолчание» до победы; укрываются в мире δ. Ждём указаний. §!\n\n§YОтпустить… приказ принят… §!"
 wg_parit.55.d:0 "Архив 04 — калибровка: §G300§! тыс. лет назад"
 wg_parit.55.d.response:0 "Связь Молчаливого флота\n\nМолчаливый флот принял ваше сообщение о создании государства; обновлено переименование вашей империи§Y «Эндория»§!"
 wg_parit.55.g:0 "Архив 04 — калибровка: §G250§! тыс. лет назад"
 wg_parit.55.g.response:0 "Связь Молчаливого флота\n\n§YЭндория§! провела социальную реформу: глубинный род слился с неведомым видом дев; вы более не считаетесь Глубинными. Благословляем. Это — последняя передача."
 wg_parit.55.h:0 "Архив 04 — калибровка: §G230§! тыс. лет назад"
 wg_parit.55.h.response:0 "Связь Молчаливого флота\n\n§YЭндория§! переустроилась и направила экспедицию за пределы мира; удар Вечного флота. Итог: империя тяжко ранена, пространственные испытания прекращены."
 wg_parit.55.e:0 "Архив 05 — калибровка: §G200§! тыс. лет назад"
 wg_parit.55.e.response:0 "Запись центра наблюдения Молчаливого флота\n\nВойна империи Эндории с империей Куат; многие страны за Куат. Итог: поражение, империя пала; посредничество Совета Наблюдателей; немногие выжившие бежали."
 wg_parit.55.f:0 "Архив 06 — калибровка: §G0§! лет назад"
 wg_parit.55.f.response:0 "Запись центра наблюдения Молчаливого флота\n\nОбнаружена цивилизация, предположительно потомков Эндории"
 wg_parit.56.name:0 "Мы сами"
 wg_parit.56.desc:0 "Архив от Молчаливого флота раскрыл: наши предки были с ними одним родом. После этого — ни одной передачи.\nОдни граждане считают, Молчаливый флот обязан ответить за то, что сложил руки при гибели Эндории; иные — что пора сбросить старые хвосты и писать свою историю.\n\nКак бы то ни было, тайна происхождения решена — смотрим только вперёд."
 wg_parit.56.a:0 "Наша очередь писать историю"
 WG_PARIT_EXECTOR:0 "Пробой поля"
 WG_PARIT_EXECTOR_DESC:0 "Таинственное поле «Эндории» на миг ослабло; непрерывной подачей энергии мы гасим его восстановление — окно для входа."
 parit_executor:0 "Подача энергии"
 wg_parit.58.name:0 "Пробуждение исполина"
 wg_parit.58.desc:0 "Спящий в нашей системе исполинский корабль§Y «Эндория»§!, по замерам, насчитывает сто тысяч лет; все попытки войти разбивались о его поле.\nНо, кажется, пробился лучик: в одной зоне корабля градус поля упал — на секунды в непробиваемом поле образовалась щель; увы, поле явно самоисцеляется.\nУчёные: это последний шанс войти — нужно лишь непрерывное, стабильное и мощное питание…"
 wg_parit.58.a:0 "Немедленно подать энергию — шанс упускать нельзя!"
 wg_parit.58.b:0 "Нам такое не по карману — пусть спит дальше."
 wg_parit.59.name:0 "Связь оборвана"
 wg_parit.59.desc:0 "Непрерывной энергией мы притормозили восстановление поля и нашли шлюз, в который смогли войти.\nНо едва наши люди проникли, поле восстановилось со страшной скоростью и перерубило транспортную трубу, связывавшую экспедицию с научным кораблём.\nСвязь с экспедицией потеряна — остаётся молиться об их благополучном возврате."
 wg_parit.59.a:0 "У них всё получится"
 wg_parit.60.name:0 "Поле рассеялось!"
 wg_parit.60.desc:0 "Мы потеряли экспедицию на месяцы; почти все смирились и готовились объявить героев павшими — и вдруг щит корабля стал таять!\nВысадившиеся за долгие месяцы нашли способ выключить поле; заодно они добыли судовой журнал — быть может, он приоткроет утраченную историю?"
 wg_parit.60.a:0 "Наградить их за доблесть!"
 wg_parit.61.name:0 "Судовой журнал"
 wg_parit.61.desc:0 "Судовой журнал «Эндории»"
 wg_parit.61.a:0 "Запись 1: 155 год Тони"
 wg_parit.61.a.response:0 "§HАктивирован§! «Протокол Парит»\n\nАктивация протокола означает: цивилизация постигнута разрушительным ударом. Капитан-носитель обязан окольными маршрутами тайно доставить избранных на цель — Парит, координаты 20-5-9102, 21-5-2019, 1-16-0202, 3-19-2020.\nВозродить нашу цивилизацию — любой ценой."
 wg_parit.61.b:0 "Запись 2: 159 год Тони"
 wg_parit.61.b.response:0 "Журнал капитана:\nМы покинули Эндорию 4 года назад; верю, уж моему поколению туда ходу нет. Гибель империи я себе представлял — но не думал, что придёт так вдруг: ещё вчера светило солнце — и вот морось и ледяной ветер. Экипаж и я — все потеряны; сколько ещё преград впереди — неведомо. Даст бог, удача с нами."
 wg_parit.61.c:0 "Запись 3: 163 год Тони"
 wg_parit.61.c.response:0 "Журнал капитана:\nНаблюдатель доложил: на курсе минимум 4 патрульных флота Куата. Поверить трудно: почти десять лет, а они всё ищут нас — что, Совет Наблюдателей им более не указ?\nПридётся маневрировать, чтобы не выследили: это съест время, но мы — последняя искра."
 wg_parit.61.d:0 "Запись 4: 171 год Тони"
 wg_parit.61.d.response:0 "Журнал капитана:\nВерни нас к началу войны — развернули бы мы её итог? Не шагни мы за ту черту — было бы так?\nМожно было бы добытой ныне информацией взять верх… но Эндория уже шаталась: безумный император, гниль парламента, флот торгающий и все в развлечениях; мы лишь оттягивали неизбежный финал.\nАх, 3-19-2020 на подходе."
 wg_parit.61.e:0 "Запись 5: 172 год Тони"
 wg_parit.61.e.response:0 "Журнал капитана:\nЛегендарный Парит — под нами; 400 тысяч гражданских высажены. Авторам протокола удалось предвидеть почти всё: богатая планета, автоматика, запас ресурсов. Единственное, что нам предстоит, — пересилить собственную лень."
 wg_parit.61.f:0 "Запись 6: 172 год Тони"
 wg_parit.61.f.response:0 "Проклятье!! Не следовало верить кораблям Куата!!! Корабль выдал нас! Конец, нам конец!\n§HЖурнал обрывается§!"
 wg_parit.62.name:0 "«Эндория»"
 wg_parit.62.desc:0 "Предки привели нас сюда, надеясь, что мы восстанем на богатствах Парита. День настал лишь сто тысяч лет спустя — но время по-прежнему на нашей стороне.\n\nТайно установленный генератор поля снят нами; внутренности корабля целёхоньки — в бой хоть сейчас.\n\nКроме того, на борту найдены шифровки: исследователи разберут их за годы."
 wg_parit.62.a:0 "Мы вернём всё, что было нашим"
 wg_parit.63.title:0 "Секретный журнал Эндории"
 wg_parit.63.desc:0 "Журнал верховного администратора «Эндории», записи 1-1145141919810\n\nВыход системы: ошибка.\nЗапрос решения у контрольного центра.\nВнимание: контрольный центр не отвечает.\nПереход в локальный архивный режим."
 wg_parit.63.a:0 "Запись 1: за 48 лет до битвы за E-объект"
 wg_parit.63.a.res:0 "Журнал Наблюдателя:\nКорабли Kuat как всегда хороши. Истинно супер-корабль Kuat — взял бы себе во флагманы."
 wg_parit.63.b:0 "Запись 2: за 35 лет до битвы за E-объект"
 wg_parit.63.b.res:0 "Журнал Наблюдателя:\nСегодня опять день сытого покоя; война Kuat и Эндории, похоже, стихает. Не взять в толк, зачем председатель занялся их примирением.\nУ председателя свои резоны — мне ли не исполнять."
 wg_parit.63.c:0 "Запись 3: за 27 лет до битвы за E-объект"
 wg_parit.63.c.res:0 "Журнал Наблюдателя:\n731-й обход; когда ж ему конец. Погодите, вы что творите? Это бунт?!\nЭндория?! Вы пробрались сюда?! Но хоть убейте меня — корабль вам не достанется!\nСтойте: как вы проникли в управление кораблём?! Неуж…\nПроклятье, вы пожалеете!"
 wg_parit.63.d:0 "Запись 3: за 11 лет до битвы за E-объект"
 wg_parit.63.d.res:0 "Журнал Наблюдателя:\nМы победили — корабль наш. Совет Наблюдателей наверняка хватится пропажи; нам обязаны сохранить ключевые данные корабля, иначе всё насмарку.\nСтойте, эти прыжковые сигналы… нет, Куат идёт. Проклятье…."
 wg_parit.63.e:0 "Тайна этого корабля в итоге будет нашей."
 situation_parit_on_to_revenge:0 "Наращивать вложения"
 situation_parit_in_to_revenge:0 "Держать расход"
 situation_research_wg_parit_hidden_tech:0 "С перевода исследователей мы сможем восстановить то, что предки пытались оставить. Как выясняется, в войне с империей Куат предки не гнушались ничем — даже угнали корабль, проданный Куатом Совету Наблюдателей! Вот так неожиданность: корабль предков, пришедший на Парит, — краденый; возможно, это и объясняет, как он в конце концов выдал позицию.\n\nТеперь он — наш."
 situation_research_wg_parit_hidden_tech:0 "С перевода исследователей мы сможем восстановить то, что предки пытались оставить. Как выясняется, в войне с империей Куат предки не гнушались ничем — даже угнали корабль, проданный Куатом Совету Наблюдателей! Вот так неожиданность: корабль предков, пришедший на Парит, — краденый; возможно, это и объясняет, как он в конце концов выдал позицию.\n\nТеперь он — наш."
 situation_research_wg_parit_hidden_tech_type:0 "$situation_research_wg_parit_hidden_tech$"
 situation_research_wg_parit_hidden_tech_monthly_change_tooltip:0 "Учёные бьются над переводом посланий предков."
 wg_parit.64.name:0 "Дешифровка завершена"
 wg_parit.64.desc:0 "Годы труда — и исследователи полностью перевели ключевые технические послания предков; они и поныне целы. Теперь можно применить их в военной сфере и попытаться построить межзвёздный дредноут."
 wg_parit.64.a:0 "Великолепно!"
 wg_parit.64.a.tooltip:0 "-Получен§H проект исполнительного межзвёздного дредноута «Молот Рыцаря»§! -"
