 tech_uf_weapon_monolith_large:0 "Орудие L «чёрный камень» Объединения"
 tech_uf_weapon_monolith_large_desc:0 "Обратная разработка монолитов позволила применить часть их технологий в наших крупных орудиях."
 UF_weapon_L2:0 "Орудие L «чёрный камень» Объединения"
 UF_weapon_L2_DESC:0 "Сочетание сверхмерного вещества и технологий монолитов: это крупное орудие даст нам лишний козырь."
 tech_uf_weapon_extra_large2:0 "Орудие X «чёрный камень» Объединения"
 tech_uf_weapon_extra_large2_desc:0 "Новая осевая пушка капитан-класса, сочетающая технологии монолитов и сверхмерные. Это оружие эпохального значения удвоило нашу боевую эффективность."
 UF_weapon_X3:0 "Орудие X «чёрный камень» Объединения"
 UF_weapon_X3_DESC:0 "Суперосевое орудие на стыке технологий монолитов и сверхмерного вещества: его мощь испепелит любое ничтожество, посмевшее стать нашим врагом."
 UF_weapon_X3_2:0 "Орудие X «чёрный камень» Объединения (круговое)"
 UF_weapon_X3_2_DESC:0 "Круговое орудие, специально созданное для крепостей и флагманов."
 tech_uf_weapon_titanic2:0 "Орудие T «чёрный камень» Объединения"
 tech_uf_weapon_titanic2_desc:0 "Флагманский главный калибр, идеально сплавивший технологии монолитов и сверхмерные."
 UF_weapon_T3:0 "Орудие T «чёрный камень» Объединения"
 UF_weapon_T3_DESC:0 "Новое флагманское орудие, рождённое идеальным сплавом технологий монолитов и сверхмерного вещества."
 UF_weapon_T3_2:0 "Орудие T «чёрный камень» Объединения (круговое)"
 UF_weapon_T3_2_DESC:0 "Круговое орудие, специально созданное для крепостей и флагманов."
 tech_uf_ia3:0 "Броня IA «чёрный камень» Объединения"
 tech_uf_ia3_desc:0 "Новое поколение брони, полученное обратной разработкой монолитов."
 UF_weapon_IA3:0 "Броня IA «чёрный камень» Объединения"
