 UF_AURA_D:0 "Увеличение дальности Объединения"
 UF_AURA_D_DESC:0 "У дульного среза открывается малый вход сверхмерной сети, а у цели — выход: удар наносится прямо по вражескому кораблю."
 UF_AURA_D_EFFECT:0 "Флот с этим кораблем в течение§Y 10§! дней после боя получает §G+500%§! дальности"
 UF_AURA_E:0 "Крепощное поле Объединения"
 UF_AURA_E_DESC:0 "Передовое поле, обезвреживающее большинство атак по корпусу корабля; щиты и броня при этом всё же страдают."
 UF_AURA_E_EFFECT:0 "Флот с этим кораблем в течение§Y 10§! дней после боя сохраняет состояние ['concept_wg_super_protect']"
 UF_AURA_F:0 "Сверхмерное подавление Объединения"
 UF_AURA_F_DESC:0 "В большинстве случаев это поле временно обнуляет урон вражеского оружия."
 UF_AURA_F_EFFECT:0 "Оружие вражеских кораблей в течение§Y 10§! дней после боя не наносит урона"
