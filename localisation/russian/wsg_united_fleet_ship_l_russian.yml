 UF_FIRE_CONTROL_RADAR:0 "Радар управления огнём Объединения"
 UF_FIRE_CONTROL_RADAR_DESC:0 "Передовой боевой радар: эффективно обнаруживает цели и помогает наводке."
 UF_DAMAGE_CONTROL:0 "Система борьбы за живучесть Объединения"
 UF_DAMAGE_CONTROL_DESC:0 "Система ведёт мониторинг состояния всего корабля в реальном времени, вовремя докладывает о повреждениях и саморемонтируется."
 UF_CARRIER_HANGER:0 "Авианосный ангар Объединения"
 UF_CARRIER_HANGER_DESC:0 "Этот ангар изрядно повышает боевую эффективность палубной авиации."
 UF_HM_AFTERBRUNERS:0 "Вспомогательный движитель Объединения"
 UF_HM_AFTERBRUNERS_DESC:0 "Передовой вспомогательный движитель заметно повышает скорость хода и боевое уклонение наших кораблей."
 UF_HM_SHIELD_RECHARGER:0 "Ускоритель щитов Объединения"
 UF_HM_SHIELD_RECHARGER_DESC:0 "Этот передовой ускоритель не только усиливает наши щиты, но и позволяет им работать в опаснейших средах (например, у пульсара)."
 tech_uf_ia:0 "Броня IA Объединения"
 tech_uf_ia_desc:0 "Броня IA — передовое средство защиты, совмещающее функции щита и брони; на сверхмерном веществе она несокрушима."
 UF_weapon_IA:0 "Броня IA Объединения"
 UF_weapon_IA_DESC:0 "Эта броня совмещает функции щита и брони; на сверхмерном веществе она несокрушима."
