 tech_uf_ia2:0 "Передовая броня IA Объединения"
 tech_uf_ia2_desc:0 "Ещё более передовая броня с усиленными щитом и защитой."
 UF_weapon_IA2:0 "Передовая броня IA Объединения"
 UF_weapon_IA2_DESC:0 "Эта передовая броня даст нашим кораблям всестороннюю защиту."
 UF_weapon_IA2_S:0 "$UF_weapon_IA2$"
