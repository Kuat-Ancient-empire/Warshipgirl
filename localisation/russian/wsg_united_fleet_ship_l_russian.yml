 tech_uf_large_shipyard:0 "Крупные доковые мощности Объединения"
 tech_uf_large_shipyard_desc:0 "При постройке больших кораблей из сверхмерного вещества возможны, помимо прочего: искривление времени-пространства, появление опасной экзотики, возникновение микрочёрных дыр, внезапные вспышки сверхновых, гамма-всплески, парадоксы путешествий во времени, события ложного вакуума, универсальная энтропия, коллапс пространственно-временного континуума…… Чтобы всего этого избежать, нам нужно установить это сооружение на нашей звёздной базе."
 uf_large_shipyard_diplo:0 "§YОрбитальное кольцо Объединения§! и§Y гигантский док§! напрямую разрешают постройку крупных кораблей"
 uf_large_shipyard_diplo_desc:0 "Крупные корабли — линкоры и авианосцы Объединения"
 sm_uf_large_shipyard:0 "Крупный доковый модуль Объединения"
 sm_uf_large_shipyard_desc:0 "Без этого сооружения наша звёздная база не выдержит последствий производства больших кораблей из сверхмерного вещества."
 sm_uf_large_shipyard_desc_modifier:0 "§HРазрешает этой звёздной базе строить линкоры и авианосцы Объединения§!"
 starbase_uf_large_shipyard_trigger:0 "£trigger_no£ На звёздной базе нужна постройка §Y$sm_uf_large_shipyard$§!"
 tech_uf_ship_section:0 "Оси́чные корпуса Объединения"
 tech_uf_ship_section_desc:0 "Для линкоров и эсминцев мы специально разработали новый тип осевых оружейных носов — полагаем, это заметно поднимет их огневую мощь."
 tech_uf_ship_section_diplo:0 "§HОткрывает корпуса: §! осевые носы линкоров и эсминцев Объединения"
 UF_weapon_AC:0 "Автопушка Объединения"
 UF_weapon_AC_DESC:0 "Массово применявшееся в войнах Объединения универсальное скорострельное оружие."
 UF_weapon_AC_P:0 "Зенитная автопушка Объединения"
 UF_weapon_AC_P_DESC:0 "Массово применявшееся в войнах Объединения универсальное скорострельное оружие."
