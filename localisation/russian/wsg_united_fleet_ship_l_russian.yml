 WSG_UF:0 "Объединённый флот"
 uf_ships:0 "Объединённый флот"
 uf_ships_desc:0 "§HТип кораблестроения: ['concept_wg_UF_shipset', Объединённый флот]§!\nЭти прекрасные звёздные корабли — что исполинские скульптуры искусства будущего, во всей полноте являющие многогранную и новаторскую культуру своих создателей; их миссия — исследовать неведомые миры, искать новую жизнь и новые цивилизации, смело ступать туда, где не бывал никто."
 wsg_01_shipset_desc:0 "§HТип кораблестроения: ['concept_wg_UF_shipset', Объединённый флот]§!\nЭти прекрасные звёздные корабли — что исполинские скульптуры искусства будущего, во всей полноте являющие многогранную и новаторскую культуру своих создателей; их миссия — исследовать неведомые миры, искать новую жизнь и новые цивилизации, смело ступать туда, где не бывал никто."
 wsg_02_shipset_desc:0 "Эти прекрасные звёздные корабли — что исполинские скульптуры искусства будущего, во всей полноте являющие многогранную и новаторскую культуру своих создателей; их миссия — исследовать неведомые миры, искать новую жизнь и новые цивилизации, смело ступать туда, где не бывал никто."
 wsg_03_shipset_desc:0 "Эти прекрасные звёздные корабли — что исполинские скульптуры искусства будущего, во всей полноте являющие многогранную и новаторскую культуру своих создателей; их миссия — исследовать неведомые миры, искать новую жизнь и новые цивилизации, смело ступать туда, где не бывал никто."
 wsg_04_shipset_desc:0 "Эти прекрасные звёздные корабли — что исполинские скульптуры искусства будущего, во всей полноте являющие многогранную и новаторскую культуру своих создателей; их миссия — исследовать неведомые миры, искать новую жизнь и новые цивилизации, смело ступать туда, где не бывал никто."
 wsg_05_shipset_desc:0 "§HТип кораблестроения: ['concept_wg_UF_shipset', Объединённый флот]§!\nЭти прекрасные звёздные корабли — что исполинские скульптуры искусства будущего, во всей полноте являющие многогранную и новаторскую культуру своих создателей; их миссия — исследовать неведомые миры, искать новую жизнь и новые цивилизации, смело ступать туда, где не бывал никто."
 wsg_06_shipset_desc:0 "Эти прекрасные звёздные корабли — что исполинские скульптуры искусства будущего, во всей полноте являющие многогранную и новаторскую культуру своих создателей; их миссия — исследовать неведомые миры, искать новую жизнь и новые цивилизации, смело ступать туда, где не бывал никто."
 wsg_07_shipset_desc:0 "Эти прекрасные звёздные корабли — что исполинские скульптуры искусства будущего, во всей полноте являющие многогранную и новаторскую культуру своих создателей; их миссия — исследовать неведомые миры, искать новую жизнь и новые цивилизации, смело ступать туда, где не бывал никто."
 china_01_shipset_desc:0 "Теоретически этой штуки существовать не должно, но городской облик привязан к корабельным моделям — вот она и здесь. Считайте её универсальной моделью в расцветке Объединения: у ортодоксальных кораблей Объединения своё уникальное дерево технологий."
 concept_wg_UF_shipset:0 "Корабли Объединённого флота"
 concept_wg_UF_shipset_desc:0 "—Корабли Объединённого флота — корабельный набор, созданный специально для ['authority:auth_united_fleet']. По сравнению со стандартными типами кораблей у Объединённого флота типы богаче, а на передовых технологиях — больше слотов и лучше корпуса.\nОднако соответствующие технологии доступны только ['authority:auth_united_fleet'], поэтому прочим державам этот набор выбирать не следует."
