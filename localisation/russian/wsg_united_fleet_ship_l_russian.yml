 weapon_type_sr_uf:0 "§YСверхмерное вещество§!"
 tech_weapon_uf_small:0 "Малая оружейная группа Объединения"
 tech_weapon_uf_small_desc:0 "Применить сверхмерное вещество в оружии непросто; но стоит малым орудиям доказать успех — накопленный опыт позволит создать оружие покрупнее и посильнее."
 UF_weapon_S:0 "Орудие S-152 Объединения"
 UF_weapon_S_DESC:0 "Сверхмерное вещество дарует этим малым пушкам невообразимую мощь и отличный дальнобой."
 UF_weapon_S2:0 "Протонный меч S-127 Объединения"
 UF_weapon_S2_DESC:0 "Дальность этого оружия мала, зато протонный луч предельной мощности — отличное оружие взрывного удара на ближней дистанции."
 UF_weapon_P:0 "Зенитная пушка P Объединения"
 UF_weapon_P_DESC:0 "Оружие точечной обороны с передовой сверхмерной системой управления огнём — цели предсказываются задолго до подлёта."
 tech_uf_weapon_med_large:0 "Средняя и крупная оружейные группы Объединения"
 tech_uf_weapon_med_large_desc:0 "С учётом опыта малых орудий эти средние и крупные конструкции шагнули далеко вперёд."
 UF_weapon_M:0 "Орудие M-180 Объединения"
 UF_weapon_M_DESC:0 "Это орудие закроет пустоту средней дальности в огне наших флотов."
 UF_weapon_L:0 "Орудие L-203 Объединения"
 UF_weapon_L_DESC:0 "Благодаря сверхмерному веществу 203-мм орудие отлично бьёт вдаль и очень мощно."
 tech_uf_weapon_extra_large:0 "Оси́чная оружейная группа Объединения"
 tech_uf_weapon_extra_large_desc:0 "Сверхкрупная сверхмерная оружейная группа: нужен огромный объём — к счастью, большинство сверхмерных кораблей зарезервировало место под неё. Её проектирование и монтаж предельно сложны, но и выигрыш беспрецедентен."
 UF_weapon_X:0 "Орудие X-406 Объединения"
 UF_weapon_X_DESC:0 "Это орудие класса капитальных кораблей принесёт нашим флотам сильнейший огонь: враги будут трепетать и гибнуть от его ослепительного сияния."
 UF_weapon_X_2:0 "Орудие X-406 Объединения (круговое)"
 UF_weapon_X_2_DESC:0 "Круговое орудие, специально созданное для крепостей и флагманов."
 tech_uf_weapon_titanic:0 "Флагманская оружейная группа Объединения"
 tech_uf_weapon_titanic_desc:0 "Сверхорудие, специально спроектированное для флагманов и сверхкрупных кораблей."
 UF_weapon_T:0 "Орудие T-533 Объединения"
 UF_weapon_T_DESC:0 "Это орудие обычно стоит на сверхкрупных и флагманских кораблях Объединения; каждый его выстрел смертелен."
 UF_weapon_T_2:0 "Орудие T-533 Объединения (круговое)"
 UF_weapon_T_2_DESC:0 "Круговое орудие, специально созданное для крепостей и флагманов."
 tech_uf_weapon_glory:0 "Вспышка Объединения"
 tech_uf_weapon_glory_desc:0 "Сверхорудие для флагманских кораблей Объединения; как правило, один корабль несёт лишь одно такое орудие."
 UF_weapon_T_Glory:0 "Вспышка Объединения"
 UF_weapon_T_Glory_DESC:0 "Сверхорудие для флагманских кораблей Объединения; как правило, один корабль несёт лишь одно такое орудие."
 UF_weapon_T_Glory_2:0 "Вспышка Объединения (круговая)"
 UF_weapon_T_Glory_2_DESC:0 "Круговое орудие, специально созданное для крепостей."
 uf_weapon_glory_diplo:0 "Это оружие ставится только на§Y Владыку Объединения§!, §Yфлагман Объединения§!, §Yзвездорушитель Объединения§!, §YОбсидиановую цитадель Объединения§! и§Y Объединённую славу§!"
 tech_uf_weapon_glory_2:0 "Компактная Вспышка Объединения"
 tech_uf_weapon_glory_2_desc:0 "Уменьшенная версия Вспышки Объединения: мощь принесена в жертву, зато её смогут нести корабли классом ниже."
 uf_weapon_glory_2_diplo:0 "Это оружие ставится только на§Y дредноут Объединения§! и§Y арсенальный корабль Объединения§!"
 UF_weapon_T_Glory_4:0 "Вспышка Объединения"
 UF_weapon_T_Glory_4_DESC:0 "Компактная Вспышка Объединения, созданная специально для дредноутов и арсенальных кораблей."
 tech_uf_weapon_craft:0 "Палубная авиация Объединения"
 tech_uf_weapon_craft_desc:0 "При поддержке сверхмерного вещества даже столь малая оружейная платформа, как палубный самолёт, обретает великую мощь."
 UF_weapon_H:0 "Бомбардировщик Объединения"
 UF_weapon_H_DESC:0 "У этого бомбардировщика огромная скорость и чудовищная мощь."
 UF_weapon_H2:0 "Истребитель Объединения"
 UF_weapon_H2_DESC:0 "Истребители Объединения дадут флоту самую надёжную точечную оборону, а при нужде атакуют и приблизившиеся корабли."
 tech_uf_weapon_craft_2:0 "Бомбардировщик «Огненный ястреб» Объединения"
 tech_uf_weapon_craft_2_desc:0 "Этот куда более передовой бомбардировщик станет новой основой нашей палубной авиации."
 UF_weapon_HX:0 "Бомбардировщик «Огненный ястреб» Объединения"
 UF_weapon_HX_DESC:0 "Модернизированный бомбардировщик Объединения с ещё более передовым вооружением."
 tech_uf_weapon_missile:0 "Умные ракеты Объединения"
 tech_uf_weapon_missile_desc:0 "Умные ракеты Объединения несут мощнейший навигационный ИИ: точно поражают цель и наносят огромный урон."
 UF_weapon_G:0 "Умная ракета Объединения"
 UF_weapon_G_DESC:0 "Умные ракеты Объединения несут мощнейший навигационный ИИ: точно поражают цель и наносят огромный урон."
 tech_uf_hm_reactor:0 "Сверхмерный реактор Объединения"
 tech_uf_hm_reactor_desc:0 "Миниатюризация сверхмерного реактора превзошла все ожидания: он занимает сотые доли объёма прежнего. Это поразительное преимущество позволяет ставить его почти на корабли любых размеров."
 UF_HM_REACTOR:0 "Сверхмерный реактор Объединения"
 UF_HM_REACTOR_DESC:0 "Благодаря миниатюризации сверхмерного реактора и самый малый гражданский кораблик, и величайший корабль славы могут нести одну и ту же модель с той же отдачей."
 UF_HM_REACTOR2:0 "Сверхмерный реактор Объединения"
 UF_HM_REACTOR2_DESC:0 "Благодаря миниатюризации сверхмерного реактора и самый малый гражданский кораблик, и величайший корабль славы могут нести одну и ту же модель с той же отдачей."
 tech_uf_hm_thruster:0 "Сверхмерный движитель Объединения"
 tech_uf_hm_thruster_desc:0 "Трудно вообразить, что столь малый движитель даёт кораблю столь исполинскую тягу."
 UF_HM_THRUSTER:0 "Сверхмерный движитель Объединения"
 UF_HM_THRUSTER_DESC:0 "Очень компактный, но чудовищно тяговитый движитель — ставится на любые корабли."
 UF_AURA_A:0 "Поле подавления Объединения"
 aura_uf_buffer_a:0 "Поле подавления Объединения"
 UF_AURA_B:0 "Пространственно-сжиматель Объединения"
 aura_uf_buffer_b:0 "Пространственно-сжиматель Объединения"
 tech_uf_hm_jump_drive:0 "Сверхмерный прыжковый двигатель Объединения"
 tech_uf_hm_jump_drive_desc:0 "Наблюдая цель с других планов через сверхмерное вещество, мы совершаем дальние точные прыжки; заодно кораблям проще уходить в подпространство для маскировки."
 UF_HM_JUMP_DRIVE:0 "$tech_uf_hm_jump_drive$"
