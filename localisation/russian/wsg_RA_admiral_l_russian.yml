l_russian:

 ra_admiral.1:0 "§BДзюнъё§!"
 ra_admiral.1.desc:0 "До вступления в Сопротивление эта военачальница была довольно известной профессиональной спортсменкой — и потому реагирует быстрее других солдат."
 ra_admiral.2:0 "§BЧунцин§!"
 ra_admiral.2.desc:0 "Хоть эта корабль-дева и невелика ростом, прежде она была исследовательницей вооружений: она знает, как на поле боя бороться с вражеской палубной авиацией и осколочно-фугасным оружием."
 ra_admiral.3:0 "§BДе-Мойн§!"
 ra_admiral.3.desc:0 "Ещё до вступления в Сопротивление адмирал Де-Мойн была звездой военной академии: её выдающийся командный талант и… внушительные формы воодушевляют каждого солдата рядом."
 ra_admiral.4:0 "§BЛе Фантаск§!"
 ra_admiral.4.desc:0 "Флот генерала Ле Фантаск славится быстротой действий."
 ra_admiral.5:0 "§BЭссекс§!"
 ra_admiral.5.desc:0 "Эта корабль-дева-генерал знает каждое слабое место палубной авиации и использует эти знания для смертельных ударов в бою. На её взгляд, дроны и авиация Объединённого флота — ничто."
 ra_admiral.6:0 "§BНевада§!"
 ra_admiral.6.desc:0 "Огонь врага слишком яростен? Ставим более толстую броню! Это правило работает даже против мощнейших залпов Объединённого флота."
 ra_admiral.7:0 "§BАндреа Дориа§!"
 ra_admiral.7.desc:0 "Генерал Андреа Дориа постоянно принимает решения наобом, без оснований — но удача всякий раз приносит ей победу. Любимая её фраза: «Удача — тоже часть силёнок»."
 ra_admiral.8:0 "§BРейнджер§!"
 ra_admiral.8.desc:0 "Отличный тыл — основа победы, и генерал Рейнджер знает это как никто; правда, из-за погони за совершенством порой упускает момент."
 ra_admiral.9:0 "§BСириус§!"
 ra_admiral.9.desc:0 "Корабельные залпы или ПВО — она сделает наилучшим образом. За долгие годы службы на крейсерах генерал Сириус в совершенстве умеет выжимать из крейсеров всё, на что способен флот."
 ra_admiral.10:0 "§BГиринг§!"
 ra_admiral.10.desc:0 "За линией фронта — мечет врага, чертит звёздные карты: разведывательные флоты генерала Гиринг — тайное оружие на поле боя; знать замысел врага — первый шаг к победе."
 ra_admiral.11:0 "§BВангард§!"
 ra_admiral.11.desc:0 "Поле боя — место, вселяющее трепет, но генерал Вангард — исключение: жестокость боя лишь распаляет её боевой азарт. Битва для неё — наслаждение, и её флагман разукрашен необычайно пышно, чтобы это подчеркнуть; а её мощнейший тактический анализ заставляет её флот биться всё яростнее."
 ra_admiral.12:0 "§BНинхай§!"
 ra_admiral.12.desc:0 "Убедиться, что каждый солдат получил строгое и полное обучение ещё до выхода на поле боя, — вечный принцип генерала Нинхай."
 ra_admiral.13:0 "§BТашкент§!"
 ra_admiral.13.desc:0 "Используя преимущество в скорости, флоты генерала Ташкент выделывают сложные противозенитные манёвры, выходя в заданную тактическую точку: и врагу крепко достаётся, и… эм… отступать тоже удобно."
 ra_admiral.14:0 "§BКитаками§!"
 ra_admiral.14.desc:0 "Если торпеды рвут вражеские щиты и броню и топят корабли — зачем нам другое оружие? Какую бы трудность ни подкинула судьба, генерал Китаками решит её своими волшебными торпедами."
 ra_admiral.15:0 "§BСухэ-Батор§!"
 ra_admiral.15.desc:0 "У Объединённого флота полно дронов, кораблей и титанов — зато у нас есть генерал Сухэ-Батор, которая обеспечит, чтобы все эти вкусности достались нам."
 ra_admiral.101:0 "§MПринц Ойген§!"
 ra_admiral.101.desc:0 "Эта корабль-дева — опытная военачальница оборонительных боёв: наивная и нежная к подругам, на войне она не знает пощады.\nЕё полевое оснащение с усиленным силовым полем отлично прикрывает флотилии подчинённых и ведёт их в контратаку — к победе."
 ra_admiral.102:0 "§MХелена§!"
 ra_admiral.102.desc:0 "Если разведка генерала Гиринг — острый нож, то разведсредства генерала Хелена — целая пушка! Ни один маневришек врага не укроется от её всевидящего ока."
 ra_admiral.103:0 "§MРинаун§!"
 ra_admiral.103.desc:0 "Она — один из старейших военачальников Сопротивления; её элегантная и лихая осанка создаёт иллюзию, что ей подвластно всё. Ходят, впрочем, слухи о паре вещей, которые ей даются неважно, — например, найти кошку её юной госпожи……"
 ra_admiral.104:0 "§MЯмато§!"
 ra_admiral.104.desc:0 "Эта новая военачальница Сопротивления славится безрассудной храбростью; она же — одна из немногих и самых первых директрис Глубинной академии. Никто не знает, какое тяжёлое прошлое за этим стоит, — но именно оно и выковало эту героиню."
 ra_admiral.105:0 "§MЧанчунь§!"
 ra_admiral.105.desc:0 "«Взрыв — это искусство!» Генерал Чанчунь специализируется на взрывчатке и горючих смесях, давая Сопротивлению разнообразное оружие для отпора Объединённому флоту."
 ra_admiral.106:0 "§MДжонстон§!"
 ra_admiral.106.desc:0 "Перед лицом врага, многократно превосходящего силой, многие подумали бы о бегстве — но не генерал Джонстон: её флот встретит врага поразительной стойкостью. В Сопротивлении это называют «духом Тафи-3»."
 ra_admiral.107:0 "§MРишелье§!"
 ra_admiral.107.desc:0 "Ни гибель родины, ни разлука с близкими ни на йоту не пошатнули генерала Ришелье. На её тернистом пути ей остаётся лишь одно — как бесстрашный кавалергард, сносить любую преграду на пути."
 ra_admiral.108:0 "§MАрк Ройял§!"
 ra_admiral.108.desc:0 "Эта военачальница досконально знает науку обороны — и обратила её в убийство: для этой безумницы не устоит ни броня, ни щит."
 ra_admiral.109:0 "§MU-47§!"
 ra_admiral.109.desc:0 "Много лет назад скоординировать тактические манёвры флотов через психонику было лишь мечтой — но с ростом амбиций Объединённого флота мечту пришлось воплощать. Так у генерала U-47 появилось применение."
 ra_admiral.110:0 "§MУльрих фон Хуттен§!"
 ra_admiral.110.desc:0 "Флот генерала фон Хуттен оснащён новой конструкцией брони: в режиме перегрузки она за короткое время даёт исключительно отличную защиту. Минус — она не может гибко отражать атаки малых летательных аппаратов."
 ra_admiral.201:0 "§YЭнтерпрайз§!"
 ra_admiral.201.desc:0 "Адмирал Энтерпрайз — третий человек Сопротивления после двух верховных главнокомандующих; вся её жизнь — легендарные подвиги и бесстрашие, и по сей день она держится на передовой против врага: героиня, омытая легендами.\nЕё самая воспеваемая битва — та, где её единственный флагман сковал пять вражеских дивизий: даже в одиночку на своём корабле она способна переломить ход всей войны."
 ra_admiral.202:0 "§YВитторио Венето§!"
 ra_admiral.202.desc:0 "Адмирал Венето — военачальница новых времён, но недооценивать её силу — грубейшая ошибка: немало тех, кто посмеялся над её ростом или неопытностью, растянулся на земле.\nАдмирал Венето умеет решать дела быстро и решительно: стоит врагу показать слабое место — и она без колебаний обрушит туда кошмарный огонь."
 ra_admiral.203:0 "§YХуд§!"
 ra_admiral.203.desc:0 "Адмирал Худ родом из знатного рода, а по хозяйству ей помогает универсальная горничная — мисс Ринаун; но это вовсе не значит, что она слаба.\nАдмирал Худ имеет особый взгляд на тактическое развёртывание: скорость развёртывания её флотов, как считается, сравнима разве что с некоторыми эсминцами — что открывает огромный простор её тактике.\nПри том нередко слышно, как она жалуется на невезение."
 ra_admiral.204:0 "§YРодни§!"
 ra_admiral.204.desc:0 "Стоит заговорить об адмирале Родни — и многие вспомнят её неистово доблестный облик в бою. Она входит в семёрку сильнейших адмиралов порта по мнению бойцов Сопротивления.\nПравда, во флоте под её командованием есть маленькое условие: никто не смеет заходить в её каюту."
 ra_admiral.205:0 "§YЮкикадзэ§!"
 ra_admiral.205.desc:0 "У адмирала Юкикадзэ нет громких побед, но основательный подход и богатый опыт вполне достойны её поста. Ходят слухи: с самого её прихода в Сопротивление её флагман ни разу не был повреждён, и на борту не было ни одного погибшего.\nИ всё же — необъяснимо — многие адмиралы боятся выходить в море вместе с этой адмиральшей по прозвищу «Снежный принц»."
 ra_admiral.1001:0 "§RЛексингтон§!"
 ra_admiral.1001.desc:0 "Адмирал Лексингтон — выдающаяся военно-морская командующая: в применении палубной авиации ей нет равных, за что её прозвали матерью авиационной тактики.\nОна также оснащена новейшей разработкой Сопротивления — измерительным проходом-оснащением, позволяющим в любой момент вызвать на бой армии дронов Сопротивления."
 ra_admiral.1002:0 "§RМиссури§!"
 ra_admiral.1002.desc:0 "Бойцы Сопротивления обожают повторять: «У победы в битве лишь два слагаемых — флот и миссурийский дух». Видно, что генерал Миссури и есть воплощение слова «Сопротивление», вдолбленное в костяк каждого бойца."
 ra_admiral.1003:0 "§RГлубинная Тайхо§!"
 ra_admiral.1003.desc:0 "Адмирал Тайхо — единственная военачальница, перебежавшая из Объединённого флота в Сопротивление. Её крупнейший вклад — созданная для Сопротивления система радиоэлектронного подавления дронов: сразу после начала боя она в кратчайший срок обезвреживает прославленные армии дронов Объединённого флота. Пока системой умеет пользоваться только сама генерал Тайхо. Но и при этом она с её системой в решающих битвах Сопротивления сыграла незаменимую роль в борьбе за господство в воздухе. Её система закрыла пробел в тактической теории адмирала Лексингтон, за что Тайхо заслужила глубокое уважение многих бойцов Сопротивления."
 ra_admiral.1004:0 "§RКэбот§!"
 ra_admiral.1004.desc:0 "«Сожалеешь? Так живи с этим сожалением дальше — твою судьбу решаешь только ты сама». Эти слова, сжимая её за горло, произнесла та, что выглядела точь-в-точь как она — верховный лидер Объединённого флота, уничтоживший её родной дом.\nВсе эти годы в глазах адмирала Кэбот было одно лишь слово «месть», и эта ярость волокла её тело вперёд — пока она не встретила свою вторую семью: Сопротивление. В той битве она на одном корабле попыталась на равных сойтись с целой эскадрой Объединённого флота. Она преуспела: корабль, оснащение, тело — всё было выжато до предела, но, к счастью, случайно проходившие мимо силы Сопротивления спасли этого ангела мщения. Новый дом вернул ей тепло семьи и смысл жизни — и адмирал Кэбот теперь бережёт жизнь как ничто другое."
