 ufs_fire_mode_PowerOverwhelming:0 "§WВыбран режим: §Yперегрузочный удар§!\nЗахвачена система §H[first_selected_ufs_system.GetName]§!\nВ перегрузочном режиме §Rвсе планеты получат повреждения той или иной степени§!\nОжидаемый ущерб §Hнетерраформированным планетам и хабитатам§!: §R[40% разрушения планеты, гибель 800–2000 населения]§!\nОжидаемый ущерб §Hтерраформированным планетам и не-хабитатам§!: §R[70% разрушения планеты, гибель 1400–3500 населения]§!\nОжидаемый ущерб §Hмирам Объединённой славы§!: §R[100% разрушения планеты, гибель 2000–5000 населения]§!\n§YКолонии, отключённые от сверхмерной сети, получат ещё меньше повреждений§!\n\nВ этом режиме перезарядка — §G720§! дней"
