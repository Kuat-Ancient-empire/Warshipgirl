 UF_AURA_BEACON:0 "Объединённая система помех «Вестник»"
 UF_AURA_BEACON_DESC:0 "Чтобы целеуказатель благополучно проник в опасные вражеские владения, эта эффективная система помех в сочетании с крошечными размерами маяка позволяет уклоняться почти от любых атак."
 aura_uf_buffer_beacon:0 "Устройство для сопровождения целеуказателей при входе и выходе из опасных владений."
 requires_no_existing_uf_galaxy_gun:0 "$TRIGGER_FAIL$ Во всей галактике может быть только один Меч Объединения"
 uf_galaxy_gun_platefrom:0 "Строительная платформа Меча Объединения"
 uf_galaxy_gun_platefrom_DESC:0 "Базовая платформа для сверхмерного короба и искусственной системы, нужных для постройки Меча Объединения: отсюда начнётся межсистемное оружие, меняющее правила войны."
 uf_galaxy_gun_platefrom_MEGASTRUCTURE_DETAILS:0 "Базовая платформа для сверхмерного короба и искусственной системы, нужных для постройки Меча Объединения: отсюда начнётся межсистемное оружие, меняющее правила войны."
 uf_galaxy_gun_platefrom_1:0 "Меч Объединения — сверхмерный короб и искусственная звезда"
 uf_galaxy_gun_platefrom_1_DESC:0 "Мы создадим искусственную систему и зажжём искусственную звезду."
 uf_galaxy_gun:0 "Меч Объединения — сверхмерный координатор"
 uf_galaxy_gun_DESC:0 "Исполинский сверхмерный координатор — ключевой компонент, стабилизирующий сверхмерное вещество Меча Объединения."
 uf_galaxy_gun_2:0 "Меч Объединения — стабилизатор"
 uf_galaxy_gun_2_DESC:0 "Стабилизатор Меча Объединения: обеспечивает целостность конструкции при зарядке и залпе, попутно рассеивая излучение."
 uf_galaxy_gun_3:0 "Меч Объединения — главное орудие"
 uf_galaxy_gun_3_DESC:0 "Главный калибр Меча Объединения: он соберёт и сожмёт горы сверхмерного вещества, но нам понадобится ещё несколько фокусирующих колец."
 uf_galaxy_gun_4:0 "Меч Объединения"
 uf_galaxy_gun_4_DESC:0 "Достроенный Меч Объединения в режиме ожидания. «Улучшайте» его, чтобы открыть панель управления или создать целеуказатели."
 uf_galaxy_gun_5:0 "Меч Объединения — зарядка"
 uf_galaxy_gun_5_DESC:0 "Меч Объединения в состоянии зарядки"
 uf_galaxy_gun_6:0 "Меч Объединения — залп"
 uf_galaxy_gun_6_DESC:0 "Собирает горы сверхмерного вещества и через сверхмерную сеть производит залп супероружием."
 uf_galaxy_gun_7:0 "Открыть меню управления"
 uf_galaxy_gun_7_DESC:0 "Открыть панель управления Меча Объединения"
 uf_galaxy_gun_8:0 "Создать целеуказатели"
 uf_galaxy_gun_8_DESC:0 "Создать три целеуказателя удара"
 ufs_recover_cd:0 "Зарядка Меча Объединения"
 ufs_cooldown:0 "Меч Объединения перезаряжается — панель управления недоступна"
 ufs_fire_mode_1:0 "§WМеч Объединения: §Yрежим целеуказателей§!\n\nДля режима целеуказателей «улучшите» Меч Объединения, чтобы получить три §Hкорабля-маяка§!, и приведите их в целевые системы для захвата — до трёх систем за раз.\n\nВ этом режиме перезарядка — §G180/540/720§! дней§!"
 ufs_fire_mode_1_ready:0 "§WВыбран режим: §Yрежим целеуказателей§!\n\n[is_ufs_beacon_1_locked] маяк в системе §H[first_selected_ufs_system.GetName]§!\n[is_ufs_beacon_2_locked] маяк в системе §H[second_selected_ufs_system.GetName]§!\n[is_ufs_beacon_3_locked] маяк в системе §H[third_selected_ufs_system.GetName]§!\n\nОжидаемая перезарядка — §G[root.cooldown_days] дней§!"
 ufs_beacon_locked_desc:0 "§Gзахвачен§!"
 ufs_beacon_unlocked_desc:0 "§Yне захвачен§!"
 ufs_fire_mode_2:0 "§WМеч Объединения: §Yодноректорный пуск§!\n\nВыберите системы удара фильтрами.\n\nВ этом режиме перезарядка — §G180§! дней§!"
 ufs_fire_mode_2_ready:0 "§WВыбран режим: §Yодноректорный пуск§!\n\nЗахвачена система §H[first_selected_ufs_system.GetName]§!\n\nОжидаемая перезарядка — §G180§! дней§!"
 ufs_fire_mode_3:0 "§WМеч Объединения: §Yпуск всех реакторов§!\n\nВыберите системы удара фильтрами: в этом режиме целей три, но целиться в §Hсистемы кризиса§! нельзя.\n\nВ этом режиме перезарядка — §G180/450/720§! дней§!"
 ufs_fire_mode_3_ready:0 "§WВыбран режим: §Yпуск всех реакторов§!\n\nЗахвачена система §H[first_selected_ufs_system.GetName]§!\nЗахвачена система §H[second_selected_ufs_system.GetName]§!\nЗахвачена система §H[third_selected_ufs_system.GetName]§!\n\nОжидаемая перезарядка — §G[root.cooldown_days] дней§!"
