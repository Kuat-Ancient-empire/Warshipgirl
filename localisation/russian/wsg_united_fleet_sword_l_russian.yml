 ufs_fire_mode_crisis_ready:0 "§WВыбран режим: §Yудар по кризису§!\nЗахвачена система §BСвятилища Теневого монолита§!\n§H[first_selected_ufs_system.GetName] система\n\nВ этом режиме перезарядка — §G720§! дней"
