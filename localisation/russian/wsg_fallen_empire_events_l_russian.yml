l_russian:

 wg_fe.20.desc:0 "Уже время?\n… Дети мои, вы ещё недостаточно §Yсильны§!. §YОни§! скоро будут здесь — так дело не пойдёт. Даже рискуя правилами невмешательства — вы обязаны стать сильнее, в §Yдесятки раз сильнее§! нас: лишь тогда будет шанс выстоять против Них."
 wg_fe.20.a:0 "§YОни§!… кто?"
 wg_fe.20.a.response:0 "Запомните имя: §RОбъединённый флот§! Они — кара небесная над всеми цивилизациями, наш извечный враг, сама катастрофа! После Них не остаётся ничего: Они обращают всё в пустоту!"
 wg_fe.20.b:0 "Против ТАКОГО врага у нас есть шанс?"
 wg_fe.20.b.response:0 "Вселенная безбрежна, и в ней многие сопротивляются: кто-то объединился в союзы; мы же выбрали бегство — сохранив гору, нарастишь лес. Наш долг — уберечь как можно больше сородичей, включая вас. Но силой вас не утащим: всё решает ваша воля."
 wg_fe.20.b.response2:0 "Шанс есть — именно в вас я вижу надежду. До Их прихода ещё есть время. Дитя, скорее набирайте силу. Можете уйти с нами — но забрать всех мы не сможем, потому останемся оберегать вас до конца. Разумеется, без достаточно больших пушек всё это лишь слова."
 wg_fe.20.c:0 "Мы останемся, станем несокрушимо сильными и встанем против Них!"
 wg_fe.20.c.response:0 "Раз решено — всё, что нам остаётся, передать вам конспект§G технологий тёмной материи§!. Это будет серьёзный рубеж науки; пройдя его, вы создадите оружие и корабли, способные противостоять Им."
 wg_fe.20.c.response2:0 "Прекрасно — тогда мы со спокойной душой вручит вам эти технологии тёмной материи: это последний рубеж вашей науки. С тёмной материей выкуете оружие против Них. Крепните, дети: §Yвы обязаны — и будете — защищать галактику. §!"
 wg_fe.20.d:0 "Будь по-нашему: мы станем так сильны, что все ощутят ужас и отчаяние."
 wg_fe.20.d.response:0 "Молодость… [root.GetName], пробуйте — станьте так сильны, чтобы сравняться с Ними. Идите и попытайтесь вырвать кошмар, что тянется за нами веками. Тогда, даже погибнув, мы сбросим ношу, которую несём миллионы лет."
 wg_fe.20.e:0 "Заберите часть наших сестёр — мы останемся и будем сопротивляться до конца!"
 wg_fe.20.e.response:0 "Раз решено — что бы ни случилось, мы донесём ваших сестёр до будущего: это единственное обещание, что нам по силам. И ещё — дарим вам конспект§G технологий тёмной материи§!: это серьёзный рубеж науки; пройдя его, вы создадите оружие и корабли, способные противостоять Им."
 wg_fe.20.e.tooltip:0 "Один житель со станции [wg_fe_task_planet.GetName] будет переправлен к [wg_fallen_empire.GetName]."
 wg_fe.23.desc:0 "Сёстры [root.GetName], соотечественницы, все корабельные девы и глубинные девы! Живя рядом с вами, мы увидели красоту этого места и вашу волю сражаться до конца. Нам осточертело прятаться по углам. Мы, граждане [wg_fallen_empire.GetName], единогласно решили: в этой галактике мы будем с вами — встанем и не отступим, до последней!"
 wg_fe.23.a:0 "(Несмолкающие аплодисменты и овации)"
 wg_fe.26.desc:0 "Они идут. §RОни идут§!, сёстры [root.GetName], дети! Дольше оставаться нельзя! Нам искренне жаль — но мы уходим. Берегите себя; может, ещё свидимся где-нибудь!\n\nНа прощание — этот флот вам: пусть хоть как-то убережёт вас от этих демонов."
 wg_fe.26.a:0 "Решение их твёрдо."
 wg_fe.26.b:0 "Жалкие люди…"
 wg_fe.26.c:0 "Идите, остатки старой эры — и не попадайтесь на глаза!"
 wg_fe.28.name:0 "Отплытие"
 wg_fe.28.desc:0 "«Временная» жиличка этой галактики — на десятки тысяч лет — снова отправляется в путь; жилище выметено подчистую. Многолюдные прежде здания опустели."
 wg_fe.28.a:0 "Увидимся ли мы с ними снова?"
 wg_fe.28.b:0 "Уходящим — своё; идущим — свой путь."
 wg_fe.28.c:0 "Отлично: всё их добро — наше."
 wg_fe.29.name:0 "Пепел угас"
 wg_fe.29.desc:0 "Наш учёный корпус только что подтвердил шокирующий факт: замкнутая падшая империя §YГрёза Пепла§! внезапно исчезла. Всё случилось так внезапно, что никто сразу и не осознал смысла. К добру или к худу их уход — не знает никто."
 wg_fe.31.desc:0 "Победа… Не верится…\nМы выжили… Значит, у нас впереди другая задача. Какая? Наверное, идти в следующую галактику и помогать другим детям. (улыбка)\nМы уж больно привыкли к такой жизни — внезапный покой нам в диковинку. Надеемся где-нибудь свидеться."
 wg_fe.31.a:0 "Счастливого пути, старшие."
 wg_fe.31.b:0 "…(закрыть связь)"
 wg_fe_game_console:0 "Починить игровой автомат"
 wg_fe_game_console_DESC:0 "Падшая мама просит отремонтировать старый игровой автомат — думает, у нас может найтись способ."
 wg_fe.110.desc:0 "Привет, как дела? У нас к вам просьба… ну не смотрите так… ну правда, просто починить игровой автомат!"
 wg_fe.110.a:0 "Простите, я правильно расслышал? ВЫ, Падшая мама, просите НАС починить игровой автомат?"
 wg_fe.110.a.response:0 "Этот автомат мы взяли у аборигенной цивилизации дев в другой галактике. Технологии доисторические, но штука — чистая мистика: мы даже нанотехнологии привлекали — без оригинальных чертежей всё равно глючит. Технология его сборки похожа на вашу, вот я и подумала: у вас может выйти."
 wg_fe.110.b:0 "Ладно, попробуем."
 wg_fe.110.c:0 "Вы перехваливаете нас. Вы не справились — нам тем более не по силам."
 wg_fe.110.c.response:0 "Эх, ладно, забыли."
 wg_fe.111.title:0 "Ремонт не удался"
 wg_fe.111.desc:0 "Инженеры особо и не надеялись, но после недель вздохов специалистов стало ясно: против таинственного автомата и у них средств нет."
 wg_fe.11100.title:0 "Ремонт удался"
 wg_fe.111.desc_2:0 "Автомат такого типа мы видим впервые, а технология в нём — старая и коварная; но нашим инженерам это оказалось по плечу — починили в два счёта."
 wg_fe.111.a:0 "Может, поискать атомную досветовую цивилизацию — вдруг у них есть способ?"
 wg_fe.111.b:0 "Спросить кураторов?"
 wg_fe.111.c:0 "Спросить торговца реликвиями?"
 wg_fe.111.d:0 "А мне кажыца — стукнуть!"
 wg_fe.111.e:0 "Отлично — вернём автомат [wg_fallen_empire.GetName]."
 wg_fe.112.title:0 "Дивный старый автомат"
 wg_fe.112.desc.a:0 "Мы заслали агентов под видом путешественниц; расспросив местных, они за дни вычислили мастерские и расспросили о ремонте. Невероятно: у одного хозяина нашлись ЗАПЧАСТИ к этому автомату — и продал задёшево!"
 wg_fe.112.a:0 "Нам повезло."
 wg_fe.112.desc.b:0 "Мы заслали агентов под видом путешественниц; расспросив местных, они за дни вычислили мастерские и расспросили о ремонте. Увы: ни один хозяин не взялся."
 wg_fe.113.desc:0 "Автомат? Вы шутите, гость. Вы позвали меня РАДИ ЭТОГО?"
 wg_fe.113.a:0 "Нашему [root.GetRulerTitle] он очень дорог; очень просим — почините."
 wg_fe.113.a.response:0 "Так… конечно, это пустая трета моего драгоценного времени, но денег вы дали непомерно много. Ладно — сейчас починим."
 wg_fe.113.b:0 "Повторяю: я НЕ шучу!"
 wg_fe.113.b.response:0 "Эх… Да вы бы и сами справились — не тратьте моё время, гость."
 wg_fe.114.title:0 "Дивный старый автомат"
 wg_fe.114.desc:0 "Как мы и ждали: в исполинской базе кураторов нашлись материалы об этих автоматах — починили в два счёта. Правда, цена ремонта слегка кусается…"
 wg_fe.114.a:0 "Лишь бы работал — несём Падшей маме!"
 wg_fe.115.desc:0 "Автомат? У вас, гость, интерес… специфический."
 wg_fe.115.a:0 "Наш [root.GetRulerTitle] без ума от этой модели; очень просим."
 wg_fe.115.a.response:0 "О-о, ну ладно: не особо хочется, но денег вы дали непомерно много — поищу на складе."
 wg_fe.115.b:0 "Да… выручите нас, а?"
 wg_fe.115.b.response:0 "Гость… ТАКОГО экзотического товара у нас заведомо не бывает… поищите других."
 wg_fe.116.title:0 "Другой автомат"
 wg_fe.116.desc:0 "Порывшись на складах, купец вытащил пару рабочих автоматов — и один точь-в-точь как наш!"
 wg_fe.116.a:0 "Конечно, не тот самый — но какая разница, верно?"
 wg_fe.117.title:0 "Орочий способ ремонта"
 wg_fe.117.desc.a:0 "Нам кажыца, метод ремонта этого автомата требует ваааааааах………………………………\n\nАвтомат §YЗАПУСТИЛСЯ§!"
 wg_fe.117.a:0 "Невероятно!"
 wg_fe.117.desc.b:0 "Нам кажыца, метод ремонта этого автомата требует ваааааааах………………………………\n\nАвтомат мы §Yразбили§!"
 wg_fe.117.b:0 "…"
 wg_fe.118.desc:0 "Ну что, что? Починили?"
 wg_fe.118.a:0 "Держи — пустяки."
 wg_fe.118.response:0 "О, прекрасно, спасибо, [Root.GetName]! Кстати, вот одна залипательная игра — в подарок, копию каждому!"
 wg_fe.119.title:0 "Half-Life 3"
 wg_fe.119.desc:0 "[wg_fallen_empire.GetName] поделилась игрой §YHalf-Life 3§! из другой галактики — и игра павшей империи дев мигом взорвала чарты у населения."
 wg_fe.119.a:0 "Раз всем нравится — это отлично."
 wg_fe.120.a:0 "Извините, мы сделали всё, что могли…"
 wg_fe.120.response:0 "О, ничего страшного. Как-нибудь — заходите в гости."
 half_life_3:0 "Half-Life 3"
 half_life_3:0 "Half-Life 3"
 research_pantsu_missing:0 "Странно исчезающие трусики"
 research_pantsu_missing_DESC:0 "Трусики со складов пропадают без причин, количество и периодичность — закономерны: это не ошибка учёта. Надо расследовать."
 steal_pantsu:0 "Странно исчезающие трусики"
 steal_pantsu_desc:0 "По неизвестной причине трусики со склада регулярно исчезают."
 wg_fe.121.name:0 "Кража трусиков"
 wg_fe.121.desc:0 "Складские девы всё чаще недосчитываются трусиков. Сперва думали — недоучёт или человеческий фактор, но проверка дев-бухгалтеров ничего не дала: пропажи продолжились, и в количестве, и по времени — с закономерностью."
 wg_fe.121.a:0 "Хватит это терпеть: создаём специальный комитет полного расследования."
 wg_fe.122.name:0 "Меж-измеренческий экстрактор"
 wg_fe.122.desc:0 "Тщательнейшая проверка выявила в складе ТРЕЩИНУ В ДРУГОЕ ИЗМЕРЕНИЕ! Она-то и высасывала трусики. Проследить источник невозможно, но заткнуть дыру большим грузом — легко. До заткновения учёные успели её от души изучить: науке это аукнется хорошим."
 wg_fe.123.name:0 "Меж-измеренческий экстрактор"
 wg_fe.123.desc:0 "Тщательнейшая проверка выявила в складе ТРЕЩИНУ В ДРУГОЕ ИЗМЕРЕНИЕ! Она-то и высасывала трусики. Дальнейшие изыскания показали: трещина подсоединена к устройству вроде меж-измеренческого экстрактора из [wg_fallen_empire.GetName]!"
 wg_fe.123.a:0 "WOC, что это за чёрная-пречёрная техника?!"
 wg_fe.123.b:0 "Идём к [wg_fallen_empire.GetName] разбираться!"
 wg_fe.124.desc:0 "М-м, это [root.GetRulerName]? Секундочку… экстрактор? (звук чего-то падающего) АААА, нашли?! Нет-нет, с чего бы нам красть трусики… это… такое… неприличное… (сглатывает)"
 wg_fe.124.a:0 "А почему тогда у нас в складе ни с того ни с сего дырка в другое измерение?"
 wg_fe.124.a.response:0 "……… Извините! Это наша экстракционная машина сломалась — немедленно залатаем дыру!"
 wg_fe.124.b:0 "Верните трусики и выключите эту вашу машину."
 wg_fe.124.b.response:0 "Да-да, сейчас, всё сделаем!"
 wows_buff:0 "Мир Звёздных Кораблей"
 wows_buff_desc:0 "Наши офицеры улучшили тактику на этой новаторской тактической симуляции."
 wows_debuff:0 "Мир Звёздных Кораблей"
 wows_debuff_desc:0 "Игра засосала столько дев, что работа встала."
 wg_fe.125.desc:0 "Эй, милый-наивный [root.GetRulerName]: всякий раз, глядя на ваш жалкий флот, я сомневаюсь — было ли у вас военное дело вообще? Хотите доказать силу — сыграйте с нами в эту звёздную игру: может, мнение о вас и переменится."
 wg_fe.125.a:0 "Хм! Ну давай."
 wg_fe.125.b:0 "Пожалуй, нет… игра — зло для делу."
 wg_fe.126.name:0 "Мир Звёздных Кораблей"
 wg_fe.126.desc:0 "Мы подсадили часть офицеров на эту тактическую симуляцию — и из матчей с [wg_fallen_empire.GetName] они вынесли приёмы, применимые в бою."
 wg_fe.126.a:0 "Неплохая игрушка от Падшей мамы."
 wg_fe.127.desc:0 "Мы подсадили часть офицеров на симуляцию — и были разнесены профи [wg_fallen_empire.GetName] в щепу. Офицеры решили прокачать скилл… и засосаны в игру насовсем.\n; часть из них ещё и раздала копии! Теперь залипательная игра заняла всю жизнь дев, мешая производству по всей стране."
 wg_fe.127.a:0 "Ой, всё. Но игра реально огонь!"
 game_buff1:0 "Half-Life 2"
 game_buff1_desc:0 "Тот свободный мужчина…"
 game_buff2:0 "Civilization VI"
 game_buff2_desc:0 "Старец из деревни открыл вам тайну энергии тёмной материи."
 game_buff3:0 "Зритель"
 game_buff3_desc:0 "Магитех из светлого средневековья: способна сымитировать любое творение."
 game_buff4:0 "CK2"
 game_buff4_desc:0 "Слава Третьей Госпоже!"
 wg_fe.128.desc:0 "Привет, [root.GetRulerTitle] [root.GetRulerName] на месте? Поговорить хотела."
 wg_fe.128.a:0 "Да, о чём?"
 wg_fe.129.desc:0 "Видите ли, хочу прикупить ваших фигурок… чем вы согласитесь взяться?"
 wg_fe.129.a:0 "Нам бы немного §Y$energy$§! и §Y$minerals$§!"
 wg_fe.129.b:0 "Нам бы немного §Y$alloys$§!"
 wg_fe.129.c:0 "Трусики… можно взглянуть? (в лоб)"
 wg_fe.129.d:0 "Нам бы немного§Y редких ресурсов§!"
 wg_fe.129.e:0 "Нам бы немного§Y высших ресурсов§!"
 wg_fe.129.f:0 "Нам бы немного §Y$sr_se$§!"
 wg_fe.129.g:0 "Можно немного ваших списанных старых кораблей?"
 wg_fe.129.h:0 "Можно немного ваших списанных старых чертежей?"
 wg_fe.129.i:0 "Выбирай сама что-нибудь"
 wg_fe.129.j:0 "Нам бы немного §Y$nanites$§!"
 wg_fe.129.response1:0 "Просто! Ресурсы уже у вас на счету."
 wg_fe.129.response2:0 "Ой, извините — на мне шорты безопасности. Хотите трофеев — стяну из размерной машины."
 wg_fe.129.response3:0 "Окей, спасибо! Флот подвезут чуть позже.\nКстати: оборудование на кораблях совсем старое, так что §Yвосстановление боеготовности займёт долгое время§! — там сами увидите."
 wg_fe.129.response4:0 "Могу взломать базу данных и стянуть вам научные чертежи — правда, не факт, что те, что нужны… Никому ни слова!"
 wg_fe.129.response5:0 "Тогда — держите эту игру, одна из самых любимых!"
 wg_fe.129.k:0 "Ох… столько товара сейчас нет — заходите в другой раз."
 wg_fe.131.name:0 "Передача флота"
 wg_fe.131.desc:0 "Последний подарок прибыл в столицу [root.capital_scope.GetName]."
 wg_fe.129.tooltip.1:0 "£consumer_goods£ $consumer_goods$§Y-[this.consumer_goods_cost]§!\n£energy£ $energy$§G[this.energy_out]§!\n£minerals£ $minerals$§G[this.minerals_out]§!"
 wg_fe.129.tooltip.2:0 "£consumer_goods£ $consumer_goods$§Y-[this.consumer_goods_cost]§!\n£alloys£ $alloys$§G[this.alloys_out]§!"
 wg_fe.129.tooltip.3:0 "£consumer_goods£ $consumer_goods$§Y-[this.consumer_goods_cost]§!\n£sr_pantsu£ $sr_pantsu$§G[this.sr_pantsu_out]§!"
 wg_fe.129.tooltip.4:0 "£consumer_goods£ $consumer_goods$§Y-[this.consumer_goods_cost]§!\n£volatile_motes£ $volatile_motes$§G[this.volatile_motes_out]§!\n£rare_crystals£ $rare_crystals$§G[this.rare_crystals_out]§!\n£exotic_gases£ $exotic_gases$§G[this.exotic_gases_out]§!"
 wg_fe.129.tooltip.5:0 "£consumer_goods£ $consumer_goods$§Y-[this.consumer_goods_cost]§!\n£sr_living_metal£ $sr_living_metal$§G[this.sr_living_metal_out]§!\n£sr_dark_matter£ $sr_dark_matter$§G[this.sr_dark_matter_out]§!\n£sr_zro£ $sr_zro$§G[this.sr_zro_out]§!"
 wg_fe.129.tooltip.6:0 "£consumer_goods£ $consumer_goods$§Y-[this.consumer_goods_cost]§!\n£sr_se£ $sr_se$§G[this.sr_se_out]§!"
 wg_fe.129.tooltip.10:0 "£consumer_goods£ $consumer_goods$§Y-[this.consumer_goods_cost]§!\n£nanites£ $nanites$§G[this.nanites_out]§!"
 not_enough_consumer_goods:0 "§H$consumer_goods$§!§Y на складе§!§R должно быть больше§!§Y [this.consumer_goods_cost]§!"
 wg_fe.132.desc:0 "Хай, [root.GetRulerName], пришла поиграть…… Как — ты на войне, недосуг? Э-э, кто обижает моего мелкого? Э-м-м-м… тогда держи флот!"
 wg_fe.132.a:0 "… Правда?"
 wg_fe.132.a.response:0 "Правда. Секунду."
 VV_buff_fe:0 "МЕГА-ВВ"
 VV_buff_fe_desc:0 "Полное погружение от падшей империи дев удовлетворит любые ваши потребности. Почти любые."
 wg_fe.134.desc:0 "Эй, чего такая кислая? Что стряслось?"
 wg_fe.134.a:0 "Да вот… эта Венето… (далее по тексту)"
 wg_fe.134.a.response:0 "О-о, вот оно что… Стоп, что ты сказала? §RКонец Круга§!?!?"
 wg_fe.134.b:0 "Да, она так и сказала: нечто, назвавшееся §RКонцом Круга§!, явилось ей во сне."
 wg_fe.134.b.response:0 "О боги… даже Кругобог с ней не справился?.. Бедняга… Что-нибудь придумаем."
 wg_fe.135.desc:0 "Нашла! Кажется, я нашла способ помочь госпоже Венето! Правда… метод — секрет!"
 wg_fe.135.a:0 "Exciting!"
 wg_fe.136.name:0 "3D-виртуальная реальность: Четвёртый шанс"
 wg_fe.136.desc:0 "Загадочные девы-падшие через несколько дней притащили машину полного погружения — и мы позвали госпожу Венето на тест, не рассказав ей о содержании игры.\nС помощью персонала она надела шлем снятия ЭЭГ и села в особое игровое кресло, без труда войдя в вирт. Персонал вывел картинку на большой экран."
 wg_fe.136.a:0 "Получится ли на этот раз?"
 wg_fe.137.name:0 "Воля небес"
 wg_fe.137.desc:0 "Когда госпожа Венето вошла в игру, на экране оказалась вовсе не заготовленная нами фигура с огромной грудью — её образ подменили её собственным. Сколько мы ни колдовали в панели управления, её объём не поднялся и на пункт — а сама она, ничего не подозревая, резвилась в своё удовольствие.\nПосле машину открыли публике; [wg_fallen_empire.GetName] об этой истории — ни слова."
 wg_fe.137.a:0 "Падшая мама сделала всё, что могла."
 wg_fe.138.desc:0 "Мы считаем, Объединённый флот скоро будет в этой галактике — предлагаем создать федерацию против угрозы, какой ещё не бывало. Если федерация у вас уже есть — мы войдём в вашу.\nВаше слово?"
 wg_fe.138.a:0 "Хорошо — мы с вами до конца"
 wg_fe.138.b:0 "Вы нам не нужны"
 wg_fe.138.a.tooltip:0 "Пробудившаяся империя дев войдёт в вашу федерацию или создаст свою"
 wg_fe.145.desc:0 "§GГолограмма явила образ Штурмана§!\n\nДети, если вы видите это послание — Объединённый флот уже здесь.\nПростите, что мы вас покинули: у нас не хватило духа глядеть Им в лицо… Но не теряйте надежды!\n\nМы отправили все действующие эскортные флоты на автопилоте обратно в галактику: они сами отыщут порталы Объединённого флота и ударят. Пусть эти автоматы вам помогут! Удачи!!"
 wg_fe.145.a:0 "…"
