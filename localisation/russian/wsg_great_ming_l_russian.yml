 tech_wg_great_ming_reward_technology_1:0 "Передовые экзамены кэцзюй"
 tech_wg_great_ming_reward_technology_1_desc:0 "Кэцзюй Мин тысячу лет оттачивалась и ныне безупречна: отберёт вам таланты наилучшие."
 tech_wg_great_ming_reward_technology_2:0 "Передовая флотилия"
 tech_wg_great_ming_reward_technology_2_desc:0 "Методика подготовки флота Мин диковинна — нам есть чем поживиться."
 tech_wg_great_ming_reward_technology_3:0 "Дальнее скотоводство"
 tech_wg_great_ming_reward_technology_3_desc:0 "Будь мы хоть десять раз злодеи — и то разведём «фанатов» в чужих державах."
 tech_wg_great_ming_reward_technology_4:0 "Передовая армия"
 tech_wg_great_ming_reward_technology_4_desc:0 "Военное устройство армии Мин стоит перенять."
 tech_wg_great_ming_reward_technology_5:0 "Семиглазый лазерный божественный аркебуз Шэньцзи"
 tech_wg_great_ming_reward_technology_5_desc:0 "Малое лазерное оружие разработки лагеря Шэньцзи."
 tech_wg_great_ming_reward_technology_6:0 "Самоходный божественный огонь Шэньцзи"
 tech_wg_great_ming_reward_technology_6_desc:0 "Большое орудие разработки лагеря Шэньцзи."
 WG_GREAT_MING_SMALL_GUN_REWARD:0 "Семиглазый лазерный божественный аркебуз Шэньцзи"
 WG_GREAT_MING_SMALL_GUN_REWARD_DESC:0 "Малое лазерное оружие разработки лагеря Шэньцзи."
 WG_GREAT_MING_LARGE_GUN_REWARD:0 "Самоходный божественный огонь Шэньцзи"
 WG_GREAT_MING_LARGE_GUN_REWARD_DESC:0 "Большое орудие разработки лагеря Шэньцзи."
 WG_GREAT_MING_TITAN_GUN_REWARD:0 "Пушка Небесного владыки божественного дракона"
 NAME_WG_GREAT_MING_TITAN_REWARD:0 "Божественная мощь"
 NAME_WG_GREAT_MING_SMALL_SHIP_REWARD:0 "Свирепый тигр"
 NAME_WG_GREAT_MING_REWARD_FLEET:0 "Флотилия в отставке"
 wg_great_ming.46.desc:0 "§H[Root.GetName]§! верность вашу Мин видят небо и земля — вот ваша награда."
 wg_great_ming.46.a:0 "Благодарим за милость государеву"
 wg_great_ming.47.desc:0 "§H[Root.GetName]§! верность вашу видят небо и земля; Сын Неба вами весьма доволен и жалует ресурсы — да будут ваши ветра и дожди в срок."
 wg_great_ming.47.a:0 "Благодарим за милость государеву"
 wg_great_ming.48.desc:0 "§H[Root.GetName]§! как верный данник Мин, удостоены передачи передовых знаний."
 wg_great_ming.48.a:0 "Благодарим за милость государеву"
 wg_great_ming.49.desc:0 "§H[Root.GetName]§! у нас есть партия кораблей в отставке; ваши силы слабы — Тому, что§Y над звёздами§! вам не выстоять, — посему Сын Неба жалует их вам; §HFTL-двигатели§! ставьте за свой счёт."
 wg_great_ming.49.a:0 "§YТот, что над звёздами§! — это кто?"
 wg_great_ming.49.a.response:0 "Пять веков назад наши звёздачи видели, как сотни внешних галактик погасли разом; затем§Y измеренные наблюдатели§! узрели то же в других планах. Мы считаем: это существо над измерениями, превыше звёзд.\nПо нашим выкладкам, оно вычищает тех, кто делит с ним звёздные просторы; потому Мин избегает мира и тихо живет — так пережить беду!"
 wg_great_ming.49.b:0 "Нам не потянуть расходы"
 wg_great_ming.49.b.response:0 "Сын Неба входит в ваше положение — корабли уничтожим сами."
 wg_great_ming.49.c:0 "Благодарим за милость; корабли примем"
 wg_great_ming.50.desc:0 "§H[Root.GetName]§! Сын Неба печётся о вас: за три года ваше имя поминали§G 3§! раза! А недавняя ремесленная вещица из вашей дани ему полюбилась — потому вам открывают координаты нашей§Y брошенной колонии§! рядом со вашей столицей; распоряжайтесь планетой как угодно."
 wg_great_ming.50.a:0 "Почему вы бросили колонию?"
 wg_great_ming.50.a.response:0 "Решение пятисотлетней давности: живя в стороне и не расширяясь, можно избежать расправы§Y Того, что над звёздами§! Мы отказались от владений и вернулись домой."
 wg_great_ming.50.b:0 "А можно не принимать?"
 wg_great_ming.50.b.response:0 "Дерзость! Дар самого Сына Неба — великая честь; очередь из желающих — а вы отказываетесь!"
 wg_great_ming.50.c:0 "Благодарим за милость"
 wg_great_ming.50.c.tooltip:0 "§YНа карте появится система Миньхэ Глубинных Скал§!"
 NAME_great_ming_abandoned_world:0 "Миньхэ Глубинных Скал"
 wg_great_ming.51.name:0 "Перепуганные обитатели"
 wg_great_ming.51.desc:0 "Мы колонизировали бывшую колонию Мин и нашли массу пригодных построек — но, к изумлению, внутри повсюду свежие§Y следы обитания§! выходит, на планете есть кто-то ещё.\nДля безопасности колониальная стража прочесала её и нашла в большом подземном комплексе множество§Y Глубинных кораблей-дев§! большинство§H полунагих и измождённых§! нас они встретили ужасом."
 wg_great_ming.51.a:0 "Не наш род — расстрелять; планета наша"
 wg_great_ming.51.b:0 "Спросить, что случилось"
 wg_great_ming.52.name:0 "Рабыни Мин"
 wg_great_ming.52.desc:0 "Из разговора: это брошенные Мин рабыни; века они жили на оставшейся инфраструктуре и умоляют нас принять их — хоть рабынями."
 wg_great_ming.52.a:0 "Мы — законные хозяева планеты; уходите"
 wg_great_ming.52.b:0 "Мы вас принимаем"
 wg_great_ming.52.b.tooltip:0 "Планета получает§G 3§! £pops£§HГлубинных кораблей-дев Мин§!"
 wg_great_ming.54.desc:0 "§H[Root.GetName]§! из вашей последней дани фигурка Сыну Неба весьма полюбилась — повелел просить добавочную партию. Не поскупитесь."
 wg_great_ming.54.a:0 "Хорошо, сейчас готовим"
 wg_great_ming.54.a.tooltip:0 "§YРасположение Мин к нам выросло§!"
 wg_great_ming.54.b:0 "Казна пуста — не потянуть"
 wg_great_ming.54.b.response:0 "Ладно: коль в самом деле тяжко — доложу Сыну Неба."
 wg_great_ming.54.b.tooltip:0 "§RРасположение Мин к нам чуть упало§!"
 wg_great_ming.55.desc:0 "§H[Root.GetName]§! Сыну Небу полюбились яства из вашей дани — просим добавочную партию."
 wg_great_ming.55.a:0 "Хорошо, сейчас готовим"
 wg_great_ming.55.b:0 "У нас голод: народ ест раз в три дня!"
 wg_great_ming.55.b.response:0 "Вижу, вам в самом деле туго — доложу Сыну Неба."
 wg_great_ming.56.name:0 "Помощь бедствующим"
 wg_great_ming.56.desc:0 "Сославшись на пустую казну, мы не осилили добавочную дань.\nИ вот через время Мин прислала £consumer_goods£§Yпотребительских товаров§! со словами: помощь бедствующим."
 wg_great_ming.56.a:0 "У них и тёплая сторона есть"
 wg_great_ming.56.b:0 "Поделились крохами — только и всего"
 wg_great_ming.57.desc:0 "Сославшись на голод, мы не осилили добавочную дань.\nИ вот через время Мин прислала £food£§Yеды§! со словами: помощь бедствующим."
 wg_great_ming.57.a:0 "Эта помощь для нас важна"
 wg_great_ming.57.b:0 "Для них это объедки — только и всего"
 wg_great_ming.58.desc:0 "§H[Root.GetName]§! нам нужны редкости, что есть в ваших владениях; соберёте в срок — стяжаете наше расположение и щедрую мзду."
 wg_great_ming.58.a:0 "Принимаем поручение"
 wg_great_ming.58.a.response:0 "Славно! Список отправлен"
 wg_great_ming.58.b:0 "Нам не хватает сил"
 wg_great_ming.59.desc:0 "Невероятно: вы справились! Мы в вас не верили — видно, недооценили; Сын Неба будет очень рад. Вас ждёт великое будущее!"
 wg_great_ming.59.a:0 "Пустяки"
 wg_great_ming.59.a.tooltip:0 "§YМин весьма нами довольна: расположение изрядно выросло§!"
 wg_great_ming.60.desc:0 "§H[Root.GetName]§! да вы же ничтожества: и с этаким пустяком не справились! Какое разочарование."
 wg_great_ming.60.a:0 "Простите"
 wg_great_ming.60.a.tooltip:0 "§YМин нами разочарована: расположение изрядно упало§!"
 WG_GREAT_MING_DRG_MISSION:0 "Операция «Редкости»"
 WG_GREAT_MING_DRG_MISSION_DESC:0 "Мин вручила список: собрать в срок редкости наших владений. Исполним — получим щедрую награду.\n\n§YДетали:\n4000 чернилолистников\n300 чумных носителей\n300 яиц тварей\n300 водорезных стел\n1000 цветов загробного берега\n1000 грибов Булло\n1000 окаменелостей§!"
 wg_great_ming.101.desc:0 "Всё под Небом — земля государя; все, кто на земле, — слуги государя.\nВы ступили в звёзды — откроем вам сокровенное.\nТот, что «над звёздами», уже близок; галактика более не безопасна, «Звёздный покров Небес» истончился — нам не укрыться.\nДля отражения грозящей беды, повелением Сына Неба:\nжалуем ваши исконные державы чином «Главных управлений»; несите державную мощь Мин, раздвигайте пределы, прославьте себя в поднебесье.\nПока не поздно — стройте войска для отпора врагу."
 wg_great_ming.101.a:0 "До Волчьей горы с знамёнами — и высечь подвиг на скалах Яньшаня!"
 wg_great_ming.102.desc:0 "Вы уделены диким землям, но Сын Неба, помятуя, что вы лишь вначале пути среди звёзд, жалует из внутренних кладовых средства на развитие и становление.\nТакже шесть ведомств учредили счёт «милости государя»: собирайте для империи диковины и несите сокровища — обретёте очки милости.\nОчками можно испрашивать ресурсы, знания и даже флотилию Мин; а буде милости довольно и Сын Неба возрадуется — не исключена и выдача принцессы замуж."
 wg_great_ming.102.a:0 "Поить коней в великой пустыне — и области до Циляньских гор!"
 wg_great_ming_vassal_country_3:0 "Дань Мин"
 wg_great_ming_vassal_country_3_desc:0 "Мы несём дань Мин."
 wg_great_ming_vassal_country_4:0 "Субсидия Мин"
 wg_great_ming_vassal_country_4_desc:0 "Мин помогает нашему развитию."
 wg_great_ming.16.e:0 "Хотим принести добавочную дань."
 wg_great_ming.16.f:0 "Хотим обмен по очкам милости."
 wg_great_ming.16.g:0 "Хотим выйти из даннической системы."
 wg_great_ming.16.h:0 "Ничего."
 wg_great_ming.16.h.response:0 "Старайтесь же."
 wg_great_ming.110.desc:0 "Выйти из даннической системы?\nЧто это значит — как слова складываются в такую фразы?\nВ «Сокровищнице четырёх книгохранилищ» таких сочетаний нет!\nВыйти — значит покинуть; данник — значит наш вассал…… стой: вы хотите более не быть вассалом Мин?\nЭто, это……\nСлыхом не слыхано: кто пожелает покинуть Мин?! Дело превелико — доложу Сыну Неба.\nПодтвердите: истинно желаете покинуть Мин?"
 wg_great_ming.110.a:0 "Эм, да нет, я пошутил(а)."
 wg_great_ming.110.a.response:0 "О таком не шутят! Ради заслуг вашей державы пред Мин — ныне прощаем."
 wg_great_ming.110.b:0 "Я пришёл именно выйти из Мин."
 wg_great_ming.111.desc:0 "…… Ради заслуг вашей державы Сын Неба взыскивать не стал.\nОтныне ваша держава и Мин — ни обид, ни уз; Мин более не примет вашей верности. Блюдите себя."
 wg_great_ming.111.a:0 "Всё кончено."
 wg_great_ming.120.desc:0 "У вас сейчас§Y [Root.origin_wg_great_ming_subject_point]§! очков милости.\nКаждые пять лет Мин оценивает ваши дела и дарует очки; добавочная дань тоже прибавляет их."
 wg_great_ming.120.a:0 "Хотим поднести экспонат."
 wg_great_ming.120.a.tooltip:0 "Мин сама выберет один['concept_specimen'] в нашем['concept_megastructure_grand_archive'] и даст нам§Y 20§! очков милости."
 wg_great_ming.120.a.response:0 "Ещё подношения будут?"
 wg_great_ming.120.b:0 "Хотим поднести наномашины."
 wg_great_ming.120.b.tooltip:0 "Это даст нам§Y 5§! очков милости."
 wg_great_ming.120.b.response:0 "Ещё подношения будут?"
 wg_great_ming.120.c:0 "Хотим поднести живой металл."
 wg_great_ming.120.c.tooltip:0 "Это даст нам§Y 5§! очков милости."
 wg_great_ming.120.c.response:0 "Ещё подношения будут?"
 wg_great_ming.120.d:0 "Хотим поднести тёмную материю."
 wg_great_ming.120.d.tooltip:0 "Это даст нам§Y 5§! очков милости."
 wg_great_ming.120.d.response:0 "Ещё подношения будут?"
 wg_great_ming.120.e:0 "Ничего."
 wg_great_ming.121.desc:0 "У вас сейчас§Y [Root.origin_wg_great_ming_subject_point]§! очков милости.\nКаждые пять лет Мин оценивает ваши дела и дарует очки; добавочная дань тоже прибавляет их."
 wg_great_ming.121.a:0 "Обменять на базовые ресурсы"
 wg_great_ming.121.a.tooltip:0 "Тратит§Y 20§! очков милости."
 wg_great_ming.121.b:0 "Обменять на промышленные ресурсы"
 wg_great_ming.121.b.tooltip:0 "Тратит§Y 20§! очков милости."
 wg_great_ming.121.c:0 "Обменять на редкие ресурсы"
 wg_great_ming.121.c.tooltip:0 "Тратит§Y 20§! очков милости."
 wg_great_ming.121.d:0 "Обменять на случайную технологию"
 wg_great_ming.121.d.tooltip:0 "Тратит§Y 50§! очков на случайную технологию Мин или временный бонус."
 wg_great_ming.121.e:0 "Обменять на корабли Мин"
 wg_great_ming.121.e.tooltip:0 "Тратит§Y 200§! очков на случайную флотилию Мин."
 wg_great_ming.121.f:0 "Сватовство принцессы"
 wg_great_ming.121.f.tooltip:0 "Лишь раз: за§Y 200§! очков Мин выдаёт замуж одну принцессу."
 wg_great_ming.121.fail_text:0 "Очков милости недостаточно."
 wg_great_ming.122.name:0 "Принцесса Мин"
 wg_great_ming.122.desc:0 "Сын Неба, взвесив всё, выдаёт за вас сию принцессу. Чтите её и не небрежьте."
 wg_great_ming.122.a:0 "А можно другую?"
 wg_great_ming.122.a.response:0 "Дерзость! Дар самого Сына Неба — великая честь; тут не выбирают!"
 wg_great_ming.122.hire_custom_tooltip:0 "Принцесса Мин вступает в вашу империю"
 wg_great_ming_leader_catch_phrase:0 "Постойте — эти как-то связаны с кораблями-девами?"
 NAME_wg_great_ming_leader1:0 "Чжу Линсяо"
 leader_trait_wg_great_ming_leader1:0 "Принцесса Мин"
 leader_trait_wg_great_ming_leader1_desc:0 "§BПринцесса Мин§!\n\n\n\n£wg_trait_pic_wg_great_ming_leader1£\n\n\n\nЭта корабль-дева — принцесса империи Мин.\n§RМин время от времени навещает принцессу; не застанет — быть беде. §!"
 wg_great_ming_leader1_backstory:0 "\n\n\n\nЧжу Линсяо, третья принцесса Мин, автор популярных романов «Перерождение: я стартовый учёный КорабR», «Я собрал(а) 59-й звездорушитель, и внучка меня сдала», «О том, как я унаследовал(а) мамин порт», «В поисках пропавших Глубинных».\nСтража в парчовых халатах сообщает: успех книг и то, что автор — имперская принцесса, никоим образом не связаны."
 NAME_wg_great_ming_leader2:0 "Чжу Юэся"
 leader_trait_wg_great_ming_leader2:0 "Принцесса Мин"
 leader_trait_wg_great_ming_leader2_desc:0 "§BПринцесса Мин§!\n\n\n\n£wg_trait_pic_wg_great_ming_leader2£\n\n\n\nЭта корабль-дева — принцесса империи Мин.\n§RМин время от времени навещает принцессу; не застанет — быть беде. §!"
 wg_great_ming_leader2_backstory:0 "\n\n\n\nЧжу Юэся, четвёртая принцесса Мин: при её рождении небеса явили знамение — гулы Дао и аромат темных лотосов три дня кружили над дворцом, и все слышавшие…… эм…… пробуждали в себе некие первобытные позывы.\nНа днях Стража взяла шайку, торговавшую подделкой геля «с тем самым запахом четвёртой принцессы»; подданные, не дайте себя одурачить."
 NAME_wg_great_ming_leader3:0 "Чжу Цяньмэн"
 leader_trait_wg_great_ming_leader3:0 "Принцесса Мин"
 leader_trait_wg_great_ming_leader3_desc:0 "§BПринцесса Мин§!\n\n\n\n£wg_trait_pic_wg_great_ming_leader3£\n\n\n\nЭта корабль-дева — принцесса империи Мин.\n§RМин время от времени навещает принцессу; не застанет — быть беде. §!"
 wg_great_ming_leader3_backstory:0 "\n\n\n\n\n\n\n\n«Говорят, и в царском роду Мин есть партии».\n«Да ну! Подробности давай».\n«Пятая принцесса, что войском встала у Рима и создала шестое Европрефектуру — Цяньмэн Август Василевс Цезарь Виктория Чжу — слыхал(а)? Это же гордая „военная принцесса“».\n«Как не знать: почётный ректор академии Туму, первый конструктор вооружений Шэньцзи, держательница казны и войск».\n«Э, стоп, чего друг друга расхваливаем? Тайны двора где, партии, дворцовые интриги в стиле „Легенды о Z“?»\n«А, забыл… слушай: пятая принцесса со старшей принцессой — отношения ох какие непростые».\n«Микрофон твой, рассказывай».\n«Дед моего деда — дальний родич — брат сестры… в общем, племянник его — тот смотритель дворцовых ворот; так вот: пятая принцесса — ярая сторонница старшей; у них во дворце был такой туман, что пятая чуть войском не пошла на бунт».\n«Ого! И что дальше?»\n«Стража, отворяй дверь! Кто тут толкует о тайнах двора!»"
 NAME_wg_great_ming_leader4:0 "Чжу Даньгао"
 leader_trait_wg_great_ming_leader4:0 "Принцесса Мин"
 leader_trait_wg_great_ming_leader4_desc:0 "§BПринцесса Мин§!\n\n\n\n£wg_trait_pic_wg_great_ming_leader4£\n\n\n\nЭта корабль-дева — принцесса империи Мин.\n§RМин время от времени навещает принцессу; не застанет — быть беде. §!"
 wg_great_ming_leader4_backstory:0 "\n\n\n\nПеред вами — создательница опоры державы «Звёздный покров Небес», почётный ректор Звёздной академии, пожизненный глава астрономической палаты, шестикратный лауреат премии Чжу Юаня по наукам, лауреат «Вдохновляющих Мин XXIII века», серый кардинал шести ведомств, теневой император — шестая принцесса Мин Чжу Даньгао.\nСтража напоминает: всё это титулы ОДНОЙ особы.\nПоследние два титула — злобная клевета: под державным водительством Чжу Ишань Мин цветёт день ото дня."
 NAME_wg_great_ming_leader5:0 "Чжу Фаннай"
 leader_trait_wg_great_ming_leader5:0 "Принцесса Мин"
 leader_trait_wg_great_ming_leader5_desc:0 "§BПринцесса Мин§!\n\n\n\n£wg_trait_pic_wg_great_ming_leader5£\n\n\n\nЭта корабль-дева — принцесса империи Мин.\n§RМин время от времени навещает принцессу; не застанет — быть беде. §!"
 wg_great_ming_leader5_backstory:0 "\n\n\n\nЗагадочная седьмая принцесса Чжу Фаннай: говорят, от рождения никто не выдерживал рядом с ней и часа — иначе делался(ась) безглазым иссохшим чучелом, а очнувшись, забывал(а) всё, что было после встречи с принцессой.\nПосле безбоязненных, одна за другой, изысканий Стража заключила: Чжу Фаннай — ни в коем разе не корабль-дева, а невиданная ХХ.\nСтража, внимание"
 NAME_wg_great_ming_leader6:0 "Чжу Хайбао"
 leader_trait_wg_great_ming_leader6A:0 "Принцесса Мин"
 leader_trait_wg_great_ming_leader6A_desc:0 "§BПринцесса Мин§!\n\n\n\n£wg_trait_pic_wg_great_ming_leader6A£\n\n\n\nЭта корабль-дева — принцесса империи Мин.\n§RМин время от времени навещает принцессу; не застанет — быть беде. §!"
 leader_trait_wg_great_ming_leader6B:0 "Принцесса Мин"
 leader_trait_wg_great_ming_leader6B_desc:0 "§BПринцесса Мин§!\n\n\n\n£wg_trait_pic_wg_great_ming_leader6B£\n\n\n\nЭта корабль-дева — принцесса империи Мин.\n§RМин время от времени навещает принцессу; не застанет — быть беде. §!"
 wg_great_ming_leader6_backstory:0 "\n\n\n\nВторая принцесса Мин, Чжу Хайбао: ещё до рождения была проклята каменным человеком со дна реки, запиской в рыбьем брюхе и лисьим криком.\nВ первый же час после рождения стала вот этим тюленем; говорят, довольно поцелуя истинно любящего — и облик вернётся.\nТот истинно любящий — это ты?\n(беее; смотреть тошно)"
 wg_great_ming.123.name:0 "Истинный облик тюленя"
 wg_great_ming.123.desc:0 "Принцесса Чжу Хайбао в сопровождении своей гвардии прибыла в нашу империю.\nКак в легенде: у её высочества нет тела корабля-девы — облик тюленя.\nПо легенде, поцелуй вернёт ей прежний вид. Ну что, управляющий, прильнём?"
 wg_great_ming.123.a:0 "Как говорится: не мне в аду гореть — так кому же……"
 wg_great_ming.123.b:0 "Беее, лучше не надо"
 NAME_wg_great_ming_leader7:0 "Чжу Юньмо"
 leader_trait_wg_great_ming_leader7:0 "Принцесса Мин"
 leader_trait_wg_great_ming_leader7_desc:0 "§BПринцесса Мин§!\n\n\n\n£wg_trait_pic_wg_great_ming_leader7£\n\n\n\nЭта корабль-дева — принцесса империи Мин.\n§RМин время от времени навещает принцессу; не застанет — быть беде. §!"
 wg_great_ming_leader7_backstory:0 "\n\n\n\nДочь моя: в день твоего рождения вся вселенная шептала твоё имя — Чжу Юньмо……\nЮньмо Лицин-Шан Ангелина Инксюэ Юйханьлин Сюэличи Чжу — несомненная единственная законная наследница Мин; сияние её ярче галактического ядра, имя гремит по мирозданию, деяния высекут в истории Мин на десятки тысяч веков; она станет солнцем……\nКто выключил свет? Я ещё не закончил(а).\nНовый роман принцессы Чжу Линсяо «Принцесса Чжу Юньмо взмахом ночи сшибает угрозу над звёздами» поступил в продажу; детали — в магазине трофеев."
 wg_great_ming.124.desc:0 "Где принцесса!?"
 wg_great_ming.124.a:0 "А я почём знаю."
 wg_great_ming.124.b:0 "Ужель преставилась."
 wg_great_ming.131.desc:0 "Буря близка — вы готовы?\nАстрономическая палата видела угасание звёзд в соседних системах; Тот, что «над звёздами», уже у порога — Сын Неба объявил военное положение.\nВпредь до войны вам дозволено временно не платить дань: все средства — на подготовку."
 wg_great_ming.131.a:0 "Буря близка……"
 wg_great_ming.132.desc:0 "Они пришли. По перехваченным Стражей данным, они зовутся «Объединённый флот» и хотят истребить всё живое в галактике — включая нас, единокровных им.\n\nОтступать некуда, держаться не за что……\nСын Неба блюдет врата державы, государь умирает со державой……\nСо мной же — на славное поле!"
 wg_great_ming.132.a:0 "Сей властью — в новый поход!"
 wg_great_ming.133.desc:0 "Немыслимо: вы и вправду одолели Объединённый флот.\nСын Неба ныне приносит жертвы предкам в Храме — не может вас принять.\nНо повелел: за великий подвиг вам дозволена добавочная принцесса — две имперские принцессы за одним супругом; этакого и история не знала.\nТакже вам даровано выйти из даннической системы безо всякой цены; обмен по очкам милости остаётся — но можете и не выходить.\nИ вновь — поздравляю с победой над Объединённым флотом; теперь это моё личное поздравление."
 wg_great_ming.133.a:0 "Быть псом Мин — вот высшая честь!"
 wg_great_ming.133.a.tooltip:0 "Остаться данником Мин."
 wg_great_ming.133.b:0 "И дальше — в завтрашний день."
 wg_great_ming.133.b.tooltip:0 "Выйти из даннической системы Мин; обмен по очкам милости остаётся открытым."
