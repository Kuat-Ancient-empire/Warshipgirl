l_russian:

 NAME_Sol_ming_system:0 "Столица Великой Мин"
 NAME_Sol_ming:0 "Небесная сокровищница Мин"
 NAME_Sol_ming_sun:0 "Солнце"
 auth_great_ming:0 "Империя Великая Мин"
 auth_great_ming_desc:0 "Космическая династия Мин, воздвигнутая кораблями-девами"
 gov_great_ming:0 "Империя Великая Мин"
 gov_great_ming_desc:0 "В этом плане Мин построена кораблями-девами: они не свернули с пути великих морских походов, подчинили всю планету — но почему-то остановились у моря звёзд."
 great_ming_wsg_emperor_title:0 "Император"
 great_ming_defense_army:0 "Дворцовая стража Мин"
 great_ming_defense_army2:0 "Пограничная армия Мин"
 great_ming_jinyiwei:0 "Стража в парчовых халатах"
 NAME_great_ming_wsg_country:0 "Корабли-девы империи Мин"
 NAME_great_ming_wsg_species:0 "корабли-девы Мин"
 wg_great_ming_age:0 "Империя Великая Мин"
 wg_great_ming_age_desc:0 "Великая Мин с передовой наукой — но почему-то остановившаяся у моря звёзд."
 NAME_great_ming_emperor:0 "Чжу Ишань"
 personality_wg_great_ming_personalities:0 "Династия Великая Мин"
 personality_wg_great_ming_personalities_desc:0 "В этом плане Мин построена кораблями-девами: они не свернули с пути великих морских походов, подчинили всю планету — но почему-то остановились у моря звёзд."
 NAME_great_ming_sh_species:0 "Глубинные рабыни"
 wg_great_ming_trade_spacestation:0 "Звёздное управление морской торговли"
 NAME_WG_GREAT_MING_TRADE_SPACESTATION:0 "У Инжуй"
 wg_great_ming_spacestation:0 "База сокровищных кораблей Мин"
 NAME_WG_GREAT_MING_SPACESTATION:0 "Остров бессмертных"
 NAME_WG_GREAT_MING_FLEET:0 "Дворцовая флотилия Мин"
 NAME_WG_GREAT_MING_FLEET_COUNTRY:0 "Флот Мин"
 NAME_WG_GREAT_MING_FLEET2:0 "Непобедимая флотилия Мин"
 wg_great_ming_titan_ship:0 "Сокровищный корабль Мин"
 NAME_WG_GREAT_MING_TITAN:0 "Дракон в полёте"
 wg_great_ming_small_ship:0 "Военный корабль Мин"
 NAME_WG_GREAT_MING_SMALL_SHIP:0 "Плывущий дракон"
 WG_GREAT_MING_TITAN_GUN:0 "Пушка Небесного владыки божественного дракона"
 WG_GREAT_MING_LARGE_GUN:0 "Самоходный божественный огонь лагеря Шэньцзи"
 WG_GREAT_MING_SMALL_GUN:0 "Семиглазый лазерный божественный аркебуз лагеря Шэньцзи"
 WG_GREAT_MING_ARMOR:0 "Нейтронно-звёздные доски"
 WG_GREAT_MING_SHIELD:0 "Золотой колокол-щит"
 01_WG_GREAT_MING_DIPLO_PHRASE:0 "…… о…… угу……"
 02_WG_GREAT_MING_DIPLO_PHRASE:0 "Что стряслось?"
 03_WG_GREAT_MING_DIPLO_PHRASE:0 "Невежды! Вам неведомо, что над звёздами есть высшие?"
 04_WG_GREAT_MING_DIPLO_PHRASE:0 "Почему вы не несёте дани?"
 05_WG_GREAT_MING_DIPLO_PHRASE:0 "О?"
 01_WG_GREAT_MING_WAR_GREETING:0 "Жалкое государство-кроха! Дань нести отказываешься — гнев Неба страшен, шесть армий двинутся, и держава твоя падёт!"
 02_WG_GREAT_MING_WAR_GREETING:0 "Осмелились!! Стража, казнить девять родов!! Что? Ты не мой подданный?"
 03_WG_GREAT_MING_WAR_GREETING:0 "Вы обратитесь в пыль истории, погибнув под безжалостными знамёнами!"
 04_WG_GREAT_MING_WAR_GREETING:0 "Час твой пробил!"
 05_WG_GREAT_MING_WAR_GREETING:0 "Тебя вздёрнут на старом кривом дереве!"
 01_WG_GREAT_MING_TRIBUTED:0 "Встаньте, верные слуги."
 02_WG_GREAT_MING_TRIBUTED:0 "Соберите ещё диковинных ремесленных вещей и вкусных яств."
 03_WG_GREAT_MING_TRIBUTED:0 "Дары ваши мы приняли соизволением. Блюдите союз с Мин и не тревожьте покой пустяками."
 04_WG_GREAT_MING_TRIBUTED:0 "Доселе невежды — не ведаете о Том, что над звёздами. Судия покарает всех алчных. Лишь ютясь в уголке, как мы, можно спастись. Кайтесь, покоряйтесь воле Неба — и, быть может, уцелеете."
 05_WG_GREAT_MING_TRIBUTED:0 "Дары ваши нынешние приняты."
 01_WG_GREAT_MING_ORIGIN_A:0 "Звёздная пыль! Счастливцы, что купаетесь в сиянии Поднебесной — чего ж медлите?"
 02_WG_GREAT_MING_ORIGIN_A:0 "Если б не Тот, что «над звёздами», эта галактика была бы просто царским охотничьим парком Мин."
 03_WG_GREAT_MING_ORIGIN_A:0 "Ремесло ваше смешно и грубо; завтра пошлём мастеров в Море звёздных ладей поучиться премудростям Мин. Разумеется, за плату."
 01_WG_GREAT_MING_ORIGIN_B:0 "Астрономы донесли: орбита вашей звезды сдвинулась на три миллисекунды дуги — не обидели ли принцессу? Живо спросите о самочувствии!"
 02_WG_GREAT_MING_ORIGIN_B:0 "Раз принцесса выдана за вас, дань умаляется на три десятых; но ежегодно положен «дар тоски по дому» — в размере тех же трёх десятых прежней дани. Ропщете?"
 03_WG_GREAT_MING_ORIGIN_B:0 "Хоть род ваш ныне равен нам, генная пропасть остаётся — родится ли наследник? Драконий род Мин нужен в преемнике."
 01_WG_GREAT_MING_ORIGIN_C:0 "Дерзость! Знал(а), что подлое отродье в конце концов кус Мин! Стража в парчовых халатах низведёт на вас кару Неба!"
 02_WG_GREAT_MING_ORIGIN_C:0 "Смеете поднимать на нас же данное вам ремесло?"
 03_WG_GREAT_MING_ORIGIN_C:0 "Украденные звёздные хитрости против флота Мин? Если б не Те…… мерзость."
 01_WG_GREAT_MING_ORIGIN_D:0 "А Объединение-то оказалось не так уж и страшно. Ладно: внесу ваши подвиги в Звёздную хронику Юнлэ."
 02_WG_GREAT_MING_ORIGIN_D:0 "Хоть вы и стали сами по себе, помните: солнце и луна Мин вечно светят вашим мирам."
 03_WG_GREAT_MING_ORIGIN_D:0 "На будущей аудиенции всех держав встанете под нами — над всеми варварами. Это ваша слава."
 building_wg_great_ming_imperial_palace:0 "Дворец Небесного свода"
 building_wg_great_ming_imperial_palace_desc:0 "Объединив четыре моря, тогдашний император повелел возвести новый дворец во славу своих свершений. С опорой высшей науки дворец встал на высочайшей вершине планеты и озирает весь мир — свидетельство величия и единства Мин."
 building_wg_great_ming_tax_office:0 "Налоговая палата Мин"
 building_wg_great_ming_tax_office_desc:0 "После объединения мира Мин расставила четыре налоговые палаты для сбора податей со всех земель."
 building_wg_great_ming_shenji_camp:0 "Космопорт лагеря Шэньцзи"
 building_wg_great_ming_shenji_camp_desc:0 "Лагерь Шэньцзи ведёт науку Мин и держит оборону империи."
 building_wg_great_ming_jinyiwei:0 "Штаб стражи в парчовых халатах"
 building_wg_great_ming_jinyiwei_desc:0 "Личные войска императора Мин — что-то вроде разведки империи."
 building_wg_great_ming_residential:0 "Городской квартал"
 building_wg_great_ming_residential_desc:0 "Жильё простого люда Мин: под старинным фасадом — невообразимые высокие технологии. Мин так процветает, что народу работать не нужно."
 building_wg_great_ming_residential2:0 "Городской квартал Мин"
 building_wg_great_ming_residential2_desc:0 "Здание, что Мин не снесла, покидая этот мир, — им можно пользоваться и нам."
 building_wg_great_ming_house:0 "Соломенная хижина"
 building_wg_great_ming_house_desc:0 "Хлипкое жильё из чего угодно — для рабынь."
 job_wg_great_ming_hedonist:0 "Живущие в покое"
 job_wg_great_ming_hedonist_plural:0 "Живущие в покое"
 job_wg_great_ming_hedonist_cap:0 "$job_wg_great_ming_hedonist$"
 job_wg_great_ming_hedonist_cap:0 "$job_wg_great_ming_hedonist$"
 job_wg_great_ming_hedonist_desc:0 "Мин столь изобильна, что простому народу работать незачем — лишь услаждаться жизнью вместе с Сыном Неба."
 mod_job_wg_great_ming_hedonist_add:0 "Места: $job_wg_great_ming_hedonist$"
 job_wg_great_ming_slave:0 "Рабыня"
 job_wg_great_ming_slave_plural:0 "Рабыни"
 job_wg_great_ming_slave_cap:0 "$job_wg_great_ming_slave$"
 job_wg_great_ming_slave_cap:0 "$job_wg_great_ming_slave$"
 job_wg_great_ming_slave_desc:0 "Потомки мятежников и кораблей побеждённых стран, из рода в род несущие ярмо."
 mod_job_wg_great_ming_slave_add:0 "Места: $job_wg_great_ming_slave$"
 d_great_ming_old_tree:0 "Старое кривое дерево"
 d_great_ming_old_tree_desc:0 "Когда последнего несогласного владыку вздёрнули на этом старом кривом дереве, поход Мин за объединение мира завершился блистательно. Ныне дерево — знаменитая достопримечательность."
 d_great_ming_zhenghe:0 "Памятник Чжэн Хэ, идущему в Восточный океан"
 d_great_ming_zhenghe_desc:0 "Касающееся небес изваяние — во славу великого Чжэн Хэ, открывшего и покорившего новые земли."
 d_great_ming_tumubao:0 "Мемориал крепости Туму"
 d_great_ming_tumubao_desc:0 "В битве при Туму войско Мин одолело мятежников; та победа стала вехой истории — Мин утвердилась в вере и постепенно стала сильнейшей державой мира."
 d_great_ming_great_wall:0 "Антиорбитальные пушки Великой стены"
 d_great_ming_great_wall_desc:0 "Великая стена поперёк материков и океанов; на этих каменных драконах стоят антиорбитальные орудия."
 WG_GREAT_MING_RUINED_SHIP:0 "§HКосмический деревянный корабль§!"
 WG_GREAT_MING_RUINED_SHIP_DESC:0 "На орбите планеты найдены обломки диковинного корабля — и, к изумлению, обломки эти§H деревянные§!……"
 wg_great_ming.1.name:0 "Беглянки"
 wg_great_ming.1.desc:0 "Мы обследовали диковинный деревянный корабль: он изрешечён — ясно, что его сшиб другой корабль. Корпус из аномально прочного материала, похожего на дерево; весь облик — парусник древности; и, что необъяснимо, без§H FTL-двигателя§! Пуще того — среди обломков скелеты экипажа: §HГлубинные корабли-девы§!\n\nОтвет нашёлся в судовом журнале: это беглые рабыни; во время бунта они захватили корабль властей — но флот тех их настиг и сшиб.\n\nПо координатам можно вычислить порт отплытия — и, быть может, раскрыть тайну диковинного корабля."
 wg_great_ming.1.a:0 "Занятно; распутаем загадку"
 wg_great_ming.1.b:0 "§RДеревянный корабль в космосе? Вы точно перебрали§!"
 wg_great_ming.1.b.tooltip:0 "§HЗавершить цепочку космической Мин§!"
 WG_GREAT_MING_HOME_SYSTEM:0 "Космический деревянный корабль"
 WG_GREAT_MING_HOME_SYSTEM_DESC:0 "Мы нашли обломки диковинного деревянного парусника; по его координатам попробуем вычислить порт отплытия."
 wg_great_ming.2.name:0 "Координаты подтверждены"
 wg_great_ming.2.desc:0 "По остаткам координат мы нашли ту загадочную систему: её нет ни в одной записи, и хозяин, похоже, нарочно прятал её от чужих глаз."
 wg_great_ming.2.a:0 "Загадочный скрытник? Забавно"
 wg_great_ming.2.a.tooltip:0 "§HСкрытая система обнаружена§!"
 wg_great_ming_poi:0 "Загадочный скрытник"
 wg_great_ming_poi_desc:0 "Загадочный скрытник найден — пора наведаться."
 wg_great_ming.3.name:0 "Аборигены…… в системе?"
 wg_great_ming.3.desc:0 "По координатам мы пришли в систему — и были потрясены увиденным.\n\nИсполинские деревянные корабли во множестве, ни следа§H FTL-двигателей§! но оружие их выглядит не слабее чьего бы то ни было. Мы также засекли 2 обитаемых планеты — видимо, хозяек этих диковинных кораблей.\nОбычно цивилизации без§H FTL§! мы считаем аборигенами — но увиденное превзошло все рамки.\n\nЭтот§Y «абориген»§! заметил нас и шлёт вызов."
 wg_great_ming.3.a:0 "Принять связь"
 wg_great_ming.4.title:0 "Чжу Ишань"
 wg_great_ming.4.desc:0 "Безумцы! Осмелились ступить на священную землю Мин?! Назваться!"
 wg_great_ming.4.a:0 "Мы —[From.owner.GetName] зла не желаем"
 wg_great_ming.5.desc:0 "[From.GetName]? Что за нелепое имя.\nНо скажи нам: как вы нашли Мин? Без утайки!"
 wg_great_ming.5.a:0 "Нашли деревянный корабль — по нему и вышли сюда"
 wg_great_ming.6.desc:0 "Корабль? Это беглые подлые рабыни! Почему моя карательная дружба не замела следы?! Нерадивых ждёт кара!\n\nВы нашли прореху Мин — за то заслуга; ныне двухтысячелетие державности Мин, посему мы даруем вам пощаду от смерти.\n\nНо раз мы раскрыты, придётся возвестить всей галактике о Мин. Ступайте."
 wg_great_ming.6.a:0 "Эм…… спасибо"
 wg_great_ming.7.desc:0 "Державы галактики! Мы — корабли-девы империи Мин. Ваши скучные политические забавы нам неинтересны.\nНесите дань в срок и не задевайте державность Мин — и гнев наш не затронет ваши земли. Немало цените решимости Мин; запомните это!! Да будет ведомо всем!!"
 wg_great_ming.7.a:0 "……."
 wg_great_ming.8.name:0 "Вызов от Мин"
 wg_great_ming.8.desc:0 "Нам пришёл вызов от§H кораблей-дев империи Мин§! похоже, кое-что в наших делах их не радует……"
 wg_great_ming.8.a:0 "Эм…… принимаем"
 wg_great_ming.9.desc:0 "……"
 wg_great_ming.9.a:0 "Эм…… здравствуйте?"
 wg_great_ming.10.desc:0 "Почему нет дани? Объяснитесь."
 wg_great_ming.10.a:0 "Да…… дань??"
 wg_great_ming.11.desc:0 "…………\nВы здесь впервые, этикета не знаете — пока прощаем.\nНо Мин — верховная держава, и дань нам — ваш долг."
 wg_great_ming.11.a:0 "А??"
 wg_great_ming.12.desc:0 "Не чаял, что вы настолько тупы, что даже этикета дани не разумеете. Нечего тратить слова! Позвать Управление морской торговли — пусть растолкует."
 wg_great_ming.12.a:0 "????"
 wg_great_ming.13.title:0 "Управление морской торговли — У Инжуй"
 wg_great_ming.13.desc:0 "Здравствуйте, я У Инжуй из§H Звёздного управления морской торговли§! прибыла обсудить дань."
 wg_great_ming.13.a:0 "Наконец-то человек нормально говорит……"
 wg_great_ming.13.a.response:0 "Чтобы говорить с такими отсталыми, как вы, порой приходится снижать планку."
 wg_great_ming.13.b:0 "Что за дань?"
 wg_great_ming.13.b.response:0 "Мин — верховная держава; подносить дань нам — освящённая веками традиция и знак уважения, а также ваш долг.\nДань являет нашу взаимную приязнь и уважение, а вы, быть может, стяжаете наше благоволение."
 wg_great_ming.13.c:0 "Что конкретно нужно делать?"
 wg_great_ming.14.desc:0 "Славно, наконец поняли — умственные способности в норме.\n\nВладения Мин необъятны и изобильны; ваш хлам чаще всего не нужен, но§H заморские ремесленные вещицы и яства§! ещё можно оценить. Посему с вас положено§G 10%§! £consumer_goods£§Yпотребительских товаров§! и £food£§Yеды§!\n\nОткажетесь — Мин покажет вам§R свой гнев! §!\n\nНе заритесь на худой конец."
 wg_great_ming.14.a:0 "Мы согласны носить дань"
 wg_great_ming.14.a.response:0 "Славно! Сын Неба будет доволен. О деталях известим позже."
 wg_great_ming.14.b:0 "§RАборигены, не способные выйти из своей системы, смеют так говорить? §!"
 wg_great_ming.14.b.tooltip:0 "§RМы отвергаем требование дани — Мин может разгневаться§!"
 wg_great_ming.14.b.response:0 "Аборигены? Хо-хо, вы ещё узрите божественное воинство Мин"
 wg_great_ming.15.desc:0 "Здравствуйте: на вашей столице мы открыли§H управление морской торговли§! через него с нами и связывайтесь; первый взнос дани готов к приёму."
 wg_great_ming.15.a:0 "Как вы построили представительство на нашей столице прямо из воздуха?"
 wg_great_ming.15.a.response:0 "О делах верховной державы не спрашивай."
 wg_great_ming.15.b:0 "Как долго платить дань?"
 wg_great_ming.15.b.response:0 "Как долго? Что за глупый вопрос: быть данником Мин — великая честь; пока вы существуете — платите."
 wg_great_ming.15.c:0 "А можно отменить дань?"
 wg_great_ming.15.c.response:0 "Я прощу вашу глупость и невежество, но заклинаю: не смейте даже думать.\nА сделаете — отвечаю: познаете§R гнев Мин! §!"
 wg_great_ming.15.d:0 "Хорошо"
 wg_great_ming_vassal_country:0 "Дань Мин"
 wg_great_ming_vassal_country_desc:0 "Нам приходится носить дань Мин."
 wg_great_ming_vassal_country_2:0 "Добавочная кара"
 wg_great_ming_vassal_country_2_desc:0 "Мы пробовали ослушаться Мин — и, потерпев крах, приняли добавочную кару."
 wg_great_ming.16.desc:0 "Что угодно?"
 wg_great_ming.16.a:0 "Мы хотим принести добавочную дань"
 wg_great_ming.16.a.tooltip:0 "§HМин будет довольна; в будущем, быть может, пожалует§!"
 wg_great_ming.16.a.response:0 "Славно, дар принят."
 wg_great_ming.16.b:0 "Мы требуем§Y прекратить дань§!"
 wg_great_ming.16.b.tooltip:0 "§YМы требуем прекратить дань — Мин изрядно разгневается и ударит§!"
 wg_great_ming.16.c:0 "§RПроклятые нахлебники, вашим весёлым дням конец!! §!"
 wg_great_ming.16.c.tooltip:0 "§RМы объявляем Мин войну§!"
 wg_great_ming.16.d:0 "Ничего"
 wg_great_ming.16.d.response:0 "Впредь не являйтесь без дела."
 wg_great_ming.17.desc:0 "Дерзость!! Как смеете вы так себя вести!!!\nНо мы великодушны: возьмите слова назад — и ничего не было."
 wg_great_ming.17.a:0 "Да: мы требуем§R прекратить дань§!"
 wg_great_ming.17.a.tooltip:0 "§RМин изрядно разгневается и ударит§!"
 wg_great_ming.17.a.response:0 "Невежественные варвары! Готовьтесь узреть божественное воинство Мин!"
 wg_great_ming.17.b:0 "Простите, мы ошиблись"
 wg_great_ming.17.b.tooltip:0 "§YМы терпим дальше, но расположение Мин чуть падает§!"
 wg_great_ming.17.b.response:0 "Чтоб больше такого не было!"
 wg_great_ming.18.desc:0 "Бесстыжий варвар? Повтори-ка сказанное!"
 wg_great_ming.18.a:0 "§RНахлебники! Жрите дерьмо! §!"
 wg_great_ming.18.a.tooltip:0 "§RМин начнёт с нами войну§!"
 wg_great_ming.18.a.response:0 "Дожили: столь бесстыжие наглецы!! Мин сотрёт вас подчистую!!!"
 wg_great_ming.18.b:0 "Простите, мы ошиблись"
 wg_great_ming.18.b.response:0 "Невежды и бесстыдники; чтоб больше такого не было!"
 wg_great_ming.20.desc:0 "Девять рубежей проломлены, прародина пала, престиж державы утрачен — недостоин(а) я предков……"
 wg_great_ming.20.a:0 "Финал закоснелого старца"
 wg_great_ming.21.name:0 "Мы отказали Мин"
 wg_great_ming.21.desc:0 "Мы отвергли наглое требование дани — и получили угрозы: мол, поплатимся.\n\nХотя наука Мин не вяжется со статусом досверхсветовой цивилизации, у них нет FTL-двигателей, и многие у нас считают это блефом."
 wg_great_ming.21.a:0 "Верно: аборигены — не угроза"
 wg_great_ming.21.b:0 "Может и так, но бдительность не помешает"
 wg_great_ming.22.name:0 "Вторжение Мин"
 wg_great_ming.22.desc:0 "К нам пришло несколько§R тревог вторжения! §! На наших планетах неведомо откуда возникли чудовищно сильные вражеские армии; орбитальные спутники ничего не засекли — войска вторглись неведомым способом; по облачению это части§Y кораблей-дев империи Мин§!"
 wg_great_ming.22.a:0 "Как они это сделали?!"
 wg_great_ming.24.name:0 "Утечка тайн"
 wg_great_ming.24.desc:0 "Наши миры пали под ударами Мин; мерзавки, взяв власть, вскрыли наши архивы и обнародовали массу§R государственных тайн и политических скандалов§!! Это грозит смутой……"
 wg_great_ming.24.a:0 "Что?! Секрет про фигурки на казённые деньги всплыл??"
 wg_great_ming_humiliate_country:0 "Утечка тайн"
 wg_great_ming_humiliate_country_2:0 "Тайны и слухи"
 wg_great_ming.25.desc:0 "Что, варвары, ещё упрямитесь? Сдавайтесь и несите дань в срок — и Мин всё простит."
 wg_great_ming.25.a:0 "Сдаёмся; согласны носить дань"
 wg_great_ming.25.a.response:0 "Славно: войска уйдут, о деталях дани известим позже."
 wg_great_ming.25.b:0 "§RМы не покоримся§!"
 wg_great_ming.25.b.response:0 "Значит, упорствуете — увеличим дозу.\nК слову: надумаете сдаться — милости просим в наше§H управление морской торговли§! Дань, разумеется, сполна.\n\n§RИщите§H управление§! в контактах или в системе Мин§!"
 wg_great_ming.26.name:0 "Мин отступает"
 wg_great_ming.26.desc:0 "Противостоять Мин нам не по силам — пришлось сдаться; армии Мин в тот же миг исчезли без следа; известно лишь имя —§RСтража в парчовых халатах§!"
 wg_great_ming.26.a:0 "Нам стыдно — но лишь пока."
 wg_great_ming.29.desc:0 "Невозможно: тысячелетиями§R Стража в парчовых халатах§! слыла непобедимой…… Вашу доблесть запишут в летопись; за прошлые непокорности — прощение, дань с вас более не спросится.\n\nНадумаете подносить дань или о другом — милости просим в§H управление морской торговли§!"
 wg_great_ming.29.a:0 "Хорошо"
 wg_great_ming.29.b:0 "Настанет день — и мы вас покорим"
 wg_great_ming.29.b.response:0 "Закоснелые варвары: всегда к вашим услугам."
 wg_great_ming.30.name:0 "Тайны и слухи"
 wg_great_ming.30.desc:0 "Мы отказались сдаться, и§R Стража§! слила ещё тайн — замешав кучу лживых слухов; увы, большинство примет их за правду……"
 wg_great_ming.30.a:0 "Я не строил(а) секретный склад фигурок!!"
 wg_great_ming.31.desc:0 "Что угодно?"
 wg_great_ming.31.a:0 "Мы хотим поднести дань"
 wg_great_ming.31.a.tooltip:0 "Мы поднесём§G 10%§! £consumer_goods£§Yпотребительских товаров§! и £food£§Yеды§! ради благоволения Мин"
 wg_great_ming.31.a.response:0 "О? Сын Неба будет доволен; о деталях известим позже."
 wg_great_ming.31.b:0 "Мы хотим сдаться"
 has_ground_combat_with_great_ming:0 "§YНа наших мирах идут сухопутные бои§!"
 wg_great_ming_surrender_cd:0 "§YСдаваться можно не раньше чем через £time£§R360 дней§! боёв§!"
 wg_great_ming.31.b.response:0 "Кто разумеет время — тот герой! Войска уйдут, дань примем."
 wg_great_ming.31.e:0 "Просто посмотреть, сдохли ли вы"
 wg_great_ming.31.e.response:0 "Бесстыжие варвары, убирайтесь."
 wg_great_ming_vassal_cd:0 "§YВойну Мин можно объявить лишь через £time£§R720 дней§! после становления данником§!"
 r_wg_great_ming_old_tree:0 "Старое кривое дерево"
 r_wg_great_ming_old_tree_desc:0 "Некогда принадлежало империи Мин; по неведомой причине крепость древа почти как у нейтронной звезды: даже листва его, собранная в материал, изрядно укрепит наши корабли."
 wg_great_ming_old_tree_modifider:0 "Сбор листвы и валежника"
 wg_great_ming.33.desc:0 "Глупые варвары: наш спецназ —§RСтража в парчовых халатах§! уже сошёл с небес; сдавайтесь, пока не поздно!"
 wg_great_ming.33.a:0 "Идите сюда"
 wg_great_ming.34.name:0 "Вторая волна"
 wg_great_ming.34.desc:0 "По донесениям, Мин забросила на наши миры вторую волну§R Стражи§! нас ждёт тяжкое испытание."
 wg_great_ming.34.a:0 "Откуда у них столько марсианских войск?"
 opinion_wg_second_great_ming_to_murderer:0 "Варвары, коих не простить"
 01_SECOND_MING_TO_MURDER_UNFRIENDLY_GREETING:0 "Казнить девять родов! Нет!! ДЕСЯТЬ!!!"
 02_SECOND_MING_TO_MURDER_UNFRIENDLY_GREETING:0 "Непростимые варвары! Повелеваю: немедля сделайте себе сэппуку!"
 03_SECOND_MING_TO_MURDER_UNFRIENDLY_GREETING:0 "Оттащить её на плаху!! Что, никто не решается?! Рубить, я сказала!!"
 04_SECOND_MING_TO_MURDER_UNFRIENDLY_GREETING:0 "Я порублю тебя на десять тысяч кусков!"
 05_SECOND_MING_TO_MURDER_UNFRIENDLY_GREETING:0 "§H(жуя утку по-пекински)§!\nМнм-мнм, кхм, вы, варвары! Мнм-мнм, не марайте мне взор! Мнм-мнм, до чего же вкусна утка, мнм-мнм."
 NAME_WG_SECOND_GREAT_MING_FLEET:0 "Непобедимая флотилия Южной Мин"
 NAME_second_great_ming_country:0 "Корабли-девы Южной Мин"
 NAME_second_great_ming_emperor:0 "Чжу Юньмо"
 civic_wsg_second_great_ming:0 "Империя Южная Мин"
 civic_wsg_second_great_ming_desc:0 "Новое государство, сколоченное недобитками павшей Мин; они поклялись порубать её погубителей на десять тысяч кусков."
 origin_wg_great_ming:0 "Империя Великая Мин"
 origin_wg_great_ming_desc:0 "Великая Мин с передовой наукой — но почему-то остановившаяся у моря звёзд."
 origin_wg_second_great_ming:0 "Империя Южная Мин"
 origin_wg_second_great_ming_desc:0 "Новое государство, сколоченное недобитками павшей Мин; они поклялись порубать её погубителей на десять тысяч кусков."
 wg_second_great_ming:0 "Империя Южная Мин"
 gov_second_great_ming:0 "Империя Южная Мин"
 gov_second_great_ming_desc:0 "Новое государство, сколоченное недобитками павшей Мин; они поклялись порубать её погубителей на десять тысяч кусков."
 NAME_ming_capital:0 "Новая Небесная сокровищница Мин"
 wg_great_ming.36.name:0 "Новая империя Мин"
 wg_great_ming.36.desc:0 "После гибели Мин беглые недобитки отстроили её заново на безлюдной планете; они зовут себя§Y кораблями-девами Южной Мин§! и прислали нам§R тёплый привет§!"
 wg_great_ming.36.a:0 "Послушаем, что скажут"
 wg_great_ming.37.desc:0 "Проклятые варвары: мы вас не забудем! Возродимся — и казним§H девять родов§! нет!!! §Rдесять!!!! §!"
 wg_great_ming.37.a:0 "Смеялся(ась) до упаду"
 wg_great_ming.37.b:0 "Вам бы зваться Малой Мин — больше к лицу"
 wg_great_ming.38.name:0 "Падение Мин"
 wg_great_ming.38.desc:0 "На днях дотоле непобедимая§H империя кораблей-дев Мин§! была сокрушена врагами; её император(ца)§R пал(а) смертью державы§! Бывшим данникам, выходит, больше не надо платить дань."
 wg_great_ming.38.a:0 "Занятно"
 great_ming_attack_army:0 "Лагерь Шэньцзи Мин"
 wg_great_ming.39.desc:0 "Варвары: это ваша кара. Божественное воинство Мин сошло с небес; продолжайте упорствовать — ждёт лишь смерть!!"
 wg_great_ming.39.a:0 "Или они, или мы"
 wg_great_ming.40.name:0 "Флот Мин!"
 wg_great_ming.40.desc:0 "Мы думали, мгновенная переброска войск — предел чудес Мин; ан нет — деревянные корабли без§H FTL-двигателей§! тоже перенесены в наши системы! У них есть иной способ массовой переброски!! Видимо, лишь§R захватив миры Мин§! или§R сдавшись§! можно прекратить вторжения."
 wg_great_ming.40.a:0 "Чёрт, как они это делают"
 wg_great_ming.43.name:0 "Мин отступает"
 wg_great_ming.43.desc:0 "Мы попробовали сбросить иго Мин — и проиграли.\nПридётся вновь носить дань и сверх того выплатить неустойку……"
 wg_great_ming.43.a:0 "Это наш позор — но не навеки"
 wg_great_ming_vassal_country_reward_1:0 "Дар Мин"
 wg_great_ming_vassal_country_reward_1_desc:0 "Мы удостоены милости Мин."
 wg_great_ming_vassal_country_reward_2:0 "$wg_great_ming_vassal_country_reward_1$"
 wg_great_ming_vassal_country_reward_2_desc:0 "$wg_great_ming_vassal_country_reward_1_desc$"
 wg_great_ming_vassal_country_reward_3:0 "$wg_great_ming_vassal_country_reward_1$"
 wg_great_ming_vassal_country_reward_3_desc:0 "$wg_great_ming_vassal_country_reward_1_desc$"
 wg_great_ming_vassal_country_reward_4:0 "$wg_great_ming_vassal_country_reward_1$"
 wg_great_ming_vassal_country_reward_4_desc:0 "$wg_great_ming_vassal_country_reward_1_desc$"
 wg_great_ming_vassal_country_reward_5:0 "$wg_great_ming_vassal_country_reward_1$"
 wg_great_ming_vassal_country_reward_5_desc:0 "$wg_great_ming_vassal_country_reward_1_desc$"
 wg_great_ming_vassal_country_reward_6:0 "$wg_great_ming_vassal_country_reward_1$"
 wg_great_ming_vassal_country_reward_6_desc:0 "$wg_great_ming_vassal_country_reward_1_desc$"
 wg_great_ming_vassal_country_reward_7:0 "$wg_great_ming_vassal_country_reward_1$"
