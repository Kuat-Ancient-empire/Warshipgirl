 uf_mobile_portal:0 "Призматическая платформа-ядро Объединения"
 uf_mobile_portal_DESC:0 "Развёрнутое ядро-призма Объединения. Оно уже подключено к сети врат: флот может прыгнуть сюда от любых врат.\n§HПосле перезагрузки сейва владение этим порталом обновится лишь через 1 день§!"
 uf_mobile_portal2:0 "Свернуть ядро-призму"
 uf_mobile_portal2_DESC:0 "Свернуть призматическую платформу Объединения в транспортное ядро. Можно заново развернуть в другой системе как платформу-призму."
 UF_HM_COMPUTER_8:0 "Компьютер ядра-призмы"
 uf_mobile_portal_temp:0 "Призматический портал Объединения"
 uf_mobile_portal_temp_DESC:0 "Обломки врат, высвободившиеся после уничтожения ядра-призмы; продержатся недолго\n§HПосле перезагрузки сейва владение этим порталом обновится лишь через 1 день§!"
 uf_portal_entity2:0 "$uf_portal_entity$"
 uf_portal_entity2_plural:0 "$uf_portal_entity$"
 uf_portal_entity2_cap:0 "$uf_portal_entity2$"
 tech_uf_mobile_portal:0 "Подвижные врата — проект «Призма»"
 tech_uf_mobile_portal_desc:0 "Опираясь на практическое применение сверхмерной сети, наши учёные набросали невероятное: врата целиком размещаются на одном корабле. Стоит развернуть корабль в портальную платформу — и он подключится ко всей построенной нами сети врат, позволяя быстро разворачивать сеть врат в любой системе."
 uf_mobile_portal_edicts:0 "Ядро-призма производится только на §Yорбитальном кольце Объединения§!, §Yгигантском доке§! и§Y сверхмерном доке Объединения§!"
 uf_ship.2.name:0 "Развёртывание призматической платформы Объединения"
 uf_ship.2.desc:0 "Наша призматическая платформа Объединения завершила развёртывание: §Rпризма Объединения развёрнута в [portal_system.GetName]§!"
 uf_ship.2.c:0 "Отлично!"
 uf_ship.7.name:0 "Призматическая платформа Объединения"
 uf_ship.7.desc:0 "Мы завершили теоретическую разработку подвижной призматической платформы Объединения — теперь можно ставить на поток эти подвижные врата! Исследователи проекта «Призма» просят донести до вас несколько правил, прочтите внимательно:\n\n1. Ядро-призму Объединения нужно развернуть в форму врат через §Hфлотский навык§!; обратное превращение в корабль — апгрейдом врат.\n2. Ядро-призму Объединения можно развернуть только в системе, где §Hнет враждебных флотов, врат или уже развёрнутой призматической платформы Объединения§!.\n3. Если платформа-призма §Hуничтожена§!, в её системе образуется временное поле прыжков, доступное только нам§H (на 1800 дней)§!"
 uf_ship.7.a:0 "Отлично — теперь нужно собрать флоты!"
 uf_ship.11.name:0 "Ядро-призма Объединения уничтожено"
 uf_ship.11.desc:0 "Ядро-призма Объединения уничтожено в бою в системе §H[from.GetName]§!! Скрытые в нём обломки врат высвободились, образовав временное поле прыжков§H (на 1800 дней)§! — через него и сеть врат мы можем быстро перебросить флоты в систему §H[from.GetName]§!"
 uf_ship.11.a:0 "Собрать войска — надо использовать шанс."
