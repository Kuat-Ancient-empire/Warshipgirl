 START_SCREEN_WSG:0 "После прорыва последнего рубежа обороны Глубинных их остатки полностью исчезли с нашей родной планеты. Расшифровав данные центрального компьютера Глубинных, мы узнали: уцелевшие силы их флота на гипердвигателях ушли в неведомые глубины космоса. Теперь гипертехнологии есть и у нас — пора покончить с врагами прошлого."
