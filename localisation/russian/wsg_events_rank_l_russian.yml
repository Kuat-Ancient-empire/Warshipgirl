l_russian:

 wsgranking.1013.name:0 "Разовый обмен"
 wsgranking.1013.desc:0 "Здесь — разовые товары на обмен."
 wsgranking.101.name:0 "Тонкий ручеёк энергии"
 wsgranking.101.desc:0 "Ваш доход §H$energy$§! превысил §Y200§! Очки подвига +2."
 wsgranking.101.a:0 "Хорошо"
 wsgranking.102.name:0 "Всплеск энергии"
 wsgranking.102.desc:0 "Ваш доход §H$energy$§! превысил §Y500§! Очки подвига +4."
 wsgranking.102.a:0 "Хорошо"
 wsgranking.103.name:0 "Река энергии"
 wsgranking.103.desc:0 "Ваш доход §H$energy$§! превысил §Y1000§! Очки подвига +4."
 wsgranking.103.a:0 "Хорошо"
 wsgranking.104.name:0 "Выше сферы Дайсона"
 wsgranking.104.desc:0 "Впечатляет! Ваш доход §H$energy$§! превысил 4000! Очки подвига +7."
 wsgranking.104.a:0 "Хорошо"
 wsgranking.111.name:0 "Пора копать!"
 wsgranking.111.desc:0 "Ваш доход §H$minerals$§! превысил §Y200§! Очки подвига +2."
 wsgranking.111.a:0 "Хорошо"
 wsgranking.112.name:0 "Растущая шахта!"
 wsgranking.112.desc:0 "Ваш доход §H$minerals$§! превысил §Y500§! Очки подвига +4."
 wsgranking.112.a:0 "Хорошо"
 wsgranking.113.name:0 "Горнодобывающий угар"
 wsgranking.113.desc:0 "Ваш доход §H$minerals$§! превысил §Y1000§! Очки подвига +4."
 wsgranking.113.a:0 "Хорошо"
 wsgranking.114.name:0 "Выше разжатывателя материи"
 wsgranking.114.desc:0 "Ваш доход §H$minerals$§! превысил 3000! Очки подвига +7."
 wsgranking.114.a:0 "Хорошо"
 wsgranking.121.name:0 "Первая пашня"
 wsgranking.121.desc:0 "Ваш доход §G$food$§! превысил §Y200§! Очки подвига +2."
 wsgranking.121.a:0 "Хорошо"
 wsgranking.122.name:0 "Сбалансированный рацион"
 wsgranking.122.desc:0 "Ваш доход §G$food$§! превысил §Y500§! Перепробовав всю галактическую снедь — даже вредную, — органическая империя растит себя всякой едой! Очки подвига +4."
 wsgranking.122.a:0 "Хорошо"
 wsgranking.123.name:0 "Полное питание"
 wsgranking.123.desc:0 "Ваш доход §G$food$§! превысил §Y1000§! Возможно, вы уже стёрли одну кирку и передумали жить. Очки подвига +4."
 wsgranking.123.a:0 "Хорошо"
 wsgranking.124.name:0 "Выше орхидеи Мирового Древа"
 wsgranking.124.desc:0 "Ваш доход §G$food$§! превысил 2000! Очки подвига +7."
 wsgranking.124.a:0 "Хорошо"
 wsgranking.131.name:0 "Не лучше железа"
 wsgranking.131.desc:0 "Ваш доход §H$alloys$§! превысил §Y100§! Сплавы космической эры, выходит, не лучше железа. Очки подвига +2."
 wsgranking.131.a:0 "Хорошо"
 wsgranking.132.name:0 "Твёрдый подход"
 wsgranking.132.desc:0 "Ваш доход §H$alloys$§! превысил §Y500§! Порой деньги не решают — приходится железные. Очки подвига +4."
 wsgranking.132.a:0 "Хорошо"
 wsgranking.133.name:0 "Общая плавка"
 wsgranking.133.desc:0 "Ваш доход §H$alloys$§! превысил §Y1000§! Очки подвига +5."
 wsgranking.133.a:0 "Хорошо"
 wsgranking.134.name:0 "Выше печей Нидавеллира"
 wsgranking.134.desc:0 "Ваш доход §H$alloys$§! превысил §Y2000§! Очки подвига +9."
 wsgranking.134.a:0 "Хорошо"
 wsgranking.211.name:0 "Барабаны войны"
 wsgranking.211.desc:0 "Ваша §Hбоевая мощь флота§! превысила §Y5K§! Очки подвига +2."
 wsgranking.211.a:0 "Хорошо"
 wsgranking.212.name:0 "Серьёзный размер"
 wsgranking.212.desc:0 "Ваша §Hбоевая мощь флота§! превысила §Y50K§! Кураторы считают, ваш флот уже борется с левиафаном — правда или нет, знаете лишь вы. Очки подвига +5."
 wsgranking.212.a:0 "Хорошо"
 wsgranking.213.name:0 "Массовое кораблестроение"
 wsgranking.213.desc:0 "Ваша §Hбоевая мощь флота§! превысила §Y500K§! Очки подвига +8."
 wsgranking.213.a:0 "Хорошо"
 wsgranking.214.name:0 "Имперский флот"
 wsgranking.214.desc:0 "Ваша §Hбоевая мощь флота§! превысила §Y5M§! Что бы ни случилось — не бойся, улыбнись: лучший способ убрать страх — встретить его лицом! Очки подвига +10."
 wsgranking.214.a:0 "Хорошо"
 wsgranking.221.name:0 "Первый эсминец"
 wsgranking.221.desc:0 "Вы построили первый эсминец! Очки подвига +2."
 wsgranking.221.a:0 "Хорошо"
 wsgranking.222.name:0 "Первый крейсер"
 wsgranking.222.desc:0 "Вы построили первый крейсер! Очки подвига +2."
 wsgranking.222.a:0 "Хорошо"
 wsgranking.223.name:0 "Первый линкор"
 wsgranking.223.desc:0 "Вы построили первый линкор! Очки подвига +4."
 wsgranking.223.a:0 "Хорошо"
 wsgranking.224.name:0 "Первый титан"
 wsgranking.224.desc:0 "Вы построили первый титан! Очки подвига +4."
 wsgranking.224.a:0 "Хорошо"
 wsgranking.225.name:0 "Колосс готов"
 wsgranking.225.desc:0 "Вы построили колосс, способный разрушить небеса и землю! Очки подвига +8."
 wsgranking.225.a:0 "Хорошо"
 wsgranking.226.name:0 "Дредноут готов"
 wsgranking.226.desc:0 "Вы построили первый дредноут! Очки подвига +4. Это событие видно потому, что у вас стоит NSC."
 wsgranking.226.a:0 "Ага"
 wsgranking.227.name:0 "Дредноут корабельных дев готов!"
 wsgranking.227.desc:0 "Совместный проект с Neoforce достроен: впечатляющий супер-корабль с урбанской сверх-пушкой, сносящей звёздную крепость с одного залпа. Очки подвига +12."
 wsgranking.228.name:0 "Флагман готов!"
 wsgranking.228.desc:0 "Вы построили первый флагман! Очки подвига +§Y10§!. Это событие видно потому, что у вас стоит NSC."
 wsgranking.231.name:0 "25 линкоров"
 wsgranking.231.desc:0 "Теперь у вас §Y25§! линкоров! Очки подвига +§Y2§!"
 wsgranking.231.a:0 "Хорошо"
 wsgranking.232.name:0 "50 линкоров"
 wsgranking.232.desc:0 "Теперь у вас §Y50§! линкоров! Впечатляет. Очки подвига +§Y4§!"
 wsgranking.232.a:0 "Хорошо"
 wsgranking.233.name:0 "125 линкоров"
 wsgranking.233.desc:0 "Теперь у вас §Y125§! линкоров! Какой флот! Очки подвига +§Y8§!"
 wsgranking.233.a:0 "Хорошо"
 wsgranking.234.name:0 "250 линкоров"
 wsgranking.234.desc:0 "У вас уже §Y250§! линкоров — целый небесный занавес! Хватит на 10 флотов! Очки подвига +§Y12§!"
 wsgranking.234.a:0 "Хорошо"
 wsgranking.301.name:0 "Яйцо империи"
 wsgranking.301.desc:0 "Ваш размер империи достиг §Y75§!. Маленькая звёздная держава — обычно не проблема; но чем больше империя, тем труднее управлять. Очки подвига +§Y1§!"
 wsgranking.301.a:0 "Хорошо"
 wsgranking.302.name:0 "Серьёзный размер"
 wsgranking.302.desc:0 "Ваш размер империи достиг §Y200§!. У вас уже, вероятно, несколько колоний. Очки подвига +§Y2§!"
 wsgranking.302.a:0 "Хорошо"
 wsgranking.303.name:0 "Имперское завоевание"
 wsgranking.303.desc:0 "Ваш размер империи достиг §Y500§!,— вероятно, уже несколько секторов; назначьте губернаторов! Очки подвига +§Y3§!"
 wsgranking.303.a:0 "Хорошо"
 wsgranking.304.name:0 "Звёздные амбиции"
 wsgranking.304.desc:0 "Ваш размер империи достиг §Y1500§!,— кажется, начинаются проблемы управления! Поднажмите! Очки подвига +§Y5§!"
 wsgranking.304.a:0 "Хорошо"
 wsgranking.311.name:0 "Первая мегаструктура"
 wsgranking.311.desc:0 "Вы построили свою первую мегаструктуру! Какая бы ни была — зрелище точно. Очки подвига +2."
 wsgranking.311.a:0 "Хорошо"
 wsgranking.312.name:0 "Три мегаструктуры"
 wsgranking.312.desc:0 "Вы построили 3 мегаструктуры! Очки подвига +4."
 wsgranking.312.a:0 "Хорошо"
 wsgranking.313.name:0 "Шесть мегаструктур"
 wsgranking.313.desc:0 "Вы построили 6 мегаструктур! Вот это размах! Очки подвига +6."
 wsgranking.313.a:0 "Хорошо"
 wsgranking.314.name:0 "Пятнадцать мегаструктур"
 wsgranking.314.desc:0 "Вы построили 15 мегаструктур! Вы — один из немногих великих строителей вселенной! Очки подвига +10."
 wsgranking.314.a:0 "Хорошо"
 wsgranking.3201.name:0 "Заложен стратегический командный центр"
 wsgranking.3201.desc:0 "Мы заметили: стапель стратегического командного центра готов. Очки подвига +4."
 wsgranking.3201.a:0 "Хорошо"
 wsgranking.3202.name:0 "Стратегический командный центр готов"
 wsgranking.3202.desc:0 "Стратегический командный центр — многофункциональный военно-учебный комплекс — готов! Очки подвига +8."
 wsgranking.3202.a:0 "Хорошо"
 wsgranking.3203.name:0 "Заложена объединённая академия наук"
 wsgranking.3203.desc:0 "Мы заметили: стапель объединённой академии наук готов. Очки подвига +4."
 wsgranking.3203.a:0 "Хорошо"
 wsgranking.3204.name:0 "Объединённая академия наук готова"
 wsgranking.3204.desc:0 "Академия готова! Рекомендуем сделать её высшим учебным заведением страны. Очки подвига +8."
 wsgranking.3204.a:0 "Хорошо"
 wsgranking.3205.name:0 "Раскрытые глаза на звёздную реку"
 wsgranking.3205.desc:0 "Мы заметили: массив «Дозор» обретает контуры. Очки подвига +4."
 wsgranking.3205.a:0 "Хорошо"
 wsgranking.3206.name:0 "Око всезнания"
 wsgranking.3206.desc:0 "Массив «Дозор» готов: движения флотов в любом углу галактики — как на ладони; туманности, увы, не просвечивает. Очки подвига +8."
 wsgranking.3206.a:0 "Хорошо"
 wsgranking.3207.name:0 "Заложен мир-кольцо"
 wsgranking.3207.desc:0 "Строительство кольца началось — великая мечта о доме для десятков миллиардов. Очки подвига +4."
 wsgranking.3207.a:0 "Хорошо"
 wsgranking.3208.name:0 "Мир-кольцо готов"
 wsgranking.3208.desc:0 "Мир-кольцо достроен! Очки подвига +12."
 wsgranking.3208.a:0 "Хорошо"
 wsgranking.3209.name:0 "Отрезок кольца восстановлен"
 wsgranking.3209.desc:0 "Тысячелетиями холодные руины древнего кольца плыли в системе. Вы вернули один отрезок к жизни. Очки подвига +§Y4§!"
 wsgranking.3209.a:0 "Хорошо"
 wsgranking.3210.name:0 "Каркас сферы Дайсона"
 wsgranking.3210.desc:0 "Вы наконец сделали первый шаг самой безумной фантазии. Очки подвига +§Y3§!"
 wsgranking.3211.name:0 "Сфера Дайсона построена"
 wsgranking.3211.desc:0 "Как выяснилось, даже величье звёздного моря не заставит нас почувствовать себя малыми. Вы поймали звезду! Очки подвига +§Y12§!"
 wsgranking.3212.name:0 "Физика или магия?"
 wsgranking.3212.desc:0 "Разжиратель материи — проект, от которого Хокинг вскочил бы из гроба; вы сделали первый шаг! Очки подвига +§Y3§!"
 wsgranking.3213.name:0 "Разжиратель материи построен"
 wsgranking.3213.desc:0 "Сколько бы эпох ни прошло — минералы приходилось искать. Теперь они из ничего! Очки подвига +§Y12§!"
 wsgranking.3214.name:0 "Проект престижа"
 wsgranking.3214.desc:0 "Многие попрекнут вас мотовством этого проекта — но это ведь и есть совокупная мощь государства, верно? Очки подвига +§Y3§!"
 wsgranking.3215.name:0 "Межзвёздная ассамблея готова"
 wsgranking.3215.desc:0 "«Друзья, окажите мне честь»\nОчки подвига +§Y3§!"
 wsgranking.3216.name:0 "Хранитель наследия"
 wsgranking.3216.desc:0 "«История — зеркало: по ней видно взлёты и падения»\nОчки подвига +§Y3§!"
 wsgranking.3217.name:0 "Мега-художественный комплекс готов"
 wsgranking.3217.desc:0 "Не волнуйтесь: экспонаты и ночью сами не расхаживают. Очки подвига +§Y12§!"
 wsgranking.3218.name:0 "Пельменный конвейер"
 wsgranking.3218.desc:0 "«180 лимита против 120 с титаном в лоб — как проиграть, скажи мне? В лоб — уже победа, ну как можно проиграть?» — один известный военный теоретик\nОчки подвига +§Y3§!"
 wsgranking.3219.name:0 "Мега-доки готовы"
 wsgranking.3219.desc:0 "«wo men you shi hen da» — одна всенародная жена. Очки подвига +§Y12§!"
 wsgranking.3220.name:0 "Звёздные врата готовы"
 wsgranking.3220.desc:0 "Отныне расстояния для вас — не проблема. Очки подвига +§Y3§!"
 wsgranking.331.name:0 "Молодая держава"
 wsgranking.331.desc:0 "«Теряя людей — теряешь и землю; теряя землю — людей сохранишь»\nНаселение вашей империи достигло §Y50§! Очки подвига +1."
 wsgranking.331.a:0 "Хорошо"
 wsgranking.332.name:0 "Региональная держава"
 wsgranking.332.desc:0 "«Сила государства определяется лишь его отношением к народу»\nНаселение вашей империи достигло §Y200§! Очки подвига +§Y3§!"
 wsgranking.332.a:0 "Хорошо"
 wsgranking.333.name:0 "Народная держава"
 wsgranking.333.desc:0 "Население вашей империи достигло §Y500§! Пора всерьёз подумать об управлении людьми. Очки подвига +§Y3§!"
 wsgranking.333.a:0 "Хорошо"
 wsgranking.334.name:0 "Людское море (физическое)!"
 wsgranking.334.desc:0 "«Если в этой вселенной есть тип, похожий на баклажан, — он вот-вот к вам пожалует»\nНаселение вашей империи достигло §Y1000§! Очки подвига +§Y5§!"
 wsgranking.334.a:0 "Хорошо"
 wsgranking.335.name:0 "Быстро растущий город"
 wsgranking.335.desc:0 "Народ — основа развития! На одной из колоний уже §Y30§! человек! Очки подвига +§Y2§!"
 wsgranking.335.a:0 "Хорошо"
 wsgranking.336.name:0 "Супер-мегаполис"
 wsgranking.336.desc:0 "«Рост города и нужды народа — вечные копьё и щит»\nНа одной из колоний уже §Y50§! жителей! Очки подвига +§Y3§!"
 wsgranking.336.a:0 "Хорошо"
 wsgranking.337.name:0 "Небесный город"
 wsgranking.337.desc:0 "«Ба́рус!.. А, ничего не случилось»\nНа одной из колоний уже §Y80§! жителей! Очки подвига +§Y4§!"
 wsgranking.337.a:0 "Хорошо"
 wsgranking.338.name:0 "Город-идеал"
 wsgranking.338.desc:0 "«Чёрт, как они тут все помещаются?!»\nУ вас колония с населением §Y150§! Очки подвига +§Y7§!"
 wsgranking.338.a:0 "Хорошо"
 wsgranking.341.name:0 "Завоеватель"
 wsgranking.341.desc:0 "У вас есть один вассал! Очки подвига +§Y2§!"
 wsgranking.341.a:0 "Хорошо"
 wsgranking.342.name:0 "Гегемон"
 wsgranking.342.desc:0 "У вас уже 2 вассала! Очки подвига +§Y2§!"
 wsgranking.342.a:0 "Хорошо"
 wsgranking.343.name:0 "Полная занятость"
 wsgranking.343.desc:0 "«Если в стране никто не мучается поиском работы — это, наверное, утопия из грёз»\nУ вас колония на 50 человек без свободных мест — занятость использована целиком. Очки подвига +2."
 wsgranking.343.a:0 "Хорошо"
 wsgranking.344.name:0 "Стабильность превыше всего"
 wsgranking.344.desc:0 "«Государство развивается лишь тогда, когда народ живёт в мире»\nУ вас планета со 100 стабильности и 0 преступности! Очки подвига +2."
 wsgranking.344.a:0 "Хорошо"
 wsgranking.345.name:0 "Полная застройка"
 wsgranking.345.desc:0 "У вас колония со всеми 16 зданиями! Инфраструктура планеты, кажется, идеальна. Очки подвига +4."
 wsgranking.345.a:0 "Хорошо"
 wsgranking.346.name:0 "Мания стройки"
 wsgranking.346.desc:0 "У вас колония на пределе районов! Природный потенциал планеты исчерпан. Очки подвига +4."
 wsgranking.346.a:0 "Хорошо"
 wsgranking.347.name:0 "Первая война"
 wsgranking.347.desc:0 "«Власть — из дула винтовки!» Очки подвига +2."
 wsgranking.347.a:0 "Хорошо"
 wsgranking.348.name:0 "Технология тёмной материи"
 wsgranking.348.desc:0 "Гордость старых ворчунов — технология тёмной материи — теперь ваша! (Надежда, у вас не стоит какой-нибудь сияющий мод.) Очки подвига +1."
 wsgranking.348.a:0 "Хорошо"
 wsgranking.400.name:0 "Дредноут восстановлен"
 wsgranking.400.desc:0 "Подбитый автоматический дредноут восстановлен! Впрочем, чуда из этого не вышло. Очки подвига +2."
 wsgranking.400.a:0 "Хорошо"
 wsgranking.401.name:0 "Дредноут сбит"
 wsgranking.401.desc:0 "Автоматический дредноут сбит! Несокрушимая машина войны наконец склонила голову. Очки подвига +2."
 wsgranking.401.a:0 "Хорошо"
 wsgranking.402.name:0 "Кошмар измерений сбит"
 wsgranking.402.desc:0 "Застрявший между измерениями кошмар измерений сбит! Надеемся, идей на его счёт у вас странных нет. Очки подвига +4."
 wsgranking.402.a:0 "Хорошо"
 wsgranking.403.name:0 "План «Пожирателя звёзд» завершён"
 wsgranking.403.desc:0 "Поглощённое звёздное вещество возвращено! Несколько холодных миров стали обитаемыми. Очки подвига +4."
 wsgranking.403.a:0 "Хорошо"
 wsgranking.404.name:0 "Эфирный дракон повержен"
 wsgranking.404.desc:0 "Голова эфирного дракона — потрясающе большая! Но как он стрелял свет-мечом изо рта, мы уже не узнаем. Очки подвига +4."
 wsgranking.404.a:0 "Хорошо"
 wsgranking.405.name:0 "Тайная крепость взломана"
 wsgranking.405.desc:0 "Тайная крепость, как выяснилось, — первоапрельская шутка. Пусть подарок строителей вам пригодится. Очки подвига +4."
 wsgranking.405.a:0 "Хорошо"
 wsgranking.406.name:0 "Выводок пустоты разгадан"
 wsgranking.406.desc:0 "Омерзительная тварь, вылупившаяся из планеты, убита! Очки подвига +4."
 wsgranking.406.a:0 "Хорошо"
 wsgranking.407.name:0 "Тайный танкер расшифрован"
 wsgranking.407.desc:0 "Расправившись с таинственными псионическими сущностями, вы получили эликсир молодости из тайного танкера! Мне тоже налейте. Очки подвига +4."
 wsgranking.407.a:0 "Хорошо"
 wsgranking.408.name:0 "Мусорщики разобраны"
 wsgranking.408.desc:0 "Разобрав мусорщиков до винтика, вы раскрыли секрет нано-ремонтной системы. Очки подвига +4."
 wsgranking.408.a:0 "Хорошо"
