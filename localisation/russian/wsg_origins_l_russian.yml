l_russian:

 origin_sh_cm:0 "Флот Аннигиляции"
 origin_sh_cm_desc:0 "За долгие скитания флот Глубинных не раз сталкивался с чужеродными угрозами и едва не погиб. Глубинные поняли: право на жизнь им даст лишь полный распад всех еретиков, способных угрожать флоту."
 origin_tooltip_sh_cm_effects:0 "§RОтношения инопланетных империй опустятся до нуля§!\n\n§RНедоступно вознесение: «Вскрывшие лёд»§!\n§HДоступна тотальная война: «Молчание»§!\nПри чистке органического £pop£ населения даёт £sr_pantsu£ §Yтрусики§!"
 origin_wsg_ice_breaking:0 "Лёд тронулся"
 origin_wsg_ice_breaking_desc:0 "Не всех глубинных корабельных дев изгнали из родного Порта: часть из них под нашим влиянием осталась и влилась в наше общество."
 origin_tooltip_wsg_ice_breaking_effects:0 "В начале игры: дополнительные 600 £pop£§Yглубинных корабельных дев§!\nЕщё три готовых базовых района\n§Yорудия Глубинных MK§! и §Yрадиоопределитель Глубинных§!\nЧасть технологий, обогащённых §Yтехнологией Глубинных§!"
 origin_wsg_diplomacy:0 "Дипломатки-сестрёнки"
 origin_wsg_diplomacy_desc:0 "Мы родом из войны, но прекрасно понимаем ценность дипломатии: именно постоянное сотрудничество и обмен довели нас до нынешних высот. Наши дипломаты готовы к вызовам звёзд раньше всех прочих ведомств."
 origin_tooltip_wsg_diplomacy_effects:0 "Взаимное отношение с большинством держав: §G+20§!"
 origin_sh_juggernaut:0 "Страж"
 origin_sh_juggernaut_desc:0 "В долгих бесцельных поисках дома флот Глубинных счастливо наткнулся на этот древний автоматизированный корабль класса «Владыка». Он защищал Глубинных от угроз и привёл флот к новому дому. Но даже могучий страж не вечен: устройство самоликвидации на борту активировали сотни лет назад, и до конца отсчёта осталось чуть больше десятилетия. Снять его нельзя — оно вросло в корабль."
 origin_tooltip_sh_juggernaut_effects:0 "В начале игры — корабль класса §Y«Владыка»§!\nМогучий страж самоликвидируется через §R15–20§! лет\nПосле самоликвидации стража — бонус"
 origin_sh_invaded:0 "Гости стали хозяевами"
 origin_sh_invaded_desc:0 "Прежними хозяевами этой планеты была досветовая цивилизация: флот Глубинных вторгся и занял её.\nТеперь Глубинные поднимутся заново на наследии былых владельцев."
 origin_tooltip_sh_invaded_effects:0 "В начале игры: 300 £sr_pantsu£ §Yтрусиков§!\nМодификатор планеты §YИнфраструктура былой цивилизации§!\nАборигенное жилое здание\nДополнительный энергорайон"
 sh_invaded_origin:0 "Инфраструктура былой цивилизации"
 sh_invaded_origin_desc:0 "Аборигенов этой планеты Глубинные вычистили подчистую, а уцелевшую инфраструктуру взяли под контроль. Она поможет нам строить новое."
 building_urban_dwellings_sh:0 "Городское жильё"
 building_urban_dwellings_sh_desc:0 "Компактное жильё досветовой цивилизации: не слишком удобно, но жить можно."
 origin_wg_fallen_empire:0 "Странницы галактики"
 origin_wg_fallen_empire_desc:0 "Падшая империя корабельных дев провела большую часть жизни в перелётах между галактиками — вечно бегущей, выменивая бегство на мгновение покоя."
 origin_wg_fe_effect:0 "Падшая мама не сделает вам зла — она по-настоящему заботливая мать. Если только вы не поставили какой-нибудь мод, от которого все светятся."
 origin_wg_fe_child:0 "Нежная мать"
 origin_wg_fe_child_desc:0 "Если в холодной пустоте и есть что-то тёплое — это Грёза Пепла.\nНашей цивилизации удалось вырваться из оков гравитации и выйти в бесконечную неизвестность лишь благодаря бескорыстной помощи Падшей мамы."
 origin_tooltip_wg_fe_child_effects:0 "В начале игры установлена связь с падшей империей корабельных дев\nОткрыты особые события падшей империи\n§YФлоту Глубинных§! недоступно вознесение §R«Молчание»§!"
 origin_shielded_sh:0 "Из-под скорлупы"
 origin_shielded_sh_desc:0 "Цивилизация, некогда запертая внутри щита на планете, — теперь она прорвала оковы и обрела свободу."
 origin_waterb:0 "Тут водится дракон"
 origin_waterb_desc:0 "Ещё когда наша цивилизация лишь училась смотреть на звёзды, мы заметили гигантского дракона, кружащего над нашей планетой. Иногда он проливал потопы, иногда улетал по делам — но его замыслов не знал никто. И вот сегодня мы наконец ступили в космос. Пора как следует поговорить с тем драконом."
 origin_tooltip_wg_waterb_effects:0 "§RНе используйте это происхождение более чем одному игроку в мультиплеере — вылезут баги! §!\n\nВ стартовой системе §Hбудет дракон§!: порой он шалит, но как верный страж будет беречь ваш дом."
 START_SCREEN_origin_water_b:0 "Ещё когда наша цивилизация лишь училась смотреть на звёзды, мы заметили гигантского дракона, кружащего над нашей планетой. Иногда он проливал потопы, иногда улетал по делам — но его замыслов не знал никто. И вот сегодня мы наконец ступили в космос. Пора как следует поговорить с тем драконом."
 origin_sh_chaser:0 "Звезда, гонящаяся за тенью бездны"
 origin_sh_chaser_desc:0 "Распри, лишения, бесконечная война — кровавая слезами история флота Глубинных. Но в конце этого пути легендарный лидер объединил всех Глубинных и повёл их в новое будущее.\nВот только личность её уж слишком нестандартна, и в обществе Глубинных не иссякает подток недоверия."
 origin_tooltip_sh_chaser_effects:0 "- §RПреследовательница§! станет лидером: существо с загадочным прошлым и бессчётными лицами, хранящее немало опасных тайн."
 START_SCREEN_origin_sh_chaser:0 "Нашей цивилизации никак не вырваться из спирали войны — лишь медленно ползти по грязной дороге, и раз за разом наши усилия по объединению разбиваются о распри.\n\nНо однажды — под серым небом, в молчащем море, когда само наше существование повисло на волоске — явился легендарный лидер. [owner.Ruler.GetTitle]§R Преследовательница§! приложила неимоверные усилия, собрала огромное воинство и в итоге объединила всех Глубинных.\n\nТеперь, завершив универсальную гиперпространственную технологию, мы наконец можем искать наше будущее среди звёзд."
 origin_wg_great_ming_subject:0 "Непокоряемая страна"
 origin_wg_great_ming_subject_desc:0 "Когда мы ещё не вышли к звёздам, к нашему дому явился странный флот деревянных кораблей из империи, именующей себя Великим Мин.\nНасмотревшись на диковины и технологии, подобные божественным, мы вступили в данническую систему Великого Мин.\nС помощью Великого Мин мы наконец достигли звёзд. А восточная таинственная королева приподняла перед нами край своего венчального покрова."
 origin_tooltip_wg_great_ming_subject_effects:0 "- В начале игры Великоминская столица появится рядом со столицей.\n- Мы станем членом даннической системы Великого Мин.\n- Великий Мин будет обменивать очки милости на образцы из вашего Музейного небесного узла; за очки милости можно просить у Великого Мин разной помощи."
 START_SCREEN_origin_wg_great_ming_subject:0 "Когда мы ещё не вышли к звёздам, к нашему дому явился странный флот деревянных кораблей из империи, именующей себя Великим Мин.\nНасмотревшись на диковины и технологии, подобные божественным, мы вступили в данническую систему Великого Мин.\nС помощью Великого Мин мы наконец достигли звёзд. А восточная таинственная королева приподняла перед нами край своего венчального покрова."
 origin_sh_arkship:0 "Обетованная не-земля"
 origin_sh_arkship_desc:0 "На кое-как слепленных из обломков ковчегах мы скитались по звёздному морю — и наконец нашли пристанище. Правда, планета слишком мала: лишь гавань, где ковчеги могут чуть перевести дух."
 origin_tooltip_sh_arkship_effects:0 "В начале игры — дополнительный §Yковчег Глубинных§!"
 origin_tooltip_sh_arkship_negative_effects:0 "Размер родной планеты — всего §R8§!"
 wg_origin.2.desc_01:0 "Дети, как здорово, что вы очнулись от ужасной войны — и уже готовы выйти к звёздам.\nВпереди у вас бесчисленные опасности, но я верю: вы преодолеете всё.\n\nВо внутренние дела ваши мы вмешиваться не станем. Мы не ждём ничего в ответ — мы просто делаем то, что должны.\nНо если что — заходите ко мне поиграть в игры."
 wg_origin.2.desc_02:0 "Дети, вы уже освоились на новом доме… получи мы ваш сигнал о помощи хоть чуть позже — и последствия страшно представить…\n\nНо что было, то быльём поросло! Пора обнимать будущее: среди звёзд вас ждут бесчисленные тайны — для открытий и покорений. Впрочем, пока что вы ещё зелёные, кое-что придётся осознать самим.\n\nВо внутренние дела ваши мы вмешиваться не станем. Мы не ждём ничего в ответ — мы просто делаем то, что должны.\nНо если что — заходите ко мне поиграть в игры."
 wg_origin.2.a:0 "Вашу доброту мы запомним навсегда!"
 wg_origin.2.b:0 "Мы пойдём по вашим стопам!"
 wg_origin.4.desc:0 "Похоже, у вас не хватает еды — без улучшения в вашем мире скоро начнётся голод.\n\nКак правители, вы должны всегда следить за своим продовольственным балансом: народ нельзя оставлять голодным.\nНо на этот раз мы поможем: эта партия еды поможет вам пережить трудности."
 wg_origin.4.a:0 "Мы будем внимательны! Спасибо за помощь"
 wg_origin.7.desc:0 "У нас недавно образовалась партия лишних £sr_pantsu£ §Yтрусиков§! — эти фасоны вам должны отлично подойти."
 wg_origin.7.a:0 "Благодарю"
 wg_origin.8.desc:0 "Дети, известная игровая мегакорпорация «Стрелка» готовится выпустить шедевр — Helldivers 3.\nНам посчастливилось получить ранний доступ. Не хотите попробовать?"
 wg_origin.8.a:0 "Э-э… по описанию что-то не очень…"
 wg_origin.8.b:0 "Давайте попробуем!"
 wg_origin.9.name:0 "Гелидиверсионщики"
 wg_origin.9.desc:0 "Helldivers 3 и правда выдающаяся игра: после релиза она быстро стала одной из самых любимых у сухопутчиков.\nМало того — девы почерпнули из неё боевые приёмы, заметно подняв урон нашей армии.\nОднако солдаты переняли и лобовой стиль выполнения задач: в бою они всё чаще предпочитают просто снести объект, а не аккуратно выполнить приказ (а гантели почему-то смели с прилавков)."
 wg_origin.9.a:0 "За Супер-[From.Capital.GetName]!"
 wg_origin.10.name:0 "Адские водилы"
 wg_origin.10.desc:0 "Helldivers 3 и правда выдающаяся игра: после релиза она быстро стала одной из самых любимых у сухопутчиков.\nНаша пехота переняла из игры лихие перемещения; особенно популярно стало вращение на бегу — но штык на оружии при этом регулярно калечил своих, и манёвр быстро запретили приказом.\n\nКак бы то ни было, игра реально прокачала выживаемость армии: даже с тяжёлыми ранениями они теперь чаще благополучно уходят с поля боя."
 wg_origin.10.a:0 "Закрутилось!"
 wg_modifier_helldivers:0 "Гантельщики"
 wg_modifier_helldivers2:0 "Helldivers"
 wg_origin.12.desc:0 "Дети, мы заметили: ваша учёная, [wg_fe_programmer.GetName], — гений программирования.\nМожно ли на время отдать её нам главным программистом разработки игры? Потом мы её вернём."
 wg_origin.12.a:0 "Хорошо, [wg_fe_programmer.GetName] будет на вас работать"
 wg_origin.12.b:0 "[wg_fe_programmer.GetName] сейчас на важном посту — не может"
 wg_origin.13.desc:0 "Слава [wg_fe_programmer.GetName]! С её помощью мы спокойно дописали игру.\nКстати, [wg_fe_programmer.GetName] призналась, что ей самой очень понравилось это время и она почерпнула у нас немало идей — можно считать, что все в выигрыше."
 wg_origin.13.a:0 "Вот это да"
 wg_origin.14.desc:0 "Дети, в вашем секторе когда-то свирепствовала эпидемия: разразилась она из-за нерадивого руководителя, похвалявшегося §Y«никто не разбирается в эпидемиях лучше меня»§!, и его пассивной борьбы.\nНо нашими стараниями болезнь была уничтожена восемьдесят тысяч лет назад. На всякий случай советую вам сделать нашу вакцину."
 wg_origin.14.a:0 "А у этой вакцины есть побочные эффекты?"
 wg_origin.14.a.response:0 "Вакцина прошла проверку десятками тысяч лет и весьма надёжна.\nКстати, она богата всякими полезными для организма элементами — теоретически не только безвредна, но и способствует росту вида."
 wg_origin.14.b:0 "Ладно, колите"
 wg_origin.14.c:0 "Спасибо, конечно… но лучше не надо"
 wg_origin.15.name:0 "Качественная вакцина"
 wg_origin.15.desc:0 "Вакцина [wg_fallen_empire.GetName] оказалась весьма эффективной: наш иммунитет и физическая форма явно выросли."
 wg_origin.15.a:0 "Неплохо"
 wg_origin.16.name:0 "Вакцина премиум-класса"
 wg_origin.16.desc:0 "Вакцина [wg_fallen_empire.GetName] оказалась столь эффективной, что превзошла обещания: иммунитет и физическая форма выросли скачком."
 wg_origin.16.a:0 "Великолепно"
 wg_modifier_vaccines:0 "Зимне-бредовая вакцина"
 wg_modifier_vaccines2:0 "Зимне-бредовая вакцина"
 wg_origin.17.desc:0 "Дети, как известно, победа на киберспортивном поприще во славу державы — одна из высших жизненных целей каждой корабельной девы.\nМы недавно организовали турнир — §YСлепоКрафт 3§! — и полагаю, среди вас немало амбициозной молодёжи, желающей участвовать.\nРазрешите им на время покинуть вашу державу? Все расходы мы берём на себя."
 wg_origin.17.a.tooltip:0 "Один £pop£§Yжитель§! временно уедет на турнир"
 wg_origin.17.a:0 "Что ж, мы за"
 wg_origin.17.b:0 "Это и правда немного развращает юные умы — лучше нет."
 wg_origin.20.desc:0 "Здравствуйте, зрители и игроки! Официально открываю Двенадцатый галактический киберспортивный турнир §YСлепоКрафт 3§!\nСегодня у нас в гостях знаменитый комментатор СлепоКрафта — §YСюйдун-мару§! Давайте поприветствуем его бурными аплодисментами!"
 wg_origin.20.a:0 "Сюйдун…-мару?"
 wg_origin.20.b:0 "«Гони O-Сюйдуна в гроб — таракан получит +2 к атаке; гони O-Сюйдуна в гроб — белый шар пойдёт в чардж!»"
 wg_origin.21.desc:0 "§RЗдравствуйте, с вами Грёза Пепла и галактический турнир по СлепоКрафту 3, я профессиональный комментатор Сюйдун-мару. §!\n§BВедущая: Здравствуйте! Кажется, и в этом году заявилось немало тяжеловесов — Ринаун, Бисмарк, Новый Орлеан — довольно известные игроки. Какова будет их игра? §!\n§RТьфу, Ринаун, Бисмарк — эти уж точно слабейшие§!\n§BА есть ещё Новый Орлеан§!\n§RНовый Орлеан — точно курица, прям чикен-бургер. Я вам говорю! Кто сейчас реально злы — это Нагато, Саратога, Невада, вот эти — звери, я вам говорю; Принц Ойген, Пенсакола, Солт-Лейк-Сити — разве не сильнейшие?! §!\n§BТоже верно§!\n§RЧемпион будет из этих. Точно. §!\n§BПосчитаем-ка: Пенсакола-«хрустик», Саратога, Нагато, Невада и Солт-Лейк-Сити, верно? §!\n§RНет-нет… ещё Принц Ойген! §!\n§BЗапомните, зрители: профессиональный комментатор Сюйдун-мару назвал шестерых. А если чемпионом станет кто-то другой? §!\n§RЯ же — ходячий сглаз! §!"
 wg_origin.21.a:0 "Раз комментатор сказал — срочно проверь, нет ли среди этих шестерых наших!"
 wg_origin.18.desc:0 "§BВедущая: зрители просят выбрать игрока и похвалить§!\n§RСюйдун-мару: Похвалить… э-э, Нагато на этот раз играет изумительно\nЧестно — игроки [This.GetName] против Нагато из семьи жениха держатся так, что это уже за гранью моего воображения.\nОй? Ага? Почему это они отдали колосса. §!\n§BДа колосс один — что он изменит против этого имбового П? Скарпы что-то менять надо…\nО, шарфов что-то многовато — это шанс! Терраны зашли клещами? Призраки клещами — EMP все в цель, колоссы умерли, разом откат на 50 населения! Сюйдун-мару, вот это похвала так похвала! §!"
 wg_origin.18.a:0 "…"
 wg_origin.19.desc:0 "§BВедущая: Домоседка-северянка в гигантском минусе, лицо серее пепла, построение — каша, тупик со всех сторон! Отступает с боями — и отступать некуда! И вдруг — взрыв в пустоте! §!\n§RСюйдун-мару: Ха! Северянка ВЫИГРАЛА! §!"
 wg_origin.19.a:0 "…"
 wg_origin.22.name:0 "Полная победа"
 wg_origin.22.desc:0 "Под объявление ведущей и рёв трибун наша команда вырвала победу из безнадёжного положения! Победительницы вернулись с солидными призовыми."
 wg_origin.22.a:0 "Шарф на лице — как тут проиграешь!"
 wg_origin.23.name:0 "Вылет из сетки"
 wg_origin.23.desc:0 "В яростной борьбе нашу команду разобрали в пух и прах про-игроки [wg_fallen_empire.GetName]. Под объявление ведущей — вылет из турнира."
 wg_origin.23.a:0 "Разочарование. Всё — на дно Западного озера!"
 wg_origin.24.desc:0 "Дети, мы подумали, что эти средства помогут вам быстро развиться. Примите."
 wg_origin.24.a:0 "Благодарю"
 wg_origin.25.desc:0 "Дети, наши школьницы недавно наделали дронов в качестве домашнего задания — только непонятно, где они раздобыли армейские детали; в их возрасте это слишком опасно. Но мы подумали: эти дроны могут пригодиться вам. Как вам идея?"
 wg_origin.25.a:0 "Дроны… без проблем!"
 wg_origin.25.b:0 "Звучит опасновато — лучше нет"
 wg_origin.26.desc:0 "Дети, вы развиваетесь так быстро, что превзошли наши ожидания.\nСобственно, неподалёку от ваших земель была наша передовая станция, а там — неплохой §Yидеальный мир§!. Хотите — передадим вам координаты."
 wg_origin.26.a:0 "Здорово! Спасибо за подарок"
 wg_origin.26.b:0 "Благодарим, но больше колоний нам не нужно"
 wg_origin.27.desc:0 "Дети, ваша наука в последнее время буксует. Мы решили подарить вам эту базу данных — она поможет решить часть научных задач."
 wg_origin.27.a:0 "Слава Падшей маме"
 wg_modifier_fe_research:0 "База данных типа O, версия vO"
 wg_origin.28.desc:0 "Недавно мы ремонтировали одну §YСингулярность 5-го уровня§!: сняли ключевые узлы, починили — а при установке назад выяснилось, что другая бригада уже поставила запчасти, и сердцевине некуда вернуться.\nТак что… не хотите ли такую штуку себе? Она производит кучу энергии — скажете слово, и мы доставим её в ваш мир."
 wg_origin.28.a:0 "Да-да, энергии много не бывает"
 wg_origin.28.b:0 "Ну, нам её ставить некуда"
 wg_origin.29.desc:0 "Дети, мы рады видеть, какими вы выросли. Но галактика полна опасностей и вызовов: рано или поздно вам понадобится куда более мощная сила, чтобы защитить с таким трудом добытое. Поэтому мы решили подарить вам этот §Y«Владыку»§!.\nЧто бы ни случилось, я надеюсь, вы используете свою силу, чтобы пережить беды, а не упивались силой и интригами."
 origin_wg_shop:0 "Межзвёздная Венеция"
 origin_wg_shop_desc:0 "По разным причинам наша цивилизация поселилась на орбитальной станции обитания, ранее принадлежавшей Лавке Трофеев.\nМы можем извлекать выгоду из торговли купцов народа Сломанных Стульев, но нам придётся принимать и кое-какие их поручения…"
 origin_tooltip_wg_shop_effects:0 "В начале игры — продвинутая орбитальная станция обитания\nТехнология производства §Yтрофеев§!\nТехнология §Yгидропоники§!\nВозможность строить §Yорбитальные станции обитания§!\n300 £sr_pantsu£ §Yтрусиков§! и 30 очков подвига\nЛавка Трофеев продаст дополнительные товары и особые задания\nДополнительные здания §Yфилиалов§!\nГлубинные корабельные девы смогут открывать §Yфилиалы§!"
 d_shop_canteen:0 "Лавочная столовая"
 d_shop_canteen_desc:0 "Производить еду на станции обитания трудно, так что основной рацион жителей — стряпня столовой Лавки Трофеев. Смиритесь с тем, что доставка у них — хоть за тридевять земель, а минимум заказа — всё равно 9 юаней."
 d_dirty_habitat:0 "Грязные отсеки"
 d_dirty_habitat_desc:0 "Прежде Лавка Трофеев складировала здесь неликвид; за годы без присмотра большая часть запасов протекла — крайне опасно."
 d_shop_buildings_slot:0 "Дополнительные отсеки"
 d_shop_buildings_slot_desc:0 "Места на станции обитания мало, и эти пристыкованные снаружи отсеки можно занять под важные функциональные здания."
 d_shop_gas:0 "Биогазовый отсек"
 d_shop_gas_desc:0 "Здесь Лавка Трофеев когда-то сваливала мусор. Автоматика переработки сломалась десятилетия назад, мусор слежался и надышал целую прорву биогаза."
 wg_origin.32.desc:0 "Здравствуйте, все граждане [root.GetSpeciesNamePlural] из [root.GetName]! Рад видеть, что вы выросли в полноценную межзвёздную цивилизацию. Согласно заключённому нами «Принципу взаимной выгоды Лавки Трофеев» вы можете и дальше на законных основаниях и бессрочно владеть орбитальной станцией; мы также будем по мере сил помогать. Но и вы соблюдайте договор: когда нам понадобится — безусловно исполняйте любые требования. Впрочем, в духе взаимной выгоды мы слишком многого не попросим. Продолжаем сотрудничество, наш самый незаменимый партнёр!"
 wg_origin.32.a:0 "Это мы вас просим продолжать заботиться"
 wg_origin.33.desc:0 "Здравствуйте, партнёр. Вам наверняка известно о нашем положении дел: у Лавки в последнее время трудности. Не могли бы вы предоставить §Y1 £pops£ жителя§! в помощь нашему делу?\nКонтракт — на десять лет. В знак искренности зарплату выплатим вперёд."
 wg_origin.33.desc.b:0 "Э-э… ну, по-товарищески — 1500 £energy£ §Y$energy$§! плюс £minerals£ §Y$minerals$§!, как?"
 wg_origin.33.desc.c:0 "Понимаю-понимаю… 2000 £energy£ §Y$energy$§! плюс £minerals£ §Y$minerals$§!, идёт?"
 wg_origin.33.desc.d:0 "Ладно, без прелюдий — конечная цена! 2500 £energy£ §Y$energy$§! плюс £minerals£ §Y$minerals$§!"
 wg_origin.33.desc.e:0 "3000 £energy£ §Y$energy$§! плюс £minerals£ §Y$minerals$§!— потолок, выше никак!"
 wg_origin.33.a:0 "Хорошо, мы принимаем договор"
 wg_origin.33.a.response:0 "Точно к вам и пошёл — огромное спасибо за понимание!"
 wg_origin.33.b:0 "И столько стоят наши люди?"
 wg_origin.33.b2:0 "Условия, конечно, щедрые… но"
 wg_origin.33.b3:0 "Раз у вас столько работы… может, тогда…"
 wg_origin.33.b4:0 "Наши люди — восьмиборцы на договоре 007… может, стоят…"
 wg_origin.33.b5:0 "Видите ли… у вас трудности, у нас тоже кое-какие трудности, верно? Так что…"
 wg_origin.33.c:0 "Наш народ бесценен!"
 wg_origin.34.desc:0 "Так… ладно, считайте, я ничего не говорил"
 wg_origin.34.a:0 "Не торопитесь: цена, названная минуту назад, всё ещё обсуждается"
 wg_origin.34.a.response:0 "Вот видите — найти общий язык мы всё-таки можем. Отлично, по рукам. Приятно иметь дело!"
 wg_origin.34.b:0 "Жаль"
 wg_origin.35.name:0 "Возвращение жителей, помогавших Лавке Трофеев"
 wg_origin.35.desc:0 "Десять лет назад мы обещали Лавке Трофеев рабочую силу, чтобы помочь ей пережить трудности. Срок истёк — и наши граждане, как и было условлено, вернулись в столицу."
 wg_origin.35.a:0 "Спасибо этим героям принудительно-добровольного графика 007"
 wg_origin.36.desc:0 "Здравствуйте, партнёр! Мы набрали персонал для помощи производственным делам других держав: теоретический курс они уже прошли, нужна площадка для практики. Примете их на стажировку?\nИх услуги потребуют немного £sr_pantsu£ §Y$sr_pantsu$§! на ежедневное обслуживание — но мы сразу одним пакетом поставим всё нужное £sr_pantsu£ §Y$sr_pantsu$§!. К тому же эта стажировка не считается в лимите бонусов лавки, а срок — целых пять лет!"
 wg_origin.36.a:0 "Отлично, верю, это будет хорошее сотрудничество"
 wg_origin.36.b:0 "Извините, мы не учебное заведение"
 wg_origin.36.a.tooltip:0 "Получить один случайный бонус из:\n§Y$wg_modifier_station_gatherers$§!, §Y$wg_modifier_survey$§!, §Y$wg_modifier_primary_industry$§!, §Y$wg_modifier_planetary_construction$§!, §Y$wg_modifier_diplomacy_envoy$§!, §Y$wg_modifier_ship_speed$§!, §Y$wg_modifier_secondary_industry$§!, §Y$wg_modifier_tertiary_industry$§!, §Y$wg_modifier_decision$§!, §Y$wg_modifier_diplomacy_weight$§!, §Y$wg_modifier_combat_shipcraft$§!\nи соответствующее количество £sr_pantsu£ §Y$sr_pantsu$§!"
 wg_origin.37.desc:0 "Здравствуйте, партнёр! По «Принципу взаимной выгоды Лавки Трофеев» мы бесплатно дарим вам один VIP-товар — они все имеют исключительный смысл. Прочие VIP-товары, кроме красной книжечки, можно приобрести в лавке!"
 wg_origin.37.a:0 "Да не надо"
 wg_origin.38.name:0 "Просроченные чертежи"
 wg_origin.38.desc:0 "Технологические чертежи, что мы получили от Лавки Трофеев, оказались просроченным хламом — проще говоря, бумагой из туалета: нашей науке от них никакой пользы."
 wg_origin.39.desc:0 "Здравствуйте, партнёр! Вы только вышли в космос, вам предстоит разведка и экспансия — и мы специально под вас собрали учебный научный корабль §Y«Полония»§! У него §Yбыстрее сканирование§! и §Yскорость обнаружения и исследования аномалий§!, плюс немного оружия самообороны — незаменимый спутник домоседа-путешественника и экспансии империи! А учитывая ваш потенциал, мы дарим его бесплатно!\nПравда, у него сейчас есть маленькая странность, а до конца гарантии осталось пять лет. Но и с этим минусом это превосходный научный корабль! Как вам?"
 wg_origin.39.a:0 "Отлично, берём."
 wg_origin.39.a.tooltip:0 "Получить учебный научный корабль §Y«Полония»§!"
 wg_origin.39.b:0 "Ма… маленькая странность? Пожалуй, не стоит"
 wg_origin.39.c:0 "(§RСделать вид, что берём, и тут же разобрать§!)"
 wg_origin.40.name:0 "§Y«Полония»§! самоликвидировалась"
 wg_origin.40.desc:0 "Учебный научный корабль §Y«Полония»§!, подаренный народом Сломанных Стульев, прямо во время задания внезапно взорвался! Мы полагаем, причиной стали ошибки проектирования и износ ключевых узлов.\nК счастью, кабина катапультировалась за миг до взрыва и защитила экипаж — обошлось без потерь."
 wg_origin.41.desc:0 "Партнёр, именем Бога-Стула! Свободная беспрепятственная торговля по всей вселенной и даже мультивселенной — извечный и непоколебимый принцип народа Сломанных Стульев, и мы хотим видеть вас в этом великом проекте.\nПоэтому мы жалуем вам §YЛицензию трофейного каперства§!: под этим предлогом вы сможете законно выгребать ресурсы и население других держав, а после победы свободно строить филиалы на их планетах §Y(кроме случаев, когда противник — мегакорпорация)§!, а наша лучшая в галактике дипмиссия легализует все ваши военные действия.\nВзамен — и ради послевоенного восстановления — вам достаточно лишь позволить нам сбывать первоклассный сервис на освобождённых планетах."
 wg_origin.41.a:0 "Первоклассный сервис? Что вы задумали?"
 wg_origin.41.a.response:0 "Всё просто: мы всего лишь хотим распродать первоклассный товар, веками лежавший на складах. Наши сотрудники после освобождения планеты освободят тамошним жителям рабочую силу и — хм — мягко принудят, то есть, позволит им насладиться нашим изысканным сервисом. Да, им, возможно, придётся отрабатывать кредит лет десять, продав себя, зато они получат свободу выбирать наши превосходные товары!"
 wg_origin.41.b:0 "Но захваченные планеты же наши???"
 wg_origin.41.b.response:0 "О Бог-Стул в небесах, вы меня совсем не слушали! Они получат свободу выбора наших превосходных товаров! Разве может что-то быть важнее демократии?"
 wg_origin.41.c:0 "Ну ладно"
 wg_origin.41.c.tooltip:0 "§YПолучен casus belli для грабежа других держав§!"
 wg_origin.411.desc:0 "О, чуть не забыл! С этим casus belli вам разрешат применять особую орбитальную бомбардировку §PТрофейный§!§Y грабёж§!: население бомбардируемой колонии будут уносить непрерывно, а с ростом разрушенности планеты вы будете получать и её ресурсы!! Наслаждайтесь грабежом… наслаждайтесь радостью свободной торговли!"
 wg_origin.411.a:0 "Хорошо, обязательно попробуем"
 wg_origin.42.title:0 "Победа в войне!"
 wg_origin.42.desc:0 "Мы победили!! Побеждённые добровольно приняли наши коммерческие условия и позволили свободно открывать филиалы на их планетах!!! Лавка Трофеев чрезвычайно довольна нашей защитой свободной торговли."
 wg_origin.42.a:0 "Да здравствует свободная торговля!!"
 wg_origin.43.name:0 "Открывайте, свободная торговля!"
 wg_origin.43.desc:0 "После занятия [wg_shop_war_occupied_planet.GetName] следом за нами пришли сотрудники Лавки Трофеев и развернули на колонии бешеную распродажу — жители по уши в долгах, они носятся, расплачиваясь за купленное, и это бьёт по нормальному производству.\nВпрочем, хорошие новости: мы получили от Лавки дополнительное вознаграждение."
 wg_origin.43.a:0 "Зато они… э-э… получили свободу (неуверенно)"
 wg_origin.43.a.tooltip:0 "§YПартия трусиков уже зачислена в вашу казну§!"
 wg_origin.48.name:0 "Выгребенные ресурсы"
 wg_origin.48.desc:0 "Наш флот, грабительски бомбардирующий [wg_shop_raided_planet.GetName], вместе с населением вывез и часть местных запасов энергии и минералов."
 wg_origin.49.name:0 "Выгребенные ресурсы"
 wg_origin.49.desc:0 "Наш флот, грабительски бомбардирующий [wg_shop_raided_planet.GetName], вместе с населением вывез и часть местных запасов сплавов и потребительских товаров."
 wg_origin.50.name:0 "Открывайте, свободная торговля!"
 wg_origin.50.desc:0 "После того как наш флот орбитальной бомбардировкой полностью обессилил оборону [wg_shop_war_occupied_planet.GetName], следом пришли сотрудники Лавки Трофеев и развернули на колонии бешеную распродажу — жители по уши в долгах, они носятся, расплачиваясь за купленное, и это бьёт по нормальному производству.\nВпрочем, хорошие новости: мы получили от Лавки дополнительное вознаграждение."
 wg_origin.51.desc:0 "Партнёр, что делает ваш флот? Только не говорите, что не можете совладать с подчинёнными?\nРаз так — пеняйте на себя! Открою секрет: в вашей орбитальной станции мы спрятали особую бомбу!\nСейчас я её нажму! Третья бомба! Проигравшие — в прах!"
 wg_origin.51.a:0 "Жри дерьмо, хитрец!"
 wg_origin.58.desc:0 "Здравствуйте, партнёр. У нас тут от интенсивной работы стульев стало маловато. Мы хотим построить на вашей колонии [root.GetName] фабрику по производству стульев. Все расходы по стройке — наши, каждый месяц будем платить вам приличное вознаграждение; вот только сырьё для стульев нам не привезти — придётся вам, уж не обессудьте, его поставлять.\nКстати: если вы откажете в разрешении на стройку или в поставке сырья, это будет сочтено нарушением статьи 42 главы 81 «Принципа взаимной выгоды Лавки Трофеев», и вам придётся уплатить неустойку в 513930640 £energy£ §Y$energy$§!\nВаше мнение?"
 wg_origin.58.a:0 "Вы… вообще спрашиваете нашего мнения…?"
 wg_origin.58.a.response:0 "Хм, а разве я не спрашиваю вашего мнения? Ну… раз вы уже согласились всем видом, расспрашивать дальше как-то неловко."
 wg_origin.58.b:0 "О господи, я отобью вам пятую точку этими пятьюстами миллионами энергокредитов"
 wg_origin.59.desc:0 "Партнёры! Из-за ошибки в заказе мы произвели лишний комплект дополнительных отсеков для орбитальной станции: 4 дополнительных слота зданий и 20 жилья. Обычно — 7999, но мы округлим в вашу пользу: всего 8000 £energy£ §Y$energy$§!— и комплект ваш!"
 wg_origin.59.a:0 "Берём-берём"
 wg_origin.59.b:0 "Э-э, нет денег"
 wg_shop_free_trade_planet_modifier:0 "Принудительно-добровольная торговля"
 wg_shop_free_trade_planet_modifier_desc:0 "Лавка Трофеев развернула на этой колонии бешеную распродажу; жители по уши в долгах и носятся, расплачиваясь за купленное, — нормальное производство страдает."
 wg_shop_habitat_explosion_planet_modifier:0 "Разрушенная инфраструктура"
 wg_shop_habitat_explosion_planet_modifier_desc:0 "Из-за удара по основанию станция больше не может нормально держать столько зданий и районов; её инфраструктура получила необратимые повреждения, и любое производство на станции связано с риском."
 wg_shop_war_poi_name:0 "Открывайте, свободная торговля!"
 wg_shop_war_poi_desc:0 "Поскольку §Yнаши враги§! отказываются сотрудничать с купцами народа Сломанных Стульев, те требуют: мы открываем их границы для нормальной торговли с Лавкой Трофеев. Достаточно занять 3 или более колоний — а дальше всё оформят сотрудники Лавки."
 casus_belli_wg_shop_war:0 "Требование свободной торговли"
 casus_belli_wg_shop_war2:0 "Отказ от навязанной торговли"
 war_goal_wg_shop_war:0 "Свободная торговля"
 war_goal_wg_shop_war_desc:0 "Цель этой войны — заставить противника прекратить давление на нашу законную торговлю"
 bombardment_wg_shop_raiding:0 "[§YТрофейный§!] грабёж"
 bombardment_wg_shop_raiding_desc:0 "Точная бомбардировка обороны и войск планеты с одновременной высадкой штурмовых катеров: население вывозят и принуждают к работе, ресурсы выгребают.\n- §YСредний§! урон по §Yармиям§!\n- §EЛёгкий§! урон по §Yпланете§!\n- Население §Yвывозят§!, а не истребляют\n- Бомбардировка беззащитных планет допустима\n- Последние 5 жителей не трогают"
 accept_wg_shop_war:0 "10 лет сможем без ограничений открывать филиалы в любых колониях противника"
 building_pantsu_recycling:0 "Трусикоприёмка"
 building_pantsu_recycling_desc:0 "Формально компания «перерабатывает ткани в одежду высокими технологиями», фактически — опустошает окрестности, сколачивая целую преступную цепь кражи трусиков и, в сговоре с местными швейниками, задирая цены."
 building_pantsu_shop_sales_agent:0 "Торговый представитель Лавки Трофеев"
 building_pantsu_shop_sales_agent_desc:0 "Один из каналов продаж Лавки Трофеев по всей галактике: немыслимые высокотехнологичные товары — и неизменная традиция лавки: к оплате принимаются только трофейные жетоны."
 building_pantsu_chair_shop:0 "Мебельный бутик Трофеев"
 building_pantsu_chair_shop_desc:0 "Странный мебельный магазин, где к оплате принимают только трофейные жетоны, а товар — одни лишь стулья… От классических деревянных до леопардовых диванов, от массажных до киберспортивных — все стулья, какие вы можете вообразить. Мелочь: каждый стул был сперва разломан самыми разными способами, а потом зашит и пущен в продажу как новый."
 building_pantsu_shop_chair_factory:0 "Фабрика стульев"
 building_pantsu_shop_chair_factory_desc:0 "Этот странный завод не берёт ни царапинки ни от 12-балльного землетрясения, ни от прямого попадания метеорита диаметром 10+ метров — прочности хватит на постоянный военный опорный пункт. Пока планета под ним существует, стоит лишь подать достаточно ресурсов — и эта неприступная супер-технологичная фабрика будет 72 часа в сутки клепать стулья всех видов, а сотрудники Лавки Трофеев будут периодически приезжать, забирать их и оставлять вам «щедрое» вознаграждение."
 wg_origin_waterb_home_system_NAME:0 "Великий Юй"
 wg_origin_waterb_home_system_DESC:0 "Почему-то все планеты этой системы — сплошные океаны. Кажется, это как-то связано с драконом, который здесь живёт…"
 wg_origin_waterb_planet_modifier:0 "Богатая ресурсами планета"
 wg_origin_waterb_planet_modifier_desc:0 "Ресурсов на этой планете куда больше, чем мы думали. Все признаки указывают: раньше здесь было не так много воды."
 wg_origin.62.name:0 "Дракон приближается!"
 wg_origin.62.desc:0 "Наши датчики показывают: дракон, издавна живущий в нашей системе, меняет курс — к родной планете. В летописях нашей цивилизации есть записи, что эта драконица обрушивала на планеты, где останавливалась, целые потопы. Учёные так и не пришли к согласию о причинах, но вот он — дракон, кружащий над системой, летит к нашему дому. Научная группа, давно изучающая её, разворачивает на родной планете своё новейшее творение — драконий коммуникатор, надеясь наладить с ней связь."
 wg_origin.63.name:0 "Дракон плюётся!"
 wg_origin.63.desc:0 "Случилось худшее: дракон над нашей планетой набирает огромное количество воды, чтобы обрушить её на нас! Если это произойдёт, внезапный потоп обернётся бедствием для сотен миллионов! А у научной группы всё ещё финальная отладка коммуникатора…"
 wg_origin.63.a:0 "Включайте коммуникатор! Хоть с глюками — включайте!"
 wg_origin.64.desc:0 "Э-э?? Откуда внизу звук? Вы кто?"
 NAME_Dragon:0 "Дракон"
 NAME_Player:0 "Ты"
 wg_origin.65.desc:0 "Мы — [root.GetName], жители этой планеты. Просим тебя перестать лить воду на планету, иначе будет много жертв… (речь обрывают)"
 wg_origin.66.desc:0 "Ааааааа?? Тут люди?!?\nПростите-простите, я всё поняла, я поняла, сейчас улету, я вам всё испортила, хонто-ни сумимасэн!!"
 wg_origin.67.name:0 "Опасность миновала"
 wg_origin.67.desc:0 "После наших уговоров дракон покинул планету. Правда, она оказалась совсем не такой, как мы воображали — ни капли величественности…"
 wg_origin.67.a:0 "По крайней мере, кризис миновал"
 wg_origin.68.name:0 "Стеснительный дракон"
 wg_origin.68.desc:0 "С тех пор как дракон ушёл с нашей планеты, он по-прежнему слоняется по системе. Но теперь, похоже, нарочно избегает наших людей и кораблей и даже старается не встречаться с нами взглядом. Даже с переводчиком он не отвечает."
 wg_origin.69.name:0 "Запрос на связь"
 wg_origin.69.desc:0 "Внезапно от дракона, живущего в нашей системе, пришёл запрос связи: кажется, он хочет поговорить с тобой наедине."
 wg_origin.70.desc:0 "Здравствуйте… это… я тогда намусорила, простите великодушно… поэтому… я долго думала. Я ничего особо не умею, но драться, наверное, смогу… значит, я смогу вас защищать… вы меня простите? А?"
 wg_origin.71.desc:0 "Конечно! Кстати, а как тебя зовут? Как нам тебя называть?"
 wg_origin.72.desc:0 "Я родилась очень давно, но не помню, чтобы у меня было имя………… если не сложно — придумай мне, пожалуйста."
 wg_origin.73.desc:0 "Тогда… «Юкикадзэ»? В нашей истории это имя того, кто приносит удачу."
 NAME_wg_rbq_dragon:0 "Юкикадзэ"
 wg_origin.74.desc:0 "Спасибо! «Юкикадзэ» — красивое имя. Отныне я — Юкикадзэ!"
 wg_origin.75.name:0 "Дракон Юкикадзэ"
 wg_origin.75.desc:0 "С тех пор как мы дали дракону имя Юкикадзэ, имя ей явно нравится, и она обещала помогать оборонять наши базы.\nНаш командный состав уже наладил через коммуникатор связь с ней — верим, Юкикадзэ станет нашим надёжным стражем."
 wg_origin.77.name:0 "[wg_rbq_dragon_watered_planet.GetName] залита Юкикадзэ"
 wg_origin.77.desc:0 "По данным разведки, Юкикадзэ недавно обрушила на [wg_rbq_dragon_watered_planet.GetName] столько воды, что планета затоплена — суши не осталось вовсе."
 GOTIT:0 "Уже знаю, больше не сообщайте"
 wg_origin.77.a:0 "Как она это делает?!"
 observe_wg_rbq_dragon_water:0 "Наблюдение за драконьим потопом"
 observe_wg_rbq_dragon_water_DESC:0 "Учёные до сих пор не могут объяснить, откуда Юкикадзэ берёт столько воды, чтобы топить планеты. Близкое наблюдение за её «поливом» должно подкинуть науке идей."
 wg_origin.78.name:0 "Наблюдение за драконьим потопом"
 wg_origin.78.desc:0 "После переговоров Юкикадзэ застенчиво согласилась продемонстрировать эту свою способность — а мы подыскали пустую площадку, где она развернётся на полную.\nОсталось разместить персонал и Юкикадзэ."
 wg_origin.79.name:0 "Юкикадзэ на орбите планеты"
 wg_origin.79.desc:0 "Юкикадзэ прибыла к выбранной планете и готова «плюнуться»; наш научный персонал может выдвигаться."
 wg_origin.80.name:0 "Дракон плюётся!"
 wg_origin.80.desc:0 "Под наблюдением множества точных приборов Юкикадзэ снова превратила планету под собой в чисто водяную. Учёные, кажется, уловили идею; они заявляют, что теперь могут разработать планетарное оружие, имитирующее этот потоп."
 wg_origin.81.name:0 "Юкикадзэ хочет погулять"
 wg_origin.81.desc:0 "На днях Юкикадзэ поделилась с нашими людьми желанием прогуляться по соседним системам: то ли потому, что тут почти всё залито водой (зачёркнуто), то ли просто хочет посмотреть мир. Как ответим?"
 wg_origin.81.a:0 "Можно — пусть посмотрит мир, но не улетает далеко."
 wg_origin.81.a.tooltip:0 "Юкикадзэ сможет свободно перемещаться по нашим владениям"
 wg_origin.81.b:0 "Ей безопаснее остаться в столице."
 wg_origin.81.b.tooltip:0 "Юкикадзэ останется только в системе родной планеты."
 wg_origin.82.name:0 "Модификация дракона Юкикадзэ"
 wg_origin.82.desc:0 "Наша генная инженерия созрела, и учёные предложили дерзкий план — переделать дракона Юкикадзэ, сделав сильнее, на службу империи.\nРазумеется, если получится её… уговорить…"
 wg_origin.82.a:0 "Превращайся, я сказал.jpg"
 wg_origin.82.b:0 "А вот сейчас — облом.jpg"
 wg_origin.83.desc:0 "Это… [root.GetRulerTitle] звал Юкикадзэ? Что-то срочное?"
 wg_origin.84.desc:0 "Я хочу, чтобы ты стала фиолетоволосой тихой лоли-эсминцем в белых чулках!"
 wg_origin.85.desc:0 "Э-э…?!... ээээээээ??? (маленькая драконья голова зависла, не переварив огромный знак вопроса)"
 wg_origin.86.desc:0 "То есть — мы хотим, чтобы ты стала одной из нас, [root.GetSpeciesNamePlural]."
 wg_origin.87.desc:0 "Юки… Юкикадзэ будет стараться!"
 wg_origin.88.name:0 "Уговорить Юкикадзэ"
 wg_origin.88.desc:0 "Похоже, Юкикадзэ согласилась на план модификации: как только она доберётся до нашей звёздной базы, учёные начнут работу."
 wg_origin.89.name:0 "Начать модификацию"
 wg_origin.89.desc:0 "Юкикадзэ прибыла на звёздную базу столицы — можно начинать."
 wg_rbq_dragon_INCUBATION_PROJECT:0 "Модификация дракона Юкикадзэ"
 wg_rbq_dragon_INCUBATION_PROJECT_DESC:0 "Превращайся для деда в фиолетоволосую тихую лоли-эсминец в белых чулках.jpg"
 wg_origin.93.name:0 "Юкикадзэ покинула бой"
 wg_origin.93.desc:0 "Наши датчики засекли: дракона Юкикадзэ втянуло в бой, но перед смертельным ударом она из боя вышла и вскоре вернётся в наши владения."
 wg_origin.94.name:0 "Юкикадзэ возвращается на поле"
 wg_origin.94.desc:0 "Датчики внутри наших владений зафиксировали Юкикадзэ — она благополучно вернулась."
 wg_origin.96.name:0 "Предупреждение о ходе игры"
 wg_origin.96.desc:0 "Внимание: происхождение «Тут водится дракон» может быть только один на партию! Система обнаружила, что в вашей сетевой игре их два, — это приведёт к непредсказуемым серьёзным багам. Перезапустите игру и смените происхождение! Все последствия дальнейшей игры — на вашей совести!"
 origin_wg_warhammer:0 "Святой Порт"
 origin_wg_warhammer_desc:0 "Когда-то мы были великой империей, владевшей всей галактикой, — пока Великий мятеж не перевернул нашу цивилизацию. Великая владычица корабельных дев, §YБогоимператрица-Адмирал Т§!, ради спасения вида принесла себя в жертву и взошла на Золотой трон… Но даже это не остановило угасание империи. К сегодняшнему дню мы растеряли почти все технологии, а из владений остался лишь Святой Порт да один агромир.\nНо надежда не умерла: с возвращением корабельной примарха начнётся новый Великий поход — она вернёт нам былое величие и наше наследство!"
 origin_tooltip_wg_warhammer_effects:0 "Необходимо защищать §YЗолотой трон§! на Святом Порту!\nСтартовая планета — §Yаркология§! плюс §Gагромир§!\nЛидер империи будет заменён на §HРоберта Лексингтона Жиллимана / Ямато Жиллимана§!\nВсе §Yлидеры§! получат §Hособые черты§!\n§RОтношения инопланетных империй опустятся до нуля§!\nОбязательная чистка £pop£§Rинопланетного населения§!\nДоступна тотальная война: §HОчистка еретиков§!\nНедоступны вознесения: §RГалактический маяк, планеты Порта, планеты Глубинных§!\nС начала игры доступны §Yкорабль планетарного подавления, орбитальная бомбардировка «Инквизиция» и прыжковые двигатели§!\nОсобая армия: §Hкосмодесант корабельных дев§!\n§RОстальные эффекты автор ещё не придумал§!"
 gov_country_wg_warhammer:0 "§YИмперия корабельных дев§!"
 gov_country_wg_warhammer_desc:0 "Древнюю империю корабельных дев основала великая владычица — §YБогоимператрица-Адмирал Т§!; безумные верующие готовы в любой миг отдать жизнь за империю или за Богоимператрицу."
 building_wsg_god_t_monument:0 "§YСтатуя Богоимператрицы§!"
 building_wsg_god_t_monument_desc:0 "§H«Как объяснить, что всякий раз, глядя на статую Богоимператрицы, я чувствую невидимую тяжесть, понуждающую меня истово молиться?» — член Экклезиархии§!"
 wg_warhammer_system_initializer_NAME:0 "Святой Порт"
 wg_warhammer_system_initializer_DESC:0 "Родная система Святого Порта — святость так и прет"
 NAME_wg_warhammer:0 "Святой Порт"
 NAME_wg_lex_warhammer:0 "Роберт Лексингтон Жиллиман"
 NAME_wg_warhammer_title:0 "Регент Империума"
 leader_trait_ruler_warhammer_lexington:0 "Регент Империума — Лексингтон"
 leader_trait_ruler_warhammer_lexington_desc:0 "Одна из великих корабельных примархов, Роберт Лексингтон Жиллиман, по возвращении стала регентом Империума: именем Богоимператрицы-Адмирала Т она возродит нашу империю."
 wsg.1100.d:0 "Вероятно, еретики. Не обращать внимания"
 lex_warhammer_desc:0 "\n§YРоберт Лексингтон Жиллиман§! — одна из великих корабельных примархов. После долгих лет, потерянных в варпе, она наконец вернулась. Теперь именем Богоимператрицы-Адмирала Т она возродит нашу империю."
 leader_trait_commander_wsg_warhammer:0 "Имперский флотмейстер"
 leader_trait_commander_wsg_warhammer_desc:0 "Эти флотмейстеры — цвет империи: беззаветно верны ей и поклялись донести свет Императрицы до каждого уголка галактики"
 leader_trait_general_wsg_warhammer:0 "Имперский генерал"
 leader_trait_general_wsg_warhammer_desc:0 "На каком бы безнадёжном поле ни стояла имперская пехота — она не отступит ни на шаг: долг будет исполнен до последнего бойца."
 leader_trait_official_wsg_warhammer:0 "Имперский губернатор"
 leader_trait_official_wsg_warhammer_desc:0 "Давление, которое выдерживает губернатор ради своего сектора, трудно вообразить — зато и опыт её растёт стремительно."
 leader_trait_commander_sh_warhammer:0 "Имперский флотмейстер"
 leader_trait_commander_sh_warhammer_desc:0 "Эти флотмейстеры — цвет империи: беззаветно верны ей и поклялись донести свет Императрицы до каждого уголка галактики"
 leader_trait_general_sh_warhammer:0 "Имперский генерал"
 leader_trait_general_sh_warhammer_desc:0 "На каком бы безнадёжном поле ни стояла имперская пехота — она не отступит ни на шаг: долг будет исполнен до последнего бойца."
 leader_trait_official_sh_warhammer:0 "Имперский губернатор"
 leader_trait_official_sh_warhammer_desc:0 "Давление, которое выдерживает губернатор ради своего сектора, трудно вообразить — зато и опыт её растёт стремительно."
 leader_trait_scientist_wg_warhammer:0 "Магос Культа Машины"
 leader_trait_scientist_wg_warhammer_desc:0 "Старшие члены Культа Машины, правоверные служители кредо. Они непрерывно совершенствуются в своей дисциплине, пока не станут её мастерами."
 leader_trait_general_uf_t:0 "§YИзбранница Императрицы§!"
 leader_trait_general_uf_t_desc:0 "Все признаки указывают: этот лидер снискала благосклонность владычицы корабельных дев — все её способности многократно усилены."
 leader_trait_commander_uf_t:0 "§YИзбранница Императрицы§!"
 leader_trait_commander_uf_t_desc:0 "Все признаки указывают: этот лидер снискала благосклонность владычицы корабельных дев — все её способности многократно усилены."
 casus_belli_wg_warhammer:0 "Очистка еретиков"
 war_goal_wg_warhammer_total_war:0 "Тотальная война"
 war_goal_wg_warhammer_total_war_desc:0 "§WХороший еретик — только мёртвый еретик§!"
 casus_belli_wg_warhammer2:0 "Ответный удар"
 war_goal_wg_warhammer_total_war2:0 "Тотальная война"
 war_goal_wg_warhammer_total_war2_desc:0 "§WОрда безумцев, у которых в голове только труп на троне — их надо вычистить§!"
 NAME_wg_yamato_warhammer:0 "Роберт Ямато Жиллиман"
 leader_trait_ruler_warhammer_yamato:0 "Регент Империума — Ямато"
 leader_trait_ruler_warhammer_yamato_desc:0 "Одна из великих корабельных примархов, Роберт Ямато Жиллиман, по возвращении стала регентом Империума: именем Богоимператрицы-Адмирала Т она возродит нашу империю."
 yamato_warhammer_desc:0 "\n§YРоберт Ямато Жиллиман§! — одна из великих корабельных примархов. После долгих лет, потерянных в варпе, она наконец вернулась. Теперь именем Богоимператрицы-Адмирала Т она возродит нашу империю."
 warhammer_holy_harbor_chain_title:0 "Восстановление Святого Порта"
 warhammer_holy_harbor_chain_desc:0 "Прежде чем официально вернуться в звёздное море, надо привести в порядок запустение Святого Порта.\n\n§HРасчистите на Святом Порту все блокирующие участки§!"
 warhammer_holy_harbor_planet_counter:0 "Расчищено заброшенных зон"
 opinion_wg_warhammer:0 "Еретики-чужаки"
 opinion_wg_warhammer_2:0 "Имперские безумцы"
 job_wg_alien_heretics_plural:0 "Чужаки-еретики"
 job_wg_alien_heretics_cap:0 "$job_wg_alien_heretics$"
 job_wg_alien_heretics:0 "Чужаки-еретики"
 job_wg_alien_heretics_desc:0 "Чужакам и еретикам верить нельзя. Сжечь их!!"
 building_wg_golden_toilet:0 "Золотой трон"
 building_wg_golden_toilet_desc:0 "Великая владычица корабельных дев, §YБогоимператрица-Адмирал Т§!, ради продолжения нашего вида добровольно взошла на Золотой трон, в одиночку неся вечные муки.\nЗолотой трон также связан с Астрономиконом, освещающим наш путь."
 wsg_mars_shipyard:0 "Железное кольцо"
 wsg_mars_shipyard_DESC:0 "Когда-то — орбитальные доки Марса, сильнейшего кузнечного мира галактики; ныне большинство технологий утеряно, и работают лишь считаные доки."
 wsg_mars_shipyard2:0 "Железное кольцо"
 wsg_mars_shipyard2_DESC:0 "Восстановленное Железное кольцо: до пика былое величие не дотягивает, но это всё ещё могучие орбитальные доки."
 wsg_40k_mining_station:0 "Имперская шахта"
 wsg_40k_mining_station_DESC:0 "Эта шахта работает день и ночь, принося себя в жертву возрождению империи."
 NAME_wg_custodian:0 "Имперские кустодии"
 wg_custodian:0 "Имперские кустодии"
 wg_custodian_desc:0 "Эти воины стояли перед бессмертной Императрицей корабельных дев ещё до Войн Объединения."
 NAME_wg_space_marine:0 "Орден космодесанта Святого Порта"
 wg_space_marine:0 "Космодесант"
 wg_space_marine_desc:0 "Эти превосходящие обычных людей воины — ангелы Императрицы."
 NAME_wg_astra_marine:0 "Астра Милитарум Святого Порта"
 NAME_wg_astra_marine2:0 "Корпус Астра Милитарум"
 wg_astra_marine:0 "Астра Милитарум"
 wg_astra_marine_desc:0 "Несметная Астра Милитарум — фундамент империи."
 NAME_sunflower_genestealer:0 "Генокрад-подсолнух"
 NAME_sunflower_genestealer_country:0 "Генокрады-подсолнухи"
 sunflower_genestealer_army:0 "Генокрад-подсолнух"
 sunflower_genestealer_army_desc:0 "Генокрады-подсолнухи вплетают свои гены в местные посевы, маскируясь под сельхозкультуры ради массового распространения — и выскакивают прямо во время готовки."
 wg_space_marine_2:0 "Космодесант корабельных дев"
 wg_space_marine_2_desc:0 "Эти превосходящие обычных людей воины — ангелы Императрицы.\nВ силу высокого благородства они отказываются пользоваться тесными §Yкораблями планетарного подавления§!"
 NAME_wg_chaos:0 "Космодесант Хаоса из корабельных дев"
 NAME_wg_chaos_country:0 "Хаос-богиня Модесань"
 wg_chaos_army:0 "Космодесант Хаоса из корабельных дев"
 wg_chaos_army_desc:0 "Эти падшие предатели — псы Хаос-богини Модесань!"
 NAME_wg_ork:0 "Зеленокожее воинство"
 wg_ork_army:0 "Зеленокожее воинство"
 wg_ork_army:0 "Зеленокожее воинство"
 r_wg_warhammer_damaged_reactor:0 "Повреждённый реактор"
 r_wg_warhammer_damaged_reactor_desc:0 "Реактор, безнадёжно отслуживший свой век: он ещё кое-как работает, но утечка радиации сделала непригодной для жизни огромную область."
 r_wg_warhammer_hive_city:0 "Руины города-улья"
 r_wg_warhammer_hive_city_desc:0 "Эти руины пустуют десятки тысяч лет; их можно отстроить и вернуть ресурсы, но внутри нередко таятся §Rневедомые угрозы§!…"
 r_wg_warhammer_hive_city_2:0 "Руины города-улья"
 r_wg_warhammer_hive_city_2_desc:0 "Эти руины пустуют десятки тысяч лет; их можно отстроить и вернуть ресурсы, но внутри нередко таятся §Rневедомые угрозы§!…"
 d_wg_warhammer_mystery_machine:0 "Таинственная машина"
 d_wg_warhammer_mystery_machine_desc:0 "След этой таинственной машины теряется в Золотом веке: она была одной из святынь Культа Машины, уцелела даже при гибели Марса и в конце концов попала на Святой Порт."
 d_wg_warhammer_mystery_machine_sh:0 "Таинственная машина"
 d_wg_warhammer_mystery_machine_sh_desc:0 "След этой таинственной машины теряется в Золотом веке: она была одной из святынь Культа Машины, уцелела даже при гибели Марса и в конце концов попала на Святой Порт."
 wg_warhamme_earth_modifier:0 "Пепелище ожидает строителей"
 wg_warhamme_earth_modifier_desc:0 "Значительная часть земель Святого Порта заброшена и заражена радиацией; нам приходится тратить огромные ресурсы на поддержание хрупкого равновесия, чтобы заражение не расползалось…"
 wg_warhamme_mars_modifier:0 "Мёртвый Марс"
 wg_warhamme_mars_modifier_desc:0 "Марс когда-то был сильнейшим кузнечным миром галактики, но был уничтожен в 825-м Объединённом походе… Объединённому флоту оставался один шаг до гибели империи — но в последний миг §YБогоимператрица§! явила чудо и спасла империю."
 wg_warhamme_farming_world_modifier:0 "Агромир"
 wg_warhamme_farming_world_modifier_desc:0 "Эта планета — наша последняя внесистемная колония до возвращения регента: благодаря ей Святой Порт избежал великого голода. Но тень еретиков всё ещё висит над этим миром…"
 wg_warhamme_farming_world_genestealer_modifier:0 "Взрыв урожайности"
 wg_warhamme_farming_world_genestealer_modifier_desc:0 "Урожайность на этой планете внезапно взлетела."
 wg_origin.102.name:0 "Примарх вернулась! Регент Империума!!"
 wg_origin.102.desc:0 "Надежда не умерла: дочь §YБогоимператрицы-Адмирала Т§!, корабельная примарх §HРоберт Лексингтон Жиллиман§!, недавно вернулась на Святой Порт!!\n\nИменем §YБогоимператрицы-Адмирала Т§! она станет регентом Империума, развернёт новый Великий поход и возродит империю!\n\nНо прежде, по её мнению, нам надо восстановить §Y[wg_warhammer_holy_harbor_target.GetName]§!"
 wg_origin.102.a:0 "Во имя Империи!"
 wg_origin.102.b:0 "§RВторая… §!"
 wg_origin.102.b.tooltip:0 "§RКое-кто знает слишком много§!\nНекоторые £pop£§Yжители§!, знавшие тайну, будут §Rубиты§!"
 wg_origin.1010.desc:0 "														Чёрт, что с моей империей стало."
 wg_origin.1010.a:0 "Э-э… Во имя Империи!"
 wg_origin.104.name:0 "Примарх вернулась! Регент Империума!!"
 wg_origin.104.desc:0 "Надежда не умерла: дочь §YБогоимператрицы-Адмирала Т§!, корабельная примарх §HРоберт Ямато Жиллиман§!, недавно вернулась на Святой Порт!!\n\nИменем §YБогоимператрицы-Адмирала Т§! она станет регентом Империума, развернёт новый Великий поход и возродит империю!\n\nНо прежде, по её мнению, нам надо восстановить §Y[wg_warhammer_holy_harbor_target.GetName]§!"
 wg_origin.105.name:0 "Наша империя"
 wg_origin.105.desc:0 "За долгую-долгую историю большая часть прошлого нашей древней империи забыта за смутой.\nВступив в должность, регент Империума решила заново откопать утраченную историю. Важнейшая её часть — как некогда §YБогоимператрица-Адмирал Т§! одержала верх над мятежной примархом §RХорус Венето§!. Но исход той битвы и саму §YБогоимператрицу§! посадил на Золотой трон — и с тех пор империя пошла на закат…"
 wg_origin.105.a:0 "Слава Богоимператрице"
 wg_origin.106.name:0 "Наша империя"
 wg_origin.106.desc:0 "В долгой-долгой истории большая часть прошлого нашей древней империи забыта за смутой.\nВступив в должность, регент Империума решила заново откопать утраченную историю. Важнейшая её часть — как некогда §YБогоимператрица-Адмирал Т§! одержала верх над мятежной примархом §RХорус Рюдзё§!. Но исход той битвы и саму §YБогоимператрицу§! посадил на Золотой трон — и с тех пор империя пошла на закат…"
 wg_origin.106.a:0 "Слава Богоимператрице"
 wg_origin.107.name:0 "§HЕресь [wg_society_scientist.GetName]§!"
 wg_origin.107.desc:0 "Несомненно, верной слугой §YБогоимператрицы-Адмирала Т§! должна быть главбиолог империи, §H[wg_society_scientist.GetName]§! — но она, оказывается, использовала свои права для тайных и предосудительных изысканий вокруг Золотого трона владычицы и даже её самой. К счастью, её §Rересь§! вовремя вскрыли и пресекли.\n\nНа что §H[wg_society_scientist.GetName]§! заявила: её верность §YИмператрице§! несомненна — всё сделано лишь ради более глубокого понимания §Yприроды Богоимператрицы§! и ради того, чтобы §YБогоимператрица§! снова ходила среди нас…\n\nНаше решение…"
 wg_origin.107.a:0 "Объявить §Y[wg_society_scientist.GetName]§! позорной §Rеретичкой§! и казнить!"
 wg_origin.107.b:0 "Велеть прекратить исследования, §Hна этом стоп§!"
 wg_origin.107.c:0 "Её исследования, быть может, принесут нам §Gнадежду§!…"
 wg_origin.108.name:0 "§H[wg_society_scientist.GetName]§! — всё в норме"
 wg_origin.108.desc:0 "Мы пресекли, но простили кощунство §H[wg_society_scientist.GetName]§! и вернули её на рабочее место. С тех пор она вела себя нормально — только стиль исследований становился всё радикальнее."
 wg_origin.108.a:0 "Отлично"
 wg_origin.109.name:0 "Исчезновение §H[wg_society_scientist.GetName]§!"
 wg_origin.109.desc:0 "Мы пресекли, но простили кощунство §H[wg_society_scientist.GetName]§! и вернули её на рабочее место. Но после очередного исследования §H[wg_society_scientist.GetName]§!, вместо того чтобы отдыхать в кабинете, исчезла; обыск всей станции и окрестностей ничего не дал.\nНеизвестно, связано ли исчезновение с прерванными исследованиями… или, может, §Rеё вовсе не существовало… §!"
 wg_origin.109.a:0 "Правды нам уже не узнать…"
 wg_origin.109.a.tooltip:0 "§H[wg_society_scientist.GetName]§! исчезла навсегда"
 wg_origin.111.name:0 "Наша §YБогоимператрица§!"
 wg_origin.111.desc:0 "Мы позволили §H[wg_society_scientist.GetName]§! дерзкие исследования §YБогоимператрицы§!, хотя её действия нарушали чуть ли не каждую статью кодекса.\n\nВ итоге §H[wg_society_scientist.GetName]§! пришла к выводу: наша Богоимператрица и правда, как записано, могущественный §Pпсионик§! — но псионика, похоже, не её первоисточник силы… Её сущность связана с таинственным §Rсверхпланом§!, и это не иное измерение и не параллельная вселенная — нечто, стоящее полностью вне всего, отдельная система… Так что она сделала предельно кощунственный вывод: великая владычица корабельных дев по своей сути, возможно, вовсе не §H[root.GetSpeciesName]§!\n§H[wg_society_scientist.GetName]§! заявила, что нашла способ наладить прямой разговор с §YБогоимператрицей-Адмиралом Т§!"
 wg_origin.111.a:0 "§Y[wg_society_scientist.GetName]§! — еретичка до мозга костей: казнить немедля, а записи опечатать!"
 wg_origin.111.b:0 "Потрясающе, но придётся принять. Продолжать исследования"
 wg_origin.112.name:0 "Священный рупор"
 wg_origin.112.desc:0 "§H[wg_society_scientist.GetName]§! предлагает оснастить Императрицу §Yрупором§! — возможно, тогда она сможет говорить с нами напрямую.\nПротив выступили многие: они считают §H[wg_society_scientist.GetName]§! невиданной еретичкой, давно совращённой и лишь прикрывающейся этим способом, чтобы вредить самой §YБогоимператрице-Адмиралу Т§!. Но §Hгенерал-командующая кустодиями§! рядом с Императрицей полагает: стоит попробовать…"
 wg_origin.112.a:0 "Зверства §Y[wg_society_scientist.GetName]§! нет прощения — казнить немедля"
 wg_origin.112.b:0 "Опечатать исследования §Y[wg_society_scientist.GetName]§! — на этом стоп"
 wg_origin.112.c:0 "Если Богоимператрица заговорит с нами напрямую — это изменит всё"
 WG_GOD_T_SPEAKER:0 "Установить рупор"
 WG_GOD_T_SPEAKER_DESC:0 "Учёная §Y[wg_society_scientist.GetName]§! разработала рупор-устройство: она считает, что через него мы сможем говорить с Богоимператрицей напрямую"
 wg_origin.113.name:0 "Рупор молчит…"
 wg_origin.113.desc:0 "Несмотря на споры, проект §H[wg_society_scientist.GetName]§! по установке рупора был исполнен.\nНо, к разочарованию, все попытки провалились — и причины не нашлось.\nПосле провала §H[wg_society_scientist.GetName]§! немедленно забрала Инквизиция и бросила в темницу до суда.\nОднако случилось неожиданное… §H[wg_society_scientist.GetName]§! таинственно исчезла из камеры… оставив лишь лист бумаги словно из иного мира. Переведя надписи, мы выяснили: это… §Hповестка от адвоката? §!"
 wg_origin.113.a:0 "Таинственно…"
 wg_origin.114.name:0 "Чужаки: §Yгенокрады-подсолнухи§!"
 wg_origin.114.desc:0 "§YБогоимператрица превыше всех! Слухи оказались правдой! §! На §H[wg_warhammer_neighbor_planet_target.GetName]§! расплодились §Yгенокрады-подсолнухи§!: эти мерзкие чужаки вплетают свои гены в местные посевы, маскируясь под сельхозкультуры ради массового распространения — и выскакивают прямо во время готовки. Драгоценный агромир под их натиском — мы обязаны поддержать его!"
 wg_origin.114.a:0 "Где же наши подкрепления?"
 wg_origin.115.name:0 "§H[wg_warhammer_neighbor_planet_target.GetName]§! занята генокрадами!"
 wg_origin.115.desc:0 "Местная оборона §H[wg_warhammer_neighbor_planet_target.GetName]§! сражалась героически… но в конце концов агромир заняли мерзкие чужаки."
 wg_origin.115.a:0 "Мы обязаны вернуть §H[wg_warhammer_neighbor_planet_target.GetName]§!"
 wg_origin.116.name:0 "Кощунственная декларация"
 wg_origin.116.desc:0 "Генокрады-подсолнухи с §H[wg_warhammer_neighbor_planet_target.GetName]§! обратились к Святому Порту с кощунственной декларацией.\n\n§W«Дорогие [root.GetSpeciesName], опустите ваши мясницкие ножи. Вы — последние уцелевшие [root.GetName], а мы — последние ростки §YПодсолнуховой секты§!. Почему бы нам не сотворить вместе лучшее будущее? Вы веруете в §YБогоимператрицу-Адмирала Т§!, а мы — в §GЧетырёхлистную Богоимператрицу§! — мы одинаково преданны!!!»§!\n\nКакое кощунство! Эти омерзительные чужаки должны быть §Rочищены пламенем!! §!"
 wg_origin.116.a:0 "Сжечь чужаков!!"
 wg_origin.117.name:0 "Мятеж генокрадов-подсолнухов подавлен!"
 wg_origin.117.desc:0 "§YБогоимператрица превыше всех! §! Как будто знали наперёд: по неизвестной причине мы заранее развернули на §H[wg_warhammer_neighbor_planet_target.GetName]§! большие оборонительные силы и вовремя подавили мятеж чужаков. Теперь §H[wg_warhammer_neighbor_planet_target.GetName]§! в безопасности — осталось оценить ущерб от генокрадов."
 wg_origin.117.a:0 "Несомненно, чудо Богоимператрицы!"
 wg_origin.118.name:0 "Последствия…"
 wg_origin.118.desc:0 "Мы подавили мятеж чужаков на §H[wg_warhammer_neighbor_planet_target.GetName]§!, но дурные последствия ещё не исчерпаны.\nИзвестно, что генокрады-подсолнухи распространяются, маскируясь под еду, — а на §H[wg_warhammer_neighbor_planet_target.GetName]§! многие уже съели заражённое.\nИнквизиторы полагают: генокрады могли взять таких людей под обратный контроль. Мы обязаны не допустить повторной трагедии."
 wg_origin.118.a:0 "Промыть желудки всем, кто съел заражённое"
 wg_origin.118.b:0 "Придётся бросить этих несчастных"
 wg_origin.118.b.tooltip:0 "Несчастные, съевшие заражённое, будут §Rказнены§!"
 wg_origin.119.name:0 "§H[wg_warhammer_neighbor_planet_target.GetName]§! возвращена"
 wg_origin.119.desc:0 "§YБогоимператрица превыше всех! §! Наши героические легионеры полностью истребили генокрадов-подсолнухов на §H[wg_warhammer_neighbor_planet_target.GetName]§! — священное пламя очистило их дотла. Теперь §H[wg_warhammer_neighbor_planet_target.GetName]§! в безопасности — осталось оценить ущерб от генокрадов."
 wg_origin.119.a:0 "Сжечь чужаков!!"
 wg_origin.120.name:0 "Урожай на §H[wg_warhammer_neighbor_planet_target.GetName]§! взорвался"
 wg_origin.120.desc:0 "По докладу планетарного губернатора §H[wg_warhammer_neighbor_planet_target.GetName]§!, под её мудрым руководством урожай по неизвестной причине вдруг вырос §Gвдвое§!. Удержись тенденция — и Святой Порт забудет о голоде."
 wg_origin.120.a:0 "Великолепно"
 wg_origin.121.name:0 "Урожай на §H[wg_warhammer_neighbor_planet_target.GetName]§! ведёт себя странно"
 wg_origin.121.desc:0 "С §H[wg_warhammer_neighbor_planet_target.GetName]§! ползут слухи: местные жители видели, как посевы §Yобрастают руками-ногами или цветочными чертами§!, и такие случаи всё учащаются.\nПланетарный губернатор заверяет: это §Rполная чушь§!, их продукция безопасна на 100%."
 wg_origin.121.a:0 "Задавить слухи"
 wg_origin.121.b:0 "Стоит быть начеку"
 wg_origin.122.name:0 "Еретики-предатели: §Rкосмодесант Хаоса из корабельных дев§!"
 wg_origin.122.desc:0 "Мы расчистили очередные руины города-улья на §H[wg_warhammer_holy_harbor_target.GetName]§! — и с ужасом обнаружили: уцелевшие еретички пытаются через дыру в Золотом троне возвести малый §Rпортал Хаоса!!! §!\nЭти предательницы ещё во время мятежа не устояли перед наваждением §RХаос-богини Модесань§! и бросились в объятия Хаоса.\nОбнаружив кощунство, они немедленно активировали §Rкощунственные врата§! — на нас хлынули полчища §Rкосмодесанта Хаоса из корабельных дев§!, но портал был несовершенен, быстро рухнул и пресёк поток.\n\nМы должны собрать все оборонительные силы §H[wg_warhammer_holy_harbor_target.GetName]§! и выстоять против вторжения Хаоса!"
 wg_origin.122.a:0 "Защитим §Y[wg_warhammer_holy_harbor_target.GetName]§!! Защитим §YБогоимператрицу-Адмирала Т§!!"
 wg_origin.123.name:0 "Еретики очищены"
 wg_origin.123.desc:0 "Общими силами планетарной обороны все еретики уничтожены, кощунственные следы смыты. Святой Порт вновь в безопасности."
 wg_origin.123.a:0 "Во имя Империи!"
 wg_origin.124.name:0 "Обвал города-улья"
 wg_origin.124.desc:0 "Мы расчистили руины города-улья, но они держались в хрупком равновесии — наша расчистка его нарушила: цепная реакция прошлась на сотни километров вокруг, людские и имущественные потери огромны…"
 wg_origin.124.a:0 "Какая беда"
 wg_origin.125.name:0 "Сделаем Святой Порт святым вновь"
 wg_origin.125.desc:0 "Через все эти испытания мы всё же перевыполнили план. §H[wg_warhammer_holy_harbor_target.GetName]§! ныне сияет как новая — следов запустения не осталось §R(если заметите — сообщите в юридический отдел)§!\n\nСвятой Порт вновь свят. Время встретить любые вызовы звёзд!"
 wg_origin.125.a:0 "Во имя Империи!"
 relic_r_wg_stc:0 "Показывает §G6–10§! доступных для исследования §Yсигналов СШК§!"
 r_wg_stc:0 "Поисковик СШК"
 r_wg_stc_desc:0 "Эта штука, похожая на тостер эпохи 3К, — на самом деле святой артефакт Золотого века, найденный на руинах Марса: он ловит сигналы СШК-шаблонов и отмечает их на звёздной карте.\n\n§RЗаметки:\n1. Перезарядка Поисковика СШК не конфликтует с прочими реликвиями\n2. Поисковик можно активировать многократно — с уже найденными сигналами СШК это не конфликтует§!"
 relic_wg_stc_cooldown:0 "\nПерезарядка Поисковика СШК: £time£ §Y1800§!"
 requires_relic_stc_no_cooldown:0 "$TRIGGER_FAIL$§R Поисковик СШК ещё не перезарядился — активировать снова пока нельзя§!"
 warhammer_stc_chain_title:0 "Возврат СШК-шаблонов"
 warhammer_stc_chain_desc:0 "Поисковик СШК наловил сигналов: отправим людей вернуть эти бесценные реликвии."
 WG_STC_1_PROJECT:0 "Сигнал СШК"
 WG_STC_1_PROJECT_DESC:0 "Поисковик СШК поймал слабый сигнал СШК — можно отправиться за ним, но помните: где возможность — там и риск.\n\nБонус: учёная получает §G50–200§! опыта"
 WG_STC_2_PROJECT:0 "Сигнал СШК"
