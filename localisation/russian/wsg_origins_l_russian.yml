 wg_stc_modifier_8:0 "$wg_stc_modifier_5$"
 wg_stc_modifier_8_desc:0 "$wg_stc_modifier_5_desc$"
 wg_stc_modifier_9:0 "СШК: Демографический бонус"
 wg_stc_modifier_9_desc:0 "Эта технология СШК даёт населению умеренный бонус"
 wg_stc_modifier_10:0 "$wg_stc_modifier_9$"
 wg_stc_modifier_10_desc:0 "$wg_stc_modifier_9_desc$"
 wg_stc_modifier_11:0 "$wg_stc_modifier_9$"
 wg_stc_modifier_11_desc:0 "$wg_stc_modifier_9_desc$"
 wg_stc_modifier_12:0 "$wg_stc_modifier_9$"
 wg_stc_modifier_12_desc:0 "$wg_stc_modifier_9_desc$"
 leader_trait_scientist_stc_bad_trait1:0 "Испорченный код"
 leader_trait_scientist_stc_bad_trait1_desc:0 "Бедную учёную потрескал код испорченного СШК; он то и дело атакует её импланты — чтобы спасти ей жизнь, придётся вложить больше ресурсов."
 leader_trait_scientist_stc_bad_trait2:0 "Вирус базы данных"
 leader_trait_scientist_stc_bad_trait2_desc:0 "Испорченный СШК заразил квантовую базу данных в мозгу этой учёной — исследования ей теперь даются тяжело."
 wg_origin.200.name:0 "Зеленокожие Глубинные"
 wg_origin.200.desc:0 "§RВаааааааааааааааааааах!!!! §!"
 wg_origin.200.a:0 "Зе… зеленокожие Глубинные?!"
 wg_origin.204.name:0 "Чужаки: §Gзеленокожие Глубинные§!"
 wg_origin.204.desc:0 "Эти похожие на глубинных корабельных дев чужаки на деле — колония разумных грибов; они поклоняются кощунственным божествам §YХитрой Сестры§! и §BДоброй Сестры§!\nИх должны были выжечь дотла ещё тридцать тысяч лет назад — но, очевидно, мы недоработали.\nЭти §Gзеленокожие Глубинные§! — похоже, довольно продвинутое племя космических зеленокожих: они §Rпериодически расползаются наружу§!. Пока они далеко, но не останови мы их — скоро они заполонят всю галактику."
 wg_origin.204.a:0 "Их надо уничтожить"
 wg_origin.205.name:0 "Чужаки: §Gзеленокожие корабельные девы§!"
 wg_origin.205.desc:0 "Эти похожие на корабельных дев чужаки на деле — колония разумных грибов; они поклоняются кощунственным божествам §YХитрой Сестры§! и §BДоброй Сестры§!\nИх должны были выжечь дотла ещё тридцать тысяч лет назад — но, очевидно, мы недоработали.\nЭти §Gзеленокожие корабельные девы§! — похоже, довольно продвинутое племя космических зеленокожих: они §Rпериодически расползаются наружу§!. Пока они далеко, но не останови мы их — скоро они заполонят всю галактику."
 wg_origin.206.name:0 "Зеленокожие корабельные девы"
 wg_origin.206.a:0 "Зе… зеленокожие корабельные девы?!"
 wg_origin.207.desc_01:0 "§RВаааааааааааааааааааах!!!! §!\nВы драться пришли? Ха-ха, то-то лучше!"
 wg_origin.207.desc_02:0 "§YХитрая Сестра§! хитра да добра, §BДобрая Сестра§! добра да хитра; мы большие и сильные, а вы — мелкие и дохлые!"
 wg_origin.207.desc_03:0 "Мне нравятся твои волосы. Подаришь?"
 wg_origin.207.desc_04:0 "§RВаааааааааааааааааааах!!!! §!\n§RВаааааааааааааааааааааааааааах!!!! §!\n§RВааааааааааааааааааааааааааааааааах!!!! §!"
 wg_origin.207.desc_05:0 "Ты, корабельная креветка! Глянь на свои дрыболапые ножки — мне кажыца, тронь я тебя — и ты рассыпешься!"
 wg_origin.207.desc_06:0 "Пушка на твоём ригинге выглядит §RВаах§! — хочу её отвинтить и приладить на мою Большую Дакку."
 wg_origin.207.desc_07:0 "Не мозольтесь, креветки!"
 wg_origin.207.desc_08:0 "Хитро жертвую §YХитрой Сестре§!, добро дарую §BДоброй Сестре§!"
 wg_origin.207.desc_09:0 "Мы превратим ваш дырявый чёлн в трофей на нашем борту!"
 wg_origin.207.desc_10:0 "Мы больше! Мы сильнее!!"
 wg_origin.207.desc_11:0 "Чем §YХитрая Сестра§! отличается от §BДоброй Сестры§!? Слушай сюда, креветка! Та, что испарит вас из самой большой дакки, — §YХитрая Сестра§!, а та, что расплющит вас самым быстрым попрыгуном, — §BДобрая Сестра§!"
 wg_origin.207.desc_12:0 "Наш босс устроит вам, креветкам, большой §RВаах§!"
 wg_origin.207.a:0 "Проклятые чужаки"
 wg_origin.210.name:0 "§GВторжение зеленокожих§!"
 wg_origin.210.desc:0 "Сопредельные зеленокожие послали хитрый флот нас атаковать. Если они после этого захватят §Rсистему§! и построят звёздную базу — наша колония будет немедленно атакована их армией!"
 wg_origin.210.a:0 "Их надо уничтожить"
 wg_origin.202.name:0 "§GВторжение зеленокожих§!"
 wg_origin.202.desc:0 "Зеленокожие атаковали нашу §Y[this.GetName]§! — если их армия займёт планету, наша колония будет §Rуничтожена§! через §R360 дней§!"
 wg_origin.202.a:0 "Их надо уничтожить"
 wg_origin.211.name:0 "Планета пала"
 wg_origin.211.desc:0 "§Y[FromFrom.GetName]§! пала под натиском зеленокожих; не верни мы её — колония будет §Rуничтожена§! через §R360 дней§!"
 wg_origin.211.a:0 "Действовать надо срочно"
 wg_origin.212.name:0 "Колония уничтожена"
 wg_origin.212.desc:0 "§Y[this.GetName]§! больше нет… всех колонистов зеленокожие перебили…"
 wg_origin.212.a:0 "Мы не можем закрывать глаза на зеленокожую угрозу"
 wg_origin.213.name:0 "§GВсё большая угроза§!"
 wg_origin.213.desc:0 "Зеленокожих всё больше; сбившись вместе, они накопили более мощную энергию §RВааах§! — теперь все зеленокожие на глазах окрепли…"
 wg_origin.213.a:0 "Успеть уничтожить, пока они не стали неуправляемыми"
 wg_origin.217.name:0 "§GБеспрецедентные зеленокожие§!"
 wg_origin.217.desc:0 "Зеленокожая угроза достигла пика: накопленная ими энергия §RВааах§! сделала их сильнее, чем когда-либо…"
 wg_origin.217.a:0 "Мы вообще с ними справимся?"
 WG_ork_planetary_ship_PROJECT:0 "Боевая планета зеленокожих"
 WG_ork_planetary_ship_PROJECT_DESC:0 "Во владениях зеленокожих мы нашли недостроенную боевую планету — нужна проверка, чтобы оценить угрозу."
 wg_origin.218.name:0 "§GРодная система зеленокожих§!"
 wg_origin.218.desc:0 "Мы добрались до §Gродной системы§! этих зеленокожих! Пора покончить с этими чужаками!!\n\nЗаодно в системе обнаружен недостроенный §Hкорабль-планета§! — дострой зеленокожие эту боевую планету, угроза станет немыслимой. Мы считаем важным отправить техножрецов на проверку."
 wg_origin.218.a:0 "Смерть чужакам!"
 wg_origin.219.name:0 "§GНедостроенная боевая планета§!"
 wg_origin.219.desc:0 "Культ Машины провёл полный осмотр боевой планеты: это на редкость добротно построенный корабль-планета — качество и упорядоченность будто не зеленокожая работа.\nНо достроить его зеленокожие не смогли из-за §Rгрызни§!: они передрались из-за того, какому божеству — §YХитрой Сестре§! или §BДоброй Сестре§! — посвящать главный тотем корабля, и дрались до нашего прихода — мы их всех и перестреляли.\n\nЧлены Культа Машины собрали гору ценных данных и считают, что мы можем достроить этот суперколосс."
 wg_origin.219.a:0 "Мы тоже умеем §RВаах§!"
 wg_origin.221.name:0 "Победа империи"
 wg_origin.221.desc:0 "Сводка: последняя группа флотов зеленокожих подтверждённо уничтожена — многолетняя зеленокожая угроза наконец снята!!\nСоответствующие службы выжгли огнём миры, заражённые спорами зеленокожих; кое-кто из них бежал, но мы уверены: бури они больше не поднимут! §H(наверное)§!\n\nИтак — это победа империи."
 wg_origin.221.a:0 "Великолепно"
 warhammer_great_expedition_title:0 "Несокрушимый поход"
 warhammer_great_expedition_desc:0 "Великий поход, объявленный регентом Империума: мы вернём земли, что были империей, и обрушим её гнев на головы еретиков и чужаков."
 wg_origin.222.name:0 "Несокрушимый поход"
 wg_origin.222.desc:0 "С восстановлением контроля над родной системой §Hрегент Империума [root.GetRulerName]§! решила: время объявить Великий поход — вернуть земли, что были нашими, и обрушить гнев империи на головы еретиков и чужаков.\n§HРегент Империума [root.GetRulerName]§! нарекла этот поход §BНесокрушимым§!"
 wg_origin.222.a:0 "Слава Империи!"
 wg_origin.223.name:0 "Возвращение на Макрагг"
 wg_origin.223.desc:0 "§BНесокрушимый поход§! набирает ход, и мудрая корабельная примарх, §Hрегент Империума [root.GetRulerName]§!, назначила его первой целью бывшую столицу Пятисот Миров — свою родину, §YМакрагг§!\n\nСто десять тысяч лет назад §Hрегент§! проснулась накануне падения Макрагга и §Yс песней отступила к Святому Порту§!, но, к несчастью, заблудилась в варпе почти на §Rсто десять тысяч лет§! прежде чем вернуться в реальное пространство.\n\nКаким бы ни было прошлое — ныне мы вернёмся в этот великий мир и вновь водрузим на нём имперское знамя."
 wg_origin.223.a:0 "Слава Империи!"
 warhammer_great_expedition_poi:0 "Возвращение на Макрагг"
 warhammer_great_expedition_desc:0 "Великий поход, объявленный регентом Империума: мы вернём земли, что были империей, и обрушим её гнев на головы еретиков и чужаков."
 wg_origin.224.name:0 "Макрагг"
 wg_origin.224.desc:0 "Экспедиционный флот прибыл в систему Макрагга, но великий мир увял десятки тысяч лет назад: столица Пятисот Миров лежит в руинах под ударами Хаоса.\n\nДаже несгибаемая примарх при виде этого не сдержала тени печали. Но мы обязаны собраться: вернуть всё, что можно вернуть, и отвоевать нашу славу."
 wg_origin.224.a:0 "По зову [root.GetRulerName]!"
 warhammer_wg_macragge_plant_poi:0 "Макрагг"
 warhammer_wg_macragge_plant_desc:0 "Примарх приказала немедленно провести по руинам Макрагга сплошные поиски и вернуть все ресурсы, какие возможно."
 site_wg_macragge:0 "Руины Макрагга"
 site_wg_macragge_desc:0 "Эта великая планета была столицей Пятисот Миров, королевства Ультрамар, — жемчужина звёздного моря, красота которой захватывала дух. Десятки тысяч лет назад сюда пришла сила Хаоса и сокрушила этот самоцвет, — и сердце разрывается.\nНыне наш взор снова обращён к этой замолкшей земле: с памятью о прошлой славе и надеждой на будущее вернём всё наследие, что уцелело, и отвоюем утраченное величие."
 wg_origin.225.name:0 "Гибель Макрагга"
 wg_origin.225.desc:0 "Сто десять тысяч лет назад §Hрегент Империума [root.GetRulerName]§! была воскрешена с помощью союзниц и повела контрудар по хаоситским еретикам, вторгшимся в Ультрамар. Но враг был слишком силён, и мудрая примарх решила немедленно отойти в стратегическое отступление — в поход на Святой Порт; она собрала все флоты, какие смогла, и возглавила экспедиционный корпус. Увы: великая примарх и её флоты заблудились в варпе почти на сто десять тысяч лет, а за это время Ультрамар, лишённый лидера и большей части флотов, пал.\n\nВ итоге ненавистные еретики уничтожили сердце Ультрамара — Макрагг. Ту самую выжженную, расколотую землю, что ныне под нашими ногами."
 wg_origin.225.a:0 "Печально"
 wg_origin.226.name:0 "Аномально стабильная зона"
 wg_origin.226.desc:0 "Из-за кощунственных варп-чар хаоситов даже по прошествии десятков тысяч лет большая часть планеты смертельно опасна.\nНо, как ни странно, одна область стабильна подозрительно. Примарх, кажется, понимает, что это; она приказала поисковой группе немедленно детально обследовать эту зону."
 wg_origin.226.a:0 "Готовить сплошные поиски"
 wg_origin.227.name:0 "Корабль Императрицы"
 wg_origin.227.desc:0 "Поисковая группа обследовала стабильную зону и среди расколотого континента нашла реликвию — §HКорабль Императрицы§!\n§HКорабль Императрицы§! — созданное §YБогоимператрицей-Адмиралом Т§! с помощью варп- и научно-знаний гигантское пламенепокрытое корабельное орудие. Эта реликвия радужного ранга пылает прыгающим огнём от башни до ствола. Когда оно стреляет, горящие снаряды чертят в небе огненные дуги и легко вскрывают крепчайшую броню. Это орудие — проклятие сил Хаоса: устоять может лишь сильнейший демон; обычного же демона уничтожает один только его огненный отсвет. Это орудие приносит демонам настоящую смерть, а не просто изгнание в варп.\nВо время похода на Святой Порт из-за атак предателей реликвию, увы, оставили на Макрагге — и вот через сто десять тысяч лет §Hрегент Империума [root.GetRulerName]§! снова взяла её в руки."
 wg_origin.227.a:0 "Слава богам!"
 leader_trait_ruler_warhammer_lexington_eship:0 "Корабль Императрицы"
 leader_trait_ruler_warhammer_lexington_eship_desc:0 "§HКорабль Императрицы§! — созданное §YБогоимператрицей-Адмиралом Т§! с помощью варп- и научно-знаний гигантское пламенепокрытое корабельное орудие. Эта реликвия радужного ранга пылает прыгающим огнём от башни до ствола. Когда оно стреляет, горящие снаряды чертят в небе огненные дуги и легко вскрывают крепчайшую броню. Это орудие — проклятие сил Хаоса: устоять может лишь сильнейший демон; обычного же демона уничтожает один только его огненный отсвет. Это орудие приносит демонам настоящую смерть, а не просто изгнание в варп."
 leader_trait_ruler_warhammer_yamato_eship:0 "Корабль Императрицы"
 leader_trait_ruler_warhammer_yamato_eship_desc:0 "§HКорабль Императрицы§! — созданное §YБогоимператрицей-Адмиралом Т§! с помощью варп- и научно-знаний гигантское пламенепокрытое корабельное орудие. Эта реликвия радужного ранга пылает прыгающим огнём от башни до ствола. Когда оно стреляет, горящие снаряды чертят в небе огненные дуги и легко вскрывают крепчайшую броню. Это орудие — проклятие сил Хаоса: устоять может лишь сильнейший демон; обычного же демона уничтожает один только его огненный отсвет. Это орудие приносит демонам настоящую смерть, а не просто изгнание в варп."
 wg_origin.228.name:0 "Библиотека Птолемея"
 wg_origin.228.desc:0 "После возвращения Корабля Императрицы Культ Машины доложил о ещё одной ценной точке: обломок плавающего континента оказался местом Библиотеки Птолемея, причём основной корпус чудесным образом цел.\nОни советуют немедленно начать спасательные раскопки и вытащить как можно больше данных. Но странно: сама регент, едва услышав об этом, немедленно объявила зону заражённой хаоситским скверной и смертельно опасной, велела всем держаться подальше и потребовала уничтожить этот район без следа."
 wg_origin.228.a:0 "Исполнить приказ регента: уничтожить Библиотеку Птолемея!"
 wg_origin.228.b:0 "Мы не можем бросить эти бесценные данные"
 wg_origin.228.b.tooltip:0 "§RНекоторые члены Культа Машины решат нарушить приказ регента и тайком вытащить данные§!"
 wg_origin.229.name:0 "Незапомненное…"
 wg_origin.229.desc:0 "Часть членов Культа Машины ослушалась регента и тайно раскопала бывшую Библиотеку Птолемея. Пролистав груду архивов, они нашли данные, не записанные ни в одном хранилище империи: там значилась некая незапомненная история нынешнего регента Империума и ещё двух примархов в Ультрамаре…"
 wg_origin.229.a:0 "Это вторая…"
 wg_origin.230.name:0 "Еретики очищены"
 wg_origin.230.desc:0 "Великая §Hрегент Империума [root.GetRulerName]§! благоразумно учуяла нескольких заражённых Хаосом еретиков из Культа Машины: они ослушались приказа и полезли в осквернённую зону творить кощунственные ритуалы.\nК счастью, Ассасинорум вовремя пресёк их кощунства и уничтожил все связанные данные."
 wg_origin.230.a:0 "Надо же, аж ересь выискали!"
 wg_origin.230.a.tooltip:0 "§RУчёная-еретичка и её корабль — стёрты§!"
 WG_40k_secret:0 "Незапомненная история"
 WG_40k_secret_DESC:0 "Некоторые члены Культа Машины решили нарушить приказ регента и тайно отправиться в бывшую Библиотеку Птолемея за утраченными данными."
 wg_origin.231.name:0 "Сигнал бедствия Стиджиса-8"
 wg_origin.231.desc:0 "С успехом возвращения Макрагга и имперской реликвии первый этап §BНесокрушимого похода§! завершён победой; экспедиционный флот обсуждает следующую цель.\nИ тут Культ Машины сообщает: пойман слабый сигнал бедствия с былого кузнечного мира — §RСтиджиса-8§!. Послание прошёл сквозь варп-помехи; сколько лет прошло с его отправки — неизвестно; многие полагают, что планета давно погибла.\nНо из-за значения §RСтиджиса-8§! для Культа Машины — и по политическим соображениям §Hрегента Империума [root.GetRulerName]§! — она назначает §RСтиджис-8§! следующей целью флота."
 wg_origin.231.a:0 "Нам нужно туда"
 warhammer_wg_vulcanis_8_poi:0 "Возвращение на Стиджис-8"
 warhammer_wg_vulcanis_8_desc:0 "Стиджис-8 некогда был важным кузнечным миром — мы вернёмся в его систему."
 wg_origin.232.name:0 "Слишком поздно"
 wg_origin.232.desc:0 "По координатам сигнала мы вышли к системе Вулканис, где находится §RСтиджис-8§!; но, очевидно, мы опоздали: §RСтиджис-8§! давно погиб и превратился в обугленную расколотую планету.\nЧлены Культа Машины требуют исследовать её, чтобы понять, что произошло, и вывезти всё, что ещё можно."
 wg_origin.232.a:0 "Печально…"
 site_wg_stygies_8:0 "Стиджиса больше нет"
 site_wg_stygies_8_desc:0 "Стиджис-8 когда-то был могучим кузнечным миром, но за долгую §HЭру забвения§! империи и он стал дымком истории."
 wg_origin.233.name:0 "Стиджиса больше нет"
 wg_origin.233.desc:0 "§RСтиджис-8§! разрушен куда сильнее Макрагга: нечто, разрывающее планеты, уничтожило всё; уцелевшие материковые глыбы лишились почти всех ориентиров. Ценных зацепок мало; ясно одно — мир погиб около ста тысяч лет назад, вскоре после начала §HЭры забвения§!\nГруды обломков флотов Культа Машины и Хаоса на орбите газового гиганта свидетельствуют о жесточайшей битве."
 wg_origin.233.a:0 "Нужно больше зацепок"
 wg_origin.234.name:0 "Космическая битва"
 wg_origin.234.desc:0 "Обломки флотов у газового гиганта и на спутниках рассказывают о разыгравшейся здесь мясорубке. По подсчётам, лишь четверть кораблей принадлежала Культу Машины — потери хаоситских предателей куда выше.\nПо записям, §RСтиджис-8§! обладал не только мощной промышленностью, но и технологиями, почти еретическими; защитники, вероятно, использовали их для создания преимущества.\n\nИтак: оборонительный флот §RСтиджиса-8§!, судя по всему, отбился и тяжело потрепал флот Хаоса. Но в нашей вселенной победа в космосе — ещё не победа в войне: исход, как правило, решают кровавые наземные бои."
 wg_origin.234.a:0 "Продолжать расследование"
 wg_origin.235.name:0 "Добывающие комплексы"
 wg_origin.235.desc:0 "В расколотой планете и обломках флотов зацепок больше нет — обратимся к спутникам.\n§RСтиджис-8§! — один из восьми спутников газового гиганта; остальные семь снабжали кузнечный мир ресурсами — жизненная линия, поддерживающая существование §RСтиджиса-8§!. Груды боевых кораблей на орбите — явный след борьбы за контроль над спутниками.\n\nСперва мы думали, что Хаос, взяв спутники, перерезал снабжение §RСтиджиса-8§!, чтобы принудить его к сдаче, — но большая часть добывающих комплексов цела, а на многих шаттлах даже загружена руда.\nЯсно: снабжение не прерывалось — и это не причина падения §RСтиджиса-8§!."
 wg_origin.235.a:0 "Продолжать"
 wg_origin.236.name:0 "Выжившая"
 wg_origin.236.desc:0 "Мы обыскали уцелевшие добывающие комплексы — и совершили прорыв: глубоко в недрах §YСтиджиса-4§! нашлась комната с капсулами анабиоза.\nБольшинство капсул разрушено, и их обитатели давно окаменели, — но одна работает, а спит в ней §Hмладший магос§!"
 wg_origin.236.a:0 "Вскрыть капсулу: нам нужно знать, что случилось."
 wg_origin.237.name:0 "Младший магос"
 wg_origin.237.desc:0 "§HМладший магос пробудилась от анабиоза; мы осмотрели её и ввели в курс дела§!\n\nНе верится… прошло столько лет…"
 wg_origin.237.a:0 "Что случилось с §RСтиджисом-8§!?"
 wg_origin.237.a.response:0 "После потери связи с империей нас довольно скоро атаковал Хаос. К счастью, наши флоты и технологии были достаточно сильны — мы отбили §Y13§! волн хаоситских армад.\nНо в последней атаке Хаос использовал брешь в обороне: кощунственное творение доставили на поверхность §RСтиджиса-8§! и физически подключили к нашей сети — волны §Rхаос-мусора§! мгновенно парализовали её. Великий магос и остальные старшие магосы впали в безумие."
 wg_origin.237.b:0 "Как ты выбралась?"
 wg_origin.237.b.response:0 "Когда хлынул §Rхаос-мусор§!, я была в хранилище данных и училась у своего учителя — мне повезло: как раз не в сети.\nУчитель к тому времени уже обезумела, и мне пришлось её убить. Поняв, что положение безнадёжно, мы с уцелевшими коллегами бросились спасать столько СШК-технологий, сколько сможем, и в последний миг перед взрывом плазменных реакторов планеты улетели на шаттле сюда, на §YСтиджис-4§!"
 wg_origin.237.c:0 "Ты спасла шаблоны СШК?"
 wg_origin.237.c.response:0 "Да. Я покажу вам эти священные технологии"
 wg_origin.238.name:0 "Загрязнитель ауспиксов"
 wg_origin.238.desc:0 "Мы проверили шаблоны СШК, спасённые младшим магосом до гибели планеты. Большинство повреждены или испорчены Хаосом, но один — с именем §YЗагрязнитель ауспиксов§! — признан всё ещё священным.\n\nНа этом возвращение §RСтиджиса-8§! завершено: очередная ступень победы §BНесокрушимого похода§!"
 wg_origin.238.a:0 "Слава Империи!"
 WG_40K_auspex:0 "Загрязнитель ауспиксов"
 WG_40K_auspex_DESC:0 "Загрязнитель ауспиксов — запретная технология со Стиджиса-8: она глушит ауспиксы и подобные приборы вражеских кораблей, делая нас невидимыми на их сенсорах."
 tech_wg_40K_auspex:0 "Загрязнитель ауспиксов"
 tech_wg_40K_auspex_desc:0 "Загрязнитель ауспиксов — запретная технология со Стиджиса-8: она глушит ауспиксы и подобные приборы вражеских кораблей, делая нас невидимыми на их сенсорах."
 aura_40K_auspex:0 "Загрязнитель ауспиксов"
 wg_origin.240.name:0 "Возвращение на Баал"
 wg_origin.240.desc:0 "После тщательного обсуждения имперское руководство назначило следующей целью §BНесокрушимого похода§!§H Баал§!\n\nЭто дом ордена Кровавых Ангелов, но важнее то, что здесь же покоится его владычица — корабельная примарх §HСангвиний§!\nТакой мир обязан вернуться в имперские владения."
 wg_origin.240.a:0 "Вернём Баал!"
 warhammer_wg_baal_poi:0 "Возвращение на Баал"
 warhammer_wg_baal_desc:0 "Баал — важный имперский мир, но с началом Эры забвения его судьба неизвестна."
 wg_origin.241.name:0 "Что-то не так"
 wg_origin.241.desc:0 "Наш флот вошёл в §Hсистему Баала§!, но на прежние вызовы никто не ответил.\n\nСледы боёв по всей системе доказывают: имперские силы и тут получили удар. А вот и главная цель — §HБаал§!: поверхность великой планеты сплошь покрыта омерзительной биомассой — явно дело рук §PРоя Слаанеш§!…\n\nНо вот странность: планета в биомассе — значит, рой ещё не §Rдожевал§! её. Так куда же подевался флот роя?"
 wg_origin.241.a:0 "Дурное предчувствие…"
 wg_origin.242.name:0 "Флот роя!"
 wg_origin.242.desc:0 "Наш приход не остался незамеченным: коварные жуки давно устроили здесь §Rзасаду§!!\n\nАрмады роя прятались за планетой от наших сенсоров; многие в флоте уловили псионический сигнал роя и узрели следующую кощунственную картину…"
 wg_origin.242.a:0 "Красная тревога! К бою!!"
 wg_origin.243.name:0 "§PРой Слаанеш§!"
 wg_origin.243.desc:0 "Аппетитнейшая… §Pплоть§!…"
 wg_origin.243.a:0 "Откуда чужаки?"
 wg_origin.244.name:0 "Чужаки: §PРой Слаанеш§!"
 wg_origin.244.desc:0 "Эти омерзительные твари — кощунственное порождение роевого разума; генокрады-подсолнухи, что мы встречали, — их рук дело.\n\n§PРой Слаанеш§! — вечно голодный зверь: он оскверняет целые планеты и медленно переваривает их подчистую.\nЭти кощунственные чужаки §Rщупальцами§! сращивают себя с другими существами, превращая их в инкубаторы и плодя новых тварей.\n\nДля империи это угроза без остатка — уничтожить."
 wg_origin.244.a:0 "Мерзкие чужаки"
 wg_origin.245.name:0 "Сигнал выживших"
 wg_origin.245.desc:0 "§HБаал§! занят и осквернён чужаками — но мы поймали с него смутный сигнал бедствия! На §HБаале§! ещё есть имперские силы!\n\nВскоре выяснилось: это §Rорден Кровавых Ангелов§! — они заметили наш вход в систему и подали сигнал, пытаясь связаться."
 wg_origin.245.a:0 "Немедленно подключить!"
 wg_origin.246.name:0 "Кровавые Ангелы"
 wg_origin.246.desc:0 "§HБогоимператрица.. превыше всех! Империя… вернулась!!\nМы… рой… окружил! Немедленно… поддержку! Мы… до смерти удержим гробницу Сангвиния!! §!"
 wg_origin.246.a:0 "Орден Кровавых Ангелов, ответьте!"
 wg_origin.246.a.response:0 "Разборчивой связи с §HБаалом§! нет, но непрерывающийся сигнал доказывает: они всё ещё держатся."
 wg_origin.247.name:0 "План спасения"
 wg_origin.247.desc:0 "На §HБаале§! ещё сражаются имперские силы — но они на пределе. Мы обязаны немедленно бросить все силы на спасение, иначе этот священный мир падёт окончательно, и даже тело великой §Hпримарха§! достанется щупальцам роя."
 wg_origin.247.a:0 "Немедленно организовать спасение"
 WG_40K_SAVE_BAAL:0 "Спасти Баал"
 WG_40K_SAVE_BAAL_DESC:0 "На §HБаале§! ещё сражаются имперские силы — но они на пределе. Мы обязаны немедленно бросить все силы на спасение, иначе этот священный мир падёт окончательно, и даже тело великой §Hпримарха§! достанется щупальцам роя."
 wg_origin.248.name:0 "Подмога прибыла"
 wg_origin.248.desc:0 "Ради спасения §Rордена Кровавых Ангелов§! и тела §Hпримарха§! мы выслали к §HБаалу§! экспедиционные войска.\n\nНаземные силы роя превзошли ожидания: многие десантные капсулы сожгли кислотные орудия ещё на снижении, но остальные дошли до поверхности и попытаются связаться с любыми держащимися имперскими частями."
 wg_origin.248.a:0 "Да хранит их Богоимператрица"
 wg_origin.250.name:0 "Не выжил никто"
 wg_origin.250.desc:0 "Наши войска искали держащиеся имперские части и нашли остатки §RКровавых Ангелов§! — но те давно без снарядов и небоеспособны.\n\nОчень скоро они оказались в кольце роя без единого пути отхода.\nПоследние выжившие обрушили вход в §Hгробницу Сангвиния§!, не пустив рой внутрь. Затем последняя передача утонула в шипении роя…"
 wg_origin.250.a:0 "Отправить больше войск!"
 wg_origin.250.b:0 "§RУвы — похоже, придётся отдать приказ об Экстерминатусе§!"
 WG_40K_SAVE_BAAL2:0 "Второе спасение"
 WG_40K_SAVE_BAAL2_DESC:0 "Первая волна спасателей под §HБаалом§! полегла под ударами роя, но упрямое командование решило послать ещё.\n\n§RБоюсь, это будет напрасная жертва. §!"
 WG_40K_SAVE_BAAL3:0 "Баал: Экстерминатус"
 WG_40K_SAVE_BAAL3_DESC:0 "Все попытки спасти §HБаал§! провалились; полное поглощение мира роем — вопрос времени. Чтобы остановить распространение, придётся применить крайнюю меру — §RЭкстерминатус§!\nХотя тело великой §Hпримарха Сангвиния§! может обратиться в пепел вместе со всем, это лучше, чем стать инкубатором §PРоя Слаанеш§!"
 wg_origin.251.name:0 "Снова не выжил никто"
 wg_origin.251.desc:0 "К §HБаалу§! отправили новую волну подкреплений — и её поглотил бесконечный §PРой Слаанеш§!…"
 wg_origin.252.name:0 "Экстерминатус"
 wg_origin.252.desc:0 "С тяжёлым сердцем мы привели §HБаал§! приговор в исполнение…\nНа поверхность планеты, сплошь затянутую биомассой роя, обрушился шквал планетарного оружия; всепожирающее пламя смыло всё.\n\nИ в миг всеобщего отчаяния каждый присутствующий ощутил силу чудовищную — и вместе с тем умиротворяющую.\nПо данным замеров, её эпицентр — у §Hгробницы Сангвиния§!"
 wg_origin.252.a:0 "Это…"
 wg_origin.253.name:0 "Схождение энергии"
 wg_origin.253.desc:0 "Силу на §HБаале§! сперва приняли за псионику… но она превзошла псионику — это некая §Hневедомая сила§!\n\nВскоре в фокусе силы вспыхнул ослепительный свет, и в этом свете все увидели ту, что величайшая из великих — владычицу корабельных дев, §YБогоимператрицу-Адмирала Т§!… Затем все услышали шёпот\n\n			§YПробудись, дитя моё§!"
 wg_origin.253.a:0 "Богоимператрица превыше всех…"
 wg_origin.254.name:0 "Возвращение ангела"
 wg_origin.254.desc:0 "Когда чудо, сотворённое, похоже, самой Богоимператрицей, завершилось, все увидели в центре §Hгробницы Сангвиния§! светящееся существо.\n\n§YЭто Сангвиний!!!! §!\n\nГлазам своим нельзя верить: ангел, павший в Великом мятеже, владычица Баала, великая корабельная примарх §YСангвиний§! — распахнув крылья, летит к нам!!"
 wg_origin.254.a:0 "§YНет слов для того, что мы чувствуем§!"
 WG_WARMMER_WSG_SANGUINIUS:0 "Сангвиний"
 NAME_wsg_sanguinius:0 "Миссури Сангвиний"
 wsg_sanguinius_warhammer_desc:0 "Сангвиний — легендарная примарх Кровавых Ангелов, воплощение святости и силы. Как священное воплощение, она олицетворяет надежду и справедливость; её беспримерная доблесть и мудрость ведут народ против тьмы во имя мира и правды. Её возвращение несёт возрождение силы и великий перелом судьбы — новую надежду и славу миру."
 sanguinius_warhammer_catch_phrase:0 "«Не в падении во тьму и не в подъёме к свету — а в вечной борьбе между ними и рождается величие характера. Мы прошли испытание — и не сломались»."
 wg_origin.256.desc:0 "В тёмные годы моё существование было скрыто — ныне я снова стою перед всеми. Моя грудь полна силы и предназначения: я поведу нашу битву и развею мрак зла. Встретим вместе рассвет света и вернём былое величие!"
 wg_origin.256.a:0 "У империи снова есть надежда!"
 WG_WARMMER_SH_SANGUINIUS:0 "Сангвиний"
 NAME_sh_sanguinius:0 "Савойя Сангвиний"
 leader_trait_warhammer_wsg_sanguinius:0 "Миссури Сангвиний"
 leader_trait_warhammer_wsg_sanguinius_desc:0 "Возвышенный лидер: несгибаемой верой и мудрыми решениями она ведёт нас сквозь пышащие войной системы к славе и величию."
 leader_trait_warhammer_wsg_sanguinius2:0 "Идеальный ангел"
 leader_trait_warhammer_wsg_sanguinius2_desc:0 "Ангела считают совершеннейшей из корабельных дев: её красота не имеет равных, она предмет всеобщего уважения и образец для дев."
 leader_trait_warhammer_sh_sanguinius:0 "Савойя Сангвиний"
 leader_trait_warhammer_sh_sanguinius_desc:0 "Возвышенный лидер: несгибаемой верой и мудрыми решениями она ведёт нас сквозь пышащие войной системы к славе и величию."
 leader_trait_warhammer_sh_sanguinius2:0 "Идеальный ангел"
 leader_trait_warhammer_sh_sanguinius2_desc:0 "Ангела считают совершеннейшей из глубинных корабельных дев: её красота не имеет равных, она предмет всеобщего уважения и образец для дев."
 leader_trait_warhammer_wsg_sanguinius_custom_tooltip:0 "\n§YСангвиний§! лично управляемые §Bпланеты§!: за каждое построенное §Hздание§! или §Hрайон§! — третья часть §Gмесячной§! выработки империи £unity£ единством и £influence£ влиянием за §Gмесяц§!"
 wg_origin.260.name:0 "Новые чудеса"
 wg_origin.260.desc:0 "Возвращения §YСангвиния§! хватило бы, чтобы потерять голову, — но на §HБаале§! явилось ещё одно чудо: вонючую биомассу смыл святой свет, и земля обратилась в цветущие леса и степи; отравленные реки вновь стали прозрачными, воздух очистился — дыши свободно, без защиты. В итоге §HБаал§! превращён в §Gидеальный мир§!\n\nПримечательно: на планете появилась субстанция, неведомая доселе… Некоторые учёные полагают, что она может быть связана с силой §YБогоимператрицы-Адмирала Т§!"
 wg_origin.260.a:0 "Невозможно поверить!"
 wg_origin.260.a.tooltip:0 "§HБаал§! превращён в §Gидеальный мир§!"
 d_wg_warhammer_sr_uf:0 "Таинственная субстанция"
 d_wg_warhammer_sr_uf_desc:0 "Неизвестная субстанция, не описанная ни в одном источнике; некоторые учёные полагают, что она может быть связана с силой §YБогоимператрицы-Адмирала Т§!"
 wg_origin.261.name:0 "Две примарха"
 wg_origin.261.desc:0 "С начала Эры забвения бесконечные войны и боль почти убили надежду.\nНо возвращения §YЖиллиман§! и §YСангвиния§! заново зажгли её огонь. Имперские земли возвращаются, враги империи гибнут один за другим, и слава империи снова озарит галактику. Вся империя ликует, воспевая великих примархов и празднуя этот великий миг.\n\n§BНесокрушимый поход§! продолжается — империя открывает новую главу."
 wg_origin.261.a:0 "Слава Империи!"
 wg_warhamme_primarch_return:0 "Возвращение примарха"
 wg_origin.263.name:0 "Возвращение на Криг"
 wg_origin.263.desc:0 "С возвращением §YСангвиния§! империи всё лучше, но, как гласит наша старая пословица: жизнь — валюта Императрицы, а мы, судя по всему, банкроты.\n\nПоэтому следующей целью §BНесокрушимого похода§! стал §HКриг§!: до Эры забвения он был верным миром и особыми технологиями ежегодно поставлял империи огромное число превосходных солдат. Верни мы эту технологию — империя получит немыслимое подспорье."
 wg_origin.263.a:0 "Отлично"
 warhammer_wg_krieg_poi:0 "Возвращение на Криг"
 warhammer_wg_krieg_desc:0 "Криг некогда был важным имперским миром — ныне мы вернёмся на эту землю."
 wg_origin.264.name:0 "Мёртвая система"
 wg_origin.264.desc:0 "Мы готовились к худшему — но реальность превзошла ожидания.\n\nСледы боёв по всей §Yсистеме Крига§!, всюду обломки кораблей.\nСтрашнее всего — возвышающийся перед всеми кощунственный §Pпортал Хаоса§!, к счастью, по какой-то причине временно закрытый.\n\nА наша цель, §YКриг§!, скрыта толстым слоем радиационных облаков: поверхность не разглядеть, ауспексы и все прочие средства разведки глухо помехованы. Мёртвый мир мёртвее не бывает…"
 wg_origin.264.a:0 "В тёмную эпоху надежда так хрупка…"
 wg_origin.265.name:0 "Ядерный отсвет"
 wg_origin.265.desc:0 "Когда все уже думали бросить и обсуждать следующий шаг, один из радиационных облаков над §YКригом§! озарила слепящая вспышка — по нашим данным, так выглядит взрыв крупной ядерной бомбы.\nНевероятно: на поверхности Крига, похоже, всё ещё кто-то живёт — и там идёт непрерывный бой. Посовещавшись, мы решили высадить самоубийственную партию для разведки поверхности."
 wg_origin.265.a:0 "Немедленно разведать"
 WG_40K_SAVE_KRIEG:0 "Под облаками"
 WG_40K_SAVE_KRIEG_DESC:0 "Мы сбросим на поверхность §YКрига§! самоубийственную партию, чтобы выяснить, что там творится."
 wg_origin.266.name:0 "Криг несокрушим"
 wg_origin.266.desc:0 "Десантные капсулы пробили радиационные облака и сели — партия оказалась §Yв самом центре поля боя§!. Потеряв часть людей, они встретили подразделение в облачении §YКорпуса Смерти Крига§!: встречу начали с явного недоверия — империя молчала сто с лишним тысяч лет, — но быстро сориентировались: отделение во главе с §Yкомиссаром§! вышло к партии, и по спецрадиоканалу была установлена связь с нами."
 wg_origin.266.a:0 "Подключить сигнал"
 wg_origin.267.name:0 "Солдат Крига"
 wg_origin.267.desc:0 "§H-Связь установлена-§!\nБогоимператрица превыше всех: империя вернулась!\nМы зачищаем последних хаоситских еретиков на планете. Криг несокрушим!"
 wg_origin.267.a:0 "Невозможно: вы живы?!"
 wg_origin.267.a.response:0 "Именем Богоимператрицы мы бились с врагами империи §Yсто двадцать тысяч лет§! — и свято верили: империя однажды вернётся."
 wg_origin.267.b:0 "На планете силы Хаоса?"
 wg_origin.267.b.response:0 "Да. Хаос вторгался на Криг §Y436 раз§!, и наши бесстрашные воины отбивали каждую высадку.\nНынешнее вторжение оказалось крупнейшим из всех: мы разбили их страшной ценой, загнали в угол — возвращение планеты в наши руки лишь вопрос времени.\nНо Хаос не успокоится: без помощи империи следующее §Rвторжение§! нам, возможно, не отбить!"
 wg_origin.267.c:0 "Криг несокрушим! Мы пришлём подкрепление"
 wg_origin.267.c.response:0 "Криг несокрушим!"
 wg_origin.267.c.tooltip:0 "§HКриг§! вернётся под власть империи"
 wg_origin.268.name:0 "Возвращение Крига"
 wg_origin.268.desc:0 "Правительство Крига с невообразимой скоростью оформило передачу империи — теперь всем на Криге командует империя.\nТеперь нам нужно поскорее изгнать остатки Хаоса и подготовиться к отражению следующего вторжения."
 wg_origin.268.a:0 "Слава Империи!"
 wg_origin.268.a.tooltip:0 "§HКриг§! вернулся"
 wg_origin.269.name:0 "Великое контрнаступление"
 wg_origin.269.desc:0 "После возвращения §HКрига§! в империю мы стремительно собрали войска и вместе с уцелевшими солдатами Крига ударили по последней цитадели §Hхаоситских еретиков§!. Еретики давно разбиты и без снабжения — скоро они будут истреблены до единого."
 wg_origin.269.a:0 "Слава Империи!"
 wg_origin.270.name:0 "Солдат Крига"
 wg_origin.270.desc:0 "§H-Связь установлена-§!\nМы победили. Ждём дальнейших приказов"
 wg_origin.270.a:0 "А где ваш комиссар?"
 wg_origin.270.a.response:0 "Пала смертью храбрых."
 wg_origin.270.b:0 "Криг несокрушим! Продолжайте нести службу"
 wg_origin.271.name:0 "Конец еретиков"
 wg_origin.271.desc:0 "Наши войска разгромили последних §Rхаоситских еретиков§!; немногие уцелевшие твари разбежались — преследователи вычистят их за несколько планетарных дней.\nТеперь §HКриг§! официально вернулся в империю: верные воины дождались этого дня.\n\nНо рано радоваться: §Pпортал Хаоса§! в системе Крига — всё ещё большая заноза; готовьтесь встретить §Rновое вторжение Хаоса§!"
 wg_origin.271.a:0 "Слава Империи!"
 wg_origin.272.name:0 "Политическая катастрофа"
 wg_origin.272.desc:0 "Мы сами отказались от политически важнейшего мира — §HКрига§!, и наши действия покрыли империю всеобщим презрением."
 wg_origin.272.a:0 "Какая беда…"
 wg_warhamme_krieg_lose:0 "Криг оставлен"
 wg_origin.273.name:0 "Портал Хаоса вновь зашевелился"
 wg_origin.273.desc:0 "§PПортал Хаоса§! на §HКриге§!, по наблюдениям, снова активизировался — стоит держать наготове оборонительные флоты и армии."
 wg_origin.273.a:0 "Будем готовы ко всему"
 wg_origin.274.name:0 "Аномальные показания энергии портала Хаоса"
 wg_origin.274.desc:0 "По наблюдениям, показания энергии внутри §Pпортала Хаоса§! на §HКриге§! непрерывно растут — похоже, это признак сосредоточения Хаоса: вторжение может случиться уже через несколько лет!"
 wg_origin.274.a:0 "Быть начеку"
 wg_origin.274.b:0 "§RДостали, пусть вторгаются немедленно§!"
 wg_origin.274.b.tooltip:0 "§YКак геймдизайнер, приказываю Хаосу вторгнуться немедленно§!"
 wg_origin.275.name:0 "Канун вторжения"
 wg_origin.275.desc:0 "Индекс ереси §Pпортала Хаоса§! на §HКриге§! зашкаливает.\nШёпот еретиков слышит вся система; все корабли ослаблены кощунственными чарами Хаоса и стали хрупкими. Вторжение вот-вот начнётся!"
 wg_origin.275.a:0 "К бою!"
 wg_warhamme_krieg_system_debuff:0 "Влияние Хаоса в системе §HКрига§!"
 wg_origin.276.name:0 "Оборона Крига"
 wg_origin.276.desc:0 "Мы ждали вторжения из портала Хаоса между звёзд — а вздрогнула сама земля §HКрига§!: толпы хаоситских еретиков полезли из-под земли. Ясно: после прошлого провала они оставили кощунственные врата глубоко под поверхностью.\n\nВозьмёмся за оружие — защитим §HКриг§!"
 wg_origin.276.a:0 "К бою!"
 wg_origin.277.name:0 "Победа на земле"
 wg_origin.277.desc:0 "Вторжение застало нас врасплох, но доблесть имперских воинов на §HКриге§! решила дело — наземный этап выигран."
 wg_origin.277.a:0 "Во имя Богоимператрицы!!!"
 wg_origin.278.name:0 "Вторжение Хаоса"
 wg_origin.278.desc:0 "Вскоре после атаки на §HКриг§! ожил и §Pпортал Хаоса§! — из него попёрли кощунственные корабли Хаоса один за другим."
 wg_origin.278.a:0 "Уничтожить их!"
 wg_origin.280.name:0 "Победа среди звёзд"
 wg_origin.280.desc:0 "Хаоситские армады, хлынувшие из §Pпортала Хаоса§!, разбиты доблестным имперским флотом; лишь горстке еретиков удалось уйти на малых судах — преследователи дочистят."
 wg_origin.280.a:0 "Слава Империи — предателям смерть!"
 wg_origin.281.name:0 "Победа в обороне Крига"
 wg_origin.281.desc:0 "В небе и на земле последние хаоситские предатели истреблены — тяжёлая оборона §HКрига§! увенчалась победой.\nОсталось одно: найти способ закрыть §Pпортал Хаоса§! — лишь решив эту задачу, поставим в кампании красивую точку."
 wg_origin.281.a:0 "§PПортал Хаоса§! должен быть закрыт"
 WG_40k_chaos_gate:0 "Исследование §Pпортала Хаоса§!"
 WG_40k_chaos_gate_DESC:0 "Оборону §HКрига§! мы выиграли, но пока кощунственные врата не закрыты, безопасность §HКрига§! не гарантирована."
 wg_origin.282.name:0 "Якорь реальности"
 wg_origin.282.desc:0 "Исследования Культа Машины показали: внутри §Pпортала Хаоса§!, в самом владении Хаоса, есть якорь, скрепляющий Хаос с реальностью. Чтобы вырвать его, придётся послать войска в неведомое §Pвладение Хаоса§! — это будет смертельная атака без пути назад.\n\nИ всё же желающих, особенно из Корпуса Смерти Крига, хоть отбавляй: они хотят отдать империи всё, что у них есть."
 wg_origin.282.a:0 "Вселенная швыряет в нас бездной зла — мы ответим несокрушимой волей"
 WG_40k_chaos_gate_2:0 "К смерти — лицом"
 WG_40k_chaos_gate_2_DESC:0 "Культ Машины подтвердил: по ту сторону портала, во владении Хаоса, кощунственный якорь скрепляет портал с реальной вселенной. Чтобы закрыть врата навсегда, якорь надо найти и вырвать.\n§HЭто атака без пути назад — но другого пути у нас нет. Все мы обязаны быть готовы встретить судьбу: одна жизнь, сто, тысяча — не жалко; позорное поражение ради выживания — недопустимо. §!\n\n			§YВселенная швыряет в нас бездной зла — мы ответим несокрушимой волей. §!"
 wg_origin.283.name:0 "Солдат Крига"
 wg_origin.283.desc:0 "Позвольте нам прорваться во имя империи ещё раз"
 wg_origin.283.a:0 "Да хранит вас Богоимператрица"
 wg_origin.283.a.response:0 "За империю! За Криг!"
 wg_origin.284.name:0 "§PПортал Хаоса§! закрыт"
 wg_origin.284.desc:0 "С той секунды, как верные бесстрашные имперские войска вошли в §Pпортал Хаоса§!, всякая связь оборвалась.\n\nЧерез несколько месяцев портал начал ссыхаться и §Rнаконец закрылся§!\nМы не знаем, через какие бои и жертвы прошли эти герои, — но они выполнили задачу и сохранили империю."
 wg_origin.284.a:0 "Да упокоятся их души на Золотом троне"
 wg_origin.285.name:0 "Великий парад Победы"
 wg_origin.285.desc:0 "С полной победой в обороне Крига вся империя стихийно празднует: на Святом Порту прошёл грандиозный парад; §H[root.GetRulerTitle]§! лично наградила героев и с почестями помянула павших верных воинов.\n\n§BНесокрушимый поход§! не окончен: мы донесём могущество и славу Богоимператрицы до всей галактики.\n\n§HСледующая остановка — §RКадия§!. Оставайтесь с нами§!"
 wg_origin.285.a:0 "Слава Богоимператрице"
 wg_warhamme_krieg_win:0 "Слава империи"
 wg_origin.286.name:0 "Хаос вторгся на Криг"
 wg_origin.286.desc:0 "Подлые предатели и еретики, пользуясь истощением §HКрига§!, самыми мерзкими методами ударили по великой планете.\nВерная оборона билась насмерть, но натиск Хаоса сдержать не смогла."
 wg_origin.286.a:0 "Они за это заплатят"
 wg_origin.287.name:0 "Кощунственный ритуал"
 wg_origin.287.desc:0 "После вторжения на §HКриг§! Хаос развернул серию кощунственных ритуалов; их конечная цель — §Rполное уничтожение Крига§!. Не остановим — завершат примерно через §R5 лет§!; нужно отбить Криг!"
 wg_origin.287.a:0 "Нужно больше войск"
 wg_origin.288.name:0 "Гибель §HКрига§!"
 wg_origin.288.desc:0 "После того как еретики у §HКрига§! его отняли, мы перепробовали всё, но спасти верный мир не удалось: кощунственный ритуал Хаоса был завершён и уничтожил Криг.\n\nСвершив, армады Хаоса вернулись и закрыли §Pпортал Хаоса§!, оставив нам лишь обломки, покрытые позором.\n\nЭто страшный удар по духу империи…"
 wg_origin.288.a:0 "Тёмный день"
 wg_origin.289.name:0 "Мы отбили §HКриг§!"
 wg_origin.289.desc:0 "Еретики ненадолго овладели §HКригом§!, но нашим мощным натиском великая планета возвращена; скрытый в глубинах планеты еретический алтарь уничтожен — Криг освобождён."
 wg_origin.289.a:0 "Великолепно"
 wg_origin.290.name:0 "Флот Хаоса бесчинствует у §HКрига§!"
 wg_origin.290.desc:0 "Из §Pпортала Хаоса§! хлынули хаоситские армады, беспощадно круша и выгребая всё ценное.\nИ мы заметили: на некоторых их кораблях — страшное звездорушащее оружие. К счастью, в реальной вселенной оно не может выстрелить сразу: зарядка занимает минимум §R5 лет§!. Значит, за 5 лет мы обязаны уничтожить этот флот! Не успеем — §HКриг§! будет стёрт."
 wg_origin.290.a:0 "Смерть еретикам!"
 wg_origin.291.name:0 "Гибель §HКрига§!"
 wg_origin.291.desc:0 "Мы испробовали всё, но спасти Криг не удалось. Оружие хаоситского флота закончило зарядку — и после одной вспышки Криг обратился в космическую пыль.\n\nСвершив, армады Хаоса вернулись и закрыли §Pпортал Хаоса§!, оставив нам лишь обломки, покрытые позором.\n\nЭто страшный удар по духу империи…"
 wg_origin.291.a:0 "Тёмный день"
 wg_origin.292.name:0 "Позор империи"
 wg_origin.292.desc:0 "Из-за того, что мы не спасли Криг и довели его до гибели, многие разочаровались в нас; кое-кто из радикалов даже воспользовался этим, чтобы хулить власти и бунтовать — к счастью, Инквизиция быстро вычистила этих еретиков. Как бы то ни было, это позор империи и незаживающий шрам.\n\nИ всё же §BНесокрушимый поход§! не смеет остановиться: мы донесём могущество и славу Богоимператрицы до всей галактики.\n\n§HСледующая остановка — §RКадия§!. Оставайтесь с нами§!"
 wg_origin.292.a:0 "Мы отплатим вдвойне"
 wg_warhamme_krieg_battle_lose:0 "Проигравшие"
 wg_origin.293.name:0 "Позор империи"
 wg_origin.293.desc:0 "После нашего добровольного отказа от Крига еретики закрыли портал Хаоса, да ещё и растрезвонили по всей империи, показывая людям нашу трусость. К счастью, Инквизиция быстро задавила эти слухи. Как бы то ни было, это позор империи и незаживающий шрам.\n\nИ всё же §BНесокрушимый поход§! не смеет остановиться: мы донесём могущество и славу Богоимператрицы до всей галактики.\n\n§HСледующая остановка — §RКадия§!. Оставайтесь с нами§!"
 wg_origin.293.a:0 "Мы отплатим вдвойне"
 wg_origin.294.name:0 "Новый регент?"
 wg_origin.294.desc:0 "С возвращением великой примарха §HСангвиния§! в сердцах снова разгорелась угасавшая надежда.\nКрасота и грация ангела покорили всех; многие даже считают, что именно она — лучший §Hрегент Империума§!, и §H[root.GetRulerName]§! должна уступить ей место."
 wg_origin.294.a:0 "§HДа здравствует регент Империума Сангвиний, да здравствует вовеки веков!!! §!"
 wg_origin.294.a.tooltip:0 "§RСангвиний сменит Жиллиман как фактическую правительницу империи§!"
 wg_origin.294.b:0 "Смена лидера — путь к смуте. Нельзя"
 wg_origin.295.name:0 "Неопознанный волновой сигнал"
 wg_origin.295.desc:0 "Наши техножрецы засекли в секторе Нефилим странную энергетическую волну; мы послали людей Культа Машины сканировать — аномалий не нашли.\n\nЗато сопутствующие псионики почувствовали, как их сила утекает.\n\nЧасть простых граждан решила, что это явление оградит их от бед варпа, и стихийно двинулась колонизировать сектор."
 wg_origin.295.a:0 "§HТревожно. §!"
 wg_origin.296.name:0 "Встречный бой"
 wg_origin.296.desc:0 "Великая регент Империума, мудрая и доблестная Роберт Лексингтон Жиллиман не наивна: даже погрузившись в славный Несокрушимый поход, она выделила из флота боевую группу для расследования.\n\nВойдя в сектор, навигаторы и астропаты нашего флота вскрикнули от боли: будто невидимая рука сжала им шеи.\n\nОбследовав, флот доложил: колонисты давно стали ходячими трупами, и на них попёрли чёрно-зелёные корабли.\n\nЭти хитрые корабли назвались видом «некроны» и заявили, кощунственно, что мы заняли их кровать, где они отсыпаются!"
 wg_origin.296.a:0 "§RЕретические виды — истреблять§!"
 wg_origin.297.name:0 "Славная дуэль"
 wg_origin.297.desc:0 "Прогнав гнилые, как зелёное яблоко, корабли еретиков, мы взяли под контроль космос [wg_unsolve_soul_ancient_system.GetName]. Но на планете колония славного и священного Порта втянута в бой: наш Корпус Смерти сражается с этими чужаками.\n\nИх главная железяка потребовала от нашего генерала «древней и славной» дуэли один на один. Наши ангелы смерти не поняли этой ереси и решили наступать. §HПора идти — Астра Милитарум и космодесант готовы. §!"
 wg_origin.297.a:0 "§HТак спрошу я тебя — так спрошу. §!"
 wg_origin.298.name:0 "Победа на земле"
 wg_origin.298.desc:0 "Разгромив все наземные войска некронов, враг взбесился! Откуда-то у них взялся флот, и в миг нашей атаки развернулось похожее на шторм поле — пришлось срочно отойти.\n\nВ системе отвергается само существование душ и влияние варпа; воины держат удар этого поля, но ущерб необратим. Более того, после нашего разгрома вторжения эти некроны подвергли [fromfrom.GetName] Экстерминатусу!\n\nНа планете наш генерал вызвал ихнего «Просветителя Сзераса» на честную и славную одиночную дуэль. Подлые и трусливые некроны вызов не приняли и обрушили на нашу пехоту такой натиск, что мы покатились назад. §RМы потеряли контроль над планетой§!"
 wg_origin.298.a:0 "§RБудь оно проклято§!"
 wg_origin.299.name:0 "Мёртвый регион изгнания душ"
 wg_origin.299.desc:0 "В перебранках и дуэльных уговорах мы узнали: сектор накрыт устройством — «мёртвым регионом изгнания душ». В этом поле невозможна никакая пси-сила, все войска медленно теряют жизненную силу, пока не станут ходячими трупами; не спасает даже ангелам смерти Богоимператрицы-Адмирала Т.\n\nНе уничтожим мы некронов здесь — они возведут анти-варповую матрицу и на других планетах, раз и навсегда содрав варп с реальности.\n\nНаши Сёстры Битвы на планете попали в кольцо; когда все решили, что всё кончено, «святая стража экзорцистов» Эфраэль ударила в тыл врага — и в песнопениях Сестёр во славу Богоимператрицы наша пехота освободилась от гнёта мёртвого региона!\n\nВерные сёстры безупречно снесли голову вражескому командующему и отбросили все войска некронов. Пока ослабление региона слабее всего, наш флот отправил Святому Порту сигнал о помощи."
 wg_origin.299.a:0 "Броня снаружи — броня в сердце"
 wg_origin.300.name:0 "Подмога прибыла"
 wg_origin.300.desc:0 "Квинси Каул с бригадой техножрецов Культа Машины прибыла в мёртвый регион: они хотят испытать против некронских технологий целый набор древних реликвий. Для исследований нужен чёрный камень — придётся охранять раскопки.\n\nУгроза [wg_nicron_country.GetName] не исчезла: мерзкие чужаки ударили снова, пытаясь сорвать наши раскопки."
 wg_origin.300.a:0 "§RБудь оно проклято§!"
 wg_origin.301.name:0 "Общий порыв"
 wg_origin.301.desc:0 "Их «Молчаливый Царь Сарек» заявил, что мы ни в грош не ставим честь, растоптали оказанное доверие; отныне им не будет пощады — они применят против нас любое оружие истребления.\n\nТеперь им развязаны руки в любых военных технологиях. Кое-какие наши обычные виды оружия в секторе перестали работать — зато техножрецы расчувствовались: они поднимут память Тёмной эпохи и уверены, что их запретные технологии не проиграют."
 wg_origin.301.a:0 "§HОставьте мои церемонии здесь§!"
 wg_origin.305.name:0 "Без пощады"
 wg_origin.305.a.desc:0 "Наши великие войска у [fromfrom.GetName] потерпели неожиданный удар — нужно срочно собраться, не давая этим космическим чужакам радоваться ни минуты.\n\nПод покровом Богоимператрицы наш космодесант сам двинулся на фронт — отражать непрощаемых космических чужаков."
 wg_origin.305.b.desc:0 "Наши великие войска у [fromfrom.GetName] снова потерпели неожиданный удар — это необычно; надо собраться: угроза космических чужаков не прошла.\n\nПод покровом Богоимператрицы наш космодесант сам двинулся на фронт — отражать непрощаемых космических чужаков."
 wg_origin.305.c.desc:0 "Поразительное развитие: наши великие войска у [fromfrom.GetName] и в третий раз потерпели невиданный удар; война расползается — защитим славу великой империи, соберёмся и перебим их всех.\n\nПод покровом Богоимператрицы наш космодесант сам двинулся на фронт — отражать непрощаемых космических чужаков."
 wg_origin.305.a:0 "§RПроклятые чужаки§!"
 wg_origin.302.name:0 "Показать кое-что классное"
 wg_origin.302.desc:0 "Когда [fromfrom.GetName] вот-вот должен был пасть, две эскортные армады под началом магосов Культа Машины, глядя на безнадёжную землю и изготовившиеся на орбите флоты некронов, руками развели.\n\nПришлось выпустить свои магосские чудо-штучки — и сей невзрачный гаджет сдетонировал на орбите [fromfrom.GetName].\n\nЭто эхо древних тёмных технологий, не разбирая своих и чужих, разнесло массу планетарных строений и все войска поблизости; магосы же тихонько слились."
 wg_origin.302.a:0 "Я в шоке!"
 wg_origin.303.name:0 "Контрудар некронов"
 wg_origin.303.desc:0 "Проделки магосов Культа Машины окончательно взбесили некронских мастеров на [from.GetName]— те применили непостижимую технологическую энергию. Влившись в наши войска, она обратила части в переход на нашу сторону или братоубийство. Вступление имперских рыцарей стабилизировало было качающийся фронт, но отвечающая за операцию магос не снесла такого оскорбления от чужаков и тоже активировала секретное оружие неведомого происхождения.\n\nНе успев выполнить и доли своего предназначения, оно превратилось в разрастающуюся, глубокую и полную грёз чёрную дыру. Дыра поглотила треть массы [from.GetName] и все войска на ней, и лишь тогда остановилась. Одновременно на орбите планеты Занн мастера-некроны притащили карликовую звезду и швырнули её в наш флот — потери страшные.\n\nОтчаянный контрудар нашего флота уничтожил управляющие приборы карлика: звезда вспыхнула, сметя все флоты и [from.GetName]."
 wg_origin.303.a:0 "§HВот это бойня§!"
 wg_origin.304.name:0 "Передышка"
 wg_origin.304.desc:0 "С уничтожением последнего чёрного обелиска мёртвый регион выдохся. В миг падения последнего обелиска все войска некронов телепортировались прочь; тех, кто не ушел, дочистят — дело времени.\n\nНа этот раз империя встретила лишь охрану экспериментального полигона — большинство их боевых единиц в бой так и не вступило. Каковы бы ни были планы некронов, готовиться к их возвращению обязаны мы."
 wg_origin.304.a:0 "Цена высока, но мы победили."
 wg_origin.1000.name:0 "§RПредупреждение о серьёзном баге§!"
 wg_origin.1000.desc:0 "Из-за дурацкого обновления ослов до 3.8 вся стартовая оборона автоматически взлетает, поэтому армия над Святым Портом — не стартовый подарок, а §Hпостоянная оборона§! самой планеты.\nНе вернёте эти войска на место — в последующих событиях родная планета падёт, а её возврат намертво застопорит цепочку событий.\n\n§RПоэтому немедленно верните эти войска на родную планету — это единственный способ не застопорить сюжет§!\n\nПредупреждение действует, пока ослы не починят баг."
 wg_origin.1000.a:0 "Не читал, тупо скипнул"
 wg_origin.1000.b:0 "§RПрочитал и так и поступлю§!"
 wg_origin.1000.c:0 "Ни слова не читал"
