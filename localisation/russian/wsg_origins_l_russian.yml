 WG_STC_9_PROJECT:0 "Сигнал СШК"
 WG_STC_9_PROJECT_DESC:0 "Поисковик СШК поймал слабый сигнал СШК — можно отправиться за ним, но помните: где возможность — там и риск.\n\nБонус: учёная получает §G50–200§! опыта"
 WG_STC_10_PROJECT:0 "Сигнал СШК"
 WG_STC_10_PROJECT_DESC:0 "Поисковик СШК поймал слабый сигнал СШК — можно отправиться за ним, но помните: где возможность — там и риск.\n\nБонус: учёная получает §G50–200§! опыта"
 WG_STC_11_PROJECT:0 "Отказ от возврата СШК"
 WG_STC_11_PROJECT_DESC:0 "По разным причинам §R(например, сигнал на другом краю галактики)§! нам не хватает сил собрать эти бесценные шаблоны СШК — придётся их бросить.\n\n§YВсе невостребованные сигналы СШК будут удалены — до новой активации §GПоисковика СШК§!§!"
 wg_origin.126.name:0 "Сбор СШК"
 wg_origin.126.desc:0 "С помощью Поисковика СШК мы нашли несколько слабых §Yсигналов СШК§! — верни мы эти бесценные шаблоны, они подстегнут возрождение империи.\nНо помните: где возможность — там и риск. СШК могли давно §Hвыйти из строя§! и даже §Rподвергнуться порче§! — нужна двойная осторожность.\n\n§RЗаметки:\n1. Перезарядка Поисковика СШК не конфликтует с прочими реликвиями\n2. Поисковик можно активировать многократно — с уже найденными сигналами СШК это не конфликтует§!"
 wg_origin.126.a:0 "Отправить членов Культа Машины"
 wg_origin.126.a.tooltip:0 "§YСигналы СШК§! отмечены в журнале заданий"
 wg_origin.127.name:0 "СШК-шаблон возвращён"
 wg_origin.127.desc:0 "Наши техножрецы нашли целевой §Yсигнал СШК§! и успешно завершили изъятие.\nПосле серии проверок они установили: это §Yдействующий СШК-шаблон§! — его уже доставили на §H[wg_warhammer_holy_harbor_target.GetName]§! и ждут дальнейших испытаний для определения функций."
 wg_origin.127.a:0 "Немедленно испытать"
 wg_origin.127.a.tooltip:0 "Получить случайную §Yтехнологию СШК§!"
 wg_origin.128.name:0 "Данные из СШК-шаблона извлечены"
 wg_origin.128.desc:0 "Мы нашли целевой §Yсигнал СШК§!, но, увы, шаблон был частично повреждён.\nК счастью, техножрецы вытащили из него кое-что §Hценное§!: данные, связанные с §Bнаукой§!"
 wg_origin.128.a:0 "Отлично"
 wg_origin.128.a.tooltip:0 "Получить случайный §Yнаучный модификатор СШК§!"
 wg_origin.129.name:0 "Данные из СШК-шаблона извлечены"
 wg_origin.129.desc:0 "Мы нашли целевой §Yсигнал СШК§!, но, увы, шаблон был частично повреждён.\nК счастью, техножрецы вытащили из него кое-что §Hценное§!: данные, связанные с §Yинженерией и стройкой§!"
 wg_origin.129.a:0 "Отлично"
 wg_origin.129.a.tooltip:0 "Получить случайный §Yстроительный модификатор СШК§!"
 wg_origin.130.name:0 "Данные из СШК-шаблона извлечены"
 wg_origin.130.desc:0 "Мы нашли целевой §Yсигнал СШК§!, но, увы, шаблон был частично повреждён.\nК счастью, техножрецы вытащили из него кое-что §Hценное§!: данные, связанные с §Gнаселением§!"
 wg_origin.130.a:0 "Отлично"
 wg_origin.130.a.tooltip:0 "Получить случайный §Yмодификатор СШК по населению§!"
 wg_origin.131.name:0 "СШК-шаблон мёртв"
 wg_origin.131.desc:0 "Мы нашли целевой §Yсигнал СШК§!, но шаблон §Rсильно повреждён§! — восстанавливать его нам нечем.\nХотя кое-какие §Hресурсы§! мы всё же вывезли."
 wg_origin.131.a:0 "Жаль"
 wg_origin.135.name:0 "Испорченный СШК!"
 wg_origin.135.desc:0 "Мы вышли на цель по сигналу СШК — но этот СШК давно §Rиспорчен§!…\n\nНаш великий магос §H[poor_stc_scientist.GetName]§! не успела разорвать физическую связь с испорченным СШК, и её прошёл вал вирусов и мёртвого кода. Жизнь она отстояла, но неудачная операция изменила её навсегда."
 wg_origin.135.a:0 "Будь оно проклято…"
 wg_origin.136.name:0 "Испорченный СШК!!"
 wg_origin.136.desc:0 "Мы вышли на цель по сигналу СШК — но, увы, этот СШК давно §Rиспорчен§!….\n\nНаш великий магос §H[poor_stc_scientist.GetName]§! не успела разорвать физическую связь с испорченным СШК, и волна вирусов и мёртвого кода практически мгновенно сожгла её мозг."
 wg_origin.136.a:0 "Проклятье!"
 site_wg_mars:0 "Марсианское прошлое"
 site_wg_mars_desc:0 "Марс когда-то был величайшим кузнечным миром — ныне лишь обломки и руины. Соберём подъёмную партию и посмотрим, что ещё можно найти."
 site_wg_mars_2:0 "Марсианское прошлое"
 site_wg_mars_2_desc:0 "Марс когда-то был величайшим кузнечным миром — ныне лишь обломки и руины. Соберём подъёмную партию и посмотрим, что ещё можно найти."
 wg_origin.137.name:0 "825-й Объединённый поход"
 wg_origin.137.desc:0 "Великий марсианский кузнечный мир в 825-м Объединённом походе был уничтожен чудовищной антиматерийной бомбой, сброшенной флотом §Hтысячекратной победительницы Абаддон Ямато§!, Военачальницы Хаоса.\nКогда все решили, что это конец и §Y[owner.GetName]§! вот-вот падёт, владычица корабельных дев §YБогоимператрица-Адмирал Т§! явила чудо: её рёв в одиночку уничтожил весь Объединённый флот Солнечной системы и отбросил Абаддон во владения Хаоса. Итог — §Yпиррова победа§! для [owner.GetName]."
 wg_origin.137.a:0 "§YСлава Богоимператрице-Адмиралу Т§!"
 wg_origin.138.name:0 "825-й Объединённый поход"
 wg_origin.138.desc:0 "Великий марсианский кузнечный мир в 825-м Объединённом походе был уничтожен чудовищной антиматерийной бомбой, сброшенной флотом §Hтысячекратной победительницы Абаддон Рома§!, Военачальницы Хаоса.\nКогда все решили, что это конец и §Y[owner.GetName]§! вот-вот падёт, владычица корабельных дев §YБогоимператрица-Адмирал Т§! явила чудо: её рёв в одиночку уничтожил весь Объединённый флот Солнечной системы и отбросил Абаддон во владения Хаоса. Итог — §Yпиррова победа§! для [owner.GetName]."
 wg_origin.138.a:0 "§YСлава Богоимператрице-Адмиралу Т§!"
 wg_origin.139.name:0 "Наследие Культа Машины"
 wg_origin.139.desc:0 "Большая часть марсианских сооружений уничтожена антиматерийной бомбой, но кое-что глубоко под землёй уцелело. Исследовать эти руины по-прежнему §Rсмертельно опасно§!: нестабильная геология, всё ещё текущие радиационные реакторы, засады опасных сверхъестественных чужаков… И всё же из одного более-менее целого хранилища мы вытащили ценные данные."
 wg_origin.139.a:0 "Продолжать раскопки"
 wg_origin.140.name:0 "Ремонт Железного кольца"
 wg_origin.140.desc:0 "§HЖелезное кольцо§! когда-то было сильнейшими орбитальными доками галактики и устояло даже в гибель Марса. Но без обслуживания многие доки заброшены. Одна из наших целей — отремонтировать их, хотя бы частично.\n\nВ итоге усилиями несчётных членов Культа Машины часть цехов восстановлена: они заявляют, что §Yдух машины§! этих сооружений умиротворён."
 wg_origin.140.a:0 "Отлично"
 wg_origin.140.a.tooltip:0 "§HЖелезные доки§! восстановлены, характеристики выросли"
 wg_origin.141.name:0 "Нашли! Мы нашли!"
 wg_origin.141.desc:0 "Мы нашли главную цель марсианской экспедиции — §HПоисковик СШК§!\nСбор СШК-технологий — один из главных моторов экспансии Культа Машины, а этот артефакт Золотого века умеет искать по всей галактике потерянные сигналы СШК.\n\nВерни мы эти технологии — день возвращения империи на вершину галактики станет куда ближе."
 wg_origin.141.a:0 "Великолепно!"
 wg_stc:0 "Технология СШК"
 wg_stc_desc:0 "СШК (Стандартная шаблонная конструкция) — сложная аналитическая программа, которая, по преданию, содержит все технологии Золотого века корабельных дев"
 tech_stc_1:0 "СШК: Алгоритм кармической награды"
 tech_stc_1_desc:0 "Этот алгоритм родился задолго до Золотого века: он делает переработки добровольнее радости — и поднимает выработку."
 tech_stc_2:0 "СШК: Синий летящий экскаватор"
 tech_stc_2_desc:0 "Шаблон СШК содержит чертёж утраченной инженерной машины, способной радикально поднять скорость строительства."
 tech_stc_3:0 "СШК: Учебная приставка «Сяоба-ван»"
 tech_stc_3_desc:0 "Утраченное персональное обучающее устройство: немного просвещения имперских масс нашей власти не повредит."
 tech_stc_4:0 "СШК: Флешка"
 tech_stc_4_desc:0 "Древняя технология хранения информации, на порядок эффективнее бумаги. На ней лидеры сохранят важные данные — резюме избранных лидеров больше не потеряются."
 tech_stc_5:0 "СШК: Извлекатель трусиков из измерений"
 tech_stc_5_desc:0 "Продвинутая технология Золотого века: судя по всему, качает трусики из других измерений. Кто там жертва — уже не наша забота."
 tech_stc_6:0 "СШК: Умный помощник флота"
 tech_stc_6_desc:0 "Искусственный интеллект, танцующий на грани дозволенного. Придётся ещё чуть-чуть опустить грань."
 tech_stc_7:0 "СШК: Технический словарь"
 tech_stc_7_desc:0 "Учебник Золотого века: большая часть утрачена, но и остатки на голову выше нашего уровня."
 tech_stc_8:0 "СШК: Капсульное общежитие"
 tech_stc_8_desc:0 "Трудно поверить, но ещё до Золотого века корабельные девы охотно жили в капсулах площадью пару квадратов. Эта технология позволит набить в колониальные корабли больше народу и уплотнить города."
 tech_stc_9:0 "СШК: Флотская связь"
 tech_stc_9_desc:0 "Технология более эффективной связи между флотами — растёт ёмкость флота."
 tech_stc_10:0 "СШК: Стратагемы доброй хитрости"
 tech_stc_10_desc:0 "Этот древний воинский справочник сделает нас на поле боя хитрее — и целеустремлённее."
 tech_stc_11:0 "СШК: Стандартная сборочная линия"
 tech_stc_11_desc:0 "Сборочные линии населения Золотого века слишком глубоки для нас — идеально воспроизвести не выйдет, но пользу они всё равно принесут огромную."
 tech_stc_12:0 "СШК: Топливная присадка"
 tech_stc_12_desc:0 "В Золотом веке эта универсальная присадка вовсю применялась в гоночных состязаниях."
 tech_stc_13:0 "СШК: Сплавной набор T-класса"
 tech_stc_13_desc:0 "Идеально воспроизвести сплав Золотого века невозможно, но частично восстановить и укрепить корпуса наших кораблей — вполне."
 tech_stc_14:0 "СШК: Орбитальный промывающий лазер"
 tech_stc_14_desc:0 "В Золотом веке считался негуманной запретной технологией; в наши упадочные нравы — можно в промышленных масштабах."
 tech_stc_15:0 "СШК: Пайки IRP"
 tech_stc_15_desc:0 "Быстрорастворимые пайки, в Золотом веке считавшиеся негуманными, ныне — деликатес."
 tech_stc_16:0 "СШК: Модульное основание зданий"
 tech_stc_16_desc:0 "В Золотом веке эта технология вовсю применялась при колонизации."
 tech_stc_17:0 "СШК: Индустриальный модуль"
 tech_stc_17_desc:0 "В Золотом веке эта технология поднимала промышленную выработку."
 tech_stc_18:0 "СШК: Наблюдательная сеть"
 tech_stc_18_desc:0 "Полицейская технология Золотого века; теперь с её помощью указы Святого Порта будут исполняться эффективнее."
 tech_wg_Dominator_Crusier:0 "СШК: «Правитель»"
 tech_wg_Dominator_Crusier_desc:0 "Технология легендарного боевого корабля Золотого века: этот необыкновенный корабль в ту пору покрыл себя славой."
 tech_wg_Hellbringer_Crusier:0 "СШК: «Адский вестник»"
 tech_wg_Hellbringer_Crusier_desc:0 "Самый массовый быстрый крейсер Золотого века; большинство этих кораблей ныне у Хаоса. Невероятно, но мы нашли головной прототип!"
 wg_stc_modifier_1:0 "СШК: Научный бонус"
 wg_stc_modifier_1_desc:0 "Эта технология СШК даёт науке умеренный бонус"
 wg_stc_modifier_2:0 "$wg_stc_modifier_1$"
