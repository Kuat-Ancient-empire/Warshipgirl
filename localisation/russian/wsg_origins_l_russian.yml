 wg_stc_modifier_5:0 "СШК: Строительный бонус"
 wg_stc_modifier_5_desc:0 "Эта технология СШК даёт строительству умеренный бонус"
 wg_stc_modifier_6:0 "$wg_stc_modifier_5$"
