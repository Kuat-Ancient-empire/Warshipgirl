 sh_fe.19.desc:0 "Партия ресурсов…"
 sh_fe.19.a:0 "Спасибо"
 sh_fe.20.desc:0 "Это §YСингулярность 5-го уровня§!… она даёт массу энергии… дарим вам…"
 sh_fe.20.a:0 "Спасибо"
 sh_fe.20.a.tooltip:0 "Позволяет построить §YСингулярность 5-го уровня§!"
 sh_fe.21.desc:0 "Подсолнухи… по нашим тестам их употребление повышает эффективность труда… ментальная стерилизация вида уже проведена…"
 sh_fe.21.a:0 "Спасибо"
 sh_fe.21.a.tooltip:0 "Получить §Yподсолнуха§!"
 sh_fe.21.b:0 "Чужаки нам не нужны…"
 sh_fe.25.desc:0 "Обнаружена масштабная угроза. Протокол войны перезапущен…"
 sh_fe.25.a:0 "Принято"
 sh_fe.26.desc:0 "…………"
 sh_fe.26.a:0 "Хорошо"
 sh_fe.27.desc:0 "Молчанию… нужна сила………… этот §Y«Владыка»§!… дарим вам…"
 sh_fe.28.name:0 "Корабль-планету — под ноль!"
 sh_fe.28.desc:0 "Мы обездвижили корабль-планету Молчаливого флота в системе §H[sh_planetary_ship_system.GetName]§! — теперь колосс не страшен. Благодаря исполинскому корпусу основа уцелела.\n\nЗахотим строить такие же — займёмся реверс-инжинирингом."
 sh_fe.28.2.desc:0 "Мы обездвижили корабль-планету Молчаливого флота в системе §H[sh_planetary_ship_system.GetName]§! — теперь колосс не страшен. Благодаря исполинскому корпусу основа уцелела.\n\nТехнологию кораблей-планет мы уже освоили, так что с этим однотипным колоссом можно…"
 sh_fe.28.a:0 "Отлично"
 sh_fe.28.b:0 "Разобрать"
 sh_fe.28.c:0 "Переделать в монумент"
 sh_fe.28.d:0 "В будущем отремонтируем"
 sh_planetary_ship_megastructure_ruin:0 "Разбитый корабль-планета"
 sh_planetary_ship_megastructure_ruin_DESC:0 "Корабль-планета, разбитый яростным огнём: можно изучать обратной разработкой."
 sh_planetary_ship_megastructure_ruin_2:0 "Монумент Победы"
 sh_planetary_ship_megastructure_ruin_2_DESC:0 "Монумент из обломков колосса в память о великой битве."
 sh_planetary_ship_megastructure_ruin_3:0 "Ремонт корабля-планеты"
 sh_planetary_ship_megastructure_ruin_3_DESC:0 "Мы восстановим этот остов корабля-планеты"
 tech_sh_planetary_ship_reverse:0 "Реверс-инжиниринг корабля-планеты"
 tech_sh_planetary_ship_reverse_desc:0 "Позволяет вести обратную разработку обломков корабля-планеты падшей империи Глубинных"
 sh_planetary_ship_reverse_project:0 "Реверс-инжиниринг корабля-планеты"
 sh_planetary_ship_reverse_project_DESC:0 "Позволяет вести обратную разработку обломков корабля-планеты падшей империи Глубинных."
 unlock_planetary_ship_reverse:0 "§HОткрывает особый проект: §! реверс-инжиниринг корабля-планеты"
 unlock_planetary_ship_reverse_desc:0 "Позволяет вести обратную разработку обломков корабля-планеты падшей империи Глубинных"
 sh_fe.29.name:0 "Реверс-инжиниринг корабля-планеты"
 sh_fe.29.desc:0 "Мы готовы приступить к обратной разработке обломков корабля-планеты падшей империи Глубинных: ждёт подробная съёмка и исследование колосса."
 sh_fe.29.a:0 "Отлично"
 sh_fe.30.name:0 "Реверс корабля-планеты завершён"
 sh_fe.30.desc:0 "Наша группа вошла внутрь колосса — и почти сразу нежданный подарок.\nИз ядра базы данных корабля-планеты мы достали чертежи и технологию постройки, не слишком-то опережающие наш уровень.\n\nТеперь, после малой адаптации и доработки, мы сможем строить собственные корабли-планеты.\n\nЧто до остова под ногами: одни предлагают разобрать ради горы §Hресурсов§!, другие — сделать §Hмонументом§! великой битвы, третьи — дождаться технологий и восстановить, сделав нашим §Hкораблём-планетой§!"
 sh_fe.30.a:0 "Разобрать"
 sh_fe.30.b:0 "Переделать в монумент"
 sh_fe.30.c:0 "В будущем отремонтируем"
 sh_fe.31.name:0 "Корабль-планета восстановлен"
 sh_fe.31.desc:0 "Мы успешно восстановили корабль-планету падшей империи Глубинных: теперь колосс понесёт наше знамя по галактике."
 sh_fe.31.a:0 "Великолепно!"
 sh_fe.32.desc:0 "Это… наш величайший корабль… он принес нам победу… дарим вам…"
 sh_fe.32.a:0 "Спасибо"
 01_SH_FE_ANGRY_FM_PARIT:0 "Вы жалкие предательницы: вы предали предков, растоптали нашу клятву и попрали собственную честь."
 02_SH_FE_ANGRY_FM_PARIT:0 "Вы — позор нам; день вашего суда близок"
 03_SH_FE_ANGRY_FM_PARIT:0 "Наш род отдал всё ради защиты галактики — а вы решили пасть и примкнуть к ним?!"
 01_SH_FE_WAR_GREETING_FM_PARIT:0 "Во имя предков — вы будете остановлены!"
 02_SH_FE_WAR_GREETING_FM_PARIT:0 "Вы опозорили предков: мы вычистим свой дом, стерев вас до атомов!"
 03_SH_FE_WAR_GREETING_FM_PARIT:0 "Падшие… примите уничтожение…"
