 sh_fe.17.desc:0 "Невероятно… и вы встали на этот путь…\nСотни тысяч лет назад мы выбрали Молчание — и одолели всех тогдашних соперников… цель наша была достигнута.\n\nТеперь и вы на этом пути… полагаю, и вам предстоит своя цель… Мы окажем вам помощь."
 sh_fe.17.a:0 "Спасибо"
 sh_fe.17.b:0 "……. благодарим……."
 sh_fe.18.desc:0 "Эти технологии… помогут вам…"
 sh_fe.18.a:0 "Спасибо"
