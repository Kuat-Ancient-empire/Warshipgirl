 sh_weapen_XAC:0 "Энергетическая пушка SH-XAC"
 sh_weapen_XAC_DESC:0 "$tech_sh_XACweapon_desc$"
 wsg_weapon_dmm:0 "Мина DMM"
 wsg_weapon_dmm_DESC:0 "Куда бы это оружие ни вело наш флот — мы выбираем надежду."
 tech_sh_XACweapon:0 "Энергетическая пушка SH-XAC"
 tech_sh_XACweapon_desc:0 "Спинальная энергетическая пушка с высочайшим темпом и лучшими, чем у классических спинальных орудий, углами. Усилена против брони; мощные энерголучи легко рвут скопления хрупких целей."
 SHIP_AURA_WG_NSC:0 "Таинственная электроника"
 pantsu_shop_science_ship:0 "«Полония»"
 pantsu_shop_science_ship2:0 "Научный корабль «новичок» — «Полония»"
 pantsu_shop_science_ship_desc:0 "Продвинутый научный корабль: §Yбыстрее сканирование§! и §Yскорость обнаружения и исследования аномалий§!; плюс лёгкое вооружение — сам отбивается от слабого врага вместо бегства. Незаменимый спутник домоседа-путешественника и экспансии империи!"
 wsg_weapon_autocannon_152_hidden:0 "Плазменный автомат 152CM"
 wsg_weapon_autocannon_152_hidden_DESC:0 "Крупный плазменный автомат: мощное универсальное оружие."
 wsg_weapon_203plasma_hidden:0 "Страннокластерная пушка 203DM"
 wsg_weapon_203plasma_hidden_DESC:0 "Стреляет страннокластерными сгустками, наскоростно разрушающими материю корабля, — но щиты легко её отклоняют."
 wsg_weapon_356laser_hidden:0 "Щитогасящий луч 356M"
 wsg_weapon_356laser_hidden_DESC:0 "Луч идеально совпадает с когерентностью вражеских щитов — а броне он безразличен совершенно."
 wsg_shop_fighter:0 "Наёмная палубная авиация"
 wsg_shop_fighter_DESC:0 "Элитная авиация пилотесс-мехадев из другой галактики, рискующих жизнью за пару трусиков"
 wsg_shop_ion_cannon:0 "Улучшенная ионная пушка"
 wsg_shop_ion_cannon_DESC:0 "Модернизированная ионная пушка: типичные свойства энергетического оружия, но на корабль — едва помещается."
