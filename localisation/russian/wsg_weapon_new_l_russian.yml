 sh_autocannon_DESC:0 "$tech_sh_autocannon_desc$"
 sh_torpedo:0 "Тяжёлая торпеда Глубинных"
 sh_torpedo_DESC:0 "Тяжёлая торпеда Глубинных: короткобойная, медленная — но мощь такова, что считаные попадания топят большинство тяжёлых кораблей."
