l_russian:

 tech_wsg_auto57:0 "Импульсная лазерная пушка 57CM"
 tech_wsg_auto57_desc:0 "Оружие, переделанное из лабораторной импульсной лазерной поджигательной установки — до оружейного класса дотянуло лишь на грани."
 tech_wsg_rockets:0 "Реактивная установка X-28 мод. 12"
 tech_wsg_rockets_desc:0 "В боях с Глубинными X-28 постоянно давили их базы и авиацию. Теперь это оружие стоит на наших кораблях — на службе звёздного завоевания."
 tech_wsg_auto127:0 "Плазменный автомат 127CM"
 tech_wsg_auto127_desc:0 "Средний плазменный автомат из Лавки Трофеев: калибр больше, магазин больше, мощнее 57CM — но и места ест."
 tech_wsg_auto152:0 "Плазменный автомат 152DM"
 tech_wsg_auto152_desc:0 "152DM из Лавки Трофеев. Чудовищно мощное крупное автоматическое орудие — рвёт подступающего врага в клочья."
 tech_wsg_203plasma:0 "Страннокластерная пушка 203DM"
 tech_wsg_203plasma_desc:0 "Альфа-оружие из Лавки Трофеев: убивает странной материей."
 tech_wsg_f2h:0 "Космический истребитель S-F2H"
 tech_wsg_f2h_desc:0 "Быстрый перехватчик с малым импульсным двигателем — без единой лишней побрякушки."
 tech_wsg_330ion:0 "Улучшенная ионная пушка 330M"
 tech_wsg_330ion_desc:0 "Переделка громоздкой ионной пушки: особенно хороша против щитов, но броню пробивает слабо. Если вы это читаете — что-то пошло не так, или вы юзали консоль."
 tech_wsg_356laser:0 "Щитогасящий луч 356DM"
 tech_wsg_356laser_desc:0 "Альфа-оружие из Лавки Трофеев. Луч идеально совпадает по когерентности с вражескими щитами: нескольких выдержанных засветок хватает, чтобы щиты снять."
 tech_wsg_410:0 "Тёмно-материальная альфа-пушка 410M"
 tech_wsg_410_desc:0 "Особая технология позволяет ей пользоваться плодами оптимизации кинетического оружия."
 tech_wg_carrier_computer:0 "Тактический компьютер авианосца"
 tech_wg_carrier_computer_desc:0 "Этот боевой компьютер после вступления в бой разворачивает корабль и отходит максимально далеко — идеально для авианосцев.\n§YНе ставьте на корабли со спинальным вооружением§!"
 tech_wsg_EW:0 "Энергетический кнут"
 tech_wsg_EW_desc:0 "При попадании выделяет огромную энергию, сжигающую щиты цели, и наносит дополнительный урон конструкции; по броне бонусов нет."
 tech_wsg_rim99:0 "Ловушка ПВО RIM-99"
 tech_wsg_rim99_desc:0 "Мелкие ложные боеприпасы, сбивающие с толку вражескую точечную оборону: урона почти нет, но перехватчики врага истощают ресурс."
 tech_wsg_sy10:0 "Ракета «Шанъю-10»"
 tech_wsg_sy10_desc:0 "В отличие от медленных альфа-торпед эти ракеты не страдают взрывоопасностью. Пусковые: одинарная (слот G) и спаренная (слот L)."
 tech_sh_dsy10:0 "Ракета «D-Шанъю-10»"
 tech_sh_dsy10_desc:0 "Ракеты «Шанъю-10», выуженные флотом Глубинных из мусорки девских верфей. От оригинала отличается только краской."
 tech_wsg_dmm:0 "Мина DMM"
 tech_wsg_dmm_desc:0 "Тёмная материя и катализатор в двух отдельных ёмкостях; при подходе вражеского корабля смешиваются — и взрыв. Мощи хватит оторвать край планеты."
 tech_living_metal_bulge:0 "Пулезе-система из живого металла"
 tech_living_metal_bulge_desc:0 "Живой металл, подмешанный в жидкий металл и залитый в серию цилиндров: прочная броня, растущая в защите с размером. Из-за габаритов — только средние и крупные корабли."
 tech_wsg_pd127:0 "Двухцелевое орудие MK38 127CM"
 tech_wsg_pd127_desc:0 "Средняя двухцелевая рельсотронная пушка MK38 выплёвывает очередь кинетических снарядов — по авиации, ракетам и кораблям."
 tech_sh_autocannon:0 "Скорострельная пушка Глубинных"
 tech_sh_autocannon_desc:0 "Сверхсовременный автомат, швыряющий снаряды с излучением энергии Глубинных: полностью игнорирует щиты и калечит броню."
 tech_sh_fighter:0 "Скоростной истребитель Глубинных"
 tech_sh_fighter_desc:0 "Истребитель Глубинных с реактором на ядрах: скорострельная мелкая пушка и вспомогательная СУО отбивают авиацию и ракеты."
 tech_sh_torpedo:0 "Тяжёлая торпеда Глубинных"
 tech_sh_torpedo_desc:0 "Тяжёлая ракета с начинкой из энергетических ядер Глубинных и оболочкой из их сплавов: медленная, короткобойная, редкая — но мощь несомненна."
 wsg_weapon_autocannon_57:0 "Импульсная лазерная пушка 57CM"
 wsg_weapon_autocannon_57_DESC:0 "Оружие, переделанное из лабораторной импульсной лазерной поджигательной установки — до оружейного класса дотянуло лишь на грани."
 wsg_weapon_rockets:0 "Реактивная установка X-28 мод. 12"
 wsg_weapon_rockets_DESC:0 "X-28 в боях с флотом Глубинных давил их базы и авиацию. Теперь он на наших кораблях — ради звёздного завоевания."
 wsg_weapon_autocannon_127:0 "Плазменный автомат 127CM"
 wsg_weapon_autocannon_127_DESC:0 "Средний плазменный автомат — сплав технологий автоматов и плазменного оружия."
 wsg_weapon_autocannon_152:0 "Плазменный автомат 152DM"
 wsg_weapon_autocannon_152_DESC:0 "Крупный плазменный автомат: мощное универсальное оружие, плавящее большинство врагов."
 wsg_weapon_203plasma:0 "Страннокластерная пушка 203DM"
 wsg_weapon_203plasma_DESC:0 "Стреляет страннокластерными сгустками, наскоростно разрушающими материю корабля, — но щиты легко её отклоняют."
 wsg_weapon_356laser:0 "Щитогасящий луч 356DM"
 wsg_weapon_356laser_DESC:0 "Луч идеально совпадает с когерентностью вражеских щитов — а броне он безразличен совершенно."
 wsg_weapen_X_410:0 "Тёмно-материальная альфа-пушка 410M"
 wsg_weapen_X_410_DESC:0 "Особая технология позволяет ей пользоваться плодами оптимизации кинетического оружия."
 WG_COMPUTER_CARRIER:0 "Тактический компьютер авианосца"
 WG_COMPUTER_CARRIER_DESC:0 "Этот боевой компьютер после вступления в бой пытается отойти\n§YНе ставьте на корабли со спинальным вооружением§!"
 wsg_weapen_X_EW:0 "Энергетический кнут"
 wsg_weapen_X_EW_DESC:0 "При попадании выделяет огромную энергию, сжигающую щиты цели, и наносит дополнительный урон конструкции; по броне бонусов нет."
 wsg_weapon_rim99:0 "Ловушка ПВО RIM-99"
 wsg_weapon_rim99_DESC:0 "Ложные ракеты, сбивающие с толку вражескую точечную оборону."
 wsg_weapon_sy10:0 "Ракета «Шанъю-10»"
 wsg_weapon_sy10_DESC:0 "Средняя ракета с энергетической БЧ: сбалансированные характеристики"
 wsg_weapon_sy10_dual:0 "Спаренная «Шанъю-10»"
 wsg_weapon_sy10_dual_DESC:0 "Спаренная версия «Шанъю»: почти двойная мощь."
 sh_weapon_dsy10:0 "Ракета «D-Шанъю-10»"
 sh_weapon_dsy10_DESC:0 "«Шанъю-10», выуженные флотом Глубинных из мусорки девских верфей."
 wsg_weapon_dpflak:0 "Двухцелевое орудие MK38"
 wsg_weapon_dpflak_DESC:0 "Средний рельсотрон: очередь кинетических снарядов по авиации, ракетам и кораблям."
 wsg_weapon_f2h:0 "Звёздный истребитель S-F2H"
 wsg_weapon_f2h_DESC:0 "Истребитель с альфа-реактором и мощным режущим лучом: кошмар вражеской авиации."
 MEDIUM_living_metal_bulge:0 "Средняя Пулезе-система из живого металла"
 LARGE_living_metal_bulge:0 "Тяжёлая Пулезе-система из живого металла"
 wsg_ship_part_living_metal_bulge:0 "Пулезе-система из живого металла"
 wsg_ship_part_living_metal_bulge_DESC:0 "Пулезе-система из живого металла — только средние и крупные корабли."
 wsg_nsc_compat_aura:0 "Таинственная электроника"
 wsg_nsc_compat_aura_DESC:0 "Таинственная электроника, ослабляющая пробитие вражеского оружия. §!§R Эффекты аур не суммируются§!"
 SMALL_sh_weapon_autocannon:0 "Малая скорострельная пушка Глубинных"
