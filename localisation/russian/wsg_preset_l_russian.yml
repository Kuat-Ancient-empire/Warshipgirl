l_russian:

 tech_uf_subject:0 "Договорная держава Объединения"
 tech_uf_subject_desc:0 "Мы оказываем всестороннюю помощь слабым государствам и позволяем им стать нашими вассалами — Договорными державами Объединения.\nЧто до ничтожных ответных даров, тут уместно вспомнить известную фразу: §Y«Хозяину всё равно»§!"
 tech_uf_subject_diplo:0 "§HОткрыт тип вассала: §! Договорная держава Объединения"
 tech_uf_subject_diplo_desc:0 "Договорная держава получает всестороннюю помощь Объединённого флота: экономическую поддержку, технологическую помощь и даже военную."
 preset_uf_subject:0 "Договорная держава Объединения"
 preset_uf_subject_desc:0 "Договорная держава получает всестороннюю помощь Объединённого флота: экономическую поддержку, технологическую помощь и даже военную."
