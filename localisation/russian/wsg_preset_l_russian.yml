 holding_wsg_alpha_maker:0 "Портовый центр конверсии кристаллов Альфа"
 holding_wsg_alpha_maker_desc:0 "Из-за особенностей кристаллов Альфа мы сами поставляем сырьё, вместо того чтобы напрямую использовать ресурсы вассала."
 job_overlord_wsg_alpha_maker_effect_desc:0 "£job_overlord_wsg_alpha_maker£ $job_overlord_wsg_alpha_maker_plural$ производят для сюзерена £sr_alpha£ §Y$sr_alpha$§! и получают £energy£ §Y$energy$§! в качестве оплаты"
