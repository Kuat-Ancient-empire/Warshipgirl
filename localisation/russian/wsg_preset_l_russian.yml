 holding_wsg_recycle_center:0 "Портовый центр переработки отходов"
 holding_wsg_recycle_center_desc:0 "Эта бедная вассальная планета вынуждена перерабатывать разный хлам для своего сюзерена, что вызывает тяжёлое загрязнение среды. И всё же, поскольку мусорщики получают больше большинства профессий, желающих хоть отбавляй."
 job_wsg_recycel_worker_desc:0 "Даже столь непрезентабельная и вредная работа находит желающих — нужда заставляет."
