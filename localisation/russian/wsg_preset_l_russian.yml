 job_overlord_wsg_neo_maker_cap:0 "$job_overlord_wsg_neo_maker$"
 job_overlord_wsg_neo_maker_desc:0 "Из-за сложностей с прямым контролем инозвёздной промышленности на единицу NEO уходит больше ресурсов."
