 wg_ptc_1_modifier_1:0 "Усердный труд"
 wg_ptc_1_modifier_1_desc:0 "Все обязаны трудиться принудительно; былые нормы безопасности и защиты среды больше не принимаются во внимание."
 wg_ptc_1_modifier_2:0 "Гармония и стабильность"
 wg_ptc_1_modifier_2_desc:0 "Все правоохранители могут применять смертоносную силу и любые средства для подавления малейшего неповиновения."
 wg_ptc_1_modifier_3:0 "Мирное разоружение"
 wg_ptc_1_modifier_3_desc:0 "Обрубить когти, обрезать клювы."
 wg_ptc_1_modifier_4:0 "Светлое будущее"
 wg_ptc_1_modifier_4_desc:0 "Ради прекрасного будущего галактики и нас самих эти меры абсолютно необходимы."
 ptc_alien_slicer_modifier:0 "Центр возвышения Комитета"
 holding_alien_slicer:0 "Центр возвышения Комитета"
 holding_alien_slicer_desc:0 "Мы всячески понудим жителей этой вассальной планеты добровольно жертвовать своей плотью. Они войдут в эту огромную мясорубку и превратятся в органическую жижу или будут разобраны на ценный металл — всё это ускорит сборку нашего населения."
 holding_alien_slicer_effect_desc:0 "§Y$MOD_BONUS_POP_GROWTH$§! на всех планетах сюзерена: §G+0.5§!\nКаждые §R2 года§! убивает §R600§! £pop£§Yнаселения§! этой планеты, пока не будет уничтожено всё."
 holding_resource_collector:0 "Орбитальный добывающий лазер Комитета"
 holding_resource_collector_desc:0 "Орбитальный добывающий лазер, созданный для бесплодных миров и астероидов, направят прямо на эту вассальную колонию: он нанесёт тяжелейший урон среде, но добудет сюзерену массу ресурсов."
 holding_resource_collector_effect_desc:0 "\nКаждые §R2 года§! убивает §R3§! £pop£§Yнаселения§! этой планеты, пока не будет уничтожено всё."
 job_overlord_wg_ptc_collector_effect_desc:0 "£job_overlord_wg_ptc_collector£ $job_overlord_wg_ptc_collector_plural$ варварски добывают из планеты §Yразличные ресурсы§!"
 job_overlord_wg_ptc_collector:0 "Оператор орбитального добывающего лазера"
 mod_job_overlord_wg_ptc_collector_add:0 "Профессия: оператор орбитального добывающего лазера"
 job_overlord_wg_ptc_collector_plural:0 "Оператор орбитального добывающего лазера"
 job_overlord_wg_ptc_collector_cap:0 "$job_overlord_wg_ptc_collector$"
 job_overlord_wg_ptc_collector_desc:0 "Лишь бы чуть-чуть оттянуть свой смертный час, жители этой вассальной планеты не жалеют смертельно радиоактивных добывающих лазеров по собственному дому."
 holding_alien_zoo:0 "Зоопарк Комитета"
 holding_alien_zoo_desc:0 "Это вассальное население будет заперто в зоопарке и показано во всех видах благородным гостям сюзерена."
 job_overlord_wg_ptc_animals_effect_desc:0 "£job_overlord_wg_ptc_animals£ $job_overlord_wg_ptc_animals_plural$ продают своё достоинство за жалкие £trade_value£ §Yторговые стоимости§!"
 job_overlord_wg_ptc_animals:0 "Вассальные животные"
 mod_job_overlord_wg_ptc_animals_add:0 "Должность: вассальное животное"
 job_overlord_wg_ptc_animals_plural:0 "Вассальные животные"
 job_overlord_wg_ptc_animals_cap:0 "$job_overlord_wg_ptc_animals$"
 job_overlord_wg_ptc_animals_desc:0 "Эти вассалы продают своё достоинство ради забавы благородных гостей сюзерена — всего лишь за кусок еды и чуть более позднюю дату казни."
 holding_alien_research:0 "Клиника милосердия Комитета"
 holding_alien_research_desc:0 "Это учреждение может вести любые жестокие эксперименты на живых существах, свободное от моральных оков."
 job_overlord_wg_ptc_researcher_effect_desc:0 "£job_overlord_wg_ptc_researcher£ $job_overlord_wg_ptc_researcher_plural$ производят для сюзерена £society£ $society_research$"
 job_overlord_wg_ptc_researcher:0 "Врач Комитета"
 mod_job_overlord_wg_ptc_researcher_add:0 "Должность: врач Комитета"
 job_overlord_wg_ptc_researcher_plural:0 "Врач Комитета"
 job_overlord_wg_ptc_researcher_cap:0 "$job_overlord_wg_ptc_researcher$"
 job_overlord_wg_ptc_researcher_desc:0 "Эти безумные врачи не жалеют собственных сородичей ради опытов сюзерена, не зная, что однажды они и сами окажутся на столе."
 holding_alien_food:0 "Центр продовольственной безопасности Комитета"
 holding_alien_food_desc:0 "Чтобы не допустить голода, эти низшие существа должны стать нашими запасами провизии."
 holding_alien_food_effect_desc:0 "\nКаждые §R2 года§! убивает §R1§! £pop£§Yнаселения§! этой планеты, пока не будет уничтожено всё."
 holding_wsg_pantsu_maker:0 "Центр производства трусиков инозвёздного вкуса"
 holding_wsg_pantsu_maker_desc:0 "Инопланетяне тоже могут производить для нас трусики. Чтобы смягчить возможный дискомфорт, мы подадим это как «инозвёздный вкус»."
