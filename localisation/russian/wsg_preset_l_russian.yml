 war_goal_wg_tribute_ptc:0 "Комитет Прогресса"
 war_goal_wg_tribute_ptc_desc:0 "§WЦель этой войны — силой принудить инопланетное еретическое государство отказаться от своего будущего и стать объектом нашей эксплуатации и истребления. §!"
