 holding_wsg_knowledge_pillage:0 "Портовый центр обмена знаниями"
 holding_wsg_knowledge_pillage_desc:0 "Все научные учреждения этой планеты обязаны полностью передавать результаты своих исследований сюзерену."
 holding_wsg_knowledge_pillage_effect_desc:0 "Каждый §Hнаучный корабль§! сюзерена на орбите даёт сюзерену дополнительные §G4%§!§Y$RESEARCH_EFFICIENCY$§!, но вассал теряет §R-0.5§! $r_loyalty$; максимум §G12%§!§Y$RESEARCH_EFFICIENCY$§! и §R-1.5§! $r_loyalty$."
 holding_wsg_production_department:0 "Портовое производственное управление"
 holding_wsg_production_department_desc:0 "Сюзерен перестроит экономику вассала по более продвинутым алгоритмам, подняв выпуск."
