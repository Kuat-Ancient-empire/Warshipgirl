 job_overlord_wsg_pantsu_maker_cap:0 "$job_overlord_wsg_pantsu_maker$"
 job_overlord_wsg_pantsu_maker_desc:0 "Эти разношёрстные инопланетные виды производят трусики для своего сюзерена."
