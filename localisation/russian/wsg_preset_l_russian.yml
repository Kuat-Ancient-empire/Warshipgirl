 job_overlord_wsg_srse_maker:0 "Инозвёздный производитель энергетических ядер Глубинных"
 mod_job_overlord_wsg_srse_maker_add:0 "Должность: инозвёздный производитель энергетических ядер Глубинных"
 job_overlord_wsg_srse_maker_plural:0 "Инозвёздный производитель энергетических ядер Глубинных"
 job_overlord_wsg_srse_maker_cap:0 "$job_overlord_wsg_srse_maker$"
 job_overlord_wsg_srse_maker_desc:0 "Ради сюзерена этим работникам приходится сталкиваться с опаснейшим излучением."
 mod_job_overlord_wsg_srse_maker_per_pop:0 "На каждые $VALUE$ населения §G+1§! профессия $job_overlord_wsg_srse_maker$"
