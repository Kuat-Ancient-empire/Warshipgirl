 holding_wsg_neo_maker:0 "Портовый центр производства NEO"
 holding_wsg_neo_maker_desc:0 "Мы можем поручить вассалу производить нужный нам NEO, но из-за сложностей с прямым контролем инозвёздной промышленности это потребует от вассала больше минералов."
 job_overlord_wsg_neo_maker_effect_desc:0 "£job_overlord_wsg_neo_maker£ $job_overlord_wsg_neo_maker_plural$ превращают £minerals£ §Y$minerals$§! в нужный сюзерену £sr_neo£ §Y$sr_neo$§! и получают £energy£ §Y$energy$§! в качестве оплаты"
 job_overlord_wsg_neo_maker:0 "Инозвёздный производитель NEO"
