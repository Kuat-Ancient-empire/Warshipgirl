 holding_sh_pantsu_maker:0 "Инозвёздный центр производства трусиков"
 holding_sh_pantsu_maker_desc:0 "Ради эффективности производства трусиков мы позволим вассалу взять на себя часть производственной цепочки."
 holding_sh_srse_maker:0 "Инозвёздный центр производства энергетических ядер Глубинных"
 holding_sh_srse_maker_desc:0 "Оставить загрязнение и опасность на планете вассала — недурное решение."
 civic_wsg_subject:0 "Потомки Порта"
 civic_wsg_subject_desc:0 "Эта империя корабельных дев когда-то была частью другой корабельной цивилизации, а теперь стала ветвью великой цивилизации и пишет ещё более величественную главу."
 civic_sh_subject:0 "Отпрыски Глубинных"
 civic_sh_subject_desc:0 "Эта глубинная империя некогда входила в глубинную цивилизацию, а теперь, как ветвь воли Глубинных, несёт свет флота Глубинных всё дальше."
 wg_subject.2.name:0 "Наш вассал"
 wg_subject.2.desc:0 "§H[wsg_subject_target.GetName]§! — только что созданный нами вассал, но его государственное устройство отличается от нашего. Дадим ли мы им шанс стать ветвью великой цивилизации корабельных дев?"
 wg_subject.2.a:0 "Наши потомки — такие же, как мы"
 no_warshipgirls_no_civilization:0 "Корабельная цивилизация без корабельных дев лишена смысла"
 no_warshipgirls_main_species:0 "Цивилизация, где главенствуют не корабельные девы, не вправе называться корабельной"
 wg_subject.2.b:0 "Нет, они недостойны"
 wg_subject.4.name:0 "Наш вассал"
 wg_subject.4.desc:0 "§H[sh_subject_target.GetName]§! — только что созданный нами вассал, но его государственное устройство отличается от нашего. Дадим ли мы им шанс стать ветвью великой цивилизации Глубинных?"
 wg_subject.4.a:0 "Мы все — флот Глубинных"
 no_shenhai_no_civilization:0 "Глубинная цивилизация без Глубинных лишена смысла"
 no_shenhai_main_species:0 "Цивилизация, которой не правят Глубинные, — не флот Глубинных"
 wg_subject.4.b:0 "Нет, они недостойны"
