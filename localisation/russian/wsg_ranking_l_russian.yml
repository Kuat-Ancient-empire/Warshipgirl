 nanite_sold_out:0 "§RСклад §H$nanites$§R пуст! Загляните позже. §!"
 pantsu2alpha:0 "Мы хотим купить §H$sr_alpha$§!"
 alpha_sold_out:0 "§RСклад §H$sr_alpha$§R пуст! Загляните позже. §!"
 pantsu2se:0 "Мы хотим купить §H$sr_se$§!"
 se_sold_out:0 "§RСклад §H$sr_se$§R пуст! Загляните позже. §!"
 wsgranking.1011.a:0 "Перейти к среднему опту"
 wsgranking.1012.a:0 "Перейти к крупному опту"
 wsgranking.1013.a:0 "Перейти к мелкому опту"
 prohibit_contract_sign:0 "Из-за давнего нарушения вы пока не можете подписывать контракты."
 wsgranking.1014.desc:0 "Какой контракт изволите? Гарантируем: во всей вселенной не найти дешевле и выгоднее наших условий — особенно по этим редким ресурсам!"
 pantsu2dm_contract:0 "Фьючерс на §H$sr_dark_matter$§!"
 pantsu2zro_contract:0 "Фьючерс на §H$sr_zro$§!"
 pantsu2lm_contract:0 "Фьючерс на §H$sr_living_metal$§!"
 pantsu2nanite_contract:0 "Фьючерс на §H$nanites$§!"
 pantsu2alpha_contract:0 "Фьючерс на §H$sr_alpha$§!"
 pantsu2se_contract:0 "Фьючерс на §H$sr_se$§!"
 pantsu_shop_dark_matter_contract:0 "Мелкий фьючерс Лавки: §H$sr_dark_matter$§!"
 pantsu_shop_dark_matter_contract_massive:0 "Крупный фьючерс Лавки: §H$sr_dark_matter$§!"
 pantsu_shop_zro_contract:0 "Мелкий фьючерс Лавки: §H$sr_zro$§!"
 pantsu_shop_zro_contract_massive:0 "Крупный фьючерс Лавки: §H$sr_zro$§!"
 pantsu_shop_living_metal_contract:0 "Мелкий фьючерс Лавки: §H$sr_living_metal$§!"
 pantsu_shop_living_metal_contract_massive:0 "Крупный фьючерс Лавки: §H$sr_living_metal$§!"
 pantsu_shop_nanites_contract:0 "Мелкий фьючерс Лавки: §H$nanites$§!"
 pantsu_shop_nanites_contract_massive:0 "Крупный фьючерс Лавки: §H$nanites$§!"
 pantsu_shop_alpha_contract:0 "Мелкий фьючерс Лавки: §H$sr_alpha$§!"
 pantsu_shop_alpha_contract_massive:0 "Крупный фьючерс Лавки: §H$sr_alpha$§!"
 pantsu_shop_se_contract:0 "Мелкий фьючерс Лавки: §H$sr_se$§!"
 pantsu_shop_se_contract_massive:0 "Крупный фьючерс Лавки: §H$sr_se$§!"
 wsgranking.1014.a:0 "Перейти к крупным фьючерсам"
 wsgranking.1015.a:0 "Перейти к мелким фьючерсам"
 wsgranking.1016.desc:0 "Какой контракт желаете расторгнуть?"
 wsgranking.1016.a:0 "Расторгнуть фьючерс на §H$sr_dark_matter$§!"
 wsgranking.1016.b:0 "Расторгнуть фьючерс на §H$sr_zro$§!"
 wsgranking.1016.c:0 "Расторгнуть фьючерс на §H$sr_living_metal$§!"
 wsgranking.1016.d:0 "Расторгнуть фьючерс на §H$nanites$§!"
 wsgranking.1016.e:0 "Расторгнуть фьючерс на §H$sr_alpha$§!"
 wsgranking.1016.f:0 "Расторгнуть фьючерс на §H$sr_se$§!"
 comfirm_cancellation:0 "Ваш фьючерс с нашей лавкой расторгнут. Чем ещё порадовать гостя?"
 wsgranking.1017.desc:0 "Позвольте уточнить: вы уверены, что хотите расторгнуть ВСЕ контракты с нашей лавкой?"
 wsgranking.1017.a:0 "Подтверждаю расторжение всех контрактов"
 wsgranking.1018.desc:0 "Дорогой гость, в этом месяце вы, кажется, не поставили полную норму трусиков. Как это понимать?"
 wsgranking.1018.a:0 "Искренне извиняемся"
 wsgranking.1018.a.response:0 "Согласно контракту: за невозможность исполнять обязательства вы выплачиваете неустойку — 50 энергокредитов 48 месяцев подряд; заключение контрактов с нашей лавкой запрещено на 10 лет. Всего доброго."
 pantsu_shop_contract_break:0 "Неустойка Лавки Трофеев"
 wg_modifier_weapon_payment:0 "НИОКР-сбор Лавки Трофеев"
 wsgranking.2000.title:0 "Лавка Трофеев уничтожена!"
 wsgranking.2000.desc:0 "Лавка Трофеев уничтожена! Эти коварные Сломанные Стулья больше не выманят у нас ни одних трусиков."
 wsgranking.2001.title:0 "Лавка Трофеев уничтожена!"
 wsgranking.2001.desc:0 "Лавка Трофеев уничтожена: её уникальные товары и услуги навеки растворились в звёздном море."
 wsgranking.5001.desc:0 "Здравствуйте, [Root.GetSpeciesNamePluralCompliment]. У нас в делах некоторые трудности: за тысячелетия скитаний нас осталось совсем немного, а бизнес тянуть тяжело. Не могли бы вы предоставить §Y100 £pops£ жителей§! в помощь? Зарплату выплатим. Мы уже слышим [Root.GetRandomSpeciesSound] золота!"
 wsgranking.5001.a:0 "Можно. Вознаграждение нас устраивает — по рукам."
 wsgranking.5001.b:0 "Мы не будем рисковать своими людьми."
 wsgranking.5002.desc:0 "[Root.GetSpeciesNamePluralCompliment], это Лавка Трофеев. У нас временные финансовые трудности: срочно нужны средства на инвестиционный проект в одной державе. Шанс успеха — примерно 99,61%; мы гарантируем поэтапные выплаты — вы точно не в убытке. Чем больше вложите, тем больше выгоды! Не хотите ли подумать? Может, и очки подвига подкинем!"
 wsgranking.5002.a:0 "Вложить 5000 £energy£(по 100 £energy£ в месяц, 5 лет)"
 wsgranking.5002.b:0 "Вложить 10000 £energy£(по 150 £energy£ в месяц, 10 лет)"
 wsgranking.5002.c:0 "Вложить 25000 £energy£(по 250 £energy£ в месяц, 20 лет)"
 wsgranking.5002.d:0 "Мы не выбросим драгоценные энергокредиты на это."
 wg_shop_loan_5k:0 "Заём Лавки Трофеев (5 лет)"
 wg_shop_loan_10k:0 "Заём Лавки Трофеев (10 лет)"
 wg_shop_loan_30k:0 "Заём Лавки Трофеев (20 лет)"
 wsgranking.5003.desc:0 "[Root.GetName], с вами Лавка Трофеев. Мы заметили: на планете [pantsu_shop_franchising_planet.GetName] много трудолюбивых [Root.GetSpeciesNamePlural]. К делу: хотим открыть там франчайз-филиал — гарантируем пользу местной экономике и кучу рабочих мест. Вам — чуть-чуть политических преференций. И да: мы поднимем ваши §Yочки подвига§!"
 wsgranking.5003.a:0 "Разрешаем вам работать на [pantsu_shop_franchising_planet.GetName]"
 wsgranking.5003.b:0 "Мы не уступим мерзким обманщикам."
 pantsu_shop_franchising:0 "Франчайз-филиал Сломанных Стульев"
 pantsu_shop_franchising_desc:0 "На этой планете — торговый филиал купцов Сломанных Стульев: экономика выросла, но часть ресурсов планеты у них в монополии."
 wsgranking.5004.title:0 "Сломанные Стулья просят улучшить меню"
 wsgranking.5004.desc:0 "Не спрашивай, что ты можешь сделать для Сломанных Стульев — спрашивай, что Сломанные Стулья могут сделать для тебя! Нашей пищеварительной системе уже не вынести ни «ПАТ-ПАТ», ни «безвкусной» лапши! Мы просим вас новыми пищевыми технологиями сделать нам §Eблюда§! — блюда вопреки здравому смыслу, желательно такие, что сгонят сюда всех обжор галактики!"
 wsgranking.5004.a:0 "Стейк из тюленя A5, приправленный цитрусовой специей!"
 wsgranking.5004.b:0 "Держи — полярное тофу! С галактическим ополаскивателем-взрывчаткой!"
 wsgranking.5004.c:0 "Это армейский рацион Эндорийской империи. Возможно, последняя коробка в галактике."
 wsgranking.5004.d:0 "Извините, мы сами перебиваемся."
 wsgranking.5005.title:0 "Странная купчиха"
 wsgranking.5005.desc:0 "Некая инопланетная торговка «Найла» после крушения грузового корабля застряла на одной из наших планет. Спасённая, она заявила, что получила образование Сломанных Стульев, изъявила желание остаться на службе — и заодно предложила нам «бетарианскую морковь» с другого края галактики. Полисы Сломанных Стульев к этому делу равнодушны; при первом же запросе они даже не знали о её существовании."
 wsgranking.5005.a:0 "Раз возвращаться не хочет — пусть остаётся."
 wsgranking.5005.b:0 "Мы не можем принять человека неясного происхождения. Отправьте её назад!"
 wsgranking.5005.c:0 "А мне тоже дайте бетарианской морковки!"
 NAILA:0 "Найла"
 leader_trait_official_chairman:0 "Образование Сломанных Стульев"
 leader_trait_official_chairman_desc:0 "§YОбразец Лавки Трофеев§!\n\n\n\n£wg_trait_pic_pz£\n\n\n\nНайла училась коммерции в полисах Сломанных Стульев и унаследовала часть их знаний."
 leader_trait_official_naila:0 "Бетарианская морковь"
 leader_trait_official_naila_desc:0 "После бетарианской морковки Найлы весь сектор охватила волна комедийного творчества."
 wsgranking.6001.desc:0 "Сенсация! Сенсация! Раритет нашей лавки — «мощнейшее решающее орудие: пушка Армстронга с Армстронг-вращающимися Армстронг-соплами» — уже в продаже! Честное слово: цена — качество!\n\n\n\n\n(p.s. этой пушки не существует, by bugv)"
 wsgranking.6002.desc:0 "Сенсация! Сенсация! Раритет нашей лавки — «мощнейшее решающее орудие: 460-я гигант-пушка тысячи цзиней на энергии Глубинных» — уже в продаже! Честное слово: цена — качество!"
 wsgranking.6004.desc:0 "Не умеете обращаться с жидким металлом, мнущимся от тычка? Мы торговали им — значит, умеем. Ради доходов готовы поделиться частью секретов. Бесплатно!"
 wsgranking.9000.desc:0 "Получилось! Этот экспериментальный ригинг-плагин позволяет командующей слиться с кораблём воедино и в известной мере ощущать состояние всего флота империи.\nМинус: нужна предельно точная нейрокарта; совместимость с этой командующей — чистая случайность. Ещё §Yодной такой§! для другой командующей нам не сделать веками."
 leader_trait_ascension_implant:0 "Легендарный ригинг-плагин"
 leader_trait_ascension_implant_desc:0 "Легендарный командный комплект с точнейшей нейрокартой случайно совпал именно с этой командующей."
 leader_trait_inferior_implant:0 "Простой ригинг-плагин"
 leader_trait_inferior_implant_desc:0 "Простой плагин массового производства: совместим с большинством командующих, но эффект скромнее."
 wsgranking.9001.desc:0 "Получилось! Огромный боевой информационный центр, требовавший целой стратегической базы, теперь распределён по каждому кораблю. Флагман сводит данные всех кораблей — командующая может вести флот крупнее.\n§YПолный вперёд! §!"
 wsgranking.9002.desc:0 "Получилось! Теперь обычное оружие мгновенно рассеивает странные связи киберлития. Как горячий нож сквозь масло!"
 wsgranking.9003.desc:0 "Получилось! С достройкой Центр обороны метрополии все бои в наших границах получают 10% циклического прироста урона.\n\nО, чуть не забыли: по принципу той мины мы нарисовали вам и мощное корабельное орудие."
