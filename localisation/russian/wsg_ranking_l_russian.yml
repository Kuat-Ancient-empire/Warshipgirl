 wg_modifier_implant_coordination:0 "OTA-обновление ригингов"
 wg_modifier_combat_uf_desc:0 "Урон по §RОбъединённому флоту§!: §G+20%§!"
 wsgranking.9005.desc:0 "Мы достаточно глубоко изучили вашу империю — и всё это время наблюдали. У нас есть идеи по-настоящему грандиозные, способные резко усилить ваш флот.\nВозможно, вам пока не хватит сил на них — но эти особые проекты останутся для вас открытыми навсегда.\nКогда будете готовы — позовите нас."
 wsgranking.9005.a:0 "… чувствую, случится что-то нехорошее?"
 wsgranking.9005.effect:0 "§YДоступны ультимативные особые проекты Лавки Трофеев. §!"
 wsgranking.9006.desc:0 "В эти великие проекты ещё никто не ступал. Возможно, наше сотрудничество приоткроет их тайну."
 implant_request_desc:0 "Нашим командующим не хватает опыта."
 implant_request_desc_response:0 "Предоставьте это нам: у нас есть ригинг-плагин, выуженный 44 802 цикла назад из флота древней павшей империи корабельных дев. В нём — набор предельно точных нейрокарт, возможно совпадающих с одной из ваших командующих. Пусть все учёные страны сосредоточатся на анализе; найдя совпадение, через массовые приёмники сделаем OTA-заливку боевого опыта древних каждому командующему. \n§RНа время проекта все исследования империи встают§!"
 cic_request_desc:0 "Нам нужно поднять лимит управления флотами!"
 cic_request_desc_response:0 "Гнать исполинский флот из единого центра невозможно — даже суперстратегический центр не справится. Отбросьте устарелую мысль: скоординировать корабли между собой через умные машины и людей — и нагрузка на центр упадёт, а флот командующей вырастет. Пусть все учёные страны спроектируют и построят боевые информационные блоки для каждого корабля. \n§RНа время проекта все исследования империи встают§!"
 weapon_dmm_request_desc:0 "Не спроектировать ли нам мощное оборонительное оружие?"
 weapon_dmm_request_desc_response:0 "На деле, как в том исполинском взрыве госпожи Чанчунь, тёмная материя при контакте с кристаллом Альфа выделяет чудовищную энергию. Обороне не гоже дорого стоить: разнесём тёмную материю и кристаллы по половинкам сплавного корпуса — выйдет классическая мина. Рассыпав их по системе, получим непреодолимое минное поле. Но разработка корпуса и предобработка материалов потребуют массы ресурсов и науки. \n§RНа время проекта все исследования империи встают§!"
 sh_mine_request_desc_response:0 "Энергетическое ядро Глубинных так сильно излучает потому, что нестабильно. Добавь тёмной материи — нестабильность взлетит ещё. Оружием такое ядро не сделать, а вот космической миной — легко: рассыпанные по системе, они страшны любому. Проект этот, чреватый взрывом, потребует массы ресурсов и науки. \n§RНа время проекта все исследования империи встают§!"
 combat_uf_request_desc:0 "Нам грозит какая-то угроза?"
 combat_uf_request_response:0 "Откроем: есть сила по имени «Объединённый флот». Они наши старые друзья — мы знаем слабости, о которых не ведают даже красные приятели.\nРазумеется, под эти слабости придётся сильно перебрать ваше оружие — это время. §!\n§RНа время проекта все исследования империи встают§!"
 wsgranking.1200.desc:0 "Дорогой гость, мы заметили: купленные у нас услуги истекли. Продлить?"
 wsgranking.1200.a:0 "Позже."
 wg_shop_celebration:0 "Отпраздную-ка я фирменным супом из Дома…"
 wg_modifier_ultimate_project:0 "Финальный проект Лавки Трофеев"
 wsgranking.2002.name:0 "Бежать!"
 wsgranking.2002.desc:0 "Лавки Трофеев больше нет; всё руководство испарилось. Но недавно галактика приняла радиопослание:\n§Y    В этой галактике полно хитрецов — прощайте навсегда! §!\n§Y     Народ Сломанных Стульев§!"
 wsgranking.2002.a:0 "Прощайте навсегда"
 wsgranking.20110.desc:0 "Дорогие [Root.GetName], привет!\nПоздравляем с победой над Великим Ханом; из тихих закоулков нам стало кое-что интересно…"
 wsgranking.20110.a:0 "Продолжай, я слушаю"
 wsgranking.2011.desc:0 "Ладно, без прелюдий: вы заполучили §Yтрон хана§!, так? Наш народ очень интересуется этой реликвией — готовы выложить за неё кругленькую сумму.\n\nПредлагаем 2000 £energy£ §Y$energy$§! и 200 £sr_pantsu£ §Y$sr_pantsu$§!. Как вам?"
 wsgranking.2011_1.desc:0 "Ладно, без прелюдий: вы заполучили §Yтрон хана§!, и наш народ очень интересуется этой реликвией — потому готовы выложить за неё кругленькую сумму.\n\nЦена — 4000 £energy£ §Y$energy$§! и 400 £sr_pantsu£ §Y$sr_pantsu$§!; откажетесь — сочтём нарушением статьи 41 главы 81 «Принципа взаимной выгоды Лавки Трофеев» и оштрафуем на 538 724 194 £energy£ §Y$energy$§!"
 wsgranking.2011.a:0 "По рукам"
 wsgranking.2011.b:0 "Э-э… маловато будет! §G(торг)§!"
 wsgranking.2011.c:0 "Лучше не надо"
 wsgranking.2011.c.response:0 "Хмф! Ждите: я всё равно получу §Yтрон хана§!"
 wsgranking.2011.tooltip:0 "Сломанные Стулья выкупили трон Великого Хана"
 wsgranking.2011.e:0 "Э… по рукам"
 wsgranking.2011.f:0 "Какие-то жалкие полмиллиарда энергокредитов"
 wsgranking.2012.desc:0 "Нет: только столько и ни каплей больше."
 wsgranking.2012.a:0 "Ладно-ладно, по рукам"
 wsgranking.2013.desc:0 "Ну хорошо, действительно маловато. Тогда так:\n\nПоднимаем до 3000 £energy£ §Y$energy$§! и 300 £sr_pantsu£ §Y$sr_pantsu$§!. Как вам?"
 wsgranking.2013.b:0 "Да это же национальное сокровище… §B(торг)§!"
 wsgranking.2015.desc:0 "Ладно-ладно, вы мастер торговаться.\n\n5000 £energy£ §Y$energy$§! и 500 £sr_pantsu£ §Y$sr_pantsu$§!, плюс накинем 500 £alloys£ §Y$alloys$§!— выше нам не подняться!"
 wsgranking.2015.b:0 "Но стул-то правда очень удобный§Y (торг)§!"
 wsgranking.2017.desc:0 "Вам повезло: финансы у нас сейчас ничего.\n\n10000 £energy£ §Y$energy$§! и 1000 £sr_pantsu£ §Y$sr_pantsu$§!, и ещё 1000 £alloys£ §Y$alloys$§!— теперь-то согласны?!"
 wsgranking.2017.b:0 "О, автограф Хана на сиденье… §R(торг)§!"
 wsgranking.2019.desc:0 "Хватит!\n\n20000 £energy£ §Y$energy$§!,2000 £sr_pantsu£ §Y$sr_pantsu$§!,2000 £alloys£ §Y$alloys$§! и напоследок 1000 £sr_dark_matter£ §Y$sr_dark_matter$§! Не согласны — разговор окончен!"
 wsgranking.2020.name:0 "Трон хана украден!"
 wsgranking.2020.desc:0 "Наша государственная сокровищница ограблена: §Yтрон хана§! исчез!!\n\nВне всяких сомнений, это Сломанные Стулья — но как они прошли все рубежи защиты, не оставив следа, нам неведомо. С учётом партнёрства и того, что наши очки подвига слегка подросли, придётся проглотить."
 wsgranking.2020.a:0 "Воры!"
 wsgranking.2021.name:0 "Мы поймали агента Сломанных Стульев!"
 wsgranking.2021.desc:0 "Наша сокровищница вновь атакована — но оборонительная система агента перехватила. Под пыткой воровка призналась, что её наняли полисы Сломанных Стульев для кражи §Yтрона хана§!, сами полисы всё отрицают. С учётом партнёрства и того, что наши очки подвига слегка подросли, дела шить не будем."
 wsgranking.2021.a:0 "Хоть понимают, что к чему!"
 wsgranking.2022.name:0 "Нечаянная находка"
 wsgranking.2022.desc_01:0 "Разгромив коварные полисы Сломанных Стульев, мы нашли в обломках §Yвыкупленный§! ими трон хана!\nТолько отчего у столь прочного творенья сиденье продавлено с необратимыми повреждениями — эффект сильно померк."
 wsgranking.2022.desc_02:0 "Разгромив коварные полисы Сломанных Стульев, мы нашли в обломках §Yукраденный§! ими трон хана!\nТолько отчего у столь прочного творенья сиденье продавлено с необратимыми повреждениями — эффект сильно померк."
 wsgranking.2022.a:0 "Жаль"
 drums_of_war2:0 "Разбитый барабан"
 r_eila_throne:0 "Повреждённый трон хана"
 r_eila_throne_desc:0 "Трон Великого Хана, добытый полисами Сломанных Стульев неведомыми путями; отчего-то даже столь прочное творение получило невосстановимые повреждения — эффект сильно померк."
 pantsu_shop_canteen_name:0 "Столовая Сломанных Стульев"
 wsgranking.2030.desc:0 "Друзья издалека, вам повезло: у нас гастрофест — случается раз в несколько месяцев. По традиции вся еда бесплатна: не отведать ли?\n\nРазумеется, сперва подпишите эту §Y«форму отказа от претензий»§!"
 wsgranking.2030.a:0 "Отведаем"
 wsgranking.2030.tooltip:0 "§YЕда неизвестна, эффект неизвестен§!"
 wsgranking.2030.b:0 "А что за еда? Какие эффекты?"
 wsgranking.2030.b.response:0 "Спрашивать в столовой Сломанных Стульев, что сегодня на столе, — верх невоспитанности: деталей меню не раскроем.\nОб эффекте: блюда дадут невиданные бонусы — если повар готовил по рецепту и продукты были нормальные."
 wsgranking.2030.c:0 "Звучит опасно — лучше нет."
 wsgranking.2031.name:0 "Тостовый хлеб"
 wsgranking.2031.desc:0 "Какой-то технологией Сломанные Стулья скрыли истинный облик еды.\nОтведав, мы поняли: это особый тостовый хлеб — он поднимает обучаемость наших лидеров!"
 wsgranking.2031.a:0 "А где такой покупают?"
 wg_modifier_canteen1:0 "Тостовый хлеб"
 wsgranking.2032.name:0 "Флотский карри"
 wsgranking.2032.desc:0 "Какой-то технологией Сломанные Стулья скрыли истинный облик еды.\nОтведав — это флотский карри! — мы почувствовали прилив бодрости, оч-чень бодро! Экипажи сбрасывают лишнюю прыть на корабельных велогенераторах, а энергия идёт на самообслуживание корабля."
 wsgranking.2032.a:0 "Так точно! Бодро!"
 wg_modifier_canteen2:0 "Флотский карри"
 wsgranking.2033.name:0 "Острые палочки"
 wsgranking.2033.desc:0 "Какой-то технологией Сломанные Стулья скрыли истинный облик еды.\nОтведав, мы выяснили: это острые палочки; снек разошёлся на ура — влияние наше выросло."
 wsgranking.2033.a:0 "Отлично!"
 wg_modifier_canteen3:0 "Острые палочки"
 wsgranking.2034.name:0 "Багет"
 wsgranking.2034.desc:0 "Какой-то технологией Сломанные Стулья скрыли истинный облик еды.\nЧуть не сломав зубы, мы поняли: это багет. Наши генералы в восторге — годится на вооружение пехоты."
 wsgranking.2034.a:0 "Оружие страшное"
 wg_modifier_canteen4:0 "Багет"
 wsgranking.2035.name:0 "«Уоллес»"
 wsgranking.2035.desc:0 "Какой-то технологией Сломанные Стулья скрыли истинный облик еды.\nОтведав — это фастфуд «Уоллес»! — все наши корабли теперь летают безумно быстро."
 wsgranking.2035.a:0 "Высоко — не знаю куда!"
 wg_modifier_canteen5:0 "«Уоллес»"
 wsgranking.2036.name:0 "Фиш-энд-чипс"
 wsgranking.2036.desc:0 "Какой-то технологией Сломанные Стулья скрыли истинный облик еды.\nОтведав — это фиш-энд-чипс! — наша ПВО по неведомой причине стала эффективнее."
 wsgranking.2036.a:0 "Удивительно"
 wg_modifier_canteen6:0 "Фиш-энд-чипс"
 wsgranking.2037.name:0 "IRP"
 wsgranking.2037.desc:0 "Какой-то технологией Сломанные Стулья скрыли истинный облик еды.\nОтведав — это пачка IRP!\nКак говорят, настоящие солдаты [Root.GetSpeciesName] умеют выживать в дикой природе — приучать армию к IRP надо обязательно."
 wsgranking.2037.a:0 "Жаль, флотские не едят"
 wg_modifier_canteen7:0 "IRP"
 wsgranking.2038.name:0 "Тушёнка из морской звезды"
 wsgranking.2038.desc:0 "Какой-то технологией Сломанные Стулья скрыли истинный облик еды.\nОтведав — это изумительная тушёнка из морской звезды, все счастливы! Полисы пояснили: после того как эти звёзды взорвали планету, они стали традиционным деликатесом одной империи."
 wsgranking.2038.a:0 "Традиционный деликатес грех не отведать!"
 wg_modifier_canteen8:0 "Тушёнка из морской звезды"
 wsgranking.2039.name:0 "Молочный напиток «Шесть боеголовок»"
 wsgranking.2039.desc:0 "Какой-то технологией Сломанные Стулья скрыли истинный облик еды.\nОтведав — это легендарный §Yмолочный напиток «Шесть боеголовок»§!! Учёная [wg_canteen_scientist.GetName], отведав, поймала вдохновение и стала невиданно умна."
 wsgranking.2039.a:0 "Превосходно"
 wsgranking.2040.name:0 "Сюрстрёмминг"
 wsgranking.2040.desc:0 "Какой-то технологией Сломанные Стулья скрыли истинный облик еды.\nНе успев отведать, мы вылетели из столовой, сражённые зловонием — §Yсюрстрёмминг§!! Хуже всего: вонь с нас не смывается, позорище!"
 wsgranking.2040.a:0 "Хм-хм!"
 wg_modifier_canteen10:0 "Сюрстрёмминг"
 wsgranking.2041.name:0 "Водка"
 wsgranking.2041.desc:0 "Какой-то технологией Сломанные Стулья скрыли истинный облик еды.\nОтведав — это §Yводка§!! Все научные изыскания теперь пахнут спиртом и идут медленнее."
 wsgranking.2041.a:0 "Ура!"
 wg_modifier_canteen11:0 "Учёные пьяны"
 wsgranking.2042.name:0 "Водка"
 wsgranking.2042.desc:0 "Какой-то технологией Сломанные Стулья скрыли истинный облик еды.\nОтведав — это §Yводка§!! Командующие теперь дерутся всё яростнее и отступать отказываются наотрез."
 wsgranking.2042.a:0 "Ура!"
 wg_modifier_canteen12:0 "Командующие пьяны"
 wsgranking.2043.name:0 "Багл-пирог"
 wsgranking.2043.desc:0 "Какой-то технологией Сломанные Стулья скрыли истинный облик еды.\nОтведав, никто не смог определить это блюдо по вкусу — зато полезли какие-то странные баги…"
 wsgranking.2043.a:0 "Чиним и латаем игру…"
 wg_modifier_canteen13:0 "Багл-пирог"
 wsgranking.2044.name:0 "Арбуз"
 wsgranking.2044.desc:0 "Какой-то технологией Сломанные Стулья скрыли истинный облик еды.\nОтведав — это дивный арбуз! Увы, феи верфи объелись и бегают в уборную так часто, что постройка кораблей замедлилась."
 wsgranking.2044.a:0 "Но ведь правда вкусно"
 wg_modifier_canteen14:0 "Арбуз"
 wsgranking.2045.name:0 "Доухао (тофу-пудинг)"
 wsgranking.2045.desc:0 "Какой-то технологией Сломанные Стулья скрыли истинный облик еды.\nОтведав — это доухао! Но наши люди раскололись на два лагеря: сладкий он должен быть или солёный…"
 wsgranking.2045.a:0 "Доухао должно быть X"
 wg_modifier_canteen15:0 "Война сладкого и солёного"
 wsgranking.2046.name:0 "Снотворный чай"
 wsgranking.2046.desc:0 "Какой-то технологией Сломанные Стулья скрыли истинный облик еды.\nОтведав — обычный чай, но вскоре всех сморил сон…\nОчнувшись, все обнаружили пропажу личных вещей до последней мелочи."
 wsgranking.2046.a:0 "Ааааааа, хн-аааа!"
 wsgranking.2047.name:0 "Мороженое «ПАТ-ПАТ»"
 wsgranking.2047.desc:0 "Какой-то технологией Сломанные Стулья скрыли истинный облик еды.\nОказалось — §Yмороженое «ПАТ-ПАТ»§!: все девы растворились в сладкой неге."
 wsgranking.2047.a:0 "Постой, а ночью-то что?"
 wg_modifier_canteen_affectionUp1:0 "Мороженое «ПАТ-ПАТ»"
 wg_modifier_canteen_affectionUp1_tooltip:0 "£sr_wg_up£ Шанс привязанности всех лидеров удвоен!"
 wsgranking.2048.name:0 "Танъюань"
 wsgranking.2048.desc:0 "Какой-то технологией Сломанные Стулья скрыли истинный облик еды.\nА это — §Yтанъюань§!! Пробовавшие девы, особенно из страны C, хвалят наперебой — и сами стали липкими, как танъюань!"
 wsgranking.2048.a:0 "Хорошо-то как… только народу что-то многовато-о-о…"
 wsgranking.2048.a.tooltip:0 "£sr_wg_up£ Привязанность всех лидеров удвоена! (особые события не считаются)"
 wg_modifier_canteen_affectionUp2:0 "Танъюань"
 wg_modifier_canteen_affectionUp2_tooltip:0 "£sr_wg_up£ Привязанность всех лидеров удвоена!(особые события не считаются)"
 pantsu_shop_logotitan:0 "Взгляните на этот титан: замечаете отличие? Да! На носу — исполинская голографическая реклама!! Единственный в галактике — мечта коллекционера!! Всего 10000 £energy£ §Y$energy$§! и 3000 £sr_pantsu£ §Y$sr_pantsu$§!\nЕсли вы в здравом уме — вы уже тянетесь за кошельком."
 wsgranking.2100.a:0 "А какова комплектация титана?"
 wsgranking.2100.a.response:0 "В ангаре — олимпийский бассейн, так что авиацию он не поднимает; у пусковых — грандиозная гостиная, так что ракеты не запускаются; зато семейный кинотеатр на несколько тысяч мест! Содержание кусается, но психическое здоровье экипажа — прежде всего. Отделка: классика с постмодерном, мебель — вся кожа, тюленья.\nАх, вы про вооружение? Э-э… ну, оно там есть."
 wsgranking.2100.b:0 "Берём-берём"
 wsgranking.2100.c:0 "Как-нибудь потом"
 pantsu_shop_logotitan2:0 "Благодарим за покупку!! Красавица уже летит в вашу столицу!\n\nСегодня ваш день, у нас ещё новость!!\nМы дарим вам пакет §Y«Всё лучшее»§!: 30 секунд гарантии с возвратом, бесплатные космические похороны всего экипажа в случае взрыва и — главное! — бесплатная замена LOGO на корпусе. Что выберете…"
 wsgranking.2101.a:0 "Открывайте, свободная торговля"
 wsgranking.2101.b:0 "Красная армия всех сильней"
 wsgranking.2101.c:0 "Я хочу смайлик"
 wsgranking.2101.d:0 "Мне нужно перегруппировать войска"
 wsgranking.2101.e:0 "Честно говоря, я учебный ИИ — повешу трофей"
 wsgranking.2101.f:0 "Слава кошачьим питомникам Куат!"
 logo_titan:0 "LOGO-титан"
 mod_weapon_type_wsg_pantsu_weapon_damage_mult:0 "Урон оружия Лавки Трофеев"
 mod_weapon_type_wsg_pantsu_weapon_fire_rate_mult:0 "Скорострельность оружия Лавки Трофеев"
 wsgranking.2104.name:0 "Центр огранки колец достроен"
 wsgranking.2104.desc:0 "Чертежи ренегата верны: стартуем производство!\nВложим ресурсы — раз в 5 лет будем получать кольцо; сообщим."
 wsgranking.2104.a:0 "Отлично"
 wsgranking.2105.name:0 "Кольцо готово"
 wsgranking.2105.desc:0 "Мы выточили кольцо; теперь их у нас §Y[Root.wsg_rings]§!"
 wsgranking.2105.a:0 "Так держать."
 wsgranking.2105.b:0 "Больше не сообщайте."
 wg_shop_exchange_resource_number:0 "£sr_pantsu£ [from.wg_shop_exchange_resource]"
 wg_shop_exchange_resource_plus20_tooltip:0 "Объём сделки +20"
 wg_shop_exchange_resource_minus20_tooltip:0 "Объём сделки -20"
 wg_shop_exchange_resource_plus500_tooltip:0 "Объём сделки +500"
 wg_shop_exchange_resource_minus500_tooltip:0 "Объём сделки -500"
 wg_shop_exchange_resource_max_reached:0 "Достигнут максимум разовой сделки"
 wg_shop_exchange_resource_min_reached:0 "Минимум разовой сделки — 100!"
 wg_shop_exchange_resource_max_tooltip:0 "Выставить максимум"
 wg_shop_exchange_resource_min_tooltip:0 "Выставить 100 (минимум)"
 wg_coffee_ticket_deficiency:0 "Не хватает талонов"
 wg_coffee.18.name:0 "Кафе Лавки Трофеев"
 wg_coffee.18.desc:0 "Добро пожаловать в кафе Лавки Трофеев: все яства отобраны из разных измерений — каждый глоток бесценен. Кого пригласите на ужин сегодня?\nНаши блюда ограничены: за каждое — один талон. Каждые §Yпять лет§! мы выдаём §Y10 талонов§!.\nСейчас у вас §Y[this.wg_coffee_ticket] талонов§!\n\n§PПримечание: приглашать можно только лидеров с привязанностью§!"
 wg_coffee.18.leader1:0 "§Y[leader_tobe_view_1.GetName]§!"
 wg_coffee.18.leader2:0 "§Y[leader_tobe_view_2.GetName]§!"
 wg_coffee.18.leader3:0 "§Y[leader_tobe_view_3.GetName]§!"
 wg_coffee.18.leader4:0 "§Y[leader_tobe_view_4.GetName]§!"
 wg_coffee.18.leader5:0 "§Y[leader_tobe_view_5.GetName]§!"
 wg_coffee.18.a:0 "Назад"
 wg_coffee.18.b:0 "Далее"
 wg_coffee.18.c:0 "Не сегодня"
 wg_coffee.19.name:0 "Кафе Лавки Трофеев"
 wg_coffee.19.desc:0 "Привет, тут здорово — особенно делить трапезу с тобой. Что закажем?"
 wg_coffee.19.desc_2:0 "Может, ещё что-нибудь?"
 wg_coffee.19.a:0 "Чай с россыпью розовых цветков"
 wg_coffee.19.a_tooltip:0 "§TКафе Лавки Трофеев§!\n\n\n\n£wg_pantsu_plaza_food_1£\n\n\n\nГоворят, в этот чай добавлены розовые цветы из иного мира: сладковат — и по телу разливается тепло.\n\n§HЭффект§!:\n§Y[coffee_leader.GetName]§! £sr_wg_up£§Yпривязанность: §!§G+5§!"
 wg_coffee.19.b:0 "Чистый торт"
 wg_coffee.19.b_tooltip:0 "§TКафе Лавки Трофеев§!\n\n\n\n£wg_pantsu_plaza_food_2£\n\n\n\nПотрясший гастрокосмос торт из десятков ингредиентов не нашей вселенной, выпеченный неведомыми технологиями. Побочка: до конца дня вы — мезугаки.\n\n§HЭффект§!:\n§Y[coffee_leader.GetName]§! £sr_wg_up£§Yпривязанность: §!§G+5§!\n§Y[coffee_leader.GetName]§!§Y опыт: §!§G+200§!"
 wg_coffee.19.c:0 "Шоколад «Кейн»"
 wg_coffee.19.c_tooltip:0 "§TКафе Лавки Трофеев§!\n\n\n\n£wg_pantsu_plaza_food_3£\n\n\n\nС благословения межмировой мегазвезды §Hпророка Кейна§!: шоколад из синих тибериальных какао-бобов заряжает энергией — не остановиться; а синее свечение добавит ночи шарма.\n\n§HЭффект§!:\n§Y[coffee_leader.GetName]§! £sr_wg_up£§Yпривязанность: §!§G+10§!\n§Y[coffee_leader.GetName]§!§Y опыт: §!§G+300§!"
 wg_coffee.19.d:0 "Свежая нарезка подсолнухов"
 wg_coffee.19.d_tooltip:0 "§TКафе Лавки Трофеев§!\n\n\n\n£wg_pantsu_plaza_food_4£\n\n\n\nДжедай-мастер §BСкайуокер§! станет вашим личным омакасэ-поваром и нарежет подсолнухов при вас.\n\n§HЭффект§!:\n§Y[coffee_leader.GetName]§! £sr_wg_up£§Yпривязанность: §!§G+15§!\n§Y[coffee_leader.GetName]§!§Y опыт: §!§G+500§!"
 wg_coffee.19.e:0 "Летающая паста"
 wg_coffee.19.e_tooltip:0 "§TКафе Лавки Трофеев§!\n\n\n\n£wg_pantsu_plaza_food_5£\n\n\n\nПаста-не-паста.\n\n§HЭффект§!: §Y[coffee_leader.GetName]§! £sr_wg_up£§Yпривязанность: §!§G+25§!\n§Y[coffee_leader.GetName]§!§Y опыт: §!§G+500§!"
 wg_coffee.19.f:0 "Пельмешки с зро"
 wg_coffee.19.f_tooltip:0 "§TКафе Лавки Трофеев§!\n\n\n\n£wg_pantsu_plaza_food_6£\n\n\n\nПаровые пельмешки с зро: ночная жизнь насытится пионикой.\n\n§HЭффект§!:\n§Y[coffee_leader.GetName]§! £sr_wg_up£§Yпривязанность: §!§G+20§!\n§Y[coffee_leader.GetName]§!§Y опыт: §!§G+600§!"
 wg_coffee.19.g:0 "Ананас, жареный с пайнаплом, от мастера Цзяня"
 wg_coffee.19.g_tooltip:0 "§TКафе Лавки Трофеев§!\n\n\n\n£wg_pantsu_plaza_food_7£\n\n\n\n18 килограммов пайнапла с ананасом от знаменитого шефа §Bмастера Цзяня§!: вас ждёт многоцветная ночь.\n\n§HЭффект§!:\n§Y[coffee_leader.GetName]§! £sr_wg_up£§Yпривязанность: §!§G+25§!\n§Y[coffee_leader.GetName]§!§Y опыт: §!§G+600§!"
 wg_coffee.19.h:0 "Зачарованное золотое яблоко"
 wg_coffee.19.h_tooltip:0 "§TКафе Лавки Трофеев§!\n\n\n\n£wg_pantsu_plaza_food_8£\n\n\n\nЗолотое яблоко в фиолетовом свечении — не простое: вкус — взрыв, ощущение — как на троне мира.\n\n§HЭффект§!:\n§Y[coffee_leader.GetName]§! £sr_wg_up£§Yпривязанность: §!§G+25§!\n§Y[coffee_leader.GetName]§!§Y опыт: §!§G+800§!"
 wg_coffee.19.i:0 "Денег нет, есть не будем"
 wg_coffee.19.i_allow:0 "Мы уже поели."
 wg_coffee.19.i_tooltip:0 "Притащить меня сюда — и ничего не делать??\n\n§HЭффект§!: §Y[coffee_leader.GetName]§! в ярости, £sr_wg_down£§Yпривязанность: §!§R -5§!"
 wg_coffee.19.j:0 "Вкусная горничная"
 wg_coffee.19.j_tooltip:0 "§TКафе Лавки Трофеев и «Вкусная горничная»§!\n\n\n\n£wg_pantsu_plaza_food_9£\n\n\n\nВысокопроизводительная горничная из §Yкосмокомпании «CHOUGOU»§!: и забавна, и вкусна; эта — со вкусом ванили.\n\n§HЭффект§!:\n§Y[coffee_leader.GetName]§! £sr_wg_up£§Yпривязанность: §!§G+25§!\n§Y[coffee_leader.GetName]§!§Y опыт: §!§G+800§!"
 wg_coffee.19.k:0 "Сет: американо и ананасовая пицца"
 wg_coffee.19.k_tooltip:0 "§TКафе Лавки Трофеев§!\n\n\n\n£wg_pantsu_plaza_food_10£\n\n\n\nРодом из некоей И*алии, доведённый до совершенства. Спросите, что такой еды делать в ресторане такого класса? Да потому что все знают: в высокой кухне едят не вкус — как бы нищ был ингредиент, люди сами договорят ему цену, лишь бы не казаться глупцами.\n\n§HЭффект§!:\n§Y[coffee_leader.GetName]§!§Y опыт: §!§G+50§!"
 wg_coffee.19.l:0 "Наелись, пошли"
 wg_coffee.19.l_allow:0 "Мы ещё ничего не ели!"
 wg_coffee.19.l_tooltip:0 "(Как же тут всё дорого.)"
 wg_coffee.19.m:0 "Сияющий жареный рис"
 wg_coffee.19.m_tooltip:0 "§TКафе Лавки Трофеев§!\n\n\n\n£wg_pantsu_plaza_food_11£\n\n\n\nОсобый рис от шефа императорской кухни Великого Мин: в миг готовности — яркая вспышка; вкус — взрыв (физический).\n\n§HЭффект§!:\n§Y[coffee_leader.GetName]§! £sr_wg_up£§Yпривязанность: §!§G+20§!\n§Y[coffee_leader.GetName]§!§Y опыт: §!§G+600§!"
