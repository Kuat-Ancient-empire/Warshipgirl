l_russian:

 wsgranking.997.title:0 "Таинственный полис"
 wsgranking.997.desc:0 "Этот затерянный в уголке галактики народ не отвечает на наши вызовы — но военные твердыни и корабли явно работают исправно, а враждебности к нам никакой."
 wsgranking.999.title:0 "Народ Сломанных Стульев"
 wsgranking.999.desc:0 "Едва мы освоили приготовление трусиков, как издалека пришло послание от полиса «народа Сломанных Стульев». Учёные считают: это кочевая цивилизация нашего же рода, наблюдавшая за нами ещё задолго до нашего выхода в космос."
 wsgranking.999.a:0 ""
 pantsu_shop_name:0 "Полисы Сломанных Стульев"
 wsgranking.1000.desc:0 "Здравствуйте, гости издалека! Мы — полисы народа Сломанных Стульев: поколениями живём в космосе, торгуя товарами и услугами странам корабельных дев и Глубинных. Силу вашей империи мы меряем собственным способом — «очками подвига». Торгуйте с нами: чаще всего мы берём трофеи, иногда — энергокредиты."
 wsgranking.1000.a:0 "Посмотрим, что тут можно купить."
 wsgranking.1000.b:0 "Как-нибудь потом."
 pantsu_shop_hello1:0 "Мы продаём не только товары, но и услуги! Так вступайте в наши ряды продавцов!… Ой, извините, резюме пока не принимаем."
 pantsu_shop_hello2:0 "Что изволите, дорогой гость? Автоматическую плазменную пушку 152CM? Жидкий металл? Команду консультантов по торговле? Или, может, обручальные кольца — только у нас?\nНу пожалуйста, купите хоть что-нибудь. Хоть что-нибудь."
 pantsu_shop_hello3:0 "У нас, Сломанных Стульев, нет «босса»: каждый — босс каждому. Но оценка наша беспристрастна абсолютно: система работала ещё до того, как вы нас открыли."
 origin_pantsu_shop_hello1:0 "О, здравствуйте, партнёр! Чем сегодня порадуете?"
 origin_pantsu_shop_hello2:0 "Вы у нас человек бывалый — выбирайте на здоровье."
 origin_pantsu_shop_hello3:0 "«Ай! Больно-больно… Стул опять сломался! Сколько раз говорить: не суйте мне эти дешёвые стулья!»\nА… это вы, партнёр. Пока походите сами — нынче недосуг вас обслужить."
 wsgranking.1001.a:0 "Сколько у нас очков подвига?"
 wsgranking.1001.b:0 "Мы хотим поторговать."
 wsgranking.1001.c:0 "Я хочу сыграть с тобой в игру."
 wsgranking.1001.a.response:0 "По нашей оценке, у вас §Y[Root.rankpts]§! $rankpts$\nПоднять очки можно по-разному: убить левиафана, изучить редкую технологию, возвести мегаструктуру… К тому же сертификация подвига автоматически даёт §Y1–3§! очка в год."
 wsgranking.1001.a.response2:0 "§Y[Root.rankpts]§! очков"
 pantsu_shop_cooldown_desc:0 "Уж простите, дорогой гость: нас, Сломанных Стульев, осталось немного, и все заняты вашим прошлым заказом. Загляните позже."
 wsgranking.1003.desc:0 "Извините: странам, которые на нас нападают, мы не торгуем. За тысячелетия нас осталось слишком мало — на бесчинства мы зла не держим, но и не спускаем."
 wsgranking.1003.a:0 "Закрыть связь."
 wsgranking.1004.desc:0 "Мы никогда не спрашиваем, зачем вы покупаете наши товары. Хоть для геноцида — без разницы!"
 wsgranking.1004.desc.b:0 "Выбирайте смело: товар у нас первоклассный, вы же знаете."
 wsgranking.1004.a:0 "Мы хотим купить эксклюзивное оружие и технологии."
 wsgranking.1004.b:0 "Что могут для нас ваши команды профи?"
 wsgranking.1004.c:0 "Может, продадите немного редких ресурсов?"
 wsgranking.1004.d:0 "Мы хотим купить обручальное кольцо."
 wsgranking.1004.e:0 "Мы заинтересованы вашими «ультимативными проектами»."
 wsgranking.1004.f:0 "Я хочу пригласить лидера на ужин ради £sr_wg_up£§Yпривязанности§!"
 wsgranking.1005.desc:0 "Этот вес! Эта мощь! Это сияние! Оружия — не счесть, заходите! А такую передовую технологию вы видели? Она вас зовёт."
 wsgranking.1005.desc.b:0 "Оружие только у нас; секреты фирмы не выдаём даже вам — за то и деньги платят."
 tech_cooldown_desc:0 "Чертежи прошлого заказа ещё не переданы — мгновение терпения."
 wsgranking.1007.desc:0 "Наши команды профи к вашим услугам: едят только мороженое «ПАТ-ПАТ» и лапшу «без вкуса», хлопот почти не доставляют. Срок зависит от сложности задачи!\nСейчас вы можете держать ещё §Y[Root.max_allowed_shop_buffs]§! бонусов Лавки Трофеев."
 wsgranking.1007.desc.b:0 "Чем займётся наша команда?\nСейчас вы можете держать ещё §Y[Root.max_allowed_shop_buffs]§! бонусов Лавки Трофеев."
 wsgranking.1007.a:0 "Пусть поднимут наше производство."
 wsgranking.1007.b:0 "Пусть побудут нашими дипломатами"
 wsgranking.1007.c:0 "Поучат нас космическим наукам?"
 wsgranking.1020.desc:0 "Мы знаем сотни способов поднять промышленность: секрет — в тысячелетиях наблюдений за сотнями обществ корабельных дев и Глубинных.\nКонечно, чудеса и магия не бесплатны. Как и мощный рост производительности."
 wsgranking.1020.desc.b:0 "Ресурсов не хватает? Не волнуйтесь: вы — старый клиент, выложимся по полной."
 wsgranking.1021.desc:0 "Да-да: мы выжили в одиночку и купаемся в деньгах именно потому, что умеем ладить с чужаками.\nК нам — и только к нам. Но чего не взять на поле боя, того не взять и за столом переговоров. А не заплатив — тем более."
 wsgranking.1021.desc.b:0 "Надо же, и вам изредка нужна дипломатическая помощь?"
 wsgranking.1022.desc:0 "Вы нашли экспертов: наш секрет выживания в этом полном кризисов космосе — стратегия «обмена базами» на 200 лет впереди всей галактики! Как говорится: «освоишь моё макро — останется только F2A»."
 wsgranking.1022.desc.b:0 "Только нищеброды маневрируют; я меняю базу на базу в лоб… Вопросы?"
 wsgranking.1009.desc:0 "У нас в руках редчайшие товары галактики — вы ни за что не угадаете, откуда они!\n\nПроисхождение — секрет, качество — высшее."
 wsgranking.1009.a:0 "Мы хотим купить ресурсы"
 wsgranking.1009.b:0 "Мы хотим подписать пару фьючерсов"
 end_contract:0 "Мы хотим расторгнуть один фьючерс"
 end_all_contract:0 "Мы хотим расторгнуть все фьючерсы"
 wsgranking.1010.desc:0 "У вас есть милая сердцу особа, верно? Это альфа-кольцо она оценит. Или взгляните на тёмно-материальное? Или нейтронно-стальное — за десять миллионов лет ни царапинки! Не то?.. Тогда — сокровище нашей лавки: кольцо в каратах, что соперничает со Звездой Галактики!"
 wsgranking.1010.desc.b:0 "О-о, на кого на этот раз? Секрет? Тьфу, извращенец. Вот кольцо: деньги на бочку. А, кстати: новинка — «Звезда Галактики» на 1000 карат, не попробовать ли?"
 wsgranking.1010.a:0 "Нам бы просто обычное кольцо"
 not_enough_rings:0 "§RКолец на складе мало — заходите позже. §!"
 wsgranking.1010.b:0 "А можем ли мы сами производить кольца?"
 wsgranking.1010.b.desc:0 "§HРенегат тихонько заводит вас в глухой угол Лавки Трофеев и вручает чертежи§!\n\nТеперь на планете можно построить §YЦентр огранки колец§! и делать кольца самим."
 wsgranking.1010.b.tooltip:0 "§RЛавка считает способ производства обручальных колец высшей тайной — но при деньгах на подкуп ренегата… §!"
 missing_tech_wsg_alpha:0 "Нужна технология §Y$tech_building_wsg_alpha$§!"
 not_in_shop_system:0 "$TRIGGER_FAIL$ Производить кольца у Лавки под носом — это какое-то NTR"
 wsgranking.1011.desc:0 "Какой ресурс изволите? Такого редкого товара, как у нас, во всей вселенной не сыскать — упустите этот раз — больше не предложат.\n\n§HПодсказка: стрелками над пунктом выбирается объём покупки§!"
 wsgranking.1011.desc.b:0 "Чего не хватает? Успокойтесь: наш склад не кончается.\n\n§HПодсказка: стрелками над пунктом выбирается объём покупки§!"
 pantsu2dm:0 "Мы хотим купить §H$sr_dark_matter$§!"
 dark_matter_sold_out:0 "§RСклад §H$sr_dark_matter$§R пуст! Загляните позже. §!"
 pantsu2zro:0 "Мы хотим купить §H$sr_zro$§!"
 zro_sold_out:0 "§RСклад §H$sr_zro$§R пуст! Загляните позже. §!"
