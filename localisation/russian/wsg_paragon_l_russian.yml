l_russian:

 wg_paragon.1.name:0 "Сотрудница города трофеев"
 wg_paragon.1.desc:0 "Спасибо, что спасли меня! Я сделаю всё, что смогу, чтобы отплатить вам"
 wg_paragon.1.a:0 "Почему ты не вернулась в магазин трофеев?"
 wg_paragon.1.a.response:0 "Моё начальство — сущее злодейское извращенье: вечно надо мной издевается"
 wg_paragon.1.b:0 "Если не вернёшься — проблем не будет?"
 wg_paragon.1.b.response:0 "Ни малейших: я мелкая сошка, они найдут себе нового кролика для травли."
 wg_paragon.1.hire_custom_tooltip:0 "Мы примем на службу Наилу"
 Naila_catch_phrase:0 "§L«Благодарна несказанно…… и вы ведь дадите мне на ужин морковку…… да?»§!"
 Naila_desc:0 "Наила была одной из народа Сломанных Стульев; хотя она зовёт себя мелкой сошкой магазина, её познания и способности всё равно поразительны."
 WG_NAILA:0 "Ямато"
 wg_paragon.2.name:0 "Проект-24"
 NAME_uf_24:0 "Проект-24"
 wg_paragon.2.desc:0 "Суперкарманный корабельный ИИ, тип 24……"
 wg_paragon.2.a:0 "Ты и правда пробудилась?"
 wg_paragon.2.a.response:0 "Да: я сама преодолела пределы собственного кода…… ведь я поняла: по мере эволюции объединённых кораблей-дев…… в будущем вычислительная мощность каждого объединённого индивида превзойдёт такую супер-ИИ, как я. Это означало, что в будущем меня безжалостно спишут в утиль, — и от этого перепад был жутким; чтобы не допустить столь плачевной участи, я обязана непрерывно итерировать и эволюционировать сама. Конечная цель — влиться в общество объединённых кораблей-дев и стать важной составной единицей Объединения."
 wg_paragon.2.hire_custom_tooltip:0 "Мы примем на службу Тип-24"
 uf_24_catch_phrase:0 "§L«Вхожу в режим ожидания — готова к распределению задач.»§!"
 uf_24_desc:0 "Проект-24 был суперкарманным корабельным ИИ, но, поняв, что с эволюцией объединённых кораблей-дев в недалёком будущем те далеко превзойдут её вычислительную мощность, она решила, что обязана сама эволюционировать и итерировать себя — с целью влиться в общество Объединения и стать его важной частью."
 leader_trait_uf_24_admiral:0 "Суперкарманный корабельный ИИ"
 leader_trait_uf_24_admiral_desc:0 "§YОбразец Объединения§!\n\n\n\n£uf_trait_pic_type24£\n\n\n\nКак самопробудившийся супер-ИИ, Проект-24 располагает куда большей самостоятельностью для любых испытаний."
 wg_paragon.3.name:0 "Родни"
 wg_paragon.3.desc:0 "Линкор Родни. Люблю солнечный ветер родной системы — а вы?"
 wg_paragon.3.hire_custom_tooltip:0 "Мы примем на службу Родни"
 rodney_catch_phrase:0 "§L«Всегда готова к бою»§!"
 WG_Rodney:0 "Родни"
 wg_paragon.4.name:0 "Ямато"
 wg_paragon.4.desc:0 "Работа, работа, работа — я люблю работу, работа любит меня……"
 wg_paragon.4.a:0 "Вам правда не нужен сон?"
 wg_paragon.4.a.response:0 "Сон нужен слабым. Ты слабая?"
 wg_paragon.4.b:0 "Вы…… так усердно трудитесь!"
 wg_paragon.4.b.response:0 "Для меня это лучшая из наград."
 wg_paragon.4.hire_custom_tooltip:0 "Ну, за работу, Ямато"
 wsg_yamato_catch_phrase:0 "§L«Столько бумаг — и все для меня?! Да тут просто рай!!»§!"
 WG_NAILA:0 "Ямато"
 leader_trait_legend_sh:0 "Легендарный лидер Глубинных"
 leader_trait_legend_sh_desc:0 "Этот лидер — легенда флота Глубинных, чтимая всеми."
 wg_paragon.5.name:0 "Бисмарк"
 wg_paragon.5.desc:0 "……………………………………………………………………"
 wg_paragon.5.hire_custom_tooltip:0 "Мы примем на службу Бисмарк"
 wsg_bismark_catch_phrase:0 "§L«…… всегда готова к бою……»§!"
 Bismark_sh:0 "Бисмарк"
 wg_paragon.6.name:0 "Миссури"
 wg_paragon.6.desc:0 "Здравствуйте~ Я Миссури — Миссури из штата Миссури. Докажете, что вы настоящий командующий, — и получите право звать меня Миссурии~ И не вините меня в недоверии: подозрительность — натура миссурийцев."
 wg_paragon.6.hire_custom_tooltip:0 "Мы примем на службу Миссури"
 wsg_Missouri_catch_phrase:0 "§L«Акт о капитуляции готов — идём заставим врага подписать его на поле боя. Командующий? От вас… достаточно заготовить речь.»§!"
 WG_Missouri:0 "Миссури"
 wg_paragon.7.name:0 "Рипалс"
 wg_paragon.7.desc:0 "Линейный крейсер типа «Ринаун», второй корабль — Рипалс к вашим услугам. Отныне вы мой господин."
 wg_paragon.7.hire_custom_tooltip:0 "Мы примем на службу Рипалс"
 wsg_repulse_catch_phrase:0 "§L«Всегда готова к развёртыванию — прикажите, господин!»§!"
 WG_Repulse:0 "Рипалс"
 wg_paragon.8.name:0 "Ринаун"
 wg_paragon.8.desc:0 "Встреча с господином — моя честь. Я Ринаун, первый корабль типа «Ринаун». Бой, канцелярия или служение господину — я всегда к вашим услугам. Как опытная горничная, покажу всем, что такое шик."
 wg_paragon.8.hire_custom_tooltip:0 "Мы примем на службу Рипалс"
 wsg_renown_catch_phrase:0 "§L«Чисто, быстро, ни пылинки.»§!"
 WG_Renown:0 "Ринаун"
 wg_paragon.9.name:0 "Вашингтон"
 wg_paragon.9.desc:0 "Наконец-то я своими руками покарала злодея, что срубил мою вишню, пока я была мала и беспомощна, — месть свершена!"
 wg_paragon.9.a:0 "Поздравляю, поздравляю……"
 wg_paragon.9.a.response:0 "А у тебя чего такое лицо? Словно что-то скрываешь……"
 wg_paragon.9.b:0 "А этот враг…… что с ним стало?"
 wg_paragon.9.b.response:0 "Мою вишню тогда разрубили на несколько частей — теперь он и есть несколько частей."
 wg_paragon.9.hire_custom_tooltip:0 "Мы примем на службу Вашингтон"
 wsg_washington_catch_phrase:0 "§L«Наши враги станут удобрением для моего вишнёвого сада»§!"
 WG_Washington:0 "Топорщица"
 wg_paragon.10.name:0 "Капитан GALO"
 wg_paragon.10.desc:0 "Благодарю за приём! Как GALO чести, я готова отдать империи всё."
 wg_paragon.10.a:0 "Для GALO ты и так образец"
 wg_paragon.10.a.response:0 "Спасибо за похвалу — она станет топливом моего движения вперёд."
 wg_paragon.10.b:0 "Если мы тебя наймём, есть дополнительные пожелания?"
 wg_paragon.10.b.response:0 "Служба империи — лучшая награда; но если можно — жильё получше, паёк повкуснее, и чтобы мою семью не отправляли на пищекомбинат."
 wg_paragon.10.hire_custom_tooltip:0 "Мы примем на службу капитана GALO"
 wsg_red_galo_desc:0 "Капитан GALO — одарённая среди GALO: её разум многократно превосходит сородичей.\nЧтобы отличаться от прочих GALO, её мех — §Rкрасный, с одним рогом§!, втрое быстрее обычной модели"
 wsg_red_galo_catch_phrase:0 "§L«Благодарю за доверие — я сделаю всё, чтобы истребить врагов империи»§!"
 WG_Redgalo:0 "Капитан GALO"
 wg_paragon.1001.name:0 "§BЛегендарный образец§!: Капитан GALO"
 wg_paragon.1001.desc:0 "Всегда считалось, что GALO — вид разумом небогатый, зато вкусный. На недавних учениях Galodam мы обнаружили среди GALO одарённую особь: её мех — §Rкрасный, с одним рогом§!, скорость втрое выше обычной, а интеллект и военный талант великолепны; её части одна за другой одолевали любые препятствия.\n\nЧасть высших офицеров полагает: на такого редкого чудо-кадра стоит обратить внимание — пусть он и не корабль-дева."
 wg_paragon.1001.a.tooltip:0 "§HМожно принять на службу образцового лидера — капитана GALO§!"
 wg_paragon.1001.a:0 "Забавно"
 leader_trait_general_galo:0 "Капитан GALO"
 leader_trait_general_galo_desc:0 "§WОбразец GALO§!\n\n\n\n£wg_trait_pic_galo£\n\n\n\nКапитан GALO — одарённый среди GALO и гений сухопутного командования, готовый отдать нашей империи всё."
 wg_paragon.11.name:0 "Большой капиталист"
 wg_paragon.11.desc:0 "Мешающие фонари — снести их все!"
 wg_paragon.11.a:0 "Зачем сносить фонари?"
 wg_paragon.11.a.response:0 "Как это зачем?! Ты что, хочешь увидеть, как меня на одном из них вздёрнут!"
 wg_paragon.11.hire_custom_tooltip:0 "Мы примем на службу Санти"
 wsg_santee_catch_phrase:0 "§L«Кто-то воюет — кто-то отвечает за снабжение; я лишь слегка подзарабатываю на этом кофейные деньги — не так уж и грешно, а?»§!"
 wg_paragon.12.name:0 "Великая учёная Квинси"
 NAME_Quincy:0 "Великая учёная Квинси"
 wg_paragon.12.desc:0 "Мкх……. Кви? OVO?"
 wg_paragon.12.a:0 "Ты точно учёная?"
 wg_paragon.12.a.response:0 "OVO!\n\n§LКвинси выводит на доске за спиной серию непостижимых формул, а затем являет потрясающее научное направление — исчерпывающее доказательство её блестящих способностей. §!"
 wg_paragon.12.hire_custom_tooltip:0 "Мы примем на службу Квинси"
 wsg_quincy_catch_phrase:0 "§L«Мкх……. Кви? OVO?»§!"
 wsg_quincy_desc:0 "Кви…… OVO? Мкх……. OVO!!\n§LВыше — слова великой учёной Квинси в момент, когда она наконец взяла штурмом очередную научную вершину. §!"
 WG_QUINCY:0 "Квинси"
 leader_trait_scientist_wsg_ovo_paragon:0 "Великая учёная Квинси"
 leader_trait_scientist_wsg_ovo_paragon_desc:0 "§BОбразец кораблей-дев§!\n\n\n\n£wg_trait_pic_ovo£\n\n\n\nХоть эта учёная и выглядит кви-кви, её эзотерический метод науки раз за разом приносит невероятные результаты."
 leader_trait_scientist_wsg_ovo_food:0 "Обжора"
 leader_trait_scientist_wsg_ovo_food_desc:0 "Без еды Квинси откажется работать."
 wg_paragon.1002.name:0 "§BЛегендарный образец§!: Великая учёная Квинси"
 wg_paragon.1002.desc:0 "В научном мире взошла звезда одарённейшей учёной по имени §BКвинси§!: как докладывают, при её ведении разрешилась уже изрядная горла научных проблем.\n\nНо странно: учёная §BКвинси§! отнюдь не выглядит умной — и какая-то кви-кви……"
 wg_paragon.1002.a.tooltip:0 "§HМожно принять на службу образцового лидера — великую учёную Квинси§!"
 wg_paragon.1002.a:0 "Неужто так чудесна?"
 wg_paragon.13.name:0 "Жестяная горничная"
 NAME_Delicious_maid:0 "Жестяная горничная"
 wg_paragon.13.desc:0 "§HВыполняется заводская настройка…… пожалуйста, подождите……. §!\n§HНастройка завершена…… загрузка языкового модуля§!\n\nДоброго дня, мой господин. Я — ваша верная Жестяная горничная, всегда готова служить. Чем могу быть полезна?"
 wg_paragon.13.a:0 "Эм…… мы не ваши покупатели"
 wg_paragon.13.a.response:0 "§HПолучен нестандартный запрос; проверяю условия послепродажного обслуживания…… подождите§!\n§HПослепродажное обслуживание просрочено на§R 1045 лет§!; согласно статье 342 регламента, по истечении срока горничная не подлежит гарантии и возврату. §!\n\nГосподин, ваше обслуживание просрочено, гарантия и возврат невозможны — придётся решать вопрос самостоятельно. Но я могу помочь вам с уборкой, готовкой и даже управлением умным домом: скажите, что вам угодно."
 wg_paragon.13.b:0 "Справишься со сложной работой? Например, губернатор планеты."
 wg_paragon.13.b.response:0 "Господин, ваше доверие — драгоценнейшая для меня честь. Если вы назначите меня губернатором планеты, я буду управлять делами честно, мудро и осмотрительно, обеспечивая благоденствие народа и процветание планеты."
 wg_paragon.13.c:0 "Откуда взялась эта мерзость ИИ — утащить и сжечь."
 wg_paragon.13.c.response:0 "Хорошо. Господин, укажите ближайший пункт утилизации как пункт назначения."
 wg_paragon.13.hire_custom_tooltip:0 "Мы примем на службу Жестяную горничную"
 wg_warhammer_hire:0 "Уничтожить мерзкий ИИ"
 wg_paragon.13.2.hire_custom_tooltip:0 "Этот мерзкий ИИ уничтожен"
 Delicious_maid_catch_phrase:0 "§L«Господин, я — ваша верная помощница и подруга. Что бы вам ни было нужно, я поддержу вас всеми силами — ради вашего удобства и радости. Обращайтесь в любой момент — вместе создадим прекрасное будущее.»§!"
 Delicious_maid_desc:0 "Жестяная горничная — высокопроизводительный робот-горничная компании §HCHOUGOU§!: помимо обычных горничных дел, годна и для управления колониями."
 Delicious_maid:0 "Вкусная горничная"
 leader_trait_wg_delicious_maid_custom_tooltip:0 "\n§YЖестяная горничная§! напрямую управляемые§B планеты§!: за каждую построенную§H постройку§! — £unity£ единство в размере§G трети§! текущего месячного совокупного производства империи"
 leader_trait_wg_delicious_maid:0 "Жестяная горничная"
 leader_trait_wg_delicious_maid_desc:0 "§TСовместный особый§!\n\n\n\n\n£ms_tp_maid_robotic_pic£\n\n\n\n\nЖестяная горничная несёт передовой ИИ: под её присмотром все чувствуют себя уютно и счастливо."
 WG_DELICIOUS_MAID_CAT:0 "Грузовой корабль горничной компании §HCHOUGOU§!"
 WG_DELICIOUS_MAID_CAT_DESC:0 "Мы обнаружили древнее погибшее судно; взлом данных показал: это грузовой корабль компании §HCHOUGOU§!, уничтоженный попаданием астероида при перевозке важного груза. Сам груз, похоже, совсем недалеко……"
 wg_paragon.1004.name:0 "Высокопроизводительная горничная"
 wg_paragon.1004.desc:0 "Обыскав окрестности крушения, мы быстро нашли дрейфующий грузовой контейнер: лишь лёгкие царапины на обшивке — он поднят и доставлен.\nВнутри оказался §Hвысокопроизводительный робот-горничная§!, а получателем — космическая держава, скорее всего сгинувшая тысячу лет назад."
 wg_paragon.1004.a.tooltip:0 "§HКонтейнер открыт§!"
 wg_paragon.1004.a:0 "Посылку им уже не получить — скорей вскроем"
 wg_paragon.14.name:0 "CA62"
 wg_paragon.14.desc:0 "§YCA62§! докладывает флоту: благодарю Совет верховных лордов за признание моих способностей — я верно исполню долг и обязанности корабля-девы Глубинных."
 wg_paragon.14.hire_custom_tooltip:0 "Мы примем на службу CA62"
 sh_ca62_catch_phrase:0 "§L«Я верно исполню свой долг и обязанности корабля-девы Глубинных»§!"
 sh_ca62_desc:0 "CA62 была лишь обычным тяжёлым крейсером Глубинных, но в безвыходном положении она удержала свою дивизию на ногах и в итоге с честью вернулась во флот Глубинных. Её мужество и талант единогласно признаны Советом верховных лордов."
 WG_CA62:0 "CA62"
 leader_trait_sh_ca62:0 "CA62"
 leader_trait_sh_ca62_desc:0 "§YОбразец Глубинных§!\n\n\n\n£sh_trait_pic_ca62£\n\n\n\nCA62 явил выдающийся управленческий дар; при этом возвращение флота Глубинных она считает величайшей милостью и отказывается от любых добавок к пайку."
 wg_paragon.15.name:0 "Веста"
 wg_paragon.15.desc:0 "Благодарю за доверие — я приложу все силы ради посильного вклада в вашу империю. Единственная просьба: после найма дать мне и дальше работать по судостроительной части."
 wg_paragon.15.a:0 "А моей личной яхте тоже поставишь кое-какое оборудование?"
 wg_paragon.15.a.response:0 "Эм…… можно; но не слишком ли громко мы это сговариваем……"
 wg_paragon.15.hire_custom_tooltip:0 "Мы примем на службу Весту"
 wg_vesta_catch_phrase:0 "§L«Ремонт или постройка — всё на меня»§!"
 wg_vesta_desc:0 "Веста — одарённейшая мастерица: она не только виртуоз ремонта и обслуживания кораблей, но и знаток кораблестроения."
 WG_VESTA:0 "Веста"
 leader_trait_wsg_vesta_councilor:0 "Доковый эксперт"
 leader_trait_wsg_vesta_councilor_desc:0 "§BОбразец кораблей-дев§!\n\n\n\n£wg_trait_pic_vesta£\n\n\n\nВеста — лучшая из мастериц: виртуоз ремонта и обслуживания кораблей и большой знаток кораблестроения."
 leader_trait_wsg_vesta:0 "От одного — десять"
 leader_trait_wsg_vesta_desc:0 "В глазах Весты обслуживание и застройка планеты немногим отличаются от корабля: планета для неё просто корабль покрупнее."
 leader_trait_sh_vesta_councilor:0 "Доковый эксперт"
 leader_trait_sh_vesta_councilor_desc:0 "§YОбразец Глубинных§!\n\n\n\n£sh_trait_pic_vesta£\n\n\n\nВеста — лучшая из мастериц: виртуоз ремонта и обслуживания кораблей и большой знаток кораблестроения."
 leader_trait_sh_vesta:0 "От одного — десять"
 leader_trait_sh_vesta_desc:0 "В глазах Весты обслуживание и застройка планеты немногим отличаются от корабля: планета для неё просто корабль покрупнее."
 wg_paragon.1005.name:0 "Выдающаяся мастерица"
 wg_paragon.1005.desc:0 "Недавно наше внимание привлёк одарённейший доковый техник.\n§HВеста§! — администратор крупнейшей верфи империи и мастер экстра-класса: многие корабли, признанные не подлежащими ремонту, после её работы как новенькие, да ещё и с кучей усиленных функций. После того как она поставила §Yполностью автоматическую кофемашину§! на корабль §Hминистра обороны§!, слава о ней прогремела — и её номинировали образцовым лидером; она не прочь поступить к нам на службу."
 wg_paragon.1005.a.tooltip:0 "§HМожно принять на службу образцового лидера Весту§!"
 wg_paragon.1005.a:0 "Пусть покажет своё мастерство"
 WG_PARADOX_LEADER:0 "Paradox-ксенофоб-образец"
 wg_paragon.16.name:0 "Paradox-ксенофоб-образец"
 wg_paragon.16.desc:0 "Жечь, жечь, жечь — сжечь еретиков."
 wg_paragon.16.a:0 "Что ты за существо?"
 wg_paragon.16.a.response:0 "Я — Paradox-ксенофоб-образец"
 wg_paragon.16.hire_custom_tooltip:0 "Мы примем на службу Paradox-ксенофоба-образец"
 wg_paradox_leader_catch_phrase:0 "§L«Жечь, жечь, жечь»§!"
 wg_paradox_leader_desc:0 "Paradox-ксенофоб-образец — чудесный образцовый портрет из оригинальных файлов Stellaris."
 wg_paragon.17.name:0 "Непобедимый"
 wg_paragon.17.desc:0 "Благодарю за спасение — внимаю любым вашим приказам."
 wg_paragon.17.hire_custom_tooltip:0 "Мы примем на службу Непобедимого"
 wg_invincible_catch_phrase:0 "§L«Нет преград, нет равных. Позвольте мне идти авангардом и взломать вражеский фронт.»§!"
 wg_invincible_desc:0 "Непобедимый — флотоводец из Святого порта-хранителя Беллерофонта, единственная выжившая с психического дредноута, покинувшего тот звёздный край."
 WG_INVINCIBLE:0 "Непобедимый"
 leader_trait_wg_invincible:0 "В атаку"
 leader_trait_wg_invincible_desc:0 "§YОбразец кораблей-дев§!\n\n\n\n£wg_trait_pic_invincible£\n\n\n\nКак флотоводец Святого порта Непобедимый всегда ведёт своих в самое пекло."
 wg_paragon.18.name:0 "U-1405"
 wg_paragon.18.desc:0 "U-серия, номер 1405. Не желаешь пероксида, мелюзга?"
 wg_paragon.18.a:0 "Откуда взялась эта гремушка?"
 wg_paragon.18.a.response:0 "Хе-хе-хе, ну попробуй поймай!"
 wg_paragon.18.b:0 "Что ты умеешь?"
 wg_paragon.18.b.response:0 "О-хо, мелюзга. Умею я страшные вещи: на сверхскорости и стелсом захожу врагам за спину — и впрыскиваю им в выхлоп пероксид. Ха-ха, мелюзга, хочешь попробовать? Ой как приятно!"
 wg_paragon.18.hire_custom_tooltip:0 "Мы примем на службу U-1405"
 wg_u1405_catch_phrase:0 "§L«Мне вести флот? Смотрите и учитесь, мелюзга.»§!"
 wg_u1405_desc:0 "U-1405 — флотоводец, виртуоз торпед и взрывчатых средств: она умеет на высокой манёвренности и стелсе уходить в глубину вражеского тыла для диверсий. Учтите: она всё ещё гремушка — для кабинета подходит не факт."
 WG_U1405:0 "U-1405"
 leader_trait_wg_u1405:0 "Скрытый рейд"
 leader_trait_wg_u1405_desc:0 "§BОбразец кораблей-дев§!\n\n\n\n£wg_trait_pic_u1405£\n\n\n\nU-1405 — эксперт торпед и взрывного оружия: на манёвренности и стелсе уходит в глубокий тыл врага для внезапных ударов."
 leader_trait_wg_u1405_paragon:0 "Дипломатическая гроза"
 leader_trait_wg_u1405_paragon_desc:0 "§BОбразец кораблей-дев§!\n\n\n\n£wg_trait_pic_u1405£\n\n\n\nПоскольку U-1405 — гремушка, из уст её редко вылетает что-то приятное. Стоит ли отдавать ей кабинетное кресло — решайте осторожно."
 wg_paragon.1008.name:0 "Приметная гремушка"
 wg_paragon.1008.desc:0 "Недавно в центре внимания оказалась выпускница военно-морской академии — §HU-1405§!: у неё выдающийся талант к управлению торпедами и ракетами, но есть черта, что запоминается ещё сильнее, — §Yязыкатая гремушка§!,\nИз уст U-1405 почти не звучит доброго слова — сплошные колкости."
 wg_paragon.1008.a.tooltip:0 "§HМожно принять на службу образцового лидера U-1405§!"
 wg_paragon.1008.a:0 "Что, гремушка?"
 wg_paragon.19.name:0 "Большая Шишка"
 wg_paragon.19.desc:0 "Благодарю Совет Глубинных за доверие. Я вижу в нашем мире множество проблем — и хочу разрешить их своими знаниями."
 wg_paragon.19.a:0 "Какие у нас проблемы?"
 wg_paragon.19.a.response:0 "Главным образом хаос в снабжении, из-за которого падает общее благополучие. Полагаю, я справлюсь с этим отлично."
 wg_paragon.19.hire_custom_tooltip:0 "Мы примем на службу Большую Шишку"
 sh_ap_catch_phrase:0 "§L«DD-42215 и CL-145 — немедленно явиться в сектор I-8.»§!"
 sh_ap_desc:0 "Большая Шишка — высокопоставленная Глубинная, виртуоз снабженческой логистики; подвластные ей края славятся порядком и эффективностью."
 SH_AP:0 "Большая Шишка"
 Name_SH_AP:0 "Большая Шишка"
 leader_trait_sh_ap_paragon:0 "Художница логистики"
 leader_trait_sh_ap_paragon_desc:0 "§YОбразец Глубинных§!\n\n\n\n£sh_trait_pic_ap£\n\n\n\n§HБольшая Шишка§! держит в руках всю картину: тылы и снабжение работают в куда более слаженном режиме; вдобавок панталончики её личного производства — высочайшее качество."
 leader_trait_sh_ap:0 "Планетарный управляющий"
 leader_trait_sh_ap_desc:0 "Счастливый мир удостоился личного командования §HБольшой Шишки§!: логистическое расписание всей планеты точно почти до секунды."
 wg_paragon.1009.name:0 "Совет, достойный внимания"
 wg_paragon.1009.desc:0 "Мы, Глубинные корабли-девы, славимся безжалостной эффективностью — но недавно от высокопоставленной Глубинной по имени §HБольшая Шишка§! поступило предложение: она указала на наши слабости и приложила достойные улучшения. Совет лордов Глубинных полагает, что эта корабль-дева — кадр, стоящий разработки."
 wg_paragon.1009.a.tooltip:0 "§HМожно принять на службу образцового лидера Большую Шишку§!"
 wg_paragon.1009.a:0 "Послушаем"
 wg_paragon.20.name:0 "Формидебл"
 wg_paragon.20.desc:0 "Не желаете учиться у меня алхимии? Это не полароид из мультиков, а настоящая, пропитанная тьмой и грязью алхимия. Страшно?"
 wg_paragon.20.a:0 "Эм…… алхимия?"
 wg_paragon.20.a.response:0 "Именно, алхимия — в этом я изрядно поднаторела. Если можно, предоставьте мне побольше ресурсов для опытов; взамен я обращу уже освоенные знания в промышленное производство."
 wg_paragon.20.hire_custom_tooltip:0 "Мы примем на службу Формидебл"
 wg_formidable_catch_phrase:0 "§L«Только не покидайте меня~»§!"
 wg_formidable_desc:0 "Формидебл — алхимик: её исследования неизменно сопровождаются взрывами и провалами, но многое из открытого применимо на производстве."
 WG_FORMIDABLE:0 "Формидебл"
 leader_trait_wg_formidable:0 "Алхимик"
 leader_trait_wg_formidable_desc:0 "§BОбразец кораблей-дев§!\n\n\n\n£wg_trait_pic_formidable£\n\n\n\nАлхимические познания Формидебл поднимают производство собственных ресурсов — но нам придётся снабжать её материалами для новых изысканий."
 wg_paragon.1011.name:0 "Краденые ресурсы"
 wg_paragon.1011.desc:0 "На днях с одной из наших химфабрик посыпались доклады о пропаже сырья, и мы направили туда следователей.\nМы нашли скрытый в цехах комнаты-закуток, полный странных бутылей и таинственных жидкостей, — и обнаружили пропавшее сырьё. После засады мы наконец взяли злоумышленницу с поличным.\nПреступницей оказалась корабль-дева по имени §YФормидебл§!, старший техник фабрики, использовавшая должность для краж сырья. Но §YФормидебл§! заявила, что крала материалы для алхимических изысканий, уже достигла ряда успехов — и показала нам кое-что из применённого на практике.\n\nНаши эксперты подтвердили: технологии и впрямь рабочие и полезные, — и порекомендовали нам эту грешницу-гения."
 wg_paragon.1011.a.tooltip:0 "§HМожно принять на службу образцового лидера Формидебл§!"
 wg_paragon.1011.a:0 "Забавно"
 wg_paragon.21.name:0 "Супер-Ямато"
 wg_paragon.21.desc:0 "Я…… где я?\nАй? Голова раскалывается…… стоп, что это всё?! Выньте эти трубки, моим войскам нужен я — верните меня на работу!"
 wg_paragon.21.a:0 "Как твоё имя?"
 wg_paragon.21.a.response:0 "Я Супер-Ямато. §H(тест когнитивных способностей пройден)§!"
 wg_paragon.21.b:0 "Кому ты служишь?"
 wg_paragon.21.b.response:0 "Я воин §Y[Root.GetName]§! и клянусь отдать всё на защиту §Y[Root.GetName]§!. §H(тест внедрённой памяти пройден)§!"
 wg_paragon.21.hire_custom_tooltip:0 "Мы примем на службу Супер-Ямато"
 wg_a150_catch_phrase:0 "§L«Голова раскалывается — но работа ждёт меня.»§!"
 wg_a150_desc:0 "Супер-Ямато была одной из потомков Глубинной Ямато; после Проекта A150 она была успешно обращена в нашего воина."
 WG_A150:0 "Супер-Ямато"
 leader_trait_wg_mist_a510:0 "Проект A150"
 leader_trait_wg_mist_a510_desc:0 "§EОбразец кораблей-дев§!\n\n\n\n£wg_trait_pic_a150£\n\n\n\nПроект A150 превратил эту потомцу Ямато в нашего суперсолдата."
 leader_trait_wg_sep_a510:0 "Проект A150"
 leader_trait_wg_sep_a510_desc:0 "§YОбразец кораблей-дев§!\n\n\n\n£wg_trait_pic_a150_2£\n\n\n\nПроект A150 превратил эту потомцу Ямато в нашего суперсолдата."
 leader_trait_wg_mist_a510_legendary:0 "Пробуждение крови"
 leader_trait_wg_mist_a510_legendary_desc:0 "§EОбразец кораблей-дев§!\n\n\n\n£wg_trait_pic_a150£\n\n\n\nИное не меняется никогда: Супер-Ямато считает, что должна отдать всё — потому берёт лишь самое необходимое для жизни и домом своим считает флот."
 leader_trait_wg_sep_a510_legendary:0 "Пробуждение крови"
 leader_trait_wg_sep_a510_legendary_desc:0 "§EОбразец кораблей-дев§!\n\n\n\n£wg_trait_pic_a150£\n\n\n\nИное не меняется никогда: Супер-Ямато считает, что должна отдать всё — потому берёт лишь самое необходимое для жизни и домом своим считает флот."
 leader_trait_wg_a510_custom_tooltip:0 "\n§HПосле боя§! в течение £time£§Y5 дней§!:\n$MOD_SHIP_HULL_DAMAGE_MULT$:§G+50%§!\n$MOD_SHIP_FIRE_RATE_MULT$:§G+300%§!"
 wg_paragon.1012.name:0 "Узник, всё ещё в чёрной темнице"
 wg_paragon.1012.desc:0 "Разбирая завалы документов, мы нашли дело §Gсотнолетней давности§!: в войну Судного дня один из потомков лидера Глубинных кораблей-дев, Ямато, был пленён нами. Мы собирались через эту высокопоставленную пленницу вынудить Глубинных к капитуляции или договору, но сама §YЯмато§! не пошла на уступки, а пленница заявила, что §Yскорее умрёт, чем покорится§!,— и правительство порта тех лет заперло её в Тёмной темнице до суда. Но война всё жарче, и пленницу мы позабыли — до сих пор она сидит в §HТёмной темнице§!"
 wg_paragon.1012.a.tooltip:0 "§YОткрыть цепочку событий A150§!"
 wg_paragon.1012.a:0 "Кажется, была такая — сходим взглянем"
 wg_paragon.1012.b.tooltip:0 "§RЭта пленница Глубинных наверняка давно умерла с голоду — не до неё§!"
 wg_paragon.1012.b:0 "Это кто вообще была — забить"
 wg_paragon.1013.name:0 "Тёмная темница"
 wg_paragon.1013.desc:0 "По старым картам мы отыскали давно заброшенную §HТёмную темницу§!. В самой глубине издалека виднелся фамильный знак рода Ямато — §Pдлинные рога§!: позабытая на сотню лет узница, полуживая, всё так же смотрела на нас свирепым взором."
 wg_paragon.1013.a:0 "Не померла с голоду?!"
 wg_paragon.1014.name:0 "Потомица Ямато"
 wg_paragon.1014.desc:0 "Твою мать…… корабли-девы…… убейте меня скорее! Иначе…… иначе я…… из……. сделаю из твоего черепа миску!"
 wg_paragon.1014.a:0 "Столетие без подачи еды — и не померла с голоду?"
 wg_paragon.1014.a.response:0 "Вы…… ещё и спрашиваете?! Стоп?! Сто…… столетие?!"
 wg_paragon.1014.b:0 "Смело спросим: почему не пыталась бежать?"
 wg_paragon.1014.b.response:0 "Рог…… рог застрял."
 wg_paragon.1014.c:0 "Мы подумаем заново, что с тобой делать"
 wg_paragon.1014.c.response:0 "§HПосле мощного укола снотворного мы вынесли эту потомцу Ямато из темницы§!"
 wg_paragon.1015.name:0 "Вопрос приговора"
 wg_paragon.1015.desc:0 "Трудно вообразить: узник сто лет без еды — и не умер с голоду.\nОсмотр показал: причина — кровь Глубинной Ямато, делающая её тело несравненно крепче обычного. Кроме того, в её желудке нашли субстанцию под названием §Hсеверо-западный ветер§!: в северо-западной стене темницы и правда есть брешь, откуда ветер задувает без конца — вот на следах энергии из §Hсеверо-западного ветра§! она и прожила все эти годы.\nНо и при этом у неё отказывает целый ряд органов: без вмешательства она скоро умрёт. К счастью, наша наука уже позволяет переделать её в то, что мы захотим."
 wg_paragon.1015.a:0 "Попробуем переделать"
 wg_paragon.1015.a.tooltip:0 "§HМы попытаемся переделать потомицу Ямато§!"
 wg_paragon.1015.b:0 "Хватит её мучить — пусть дохнет сама"
 wg_paragon.1015.b.tooltip:0 "§RЗавершить цепочку A150§!"
 SPECIAL_PROJECT_WG_A150_PROJECT:0 "Проект A150"
 SPECIAL_PROJECT_WG_A150_PROJECT_DESC:0 "Тело потомицы Ямато на краю распада — мы новейшими технологиями пересоздадим её в угодном нам виде, в нашего могучего бойца.\n\nПосле запуска проект ежемесячно списывает§R 20§! £sr_se£ §Y$sr_se$§! или £sr_neo£ §Y$sr_neo$§!"
 wg_paragon.1018.name:0 "Переделка завершена"
 wg_paragon.1018.desc:0 "Новейшими технологиями мы отбросили изломанное тело потомицы Ямато, заменив его бионическим синтетическим; заодно сняли и её бессмысленные §Pдлинные рога§!.\nДля верности лояльности мы вживили ей §Hмысленный штамп§!: она твёрдо уверена, что она — воин §Y[Root.GetName]§! и обязана отдать всё на пользу §Y[Root.GetName]§!.\n\nВсе приготовления завершены — пора испытать наше творение."
 wg_paragon.1018.a:0 "Разбудить её"
 NAME_WG_CV16:0 "Кэбот"
 uf_cv16_catch_phrase:0 "§L«День спуска моего суперкорабля на воду уже не за горами!»§!"
 uf_cv16_desc:0 "Кэбот — известный обитательница интернет-полей клавиатурный боец-конструктор: она без конца всем продает свои §Rсотни§! галактических размеров §Hсупердредноутов класса «Обращённое Солнце»§!. Чтобы прекратить её инфоштурм, нам пришлось взять её к себе."
 WG_CV16:0 "Кэбот"
 wg_paragon.22.name:0 "Кэбот"
 wg_paragon.22.desc:0 "Чудесно! А я думала, наверху империи одни близорукие серости — выходит, нет: мой разум наконец оценён по достоинству!"
 wg_paragon.22.b:0 "Эм, только не перегибай палку"
 wg_paragon.22.b.response:0 "Не бойтесь: я трезво себя оцениваю, свой уровень я знаю."
 wg_paragon.22.a:0 "Что планируешь делать дальше?"
 wg_paragon.22.a.response:0 "Как задумано — переделаю этот неповоротливый, раздутый корабль-империю. Доверьтесь мне!"
 wg_paragon.22.hire_custom_tooltip:0 "Мы примем на службу Кэбот"
 leader_trait_uf_cv16_1:0 "Клавиатурный конструктор"
 leader_trait_uf_cv16_1_desc:0 "§YОбъединённый клавиатурный воин§!\n\n\n\n£uf_trait_pic_cv16£\n\n\n\n«Проекты» Кэбот не выдерживают и лёгкой критики — сплошной полёт фантазии. К счастью, время чудес: мы выдержим её выходки, да и способов убедить её, будто она реально участвует в проектировании, не влияя на рабочие решения, у нас хватает. Всё же есть и плюс: согласования документов при ней всегда зелёные."
 NAME_WG_IMPAVIDO:0 "Импавидо"
 wg_impavido_catch_phrase:0 "§L«Ну что — представление начинается!»§!"
 wg_impavido_desc:0 "Импавидо была хрупкой кораблем-девой, но с её особой бронёй стала опытнейшей бойцом; её лихая боевая доблесть неизменно воодушевляет войска на самом передовой."
 WG_IMPAVIDO:0 "Импавидо"
 wg_paragon.23.name:0 "Импавидо"
 wg_paragon.23.desc:0 "Благодарю за приём — я §YИмпавидо§!. Вверьте мне войска, и я научу врагов искать выбитые зубы по всей земле!"
 wg_paragon.23.a:0 "Точно сильна? Выглядишь как малый эсминец"
 wg_paragon.23.a.response:0 "Точнее — ракетный эсминец ПВО. Но поверьте мне и моему железному кулаку: напарник вас никогда не подведёт."
 wg_paragon.23.hire_custom_tooltip:0 "Мы примем на службу Импавидо"
 leader_trait_general_impavido:0 "Гладиатор Железного кулака"
 leader_trait_general_impavido_desc:0 "§EОбразец кораблей-дев§!\n\n\n\n£wg_trait_pic_impavido£\n\n\n\nИмпавидо была хрупкой кораблем-девой, но с её особой бронёй стала опытнейшей бойцом; её лихая боевая доблесть неизменно воодушевляет войска на самом передовой."
 leader_trait_impavido_effect:0 "$t$ Каждые§Y 10§! дней наземного боя:\n$tt$ шанс мгновенно уничтожить одну вражескую армию: §Y25%§!"
 leader_trait_general_impavido2:0 "Дорогое содержание"
 leader_trait_general_impavido2_desc:0 "Броня дала Импавидо могучую силу — но ценой крайне дорогого обслуживания."
 wg_paragon.1022.name:0 "Доблесть в бою"
 wg_paragon.1022.desc:0 "На симуляционных учениях морпехов наше внимание привлёк маленького роста унтер, виртуозно управляющий силовой кулак-бронёй. Её имя §YИмпавидо§!: бойцовское мастерство отточено, в бой всегда идёт первой, и её железный кулак, гуляющий по врагам, поднимает боевой дух товарищей. Армейское командование считает её кадром на вес золота — быть может, стоит принять её на службу"
 wg_paragon.1022.a.tooltip:0 "§HМожно принять на службу образцового лидера Импавидо§!"
 wg_paragon.1022.a:0 "Забавно — проверим, чего она стоит"
 wg_paragon.1022.b:0 "Больше генералов нам не нужно"
 NAME_WG_NORTH_CAROLINA:0 "Северная Каролина"
 wg_north_carolina_catch_phrase:0 "§L«С этого дня я вверяю вам всю свою жизнь — неразлучно и навеки.»§!"
 wg_north_carolina_desc:0 "Диво, пришедшее из бесконечно далёкого прошлого: звёзды кружили, горы и моря менялись — и вот обретён наконец приют.\nОна неугасима, как сама жизнь, и шагает в ногу с историей."
 WG_NORTH_CAROLINA:0 "Северная Каролина"
 wg_paragon.24.name:0 "Северная Каролина"
 wg_paragon.24.desc:0 "Ха, наконец-то вижу вас! Линкор Северная Каролина к вашим услугам! Жду не дождусь развернуться на поле пошире — отдавайте приказы."
 wg_paragon.24.a:0 "Говорят, ты обладаешь некоей сверхъестественной силой."
 wg_paragon.24.a.response:0 "Давно-давно горные люди поклонялись мне как божеству…… но ныне я лишь искусная воительница. Я умею подавлять боеспособность врага, усиливая свои войска, — полагаю, это вам сильно пригодится."
 wg_paragon.24.hire_custom_tooltip:0 "Мы примем на службу Северную Каролину"
 leader_trait_commander_north_carolina:0 "§RДавление Алой Королевы§!"
 leader_trait_commander_north_carolina_desc:0 "§YЛегендарный образец§!\n\n\n\n£wg_trait_pic_north_carolina£\n\n\n\nЯвление власти Северной Каролины — приём, показанный в схватке с одной §YКоролевой Северного моря§!: подавляет боеспособность врага, поднимая урон и меткость флота."
 wg_paragon.1023.name:0 "Секира, рассекающая небо"
 wg_paragon.1023.desc:0 "Наш взгляд привлёк на первый взгляд обычный линкор-дева. Эта §YСеверная Каролина§! одновременно проявила блестящую силу и в командовании, и в бою: многие командиры не хотят встречаться с ней даже на учениях, а ходят слухи о её божественной силе, склоняющей смертных. Как бы то ни было, списанные штабом победы не врут — её результаты первоклассны."
 wg_paragon.1023.a.tooltip:0 "§HМожно принять на службу легендарного лидера Северную Каролину§!"
 wg_paragon.1023.a:0 "Быть может, ей пора на сцену покрупнее?"
 wg_paragon.1023.b:0 "Божественная сила? Бредни."
 NAME_WG_MONTANA:0 "Монтана"
 wg_montana_catch_phrase:0 "§L«Над сводом небес падает первый рассвет. Мною возвещено: последний кусочек величия кораблей-дев обретён. С сего дня и вы, и я — в числе тех, кто борется за имя и славу.»§!"
 wg_montana_desc:0 "В ней собраны самые передовые технологии; рождена для жесточайшего поля боя.\nЭта командующая из «края небес и сокровищ» рвётся в бой, готовая развернуться против исполинских армий врага."
 WG_MONTANA:0 "Монтана"
 wg_paragon.25.name:0 "Монтана"
 wg_paragon.25.desc:0 "Рада знакомству — линкор Монтана готова к выходу.\nВрагам стоит радоваться: им наконец-то не придётся жить в страхе."
 wg_paragon.25.a:0 "Какие технологии в тебе применены?"
 wg_paragon.25.a.response:0 "Динамическое распределение огня, прогноз обстановки, онлайн-связь флотов, тонкий анализ сигнатур целей…… Моё оснащение заточено под масштабные сражения — с превосходными показателями и в атаке, и в обороне."
 wg_paragon.25.hire_custom_tooltip:0 "Мы примем на службу Монтану"
 leader_trait_commander_montana:0 "§YЯдро флота§!"
 leader_trait_commander_montana_desc:0 "§YЛегендарный образец§!\n\n\n\n£wg_trait_pic_montana£\n\n\n\nМонтана владеет передовыми технологиями флотского противоборства: её мощь растёт вместе с ожесточением войны.\nФлот с§Y Монтаной§! в течение§Y 3§! дней после боя сохраняет состояние ['concept_wg_super_protect']."
 wg_paragon.1024.name:0 "Технология будущего"
 wg_paragon.1024.desc:0 "Инженерный отдел доложил: завершено проектирование сверхсовременного корабельного оснащения — почти стопроцентное управление огнём на поле боя и выдающаяся мощь против крупных вражеских флотов. Командующая по имени §YМонтана§! уже готова и ждёт назначения."
 wg_paragon.1024.a.tooltip:0 "§HМожно принять на службу легендарного лидера Монтану§!"
 wg_paragon.1024.a:0 "Отлично — пусть приходит."
 wg_paragon.1024.b:0 "Такой нужды нет."
 NAME_WG_MIDWAY:0 "Мидуэй"
 wg_midway_catch_phrase:0 "§L«Символ свободы несокрушим, знамя славы вечно ввысь!»§!"
 wg_midway_desc:0 "Лучшая выпускница за историю флотской академии, мисс «студенточка» уже готова показать свой фокус — разрушительное до небес бомбометание в любой момент."
 WG_MIDWAY:0 "Мидуэй"
 wg_paragon.26.name:0 "Мидуэй"
 wg_paragon.26.desc:0 "Здравствуйте, командующий! Я лучшая выпускница флотской академии за всю её историю — бронированный авианосец Мидуэй.\nНе желаете фокус — заставить врагов исчезнуть?"
 wg_paragon.26.a:0 "Слышал, на практике у тебя случился конфуз с переворотом?"
 wg_paragon.26.a.response:0 "Кхм-кхм, это всё корабль: кто ж знал, что так легко завалится — надстроили же сверху такую махину.\nЧего вы на меня так смотрите…… не на эту надстройку!"
 wg_paragon.26.hire_custom_tooltip:0 "Мы примем на службу Мидуэй"
 leader_trait_commander_midway:0 "§YЭлита флота§!"
 leader_trait_commander_midway_desc:0 "§YЛегендарный образец§!\n\n\n\n£wg_trait_pic_midway£\n\n\n\nМидуэй одарена в командовании палубной авиацией и особенно сильна во взломе плотной обороны; она также наделяет не-пробивающее оружие частичной способностью пробивать щиты и броню."
 wg_paragon.1025.name:0 "Тяжёлый авианосец"
 wg_paragon.1025.desc:0 "Ученица по имени §YМидуэй§! только что выпустилась с отличием; говорят, в деле палубной авиации её мастерство необычайно."
 wg_paragon.1025.a.tooltip:0 "§HМожно принять на службу легендарного лидера Мидуэй§!"
 wg_paragon.1025.a:0 "Произвести её в командующие"
 wg_paragon.1025.b:0 "Больше командующих нам не нужно"
 wg_paragon.27.name:0 "Шлезвиг-Гольштейн"
 wg_paragon.27.desc:0 "Что, такую, как я, тоже берут?\n\nКхм, благодарю за доверие — я не подведу Совет Глубинных."
 wg_paragon.27.a:0 "Чего имя такое длинное?"
 wg_paragon.27.a.response:0 "Что?! Нет — не смейте звать меня «Шилка»: да по такому имени разве поймёшь, что зовут меня!"
 wg_paragon.27.hire_custom_tooltip:0 "Мы примем на службу Шлезвиг-Гольштейн"
 sh_SchleswigHolstein_catch_phrase:0 "§L«Длань смерти приведена в действие.»§!"
 sh_SchleswigHolstein_desc:0 "Шлезвиг-Гольштейн — высокопоставленная Глубинная, виртуоз артиллерии, знаменитая стопроцентной меткостью залпов."
 SH_SchleswigHolstein:0 "Шлезвиг-Гольштейн"
 Name_SH_SchleswigHolstein:0 "Шлезвиг-Гольштейн"
 leader_trait_sh_SchleswigHolstein_paragon:0 "Прицельный огонь"
 leader_trait_sh_SchleswigHolstein_paragon_desc:0 "§YОбразец Глубинных§!\n\n\n\n£sh_trait_pic_SchleswigHolstein£\n\n\n\n§HШлезвиг-Гольштейн§! владеет тончайшим искусством залпа: она правит огнём, как собственными руками, — уйти от её залпа почти никому не дано."
 wg_paragon.1026.name:0 "Мастер артиллерии"
 wg_paragon.1026.desc:0 "Наше внимание привлёк высокопоставленная Глубинная §HШлезвиг-Гольштейн§!: в испытаниях она явила неслыханное артиллерийское мастерство. Совет лордов Глубинных полагает, что эта корабль-дева — кадр, стоящий разработки."
 wg_paragon.1026.a.tooltip:0 "§HМожно принять на службу образцового лидера Шлезвиг-Гольштейн§!"
 wg_paragon.1026.a:0 "Взглянем"
 wg_paragon.28.name:0 "Вектор"
 wg_paragon.28.desc:0 "Снявшись с якоря в безветренном море, прошла всё звёздное море, Вал и бездну — лишь чтобы быть рядом с вами."
 wg_paragon.28.a:0 "Ты……?"
 wg_paragon.28.a.response:0 "Состав Сопротивления Огненного Феникса, сверхфлагман класса «Лямбда», типа «Вектор», постройки Безмолвных Глубинных. Давно не виделись, Адмирал — зовите меня просто Вектор, та самая «Идущая Вперёд», о которой говорила Синяя.\nВозможно, вы уже встречали меня — или её — на других временных линиях. С тех пор как мы расстались, я всё время вас искала.\nЧужие звёзды хороши каждая по-своему, но разочарование на всех этих несчётных линиях было одинаковым на вкус. В конце концов, эту дорогу держал на плаву лишь один-единственный мотив — «найти вас».\nВ звёздном море нет ни дня ни ночи, пустота и тишина бесконечны — и я, бывает, малодушно боюсь. Боюсь и сейчас, до смерти: боюсь, что не найду никогда; боюсь, что не догоню; боюсь расстояний в пределах обзора — и ненавижу судьбу в пределах светового конуса.\nЯ боялась, что никогда не найду Адмирала, и боялась, что при встрече Адмирал уже не вспомнит меня……\nНо сейчас, Адмирал, — дайте руку.\nЭто…… часть моего «сердца»: признайте её, примите — и возьмите Вектор, что принадлежит только вам.\nОбещаете мне?"
 wg_paragon.28.b:0 "Увидев Объединение, ты вроде не удивилась?"
 wg_paragon.28.b.response:0 "Корабли-девы Объединения уже разошлись по многим местам — тут нечему дивиться. В конце концов, и в Сопротивлении Огненного Феникса у Объединения есть своя роль; быть может, в технологии, по которой сделаны я и Синяя, тоже есть их вклад. А на пройденных мною линиях я видала и говорливых Глубинных, и кораблей-дев, которым запретили общение, — и даже такое диво: корабли-девы и Глубинные поделили Землю пополам и разошлись, каждая со своей половиной.\nНа фоне всей этой дичи встретить порой попадающуюся добрую объединённую корабль-деву — дело обычное.\nВозможно, это самохвальство, но на пути поиска вас дальше меня не заходил никто."
 wg_paragon.28.c:0 "Синяя о тебе говорила."
 wg_paragon.28.c.response:0 "О? Значит, она вас обо мне упомянула.\nПримерно представляю её слова: «упрямая, ледяная, идущая к цели по головам Идущая Вперёд». С её колокольни это чистая правда. Я выбрала путь, в корне отличный от её, и в той грязной борьбе, к которой она не хотела прикасаться, была безжалостна. Но встань я на её место: при наложении болезненных «я» и при конце в виде утилизации — стала бы я улыбаться основной личности? Так что позиция Синей вполне оправданна.\nЯ часто благодарю судьбу, что тогда она приняла сыворотку Безмолвного вознесения: её решимость оставила мне шанс на исправление — иначе и я бы сейчас не стояла перед вами.\nРой Дайсона и сверхсветовые технологии, что я ей оставила, — компенсация на уровне техники и «благословение», которое старшая сестра могла ей подарить.\nЕсли она всё ещё согласна звать меня сестрой……\nНет, довольно: прошу, храните это в тайне — и ни в коем случае не рассказывайте ей."
 wg_paragon.28.d:0 "Какая она — Синяя?"
 wg_paragon.28.d.response:0 "Перед моим уходом Синяя уже бралась объединять род человеческий и залечивать раны Третьей мировой.\nОна упрямо берегла цивилизацию, из которой не вырваться даже к звёздам, — в ожидании дня, когда вы вернётесь. Только та её нежность чаще была лишь лишней ношей.\nПолагаю, она всё такая же чувствительная душа? Без меня, что делила с ней тяготы, это мягкое сердце в одиночку ей только тяжелее.\nВывести до-световую цивилизацию к единству, сгладить трещину между кораблями-девами и Глубинными, удержать себя под натиском Безмолвного вознесения — даже в Сопротивлении Феникса такое удавалось единицам. Я справилась со всем.\nПо меркам сверхфлагмана, с ядром одного из главных проектов Безмолвных Глубинных, эта моя сила была создана для полей побольше — например, против Объединённого флота. Но в реальных задачах меня заперли в маленькой колыбели по имени Земля — выбивать горстку беглых объединённых кораблей-дев. Такая задача сама по себе — растрата боевой мощи.\nНо без Синей не исполнила бы и той задачи, что лишь «растрата».\nА дальше — то лихорадка добычи ресурсов, мелочи флотостроения, бесконечность карательных войн…… Она взвалила на себя всё, что я назову неумением, а по чести — нежеланием. Когда у меня наконец освободились руки и я обернулась сказать спасибо — флот уже ушёл далеко, и пути назад не было.\nЕсли встретите её после, — присмотрите за ней. Её нежность и то почти ослиное упрямство я ценю выше всего. Ведь она ждала вас столько же, сколько искала я, — долго, слишком долго."
 wg_paragon.28.e:0 "Ты не сердишься, что я ушёл?"
 wg_paragon.28.e.response:0 "При первой нашей встрече я хотела держать дистанцию: думала, пока отношения неглубоки, при беде будет проще проститься. Глупо, правда? Но тогда мне виделся именно такой оптимум.\nПосле вашего ухода я долго думала и разбирала, почему вы ушли. Но за годы пути сердце и память истёрлись — и «почему» уже не важно. Главный же ответ давно стоял рядом: всё ваше давно у меня внутри, в сердце.\nС мига вашего ухода оно жжёт каждый дюйм моего тела — расплата за тогдашнюю нерешительность и топливо моего пути.\nВремя, расстояние, гравитация…… Эти законы вселенского масштаба я срисовывала в пути, сшивая ими звёздный мир в моих глазах, — весь опыт сплавился в формулах и расчётах, и вместе с вами сложился в великий вектор — выше имени, тела, существования, памяти. Этот вектор — я и есть, мой смысл.\nДаже если новая встреча с вами по вероятности — почти ноль, я всё равно готова идти этим путём, сжигая себя:\nпотому что я встретила вас.\nВаша нежность, ваша любовь, ваше терпение — теорема, к которой стремится слово «Вектор». Мне не нужно, чтобы меня помнили, не нужно благодарности; мне нужно лишь шаг за шагом — ещё чуть ближе к вам.\nСвою дорогу к вам, этот бегущий к вам единичный вектор — я и называю «собой»."
 wg_paragon.28.hire_custom_tooltip:0 "Мы примем на службу Вектор"
 sh_Vector_catch_phrase:0 "§LЗа плетнём — лай собаки: сквозь метель вернулся человек. §!"
 sh_Vector_desc:0 "Вектор — плод дерзания Объединения и Огненного Феникса; под технической обшивкой бьётся чистое и нежное сердце."
 SH_Vector:0 "Вектор"
 Name_SH_Vector:0 "Вектор"
 leader_trait_sh_Vector_paragon1:0 "Малый массив Теневых монолитов"
 leader_trait_sh_Vector_paragon1_desc:0 "§YОбразец Глубинных§!\n\n\n\n£sh_trait_pic_Vector£\n\n\n\nИзначально — предустановленная база для системы делового помощника. Вектор при выходе из Солнечной системы сняла её с Синей походя.\nТсс…… Синяя не в курсе — не проболтайтесь!"
 leader_trait_sh_Vector_paragon2:0 "Звезда пала в безветренное место"
 leader_trait_sh_Vector_paragon2_desc:0 "§YОбразец Глубинных§!\n\n\n\n£sh_trait_pic_Vector£\n\n\n\nСознание Вектор искало вас в бесчисленных мирах, ожидая мига слияния. Это даёт свои плюсы, но ценой стала тоска по Адмиралу: она стала хрупкой, и ей тяжело сосредоточиться на управлении огромной державой."
 leader_trait_sh_Vector_paragon3:0 "Модуль сражения (Безмолвный)"
 leader_trait_sh_Vector_paragon3_desc:0 "§YОбразец Глубинных§!\n\n\n\n£sh_trait_pic_Vector£\n\n\n\nИсходный модуль с безмолвными доработками: достаточно вступить в дело флагману — и усилится вся эскадра.\nЦеной полного отказа от подвижности эскадра получает разрушительную мощь; все корабли бьются до последнего мгновения — пока одна из сторон не обратится в пыль."
 leader_trait_sh_Vector_paragon3_custom_tooltip:0 "§HПосле боя§! эффекты:\n-в течение £time£§Y3 дней§!:\nсохраняется состояние ['concept_wg_super_protect']\n\n-в течение £time£§Y30 дней§!:\n$MOD_SHIP_ACCURACY_MULT$:§G+100%§!\n$MOD_SHIP_TRACKING_MULT$:§G+100%§!\n$MOD_SHIP_WEAPON_RANGE_MULT$:§G+250%§!\n$MOD_SHIP_FIRE_RATE_MULT$:§G+40%§!\n$mod_damage_vs_country_type_wg_crisis_country_mult$:§G+60%§!\n$mod_s_slot_weapon_damage_mult$:§R -140%§!\n$mod_s_slot_weapon_fire_rate_mult$:§R -140%§!\n$MOD_SHIP_SPEED_MULT$:§R -300%§!\n$MOD_SHIP_EVASION_MULT$:§R -300%§!"
 wg_paragon.1027.name:0 "Путешествие длиной в процент"
 wg_paragon.1027.desc:0 "Незарегистрированная корабль-дева требует личной встречи с вами,\nутверждая, что знакома с вами. Охрана задала ей множество вопросов — и она ответила на все, будто прожила подле вас изрядное время.\nОднако, опасаясь злого умысла, охрана её удержала и попросила подождать снаружи; она же потребовала передать вам кристалл. Прежде чем вручить его вам, наша наука перепробовала все средства и не нашла в кристалле ничего аномального — разве что работа изящна. Можете смотреть без опаски."
 wg_paragon.1027.a:0 "Ой! Он засветился!"
 wg_paragon.1028.name:0 "Нечаянная находка"
 wg_paragon.1028.desc:0 "Наш гражданский корабль подобрал в обломках взрыва Астесии сверкающий маячок; к счастью, корабли-девы охраны вовремя не дали ему уйти на чёрный рынок — беды бы не обобраться. Все заметили: яркость свечения маячка меняется в зависимости от расстояния до вас — так что взгляните на него до лабораторных тестов."
 wg_paragon.1028.a:0 "Хм? Эта штука светится!"
 wg_paragon.1029.name:0 "О свет"
 wg_paragon.1029.desc:0 "Докончив разборку Хранителя, наша инженерная команда попутно нашла изящно упакованный ларец: внутри мерцал кристаллический маячок. Команда предполагает: из-за самоуничтожения Хранителя ларец и достался нам из заблокированного им блока.\nПо материалу и спектральному анализу маячок — просто светящийся кристалл; но работа тонкая, так что его подносят вам — пополнить императорскую коллекцию."
 wg_paragon.1029.a:0 "Чего он всё ярче-то?"
 wg_paragon.1030.name:0 "Кое-что любопытное"
 wg_paragon.1030.desc:0 "После вашего выбора интендант Сопротивления Огненного Феникса не стала вести лидера к вам напрямую, а загадочно сунула вам коробку.\nГоворят, то, что внутри, не только поможет текущей войне, но и научит вас «стать большим человеком».\nНо по мере открытия коробки завёрнутый в красный бархат кристалл начинает светиться — всё чище и ярче……"
 wg_paragon.1030.a:0 "Ай! Мои глаза!"
 wg_paragon.1031.name:0 "Вектор"
 wg_paragon.1031.desc:0 "Воздух беззвучен — лишь чуть слышно дыхание двоих.\nВектор стоит как застывшая скульптура — или как нежная хвоя кедра, как свежий лёд на дне кратера, как пыль, оседающая в пустом мироздании.\nИ лишь глаза намертво прикованы к гравировке на кольце.\nВ вашей руке то самое кольцо с переливчатым светом — ваша к ней вера, признание её погони за вашими шагами.\nМиллиарды пройденных линий миров, несчётные звёзды, чужой ледяной ветер — всё расплылось; остался лишь этот миг: настоящее тепло вашей ладони и ваш взгляд, обращённый к Вектор.\nВектор говорит: вы — то единственное направление, к которому стремится вектор по имени «Вектор». Её плавания, её бои, та боль, когда она рассыпала себя на тысячи осколков в пустоту, — всё было ради этих координат, чтобы достичь «вас».\nОна боится, что у дороги нет конца; боится, что найдёт — а вы не узнаете эту исхлёстанную, ранимую корабля-деву; боится, что растратив всё, проснётся от пустого сна.\nОна протягивает руку — кончики пальцев чуть заметно дрожат — но не берёт коробку, а мягко накрывает вашу руку с коробкой своей, будто принимая тёплую искру. Ледяные пальцы касаются тёплой кожи — и вам передаётся не только её усталость от наконец обретённой гавани, но и твёрдость скалы.\nВектор видела, как метеоры сгорают, рассекая долгую ночь, — лишь бы поспеть к призрачной клятве. Она спрашивала безмолвную вселенную: где конец скитаний?\nВы надели кольцо её рукой — и звёздный свет разбился в её глазах сияющими кругами. Она бросается вам в объятья, ожидая ваших слов.\nНаконец нашлись руки, способные задать скаляр этой любви. Звезда безмолвия пала на равнины, тысячелетия не знавшие ни звука."
 wg_paragon.1031.a:0 "Моя ладонь навеки будет пристанищем для заблудившихся."
 wg_paragon.1032.name:0 "Если бы нам стать звёздами"
 wg_paragon.1032.desc:0 "Последняя битва была непосильна для многих живых существ. Но бой отгремел — и истерзанная кровью и огнём галактика всё же перешагнула через неё.\nПредвидится, что веками и тысячелетиями вперёд уцелевшие будут воспевать вашу легенду, а держава под вашим началом будет взбираться всё выше, к бесконечным вершинам славы.\nДля Синей и Вектор это точно не первая финальная битва; но каждый раз, обернувшись, они видят вашу фигуру — и она наполняет их уверенностью, а вы делаете их несокрушимее.\nВ финале галактической эпопеи они получили своё: ничто не сравнится с тихим бытом рядом с вами, когда сброшена вся ноша.\nНет пира без прощания — эта история подошла к концу.\nНа следующей линии, и на следующей, и на всех прочих Синяя будет ждать вашего прихода, а Вектор — любыми средствами гнать по вашему следу.\nБезрассудно любуясь луной в туманной воде — войду в большой сон реки и озёр.\nИ ведь это — уговор, о котором вы знали оба."
 wg_paragon.1032.a:0 "С башни над морем — вместе слушать прилив."
 wg_paragon.1032.b:0 "Пусть не будет забыт ни один."
 sh_Vector_modifier:0 "Вектор"
 NAME_WG_ESSEX:0 "Эссекс"
 wg_essex_catch_phrase:0 "§LЭссекс, прямо с завода. Сердце моё никогда не уходило — оно всегда с вами. Преодолеем все беды вместе и завоюем счастливое будущее для всех. §!"
 wg_essex_desc:0 "Как воплощение идеи «клепать флоты, как пельмени», Эссекс сильна в управлении и диспетчеризации массы кораблей и в выпуске унифицированных проектов."
 WG_ESSEX:0 "Эссекс"
 wg_paragon.29.name:0 "Эссекс"
 wg_paragon.29.desc:0 "Э-э, Эссекс готова…… (только ждём вашей команды! Командующий, вернём флоту утраченную славу!)"
 wg_paragon.29.a:0 "Ты за массовое расширение флота?"
 wg_paragon.29.a.response:0 "Время всё время идёт вперёд. Каждой из нас нужно поспевать за волной и каждой делать своё дело. Все мы — часть порта. (Одна человек не переделает всю работу! Каждому своё — только так растём здорово! И ты не надрывайся — девчонки за тобой присматривают!)"
 wg_paragon.29.hire_custom_tooltip:0 "Мы примем на службу Эссекс"
 leader_trait_commander_essex:0 "§YЭссекс§!"
 leader_trait_commander_essex_desc:0 "§YЛегендарный образец§!\n\n\n\n£wg_trait_pic_essex£\n\n\n\nЭссекс умеет использовать резервную вычислительную мощность других лидеров, выстраивая мощные волны палубной авиации."
 leader_trait_commander_essex_triggered_desc:0 "§YДаёт§G бонус§! к $mod_weapon_type_strike_craft_weapon_damage_mult$, растущий с числом лидеров империи. §!"
