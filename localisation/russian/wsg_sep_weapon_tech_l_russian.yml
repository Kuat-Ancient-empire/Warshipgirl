 tech_wsg_weapon_S_300:0 "Кинетико-энергетическая группа S-300"
 tech_wsg_weapon_S_300_desc:0 "Мощь ядер Глубинных позволила отлить эту крупнокалиберную группу."
 tech_wsg_weapon_S_380:0 "Тахионный свет-меч S-380"
 tech_wsg_weapon_S_380_desc:0 "Сверхкрупный калибр — не хуже свет-меча 381 ни в мощи, ни в дальности, а темп стрельбы выше в разы."
 tech_wsg_weapon_S_460:0 "Луч чистилища S-460"
 tech_wsg_weapon_S_460_desc:0 "Доработка 460-го титанного орудия: с ядрами Глубинных отсыпает больше огня при той же мощи."
 tech_wsg_weapon_S_40:0 "Счетверённый лазерный ПВО-массив S-Bofors"
 tech_wsg_weapon_S_40_desc:0 "Групп стало вдвое больше, а темп вырос куда больше вдвое. Съедает банку энергии за 30 секунд, ткуя вокруг корабля лазерную завесу; без ядра Глубинных на полную не выйдет."
 tech_wsg_weapon_S_301:0 "Противокорабельная ракета S-301 «Sea Hawk»"
 tech_wsg_weapon_S_301_desc:0 "Ядро Глубинных — само по себе нестабильный источник: подорви — и разрушения страшные, как у ядерного заряда. БЧ этой ракеты несёт целый ворох ядер: любой вражеский корабль — смерть с одного попадания."
 tech_wsg_weapon_S_A2:0 "Звёздный бомбардировщик S-A2 «Дикарь»"
 tech_wsg_weapon_S_A2_desc:0 "Палубник с двигателем на ядрах: боезапас — вчетверо больше B-25, больше иных ранних корветов; сам — почти маленький корвет."
 tech_wsg_weapon_ES_300:0 "Тёмно-материальная кинетико-энергетическая группа ES-300"
 tech_wsg_weapon_ES_300_desc:0 "Слияние тёмной материи и ядер Глубинных: отсыпает огня куда больше, чем надо, чтобы разорвать корабль."
 tech_wsg_weapon_ES_406:0 "Тёмно-материальный свет-меч ES-406"
 tech_wsg_weapon_ES_406_desc:0 "С тёмной материей и ядрами Глубинных этот калибр — предел для обычного линкора; огневая мощь дважды гарантирована."
 tech_wsg_weapon_X_S450:0 "Сверхтяжёлая энергоглыбовая батарея S-450"
 tech_wsg_weapon_X_S450_desc:0 "Новейшая сверхтяжёлая батарея Лавки Трофеев: сверхтяжёлые снаряды в коконе из тёмной материи и энергии Глубинных несут ужасающий урон; пользуется плодами оптимизации и кинетики, и энергетики."
 tech_wsg_weapon_ES_460:0 "Тёмно-материальный луч чистилища ES-460"
 tech_wsg_weapon_ES_460_desc:0 "Суперорудие на тёмной материи и ядрах Глубинных — пушка-чудо в истории корабельных дев. Крупнейший в истории оружия калибр пробьёт всё, что есть в этом мире."
 tech_wsg_weapon_T_S510:0 "Сверхтяжёлый тёмно-материальный луч S-510"
 tech_wsg_weapon_T_S510_desc:0 "Чернаятехнология Лавки Трофеев: неслыханный свет-меч, в дуло которого влезает гора. Извергает поток тёмной материи с энергией Глубинных — уничтожает любую материю на пути."
 tech_wsg_senergy_fire_control:0 "Радиоопределитель на ядрах Глубинных"
 tech_wsg_senergy_fire_control_desc:0 "$wsg_senergy_FIRE_CONTROL_DESC$"
 tech_wsg_weapon_S_6:0 "$SMALL_wsg_weapon_SML_S6$"
 tech_wsg_weapon_S_6_desc:0 "Энергии у корабля теперь в избытке — родилась эта мощная универсальная группа: сжимает гору энергии в точку и бьёт разрушительным лучом, по мощи подбираясь к ранним корабельным свет-мечам."
 tech_wsg_weapon_S_305:0 "Автоматический свет-меч S-305"
 tech_wsg_weapon_S_305_desc:0 "Корабельное орудие под дроны: без оператора, само наводится и стреляет. Внутренний объём и энергия сжаты до предела, чтобы гигантская пушка встала на спинальный дрон."
 tech_senergy_aura:0 "Флотское поле"
 tech_senergy_aura_desc:0 "Глубокое изучение ядер вывело в строй мощные компоненты на весь флот."
 tech_wsg_nanana_sensor:0 "Сонар «Голубь нанана»"
 tech_wsg_nanana_sensor_desc:0 "$WSG_NANANA_SENSOR_DESC$"
 tech_senergy_dreadnought:0 "Корабль-арсенал"
 tech_senergy_dreadnought_desc:0 "Вершина нашей эпохи: супер-дредноут, достойный целого флота."
 tech_senergy_space_compression:0 "Сжатие пространства"
 tech_senergy_space_compression_desc:0 "Строить нечто больше Владыки нереально: неэффективно и непрочно. Нужен способ локально сжимать пространство-время, раздув внутренние объёмы. С энергией Глубинных, возможно, выйдет — и наш дредноут будет готов."
