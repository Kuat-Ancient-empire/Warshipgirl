 wsg_weapon_L_S_300_DESC:0 "Новое поколение корабельных орудий на питании ядрами Глубинных."
 wsg_weapon_L_ES_300:0 "Тёмно-материальная кинетико-энергетическая группа"
 wsg_weapon_L_ES_300_DESC:0 "Следующее поколение энергогрупп: слияние тёмной материи и ядер Глубинных."
 wsg_weapon_T_S_460:0 "Луч чистилища S-460"
 wsg_weapon_T_S_460_DESC:0 "Доработка 460-го титанного орудия."
 wsg_weapon_X_S_380:0 "Тахионный свет-меч S-380"
 wsg_weapon_X_S_380_DESC:0 "Сверхкрупный калибр — не хуже свет-меча 381 ни в мощи, ни в дальности, а темп стрельбы выше в разы."
 wsg_weapon_X_ES_406:0 "Тёмно-материальный свет-меч ES-406"
 wsg_weapon_X_ES_406_DESC:0 "Слияние тёмной материи и ядер Глубинных: предел калибра для обычного линкора, дважды гарантированная мощь."
 wsg_weapon_T_ES_460:0 "Тёмно-материальный луч чистилища ES-460"
 wsg_weapon_T_ES_460_DESC:0 "Суперорудие — пушка-чудо в истории корабельных дев. Крупнейший в истории оружия калибр пробьёт всё на свете."
 wsg_weapon_S_40:0 "Спаренный лазерный ПВО-массив S-Bofors"
 wsg_weapon_S_40_DESC:0 "Групп стало вдвое больше, а темп вырос куда больше вдвое."
 wsg_weapon_S_301:0 "Противокорабельная ракета S-301 «Sea Hawk»"
 wsg_weapon_S_301_DESC:0 "БЧ — ворох ядер Глубинных: пробив щит, взрывается чудовищно; любой вражеский корабль — смерть с одного попадания."
 wsg_weapon_S_A2:0 "Звёздный бомбардировщик S-A2 «Дикарь»"
 wsg_weapon_S_A2_DESC:0 "Палубник на ядрах Глубинных: боезапас вчетверо больше B-25, больше иных ранних корветов."
 wsg_weapon_X_S450:0 "Сверхтяжёлая энергоглыбовая батарея S-450"
 wsg_weapon_X_S450_DESC:0 "Сверхтяжёлая батарея Лавки Трофеев: сверхтяжёлые снаряды в коконе тёмной материи и энергии Глубинных; пользуется оптимизациями кинетики и энергетики."
 wsg_weapon_T_S510:0 "Сверхтяжёлый тёмно-материальный луч S-510"
 wsg_weapon_T_S510_DESC:0 "Чернаятехнология Лавки Трофеев: в дуло влезает гора. Извергает поток тёмной материи с энергией Глубинных — уничтожает всё на пути."
 wsg_weapon_X_S_305:0 "$tech_wsg_weapon_S_305$"
 wsg_weapon_X_S_305_DESC:0 "Автоматическое корабельное орудие под дроны: максимум разрушения с минимума места."
 WSG_NANANA_SENSOR:0 "Сонар «Голубь нанана»"
 WSG_NANANA_SENSOR_DESC:0 "В космосе звука нет, но и вакуум не абсолют: сожми пространство до 2D — и вещества хватит, чтобы донести «нанана», засекая корабли за 114 514 световых секунд."
 SMALL_wsg_weapon_SML_S6:0 "Универсальная кинетико-энергетическая группа S-6"
 SMALL_wsg_weapon_SML_S6_DESC:0 "Мощная универсальная группа: сжимает гору энергии в точку и бьёт разрушительным лучом — по мощи на уровне ранних корабельных свет-мечей."
