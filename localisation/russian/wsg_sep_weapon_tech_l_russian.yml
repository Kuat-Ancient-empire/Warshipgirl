l_russian:

 tech_wsg_senergy:0 "Реверс энергии Глубинных"
 tech_wsg_senergy_desc:0 "С чертежами в руках мы начинаем разрабатывать процесс приготовления энергии Глубинных."
 tech_wsg_senergy_manufacture:0 "Автоматизация приготовления"
 tech_wsg_senergy_manufacture_desc:0 "Полностью автоматические цеха падшей империи нам не повторить, но реверс их автоматики сильно поднимет эффективность производства."
 gateway_senergy_tech:0 "§HТехнологическая ветка энергии Глубинных§!\n§EЭта технология ускорит применение энергетических ядер§!"
 wsg_project_S_prerequisite:0 "Применение энергии Глубинных к человеку"
 wsg_project_S_prerequisite_desc:0 "Необходимый эксперимент для массового применения энергетических ядер"
 tech_wsg_senergy2:0 "Оптимизация процесса приготовления"
 tech_wsg_senergy2_desc:0 "Нынешний способ слишком медленный и трудоёмкий — на растущие запросы дев не напасёшься. Процессу нужна революция."
 tech_wsg_senergy_implantation:0 "Имплантация ядер Глубинных"
 tech_wsg_senergy_implantation_desc:0 "Ещё первые носители ригингов случайно выяснили: имплантат энергии Глубинных раскрывает потенциал тела; за жуткие побочки метод объявили запретным.\nТеперь, с достаточным знанием, запрет снимается — потенциал корабельных дев будет раскрыт весь."
 wsg_project_S_genetic_edicts:0 "§HОткрывает черты: §! продвинутые черты корабельных дев"
 wsg_project_S_genetic_edicts_desc:0 "С ядрами Глубинных мы усилим себя ещё сильнее"
 tech_wsg_genetic_resequencing_s:0 "Пересборка генома с ядрами Глубинных"
 tech_wsg_genetic_resequencing_s_desc:0 "Пересборка на базе ядер позволяет носительницам направлять энергию ядра в нужную часть тела — точечное усиление и максимум с каждой капли энергии."
 wsg_senergy_manufacture_building_workers_increase_desc:0 "Каждый завод ядер дополнительно производит §Y3 £sr_se£ $sr_se$§!, но содержание растёт на §Y3 £sr_pantsu£ $sr_pantsu$§! и §Y15 £energy£ $energy$§!"
 wsg_senergy_manufacture_building_workers_increase:0 "§YТеперь заводы ядер Глубинных могут держать ограниченную автоматическую линию§!"
 job_wsg_senergy_enhance_desc:0 "§YТехнология изготовления ядер Глубинных улучшена. §!"
 job_wsg_senergy_enhance:0 "Выработка §Y £sr_se£ $sr_se$§! должностью $job_wsg_senergy$: §G+0.25§!; содержание: §Y+2 £energy£ $energy$§!"
 senergy_megastructure:0 "§HОткрывает мегаструктуру: §! гигантский завод энергетических ядер"
 senergy_megastructure_desc:0 "Мегаструктура для массового выпуска ядер. Приготовление неизбежно гадит — ставить только в безлюдных системах."
 tech_wsg_sha:0 "Тяжёлая броня S-HA"
 tech_wsg_sha_desc:0 "IA у нас эффективна — но специализированные компоненты всегда дают больше выбора"
 tech_wsg_ses:0 "Щитовой массив S-ES"
 tech_wsg_ses_desc:0 "IA у нас эффективна — но специализированные компоненты всегда дают больше выбора"
 tech_wsg_s_ia:0 "IA-бронь с ядрами Глубинных"
 tech_wsg_s_ia_desc:0 "Ядра дают щитам мощнейшее питание: при разумной раскладке новая броня закрывает щиты, броню и корпус разом — под любым огнём врага."
 tech_wsg_senergy_reactor:0 "Реактор на ядрах Глубинных"
 tech_wsg_senergy_reactor_desc:0 "Продвинутый реактор на ядрах — неиссякаемая тяга кораблю."
 tech_wsg_senergy_sensors:0 "Сенсор «повелителя удачи» S-ov"
 tech_wsg_senergy_sensors_desc:0 "Мне кажыца, они вон там! Гнать мощность туда и палить!"
 tech_wsg_senergy_propulsion:0 "Двигатель на ядрах Глубинных"
 tech_wsg_senergy_propulsion_desc:0 "Мощи ядер хватает на любые прихоти тяги: даже кирпич полетит с третьей космической."
 tech_wsg_senergy_computer:0 "Боевой компьютер S-ov"
 tech_wsg_senergy_computer_desc:0 "Мне кажыца, если крутануть мощность и считать наугад — посчитается всё. — профессор Квинси"
 tech_wsg_senergy_jump_drive:0 "Прыжковый двигатель на ядрах Глубинных"
 tech_wsg_senergy_jump_drive_desc:0 "С мощью ядер дальние прыжки — уже не мечта."
 wsg_ship_part_wsg_sha:0 "Тяжёлая броня S-HA"
 wsg_ship_part_wsg_sha_DESC:0 "Модуль брони для защиты и корпуса корабля"
