 wsg.9999.desc:0 "$wg_mod_version$\n\nДобро пожаловать в комплексное меню «расового мода Warship Girls»: кнопки этого меню открывают быстрый доступ ко всем функциям.\nЗдесь собрано всё: настройка сложности, привязанность и обручение, связь с особыми лидерами (крайне справа) и прочее.\n\n§HФункций у мода стало много и он располнел, поэтому старые точки входа будут постепенно выпиливаться§! (например, вспомогательные функции через указы и особые окна связи), §Hи в итоге всё будет открываться только через это меню. §!\nПросим извинить за неудобства. Русская локализация: Sayarin."
