 switch_to_old_leader_diplo:0 "Старый интерфейс лидера"
 switch_to_new_leader_diplo:0 "Новый интерфейс лидера"
 switch_wg_leader_diplo_tooltip:0 "Большая часть старых интерфейсов уже перенесена в новый: этот переключатель остался лишь для особых диалогов лидеров; прочие окна лидеров открываются только новые."
