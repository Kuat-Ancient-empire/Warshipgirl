l_russian:

 r_neoforce_remain:0 "Бывший механический завод Глубинных"
 r_neoforce_remain_desc:0 "Этот затопленный сборочный завод Глубинных всё ещё стоит ремонта."
 d_neoforce_remain:0 "Строительный завод Порта"
 d_neoforce_remain_desc:0 "Трудами инженеров завод Глубинных служит нам."
 d_port_pilan_remain:0 "Новый Пиран"
 d_port_pilan_remain_desc:0 "Порт Пиран отстроен: теперь и сингулярной бомбе его не пошатнуть."
 r_DM:0 "Хребет Де-Мойна"
 r_DM_desc:0 "Жила-была эсминка, и очень она ненавидела этот уходящий в небеса хребет; день за днём она таскала гору, пытаясь её снести. В итоге померла от усталости. История зовёт это «Эсминка подвигает гору»."
 d_VV:0 "Равнина Венето"
 d_VV_desc:0 "Освоив технологию сноса гор, мы наконец расчистили эту преграду; в память о подвиге — равнина Венето."
 r_port_pilan_ruins:0 "В начале Последней битвы Глубинные взорвали в родном Порту несколько крупномощных ядерных зарядов. К счастью, у Порта уже был ядерный опыт — людей погибло немного, но Пиран всё равно обратился в пустошь."
 r_port_pilan_ruins_desc:0 "В начале Последней битвы Глубинных они взорвали в родном Порту несколько ядерных зарядов огромной мощности. К счастью, у Порта уже был опыт ядерного взрыва — людей погибло немного, но мощные заряды всё равно обратили порт Пиран в пустошь."
 r_hp_shipyard:0 "Руины верфей ХМ Хуанпуцзян"
 r_hp_shipyard_desc:0 "Верфи ХМ, наши крупнейшие, стали целью первого удара Глубинных. Под руинами — тонны чертежей, ждущих выемки."
 r_cherry_tree:0 "Обычная вишня"
 r_cherry_tree_desc:0 "Совершенно обычная вишня; ничего особенного — просто спилить."
 d_dp_obelisk:0 "Обелиск Глубинных"
 d_dp_obelisk_desc:0 "Обелиск Глубинных — на деле исполинская база данных: из неё можно вычитать бездну сведений."
 d_satellite_group:0 "Бывшая группировка ХМ"
 d_satellite_group_desc:0 "После гибели верфей Хуанпуцзян спутники с горой данных обесточены, но мы всё ещё вычитываем из них залежи чертежей."
 d_plant_reaper:0 "Плантация лук-резанца"
 d_plant_reaper_desc:0 "Промышленное выращивание лук-резанца даст гору еды (лишь бы жуки не напали)."
 d_bison_power_station:0 "Хомячковая турбогенераторная"
 d_bison_power_station_desc:0 "Хочешь — верь, хочешь — нет: это вечный двигатель."
 d_dp_mining_station:0 "Шахта Глубинных"
 d_dp_mining_station_desc:0 "Разгадка неиссякаемости военных машин Глубинных найдена: эта исполинская шахта теперь наша."
 d_port_system_NAME:0 "Порт приписки"
 d_port_system_DESC:0 "Родная планета дев, лишь недавно закончившая войну."
 wg_ring_world_system_NAME:0 "Предтечи дев"
 wg_ring_world_system_DESC:0 "Память нашей цивилизации начинается с рождения в городских джунглях и безбедной жизни среди безымянных чудес. Столетия спустя мы осознали: живём мы на мир-кольце Глубинных. Пора покорить звёзды наследием предтеч.\n\n§!§RВнимание: §!§!§Y Это старт предельно имбовый§!"
 shop_home_system_NAME:0 "Лавка Трофеев"
 shop_home_system_DESC:0 "Орбитальная станция обитания, прежде принадлежавшая Лавке Трофеев; теперь она — вся наша цивилизация…"
 wg_dyson_ring_home_system_NAME:0 "Новгород"
 wg_dyson_ring_home_system_DESC:0 "Предки возвели самое-самое КРУУУУУТО сооружение вселенной — вращающееся кольцо Дайсона. Но перед вопросом «крутить ли быстрее» перегрызлись — и в Армагеддоне скатились в каменный век.\nТеперь мы вернёмся к звёздам — и решим, жать ли§R большую красную кнопку§! разгона!"
 d_pantsuhd:0 "Охотничьи угодья транспортов"
 d_pantsuhd_desc:0 "В эти воды выпустили корабли снабжения Глубинных; девы ходят сюда на охоту — нам остаётся за немного энергокредитов выкупать трусики как дешёвую рабочую плату."
 d_neo:0 "Применение NEO"
 d_neo_desc:0 "NEO используется этой планетой."
 d_neo2:0 "Таинственная лук-резанцевая электростанция"
 d_neo2_desc:0 "По неведомым причинам завод превращает часть излишков лук-резанца в особые ресурсы…"
 d_senergy:0 "Автозавод ядер Глубинных"
 d_senergy_desc:0 "Завод на планете безостановочно выдаёт энергетические ядра Глубинных — не вкладывая ни единицы ресурсов."
 d_grassy_building:0 "Заросшие резанцем дома"
 d_grassy_building_desc:0 "Почему дома обросли лук-резанцом — неясно; придётся чистить."
 r_clovertheater_world_tree:0 "Мировое древо"
 r_clovertheater_world_tree_desc:0 "Исполинское древо, взращённое посевом полуразумной жизни: одной тени его биоразнообразия больше, чем во всём родном Порту."
 d_water_b:0 "Амбра"
 d_water_b_desc:0 "Драгоценная ароматическая смола в белой жировой оболочке: горит благоуханно, целебна. С древних времён это сокровище находили там, где побывала наша драконица."
 d_water_b_2:0 "Заброшенное гнездо"
 d_water_b_2_desc:0 "Эта исполинская пещера была гнездом дракона; по гнезду мы изучим его загадочную физиологию."
 d_waterb_dead_bodies:0 "£blocker£ Плавучие тела"
 d_waterb_dead_bodies_desc:0 "Трупы существ, захлебнувшихся в нежданной воде; на солнце они источают нестерпимое зловоние"
 d_waterb_boggy_fens:0 "£blocker£ Пелагический мусорный пояс"
 d_waterb_boggy_fens_desc:0 "Вода накрыла не предназначенные для неё нефтеносные равнины и болота; органика всплыла, водоросли размножились, грянул красный прилив — кислорода в море нет, рыба гибнет, тела всплывают: гигантская вонючая каша из сплетённых трупов по всему морю."
 d_waterb_seal:0 "£blocker£ Тюлень-труха"
 d_waterb_seal_desc:0 "Когда всеводную планету терраформировали, эти неизвестно где прятавшиеся тюлени вылезли кормиться — и популяция рванула вверх. Их европейские морды так и просят гвоздь в сердце…"
 d_waterb_underwater_buildings:0 "Подводные здания"
 d_waterb_underwater_buildings_desc:0 "Затопленные постройки туземцев. Как туробъект — манят дайверов и деньги; как археология — расскажут об их обществе."
 d_waterb_underwater_vent:0 "Подводное газовое поле"
 d_waterb_underwater_vent_desc:0 "1 919 810 кубометров газа; впрочем, поляну портит запах — и какие-то бессвязные крики."
 d_waterb_underwater_crystal:0 "Кристальные коралловые рифы"
 d_waterb_underwater_crystal_desc:0 "Сверхдавление и подводный вулканизм сплавили красоту кораллового рифа с кристаллом. Красота — и польза: твёрдость и чистота на уровне военных кристаллов."
 d_waterb_underwater_mote:0 "Подводная взрывная пыль"
 d_waterb_underwater_mote_desc:0 "Химическая пыль в пластах после полного затопления чуть изменилась, но как сырьё взрывчатки годна — и редкостно способна вспыхивать в холодных сложных средах."
 d_waterb_underwater_volcano:0 "£blocker£ Подводный вулкан"
 d_waterb_underwater_volcano_desc:0 "Затопленный действующий вулкан: и под водой он изрыгает лаву и яды, а землетрясения рождают цунами."
 pc_wsg_port:0 "Планета Порта"
 pc_wsg_port_desc:0 "Вся поверхность планеты — постройки Порта и исполинские искусственные внутренние моря."
 pc_wsg_port_adj:0 "Планета Порта"
 mod_pc_wsg_port_habitability:0 "Пригодность: планета Порта"
 trait_pc_wsg_port_preference:0 "Предпочтение: планета Порта"
 trait_pc_wsg_port_preference_desc:0 "Предпочтение: планета Порта"
 district_arcology_wsg_housing:0 "Район общежитий"
 district_arcology_wsg_housing_plural:0 "Район общежитий"
 district_arcology_wsg_housing_cap:0 "$district_arcology_wsg_housing$"
 district_arcology_wsg_housing_desc:0 "Жизнь дев: роскошные торговые кварталы, большие бани — комфорт зашкаливает."
 district_arcology_wsg_neo:0 "Район литья Порта"
 district_arcology_wsg_neo_plural:0 "Район литья Порта"
 district_arcology_wsg_neo_cap:0 "$district_arcology_wsg_neo$"
 district_arcology_wsg_neo_desc:0 "При идеальной раскладке сплавовые заводы стоят в масштабе и без капли грязи."
 district_arcology_wsg_science:0 "Научный район"
 district_arcology_wsg_science_plural:0 "Научный район"
 district_arcology_wsg_science_cap:0 "$district_arcology_wsg_science$"
 district_arcology_wsg_science_desc:0 "Здесь — концентрат передовых лабораторий."
 district_arcology_wsg_military:0 "Район диспетчерской Порта"
 district_arcology_wsg_military_plural:0 "Район диспетчерской Порта"
 district_arcology_wsg_military_cap:0 "$district_arcology_wsg_military$"
 district_arcology_wsg_military_desc:0 "Район ведает диспетчеризацией флота и управлением страны."
 district_arcology_wsg_neo_alpha:0 "Район производства Порта"
 district_arcology_wsg_neo_alpha_plural:0 "Район производства Порта"
 district_arcology_wsg_neo_alpha_cap:0 "$district_arcology_wsg_neo_alpha$"
 district_arcology_wsg_neo_alpha_desc:0 "Тщательная планировка позволяет вести здесь производство ресурсов, прежде требовавших гигантских комплексов."
 district_hab_pantsu:0 "Район сбора трусиков"
 district_hab_pantsu_plural:0 "Район сбора трусиков"
 district_hab_pantsu_cap:0 "$district_hab_pantsu$"
 district_hab_pantsu_desc:0 "Как известно, Лавка хранит ресурсы по-зеленокожему: горы трусиков просто валяются — собирай и богатей."
 decision_wsg_rw_project:0 "Проект «Кольцо Порта»"
 decision_wsg_rw_project_desc:0 "Мы задумали портизировать это великое кольцо."
 decision_wsg_rw_project_requirements:0 "$TRIGGER_FAIL$ Все районы должны быть городскими!"
 decision_wsg_rw_effects:0 "Обратить мир-кольцо в кольцо Порта"
 pc_ringworld_habitable_wsg:0 "Кольцо Порта"
 pc_ringworld_habitable_wsg_desc:0 "Второй апгрейд кольца — супер-кольцо, заточенное под дев."
 district_rw_wsg_city:0 "Кольцо общежитий Порта"
 district_rw_wsg_city_plural:0 "Кольцо общежитий Порта"
 district_rw_wsg_city_cap:0 "$district_rw_wsg_city$"
 district_rw_wsg_city_desc:0 "Жизнь дев: роскошные торговые кварталы, большие бани — комфорт зашкаливает."
 district_rw_wsg_alloys:0 "Кольцо литья Порта"
 district_rw_wsg_alloys_plural:0 "Кольцо литья Порта"
 district_rw_wsg_alloys_cap:0 "$district_rw_wsg_alloys$"
 district_rw_wsg_alloys_desc:0 "При идеальной раскладке сплавовые заводы стоят в масштабе и без капли грязи."
 district_rw_wsg_science:0 "Кольцо науки Порта"
 district_rw_wsg_science_plural:0 "Кольцо науки Порта"
 district_rw_wsg_science_cap:0 "$district_rw_wsg_science$"
 district_rw_wsg_science_desc:0 "Здесь — концентрат передовых лабораторий."
 district_rw_wsg_soldier:0 "Кольцо производства Порта"
 district_rw_wsg_soldier_plural:0 "Кольцо производства Порта"
 district_rw_wsg_soldier_cap:0 "$district_rw_wsg_soldier$"
 district_rw_wsg_soldier_desc:0 "Вынос редких ресурсов на кольцо Порта резко поднимает их выпуск."
 pc_swim:0 "Планета источников"
 pc_swim_desc:0 "Волшебный мир планетарного горячего источника: слили океан, разогрели ядро, поставили плавучие посёлки."
 district_water_housing:0 "Курортное жильё источников"
 district_water_housing_plural:0 "Курортное жильё источников"
 district_water_housing_cap:0 "$district_water_housing$"
 district_water_housing_desc:0 "Роскошная курортная зона у плавучих посёлков: туристы резвятся вовсю."
 district_water_generator:0 "Район термоэлектростанции"
 district_water_generator_plural:0 "Район термоэлектростанции"
 district_water_generator_cap:0 "$district_water_generator$"
 district_water_generator_desc:0 "Эффективная выработка у самого ядра."
 job_wg_tourism:0 "Турист источников"
 job_wg_tourism_plural:0 "Турист источников"
 job_wg_tourism_cap:0 "$job_wg_tourism$"
 job_wg_tourism_desc:0 "Гости со всей страны — только ради этого несравненного источника."
 district_water_ktv:0 "Район шоу источников"
 district_water_ktv_plural:0 "$district_water_ktv$"
 district_water_ktv_cap:0 "$district_water_ktv$"
 district_water_ktv_desc:0 "Источник с голографическими динамическими установками и большой сценой: каждый гость будет в экстазе."
 mod_job_wg_tourism_add:0 "Должность: $job_wg_tourism$"
 job_wg_tourism_effect_desc:0 "£job_wg_tourism£ $job_wg_tourism_plural$ потребляют £consumer_goods£ §Yтовары массового спроса§!, производят £mod_pop_bonus_workforce_mult£ §Y$TRADE_VALUE$§!, £unity£ §Y$unity$§! и £mod_planet_amenities_add£ §Y$PLANET_AMENITIES_TITLE$§!"
 wg_swim_planet_colony:0 "Курортная станция источников"
 wg_swim_planet_colony_desc:0 "Величественные пейзажи и бесплатные круглосуточные источники делают планету мечтой всей страны."
 wg_swim_planet_colony_other_planets:0 "Планета источников"
 swim_planet_empire_effects:0 "Прочие колонии империи:\n $MOD_PLANET_AMENITIES_MULT$: §G+15%§!\n $MOD_PLANET_STABILITY_ADD$: §G+5§!\n"
 decision_water_project_1:0 "Фестиваль источников"
 decision_water_project_1_desc:0 "Открыть планетарный фестиваль и приманить туристов всей страны."
 swim_project_requirements:0 "$TRIGGER_FAIL$ Фестиваль уже идёт на одной из планет источников"
 tech_wg_waterB2:0 "Обживание всеводной планеты"
 tech_wg_waterB2_desc:0 "Как говорится, и на воде можно держаться, и водить скутер. Немного магии (в обычной фантастике тут вставили бы термин) — и терраформирование готово."
 water_edicts:0 "§HРазрешено обращать всеводную планету в: §! планету источников\n§HРазрешено обращать всеводное кольцо в: §! кольцо источников\n§HОткрывает указ: §! Фестиваль источников"
 water_edicts_desc:0 "Планета источников — идеальный туристический мир: выгода всей стране."
 pc_ringworld_habitable_swim:0 "Кольцо источников"
 pc_ringworld_habitable_swim_desc:0 "Волшебный мир-кольцо горячего источника: слили океан, разогрели ядро, поставили плавучие посёлки."
 district_rw_water_housing:0 "Жилое кольцо источников"
 district_rw_water_housing_plural:0 "Жилое кольцо источников"
 district_rw_water_housing_cap:0 "$district_rw_water_housing$"
 district_rw_water_housing_desc:0 "Роскошная курортная зона у плавучих посёлков: туристы резвятся вовсю."
 district_rw_water_generator:0 "Термо-кольцо источников"
 district_rw_water_generator_plural:0 "Термо-кольцо источников"
 district_rw_water_generator_cap:0 "$district_rw_water_generator$"
 district_rw_water_generator_desc:0 "Часть кольца слишком горяча для купания — идеальное место под электростанцию."
 district_rw_water_food:0 "Тюленье рагу-кольцо"
 district_rw_water_food_plural:0 "Тюленье рагу-кольцо"
 district_rw_water_food_cap:0 "$district_rw_water_food$"
 district_rw_water_food_desc:0 "Вообрази: ты в высокотехнологичном термокостюме прыгаешь с 30-метровой вышки в котёл-источник — и плаваешь, и паришься, и рагу ешь."
 district_rw_water_ktv:0 "Диско-кольцо источников"
 district_rw_water_ktv_plural:0 "$district_rw_water_ktv$"
 district_rw_water_ktv_cap:0 "$district_rw_water_ktv$"
 district_rw_water_ktv_desc:0 "Роскошный сервисный пояс с большой сценой и источниками премиум; для стеснительных — отдельные караоке-комнаты: сервис на все сто."
 job_hot_seal:0 "Официант «Тюленьего рагу»"
 job_hot_seal_plural:0 "Официант «Тюленьего рагу»"
 job_hot_seal_cap:0 "$job_hot_seal$"
 job_hot_seal_desc:0 "Знаменитый грубиян-тюлень: будет ли обслуживать — зависит от настроения; обожаем туристами-мазохистами."
 mod_job_hot_seal_add:0 "Должность: $job_hot_seal$"
 job_hot_seal_effect_desc:0 "£job_hot_seal£ $job_hot_seal_plural$ производят £food£ §Y$food$§!"
 d_AP:0 "Малый склад снабжения Глубинных"
 d_AP_desc:0 "Склад под нашим контролем: транспорты день и ночь штампуют трусики."
 r_sh_freezer:0 "Пробуждение из криокапсул: этап I"
 r_sh_freezer_desc:0 "Из-за нехватки ресурсов массы населения ушли в криосон."
 r_sh_freezer2:0 "Пробуждение: этап II"
 r_sh_freezer2_desc:0 "Обосновавшись на планете, пора размораживать следующую партию."
 r_sh_freezer3:0 "Пробуждение: этап III"
 r_sh_freezer3_desc:0 "Последняя партия спящих."
 d_sh_monument:0 "Монумент Пути"
 d_sh_monument_desc:0 "Сколько лишений и горя: жестокое переселение отняло слишком многое. Теперь мы воспрянем и вернём всё утраченное."
 d_sh_db:0 "Терраформер Глубинных"
 d_sh_db_desc:0 "Скитания в пустоте не прошли даром: на мёртвой планете мы нашли передовой терраформер; он сломался после запуска, но реверс воспроизведёт часть функций."
 d_sr_se:0 "Производитель ядер Глубинных"
 d_sr_se_desc:0 "Эти могучие автопроизводители ядер бережно восстановлены."
