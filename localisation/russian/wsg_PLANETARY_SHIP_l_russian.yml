 planetary_ship_megastructures:0 "Стапель корабля-планеты"
 planetary_ship_megastructures_DESC:0 "Этот проект превратит планету в корабль-планету — невиданное доселе орудие войны."
 planetary_ship_megastructures_MEGASTRUCTURE_DETAILS:0 "Чтобы гарантировать масштаб корабля-планеты, на слишком малую планету придётся вложить больше ресурсов."
 planetary_ship_megastructures_1:0 "Корабль-планета: переделка ядра"
 planetary_ship_megastructures_1_DESC:0 "Ядро планеты переоборудовано в геореактор корабля-планеты."
 planetary_ship_megastructures_2:0 "Корабль-планета: переделка поверхности"
 planetary_ship_megastructures_2_DESC:0 "Планета укрыта толстым слоем звёздной брони, главный калибр достроен."
 planetary_ship_megastructures_3:0 "Корабль-планета: кольцо тяги"
 planetary_ship_megastructures_3_DESC:0 "Далёкие переходы корабль-планета совершает полем притяжения, но без кольца тяги тонкая коррекция невозможна — а на кольце ещё и место под вооружение. Осталась финальная отладка — и можно зажигать!\n\n§RСначала сохраните проект корабля-планеты в конструкторе флота§!"
 planetary_ship_megastructures_4:0 "Корабль-планета типа «Творец»"
 planetary_ship_megastructures_4_DESC:0 "Типу «Творец» доступны колоссальное вооружение и функции доков."
 planetary_ship_megastructures_5:0 "Корабль-планета типа «Марс»"
 planetary_ship_megastructures_5_DESC:0 "Тип «Марс» может действовать в строю обычных флотов."
 planetary_ship_megastructures_1_ruin:0 "$planetary_ship_megastructures_ruin$"
 planetary_ship_megastructures_1_ruin_DESC:0 "$planetary_ship_megastructures_ruin_DESC$"
 planetary_ship_megastructures_ruin:0 "Повреждённый корабль-планета"
 planetary_ship_megastructures_ruin_DESC:0 "Этот корабль-планета получил тяжёлый удар, но его ещё можно восстановить."
 planetary_ship_megastructures_ruin_2:0 "Восстановить как тип «Творец»"
 planetary_ship_megastructures_ruin_2_DESC:0 "Типу «Творец» доступны колоссальное вооружение и функции доков."
 planetary_ship_megastructures_ruin_3:0 "Восстановить как тип «Марс»"
 planetary_ship_megastructures_ruin_3_DESC:0 "Тип «Марс» может действовать в строю обычных флотов."
 requires_no_building_planetary_ship_megastructures:0 "$TRIGGER_FAIL$ Есть недостроенный корабль-планета"
 requires_barren:0 "$TRIGGER_FAIL$ Планета должна быть бесплодной"
 requires_no_moon:0 "$TRIGGER_FAIL$ У планеты не должно быть спутников"
 requires_no_terraforming_candidate:0 "$TRIGGER_FAIL$ Планета не может быть кандидатом на терраформирование"
 pc_planetary_ship:0 "Корабль-планета"
 pc_planetary_ship_desc:0 "Планета укрыта толстым слоем звёздной брары — со временем она станет величественным кораблём-планетой."
 pc_planetary_ship_full:0 "Корабль-планета"
 pc_planetary_ship_full_desc:0 "Планета укрыта звёздной бронёй и несёт кольцо тяги — до завершения один шаг."
 tech_planetary_ship:0 "Корабль-планета"
 tech_planetary_ship_desc:0 "Целая планета, обращённая в боевой корабль планетарного класса, — безумнейший проект в истории."
 unlock_planetary_ship:0 "§HОткрывает мегаструктуру: §! корабль-планета"
 unlock_planetary_ship_desc:0 "Целая планета, обращённая в боевой корабль планетарного класса, — безумнейший проект в истории."
 planetary_ship.1.name:0 "Стапель корабля-планеты"
 planetary_ship.1.desc:0 "Стапель в системе §H[planetary_ship_system.GetName]§! готов; по §Yразмеру планеты§! осталось вложить ресурсы — и мы превратим её в величественную боевую крепость."
 planetary_ship.1.a:0 "Отлично"
 planetary_ship.2.name:0 "Ядро переделано"
 planetary_ship.2.desc:0 "Ядро планеты обращено в §Yгеореактор§! — лишь такая мощь способна двинуть корабль-планету."
 planetary_ship.2.a:0 "Мощь так и прёт!"
 planetary_ship.3.name:0 "Поверхность переделана"
 planetary_ship.3.desc:0 "Планета завершила трансформацию: вся — под §Yзвёздной бронёй§!, ни клочка природного рельефа, а §Yсупер-главный калибр§! уже построен.\nНо чтобы крепость поехала, работы ещё непочатый край."
 planetary_ship.3.a:0 "Величественно"
 planetary_ship.4.name:0 "Кольцо тяги установлено"
 planetary_ship.4.desc:0 "Гнать корабль-планету одними двигателями — ресурсов не напасёшься: дальние переходы он совершает, буксируя себя §Yполем притяжения§!, а без кольца тяги тонкую коррекцию не сделать.\nДальше — выбрать тип: §Y«Творец»§! с колоссальным вооружением и доками, либо §R«Марс»§! — для строя обычных флотов.\n\n§RСначала сохраните проект корабля-планеты в конструкторе флота§!\n§RСначала сохраните проект корабля-планеты в конструкторе флота§!\n§RСначала сохраните проект корабля-планеты в конструкторе флота§!"
 planetary_ship.4.a:0 "Выбираем $planetary_ship_megastructures_4$"
 planetary_ship.4.b:0 "Выбираем $planetary_ship_megastructures_5$"
 planetary_ship.5.name:0 "Корабль-планета построен!"
 planetary_ship.5.desc:0 "В системе §H[planetary_ship_system.GetName]§! мы достроили корабль-планету — это §Y«Творец»§!"
 planetary_ship.5.a:0 "Великолепно!"
 planetary_ship.6.name:0 "Корабль-планета построен!"
 planetary_ship.6.desc:0 "В системе §H[planetary_ship_system.GetName]§! мы достроили корабль-планету — это §R«Марс»§!"
 planetary_ship.6.a:0 "Великолепно!"
 planetary_ship.8.name:0 "Корабль-планета подбит!"
 planetary_ship.8.desc:0 "Наш корабль-планета в системе §H[planetary_ship_ruin_target_system.GetName]§! получил тяжелейший удар и обесточен.\nК счастью, основная конструкция цела: его ещё можно §Yвосстановить§!"
 planetary_ship.8.a:0 "Мы обязаны её спасти"
 planetary_ship.8.b:0 "Слишком грустная новость — больше мне таких не докладывать"
 planetary_ship.8_tooltip:0 "§HБудущие сообщения о гибели кораблей-планет показываться не будут§!"
 planetary_ship.9.name:0 "Корабль-планета восстановлен"
 planetary_ship.9.desc:0 "Мы успешно восстановили повреждённый корабль-планету: он как новенький и снова в строю."
 planetary_ship.9.a:0 "Отлично"
 planetary_ship.10.name:0 "Технология корабля-планеты!"
 planetary_ship.10.desc:0 "Годы труда не впустую: мы освоили §Hтехнологию постройки§! корабля-планеты!\n\nКорабль-планета — колоссальный проект: нужна §Yбесплодная планета без спутников§! (малую придётся добивать ресурсами). С таким сверх-судном ни одна цивилизация больше не посмеет нас недооценивать."
 planetary_ship.10.a:0 "Отлично"
 PLANETARY_SHIP_AURA_1_1:0 "Аура подавления корабля-планеты, тип I"
 planetary_ship_aura_1_1_debuff:0 "Мощное поле подавления корабля-планеты ослабляет вражеские корабли"
