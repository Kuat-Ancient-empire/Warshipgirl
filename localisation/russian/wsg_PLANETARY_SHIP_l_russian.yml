 planetary_ship_aura_2_1_buff:0 "Планетарный прокладчик маршрутов проложит флоту безопаснейшие и удобнейшие курсы."
 PLANETARY_SHIP_AURA_2_2:0 "Боевой ассистент-компьютер"
 planetary_ship_aura_2_2_buff:0 "Боевой компьютер с чудовищной вычислительной мощью заметно поднимает боевые качества флота."
