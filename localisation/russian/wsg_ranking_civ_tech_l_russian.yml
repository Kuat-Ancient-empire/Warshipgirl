l_russian:

 tech_wsg_trading_pantsu:0 "Финансиализация трофеев"
 tech_wsg_trading_pantsu_desc:0 "Сломанные Стулья наплодили кучу трофейных финпродуктов: фьючерсы на трусики, трусики-WTF и трусикопционы. Освоив их методы, мы сильно поднимем производство и товарооборот трофеев."
 tech_wsg_trading_1:0 "Торгующиеся досмотры Сломанных Стульев"
 tech_wsg_trading_1_desc:0 "Стулья торгуют поколениями, зарабатывая на чужаках; переняв их методы, с каждой единицы торговли мы возьмём больше."
 tech_wsg_trading_2:0 "Торговые откровения Сломанных Стульев"
 tech_wsg_trading_2_desc:0 "Их приёмы потрясают. Ещё раз: сними рыночные ограничения — и открой торговлю: деньги потекут сами."
 tech_wsg_trading_branch:0 "Распределённые конторы Сломанных Стульев"
 tech_wsg_trading_branch_desc:0 "Нанимая местных и всецело им доверяя, Стулья раскидали по галактике тысячи торговых филиалов и создали гору рабочих мест; нам есть чему поучиться."
 tech_wg_spaceport_module_assembly:0 "Модуль сборки населения на звёздной базе"
 tech_wg_spaceport_module_assembly_desc:0 "Мехзавод на базе системы с колонизированной планетой ускоряет сборку населения колонии."
 tech_wg_shop_anchorage:0 "Расширенная якорная стоянка"
 tech_wg_shop_anchorage_desc:0 "Дополнительные якоря ценой прочности базы.\n §YНе желая перезаписывать ванильные файлы, сначала постройте один ванильный причал, чтобы открыть§!§G$sm_naval_logistics_office$§!§Y, потом снесите§!"
 tech_space_kebab_center:0 "[Мегаструктура] Межзвёздный кебаб-центр"
 tech_space_kebab_center_desc:0 "Гигантская конструкция для жарки мяса на жаре расплавленной планеты: огромное кольцо охватывает экватор, а изнутри — идеальный гриль.\nРецепт и традиция не менялись с §G1453§! года §Gпо сей день§!"
 mega_space_kebab_center:0 "«Мегаструктура» Межзвёздный кебаб-центр"
 space_kebab_center_plus:0 "Открывает мегаструктуру: §YМежзвёздный кебаб-центр§!"
 space_kebab_center_desc:0 "Открывает мегаструктуру: §YМежзвёздный кебаб-центр§!"
 tech_wg_buff_1:0 "Соглашение о персонале Лавки (I)"
 tech_wg_buff_1_desc:0 "Направив в Лавку Трофеев дополнительный персонал, мы стребуем с неё больше услуг."
 tech_wg_buff_2:0 "Соглашение о персонале Лавки (II)"
 tech_wg_buff_2_desc:0 "Корабельные девы обаятельнее и коммерчески одарённее Глубинных — можно отправить ещё одну группу и снова нарастить услуги."
 wsg_shop_buff_plus:0 "Одновременных бонусов Лавки: §G+1§!"
 sm_wg_assembly:0 "Модуль сборки населения"
 sm_wg_assembly_desc:0 "Устройство в помощь колониальному мехзаводу: ускоряет сборку населения."
 sm_shop_anchorage:0 "Расширенная якорная стоянка"
 sm_shop_anchorage_desc:0 "Дополнительные якоря ценой прочности базы — больше мест стоянки.\n§YНе желая перезаписывать ванильные файлы, сначала постройте один ванильный причал, чтобы открыть§!§G$sm_naval_logistics_office$§!§Y, потом снесите§!"
 building_shop_pantsu_star:0 "Трофейная звезда"
 building_shop_pantsu_star_desc:0 "Арт-объект, целиком отлитый из трофеев: так роскошен, что деятели культуры валом валят вдохновляться. Аромат трофейных специй изнутри бодрит и радует — производительность растёт"
 building_shop_pantsu_star_tooltip:0 "Открывает здание: §YТрофейная звезда§!"
 wg_modifier_storage_habitat:0 "Расчищенный трюм станции"
 d_smuggling_bay:0 "Контрабандистский причал"
 d_smuggling_bay_desc:0 "Торговые станции Сломанных Стульев притягивают нелегалов с грязными делишками. Иногда это выгодно нам — но никак не законно."
 d_hacking_device:0 "Торговый терминал Сломанных Стульев"
 d_hacking_device_desc:0 "Терминал со связью через субпространство: сделки в реальном времени — мечта галактического биржевика."
 d_stuffed_strange_storage:0 "Забитый трюм станции"
 d_stuffed_strange_storage_desc:0 "Трюм завален грузами, оставленными неведомо кем, когда и зачем. Есть и редчайшие материалы."
 d_cleared_strange_storage:0 "Расчищенный трюм станции"
 d_cleared_strange_storage_desc:0 "Ценные грузы вывезены — место свободно под стройку и склад."
 d_space_scavange_walking:0 "Космический разборный порт"
 d_space_scavange_walking_desc:0 "Вокруг станции рассыпаны остовы грузовых кораблей с живым металлом; порт расчищен под их разбор."
 wg_shop_immigration_modifier:0 "Принудительный переселенческий протокол"
 wg_shop_immigration_modifier_desc:0 "Коварное миграционное соглашение с высокими технологиями вроде контроля сознания: переселяемые народы принимают всё добровольно — плата за принудительное переселение отменяется."
 wg_shop_pc_habitat_habitability:0 "Секреты выживания на станции"
 wg_shop_pc_habitat_habitability_desc:0 "Удивительная брошюра, исписанная хитростями комфортной жизни в космосе."
 wsg_ship_part_armor_pantsu:0 "Трофейная броня"
 wsg_ship_part_armor_pantsu_DESC:0 "Прочность и пластичность трофеев делают эту броню несокрушимой"
 SMALL_wsg_ship_part_armor_pantsu:0 "Трофейная броня"
 SMALL_wsg_ship_part_armor_pantsu_DESC:0 "Прочность и пластичность трофеев делают эту броню несокрушимой"
