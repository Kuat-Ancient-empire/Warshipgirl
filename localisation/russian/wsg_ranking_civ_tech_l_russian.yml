 LARGE_wsg_ship_part_armor_pantsu_DESC:0 "Прочность и пластичность трофеев делают эту броню несокрушимой"
 tech_pantsu_armor:0 "Трофейная броня"
 tech_pantsu_armor_desc:0 "Прочность и пластичность трофеев делают эту броню несокрушимой"
 tech_pantsu_armor_desc:0 "Прочность и пластичность трофеев делают эту броню несокрушимой"
 tech_pantsu_armor_tooltip:0 "Прочность и пластичность трофеев делают эту броню несокрушимой\n§RДружеский совет: чем позже купите — тем бесполезнее§!"
