 sh.3027.name:0 "Конец системы"
 sh.3027.desc:0 "[From.From.GetName] обратил [From.GetName] в чёрную дыру; крупные тела системы погибли вместе со звездой — уцелели лишь мелкие метеориты.\n\nНепобедимые флоты, мегаструктуры, даже сами планеты — не осталось и обломков.\n\nТеперь одинокий колосс [From.From.GetName] и чёрная дыра [From.GetName] слагают завораживающую картину."
