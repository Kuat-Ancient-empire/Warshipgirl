l_russian:

 origin_sh_chaser:0 "Из бездны к звёздам"
 origin_sh_chaser_desc:0 "Распри, страдания, бесконечная война — такова вся кровавая история флота Глубинных. Но в конце этого пути легендарная лидерница объединила всех Глубинных и повела их к новому будущему.\nОднако её личность — сущее вопиющее отступничество, и в обществе Глубинных не иссякает подводное течение недоверия.\n\n§YВ этом происхождении смена правителя прервёт цепочку событий. §!"
 origin_tooltip_sh_chaser_effects:0 "- §RГонительница§! станет правителем: существо с загадочным прошлым и бесчисленными обличьями, хранящее множество опасных тайн."
 START_SCREEN_origin_sh_chaser:0 "Наша цивилизация всё никак не могла вырваться из спирали войны и медленно брела по грязной дороге — раз за разом наши усилия объединиться разбивались о распри.\n\nНо однажды, когда небо потемнело, море замерло, а само наше существование повисло на волоске, явилась легендарная лидерница. [owner.Ruler.GetTitle]§R Гонительница§! приложила невообразимые усилия, собрала огромное воинство и в итоге объединила всех Глубинных.\n\nТеперь, завершив универсальную технологию гиперпространства, мы наконец можем искать наше будущее среди звёзд."
 leader_trait_origin_sh_chaser:0 "§RДревняя тень бездны§!"
 leader_trait_origin_sh_chaser_desc:0 "§GСила §RГонительницы§! будет проявляться всё сильнее с течением времени. §!\n\nВ глубокой древности она поставила точку в истории распрей Глубинных. Теперь она поведёт нас в бескрайнее звёздное море."
 wg_origin_sh_chaser.2.name:0 "Обещание"
 wg_origin_sh_chaser.2.desc:0 "Пусть её личность — загадка, а обличье непостоянно, §Y[Owner.Ruler.GetTitle][Owner.Ruler.GetRegnalName]§! всё же окончила эпоху наших распрей и принесла единство и объединение. Она обещала, что [Owner.GetName] найдёт своё место среди звёзд.\n\nСегодня, поднявшись из прошлого хаоса, [Owner.GetName] зовёт к звёздному походу; кабинет подготовил тридцатилетний план, чтобы исполнить это обещание и привести наш вид в новую эру."
 wg_origin_sh_chaser.2.a:0 "Поднимаем паруса!"
 origin_sh_chaser_promise:0 "Обещание звёздного моря"
 origin_sh_chaser_promise_type:0 "Древняя клятва"
 origin_sh_chaser_promise_desc:0 "Во время войн за объединение §Y[Owner.Ruler.GetTitle][Owner.Ruler.GetRegnalName]§! обещала [Owner.GetName] будущее среди звёздного моря. Для многих флагманов Глубинных это обещание стало пророчеством; другие же флагманы Глубинных сильно сомневались в его исполнимости. Пусть сверхсветовая наука недавно и шагнула вперёд, горстка флагманов Глубинных стала использовать это неисполненное обещание, чтобы ставить под сомнение власть §Y[Owner.Ruler.GetTitle][Owner.Ruler.GetRegnalName]§!.\n\nЛучший способ заткнуть инакомыслящих — доказать их неправоту. Мы выйдем в межзвёздную даль, обоснуемся на новых мирах и раздвинем наши владения как можно дальше."
 origin_sh_chaser_promise_monthly_change_tooltip:0 "У нас есть 30 лет, чтобы исполнить эту клятву!"
 situation_origin_sh_chaser_promise_expansion:0 "Внутренние дела"
 situation_origin_sh_chaser_promise_prospecting:0 "Новые ресурсы"
 situation_origin_sh_chaser_promise_construction:0 "Строительные проекты"
 situation_origin_sh_chaser_promise_engineering:0 "Новые технологии"
 approach_situation_origin_sh_chaser_promise_expansion_tt:0 "Мы сосредоточимся на внутренних делах."
 approach_situation_origin_sh_chaser_promise_prospecting_tt:0 "Мы сосредоточимся на поиске новых ресурсов."
 approach_situation_origin_sh_chaser_promise_construction_tt:0 "Мы сделаем упор на инженерное строительство."
 approach_situation_origin_sh_chaser_promise_engineering_tt:0 "Мы нарастим вложения в науку."
 situation_origin_sh_chaser_promise_outcome:0 "Мы обязаны исполнить обещание. [Owner.GetName] рассчитывает в следующие 30 лет утвердиться как космическая держава. Мы должны расширять государство, §Gовладевая системами§! и§G колонизируя миры§!.\n\nЧерез§G 30 лет§!§H черта§!§R Древняя тень бездны§! нашего правителя усилится в зависимости от числа контролируемых нами§G систем§! и§G колоний§!.\nВ сумме нам следует владеть как минимум§G 20 системами§! и§G 5 колониями§!; если пригодных миров найдётся слишком мало, следует овладеть ещё большим числом систем, дабы явить наши старания."
 situation_origin_sh_chaser_insight_stages:0 "§Y[Owner.Ruler.GetTitle][Owner.Ruler.GetRegnalName]§! усердно трудится, чтобы исполнить своё обещание."
 wg_origin_sh_chaser.4.name:0 "Непредвиденный случай"
 wg_origin_sh_chaser.4.desc:0 "На одном из заседаний кабинета [Root.Owner.Ruler.GetName] явно была не в форме.\nХотя она твердила, что чрезмерная нагрузка не вызвала у неё личных проблем, все флагманы Глубинных в зале заметили слегка выходящую из-под контроля энергию Глубинных у [Root.Owner.Ruler.GetName]. В один из мгновений, когда красно-чёрный туман внезапно хлынул наружу, облик [Root.Owner.Ruler.GetName] будто разительно изменился; никто не подал голоса, но многие флагманы Глубинных нашли тот облик до жути похожим на корабля-деву."
 wg_origin_sh_chaser.4.a:0 "Неприятно, что у [Owner.Ruler.GetTitle] так много тайн"
 wg_origin_sh_chaser.5.name:0 "Научное расследование"
 wg_origin_sh_chaser.5.desc:0 "На днях научная команда [Root.GetName] разбирала уникальный комплект техники корабельной борьбы за живучесть и обнаружила поразительное сходство с техникой кораблей-дев. Записи показывают, что эта техника, похоже, тысячей нитей связана с нашим [Owner.Ruler.GetTitle][Root.Owner.Ruler.GetName], — и как бы то ни было, она великолепна."
 wg_origin_sh_chaser.5.a:0 "Откуда это у нас?"
 wg_origin_sh_chaser.6.name:0 "Флотские учения"
 wg_origin_sh_chaser.6.desc:0 "Сегодня командование флота [Root.GetName] отработало новейшую тактику, выведенную штабом [Owner.GetName] из боевого стиля [Root.Owner.Ruler.GetName]. По итогам, уклончивость и живучесть флотов заметно выросли, а умение творить больший разгром ограниченным оружием отточено в совершенстве."
 wg_origin_sh_chaser.6.a:0 "Удивительная тактика — и смутно знакомая"
 wg_origin_sh_chaser_6_modifier:0 "Уникальная тактика"
 wg_origin_sh_chaser.8.name:0 "Провал обещания"
 wg_origin_sh_chaser.8.desc:0 "Очевидно, наше расширение не дало ожидаемого.\n[Root.Owner.Ruler.GetName] настаивала, что кабинет выложился на полную и нынешний итог — лишь злая судьба. Она перечислила наши общие достижения и указала, что позволять прошлым ошибкам преграждать нам путь в высшей степени неразумно. Если [Owner.GetName] объединится — нет того, чего мы не преодолеем!"
 wg_origin_sh_chaser.8.a:0 "Поймут ли они?"
 wg_origin_sh_chaser.8.a.tt:0 "§LХотя большинство флагманов Глубинных всё ещё поддерживает [Root.Owner.Ruler.GetName], своего обещания мы фактически не исполнили — это угрожает нашему правительству, особенно при столь щекотливой личности [Root.Owner.Ruler.GetName]. §!"
 wg_origin_sh_chaser.9.name:0 "Обещание исполнено"
 wg_origin_sh_chaser.9.desc:0 "Сегодня мы предъявили [Owner.GetName] великолепный ответ.\n[Root.Owner.Ruler.GetName] подвела итог череде побед, особо отметив флагманов Глубинных и простых Глубинных с их выдающимся вкладом, и призвала всех стремиться к ещё большему. Она объявила этот день великой вехой истории [Owner.GetName], веря, что это доброе начало, предвещающее более светлое будущее."
 wg_origin_sh_chaser.9.a:0 "Вместе — к звёздам!"
 wg_origin_sh_chaser.9.a.tt:0 "§LМы исполнили каждую клятву и мечту, данную [Owner.GetName], — светлое будущее уже перед нами. §!"
 wg_origin_sh_chaser.14.name:0 "Кабинет на изводе"
 wg_origin_sh_chaser.14.desc:0 "Кабинет перегружен сверх меры.\n\nПусть энергия §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! кажется безграничной, но управление межзвёздной державой уже ввело членов кабинета в переработку. При этом ряд вопросов так и не решён — придётся часть груза переложить на других."
 wg_origin_sh_chaser.14.a:0 "Мы справимся с трудностями."
 wg_origin_sh_chaser.20.name:0 "Разрыв связи"
 wg_origin_sh_chaser.20.desc:0 "Ряд колоний и дальних исследовательских групп докладывает о слабой работе наших систем связи: обрывы и потери данных случаются постоянно. Инженеры предлагают построить на столице ретранслятор для усиления сигнала."
 wg_origin_sh_chaser.20.a:0 "Утвердить постройку."
 wg_origin_sh_chaser.21.name:0 "Усилитель сигнала"
 wg_origin_sh_chaser.21.desc:0 "Усилитель сигнала активирован. Первые тесты показывают: он вполне обеспечивает стабильную связь в нашем космосе.\n\nТеперь ясно, что прежние помехи были умышленной диверсией. Личность диверсантов всё ещё неизвестна, но новая система должна оградить нас от дальнейших помех."
 wg_origin_sh_chaser.21.a:0 "Мы вернули себе голос."
 wg_origin_sh_chaser.40.name:0 "Утрата подчинения"
 wg_origin_sh_chaser.40.desc:0 "Поступили донесения о том, что обычные Глубинные мешают работе промышленности. Как утверждается, у этих Глубинных будто бы нет начальства, но и управления других флагманов Глубинных они не признают."
 wg_origin_sh_chaser.40.a:0 "Начать расследование."
 wg_origin_sh_chaser.41.name:0 "Неизвестные узурпаторы"
 wg_origin_sh_chaser.41.desc:0 "Расследование показало: контроль над этими Глубинными перехватило несколько флагманов Глубинных, не имеющих к делу никакого отношения, — и, что странно, сами они об этом ни сном ни духом. Высказано мнение, что другие флагманы переписали права на этих Глубинных, дабы мешать нашей работе, но их личности и цели пока неясны."
 wg_origin_sh_chaser.41.a:0 "Нам следует сохранять бдительность."
 wg_origin_sh_chaser.50.name:0 "Ревизия кабинета"
 wg_origin_sh_chaser.50.desc:0 "Кабинет недавно попал под жёсткую проверку. Анонимные жалобы говорят, что поразительное число важных постов занято бездарными чиновниками, что серьёзно мешает делам. Мы пообещали расследовать."
 wg_origin_sh_chaser.50.a:0 "Пора выдвигать достойных."
 wg_origin_sh_chaser.51.name:0 "Чистка кабинета"
 wg_origin_sh_chaser.51.desc:0 "Особая комиссия провела тщательное расследование верхушки кабинета. Уволено множество не соответствующих должности чиновников; подавляющее большинство отстранено. Небольшую часть перспективных талантов отправили на переподготовку."
 wg_origin_sh_chaser.51.a:0 "Вот так гораздо лучше."
 wg_origin_sh_chaser_unity_negative_low:0 "Негативное общественное событие"
 wg_origin_sh_chaser_unity_positive_low:0 "Позитивное общественное событие"
 wg_origin_sh_chaser_SPIRITUALIST_PROJECT:0 "Ретранслятор связи"
 wg_origin_sh_chaser_SPIRITUALIST_PROJECT_DESC:0 "Построить в столичной системе ретрансляционную станцию, чтобы уберечь дальнюю связь от помех. Наши лучшие инженеры уже готовы приступить."
 wg_origin_sh_chaser_WORKER_PROJECT:0 "Расследовать утрату подчинения"
 wg_origin_sh_chaser_WORKER_PROJECT_DESC:0 "Глубинные вне контроля мешают работе нашей промышленности. Нужно провести расследование."
 wg_origin_sh_chaser_MATERIALIST_PROJECT:0 "Ревизия кабинета"
 wg_origin_sh_chaser_MATERIALIST_PROJECT_DESC:0 "Наведение порядка в кабинете должно стать приоритетом — он мешает почти всему, что мы делаем. Расчистка завалов потребует времени, но нам это по силам."
 wg_origin_sh_chaser_worker_strike:0 "Утрата подчинения"
 wg_origin_sh_chaser_worker_strike_desc:0 "Глубинные вне контроля мешают работе нашей промышленности. Нужно провести расследование.\n\nЗавершите особый проект, чтобы снять $wg_origin_sh_chaser_worker_strike$."
 wg_origin_sh_chaser_nepotism:0 "Застой кабинета"
 wg_origin_sh_chaser_nepotism_desc:0 "Нашу державу замучили профнепригодные чиновники, всерьёз мешающие нормальной работе. Посты должно отдавать достойным и делам, и таланту.\n\nЗавершите особый проект, чтобы снять $wg_origin_sh_chaser_nepotism$."
 wg_origin_sh_chaser.100.name:0 "Туманное будущее"
 wg_origin_sh_chaser.100.desc:0 "Резкий на язык доклад прямо обвиняет нашего [Root.Owner.Ruler.GetTitle][Root.Owner.Ruler.GetRegnalName]: она, мол, корабль-дева, замаскированная под флагмана Глубинных, с затаённым умыслом — верить нельзя. Цепочка доводов, особенно о принесённых ею технологиях и переменах в устройстве, похоже, подтверждает написанное. К докладу приложены несколько видеозаписей с кораблём-девой в строго засекреченных зонах, и время совпадает с перемещениями [Root.Owner.Ruler.GetRegnalName] почти в точности."
 wg_origin_sh_chaser.100.a:0 "Вздор!"
 wg_origin_sh_chaser.100.a.tt:0 "§LЭто безосновательные атаки противников: способности, явленные [owner.Ruler.GetRegnalName], может иметь лишь флагман Глубинных. Несомненно, этих клеветников-предателей ждёт суд! §!\nЛегитимность §T[owner.Ruler.GetRegnalName]§! будет отстояна, но что ждёт впереди —§Rнеизвестно§!"
 wg_origin_sh_chaser.100.b:0 "Что сделано, то сделано"
 wg_origin_sh_chaser.100.b.tt:0 "§RВы в своём уме?! §!"
 wg_origin_sh_chaser.101.name:0 "Истинный облик"
 wg_origin_sh_chaser.101.desc:0 "На нашу столицу совершено нападение — цель: §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!\nТри Глубинные с бомбами затесались среди чиновников и атаковали кабинетный офис. Взрыв обрушил несколько этажей, но несущая конструкция здания устояла. К всеобщему изумлению, когда мы нашли в завалах выжившую с идентификатором §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! — перед нами оказалась корабль-дева!"
 wg_origin_sh_chaser.101.a:0 "Что происходит?"
 wg_origin_sh_chaser.102.name:0 "Сенсация"
 wg_origin_sh_chaser.102.desc.a:0 "§Y[Ruler.GetTitle][Ruler.GetRegnalName]§! и правда корабль-дева! Весть мгновенно облетела весь [Owner.GetName] и всколыхнула бурю. Для [Owner.GetName], столько раз воевавшего с кораблями-девами, те, без сомнения, — опасный враг. §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! обязана всё объяснить: скрываемая ею правда решит её судьбу — и судьбу всего [Owner.GetName]."
 wg_origin_sh_chaser.102.desc.b:0 "§Y[Ruler.GetTitle][Ruler.GetRegnalName]§! и правда корабль-дева! Весть мгновенно облетела весь [Owner.GetName] и всколыхнула бурю. Впрочем, пусть корабли-девы и сражались с [Owner.GetName] бессчётное число раз, опрометчиво считать их заведомо опасным врагом. Так или иначе, §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! обязана дать нам объяснение: скрываемая ею правда решит её судьбу — и судьбу всего [Owner.GetName]."
 wg_origin_sh_chaser.102.desc.c:0 "§Y[Ruler.GetTitle][Ruler.GetRegnalName]§! и правда корабль-дева! Весть мгновенно облетела весь [Owner.GetName] и всколыхнула бурю. Впрочем, пусть корабли-девы и сражались с [Owner.GetName] бессчётное число раз, опрометчиво считать их заведомо опасным врагом — ведь старания и самоотдача §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! у всех на глазах. Но мы считаем, что все имеют право узнать правду."
 wg_origin_sh_chaser.102.a:0 "Мы стоим на перекрёстке судеб."
 wg_origin_sh_chaser.103.name:0 "Срывая покров"
 wg_origin_sh_chaser.103.desc:0 "§Y[Ruler.GetTitle][Ruler.GetRegnalName] предстала перед всем кабинетом — но на этот раз не для обсуждения политики, а на собственный суд. §!\n\nПрежде чем всё объяснить — прошу простить моё долгое умалчивание: облик корабля-девы был для единства Глубинных чистым вредом, потому с самой войны за объединение я действовала в образе флагмана Глубинных.\nЧтобы объяснить, как я, обладая такой личиной, обладаю властью флагмана Глубинных, я открою вам своё прошлое."
 wg_origin_sh_chaser.103.a:0 "Выслушаем её историю."
 wg_origin_sh_chaser.104.name:0 "Срывая покров"
 wg_origin_sh_chaser.104.desc:0 "В самом начале я была обычным лёгким авианосцем Глубинных: исправно патрулировала, воевала, тонула.\nВы знаете: изредка корабли-девы рождаются из обломков потопленных Глубинных. Я очнулась среди обломков — в сердце опасных морских глубин. По смутным воспоминаниям и наудачу я, как могла, обходила патрули Глубинных и выбралась на сушу.\nВ обличье корабля-девы я по инстинкту сходилась с другими кораблями-девами, держала с ними шаткое сотрудничество и, как бродячая корабль-дева, охотилась на Глубинных в обмен на припасы. Глубинные и в те времена резали друг друга, так что дурного я в этом ничего не видела."
 wg_origin_sh_chaser.104.a:0 "Корабли-девы — словно отражение Глубинных."
 wg_origin_sh_chaser.105.name:0 "Перевёрнутое естество"
 wg_origin_sh_chaser.105.desc:0 "Прошлые воспоминания вели меня пожирать ядра других Глубинных; в охоте день за днём моя сила росла и в конце концов достигла уровня лидерских. Некоторые корабли-девы замечали, что кожа у меня подозрительно бледная, а глаза багровы, — но лишь остерегали меня беречься влияния глубин, и о тайне моей не догадывались. Я заботливо прятала перемены тела — тогда-то и освоила искусство менять облик.\nНо так продолжаться вечно не могло: лёгкому авианосцу одиночная война не по плечу — и однажды я попала в кольцо и была потоплена флагманом Глубинных. Так должно было кончиться."
 wg_origin_sh_chaser.105.a:0 "Но ты не погибла."
 wg_origin_sh_chaser.106.name:0 "Роковой выбор"
 wg_origin_sh_chaser.106.desc:0 "Да. Живучесть флагмана Глубинных несравнима с кораблем-девой: даже на дне моря я оставалась жива.\nСкитаясь на грани жизни и смерти — быть может, эта абсурдная жизнь и надоумила меня — я в итоге решила положить конец этой бессмысленной войне, движимой голым инстинктом. Я собрала силу под именем флагмана Глубинных — и так возник нынешний [Owner.GetName].\nКак бы история обо мне ни судила, по моему разумению, я свершила идеал: избавила всех от судьбы бесконечного круговорота и вернула цивилизации свободу."
 wg_origin_sh_chaser.106.a:0 "Теперь мы понимаем."
 wg_origin_sh_chaser.107.name:0 "Перекрёсток"
 wg_origin_sh_chaser.107.desc:0 "Весь [Owner.GetName] спорит о личности §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!. Многие Глубинные яростно против того, чтобы [Ruler.GetRegnalName] держала власть, и требуют выгнать её из общества Глубинных или казнить; при столь мощной фракции положение особенно опасно — до гражданской войны рукой подать.\nПосле напряжённых переговоров кабинет обязан принять решение."
 wg_origin_sh_chaser.107.a:0 "Раз [Ruler.GetRegnalName] ни разу нас не подвела — и мы её не подведём!"
 wg_origin_sh_chaser.107.a.tt:0 "§YВласть [Ruler.GetTitle][Ruler.GetRegnalName]§! будет признана. Только в единстве и взаимном доверии мы двинемся дальше. §!"
 wg_origin_sh_chaser.107.b:0 "Хватит! [Owner.GetName] не бывать под властью корабля-девы!"
 wg_origin_sh_chaser.107.b.allow:0 "§YЛегенда [Ruler.GetTitle][Ruler.GetRegnalName]§! у всех на устах, её вклад в [Owner.GetName] неподделен; она не предавала — и мы не предадим."
 wg_origin_sh_chaser.107.b.tt:0 "§Y[Ruler.GetTitle][Ruler.GetRegnalName]§! будет казнена.\n§RГосударство расколется и погрузится в гражданскую войну. §!"
 wg_origin_sh_chaser.108.name:0 "Объявление миру"
 wg_origin_sh_chaser.108.desc:0 "Весть разлетелась, как степной пожар. Завоевав доверие всего кабинета, §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! открыто явила свою личность. Большинство [Owner.GetSpeciesNamePlural] ликует, видя искренность и верность §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!, её силу и мудрость.\n\nПод этим ликованием таятся неизрекаемые проблемы и всякого рода неопределённость. Какой же станет новая держава?"
 wg_origin_sh_chaser.108.a:0 "Армия — наш краеугольный камень."
 wg_origin_sh_chaser.108.b:0 "Вера нас поддержит."
 wg_origin_sh_chaser.108.c:0 "Порядок превыше всего."
 wg_origin_sh_chaser.108.d:0 "Открытость и терпимость — это будущее."
 wg_origin_sh_chaser.108.f:0 "Величие куется прогрессом."
 wg_origin_sh_chaser.108.g:0 "Возведём несокрушимую стену против инозвёздной угрозы."
 wg_origin_sh_chaser.108.h:0 "Правительство должно быть стабильным."
 wg_origin_sh_chaser.109.name:0 "Объявление миру"
 wg_origin_sh_chaser.109.desc:0 "[Owner.GetSpeciesNamePlural], соотечественницы! В лихие годы вы оказали мне великое доверие — и я его не посрамила. Теперь мы стоим среди звёзд, вы по-прежнему верите мне, а я, как и прежде, отдам всё, сражаясь за будущее [Owner.GetName]. Сегодня я клянусь здесь — и молю каждого выложиться до конца, вместе со мной построить будущее, которым мы все сможем гордиться. На звёзды — к победе!"
 wg_origin_sh_chaser.109.a:0 "В путь — к звёздам!"
 wg_origin_sh_chaser.200.name:0 "Надвигаются тучи"
 wg_origin_sh_chaser.200.desc:0 "Всё цветёт и ладится, но с §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! что-то не так.\nЕё работоспособность упала, а суждения о делах уже не столь решительны, как прежде. Определённо стряслось что-то недоброе."
 wg_origin_sh_chaser.200.a:0 "Срочно расследовать"
 wg_origin_sh_chaser.201.name:0 "Надвигаются тучи"
 wg_origin_sh_chaser.201.desc:0 "С телом §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! случилась пока неясная нам беда: жизни она не угрожает, но движения серьёзно сковывает.\nПо её настоянию мы не предаём проблему огласке; кабинет перестроил работу, чтобы помочь утратившей прежнюю силу §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! справляться с нагрузкой."
 wg_origin_sh_chaser.201.a:0 "Надо что-то придумать"
 wg_origin_sh_chaser.202.name:0 "Восстание инакомыслия"
 wg_origin_sh_chaser.202.desc:0 "Поднимается огромная оппозиционная фракция: она требует более жёсткой внешней политики и трубит о безоглядном завоевании. Неведомо откуда они проведали, что §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! слабеет, разнесли это повсюду и под этим предлогом требуют отставки §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! и передачи верховной власти более сильному и надёжному лидеру. Худо то, что изрядная часть фракции — флагманы Глубинных времён войны за объединение: сила её огромна и вес в нашем обществе непомерен. Нужно разбираться деликатно."
 wg_origin_sh_chaser.202.a:0 "Разрешим умеренными уступками и переманиванием"
 wg_origin_sh_chaser.202.b:0 "Они не вправе указывать §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!, как ей быть"
 wg_origin_sh_chaser.203.name:0 "Не заладилось с порога"
 wg_origin_sh_chaser.203.desc:0 "Мы направили к оппозиции несколько делегаций с умеренными реформенными предложениями, дабы утихомирить консервативную и здравомыслящую часть и переманить её, изолируя отъявленных. Поначалу метод принёс немалый успех, но после полосы волнений оппозиция собралась вновь, разнесла в пух и прах наши предложения и объявила их сугубо показушной уступкой, не стоящей доверия."
 wg_origin_sh_chaser.203.a:0 "Чёрт бы их взял"
 wg_origin_sh_chaser.204.name:0 "Противостояние"
 wg_origin_sh_chaser.204.desc:0 "Оппозиция крайне недовольна нашим отношением: она подняла множество Глубинных, отказывается признавать нашу юрисдикцию и перебрасывает силы в поддерживающие её секторы. Часть её склоняется к относительно автономному «государству в государстве», другая, того и гляди, готовит переворот, дабы заменить наше правительство собой."
 wg_origin_sh_chaser.204.a:0 "Неужели гражданская война?"
 wg_origin_sh_chaser.205.name:0 "Дымка загадок"
 wg_origin_sh_chaser.205.desc:0 "Хоть в делах они непримиримы и не раз столкнулись с правительством, странное дело — оппозиция предложила устроить очную беседу своего лидера с §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! и согласна на условие «прийти по одной». И для силового, и для переговорного решения это, похоже, отличный шанс."
 wg_origin_sh_chaser.205.a:0 "Пусть приходит"
 wg_origin_sh_chaser.206.name:0 "Неожиданный поворот"
 wg_origin_sh_chaser.206.desc:0 "§HУвидев лидера оппозиции, §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! изрядно изумилась. §!\n\nТак это ты……\n\n§HПосле недолгого молчания §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! потребовала говорить с глазу на глаз.\nЧто произошло в зале, нам неведомо, но исход ошеломил — §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! объявила кризис исчерпанным: оппозиция постепенно распустится и вернётся под наше начало, а её лидер, флагман Глубинных §BЛексингтон§!, поступит в прямое её подчинение. §!"
 wg_origin_sh_chaser.206.a:0 "Хэппи-энд?"
 NAME_WG_SH_LEXINGTON:0 "Глубинный Лексингтон"
 WG_SH_LEXINGTON_catch_phrase:0 "§LГлубинные не дрогнут — и я не дрогну. §!"
 WG_SH_LEXINGTON:0 "Глубинный Лексингтон"
 WG_SH_LEXINGTON_desc:0 "Неисповедимый флагман Глубинных — должно быть, из самой первой волны. Последователей у неё тьма.\nХоть она и немногословна, но не так холодна, как кажется."
 wg_origin_sh_chaser.207.name:0 "Глубинный Лексингтон"
 wg_origin_sh_chaser.207.desc:0 "§RОна§! так и не научилась беречь себя……\n\nЯ сделаю всё, что смогу. Только не разочаруй меня."
 wg_origin_sh_chaser.207.a:0 "Почему ты согласилась нам служить?"
 wg_origin_sh_chaser.207.a.response:0 "Путь аннигиляции существует; идеи сокрушить трудно, но не невозможно направить.\nПусть следуют моей силе, поклоняются моему прошлому — и сами собой подчинятся моей воле.\n\nГражданская война неприемлема — потому решено так."
 wg_origin_sh_chaser.207.b:0 "Кто ты такая?"
 wg_origin_sh_chaser.207.b.response:0 "Идущая Вперёд, Губительница, Хранительница."
 wg_origin_sh_chaser.207.c:0 "Что с §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!?"
 wg_origin_sh_chaser.207.c.response:0 "Старая рана…… давняя встреча.\n\nПлан готовится, но нужно время; до тех пор ей нужен покой."
 wg_origin_sh_chaser.207.hire_custom_tooltip:0 "Глубинный Лексингтон готова нам служить"
 leader_trait_commander_sh_lexington:0 "§BЛедяной ветер морозного моря§!"
 leader_trait_commander_sh_lexington_desc:0 "§YЛегендарный образец§!\n\n\n\n£wg_trait_pic_sh_lexington£\n\n\n\nОдин из древнейших и сильнейших флагманов Глубинных. Может, палубная авиация и не ответ звёздного моря — но в её руках ответом станет что угодно."
 wg_origin_sh_chaser.208.name:0 "Тучи рассеиваются"
 wg_origin_sh_chaser.208.desc:0 "По договорённостям Глубинного Лексингтона члены оппозиции шаг за шагом возвращаются под наше управление; они верят, что «Предвестница войны» этой беседой стяжала высочайшее положение и подготовила флот Глубинных к войне. Пока что эти радикалы с необычайным жаром вливаются в военно-промышленные отрасли; пусть это и тревожно, но против всеобщей гражданской войны — итог вполне приемлемый. Одно бы хотелось: чтобы они однажды не обнаружили, что подготовка к войне не имеет конца."
 wg_origin_sh_chaser.208.a:0 "Вполне недурно."
 wg_origin_sh_chaser.209.name:0 "Восстановление порядка"
 wg_origin_sh_chaser.209.desc:0 "§HСпустя дни §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! созвала обращённое ко всему [Owner.GetName] собрание и официально объявила: оппозиционное движение подошло к доброму концу. §!\n\n…… Среди смуты легко забыть, за что мы бьёмся, и увидеть в политических противниках заклятых врагов. Мы пережили тяжкие времена, но сегодня я с гордостью говорю вам: мы добились мира. Ваш голос услышан; [Owner.GetName] непреклонно двинется вперёд и одолеет любую преграду на пути. Единство, взаимное доверие — нам нужно трудиться сообща, чтобы……\n\n§H§Y[Root.Owner.Ruler.GetTitle][Root.Owner.Ruler.GetRegnalName]§! вдруг пошатнулась и исчезла из кадра. §!"
 wg_origin_sh_chaser.209.a:0 "Что случилось?"
 wg_origin_sh_chaser.210.name:0 "Дрожащий огонь"
 wg_origin_sh_chaser.210.desc:0 "Мы знали, что этот час настанет, — но никто не думал, что так скоро.\nСтарая рана §Y[Root.Owner.Ruler.GetTitle][Root.Owner.Ruler.GetRegnalName]§! вскрылась с ужасающей скоростью: повреждение ядра флагмана Глубинных, полученное тогда, так и не залечилось и всё глубже разрушалось от постоянного использования силы.\nТеперь энергия в ядре вышла из-под контроля; стазис-поле лишь оттягивает миг распада — а это значит, §Y[Root.Owner.Ruler.GetTitle][Root.Owner.Ruler.GetRegnalName]§! больше не может нами руководить.\nФормально она всё ещё у власти, но без скорого решения последствия будут немыслимыми."
 wg_origin_sh_chaser.210.a:0 "Выход обязательно найдётся."
 wg_origin_sh_chaser.211.name:0 "Пламя вспыхивает вновь"
 wg_origin_sh_chaser.211.desc:0 "Научная команда выработала вполне посильный план.\nТеоретически, израсходовав множество энергетических ядер Глубинных, можно стабилизировать §Y[Root.Owner.Ruler.GetTitle][Root.Owner.Ruler.GetRegnalName]§!, сохранить целостность её ядра и постепенно починить повреждения.\nЭто потребует горы ресурсов и операций предельной сложности — но мы уверены в себе."
 wg_origin_sh_chaser.211.a:0 "Начинаем."
 wg_origin_sh_chaser.212.name:0 "Дополнительные вложения"
 wg_origin_sh_chaser.212.desc:0 "Базовый каркас готов; по текущим данным, §Y[Root.Owner.Ruler.GetTitle][Root.Owner.Ruler.GetRegnalName]§! вышла из опасного периода. Ей нужно время на восстановление, но в итоге всё будет хорошо.\nЗаодно наша инженерная команда предлагает модернизировать корабельное оснащение §Y[Root.Owner.Ruler.GetTitle][Root.Owner.Ruler.GetRegnalName]§!: при стабильной подаче энергетических ядер Глубинных проект выйдет далеко за обычные рамки. Учтите: выбрав, отменить будет нельзя.\n\nТекущее содержание: [Root.origin_sh_chaser_transform_cost] £sr_se£ энергетических ядер Глубинных"
 wg_origin_sh_chaser.212.a:0 "Пусть будет так."
 wg_origin_sh_chaser_transform_cost:0 "Содержание ядра"
 wg_origin_sh_chaser_transform_cost_desc:0 "Телу §RГонительницы§! для поддержания нужно множество энергетических ядер Глубинных; в конце концов она поправится, но сейчас ей нужны они.\nБазовый расход: 50 £sr_se£ энергетических ядер Глубинных"
 wg_origin_sh_chaser_transform_1:0 "Навигационное наставление"
 wg_origin_sh_chaser_transform_1_desc:0 "В оснащение вмонтированы исполинские сети звёздных карт и система анализа: все наши флоты в нужный миг получают навигационное наставление §RГонительницы§!.\nДоп. расход: 20 £sr_se£ энергетических ядер Глубинных"
 wg_origin_sh_chaser_transform_2:0 "Всеведущий взор"
 wg_origin_sh_chaser_transform_2_desc:0 "Важнейшие сенсоры всего флота Глубинных подключены к взору §RГонительницы§!: она без труда держит в руках разведданные всей державы.\nДоп. расход: 20 £sr_se£ энергетических ядер Глубинных"
 wg_origin_sh_chaser_transform_3:0 "Трансцендентное владычество"
 wg_origin_sh_chaser_transform_3_desc:0 "Усилено командное могущество Глубинных §RГонительницы§! — промышленная эффективность всей державы оптимизирована.\nДоп. расход: 100 £sr_se£ энергетических ядер Глубинных"
 wg_origin_sh_chaser_transform_4:0 "Ускорение мысли"
 wg_origin_sh_chaser_transform_4_desc:0 "Новый компьютер корабельного оснащения многократно ускорил мышление §RГонительницы§! и поднял её исполнение государственной политики.\nДоп. расход: 30 £sr_se£ энергетических ядер Глубинных"
 wg_origin_sh_chaser_transform_5:0 "Разделённый опыт"
 wg_origin_sh_chaser_transform_5_desc:0 "Единая сеть мышления позволяет §RГонительнице§! упорядочивать свой опыт и мудрость и помогать другим лидерам работать лучше.\nДоп. расход: 30 £sr_se£ энергетических ядер Глубинных"
 wg_origin_sh_chaser_transform_6:0 "Тактическая синхронность"
 wg_origin_sh_chaser_transform_6_desc:0 "Через сеть флотского командования §RГонительница§! содействует передовым боям, усиливая боевую мощь флотов.\nДоп. расход: 80 £sr_se£ энергетических ядер Глубинных"
 wg_origin_sh_chaser_transform_7:0 "Отточенные алгоритмы"
 wg_origin_sh_chaser_transform_7_desc:0 "Встроенная в оснащение §RГонительницы§! вычислительная система тонко чует резервы оптимизации промышленности и повышает отдачу ресурсов.\nДоп. расход: 50 £sr_se£ энергетических ядер Глубинных"
 wg_origin_sh_chaser_transform_8:0 "Прилив вдохновения"
 wg_origin_sh_chaser_transform_8_desc:0 "Многоликие помощники мысли дарят §RГонительнице§! безбрежное вдохновение в науке — прорывы с ракурсов, которые обычные люди проглядывают.\nДоп. расход: 80 £sr_se£ энергетических ядер Глубинных"
 wg_origin_sh_chaser.213.name:0 "Новое начало"
 wg_origin_sh_chaser.213.desc:0 "§Y[Root.Owner.Ruler.GetTitle][Root.Owner.Ruler.GetRegnalName]§! вновь вернулась с края смерти — и стала сильнее, чем когда-либо. Многие считают, что и с [Owner.GetName] то же: стоит долгой ночи кончиться, как возрождённый из пламени [Owner.GetName] становится могущественнее.\nМы одолеем любые трудности, мы сами сотворим своё будущее — слава [Owner.GetName]!"
 wg_origin_sh_chaser.213.a:0 "Рассвет настал!"
 wg_origin_sh_chaser.5310.name:0 "Взгляд корабела"
 wg_origin_sh_chaser.5310.desc:0 "Наш флот — твердыня обороны государства. §Y[Root.Owner.Ruler.GetTitle]§! считает, что пора выводить корабли класса линкоров. Тяжеловооружённые звёздные корабли приведут нас в золотой век и сокрушат любого, кто встанет на пути!"
 wg_origin_sh_chaser.5315.name:0 "Научный прорыв"
 wg_origin_sh_chaser.5315.desc:0 "Наука — ключ к лучшему и светлому будущему. Наши учёные делают больше прорывов, чем когда-либо. §Y[Root.Owner.Ruler.GetTitle]§! замечает эти успехи и вручает отличившимся учёным ордена заслуг."
 wg_origin_sh_chaser.5320.name:0 "Словом и делом"
 wg_origin_sh_chaser.5320.desc:0 "§Y[Root.Owner.Ruler.GetTitle]§! — образец для всех, ведущий нас сквозь звёзды. В эпоху столь сильного лидера наши чиновники гордятся службой государству и стремятся к совершенству."
 wg_origin_sh_chaser.5330.name:0 "Живой металл"
 wg_origin_sh_chaser.5330.desc:0 "Как ни много открытий дала нам техника и наука, учиться ещё предстоит многому. Наши геологи нашли необычное вещество, обладающее свойствами и жидкости, и металла; похоже, оно к тому же живое. Мы пока не знаем, как его понять и применить, но внимание оно привлекло широкое."
 wg_origin_sh_chaser.5335.name:0 "Источник мощи"
 wg_origin_sh_chaser.5335.desc:0 "Пусть наша наука ушла далеко вперёд — вселенная хранит ещё бездну тайн. Наши исследователи полагают, что тёмную материю можно использовать для выработки энергии; уже предложен проект тёмно-материального реактора, что, возможно, поможет нашей военной технике."
 wg_origin_sh_chaser.5340.name:0 "Образцовое правление"
 wg_origin_sh_chaser.5340.desc:0 "Годовщина первого космического корабля сплотила людей вокруг общей цели. Воодушевлённая речью §Y[Root.Owner.Ruler.GetTitle]§!, вся [Root.Owner.GetSpeciesName] трудится сообща, делая новую столичную систему процветающим маяком в ледяном космосе."
 wg_origin_sh_chaser.5340.tt:0 "Уровень вознесения столичной планеты §G+1§!"
 wg_origin_sh_chaser.5345.name:0 "Гений изобретательства"
 wg_origin_sh_chaser.5345.desc:0 "Расходится весть о новой машине, выплавляющей массу сплавов из вторсырья. Устройство невиданно эффективно, но его изобретательница вскоре после показа нашей §Y[Root.Owner.Ruler.GetTitle]§! умерла. Другие инженеры сочли копию невозможной, и ради блага народа мы поместили машину под охрану в закрытый комплекс."
 wg_origin_sh_chaser.5370.name:0 "Взгляд на орбитальные кольца"
 wg_origin_sh_chaser.5370.desc:0 "Обширные исследования дальнего космоса, колонизации и перевозок принесли множество результатов. Наши умнейшие учёные в тесном содружестве с лучшими инженерами выработали новую концепцию — орбитальное кольцо: исполинская кольцевая космическая структура на всю планету, способная нести промышленные и гражданские объекты. Пусть сейчас нам может не хватать промышленности на такую стройку — путь ясен; до поры направим экспансию в другие стороны."
 wg_origin_sh_chaser.good:0 "Очень хорошо."
