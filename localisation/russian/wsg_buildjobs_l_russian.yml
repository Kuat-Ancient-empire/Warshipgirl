 building_sh_fortress:0 "Крепость Глубинных"
 building_sh_fortress_desc:0 "Неприступная военизированная крепость: вмещает множество солдат и размещает диспетчеров Глубинных."
 job_sh_soldier:0 "Диспетчер Глубинных"
 job_sh_soldier_effect_desc:0 "£job_sh_soldier£ $job_sh_soldier_plural$ потребляют £energy£ §Y$energy$§! и £consumer_goods£ §Y$consumer_goods$§!, добавляют £mod_country_admin_cap_add£ §Y$MOD_COUNTRY_ADMIN_CAP_ADD$§! и £mod_country_naval_cap_add£ §Y$MOD_COUNTRY_NAVAL_CAP_ADD$§!, создают £defense_army£ §Yоборонительные армии§!"
 mod_job_sh_soldier_add:0 "Профессия: диспетчер Глубинных"
