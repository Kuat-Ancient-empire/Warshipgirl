 building_sh_corrupt_government:0 "Орган проникновения в бюрократию"
 building_sh_corrupt_government_desc:0 "Мы посадим семена коррупции в бюрократическую систему этой планеты."
 job_criminal_bureaucrats:0 "Криминальный бюрократ"
 job_criminal_bureaucrats_plural:0 "Криминальный бюрократ"
 job_criminal_bureaucrats_cap:0 "$job_criminal_bureaucrats$"
 job_criminal_bureaucrats_desc:0 "Эти бюрократы подкуплены нашим проникновением и пропитаны коррупцией насквозь."
 job_criminal_bureaucrats_effect_desc:0 "£job_criminal_bureaucrats£ $job_criminal_bureaucrats_plural$ производят §Yторговую стоимость филиала§! и повышают лимит §Y$BRANCH_OFFICE_BUILDINGS$§!, а также §Rснижают§!§Y административную ёмкость империи§!"
