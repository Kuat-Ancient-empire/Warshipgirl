 job_sh_enforcer_cap:0 "$job_sh_enforcer$"
 job_sh_enforcer_desc:0 "Операторы Департамента эффективно устраняют дестабилизирующие факторы. Не спрашивай, как именно."
 building_sh_computer:0 "Чудо Глубинных: Нейрокомпьютер Глубинных"
 building_sh_computer_desc:0 "Планетарного масштаба супернейрокомпьютер: построив его, мы сможем вычислять что угодно."
 building_sh_computer2:0 "Чудо Глубинных: Управленческий компьютер Глубинных"
 building_sh_computer2_desc:0 "Вручим все планетарные дела, большие и малые, этому суперкомпьютеру: он распределит оптимальные рабочие процессы между всеми юнитами Глубинных, подняв их выработку на 20.13123123813798127398123%. Опыт управления вспомогательными юнитами будет распространён на колонии Глубинных.\n\n§YВсе £job£ вспомогательные должности Глубинных империи дополнительно производят 2 £unity£§!\n§YКаждая £job£ вспомогательная должность Глубинных даёт§! $mod_pop_cat_civilian_bonus_workforce_mult$:§G+100§!"
 building_sh_data_centre:0 "Крепость данных"
 building_sh_data_centre_desc:0 "Эта планета когда-то была крепостью данных с огромным количеством секретов. Большинство хранилищ разрушено, но кое-что ценное ещё можно извлечь."
 EMPIRE_ALPHA_BUILDING:0 "Одно на империю."
 alpha_building_built:0 "Это здание уже построено"
 alpha_building_queuing:0 "Это здание уже в очереди строительства"
 building_wsg_avrora_academy:0 "Университетский городок «Аврора»"
 building_wsg_avrora_academy_desc:0 "Университетский городок по замыслу научного офицера Авроры: сюда стекаются таланты со всех сторон ради инженерного образования и науки на благо жизни корабельных дев. У входа стоит поставленный ректором памятник лучшему студенту."
 building_wsg_ella_government:0 "Резиденция губернатора Эллы"
 building_wsg_ella_government_desc:0 "Роскошная резиденция губернатора Эллы, вобравшая управленческий опыт постстелларисной эпохи. Повсюду голограммы Эллы; из космоса этот дворец тоже неплохо видно.\n§HШведские ослы сделали иконку этой бюрократической постройки, удалив у оригинала одно здание и перевернув её. Мы же пошли обратным путём: расширили постройку и добавили перед ней пару сломанных стульев§!"
 building_wsg_victoria_barracks:0 "Казармы «Викториес»"
 building_wsg_victoria_barracks_desc:0 "Идеал инструктора «Викториес». Вместе с планетарной обороной эти казармы тренируют сухопутные войска симулированными боями, а поскольку эти бои сами по себе великолепны, на планете расцветает воинская традиция."
 building_wsg_elves_dormitory:0 "Общежитие строительных фей"
 building_wsg_elves_dormitory_desc:0 "Здание, спроектированное и построенное строго по требованиям заказчика; после сдачи его спонтанно решили сделать общежитием для портовых фей и чертёжных псов. Мы до сих пор помним полные благодарности глаза после этого решения."
 job_wsg_blueprinting_dog_effect_desc:0 "£job_wsg_blueprinting_dog $job_wsg_blueprinting_dog$ производит £engineering §Yинженерные исследования§!, а также ускоряет §Yстроительство планеты§! и §Yпринятие планетарных решений§!"
