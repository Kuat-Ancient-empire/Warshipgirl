 building_wsg_military:0 "Портовая диспетчерская"
 building_wsg_military_desc:0 "Портовая диспетчерская — особый орган, ведающий и диспетчеризацией военных кораблей, и гражданским управлением. Ей строго запрещено заниматься любой коммерцией."
