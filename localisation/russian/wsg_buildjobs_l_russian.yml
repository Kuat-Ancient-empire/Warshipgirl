 job_wg_squire_cap:0 "$job_wg_squire$"
 job_wg_squire_desc:0 "Рыцари-корабельные девы заняты более благородными делами — тренировками и дипломатией, — а всё остальное делают оруженосцы. Ради рыцарского будущего или просто лучшей жизни они стараются, чтобы рыцарям жилось комфортно."
 job_wg_squire_effect_desc:0 "£job_wg_squire£ $job_wg_squire_plural$ потребляют $food$, дают $r_amenities$, а также повышают §Yвыработку§! должностей £job_wg_knight_lord£ §Y$job_wg_knight_lord$§! и £job_wg_knight£ §Y$job_wg_knight$§!"
 mod_job_wg_squire_per_pop:0 "На каждые $VALUE$ населения даётся §G+1§! профессия $job_wg_squire$"
