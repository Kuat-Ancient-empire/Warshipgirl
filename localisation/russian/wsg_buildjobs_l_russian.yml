 building_sunflower_temple:0 "Храм Подсолнухов"
 building_sunflower_temple_desc:0 "Прежде мы ежедневно приносили в жертву нескольких избранных подсолнухов, чтобы сохранять связь с божеством. Теперь, с этим огромным и величественным храмом, наши жрецы могут проводить грандиозные подсолнуховые ритуалы — угождать божеству ради благословения стало эффективнее и официальнее."
 job_wsg_sunflower_priest:0 "Епископ Подсолнухов"
 job_wsg_sunflower_priest_effect_desc:0 "£job_wsg_sunflower_priest£ $job_wsg_sunflower_priest_plural$ потребляют £consumer_goods£ §Y$consumer_goods$§! и производят £unity£ §Y$unity$§! и £society£ §Yсоциологические исследования§!"
 mod_job_wsg_sunflower_priest_add:0 "Профессия: епископ Подсолнухов"
 job_wsg_sunflower_priest_plural:0 "Профессия: епископ Подсолнухов"
 job_wsg_sunflower_priest_cap:0 "$job_wsg_sunflower_priest$"
 job_wsg_sunflower_priest_desc:0 "Только верующие, десятилетиями проводившие ритуалы жертвоприношения подсолнухов, достойны стать епископами и вести обряды."
 building_wsg_sunflower_foundry:0 "Подсолнуховая дуговая печь"
 building_wsg_sunflower_foundry_desc:0 "Благодаря чёрной магии с планеты Швеция стало возможным превращать еду в сталь. А подсолнухи — раса, изначально способная сама производить себе еду, — стали главным сырьём для дуговой печи. §RЭти рабочие места доступны только населению подсолнухов§!"
 job_sunflower_foundry_effect_desc:0 "£job_sunflower_foundry£ $job_sunflower_foundry_plural$ производят £alloys£ §Y$alloys$§!, непрерывно и экологично отправляя других подсолнухов в дуговую печь"
 job_sunflower_foundry:0 "Подсолнуховый плавильщик"
 mod_job_sunflower_foundry_add:0 "Подсолнуховый плавильщик"
 job_sunflower_foundry_plural:0 "Подсолнуховый плавильщик"
 job_sunflower_foundry_cap:0 "$job_sunflower_foundry$"
 job_sunflower_foundry_desc:0 "Благодаря самодостаточности подсолнухов дуговая печь производит сплавы, не расходуя других ресурсов."
 mod_job_sunflower_foundry_per_pop:0 "На каждые $VALUE$ населения §G+1§! профессия $job_sunflower_foundry$"
 mod_job_sunflower_foundry_per_pop_short:0 "На каждые $VALUE$ населения §G+1§! профессия $job_sunflower_foundry$"
 building_warshipgirl_assembly_plant:0 "Портовый сборщик I уровня"
 building_warshipgirl_assembly_plant_desc:0 "После модификаций доктора Юбари портовый сборщик снова в строю."
 building_warshipgirl_assembly_plantU:0 "Портовый сборщик II уровня"
 building_warshipgirl_assembly_plantU_desc:0 "Улучшенный портовый сборщик с более высокой эффективностью."
 building_warshipgirl_assembly_plantF:0 "Портовый сборщик III уровня"
 building_warshipgirl_assembly_plantF_desc:0 "С материалами NEO сборщик производит население с невообразимой эффективностью."
 building_wsg_yamato_monument:0 "Монумент Ямато"
 building_wsg_yamato_monument_desc:0 "Хотя Ямато служит Глубинным, её славные дела и доблесть всё ещё широко известны в обществе корабельных дев."
 building_wsg_yamato_monument2:0 "Монумент Ямато и Мусаси"
 building_wsg_yamato_monument2_desc:0 "Хотя Ямато служит Глубинным, её славные дела и доблесть всё ещё широко известны в обществе корабельных дев. Что до Мусаси — она в три раза быстрее, потому что красная и с рогом."
 building_wsg_autochthon_monument:0 "Монумент Древнего Бога"
 building_wsg_autochthon_monument_desc:0 "Великий правитель древней истории нашего народа: его история уже стала мифом, но по-прежнему вдохновляет нас и ведёт вперёд."
 building_pantsu_shop:0 "Филиал Лавки Трофеев"
 building_pantsu_shop_desc:0 "Филиал Лавки Трофеев под франшизой народа Сломанных Стульев. Продаёт такие редкости, как лапша «без вкуса» и мороженое «ПАТ-ПАТ», а заодно растит высококвалифицированные кадры для подъёма местной экономики."
 building_wsg_luxury_residence:0 "Общежитие Порта"
 building_wsg_luxury_residence_desc:0 "Личные общежития корабельных дев со всеми новейшими развлечениями: голографический кинотеатр, бассейн олимпийского стандарта, ванна Брока — но самое главное, конечно, зона маджонга «Маджонг Соул»."
 building_wsg_luxury_residence2:0 "Зал ожидания Порта"
 building_wsg_luxury_residence2_desc:0 "Продвинутое общежитие с технологией ожидания Глубинных: капсулы сна помогают корабельным девам лучше высыпаться и следить за здоровьем. Единственная беда — капсул мало, очередь длинная, но к счастью зона маджонга «Маджонг Соул» скрашивает ожидание."
 building_wsg_military_academy:0 "Академия Порта"
 building_wsg_military_academy_desc:0 "Методы обучения в академии можно назвать дьявольскими: солдат заставляют получать сотни ударов или уклоняться от сотен атак. Жестоко, но результат налицо."
 building_wsg_fortress:0 "Лазурная крепость"
 building_wsg_fortress_desc:0 "Продвинутая суперпланетарная крепость: её батареи ПВО калибра 381 см собьют любого, кто попытается войти в атмосферу, а гарнизон из множества солдат обеспечит безопасность планеты."
 building_wsg_precinct_house:0 "Военная полиция корабельных дев"
 building_wsg_precinct_house_desc:0 "Военизированное сооружение под ключ — штаб военной полиции корабельных дев. Местные профессионалы умеют максимально сократить расходы и поднять выработку; способы лучше не знать."
 job_wsg_enforcer:0 "Военная полиция корабельных дев"
 job_wsg_enforcer_effect_desc:0 "£job_wsg_enforcer£ $job_wsg_enforcer_plural$ потребляют £energy£ §Y$energy$§! и £consumer_goods£ §Y$consumer_goods$§!, повышают §Y$mod_planet_jobs_produces_mult$§! и снижают £mod_planet_crime_add£$MOD_PLANET_CRIME_ADD$"
 mod_job_wsg_enforcer_add:0 "Профессия: военная полиция корабельных дев"
 job_wsg_enforcer_plural:0 "Профессия: военная полиция корабельных дев"
 job_wsg_enforcer_cap:0 "$job_wsg_enforcer$"
 job_wsg_enforcer_desc:0 "Бойцы военной полиции эффективно устраняют дестабилизирующие факторы. Не спрашивай, как именно."
 building_wsg_branch_mahjong:0 "Маджонг-клуб Тайвань-Сервера"
 building_wsg_branch_mahjong_desc:0 "Чемпионы Тайвань-Сервера тренируют миллионы поклонников маджонга: каждый день воздух пропитан духом «руон», «таняо», «ипан» и «1000 очков»."
 building_wsg_branch_mister:0 "Гранд-отель «Мистер»"
 building_wsg_branch_cnm:0 "Казармы гайд-отряда CNM"
 building_wsg_branch_cnm_desc:0 "Эта крепость работает напрямую с местной армией: она обеспечивает орбитальную оборону планеты и гарнизон, а заодно прохождением карт и написанием гайдов повышает силу оборонительных армий. Обученные операторы ПВО кричат «CNM!», повышая точность."
 building_wsg_branch_clover:0 "Театр Клевера"
 building_wsg_branch_ovo:0 "Библиотека вики Warship Girls"
 building_wsg_branch_ovo_desc:0 "Эта огромная библиотека показывает встречным инопланетным гражданам голограммы со всевозможными знаниями (даже если им это неинтересно), эффективно повышая научный потенциал планеты."
 building_wsg_branch_african:0 "Африканский НИИ"
 building_wsg_branch_african_desc:0 "Инопланетные исследователи-корабельные девы дистанционно обучают несмышлёных инопланетян, как повысить эффективность труда. Эксперты этого дела регулярно впадают в депрессию, наблюдая чужую безалаберность."
 requires_recipient_not_warshipgirls:0 "$TRIGGER_FAIL$ Попытка корабельных дев открыть самих себя — крайне странное поведение."
 building_wsg_bison:0 "Чудо Порта: Хомячковый вечный двигатель"
 building_wsg_bison_desc:0 "Как ни высокотехнологично оно выглядит, внутри просто бешено бежит хомяк Бизон, вращая генераторный ролик и выдавая бесконечную электроэнергию."
 building_wsg_norston_tower:0 "Чудо Порта: Великая башня Норстона"
 building_wsg_norston_tower_desc:0 "Первая супербашня, построенная на планетах нашего Порта: её величественный силуэт виден даже из открытого космоса."
 building_wsg_cloud_city:0 "Чудо Порта: Висячие сады"
 building_wsg_cloud_city_desc:0 "Благодаря новейшим антигравитационным технологиям эта гигантская структура парит на границе атмосферы — грандиозный отель для иностранных высоких гостей и лучшая достопримечательность для развлечений."
 building_betharian_consumer:0 "Мебельная фабрика бетарианского камня"
 building_betharian_consumer_desc:0 "Бетарианский камень можно обработать в изысканную мебель — например, рабочий стол губернатора или кровать губернатора. Отходы же идут в сельское хозяйство и даже в пищу: бетарианская рисовая лапша — знаменитый деликатес."
 tech_consumer_betharian:0 "Мебельная фабрика бетарианского камня"
 tech_consumer_betharian_desc:0 "Бетарианский камень можно обработать в изысканную мебель — например, рабочий стол губернатора или кровать губернатора. Отходы же идут в сельское хозяйство и даже в пищу: бетарианская рисовая лапша — знаменитый деликатес."
 building_wsg_sunflower_radioactive:0 "Чудо Порта: Подсолнуховый приёмник лучей"
 building_wsg_sunflower_radioactive_desc:0 "Тонко измолотые подсолнухи в виде особого покрытия на приёмных панелях заметно снижают потери при передаче электричества на дальние расстояния, повышая эффективность роя Дайсона.\n§HПроизводство £energy£ §Y$energy$§! роя Дайсона: §G+50§!§!"
 sunflower_radioactive_effects:0 "Производство £energy£ §Y$energy$§! роя Дайсона: §G+50§!"
 without_dyson_cloud:0 "$TRIGGER_FAIL$ Мы ещё не построили ни одного роя Дайсона корабельных дев"
 building_mining_zoo:0 "Шахтный зоопарк инопланетных милашек"
 building_mining_zoo_desc:0 "Милые инопланетные зверушки сами запрыгивают в шахты и помогают добывать руду, а при случае служат и хищниками, внося вклад в оборону планеты."
 tech_wg_mining_zoo:0 "Шахтный зоопарк инопланетных милашек"
 tech_wg_mining_zoo_desc:0 "Милые инопланетные зверушки сами запрыгивают в шахты и помогают добывать руду, а при случае служат и хищниками, внося вклад в оборону планеты."
 building_wg_psi_temple:0 "Храм Древнего Бога"
 building_wg_psi_temple_desc:0 "Причудливое сооружение из псионически сплавленных духовных камней, где корабельные девы, верующие в Древнего Бога, совершают обряды."
 wg_psi_temple_desc:0 "Перед входом в храм каждая корабельная дева проходит проверку рассудка 1/100"
 building_cunningmazon_s:0 "Чудо Лавки: Центр огранки колец"
 building_cunningmazon_s_desc:0 "Способ огранки колец, слитый нам ренегатом Лавки Трофеев, позволяет медленно производить кольца."
 Building_cunningmazon_ring_desc:0 "Каждые 5 лет добавляет одно £sr_ring£§Yкольцо§!"
 building_cunningmazon_m:0 "Чудо Лавки: Центр огранки колец"
 building_cunningmazon_m_desc:0 "Способ огранки колец, слитый нам ренегатом Лавки Трофеев, позволяет медленно производить кольца."
 building_sh_assembly_plant:0 "Сборщик Глубинных"
 building_sh_assembly_plant_desc:0 "Сборщик, изобретённый гениальным доктором Глубинных, быстро производит глубинных корабельных дев."
 building_sh_assembly_plantU:0 "Сборщик Глубинных II уровня"
 building_sh_assembly_plantU_desc:0 "Улучшенная версия: органические питательные чашки в сочетании с автосборкой сокращают число этапов — глубинные корабельные девы производятся ещё быстрее."
 building_sh_assembly_plantF:0 "Сборщик Глубинных III уровня"
 building_sh_assembly_plantF_desc:0 "Производит глубинных корабельных дев ещё быстрее; автоматические дроны отбраковывают негодные образцы, повышая стабильность."
 building_sh_residence:0 "Общежитие ожидания Глубинных"
 building_sh_residence_desc:0 "Свободные глубинные корабельные девы размещаются в этом здании для экономии ресурсов; их разбудят лишь при необходимости."
 building_sh_nerve:0 "Нейронный усилитель Глубинных"
 building_sh_nerve_desc:0 "Уходящая в облака башня-нейронка ретранслирует яматозирующий сигнал, стимулируя нервы всех юнитов, но причиняет лёгкий дискомфорт."
 building_sh_sex:0 "Комитет деторождения Глубинных"
 building_sh_sex_desc:0 "Всевозможными методами преподаёт правильные способы размножения живых существ — от личных уроков и видео до чипов с мгновенным выпускным."
 building_sh_pantsu:0 "Фабрика трусиков Глубинных"
 building_sh_pantsu_desc:0 "В обществе Глубинных сдача собственных ношеных трусиков — общественная обязанность."
 building_sh_pantsu2:0 "Главный трусиковый завод Глубинных"
 building_sh_pantsu2_desc:0 "После модернизации время обработки трусиков измеряется микросекундами, а процесс радикально оптимизирован — выпуск заметно вырос."
 sh_pantsu_effect_desc:0 "£job_sh_pantsu_maker£ $job_sh_pantsu_maker_plural$ превращают £minerals£ §Y$minerals$§! и £food£ §Y$food$§! в £sr_pantsu£ §Yтрусики§!"
 job_sh_pantsu_maker:0 "Производитель трусиков Глубинных"
 mod_job_sh_pantsu_maker_add:0 "Профессия: производитель трусиков Глубинных"
 job_sh_pantsu_maker_plural:0 "Профессия: производитель трусиков Глубинных"
 job_sh_pantsu_maker_cap:0 "$job_sh_pantsu_maker$"
 job_sh_pantsu_maker_desc:0 "Глубинные собирают ношеные трусики: они накапливают мощную энергию и отлично формуются."
 building_sh_research:0 "НИИ Глубинных I уровня"
 building_sh_research_desc:0 "Продвинутый НИИ Глубинных: больше научных мест."
 building_sh_research2:0 "НИИ Глубинных II уровня"
 building_sh_research2_desc:0 "После модернизации НИИ оснащён ещё более продвинутым оборудованием и особо усиленными научными сотрудниками."
 building_sh_research3:0 "НИИ Глубинных III уровня"
 building_sh_research3_desc:0 "После всеобщего вознесения членов Глубинных в наши научные учреждения хлынуло ещё больше исследователей."
 job_sh_researcher:0 "Старший научный сотрудник Глубинных"
 job_sh_researcher_effect_desc:0 "£job_sh_researcher£ $job_sh_researcher_plural$ потребляют £consumer_goods£ §Y$consumer_goods$§! и производят £physics£ £society£ £engineering£ §Yнаучные очки§! для новых технологий, а также повышают §Yскорость инженерных исследований§!"
 mod_job_sh_researcher_add:0 "Профессия: старший научный сотрудник Глубинных"
 job_sh_researcher_plural:0 "Профессия: старший научный сотрудник Глубинных"
 job_sh_researcher_cap:0 "$job_sh_researcher$"
 job_sh_research_effect_desc:0 "Старший научный сотрудник Глубинных"
 job_sh_researcher_desc:0 "Специально усиленные исследователи, особенно сильны в инженерных науках."
 building_sh_foundry:0 "Сплавительный завод Глубинных"
 building_sh_foundry_desc:0 "Учёные Глубинных максимально оптимизировали технологию синтеза сплавов — производительность выросла в разы."
 building_sh_foundryU:0 "Продвинутый сплавительный завод Глубинных"
 building_sh_foundryU_desc:0 "Новейшее поколение сплавительных мощностей Глубинных: ещё более эффективный выпуск сплавов."
 job_sh_foundry_effect_desc:0 "£job_sh_foundry£ $job_sh_foundry_plural$ превращают £minerals£ §Y$minerals$§! в £alloys£ §Y$alloys$§!"
 job_sh_foundry:0 "Сплавщик Глубинных"
 mod_job_sh_foundry_add:0 "Профессия: сплавщик Глубинных"
 mod_job_sh_foundry_per_pop_short:0 "На каждые $VALUE$ населения §G+1§! профессия $job_sh_foundry$"
 job_sh_foundry_plural:0 "Профессия: сплавщик Глубинных"
 job_sh_foundry_cap:0 "$job_sh_foundry$"
 job_sh_foundry_desc:0 "Лучшие рабочие с высокой эффективностью производят сплавы."
 job_sh_foundry_shrw:0 "$job_sh_foundry$"
 mod_job_sh_foundry_shrw_add:0 "$job_sh_foundry_desc$"
 job_sh_foundry_shrw_plural:0 "$job_sh_foundry_plural$"
 job_sh_foundry_shrw_cap:0 "$job_sh_foundry_shrw$"
 job_sh_foundry_shrw_cap:0 "$job_sh_foundry_shrw$"
 job_sh_foundry_shrw_desc:0 "$job_sh_foundry_desc$"
 job_sh_foundry_shrw_effect_desc:0 "$job_sh_foundry_effect_desc$"
 job_sh_foundry_shpc_effect_desc:0 "£job_sh_foundry_shpc£ $job_sh_foundry_shpc_plural$ превращают £minerals£ §Y$minerals$§! в £alloys£ §Y$alloys$§! и £consumer_goods£ §Y$consumer_goods$§!"
 job_sh_foundry_shpc:0 "Планетарный литейщик Глубинных"
 mod_job_sh_foundry_shpc_add:0 "Профессия: планетарный литейщик Глубинных"
 job_sh_foundry_shpc_plural:0 "Профессия: планетарный литейщик Глубинных"
 job_sh_foundry_shpc_cap:0 "$job_sh_foundry_shpc$"
 job_sh_foundry_shpc_desc:0 "Благодаря особым условиям планет Глубинных стало возможным эффективное производство сплавов и товаров массового спроса."
 building_sh_senergy:0 "Завод энергетических ядер Глубинных"
 building_sh_senergy_desc:0 "Огромный завод: даже высочайшая защита едва выдерживает его излучение."
 building_sh_senergy2:0 "Продвинутый завод энергетических ядер Глубинных"
 building_sh_senergy2_desc:0 "Усиленная защита снижает лучевую нагрузку — теперь здесь помещается больше рабочих."
