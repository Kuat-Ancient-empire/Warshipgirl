 job_wsg_shop_pantsu_collector_cap:0 "$job_wsg_shop_pantsu_collector$"
 job_wsg_shop_pantsu_collector_desc:0 "Как известно, Лавка Трофеев хранит свои ресурсы предельно по-зеленокожему: горы трусиков просто валяются на полу, и простому сборщику достаточно их подобрать, чтобы неплохо заработать."
