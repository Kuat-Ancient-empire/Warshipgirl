 decision_planet_wg_knight_modifier_lord_effect:0 "£job_wg_knight_lord£ $job_wg_knight_lord_plural$ повышают выработку планетарным решением §YРыцарский долг§! и числом §Yпутей вознесения§!\n£job_wg_knight£ $job_wg_knight_plural$ повышают выработку планетарным решением §YРыцарский долг§!\n£job_wg_squire£ $job_wg_squire_plural$ усиливают выработку £job_wg_knight_lord£ §Y$job_wg_knight_lord$§! и £job_wg_knight£ §Y$job_wg_knight$§!"
 job_wg_knight:0 "Рыцарь-корабельная дева"
 mod_job_wg_knight_add:0 "Рыцарь-корабельная дева"
 job_wg_knight_plural:0 "Рыцарь-корабельная дева"
 job_wg_knight_cap:0 "$job_wg_knight$"
 job_wg_knight_desc:0 "Рыцари-корабельные девы образцовы во всём — гордость корабельного рода."
 job_wg_knight_effect_desc:0 "£job_wg_knight£ $job_wg_knight_plural$ превращают $alloys$ в £mod_country_naval_cap_add£ §Yвоенно-морскую ёмкость§!, £defense_army£ §Yоборонительные армии§!, £unity£ §Yединство§! и £physics_research£ £society_research£ £engineering_research£§Yнаучные очки§!; планетарное решение §YРыцарский долг§! дополнительно улучшает их выработку."
