 tech_building_wsg_stage:0 "Проект «Идолы Порта»"
 tech_building_wsg_stage_desc:0 "Выбор сделан — это ты! Ну что, подписывай контракт и становись айдолом!"
 building_sh_mind_jammer:0 "Глушилка сознания"
 building_sh_mind_jammer_desc:0 "Это сооружение глушит мышление всех жителей планеты, делая их раздражительными и склонными к насилию, что ведёт к социальной нестабильности."
 building_sh_criminals_safe_house:0 "Убежище преступников"
 building_sh_criminals_safe_house_desc:0 "Отребья и преступники этой планеты ни за что не догадаются, кому на самом деле принадлежит эта роскошная явка, а эти типы ещё и приносят нам кое-какой доход."
 building_sh_corrupt_department:0 "Отдел коррупции правопорядка"
 building_sh_corrupt_department_desc:0 "Номинально на этой планете полно правоохранителей, но никто не знает, кому на самом деле служат эти снующие туда-сюда блюстители закона."
 job_corrupt_enforcer:0 "Коррумпированный правоохранитель"
 job_corrupt_enforcer_plural:0 "Коррумпированный правоохранитель"
 job_corrupt_enforcer_cap:0 "$job_corrupt_enforcer$"
 job_corrupt_enforcer_desc:0 "Эти стражи закона уже подкуплены нами: они закрывают глаза на преступления, облегчая наши диверсии на планете."
 job_corrupt_enforcer_effect_desc:0 "£job_corrupt_enforcer£ $job_corrupt_enforcer_plural$ производят £crime£ §Y$PLANET_CRIME_TITLE$§! и §Yторговую стоимость филиала§!, а также повышают лимит §Y$BRANCH_OFFICE_BUILDINGS$§!"
 mod_job_corrupt_enforcer_add:0 "Должность: $job_corrupt_enforcer$"
