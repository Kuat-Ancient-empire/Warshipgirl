 job_wg_knight_lord_plural:0 "Гроссмейстер-корабельная дева"
 job_wg_knight_lord_cap:0 "$job_wg_knight_lord$"
 job_wg_knight_lord_desc:0 "Гроссмейстеры — цвет рыцарского сословия, предмет всеобщего уважения и стремления."
 job_wg_knight_lord_effect_desc:0 "£job_wg_knight_lord£ $job_wg_knight_lord_plural$ превращают $alloys$ в $r_unity$, $r_amenities$ и £mod_country_naval_cap_add£ §Y$MOD_COUNTRY_NAVAL_CAP_ADD$§!, а также в £physics_research£ £society_research£ £engineering_research£§Yнаучные очки§!\nПланетарное решение §YРыцарский долг§! и число §Yпутей вознесения§! ещё сильнее повышают их выработку."
