 building_wsg_historical_library:0 "Чудо Порта: Историческая библиотека корабельных дев"
 building_wsg_historical_library_desc:0 "Огромное хранилище истории древних корабельных дев — в основном гигантский архив, собранный Канариасом за прошлую службу. Имеет высочайшую научную ценность.\n§H§!"
 job_wsg_historical_researcher:0 "Историк корабельных дев"
 job_wsg_historical_researcher_plural:0 "Историк корабельных дев"
 job_wsg_historical_researcher_cap:0 "$job_wsg_historical_researcher$"
 job_wsg_historical_researcher_desc:0 "Исследователи, изучающие историю под руководством Канариаса. Как говорится, «история — зеркало»: лишь учась на прошлом, построишь государство лучше."
