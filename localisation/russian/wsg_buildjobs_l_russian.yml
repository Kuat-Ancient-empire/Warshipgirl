 tech_building_sh_ground_shipyard_2:0 "Продвинутая наземная верфь"
 tech_building_sh_ground_shipyard_2_desc:0 "С ещё более высокой автоматизацией эти верфи служат нам эффективнее."
 tech_building_wg_dark_matter:0 "Производство тёмной материи"
 tech_building_wg_dark_matter_desc:0 "В будущем мы можем столкнуться с нехваткой тёмной материи; это продвинутое сооружение — страховка от такого сценария."
 building_wg_dark_matter:0 "Колодец горизонта"
 building_wg_dark_matter_desc:0 "Внутри этого продвинутого сооружения создаётся малая чёрная дыра для производства тёмной материи. Защита убережёт планету от поглощения — ценой падения удобств."
 tech_building_wsg_base_resources_department:0 "Планетарное управление производства"
 tech_building_wsg_base_resources_department_desc:0 "Управление производства может усилить надзор и добычу одного из базовых ресурсов, повышая нашу выработку."
 tech_building_wsg_base_resources_department_2:0 "Планетарный штаб производства"
 tech_building_wsg_base_resources_department_2_desc:0 "У штаба производства выше полномочия и возможности — он распоряжается добычей ресурсов всей планеты."
 building_wsg_agricultural_department:0 "Планетарное управление сельского хозяйства"
 building_wsg_agricultural_department_desc:0 "Управление сельского хозяйства курирует большинство сельхозработ планеты."
 wg_col_farming_notice:0 "Если тип колонии — §Gаграрная планета§!, £job_farmer£ [GetFarmerPlural] дополнительно производят £food£ $food$: §G+1§!"
 building_wsg_agricultural_department_2:0 "Планетарный сельхозштаб"
 building_wsg_agricultural_department_2_desc:0 "Сельхозштаб отвечает за все сельхозработы планеты: передовые идеи и оборудование резко поднимут урожай."
 wg_col_farming_notice_2:0 "Если тип колонии — §Gаграрная планета§!, £job_farmer£ [GetFarmerPlural] дополнительно производят £food£ $food$: §G+2§!"
 building_wsg_minerals_department:0 "Планетарное управление горного дела"
 building_wsg_minerals_department_desc:0 "Управление горного дела наводит порядок в шахтах планеты: новейшее оборудование резко поднимет добычу минералов."
 wg_col_mining_notice:0 "Если тип колонии — §Rгорнодобывающая планета/станция§!, £job_miner£ [GetMiner] дополнительно производят £minerals£ $minerals$: §G+1§!"
 building_wsg_minerals_department_2:0 "Планетарный горный штаб"
 building_wsg_minerals_department_2_desc:0 "Горный штаб отвечает за все шахтные работы и управление на всей планете."
 wg_col_mining_notice_2:0 "Если тип колонии — §Rгорнодобывающая планета/станция§!, £job_miner£ [GetMiner] дополнительно производят £minerals£ $minerals$: §G+2§!"
 building_wsg_power_department:0 "Планетарное управление энергосетей"
 building_wsg_power_department_desc:0 "Управление энергосетей отвечает за производство и поставки энергии планеты."
 wg_col_generator_notice:0 "Если тип колонии — §Yгенерирующая планета/станция§!, £job_technician£ [GetTechnicianPlural] дополнительно производят £energy£ $energy$: §G+1§!"
 building_wsg_power_department_2:0 "Планетарный энергоштаб"
 building_wsg_power_department_2_desc:0 "Теперь энергоштаб управляет всей планетарной сетью — производство ещё эффективнее."
 wg_col_generator_notice_2:0 "Если тип колонии — §Yгенерирующая планета/станция§!, £job_technician£ [GetTechnicianPlural] дополнительно производят £energy£ $energy$: §G+2§!"
 tech_building_sh_base_resources_department:0 "Планетарное управление производства Глубинных"
 tech_building_sh_base_resources_department_desc:0 "Управление производства эффективнее координирует базовые работы глубинных корабельных дев"
 building_sh_base_resources_department:0 "Планетарное управление производства Глубинных"
 building_sh_base_resources_department_desc:0 "Управление производства эффективнее координирует базовые работы глубинных корабельных дев"
 sh_col_notice:0 "Переключите тип колонии на соответствующий §Yпланету/станцию первичного ресурса§! — соответствующие первичные должности производят дополнительно §G+1§!"
 tech_building_sh_base_resources_department_2:0 "Планетарный штаб производства Глубинных"
 tech_building_sh_base_resources_department_2_desc:0 "Теперь штаб производства отвечает за работу и распределение всех глубинных корабельных дев планеты."
 building_sh_base_resources_department_2:0 "Планетарный штаб производства Глубинных"
 building_sh_base_resources_department_2_desc:0 "Теперь штаб производства отвечает за работу и распределение всех глубинных корабельных дев планеты"
 sh_col_notice_2:0 "Переключите тип колонии на соответствующий §Yпланету/станцию первичного ресурса§! — соответствующие первичные должности производят дополнительно §G+2§!"
 building_wg_knight_castle:0 "Владение рыцарского ордена корабельных дев"
 building_wg_knight_castle_desc:0 "Эта территория выделена рыцарскому ордену корабельных дев для расширения его рядов."
 building_wg_knight_castle_2:0 "Замок рыцарского ордена корабельных дев"
 building_wg_knight_castle_2_desc:0 "В этом величественном замке — одна из главных ставок рыцарей-корабельных дев планеты: здесь они обмениваются опытом и оттачивают мастерство."
 wg_knights_category:0 "Рыцарь-корабельная дева"
 wg_knights_lord_category:0 "Гроссмейстер-корабельная дева"
