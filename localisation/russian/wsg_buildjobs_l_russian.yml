 building_sh_research_theft:0 "Отдел коррупции науки"
 building_sh_research_theft_desc:0 "Этот отдел всячески развращает персонал исследовательских учреждений: наука деградирует, а часть результатов достаётся нам."
 building_sh_construction_corruption:0 "Отдел коррупции строительства"
 building_sh_construction_corruption_desc:0 "Этот отдел развращает ответственных за планетарные проекты: крупные стройки перетягиваются под их крыло, а затем тормозятся или халтурятся."
 building_sh_poisoning:0 "Департамент хронической стерилизации"
 building_sh_poisoning_desc:0 "Этот департамент подавляет рост населения планеты всеми средствами: от токсинов, замедляющих развитие, в воде и еде до импульсов, нарушающих эмбриогенез."
 building_sh_planet_blaster:0 "Группа подрыва планеты"
 building_sh_planet_blaster_desc:0 "Под прикрытием местных коррумпированных чиновников в тени создан этот отдел: он будет тайно разрушать планету, пока полностью её не уничтожит."
 building_sh_planet_blast_group_effect_desc:0 "После завершения строительства открывает ситуацию: §YОперация «Подрыв планеты»§!"
 requires_building_sh_corrupt_government:0 "$TRIGGER_FAIL$ Без прикрытия §YОргана проникновения в бюрократию§! мы не можем построить это здание"
 only_one_sh_corrupt_government:0 "$TRIGGER_FAIL$ У нас не хватает ресурсов вести подобные операции в нескольких местах одной империи"
 building_wsg_prosperity_monument:0 "Чудо Порта: Монумент процветания"
 building_wsg_prosperity_monument_desc:0 "Вера, которую мы приняли, создала сегодняшний триумф — и мы, как и прежде, будем смело идти вперёд."
 building_wsg_prosperity_monument_effect:0 "За каждый принятый империей путь вознесения это здание даёт §G10§! £unity£$unity$"
 building_wsg_ground_shipyard:0 "Наземная верфь"
 building_wsg_ground_shipyard_desc:0 "И военные, и гражданские корабли можно строить в этих невесомых доках, развёрнутых на планете."
 building_wsg_ground_shipyard_2:0 "Продвинутая наземная верфь"
 building_wsg_ground_shipyard_2_desc:0 "С ещё более высокой автоматизацией эти верфи служат нам эффективнее."
 tech_building_wsg_ground_shipyard_2:0 "Продвинутая наземная верфь"
 tech_building_wsg_ground_shipyard_2_desc:0 "С ещё более высокой автоматизацией эти верфи служат нам эффективнее."
 building_sh_ground_shipyard:0 "Наземная верфь"
 building_sh_ground_shipyard_desc:0 "И военные, и гражданские корабли можно строить в этих невесомых доках, развёрнутых на планете."
 building_sh_ground_shipyard_2:0 "Продвинутая наземная верфь"
