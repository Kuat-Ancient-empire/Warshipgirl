 building_wsg_stage:0 "Сцена Порта"
 building_wsg_stage_desc:0 "У каждой корабельной девы есть мечта, которую хочется осуществить любой ценой: стать звездой сцены!"
 job_wsg_idol:0 "Идол корабельных дев"
 job_wsg_idol_plural:0 "$job_wsg_idol$"
 job_wsg_idol_cap:0 "$job_wsg_idol$"
 job_wsg_idol_desc:0 "Чтобы защитить общий дом — Порт, эти корабельные девы решили стать айдолами!"
 job_sh_idol_desc:0 "Кто сказал, что Глубинным нельзя на сцену? Поверь, и ты сможешь стать светом!"
 job_sh_idol_desc_2:0 "Точнее, это §Yэталонные Глубинные§! — образец и цель для всех Глубинных, их эффективность близка к совершенству."
 mod_job_wsg_idol_add:0 "Профессия: $job_wsg_idol$"
