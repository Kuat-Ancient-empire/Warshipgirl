 pc_rw_sh_extra_artisan_effect_desc:0 "Гражданская промышленность даёт этому району дополнительно §G+3§! £job_artisan£ §Y$job_artisan$§!"
 building_alien_slicer_wsg:0 "Центр возвышения корабельных дев"
 building_alien_slicer_wsg_desc:0 "Стать девушкой-монстром, перенести сознание, безболезненно превратиться в корабельную деву — всё это уловки для инопланетян. Но немало наивных чужаков верит, что для превращения хватит операции уровня удаления аппендикса, — возможно, потому, что здание и правда выглядит убедительно.\nЭто здание перерабатывает таких инопланетян в органическую жижу или разбирает на ценный металл, поставляя всё на местные сборочные заводы и ускоряя сборку нашего населения."
 building_alien_slicer_sh:0 "Центр возвышения глубинных корабельных дев"
 building_alien_slicer_sh_desc:0 "Это здание перерабатывает инопланетян в органическую жижу или разбирает на ценный металл, поставляя всё на местные сборочные заводы и ускоряя сборку нашего населения."
 building_alien_slicer_effect_desc:0 "При наличии на планете населения §Y$slavery_livestock$§! даёт §G2§!§Y$MOD_BONUS_POP_GROWTH$§!\nПри наличии на планете населения §Yпод чисткой§! (тип чистки не §Yизгнание§! и не §Yстерилизация§!) даёт §G4§!§Y$MOD_BONUS_POP_GROWTH$§!\nВ силу §Rдоброты§! эффекты суммируются"
 tech_building_alien_slicer_wsg:0 "Центр возвышения корабельных дев"
 tech_building_alien_slicer_wsg_desc:0 "Стать девушкой-монстром, перенести сознание, безболезненно превратиться в корабельную деву — всё это уловки для инопланетян. Но немало наивных чужаков верит, что для превращения хватит операции уровня удаления аппендикса."
 tech_building_alien_slicer_sh:0 "Центр возвышения глубинных корабельных дев"
 tech_building_alien_slicer_sh_desc:0 "Это здание перерабатывает инопланетян в органическую жижу или разбирает на ценный металл, поставляя всё на местные сборочные заводы и ускоряя сборку нашего населения."
 building_sh_unity_1:0 "Нейронный координатор Глубинных"
 building_sh_unity_1_desc:0 "Здание, пронизанное бесчисленными нейро-оптоволоконными линиями, эффективно координирует обмен сознаний глубинных корабельных дев, повышая их рабочую и административную эффективность."
 building_sh_unity_2:0 "Бассейн полного погружения"
 building_sh_unity_2_desc:0 "Наше мышление освобождено — больше не нужно подключаться к разным кабелям для отсталой координации. Поэтому здание переделали в огромный бассейн с кучей невиданных развлечений. Разумеется, старые линии нейрокоординации сохранены под ним для новых должностей."
 tech_building_sh_unity_1:0 "$building_sh_unity_1$"
 tech_building_sh_unity_1_desc:0 "Соединяя сознания глубинных корабельных дев, координатор Глубинных заметно повышает нашу административную эффективность."
 tech_building_sh_unity_2:0 "$building_sh_unity_2$"
 tech_building_sh_unity_2_desc:0 "Нам больше не нужны громоздкие кабели для отсталой координации, поэтому эти ветхие здания переделаны в крутые динамичные бассейны — лучшее место отдыха для наших товарищей, а былые линии нейрокоординации ушли под землю и продолжают работать на администрацию."
 building_sh_unity_3:0 "Продвинутый нейронный координатор Глубинных"
 building_sh_unity_3_desc:0 "Флот Аннигиляции определился со своим будущим: точные и беспощадные нервные сигналы бегут по оптоволокну, позволяя глубинным корабельным девам исполнять любой приказ с максимальной эффективностью."
 job_sh_bureaucrat:0 "Оператор координатора"
 job_sh_bureaucrat_plural:0 "$job_sh_bureaucrat$"
 job_sh_bureaucrat_cap:0 "$job_sh_bureaucrat$"
 job_sh_bureaucrat_desc:0 "Эти операторы поддерживают тысячи нейро-оптоволоконных нитей на пике эффективности, помогая работе других глубинных корабельных дев"
 mod_job_sh_bureaucrat_add:0 "Профессия: $job_sh_bureaucrat$"
 job_sh_bureaucrat_effect_desc:0 "£job_sh_bureaucrat£ $job_sh_bureaucrat_plural$ превращают £consumer_goods£ §Y$consumer_goods$§! и £energy£ §Y$energy$§! в £unity£ §Y$unity$§!, а также повышают £unity£ §Y$unity$§! у $job_bureaucrat_plural$ и $job_priest_plural$"
 job_sh_pool:0 "Оператор бассейна полного погружения"
 job_sh_pool_plural:0 "$job_sh_pool$"
 job_sh_pool_cap:0 "$job_sh_pool$"
 job_sh_pool_desc:0 "Секрет того, что посетители бассейна чувствуют себя свободно и никому не мешают, — в этих сотрудниках: они чуть-чуть подстраивают органы чувств гостей через проекторы полного погружения, даря «счастье»."
 mod_job_sh_pool_add:0 "Профессия: $job_sh_pool$"
