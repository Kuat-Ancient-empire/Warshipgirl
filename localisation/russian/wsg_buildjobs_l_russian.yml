 job_sh_soldier_cap:0 "$job_sh_soldier$"
 job_sh_soldier_desc:0 "Лучшие диспетчеры Глубинных: они обеспечат эффективную диспетчеризацию кораблей и грамотное административное управление."
 building_sh_precinct_house:0 "Департамент Процветания Глубинных"
 building_sh_precinct_house_desc:0 "Военизированное сооружение под ключ — штаб Департамента Процветания Глубинных. Местные профессионалы умеют максимально сократить расходы и поднять выработку; способы лучше не знать."
 job_sh_enforcer:0 "Оператор Департамента Процветания Глубинных"
 job_sh_enforcer_effect_desc:0 "£job_sh_enforcer£ $job_sh_enforcer_plural$ потребляют £energy£ §Y$energy$§! и £consumer_goods£ §Y$consumer_goods$§!, повышают §Y$mod_planet_jobs_produces_mult$§! и снижают £mod_planet_crime_add£$MOD_PLANET_CRIME_ADD$"
 mod_job_sh_enforcer_add:0 "Профессия: оператор Департамента Процветания Глубинных"
