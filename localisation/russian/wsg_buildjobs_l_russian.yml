 building_wsg_research:0 "Лаборатория корабельных дев"
 building_wsg_research_desc:0 "В лабораториях корабельных дев больше продвинутого оборудования; сотрудники особенно сильны в физике."
 building_wsg_research2:0 "Лаборатория корабельных дев"
 building_wsg_research2_desc:0 "В лабораториях корабельных дев больше продвинутого оборудования, а старшие научные сотрудники — отборнейшие умы, прошедшие многоступенчатый отбор."
 building_wsg_research3:0 "Продвинутая лаборатория корабельных дев"
 building_wsg_research3_desc:0 "После установления прямых связей с NF наши сотрудники наконец могут вести совместные исследования в этой передовой лаборатории."
 building_wsg_alpha_center:0 "Чудо Порта: Альфа-центр"
 building_wsg_alpha_center_desc:0 "Благодаря мощнейшей энергии кристаллов Альфа мы наконец можем создать стабильное поле для поддержания связи с Лазурным миром. Теперь открыт путь к всестороннему сотрудничеству."
 job_wsg_administrator:0 "Дипломат Лазурного мира"
