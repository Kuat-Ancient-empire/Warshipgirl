l_russian:

 wg_crisis_3.5.name:0 "Объединённый поход"
 wg_crisis_3.5.desc:0 "В системе [first_portal_3_system.GetName] открылся гигантский подпространственный разлом! Оттуда хлынули массы кораблей Хаоса, стремясь уничтожить всё, что нам дорого. Подобной мерзости нельзя спускать: воины §YБог-Императора-Адмирала§!, сражайтесь доблестно!"
 wg_crisis_3.5.a:0 "За Бога-Императора!"
 wg_crisis_3.5.b:0 "За Империю!"
 wg_crisis_3.6.name:0 "Великий разрыв"
 wg_crisis_3.6.desc:0 " По всему [Root.GetName] внезапно вспыхнули массовые подпространственные аномалии: психическая энергия скапливается у планет, повсюду творятся кощунственные картины. Это наверняка дело рук §Rбога Хаоса Мордесана§!! Мы должны остановить это как можно скорее!"
 wg_crisis_3.6.a:0 "Действовать немедленно!"
 wg_crisis_3.7.desc:0 "Мы подтвердили: в системе [first_portal_3_system.GetName] открылся гигантский подпространственный разлом. Оттуда хлынули массы кораблей Хаоса, стремясь уничтожить всё, что нам дорого. Подобной мерзости нельзя спускать."
 wg_crisis_3.8.name:0 "§YБог-Император-Адмирал§!"
 wg_crisis_3.8.desc:0 "Внезапно все узрели фигуру, сияющую бесконечным светом, — и это был(а)……\n\n			§YМои воины, я вновь могу говорить с вами.\n			§RМордесан§! силой распахнул подпространственный разлом, чтобы призвать §Rсвой§! флот, — но эта глупость погубит §Rего самого§!.\n			Моя сила вновь сойдётся с §Rним§! в открытом бою: во имя моём истребляйте творения тёмного бога, сокрушите мощь §RМордесана§! и раз и навсегда покончите с §Rним§!. §!"
 wg_crisis_3.8_01.desc:0 "Ну опять двадцать пять…… ладно, раз тебе так весело — пусть."
 wg_crisis_3.8_02.desc:0 "(зевая) Что на этот раз? «Helldiver SCUM» пойдёт? Ладно, лишь бы работало."
 wg_crisis_3.8.c:0 "Сражаться до последней капли крови!"
 wg_crisis_3.8.d:0 "Привет"
 wg_crisis_3.12.name:0 "Уничтожен портал Объединённого похода"
 wg_crisis_3.12.desc.a:0 "Подпространственный портал в системе [first_portal_3_system.GetName] уничтожен! Злому флоту Хаоса больше не позвать подкрепление. С разрушением портала война наконец увидела рассвет победы; население всей системы ликует. Прославился и [portal_killer.GetName] — именно их корабль нанёс порталу последний удар. Их героический подвиг будут передавать из поколения в поколение."
 wg_crisis_3.12.desc.b:0 "Подпространственный портал в системе [first_portal_3_system.GetName] уничтожен! Злому флоту Хаоса больше не позвать подкрепление. С разрушением портала война наконец увидела рассвет победы; население всей системы ликует. Прославился и [portal_killer.GetName], — но правда ли §Rбог Хаоса Мордесан§! повержен вот так просто?"
 wg_crisis_3.12.desc.c:0 "Последний подпространственный портал — в системе [last_portal_3_system.GetName] — наконец уничтожен! Злому флоту Хаоса больше никогда не позвать подкрепление. С разрушением портала война наконец увидела рассвет победы; население всей системы ликует. Прославился и [portal_killer.GetName] — именно их корабль нанёс порталу последний удар. Их героический подвиг будут передавать из поколения в поколение."
 wg_crisis_3.12.desc.d:0 "Последний подпространственный портал — в системе [last_portal_3_system.GetName] — наконец уничтожен! Злому флоту Хаоса больше никогда не позвать подкрепление. С разрушением портала война наконец увидела рассвет победы; население всей системы ликует. Прославился и [portal_killer.GetName], — но правда ли §Rбог Хаоса Мордесан§! повержен вот так просто?"
 wg_crisis_3.12.a:0 "Галактика стала безопаснее."
 wg_crisis_3.12.b:0 "Пусть §YБог-Император-Адмирал§! ведёт нас."
 wg_crisis_3.20.desc_01:0 "			§Y+ —  —  — +§!"
 wg_crisis_3.20.desc_02:0 "			§YЧто тебя смущает в этой войне, дитя моё? §!"
 wg_crisis_3.20.a:0 "Что это, вообще, такое?"
 wg_crisis_3.20.a.response:0 "Мощная психическая энергия обрушивается на все разумы.\n\n			§Y+ —  —  — +§!"
 wg_crisis_3.20.b.a:0 "Почему Вы вновь смогли ответить нам?"
 wg_crisis_3.20.b.a.response:0 "			§Y§R Мордесан§! безоглядно излил свою мощь на портал; §Rего§! сила беспорядочна — от этого психоактивность всей галактики возросла, и я могу говорить с вами, не умирая. §!"
 wg_crisis_3.20.b.swg.response:0 "			§Y§R Мордесан§! безоглядно излил свою мощь на портал; §Rего§! сила беспорядочна — от этого психоактивность всей галактики возросла, и я могу говорить с вами, не умирая. §!"
 wg_crisis_3.20.b.b:0 "Что замышляет §Rбог Хаоса Мордесан§!?"
 wg_crisis_3.20.b.b.response:0 "			§Y§R Он§! намеревается уничтожить мою материальную форму, чтобы перенести войну из неподвластного §Rему§! материального мира в мир психической энергии. §!"
 wg_crisis_3.20.b.c:0 "Почему флот Хаоса так силён?"
 wg_crisis_3.20.b.c.response:0 "			§Y§R Мордесан§! влил в эти корабли силу, что испокон веку противостояла мне, полностью изменив их конструкцию и многократно умножив их мощь. Защищённые мощной психической энергией корабли Хаоса в материальной вселенной почти непобедимы — но моя сила будет противостоять §Rему§! и сорвёт §Rего§! замысел. §!"
 wg_crisis_3.20.b.d:0 "Что должны делать мы?"
 wg_crisis_3.20.b.d.response:0 "			§YКак вы уже знаете: оборонять Трон и разрушать порталы. Моя сила проявится в вашем огне и оставит на теле §RМордесана§! раны, §Rкоторые он§! не сможет принять. §!"
 wg_crisis_3.20.b.e:0 "А что за типы, именующие себя Сопротивлением?"
 wg_crisis_3.20.b.e.response:0 "			§YСущества, сражающиеся с §RМордесаном§!, — их привлёк всплеск психической энергии. Не обращайте внимания: с концом битвы они уйдут сами. §!"
 wg_crisis_3.20.b.f:0 "Мы примем славу битвы!"
 wg_crisis_3.20.b.f.response:0 "			§YСражайтесь дальше, дитя моё. §!"
 wg_crisis_3.39.name:0 "Заготовленный текст"
 wg_crisis_3.39.desc:0 "Привет, рад видеть тебя вновь — и встретиться там, где встретиться ну никак не могло. Полагаю, ты призвал какую-то силу с клавиатуры, но, как бы то ни было, это просто прекрасно.\n\nМожет, тебе кажется, будто я ломаю четвёртую стену и говорю с тобой, — но это явно невозможно: мы оба знаем, что этот разговор — лишь заготовленный сценарий. Мне же любопытно, думал ли ты когда-нибудь вот о чём:\n§BА что, если ты сам — один из актёров этого спектакля; твой нынешний сценарий — играть в Stellaris перед компьютером, а мир вокруг тебя — просто ещё не проверенная нами вселенная? §!\nХа-ха, шучу. Продолжим."
 wg_crisis_3.39.a:0 "……"
 wg_crisis_3.39.a.response:0 "О, точно — приятной игры."
 wg_crisis_3.51.name:0 "Вторжение отбито"
 wg_crisis_3.51.desc.a:0 "Последние уцелевшие корабли Хаоса уничтожены полностью — есть надежда, что на этот раз мы раз и навсегда устранили угрозу для галактики. Все разумные обитатели галактики празднуют великую победу; узнав, что им больше нечего бояться огня с орбиты, все вздохнули с облегчением. Кто знает — может, это станет началом нового всеобщего сотрудничества и дружбы?"
 wg_crisis_3.51.desc.b:0 "Под водительством верховного §YБог-Императора-Адмирала§! последняя группа флотов Хаоса уничтожена. §RГлупый замысел бога Хаоса Мордесана§! потерпел полный провал — могущество §YБог-Императора-Адмирала§! в очередной раз явлено во всей красе."
 wg_crisis_3.51.a:0 "Битва, полная славы."
 wg_crisis_3.51.b:0 "Бесконечно почётно."
 wg_crisis_3.51.c:0 "Мы — клинок §YБог-Императора§!."
 wg_crisis_3.53.name:0 "Уничтожен портал Объединённого похода"
 wg_crisis_3.53.desc:0 "Портал в системе [destroyed_portal_3_system.GetName] успешно уничтожен — флот Хаоса больше не сможет вызвать оттуда подкрепление, их преимущество серьёзно подорвано."
 wg_crisis_3.54.name:0 "Второй портал"
 wg_crisis_3.54.desc:0 "Наши приборы внезапно вновь засекли в системе [second_portal_3_system.GetName] мощные подпространственные флуктуации — причём их частота в точности совпадает с порталом в [first_portal_3_system.GetName]. Несомненно, это ещё один неслыханно кощунственный портал флота Хаоса."
 wg_crisis_3.54.a:0 "Хлопот прибавилось"
 wg_crisis_3.54.a.tooltip:0 "§RПоявился новый портал Объединённого похода! §!"
 wg_crisis_3.55.name:0 "Третий портал"
 wg_crisis_3.55.desc:0 "В системе [third_portal_3_system.GetName] повторилась та же аномалия, что и в системах первых двух порталов; наши техники уже наловчились разбирать источник этих подпространственных колебаний……\n\nХотя, конечно, никто не хотел бы набивать руку на такой работе."
 wg_crisis_3.55.a:0 "Чёрт……"
 wg_crisis_3.55.a.tooltip:0 "§RХаос-отребье! §!"
 wg_crisis_3.56.desc:0 "Плохи дела: наша разведка только что доложила — Объединённый флот перебрасывает в вашу галактику ещё одну боевую групповую армию! Скорее стягивайте силы! Это не шутка: похоже, они вот-вот откроют ещё один портал!"
 wg_crisis_3.56.a:0 "???"
 wg_crisis_3.57.desc.a:0 "			§Y+ —  —  — +§!"
 wg_crisis_3.57.desc.b:0 "			§YМои воины, я с вами. §!"
 wg_crisis_3.57.desc.c:0 "(сонно)\nМожет, выдать тебе задание — ну, скажем, «убей 1000000 единственно истинных флагов»?"
 wg_crisis_3.57.a:0 "???"
 wg_crisis_3.57.b:0 "За §YБог-Императора§!!!"
 wg_crisis_3.58.desc.a:0 "			§Y+ —  —  — +§!"
 wg_crisis_3.58.desc.b:0 "			§Y§R Сила Мордесана§! слабеет — больше порталов ему не создать. §!"
 wg_crisis_3.58.desc.c:0 "Столько времени держались…… Суперпорт не даёт вам отпуска — так мы дадим: отдых вечный, ага.\nХватит слушать этот вздор……"
 wg_crisis_3.58.a:0 "Что это за психическое видение?"
 wg_crisis_3.58.a.response:0 "Мощная психическая энергия обрушивается на все разумы.\n\n			§Y+ —  —  — +§!"
 wg_crisis_3.58.b:0 "Я вернусь с победой!"
 wg_crisis_3.58.b.response:0 "			§Y+Я вернусь с победой+§!"
 wg_crisis_3.94.name:0 "Малый портал уничтожен"
 wg_crisis_3.94.desc:0 "Малый портал Объединённого похода в системе [small_portal_3_system.GetName] уничтожен силами [small_portal_destroyer.GetName] — теперь можно не опасаться, что хлынувшие из портала флотилии возникнут у нас в тылу."
 wg_crisis_3.95.desc:0 "Скажите, [root.GetRulerTitle][root.GetRulerName] сейчас свободен? Да-да, срочное дело……\n\n[root.GetRulerTitle]! Как хорошо, что вы на месте! Дело такое: у Объединённого флота вновь новое движение — они открыли малый портал и массово забрасывают туда малые флотилии. Координаты уже отправлены вам — будьте предельно осторожны!"
 wg_crisis_3.998.name:0 "Навигатор Объединённого похода"
 wg_crisis_3.998.desc:0 "В обломках портала Объединённого похода мы нашли навигатор — загадочное психическое устройство."
 wg_crisis_3.998.a:0 "Разберёмся на месте."
 wg_crisis_3.999.name:0 "Владения Объединённого похода"
 wg_crisis_3.999.desc:0 "Когда мы активировали навигатор Объединённого похода, ослепительное сияние поглотило всех.\n\n			§YВы исполнили свой долг и бились со мной плечом к плечу. §!"
 wg_crisis_3.999.a:0 "Неужели сам §YБог-Император§!!"
 wg_crisis_3.999.a.response:0 "			§YВ этой запредельной реальности вы можете и дальше быть моим клинком. §!"
 wg_crisis_3.999.b:0 "То есть это — новый театр войны?"
 wg_crisis_3.1000.name:0 "§YБог-Император-Адмирал§!"
 wg_crisis_3.1000.desc:0 "			§YИ да, и нет: вам предстоит вступить в бой — но не здесь. §!"
 wg_crisis_3.1000.a:0 "……"
 wg_crisis_3.1001.name:0 "§YБог-Император-Адмирал§!"
 wg_crisis_3.1001.desc:0 "			§YОдолев §Rбога Хаоса§!, вы сможете предстать предо мной и вступить в этот великий поход — поход по сверхмерным пространствам, охватывающий все вселенные, — чтобы истребить всех врагов. §!"
 wg_crisis_3.1001.a:0 "Новый Великий поход?"
 wg_crisis_3.1002.name:0 "§YБог-Император-Адмирал§!"
 wg_crisis_3.1002.desc:0 "			§YДа. Вы возвыситесь до существ, способных биться со мной плечом к плечу, и на полях сражений за гранью всякого воображения встретите несчётных противников — §Rбог Хаоса§! будет лишь первой остановкой. §!"
 wg_crisis_3.1002.a:0 "§RБог Хаоса§! — лишь первая остановка?"
 wg_crisis_3.1002.a.response:0 "			§Y§R Мордесан§! — лишь отблеск, символ жестокого круговорота вселенных. Истребить нужно не §Rего§! — а бесконечную злобу, что сень висит над всем сущим. §!"
 wg_crisis_3.1002.b:0 "Мы возвысимся?"
 wg_crisis_3.1002.b.response:0 "			§YВы доказали себя в боях, явив несравненную волю и мастерство, — вы заслужили это право. §!"
 wg_crisis_3.1002.c:0 "Мы……"
 wg_crisis_3.1003.name:0 "§YБог-Император-Адмирал§!"
 wg_crisis_3.1003.desc:0 "			§YЯ жду вашего выбора — но не торопитесь: у нас уйма времени всё обдумать. §!"
 wg_crisis_3.1003.a:0 "Мы согласны вступить в §HТрансмерный поход§!!"
 wg_crisis_3.1003.a.response:0 "			§YПрекрасно. Прыжковые двигатели для §HТрансмерного похода§! скоро передадут вам, а проводник вот-вот появится в ваших владениях — он станет вашим вожатым.\n\nОдним словом: добро пожаловать в §HОбъединение§!, мои §Hсёстры§!! §!"
 wg_crisis_3.1003.b:0 "Мы хотим узнать больше."
 wg_crisis_3.1003.b.response:0 "			§YЭто ваша воля и дух первооткрывателя — это хорошо. Я всё равно подарю вам прыжковые двигатели для §HТрансмерного похода§!: ищите ли новые тайны или вернётесь подле меня — я буду терпеливо ждать.\n\nОдним словом: желаю удачи, §Hсёстры§!! §!"
 wg_crisis_3.1003.c:0 "Нам нужно ещё подготовиться."
 wg_crisis_3.1003.c.response:0 "			§YКонечно: поход длиной почти в вечность и правда требует основательной подготовки. Я буду терпеливо ждать — свободно готовьте в галактике всё, что понадобится. §!"
 wg_crisis_3.1004.name:0 "Подготовка к вступлению в §HТрансмерный поход§!"
 wg_crisis_3.1004.desc:0 "Мы решили вступить в §HТрансмерный поход§!. Через несколько дней после этого решения явился наш вестник.\n\n§HКопьё Конца§!\n\nЭтот непостижимый для нас корабль, похоже, умеет править реальностью: ни один враждебный корабль не смеет оказать ему ни малейшего сопротивления… Тогда же вновь прозвучал голос §YБог-Императора-Адмирала§!."
 wg_crisis_3.1004.a:0 "Прекрасно"
 wg_crisis_3.10041.name:0 "§YБог-Император-Адмирал§!"
 wg_crisis_3.10041.desc:0 "			§YКопьё Конца уже отправлено в ваш мир: это ключ, пронзающий начало и конец и возвышающийся над мультивселенной. Разумеется, это ещё и чрезвычайно могучий корабль.\n\nЗавершите приготовления — и оно поведёт вас в мои владения…… §!"
 wg_crisis_3.10041.a:0 "Это…… что это?"
 wg_crisis_3.10041.a.response:0 "			§YЭто корабль, выкованный моей силой — достаточной, чтобы перековать всю вселенную. §!"
 wg_crisis_3.10041.b:0 "Мы принимаем проводника."
 wg_crisis_3.1005.name:0 "Наша судьба"
 wg_crisis_3.1005.desc:0 "Мы решили §Rузнать больше§!. С объединённым прыжковым двигателем мы можем отправиться в мир Объединения — или к другим галактикам. Нужно немного времени на приготовления — и можно покидать эту галактику.\n\nКак только мы уйдём, судьба этих звёздных краёв перейдёт к другим цивилизациям."
 wg_crisis_3.1005.a:0 "Что мы узнаем?"
 wg_crisis_3.1007.name:0 "§HТрансмерный поход§!"
 wg_crisis_3.1007.desc:0 "Мы будем сражаться плечом к плечу с §YБог-Императором-Адмиралом§!, карая всех врагов: нам неведом страх — мы обращаем клинки против бесконечной злобы."
 wg_crisis_3.1007.a:0 "За §YБог-Императора-Адмирала§!!"
 wg_crisis_3.1008.name:0 "Поиски неведомого"
 wg_crisis_3.1008.desc:0 "Флот, несущий всю нашу цивилизацию, отправился в неизведанное: мы будем исследовать вселенные и постигать всё.\n\nОставленные нами миры достанутся другим цивилизациям, а наши истории и легенды будут жить среди звёзд.\n\nОднажды мы найдём ответ."
 wg_crisis_3.1008.a:0 "Идём вперёд — с надеждой."
 wg_invasion_3_1_poi:0 "Портал"
 wg_invasion_3_1_poi_desc:0 "В системе [first_portal_3_system.GetName] обнаружено, как флот Хаоса непрерывным потоком выходит из портала. Пока портал не разрушен, подкрепления будут прибывать вновь и вновь."
 wg_invasion_3_2_poi:0 "Второй портал"
 wg_invasion_3_2_poi_desc:0 "В системе [second_portal_3_system.GetName] обнаружено, как флот Хаоса непрерывным потоком выходит из ещё одного портала. Пока портал не разрушен, подкрепления будут прибывать вновь и вновь."
 wg_invasion_3_3_poi:0 "Третий портал"
 wg_invasion_3_3_poi_desc:0 "В системе [third_portal_3_system.GetName] обнаружено, как флот Хаоса непрерывным потоком выходит из третьего портала. Пока портал не разрушен, подкрепления будут прибывать вновь и вновь."
 wg_invasion_3_5_poi:0 "Малый портал"
 wg_invasion_3_5_poi_desc:0 "Флот Хаоса через эти малые порталы непрерывно засылает малые флотилии, атакующие наш тыл. Нужно разрушить эти порталы — иначе подкрепления будут прибывать без конца."
 r_united_fleet_3:0 "Навигатор Объединённого похода"
 r_united_fleet_3_desc:0 "Навигатор, найденный в портале Объединённого похода, — загадочное психическое устройство; похоже, это проход, связанный с материальной вселенной."
 r_united_fleet_3_active:0 "Раз и навсегда покончить с угрозой Объединённого похода"
