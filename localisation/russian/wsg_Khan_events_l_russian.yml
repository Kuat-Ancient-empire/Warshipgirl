 wg_khan_dreadnought:0 "Дредноут хана"
 wg_khan_gate_debuff1:0 "Сильно повреждён"
 wg_khan_gate_debuff2:0 "Защита отключена"
 leader_trait_admiral_wg_khan:0 "Рабы-креветки"
 leader_trait_admiral_wg_khan_desc:0 "Великий хан и её верная помощница на деле были кладовщицами на прежних кораблях — командовать флотом им и правда тяжеловато."
 WG_KHAN:0 "Хан-Трещотка"
 WG_KHAN2:0 "Помощница-лежебока"
 weapon_type_tesla:0 "§YТесла§!"
 leader_trait_super_sukhbaatar:0 "Пробудившаяся Сухэ-Батор"
 leader_trait_super_sukhbaatar_desc:0 "Истинный Бог Войны Улан-Батора"
 leader_trait_khan_chronospere:0 "КД хроносдвигателя"
 leader_trait_khan_chronospere_desc:0 "Это сверхвременное устройство допилили до состояния «подкидывает подкрепления хана прямо из других измерений»…"
 leader_trait_khan_iron_curtain:0 "КД железного занавеса"
 leader_trait_khan_iron_curtain_desc:0 "Единственная слабость устройства — его нельзя включить навсегда"
 leader_trait_khan_iron_curtain_active:0 "§RЖелезный занавес активирован§!"
 leader_trait_khan_iron_curtain_active_desc:0 "Неуязвимость"
 leader_trait_khan_weather_control_device:0 "КД погодного контроллера"
 leader_trait_khan_weather_control_device_desc:0 "Игрушка Бога"
 leader_trait_khan_weather_control_device_active:0 "§RПогодный контроллер активирован§!"
 leader_trait_khan_weather_control_device_active_desc:0 "Внимание: гроза создана!"
 leader_trait_khan_psychic_dominator:0 "КД пси-доминатора"
 leader_trait_khan_psychic_dominator_desc:0 "Судя по названию — штука предельно зловещая"
 leader_trait_khan_psychic_dominator_active:0 "§RПси-доминатор активирован§!"
 leader_trait_khan_psychic_dominator_active_desc:0 "Будь един с Юри"
 galo_army:0 "Орда GALO"
 Khan_galodam:0 "Бешеный GALODAM"
 Khan_galodam_desc:0 "Взбесившийся от раздражения GALODAM: крушит всё заметное и всё, что его тронет."
 khan_ovo_boss_army:0 "Бешеный OVO"
 galo_army:0 "Орда GALO"
 galo_army_desc:0 "Взбесившийся от раздражения GALO: крушит всё заметное и всё, что его тронет."
 WG_KHAN_OUTERK_GATE:0 "Звёздные врата"
 wg_khan_outer_gate:0 "Врата Моэголии"
 wg_khan_outer_gate_DESC:0 "Странные врата; они, вообще-то, включены — но для доступа на ту сторону, похоже, нужен особый протокол."
 WG_KHAN_GALACTIC:0 "Врата Моэголии"
 WG_KHAN_GALACTIC_DESC:0 "Врата, ведущие в Моэголию"
 Need_the_allow_khan:0 "Нужен пропуск сотрудника"
 wg_khan_garbage_shipyard_1:0 "Доки хана"
 wg_khan_garbage_shipyard_1_DESC:0 "Прежде это был мусороперерабатывающий завод; Сухэ-Батор с Одином переделали его в доки и из груды обломков собрали смехотворный флот.\nПри разумной доводке доки принесут огромную пользу."
 wg_khan_garbage_shipyard_2:0 "Доки хана"
 wg_khan_garbage_shipyard_2_DESC:0 "Дальнейший апгрейд: переработка мусора системы и постройка кораблей эффективнее."
 wg_khan_getway:0 "В Моэголию"
 wg_khan_getway_DESC:0 "Врата в логово хана односторонне заблокированы; верим, что в обломках гуляющих флотов хана найдётся пропуск через врата."
 WG_KHAN_PARALYZED_SHIP_1:0 "Обездвиженный корабль"
 WG_KHAN_PARALYZED_SHIP_1_DESC:0 "После победы над флотом хана мы нашли корабль, загадочно обездвиженный. Учёные на борту, быть может, дадут ответ."
 WG_KHAN_PARALYZED_SHIP_2:0 "$WG_KHAN_PARALYZED_SHIP_1$"
 WG_KHAN_PARALYZED_SHIP_2_DESC:0 "После победы над флотом хана мы нашли корабль, загадочно обездвиженный. Высадка морпехов, быть может, даст ответ."
 WG_KHAN_PARALYZED_SHIP_3:0 "$WG_KHAN_PARALYZED_SHIP_1$"
 WG_KHAN_PARALYZED_SHIP_3_DESC:0 "После победы над флотом хана мы нашли корабль, загадочно обездвиженный. Разборка на базе, быть может, даст ответ."
 wg_Khan_chain_title:0 "Великий хан корабельных дев"
 wg_Khan_chain_desc:0 "Из врат внутри УланХто хлынули флоты: нападавшие — Сухэ-Батор и Один — именуют себя ханом и клянутся заставить расплатиться всю галактику."
 planet_Khan_occupied:0 "Разрушительные бешеные GALO"
 planet_Khan_occupied_desc:0 "Планета захвачена ордой бешеных GALO: они безостановочно крушат всё заметное."
 fe_damage_to_wg_khan:0 "Система электронного подавления"
 fe_damage_to_wg_khan_desc:0 "Эта система РЭБ, созданная на взломанном ИИ флота хана Сухэ-Батора, эффективно давит и парализует чисто ИИ-шные флоты хана — и даже перехватывает контроль.\n§YВ бою с флотами хана (кроме флота под прямым командованием Сухэ-Батора) вражеские корабли ежедневно получают§R чудовищно сильный дебафф§!"
 Khan_weapen_L:0 "Метатель BMB Хана"
 Khan_weapen_L_DESC:0 "Гигантская пушка, собранная из чего попало; безопасность — на нуле."
 Khan_weapen_T:0 "Урбанская пушка хана"
 Khan_weapen_T_DESC:0 "Мусорная пусковая пушка с дредноута хана."
 Khan_weapen_tesla_tower:0 "Катушка Теслы"
 Khan_weapen_tesla_tower_desc:0 "Учёные не в силах объяснить, как артефакт индустриальной эпохи несёт такой урон; но подозревают: подсоедини к ней человека в магнитной броне — и урон вырастет экспоненциально."
 Khan_weapen_prism_tower:0 "Призменная башня"
 Khan_weapen_prism_tower_desc:0 "Учёные не в силах объяснить, как эта вроде бы обычная оптика стреляет; но подозревают: несколько таких башен, питающих друг друга, — и урон растёт экспоненциально."
 Khan_weapen_ultimate_seal_cannon:0 "Абсолютная тюленья рогатка"
 Khan_weapen_ultimate_seal_cannon_desc:0 "Учёные даже не хотят объяснять смысл существования этой штуки.\n\nГоворят, приведённый в крайнюю ярость тюлень пробивает зубами эквивалент 50 километров брони…………"
 Khan_weapen_X:0 "Монстр-пушка (заряжается пробивными GALO)"
 Khan_weapen_X_desc:0 "Пушка некоей страны F с GALO в роли метательного заряда. Обшитые бронебойной сталью GALO заталкиваются в ствол и выстреливаются, испепеляя щиты и броню вражеских кораблей пастью…………"
 Khan_weapen_waterB_flak:0 "Активная защита «Снежная труха»"
 Khan_weapen_waterB_flak_desc:0 "Эти скорострелки окатывают подлетающего врага сверхвысоконапорной ледяной жижей с едкими примесями; воду поставляет драконий владыка по имени Труха. Говорят, его водоотдача выше, чем у некоего драконьего владыки Юкикадзэ."
 Khan_weapen_M:0 "Спаренная тяжёлая турболазерная пушка XX-9"
 Khan_weapen_M_desc:0 "Эти лазерные пушки были приварены к бортам ещё при постройке корпуса разрушителя — снять их нельзя."
 Khan_weapen_G:0 "Ракетный массив «Патриот»"
 Khan_weapen_G:0 "Ракетный массив «Патриот»"
 KHAN_CHRONOSHPERE:0 "Хроносдвигатель"
 KHAN_CHRONOSHPERE_DESC:0 "Механизм выглядит до-космической эпохой, но внутри — поразительно продвинут. Даже с нашими сверхсветовыми двигателями мы не умеем того, что умеет он: мгновенно перемещать объекты."
 KHAN_TESLA_TROOPER:0 "Пехотинец-тесловец"
 KHAN_TESLA_TROOPER_desc:0 "Здоровяк в тяжёлой броне с дуговым излучателем Теслы; цель у него, похоже, одна… заряжаться."
 KHAN_IRON_CURTAIN:0 "Железный занавес"
 KHAN_IRON_CURTAIN_desc:0 "Таинственный генератор по-настоящему несокрушимого поля. В отличие от щитов — это истинная стена; разве что ждать, пока поле спадёт, либо разбить генератор.\n§YВ начале боя: 5 дней ['concept_wg_super_protect']§!"
 Khan_star_destroyer_armor:0 "Имперская полимер-стальная броня"
 Khan_star_destroyer_armor_desc:0 "Мощная броня, вросшая в обшивку разрушителя; не снимается."
 KHAN_SHIP_AURA:0 "Погодный контроллер"
 KHAN_SHIP_AURA_desc:0 "Диковинный прибор управления погодой в атмосфере; его, кажется, доработали до контроля космической среды — теперь он творит системные грозы, ощутимо вредящие приборам и щитам врага."
 aura_lighting_storm_1:0 "Гроза"
 aura_lighting_storm_2:0 "Электромагнитный импульс"
 KHAN_PSYCHIC_DOMINATOR:0 "Пси-доминатор"
 KHAN_PSYCHIC_DOMINATOR_desc:0 "Зловещая машина, похоже, подчиняет разум всех существ в радиусе; при включении бьёт мощнейшая псионическая волна, сметающая всё вокруг."
 aura_psychic_dominator_1:0 "Пси-ударная волна"
 aura_psychic_dominator_2:0 "Пси-разряд"
 WG_Khan_name:0 "Великий хан Сухэ-Батор и Один"
 wg_khan.4.name:0 "Общегалактическая передача"
 wg_khan.4.desc:0 "Все страны галактики приняли передачу из врат внутри УланХто; также есть доклады об исполинских всплесках энергии в этой системе."
 wg_khan.4.a:0 "Принять сигнал"
 wg_khan.5.name:0 "Великий хан Сухэ-Батор и Один"
 wg_khan.5.desc:0 "Глупые жители галактики, не ждали?! Я, Великий хан, Сухэ-Батор — и с моей правой рукой Одином — мы вернулись!\n\nПроклятые девы заплатят за то, что выгнали нас из родного Порта!\nФлот Глубинных заплатит за то, что бросил нас без капли жалости!\nПрочие страны заплатят за то, что не пришли на помощь!\n\nИтого! Вы все получите безжалостные залпы и наш непобедимый флот!!!"
 wg_khan.5.a:0 "Сухэ… Батор?? Один?? Хан?!"
 wg_khan.5.b:0 "Что вообще за типажи?"
 wg_khan.5.c:0 "Девы и правда — вечный источник нестабильности в галактике"
 wg_khan.6.desc_01:0 "Великий хан и её правая рука сейчас очень заняты."
 wg_khan.6.desc_02:0 "А, девы: пришли каяться Великому хану? Не приму, нет."
 wg_khan.6.desc_03:0 "А, дорогие сородички: бросить родных сестёр — приятно? Мне вот сейчас очень неприятно."
 wg_khan.6.desc_06:0 "Вы тоже глубинные девы?! Неважно… вам тоже предстоит суд!"
 wg_khan.6.a:0 "А вы когда-либо просили нас о помощи?"
 wg_khan.6.a.response:0 "Хмф, не строй невинность: когда наш корабль сломался, мы разослали сигналы бедствия вокруг — и никто не ответил! Ваша бессердечность и создала сегодняшнего хана!"
 wg_khan.6.b:0 "Да ваш сигнал просто не дошёл!"
 wg_khan.6.b.response:0 "Неважно! Даже если сигнал не дошёл — вы обязаны были принять наше бедствие телепатией! Чтобы выжить, нам пришлось искать еду на этой свалке! Вы знаете, каким мерзким на вкус является просрочка с четырёхмиллионным сроком годности??!\nНо теперь неважно: непобедимое воинство хана двинулось в великий поход!!"
 wg_khan.6.c:0 "Чего вы, в конце концов, хотите?"
 wg_khan.6.c.response:0 "Великому хану нужна вся галактика!"
 wg_khan.6.d:0 "Видимо, вразумит вас только сила"
 wg_khan.6.d.response:0 "Ха-ха, попробуйте! Воинство хана ой какое сильное!"
 wg_khan.6.e:0 "Вы… глубинные девы, верно?!"
 wg_khan.6.e.response:0 "Когда-то! Теперь зовите нас Великий хан и её верная помощница! Глупые глубинные девы поплатятся за бессердечие — и вы тоже!"
 wg_khan.6.f:0 "Что с вами случилось? Что за Хан?"
 wg_khan.6.f.response:0 "Проклятый Первый флот Глубинных, спасаясь, безжалостно бросил наши корабли. Мы уже почти сдавались — и нашли это святое место. Я поняла: это испытание богов; мне суждено стать ханом и исполнить предназначение! Теперь час вашего суда, муравьи.\nКстати: чтобы выжить, нам пришлось искать еду на этой свалке! Вы знаете, каким мерзким на вкус является просрочка с четырёхмиллионным сроком годности??!!"
 wg_khan.6.g:0 "Прекратите вашу резню"
 wg_khan.6.g.response:0 "Резню?! А когда вы выгоняли нас из дома, вы, помнится, нежностями не баловали! Мы лишь вернём пережитое — с процентами!!"
 wg_khan.6.h:0 "Придётся снова вас одолеть"
 wg_khan.6.h.response:0 "Ха-ха! Божественное воинство хана другого мнения!"
 wg_khan.6.i:0 "§YAP36 AP37§!, доложить обстановку!"
 wg_khan.6.i.response:0 "Не смейте командовать нами этими дурацкими позывными! Зовите нас Великий хан и её верная помощница!"
 wg_khan.6.j:0 "Что с вами случилось?"
 wg_khan.6.j.response:0 "Вы, трусливые глупцы, безжалостно бросили нас на произвол судьбы!! Но боги оказались на моей стороне — мы нашли это святое место; мне суждено стать ханом и исполнить предназначение! Теперь час вашего суда, муравьи."
 wg_khan.6.k:0 "§YAP36 AP37§!, аномалия"
 wg_khan.6.k.response:0 "Это ВЕЛИКИЙ ХАН и её верная помощница. Скоро моим могучим флотом я заставлю вас поменять лексикон навсегда.\n\nПусть и вы отведаете той самой просрочки с четырёхмиллионным сроком годности!"
 wg_khan.6.l:0 "Аномальные юниты подлежат утилизации"
 wg_khan.6.l.response:0 "Ха-ха! Божественное воинство хана покажет вам, кто истинный владыка Глубинных!"
 wg_khan.6.n:0 "Кто вы?"
 wg_khan.6.n.response:0 "ВЕЛИКИЙ ХАН и её верная помощница!!"
 wg_khan.6.o:0 "Зачем вы это делаете? Мы вам ничего не сделали!"
 wg_khan.6.o.response:0 "Вы не из тех глубинных предателей, что бросили нас, — но вы проигнорировали наш зов о помощи, значит, вы — из тех мерзавцев, которым было плевать на наши жизни!! А потому вам тоже предстоит суд!!!"
 wg_khan.6.p:0 "Мы вообще не получали никакого сигнала бедствия"
 wg_khan.6.p.response:0 "Неважно! Даже если сигнал не дошёл — как глубинные девы, вы обязаны были мгновенно почувствовать нас телепатией! Чтобы выжить, нам пришлось искать еду на этой свалке! Вы знаете, каким мерзким на вкус является просрочка с четырёхмиллионным сроком годности??!\nНо теперь неважно: непобедимое воинство хана двинулось в великий поход!!"
 wg_khan.6.q:0 "Что ж — война"
 wg_khan.6.q.response:0 "Ха-ха! Божественное воинство хана покажет вам, какими должны быть настоящие глубинные девы!!!"
 wg_khan.6.desc_04:0 "Что угодно, мои дорогие подданные?"
 wg_khan.6.desc_05:0 "Вы пришли присягнуть высокородному хану?"
 wg_khan.6.s.a:0 "Мы лишь пришли полюбоваться вашим величием"
 wg_khan.6.s.a.response:0 "А… чего смотреть? Ну раз любишь — смотри вдоволь."
 wg_khan.6.s.b:0 "Мы по-прежнему верны высокородному хану"
 wg_khan.6.s.b.response:0 "Прекрасно, Хан чувствует вашу верность; не забывайте присылать дань. Что-то ещё?"
 wg_khan.6.s.c:0 "Вы не можете ничего сделать с бешеными GALO?"
 wg_khan.6.s.c.response:0 "А? Это…\n§BОдин: рубильник объединён с флотским ИИ, никак не выключить (шёпотом)\n§! Э-э… вы не можете разобраться сами?! Бездельники!"
 wg_khan.6.s.d:0 "У нас первосортная дань — не взглянете ли?"
 wg_khan.6.s.d.response:0 "Сашими? Прекрасно, Хан принимает."
 wg_khan.6.s.d.tooltip:0 "Тюленя, принесённого вами, нарезали сашими и поднесли хану; конечно, я не скажу, что этот вредный тюлень был ядовит £sr_huaji£"
 wg_khan.6.s.e:0 "Я больше не подхалим! Сухэ-Батор!"
 wg_khan.6.s.e.response:0 "Красиво сказано — но бессмысленно! Вы всё равно преклоните колени передо мной, Великим ханом Сухэ-Батор!"
 wg_khan.6.s.f:0 "Предатели! Мы больше не станем с вами якшаться"
 wg_khan.6.s.f.response:0 "С чего ты взял, что сможешь одолеть хана? Тебе предстоит встреча с БОГОМ, с бог… точнее — с сильнейшим за историю галактики ханом Сухэ-Батор! Твоя звезда смерти уже сияет в небесах!"
 wg_khan.6.s.g:0 "Ничего больше, высокородный Хан."
 wg_khan.6.s.g.response:0 "Хорошо, Хан отпускает вас."
 wg_khan.6.m:0 "Остановитесь, можно поговорить! §R(капитуляция)§!"
 wg_khan.28.desc:0 "А где были вы, когда мы жрали просрочку из консервов на свалке?! Только теперь заговорили? Сородичи…\n\nА — у хана идея! Вы будете ежегодно поставлять хану лучшее… там, абалон, гребешок, голотурию… короче всё самое вкусное — хану!\n§BОдин: э-э, флоту тоже нужна энергия (тихо напоминает)\n§! И… и ещё — обеспечьте нашему флоту… это… плату за… эксплуатацию!\nИтак, ваш ответ, сородичи — "
 wg_khan.28.a:0 "Что ж — ответ только один"
 wg_khan.28.a.tooltip:0 "Вы присягнёте хану Сухэ-Батор и Одину и будете ежегодно отчислять ресурсы."
 wg_khan.28.a.response:0 "Ха-ха-ха, с вами точно не соскучишься! Решено: не уничтожаю! Ждите — Хан завоюет всю галактику!"
 wg_khan.28.b:0 "Мы не можем согласиться"
 wg_khan.28.b.response:0 "Прекрасно — примите гнев Великого хана!"
 wg_khan.29.desc:0 "Время дани! Где дань хана?!"
 wg_khan.29.a:0 "Вот доля этого года — изволите?"
 wg_khan.29.a.response:0 "Отлично, подданные хана!\n(Ох, сколько вкуснятины, как пахнет…)"
 wg_khan.29.b:0 "Дань съел я; тебя разнесу в трёхдневный срок"
 wg_khan.29.b.response:0 "Чего?! Ты… вы-вы-вы! Не думайте, что это вам сойдёт с рук! Хан возьмёт свой золотой флот и перебьёт вас всех!"
 wg_khan.29.z:0 "Постойте: сумма не та, что договаривались?"
 wg_khan.29.z.response:0 "А?… Не твоё дело, плати! Не то в трёхдневный срок порешу и прах твой развею!"
 wg_not_enough_food_tribute:0 "Запас §Y$food$§H на складе§! должен быть не менее§Y [ROOT.tribute_food_required]"
 wg_not_enough_energy_tribute:0 "Запас §Y$energy$§H на складе§! должен быть не менее§Y [ROOT.tribute_energy_required]"
 wg_not_enough_consumer_goods_tribute:0 "Запас §Y$consumer_goods$§H на складе§! должен быть не менее§Y [ROOT.tribute_consumer_goods_required]"
 wg_khan.8.desc:0 "Глупые жители галактики!!! Второй великий флот хана прибыл! Отчаяние встречайте!"
 wg_khan.8.a:0 "Закрыть связь"
 wg_khan.9.name:0 "Ветхость"
 wg_khan.9.desc:0 "По свидетельствам, флот хана Сухэ-Батор из-за безумных конструкций и глубокой старости начал терять боеспособность.\nЗабавнее: флот хана ведёт ИИ, а корабли рассчитаны на экипаж — полную мощь им не выжать, а без ухода износ летит.\nБоевые доклады это подтверждают."
 wg_khan.9.a:0 "Это хорошая новость"
 wg_khan.10.name:0 "Глубокая старость"
 wg_khan.10.desc:0 "Из свежих докладов ясно: состояние флота хана ухудшается, боеспособность падает!"
 wg_khan.10.a:0 "Сама виновата"
 wg_khan.11.name:0 "Флот-антиквариат"
 wg_khan.11.desc:0 "Мы достали обломки кораблей хана: по анализу, обломки старше нашей цивилизации! Многое — четыре-пять миллионов лет. Флот хана собран из древних артефактов."
 wg_khan.11.a:0 "Таким кораблям место в музее"
 wg_khan.12.name:0 "Сильные повреждения"
 wg_khan.12.desc:0 "Доклады гласят: флот хана разбит, и процесс не остановлен; у части кораблей, по наблюдениям, пошли структурные разломы."
 wg_khan.12.a:0 "Пора наносить контрудар"
 wg_khan.13.name:0 "Защита отключена"
 wg_khan.13.desc:0 "Флот хана больше не держит износ: щиты вырубились полностью, и без защиты корпуса получают страшные повреждения. Флот хана теперь — труха.\nКонструкторы доков считают: даже без нашего вмешательства флот развалится через пару лет."
 wg_khan.13.a:0 "Смешно"
 wg_khan.14.name:0 "Падение флота хана"
 wg_khan.14.desc:0 "Наконец мародёрствующий флот хана Сухэ-Батора уничтожен или развалился сам — все страны выдохнули.\n\nЗа 20 лет новых флотов не явилось: у Сухэ-Батор с прихвостнями, видимо, уже нет средств строить новые."
 wg_khan.14.a:0 "Все выдохнули!"
 wg_khan.16.name:0 "Флот хана разбит"
 wg_khan.16.desc:0 "Флот Сухэ-Батор оказался далеко не так грозен, как она трубила: мародёры галактики обратились в космический мусор.\n\nПодкреплений за всё время — ноль: у Сухэ-Батор с прихвостнями, видимо, нет средств строить новые флоты."
 wg_khan.16.a:0 "Великолепно"
 wg_khan.17.name:0 "Разблокировка врат хана"
 wg_khan.17.desc:0 "С развалом флота хана у нас дошли руки пошарить в этих летающих антикварных кораблях в поисках способа войти во врата Моэголии."
 wg_khan.17.a:0 "Немедленно расследовать"
 wg_khan.18.name:0 "Доступ получен!"
 wg_khan.18.desc:0 "В обломках нашлась зацепка: электронный код под именем§Y «пропуск сотрудника мусоросборочного завода доков Куат»§! — корабль с этим кодом проходит заблокированные врата беспрепятственно.\n\nПолагаем, Сухэ-Батор с Одином нашли этот код, прошли врата и из предназначенных на утилизацию старых кораблей собрали свой смехотворный флот."
 wg_khan.18.a:0 "Флот — через врата: спустить с этих двоих шкуру"
 wg_khan.21.name:0 "Падение Великого хана"
 wg_khan.21.desc:0 "На днях§Y [WG_Khan_killer_country.GetName]§! объявило на всю галактику: засевший в Моэголии флот хана разбит их флотом — источник нестабильности искоренён полностью."
 wg_khan.21.a:0 "Великолепно"
 wg_khan.23.name:0 "Убийство хана"
 wg_khan.23.desc.a:0 "Флот хана уничтожен нами; прочие корабли системы без контрольного терминала встали — источник нестабильности искоренён полностью.\n\nКак победители, мы обчистили поле боя и нашли спасательные капсулы Сухэ-Батор и Один.\nИз допроса: при бегстве Первого флота Глубинных их повреждённые корабли отстали и, чудом, попали в эту мусорную систему — где починили или собрали корабли, списанные миллионы лет назад.\n\nТеперь обе взяты — ждать суда."
 wg_khan.23.desc.b:0 "Флот хана уничтожен нами; прочие корабли системы без контрольного терминала встали — источник нестабильности искоренён полностью.\n\nКак победители, мы обчистили поле боя и нашли спасательные капсулы Сухэ-Батор и Один.\nОтстав от флота, они с Одином чудом попали в Моэголию и собрали там мусорный флот.\n\nТеперь обе взяты — ждать суда."
 wg_khan.23.desc.c:0 "Флот хана уничтожен нами; прочие корабли системы без контрольного терминала встали — источник нестабильности искоренён полностью.\n\nКак победители, мы начали обчищать поле боя, но этот мусорный хаос быстро отбил желание искать дальше."
 wg_khan.23.a:0 "Обязать исправительными работами"
 wg_khan.23.b:0 "Промыть им мозги и вернуть на прежние посты"
 wg_khan.23.c:0 "Если честно — да"
 wg_khan.25.name:0 "Система дронов"
 wg_khan.25.desc:0 "Дроны УланХто заметно отличаются от шахтёрских дронов других мест; здесь и несколько никогда не виданных гигантов. К счастью, агрессии они не выказывают.\n\nМы также заметили активированные врата — куда ведут, неизвестно."
 wg_khan.25.a:0 "Странно"
 wg_khan.26.desc:0 "Ты… как ты… как вы прошли через врата?! Проклятье! Вы посмели вторгнуться в святыню хана!! Я… я вас не боюсь!! На бой насмерть!"
 wg_khan.26.a:0 "Закрыть связь"
 wg_khan.101.name:0 "Адский десант GALO"
 wg_khan.101.desc:0 "После успешного выведения части нашей орбитальной обороны флот хана над колонией [Root.GetName] сбросил на неё… GALO!!!\nС десятков километров эти GALO рухнули целёхонькими — и принялись крушить!!!"
 wg_khan.101.desc.a:0 "Флот хана над [Root.GetName] после выведения новых батарей планетарной обороны скинул ещё GALO. Не действуем — и [Root.GetName] скоро утонет в GALO!"
 wg_khan.101.a:0 "А где флот Хеллов?"
 wg_khan.102.name:0 "$wg_khan.101.name$"
 wg_khan.102.desc:0 "Флот хана над [Root.GetName] после выведения новых батарей планетарной обороны скинул ещё GALO. Оборона снова и снова докладывает: без подкреплений армию сомнёт волнами GALO."
 wg_khan.102.a:0 "Мы обязаны что-то сделать"
 wg_khan.103.name:0 "Кошмар"
 wg_khan.103.desc:0 "«Они накинули ещё тяжёлой пехоты! Без подкреплений нам конец!!» — кричит в эфир командующий обороной [Root.GetName]; вперемешку — паника горожан: «За гигантскими GALO………… там… там…»\n\n§RГИГАНТСКИЙ КВИНСИ!!!! §!"
 wg_khan.103.desc.b:0 "Наконец, с падением последней орбитальной батареи, флот хана скинул финальную партию гигантских GALO и исполинского Квинси-призрака. Всё, к чему они прикасались, сровнялось с землёй — остановить их на колонии больше нечем."
 wg_khan.103.a:0 "Ах… это…"
 wg_khan.105.name:0 "Гарнизон [invaded_planet.GetName] разбит"
 wg_khan.105.desc:0 "Гарнизон [invaded_planet.GetName] героически бился с GALO, но число и качество взяли своё. Остатки жителей экстренно эвакуированы в убежища —§Hценой сильного падения производства. §!"
 wg_khan.106.name:0 "[Root.GetName] разрушается"
 wg_khan.106.desc:0 "С разгромом армии на [Root.GetName] сброшенные туда бешеные GALO и тюленекун принялись крушить без стеснения! Наши чиновники на местах докладывают: без подкреплений большинство городов вернётся к состоянию первых лет колонизации."
 wg_khan.106.tooltip.a:0 "К счастью, GALO не нанесли [Root.GetName] заметного урона."
 wg_khan.107.name:0 "Захватчики на [invaded_planet.GetName] вычищены"
 wg_khan.107.desc:0 "Наша собранная армия высадилась на [invaded_planet.GetName] и в тяжелейших боях вычистила всех бешеных GALO и леопардовых кунов! Жизнь колонии входит в колею."
 wg_khan.108.name:0 "Вторжение на [invaded_planet.GetName] отражено"
 wg_khan.108.desc:0 "Орбитальный десант GALO поразил гарнизон колонии, но они героически отбились. Командование, впрочем, справедливо замечает: пока флот хана цел — десанты повторятся. Флот хана надлежит уничтожить."
 wg_khan.108.a:0 "Рано расслабляться."
 wg_khan.120.name:0 "GALO притихли"
 wg_khan.120.desc:0 "Сброшенные ханом GALO после полного разгрома Сухэ-Батор внезапно успокоились; они, как и прежние найденные GALO, высокоразумны и трудоспособны. Разрешите — и мы легко приручим оставшихся на наших планетах GALO в работники."
 wg_khan.120.a:0 "Нет — нарезать их на ломтики"
 wg_khan.120.a.tooltip:0 "Все оставшиеся на колониях GALO нарезаны и дали гору еды."
 wg_khan.120.b:0 "Пусть отработают вину"
 wg_khan.120.b.tooltip:0 "Все оставшиеся GALO приручены: колонии получили§H 3 жителей-GALO§!"
 wg_khan.200.name:0 "Обездвиженный корабль"
 wg_khan.200.desc:0 "Победив в бою у [FROMFROM.Solar_System.GetName], экипажи заметили вражеский корабль, будто парализованный: двигатели, орудия — всё мёртво; он одиноко дрейфует среди обломков. Нам доложили."
 wg_khan.200.desc.b:0 "Победив в бою у [FROMFROM.Solar_System.GetName], командующая§H [FROMFROM.Leader.GetName]§! заметила вражеский корабль, будто парализованный: двигатели, орудия — всё мёртво; он одиноко дрейфует среди обломков. Она доложила нам."
 wg_khan.200.a:0 "Послать учёных на борт"
 wg_khan.200.b:0 "Послать морпехов на досмотр"
 wg_khan.200.c:0 "Отбуксировать на базу для исследований"
 wg_khan.201.name:0 "Просроченный ИИ-корабль"
 wg_khan.201.desc:0 "Под прикрытием охраны наши учёные поднялись на борт. Поиск команды ничего не дал; зато в капитанской каюте один из них нашёл бесконечно перезапускающийся экран с ошибками. §H[ROOT.Leader.GetName]§! подлатали систему и взяли корабль под контроль. §H[ROOT.Leader.GetName]§! объясняет: ИИ не грузился из-за проблем с обновлением; этот баг, примени в системе РЭБ, парализует флот хана Сухэ-Батор."
 wg_khan.201.tooltip:0 "Корабль хана вошёл в состав вашего флота"
 wg_khan.202.name:0 "Просроченный ИИ"
 wg_khan.202.desc:0 "Разобрав корабль на базе, наши люди установили причину паралича.\nКорабль управлялся флотским ИИ, но по проекту требовал сотни обученных моряков для обслуживания и коррекции. Ему добавили пару простых команд — и бросили в бой. Без ухода и понимания конструкции ИИ не обновился и ушёл в бесконечный ребут — полный паралич.\nНаши электронщики: примени этот баг в РЭБ — и корабли хана будут падать, качнув чашу весов в нашу сторону."
 wg_khan.213.name:0 "Парализованные корабли хана"
 wg_khan.213.desc:0 "В свежем бою у [FROMFROM.Solar_System.GetName] наши новенькие глушилки парализовали корабли хана — победа!\nПосле боя экипажи взяли парализованные корабли под контроль: трофеи пойдут в контрудар по хану!"
 wg_khan.213.tooltip:0 "Флот из кораблей хана вошёл в ваше командование"
 wg_khan.299.name:0 "Встреча с сильным врагом"
 wg_khan.299.desc:0 "Гарнизона, как мы ждали, в системе не оказалось — зато дрейфует исполинский корабль. Все экипажи чуют недоброе: от того корабля тянет тяжёлым духом."
 wg_khan.299.a:0 "Боевая готовность №1!"
 wg_khan.310.name:0 "Падение звёздного разрушителя"
 wg_khan.310.desc:0 "После яростного боя мы обездвижили исполинский разрушитель. Мы уверены: Хан прячется именно там — пора слать морпехов на арест."
 wg_khan.310.a:0 "Утверждаю операцию"
 wg_khan.311.name:0 "Пустой разрушитель"
 wg_khan.311.desc:0 "Морпехи вошли через выхлоп и взяли корабль — но внутри, кроме бессознательных Сухэ-Батор и её помощницы Один, никого. Сам разрушитель никак не удалось ни запустить, ни подчинить."
 wg_khan.311.a:0 "Сухэ-Батор — на суд; собираемся"
 wg_khan.311.b:0 "Промыть мозги и вернуть на посты"
 wg_khan.311.c:0 "Уничтожить обеих вместе с их кораблём — в космический мусор"
 WG_KHAN_INVADE_STAR_DESTROYER:0 "Вторжение на звёздный разрушитель"
 WG_KHAN_INVADE_STAR_DESTROYER_DESC:0 "Для ареста хана нужно послать морпехов на борт. Корабль так огромен, что потребуется минимум полк морпехов."
 wg_khan.312.name:0 "Неизвестная передача"
 wg_khan.312.desc:0 "Когда морпехи уже уходили, один внимательный боец уловил звуки из рубки: с кораблём связалась неизвестная передача."
 wg_khan.312.a:0 "Подслушать"
 wg_khan.313.desc:0 "«Говорила же: напичкать его всеми этими хреновинами — обязательно рванёт! Мой ригинг-а-а-а»\n«Не-не, багов быть не могло — я же своими руками…»\n«Но связи нет… а… а это ещё кто?»\n«ВОК! Не жми ту кнопку! Дура…»\nШ-ш —  — Ш-ш —  — "
 wg_khan.313.a:0 "Что произошло??"
 wg_khan.314.name:0 "Секунда до…"
 wg_khan.314.desc:0 "После обрыва передачи корабль внезапно ожил. Мы уж приготовились снова биться с монстром — но наши морпехи не растерялись и через ОС взяли разрушитель под контроль. Похоже, на той стороне перезагрузили ИИ корабля — мы и успели вклиниться."
 wg_khan.314.a:0 "Молодцы, отлично!"
 wg_khan.321.name:0 "Исчезнувший разрушитель"
 wg_khan.321.desc:0 "Вернувшись в систему [FROM.GetName], наш флот обнаружил: дрейфовавший там разрушитель исчез — вместо него старые рухляди хана — будто они поменялись местами…"
