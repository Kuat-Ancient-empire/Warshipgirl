l_russian:

 wg_shimakaze:0 "Симакадзэ"
 wg_shimakaze.1.title:0 "Странная новая дева"
 wg_shimakaze.1.desc:0 "Недавно доктор Юбари, вернувшись в лабораторию физики высоких энергий, нашла на полу без сознания корабельную деву — как выяснилось, просто голодную. Когда та очнулась, мы узнали всю историю. Её зовут Симакадзэ, она из мира в другом пространстве-времени: месяц назад её затянуло в лабораторию червоточина из эксперимента доктора Юбари, но больше о том мире она не помнит ничего. Пока доктор Юбари была занята сбором данных и закрытием лаборатории, Симакадзэ продержали взаперти трое суток. Из чувства вины доктор Юбари водила её по Порту и купила ей новый наряд. Несколько дней назад Симакадзэ через секретаря выразила желание вступить в Порт, и после проверки секретарь удовлетворил просьбу."
 wg_shimakaze.1.a:0 "Новая дева в наших рядах? Это же замечательно!"
 wg_shimakaze.2.desc:0 "Здравствуйте, я Симакадзэ, приятно познакомиться. А… нет, я — Симакадзэ, головной корабль типа «Симакадзэ». Здравствуйте. Не нужно столь официально? Спасибо. Тогда — прошу вашей поддержки и впредь. Ой, снова заговорила формально… хе-хе, ошибочка."
 wg_shimakaze.2.a:0 "Добро пожаловать, Симакадзэ-тян."
 wg_shimakaze.3.desc:0 "Если есть что-то, что Симакадзэ может сделать, — скажите! Доставить что-нибудь, помочь — что угодно!"
 wg_shimakaze.3.a:0 "Симакадзэ-тян, разбери документы адмирала"
 wg_shimakaze.3.b:0 "Симакадзэ-тян, помоги доктору Юбари"
 wg_shimakaze.3.c:0 "Симакадзэ-тян, встань во главе флота"
 wg_shimakaze.3.d:0 "Симакадзэ-тян, возглавь сухопутные войска"
 wg_shimakaze.3.e:0 "Поболтать с Симакадзэ"
 wg_shimakaze.3.f:0 "Провести обряд обручения с Симакадзэ"
 wg_shimakaze.5.desc:0 "Адмирал… пора спать… Симакадзэ уже так хочется спать… хрррр"
 wg_shimakaze.8.desc:0 "Нет… не хочу заканчивать вот так…!"
 wg_shimakaze.8.tooltip:0 "Симакадзэ в тяжёлом повреждении — потребуется время на восстановление"
 wg_shimakaze_recovery_cd:0 "Симакадзэ-котёнок в купании…… нельзя делать странные вещи!"
 wg_shimakaze_recovery_cd:0 "Симакадзэ-котёнок в купании…… нельзя делать странные вещи!"
 wg_shimakaze.9.desc:0 "С добрым утром, адмирал! Рассвет! Пора вставать. Ну что — и сегодня рассчитываю на тебя."
 wg_shimakaze.9.tooltip:0 "Симакадзэ восстановилась после тяжёлого повреждения"
 wg_shimakaze.30001.desc:0 "Как здорово, когда тебя хвалят! А… адмирала редко хвалят? Потому что то, что он делает, — само собой разумеется? Понятно… тогда пусть Симакадзэ похвалит тебя! Э? Не хочешь поглаживаний? Ну ладно…"
 wg_shimakaze.30002.desc:0 "Спрашиваешь, как работает торпедный аппарат Симакадзэ? Примерно как запуск палубной авиации у авианосцев, наверное? Просто скажешь ригингу — так и так — и всё. С практикой можно и движения посложнее. Мм, это оборудование — гордость Симакадзэ!"
 wg_shimakaze.30003.desc:0 "Я часто бегаю наперегонки с Ле Фантаск-тян. Она достойный соперник — мы всегда наравне. Чтобы подготовиться к следующему забегу, выйду пробежаться. Адмирал, составишь компанию?"
 wg_shimakaze.30004.desc:0 "Когда я с адмиралом, на душе становится так легко. Тепло и щекотно — удивительно."
 wg_shimakaze.30005.desc:0 "В груди полно нежности, но произнести это вслух — стыдно. Поэтому… можно возьмёшь меня за руку? Э-хе-хе, как счастлива…"
 wg_shimakaze.30006.desc:0 "Как удобно сидеть у адмирала на коленях. Э-хе-хе, это персональный VIP-место Симакадзэ."
 wg_shimakaze.30007.desc:0 "Адмирал такой высокий! Симакадзэ даже на цыпочки — и то не дотянуться. Как завидно. Э? На плечи…? У-у, немного стыдно. Н-но только один раз… Уааа, как высоко! Хе-хе, весело!"
 wg_shimakaze.30008.desc:0 "Симакадзэ когда-то хотела стать сакурой — ради улыбок всех. Но теперь я хочу быть сакурой, что цветёт для одного-единственного человека. Хочу, чтобы он смотрел только на меня. Адмирал… нельзя?"
 wg_shimakaze_talk_return:0 "Назад"
 wg_shimakaze_talk_exit:0 "Выход"
 wg_shimakaze.30010.desc:0 "Документы? Доверь мне — управлюсь вмиг!"
 wg_shimakaze.30011.desc:0 "Кажется, в исследовательском отделе что-то затевают — так интересно! Передать эту заявку доктору Юбари? Ага, бегу!"
 wg_shimakaze.30012.desc:0 "Верю, что эта битва принесёт кому-то улыбку… Симакадзэ — к бою!"
 wg_shimakaze.30013.desc:0 "Ради чужих улыбок Симакадзэ будет сражаться!"
 wg_shimakaze.30101.desc:0 "Шоколад… адмиралу. От меня. Съешь?… Вкусно? Слава богу."
 wg_shimakaze.30102.desc:0 "Соединиться с Симакадзэ…? Ваа, напугал. Но я так рада… с адмиралом Симакадзэ всегда улыбается. А адмирал улыбается с Симакадзэ? Вот как — значит, мы замечательная пара. Хе-хе, как хорошо… больше всего люблю адмирала!"
 wg_shimakaze.30102.a:0 "§YЗаключить обручение с Симакадзэ. §!"
 wg_shimakaze.30102.a.tooltip:0 "В должности командующего Симакадзэ получает черту ['leader_trait:leader_trait_wg_shimakaze_legend_admiral'], дающую растущий с числом кораблей флота §Y$mod_weapon_type_explosive_weapon_damage_mult$§!§G бонус§!"
 wg_shimakaze.30201.desc:0 "У меня есть чай от Тайхо-сан. Адмирал, отдохни и выпей со мной."
 wg_shimakaze.30201.a:0 "Спасибо, Симакадзэ-тян (гладит по голове)"
 wg_shimakaze.30203.desc:0 "Та-та, я принесла угощение! Симакадзэ хочет поболтать с адмиралом за вкусным… можно? Тогда я заварю чай!"
 wg_shimakaze.30205.desc:0 "Иногда ночью не спится… так одиноко. Адмирал, обнимешь Симакадзэ покрепче? Мм, как тепло…"
 leader_trait_official_wg_shimakaze_happiness:0 "Радость-девочка"
 leader_trait_official_wg_shimakaze_happiness_desc:0 "Глядя на живую и милую Симакадзэ-тян, даже тяжёлая работа становится легче"
 leader_trait_scientist_wg_shimakaze_tech:0 "Наставничество доктора Юбари"
 leader_trait_scientist_wg_shimakaze_tech_desc:0 "Под руководством доктора Юбари Симакадзэ-тян справляется с научной работой и выказывает талант в движении и частицах"
 leader_trait_admiral_wg_shimakaze_speed:0 "Ветер и молния"
 leader_trait_admiral_wg_shimakaze_speed_desc:0 "В командовании флотом Симакадзэ полностью раскрывает его маневренность"
 leader_trait_general_wg_shimakaze_army:0 "Быстронога"
 leader_trait_general_wg_shimakaze_army_desc:0 "Под командованием Симакадзэ сухопутные войска стали куда маневреннее"
 wg_shimakaze_desc:0 "Итак, прежде чем у тебя появятся мысли о милой Симакадзэ-тян: у нашего государства отточенный УК £sr_huaji£, у сыщиков — отточенная акробатика £sr_huaji£, у гробовщиков — резные гробы £sr_huaji£, у кладбища — ухоженные участки £sr_huaji£, у свадебных трубачей — большой репертуар £sr_huaji£, а у чата группы — тысяча способов тебя закопать £sr_huaji£."
 leader_trait_admiral_mist_renown:0 "Последняя слава"
 leader_trait_admiral_mist_renown_desc:0 "§BОбразец Лазури§!\n\n\n\n£wg_trait_pic_renown£\n\n\n\nРинаун — дева, несущая последнюю линию обороны штаба Neoforce. Никто не одолеет её в затяжном бою, и только благодаря ей все бойцы Neoforce спокойно вверяют ей свой тыл."
 leader_trait_admiral_mist_renown_effect:0 "За каждый бой Ринаун навсегда получает §G+2.5%§! к одной из §Yпяти характеристик§! — атака, скорострельность, дальность, точность, уклонение — до предела в 30%."
 leader_trait_admiral_mist_repulse:0 "Закат у Малайи"
 leader_trait_admiral_mist_repulse_desc:0 "§BОбразец Лазури§!\n\n\n\n£wg_trait_pic_repulse£\n\n\n\nРипалс — полная противоположность своей сестре Ринаун, непобедимой в затяжных боях: она создала собственную, в корне иную тактику. В каждом бою Рипалс выкладывается на полную — и в кратчайший срок ставит на кон всё, чтобы сокрушить противника."
 leader_trait_admiral_mist_repulse_effect:0 "После начала боя §Yатака, скорострельность, дальность, точность, уклонение§!§G+25%§!, затем каждые 30 дней §R-5%§! к §Yатаке, скорострельности, дальности, точности и уклонению§! — до пяти снижений."
 wsg.2013.name:0 "Штурмовик Рипалс"
 wsg.2013.desc:0 "Приветствуем вас, наши «мы» из другого мира. Учитывая успехи нашего сотрудничества, мы хотели бы углубить обмены на высшем уровне, чтобы приумножить плоды нашей связи.\nВ знак искренности мы навсегда передаём в ваше распоряжение наш элитнейший штурмовик — Рипалс."
 wsg_repulse_desc:0 "Элитный штурмовик из Лазурного мира — «Рипалс». Командное мастерство, которому все мы позавидуем."
 wsg.2013.tooltip:0 "Получить командующего флотом §YРипалс§!"
 wsg.2014.name:0 "Страж штаба Ринаун"
 wsg.2014.desc:0 "Здравствуй, наш товарищ из другого мира. Скорость прогресса нашего сотрудничества радует — и немного удивляет. Благодаря совместным результатам наша армия Neoforce уже практически уничтожила основную угрозу нашему существованию — механическую армию Глубинных.\nПлоды нашего сотрудничества налицо. В связи с этим мы направляем к вам нашего лучшего стража штаба — Ринаун. Полагаем, у вас она развернётся куда больше, чем в Neoforce."
 wsg.2014.tooltip:0 "Получить командующего флотом §YРинаун§!"
 wsg.2015.a:0 "Добро пожаловать!"
 wsg.2015.desc:0 "Для меня честь встретиться с хозяином. Я — Ринаун, головной корабль типа «Ринаун». Бой, канцелярия или услужение хозяину — я всегда к вашим услугам. Как опытная горничная, покажу вам, что такое элегантность."
 wsg.2016.desc:0 "Линейный крейсер типа «Ринаун», второй корабль — Рипалс к вашим услугам. Отныне вы — мой хозяин."
 wsg_renown_desc:0 "Командующая штабом из Лазурного мира — Ринаун. Лучший боец Лазурного мира, без вариантов. Мало того что командование флотом — так и работу горничной исполняет элегантно в любой момент."
