 max_affection_wg_dragon:0 "$max_affection_wg_dragon_tooltip$$require_engagement_wg_dragon$"
 wg_dragon_army:0 "Эфирный дракон"
 wg_dragon_army_desc:0 "Спускать дракона безнаказанно крушить землю — плохая идея…"
 wg_dragon_army_affection_3:0 "$wg_dragon_army$"
 wg_dragon_army_affection_3_desc:0 "$wg_dragon_army_desc$"
 wg_dragon_army_affection_5:0 "$wg_dragon_army$"
 wg_dragon_army_affection_5_desc:0 "$wg_dragon_army_desc$"
 WG_DRAGON_SPECIES:0 "Отпрыск дракона"
 wg_dragon_recover_cd:0 "Нифианна восстанавливается"
 wg_dragon_recover_cd_desc:0 "Даже эфирный дракон умудрился приложиться… дайте ей передохнуть"
 already_has_wg_dragon_diplo:0 "Окно связи с Нифианной уже открыто"
 wsg_dragon_desc:0 "Маленький эфирный дракон, у которого безумный отаку-адмирал убил мать и выкрал яйцо; в Порту она обернулась милой драко-девой. Теперь она живёт в Порту под именем Нифианны, продолжая очередную страницу своей долгой драконьей жизни"
