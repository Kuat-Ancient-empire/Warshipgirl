l_russian:

 wg_dragon_name:0 "Нифианна"
 leviathans.661.c:0 "Превращайся!.jpg"
 leviathans.661.c.tooltip:0 "Доставить драконье яйцо на [Root.Capital.GetName] для инкубации и модификации."
 WG_DRAGON_INCUBATION_PROJECT:0 "Генное редактирование эфирного дракона"
 WG_DRAGON_INCUBATION_PROJECT_DESC:0 "Найденное в логове яйцо ещё едва живо: сымитировав среду, мы добьёмся вылупления; а пока эмбрион — можно чуть подправить гены, чтобы выросшая она владела особой способностью…"
 wg_dragon.1.title:0 "Дракон грядёт"
 wg_dragon.1.desc:0 "Мы вылупили яйцо и генетикой подарили ей способность… принимать облик существа обычного размера!\nМы дали ей хлёсткое имя: Нифианна (Nirvana).\nТеперь с ней можно говорить через дипломатию."
 wg_dragon.2.desc_a:0 "Жду заданий, лидер."
 wg_dragon.2.desc_b:0 "Лидер, бросать меня без дела — не лучшая мысль."
 wg_dragon.2.desc_c:0 "Не церемоньтесь, лидер: могучий эфирный дракон справится с чем угодно."
 wg_dragon.3.desc_a:0 "Вести флот и биться самой — большая разница; тут мне ещё учиться и учиться."
 wg_dragon.3.desc_b:0 "Чашечку кофе, лидер?\nДа, даже драконы устают."
 wg_dragon.3.desc_c:0 "Видеть вместе с вами подъём империи — густой штрих в моих бесконечных, но блёклых годах."
 wg_dragon.4.desc_a:0 "Гордый дракон вечно жаждет достойного соперника — даже если это я сама."
 wg_dragon.4.desc_b:0 "Дракон парит над девятью небесами, стоя на вершине мириада миров."
 wg_dragon.4.desc_c:0 "Ваша воля — моя воля: приказывайте мной как угодно."
 wg_dragon.5.desc_a:0 "Смертным не вынести драконьего гнева.\nАх, лидер, не бойтесь — вы мой господин."
 wg_dragon.5.desc_b:0 "Щёлк пальцами — и мачты обратились в пепел; моргнул — и миры сместились."
 wg_dragon.5.desc_c:0 "Мне хватит чашки кофе, чтобы вернуться."
 wg_dragon_to_admiral:0 "Мы хотим видеть вас командующей флотом."
 wg_dragon_to_fleet:0 "Помогите нашему флоту в бою."
 wg_dragon_to_army:0 "Помогите нашим войскам в высадке."
 marry_wg_dragon:0 "Нифианна, выходи за меня, хорошо?"
 marry_wg_dragon_response:0 "Я давно дала клятву быть рядом с тобой до конца времён. Так что… мне не нужны формальности. Но сегодня я… по-настоящему счастлива. Спасибо."
 wg_dragon.6.desc:0 "Простите за позор, лидер; позвольте мне немного отдохнуть…"
 wg_dragon.7.desc:0 "Оплошала… попасть в засаду в таком месте…"
 wg_dragon.7.a:0 "Отдыхайте, вы заслужили."
 wg_dragon.8.desc:0 "Противник этот не из лёгких; в следующий раз буду настороже и выложусь вся."
 wg_dragon.12.desc:0 "И здесь есть сила, равная моей?.. Видно, путь мой ещё долог…"
 wg_dragon.13.desc:0 "Простите за ожидание, лидер: я восстановилась — приказывайте."
 wg_dragon_allow_triggers.a:0 "Нифианна не должна быть в бою"
 wg_dragon_allow_triggers.b:0 "Здоровье Нифианны не должно быть низким"
 leader_trait_warship_wg_dragon:0 "Сила дракона"
 leader_trait_warship_wg_dragon_desc:0 "Неубиваемость, вечная молодость — и драконья мощь!\n§YВ бою: 2% в день получить 3 дня ['concept_wg_super_protect']; £time£ КД 30 дней§!\n"
 leader_trait_warship_wg_dragon_nirvana:0 "$leader_trait_warship_wg_dragon$"
 leader_trait_warship_wg_dragon_nirvana_desc:0 "$leader_trait_warship_wg_dragon_desc$"
 leader_trait_admiral_wg_dragon:0 "Драконья чешуя"
 leader_trait_admiral_wg_dragon_desc:0 "Как отпрыск эфирного дракона, Нифианна чешуёй пережила бы Большой взрыв и жила бы в следующей эпохе; сброшенную чешую она порой ставит на укрепление корабля."
 max_affection_wg_dragon_tooltip:0 "Привязанность Нифианны максимальна."
 require_engagement_wg_dragon:0 "Вам нужно§H провести обряд обручения с Нифианной§!, чтобы открыть следующий уровень привязанности."
 leader_trait_admiral_wg_dragon_affection:0 "Привязанность"
 leader_trait_admiral_wg_dragon_affection_desc:0 "Привязанность растёт, если§Y Нифианна командует флотом§!. Вне боя —§Yшанс каждый месяц§!; в бою —§Yшанс каждый день§!. Каждая§Y победа в бою§! — высокий шанс роста."
 leader_trait_warship_wg_dragon_affection:0 "$affection_lv1$"
 leader_trait_warship_wg_dragon_affection_desc:0 "Привязанность растёт, если§Y Нифианна сражается§!. Каждая§Y победа в бою§! — высокий шанс роста."
 leader_trait_warship_wg_dragon_affection_lv2_tooltip:0 "§GНавык§H Сила дракона§G: шанс ['concept_wg_super_protect'] растёт до 4%§!"
 leader_trait_warship_wg_dragon_affection_lv3_tooltip:0 "§GНавык§H Сила дракона§!§G: шанс ['concept_wg_super_protect'] растёт до 6%§!"
 leader_trait_warship_wg_dragon_affection_lv4_tooltip:0 "§GНавык растёт§!§H Сила дракона§!§G ['concept_wg_super_protect'] шанс — до 8%§!\n§YПри HP Нифианны ниже 30% и готовом навыке — 100% срабатывание§!§H Силы дракона§!, §Yно КД — £time£ 60 дней§!"
 leader_trait_warship_wg_dragon_affection_lv5_tooltip:0 "§GНавык растёт§!§H Сила дракона§!§G ['concept_wg_super_protect'] шанс — до 10%,['concept_wg_super_protect'] длительность — 5 дней§!\n§YПри HP Нифианны ниже 30% и готовом навыке — 100% срабатывание§H Силы дракона§!, §Yно КД — £time£ 60 дней§!"
 wg_dragon_affection_lv1_desc:0 "$affection_lv1$ ([owner.wg_dragon_affection] / $@wg_dragon_affection_to_lv2$)"
 wg_dragon_affection_lv2_desc:0 "$affection_lv2$ ([owner.wg_dragon_affection] / $@wg_dragon_affection_to_lv3$)"
 wg_dragon_affection_lv3_desc:0 "$affection_lv3$ ([owner.wg_dragon_affection] / $@wg_dragon_affection_to_lv4$)\nТекущий эффект: $immune_negative_trait$"
 wg_dragon_affection_lv4_desc:0 "$affection_lv4$ ([owner.wg_dragon_affection] / $@wg_dragon_affection_to_lv5$)\nТекущий эффект: $immune_negative_trait$"
