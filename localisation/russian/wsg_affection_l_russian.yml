 leader_trait_wg_lady_affection_lv5_tooltip:0 "$MOD_PLANET_BUILDING_BUILD_SPEED_MULT$: §G30%§!\n$mod_planet_districts_cost_mult$: §G-20%§!\n£mod_pop_bonus_workforce_mult£ $MOD_POP_BONUS_WORKFORCE_MULT$: §G15%§!\nСкорость строительства всех районов первичного сектора, всех районов планет Порта и всех районов мир-кольца Глубинных: §G+50%§!"
 gray_admiral:0 "Военный корабль Серого Ветра"
 gray_admiral_desc:0 "Этот мощный военный корабль на деле состоит из бесчисленных наномашин атомарного размера. Впрочем, можете считать его самой Серой — кто сказал, что военный корабль не может быть женой?"
 mod_wg_waifu_cap_add:0 "Подаренные жёны"
 wg_affection.18.name:0 "Обряд обручения"
 make_ring:0 "Слепить кольцо"
 starshipgirls_ring_tooltip:0 "§YСкладываем эти материалы вместе, мнём Силой в комок, проделываем в нём дырочку… готово! £sr_huaji£§!"
 pantsu_shop_interface_already_open:0 "Окно Лавки Трофеев уже открыто"
 goto_pantsu_shop_buy_ring:0 "Открыть Лавку Трофеев и купить кольцо обручения"
 no_available_wedding_leader:0 "Нет лидеров для обручения (привязанность должна быть высокой, 4-й уровень)"
 wg_affection.18.desc:0 "Выберите, с кем провести обряд обручения.\n§YОбручение с этим лидером откроет последний уровень привязанности и подарит мощную черту. §!\nУчтите: для особых лидеров вроде Серого Ветра, Юной Госпожи и Симакадзэ обряд проводится в их собственном окне связи (там, где меняются их форма/профессия)."
 wg_affection.18.leader1:0 "[leader_tobe_view_1.GetName]"
 wg_affection.18.leader2:0 "[leader_tobe_view_2.GetName]"
 wg_affection.18.leader3:0 "[leader_tobe_view_3.GetName]"
 wg_affection.18.leader4:0 "[leader_tobe_view_4.GetName]"
 wg_affection.18.leader5:0 "[leader_tobe_view_5.GetName]"
 wg_affection.18.a:0 "Назад"
 wg_affection.18.b:0 "Далее"
 wg_affection.18.c:0 "Выход"
 wg_affection.19.name:0 "Обряд обручения с [married_leader.GetName]"
 wg_affection.19.desc:0 "На тщательно подготовленной сцене, перед глазами всех гостей, ты в наряде жениха, сжимая кольцо обручения, отлитое из драгоценнейших кристаллов вселенной, медленно идёшь к ней — сияющей, словно солнце…"
 wg_affection.19.a:0 "Выйди за меня, хорошо? §Y[married_leader.GetName]§!"
 wg_affection.19.a.tooltip:0 "§YПохоже, невеста получила некое благословение§!"
 edict_wg_wedding:0 "Провести обряд обручения"
 edict_wg_wedding_desc:0 "Кольцо приготовил(а)?"
 wg_affection.22.name:0 "Загадочное тёмное кольцо"
 wg_affection.22.desc:0 "Недавно [revive_leader.GetName] была признана погибшей в аварии. Но спустя несколько дней она вновь появилась в собственном кабинете. [revive_leader.GetName] ничего не помнит о произошедшем — лишь смутный тёмный круг перед глазами. Наши учёные не в силах объяснить это чудо, но корабельные девы, называющие себя душеведами, говорят: это особое одноразовое Тёмное Кольцо — в отличие от легендарного, поднимающего из мёртвых бессчётное число раз, оно способно лишь единожды отвести смерть от благословлённой."
 wg_affection.22.a:0 "Поразительно!"
 wg_affection.22.b:0 "Нужно быть предельно осторожными!"
 wg_affection.30.desc:0 "[revive_leader.GetName] погибла в недавней аварии, но во время обряда обручения она получила благословение. Как и предсказывали душеведы, спустя несколько дней [revive_leader.GetName] воскресла. [revive_leader.GetName] вернулась к нам. Больше мы не будем так беспечны!"
 wg_affection.37.name:0 "Чудом уцелела"
 wg_affection.37.desc:0 "Хотя в недавней аварии [revive_leader.GetName] была признана погибшей, мы получили от [revive_leader.GetName] экстренное сообщение уже после катастрофы. По последним данным [revive_leader.GetName] жива и в ближайшее время вернётся в империю."
 wg_affection.31.name:0 "Чудеса и магия не бывают бесплатными"
 wg_affection.31.desc:0 "Как это ни печально, [pass_leader.GetName] снова пожертвовала собой — но на этот раз мы потеряли её навсегда."
 wg_affection.31.a:0 "Она навсегда останется в наших сердцах"
 wg_affection.23.name:0 "Неубиваемая трудяга"
 wg_affection.23.desc:0 "Ямато XXIII, которую после недавней аварии мы признали погибшей безнадёжно, вдруг целой и невредимой предстала перед нами. Сама она ничего не помнит о моменте аварии, так что причины остались для нас загадкой."
 wg_affection.23.a:0 "Слава богу: трудяжка снова может вкалывать и перевыполнять"
 wg_affection.24.name:0 "Родни, вернувшаяся с того света"
 wg_affection.24.desc:0 "Адмирал Родни, признанная погибшей в недавнем бою, обнаружена возвращающейся на спасательной шлюпке к нашей столице. По её рассказу, весь экипаж единогласно решил пожертвовать собой, чтобы дать ей уйти."
 wg_affection.24.a:0 "Помолчим в память о безымянных героях"
 wg_affection.25.name:0 "Она вернулась, как молния"
 wg_affection.25.desc:0 "Элла, которую после недавней аварии признали безнадёжно погибшей, вдруг вернулась — стремительная, как молния!"
 wg_affection.25.a:0 "По всей стране гуляют напропалую…"
 wg_affection.26.name:0 "Капиталистка на фонаре"
 wg_affection.26.desc:0 "Недавно наш деятельный губернатор Санти внезапно пропала. После масштабных поисков мы обнаружили её… подвешенной на уличном фонаре! Она была при смерти: ещё чуть-чуть — и последствия было бы не представить!"
 wg_affection.26.a:0 "Пусть больше не продаёт верёвки"
 wg_affection.27.name:0 "Чудом выжившая Вашингтон"
 wg_affection.27.desc:0 "Пропавшая в недавнем бою Вашингтон внезапно вернулась в нашу столицу! Говорят, одной лишь священной сакурной секирой она перебила всех окруживших её врагов и угнала космический корабль."
 wg_affection.28.name:0 "Любимица Древнего Бога"
 wg_affection.28.desc:0 "Недавно пропавшая [THIS.GetRulerTitle] Лексингтон — духовная опора всех нас — вдруг «сошла» в луче света прямо на нашу столицу, в самом буквальном смысле: это священное мгновение видели все. Но и сама она не понимает, что произошло. Несомненно лишь одно: некая тайная сила внутри неё тайком спасла ей жизнь."
 wg_affection.1020.name:0 "Секрет фокусницы"
 wg_affection.1020.desc:0 "Хотя адмирал Мье раз за разом творила чудеса в бою, возвращая бесчисленные жизни и корабли с порога смерти, когда беда случилась с ней самой, мы готовились к худшему. Но спустя несколько дней на одну из наших колоний упала никогда прежде не виденная цельностальная спасательная капсула — а внутри, прекрасно сохранившись в промасленной бумаге, оказалась адмирал Мье!\nПо данным наших материаловедов, сталь капсулы на 47% превосходит корабельную — вот и секрет её спасения."
 wg_affection.1030.name:0 "Ринаун благополучно вернулась"
 wg_affection.1030.desc:0 "Нам пришло сообщение из Лазурного мира: адмирал §HРинаун§! до того, как её флагман пошёл ко дну в недавнем бою, успела открыть малый портал в Лазурный мир и избежала гибели. Теперь она отдохнула и вернулась с докладом."
 wg_affection.1031.name:0 "Рипалс благополучно вернулась"
 wg_affection.1031.desc:0 "Нам пришло сообщение из Лазурного мира: адмирал §HРипалс§! до того, как её флагман пошёл ко дну в недавнем бою, успела открыть малый портал в Лазурный мир и избежала гибели. Теперь она отдохнула и вернулась с докладом."
 wg_affection.1032.name:0 "Четвёртая стена?"
 wg_affection.1032.desc:0 "Потерпевшая поражение в недавнем бою адмирал §HМиссури§!, похоже, звериным чутьём и странной логике шведских ослов активировала некий механизм — её мгновенно телепортировало с поля боя прямо в столицу. Сама она комментировать это не стала."
 wg_affection.1032.a:0 "Думаю, чем меньше мы знаем, тем лучше"
 wg_affection.1033.name:0 "Благословение звёзд"
 wg_affection.1033.desc:0 "§HАстесия§!, недавно попавшая в беду, вновь предстала перед нами. Как выяснилось, она предвидела опасность в гадании и нашла путь к спасению — теперь она готова вернуться в строй."
 wg_affection.1033.a:0 "Удивительно…"
 wg_affection.1034.name:0 "Милостью ведомая, домой"
 wg_affection.1034.desc:0 "Пока корабельная дева, несущая сторожевую вахту, вместе с алыми предупреждениями датчиков пыталась забить все каналы связи, внимание твоё было приковано к другому.\nТы видел, как на экранах мониторинга прыжковый вихрь распускается серебристо-синей рябью, а величественный корпус, укрытый ледяными наростами гипер-холода, выходит из бури.\nВ миг завершения прыжка ледяная броня за кормой рассыпалась вращающимся алмазным вихрем, словно спадающая белая вуаль — только не слышно было звонкого треска ломающегося льда.\nКогда ледяной панцирь сошёл с форштевня, в вихре ледяной пыли девочка помахала тебе рукой.\nБез единого послания через глубокий космос слова приветствия уже поднялись в ваших сердцах."
 wg_affection.1034.a:0 "Давно не виделись."
 wg_affection.1034.a.tooltip:0 " Синяя вернулась в боевой состав."
 wg_affection.1035.name:0 "Всё сияющее — и Вы тоже"
 wg_affection.1035.desc:0 "В прошлой кампании связь Вектор с командным центром прервалась — пришлось предположить, что её физическое существование уничтожено окончательно.\nНо её маяк-передатчик вновь вспыхнул ослепительным светом, и после нежного разноцветного сияния Вектор возникла рядом с маяком — отдохнувшая и готовая снова служить Вам."
 wg_affection.1035.a:0 "Слава богу."
 GRAY_SPECIES:0 "Серый Ветер"
 marry_gray:0 "Серый Ветер, я хочу кое-что тебе отдать"
 wg_affection.30000.name:0 "Обряд обручения с Серым Ветром"
 wg_affection.30000.desc:0 "Эта штука в форме кольца… её надо надеть на безымянный палец? А, значит, ты признаёшь мою верность, верно? И что за приятное товарищеское действо нас ждёт дальше?\n\n… ладно, признаю: шутка вышла так себе. Но дни, проведённые с вами, и правда были счастливыми. Позволь мне служить тебе вечно."
 wg_affection.30000.a:0 "Ты давно одна из нас, Серый Ветер."
 wg_affection.30000.response:0 "Это… правда?\n\n…\n\nСпасибо."
