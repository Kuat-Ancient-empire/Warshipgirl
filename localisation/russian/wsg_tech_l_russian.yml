l_russian:

 tech_wsg_reform:0 "Портовая реформа"
 tech_wsg_reform_desc:0 "Чтобы выжить в безжалостной галактике, мы обязаны реформироваться — и никогда не погибнуть."
 tech_yamato_education:0 "Яматозационное воспитание"
 tech_yamato_education_desc:0 "Ямато — враг, но её несгибаемый дух вдохновляет дев Порта. И главное: она работает без выходных."
 tech_wsg_pool_size:0 "Обнаружение талантов"
 tech_wsg_pool_size_desc:0 "Более научная система аттестации выявит нам больше знающих людей."
 tech_yamato_education2:0 "Яматозация, этап II"
 tech_yamato_education2_desc:0 "Распространение яматозации признано сверхэффективным; теперь углубим её основополагающие идеи."
 tech_wsg_pantsu:0 "Теория применения трофеев"
 tech_wsg_pantsu_desc:0 "Трусики — один из важнейших ресурсов общества корабельных дев; в древности их добывали только охотой. Ныне мы достаточно владеем наукой, чтобы делать и применять их самим."
 tech_warshipgirl_assembly_plant:0 "Портовый сборщик"
 tech_warshipgirl_assembly_plant_desc:0 "Доктор Юбари переоборудовала оставленные Глубинными сборочные машины — теперь они служат нам."
 tech_warshipgirl_assembly_plantU:0 "Чертежи улучшенного портового сборщика"
 tech_warshipgirl_assembly_plantU_desc:0 "Опираясь на теорию трофеев, улучшенный сборщик удвоит эффективность."
 tech_warshipgirl_assembly_plantF:0 "Высший портовый сборщик"
 tech_warshipgirl_assembly_plantF_desc:0 "С NEO эффективность сборщика поднимется ещё на ступень."
 tech_building_wsg_yamato_monument:0 "Монумент Ямато"
 tech_building_wsg_yamato_monument_desc:0 "Доблестных воинов стоит помнить — даже из чужого лагеря."
 tech_building_wsg_yamato_monument2:0 "Монумент Ямато и Мусаси"
 tech_building_wsg_yamato_monument2_desc:0 "Доблестных воинов стоит помнить — даже из чужого лагеря. Одна — в назидание девам никогда не сдаваться; вторая — красная, рогатая, втрое быстрее."
 tech_building_wsg_autochthon_monument:0 "Монумент Древнего Бога"
 tech_building_wsg_autochthon_monument_desc:0 "Он — маяк, озаряющий наш путь."
 tech_building_pantsu_shop:0 "Лавка Трофеев"
 tech_building_pantsu_shop_desc:0 "Высший магазин мира корабельных дев: товаров — на все редкости мира."
 tech_building_wsg_fortress:0 "Лазурная крепость"
 tech_building_wsg_fortress_desc:0 "Эта неприступная твердыня станет щитом планеты."
 tech_building_wsg_military_academy:0 "Академия Порта"
 tech_building_wsg_military_academy_desc:0 "Лишь в Академии Порта постигают новейшую науку сухопутного боя."
 tech_building_wsg_bathhouse:0 "Портовая баня"
 tech_building_wsg_bathhouse_desc:0 "Здание, устраивающее всех дев без исключения: вершина банной науки."
 tech_building_wsg_neo:0 "Синтез NEO"
 tech_building_wsg_neo_desc:0 "Благодарим Neoforce за разделённую с нами великую технологию."
 tech_neo_exchange:0 "Конверсия NEO"
 tech_neo_exchange_desc:0 "По сравнению с классической индустрией редких ресурсов конверсия NEO эффективнее и безопаснее."
 tech_building_wsg_foundry:0 "Производство NEO-сплавов"
 tech_building_wsg_foundry_desc:0 "NEO станет ядром нашей будущей промышленности."
 tech_building_wsg_alpha:0 "Очистка кристаллов Альфа"
 tech_building_wsg_alpha_desc:0 "Neoforce поделилась способом производства этих сверхчистых кристаллов."
 tech_wsg_military:0 "Портовая диспетчерская"
 tech_wsg_military_desc:0 "Портовая диспетчерская — особый орган: планетарная оборона, диспетчеризация кораблей и гражданское управление; коммерция ей строго запрещена."
 tech_building_wsg_research:0 "$building_wsg_research$"
 tech_building_wsg_research_desc:0 "$building_wsg_research_desc$"
 tech_building_wsg_research2:0 "Продвинутая лаборатория корабельных дев"
 tech_building_wsg_research2_desc:0 "Лаборатория выше классом; старшие сотрудники — отборнейшие умы многоступенчатого конкурса."
 tech_building_wsg_research3:0 "Передовая лаборатория корабельных дев"
 tech_building_wsg_research3_desc:0 "С прямой связью с NF сотрудники обеих сторон наконец ведут науку под одной крышей."
 tech_wg_ib_pantsu:0 "Добровольная сдача трофеев"
 tech_wg_ib_pantsu_desc:0 "Глубинные — гражданки Порта — в обязательном порядке добровольно сдают свои трофеи."
 tech_sh_genetic:0 "Генная инженерия Глубинных"
 tech_sh_genetic_desc:0 "Глубинные девы — важная часть империи: их генная инженерия выходит на повестку."
 tech_wsg_galatic_engineer:0 "Галактический инженер"
 tech_wsg_galatic_engineer_desc:0 "Наша инженерия достигла невиданных высот: строить миры по своему образцу стало проще."
 tech_building_wsg_survey:0 "Передовые программы разведки"
 tech_building_wsg_survey_desc:0 "Более совершенные сенсоры и археооборудование встанут на наши научные корабли."
 tech_wg_zro:0 "Зро-удобрение"
 tech_wg_zro_desc:0 "Пользоваться зро как псионики мы не можем — зато можем делать из него удобрение."
 wsg_zro_edicts:0 "§HОткрывает планетарное решение: §! применить «золотое удобрение»"
 wsg_zro_edicts_desc:0 "Удобрение с «золотым» — пшеница сто восемьдесят: впитывает азот-фосфор-калий прямо со стороны планеты напротив."
 tech_wsg_alpha_power:0 "Реактор на кристаллах Альфа"
 tech_wsg_alpha_power_desc:0 "Кристаллы Альфа дадут нашим кораблям неисчерпаемую мощь."
 tech_galodam:0 "GaloDam"
 tech_galodam_desc:0 "В кризис GALO сбиваются в кучу, подражая врагу и складываясь в исполинский комбинат — словно дамба (Dam); за эту форму их и прозвали GADAM (GaloDam). Наши учёные заставили эту особенность работать: теперь это сильнейшая боевая тварь."
 tech_galokiller:0 "Хищный GALO"
 tech_galokiller_desc:0 "Ошибка эксперимента породила неукротимых бешеных GALO: почти неуязвимы и бьют всё, даже машины; к счастью, живут считанные дни. Теперь мы сбрасываем этих монстров на вражеские планеты — эффективно вычищать чужих еретиков."
 tech_wsg_timetable:0 "Реформа Порта: график туалетов строительных фей"
 tech_wsg_timetable_desc:0 "Раньше из-за отсутствия графика уборной фей строительство регулярно срывалось, и корабли приходилось перестраивать. Новый график дисциплинирует фей — и режет стоимость постройки."
 tech_wsg_fb:0 "Реформа Порта: быстрая постройка"
 tech_wsg_pb:0 "Реформа Порта: эффективная стройка MK1"
 tech_wsg_pb_desc:0 "Раньше тележка строительной феи везла 3 кирпича — теперь выжмем 30."
 tech_wsg_pb2:0 "Реформа Порта: эффективная стройка MK2"
 tech_wsg_pb2_desc:0 "Теперь фея везёт сразу 300 кирпичей — это почти опрокидывает законы физики."
 tech_wsg_ky:0 "Реформа Порта: феи-научные ассистенты"
 tech_wsg_ky_desc:0 "За почти неощутимый паёк феи с научным даром становятся правой рукой учёных."
 tech_wsg_equipment:0 "Реформа Порта: ригинг нового поколения"
 tech_wsg_equipment_desc:0 "Новый ригинг лучше помогает девам во всех делах."
 tech_wsg_garbage:0 "Реформа Порта: обращение с портным мусором"
 tech_wsg_garbage_desc:0 "Сортировка мусора — извечная головная боль Порта; теперь решение найдено: сваливать его на чужих инопланетян."
 tech_wsg_diplomacy:0 "Реформа Порта: дипведомство"
 tech_wsg_diplomacy_desc:0 "Новое дипведомство досконально изучит чужие обычаи, направляя наши усилия эффективнее."
 tech_space_science_wsg:0 "Реформа Порта: смена персонала орбитальных станций"
 tech_space_science_wsg_desc:0 "Прежде девы в одиночестве тянули тяжёлую вахту на орбите — со всеми психическими последствиями. Теперь станции полностью обслуживают феи: неутомимые и послушные, они резко поднимут выработку."
 tech_wsg_unite:0 "Реформа Порта: единство"
 tech_wsg_unite_desc:0 "Когда-то мы мелочно дрались из-за снаряда и даже взрывали Порт. Теперь каждая дева гордится тем, кто она есть, — и мы едины по-настоящему."
 tech_wsg_kodiak:0 "Боевой корабль «Кадьяк»"
 tech_wsg_kodiak_desc:0 "В конце войны на службу встал аэроброненосец с 24-дюймовыми орудиями, переломивший ход кампании. После войны без противника и с таким содержанием машины законсервировали — но с нашим прогрессом пора воздушным гигантам вернуться."
 tech_wsg_genetic_resequencing:0 "Пересборка генома дев"
 tech_wsg_genetic_resequencing_desc:0 "Теперь мы правим гены как захотим."
 tech_wsg_toy:0 "Производство товаров массового спроса на NEO"
 tech_wsg_toy_desc:0 "NEO-заводы попутно с сплавами выпустят игрушки и прочее — NEO-расход чуть вырастет."
 tech_wsg_moyu:0 "Принят закон о лодырстве"
 tech_wsg_moyu_desc:0 "Общество созрело для массового безделья: дадим народу место лениться — гедонизм вместо безработицы."
 wsg_toy_edicts:0 "£job£ Производители NEO-сплавов дополнительно дают 2 £consumer_goods£; расход NEO слегка растёт"
 wsg_toy_edicts_desc:0 "NEO-заводы попутно с сплавами выпускают игрушки и прочее."
 wsg_genetic_edicts:0 "§HОткрывает черты: §! продвинутые черты корабельных дев"
 wsg_genetic_edicts_desc:0 "Мы приоткроем тайну генома."
 wg_military_edicts:0 "§HСвязанный указ: §! перенастройка диспетчеров WG"
 wg_military_edicts_desc:0 "Смещая фокус диспетчеров, выбираем, какую сторону работы усилить."
 galokiller_edicts:0 "§HОткрывает орбитальную бомбардировку: §! хищные GALO"
 galokiller_edicts_desc:0 "Просто высыпаем этих кровожадных тварей на вражескую планету."
 wsg_pantsu_edicts:0 "§HОткрывает указы и планетарное решение: §! Трофейный акт"
 wsg_pantsu_edicts_desc:0 "Грамотное применение трофеев резко усилит флот Порта"
 wsg_assembly_edicts:0 "§HПланетарное решение: §! сборочные заводы на полную"
 wsg_assembly_edicts_desc:0 "Несчётные хомяки крутят колёса — и питают наши заводы энергией"
 wsg_neo_edicts:0 "§HОткрывает планетарное решение: §! применение NEO"
 wsg_neo_edicts_desc:0 "NEO поможет поднять производство планеты"
 wsg_381_edicts:0 "Осторожно! 381-й предупреждает!!"
 wsg_381_edicts_desc:0 "Эта технология повышает шанс игрока быть расстрелянным 381-мм"
 wsg_alpha_edicts:0 "Осторожно! Кошелёк пустеет!!"
 wsg_alpha_edicts_desc:0 "Эта технология повышает шанс опустошения кошелька игрока"
 wsg_ovo_edicts:0 "Осторожно! 0v0-предупреждение!!"
 wsg_ovo_edicts_desc:0 "КВИНСИ СМОТРИТ НА ТЕБЯ"
 wsg_branch_edicts:0 "Повышает §Gотношение§! чужих империй\n§HОткрывает чудо-здание: §! Висячие сады\n§HОткрывает корабельным девам: §! здания филиалов\n§HОткрывает тип федерации: §! Лига дев\n§HПолучить губернатора: §! капиталистка Санти"
 wsg_branch_edicts_desc:0 "Открывает §Hкорабельным девам§! эксклюзивные здания филиалов§!"
 wsg_alpha_weapon_edicts:0 "Открывает исследование тёмно-материального α-оружия"
 wsg_hc_edicts:0 "§HОткрывает мегаструктуру: §! Скрытая столица корабельных дев"
 wsg_hc_edicts_desc:0 "Тсс. Никто не должен знать об этом месте."
 wsg_mine_edicts:0 "§HОткрывает мегаструктуру: §! Центр обороны метрополии"
 wsg_mine_edicts_desc:0 "Сооружение, творящее непреодолимую межзвёздную стену: достроив его, не оставим ни одному кораблю шанса пересечь систему."
 wsg_alpha_weapon_edicts_desc:0 "Госпожа Чанчунь, вот ваш комбинезон и инструменты; отчёт — на западной площадке."
 ship_hull_edicts:0 "§HМодули кораблей§!: нос дредноута (линкор), корпус авианосца (линкор), корпус крепости (линкор), корпус дредноута (титан), корма дредноута (титан)"
 ship_hull_edicts_desc:0 "Улучшение конструкции открывает новые модули корпусов."
 TECH_UNLOCK_THRUSTER_WSG_TITLE:0 "§HОткрывает компонент: §! тёмно-материальный α-двигатель"
 TECH_UNLOCK_THRUSTER_WSG_DESC:0 "Корабль толкает исполинская мощь слияния Альфы и тёмной материи"
 TECH_UNLOCK_SENSOR_WSG_TITLE:0 "§HОткрывает компонент: §! тёмно-материальный α-сенсор"
 TECH_UNLOCK_SENSOR_WSG_DESC:0 "Исследования показали: малое слияние тёмной материи и Альфы стабильно выводит сигнал сенсора в верхние измерения — оттуда виднее."
 tech_wsg_152:0 "Кинетико-энергетическая группа 152"
 tech_wsg_152_desc:0 "Первое поколение орудий Юбари на смену устаревшим: сплав «ослиного» вещества-метателя A и «ослиного» лазера B. Говорят, в кабинете доктора стоит уменьшенная 152-я — греть мясо на барбекю."
 tech_wsg_180:0 "Кинетико-энергетическая группа 180"
 tech_wsg_180_desc:0 "Апгрейд 152-й: жарит мясо быстрее! — доктор Юбари"
 tech_wsg_203:0 "Тяжёлая энергетическая группа 203"
 tech_wsg_203_desc:0 "Получив кристаллы Альфа, доктор Юбари выдала новейшее тяжёлое орудие."
 tech_wsg_381:0 "Тахионный свет-меч 381M"
 tech_wsg_381_desc:0 "Самое смертоносное оружие."
 tech_wsg_P381:0 "Пси-копьё 381M"
 tech_wsg_P381_desc:0 "Оружие ужаса, впитавшее всю обиду госпожи Венето."
 tech_wsg_460:0 "Луч чистилища 460M"
 tech_wsg_460_desc:0 "Суперорудие, задуманное под корабли титанового класса."
 tech_wsg_BTD:0 "Звёздный тактический бомбардировщик S-BTD"
 tech_wsg_BTD_desc:0 "Мощный бомбардировщик на антиграв-двигателях — пропеллер спереди чисто для красоты. Входит в атмосферу, поднимая урон орбитальной бомбардировки флота."
 tech_wsg_B25:0 "Звёздный бомбардировщик B-25Z"
 tech_wsg_B25_desc:0 "Новое поколение палубной авиации с малым альфа-реактором и лёгкой IA-бронёй; входит в атмосферу, поднимая урон орбитальной бомбардировки флота."
 tech_wsg_PD:0 "Лазерный ПВО-массив Bofors 40CM"
 tech_wsg_PD_desc:0 "Передовой автомат ПВО превращает подлетающие ракеты и авиацию в космический мусор."
 tech_wsg_YL:0 "Альфа-торпеда 720DM"
 tech_wsg_YL_desc:0 "Суперторпеда с новейшим ИИ и IA-бронёй: перезарядка долгая, но одно попадание калечит — или топит — крупный корабль."
 tech_wsg_battleship_hull_3:0 "Корпусные модули нового поколения"
 tech_wsg_battleship_hull_3_desc:0 "С NEO и кристаллами Альфа на корабли встанет больше спинальных орудий."
 tech_wsg_hc:0 "Скрытая столица корабельных дев"
 tech_wsg_hc_desc:0 "Администрация больше не выносит удары ракет «Шанъю-1»: тайно перестраиваем астероид в скрытую столицу."
 tech_wsg_mine:0 "Абсолютная оборона"
 tech_wsg_mine_desc:0 "Передовая подготовка метропольной обороны поднимет нашу защищённость."
 tech_wsg_autocannon:0 "Кинетическая система ACSP"
 tech_wsg_autocannon_desc:0 "ACSP — редкая для дев кинетика: скорострельная пушка за секунды выливает на цель гору огня."
 tech_alpha_weapon:0 "Тёмная материя α"
 tech_alpha_weapon_desc:0 "Эксперименты госпожи Чанчунь доказали бездонный потенциал нового оружия."
 tech_wsg_203EX:0 "Тёмно-материальная α-группа 203"
 tech_wsg_203EX_desc:0 "Да, в родном Порту выжгли исполинскую яму — зато больше никто не усомнится в мощи этого оружия."
 tech_wsg_406:0 "Тёмно-материальный α-свет-меч 406M"
 tech_wsg_406_desc:0 "Госпожа Чанчунь, работы ещё много — отдыхать рано."
 tech_wsg_533:0 "Тёмно-материальный α-луч 533M"
 tech_wsg_533_desc:0 "Госпожа Чанчунь, в дефектной ведомости добавился сгоревший гриль доктора Юбари — ваша инженерная задача выросла."
 tech_wsg_alpha_propulsion:0 "Тёмно-материальный α-двигатель"
 tech_wsg_alpha_propulsion_desc:0 "Госпожа Чанчунь: вот медаль от вооружений флота, а вот — ваше задание на сегодня."
 tech_sensors_WSG:0 "Тёмно-материальный α-сенсор"
 tech_sensors_WSG_desc:0 "Исследования показали: малое слияние тёмной материи и Альфы стабильно выводит сигнал сенсора в верхние измерения — оттуда виднее."
 tech_wsg_s_460:0 "Тёмно-материальный α-луч S-460M"
 tech_wsg_s_460_desc:0 "Ветер на стройке — как же приятно."
 tech_wsg_s_406:0 "Тёмно-материальный α-луч S-406M"
 tech_wsg_s_406_desc:0 "Благодаря доблестной работе госпожи Чанчунь мы раскрыли давно припрятанный губернатором бетарианский рабочий стол."
 tech_wsg_pk_ovo:0 "Излучатель Света Квинси"
 tech_wsg_pk_ovo_desc:0 "Колосс получает исполинский «квинсификатор»: всё живое планеты переходит в квинсифицированное состояние."
