 wg_knight_titan_desc:0 "Когда человечество впервые двинулось покорять звёзды, покинуть Землю значило уйти навсегда и надолго остаться в полном одиночестве — колонии должны были выживать сами. Потому первопроходцы взяли с собой имперских рыцарей — на случай неведомых угроз выживанию.\n\nВ бою, разве что под градом противотанкового огня или прямым ударом титанического оружия, почти ничто не остановит неистовое крушение имперского рыцаря, вламывающегося в бронетанковые войска врага."
