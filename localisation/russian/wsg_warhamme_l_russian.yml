 job_wg_hive_city_ruler_cap:0 "$job_wg_hive_city_ruler$"
 job_wg_hive_city_ruler_desc:0 "Аристократия вершин улья живёт в роскоши и считает простолюдинов муравьями. Но даже так их роль в управлении и стабильности улья критически важна."
