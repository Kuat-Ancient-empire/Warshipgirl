 job_wg_forge_foundry_desc:0 "Эти рабочие живут и трудятся в наисквернейших условиях, обеспечивая выпуск огромного количества сплавов."
 job_wg_forge_research_effect_desc:0 "£job_wg_forge_research£ $job_wg_forge_research_plural$ потребляют £consumer_goods£ §Y$consumer_goods$§! и дают £physics£ £society£ £engineering£ повышенные§Y научные баллы§! на разработку новых технологий."
