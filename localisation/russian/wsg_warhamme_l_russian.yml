 job_wg_hive_city_soldier_desc:0 "Для обитателя улья, обречённого день за днём на тоскливый тяжёлый труд, место в резерве флота — недурной выбор."
 tech_wg_forge:0 "Кузнечные миры"
 tech_wg_forge_desc:0 "Кузнечный мир — промышленный и научный центр империи."
 wg_forge_edicts:0 "§HРазблокирует решение: §! построить кузнечный мир"
 wg_forge_edicts_desc:0 "Кузнечный мир — промышленный и научный центр империи."
 pc_wg_forge:0 "Кузнечный мир"
 pc_wg_forge_desc:0 "Кузнечные миры исконно принадлежат Культу Машины. Почти вся поверхность планеты укрыта сплошными заводами, атмосфера отравлена. Это не только промышленное сердце империи, но и важный научный центр."
 district_wg_forge:0 "Кузнечный горн"
 district_wg_forge_plural:0 "Кузнечные горны"
 district_wg_forge_cap:0 "$district_wg_forge$"
 district_wg_forge_cap:0 "$district_wg_forge$"
 district_wg_forge_desc:0 "Этот район усыпан горнами промышленного производства; чтобы плавить сплавы день и ночь, рабочих принуждают непрерывно находиться в опасной среде."
 district_wg_forge_research:0 "Храм Машины"
 district_wg_forge_research_plural:0 "Храмы Машины"
 district_wg_forge_research_cap:0 "$district_wg_forge_research$"
 district_wg_forge_research_cap:0 "$district_wg_forge_research$"
 district_wg_forge_research_desc:0 "В храмах Машины хранятся обширные знания Культа Машины; его служители, быть может, костлявы и медлительны, но для будущего империи они критически важны."
 job_wg_forge_foundry_effect_desc:0 "£job_wg_forge_foundry£ $job_wg_forge_foundry_plural$ превращают £minerals£ §Y$minerals$§! в £alloys£ §Y$alloys$§!"
