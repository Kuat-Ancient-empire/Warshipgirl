l_russian:

 tech_wg_hive_city:0 "Миры-ульи"
 tech_wg_hive_city_desc:0 "Если империя вновь хочет взойти на вершину галактики, нам придётся любыми средствами заполучить массу рабочей силы — и миры-ульи практически наш единственный выбор."
 wg_hive_city_edicts:0 "§HРазблокирует решение: §! построить улей"
 wg_hive_city_edicts_desc:0 "Улей способен вместить население в миллиарды."
 pc_wg_hive_city:0 "Мир-улей"
 pc_wg_hive_city_desc:0 "Природная экосистема почти полностью уничтожена; планету усыпляют уродливые, упирающиеся в небеса массивы, что зовутся ульями. Население таких миров исчисляется миллиардами; большинство жителей нижних ярусов живут в грязи и тесноте, в поте лица производя всё, что нужно империи, и поставляя ей призывников."
 district_wg_hive_world_housing:0 "Город-улей"
 district_wg_hive_world_housing_plural:0 "Города-ульи"
 district_wg_hive_world_housing_cap:0 "$district_wg_hive_world_housing$"
 district_wg_hive_world_housing_cap:0 "$district_wg_hive_world_housing$"
 district_wg_hive_world_housing_desc:0 "Лишённые всякой эстетики сверхплотные скопления, похожие на уродливое растение, растущее без присмотра. Каждый день здесь рождается невообразимое число детей; большинство жителей нижних ярусов проводят всю жизнь в тесноте и грязи, производя для империи самые разные ресурсы."
 district_wg_hive_world_admin:0 "Крепость-улей"
 district_wg_hive_world_admin_plural:0 "Крепости-ульи"
 district_wg_hive_world_admin_cap:0 "$district_wg_hive_world_admin$"
 district_wg_hive_world_admin_cap:0 "$district_wg_hive_world_admin$"
 district_wg_hive_world_admin_desc:0 "Эти несокрушимые военные крепости — незаменимая оборонительная сила улья; здесь же тренируются массы резервистов, пополняющие армию империи боевым составом."
 job_wg_hive_city_foundry_effect_desc:0 "£job_wg_hive_city_foundry£ $job_wg_hive_city_foundry_plural$ превращают £minerals£ §Y$minerals$§! в £alloys£ §Y$alloys$§! и £consumer_goods£ §Y$consumer_goods$§!"
