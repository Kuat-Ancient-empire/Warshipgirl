 wg_chaos_hole_object:0 "Врата Хаоса"
 building_wg_artificial_uteru:0 "Искусственные матки"
 building_wg_artificial_uteru_desc:0 "Искусственная матка — технология, которую почти можно считать запретной: именно она позволила Кригу за десятки тысяч лет сохранять население, достаточное для борьбы с Хаосом."
 wg_krieg:0 "Корпус смерти Крига"
 wg_krieg_desc:0 "Эти преданные воительницы-корабли с Крига не ведают страха, не считаются с ценой и хладнокровно и безупречно исполняют любой приказ."
