 wg_krieg_cap:0 "$wg_krieg$"
 wg_nicroid_death_battler_desc:0 "Когда-то они были из плоти — теперь это механические воины, чья древность превосходит всякое воображение и даже эльдар. Они обладают несравненной наукой и десятки миллионов лет дремали в стазисных склепах. Но вот они начали пробуждаться — и их цель вернуть династиям некронов господство над галактикой."
