l_russian:

 SRA_SOGZ_UF:0 "Копьё Конца Объединения"
 SRA_UF_T_weapon_supreme:0 "§YАрмагеддон§!"
 SRA_UF_T_weapon_supreme_DESC:0 "§YШвыряем энергию звёздного скопления. Звучит мощно, но проклятые ослы порезали всё — AoE так и нет. §!"
 SRA_UF_T_weapon_1:0 "§YКрах мироздания§!"
 SRA_UF_T_weapon_1_DESC:0 "§YГлавная батарея Доброты, серия 1: один мимолётный удар — и система обращена в прах. §!"
 SRA_UF_T_weapon_2:0 "§YГрех и кара§!"
 SRA_UF_T_weapon_2_DESC:0 "§YГлавная батарея Доброты, серия 2: левый ствол — Грех, правый — Кара. §!"
 SRA_UF_T_weapon_3:0 "§Y«Ты обязан быть добрым»§!"
 SRA_UF_T_weapon_3_DESC:0 "§YГлавная батарея Доброты, серия 4: то, что называется «наставлять на путь истинный». §!"
 SRA_UF_T_weapon_4:0 "§YНачало и конец§!"
 SRA_UF_T_weapon_4_DESC:0 "§YГлавная батарея Доброты, серия 3: я дарую вам жизнь — и принесу вам смерть. §!"
 SRA_UF_T_weapon_5:0 "§YБожественное копьё «Гунгнир»§!"
 SRA_UF_T_weapon_5_DESC:0 "§YГлавная батарея Доброты, серия 5: говорят, это неизменно попадающее копьё никогда не попадает в цель. §!"
 SRA_UF_T_weapon_6:0 "§YПобедный драконий меч§!"
 SRA_UF_T_weapon_6_DESC:0 "§YГлавная батарея Доброты, серия 6: взлетать — можно всё. §!"
 SRA_UF_collision:0 "§RЯ тебя снесу! §!"
 SRA_UF_collision_DESC:0 "§YЛёгкое касание — и прочие бедные кораблики разбиваются вдребезги. §!"
 SRA_UF_SHIP_Thruster:0 "§YРядом и за тридевять земель§!"
 SRA_UF_SHIP_Thruster_DESC:0 "§YЕсли можно крутить само устройство мира — кому нужны первобытные двигатели? §!"
 SRA_UF_Sensor:0 "§YОко всезнания§!"
 SRA_UF_Sensor_DESC:0 "§YСо взгляда высшего уровня прошлое, настоящее и будущее — просто плёнка, разложенная на столе. §!"
 SRA_UF_Reactor:0 "§YМиллиард звёзд§!"
 SRA_UF_Reactor_DESC:0 "§YЗвучит несбыточной фантазией, но этот колосс в самом деле создан щелчком пальцев Глубинной Тирпиц. Её абсолютная власть над реальностью движет Копьём Конца Объединения: миллиард звёзд сплавлены в одну точку, бесчисленные огоньки сотканы в созвездия. §!"
 SRA_UF_Jump:0 "§YМгновение — и все миры§!"
 SRA_UF_Jump_DESC:0 "§YНемыслимая сила двигает колосс со скоростью мысли: в один миг — в любой уголок вселенной. §!"
 SRA_UF_Computer:0 "§YСвобода манёвра§!"
 SRA_UF_Computer_DESC:0 "§YДля неё флотская война — что игра, разницы никакой. §!"
 SRA_UF_A_1:0 "§YРазрешение на применение§!"
 SRA_UF_A_1_DESC:0 "§YРазрешение Глубинной Тирпиц: ограничения на вооружение сняты — кроши ненавистных кошмаров измерений или кристаллических сущностей на здоровье, устраивай колоссальную засветку и супер-взрывы ярче звезды (всё равно без урона по площади). §!"
 SRA_UF_A_2:0 "§YВерховное владычество§!"
 SRA_UF_A_2_DESC:0 "§YУ врагов нет права на сопротивление — ибо недостойны, о недостойны; именно потому — недостойны. §!"
 SRA_UF_Aura_1:0 "§Y«Одинокая королева Севера»§!"
 SRA_UF_A_3:0 "§YВласть над вселенной§!"
 SRA_UF_A_3_DESC:0 "§YВластвуй над реальностью как заблагорассудится, превзойти любые оковы. Твоя броня ничтожна, твоя вера гроша ломаного не стоит. §!"
 SRA_UF_Aura_2:0 "§Y«Чудо — тебе»§!"
