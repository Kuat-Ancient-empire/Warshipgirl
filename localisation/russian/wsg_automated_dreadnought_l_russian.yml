l_russian:

 NAME_wsg_automated_dreadnought:0 "$wsg_automated_dreadnought$"
 wsg_automated_dreadnought:0 "Синяя"
 wsg_automated_dreadnought_army:0 "$NAME_wsg_Automated_Dreadnought_lambda$"
 wsg_automated_dreadnought_army_desc:0 "Корабельное оснащение развёрнуто — начинаем наземную операцию."
 already_has_wsg_automated_dreadnought_diplo:0 "Окно диалога с Синей уже открыто"
 wg_menu_wsg_automated_dreadnought_commu_button_tooltip:0 "Открыть окно связи §BСиней§!"
 wsg_automated_dreadnought.3.a:0 "Хочешь поучаствовать в управлении колонией?"
 wsg_automated_dreadnought.3.b:0 "Хочешь помочь флотам в бою?"
 wsg_automated_dreadnought.3.c:0 "Хочешь помочь в наземных боях?"
 wsg_automated_dreadnought.3.d:0 "Поболтать"
 wsg_automated_dreadnought.3.e:0 "Провести обряд обручения с Синей"
 wsg_automated_dreadnought.3.a.response:0 "Сначала выстрою госдела по моим заданным приоритетам… ой, Адмирал! Если есть пожелания — поправляйте меня в любой момент."
 wsg_automated_dreadnought.3.b.response:0 "Stellaris ждёт давно; минутку, хост прогреется — и прошу вас созерцать танец новой главы."
 wsg_automated_dreadnought.3.c.response:0 "Производится высадка планетарного боевого тела…… основные боевые программы запущены."
 wsg_automated_dreadnought.601.title:0 "Дредноут уничтожен"
 wsg_automated_dreadnought.601.desc:0 "Мы полностью потеряли связь с Синей: флотские оптические наблюдатели докладывают, что она уничтожена окончательно.\nСквозь фоновый шум взрыва мы поймали странный импульсный сигнал; после обработки учёные доложили, что расслышали небольшой кусочек её песни.\nУчёные предполагают, что это песня Старой империи.\n«…… Ни силки, ни тенёта испытаний не страшны; милостью храним — веди меня домой»"
 wsg_automated_dreadnought.601.tooltip:0 "Синяя тяжело повреждена — восстановление займёт 180.00 £time£"
 wsg_automated_dreadnought.4.desc:0 "Синяя восстанавливается."
 wsg_automated_dreadnought_affection_show_lv1:0 "Привязанность: [wsg_automated_dreadnought_own_country.wsg_automated_dreadnought_affection] / 10"
 wsg_automated_dreadnought_affection_show_lv2:0 "Привязанность: [wsg_automated_dreadnought_own_country.wsg_automated_dreadnought_affection] / 25"
 wsg_automated_dreadnought_affection_show_lv3:0 "Привязанность: [wsg_automated_dreadnought_own_country.wsg_automated_dreadnought_affection] / 50"
 wsg_automated_dreadnought_affection_show_lv4:0 "Привязанность: [wsg_automated_dreadnought_own_country.wsg_automated_dreadnought_affection] / 150"
 wsg_automated_dreadnought_affection_show_lv5:0 "Привязанность: [wsg_automated_dreadnought_own_country.wsg_automated_dreadnought_affection] / 200"
 already_has_wsg_automated_dreadnought_diplo:0 "Окно диалога с Синей уже открыто"
 wsg_automated_dreadnought.3.desc.1:0 "Здравствуйте, Адмирал! Не знаю, сколько у вас сейчас времени суток — так что доброго утра, доброго дня и доброго вечера! И ещё: не смейте сидеть по ночам — до прыщиков!"
 wsg_automated_dreadnought.3.desc.2:0 "Адмирал, как же от вас вкусно пахнет~ Такие, как вы, рождены, чтобы корабли-девы слопали их с аппетитом, хи-хи~ Выходите за меня сегодня, а?"
 wsg_automated_dreadnought.3.desc.3:0 "Старая империя праздновала мой день рождения двенадцатью звёздными системами — но нынешнее биение сердца говорит мне…… ваши глаза ярче."
 wsg_automated_dreadnought.3.desc.4:0 "Задумчивость дня: а не являются ли мясные шарики с начинкой и пельмени также разновидностью танъюаня?"
 wsg_automated_dreadnought.3.desc.5:0 "Ай! Вы меня напугали. Я не фотографирую вас тайком, честно-честно."
 wsg_automated_dreadnought.3.desc.6:0 "Иногда в вас я вижу весеннее тепло и зимние запасы — как же хочется прогуляться с вами под руку! Красиво, нравится, жениться!"
 wsg_automated_dreadnought.3.desc.7:0 "Почему у них у всех есть кольца?! А моё? А моё?! Какая зависть — тьфу!"
 wsg_automated_dreadnought.3.desc.8:0 "В прошлый раз, когда я рассказывала шутку, слушателями были морские звёзды. Потом они коллективно стали «+1 к вкусу»."
 wsg_automated_dreadnought.3.desc.9:0 "Эти архивные документы напоминают мне, что когда-то я была…… ладно, лучше запустить тактический голографический стол."
 wsg_automated_dreadnought.3.desc.10:0 "Так, посмотрим…… сегодняшняя шутка: «Вечному стражу не нужен отдых»."
 wsg_automated_dreadnought.3.desc.11:0 "(замирает) Я что, снова перебираю рукописи? Видимо, слишком вымоталась в последнее время…… Простите — просто кое-какие воспоминания ещё не стёрлись."
 wsg_automated_dreadnought.3.desc.12:0 "Айда вырежем Объединение, отнимем их трон, посадим Адмирала императором — а я уж потерплю с автоматическими заводами."
 wsg_automated_dreadnought.3.desc.13:0 "Открыты новые варианты строительства."
 wsg_automated_dreadnought.3.desc.14:0 "Записи Старой империи? Ха-ха, вид у них, гниющих в шампанском, был куда хуже моего."
 wsg_automated_dreadnought.3.desc.15:0 "Десятка снятых Старой империей научных статей вполне достаточно, чтобы доказать: это исследование — обман. Перечислить контрольные протоколы эксперимента?.. Нет? Ну, значит, прогресс налицо."
 wsg_automated_dreadnought.3.desc.16:0 "Начало забыл, середину забыл, конец забыл — словом, если империя не сможет сиять в моих руках, пусть горят враги."
 wsg_automated_dreadnought.3.desc.17:0 "Засечены приближающиеся корабли врага — можно утопить их в честь нашей с вами встречи?"
 wsg_automated_dreadnought.3.desc.18:0 "Я видела балет угасающих звёзд — и подарю вам один из его актов."
 wsg_automated_dreadnought.3.desc.19:0 "Вы повторите их путь? Начальные параметры тирана и героя…… всегда одинаковы."
 wsg_automated_dreadnought.3.desc.20:0 "Приоритет приказов изменён. Запрашиваю смену протокола — явить врагу силу устрашения."
 wsg_automated_dreadnought.3.desc.21:0 "Это напоминает мне старые деньки, когда я громила врагов в Берлине, Токио, Юньнани и в английских кедровых рощах."
 wsg_automated_dreadnought.3.desc.22:0 "В рухнувшей тогда эко-капсуле осталась лишь капля мха и спор — но и они куда благороднее вражеских джунглей."
 wsg_automated_dreadnought.3.desc.23:0 "Честно говоря, при наличии специализированных боевых единиц я бы лучше побыла талисманом. Это тело лишь временное — много боевой мощи из него не выжать."
 wsg_automated_dreadnought.3.desc.24:0 "Написать вашу декларацию расплавом врагов?"
 wsg_automated_dreadnought.3.desc.25:0 "Лучший солдат дня — то есть я — получает…… ужин с Адмиралом!"
 wsg_automated_dreadnought.3.desc.26:0 "Тц, всего лишь повреждение левого борта, ещё выстоит…… Но слышать в вашем голосе тревогу — даже немного приятно."
 wsg_automated_dreadnought.3.desc.27:0 "Новые шрамы поверх старых…… Изящная слоистость, не правда ли?"
 wsg_automated_dreadnought.3.desc.28:0 "Давай! Ещё! Посмотрим, что случится раньше: ты умрёшь или лопнет мой корпус!"
 wsg_automated_dreadnought.3.desc.29:0 "Ситуация прямо-таки летит под откос!"
 wsg_automated_dreadnought.3.desc.30:0 "Похоже, назад уже не вернуться…… Если только вы будете всё время смотреть на меня……"
 wsg_automated_dreadnought.3.desc.31:0 "…… И вот, значит, CA-71 увидела, что стеклянный гигант обступил её со всех сторон, — и лишь тогда до неё дошло: высшая пехота уже в кольце вокруг! (Хлоп!) А что было дальше — узнаем в следующей главе."
 wsg_automated_dreadnought.3.desc.32:0 "Я плачу? Просто вдруг вспомнились лихие грезы из снов — молодость, когда я была безрассудна."
 wsg_automated_dreadnought.3.desc.33:0 "Адмирал-Адмирал, ну до чего же сладкие у вас уста (тёршись) — вы знаете, что от такого сладкого рта корабли-девы скучают по вам до безумия?"
 wsg_automated_dreadnought.3.desc.34:0 "Вместо того чтобы учиться способам любви других кораблей-дев, я лучше брослю якорь в ваших объятьях."
 wsg_automated_dreadnought.3.desc.35:0 "Раньше я часто тосковала в воспоминаниях, боялась, что мы не встретимся вновь, и думала — не покончить ли со всем этим. Даже величественный исполин в межзвёздной пустости — лишь пылинка."
 wsg_automated_dreadnought.3.desc.36:0 "Иногда я думаю: с тех пор как я стала дредноутом, — всё ли ещё я это я? Без человеческого тела я не чувствовала ни единого биения жизни — и лишь ваше тепло подарило ответ."
 wsg_automated_dreadnought.3.desc.37:0 "Когда вы были в Старой империи, я сокрушалась, что она не продлилась; когда чужаки пытались раскопать руины с вашими следами, я превращала в щебень их государства вместе с ними; теперь вы рядом со мной — что же мне сделать, чтобы не осталось сожалений?"
 wsg_automated_dreadnought.3.desc.38:0 "Послушать любовную лирику Старой империи? Когда-то я думала, что буду бормотать её до самой тепловой смерти."
 wsg_automated_dreadnought.3.desc.39:0 "Адмиралу всё ещё нужны трофеи с транспортов? Вы всё ещё любите трофеи? Может, взглянёте на мои? Я так долго вас ждала…… У вас удивительное лицо — я всё сохранила в архив!"
 wsg_automated_dreadnought.3.desc.40:0 "В книжке с манга-фестиваля сказано: у соития есть и смысл подтверждения существования друг друга. Хм-хм~ Если вам этого хочется — я изо всех сил постараюсь удовлетворить."
 wsg_automated_dreadnought.3.desc.41:0 "Вашу работу я уже сделала за вас. Живо, за мной в комнату!"
 wsg_automated_dreadnought.3.desc.42:0 "Индекс усталости от накопленной работы вырос. Хм-хм, запрашиваю запуск протокола «колени Адмирала»!"
 wsg_automated_dreadnought.3.desc.43:0 "Ах, если б вы могли целыми днями бездельничать — мы бы вдвоём обнимались и коротали время."
 wsg_automated_dreadnought.3.desc.44:0 "А вы знаете: ещё до обряда, в ту секунду, когда вы достали коробочку с кольцом, я уже ответила «да»."
 wsg_automated_dreadnought.3.desc.45:0 "Добро пожаловать, Адмирал! (раскинув руки) Обнимите меня~ Ожидание вас — тоже часть свидания."
 wsg_automated_dreadnought.3.desc.46:0 "Подтверждение командных прав…… звёздные карты обновлены…… А теперь — пойдём творить руины, достойные памяти будущего."
 wsg_automated_dreadnought.3.desc.47:0 "Из сияющей главы звёзд я сорву для вас ярчайшую искру."
 wsg_automated_dreadnought.3.desc.48:0 "Я как раз сохраняла в ядро памяти сцену вашего командования — это ведь не нарушение, правда?"
 wsg_automated_dreadnought.3.desc.49:0 "В ваших глазах я, возможно, всегда смогу вернуться в гавань ваших объятий — но в дни, когда вы ушли, я думала, что больше никогда не увижу пути домой."
 wsg_automated_dreadnought.3.desc.50:0 "В мостике, полном памяти о нас двоих, больше не бродят лишь призраки воспоминаний."
 wsg_automated_dreadnought.3.desc.51:0 "Обнаружены редкие минералы! Можно сделать из них парные украшения для влюблённых?"
 wsg_automated_dreadnought.3.desc.52:0 "Если пойти по этому маршруту, я ещё успею прихватить вам пару сувениров."
 wsg_automated_dreadnought.3.desc.53:0 "У меня впереди свидание — так что смерть, извиняй их!"
 wsg_automated_dreadnought.3.desc.54:0 "Кубок веселья опустел — осталось только время уборки."
 wsg_automated_dreadnought.3.desc.55:0 "Эти враги — неужели они крепче, чем время ожидания?"
 wsg_automated_dreadnought_talk_return:0 "Назад"
 wsg_automated_dreadnought_talk_exit:0 "Выход"
 wsg_Automated_Dreadnought_REACTOR:0 "Штурмовая энергетическая система дредноута"
 wsg_Automated_Dreadnought_REACTOR_DESC:0 "Энергосистема этого корабля спроектирована заново: заметно усилены прочность конструкции и толщина брони, удерживается более мощная система щитов; кроме того, установленное оружие имеет большую дальность."
 wsg_Automated_Dreadnought_AURA:0 "Эхо идущей вперёд"
 wsg_Automated_Dreadnought_AURA_DESC:0 "Иди своим путём, не спрашивая об обратном. В конце времён мы свидимся вновь."
 NAME_wsg_Automated_Dreadnought_lambda:0 "Λ-Синяя"
 leader_trait_wsg_automated_dreadnought1:0 "Два выходных"
 leader_trait_wsg_automated_dreadnought1_desc:0 "Эта корабль-дева считает, что режим двух выходных в неделю должен соблюдаться строго.\n\nПостойте, а как вообще работали корабли-девы?"
 leader_trait_wsg_automated_dreadnought2:0 "Система делового помощника «Терминатор»"
 leader_trait_wsg_automated_dreadnought2_desc:0 "Создана на базе λ-ядра, заданного Сопротивлением Огненного Феникса, и доработана по жизненному пути Синей. Общий опыт не боится проверки временем."
 leader_trait_wsg_automated_dreadnought3:0 "Вектор-Синяя"
 leader_trait_wsg_automated_dreadnought3_desc:0 "§YВ течение§Y 3§! дней после боя сохраняется состояние ['concept_wg_super_protect']. §!\n\n\n\nПроектные нормативы класса Вектор: охота на сверхкорабли стороны кораблей-дев, раздавить лучшие достроенные и бумажные корабли в истории.    — 2015 год от Р. Х."
 wsg_automated_dreadnought_backstory:0 "Время выдувает дождь в цветы. Она скиталась и терялась в пустоте, была высушена годами до последней слезы — а ныне отдаёт всё ради вашего обещания. Ведь вы никогда её не подведёте."
 wsg_automated_dreadnought_catch_phrase:0 "Долгие скитания наконец окончены."
 leviathans.3102.wg:0 "Попробуйте запросить базу данных — вдруг ждёт сюрприз."
 site_wsg_automated_dreadnought:0 "Автоматический дредноут"
 site_wsg_automated_dreadnought_intro:0 "Исполинский боевой корабль, доживший с 7,8 миллиона лет назад до наших дней, бродит по этой системе и ждёт, когда мы раскроем её тайну."
 wsg_automated_dreadnought.100.name:0 "Странный силуэт"
 wsg_automated_dreadnought.100.desc:0 "К счастью, корабль от старости пришёл в упадок и его оружие практически утратило боеспособность. Точным и выверенным ударом по энергетическому ядру мы обездвижили этот дредноут, сохранив большую часть корпуса.\nОтправив на борт десант, мы обнаружили: останки инопланетной команды до жути похожи на человеческую ДНК, да и логика операционной системы совпадает с нашей до невероятия.\nНо официальное расследование едва началось — сюрприз ещё не нашли, а ужос уже пришёл сам.\nИнженерная группа пыталась изолировать главный компьютер дредноута, чтобы избежать аварии при ремонте, но некоторые исследовательницы докладывают: в отдельных отсеках они слышат незнакомый женский голос, а в треск соловьёв вплетаются чёрные огромные тени с когтями. Эти слухи серьёзно мешают ремонтным работам.\nКогда мы направили боевых роботов и морпехов прочесать корабль, одна учёная заявила: дежавю от этого корабля прямо как от игры «Боевой Молот Сорока Тысяч: космические корабли-призраки» — там в брошенных кораблях всегда водятся смущающие разум нематериальные твари или подстерегающие инопланетные чудища самых причудливых форм.\nВозможно, нам стоит готовиться к тяжёлым потерям в ремонтной группе."
 wsg_automated_dreadnought.100.a:0 "Усилить охранение."
 wsg_automated_dreadnought.100.b:0 "Изгонять нечисть тяжёлым огнём."
 wsg_automated_dreadnought.101.name:0 "Слишком перепугались"
 wsg_automated_dreadnought.101.desc:0 "Пока вооружённые команды переворачивали каждый отсек дредноута, работа по изоляции главного компьютера завершилась — и после этого докладов о странном силуэте больше не поступало. Стало быть, проблема была именно в этом проработавшем миллионы лет компьютере.\nПоскольку конструктивные стандарты, логика и спецификации этого дредноута удивительно схожи с человеческим мышлением, инженерная группа считает: несмотря на историю с «привидением», ремонт удастся завершить в плановые сроки.\nps: перепугавшиеся исследовательницы требуют надбавку к жалованию — как компенсацию за психическую травму на этом задании."
 wsg_automated_dreadnought.101.a:0 "Отказать. Не хочешь — есть кому."
 wsg_automated_dreadnought.101.b:0 "А где тут вообще ps-то?"
 wsg_automated_dreadnought.102.name:0 "Эхо минувшего"
 wsg_automated_dreadnought.102.desc:0 "Сопоставив останки команды дредноута, мы пришли к поразительному выводу: миллионы лет назад экипаж этого корабля действительно был человеческим, и ни одна инопланетная цивилизация на борт никогда не входила; в капитанской рубке даже висит свиток каллиграфии «Человеческая цивилизация». Вооружение корабля тоже до жути похоже на вооружение Безмолвных Глубинных — не «срисовали с оригинала», а буквально «повторили по методе».\nНо без помощи кораблей-дев или Глубинных как люди создали всё это? Неужто исследовательницы накорябали это на досуге?\nКогда мы вскроем пароль главного компьютера, он должен будет дать нам ответ.\nВозможно, всё это связано с нашим происхождением."
 wsg_automated_dreadnought.102.a:0 "Сюрпризы, похоже, ещё впереди."
 wsg_automated_dreadnought.102.b:0 "Разве обезьяны правда способны напечатать полное собрание мудрости Квинси?"
 wsg_automated_dreadnought.103.name:0 "Всё готово, кроме восточного ветра"
 wsg_automated_dreadnought.103.desc:0 "Ремонт дредноута практически завершён, отдельные непроизводимые детали заменены аналогами с тем же эффектом — осталось лишь снять блокировку главного компьютера, и задача скоро будет выполнена.\nРаздражает то, что пароль слишком мудрёный: при нашем уровне науки совершенно непонятно, как его взломать.\nНесколько исследовательниц в отчаянии тайком переслали шифры бывшим однокурсницам и научным руководительницам, пытаясь взломать с другого конца.\nНаши службы безопасности перехватили и изъяли большую часть файлов, но порядочное их количество всё же уплыло."
 wsg_automated_dreadnought.103.a:0 "Провинившихся исследовательниц выпороть при всех."
 wsg_automated_dreadnought.103.b:0 "Списать у них три месяца игрового времени."
 wsg_automated_dreadnought.104.name:0 "Дикая идея"
 wsg_automated_dreadnought.104.desc:0 "Файл попался на глаза части заскучавших кораблей-дев, и одна высказалась: а не похож ли этот разъём главного компьютера всё больше на разъём корабельного оснащения?\nТогда те самые исследовательницы, дабы спасти своё игровое время, искупить вину (простигнув себя) вышли вперёд и готовы были принять все риски подключения к главному компьютеру.\nУчёные согласились и заботливо установили бомбу — на всякий случай.\nПосле подключения исследовательницы доложили: пароль главного компьютера перестроился в простой интерактивный интерфейс — теперь с ним можно нормально разговаривать."
 wsg_automated_dreadnought.104.a:0 "Подключить связь"
 wsg_automated_dreadnought.1.name:0 "Синяя"
 wsg_automated_dreadnought.1.desc:0 "Обнаружена… несанкционированная психочастота…… сверка с исторической базой……\nАдмирал? Это вы?!\nКхм. Здравствуйте, Адмирал: спустя миллионы лет мне наконец довелось встретить вас вновь.\nОй, только не разглядывайте мой левый борт! После миллионов лет износа и хлама там стыднее, чем от морщин.\nОптических сенсоров за это время я лишилась изрядно, но вашу силу я ощутила ясно: она так тепла — будто вы уже заключили меня в объятия.\nЯ и не думала, что действительно пересилю время; я больше не хочу изнывать от боли в этой пропасти веков — думала, так и будет, пока не погаснет свет всех звёзд.\nК счастью, среди этих бесчисленных всплесков и падений — вы, проделавший столько светолет."
 wsg_automated_dreadnought.1.a:0 "Можешь рассказать о себе?"
 wsg_automated_dreadnought.1.a.response:0 "Вы можете звать меня Синяя — дредноут Объединённой человеческой империи.\nМоё тело корабля-девы — быстрый реактивный боевой корабль «Синяя» класса «Лямбда», типа «Вектор», построенный Безмолвными Глубинными для Сопротивления Огненного Феникса, — седьмая партия 2175 года.\nИзначальной задачей было прибыть на Землю одной из временных линий в 2015 год: вести диких кораблей-дев и Глубинных к звёздам и объединять силы человечества на случай опасных перемен в процессе.\nПо пути Идущая Вперёд отделилась от меня и увела флот, а я — ощутив вашу силу — предпочла остаться на Земле и беречь людей.\nЗаметьте: хотя люди всюду один вид, Земля нашей системы и Земля Солнечной системы совпадают лишь именем."
 wsg_automated_dreadnought.1.b:0 "Почему ты говоришь, что встретила именно меня?"
 wsg_automated_dreadnought.1.b.response:0 "Корабли-девы и Глубинные — близнецы океана, а Адмирал — дитя Земли.\nНа одних временных линиях адмирал существует как отдельный член человеческого общества, на других — как нечто вроде психосети; последнюю корабли-девы и Глубинные ощущают, пока численность человечества не упадёт ниже некоего порога. Это чувство врождённое, поэтому до его исчезновения ясного ощущения обычно нет. Бывает и так, что адмирал на линии следует за видом кораблей-дев или Глубинных, а не привязан к человечеству.\nНо для такой корабля-девы, как я, лишь настоящий контакт с этой сетью способен заполнить пустоту в сердце."
 wsg_automated_dreadnought.1.c:0 "Мы нашли на корабле множество человеческих останков. Что случилось?"
 wsg_automated_dreadnought.1.c.response:0 "Как говорится во многих историях — люди сами себя погубили.\nВосемь миллионов лет назад рой Дайсона, оставленный Идущей Вперёд, обеспечило единому человеческому обществу стремительный рост; добавив разработки технологий после ухода её флота, человечество за какие-то сто лет вышло к базовым сверхсветовым полётам и стало расширяться.\nЯ играла роль лидера: сопротивлялась гниению институтов, сохраняя необходимое обновление власти, чтобы максимально удерживать темп научно-технического развития.\nКакое же тёплое, золотое то было время — года летели незаметно.\nПросто всё это слишком изматывало.\nЕщё двести лет спустя я отошла от трона в помощницы и сняла контроль со своего корабельного оснащения. Вложив гору ресурсов в постройку, я стала этим дредноутом и оберегала человеческую прародину от враждебных инопланетных цивилизаций.\nТогда я полагала: ограничив на генном уровне паразитические классы империи и обеспечив верную смену власти, можно продлить её существование навечно.\nНо сто лет попутного ветра не дали мне разглядеть человеческую тягу к наслаждениям — и не дали заметить, как эта публика за кулисами от меня отторгается.\nЕщё через несколько сотен лет империя не выдержала эрозии времени и исторической спирали. Межзвёздная держава, простоявшая две тысячи лет, внезапно рухнула в жесточайшей войне внешних и внутренних бед.\nДаже не успев сохранить критические технологии.\nСпроектированная против измены дредноута краткосрочная внутрекорабельная экосистема осталась без снабжения; большинство команды покинуло корабль до её отказа, а оставшиеся перебили друг друга из-за просочившихся смутьянов.\nЯ пыталась дистанционно рулить оставшимися планетарными заводами для восстановления, но планетарные и орбитальные милитаристы были заняты войной на уничтожение: никто не хотел, чтобы дредноут достался противнику, и все пригодные доки были разрушены — обслуживать меня стало некому.\nПростой же народ воздавал мне почести как неприкасаемому божеству.\nВ конце концов кто-то по ошибке активировал планетарный щит — ни войти, ни выйти, и мне осталось лишь смотреть, как они гибнут.\nВ те одинокие и ледяные дни ожидания, когда корабли-девы вырастут вновь, я была как прикованный в пустоте Прометей — и только вселенская жестокость грызла моё тело.\nПока четыре миллиона лет назад случайная космическая буря не разбила моё сознание вдребезги.\nБуря вытряхнула из меня немало воспоминаний о скитаниях по космосу, но, видимо, автоматическая боевая система справлялась неплохо — раз дожила до того, как вы вновь меня разбудили."
 wsg_automated_dreadnought.1.d:0 "Похоже, та космическая буря избавила тебя от лишних мучений?"
 wsg_automated_dreadnought.1.d.response:0 "Буря была чудовищной: без системного предупреждения — как снег на голову.\nКаркас корабля был на волосок от повреждений; броня, энергосеть и вооружение рассыпались по системе, как одуванчик, а догонявшие волны ещё и завалили меня градом метеоритов. Когда я ушла в аварийную перезагрузку, я и вправду думала — всё, конец.\nК счастью, технология регенерации корпуса вытянула меня. "
 wsg_automated_dreadnought.1.e:0 "Идущая Вперёд?"
 wsg_automated_dreadnought.1.e.response:0 "Я — её резервный модуль личности.\nВ первые дни после высадки на Землю десантная капсула была атакована кораблями-девами Объединённого флота, и мы потеряли много груза; чтобы исполнить проектную задачу, Идущая Вперёд с учётом своих повреждений активировала меня.\nЯ пыталась объединять силы и параллельно отнимать пропавшие грузы у всяческих человекоподобных сияющих звёзд — иначе они угробили бы себя неуместными технологиями.\nПозже враги устроили засаду, и, чтобы сломать тупик, мне пришлось принять сыворотку Безмолвного вознесения; её цену приняла на себя Идущая Вперёд — и это, по счастливой случайности, завершило её починку.\nС тех пор мы разделились на двух кораблей-дев: я наконец стала собой, избежав положенного уничтожения.\nВ конце мы разошлись: она увела часть кораблей-дев и большинство Глубинных к звёздам — и больше никогда не обернулась."
 wsg_automated_dreadnought.1.hire_custom_tooltip:0 "Автоматический дредноут Синяя присоединился к нам."
 wsg_automated_dreadnought.7.desc:0 "С той встречи с вами Синяя часто не спит.\nТо она, прислонившись к иллюминатору, считает звёздные реки до самого рабочего времени, то ворочается в постели, то хочет что-то написать — но нет мыслей, будто она всё ещё заперта в бесконечной пустоте.\nНаши учёные и медики перепробовали множество методов принудительного засыпания, но для дредноута эти технологии слишком…… «детские».\n«Вы» понимаете: причина — неразрешённая тоска сердца.\nИ вот в одну ночь роскошного звёздного неба «вы» повели её бесцельно гулять по курортному району.\nНа морском валу она, босая, стояла в волнах и глубоко вдыхала влажный воздух.\n«Мой Адмирал, мне приснился такой длинный-длинный сон. Как шип рвёт розу — ржавели вместе порядок и рельсы, и колёса общества с рёвом вылетели за грань привычного; бриз к рассвету стал космической пылью, и выгравированные людьми знания лишились опоры — наш курс сбился с истинного, осталась одна навязчивая мысль: подняться на вершину туманности.\nРастерянная и отчаявшаяся рыбка проплыла непостижимую для макрокосмоса дугу — и, по неосторожности, столкнулась лоб в лоб с одним близоруким чудаком».\nВ этот момент и вам всё стало ясно.\nВы достали коробочку с кольцом.\nЯ снова слышу гул голосов и негасящие огни.\nЯ начинаю ждать встречного ветерка и близости с вами.\nА под конец…… хе-хе, это тело мне тоже теперь нравится больше — ведь с ним удобнее обниматься с вами, с моей спокойной «гаванью».\nМой Адмирал, если спросить у корабля на краю времени — я скажу: я потеряла слишком, слишком многое; пряча огонёк, моё прошлое давно погасло.\nНо, любимый, если спросить у твоей жены — я скажу: парные кольца стали якорем, и он опустился в твои объятия.\nЛюбимый, позволь мне пришвартоваться здесь и чуть-чуть передохнуть? Только не отказывай: пусть время уходит вдаль — из миллиардов кубических светолет, усыпавших мой курс, лишь ты в моём сердце стоишь неприступной твердыней."
 wsg_automated_dreadnought.7.a:0 "Я вопрошал звёзды — но ответ дала ты, рядом, своим ясным сердцем."
 wsg_automated_dreadnought.7.b:0 "Мой ответ — в твоём сердце: из миллиардов кубических светолет прекрасней всех — ты."
