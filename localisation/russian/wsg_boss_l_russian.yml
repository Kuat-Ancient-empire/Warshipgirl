 PSI_weapon_330:0 "330-мм психо-главкалибр"
 PSI_weapon_330_desc:0 "$tech_wsg_P330_desc$"
 wg_psi_planet_category:0 "Бестелые планеты"
 wg_psi_planet_category_desc:0 "Внутри планеты не найдено ничего, кроме энергии; её тело, похоже, утянуто исполинской силой в мнимое измерение — остаточная сила столь велика, что сложила проекцию планеты."
 wg_precursors_category:0 "Следы первопроходцев-кораблей-дев"
 wg_precursors_category_desc:0 "Здесь есть следы цивилизации кораблей-дев, старше нас на сотни тысяч и миллионы лет; глубокие изыскания могут дать нити к предтечам."
 wg_precursors_clues:0 "Нити предтеч-кораблей-дев"
 opinion_wg_save_our_species:0 "Спасла наш род"
 opinion_help_reform_country:0 "Помогла восстановить державу"
 wg_psi_dreadnought_object:0 "Обездвиженный психо-дредноут"
 wg_psi_dreadnought_object_desc:0 "Этот психо-дредноут обездвижен яростным огнём"
 origin_wg_psi_country:0 "Психокатастрофа"
 origin_wg_psi_country_desc:0 "Эта держава была поглощена Занебесьем за злоупотребление психосилой; к счастью, некая держава случайно нашла и спасла их."
 r_wg_psionic_gem:0 "Святой нефрит"
 r_wg_psionic_gem_desc:0 "По преданию, чудо-нефрит, дарованный Древними богами кораблям-девам в беде: вливание психи (энергии) открывает врата миров и являет чудо — но излишек силы оборачивается катастрофой."
 casus_belli_wg_holy_war:0 "Священная война"
 war_goal_wg_holy_war:0 "Священная война"
 war_goal_wg_holy_war_desc:0 "Смертная схватка с врагами богов — сдача не принимается."
 war_goal_wg_holy_war2:0 "Священная война"
 war_goal_wg_holy_war2_desc:0 "Орда смотрящих смерти в лицо фанатиков бьётся насмерть, выложившись вся. Пока одна из сторон не исчезнет — войне конца не будет."
 tech_wsg_P127:0 "$PD_PSI_weapon_127$"
 tech_wsg_P127_desc:0 "Средне-малая универсальная платформа: психоснаряды изрядно бьют палубную авиацию и щиты кораблей."
 tech_wsg_P330:0 "$PSI_weapon_330$"
 tech_wsg_P330_desc:0 "Корабельная пушка мощью большинства тяжёлых орудий; психоснаряд легко пробивает любые щиты, вспарывая корпус."
 pc_eye_shrouded:0 "Око Садморна"
 pc_eye_shrouded_desc:0 "Планета, растленная занебесными демонами: исполинский страшный глаз глядит на всё. Корабли, что пытались войти, не возвращались."
 wg_boss.202.name:0 "Пожиратель экумополисов: дракон Юкикадзэ!"
 wg_boss.202.desc_01:0 "Мы вошли в систему Великого Юя: все планеты залиты водой — ясно, кто виновник: свирепый голубой дракон. Одна из планет доказано была экумнополисом — увы, более его нет.\nДракон диковинен: изнутри полон воды; мы нарекли его§H «Юкикадзэ»§!"
 wg_boss.202.desc_02:0 "Мы вошли в систему Великого Юя: почти все планеты залиты водой — ясно, кто виновник: свирепый голубой дракон.\nПланета§H Венецианский дож§! — исполинский экумнополис; дракон раз в 5 лет пытается залить её, но вся вода через год уходит измеренной дренажной системой планеты в иные планы. Даже такая чернотехника не держит столь частых заливок: каждая уменьшает размер планеты.\nПо расчёту, без наших действий драгоценная планета к§R 2250§! году станет всеводной.\nДракон диковинен: изнутри полон воды; мы нарекли его§H «Юкикадзэ»§!"
 wg_boss.202.a:0 "Как жаль"
 wg_boss.202.b:0 "Принимаемся"
 wg_boss.205.name:0 "Юкикадзэ убита!"
 wg_boss.205.desc:0 "Страж системы испустил дух под нашим огнём. Дракон мучительно исторгал струи — но экумнополис всё спускал в иные миры!\n\nТеперь кольцо-город — наше!!"
 wg_boss.205.a:0 "Блестяще!"
 wg_boss.206.name:0 "Юкикадзэ убита!"
 wg_boss.206.desc:0 "Страж системы испустил дух под нашим огнём. Дракон мучительно исторгал струи — и те обернулись гигантской массой воды!\n\nУвы, мы опоздали: измеренный дренаж экумнополиса перегорел; вся планета под водой."
 wg_boss.206.a:0 "Обидно"
 wg_boss.209.name:0 "Луна Блрада"
 wg_boss.209.desc:0 "Войдя в систему [FROM.GetName] научный корабль [ROOT.GetName] увидал посреди кладбища кораблей исполина. Обличьем — точно космический кит, насаженный на раскрошенную планету; но научный офицер§H [ROOT.GetLeaderName]§! скоро отверг(а) сравнение: и щупальца, и прилипшая к ним плита — бывшая планета [ROOT.GetName]— живы; плиты же, похоже, — части туловища исполина. Биодетекторы [ROOT.GetName] доказали: нервы твари расползлись по всей видимой «планете».\nОбломки вокруг говорят о злонравии хозяев; но на вход нашего корабля тварь не среагировала. Научный офицер§H [ROOT.GetLeaderName]§! полагает: она «пока» сыта, либо научный корабель ей неинтересен.\nМы нарекли её§Y Луной Блрада§! — вроде из каких-то страшных мифов……\nЧтобы пройти систему: убить её; либо, пока нейтральна, §Yпоставить в системе базу§! и приручить; либо…… просто обойти."
 wg_boss.209.a:0 "Недурная дичь."
 wg_boss.209.b:0 "Древние боги…… что это!?"
 wg_boss.209.c:0 "Такая дива — стоит изучить."
 wg_boss.209.d:0 "Ты меня не видишь, я тебя не вижу……"
 wg_boss.210.name:0 "Изучение глубже"
 wg_boss.210.desc:0 "Со строительством в системе [Fleet.System.GetName] звёздной базы её инструменты помогут получше изучить кита. Он всё так же игнорирует нас и не уходит — лишь бесцельно бродит.\nКак бы то ни было, теперь у исследований отличная база."
 wg_boss.211.name:0 "Как говорить с§Y Луной Блрада§!"
 wg_boss.211.desc:0 "Наши исследователи в системе [wg_boss_lly_system.GetName] продвинулись в изучении космического кита§Y Луны Блрада§! Одна из исследовательниц брызнула в§Y Луну Блрада§! электромагнитной волной, близкой к мозговой, — проверить реакцию; к всеобщему изумлению, §YЛуна Блрада§! как дитя, повторил(а) волну той же частоты. Значит, у неё есть разум, и она говорит высокочастотными волнами§!\nИсследователи базы [wg_boss_lly_system.GetName] говорят: дайте ресурсы — за пару лет они «научат»§Y Луну Блрада§! нашему языку§Y (и даже переговорят с нами)"
 wg_boss.211.a:0 "Отлично; учрежаем проект"
 wg_boss.211.b:0 "Не будем рисковать: лишь бы не враждовал"
 COMMUNICATE_LLY:0 "Говорить с§Y Луной Блрада§!"
 COMMUNICATE_LLY_DESC:0 "Пошлём добавочные научные корабли — ресурсы для налаживания контакта с§Y Луной Блрада§!"
 NAME_cunning_lly:0 "Луна Блрада"
 NAME_lly:0 "Лилия"
 wg_boss.212.desc:0 "Добрые люди…… еда."
 wg_boss.212.a:0 "Стой: а обломки в системе?"
 wg_boss.212.a.response:0 "Хитрые люди…… били меня…… я ответил(а)…… съел."
 wg_boss.212.b:0 "Ладно; что за еда тебе нужна?"
 wg_boss.213.desc:0 "§HКорабль§!……\n\n[Тут§Y Луна Блрада§! повернул(а) «глаза» к научному кораблю, только что закончившему работу]\n\nЯ…… не ем добрых людей"
 wg_boss.213.a:0 "Ладно; но даром — нельзя"
 cannot_destroy_wsg_lady:0 "Как?! Ты хочешь сбыть Юную Госпожу? Убей.jpg"
 cannot_destroy_astesia:0 "Думаешь, этот ком грязи проглотит научный хаб? ("
 wg_boss.213.b:0 "Корабль? Нельзя: это наш ценный научный корабль."
 wg_boss.214.desc:0 "…… нельзя?"
 wg_boss.214.a:0 "Нельзя"
 wg_boss.214.b:0 "Задолбал: нельзя!"
 wg_boss.215.desc:0 "Хитрые люди…… прямо хитрющие…… Я не могу дышать"
 wg_boss.215.a:0 "Ты в космосе — чем дышишь"
 wg_boss.215.b:0 "? Добрые люди — это доброе дело"
 wg_boss.215.response:0 "И ещё…… не зовите меня…… Хитрой Луной…… я…… добрая Лилия."
 wg_boss.215.tooltip:0 "А у тебя и имя есть!"
 wg_boss.216.desc:0 "Добрые люди…… ответный дар…… вот…… любимая моя коллекция\nИ ещё…… не зовите меня…… Хитрой Луной…… я…… добрая Лилия.\n[§YЛилия§! пуляла(а) в нашу базу комом земли]"
 wg_boss.216.a:0 "У тебя и имя есть!?"
 wg_boss.216.a.tooltip:0 "Развернуть ком от Лилии"
 wg_boss.217.name:0 "Разворачиваем подарок"
 wg_boss.217.desc:0 "Ты в предвкушении разворачиваешь ком от Лилии, а внутри……\n\n\n\n\n§Yдрагоценный чёрный ящик§! Полный чернотехнологичных данных — наука империи рванёт вперёд!"
 wg_boss.218.desc:0 "Ты в предвкушении разворачиваешь ком от Лилии, а внутри……\n\n\n\n\n§Hдрагоценные редкие ресурсы§! Видимо, Лилия съела проходивший транспорт и сберегла груз."
 wg_boss.219.desc:0 "Ты в предвкушении разворачиваешь ком от Лилии, а внутри……\n\n\n\n\n§Hчёрный ящик§! с полезными научными данными."
 wg_boss.220.desc:0 "Ты в предвкушении разворачиваешь ком от Лилии, а внутри……\n\n\n\n\n§Hпанталончики§!?"
 wg_boss.221.desc:0 "Ты в предвкушении разворачиваешь ком от Лилии, а внутри……\n\n\n\n\n§Hальфа-кристаллы§! Ты глубоко задумался(ась) откуда у Лилии такое."
 wg_boss.222.desc:0 "Ты в предвкушении разворачиваешь ком от Лилии, а внутри……\n\n\n\n\n§Hвещество N.E.O§! Ты глубоко задумался(ась) откуда у Лилии такое."
 wg_boss.223.desc:0 "Ты в предвкушении разворачиваешь ком от Лилии, а внутри……\n\n\n\n\n§Hцелый ящик ресурсов§! Видимо, Лилия съела проходивший транспорт и сберегла груз."
 wg_boss.224.desc:0 "Ты в предвкушении разворачиваешь ком от Лилии, а внутри……\n\n\n\n\n§Bящик ресурсов§! Видимо, Лилия съела проходивший транспорт и сберегла груз."
 wg_boss.232.desc:0 "Ты в предвкушении разворачиваешь ком от Лилии, а внутри……\n\n\n\n\n§Hэнергетическое ядро Глубинных§! Ты глубоко задумался(ась) откуда у Лилии такое."
 wg_boss.233.desc:0 "Ты в предвкушении разворачиваешь ком от Лилии, а внутри……\n\n\n\n\n§YКольцо помолвки§!!!!????\nЛишь после троекратного подтверждения, что это чисто коллекционная ценность, ты успокоился(ась)"
 wg_boss.225.desc:0 "Ты в предвкушении разворачиваешь ком от Лилии, а внутри……\n\n\n\n\n…… ком земли, ком земли и ком земли."
 wg_boss.226.desc:0 "Добрые люди…… еда……"
 wg_boss.226.a:0 "Ладно; что на этот раз?"
 wg_boss.226.b:0 "Нельзя"
 wg_boss.229.desc:0 "…… ресурсы"
 wg_boss.229.a:0 "Ладно…… держи"
 wg_boss.229.a.response:0 "Добрые люди…… ответный дар…… вот…… любимая моя коллекция.\n[§YЛилия§! пуляла(а) в нашу базу комом земли]"
 wg_boss.229.b:0 "У нас и вправду почти ничего не осталось…………"
 wg_boss.229.b.response:0 "…… ладно"
 wg_boss.229.c:0 "Нельзя"
 wg_boss.230.name:0 "Конец Луны Блрада"
 wg_boss.230.desc.a:0 "После тяжкого боя наш доблестный флот нанёс исполину смертельный удар — пути он более не преградит.\nА после гибели твари флот нашёл в её теле партию сохранившихся минералов."
 wg_boss.230.desc.b:0 "Под нашим перекрёстным огнём пала даже Лилия с её исполинским телом.\nКак и ждали, в исполинском теле нашлись драгоценные минералы — флот вынул их без труда."
 wg_boss.231.desc:0 "Хитрые люди…… хитрюги…… прощайте же"
 wg_boss.231.a:0 "Добрая вселенная не для таких хитрюг"
 wg_boss_lly_buff_1:0 "Драгоценный научный чёрный ящик"
 wg_boss_lly_buff_1_desc:0 "Чёрный ящик с драгоценными научными данными; от него почему-то пахнет землёй……"
 wg_boss_lly_buff_2:0 "Научный чёрный ящик"
 wg_boss_lly_buff_2_desc:0 "Чёрный ящик с научными данными; от него почему-то пахнет землёй……"
 wg_boss_lly_buff_3:0 "$wg_boss_lly_buff_2$"
 wg_boss_lly_buff_3_desc:0 "$wg_boss_lly_buff_2_desc$"
 wg_boss_lly_buff_4:0 "$wg_boss_lly_buff_2$"
 wg_boss_lly_buff_4_desc:0 "$wg_boss_lly_buff_2_desc$"
 cunning_lly:0 "Луна Блрада"
 lly_weapen_T:0 "Дыхание хитреца"
 lly_weapen_L:0 "Хитрый дух"
 eddy_fish:0 "Магнитно-штормовой катер"
 eddy_fish2:0 "Магнитно-штормовой линкор"
 weapon_type_anti_group_member:0 "§YПередовой антигрупповец§!"
 weapon_type_eddy_tag:0 "§YВеликий магистр магнитных бурь§!"
 weapon_type_eddy_tag1:0 "§YМотиватор ИИ§!"
 weapon_type_eddy_tag2:0 "§YЦелитель давления§!"
 weapon_type_eddy_tag3:0 "§YНоминальное напряжение§!"
 eddy_fish_tesile:0 "Магнитно-штормовое ружьё"
 eddy_fish_tesile2:0 "Магнитно-штормовая новая"
 Natasha_object:0 "Наташа"
 Natasha_object_desc:0 "Мы снова потеряли Наташу. Почему «снова»?"
 wg_boss.251.name:0 "Высокое напряжение"
 wg_boss.251.desc:0 "Место опасное! Систему со свирепыми грозами стерегут странные корабли, стилем совсем не вяжущиеся с нашими.\n\nВсе они стремительны, а главное — несут некое короткобойное молниевое оружие: сойдёшься вплотную — мало не покажется!!"
 wg_boss.251.a:0 "Внимание! Держим дистанцию!!"
 wg_boss.253.name:0 "Стая разбита"
 wg_boss.253.desc:0 "После череды опасных схваток мы одолели магнитно-штормовой флот — система безопасна.\n\nПора послать корабли за поживой."
 wg_boss.253.a:0 "Время трофеев"
 wg_boss.254.name:0 "Или — или"
 wg_boss.254.desc:0 "Мы обшарили систему и нашли в обломках исполинского линкора два целых сейфа.\n\nВ одном — драгоценные данные, что изрядно поднимут боеспособность флота, плюс проект зенитки.\nВ другом — игра под названием§R «Red Alert 4»§!\n\nАвтор мода запретил брать оба (сейфы спарены: откроешь один — сгорит второй), придётся выбирать.\n\nЧто возьмём: мощный бафф — или§R Red Alert 4§!?"
 wg_boss.254.a:0 "Игры, которой нет, — пусть сгорит"
 wg_boss.254.b:0 "§RХоть бы ничего — но я играю в Red Alert 4!!! §!"
 wsg_eddy_fish_buff:0 "Применение магнитных бурь"
 eddy_fish_flak:0 "Советская зенитка"
 eddy_fish_flak_DESC:0 "Облик нарочито ретро, а по мощности обходит большинство одноклассников."
 tech_eddy_fish_flak:0 "Советская зенитка"
 tech_eddy_fish_flak_desc:0 "Облик нарочито ретро, а по мощности обходит большинство одноклассников."
 kind_seal:0 "Большая нерпа"
 SMALL_weapon_seal:0 "Копьё добра"
 EX_weapon_seal:0 "Свет добра"
 kebab_seal:0 "Межзвёздный центр жарки нерп"
 kebab_seal_DESC:0 "Эту поганую нерпу решено зажарить на пламени звезды."
 kebab_seal_MEGASTRUCTURE_DETAILS:0 "Эту поганую нерпу решено зажарить на пламени звезды."
 requires_only_one_kebab_seal:0 "$TRIGGER_FAIL$ Нам нечего больше жарить"
 wg_boss.255.name:0 "Нерпа сбежала!"
 wg_boss.255.desc:0 "Мы запустили трапезу воровки-нерпы, и нерпа, что пряталась в центре жарки, выросла так, что центр её уже не вмещает. Она вырвалась на волю и полна злобы!"
 wg_boss.255.a:0 "Убить!"
 wg_boss.257.name:0 "Нерпа убита!"
 wg_boss.257.desc:0 "Под нашим мощным огнём зловредная нерпа наконец пала! Что делать с гигантским куском белка — решаем……"
 wg_boss.257.a:0 "Нарезать в слайсы!"
 wg_boss.257.a.tooltip:0 "В нерпятине масса токсинов — народ может отравиться"
 wg_kebab_seal:0 "Нерповый токсин"
 wg_boss.257.b:0 "Зажарить на жаре звезды!"
 wg_boss.257.b.tooltip:0 "§HОткрывает мегасооружение: §! межзвёздный центр жарки нерп\nТоксины выжжет звёздный жар"
 wg_boss.258.name:0 "Нерпа на вертеле!"
 wg_boss.258.desc:0 "Чтоб не пропадало и избежать токсинов, мы соорудили исполинский вертел: звёздный жар выжжет вредное.\n\nНерпа размером со звезду — но чуть хитра:\nОдной на всю страну — на жизнь сытной еды."
 wg_boss.258.a:0 "Отлично!!"
 type59_T:0 "59-я звездорушащая пушка"
 type59:0 "Танк Тип 59"
