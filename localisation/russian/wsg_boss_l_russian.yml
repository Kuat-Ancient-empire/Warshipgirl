 site_wg_Rosmontis:0 "Таинственное мегасооружение"
 site_wg_Rosmontis_intro:0 "Исполин скрыт за таинственной вуалью — стоит заглянуть."
 wg_boss.510.name:0 "Заброшенная инженерная станция"
 wg_boss.510.desc:0 "Первичный осмотр: эта астероидная станция существует минимум 30 миллионов лет. Артефакты являют стиль кораблей-дев; тут масса биолабораторий и малых производств.\nПеревод грамот: это стройплощадка того исполинского соседа; они звали его «машиной возгонки сознания»."
 wg_boss.510.a:0 "Продолжаем."
 wg_boss.510.b:0 "$pc_cosmogenesis_world$?"
 wg_boss.511.name:0 "Мокрое железо"
 wg_boss.511.desc:0 "Глубже — и ясно: это живая вычислительная сеть. Хитроумные устройства сцепили миллиарды разумных существ. Создатели верили: система даст гигантскую вычислительную мощь, а слияние сознаний породит психосилу, способную влиять на реальность. Увы, беспощадная выжимка личностей вела «детали» к необратимой порче.\nМы полагаем: молнии вокруг мегасооружения — вторичный эффект истекающей психи. Неужели машина всё ещё работает?"
 wg_boss.511.a:0 "Печально."
 wg_boss.511.b:0 "Есть чему поучиться."
 wg_boss.512.name:0 "За гранью реальности"
 wg_boss.512.desc:0 "Свежая запись открыла финал этой цивилизации.\nНа машине возгонки они создали технологию звездосистемного искривления реальности и хотели сделать эффект вечным для всей вселенной. Упершись в технические тупики, они решили: лишь в новой вселенной их техника раскроется сполна.\nТогда они построили исполинский корабль «Окружная игла» — ковчег, правящий реальностью, — погрузили в него весь народ и через чёрную дыру ушли в другую вселенную.\nНо план рухнул: в записи лишь короткая пометка — некий немыслимый враг походя снёс «Окружную иглу» и истребил весь народ.\n\n\n\n\n\n\n\n\n\n\n\n§RИ там они тоже!!! §!"
 wg_boss.512.a:0 "Страшно."
 wg_boss.512.b:0 "Как же так……"
 wg_boss.513.name:0 "Остаточное сознание"
 wg_boss.513.desc:0 "Мы пробились в машину возгонки: она заброшена, но кое-где живёт.\nЖизни не найдено, зато вышла на связь одна сущность. Она зовёт себя сплавом следов сознаний всех умерших за десятилетия работы машины — в известном смысле и есть сама машина. Миллионы лет она дрейфует в море пустоты, в забвении и тумане; она просит даровать ей освобождение от бесконечной муки."
 wg_boss.513.a:0 "Ты можешь служить нам."
 wg_boss.513.b:0 "Снести эту греховную машину."
 wg_boss.514.name:0 "Остаточное сознание"
 wg_boss.514.desc:0 "……\n\n§gУмиротворение | Освобождение | Сожаление | Печаль | Радость§!\n\nСпасибо……"
 wg_boss.514.a:0 "……"
 wg_boss.515.name:0 "Остаточное сознание"
 wg_boss.515.desc:0 "……\n\n§gГнев | Ненависть | Ожидание | Ужас | Тревога§!\n\nЧего вы хотите……"
 wg_boss.515.a:0 "Дать тебе новую жизнь."
 wg_boss.516.name:0 "Остаточное сознание"
 wg_boss.516.desc:0 "……\n\n§gНедоумение | Растерянность | Радость | Удивление§!\n\nНовая жизнь…… таким, как я, можно?……\n\n……\n\nЯ могу…… двигаться и сражаться……"
 wg_boss.516.a:0 "У тебя есть имя?"
 wg_boss.517.name:0 "Остаточное сознание"
 wg_boss.517.desc:0 "……\n\n§gРаздумье | Любопытство | Надежда§!\n\nИмя…… Розмарин……\n\n……\n\nНе забудьте меня……"
 wg_boss.517.a:0 "Пусть тебе будет счастье у нас, Розмарин."
