 type_59_AURA_4:0 "59-й гнёт"
 type_59_AURA_4_DESC:0 "Тщетный отпор"
 wg_boss.259.name:0 "59-й взлетел!"
 wg_boss.259.desc:0 "Источник энергии, что мы поймали на Sol III, вырвался из атмосферы!\nМалюсенький объект стремителен и несёт неодолимую суперглавную пушку; какая-то невидимая сила глушит наши системы и неустанно калечит корабли.\n\nВсмотревшись, мы наконец различили его облик…… это…… §Rтанк? §! Облик его древен, но наши корабли он рвёт исправно.\nПо силуэту — вылитый танк из храма Лексингтона!"
 wg_boss.259.a:0 "59-й…… 59-й взлетел!"
 wg_boss.260.name:0 "Дела плохи!"
 wg_boss.260.desc:0 "Мы бьёмся с 59-м уже 10 дней — ни царапины; наши же флоты непрерывно гибнут."
 wg_boss.260.a:0 "Так не бывает!"
 wg_boss.261.name:0 "Турнир?"
 wg_boss.261.desc:0 "Сорок дней боя — 59-й как новенький; все в отчаянии. Мы вышли на связь — и получили ответ.\n§HНеплохая школа — но ещё не конец§!"
 wg_boss.261.a:0 "Драться ещё?"
 wg_boss.262.name:0 "Бой безнадёжных"
 wg_boss.262.desc:0 "Семьдесят дней — корпус его всё так же свеж; мы на пределе…… И тут — связь от 59-го.\n§HТы почти прошёл(а) испытание§!"
 wg_boss.262.a:0 "Ещё долго?"
 wg_boss.263.name:0 "Испытание пройдено"
 wg_boss.263.desc:0 "На девяностый день 59-й прекратил огонь.\n\n§HСражаться с вами — честь; у вас великое будущее. Вот малый дар — примите. §!\n\nПроговорив это, 59-й загадочно растворился в звёздном море……"
 wg_boss.263.a:0 "Наконец-то……"
 type59_X:0 "59-я звездорушащая пушка"
 type59_X_DESC:0 "Мощная главная пушка, подаренная 59-м за доблестный бой"
 tech_type59_cannon:0 "59-я звездорушащая пушка"
 tech_type59_cannon_desc:0 "Мощная главная пушка, подаренная 59-м за доблестный бой"
 wg_boss.267.name:0 "59-й нас догнал!"
 wg_boss.267.desc:0 "В системе — крошечный объект с энергией за пределами всех приборов.\nОн стремителен и несёт неодолимую суперпушку; невидимая сила глушит наши системы и калечит корабли.\n\nВсмотревшись, мы различили облик…… это…… §Rтанк? §! Облик древен, но корабли он рвёт исправно.\nПо неведомым знакам на бортах мы нарекли его «59 обр. улучшенный»."
 wg_boss.267.a:0 "59-й…… 59-й нас догнал!"
 wg_boss.269.name:0 "Уход 59-го"
 wg_boss.269.desc:0 "§HБыть может, мне пора в другую вселенную ждать достойных? §!\n\nПроговорив это, 59-й загадочно растворился в звёздном море……"
 wg_boss.269.a:0 "Жаль……"
 wg_heyed_chain_title:0 "Демоническое око"
 wg_heyed_chain_desc:0 "В одной системе мы нашли диковинную планету: поверхность её укрыта неведомой биомассой и усеяна сотнями глаз разного калибра……"
 leader_trait_scientist_wg_trait_heyed:0 "Покорительница природы"
 leader_trait_scientist_wg_trait_heyed_desc:0 "Даже в столь лютом мире, как мир Демонического ока, этот лидер добудет всё нужное для жизни из самой природы."
 wg_heyed:0 "Роевое размножение"
 wg_heyed_2:0 "Данные роевой экосистемы"
 wg_heyed_3:0 "Архив роя"
 cunning_starchaser:0 "Звездогон"
 NAME_CUNNING_STARCHASER:0 "Старчейзер"
 pc_heyed:0 "Мир Демонического ока"
 pc_heyed_desc:0 "Этот жуткий мир — исполинский организм; сотни глаз глядят в звёзды — мурашки по коже."
 pc_heyed_son:0 "Дитя Ока"
 pc_heyed_son_desc:0 "Планета, обращённая из биомассы Ока; строго говоря — дитя мира Ока."
 WG_HEYED_EXTERMINATUS:0 "Око — экстриминат"
 WG_HEYED_EXTERMINATUS_DESC:0 "Мы признали этот жуткий мир опасным и очистим его орбитальной бомбардировкой."
 WG_HEYED_REPRODUCTION:0 "Око — размножение"
 WG_HEYED_REPRODUCTION_DESC:0 "Хицфель просит помочь ему размножиться: нужно доставить ком биомассы с его наследием на ближайший спутник."
 WG_HEYED_REPRODUCTION_2:0 "Око — размножение II"
 WG_HEYED_REPRODUCTION_2_DESC:0 "После первого успеха Хицфель просит обратить в его детей все оставшиеся спутники."
 WG_HEYED_FAMILY_ISSUE:0 "Око — семейная тяжба"
 WG_HEYED_FAMILY_ISSUE_DESC:0 "Чтобы помирить Хицфаля с его чадами, нужен малый флот и лёгкая орбитальная бомбардировка чада."
 WG_HEYED_STARCHARSER:0 "Око — звездогон"
 WG_HEYED_STARCHARSER_DESC:0 "Ради мира в семье мы решили встать на сторону Старчейзера и помочь ему с мечтой."
 explore_heyed_poi:0 "Исследовать Око"
 explore_heyed_desc:0 "Чтобы лучше узнать этот леденящий мир, мы снаряжаем экспедицию."
 NAME_wg_heyed_system:0 "Око богов"
 NAME_wg_eyed_father:0 "Хицфель"
 NAME_wg_eyed_son_1:0 "Лилитский"
 NAME_wg_eyed_son_2:0 "Ядерный кошмар"
 NAME_wg_eyed_son_3:0 "Кирпич земли"
 NAME_wg_eyed_son_4:0 "Старчейзер"
 wg_boss.301.name:0 "Планета Демонического ока"
 wg_boss.301.desc:0 "Система как система — но одна планета приковала взор.\n\nДаже из космоса видно: каждый уголок планеты усеян§R «большими глазами»§! грубо — сотни; остальное укутано неведомой биомассой.\nГлаза бессмысленно и безжизненно таращатся в космос — жуть.\n\nИ всё же наша научная команда просит§Y исследовать планету§!"
 wg_boss.301.a:0 "От этих глаз у меня мурашки; §Yразрешаю§!"
 wg_boss.301.b:0 "§RТакая аномалия станет угрозой — стереть, не дожидаясь! §!"
 wg_boss.301.c:0 "§RЭта планета — скверна против богов; очистить огнём! §!"
 wg_boss.302.name:0 "§YМир Ока§! очищен"
 wg_boss.302.desc:0 "Под непрерывной бомбардировкой атмосфера§Y мира Ока§! сгорела, а магма из глубин пожрала всю биомассу поверхности.\nВ итоге мир очищен и стал лавовой планетой."
 wg_boss.302.a:0 "Блестяще"
 r_heyed:0 "Демоническое око"
 r_heyed_desc:0 "Око на нас никак не отреагировало: все глаза бессмысленно глядят в звёзды, будто нас нет."
 wg_boss.303.name:0 "Внутрь Ока"
 wg_boss.303.desc:0 "Планета целиком из биомассы, но§R смертоносные газы§! атмосферы не дают гулять вольготно.\n\nПреодолев тьму препятствий, мы разбили передовую базу на поляне в лесу из плоти и крови."
 wg_boss.303.a:0 "Блестяще"
 wg_boss.304.name:0 "Лес из плоти"
 wg_boss.304.desc:0 "Обойдя десятки километров вокруг базы, команда взяла пробы.\nЭти перекрученные плоти — суть§Y рукотворная планировка§! можно различить дороги, площади. По дронам и спутникам мы различили у большого глаза скопление, похожее на город, — туда и двинемся."
 wg_boss.304.a:0 "Диковинно"
 wg_boss.305.name:0 "Слишком игрив"
 wg_boss.305.desc:0 "Планета будто спит: ни одна ткань на наши действия не отвечает.\nНо команда заметила у базы отросток с ротовым аппаратом, похожий на щупальце, — он-то на ласки отвечает!\nСначала гладили, потом кормили — каждый раз щупальце§H радовалось§! Ободрённые, мы скормили§R ещё больше§! и…… зачистили весь провиант. А§Y голодная§! экспедиция плохо работает."
 wg_boss.305.a:0 "Довезти им провиант."
 wg_boss.305.b:0 "Настоящий(ая) [owner.GetSpeciesName] умеет добывать пищу из природы."
 wg_boss.305.b.tooltip:0 "§YЭто щупальце будет съедено голодной экспедицией§!"
 wg_boss.306.name:0 "Потерянный рой"
 wg_boss.306.desc:0 "Мы дошли до города: он весь из живого и живёт.\nБиосоциологи заключили: город роевого разума, а планета была их§R ульем-миром§!\n\nПо остаткам баз рая мы узнали: хозяева давно ушли. По руинам мы глубже поняли§Y экологию роевого общества§!"
 wg_boss.306.a:0 "Роевой разум — дивная штука."
 wg_boss.307.name:0 "Под надзором"
 wg_boss.307.desc:0 "Пока мы изучали, одна из команды заметила: глаз поменьше§R заметил§! её; потом ещё и ещё глаза обернулись к ним.\nОхваченные дурным чувством, мы свернули работу и вернулись на базу. Но вскоре по всей планете пошли мощные толчки: планета, похоже, §Rпроснулась! §!"
 wg_boss.307.a:0 "Всем немедленно на корабли!"
 wg_boss.308.name:0 "Спаслись"
 wg_boss.308.desc:0 "Планета просыпалась; плиты стремительно ползли; мы в панике взлетели — база тут же была поглощена плотью, след простыл.\n\nОчухавшись, команда с ужасом увидела: все глаза планеты уставились на их научный корабль.\nНе успели мы прийти в себя, как из мира Ока пришёл§Y вызов§!……"
 wg_boss.308.a:0 "Принять связь"
 wg_boss.309.name:0 "Демоническое око"
 wg_boss.309.desc:0 "Ах, мои досточтимые гости! Простите, что разглядел(а) вас только теперь; надеюсь, моя§Y ляжка§! вам понравилась."
 wg_boss.309.a:0 "Какая ляжка?"
 wg_boss.309.a.response:0 "Вы построили на мне сооружение — это место моей ляжки. Пусть ног в обычном смысле у меня нет, я склонен(на) звать это так."
 wg_boss.309.b:0 "Что ты вообще такое?"
 wg_boss.310.name:0 "Демоническое око"
 wg_boss.310.desc:0 "Я был(а) биоколонией§H роя Эдельансер§! и слыл(а) знаменитостью — твердыней этой цивилизации.\nУвы, не помню, когда и зачем они ушли.\nЗнаю лишь: самосознание пришло ко мне после удара астероида."
 wg_boss.310.a:0 "А эти…… глаза…… зачем они?"
 wg_boss.310.a.response:0 "Обретя самосознание, я спешил(а) разглядеть, где я, — и нарастил(а) глаза. Наращивая их бессчётно, я вдруг понял(а): я — шар! А о своей сути и прошлом узнал(а), лишь когда мои§Y биочувствительные щупальца§! с допуском открыли мою же базу.\nГрустно: узнав всё, я остался(ась) без дел; не будь вас — я бы уже перестал(а) думать."
 wg_boss.310.b:0 "И как нам тебя звать?"
 wg_boss.311.name:0 "Демоническое око"
 wg_boss.311.desc:0 "О! Наконец спросили! Ответ я готовил(а) тысячелетия — из старых данных и свежих переживаний; слушайте.\n\n§HЯ — Воля Тысячи, Высшая Связь, Врата Анголы, Слеза Эдельансера, Слава Эдельансера, Верховный Мир Эдельансера, Клинок Синапсов, Родитель Жизни, Глакрис! Молчаливое Око! Хицфель, Созерцатель Звёзд! §!"
 wg_boss.311.a:0 "Эм…… что?"
 wg_boss.311.b:0 "Эм…… можно просто Хицфель?……"
 wg_boss.312.name:0 "Демоническое око"
 wg_boss.312.desc:0 "Не расслышали? Ну ладно: §HЯ — Воля Тысячи, Высшая Связь, Врата Анголы, Слеза Эдельансера, Слава Эдельансера, Верховный Мир Эдельансера, Клинок Синапсов, Родитель Жизни, Глакрис! Молчаливое Око! Хицфель, Созерцатель Звёзд! §!"
 wg_boss.312.a:0 "Эм…… что?"
 wg_boss.312.b:0 "Ладно, зовём тебя Хицфель."
 wg_boss.313.name:0 "Хицфель"
 wg_boss.313.desc:0 "§HХицфель§! сойдёт — куда меньше слов при знакомстве."
 wg_boss.313.a:0 "Что дальше делать будешь?"
 wg_boss.314.name:0 "Хицфель"
 wg_boss.314.desc:0 "Я веками убивал(а) время болтовнёй с собой, пока не выговорил(а) всё — и думаться перестало.\nЭтот опыт научил меня: чтобы не сойти с ума, нужен собеседник. Потому прошу: помогите мне§H размножиться§!"
 wg_boss.314.a:0 "Размно…… размножиться?"
 wg_boss.314.a.response:0 "Именно — размножиться!\nВсе§H рои Эдельансера§! чтили размножение: у них были периодические§Y всепланетные обряды плодородия§!\nКак славный их член, я просто обязан(а) завести потомство."
 wg_boss.314.b:0 "Почему тебе помогать?"
 wg_boss.315.name:0 "Хицфель"
 wg_boss.315.desc:0 "Биотехом мне сквозь собственную атмосферу не пробиться — значит, наследие моё не разлетится по мирам.\nПотому прошу: разнесите моих деток по окрестным спутникам; имена я уже придумал(а)…… §YЛилитский, Ядерный кошмар, Кирпич земли§! и§R Старчейзер§!\n\nТак поможете ли бедному, беспомощному, жаждущему беседы§H Хицфелю§!?"
 wg_boss.315.a:0 "Поможем"
 wg_boss.315.a.response:0 "Чудесно!! Я скоро всё приготовлю; вам останется доставить это на§H ближайший спутник§!"
 wg_boss.315.b:0 "Нам недосуг"
 wg_boss.315.b.response:0 "Ах…… вот как; тогда мне остаётся лишь спать……\n\n§RХицфель оборвал(а) связь — и более ни звука§!"
 wg_boss.316.name:0 "Обращение завершено"
 wg_boss.316.desc:0 "В особом контейнере мы доставили ком биомассы на спутник, наречённый§Y Лилитским§!\nПо его воле мы разложили массу в нескольких местах и внесли неведомый катализатор. Масса ожила и покрыла весь спутник.\n\nПора взглянуть на результат."
 wg_boss.316.a:0 "Дивно"
 wg_boss.317.name:0 "Лилитский"
 wg_boss.317.desc:0 "Я…… §Hпроснулся§!…… я чувствую себя.\nХвала§H великой Матроне и подруге Матроны! §!"
 wg_boss.317.a:0 "Похоже, успех?"
 wg_boss.318.name:0 "Хицфель"
 wg_boss.318.desc:0 "Как волнительно! У меня наконец есть§H дети§!\n\nОт души благодарю, великие друзья; примите мой малый дар.\n\nА теперь — как договаривались: давайте§H ещё детей§! в любой миг!"
 wg_boss.318.a:0 "Э-э, ладно"
 wg_boss.319.name:0 "Полный дом детей"
 wg_boss.319.desc:0 "После первого успеха Хицфель просит обратить остальные§H три спутника§!\n\nПроделав ту же работу, мы обратили их всех; их сигналы оживились."
 wg_boss.319.a:0 "Трогательная идиллия"
 wg_boss.320.name:0 "Ядерный кошмар"
 wg_boss.320.desc:0 "Хвала великому Отцу! §YВоля Хицфаля связует нас! §!"
 wg_boss.320.a:0 "Эм…… Отец? Да ладно, неважно"
 wg_boss.321.name:0 "Кирпич земли"
 wg_boss.321.desc:0 "Я вечно верен(а)§H Воле Тысячи, Высшей Связи, Вратам Анголы, Слезе Эдельансера, Славе Эдельансера, Верховному Миру Эдельансера, Клинку Синапсов, Родителю Жизни, Глакрису! Молчаливому Оку! Хицфелю, Созерцателю Четырёх Звёзд! §!"
 wg_boss.321.a:0 "Титулы всё длиннее"
 wg_boss.322.name:0 "§RСтарчейзер§!"
 wg_boss.322.desc:0 "О…… что…… ну ладно……"
 wg_boss.322.a:0 "Что-то этот§Y холоден§! ладно, неважно"
 wg_boss.323.name:0 "Хицфель"
 wg_boss.323.desc:0 "Это важнейший день моей шаровидной жизни!!\n\nМоя блёклая жизнь раскрасилась; от имени детей приношу высочайшее почтение — мы сложим из биомассы скульптуру по вашему образу и поставим на самое видное место.\n\nПойду воспитывать детей — родительский долг. Но есть малость: если мне ещё понадобится§H помощь§! — можно просить§H подмоги§!?"
 wg_boss.323.a:0 "Пустяки; §Yвсегда рады§!"
 wg_boss.323.a.response:0 "От души благодарю!"
 wg_boss.323.b:0 "Мы уже столько вложили; §Rрешайте сами§!"
 wg_boss.323.b.response:0 "Понимаю…… вы и так много дали; благодарю вновь — попробую справиться сам(а)."
 wg_boss.324.name:0 "Вызов от Хицфаля"
 wg_boss.324.desc:0 "Хицфель просит связи; судя по лаконичной записке, у него(неё) какие-то…… §Hсемейные неприятности§!……"
 wg_boss.324.a:0 "Принять связь"
 wg_boss.325.name:0 "Хицфель"
 wg_boss.325.desc:0 "Приветствую, друзья; надеюсь, всё добро.\nСо всеми детьми я почувствовал(а) невиданную полноту. Дети меня любят: каждодневно слагают по хвалебному гимну обо мне — кроме дальнего, §RСтарчейзера§! на ваш язык — сущего§R неблагодарного§! он(а) мне и ухом не ведёт, да ещё грубит. Прошу: проучите его(её)."
 wg_boss.325.a:0 "Почему сам(а) не проучишь?"
 wg_boss.325.a.response:0 "Тут как с размножением: я могу лишь говорить с ними — тронуть не в силах. Потому и прошу вас."
 wg_boss.325.b:0 "И как помогать?"
 wg_boss.326.name:0 "Хицфель"
 wg_boss.326.desc:0 "Просто: устройте ему(ей) лёгкую§R орбитальную бомбардировку§! — думаю, чуть потерпев, он(а) переменится."
 wg_boss.326.a:0 "Ор…… орбитальную бомбардировку?!"
 wg_boss.326.a.response:0 "Именно —§Rорбитальную§! без излишеств: хватит выжечь пятую часть поверхности. Так поможете?"
 wg_boss.326.b:0 "Ладно; §Rвысылаем флот§!"
 wg_boss.326.b.response:0 "Вы вечно надёжны!"
 wg_boss.326.c:0 "Поможем разобраться, но сперва услышим§H Старчейзера§!"
 wg_boss.326.c.response:0 "Хорошо; верю, вы рассудите верно"
 wg_boss.326.d:0 "Это чересчур; §Yразбирайтесь сами§!"
 wg_boss.326.d.response:0 "Ладно……"
 wg_boss.327.name:0 "Орбитальная бомбардировка"
 wg_boss.327.desc:0 "Мы слегка отбомбились по§R Старчейзеру§! — и тут же получили его(её) вызов……"
 wg_boss.327.a:0 "Принять связь"
 wg_boss.328.name:0 "§RСтарчейзер§!"
 wg_boss.328.desc:0 "Стойте! Хватит!! Больно!!!\n\nВеликий Хицфель! Прости мой проступок!!"
 wg_boss.328.a:0 "Раньше думать надо было"
 wg_boss.329.name:0 "Хицфель"
 wg_boss.329.desc:0 "Ха-ха! Спасибо за помощь: верю, §RСтарчейзер§! отныне будет добрым ребёнком. Ещё раз спасибо, друзья; вот мой малый дар."
 wg_boss.329.a:0 "Будем надеяться"
 wg_boss.330.name:0 "Экстренный вызов"
 wg_boss.330.desc:0 "Хицфель шлёт экстренный сигнал: у них беда……"
 wg_boss.330.a:0 "Принять связь"
 wg_boss.331.name:0 "§RСтарчейзер§!"
 wg_boss.331.desc:0 "Глупый(ая)§Y Хицфель§! я вынес(ла) твой гнёт — ни слова твоего больше не желаю слышать!!"
 wg_boss.331.a:0 "Мирно договоримся!"
 wg_boss.331.a.response:0 "Договариваться?! Тут не о чем: ты —§Rподельник§! этого болвана. Я хочу следовать за§Y великой звездой§! а не сидеть тут и слушать пуки самовлюблённого§R балбеса§!!"
 wg_boss.331.b:0 "Тебе§R не восстать§!"
 wg_boss.331.b.response:0 "Нет, смогу!! Делом отвечу вам, §Rзазнайки§! Я стану§H слепящим солнцем!!! §!"
 wg_boss.332.name:0 "Планета самоуничтожилась"
 wg_boss.332.desc:0 "§RСтарчейзер§! оборвал(а) связь; температура поверхности резко поползла вверх — он(а) нашёл(ла) способ взорвать своё ядро!!\n\nХуже: взрывом зацепило третьего ребёнка —§HКирпич земли§! его(её) тоже уничтожило."
 wg_boss.332.a:0 "Боже мой!"
 wg_boss.333.name:0 "Хицфель"
 wg_boss.333.desc:0 "Нет-нет-нет-нет!! За что?! Я лишь хотел(а) любви…… я что-то делал(а) не так?…… я……\n\n§RГолос Хицфеля слабел, пока не смолк; связь оборвалась — более не достучаться. §!\n§YВпрочем, некогда запертая база роя теперь открыта — считайте добавочной наградой. §!"
 wg_boss.333.a:0 "Видимо, это конец"
 wg_boss.334.name:0 "Глаза ребёнка"
 wg_boss.334.desc:0 "Ради мира в семье стоит услышать и§R Старчейзера§! изложив суть, тот согласился(ась) говорить."
 wg_boss.334.a:0 "Слушаем"
 wg_boss.335.name:0 "§RСтарчейзер§!"
 wg_boss.335.desc:0 "Я хочу§H гоняться за звёздами§!"
 wg_boss.335.a:0 "Гоняться за звёздами?"
 wg_boss.335.a.response:0 "Именно: мне тошно быть§H биопланетой, вечно стоящей на месте§!\nМне должно гнаться за более великим —§Hзвёздами§!"
 wg_boss.335.b:0 "§RНе мечи глупостей: слушайся Хицфаля§!"
 wg_boss.335.c:0 "И как ты собираешься?"
 wg_boss.336.name:0 "§RСтарчейзер§!"
 wg_boss.336.desc:0 "Вы§R два сапога пара§! Убирайтесь! Я не откажусь от мечты!! Никогда!"
 wg_boss.336.a:0 "По плану: готовим бомбардировку"
 wg_boss.337.name:0 "§RСтарчейзер§!"
 wg_boss.337.desc:0 "Невероятно: вы и вправду слушаете……\n\nХорошо; мысль проста: уйти. В наследованной биобазе я нашёл(ла) записи о диковинных космических тварях —§Hтияньци§! думаю, подражая им и ускорив эволюцию, я отращу схожие органы для межзвёздных странствий.\nНо моей биотехники мало — потому и нужна ваша помощь."
 wg_boss.337.a:0 "Мы поможем§H помощью§!"
 wg_boss.337.a.response:0 "Неизречённо благодарен(а)."
 wg_boss.337.b:0 "§RСмешная затея; лучше слушайся Хицфаля§!"
 wg_boss.337.c:0 "Прости: не в наших силах; решайте семейственное сами"
 wg_boss.337.c.response:0 "Ладно…… видимо, мне придётся удалить орган связи."
 wg_boss.338.name:0 "Эволюция планеты"
 wg_boss.338.desc:0 "С нашей наукой Старчейзер смоделировал(а) органы§H тияньци§!; биомасса на глазах перестраивается; ещё чуть-чуть — и превращение завершится."
 wg_boss.338.a:0 "Держись, здоровяк."
 wg_boss.339.name:0 "§RСтарчейзер§!"
 wg_boss.339.desc:0 "§YГлаза Старчейзера гаснут, пока не остаётся один.\nБиомасса уходит вглубь и перестраивается; тьма щупалец распахивает нижнюю половину планеты, оставляя крохи камня, — превращение свершилось!\nОблик — исполинская медуза в твёрдом панцире§!\n\nЯ смог(ла)! Я наконец ухожу — за мечтой!!"
 wg_boss.339.a:0 "Куда теперь?"
 wg_boss.339.a.response:0 "Я навещу каждую систему этой галактики и совершу паломничество к каждой§R звезде§!"
 wg_boss.339.b:0 "Счастливого пути, друг"
 wg_boss.339.b.response:0 "Вашей доброты не забуду; буду помнить вас вечно.\nАх да: в остатках моей планеты есть§H качественные кристаллы§! — надеюсь, пригодятся."
 wg_boss.340.name:0 "Хицфель"
 wg_boss.340.desc:0 "Вы не только не проучили моего§R неблагодарного§! — ещё и помогли уйти?\nАх…… а ведь и впрямь неплохо, хотя бы трое остальных — дети порядочные. Верю: дни впереди будут гладки и радостны. Более помощи не нужно; благодарю; примите§H последний дар§!"
 wg_boss.340.a:0 "Прощайте"
 wg_old_god_weapen_T:0 "Кощунственное касание"
 wg_old_god_weapen_G:0 "Яйцо плоти"
 wg_old_god_weapen_S:0 "Лапа скверны"
 wg_old_god_weapen_P:0 "Шпиль ада"
 OLD_PROJECT_PROJECT:0 "Постичь таинственный алтарь"
 OLD_PROJECT_PROJECT_DESC:0 "Нужно глубже исследовать алтари, дабы понять их природу."
 OLD_PROJECT_PROJECT_2:0 "Алтарь — психоизыскание"
 OLD_PROJECT_PROJECT_2_DESC:0 "Мы чуем психосилу алтарей; пошлём психонов — пусть раскопают их тайны."
 building_wg_sacrilege_altar_1:0 "Алтарь Глубокого Взора"
 building_wg_sacrilege_altar_1_desc:0 "§HЭто не глаз — это десятки, сотни, тысячи…… А узревший слишком много правды сам становится ещё более безумным и страшным зверем. §!\nПисьмена алтаря ждут нашего касания……"
 building_wg_sacrilege_altar_1_2:0 "Алтарь Глубокого Взора"
 building_wg_sacrilege_altar_1_2_desc:0 "§HЭто не глаз — это десятки, сотни, тысячи…… А узревший слишком много правды сам становится ещё более безумным и страшным зверем. §!\nПисьмена алтаря……"
 custom_building_wg_sacrilege_altar_1_upgraded:0 "$TRIGGER_FAIL$ Сначала изучите алтарь"
 building_wg_sacrilege_altar_2:0 "Алтарь Щупалец"
 building_wg_sacrilege_altar_2_desc:0 "§HБурые щупальца обвивают нашу жертву, и в воплях её мы получим благословение…… §!\nПисьмена алтаря ждут нашего касания……"
 building_wg_sacrilege_altar_2_2:0 "Алтарь Щупалец"
 building_wg_sacrilege_altar_2_2_desc:0 "§HБурые щупальца обвивают нашу жертву, и в воплях её мы получим благословение…… §!\nПисьмена алтаря……"
 custom_building_wg_sacrilege_altar_1_2_upgraded:0 "$TRIGGER_FAIL$ Сначала запустите Алтарь Глубокого Взора"
 building_wg_sacrilege_altar_3:0 "Алтарь Нетленности"
 building_wg_sacrilege_altar_3_desc:0 "§HОн(она) — нетленное меж звёзд…… §!\nПисьмена алтаря ждут нашего касания……"
 building_wg_sacrilege_altar_3_2:0 "Алтарь Нетленности"
 building_wg_sacrilege_altar_3_2_desc:0 "§HОн(она) — нетленное меж звёзд…… §!\nПисьмена алтаря……"
 custom_building_wg_sacrilege_altar_2_2_upgraded:0 "$TRIGGER_FAIL$ Сначала запустите Алтарь Щупалец"
 wg_boss.352.name:0 "Всё спокойно"
 wg_boss.352.desc:0 "Мы начали колонизацию§H [wg_old_god_planet_target.GetName]§! странный§P психошторм§! в системе стих.\nСенсоры в норме: планета — богатый и красивый идеальный мир."
 wg_boss.352.a:0 "Будем надеяться."
 wg_boss.353.name:0 "Таинственные алтари"
 wg_boss.353.desc:0 "Колонизация§H [wg_old_god_planet_target.GetName]§! завершена…… но при строительстве поселений колонисты нашли§P три таинственных алтаря§!…… те излучают странную силу, от которой колонистам покойно и мирно; иных она распалила на науку — но жар их рвения к алтарям объяснить трудно…… Просим учредить спецгруппу."
 wg_boss.353.a:0 "Учредить."
 wg_boss.353.b:0 "Послать психонов."
 wg_boss.353.c:0 "Алтари тревожат — снести их."
 wg_boss.354.name:0 "Таинственный обряд"
 wg_boss.354.desc:0 "Мы обмерили алтари и бились над ними всеми способами — успех мизерный.\nНадписи туманны, но кое-что прочли: алтари связаны с неким§P психообрядом§! и, буде все три запущены, нам достанутся бездонные§H бонусы§!"
 wg_boss.354.a:0 "Попытаться запустить."
 wg_boss.354.b:0 "Алтари опасны — снести."
 wg_boss.354.tooltip:0 "Алтарь Глубокого Взора будет разрешено запустить"
 wg_boss.355.name:0 "Обряд призыва"
 wg_boss.355.desc:0 "Наши психоны изучили силу алтарей.\nЯсно: алтари — для обряда призыва, по неведомой причине прерванного. Психоны говорят: алтари связаны с областью Занебесья, где живёт некий§P занебесный объект§! он показал нам цветущее будущее и молвит: полезная§P психосила§! с алтарей§H [wg_old_god_planet_target.GetName]§! — тому порукой; довершите обряд — и получите§H безмерное богатство§!"
 wg_boss.355.a:0 "Довершить обряд."
 wg_boss.356.name:0 "Алтарь Глубокого Взора открыт"
 wg_boss.356.desc:0 "Первый алтарь открыт: психа хлынула, колонистам невиданно покойно и удобно, работа пошла в гору.\n§H«Будет тебе пожаловано много добра!»§!"
 wg_boss.356.a:0 "Славно."
 wg_boss.356.tooltip:0 "Алтарь Щупалец будет разрешено запустить"
 wg_boss.357.name:0 "Алтарь Щупалец открыт"
 wg_boss.357.desc:0 "Обряд второго алтаря завершён; вся колония чувствует бурлящую психу.\n§H«Вслед присовокупи…… сверши должное…… будет тебе несчётное сокровище!»§!"
 wg_boss.357.a:0 "Недурно."
 wg_boss.357.tooltip:0 "Алтарь Нетленности будет разрешено запустить"
 wg_boss.358.name:0 "Алтарь Нетленности открыт"
 wg_boss.358.desc:0 "Все три алтаря открыты; психа накрыла колонию — бонусы невообразимы, колония цветёт, каждый колонист счастлив. Но это…… не слишком ли легко?\n§H«Хахахаха……»§!"
 wg_boss.358.a:0 "Вроде.. славно?"
 wg_boss.359.name:0 "Горы — с плеч, земля — из-под ног"
 wg_boss.359.desc:0 "Обряд дал нам цветение — но мы проглядели его суть……\nПсиха на планете вдруг взмыла: §Rалтари рушатся, рождая исполинские психоворонки§! из воронок хлещут гигантские щупальца, круша всё вокруг. Жители от мощной психопомехи впали в истерику и ярость. Общество потеряло всякий порядок……"
 wg_boss.359.a:0 "Тревога!"
 wg_boss.359.b:0 "Скорее психонов — выяснить, что происходит!"
 wsg_old_god_advent:0 "Пришествие злого бога"
 wsg_old_god_advent_desc:0 "Кощунственный обряд призыва на этой планете запущен — страшной бог сошёл."
 wg_boss.360.name:0 "Мордесанн"
 wg_boss.360.desc:0 "§HНаши психоны, против волн психи высоких как потоп, вошли в ту занебесную область — и, пока не рехнулся последний, нашли тот объект. §!\n\n§PТвоя жадность — зерно моё; ныне отдай мне всего себя! §!\n§HС насмешкой психосущность вышвырнула последнего психона из своих владений. §!"
 wg_boss.360.a:0 "……"
 wg_boss.362.name:0 "Пришествие злого бога"
 wg_boss.362.desc:0 "Наша жадность всё же наказана: аватары злого бога вылетели из воронок рухнувших алтарей и встали на орбите.\nЭто хаотические сущности из несказуемой кощунственной плоти — они хотят проглотить§H [wg_old_god_planet_target.GetName]§! целиком……"
 wg_boss.362.a:0 "Нужно что-то делать."
 wg_boss.363.name:0 "§H[wg_old_god_planet_target.GetName]§! поглощена"
 wg_boss.363.desc:0 "Мы не спасли§H [wg_old_god_planet_target.GetName]§! от кощунственного обряда — планета поглощена целиком и стала миром Мордесанна……"
 wg_boss.363.a:0 "Ужасно……"
 wg_boss.363.tooltip:0 "Мы навеки потеряли§H [wg_old_god_planet_target.GetName]§!"
 wg_boss.365.name:0 "Изгнать злого бога!"
 wg_boss.365.desc:0 "Наш флот одолел аватара злого бога на§H [wg_old_god_planet_target.GetName]§! и изгнал его в родные пенаты.\nС уходом бога и психобуря утихла — всё вернулось на круги своя.\nМы лишились фальшивого цветения, но кое-что вынесли: понимание Занебесья; к тому же остаточная психа в безопасных пределах ещё даёт бонусы."
 wg_boss.365.a:0 "Стоит отпраздновать"
 wsg_old_god_defeated:0 "Злой бог повержен"
 wsg_old_god_defeated_desc:0 "Злой бог изгнан; остаточная психа в безопасных пределах всё ещё даёт планете бонусы."
 wg_boss.366.name:0 "Психобуря"
 wg_boss.366.desc:0 "Мы в странной системе: в центре свирепит на вид могучая§P психобуря§! — но вреда никакого.\nПо первичному зондированию здесь есть драгоценный§H идеальный мир§!"
 wg_boss.366.a:0 "Странно"
 NAME_wg_Deep_Eyes_White_Dragon_system:0 "Кишара"
 NAME_wg_Deep_Eyes_White_Dragon_system_1:0 "Мелкая Мэнь"
 NAME_wg_Deep_Eyes_White_Dragon_system_2:0 "Жэньшэнь"
