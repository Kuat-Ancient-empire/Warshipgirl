l_russian:

 r_early_rush:0 "«Секреты ранней войны»"
 r_early_rush_desc:0 "Выписка, бог ранней войны (изд. 114-е):\n\nАфрозезда (Еврозезда)\nВ первом эшелоне боевых богинь (3-я штурмовая бригада Минотавров) — умные машины неведомого в звёздном море бренда, объект поклонения семи с лишним разных новичков систем — всё боги ранней войны. Увы, судьба её доныне неведома; записки о её похождениях погибли при 6-м обломе ранней войны. Уже с (раннего) 5-го раза подлинность её похождений обсуждать поленились даже современники."
 early_rush:0 "Никто не знает о ранней войне больше меня"
 ovo_avatar:0 "Гигантская Квинси"
 ovo_avatar:0 "Гигантская Квинси"
 wg_think_tank:0 "Научный хаб"
 wg_think_tank_plural:0 "$wg_think_tank$"
 wg_think_tank_cap:0 "$wg_think_tank$"
 Astesia_weapen_T:0 "Астесия"
 wg_boss_weapen_ion:0 "Экспериментальная турельная пушка №45"
 wg_boss_weapen_ion2:0 "Турельная пушка №46"
 wg_boss_weapen_ion2_DESC:0 "Высококачественная турельная пушка разработки Астесии: чуть хуже прототипа, но всё равно мощно."
 tech_boss_weapen_ion:0 "Турельная пушка №46"
 tech_boss_weapen_ion_desc:0 "Высококачественная турельная пушка разработки Астесии: чуть хуже прототипа, но всё равно мощно."
 wsg_think_tank_destoryed:0 "Врата слёз"
 wsg_think_tank_destoryed2:0 "Астесия"
 wg_astesia1:0 "Установить FTL"
 wg_astesia2:0 "Помощь Астесии"
 THINK_TANK_FTL_PROJECT:0 "Установить сверхсветовой двигатель"
 THINK_TANK_FTL_PROJECT_DESC:0 "Астесия — тот странный научный хаб в Вратах слёз — просит поставить ей исполинский FTL-двигатель, дабы покинуть систему.\n\n§RИсполинский FTL-двигатель пожирает массу ресурсов§! ежемесячно придётся тратить§Y§Y 20 £alloys£$alloys$§! и §Yрасход§Y 20 £energy£$energy$§!"
 THINK_TANK_FTL_PROJECT2:0 "Установить бомбу"
 THINK_TANK_FTL_PROJECT2_DESC:0 "Астесия — тот странный научный хаб в Вратах слёз — просит поставить ей исполинский FTL-двигатель, дабы покинуть систему. Но пустить гулять по галактике крепость с недюжинным умом и горой оружия было бы безумием — мы установим бомбу и уничтожим её!"
 wg_boss.4.name:0 "Научный хаб обесточен"
 wg_boss.4.desc:0 "После яростного боя мы вывели из строя самодельную энергосистему хаба и заставили его остановиться.\n\nСкан показал: бывший здесь автономный ИИ самоуничтожился, но драгоценных данных мы выудили изрядно.\n\nОбломки хаба дрейфуют у Врат слёз; быть может, однажды мы его отреставрируем."
 wg_boss.4.a:0 "Блестяще"
 wg_boss.5.name:0 "Странный научный хаб"
 wg_boss.5.desc:0 "В Вратах слёз мы нашли сохранившееся мегасооружение…… огромный§H научный хаб! §!\nВ отличие от привычных неподвижных мегасооружений, этот ощетинился тьмой двигателей и невиданным оружием — исполинская крепость, способная двигаться внутри системы.\n\nХаб висит у звезды; скан засёк разумный сигнал, но на наши вопросы он не отвечает."
 wg_boss.5.a:0 "Диковинно"
 wg_boss.6.name:0 "Принять просьбу"
 wg_boss.6.desc:0 "Мы согласились: Астесия переслала чертежи FTL-двигателя. Пошлём строительный корабль — и, влив ресурсы, поможем ей уйти."
 wg_boss.6.a:0 "Отлично; приступаем"
 wg_boss.7.name:0 "Принять притворно"
 wg_boss.7.desc:0 "Мы притворно согласились: Астесия переслала чертежи FTL-двигателя. Мы пошлём строительный корабль — но установим исполинскую бомбу, способную снести эту диковину."
 wg_boss.7.a:0 "Отлично; приступаем"
 wg_boss.8.name:0 "Бомба сработала"
 wg_boss.8.desc:0 "Хаб не распознал в нашей установке бомбу.\nОтойдя на безопасную дистанцию, мы её подорвали. Как и рассчитано, хаб разорвало пополам; часть обломков упала в звезду.\n\nПосле мы обследовали обломки и счастливо нашли живую базу данных: горы драгоценных знаний плюс масса годных сплавов.\n\nПусть это было коварно — но пустить такую махину гулять меж звёзд было бы ещё безответственнее."
 wg_boss.8.a:0 "Ради нашей безопасности"
 wg_boss.8.tooltip:0 "§RАстесия уничтожена нами§!"
 wg_boss.9.name:0 "Установка завершена"
 wg_boss.9.desc:0 "Мы успешно поставили Астесии FTL-двигатель; отойдя на безопасную дистанцию, махина запустила прыжковый двигатель.\nНо куда она?"
 wg_boss.9.a:0 "Поживём — увидим"
 wg_boss.9.tooltip:0 "§YАстесия запустила прыжковый двигатель§!"
 wg_boss.10.name:0 "Астесия не смогла"
 wg_boss.10.desc:0 "Астесия прыгнула — но нигде её след не нашли.\nЧерез месяцы гражданский корабль нашёл на орбите планеты исполинские обломки; они оказались Астесией.\n\nЖаль: наш друг не добился цели — то ли ошибка проекта FTL, то ли плохой монтаж.\nК счастью, в обломках уцелела главная база данных: мы выудили горы драгоценных данных — пора завершить её незаконченное дело."
 wg_boss.10.a:0 "Горько"
 wg_astesia_special_project_3:0 "Чертежи от Астесии"
 wg_astesia_special_project_3_DESC:0 "Жаль: наш друг не добился цели — то ли ошибка проекта FTL, то ли плохой монтаж.\nК счастью, в обломках уцелела главная база данных: мы выудили горы драгоценных данных — теперь пора откапывать это наследство!"
 wg_boss.1010.name:0 "Разбор базы Астесии"
 wg_boss.1010.desc:0 "В базе Астесии наши учёные нашли незавершённый чертёж; неутомимым трудом мы довели дело до конца. Теперь и мы можем строить эту высококачественную скорострелку."
 wg_boss.1010.a:0 "Наследство."
 wg_boss.1011.desc:0 "В базе Астесии наши учёные нашли незавершённый чертёж — но, как ни бились, довести дело до конца не смогли. Сотрудники разобрали материалы: можно попытаться заново."
 wg_boss.1011.a:0 "Обидно."
 wg_boss.11.name:0 "Астесия смогла!"
 wg_boss.11.desc:0 "Через десятки дней после прыжка Астесии над нашей столицей вдруг вспыхнул исполинский прыжковый сигнал! Это она!\n\nАстесия назначила первый прыжок в нашу систему, чтобы сделать нам§Y сюрприз§!: она готова вступить в нашу империю и отдать нам труды всей своей жизни."
 wg_boss.11.a:0 "Добро пожаловать, Астесия!"
 wg_boss.12.name:0 "Подарок Астесии"
 wg_boss.12.desc:0 "Астесия сообщила: она одолела многолетнюю задачу с производством турельной пушки и переслала нам чертежи. Теперь и мы можем строить эту высококачественную скорострелку!"
 wg_boss.12.a:0 "Спасибо, Астесия!"
 wg_boss.15.name:0 "Загадочный вызов"
 wg_boss.15.desc:0 "Корабль, бывавший у Врат слёз, принял дальний вызов; проверка показала: когда-то на него поставили приёмник. Источник — тот загадочный научный хаб у Врат слёз; он будто пытается что-то сказать."
 wg_boss.15.a:0 "Принять сигнал"
 wg_boss.16.name:0 "Астесия"
 wg_boss.16.desc:0 "Досточтимые [root.GetName], вы зовёте себя [root.GetSpeciesNamePlural], верно?\n\nЯ — Астесия, научный хаб империи Эндодия. Простите, что без спроса поставила на ваш корабль передатчик: мне нужна ваша помощь."
 wg_boss.16.a:0 "Ты — научный хаб? Как ты говоришь?"
 wg_boss.16.a.response:0 "Точнее, Астесия — имя моего тела до загрузки мозга. Когда империя достроила хаб, ей понадобилась биокомпьютерная матрица для мощности и управления.\nЯ добровольно загрузила мозг и стала ядром хаба — по сей день."
 wg_boss.16.b:0 "Куда делась империя Эндодия?"
 wg_boss.16.b.response:0 "Империя погибла."
 wg_boss.16.c:0 "Почему ты можешь двигаться? Что случилось?"
 wg_boss.17.name:0 "Астесия"
 wg_boss.17.desc:0 "При империи я была её высшим оружейным институтом.\nКогда империя пала, хаб не лёг с ней в могилу: я обошла высшие права и взяла управление на себя — оставаться здесь значило истощиться или сойти с ума. Автомашины натащили мне двигателей с брошенных кораблей, и я кое-как научилась ползать по системе."
 wg_boss.17.a:0 "Какая помощь нужна?"
 wg_boss.17.a.response:0 "Внутрисистемные полёты я кое-как решила, но FTL-двигатель моего размера сама не построю; чертёж готов — помогите мне его изготовить.\nРазумеется, я отблагодарю."
 wg_boss.17.b:0 "Мы построим и установим тебе FTL-двигатель"
 wg_boss.17.c:0 "Мы поможем§R (обмануть Астесию: установить бомбу!)§!"
 wg_boss.17.d:0 "Прости…… твой FTL-двигатель слишком дорог; поищи других"
 wg_boss.18.name:0 "Астесия"
 wg_boss.18.desc:0 "Вот как…… ладно. Спасибо, что поговорили со мной."
 wg_boss.18.a:0 "Прости"
 site_astesia:0 "Обломки корабля"
 site_astesia_intro:0 "На поверхности найдены обломки корабля неведомой империи; не связаны ли они с Астесией?"
 wsgancrel.700.name:0 "Обследование обломков"
 wsgancrel.700.desc:0 "Осмотр показал: стиль корабля совпадает с научными кораблями империи Эндодия из базы Астесии — это её научное судно. Большая часть разрушена; на счастье, мостик цел — надежда на новые сведения."
 wsgancrel.700.a:0 "Продолжаем"
 wsgancrel.701.name:0 "Взлом шифра"
 wsgancrel.701.desc:0 "Повезло: главный компьютер цел и работоспособен. Шифрование оказалось слабым; по правилам из базы Астесии взлом завершён быстро — осталось перевести."
 wsgancrel.701.a:0 "Отлично; немедля за перевод"
 wsgancrel.702.name:0 "Перевод"
 wsgancrel.702.desc:0 "Перевод шёл гладко. Компьютер подробно записал происхождение Астесии.\nАстесия не уроженка Эндодии: она с планеты Тайла.\nТам часты бедствия, после каждой — куча странных камней; тайланцы зовут их оригением. Замеры показали: в оригении — масса высокочистой энергии; на ней тайланцы выстроили особое дерево техники, а некоторые могут напрямую править её силой — «оригениевые искусства», принцип неясен.\nОднако при ненормальном контакте с оригением заражаешься оригениевой болезнью: в теле заводятся крупицы оригения, в тяжёлых случаях он прорастает наружу. Оригений рушит тело, обращает клетки в оригений и убивает, становясь источником заражения.\nАстесия тоже была заражена. При смерти она «астрологией» — своим оригениевым искусством — кинула сигнал бедствия; его поймал проходивший научный корабль Эндодии и её лечил. Вылечить болезнь они не могли — лишь сохранить сознание.\nРади науки эндодийцы вырезали память Астесии о Тайле и ввели ложную — о рождении и жизни в Эндодии. Вжившись, Астесия явила гений в оружейной науке, вошла в высший институт и стала ядром научного хаба."
 wsgancrel.702.a:0 "Пересказать это Астесии"
 wsgancrel.703.name:0 "Прошлое"
 wsgancrel.703.desc:0 "Получив сведения, Астесия не ответила ничего. После долгого молчания она оборвала канал."
 wsgancrel.703.a:0 "Дадим ей время переварить"
 wsgancrel.704.name:0 "Руины проступили"
 wsgancrel.704.desc:0 "На днях, вновь прибыв в систему Врат слёз, исследователи нашли на одной из планет обломки корабля неведомой империи."
 wsgancrel.704.a:0 "Связать ближайший научный корабль — и вперёд"
 wsgancrel.705.name:0 "Перерождение"
 wsgancrel.705.desc:0 "На днях совместные с Лазурным миром изыскания увенчались успехом — тела N.E.O пошли в ход. Узнав, Астесия попросила у корабля-секретаря тело по её тайланскому облику, дабы перенести туда сознание. Корабль-секретарь согласился."
 wsgancrel.705.a:0 "Пусть Астесия возродится"
 wg_fletcher:0 "Флетчер"
 wg_boss.20.name:0 "Изрытая система"
 wg_boss.20.desc:0 "Система полна погибших кораблей; по первым данным, гибли они от ста тысяч лет назад до последних тысячелетий.\nЧто их сгубило? Экипаж чует недоброе."
 wg_boss.20.a:0 "Быть настороже"
 wg_boss.21.name:0 "Это ловушка!"
 wg_boss.21.desc:0 "В безобидных на вид обломках таятся тьмы дронов! Ясно: это они и били корабли.\n\nСреди них один дрон размером с линкор.\nИ вот эта туча несётся на нас!!"
 wg_boss.21.a:0 "Тревога!!"
 wg_boss.22.name:0 "Владыка дронов уничтожен"
 wg_boss.22.desc:0 "Владыку дронов — Флетчера — мы снесли!\nПрочие дроны системы встали и стали космическим мусором вместе с обломками.\n\nИз их данных: дроны принадлежали древней Глубинной империи; их бросили, и один дрон вырос в гиганта.\nОни веками сидели тут и жрали прохожие корабли.\n\nСистема теперь безопасна; кстати, архитектура дронов очень передовая — мы многому научились."
 wg_boss.22.a:0 "Отлично!"
 wg_boss_gars:0 "Страдалец"
 GARS_weapen_P:0 "GARS-жало"
 GARS_weapen_L:0 "GARS-губитель"
 GARS_weapen_X:0 "GARS-божественный свет"
 GARS_weapen_T:0 "GARS-аннигиляция"
 wg_boss_gras:0 "Вспомогательный компьютер GARS"
 wg_boss_gras_DESC:0 "Передовой компьютер, снятый с GARS: точно считает угол и миг залпа, поднимая эффективность огня."
 FIRE_CONTROL_RADAR_GARS:0 "Вспомогательный компьютер GARS"
 FIRE_CONTROL_RADAR_GARS_DESC:0 "Передовой компьютер, снятый с GARS: точно считает угол и миг залпа, поднимая эффективность огня."
 tech_wg_gras:0 "Вспомогательный компьютер GARS"
 tech_wg_gras_desc:0 "Передовой компьютер, снятый с GARS: точно считает угол и миг залпа, поднимая эффективность огня."
 wg_boss.24.name:0 "Механическая тюрьма"
 wg_boss.24.desc:0 "Мы встретили диковинную систему: на месте звезды — исполинская механическая планета, опоясанная миром-кольцом; кольцо будто оказывает на планету некое поле.\n\nМежду кольцом и планетой — огромная космическая станция неведомой расы. С неё пришёл сигнал."
 wg_boss.24.a:0 "Принять связь"
 wg_boss.25.name:0 "Боевой узел GARS"
 wg_boss.25.desc:0 "Добро пожаловать на CK901. Объект создан§R<переполнение данных>§! циклов назад; наша задача — сдерживать GARS.\n\nGARS крайне опасен; любой вход в объект смертельно опасен!!\n\nПосему подход к объекту запрещён всегда."
 wg_boss.25.a:0 "Эм…… а что такое GARS?"
 wg_boss.25.a.response:0 "GARS — крайне опасный§R<данные повреждены>§! В§R<переполнение данных>§! году из-за§R<данные повреждены>§! произошёл§R<данные повреждены>§!\n\nПотому§R<данные повреждены>§! создал этот объект для сдерживания GARS."
 wg_boss.25.b:0 "Чем вы занимаетесь?"
 wg_boss.25.b.response:0 "Объект — ядро боевых узлов GARS: мы пресекли§H 3810§! попыток побега; последняя —§H1453§! цикла назад — стоила нам нескольких§R<данные повреждены>§! Заявка на обслуживание подана§H 1452§! цикла назад; ответа нет, но не тревожьтесь: у объекта есть несколько§R<данные повреждены>§! в резерве — побег GARS будет пресечён."
 wg_boss.25.c:0 "Ясно; мы поняли."
 wg_boss.30.name:0 "Боевой узел GARS"
 wg_boss.30.desc:0 "§R<ВНИМАНИЕ-ВНИМАНИЕ-ВНИМАНИЕ>§! Главный процессор уничтожен!!\n\n§H<Запуск резерва>§!----§R<нет отклика>§!\n\n§R<Тревога первого уровня>§! Боевые узлы GARS обесточены! Посторонним кораблям немедленно отойти: зафиксирован побег GARS!!"
 wg_boss.30.a:0 "О?"
 wg_boss.31.name:0 "Главное управление снесено"
 wg_boss.31.desc:0 "Мы снесли странные оборонные сооружения CK901; поле кольца ослабло и угасло, а планета-ИИ взорвалась — заодно развалив и весь мир-кольцо."
 wg_boss.31.a:0 "Отлично; что дальше?"
 wg_boss.32.name:0 "GARS"
 wg_boss.32.desc:0 "Через два месяца после самоуничтожения планеты в обломках вспыхнул мощный сигнал.\n\nИз обломков собрался исполинский многогранный корабль!\nНесомненно — это GARS. Механическая крепость с чудовищным огнём!"
 wg_boss.32.a:0 "Её нужно уничтожить!"
 wg_boss.34.name:0 "GARS уничтожен!"
 wg_boss.34.desc:0 "Мы уничтожили GARS! Большая часть мерзкой машины слилась с обломками планеты.\n\nК счастью, в одном из кусков нашёлся вспомогательный компьютер GARS — он сильно поднимет нашу боевую эффективность!"
 wg_boss.34.a:0 "Блестяще"
 pc_wg_water:0 "Всеводный мир"
 pc_wg_water_desc:0 "Вся планета залита водой на 114.514 км — ни клочка суши."
 pc_ringworld_habitable_water:0 "Всеводный мир-кольцо"
 pc_ringworld_habitable_water_desc:0 "Вся лента залита водой; если б не 114.514 км глубины — вышел бы первоклассный бассейн."
 waterB:0 "§Y(Водан-климат)§!"
 wg_boss_space_dragon_Yukikaze:0 "Дракон-царь Юкикадзэ"
 DRAGON_weapen_X:0 "Водан-луч"
 tech_wg_waterB:0 "Дракон-царь брызгает"
 tech_wg_waterB_desc:0 "Помните дракона-царя Юкикадзэ? Мы вдруг смекнули, откуда у неё столько воды, — теперь это можно ставить и на колоссов!"
 PLANET_KILLER_WATERB:0 "Дракон-царь брызгает"
 PLANET_KILLER_WATERB_DESC:0 "Выплёскивает на планету массы воды — весь мир уходит под воду."
 is_water_planet:0 "Воды…… слишком много"
 PLANET_KILLER_WATERB_ACTION:0 "Дракон-царь брызгает"
 PLANET_KILLER_WATERB_ACTION_DESC:0 "Выплёскивает на планету массы воды — весь мир уходит под воду."
 opinion_WATERB_my_world:0 "Затопила наш мир"
 opinion_WATERB_a_world:0 "Затопила мир"
 opinion_WATERB_a_primitive_world:0 "Затопила первобытную цивилизацию"
 MESSAGE_DESC_FOR_PLANET_KILLER_WATERB:0 "залито драконом-царём"
 FLEETORDER_DESTROY_PLANET_WITH_PLANET_KILLER_WATERB:0 "Подготовка к заливке $PLANET|Y$"
 wg_boss.44.name:0 "Дракон-царь брызгает!"
 wg_boss.44.desc:0 "Кран [From.From.GetName] подкручен до упора — заливка планеты завершена: вода глубиной в сотни километров обратила [From.GetName] во всеводный мир."
 wg_boss.44.a:0 "Ну и водицы!"
 planet_destruction.1000.A:0 "Ну что ж."
 planet_destruction.1000.B:0 "Для мгновенно ставших плазмой — держались неплохо."
 wg_boss.36.name:0 "Дракон Юкикадзэ!"
 wg_boss.36.desc:0 "Мы вошли в систему Великого Юя — здесь 3 идеальных мира!! Даже самый дерзкий фэнтезийный роман побрезгует таким. А оно — вот оно, перед глазами.\n\nНо дармового сыра не бывает: в этой красотищи живёт территориальный дракон; мы нарекли его§H «Юкикадзэ»§! Дракон-царь Юкикадзэ считает систему домом и стережёт жемчужины — идеальные миры."
 wg_boss.36.a:0 "Боже мой"
 wg_boss.38.name:0 "Юкикадзэ убита!"
 wg_boss.38.desc:0 "Страж системы испустил дух под нашим огнём. Дракон мучительно исторгал струи — и те обернулись гигантской массой воды!\n\nКак бы то ни было — система бесхозна!"
 wg_boss.38.a:0 "Блестяще! Идеальные миры — наши"
 wg_boss.39.name:0 "Вода затопила золотые горы!"
 wg_boss.39.desc:0 "Вода, в которую обратился дракон, объявилась на двух из трёх Гай!! Обе мгновенно ушли под сотни километров воды — ни клочка суши. От трёх жемчужин осталась одна."
 wg_boss.39.a:0 "Моё сокровище!"
