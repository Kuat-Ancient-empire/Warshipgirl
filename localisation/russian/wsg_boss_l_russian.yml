 r_wg_Deep_Eyes_White_Dragon_Card:0 "Бездноглазый белый дракон"
 r_wg_Deep_Eyes_White_Dragon_Card_desc:0 "Карта лучится сиянием, слепящим взор.\nВопросов тьма: кто её сделал? Что за энергетический кокон вокруг? Как дракона воскресили?\nБыть может, не всё имеет ответ……"
 r_wg_Deep_Eyes_White_Dragon_Card_modifier:0 "При каждом уничтожении Бездноглазый белый дракон наносит всем врагам системы самоподрыв длительностью 2.00 £time£ и урон (число гибелей × 600); число гибелей растёт на 1 при каждом новом призыве.\n\nТекущее число гибелей: §Y [this.wg_Deep_Eyes_White_Dragon_count]§!"
 r_wg_Deep_Eyes_White_Dragon_Card_active:0 "Призвать Бездноглазого белого дракона у столицы\nЛимит — один; но жмите сколько влезет: ничего не будет (((→_→)))"
 r_wg_Deep_Eyes_White_Dragon_Card:0 "Бездноглазый белый дракон"
