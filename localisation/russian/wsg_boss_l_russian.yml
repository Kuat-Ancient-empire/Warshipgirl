 wg_boss.402.name:0 "Встреча с неведомой звёздной тварью"
 wg_boss.402.desc:0 "Наш научный корабль встретил в системе $NAME_wg_Deep_Eyes_White_Dragon_Ship_design$ исполинского левиафана — не похожего ни на кого из прежних.\nЗонды показывают: всё её тело кипит энергией на уровне звезды, а зыбкий облик намекает на жизнь из чистой энергии.\nПервичный скан: система богата рудами — нам во что бы то ни стало нужно её взять."
 wg_boss.402.a:0 "Занятно"
 wg_boss.403.name:0 "Звёздная тварь убита"
 wg_boss.403.desc:0 "Звёздная тварь в $NAME_wg_Deep_Eyes_White_Dragon_Ship_design$ растаяла — как и ждали: даже зыбкой энергии жизни не устоять перед нашим огнём.\nУчёные готовятся осмотреть останки……\nНеладно: энергия в твари сплавляется воедино; вырвавшись, она разнесёт систему и флоты — немедленный отход!"
 wg_boss.403.a:0 "Срочно к командующему флотом"
 wg_boss.404.name:0 "Воскрешение мёртвых"
 wg_boss.404.desc:0 "Учёные сообщают: в глубинах плиты одной из планет системы $NAME_wg_Deep_Eyes_White_Dragon_Ship_design$, где мы убили тварь, найден неведомый сгусток энергии.\nРазобрав его, мы извлекли странную карту — на ней изображение той самой твари.\nПо изучению: влей достаточно энергии — и в мире можно воспроизвести тварь, подвластную нам."
 wg_boss.404.a:0 "Громко молвить имя моё — «Бездноглазый белый дракон»"
 wg_boss.405.name:0 "День, когда я снова сойду в мир"
 wg_boss.405.desc:0 "О белая сила, таящаяся в истоке бесконечного времени! Взмахни крыльями, дрожащими от переклички душ, — и явись из лазурной бездны!"
 wg_boss.405.a:0 "Снизойди, душа моя — «Бездноглазый белый дракон»"
 wg_boss.406.name:0 "Все изменники должны умереть"
 wg_boss.406.desc:0 "Судьба изгнанников — перейти пустошь, вновь водрузить знамёна и вернуться домой.\nСмерть не страшна — это лишь долгий сон.\nПока я не в силах пожрать этот мир — лучше спать безмятежно, чем брести в одиночестве. Мы ещё проснёмся."
 wg_boss.406.a:0 "Почувствуй гнев левиафана из склепа"
 situation_Deep_white_eye_dragon_situation:0 "Системное изыскание"
 situation_Deep_white_eye_dragon_situation_desc:0 "Диковинная тварь в $NAME_wg_Deep_Eyes_White_Dragon_Ship_design$ приковала учёных; они настоятельно требуют бюджет на её изучение.\n\nЯсно: в итоге учёные предъявят достойный ответ."
 situation_Deep_white_eye_dragon_situation_type:0 "Системное изыскание"
