 wg_Rosmontis_scripted_action_name:0 "§RВозгонка сознаний§!"
 wg_Rosmontis_scripted_action_tooltip:0 "§RВозгонка сознаний§!\nВозгоняет сознания разумных с целевой планеты, стремительно двигая нашу науку: каждые 1000 умерших так — +1% текущего исследования, максимум 100 000.\nОставит 1000 населения.\n\n\n§gЕй это не по сердцу — но она исполнит приказ. §!"
 wg_Rosmontis_scripted_action_activity_key:0 "Подготовка возгонки сознаний на $NAME|Y$"
 wg_boss.550.name:0 "Розмарин"
 wg_boss.550.desc:0 "……\n\n§gПечаль | Смирение | Надежда§!\n\nСтолько жизней ушло……\n\n……\n\nБудем надеяться, не напрасно……"
 wg_boss.550.a:0 "Отбой связи."
