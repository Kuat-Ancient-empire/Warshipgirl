 wg_bug5:0 "Странный BUG"
 wg_bug6:0 "Странный BUG"
 wg_bugv_murder:0 "Данные Баг-В"
 wg_bugv_buff:0 "Редкое доброе дело"
 wg_bugv_buff2:0 "Редкое доброе дело"
 wg_bugv_buff3:0 "Благодарность Баг-В"
 wg_bugv_buff4:0 "Таинственная сила Баг-В"
 wg_bugv_buff4_desc:0 "Странная сила прибавилась"
 WG_FIX_BUG_PROJECT:0 "Помочь Баг-В"
 WG_FIX_BUG_PROJECT_DESC:0 "Баг-В просит прислать учёного уровня§H 7§! или выше для подмоги……"
 wg_boss.46.name:0 "Баг-В"
 wg_boss.46.desc:0 "Наших учёных сразила астрономия системы: обычные звёзды, чёрная дыра и нейтронная — в одной системе!\nНекоторые звёзды стали спутниками планет, а по системе рассыпаны странные подпространственные трещины.\n\nПо всем законам нас и местные тела давно бы растянуло в лапшу или сожрала дыра — но равновесие держит некое невидимое поле.\n\nПрисмотревшись, мы нашли в системе исполинский суперкомпьютер; учёные назвали его§H «Баг-В»§! он будто считает какие-то дивные данные……"
 wg_boss.46.a:0 "Что это за место"
 wg_boss.46.b:0 "Чувствую, мою астрономию…… изнасиловали"
 wg_boss.46.c:0 "Древние боги, спаси……"
 wg_boss.48.name:0 "Сила за пределами измерений"
 wg_boss.48.desc:0 "На днях в империи творится чертовщина: бельё, сушившееся ночью, к утру всё ещё мокрое; молоко с истёкшим 10 дней назад сроком — свежее; нарезанный вчера тюлень сегодня режется снова; утонувший в прошлый раз бассейн — утонул и в этот.\nЭто не только у нас: по докладам, дурь творится во всей галактике.\n\nВ конце концов причину не объяснил никто — как и способ лечения.\n\nВскоре мы засекли в системе§H [wg_wormhole_system.GetName]§! червоточину, которой быть не должно…… Может, взглянуть?"
 wg_boss.48.a:0 "Мистика"
 wg_boss.48.tooltip:0 "Удобства всех держав§R -5%§!"
 wg_boss.49.name:0 "Баг-В"
 wg_boss.49.desc:0 "Эй! Вам тут не место: я занят — латанию дыры этого мира."
 wg_boss.49.a:0 "Эм…… вы кто?"
 wg_boss.49.a.response:0 "Вам незачем знать, кто я; зовите как хотите. Знайте: я латаю дыры этой вселенной."
 wg_boss.49.b:0 "Латаете дыры?"
 wg_boss.49.b.response:0 "Именно; не видите — тут завал BUG'ов?! Раз вы сюда вошли, значит и внешний мир задет — пора шевелиться!"
 wg_boss.49.c:0 "Эм…… чем помочь?"
 wg_boss.50.name:0 "Баг-В"
 wg_boss.50.desc:0 "Помочь? Хахахахахах§H Ха§! хаха!\n\nВы? Бумажные букашки?\nЭм…… ну…… э……. ладно, помощь мне и впрямь нужна."
 wg_boss.50.a:0 "И как нам помочь?"
 wg_boss.50.a.response:0 "Пришлите умницу — пусть постоит рядом, подсказывая."
 wg_boss.50.b:0 "Хорошо; мы поможем"
 wg_boss.52.name:0 "Падение Баг-В"
 wg_boss.52.desc:0 "После яростного боя мы уничтожили Баг-В!\n\nМногие у нас считали, что вся чертовщина — рук этого дива: снесём — и всё пройдёт.\n\nУвы, они ошиблись: проблемы не решились, а выработка всех держав упала……\n\nИз обломков мы выудили крайне ценные данные — что ж, малая компенсация."
 wg_boss.52.a:0 "Невезуха"
 wg_boss.52.tooltip:0 "Ресурсы с мест £job£§R-5%§!"
 wg_boss.53.name:0 "Баг-В"
 wg_boss.53.desc:0 "Ахай, простите-простите!\n\nНечаянно напустил на вас новый BUG."
 wg_boss.53.a:0 "Осторожнее!"
 wg_boss.54.name:0 "Баг-В"
 wg_boss.54.desc:0 "Чёрт, откуда опять дыра?!\nТочно виноват ваш учёный!"
 wg_boss.54.a:0 "?!"
 wg_boss.55.name:0 "Баг-В"
 wg_boss.55.desc:0 "BUG, BUG, BUG — всюду BUG!! Конца им нет!!"
 wg_boss.55.a:0 "Смилуйся"
 wg_boss.56.name:0 "Баг-В"
 wg_boss.56.desc:0 "Почему их всё прёт и прёт?! Опять новый"
 wg_boss.56.a:0 "Хватит BUG'ов!"
 wg_boss.57.name:0 "Баг-В"
 wg_boss.57.desc:0 "Новости, новости: купи BUG — получи игру в подарок!"
 wg_boss.57.a:0 "……."
 wg_boss.58.name:0 "Помощь Баг-В"
 wg_boss.58.desc:0 "Баг-В выдал нам правила и попросил талантливого учёного (уровень§H 7§!+) для латания дыр — задача долгая и тяжкая……"
 wg_boss.58.a:0 "Понятно"
 wg_boss.59.name:0 "Баг-В"
 wg_boss.59.desc:0 "Я нечаянно задрал вам параметры — временный бафф……"
 wg_boss.59.a:0 "Нет-нет, эту дыру можно не латать!"
 wg_boss.60.name:0 "Баг-В"
 wg_boss.60.desc:0 "Это значение записано неверно; оно вам на пользу — починю позже."
 wg_boss.60.a:0 "Таких дыр побольше бы!"
 wg_boss.61.name:0 "Баг-В"
 wg_boss.61.desc:0 "Невероятно: бумажная букашка — а вылата такой BUG?!\n\nКак бы то ни было, здесь BUG'ов больше нет. Вот ваша награда; я побежал. Всего доброго."
 wg_boss.61.a:0 "Э?"
 wg_boss.61.tooltip:0 "На§H [bugv_fix_location.GetName]§! добавлена гора научных баллов"
 wg_boss.62.name:0 "Баг-В"
 wg_boss.62.desc:0 "Чёрт, им конца нет — как их чинить, всё же вроде без ошибок…….. хм-хм…………. аааа! аааааааааааа!\n\nВсё, кто хочет — тот и чинит; вот ваша награда; я побежал; всего доброго."
 wg_boss.62.a:0 "Стой, а наши дыры……"
 wg_boss.63.desc:0 "Уахаха, я выиграл(а), выиграл(а)! Я проскочил(а)!"
 wg_boss.63.a:0 "Ты в своём уме……"
 wg_boss.63.b:0 "Скотина, что ты выиграл(а)?"
 wg_boss.64.desc:0 "Мм, было скучно — сходил(а) в Warship Girls 2 дёрнуть рулетку — и выловил(а) Юкикадзэ: теперь-то меня не будут звать У-Снежной!"
 wg_boss.64.a:0 "Мы тут BUG'и латаем в поте лица — а ты чем занимаешься?!"
 wg_boss.65.desc:0 "Не спеши, дослушай. Выловив Юкикадзэ, я слил излишек мощи на починку — и вдруг ощутил(а) таинственную силу с Востока, и BUG починился сам!"
 wg_boss.65.a:0 "Когда я ставлю «?» — проблема не во мне"
 wg_boss.65.b:0 "А в том, что проблема в тебе.jpg"
 wg_boss.66.desc:0 "Постойте, этот BUG не должен здесь быть — почему он здесь? Быть того не может!"
 wg_boss.66.a:0 "Что-то случилось?"
 wg_boss.67.desc:0 "Ты…… это…… точно дело рук этой вонючей нерпы! В слайсы её! [Запуск Непревзойдённого Мастера Очистки Стола]"
 wg_boss.67.a:0 "Стойте?"
 wg_boss.67.tooltip:0 "§RБаг-В взбесился(ась) и теперь бьёт всех подряд! §!"
 wg_boss.69.desc:0 "После великой битвы мы всё же убили взбесившегося Баг-В. Ясно одно: с его гибелью странные BUG'и этой вселенной уже не починить. Утешение — ценные данные из обломков; что ж, малая компенсация."
 wg_boss.69.desc2:0 "По свежим вестям, взбесившегося Баг-В прикончила другая держава. Ясно одно: странные BUG'и этой вселенной уже не починить."
 wg_boss.70.desc:0 "Наш доблестный флот после яростного боя снёс эту крушащую всё махину. Её цели нам неведомы, но в обломках нашлось немало драгоценных данных — науке это сильно поможет."
 WG_weapen_SF_T:0 "Подсолнуховая фокус-пушка"
 WG_weapen_SF_X:0 "Подсолнуховый бластерный луч"
 WG_weapen_SF_L:0 "Подсолнуховый лепесток"
 WG_weapen_SF_M:0 "Подсолнуховая серединка"
 WG_weapen_SF_S:0 "Подсолнуховое семечко"
 wg_livestar:0 "Живая звезда"
 trait_wg_sunflower:0 "Подсолнух"
 trait_wg_sunflower_desc:0 "Это дивное существо даёт энергокредиты! А ещё хрустит на зубах."
 TRAIT_WG_SUNFLOWER_EFFECT:0 "Каждые 100 подсолнухов ежемесячно дают 5 £energy£ §Y$energy$§!"
 WG_BOARD_LIVESTAR:0 "Высадка на Живую звезду"
 WG_BOARD_LIVESTAR_DESC:0 "Исполинская Живая звезда обездвижена; уцелевшие подсолнухи дрожат в её недрах."
 WG_FIX_LIVESTAR:0 "Починить Живую звезду"
 WG_FIX_LIVESTAR_DESC:0 "Корпус звезды цел: вычистить отжатые подсолнухи, поставить гипердвигатель, чуть подлатать — и она наша."
 wg_boss.73.name:0 "Маяк-предупреждение"
 wg_boss.73.desc:0 "Проходя систему, наш корабль нашёл маяк: он без конца что-то вещает……"
 wg_boss.73.a:0 "Принять сигнал"
 wg_boss.74.name:0 "Король подсолнухов"
 wg_boss.74.desc:0 "Слушайте, муравьи, проходящие мимо: соседняя система§H Дэйва§! — владения великого Короля подсолнухов; мы не хотим видеть никого в нашем государстве. Мы строим махину-убийцу: придёт наш гипердвигатель — и она заработает! А как достроим — мы вас всех порежем в слайсы!! Ждите!!\n\nОбъявление о пропаже:\nнаш§R гипердвигатель§! потерялся при перевозке; кто найдёт — тащите в систему§H Дэйва§! награды не будет."
 wg_boss.74.a:0 "Что за бред"
 wg_boss.76.name:0 "Живая звезда"
 wg_boss.76.desc:0 "Мы в системе Дэйва: шарообразная крепость и есть та махина. Системная крепость с мощным огнём, сотни километров в поперечнике — и с нелепой раскраской! Дай им гипердвигатель — галактической безопасности конец."
 wg_boss.76.a:0 "Флотам — боевая готовность!"
 wg_boss.78.name:0 "Живая звезда обездвижена"
 wg_boss.78.desc:0 "После боя исполинская Живая звезда обездвижена; уцелевшие подсолнухи дрожат в её недрах."
 wg_boss.78.a:0 "Протонную торпеду в вентиляционную шахту!"
 wg_boss.78.tooltip:0 "§RЖивая звезда будет уничтожена§!"
 wg_boss.78.b:0 "Готовить армию — высаживаемся!"
 wg_boss.79.name:0 "Живая звезда взята"
 wg_boss.79.desc:0 "Наша армия заняла Живую звезду: сопротивлявшиеся подсолнухи отжаты в сок, остальные сдались.\n\nНа допросе выплыл нелепый рассказ: их посадил святой по имени Владыка мира; но их было слишком много, и другой злой бог — бог-нерпа — выполотил большинство. Души подсолнухов собрались тут и взялись строить Живую звезду для злодейского плана§H «месть подсолнухов.txt»§! но план рухнул — потерялся гипердвигатель, да и мы нападали.\n\nЧто делать с этой махиной и подсолнухами?"
 wg_boss.79.a:0 "Взорвать звезду, подсолнухи — в сок"
 wg_boss.79.b:0 "Починить звезду, подсолнухи — в сок"
 wg_boss.79.c:0 "Починить звезду, подсолнухов — в наши миры"
 wg_boss.80.name:0 "Живая звезда отремонтирована!"
 wg_boss.80.desc:0 "Мы залатали Живую звезду — заодно идиотскую планировку кораблей поправили; увы, слот под планетарное оружие погиб безвозвратно.\n\nТеперь эта исполинская база — наша подвижная крепость!"
 wg_boss.80.a:0 "Блестяще"
 pc_wg_cloud:0 "Мир облачных морей"
 pc_wg_cloud_desc:0 "Почти вся планета укрыта толщей облачных городов; поверхность непригодна, но газы и диковинный климат стоят сбора и изучения."
 wg_boss.82.name:0 "Мир облачных морей"
 wg_boss.82.desc:0 "Мы в системе Синевы Облаков; здесь планета, каких мы не видывали: закутана в тучи, суши почти не видно; учёные говорят — должно быть море редких газов.\n\nНо сенсоры приняли вызов из облачного мира……"
 wg_boss.82.a:0 "Принять связь"
 wg_boss.83.name:0 "Шериф"
 wg_boss.83.desc:0 "Вы…… убирайтесь…… добыча……"
 wg_boss.83.a:0 "Что это за наваждение?"
 wg_boss.83.a.response:0 "…… я…… глава…… полиции Третьего рукава…… добыча…… склонится пред нами……"
 wg_boss.83.b:0 "Ничего не понятно"
 wg_boss.83.b.response:0 "…… хахаха…… у нас…… миллион бойцов…… вам…… не остановить…… эта галактика…… охотничьи угодья…… убирайтесь…… из этой галактики……"
 wg_boss.83.c:0 "Явно пришли задирать"
 wg_boss.83.c.response:0 "…… осмелились…… не подчиниться…… императору измерений…… следует…… выезд полиции…… пожрать вас……"
 wg_boss.84.name:0 "Выезд полиции"
 wg_boss.84.desc:0 "Бестелая дива выдала нечто несусветное — и из облачного мира выплыл корабль из чистой энергии; свет его тёрок, будто он тяжко бит.\n\nЧтоб исследовать дальше — сперва выведем эту заразу."
 wg_boss.84.a:0 "Зачистить"
 wg_boss.86.name:0 "Страж мира-кольца: дракон Юкикадзэ!"
 wg_boss.86.desc:0 "Мы вошли в систему Великого Юя — здесь целый мир-кольцо!\n\nНо даров не бывает: в великой системе живёт территориальный дракон; мы нарекли его§H «Юкикадзэ»§! Дракон считает кольцо гнездом и стережёт его."
 wg_boss.86.a:0 "Ошеломительно!"
 wg_boss.88.name:0 "Конец дракона Юкикадзэ"
 wg_boss.88.desc:0 "Страж системы испустил дух под нашим огнём. Дракон, отдуваясь, извергал тьму жидкости — а это, по замерам, вода!\n\nКак бы то ни было — система бесхозна!"
 wg_boss.88.a:0 "Наградить всех: система станет нашим кольцом!"
 wg_boss.89.name:0 "Вода затопила золотые горы!"
 wg_boss.89.desc:0 "Вода дракона объявилась на мире-кольце!!! Три ленты ушли под сотни километров воды — ни клочка суши. Осталась одна секция."
 wg_boss.89.a:0 "Воды слишком много!!"
 wg_fairy_dragon:0 "Индирам"
 wg_dragon_corvette:0 "Драконьи слуги"
 wg_fairy_dragon_dreadnought:0 "Драконья стража"
 POINT_weapon_fairy_dragon:0 "Драконье жало"
 SMALL_weapon_fairy_dragon:0 "Драконье копьё"
 MEDIUM_weapon_fairy_dragon:0 "Драконья пушка"
 LARGE_weapon_fairy_dragon:0 "Драконий гнев"
 LARGE_weapon_fairy_dragon2:0 "Драконий гнев"
 wg_fairy_dragon_object:0 "Индирам"
 wg_fairy_dragon_object_desc:0 "Нутро корабля вычищено подчистую — смотреть нечего"
 wsg_weapen_T_FD:0 "Аврора"
 wsg_weapen_T_FD_DESC:0 "Новейший главный калибр, добытый в магазине трофеев"
 wsg_weapen_T_FD2:0 "Аврора"
 wsg_weapen_T_FD2_DESC:0 "Новейший главный калибр, добытый в магазине трофеев"
 WG_FD_PROJECT:0 "Высадка на Индирам"
 WG_FD_PROJECT_DESC:0 "Присоединить наш корабль к исполинскому кораблю-пожирателю миров и разведать его тайны."
 tech_wsg_FD:0 "Аврора"
 tech_wsg_FD_desc:0 "Новейший главный калибр, добытый в магазине трофеев; ставится лишь в сверхкрупный слот."
 tech_sh_FD2:0 "Аврора"
 tech_sh_FD2_desc:0 "Новейший главный калибр, добытый в магазине трофеев; ставится лишь в сверхкрупный слот."
 wg_boss.93.name:0 "Пожиратель миров"
 wg_boss.93.desc:0 "В наши пределы вошёл вооружённый до зубов неведомый флот; самый большой корабль — размером с планету!\nСтранно: флот не отвечает на вызовы и не атакует — будто бесцельно крейсирует. Единственное, что можно прочесть снаружи: владельца зовут неведомой империей§H Индирам§!\n\nСенсоры не находят на кораблях жизни, и учёные не могут объяснить, почему исполин не рушит орбиты.\nИные считают: это просто поход — не тронем, и они пройдут мирно."
 wg_boss.93.a:0 "Гляньте-ка на размер!"
 wg_boss.94.desc:0 "Привет: вы тоже встретили флот с исполинским кораблём?"
 wg_boss.94.a:0 "Ага; что-то не так?"
 wg_boss.95.desc:0 "Славно: мы следим за этим флотом давно — он без конца кружит по галактике.\nКогда мы его нашли, кораблей было куда больше; многие пропали. Но даже так цена победы выше всяких наших сил.\nПотому просим вас одолеть их, а исполин обездвижить — наши люди возьмут его. Обещаем щедрую мзду. Что скажете?"
 wg_boss.95.a:0 "Эм…… подумаем"
 wg_boss.97.name:0 "Змееборство"
 wg_boss.97.desc:0 "Под нашими ударами автоматический флот Индирама замер; исполинский флагман обездвижен! Аппарат, берегущий окрестные тела от его исполинской массы, похоже, жив."
 wg_boss.97.a:0 "Великолепно"
 wg_boss.98.desc:0 "Невероятно: вы и правда их одолели!\nМы очень хотим этот корабль: перепишите его нашей команде — мы заплатим.\n\nПлатёж: 25§Y очков подвига§! 5000 £sr_pantsu£ §Y$sr_pantsu$§! и наша новейшая§Y корабельная пушка§!\nКаков ваш ответ?"
 wg_boss.98.a:0 "Корабль ваш"
 wg_boss.98.b:0 "Корабль ваш"
 wg_boss.98.c:0 "Нет: изучим сами"
 wg_boss.99.name:0 "Внешние отсеки"
 wg_boss.99.desc:0 "Наша команда вошла в исполинский корабль Индирама и прочесала внешние отсеки. Увы: почти все пусты, а техника — известная нам, а то и устаревшая. Для суперкорабля столь странно.\nНо команда верит: настоящее сокровище — в ядровых ярусах."
 wg_boss.99.a:0 "Идём глубже"
 wg_boss.100.name:0 "Пусто-пусто"
 wg_boss.100.desc:0 "Снова разочарование: даже в главной рубке и важных отсеках техника того же уровня — корабль будто просто нагромождение заурядного в исполинском масштабе.\n\nЗато из базы мы узнали историю. §HИмперия Индирам§! в древности владела галактикой; желая похвастаться мощью, они построили этот корабль-пожиратель миров и задали ему курс — вечный круиз по галактике. Империя давно исчезла, а флот всё верен долгу — пока мы его не снесли.\n\nОсобых находок нет, но наука хочет дойти до последнего яруса: там, думается, и тайна нерушимости орбит."
 wg_boss.100.a:0 "Ладно; идём дальше"
 wg_boss.101.name:0 "Гравикомпенсатор"
 wg_boss.101.desc:0 "Команда обошла весь корабль; единственный трофей — из последнего яруса: передовой гравикомпенсатор. Вот отчего корабль не смяло собственной массой; теперь применим его в мегамонтаже."
 wg_boss.101.a:0 "Барыш не стоит затрат"
 wsg_fairy_dragon:0 "Гравикомпенсатор"
 wg_boss.102.name:0 "К высадке готовы"
 wg_boss.102.desc:0 "Проект исследования корабля-пожирателя миров взят в план: команда готова высадиться на исполина и выискать любую полезную науку."
 wg_boss.102.a:0 "Немедля готовиться"
 wg_one_cat_hangar:0 "Ангарная станция"
 WSG_CAT_H:0 "Бомбардировщик «Челнок»"
 WSG_CAT_H2:0 "Истребитель «Голкипер»"
 tech_wsg_CAT:0 "TALIEDO STIPA (юбилейная версия)"
 tech_wsg_CAT_desc:0 "Экипаж задарма скупает билеты на этот милый сувенир; выручка идёт на содержание самого корабля."
 wsg_weapen_H_CAT:0 "TALIEDO STIPA (юбилейная версия)"
 wsg_weapen_H_CAT_DESC:0 "Позволяет палубной авиации быть битой оружием типа LXT — для отвода огня\nИзрядно поднимает выживаемость палубных\nЧинит ИИ-режим палубных\n§YВсё вышеизложенное — фигня§!"
 wg_boss.104.name:0 "Крепость"
 wg_boss.104.desc:0 "В системе Носинъюань свирепит шторм: большие корабли ползут черепашьим шагом, лишь крохотные палубные летают вольготно.\nХуже: в центре системы исполинская крепость, набитая дронами-палубниками — явно скроена под систему; и какая-то глушилка срезает дальность нашего оружия."
 wg_boss.104.a:0 "Головная боль"
 wg_boss.106.name:0 "Крепость Носинъюань взята"
 wg_boss.106.desc:0 "Исполинская крепость пала; водолазы нашли в обломках целый самодельный палубник. Учёные ничего особого в нём не нашли — но есть в нём магия: экипаж так и лезет посмотреть. Решили продавать билеты: платишь — смотришь; выручка идёт на содержание корабля.\nШторм не исчез, но главная угроза срыта."
 wg_boss.106.a:0 "Удача +5"
 wg_boss.108.name:0 "Дракон Юкикадзэ!"
 wg_boss.108.desc:0 "Мы вошли в систему Великого Юя: система пуста — лишь исполинская голубая звезда класса B, ни одной планеты……\nНо и в такой пустоте таится угроза: свирепый голубой дракон!\nДракон диковинен: по дальнему зондированию, внутри него — вода; учёные нарекли его§H «Юкикадзэ»§!"
 wg_boss.108.a:0 "Боже мой"
 wg_boss.110.name:0 "Юкикадзэ убита!"
 wg_boss.110.desc:0 "Страж системы испустил дух под нашим огнём. Дракон мучительно исторгал струи — и те обернулись гигантской массой воды!\n\nКак бы то ни было — система безопасна!"
 wg_boss.110.a:0 "Блестяще!"
 wg_boss.111.name:0 "Вода затопила золотые горы!"
 wg_boss.111.desc:0 "Вода дракона без конца лилась на звезду — и скоро звезда была погашена невообразимой массой воды!!! Как известно, в воде есть водород: поливать звезду не охладит её, а раскалит реакцию — звезда разгорится ещё ярче.\nНо происшедшее наукой не объяснить."
 wg_boss.111.a:0 "Чувствую, мою науку……"
 wg_modifier_wg_rbq_dragon:0 "Учёные, отпустившие себя"
 wg_modifier_wg_rbq_dragon_desc:0 "Узрев невозможное, учёные отключили мозги и отпустили себя"
 wg_boss.114.name:0 "Психосигнал"
 wg_boss.114.desc:0 "Едва узнав о пси — силе вне физических правил, — наши дотошные учёные поймали сенсорами родной звёздной системы серию шифрованных упорядоченных сигналов, разом передаваемых на дальнюю дистанцию. Первооткрывательницы просят средств на расшифровку."
 wg_boss.114.a:0 "Дадим им шанс"
 wg_boss.114.b:0 "Не будем тратить средства на блажь"
 ANALISE_WG_PHIONIC_SIGNAL:0 "Анализ психосигнала"
 ANALISE_WG_PHIONIC_SIGNAL_DESC:0 "Наши учёные поймали серию шифрованных психосигналов; расшифровка может преподнести сюрприз."
 wg_boss.115.name:0 "Далёкий психо-план"
 wg_boss.115.desc:0 "Разбор показал: сигнал полон бессмыслицы; из читаемого складывается координата — но не в нашем измерении: она целиком из мнимых чисел. Учёные могут указать её положение, но измерение неведомо — ни дойти, ни послать сигнал. Поскольку сигнал пришёл по психоканалу, измерение это прозвали§H психо-планом§! и его открытие может изрядно расширить наши представления о вселенной."
 wg_boss.115.a:0 "Вселенную должно чтить"
 wg_boss.115.b:0 "В психо-плане нас, быть может, ждут новые истории"
 wg_boss.116.desc:0 "Хэй~ слышали, вы нашли кое-что занятное. Правда?"
 wg_boss.116.a:0 "Нашли, но……"
 wg_boss.117.desc:0 "Но не в этой вселенной, верно? Мы тоже о ней знаем — просто лень считать.\nТак что…… поделитесь находкой? Или хотите§H сыграть§!?"
 wg_boss.117.a:0 "Тогда просим вас"
 wg_boss.117.a.response:0 "Позвать вас было верным решением! Ждите вестей."
 wg_boss.117.b:0 "Не будем искушать судьбу"
 wg_boss.117.b.response:0 "Ну ладно; найдёте что забавное — заходите"
 wg_boss.118.desc:0 "Дождались! Мы перевернули склад вверх дном — и вот: та-дам~ Психо-сифонная рыболовная машина!"
 wg_boss.118.a:0 "Вы Дораэ………………"
 wg_boss.118.b:0 "Психо-сифонная…… рыболовная МАШИНА!?"
 wg_boss.119.desc:0 "Именно, психо-сифонная рыболовная машина! Побочный продукт наших разработок измеренного фабрикатора.\nСначала мы хотели тянуть энергию из§H психо-плана§! — по расчётам, там она густа, как сыр. Но сосать оттуда — к очень дурным последствиям; мы сменили измерение — и получили измеренный фабрикатор. А эта машина — чтобы нарочно вызывать те самые дурные последствия: потому и рыболовная! Точно подмечено, правда?\nВводишь координаты — она закидывает особую приманку и вытягивает желаемое из психо-плана, как рыбу!"
 wg_boss.119.a:0 "Предчувствия дурные……"
 wg_boss.119.b:0 "Итак, цена……"
 wg_boss.120.desc:0 "«Пространственно-временной якорь зафиксирован; к работе.»\n«Доклад — колебание мнимого времени-пространства: цель заглотнула!»\n«Внимание — колебание выше расчётного в 923 раза; идёт§R звездосистемная§! махина!»\n«Доклад!!! Не одна — три!»\n«До выхода цели из мнимого пространства — 3! 2! 1! Готовь слияние линий времени!»"
 wg_boss.120.a:0 "Господи…… что вы наделали?"
 wg_boss.121.desc:0 "Ага: похоже, мы выудили трёх очень больших рыб. Дверь уже в вашей системе; открыть её, может, и тяжеловато — но вы справитесь; мы пока линяем — "
 wg_boss.121.a:0 "Эй! Вернитесь!"
 wg_boss.122.desc:0 "У вас есть координаты вне этой вселенной…… помощь нужна?"
 wg_boss.122.a:0 "Согласие"
 wg_boss.122.b:0 "Отказ: опасно."
 wg_boss.123.desc:0 "Психо-индуктор…… машина, переносящая «присутствие» из психо-плана в наш мир; нужны точные координаты.\nОна может принести величайшую опасность…….. запускать?"
 wg_boss.123.a:0 "Спасибо…… запускайте"
 wg_boss.124.desc:0 "«Пространственно-временной якорь зафиксирован; к работе……»\n«Колебание мнимого времени-пространства; цель подтверждена……»\n«Внимание — колебание выше расчётного в 923 раза; размер —§Rзвездосистемный§!»\n«Ошибка оценки…… пересчёт —  целей того же класса три!»\n«До выхода из мнимого пространства — 3……2……1…… готовь слияние линий времени……»"
 wg_boss.124.a:0 "Что идёт?"
 wg_boss.124.a.response:0 "Три системы из психо-плана перетащены сюда…… лишь дверь в вашей домашней системе ведёт туда, и открыть её можете только вы…… удачи……"
 RESEARCH_PSIONIC_WORMHOLE:0 "Наблюдение психо-червоточины вблизи"
 RESEARCH_PSIONIC_WORMHOLE_DESC:0 "Павшие перетащили по нашей координате три звездные системы из психо-плана; можно послать научный корабль изучить вблизи — хоть это и небезопасно."
 RESEARCH_PSIONIC_WORMHOLE_FROM_HOME:0 "Дальнее наблюдение психо-червоточины"
 RESEARCH_PSIONIC_WORMHOLE_FROM_HOME_DESC:0 "Павшие перетащили по нашей координате три системы из психо-плана; что за дверью — неизвестно. Изучим способ открыть её с безопасной дистанции — пусть это и займёт массу времени."
 wg_psi_object:0 "Фокус психоэнергии"
 wg_boss.126.name:0 "Психоотклик"
 wg_boss.126.desc:0 "Остался последний шаг — и червоточина откроется…………\nСтой: §Rоттуда что-то идёт!!! §!"
 ONBOARD_PSI_DREADOUGHT:0 "Высадка на психо-дредноут"
 ONBOARD_PSI_DREADOUGHT_DESC:0 "Вынырнувший из червоточины психо-военный корабль обесточен нашим огнём.\nОбследование даст нам новые данные о том свете."
 wg_boss.129.name:0 "Обездвиженный психо-дредноут"
 wg_boss.129.desc:0 "После тяжкого боя мы обездвижили внезапного исполина. Прежде чем открыть червоточину, стоит изучить корабль — знать врага в лицо."
 wg_boss.129.a:0 "Снарядить аналитиков"
 wg_boss.129.b:0 "Плевать на эту посудину — открываем червоточину"
 wg_boss.168.name:0 "Психо-дредноут уничтожен"
 wg_boss.168.desc:0 "После тяжкого боя психо-исполин стал космическим мусором; продолжаем исследование систем за червоточиной."
 wg_boss.130.name:0 "Выжившая с психо-корабля"
 wg_boss.130.desc:0 "Морпехи легко вошли в дредноут. Часть агрегатов ещё различима, но корабль так пропитан психой, будто некое существо нарочно переделало его в оружие своей воли.\nВ рубке — картина ада: проходы завалены§R телами кораблей-дев§! у каждой — лицо, искажённое§R невообразимой ментальной карой§! Но тут дозреватель жизни пискнул: найдена полуживая корабль-дева; видать, сильнейшая из психиков — она одна и вынесла это."
 wg_psi_survivor:0 "Выжившая с психо-корабля"
 wg_boss.169.desc:0 "Не надо мной………… ищите других сестёр……"
 wg_boss.169.a:0 "(качая головой) Ты — одна"
 wg_boss.170.name:0 "Закат исполина"
 wg_boss.170.desc:0 "Услыхав такое, она сломалась последней нитью — и рухнула, как марионетка с обрезанными нитями.\nЕдва морпехи вынесли единственную выжившую, махина за её спиной распалась и истаяла в пустоте. На транспортном судне её подлатали — за считанные дни она пришла в себя и в разум."
 wg_invincible:0 "Капитан «Непобедимый»"
 wg_boss.131.desc:0 "Спасибо за спасение: я — командующая 6-й оперативной эскадрой§H «Непобедимый»§! Вы — корабли-девы, присланные наместничеством на подмогу?"
 wg_boss.131.desc.b:0 "Вы…… Враги Бездны?? Почему вы здесь? Древние боги…… вам не выжать из меня ни слова о моих сёстрах."
 wg_boss.131.a:0 "Мы не из ваших сил"
 wg_boss.131.a.response:0 "Вы…… кто вы? Почему вы тоже корабли-девы…… стоп: где я?"
 wg_boss.131.b:0 "Будь мы врагами — ты давно была бы связана"
 wg_boss.131.b.response:0 "…………\nЛадно: поклянись Древними богами, что дальше — лишь правда, и объясни мне, что произошло; я сама решу, угроза вы или нет……"
 wg_boss.131.c:0 "(рассказать ей всё)"
 wg_boss.132.desc:0 "Вот оно как… мы перегнули — и перегнули сильно, за то и постиг нас гнев Древнего бога, и пали его бесчисленные аватары………… стоп: раз я здесь — мы, выходит, прощены. Умоляю: поможете? Сёстры все там! Даже если…… им уже не выстоять, я хочу увидеть их своими глазами……"
 wg_boss.132.desc.b:0 "Древние боги храни…… как хорошо, что вы не древние враги богов! Прошу простить высочайшую дерзость: я чуть не подняла руку на спасительниц лишь за схожесть облика — мне буквально негде скрыться……\nИ ещё одну просьбу позвольте: знаю, права не имею, но все мои сёстры — за той червоточиной…… даже если шанс один из квадриллиона — хочу увидеться……"
 wg_boss.132.a:0 "Сёстры? Как всё это случилось?"
 wg_boss.132.a.response:0 "Мы не вняли§H Провидице§! и справили обряд призвания аватара Древнего бога — нашего божества. Все мы верили: любовь Древнего бога унесёт нас через любые беды — и ошиблись. В тот день я была в рубке и видела, как прародину поглотила исполинская психа; все сёстры рухнули в Занебесье. Сила, проглотив планету, не остановилась — лишь распухла………… в конце концов все наши колонии, а то и§R вся система были проглочены§!\nЯ пыталась поставить психобарьер ради экипажа — не смогла; лишь своё сознание удержала. Сигналы, что вы поймали, — вероятно, мой подсознательный крик о помощи, отработанный на учениях."
 wg_boss.132.b:0 "Но их ведь поглотила психосила?"
 wg_boss.132.b.response:0 "Не знаю, как вы это сделали, но моя психа чует: за червоточиной, что встретил мой корабль, — все три системы наших колоний; их притянуло в эту вселенную, но четыре планеты-очага, в силу смещения времени-пространства, не восстановились. Проделай вы то же самое — быть может, и проглоченные планеты можно вернуть.\nДам координаты, но мне нужна ваша сила……"
 wg_boss.132.c:0 "Мы постараемся помочь"
 wg_boss.132.c.tooltip:0 "§YКапитан «Непобедимый» станет флотоводцем вашей империи§!"
 wg_boss.132.c.response:0 "Несказанно благодарна: такой милости не оплатить…… Обещаю…… нет — хоть всю жизнь потрачу, но уговорю весь§H Святой порт-хранитель Беллерофонта§! — весь наш народ будет служить вам до последнего вздоха, без ропота!"
 wg_boss.132.d:0 "У нас свой план"
 wg_boss.132.d.response:0 "Знаю: мне нечем оплатить большее…… у меня лишь жизнь.\nНо как бы то ни было — в оплату спасения отдаю вам свой остаток дней, без ропота……"
 wg_boss.132.d.tooltip:0 "§YКапитан «Непобедимый» станет флотоводцем вашей империи§!\n§RЗавершить цепочку§!"
 wg_boss.133.title:0 "Система, полная угроз"
 wg_boss.133.desc:0 "Ещё до прохода через червоточину радары и сенсоры взвыли. Как и ждали: там тьма враждебных психоформ и психо-военных кораблей, как тот дредноут. Зачистим их для дальнейших дел."
 wg_psi_chain_title:0 "Область Занебесья"
 wg_psi_chain_desc:0 "Мы узнали: за психо-червоточиной 4 планеты поглощены буйством психосилы.\nЗафиксируй мы их положение якорями времени-пространства — сможем вычислить их в Занебесье и вернуть на нормальные позиции."
 wg_shrouded_planet_counter:0 "Найденные планеты"
 wg_psi_planet_poi:0 "Поглощённая планета"
 wg_psi_planet_poi_desc:0 "Нужно поставить якорь времени-пространства на месте этой планеты — так колония, проглоченная в Занебесье, вернётся."
 wg_boss.137.title:0 "Исчезнувшая колония"
 wg_boss.137.desc:0 "Досканирование показало: планеты — лишь проекция могучей психосилы. Выглядят планетами, ибо там прежде были планеты — их «утащили»; сила так велика, что остался тянущий шлейф. Из-за разницы хода времени на поверхности следов волочения не видно.\nДля деталей нужно время на изучение."
 wg_boss.137.a:0 "Продолжайте"
 RESEARCH_WG_SHROUDED_PLANET:0 "Изучить исчезнувшую планету"
 RESEARCH_WG_SHROUDED_PLANET_DESC:0 "Вчерне ясно: планету стёрла некая сила; нужны детали всей истории."
 wg_boss.138.title:0 "Стёртое государство"
 wg_boss.138.desc:0 "Изучив силу, мы выяснили: всё это скопление систем уже поглощалось ею, и очагов — четыре. Из-за мощной психи при перетаскивании систем павшими планеты сместились; нужно заново разметить четыре планеты и снова пустить психо-индуктор — как с теми тремя системами."
 wg_boss.138.a:0 "Начинаем работы"
 wg_boss.138.b:0 "Не стоит тратить тут время"
 INSTALL_SPACETIME_ANCHOR:0 "Поставить якорь времени-пространства"
 INSTALL_SPACETIME_ANCHOR_DESC:0 "Ставим якорь в физической позиции поглощённой планеты для её переразметки — затем индуктор вернёт её на место."
 wg_boss.139.title:0 "Якорь установлен"
 wg_boss.139.desc:0 "Работа по установке якоря§H [from.GetName]§! завершена"
 wg_boss.140.title:0 "Якори выставлены"
 wg_boss.140.desc:0 "Все четыре якоря стоят — можно запускать психо-индуктор и начинать восстановление."
 wg_boss.141.title:0 "Поглощённая планета"
 wg_boss.141.desc:0 "Первичный скан подтвердил: это одна из оставшихся поглощённых планет. Ставим на ней якорь, чтобы индуктор начал восстановление."
 wg_boss.171.title:0 "Бестелые планеты"
 wg_boss.171.desc:0 "Наблюдая планеты психо-систем, наши исследователи заметили странность; итоги сводятся."
 ACTIVATE_PSYCHIC_ENTITY_HYPERSIPHON:0 "Запустить психо-индуктор"
 ACTIVATE_PSYCHIC_ENTITY_HYPERSIPHON_DESC:0 "Запуск вернёт поглощённые планеты\n§RВнимание: §!\nПосле завершения проекта, из-за массы созданных объектов, §Hнеизбежна пауза с подлагиванием§! сохранитесь по своим силам.\nВдобавок система§H снесёт звёздные базы в трёх событийных системах§! ради дальнейшего сюжета."
 wg_boss.142.title:0 "Индуктор отработал"
 wg_boss.142.desc:0 "Психо-индуктор от павших завершил работу: поглощённые планеты восстановлены. Радары видят: четыре занебесных планеты стали высокоразвитыми колониями."
 wg_boss.142.a:0 "Мы, похоже, спасли бессчётные жизни……"
 wg_boss.142.b:0 "Посмотрим, что будет дальше"
 wg_boss.142.c:0 "Всем — боевая готовность"
 wg_boss.143.name:0 "Вызов от§H Святого порта-хранителя Беллерофонта§!"
 wg_boss.143.desc:0 "Связь вернулась? Вы…… вы сёстры Порта? Древние боги…… нам дано прощение…… спасибо вам! Слава Древним богам!"
 wg_boss.143.a:0 "Успокойтесь: мы корабли-девы из другой цивилизации"
 wg_boss.143.a.response:0 "Что случилось? Разве не Провидица вывела нас из Занебесья? Откуда вы, корабли-девы?"
 wg_boss.143.b:0 "Сначала выслушайте нас……"
 wg_boss.144.desc:0 "Невежливо вышло; позвольте представиться заново: я — корабль-секретарь Святого порта, Святой Георгий. [Root.GetName] от [Root.GetSpeciesNamePlural] вновь приношу вам высочайшую благодарность всех кораблей Порта! Подвиг ваш — спасение всех нас — не описать и всеми похвалами……\nМоя вина неисчислима; я сама уйду с поста и поставлю другую……"
 wg_boss.144.a:0 "Что с вами стряслось?"
 wg_boss.144.a.response:0 "Начать следует с нашей святыни —§HСвятого нефрита§! У этого нефрита есть сила соединять два мира: §HЗанебесье§! и явь. Мы верим, что Древний бог живёт в Занебесье, и раз в четыре года справляем великий обряд: всей державой вливаем силу в нефрит и открываем врата меж миров — дабы узреть Древнего бога.\nРаз в четыре года обряд приносил доброе или дурное — но никогда так: сошедшая из психо-плана сила сожрала нас же.\nПровидица предсказывала это — мы не вняли, и стряслось……\nЯ — высший лидер, вина моя неоплатна; остаток жизни положу на искупление перед сёстрами……"
 wg_boss.144.b:0 "А государство без вас?"
 wg_boss.144.b.response:0 "Верно: меня когда-то избрал Древний бог; я надеялась вести державу до конца. Но после такого мне не место во главе.\n[Root.GetName] от [Root.GetRulerTitle][Root.GetRulerName]: скажи слово — весь спасённый Порт пойдёт за тобой; а я, потерпевшая, не вправе вести сестёр……"
 wg_boss.144.c:0 "Кто без греха — ведите свой народ дальше"
 wg_boss.144.c.tooltip:0 "§YСвятой порт-хранитель Беллерофонта станет вассалом§!"
 wg_boss.144.c.response:0 "И меня простят?.. Раз ваше слово — трепетно принимаю. Встреча с вами — счастье всех сестёр Порта………… примите вновь моё высочайшее почтение и благодарность; вашей милости не высказать……"
 wg_boss.144.d:0 "Раз решение твёрдо — не станем мешать"
 wg_boss.144.d.tooltip:0 "§YВсе корабли-девы Святого порта войдут в вашу империю§!"
 wg_boss.144.d.response:0 "Спасибо за понимание; передачу власти оформлю скоро. Вы — благодетель всего народа; верю, вы приведёте всех нас к лучшей жизни……"
 wg_boss.145.desc:0 "Связь вернулась? —  стоп…………\nВраги богов, нечисть укрывшихся в Бездне — почему вы на другом краю галактики? Разве война богов и демонов десятки тысяч лет назад не выкорчевала вас? Быть не может: пророчества Древних богов не лгут……"
 wg_boss.145.a:0 "Вы из какой параллельной вселенной?……"
 wg_boss.145.b:0 "Постойте: мы не ваши враги"
 wg_boss.145.c:0 "Шайка одичавших…… ничтожны"
 wg_boss.146.desc:0 "Параллельная вселенная? Так это вы разбудили нас в психо-плане и призвали сюда? Исключено! Может…………\nВы…… враги?"
 wg_boss.146.a:0 "Мозг — хорошая вещь: научитесь им пользоваться"
 wg_boss.146.b:0 "Всё ровно наоборот; но не верьте — ваше право"
 wg_boss.147.desc:0 "Ладно…… мы в Святом порту платим добром за добро и злом за зло; если это правда вы помогли — я, как нынешний высший руководитель и корабль-секретарь, ручаюсь: наше поколение отработает спасение жизни и в хомуте.\nТеперь говорите правду."
 wg_boss.147.a:0 "Планеты и правда «призвали» мы"
 wg_boss.147.a.response:0 "…………\n\n\nМоя психа говорит: ты не лжёшь………… Слово сказано — не воротишь…… Одна просьба…… будь милосердна к моим сёстрам."
 wg_boss.148.desc:0 "Выслушайте: госпожа корабль-секретарь Святой Георгий, они и правда не те древние враги Бездны — они благодетели, спасшие весь наш Порт! Не верите им — верьте мне: клянусь Древними богами, что каждое моё слово — правда!"
 wg_boss.148.a:0 "Всё действительно так, как она говорит……"
 wg_boss.157.desc:0 "Одичавшие? Ничтожны? Вижу: кошмар, некогда ввергший богов в сумерки, вернулся. Бездушное порождение Бездны! Я, уста Древних богов, во главе всех сестёр Святого порта исполню последнюю волю богов — и сожгу вас, еретиков, в священном огне похода!"
 wg_boss.157.a:0 "Помолчите — хоть что-то выручим……"
 wg_boss.157.a.tooltip:0 "§R[wg_psi_country.GetName] объявляет нам войну§!"
 wg_boss.155.desc:0 "Все граждане [Root.GetName] от [Root.GetSpeciesNamePlural] вновь примите высочайшую благодарность за спасение сестёр нашего Порта — этот долг мы выплатим всей жизнью! Чего бы ни пожелал [Root.GetName] мы, Святой порт, обещаем помочь всем народом!\nЭто §H$r_wg_psionic_gem$§!— древний дар Древних богов; но мы боле недостойны его. Молим [Root.GetName] принять — да будет он подальше от ловкачей, дабы не повторить нашей ошибки."
 wg_boss.156.desc:0 "Сёстры Порта: это, быть может, моя последняя речь как корабля-секретаря. После сегодняшнего мне не место и не должно на нём быть — но благодарение: с помощью [Root.GetName] и милостью Древних богов мы выжили. Впредь мы, возможно, не будем зваться Святым портом — но верю: Древние боги и дальше будут беречь нас; Он зрит нас детьми — и мы последуем Его воле.\nСёстры: благодарите всё вокруг и живите с благодарностью — это первая и последняя надежда меня, грешницы.\nЧто до этого §H$r_wg_psionic_gem$§!— древнего дара Древних богов — мы боле недостойны; молим [Root.GetName] принять — да будет он подальше от ловкачей, дабы не повторить нашей ошибки."
 wg_boss.158.desc:0 "Я…… проиграла? Я…… ошибалась так страшно……"
 wg_boss.158.a:0 "Безумица, искавшая смерть"
 wg_boss.159.name:0 "Реликвия"
 wg_boss.159.desc:0 "Приняв планеты шайки, мы нашли в столичном здании камень с признаками психи; кровь на нём — бывшего лидера державы: похоже, она покончила с собой перед этим камнем, а народ спрятал его."
 wg_boss.159.a:0 "Неплохой трофей"
 wg_boss.161.desc:0 "Всезнающий Древний бог! Если слышишь — враги Твои древние ныне сошли в мир; прекрасный мир, отстроенный вновь, осквернён злыми духами; возлюбленное Твоё творенье шатается под гнётом войны.\nВсезнающий Древний бог! Если слышишь — я готова стать остриём Твоего меча против хулящих Тебя и огнём войны сжечь дотла эту нечисть!\nВсезнающий Древний бог! Если слышишь — позволь мне, кораблю-секретарю Святому Георгию, просить силы: истреби врагов Твоих и верни Тебе прекрасный и тихий мир!"
 wg_boss.161.a:0 "Скулеж надломленного пса……"
 wg_boss.162.name:0 "Таинственный обряд"
 wg_boss.162.desc:0 "По донесениям, государство кораблей-дев фанатичек справило великий обряд и призвало себе тьму кораблей. Не разделаемся скоро — они утопят нас в этих бесконечных кораблях."
 wg_boss.162.a:0 "Скоро они затихнут навеки"
 wg_boss.163.name:0 "Огонь на себя"
 wg_boss.163.desc:0 "Бедные фанатички, вновь пытаясь призвать корабли, похоже, задели табу: могучая психа окутала все их колонии и поглотила всё."
 wg_boss.163.a:0 "Вот как это случилось"
 wg_boss.163.b:0 "Не стоящие жалости глупые бабы"
 wg_boss.167.name:0 "Призыв Мордесанна"
 wg_boss.167.desc:0 "Мы влили энергию в§H Святой нефрит§! — святыня ожила, и тьма психо-кораблей была заанкерена из Занебесья в явь; теперь они служат нам."
 wg_boss.167.a:0 "Блестяще"
 r_wg_psionic_gem_active:0 "§YБезопасно признать эскадру психо-кораблей Мордесанна§!"
 relic_triumph_cooldown_wsg:0 "\n$relic_activation_cooldown$: £time£ §Y1800§!"
 wg_boss.164.desc:0 "Вот чертежи нашей старой оружейной техники. Они пылились в закромах — слишком опасны, мы так и не воспроизвели их; но вам, думаю, пригодятся. Заранее прошу прощения за навязчивость — примите дар."
 wg_boss.165.desc:0 "До ухода у меня есть старые оружейные чертежи, что хочу передать вам. Они слишком опасны и потому пылились в закромах; но вам, думаю, пригодятся — примите дар."
 wsg_psi_dreadnought:0 "Психо-дредноут"
 wsg_psi_dreadnought_plural:0 "Психо-дредноуты"
 wsg_psi_dreadnought_cap:0 "$wsg_psi_dreadnought$"
 wg_psi_juggernaut:0 "Психо-арбитр"
