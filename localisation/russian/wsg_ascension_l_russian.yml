l_russian:

 ap_project_r:0 "Project-R"
 ap_project_r_desc:0 "Время всё расставило по местам: смута гражданского раскола позади, а перед нами — безбрежное звёздное море. Пора менять всё на корню."
 project_r_tooltip:0 "Эта реформа станет ключом к следующей стадии нашей истории"
 wsg.1000.name:0 "Project-R"
 wsg.1000.desc:0 "Стараниями доктора Юбари и множества учёных мы улучшили наши тела свежайшей генной инженерией. Технологии синтетиков подкинули идей для доработки ригингов. Вещество, рождающее корабельных дев из морской воды, мы всё ещё не разобрали до конца — но уже умеем отчасти его использовать."
 wsg.1000.a:0 "Это станет ключом к следующей стадии нашей истории."
 wsg.1000.a.tooltip:0 "§!§Y Внимание! Генную модификацию выполняйте шаблоном с§! §!§R чертом первого вознесения (тёмно-синие «Корабельные девы»)§! §!§Y — иначе во втором вознесении случится баг§!"
 requires_technology_tech_wsg_pantsu:0 "$TRIGGER_FAIL$ Нужна технология £society£§Y$tech_wsg_pantsu$§!"
 wsg.1001.name:0 "Внимание!"
 wsg.1001.desc:0 "§!§Y Внимание§! используйте для генной модификации шаблон с чертой £sr_wsg£§Y$wsg_trait_warshipgirls1$§!— иначе во втором вознесении случится баг§!"
 wsg.1001.a:0 "Понял"
 ap_wsg_universal_transactions:0 "Галактический маяк"
 ap_wsg_universal_transactions_desc:0 "Низкая эффективность инопланетных союзников нас больше не устраивает — пора помочь им без оглядки. Мы станем маяком галактики: наши филиалы на их планетах, наша великая федерация!"
 ap_wsg_universal_pirate:0 "Круиз по мирозданию"
 ap_wsg_universal_pirate_desc:0 "Как когда-то мы бороздили моря, охотясь на корабли снабжения Глубинных, — так теперь эта галактика станет нашим охотничьим угодьем. Мы не ведаем усталости и не знаем лени."
 ap_yamato:0 "Яматозация"
 ap_yamato_desc:0 "Годы яматозационного воспитания дали плоды: теперь все корабельные девы добровольно выходят на переработки."
 requires_technology_tech_yamato_education:0 "$TRIGGER_FAIL$ Нужна технология £society£§Y$tech_yamato_education$§!"
 ap_dumplings:0 "Пельменный конвейер"
 ap_dumplings_desc:0 "Великому Порту, чтобы собрать под стать себе флот, надо лепить корабли, как пельмени."
 ap_dumplings_tooltip:0 "§HПолучить командующего: §!§Y Эссекс§!"
 ap_dark_alpha:0 "Эксперимент: тёмная материя и Альфа"
 ap_dark_alpha_desc:0 "Заполучив тёмно-материальные реакторы падшей империи, госпожа Чанчунь задумала дерзкое — осуществим её идею."
 dark_alpha:0 "Открывает исследование тёмно-материального альфа-вооружения"
 requires_tech_building_wsg_alpha:0 "$TRIGGER_FAIL$ Нужна технология £physics£§Y$tech_building_wsg_alpha$§!"
 requires_tech_dark_matter_power_core:0 "$TRIGGER_FAIL$ Нужна технология £physics£§Y$tech_dark_matter_power_core$§!"
 ap_port_project:0 "Проект «Планета-Порт»"
 ap_port_project_desc:0 "Вся планета будет застроена сооружениями Порта — один из знаков новой стадии нашей истории.\n§H— Открывает чудо Порта: §!§Y Великая башня Норстона§!\n§H— При наличии ['technology:tech_mega_engineering'] открывает мегаструктуру: §!§Y ковчег Порта§!"
 ap_mist:0 "Лазурный мираж"
 ap_mist_desc:0 "Новейший вакуум-нулевой реактор Порта, подпитанный почти бесконечной мощью, разрывает пространство и творит коридор. Стабилизировав его NEO-веществом, мы наконец можем отправить горстку людей в иной мир."
 mist_tooltip:0 "Благослови наших «нас» из другого мира!"
 has_chosen_path_ap_project_s:0 "$TRIGGER_FAIL$ Уже выбран путь вознесения: Project-S"
 ap_project_s:0 "Project-S"
 ap_project_s_desc:0 "После прорыва в технологии имплантации энергетических ядер Глубинных в ригинги мы готовы применить её в масштабах вида и полностью раскрыть потенциал корабельных дев. Эта беспрецедентная перестройка станет вехой в их истории."
 has_chosen_path_ap_mist:0 "$TRIGGER_FAIL$ Уже выбран путь вознесения: «Лазурный мираж»"
 wsg.2100.name:0 "Project-S"
 wsg.2100.desc:0 "Все приготовления завершены. По вашему слову все корабельные девы в этот исторический миг завершат метаморфозу и обнимут новую эпоху, открытую энергией Глубинных."
 SPECIAL_PROJECT_WSG_PROJECT_S:0 "Project-S"
 SPECIAL_PROJECT_WSG_PROJECT_S_DESC:0 "Мы начнём имплантацию энергетического ядра Глубинных каждой корабельной деве. План, несомненно, съест массу ядер и займёт очень долгое время — но мы верим: будущее столь многообещающе, что сегодняшние затраты того стоят.\n\n$wsg_project_s_desc$"
 wsg_project_s_title:0 "Project-S"
 wsg_project_s_desc:0 "§RВнимательно прочтите: §!\n§H1. После запуска особого проекта Project-S ежемесячно будет списываться§!§R (£pops£ население империи ÷ 25000)§! £sr_se£ §Y$sr_se$§!§H (минимум 6 в месяц) до конца проекта.\n2. Этот расход £sr_se£ §!§Y$sr_se$§!§H не отображается в месячной сводке ресурсов!\n3. Если в ходе проекта £sr_se£§!§Y$sr_se$§H закончится (системе не хватит ресурсов для списания), —§!§R проект будет безусловно сброшен! §!"
 sr_se_cost_counter:0 "Текущий расход в месяц: §H £sr_se£ §Y$sr_se$§H§!"
 wsg.2100.a:0 "Поехали"
 wsg.2101.name:0 "Project-S завершён"
 wsg.2101.desc:0 "Через все лишения мы наконец дошли до этого дня — без сомнений, это наша собственная эволюция. Все корабельные девы после имплантации докладывают о качественном скачке способностей; сообщений о побочных эффектах или последствиях нет.\nНаша новая эпоха начинается сегодня!"
 wsg.2101.a:0 "Сегодня история перевернёт страницу"
 wsg.2105.name:0 "Не хватает энергетических ядер"
 wsg.2105.desc:0 "Наши запасы энергетических ядер Глубинных на дне — продолжать план невозможно! Проект принудительно остановлен!"
 wsg.2000.name:0 "Лазурный мираж"
 wsg.2000.desc:0 "Адмирал, коридор стабилизирован, передовая группа прошла на ту сторону и вышла на связь. Входящий запрос на подключение."
 wsg.2000.a:0 "Подключить"
 wsg.2001.name:0 "Лазурный мираж"
 wsg.2001.desc:0 "Приветствуем вас, наши «мы» из другого мира. Я Ибуки, глава службы безопасности корпорации NeoForce; отвечаю за её безопасность и внешние сношения. Благодаря технологиям, полученным от вас при коротком контакте, мы одержали большую победу над Глубинными. В благодарность наш научный отдел открывает вам базу данных для обмена результатами. Надеемся на углубление сотрудничества."
 wsg.2001.a:0 "Будем рады дальнейшему сотрудничеству."
 wsg.2002.name:0 "Лазурный мираж"
 wsg.2002.desc:0 "Анализ Юбари научных данных Лазурного мира показал: NEO-вещество, внедрённое в ригинг и тело корабельной девы, резко поднимает способности. А добавка кристаллов Альфа в производство оружия заметно улучшает его характеристики."
 wsg.2002.a:0 "Отличная работа!"
 requires_technology_tech_wsg_pantsu:0 "$TRIGGER_FAIL$ Нужна технология £society£§Y$tech_wsg_pantsu$§!"
 requires_tech_building_wsg_neo:0 "$TRIGGER_FAIL$ Нужна технология £engineering£§Y$tech_wsg_senergy_implantation$§!"
