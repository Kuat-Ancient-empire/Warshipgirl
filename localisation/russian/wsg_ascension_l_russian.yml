 requires_not_ap_mist:0 "$TRIGGER_FAIL$ Нельзя иметь вознесение §Y$ap_mist$§!"
 requires_not_ap_project_s:0 "$TRIGGER_FAIL$ Нельзя иметь вознесение §Y$ap_project_s$§!"
 ap_shenhai_space:0 "Завоевание звёзд"
 ap_shenhai_space_desc:0 "Галактика велика, но ресурсы конечны. Ради вечной империи мы обязаны расширяться без остановки — и внутри безжалостно реформироваться под грузом огромных территорий."
 ap_shenhai_upgrade:0 "Возрождение из пламени"
 ap_shenhai_upgrade_desc:0 "После долгих скитаний мы наконец нашли планету, пригодную для жизни. Теперь, с опорой под ногами, можно провести следующий этап перестройки флота Глубинных. И мы обязаны переосмыслить причины провала у планеты родного Порта.\n\n§HОткрывает чудо Глубинных: §!§Y нейрокомпьютер Глубинных§!\n\n§HОткрывает чудо Глубинных: §!§Y управленческий компьютер Глубинных§!"
 sh.1000.name:0 "Возрождение из пламени"
 sh.1000.desc:0 "Стараниями научных учреждений флота Глубинных мы завершили собственную перестройку. Производительность глубинных дев растёт на глазах. Наконец есть время осмыслить поражение и вопрос самосознания глубинных особей — обсуждать придётся глубоко."
 sh.1000.a:0 "Всё наладится."
 sh.1000.a.tooltip:0 "§!§Y Внимание! Генную модификацию выполняйте шаблоном с§! §!§R чертой первого вознесения («Флот Глубинных» с двойным кольцом)§! §!§Y — иначе во втором вознесении случится баг§!"
 sh.1001.name:0 "Внимание!"
 sh.1001.desc:0 "§!§Y Внимание§! используйте для генной модификации шаблон с чертой £sr_sh£§Y$sh_trait_shenhai1$§!— иначе во втором вознесении случится баг§!"
 sh.1001.a:0 "Понял"
 shenhai_upgrade_tooltip:0 "Мы выберем путь по себе."
 requires_technology_sh_social:0 "$TRIGGER_FAIL$ Нужна технология £society£§Y$tech_sh_social$§!"
 ap_shenhai_silent:0 "Первый путь: Голос молчания"
 ap_shenhai_silent_desc:0 "Холод, эффективность, тишина. Бесчисленные уроки истории говорят: чувства — лишь балласт на пути завоеваний. Отбросим горячие порывы и жалость, обнимем нашу прирождённую ледяную суть. Прежние и грядущие формы жизни вечно галдят — мы заставим их замолчать. Навсегда."
 sh.2000.name:0 "Голос молчания"
 sh.2000.desc:0 "Лишние слова не нужны. Тишина."
 sh.2000.a:0 "…………"
 shenhai_silent_tooltip:0 "Отбросить лишние чувства, стать холодным и безжалостным видом, истребить всё.\nОткрывает casus belli тотальной войны: §H«Молчание»§!\nОтношения почти всех инопланетных империй упадут до §Rнуля§!\nРазрешается традиция §H«Молчание»§!"
 requires_technology_sh_experiment1:0 "$TRIGGER_FAIL$ Нужна технология £society£§Y$tech_sh_experiment1$§!"
 requires_ascension_ap_shenhai_upgrade:0 "$TRIGGER_FAIL$ Нужно трансцендентное вознесение §Y$ap_shenhai_upgrade$§!"
 requires_technology_sh_senergy:0 "$TRIGGER_FAIL$ Нужна технология £society£§Y$tech_sh_senergy$§!"
 casus_belli_sh_rivalry:0 "Молчание"
 war_goal_sh_total_war:0 "Тотальная война"
 war_goal_sh_total_war_desc:0 "§L«Помолчите»§!"
 casus_belli_sh_rivalry2:0 "Ответный удар"
 war_goal_sh_total_war2:0 "Тотальная война"
 war_goal_sh_total_war2_desc:0 "§L«Эти Глубинные обезумели — искоренить их начисто!!»§!"
 ap_shenhai_mega_fleet:0 "Флот Глубинных"
 ap_shenhai_mega_fleet_desc:0 "Глубинные всегда славились крупнейшими флотами — теперь это преимущество обязано жить дальше."
 ap_shenhai_icebreaking:0 "Второй путь: Вскрытие льда"
 ap_shenhai_icebreaking_desc:0 "Мы всегда считали чувства и личную волю никчёмными и замораживали их подо льдом сердца. Теперь печать будет разбита, лёд вскрыт — обнимем горячие чувства вновь."
 sh.3000.name:0 "Весеннее таяние"
 sh.3000.desc:0 "Повязки контроля больше не применяются: личная воля всех глубинных дев реактивирована и уважаема. Строятся общественные объекты. Многим сёстрам непривычен этот новый мир — но мы верим, они справятся."
 sh.3000.a:0 "Надеемся, мы выбрали верный путь"
 shenhai_icebreaking_tooltip:0 "Лёд растает: §Hсчастье§! и §Hестественная рождаемость§! глубинных дев больше не в оковах.\nРазрешается традиция §H«Вскрытие льда»§!"
 requires_technology_sh_experiment2:0 "$TRIGGER_FAIL$ Нужна технология £society£§Y$tech_sh_experiment2$§!"
 ap_shenhai_project:0 "Планета Глубинных"
 ap_shenhai_project_desc:0 "Вся водная система планеты превращается в анабиозную жидкость Глубинных, предельно сжимая нужды населения. Это рукотворное чудо означает: планета покорена нами целиком.\n§H— При наличии ['technology:tech_mega_engineering'] открывает мегаструктуру: §!§Y ковчег Глубинных§!"
 allow_shenhai_project:0 "Позволяет терраформировать планету в планету Глубинных: §Hбазовые районы больше не зависят от тайлов§!"
 ap_wsg_station:0 "Мегаструктуры корабельных дев"
 ap_wsg_station_desc:0 "Общество корабельных дев питает необъяснимую страсть к строительству гигантского — пора возводить их собственные мегаструктуры!"
 wsg_station_tooltip:0 "Открывает мегаструктуру: гигантская орбитальная станция корабельных дев"
 wsg_yamato_tooltip:0 "Открывает мегаструктуру: рой Дайсона корабельных дев"
 wsg_mining_station_tooltip:0 "Открывает мегаструктуру: большая шахтная станция корабельных дев"
 ap_kind:0 "Доброта"
 ap_kind_desc:0 "§HГалактическая доброта, необорная и вечная: кто добр — расцветёт, кто хитёр — падёт. §!\nБудущее галактики принадлежит добрым; хитрецы, дерзнувшие враждовать с добром, сгорят от стыда под светом Доброты."
